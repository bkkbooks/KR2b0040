body:
  text: 資治通鑑後編卷二十一刑部尚書徐乾學撰宋紀二十一起上章困敦四月盡重光赤奮若十二月凡一年有竒真宗膺符稽古神功讓德文眀武定章聖元孝皇帝咸平三年夏四月以梁鼎制陜西青白鹽事初解州池鹽通商販易鼎請官自鬻朝廷是其議故用之鼎至解池禁止商販官運赴鄜延環慶等州公私大擾知雄州何承矩上言曰臣聞兵家有三陳日月風雲天陳也山陵水泉地陳也兵車士卒人陳也今用地陳而設險以水泉而作固建設陂塘亘連滄海縱有胡騎何懼奔衝昨者戎虜犯邊髙陽一路東負海西抵順安士庶安居即屯田之利也今順安西山地雖數軍路才百里縱有邱陵岡阜亦多川瀆泉源儻因而廣之制為塘埭則可戢胡騎息邊患矣今緣邊守將多非其才心不知書耳不聞善不守疆界動誤國家伏望遴擇疆吏出牧邊民厚之以俸祿使恱其心借之以威權使嚴其令然後深溝髙壘秣馬厲兵為戰守之偹修仁立德布政行惠廣安輯之道訓士卒開田疇勸農桑畜芻粟以偹凶年完長㦸修徑弩謹烽燧繕堡戍以防外患來則禦之去則偹之如此則邊城安堵矣且邊鄙之人多負壯勇識羌虜之情僞知山川之形勢望於邊郡置營召募不須等其人才止求少壯武力令及萬人俟契丹有警任智勇將統而用之乃中國之長䇿也庚戍太子太保吕端卒贈司空諡正惠端美姿儀有器量寬厚多恕雖屢經擯退未嘗以得喪介懷平居不蓄資産及為相持重識大體以清净簡易為務太宗時欲相端左右或曰端為人糊塗太宗曰端小事糊塗大事不糊塗遂决意相之趙普在中書端為參政普嘗謂人曰吾觀吕公奏事得嘉賞未嘗喜遇抑挫未嘗懼真台輔之器也端兩使絶域其國歎重之後有使往者每問端為宰相否其名顯如此乙卯葬元德皇太后丙辰王均自升仙橋分路來襲官軍雷有終率軍逆擊大敗之殺千餘人均單騎還城初供備庫副使李允則知潭州將行帝召謂曰朕在南衙畢士安道卿家世今以湖南屬卿允則始至州大火民無居舍多凍死允則亟取官竹假民為屋及春而償民無流徙官用亦不乏馬氏暴斂州人嵗出絹謂之地稅及潘美定湖南計屋每間輸絹十三尺謂之屋稅營田户給牛嵗輸米四斛牛死猶輸謂之枯骨稅民輸茶初以九斤為一大斤後益至三十五斤允則請除之稅茶則以十三斤半為定制又山田可以蒔禾而民惰不耕乃下令月給馬芻皆輸本色由是山田悉墾㑹嵗饑欲發官廪先賑而後奏轉運使以為不可允則曰須報必踰月則饑者無及矣不聽明年又饑復欲先賑轉運使固執不可允則請以家資為質乃得發廪賤糶因募饑民堪征役者𨽻軍籍得萬人轉運使請發所募兵禦邵州蠻允則曰今蠻不擾無名益戍是長邊患也且兵皆新募饑瘠未任出戍遂奏罷之至是民列允則治狀詣安撫使者請留使者以聞詔書嘉奬及召還連對三日帝曰畢士安不謬知人矣壬戍賜應制舉人林陶同進士出身陶就試學士院不及格帝方欲來俊茂故特奬之壬申知益州牛冕削籍流儋州西川轉運使張適削籍授連州參軍初張詠自蜀還聞冕代已詠曰冕非撫衆才其能綏輯乎既而果然五月丁丑朔詔天下死罪減一等流以下釋之益州軍民為王均脅從者如能歸順並釋之先是宰相張齊賢上言今之所患錢貨未充望多擇使臣往逐處相度添價及招誘人戶淘採鉛錫仍按行銅山易得薪炭處置監鑄錢如此二年間可得百五十萬貫即遣虞部員外郎馮亮內供奉官白承睿往幹其事庚申亮等言饒池江建州嵗鑄錢百三十五萬貫銅鉛皆有餘羡乃以亮為江南轉運副使兼提㸃江南福建路鑄錢事承睿同提㸃焉六月户部判官右司諌孫何出為京東轉運副使何上疏曰國家共治之任牧守為本親民之官令長為急前代刺史入為三公郎官出宰百里其遴選可知也今則兼隋唐取士之法參周漢考績之制然而資䕃登朝居千騎之長胥徒祗役分百里之封目不知書心惟黷貨望令審官院吏部銓凡京朝官藉䕃入仕者非灼然績狀勿與知州州縣官流外出身者非有履行殊常不擬縣令庶分流品用勸士民又三司掌錢刀籠天下貨財古之李悝耿夀昌劉晏第五琦之流雖名聚斂之臣頗負經通之略皆民不加賦兵有羡糧厥後三建使額分其利權胥史千餘官僚兼倍各為刑獄迭下符移行之於外滋章頗甚臣權涖計局嘗與丁謂朱台符共酌三部文移之類可以減半望擇近臣識治體幹敏者與三部衆官減省又法官之任人命所懸今吏部擬受之際但問資歷相當精律令者或令捕盜懵章程者或使詳刑動致紛拿即議停替小則民黎負屈大則旱暵延灾欲望自今司理司法並擇明法出身者授之不足即於見任司户簿尉內選充又不足則選嫻書判練格法者考滿無私過越資擬授庶臻治古之化用開太平之基未幾徙兩浙轉運使何樂名教勤接士類然性卞急不容物為使者専任峻刻所至州郡刺察苛細胥史日有捶楚官屬多罹譴罰人不稱賢秋七月丙申江南轉運使任中正言准召以饒州置場買納浮梁婺源祁門縣茶不便於民令臣與三班借職胡澄審行計度今臣等親到饒歙二州茶倉詢問逐處民俗皆言溪灘險惡轉輸艱阻願各復往日倉厫就便輸納及浮梁縣民李思堯等各願自偹材木起創倉厫從之仍降詔曰山澤之征所宜公共茍便於民豈圖羡贏而言事之臣不明大體務為改革罔恤蒸黔特命使車往詢疾苦用循舊制式遂輿情已令制置茶鹽江南轉運使並依任中正所奏八月乙卯以濟州賊魏捷補龍猛軍隊長捷趫勇過人衆目為撼動山至是詣登聞院自陳為惡黨所脅制願首罪效力帝召見賜錦袍銀帶而録之王均自升仙之敗撤橋塞門雷有終等率官軍直抵城下造梯衝洞車攻具遣諸將分路攻城賊盡驅凶黨以拒官軍趙延順中流矢死然每攻城則雨甚城滑不能上官軍為洞屋以攻城賊鑿地道出掩之多溺壕中死軍勢小衄賊大宴其黨歌吹之聲達于城外時方暑濕攻城者多被疾有終市藥他州自合以療之詔復遣入內副都知秦翰為兩路捉賊招安使翰既至與有終叶議於城北魚橋别築土山是月克城北羊馬城遂設鴈翅勢敵棚覆洞車以進逼其城賊亦對設敵棚號喜相逢樓戊寅官軍焚其敵樓賊氣始奪乃築月城自固九月庚寅始置羣牧司命樞密直學士陳堯叟為制置使馬政舊皆騏驥兩院監官專之至是內外廏牧之事自騏驥院而下悉聽命於羣牧司王均多為藥矢射官軍中者立死雷有終募敢死士穴城間道蒙璮秉燧而入悉焚其守具甲午令東西南寨鼓譟攻城有終與石普分主二洞屋以進普乃穴城為暗門門成賊攢㦸擁路衆未敢進有二卒出請行許以厚賞乃麾戈直衝之賊鋒稍却遂克其城有終登城樓下瞰賊猶以餘衆寨於天長觀前密設炮架於文翁坊髙繼勳白轉運使馬亮願得秸秆油籸合衆執長㦸巨斧秉炬以進悉焚之楊懷忠又焚其天長觀前寨追至大安門復敗焉前後殺賊三千餘人是夕均突圍而遁有終疑有伏遣人於街郭縱火詰朝與秦翰登門樓牙吏有受賊署官職者捕得立樓下乃積薪于旁厝火其上盡索受僞署者命左右捽投火中自辰至晡焚數百人頗為寃酷李繼昌嚴戒部下無擾民者獲婦女童幼置空寺中分兵守衛事平遣還其家冬十月王均自成都趨富順監所過脅軍民斷橋塞路焚倉庫而去雷有終先命楊懷忠領虎翼軍追之後二日石普繼往以全軍為後援均黨至富順將結筏渡江趨戎瀘蠻境懷忠距富順六十里於楊家市少憩賊衆在後者邀戰懷忠遣親信五騎登髙原覘賊語左右曰縱賊渡江後悔無及石侯將至當以竒兵取之乃臨江列陳擊賊衆散走有拿舟將渡江而遁者懷忠合强弩射之溺者數艘懷忠張旗鳴鼓入城均方在監署其黨多醉均窮蹙縊死虎翼軍校魯斌斬其首以詣懷忠又獲僣僞法物旌旗甲馬甚衆禽其黨六十餘人逆徒殱焉懷忠旋軍出北門石普始至奪均首馳歸成都梟于北市辛亥有終遣官馳奏益州平賜錦𫀆銀帶器帛命翰林學士承㫖宋白等修續通典乙丑詔赦川峽路死罪以雷有終為保信留後秦翰等九人並遷秩是役也楊懷忠之功居最為石普所掩帝亷得其狀擢懷忠崇儀使領恩州刺史他日帝謂宰相曰人有言清而行濁者實為難知如雷有終頃居三司自謂公幹亷潔昨兩川盜起因命翦除頗聞有終乘其擾攘貪黷財貨如是則王澤安得下流逺俗何由丕變言行相類乃如是耶丙寅以翰林學士王欽若知制誥梁皓分為川峽安撫使延州言破大盧小盧等十族獲人畜二十萬十一月壬午令常參官轉對如故事門下侍郎兼兵部尚書平章事張齊賢與李沆並相情好不叶辛卯日南至羣臣朝㑹齊賢被酒冠辨欹側幾顛仆殿上御史中丞劾齊賢失儀齊賢自陳因感寒飲酒禦之遂至醉頓首謝罪帝曰卿為大臣何以率下朝廷自有憲典朕不敢私甲午齊賢罷守本官吕中曰一相獨任則有専權之私二相並命則有立黨之患然以趙中令權専任重而能與新進之吕䝉正共事以畢士安德尊望隆而能與使氣之冦凖共政不惟無分朋植黨之風抑且近同寅和衷之義而齊賢反與李沆不叶與冦凖相傾何耶君子可以知相業之優劣矣二月壬子詔有司别録轉對章疏一本留中庚申罷京畿均田稅甲子契丹稅木監使黃顒等率屬內附賜冠帶丙寅開封府奏獄空詔嘉之兵部郎中知兖州韓援上言邇者微有亢旱頗傷稼政天其或者得無以太祖太宗二聖在天陛下春秋鼎盛兆民樂業萬國來王萬一聖心忽生驕佚故暫加灾眚用警睿聰昔魏鄭公對唐太宗曰貞觀之初聞善若驚五六年間猶恱以從諌自兹厥後漸惡直言此譏其漸怠於政也臣伏覩先帝享國長久孜孜勤儉未嘗一日曠於萬幾自端拱以來益厲精為理臣願陛下守太祖之丕圖遵太宗之遺訓兢兢業業無怠無荒臣又聞治國者在乎逺佞人杜讒言今之朝廷自公相已下皆悉方正無邪佞之徒然事生隱微冝防未兆願罔倦燭幽勿使小人乘間而進居安念危在治防亂則天下幸甚疏奏召援歸闕授史館修撰初濮州有盜夜入城掠知州王守信監軍王昭度知黃州王禹稱聞之以為國家武備不修故盜賊竊發近輔因奏疏曰易曰王公設險以守其國又曰重門擊柝以待暴客傳曰豫備不虞古之善教也自五季亂離各據城壘繕治兵甲豆分瓜剖七十餘年太祖太宗削平僭僞當時議者乃令江淮諸郡毁城隍收兵甲撤武備者三十餘年書生領州大郡給二十人小郡減五人以充常從號曰長吏實同旅人名為郡城蕩若平地雖則遵京師而抑郡縣為强幹弱枝之術亦匪得其中道也陛下纘二聖恢隆長世必有非常之制改轍更張因時立法固無所執蓋太祖削諸侯跋扈之權太宗杜僭僞覬覦之心不得不爾其如設法數世久則弊生救弊之道在乎從宜漢髙懲暴秦郡縣之失封建其子弟及七國勢强文景乃行削奪唐德宗乘安史厭兵遂有貞元姑息之政憲宗覩齊蔡巨猾遂有元和討賊之議蓋見幾而作為社稷逺圖疾若轉規不可膠柱今江淮諸郡大患有三城池隳圯一也甲仗不完二也兵不服習三也濮賊之興慢防可見望陛下特行神斷參之廟算如且因而修治不若張皇凡江浙荆湖淮南福建等郡約民户衆寡城池大小並許置本城守捉軍士三五百人勿令差出止於城中閲習弓劍然後漸葺城壘繕完甲胄郡國張禦侮之備長吏免剽掠之虞疏奏帝嘉納之河北河東强壯自五代時瀛霸諸州已有之是嵗始詔河北民家二丁三丁籍一四丁五丁籍二六丁七丁籍三八丁以上籍四為强壯五百人為指揮置指揮使百人為都置正副都頭二人節級四人所在置籍擇善射者第補校長聽自置馬勝甲者蠲其户役尋募其勇敢團結附大軍為栅官給鎧甲四年正月中外官上封事者甚衆詔樞密直學士馮拯陳堯叟詳定利害以聞庚寅知河南府武勝節度使李至卒贈侍中至好賢樂善為學精力然剛嚴簡貴人士罕登其門召西川轉運使兵部員外郎馬亮入朝問以蜀事初雷有終既平賊誅殺不已亮多所全活城中米斗千錢亮出廪米裁其價人賴以濟及至京師㑹械送為賊所詿誤者八十九人知樞密院事周營欲盡誅之亮言愚民脅從者衆此特百之一二餘皆竄伏山林若不貸此則反側之人聞風疑懼一唱再起是滅一均生一均也帝悟悉宥之二月加直史館復遣還部時諸州鹽井嵗久泉涸而官督所負課繫捕者州數百人亮盡釋之而廢其井又除屬郡舊逋官物二百餘萬宰相李沆等以旱表求罷不許戊午雨自去冬旱帝每御蔬食憂閔切至是日方臨軒决事雨沾衣左右進蓋却而不御壬戍樞密直學士馮拯陳堯叟上言請令羣臣子弟奏補京官或出身者並試讀一經寫家狀以精熟為合格從之祕書丞知全州陳彭年上疏言五事一曰置諌官二曰擇法吏三曰簡格令四曰省官員五曰行公舉此五者實經世之要道致治之坦塗也疏奏並從之帝因謂輔臣曰自今諌官冝精擇其人甲子三司都催缺司引對逋負官物人上親辨問凡七日釋二千六百餘人蠲所逋物二百六十餘萬已經督納而非理者以內庫錢還之身沒者給其家丙寅詔學士兩省御史臺五品尚書省諸司四品以上于內外京朝幕職州縣官及草中舉賢良方正能直言極諌各一人不得以見任轉運使及館閣職事人應詔三月辛巳分川峽為益利梓䕫州四路兵部尚書張齊賢上言終南山處士种放守道遺榮孝行純至棲遲衡泌僅二十年願以備賢良方正之舉乃賜放詔及裝錢五萬令京兆府遣官詣山備禮發遣放辭不至先是三院御史多出外任風憲之職用他官兼領乃詔本司長吏自薦其屬俾正名而舉職壬午以太常博士張巽為監察御史從新制也吕中曰御史紀綱正自此始蓋監司為外臺御史為內臺外臺之風采振而州縣肅內臺之風采振而朝廷肅以內臺而出外則不惟侵外臺之權亦無以振內臺之綱也故自太宗令轉運兼按察而後外臺正自真宗令御史正名舉職而後內臺正帝言及大射投壺鄉飲酒之禮因命直館各賦射宫詩凡節序賜宴則宗室禁軍大校牧伯諸司使皆令習射庚寅以左僕射吕䝉正兵部侍郎參知政事向敏中並守本官同平章事國初至是三入相者惟趙普及蒙正焉初乾元厯氣朔漸差詔判司天監史序等編新厯於是厯成來上賜名儀天頒行之辛卯參知政事王化基罷為兵部尚書化基任中書不以䕃補諸子官然能訓導皆有所立以同知樞密院事王旦為工部侍郎參知政事樞密直學士馮拯陳堯叟並為給事中同知樞密院事禮部郎中薛映兵部員外郎梁鼎左司諌楊億並知制誥帝初欲用著作佐郎直集賢院梅詢命中書召試映鼎及詢等宰相李沆素不喜詢言於帝曰梅詢險薄不可用楊億有盛名帝驚喜曰幾忘此人又以億望實素著但召映鼎就試翌日與億並命考異李燾曰㑹要云至道三年四月梁周翰不召試而授知制誥其後薛映梁鼎楊億陳堯叟歐陽修亦如此例據映鼎皆召試㑹要誤也以國子監經籍賜潭州嶽麓山書院從知州李允則請也夏四月丁未以吏部員外郎陳省華為鴻臚少卿時省華子堯叟擢任樞密故特優寵之壬子詔親老無兼侍者特與近任回鶻來貢請助討李繼遷審官院初引對京官于崇政殿遷秩有差京朝官磨勘引對自此始己未翰林學士王欽若使西川還對于崇政殿即日以欽若為左諌議大夫參知政事辛未帝御崇政殿試制舉人得祕書丞查道進士陳越入第四等定國軍節度推官王曙入次等以道為左正言直史館越將作監丞曙著作佐郎五月庚辰翰林學士吏部郎中知制誥江陵朱昂罷為工部侍郎致仕昻有清節淡于榮利初為洗馬十五年不遷不以屑意及在內署非公事不至兩府帝知其素守故每加褒進昻纍章告老帝不得已從之遣使就第賜器幣謂輔臣曰昻侍朕左右未嘗以私事干朕今其歸老可給全俸詔本府歲時省問如有章奏許附驛以聞又命其子正辭知公安縣使得就養舊制致仕官止謝殿門下于是帝特延見命坐勞問久之令候秋凉上道復遣中使錫宴於玉津園兩制三館儒臣皆豫仍詔賦詩餞行恩渥之盛近代無比六月汰冗吏諸路計省十九萬五千八百二人吕中曰去國初未逺而吏之冗至于十九萬五千餘人何其多耶蓋太祖去在京之吏真宗去諸路之吏然自是而後吏愈冗而愈不可去矣此識者有官無封建而吏有封建之說也丁巳詔東川民田先為江水所害者除其租初黃州境二虎鬭其一死食之殆半羣雞夜鳴經月不止仲冬雷震暴作知州王禹稱手疏言之引洪範陳戒且自劾帝亟命中使乘驛勞問醮禳之又詢於日官言守土者當其咎帝惜禹稱才名即命徙知蘄州至未逾月卒戊午聞訃帝甚嗟悼之厚賻其家賜一子出身禹稱詞學敏瞻為後進宗師直躬行道遇事敢言雖履危困封奏無輟嘗云吾若生元和時從事於李綘崔羣間斯無愧矣然性剛直不能容物太宗嘗命宰相切戒之其為文亦多涉規諷以是不容於時初田錫知泰州幾三年不得代錫乃上章自陳即詔歸闕屢召對言事嘗奏言舊有御覽但記分門事類臣願鈔略四部别為御覽三百六十卷萬幾之暇日覽一卷又采經史要切之言為御屏風十卷置扆座之側則治亂興亡之事常在目矣帝善其言詔史館以羣書借之仍免其集賢校讎之職至是先上御覽三十卷御屏風五卷手詔褒答之契丹主冊其后蕭氏為齊天皇后丁卯詔州縣學校及聚徒講誦之所並賜九經戊申出陳圖示宰相命督將練士以備北邊秋七月庚午以河朔餽運勞民詔轉運使減徭役存恤己卯邊臣言契丹謀入寇以山南東道節度使王顯為鎮定髙陽關三路都部署太平節度使王超為副都部署八月帝以邊臣玩寇朔方餉道愈難辛丑命兵部尚書張齊賢為涇原等州保安等軍安撫經略使知制誥梁皓副之即日馳騎而往己酉復親試制舉人得成安縣主簿丁遜舒州團練推官孫僅入第四等並為光祿寺丞直集賢院祕書丞何亮懷州防禦推官孫暨入第四等以亮為太常寺博士暨為光祿寺丞壬子帝觀稼北郊宴射於含芳園都人望見乘輿抃躍稱萬嵗咸平初太常寺丞陳堯佐為開封府推官坐言事切直貶潮州通判潮去京七千里民俗鄙陋堯佐至州修孔子廟作韓愈祠堂率其民之秀者使就學鰐魚復出害人堯佐捕得更為文鳴鼓於市而戮之潮人以比韓愈三嵗召還命直史館甲子職方員外郎吳淑上言諸路所納閠年圖當在職方收掌近者並納儀鸞司伏以天下山川險要皆王室之祕奧國家之急務故周禮職方氏掌天下圖籍又詔土訓以夾王車漢祖入關中蕭何獨取秦圖籍由是周知險要豈可忽而不顧哉請令以今閏所納圖並上職方又州郡地里犬牙相入向者獨畫一州地形則不可以傅合他郡望令諸路轉運使每十年各畫本路圖上職方使知天下山川險要從之帝以巴蜀遐逺時有寇盜丁卯命戶部員外郎曽致堯等分往川峽諸州提視軍器察官吏能否戊辰社宴宰相於中書九月知封駁司陳恕請鑄本司印詔如有封駁事取門下省印用之因遂改知封駁司為兼門下封駁事丙戌翰林學士承㫖宋白等上新修續通典二百卷詔付祕閣先是詔國子監祭酒邢昺等校定周禮儀禮公羊穀梁𫝊正義丁亥昺等上其書凡一百六十五卷命摸印頒行賜宴國子監並加階勳于是九經疏義悉具矣庚寅詔陕西民家出一丁號保毅軍凡得六萬八千七百九十五人其緣邊軍士先選中者並升為禁軍號保捷李繼遷陷清逺軍考異通鑑續編曰趙保吉復擾邊麟府副部署曹璨邀其輜重于桞撥川殺獲甚衆九月保吉復攻破定州懷逺縣及保靜永州清逺軍保吉勢益張大今從宋史真宗本紀冬十月帝語近臣曰近者慶州地再震昨司天奏熒惑犯輿鬼秦分野當有灾冝戒邊將以靜且上天垂象示戒可不恐懼修省知樞密院王繼英曰妖不勝德帝曰朕何德可恃同知樞密院陳堯叟曰陛下克己愛民河防十餘溢而不决嵗復大稔此聖德格天所致也帝曰天不欲困生靈耳豈朕德能感之自此益須防戒己酉張齊賢上言請募江淮荆湖丁壯八萬以益戍兵廣邊備帝曰此不唯動搖人心抑又使南方之人逺戍西鄙亦非便也遂寢其奏富弼曰戍守之兵自古以客軍為非便蓋不諳邊事之艱苦不識山川之險易守則不固戰則多敗其數雖多未若土兵少而精也真宗不從齊賢之請得守邊之䇿也庚戍帝以陕西二十二州圖示輔臣歷指山川險易蕃部居處又指秦州曰此州在隴山之外號為冨庶且與羌戎接畛昨已命張雍出守冀其綏撫有方也次復指殿北壁靈州圖曰此馮業所畫頗為周悉山川形勢如此安得知勇之士為朕守之乎又指南壁甘伊凉等州圖及東壁幽州已北契丹圖曰契丹所據地南北千五百里東西九百里封域非廣也而燕薊淪陷深可惜耳甲寅北面前陳鈐轄張斌與契丹遇于長城口擊敗之殺獲甚衆考異宋史作己未日張斌破契丹于長城口又通鑑續編云十月甲寅契丹主至遂城王顯與戰大敗之今從長編漸近界首伏騎大起三路統帥未及進前陳兵少退保威虜軍詔髙陽關三路兵增騎二萬為前鋒又命將五人各領騎三千陳于先鋒之前别命莫州都部署桑贊領萬人居莫州順安軍為竒兵以備邀擊北平寨部署荆嗣領萬人以斷西山之路詔天下購館閣逸書每卷給千錢及三百卷者當量材録用十一月丙子王顯奏前軍與契丹戰大破之戮二萬餘人獲其統軍特烈等十五人首級并甲馬甚衆職方員外郎吳淑上疏請復古車戰之法纍數千言帝稱其博贍甚嘉納之癸未京城民獲金牌有趙為君萬年字丁亥御崇和殿閲張去華所著元元論及國田圖謂近臣曰經國之道必以養民務穡為先朕常冀邊鄙稍寧兵革粗足則可以力行其事使吾民富庶也先是邊臣議城綏州大屯兵積榖以遏黨項朝臣互執利害久而未决十二月中書樞密㑹議向敏中周瑩王繼英馮拯陳堯叟皆曰修之便帝以境土遐邈不可遙度乃命比部員外郎洪湛閣門祗候程順竒同往按視焉時靈州孤危丁卯詔羣議棄守之宜知制誥楊億即日奏疏請廢棄靈州退保環慶帝訪於左右咸以為靈武乃必爭之地茍失之則緣邊諸州亦不可保帝頗然之宰相李沆奏曰若遷賊不死靈州必非朝廷所有莫若發單車之使召州將部分戍卒居民委其空壘而歸如此則關右之民息肩矣吕中曰靈州之宜當以輔臣之言為是而李沆楊億之言為非綏州之議當以孫全照之言為是而以洪湛之言為非蓋綏州不可城靈州不可棄也故何亮上安邊書言捨靈武有三患而請築溥樂耀德二城以通河西之糧道誠以靈武居絶塞之外不築此二城為之唇齒則與捨靈武何異後韓魏公以亮之言為然閏月洪湛等使還言城綏州其利七而害有二丙戍詔築綏州城戊寅李繼遷蕃族額裕等歸順己邜以兵部尚書張齊賢為右僕射壬午靈州言河外寨主李瓊等以城降西夏帝念其力屈就禽特釋其親屬乙酉李繼遷部族額哲等率屬來附甲午以王超為西面行營都部署環慶路部署張凝副之秦翰為鈐轄領步騎六萬援靈州是月以西凉府六谷首領潘羅智為靈州西面都巡檢使會西凉使至言六谷分左右廂左廂副使扎卜伊特隆貝實參潘羅智軍事宜授以官乃以伊特隆貝領宥州刺史資治通鑑後編卷二十一
