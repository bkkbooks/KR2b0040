body:
  text: 資治通鑑後編卷一百十四刑部尚書徐乾學撰宋紀一百十四起上章涒灘正月盡重光作噩九月凡一年有九月髙宗受命中興全功至德聖神武文昭仁憲孝皇帝紹興十年春正月丙戍以工部侍郎莫將充迎護梓宫奉迎兩宫使知閣門事韓恕副辛卯提舉洞霄宫李綱卒卒于福州諡忠定綱負天下之望以一身用舍為社稷生民安危雖身或不用用且不久而其忠誠義氣凛然動乎逺邇每使者至金金人必問李綱趙鼎安否其為逺人所畏服如此癸巳金以都元帥烏珠領行臺尚書省事甲午詔作忠烈廟于仙人關以祀吳玠癸卯帝謂大臣曰莫將奉使金國凡所議者可一一録付恐將妄有許可他日必不能守也二月辛亥以劉錡為東京副留守李顯忠為南京副留守雨雹庚申以御史中丞廖剛為工部尚書剛每因奏事論君子小人朋黨之辨反復切至又論人君之患莫大于好人從己若大臣惟一人之從羣臣惟大臣之從則天下事可憂剛本秦檜所薦至是滋不悅他日因對又請起舊相有人望者處之近藩重鎮檜聞之曰是欲置我何地耶既積忤檜遂出臺名聞天下丁卯以孟庾知開封府為東京留守仇悆知河南府為西京留守癸酉罷吏部審量宣和濫賞從御史中丞王次翁言也時知太平州秦梓知泰州王㬇皆倚秦檜以恩幸得官次翁希檜㫖為之地由是二人驟進先是詔三京路有宗室即發遣赴行在是月碭山男子劉遇僧自稱少帝第三子詣泗州守臣王伯路以聞下州司勘取得實决脊配瓊州牢城先是言者多論崇觀宣政時事之失三月己卯詔自今只陳事之當否毋以崇觀宣政為口實務盡致恭之禮甲申封閼伯為商邱宣明王川陕宣撫副使胡世將屢言金人必渝盟宜先事為之備于是川口諸厄如仙人關和尚原殺金平有稍壞之處世將令忠勇軍伐木十餘萬條并興洋一𢃄皆葺治之己丑韓世忠張俊入見辛卯吏部員外郎朱松出知饒州以右諫議何鑄奏其懷異自賢也丙申賀正旦使蘇符自東京歸初洪皓在冷山金古紳問以所議十事皓折之古紳曰汝性直吾與汝如燕遣汝歸議遂行㑹莫將繼來議不合囚之涿州事遂變符至東京金人不納乃還夏四月壬申僉書樞密院事韓肖胄罷五月金都元帥烏珠以歸地為非計而通古又言宋置戍河南請及其部署未定亟宜收復幹布然之及達蘭誅遂大閲國中兵于祁州己卯分四道入寇一寇山東貝勒聶哷將之一寇陕西右監軍薩爾罕將之一寇河南叛將李成將之而烏珠同三路都統及龍虎大王將軍韓常擁精兵渡大河金冊李仁孝為夏國主甲申名徽宗御製閣曰敷文金烏珠自將精兵十餘萬與孔彥舟酈瓊趙榮抵汴乙酉入東京留守孟庾以城降烏珠駐舊龍德宫遣使持詔遍諭諸郡知興仁府李師雄知淮寧府李正民皆束身歸命自是河南州縣望風納欵矣丙戌金人取拱州守臣王慥死之薩爾罕趣永興陕西州縣所至迎降東京副留守劉錡率所部王彥八字軍三萬七千及殿司卒三千自臨安泝江絶淮至渦口方食暴風拔坐帳錡曰此冦兆也主暴兵即下令兼程而進聞金人敗盟南下錡與將佐捨舟陸行先趣三百里丁亥至順昌府金葛王烏祿以數千騎至宋王臺南京留守路允迪朝服出城見之遂送允迪于東京烏祿一名褎太祖孫許王鄂爾多子也戊子胡世將在河池知同州張恂遣人告急權知永興軍郝逺開長安城門納金人關中震動知陕州吳琦城守以拒金人郝逺遣人持金檄書至宣撫司語不遜胡世將焚之斬其使己丑金人破西京留守李利用副總管孫暉皆棄城走鈐轄李興率兵拒戰不克庚寅知順昌府陳規聞東京已降以報劉錡錡見規問曰事急矣城中有糧則能與君共守規曰有米數萬斛錡曰可矣規亦力留錡共守錡所部選鋒游奕二軍及老幼輜重相去尚逺遣騎趨之夜四鼓才至城下旦得報敵騎入陳州距順昌三百里闔城惶惑錡斂兵入城為捍禦計人心稍定辛卯詔以鎮江府所籍酈瓊水陸田四十三頃賜李顯忠胡世將遣涇原經略使田晟以兵三千迎敵始金人之渡河也惟孫渥吳璘隨世將在河池世將倉卒召諸帥議楊政田晟先至渥進曰河池無險阻願公少退治兵仙人原清野以挫其鋒璘抗聲言曰孫渥懦語沮軍可斬也璘請以百口保破敵世將壯之指所坐帳曰世將誓死于此官屬韓詔等進曰渥實失言不宜居幕下遂先遣晟還涇原渥赴熙河是日嶽飛將李寶與金人戰于興仁府境殺數百人獲其馬甚衆劉錡所部八字軍以將駐于汴皆携孥行壬辰錡召諸將問計皆曰金兵不可敵也請以精鋭遮擊老稚順流還江南錡曰我本赴官留司今東京為金所陷幸全軍至此有城可守奈何棄之吾意已决敢言去者斬惟部將許清奮曰太尉奉命副守汴京軍士扶老擕幼而來今避走易耳然欲棄父母妻子則不忍欲與偕行則敵翼而攻何所逃之不如努力一戰于死中求生也錡大喜乃鑿舟沈之示無去意置家寺中積薪于門戒守者曰脫有不利即焚吾家母辱敵手也分命諸將守諸門明斥堠募土人為間探于是軍士皆奮男子備守戰婦人礪刀劍爭呼躍曰平日人欺我八字軍今日當為國家破敵立功時守備一無所恃錡于城上躬自督厲取劉豫時所造癡車以輪轅埋城上又撤民户扉周匝蔽之城外有民居數千家悉焚之凡六日經畫粗畢而金遊騎已涉潁河至城下癸巳知亳州王彥先叛降于金金人入永興軍趣鳯翔丙申胡世將命吳璘將二萬人自河池赴寶雞河南以捍敵遣楊政郭浩為之聲援己亥命劉光世為三京招撫處置使以援劉錡庚子以吳璘同節制陕西諸路軍馬聽胡世將便宜黜陟處置軍事辛丑提舉醴泉觀鄭億年改提舉亳州明道宫初邉報至從官㑹食都堂工部尚書廖剛謂億年曰公以百口保金人講和今已背約有何面目尚在朝廷億年氣塞秦檜以為譏己也乃曰尚書曉不當如是億年懼求去遂有是命金人攻鳯翔府之石壁寨吳璘遣統制姚仲等拒之仲奮身督戰金貝勒哲庫被傷退屯武功先是金别將圍耀州郭浩遣兵救之亦解去壬寅金人圍順昌劉錡預于城下設伏擒千户阿黑等二人詰之云韓將軍營白沙窩距城三十里錡夜遣千餘人擊之連戰殺敵數千既而金三路都統葛王烏祿以三萬人與龍虎大王合兵薄城下錡令開諸門金人疑不敢近初錡傳城築羊馬垣穴垣為門至是與許清輩蔽垣為陳金人縱矢皆自垣端軼著于城或止中垣上錡用破敵弓翼以神臂強弩自城上或垣門射敵無不中者敵稍却復以步兵邀擊溺河死者不可勝計時受圍已四日金兵益盛錡乃移寨于李村距城二十里遣驍將閻充募壯士五百夜斫其營是夕天欲雨電光四起見辮髮者輒殱之金兵退十五里錡復募百人往或請銜枚錡笑曰無以枚也命折竹為器如市井兒戲者人持一以為號直犯金營電所燭則奮擊電止則匿不動敵衆大亂百人者聞吹器聲即聚金人益不能測終夜自戰積尸盈野退軍老婆灣六月甲辰朔詔以淮東宣撫使韓世忠淮西宣撫使張俊湖北宣撫使嶽飛並兼河南北諸路招討使秦檜言德無常師主善為師臣昨見金達蘭有講和割地之議故贊陛下取河南故疆既而烏珠殘其叔達蘭藍公佐之歸和議已變故贊陛下定弔民伐罪之計臣今請先至江上諭諸路將帥同力招討如臣言不可行即乞罷免帝嘉納之秦檜以金人敗盟其言不讐甚懼謂給事中兼侍讀馮楫曰我去就未可卜前此大臣皆不足慮獨君鄉衮未測上意君其為我探之楫入見曰金人長驅犯順勢必興師如張浚者且須以戎機付之帝正色曰寧至覆國不用此人檜聞之喜楫曰適觀天意楫必被逐即引疾求去丙午命提舉亳州明道宫金烏珠在汴聞兵敗即索靴上馬趣騎急行帥十萬衆來援劉錡㑹諸將問計或言今已屢捷宜乘此勢具舟全軍而歸錡曰朝廷養兵十五年正為緩急之用况已挫敵鋒軍聲方振縱衆寡不侔當有進無退且敵營甚邇而烏珠又來吾軍一動彼躡其後前功俱廢使敵侵軼兩淮震驚江浙則平生報國之志反成誤國之罪衆皆感動思奮曰惟太尉命錡募得曹成等二人諭之曰遣汝作間事捷重賞苐如我言敵必不殺汝今置汝綽路騎中汝遇敵則佯墜馬為敵所得敵帥問我如何人則曰太平邉帥子喜聲伎朝廷以兩國講和使守東京圖逸樂耳二人果被執烏珠問之對如錡言烏珠喜曰此城易破耳即置鵝車炮具不用明日錡登城望見二人荷械逺來縋而上之于械上得文書一卷錡懼惑軍心立焚之戊申以劉錡為沿淮制置使胡世將命吳璘楊政以書遺金薩爾罕約日㑹戰己酉薩爾罕遣呼紐郎君以三千騎至都統制李師顔率繞騎擊走之呼紐入扶風縣城守薩爾罕遣軍䇿應不能勝而退師顔攻拔扶風獲三將及女真百十七人别遣禆將攻鳯翔西城外寨薩爾罕怒自戰于百通坊列陳二十餘里統制姚仲等力戰破之殺獲尤多壬子金烏珠攻順昌府先是烏珠至城下責諸將喪師衆皆曰南兵非昔比元帥臨城自見劉錡遣耿訓以書約戰烏珠怒曰劉錡何敢當我吾破汝城直用靴尖躍倒耳訓曰太尉非但請戰且謂太子必不敢濟河願獻浮橋五所濟而大戰烏珠曰諾乃下令明日府治㑹食且折箭為誓以激其衆遲明錡果為浮橋于潁河上且毒潁上流及草中戒軍士雖渴死毋飲于河飲者夷其族敵用長勝軍嚴陳以待諸帥各居一部衆請先擊韓常軍錡曰擊韓雖退烏珠精兵尚不可當法當先擊烏珠烏珠一動則餘無能為矣時天大暑敵逺來疲敝晝夜不解甲人馬飢渴食水草者輒病錡士氣閒暇軍皆畨休方晨氣清凉按兵不動逮未申時敵力疲氣索忽遣數百人出西門接戰俄遣數千人出南門戒令勿喊但以鋭斧犯之統制官趙撙韓直身中數矢戰不已士殊死鬪入其陳刀斧亂下敵大敗是夕大雨平地水深尺餘明日乙卯烏珠拔營去錡遣兵追之死者萬數方大戰時烏珠被白袍乘甲馬以牙兵三千督戰兵皆重鎧號鐵浮圗戴鐡兜牟周匝綴長簷三人為伍貫以韋索每進一步即用拒馬擁之退不可却官軍以鎗標去其兜牟大斧斷其臂碎其首敵又以鐵騎分左右翼貫以韋索三人為聨號拐子馬皆女真為之號長勝軍專以攻堅戰酣然後用之由來所向無前錡戒軍士持一小筒中實以煮豆入陳則割棄之豆皆狼籍馬聞豆香低頭欲食又多為竹筒所滚腳下不得地遂為錡軍所殺自辰至申敵敗錡以拒馬木障之少休城上鼓聲不絶乃出飯羮坐餉戰士如平時敵不敢近食已撤拒馬木深入斫敵又大破之棄尸斃馬血肉枕籍車旗器甲積如山阜烏珠所恃以為強者十損七八至陳州數諸將之罪韓常以下皆鞭之遂還汴是役也金兵數十萬錡衆不盈二萬出戰僅五千人初秦檜奏命錡擇利班師錡不奉詔戰益力錡御軍嚴整每遇出戰除守禦人外非帶號挂甲者不得登城城中居民各闔户守家金人嘗夜遣人近城竊聽城中絶無雞犬聲內外肅靜莫有犯者故能以寡勝衆先是劉錡告急帝命嶽飛馳援賜飛札曰設施之方一以委卿朕不遙度飛乃遣王貴牛臯楊再興孟邦傑李寶等分布經略西京汝鄭潁昌陳曹光蔡諸郡又命梁興渡河紏合忠義社取河東北州縣又遣兵東援劉錡西援郭浩自率大軍長驅以圗中原將發密奏言先立國本以安人心然後不常厥居以示無忘復讐之意帝得奏大褒其忠授少保河南北路招討使丙辰嶽飛將牛臯及金人戰于京西敗之己未郭浩遣統制鄭建克等攻破金人于澧州復其城壬戌僉書樞密事樓照以父憂去位秦檜力主和議甲子奏遣司農少卿李若虛詣嶽飛軍諭指班師初金薩爾罕與吳璘楊政夾渭河而陳璘駐兵大蟲嶺薩爾罕自登西平原覘之曰善戰者立于不敗之地此難與爭引去趣邠州田晟遣統制曲汲秦弼拒之于青溪嶺胡世將又遣王彥楊從儀分道而出每戰金人輒敗薩爾罕自將鋭兵攻青溪汲弼戰敗棄青溪走王彥率兵迎金人戰于盤堠兔耳敗之薩爾罕還屯鳯翔乙丑湖北提㸃刑獄向子忞罷以總領官曽慥劾其罪故也子忞好論人物無所忌諱嘗與胡安國談當世士安國頗稱秦檜靖康時事子忞曰與檜同時被執軍前鮮有生者獨檜數年之後盡室航海以歸非大姦能若是乎安國子寅初猶以為過後乃信服子忞再以毁去自是閒居凡十九年庚午以劉錡為武泰軍節度使侍衛馬軍都虞候既又遣中使撫問賜札云卿之偉績朕所不忘韓世忠遣統制王勝率背嵬將成閔北伐遇金人于淮陽軍南二十里水陸轉戰掩人于沂河死者甚衆奪其舟二百是月金人圍慶陽府權知府事宋萬年固守不能下嶽飛領兵援劉錡與金人戰于蔡州復其城福建宣撫大使張浚以淮上有警條畫海道舟航利害奏之帝嘉其忠遣中使奬諭浚時大治海舟至千艘為直指山東之計以俟朝命閏月癸酉朔張俊遣統制宋超敗金人于永城縣朱家村甲戌追孟庾路允迪官徙家屬逺郡丙子涇原經略使田晟及金人戰于涇州敗之初撤離喝既為王彥所却遂自鳯翔悉兵攻涇州晟據山為陳乘敵壁壘未定奮兵掩殺自已至申連戰皆捷甲申田晟及金人再戰于涇州敗之乃以兵攻陕西諸郡未下者胡世將亦離河池登仙人原山寨為防秋之計保險以自固張俊遣統制王德援潁昌兵還就檄德復宿州德倍道自壽春馳至蘄縣與金逰騎遇遂入城偃旗卧鼓逰騎引去丙戍德潛師至宿州夜半薄金營金人阻汴水邀戰德䇿馬先濟步騎從之遙謂金人曰吾與爾大小百戰雖名王貴酋莫不靡碎爾何為者金將髙統軍遂投兵降守將馬秦馳入城閉門固守德叱其子順先登秦遂降宿州平德乘勝趣亳州己丑永興軍鈐轄傅忠信等與金人戰于華隂縣敗之李若虛見嶽飛于德安府諭以面得上㫖兵不可輕動宜且班師飛不聽若虛曰事既爾勢不可還矯詔之罪若虛當任之飛許諾遂進兵壬辰嶽飛遣統制張憲擊金將韓常于潁昌府敗之復其城丙申又復淮寧府趙鼎初罷郡還紹興上書言時政秦檜忌其復用乃令中丞王次翁劾鼎丁酉責興化軍居住次翁言之不已遂以散官漳州安置嶽飛將郝晸張應韓清復鄭州河南兵馬鈐轄李興聚兵應嶽飛復汝州及伊陽等八縣金河南尹李成遁走詔興知河南府韓世忠遣王勝王權復海州父老裒金帛以犒軍勝不受世忠每出軍必戒以秋毫無犯軍所過耕夫皆荷鋤而觀張俊率統制宋紹等及王德㑹于城父時酈瓊與金葛王烏祿在亳聞德至瓊謂烏祿曰夜義未易當也即遁去德入亳州請于俊曰今兵威已振請乘勝進取俊不從引軍還壽春初靖康時德以十六騎徑入龍德府縛金守臣姚璠獻于朝欽宗問狀璠對曰臣就縛時止見一夜義耳由是人呼為王夜義己亥陳規改知廬州時秦檜欲班師故命規易鎮淮右金人救海州王權等逆戰敗之復懷二縣庚子趙鼎再責潮州安置以右諫議何鑄再疏論之故也制略曰朋奸罔上惡殆並于共兜專利擅權罪實侔于楊李秋七月癸卯嶽飛遣張應韓清㑹李興復永安軍丙午以御史中丞王次翁參知攻事秦檜薦次翁為中丞故凡可以為檜地者無不力為之及金人敗盟帝下詔罪狀烏珠次翁懼檜得罪因奏曰前日國是初無主議事有小變更用他相後來者未必賢而排黜異黨紛紛纍月不能定願陛下以為至戒帝深然之檜德其言遂引為同列于是檜位復安公論不能撼搖矣嶽飛留大軍於潁昌命諸將分道出戰自以輕騎駐郾城兵勢甚鋭金烏珠大懼㑹諸帥欲併力一戰飛聞之曰金人技窮矣乃日出挑戰且詈之烏珠怒合龍虎大王蓋天大王及韓常之兵逼郾城己酉飛遣子雲領騎兵直貫其陳戒之曰不勝先斬汝雲與金人戰數十合金尸布野烏珠以拐子馬萬五千來飛戒步卒以麻札刀入陳勿仰視第斫馬足拐子馬相連一馬仆二馬不能行飛軍奮擊遂大破之烏珠大慟曰自海上起兵皆以此勝今已矣因復益兵而前部將王剛以五十騎覘敵遇之奮斬其將飛時出視戰地望見黃塵蔽天自以四十騎突戰敗之庚戌永興軍統領辛鎮及金人戰于長安城下敗之癸丑以楊沂中為淮北宣撫副使劉錡為判官金烏珠既敗于郾城憤甚合師十二萬次臨潁甲寅嶽飛遣統制楊再興王蘭等以三百騎擊之于小商橋殺二千餘人及萬户薩巴千户百人再興死獲尸焚之得箭鏃二升飛痛惜之張憲繼至復戰烏珠夜遁追奔十五里中原大振飛謂子雲曰敵屢敗必還攻潁昌汝宜速援王貴既而烏珠果至乙卯貴將游奕雲將背嵬戰于城西雲以騎兵八百挺前决戰步軍張左右翼繼之殺烏珠壻夏金吾副統軍尼瑪哈索烏珠引兵還汴飛又使梁興㑹太行忠義及兩河豪傑敗金人于垣曲又敗之于沁水遂復懷衛州斷金人山東河北之道金人大恐飛進軍朱仙鎮距汴京四十五里與烏珠對壘而陳遣背嵬騎五百奮擊大破之烏珠遁還汴京飛檄陵臺令行視諸陵葺治之壬戌嶽飛奉詔班師自郾城還先是紹興五年飛遣梁興等布德意招結兩河豪傑山寨韋銓孫謀等斂兵固守以待王師至是兩河豪傑李通等帥衆歸飛金人動息山川險要一時皆得其實中原盡磁相開德澤潞晉絳汾隰之境皆約日興兵與官軍㑹其所揭旗以嶽為號父老百姓爭挽車牽牛載糗糧以饋義軍頂盆焚香迎候者充滿道路自燕以南金人號令不行烏珠欲簽軍以抗飛河北無一人應者乃歎曰自我起北方以來未有如今日之挫衄金將烏凌阿思謀素號桀黠亦不能制其下但諭之曰毋輕動待嶽家軍來即降金統制王鎮崔慶李覬崔虎華旺等皆率所部降飛其龍虎大王之將竒徹等亦密受飛旗榜自其國來降韓常亦欲以衆五萬內附飛大喜語其下曰直抵黃龍府與諸君痛飲耳方指日渡河而秦檜欲畫淮以北棄之必欲與金和諷臺臣請班師飛奏金人鋭氣沮喪盡棄輜重疾走渡河而我豪傑向風士卒用命時不再來機難輕失檜知飛志鋭不可回乃先請詔張俊楊沂中等歸而後上言飛孤軍不可久留乞令班師一日奉十二金字牌飛憤惋泣下東向再拜曰十年之力廢于一旦乃自郾城引兵還民遮馬慟哭訴曰我等頂香盆運糧草以迎官軍金人皆知之相公去我輩無噍類矣飛亦悲泣取詔示之曰吾不得擅留哭聲震野飛留五日以待民徙從而南者如市飛亟奏以漢上六郡間田處之方烏珠敗于朱仙欲棄汴而去有書生叩馬曰太子毋走嶽少保且退矣烏珠曰嶽少保以五百騎破我五十萬京城日夜望其來何謂可守書生曰自古未有權臣在內而大將能立功于外者嶽少保且不免况欲成功乎烏珠悟遂留不去及飛還烏珠遣兵追之不及而潁昌淮寧蔡鄭諸州皆復為金有飛至鄂力請解兵柄不許已而入覲帝問之飛但拜謝而已乙丑金人圍淮寧府守臣趙秉淵棄城南歸辛未金人攻盩厔王俊逆戰于東路谷却之八月壬申朔以張九成喻樗陳剛中凌景夏樊光逺毛叔度元盥七人謗訕和議貶官有差秦檜惡九成謫知邵州交游皆絶惟汪應辰通問及喪父衆猶攻訐落其職而應辰不逺千里往弔人皆危之剛中嘗以啓賀胡銓之謫為檜所深惡至是謫知安逺縣尋卒安逺屬贑州濵嶺地惡瘴深諺曰龍南安逺一去不轉言必死也乙亥韓世忠圍淮陽軍不克戊寅知陕州吳琦遣統制侯信劫金人中條山寨敗之翌日又戰于解州境殺其將毛罕庚辰金人來救淮陽軍韓世忠逆戰于泇口鎮敗之是日别將劉寶等以舟師至千秋湖遇酈瓊兵與之戰大捷獲戰船二百壬午李成以五千騎犯西京守臣李興擊却之楊沂中兵至宿州金遣間告敵騎數百屯栁子鎮丁亥沂中自將五百騎夜襲之不見敵而還金人以精兵伏歸路沂中軍潰遂自壽春走歸泗金人屠宿州甲午川陜宣撫司統領王喜等遇金人于汧陽敗之九月壬寅朔遣起居舍人李易諭韓世忠罷兵丁未楊政遣統制楊從儀夜襲金人于鳯翔府敗之戊申金人復入西京李成數為李興所敗乞師于烏珠得蕃漢軍數萬興度衆寡不敵棄城去寓治于永寧之白馬山庚戌合祀天地于明堂戊午宰執奏事帝謂秦檜曰士大夫多樂在朝廷不樂在州縣蓋朝廷遷進多州縣遷進少卿等可擇州縣之有治狀者當如漢增秩賜金使內外之勢均也辛酉臨安府火延燒省部倉庫金左丞相兼侍中古新始與鄂特本共誅富埒呼額爾衮至是有讒于金主者癸亥賜古新詔曰師臣密奏姦狀已萌心在無君言宣不道逮燕居而竊議謂神器以何歸稔于聽聞遂致章敗遂賜死并殺尚書右丞蕭慶及古子昭武大將軍巴達符寶郎滿達時金主未有嗣子故嫉古者以此言譖之後知古新死非其罪贈儀同三司邢國公改葬之蕭慶亦贈銀青光祿大夫東道諸州解額少多求牒試于轉運司每七人取一名比之本貫難易百倍秦檜居永嘉引用州人以為黨助吳表臣林待聘號黨魁名為從官實操國柄凡鄉士皆登要途更相扳援無復程度是秋兩浙轉運司移試凡解二百八人而溫士得四十二檜與王次翁子姪與選者數人揭榜之日士論大駭自置舉場以來未之有也此據中興紀事本末及閒居録修入冬十月癸酉復張浚觀文殿大學士乙亥龍圗閣直學士范冲徽猷閣待制王居正並落職以中丞何鑄論其罪故也金薩爾罕陷慶陽河東經略使王忠植死之忠植本太行義士以復石代等十一州功授河東路經略安撫使及薩爾罕攻慶陽知府宋萬年拒守胡世將檄忠植以所部救之行次延安叛將趙惟清執忠植詣薩爾罕使甲士引至慶陽諭降忠植佯許之既至城下大呼曰吾河東步佛山忠義人也為敵所執使來招降願將士勿負朝廷堅守城壁薩爾罕怒詰之忠植披襟曰當速殺我遂遇害庚辰萬年以城降事聞贈忠植莭度使開府儀同三司諡義節官其子孫十人辛卯金人迫陕州吳琦率兵迎擊敗之庚子金人襲洮州攻鐡城堡統制孔文清惠逄擊敗之是月劉錡入見十一月戊申金將合喜自潼關出攻陕州守臣吳琦擊却之鳯翔統制楊從儀敗金人于寶雞金主興禮樂立孔子廟于上京求孔子後得四十九代孫承奉郎璠癸丑命襲封衍聖公十二月丁丑金地震壬午上皇太后冊寶于慈寧殿是月楊沂中引兵還行在初李興既屯白馬山寨李成以蕃漢數萬衆圍之時興家屬居襄陽唯幼子在側圍益急士心頗搖興謂諸將曰興與諸軍當死守茍或不幸吾豈為敵汙者當抱此兒投崖以謝天子諸將皆感泣由是守益堅金遣使賫黃榜招興以奉國上將軍河南尹興得檄不啓立斬其使以檄聞于朝白馬受圍久方冬泉涸軍民乏絶興焚香默禱一夕大雪泉源皆溢成知興不可屈乃即山下屯兵積糧為持久計興濳遣將士夜焚之成大挫徑歸西京金既取河南猶慮中原士民懷二始創屯田軍凡女直奚契丹之人皆自本部徙居中州與百姓雜處計其户口授以官田使自播種春秋量給其衣若遇出師始給錢米凡屯田之所自燕南至淮隴之北俱有之皆築壘于村落間十一年春正月癸卯鳯翔統制楊從儀敗金人于渭南庚戌張俊入見金羣臣上其主尊號曰崇天體道欽明文武聖德皇帝初御衮冕癸丑謝太廟大赦改元皇統金人攻壽春守臣孫暉統制雷仲合兵拒之初烏珠敗後留屯京亳出入許鄭之間簽兩河軍與舊部凡十餘萬以謀再舉及聞秦檜召諸軍還遂有此師丁巳壽春陷孫暉雷仲棄城去己未劉錡自太平率兵二萬援淮西庚申金人渡淮乙丑劉錡至廬州城下敵騎大集錡少退以避其鋒丙寅金人入廬州遣輕騎追錡而不敢逼相持至暮各解去戊辰金人攻商州守臣邵隆焚倉庫毁廬舍而遁敵入城據之己巳命楊沂中帥兵赴淮西嶽飛進兵江州二月癸酉張俊遣王德渡江德曰淮者江之蔽棄淮不守是謂脣亡齒寒也敵數千里逺來餉道决不繼及其未濟急擊之可以奪氣若遲之使少安則淮非吾有矣乃渡采石俊督軍繼之宿江中德曰明旦當㑹食厯陽是夜復和州晨迎俊入金烏珠退屯昭關邵隆破金人于洪門復商南乙亥金人復來爭和州張俊敗之丙子王德敗金人于含山戊寅金命致仕官職至三品者給半俸己卯關師古李橫敗金人于巢縣復其城癸未王德田師中等復含山及昭關甲申李顯忠遣統制崔臯敗金人于舒城乙酉金改封徽宗為天水郡王淵聖為天水郡公故遼主海濵王延禧為豫王丁亥楊沂中劉錡大敗金兀术軍于柘臯初劉錡自太平渡江與張俊沂中㑹而廬已陷錡乃與關師古據東關之險以遏其衝引兵出清溪兩戰皆捷烏珠以石臯地坦平利用騎因駐師以待錡進兵與烏珠夾石梁河而陳河通巢湖廣二丈錡命曳薪疊橋須臾而成遣甲士數隊踰橋卧槍而坐遣人㑹合俊沂中之師翌日沂中及王德田師中張子蓋諸軍既至惟俊後期錡與諸將分軍為三渡河擊之師中欲俟俊德曰事當機㑹復何待即與錡迎敵沂中繼之烏珠以鐡騎十餘萬分為兩隅夾道而陳德曰敵右陳堅我當先擊之麾軍渡河首犯其鋒一將被甲躍馬而出德引弓一發而斃乘勝大呼馳擊諸軍鼓譟從之金人以拐子馬兩翼而進德率衆鏖戰沂中曰彼恃弓矢吾有以屈之使萬人持長斧如墻而進敵遂大敗德與錡等追之又敗于東山敵望見驚曰此順昌旗幟也即走保紫金山是役也失將士九百人金人死者以萬計己丑烏珠復帥兵逆戰于店步沂中等又敗之乘勝逐北遂復廬州張俊愛妾章氏即杭妓張穠也頗知書柘臯之役俊遺書屬家事章答書引霍去病趙雲不問家事為言令勉思報國俊以其書奏聞帝大喜親書奬諭賜之加封雍國夫人是月䖍吉州盜患悉平三月庚子朔福建安撫大使張浚進鬻官田及賣度牒錢六十三萬緡助軍用帝降詔奬諭復浚特進言者謂敵雖遁去兩淮郡守當易以武臣使之深溝髙壘常若敵至而選通判俾治民事從之乙巳張俊楊沂中劉錡奉詔班師行才數里諜報金人攻濠州甚急俊乃復邀沂中錡回㑹于黃連埠同往援之距濠六十里丁未金人陷濠州鈐轄邵青死之俊召諸將計事沂中欲戰錡曰本來救濠今濠已失進無所依不若退師據險徐為後圗諸將皆曰善三帥鼎足而營或言敵兵已去錡謂俊曰敵得城而遽退必有謀也宜嚴兵備之俊不聽且欲自以為功謂錡無往而令沂中與王德將神勇步騎六萬直趣濠州列陳未定烟起城中金人伏騎萬餘分兩翼出沂中顧德曰何如德曰德小將安敢議事沂中以䇿麾軍曰那回諸軍以為令其走也遂潰而南無復紀律金人追之死者甚衆韓世忠帥師至城下亦不利而退沂中遂入滁州俊軍入宣化錡軍入藕塘方食俊遽至曰敵兵已近奈何錡曰楊宣撫兵安在俊曰已失利還矣錡語俊毋恐請以步卒禦之錡麾下皆曰兩大帥軍已渡我軍何苦獨戰錡曰順昌孤城旁無赤子之助吾提兵不滿二萬猶足取勝况今得地利又有鋭兵耶遂設三覆以待俄而俊謂錡曰諜者妄也乃戚方殿後之軍耳乃皆還時朝廷雖命三帥合軍不相節制然諸軍進退多出于俊而俊以沂中為腹心與錡有隙柘臯之戰奏賞諸軍獨不及錡錡以順昌之功驟貴故諸將頗嫉之辛亥金烏珠韓常與龍虎大王疾驅至廬州帝趣嶽飛應援凡十七札飛奏金人舉國南來巢穴必虛若長驅京洛以搗之彼必奔命可坐而敝帝不從飛方苦寒嗽力疾而行又恐帝急于退敵乃奏臣如搗虛勢必得利若以敵方在邇未暇逺圗欲乞親至蘄黃以議攻却帝乃詔飛㑹師蘄黃飛至濠而城已陷遂還兵舒州以俟命楊沂中渡江歸行在壬子金烏珠渡淮北去癸丑張俊渡江歸建康丁巳劉錡渡江歸太平戊午金主親祭孔子廟北面再拜退謂侍臣曰朕幼年游佚不知志學嵗月逾邁深以為悔孔子雖無位其道可尊使萬世景仰大凡為善不可不勉由是頗讀尚書論語及五代遼史諸書或以夜繼焉己未宴羣臣于瑶池殿適烏珠遣使奏捷侍臣多進詩稱賀金主覽之曰太平之世當尚文物自古致治皆由是也夏四月己卯參知政事孫近罷金人之攻淮西也近請召張浚都督諸軍秦檜大惡之及敵退中丞何鑄侍御史羅汝楫交章論近遂豫祠秦檜恐諸將梗和議欲盡收其兵權給事中范同獻計于檜請除韓世忠張俊嶽飛樞府則兵權自解檜喜乃密奏以柘臯之捷召三帥赴行在論功行賞于是世忠俊皆入朝飛至獨後檜憂之甚用王次翁計以明日帥三大將置酒湖上欲出則語直省官曰姑待嶽少保來益令堂厨豐其燕具如此展期以待者六七日而飛始至壬辰遂拜世忠俊樞密使飛為副使並宣押至樞府治事加楊沂中開府儀同三司賜名存中王德清逺軍節度使進范同翰林學士五月丁未遣張俊嶽飛如楚州閲軍置司鎮江俊知秦檜欲罷兵首請以所部𨽻御前且力贊和議檜深喜之遂罷三宣撫司以其兵𨽻御前遇出師臨時取㫖又置三總領所于湖北淮東淮西以統諸軍錢糧仍掌報發御前軍馬文字時軍制乍更將士多不安乃命俊飛往淮東撫韓世忠軍初飛在諸將中年最少以列校拔起纍立顯功張俊不能平飛屈己下之淮西之役俊以糧乏怵飛飛不為止帝賜札褒諭有曰轉餉艱阻卿不復顧俊疑飛漏言還朝反倡言飛逗遛不進以乏餉為辭至是俊知世忠忤檜欲與飛分其背嵬軍飛義不肯俊大不悅既至楚州俊欲修城為備飛曰當戮力以圗恢復豈可為退保計俊變色㑹世忠軍吏景著與總領胡紡言二樞密若分世忠軍恐至生事紡上之朝檜捕著下大理將以扇搖誣世忠飛馳書告以檜意世忠見帝自明俊于是憾飛遂密以飛報世忠事告檜檜大怒己酉金太師領三省事梁宋國王幹布卒庚戌金主親臨日官奏戌亥不宜哭泣金主曰君臣之義骨肉之親豈可避耶遂哭之慟命輟朝七日六月己亥加秦檜特進進尚書左僕射癸未張俊嶽飛至楚州俊以海州城不可守毁之遷其民統韓世忠軍還鎮江惟背嵬一軍赴行在飛還不復出掌兵其僚屬多乞祠去俊每獨出視師壬辰太保三京等路招撫處置使劉光世罷為萬壽觀使金有司請舉樂金主以幹布新喪不許甲午紀王阿嚕卒金主親臨輟朝如幹布喪洪皓在金求得皇太后書是夏遣邵武布衣李微齎來帝大喜因御經筵謂講讀官曰朕不知太母消息幾二十年雖遣使百輩不如此一書遂命微以官秋七月戊戌秦檜上徽宗實録遷少保庚子以翰林學士范同參知政事癸卯金主以景宣皇帝忌辰命尚食撤肉甲寅罷淮北宣撫使官劉錡張俊楊存中嫉錡言于朝曰淮西之役嶽飛不赴援劉錡戰不力秦檜信之遂罷錡兵命知荆南府八月戊辰立祚德廟于臨安祀晉程嬰公孫杵臼韓厥兵部侍郎王居正纍與秦檜忤且力辨王安石父子學行之非遂出知溫州居正知不為檜所容以目疾請祠杜門言不及時事客至談論經史而已檜猶忌之諷中丞何鑄劾居正為趙鼎汲引欺世盜名奪職奉祠居正為學根據六經楊時器之出所著三經義解示居正曰吾舉其端子成吾志居正感勵首尾十載為詩書周禮辨學三十九卷與時書同進二書既行天下遂不復言王氏學甲戌樞密副使嶽飛罷飛以恢復為己任不肯附和議常讀檜奏至德無常師主善為師之語恚曰君臣大倫根于天性大臣而忍面欺其主耶金烏珠遺檜書曰汝朝夕以和請嶽飛方為河北圗必殺飛始可和檜亦以飛不死己必及禍故力謀殺之遂諷中丞何鑄侍御史羅汝楫諫議大夫万俟卨等交章論飛奉㫖援淮西暫至舒蘄而不進比與張俊按兵淮上欲棄山陽而不守乃罷為萬壽觀使奉朝請九月秦檜以嶽飛屢言和議失計且嘗奏請定國本俱與檜大異必欲殺之乃與張俊謀密誘飛部曲能告飛事者優與重賞卒無應者俊聞飛嘗欲斬統制王貴又嘗杖之乃誘貴告飛貴不肯曰為大將寧免以賞罰用人茍以為怨將不勝其怨俊因劫以私事貴懼而從之檜又聞飛統制王俊善告訐號鵰兒以奸貪屢為張憲所抑使人諭之俊許諾于是檜謀以張憲王貴王俊皆飛部將使其徒自相攻發因以及飛父子庶帝不疑俊時在鎮江乃自為狀付王俊言副都統制張憲謀據襄陽還飛兵柄令告王貴使貴執憲赴鎮江行樞密府憲未至俊預為獄以待之屬吏王應求白俊以為樞院無推勘法俊不聽親行鞫鍊使憲自誣謂得飛子雲手書命憲營還兵計憲被掠無完膚竟不伏俊手自具獄成告檜械憲至臨安下大理寺獄戊申莫將韓恕自金還泗州時金左丞相烏珠欲議和故縱將等歸朝以通意秦檜檜遂奏遣忠州團練使劉光逺充大金通問使吉州刺史曺勛副之甲寅建康大火丙辰吳璘及人戰于劉家灣大敗之初璘進兵拔秦州聞金統軍和珍與希卜蘇合兵五萬屯劉家圈請于胡世將擊之世將問䇿安出璘曰有新立叠陳法每戰以長鎗居前坐不得起次最強弓次強弩跪膝以俟次神臂弓約敵相搏至百步內則神臂先發七十步強弓併發次陳如之凡陳以拒馬為限鐡鈎相連俟其傷則更代代則以鼓為節騎出兩翼以蔽于前陳成而騎退謂之叠陳世將善之諸將竊議曰吾軍其殱于此乎璘曰此古束伍令也軍法有之諸君不識耳得車戰餘意無出于此戰士心定則能持滿敵雖鋭不能當也遂進次劉家灣時和珍希卜蘇據險自固前臨峻嶺後控臘家城謂璘不敢犯璘揣知其情先一日㑹諸將問所以攻姚仲曰戰于山上則勝璘然其言乃請戰金人皆笑夜半璘遣姚仲王彥銜枚渡渭陟峻嶺截坡約二將上嶺而後發火二將至嶺寂無人聲軍已畢列萬炬齊發敵駭愕曰吾事敗矣璘知和珍善戰希卜蘇善謀二酋異議乃先以兵挑之胡盞果出戰鏖擊數十璘以叠陳法更迭戰輕裘駐馬麾之士殊死鬭金人大敗降者萬人胡盞走保臘家城圍而攻之城垂破朝廷方主和議以驛書令璘班師時璘復秦州其勢方張陕西河東首領爭來附而楊政拔隴州破岐下諸屯郭浩復華州入陕州而詔書遽至癸亥璘自臘家城引兵還河池浩還延安政還鞏世將惟浩嘆而已資治通鑑後編卷一百十四
