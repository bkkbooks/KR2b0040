body:
  text: 資治通鑑後編卷一百四刑部尚書徐乾學撰宋紀一百四起柔兆敦牂七月盡疆圉協洽四月凡十月欽宗恭文順德仁孝皇帝靖康元年秋七月乙丑朔除元符上書邪等之禁宋昭政和中上書諌攻遼貶連州庚午詔赴都堂乙亥蔡京移儋州安置攸移雷州丙子童貫移吉陽軍安置甲申蔡京行至潭州死年八十宣和間京師染色有太師青者逮京之斂無棺乃以青布條裹尸據周輝清波雜志子孫二十三人分竄逺地者遇赦不許量移京天資險譎舞智以御人在人主前左狙右伺專為固位之計終始持一説謂當越拘攣之俗竭九州四海之力以自奉道君雖富貴之亦隂知其姦諛不可以託國故屢起屢仆嘗收其素所不合者如趙挺之張商英劉正夫鄭居中王黼之屬迭居台司以柅之京每聞將罷退輒入宫見上叩頭祈哀無復亷恥燕山之役子攸實在行京送之以詩陽為不可之言冀事之不成得以自解暮年即家為府千進之徒舉集其門輸貨僮奴以得美官者踵相躡綱紀法度一切為虛文患失之心無所不至根結盤固牢不可脫卒以召釁誤國為宗社竒禍雖以譴死而海內猶以不正典刑為恨云丁亥令侍從官改修宣仁聖烈皇后謗史辛卯詔童貫隨所至州軍行刑訖函首赴闕貫握兵二十年權傾一時奔走期會過於制敕嘗有論其過者詔方劭往察劭一動一息貫悉偵得之先密以白且陷以他事劭反得罪逐死貫狀魁梧頥下生鬚十數皮骨徑如鐵不類閹人有度量能踈財後宫自妃嬪以下皆獻饋結納左右婦寺譽言日聞寵煽翕赫庭戶雜遝成市嶽牧輔弼多出其門窮姦稔禍流毒四海死不足以償責初趙良嗣以御史胡舜陟論其罪已竄栁州至是詔廣西轉運副使李升之即所梟其首徙妻子于萬安軍壬辰侍御史李光逺坐言事貶監當八月甲午朔録陳瓘後李綱留河陽十餘日練士卒修整器甲之屬進次懷州造戰車期兵集大舉而朝廷降詔罷減所起兵綱上疏言河北河東日告危急未有一人一騎以副其求奈何甫集之兵又皆散遣且以軍法勒諸路起兵而以寸紙罷之臣恐後時有所號召無復應者矣疏奏不報趣赴太原綱乃遣解潛屯威勝軍劉韐屯遼州幕官王以寧與都統制折可求張思正等屯汾州范瓊屯南北關皆去太原五驛約三道並進時諸將皆承受御畫事皆專達進退自如宣撫司徒有節度之名多不遵命綱嘗具論之雖降約東而承受專達自若於是劉韐兵先進金人併力禦之韐兵潰潛與敵遇於關南亦大敗思正等領兵十七萬與張灝夜襲金婁室軍于文水小捷明日戰復大敗死者數萬人可求師潰于子夏山於是威勝軍隆德府汾晉澤絳民皆渡河南奔州縣皆空丙申復以种師道為兩河宣撫使李綱以張灝等違節制而敗又上疏極論節制不專之弊且言分路進兵賊以全力制吾孤軍不若合大兵由一路進及范世雄以湖南兵至因薦為宣撫判官欲會合親率擊賊會以議和止綱進兵綱亦求罷遂召還以師道代之庚子以彗星避殿減膳令從官具民間疾苦以聞丁未金尼瑪哈斡里雅布復分道入冦先是朝廷以肅王為彼所質亦留其使臣蕭仲恭以相當踰月不遣其副趙倫懼不得歸乃紿餘伴邢倞曰金有耶律伊都者領契丹甚衆二於金人願歸大國可結之以圖斡里雅布尼瑪哈執政以仲恭伊都皆遼貴戚舊臣而用事於金當有亡國之戚信之乃以蠟書命仲恭致之伊都使為內應仲恭還見斡里雅布以蠟書獻斡里雅布聞於金主麟府帥折可求又言遼梁王雅里在西夏之北欲結宋以復怨於金吳敏勸帝致書梁王由河東之麟府亦為尼瑪哈所得復以聞於是金主大怒以尼瑪哈為左副元帥斡里雅布為右副元帥分道南侵尼瑪哈發雲中斡里雅布發保州戊申録張庭堅後乙卯遣王雲等使金戊午許翰罷知亳州己未徐處仁罷知東平吳敏罷知揚州以唐恪為少宰兼中書侍郎何栗為中書侍郎禮部尚書陳過庭為尚書右丞開封府尹聶昌同知樞密院事時翰處仁主用兵而吳敏耿南仲欲和議不合翰先罷處仁又與敏爭於帝前處仁怒擲筆中敏面南仲與恪昌欲排去二人而代之位諷中丞李回論之於是俱罷初敏以昌猛厲可使助已自衡州召知開封不數月拜同知樞密入謝即陳扞禦之䇿曰三關四鎮國家籓籬也聞欲以畀敵一朝渝盟何以制之願勿輕與而檄天下兵集都畿堅城守以遏其衝簡禁旅以備出擊壅河流以斷歸路前有堅城後有大河徑兵四面而至彼或南下墮吾網矣臣願激合勇義之士設伏開關出其不意掃其營以報帝是之命提舉守禦得以便宜行事未幾言者論敏因蔡京進用安置涪州先是遣劉岑李若水分使金軍以求緩師岑等還言斡里雅布索歸朝官及所欠金銀尼瑪哈則深諱金銀專論三鎮庚申乃遣王雲往許以三鎮賦入之數是月福州軍亂殺知州栁庭俊九月丙寅金人陷太原府時尼瑪哈乘勝急攻知府張孝純力竭不能支城遂破孝純被執既而釋用之副都總管王稟及通判方笈轉運使韓揆等三十人皆被害稟與孝純同守太原尼瑪哈屢遣人招諭不從至是併力攻城列炮三十座凡舉一炮聽鼓聲齊發炮石入城者大於斗樓櫓中炮無不壞者稟乃先設虛柵下又置粳布袋在樓櫓上雖為所壞即時復成尼瑪哈又為填濠之法用洞子下置轉車輪上安巨木似屋形以生牛皮縵上裹以鐵葉人在其內推而行之節次續進五十餘輛皆運土木柴薪於其中其填濠先用大索綳濠兩岸然後置機在上增覆如初稟預穿壁為竅致火鞲在內俟其薪多即放燈于水其燈下水尋木能燃濕薪火既漸盛令人鼓鞲其焰亘天焚之立盡尼瑪哈又為車如鵝形下亦用車輪冠以皮鐵使數千百人推行欲上城樓稟于城中毁眺樓亦如鵝形入人在內迎敵先以索絡巨石置彼鵝車上又令人在下以搭鈎及繩拽之其車前倒不能進然人衆糧乏三軍先食牛馬騾次烹弓弩皮甲百姓煮萍實粳籺草茭以充腹次即妻男女將斃雖義夫慈父無不親食其肉不暇相易恐斤兩輕重之不等也城既陷稟走入統平殿取太宗檀香御容以匹練繫於其背縋城赴汾水死子閣門祗候荀亦殉難焉太原既破知磁州宗澤繕城浚隍治器械募義勇為固守之計上言邢洺磁趙相五州各蓄精兵二萬敵攻一郡則四郡皆應是一郡之兵常有十萬人也帝嘉之初澤知萊州掖縣部使者得旨市牛黃澤報曰方時疾癘牛飲其毒則結為黃今和氣橫流牛安得黃使者怒欲劾邑官澤曰此澤意也獨銜以聞一縣獲免壬申臣僚言蔡京罪惡貫盈陛下奮獨斷之威竄之海外京滯留道塗至長沙而死識與不識無不抵掌而歎蔡攸之罪不減乃父燕山之役禍及天下驕奢淫佚載籍所無若不竄之海外恐不足以正凶人之罪詔移萬安軍行至嶺外帝遣使以手劄隨所至賜死并誅其弟翛及朱勔云乙亥詔編修敇令所取靖康以前蔡京所乞御筆手詔參祖宗法及今所行者刪修成書丁丑以禮部尚書王宇為尚書左丞戊寅命李綱出知揚州中書舍人胡安國初為太學博士足不躡權門蔡京惡其異已會安國舉永州布衣王繪鄧璋遺逸京以二人乃范純仁鄒浩之客置獄推治安國坐除名張商英相始得復官帝即位召赴京師入對言明君以務學為急聖學以正心為要又言紀綱尚紊風俗益衰施置乖方舉動煩擾大臣爭競而朋黨之患萌百執窺覦而浸潤之姦作用人失當而名器愈輕出令數更而士民不信若不掃除舊制乘勢更張竊恐大勢一傾不可復正語甚剴切日昃始退耿南仲聞其言而惡之力譖於帝帝不答許翰入見帝謂曰卿識胡安國否翰對曰自蔡京得政士大夫無不受其籠絡超然逺迹不為所汙如安國者實少遂除中書舍人及言者論李綱專主戰議喪師費財綱遂出守舍人劉與當制謂綱勇於報國吏部侍郎馮澥言與為綱遊説珏坐貶安國封還詞頭且論澥越職言事耿南仲大怒何栗從而擠之遂出知通州安國在省一月多在告之日及出必有所論列或曰事之小者盍姑置之安國曰事之大者無不起於細微今以小事為不必言至於大事又不敢言是無時可言也人服其論有赤氣隨日出壬午梟童貫首于都市甲申日有兩珥背氣丙戌建三京及鄧州為都總管府分總四道以知大名府趙野總北道知河南府王襄總西道知鄧州張叔夜總南道知應天府胡直儒總東道罷知揚州李綱提舉洞霄宫金師日逼南道總管張叔夜陜西制置使錢蓋各統兵赴闕唐恪耿南仲専主和議亟檄止諸軍勿前辛卯遣給事中黃鍔由海道使金議和是月夏人陷西安州冬十月癸巳朔御殿復膳貶李綱為保靜軍節度副使安置建昌軍丁酉有流星如杯金人陷真定府知府事李邈本路兵馬都鈐轄劉翊死之种師道及斡里雅布戰于井陘敗績斡里雅布入天威軍犯真定翊率衆晝夜搏戰久之城陷翊巷戰麾下稍亡翊顧其弟曰我大將也可受賊戮乎因挺刃欲奪門出不果自縊死邈初聞冦至間道走蠟書上聞三十四奏皆不報城被圍且戰且守相持四旬既破斡里雅布脅之拜不屈以火燎其鬚眉及兩髀亦不顧乃拘於燕山府欲以赴井左右持之不得入命知滄州笑而不答後賜之冠𢃄衣服邈憤大罵金人撾其口猶吮血噀之金人大怒遂遇害將死顔色不變南向再拜端坐就戮燕人為之流涕後諡忠壯戊戌金使楊天吉王汭來議事取蔡京童貫王黼吳敏李綱等九人家屬命王時雍曹朦館之時雍議以三鎮所入租增嵗幣并祖宗內府所藏珍玩悉歸二帥且以河東宿師暴露日久欲厚犒之天吉汭頗頷其説先取犒師絹十萬匹以行朝廷既遣使講和金人陽許而攻略自如諸將以和議故皆閉壁不出御史中丞吕好問乃請亟集滄滑邢相之戌以遏奔衝而列勤王之師于畿邑以衛京城疏入不省金人陷真定攻中山上下震駭廷臣狐疑相顧猶以和議為辭好問率臺屬劾大臣畏懦誤國坐貶知袁州帝閔其忠下遷吏部侍郎庚子日有赤青黃戴氣金人攻汾州知州張克戬畢力扞禦城破猶巷戰不克乃索朝服焚香南向拜舞自引決一門死者八人兵馬都監賈亶亦死之金人攻平定軍辛卯下哀痛詔命河北河東諸路帥臣傳檄所部得便宜行事壬寅天寧節率羣臣詣龍德宫上夀甲辰詔用蔡京王黼童貫所薦人丙午集從官于尚書省議割三鎮召种師道還師道行次河陽遇王汭揣敵必大舉亟上疏請幸長安以避其鋒大臣以為怯故召還之丁未以禮部尚書馮澥知樞密院事己酉閲炮飛山營庚戌以范訥為河北河東路宣撫使代种師道也遼故將小䩴簶攻陷麟州知建寧寨楊震死之王雲遣使臣至自真定報金人已講和不復議割三鎮但索五輅冠冕及上尊號等事且須康王親到議乃可成壬子詔太常禮官集議金主尊號命康王使斡里雅布軍尚書左丞王宇副之宇辭以馮澥行知東上閣門事高世則充參議官尋貶宇為單州團練副使乙卯雨木氷丙辰金人陷平陽府初汾州既陷議者謂汾之南有回牛嶺險峻如壁可以控扼乃命將以兵數千人屯險要朝廷又遣劉琬統衆駐平陽以扞北邊然國用乏竭倉廪不足士之守回牛者日給豌豆二升或陳麥而已士笑曰軍食如此而使我戰乎金人領鋭師攻嶺於山上仰望官兵曰彼若以矢石自上而下吾曹病矣為之奈何徘徊未敢進俄而官軍潰散遂越嶺至平陽琬領兵遁去城遂陷官吏皆縋而出已而威勝隆德澤州皆陷庚申日有兩珥攻背氣侍御史胡舜陟請援中山不省辛酉檢校少傅鎮洮軍節度使种師道卒十一月甲子康王入辭帝賜以玉帶撫慰甚厚王出城北權留定林院候冠服禮物成而行丙寅夏人陷懷德軍知軍事劉銓通判杜翊世死之初經略使席貢牒銓知懷德軍銓捧檄即日就道夏人素聞銓名乃屯兵綿亘數十里而圍之銓晝夜修戰守之備賊百計攻城銓悉以術破之後矢盡糧絶銓度力不支乃同翊世聚焚府庫環牙兵為三匝出戰譙門中官軍殱焉翊世同妻張氏義不受辱遂火其室舉家死於烈焰中翊世自縊死銓欲自裁已為敵所束縛金將遣人置之别室將官之銓罵曰死耳我顧肯降賊耶我若不死決不貸汝遂遇害籍談稹家康王未行而車輅至長垣為金人所却王遂不行戊辰王雲至自金軍言事勢中變必欲得三鎮不然則進取汴都中外大駭康王復入門罷馮澥為太子賔客己巳集百官議三鎮於延和殿各給筆札文武分列廊廡凡百餘人惟梅執禮孫傅吕好問洪芻秦檜陳國材等三十六人言不可與自范宗尹以下七十人皆欲與之宗尹言最切至伏地流涕乞與之以紓禍已而黃門持宗尹章疏示衆曰朝廷有定議不得異論會李若水歸自尼瑪哈軍慟哭於庭必欲從其請何栗初主不與及退謂唐恪曰三鎮之地割之則傷河外之情不割則太原真定失矣不若任之但飭守備以待恪唯唯梅執禮建議清野尋召孫傅及執禮入對議遂定庚午詔河北河東京畿清野令流民得占官舍寺觀以居辛未有流星如杯壬申禁京師民以浮言相動者金尼瑪哈自太原趨汴官吏棄城走者逺近相望癸酉至河外宣撫使折彥質領兵十二萬與之對壘時簽書樞密院事李回以萬騎防河亦至河上賊發數十騎來覘回報其帥曰南兵亦盛未可輕渡或欲整兵俟戰有羅索大王者曰南兵雖多不足畏也與之戰則勝負未可知不若加以虛聲盡取戰鼓擊之達旦以觀其變衆以為然黎明河上之師悉潰遂長驅而南甲戌敵衆悉渡知河陽燕英西道總管王襄皆棄城走永安軍鄭州並降於金斡里雅布屯兵慶源城下欲為攻城之計宣撫使范訥統兵五萬守滑濬以扞之斡里雅布知有備乃由恩州古榆渡趨大名王雲固請康王往使乙亥命雲副康王再使斡里雅布軍許割三鎮并奉衮冕車輅以行仍尊金主為皇叔上尊號十八字丙子王及之同金使王汭來言軍已至西京不復請三鎮直欲畫河為界陛對殊不遜有姦臣輔暗主之語上下洶懼即許之且以兩府二人行唐恪既書敕何栗大駭曰不奉三鎮之詔而從畫河之命何也栗不肻書因請罷是日金人由汜水關渡河京西提刑許高河北提刑許亢各統兵防洛口望風而潰京師聞之杜門清野詔百官疾速上城遣馮澥李若水使尼瑪哈軍行至中牟守河兵相驚以為金兵至左右謀取間道去澥問何如若水曰戌兵畏敵而潰奈何效之今正有死爾敢言退者斬若水屢附奏言和議必不可諧乞申飭守備下哀痛詔徴兵於四方丁丑何栗罷為開封尹以尚書左丞陳過庭為中書侍郎兵部尚書孫傅為尚書左丞命成忠郎郭京領選六甲正兵所孫傅因讀丘濬感事詩有郭京楊適劉無忌之語於市人中訪得無忌於龍衛中得京好事者言京能施六甲法可以生擒金二帥而掃蕩無餘其法用七千七百七十七人朝廷深信不疑命以官賜金帛數萬使自募兵無問枝藝能否但擇年命合六甲者所得皆市井浮惰旬日而足敵攻益急京談笑自如云擇日出兵三日可致太平直襲擊至隂山乃止傅與何栗尤尊信之或謂傅曰自古未聞以此成功者正或聽之姑少付以兵俟有尺寸功乃稍進任今委之太過懼必為國家羞傅怒曰京殆為時而生敵中瑣微無不知者幸君與傳言若告他人將坐沮師之罪揖使出又有劉孝竭等募衆或稱六丁力士或稱北斗神兵或稱天闕大將大率效京所為識者危之王雲耿延僖高世則等從康王出城雲白王曰京城樓櫓天下所無然真定城高幾一倍金人使雲等坐觀不移時破之此雖樓櫓如畫亦不足恃也王不答行次長垣百姓喧呼遮道至頂盆焚香乞起兵扼賊不宜北去戊寅進龍德宫婉容韋氏為賢妃康王構為安國安武軍節度使是曰康王發長垣至滑州庚辰至相州壬午磁州守臣宗澤迎謁曰肅王一去不返今敵又詭辭以致大王其兵已迫復去何益願勿行先是王雲奉使過磁相勸兩郡撤近城民舍運粟入保為清野之計民怨之及王次磁出謁嘉應神祠雲在後百姓遮道諌王勿北去厲聲指雲曰清野之人真姦細也王出廟行民譟執雲殺之時斡里雅布軍濟河遊奕日至磁城下蹤迹王所在知相州汪伯彥亟以帛書請王如相躬服櫜鞬部兵以迎于河上王令韓公裔訪得間道潛師夜發磁人無一知者遲明至相勞伯彥曰他日見上當首以京兆薦公由是受知議者以為是役也雲不死王必至金無復還理湯隂人嶽飛少負氣節家貧力學尤好左氏春秋孫吳兵法有神力能挽弓三百斤弩八石學射於周同盡其術同死朔望設祭於其家劉韐宣撫鎮定募敢戰士飛與焉屢擒劇賊至是因劉浩以見王以為承信郎遣斡里雅布楊天吉王汭等來議割地欲以黃河為界帝許之汭又請報使須親信大臣帝命耿南仲以老辭改命聶昌以親辭陳過庭曰主憂臣辱願效死帝為揮淚太息而怒南仲昌固遣南仲使河北斡里雅布軍昌使河北尼瑪哈軍昌言兩河之人忠義勇徑萬一為所執死不瞑目矣行至絳絳人果堅壁拒之昌持詔抵城下縋而登鈐轄趙子清麾衆殺昌抉其目而臠之初南仲與吳幵堅請割地以成和好故朝廷戰守之備皆罷致金師日逼至是與金使王汭偕至衛州衛鄉兵欲殺汭汭脫去南仲遂走相州以帝旨諭康王起河北兵入衛京師因連署募兵榜揭之人情始安甲申以孫傅同知樞密院事御史中丞曹輔簽書樞密院事斗星不見以京兆府路安撫使范致虛為陜西五路宣撫使令督勤王兵入援乙酉斡里雅布軍至城下屯于劉家寺初种師道聞真定太原皆陷檄召西南兩道兵赴闕會師道卒唐恪耿南仲專務議和乃止兩道兵毋得妄動遂散歸及冦傅城四方兵無一人至者城中唯七萬人於是殿前司以京城諸營兵萬人分作五軍以備緩急救護前軍屯順天門左軍中軍屯五嶽觀姚弋仲統之右軍屯上清宫後軍屯景陽門辛承宗統之又以五萬七千人分四壁守禦遣使以蠟書間行出關召兵并約康王及河北守將來援多為金邏兵所獲丁亥大風發屋折木簽書樞密院事李回罷戊子金人攻通津門范瓊出兵焚其寨己丑南道都總管張叔夜將兵勤王至玉津園帝御南薰門見之軍容甚整以叔夜為延康殿學士時唐恪計無所出密言於帝曰唐自天寶而後屢失而復興者以天子在外可以號召四方也今宜舉景德故事留太子居守而幸西洛連據秦雍領天下兵親征以圖興復帝將從之領開封府何栗入見引蘇軾所論謂周之失計未有如東遷之甚者帝翻然而改以足頓地曰今當以死守社稷及叔夜入對亦言賊鋒甚鋭願如明皇之避祿山暫詣襄陽以圗幸雍帝不答斡里雅布遣劉晏來要帝出盟庚寅幸東壁勞軍詔三省長官名悉依元豐舊制以領開封府何栗為門下侍郎閠月壬辰朔金人攻善利門統制姚友仲禦之唐恪從帝巡城人欲擊之因求去罷為中太一宫使以門下侍郎何栗為尚書左僕射兼中書侍郎癸巳京師苦寒用日者言借土牛迎春都人殺東壁統制官辛亢宗罷民乘城代以保甲金尼瑪哈軍自河陽來會至城下甲午驛召李綱為資政殿大學士領開封府金人陷懷州知州霍安國死之安國被圍扞禦不遺力鼎澧兵亦至相與共守力盡城乃陷將官王美投濠死尼瑪哈引安國以下分為四行問不降者為誰安國曰守臣霍安國也問餘人通判林淵鈐轄張彭年都監趙士詝張諶于潛鼎澧將沈敦張行中及隊將五人同辭對曰淵等與知州一體皆不肯降尼瑪哈令引於東北鄉望其國拜皆不屈乃解衣面縛殺十三人而釋其餘安國一門無噍類時雨雪交作帝被甲登城以御膳賜士卒易火飯以進人皆感涕敵攻通津門數百人縋城禦之焚其炮架五鵝車二乙未金人入青城攻朝陽門馮澥至自金軍時澥與李若水至懷州金使蕭慶等挾與俱還丙申幸宣化門帝乘馬行泥淖中民皆感泣張叔夜數戰有功帝如安上門召見拜資政殿學士東道總管胡直孺將兵入衛與金人遇於拱州兵敗被執遂陷拱州丁酉赤氣亘天金人初至即力攻東壁劉延慶練邊事措置頗有法遇夜即城下積草數百爇之以驚時有議置九牛炮者雖磑磨皆可施於東壁用之嘗碎其雲梯詔封護國大將軍賊知東壁不可攻於是過南壁以洞子自蔽運薪土實護龍河河水遂涸以馮澥為尚書左丞戊戌殿前副都指揮使王宗濋率牙兵千餘下城與賊戰統制官高師旦死之己亥詔毁艮嶽為炮石賊復於護龍河疊橋取道姚弋仲選鋭卒下臨分布弩炮又於城上縛虛棚士衆山立箭下如雨橋不能寸進乃棄去益造火梯雲梯偏橋撞竿鵝車洞子諸攻城之具庚子命張叔夜簽書樞密院事將兵入城賊攻宣化門姚友仲禦之是曰幸東壁金人復遣蕭慶等來貸糧且議和辛丑金人攻南壁殺傷相當壬寅詔河北守臣盡起軍民兵倍道入援癸卯幸安肅門至朝陽門敵箭及駕前旗下令軍士三百餘人縋城出戰殺賊數百復縋而上命以官者數十人賊築望臺度高百尺下覘城中以飛火炮燔樓櫓將士嚴警備旋即繕治又造雲梯施大輪以革冒之乘罅推以叩壘將士出鉤竿拄之使不得進近則以鉤矛取之發火焚梯敵數引却復用鵝車洞子攻北城軍士射以九牛弩一發而貫三人詔募人焚敵炮架鵝車洞子及八分者白身授團練使餘以次授賞張叔夜聞南壁飛石擊樓櫓與范瓊分麾下兵襲敵營欲燔其炮架遙見鐵騎軍士不克陳而奔自相蹈藉溺隍死者以千數甲辰大雨雪金人陷亳州遣間使召諸道兵勤王乙巳大寒士卒噤戰不能執兵有僵仆者帝在禁中徒跣祈晴丙午雨木冰丁未始避正殿戊申金人過登天橋來攻通津門時勤王兵不至城中兵可用者唯衛士三萬然亦十失五六因時令挑戰以示敢敵金人復來言不須帝出城請親王及何栗往議詔越王往將行而尼瑪哈以兵來迓王乃止於是金人宣言失信再遣使來趣親王出盟己酉遣馮澥曹輔與宗室仲溫士􅧘使金軍請和既至尼瑪哈即遣還不與交一語命康王構為河北兵馬大元帥殿中侍御史胡唐老言康王奉使至磁為士民所留乃天意也乞就拜為大元帥俾率天下兵入援何栗以為然密草詔藁上之帝令募死士得秦仔劉定等四人遣持蠟詔如相州拜王為大元帥陳遘為元帥宗澤汪伯彥副元帥使盡河北兵速入衛辟官行事並從便宜仔定至相於頂髮中出詔王讀之嗚咽軍民感動辛亥金人復遣使來議和要親王出盟壬子復遣曹輔馮澥及仲溫士􅧘使金營癸丑仲溫士􅧘還云金人須親王并何栗至軍前金人攻通津宣化門范瓊以一人出戰渡河氷裂沒者五百餘人自是士氣益挫甲寅大風自北起俄雪下數尺連日夜不止乙卯金人復使劉晏來趣親王宰相出盟何栗屢趣郭京出師京徙期再三曰非至危急吾師不出丙辰大風雪京乃令守禦者悉下城毋得竊窺因大啓宣化門出攻金軍京與張叔夜坐城樓上金人分四翼譟而前京兵敗走墮死于護龍河城門急閉京向叔夜曰須自下作法因下城引餘衆南遁金人遂登城衆皆披靡四壁兵皆潰金人焚南薰諸門統制姚友仲死于亂兵四壁守禦使劉延慶奪門出奔為追騎所殺宦者黃經自赴火死統制何慶言陳克禮中書舍人高振力戰與其家人皆被害京城遂陷帝慟哭曰朕不用种師道言以至於此衛士入都亭驛執金使劉晏殺之軍民數萬斧左掖門求見天子帝御樓諭遣之衛士長蔣宣率其衆數百欲邀乘輿犯圍而出左右奔竄獨孫傅梅執禮吕好問侍宣抗聲曰國事至此皆宰相信任姦臣不用直言所致孫傅訶之宣以語侵傅好問譬曉之曰若屬忘家族欲冒重圍衛上以出誠忠義然乘輿將駕必甲乘無缺而後動詎可輕耶宣屈服曰尚書真和軍情麾其徒退何栗欲親率都民巷戰金人宣言議和退師乃止戊午遣栗及濟王栩使金軍以請成栗懼不敢行帝固遣之猶遲回良久不決李若水嫚罵曰致國家如此皆爾輩誤事今社稷傾危爾輩萬死何足塞責栗不得已乃上馬而戰栗不能跨左右扶上比出朱雀門所執馬鞭三墜地既至尼瑪哈斡里雅布曰自古有南即有北不可相無也今之所議期在割地而已栗還言金欲邀上皇出郊帝曰上皇驚憂而疾必欲之出朕當親往栗喜和議成既歸都堂作會飲酒談笑終日自乙卯雪大作不止天地冥晦或雪未下時於隂雪中有雪絲長數寸墮地是夜雪霽彗星見有白氣出太微星己未遣何栗再往金軍詔曰大金堅欲上皇出郊朕以宗廟生靈之故義當親往咨爾衆庶無致驚疑庚申曰出如火無光辛酉車駕詣青城何栗陳過庭孫傅等從帝望齋宫門即下馬步入一小位中金人邀請乘馬入帝不聽二帥相見帝與語惟尼瑪哈應答琅然尼瑪哈唯唯而已都人自宣德樓至南薰門立泥雪中以俟駕回十二月壬戌朔車駕留青城尼瑪哈遣蕭慶入城居尚書省朝廷動靜並先關白是日康王開大元帥府于相州有兵萬人分為五軍而進既渡河次于大石宗澤以二千人與金人力戰破其三十餘寨履冰渡河見王曰京城受圍日久入援不可緩王納之既而知信德府梁楊祖以三千人至張俊苖傅楊沂中田師中等皆在麾下兵威稍振會帝遣曹輔賫蠟詔至云金人登城不下方議和好可屯兵近甸毋動汪伯彥等皆信之宗澤獨曰金人狡譎是欲欵我師耳君父之望入援何啻飢渴宜急引軍直趨澶淵以解京城之圍伯彥等難之勸王遣澤先行自是澤不得與帥府事矣耿南仲及伯彥請移軍東平王從之癸亥車駕至自青城士庶及太學生迎謁帝掩面大哭曰宰相誤我父子觀者無不流涕金遣使來索金一千萬錠銀二千萬錠帛一千萬匹於是大括金銀金價至五十千銀至三千五百金又索京城騾馬括得七千餘匹悉歸之丙寅遣陳過庭折彥質往兩河割地以畀金又分遣歐陽珣等二十人持詔而往珣嘗上書極言祖宗之地尺寸不可以與人持詔急會羣臣議珣復抗論當與力戰戰敗而失地他日取之直不戰而割地他日取之曲時宰怒欲殺珣乃以珣為將作監丞奉使割深州珣至深州城下慟哭謂城上人曰朝廷為姦臣所誤至此吾已辦一死來矣汝等宜勉為忠義報國金人怒執送燕以焚死辛未定京師米價勸糶以賑民乙亥康王如北京丙子中書省火庚辰雨雹癸未大雪寒縱民伐紫筠館花木以為薪庚寅康王如東平府初范致虛聞汴京圍急會西道總管王襄陜西制置使錢蓋之師凡十萬入援至潁昌聞汴京陷襄蓋遁去致虛獨與西道副總管孫昭逺環慶帥王似熙河帥王倚率步騎號二十萬命馬祐昌統之以趨汴以僧趙宗印為參議官致虛將大軍遵陸宗印將舟師趨西京宗印又以僧為一軍號尊勝隊童行為一軍號淨勝隊致虛勇而無謀委已以聽於宗印宗印徒大言實未嘗知兵師出武關至鄧州千秋鎮金將婁室以精騎衝之不戰而潰死者過半王似王倚孫昭逺等留陜府致虛收餘兵入潼關二年春正月辛卯朔詣延福宫朝太上皇帝命濟王栩景王把出賀金二帥二帥亦遣人入賀壬辰金人復趣召康王遣中書舍人張澄賫詔以行以前此曹輔往迎不見王而還故也癸巳康王次東平府詔使出割兩河地民堅守不奉詔凡纍月金人止得石州甲午詔兩河民開門出降乙未有大星出建星西南流入於濁沒丁酉雨木􅖅己亥隂曀風迅發夜西北隂雲中有如火光庚子車駕復詣青城時金人索金銀益急欲縱兵入城帝以問蕭慶慶曰須陛下親見元帥乃可帝有難色何栗李若水以為無虞勸帝行帝乃命孫傅輔太子監國而與栗若水等往唐恪聞之曰一之謂甚其可再乎閣門宣贊舍人吳革亦白栗曰天文帝座甚傾車駕若出必墮敵計栗不聽辛丑車駕幸青城鄆王楷何栗馮澥曹輔吳幵莫儔孫覿談世績汪藻皆分居青城齋宫餘並令先歸初帝約五日必還至是民以金銀未足各竭其家所有獻之有福田院貧民亦納金二兩銀七兩而金人來索不已於是增侍從郎官二十四員再根括又分遣搜掘戚里宗室內侍僧道伎術倡優之家乙巳籍梁師成家丙午太學生徐揆詣南薰門以書白守門者乞達二帥請車駕還闕二帥取揆赴軍中詰難揆厲聲抗論為所殺是日通奉大夫劉韐死于金營韐為河東割地使金人令僕射韓正館之僧舍謂曰國相知君今用君矣韐曰偷生以事二姓有死不為也正曰軍中議立異姓欲以君為正代與其徒死不若北去取富貴韐仰天大呼曰有是乎乃書片紙曰貞女不事二夫忠臣不事二君况主憂臣辱主辱臣死此豫所以不敢偷生也使親信持歸報其子子羽等即沐浴更衣酌巵酒而縊金人歎其忠瘞之寺西岡上遍題窗壁以識其處凡八十日乃就斂顔色如生丁未大霧四塞金人下含輝門剽掠焚五嶽觀副帥宗澤自大名至開德與金人十三戰皆捷遂以書勸康王檄諸道兵會京城又移書北道總管趙野兩河宣撫范訥知興仁府曽楙合兵入援三人皆以澤為狂不答澤遂以孤軍進至衛南先驅云前有敵營澤揮衆直前連戰敗之轉戰而東敵益生兵至澤將王孝忠戰死前後皆敵壘澤下令曰今日進退等死不可不死中求生士卒知必死無不一當百斬首數千金人大敗退却數十里澤計其勢必復來乃亟徙其營金人夜至得空營大驚自是憚澤不敢復出兵澤出其不意遣兵過大河襲擊又敗之二月辛酉朔帝在青城都人日出迎駕而尼瑪哈留不遣金主晟得帝降表廢帝及太上皇帝為庶人知樞密院事劉彥宗請復立趙氏不許丙寅金人塹南薰門路人心大恐吳幵莫儔自金營持文書至令依金主詔推薦異姓堪為人主者從軍前備禮册命孫傅等讀詔號絶兩以狀懇請立趙氏不從丁卯京城巡檢范瓊逼上皇與太后御犢車出宫鄆王楷以下及王妃公主駙馬凡六宫有位號者皆行獨元祐皇后孟氏以廢居私第獲免初金人以內侍鄧述所具諸王皇孫妃主名檄開封府徐秉哲盡取之秉哲令坊巷五家為保毋得藏匿前後凡得三十餘人秉哲悉令衣𬒮相聯屬而往金人逼帝及上皇易服李若水抱帝而哭詆金人為劇賊金人曳若水出擊之敗面氣結仆地辛未皇后皇太子同詣青城百官軍民奔隨號泣太學諸生擁拜車前哭聲震天自上皇出郊金人逼令召皇后太子孫傅留太子不遣吳幵莫儔督脅甚急范瓊恐變生以危言讋衛士遂擁皇后太子共車而出孫傅曰吾為太子傅當同生死遂以留守事付王時雍從太子出至南薰門范瓊力止傅遂宿門下以待命李若水在金營旬日罵賊不絶口乃裂頸斷舌而死金人相與言曰遼國之亡死義者十數南朝唯李侍郎一人若水臨死無怖色為歌詩卒曰矯首問天公天卒無言忠臣效死亦何愆聞者悲之是日留守王時雍召百官會議所立衆欲舉在軍前者一人左司員外郎宋齊愈適自外至或問以敵意所主齊愈寫張邦昌三字示之議遂定時不書議狀者唯孫傅張叔夜敵遂取二人往軍中太常寺簿張浚開封士曹趙鼎司門員外郎胡寅皆逃入太學不書名癸酉王時雍梅執禮召百官士庶僧道軍民集議推戴事時孫傅張叔夜已出獨時雍主事惟恐百官不肯書乃先自書以率之百官亦隨以書御史馬伸獨奮曰吾曹職為諍臣豈容坐視乃與御史吳給約中丞秦檜共為議狀願復嗣君以安四方檜不答有頃伸藁就首以呈檜猶豫伸率同僚合辭力請檜不得已姑書名伸遣人馳達金軍并論張邦昌當上皇時蠧國亂政以致傾危之罪吳幵莫儔持狀詣軍前明曰賫金牒至言已據所申奏本國册立張相為皇帝訖令取册寶及一行册命禮數乙亥金人取秦檜并太學生三十人博士正録十員何栗已下隨駕在軍前人並取家屬庚辰康王如濟州時王有衆八萬屯濟濮諸州高陽關路安撫使黃潛善總管楊惟忠亦部兵數千至東平王遣真定總管王淵以三千人入衛宗廟金人聞之遣甲士及中書舍人張澄賫蠟詔自汴京至命王以兵付副帥而還京王問計於左右後軍統制張俊曰此金人詐謀耳今大王居外此天授豈可徒往王遂如濟州既而金人謀以五千騎取康王吕好問聞之遣人以書白王曰大王之兵度能擊則邀擊之不然即宜逺避且言大王若不自立恐有不當立而立者癸未城內復以金七萬五千八百兩銀一百十四萬五千兩衣假四萬八十四匹納軍前觀文殿大學士中太一宫使唐恪自殺時金人逼百官立張邦昌恪既書名仰藥而死乙酉金人以括金未足殺户部尚書梅執禮侍郎陳知質刑部侍郎程振給事中安扶梟其首乃下令曰根括官已正典刑金銀或尚未足當縱兵自索戊子夜白氣貫斗三月辛卯朔帝在青城張邦昌由南薰門入居尚書令廳丁酉金人奉册寶立張邦昌百官會于尚書省邦昌泣即上馬至西府門佯為昏憒欲仆立馬少蘇復號慟導至宣德門西闕下入幕次復慟金人持御衣紅繖來設于次外邦昌出次步至御街褥位望金國拜舞跪受册略曰咨爾張邦昌宜即皇帝位國號大楚都金陵邦昌御紅􅓫還次訖金人揖上馬出門百官引導如儀邦昌步入自宣德門由大慶殿至文德殿前進輦却弗御步升殿於御牀西側别置一椅坐受軍員等賀訖文武合班邦昌乃起立遣閣門傳云本為生靈非敢竊位傳令勿拜王時雍等懇奏復傳旨云如不蒙聽從即當歸避時雍率百官遽拜邦昌但東面拱立閣門宣贊舍人吳革恥屈節異姓率內親事官數百人皆先殺其妻孥焚所居舉義兵東門外范瓊詐與合謀令悉棄兵仗乃從後襲之殺百餘人執革脅以從逆革罵不絶口引頸受刃顔色不變并其子殺之又擒斬十餘人是日風霾日暈無光百官慘沮邦昌亦變色唯時雍及吳幵莫儔范瓊等欣然以為有佐命功邦昌心不安拜官皆加權字大抵往來議事者幵儔也逼逐上皇以下者時雍秉哲也脅懼都人者范瓊也遂皆擢用邦昌見百官稱豫手詔曰手書雖不改元而百官文移必去年號權簽書樞密院事吕好問所行文書稱靖康二年百官猶未以帝禮事邦昌唯時雍每言事稱臣啓陛下又勸邦昌坐紫宸垂拱殿以見金使好問爭之乃止時雍復議肆赦好問曰四壁之外皆非我有將誰赦耶乃但赦城中而選郎官為四方密諭使乙巳張邦昌往青城見二帥致謝且面議七事一乞不毁趙氏陵廟二乞免取金帛三乞存留樓櫓四乞俟江寧府修繕畢三年內遷都五乞五曰班師六乞以帝為號稱大楚帝七乞借金銀犒賞皆許之又請歸馮澥曹輔路允迪孫覿張􅊹談世績汪藻康執權元當可沈晦黃夏卿鄧肅郭仲荀太學六局官祕書省官亦從之唯何栗孫傅張叔夜秦檜司馬朴等令舉家北遷癸丑金人歸馮澥等且令權止根括金帛丁巳張邦昌率百官詣南薰門五嶽觀內望軍前遙辭二帝邦昌慟哭百官軍民皆哭有號絶不能止者是曰道君皇帝北狩寧德皇后及諸親王妃嬪以下皆行斡里雅布軍護送由滑州路進發戊午金兵下城盡絶我兵分四壁屯守張邦昌詣金營辭服赭袍張紅繖所過起居並如常儀從行者王時雍徐秉哲吳幵莫儔夏四月庚申朔大風吹石折木車駕北狩皇后皇太子偕行尼瑪哈軍護送由鄭州路進發凡法駕鹵簿皇后以下車輅鹵簿冠服禮器法物大樂教坊樂器祭器八寶九鼎圭璧渾天儀銅人刻漏古器景靈宫供器太清樓祕閣三館書天下州府圖及官吏內人內侍技藝工匠倡優府庫畜積為之一空初金人將還議留兵以衛邦昌吕好問曰南北異宜恐北兵不習風土必不相安金人曰留一孛堇統之可也好問曰孛堇貴人有如觸發致病則負罪益深金人乃不留兵而去宗澤在衛聞二帝北狩即提軍趨滑走黎陽至大名欲徑渡河據金人歸路邀還二帝而勤王之兵卒無一至者遂不果辛酉北風大起苦寒甲子張邦昌迎元祐皇后于私第入居延福宫吕好問謂邦昌曰相公真欲立耶抑姑塞敵意而徐為之圖耶邦昌曰是何言也好問曰相公知中國人情所向乎特畏女真兵威耳女真既去能保如今日乎大元帥在外元祐皇后在內此殆天意盍亟還政可轉禍為福且省中非人臣所處宜寓直殿廬毋令衛士夾陛敵所遺袍帶非戎人在弗服車駕未還所下文書不當稱聖旨為今計者當迎元祐皇后請康王早正大位庶獲保全邦昌以為然乃迎元祐皇后入延福宫尊為宋太后其册文有曰尚念宋氏之初首崇西宫之禮蓋用太祖即位迎周太后入西宫故事識者有以覘邦昌之意非真為趙氏也郭京自都城走沿路稱撒豆成兵假幻惑衆至襄陽有衆千餘屯洞山寺欲立宗室為帝錢蓋王襄及張思正等止之不從會有自汴來者具説京欺罔事思正囚京刺殺之丙寅張邦昌遣其甥吳何及王舅韋淵同賫書於康王大略言臣封府庫以待臣所以不死者以君王之在外也王召何等飲以酒賜豫良厚丁卯謝克家以邦昌之命齎玉璽至大元帥府其篆文曰大宋受命之寶耿南仲汪伯彥等引克家捧寶跪進王謙拒再三慟哭不受命伯彥司之監察御史馬伸上書請張邦昌易服歸省庶事稟取太后命令而後行仍速迎奉康王歸京庶幾中外釋疑轉禍為福且曰如以伸言為不然即先次就戮伸有死而已必不敢輔相公為宋朝叛臣也邦昌讀其書氣沮戊辰降手書請元祐皇后垂簾聽政以俟復辟書既下中外犬悅追回諸路赦文并毁所立宋太后手書不用元祐皇后遣尚書左丞馮澥為奉迎使權尚書右丞李回副之持詔往濟州迎康王王覽書命移檄諸道帥臣具言張邦昌恭順之意以未得至京已至者毋輒入庚午太后御內東門小殿垂簾聽政張邦昌以太宰退處資善堂羣臣詣祥曦殿起居太后畢邦昌服紫袍獨班歸兩府幕次自僣位號至是凡三十三日壬申在京文武百官上表康王勸進宗澤亦以狀申請王不許甲戌太后手書告天下曰比以敵國興師都城失守祲纒宫闕既二帝之蒙塵禍及宗祊思三靈之改卜衆恐中原之無統姑令舊弼以臨朝扶九廟之傾危免一城之慘酷乃以衰癃之質起於間廢之中迎至宫闈進加位號舉欽聖已還之典成靖康欲復之心永言運數之屯坐視家邦之覆撫躬獨在流涕何從緬惟藝祖之開基實自高穹之眷命歷年二百人不知兵傳序九君世無失德雖舉族有北轅之釁而敷天同左袒之心乃眷賢王越居近服己徇羣臣之請俾膺神器之歸繇康邸之舊藩嗣宋朝之大統漢家之厄十世宜光武之中興獻公之子九人唯重耳之尚在兹為天意夫豈人謀尚期中外之協心同定安危之至計庶臻小愒漸砥丕平用敷告於多方其深明於吾志太常少卿汪藻所草也乙亥以資政殿學士路允迪為奉請車駕進發使右諌議大夫范宗尹副之戊辰康王次新興店辛巳次單州壬午次虞城縣張邦昌言謝克家回恭聞車駕自有合辦輿服儀物之屬百官有司各以其職並宜發赴南京以俟册禮畢遂建朝廷以出號令從之癸未康王次應天府甲申詣鴻慶宫謁三殿御容哭移時翼日王時雍徐秉哲奉乘輿服御至南京乙酉張邦昌繼至伏地慟哭王撫慰之資治通鑑後編卷一百四
