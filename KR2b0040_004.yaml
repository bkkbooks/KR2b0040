body:
  text: 資治通鑑後編卷四刑部尚書徐乾學撰宋紀四起閼逢困敦正月盡桑兆攝提格十二月凡二年太祖啓運立極英武睿文神德聖功至明大孝皇帝乾德二年春正月辛巳大雨雪震雹甲申帝以選人食貧者衆詔吏部流內銓聽四時參選仍命翰林學士承㫖陶穀等與本司官重詳定循資格及四時參選條宰相范質王溥魏仁浦等再表求退戊子以質為太子太傅溥為太子太保仁浦為左僕射皆罷政事質在相位所下制敕未嘗破律命刺史縣令必以戶口版籍為急使者視民田按獄訟皆召見為述天子憂勤之意乃遣之時號賢相庚寅以樞密使趙普為門下侍郎平章事集賢院大學士宣徽北院使判三司上黨李崇矩崇矩初見廣順元年為檢校太尉充樞密使帝既除普及崇矩乃無宰相署敕帝時在資福殿普因入奏其事帝曰卿但進敕朕為卿署字可乎普曰此有司所行非帝王事也乃使問翰林學士求故實陶穀建議以為自古輔相未嘗虛位唯唐太和中甘露事後數日無宰相時左僕射令狐楚等奉行制書今尚書亦南省長官可以署敕竇儀曰穀所陳非承平令典不足援據今皇弟開封尹同平章事即宰相任也帝從儀言壬辰詔先所置賢良方正能直言極諫經學優深可為師法詳間吏理逹於教化等三科並委州府解送吏部試論三道限三千字以上而自曩及今未有應者得非抱倜儻者恥肩於常調懷讜直者難效於有司必欲興自朕躬乎繼今不限內外職官前資見任布衣黃衣並許詣閣進狀朕親試焉壬寅敕趙普監修國史乙巳禁民越訴丁未詔縣令簿尉非公事毋至村落二月戊申朔翰林學士竇儀等上新定四時參選條件北漢遼州刺史杜延韜以城來降癸丑遣使賑陜州饑命右武統軍陳承昭帥丁夫數千鑿渠自長社引潩水出密合閔河潩水出密之大騩山歷許田會春夏霖雨則大溢害稼及渠成民無水患閔河之漕益通流焉三月乙未北漢耀州團練使周案玉等來降辛丑上明憲皇太后諡曰昭憲皇后賀氏諡曰孝惠王氏諡曰孝明夏四月戊申賑河中饑己酉免諸道今年夏稅之無苖者乙卯改葬宣祖昭武皇帝昭憲皇后於安陵孝惠皇后賀氏孝明皇后王氏祔焉帝欲為趙普置副而難其名稱召翰林學士承㫖陶穀問曰下丞相一等者何官對曰唐有參知機務參知政事乙丑以兵部侍郎薛居正吕餘慶並本官參知政事不宣制不押班不知印不升政事堂止令就宣徽使㕔上事殿庭别設磚位於宰相後敕尾署銜降宰相數字月俸雜給皆半之蓋帝意未欲令居正等與普齊也考異李燾曰太宗實録云普在相位幾十年獨斷政事太祖疑其專恣欲用薛居正吕餘慶為相普惡其與己同列但令參知政事於宣徽㕔赴上位在丞相後但奉行制書不得預奏事以明其異等中書印唯宰相得知事無大小盡决於普居正等恐栗備位而已大祖患之會為趙玭所訐盧多遜又旦夕攻之雷有鄰訟中書不法事太祖因令居正等知印押班以分普權按置參政乃陶穀議且此時太祖方獨任普未始厭其專恣也今不取又大祖新録竇儀傳太祖屢對大臣稱儀有執守欲用為相趙普忌儀剛直遽引薛居正參知政事據此則居政乃普所引非太祖意也足明太宗實録所書非實然新傳謂普抑儀舊傳亦無之恐普未必然也李沆曰按唐故事裴寂為僕射知政事杜淹為御史大夫參議朝政魏徵為祕書監參豫朝政蕭瑀為特進參議政事劉洎為黃門侍郎參知政事劉幽求為中書舍人參知機務然並宰相之任也又高宗嘗欲用郭待舉等參知政事既而謂崔知溫曰待舉等歷任尚淺未可與卿等同名稱遂令於中書門下同承受進止平章事以此言之平章事亞於參知政事矣今穀不能逺引漢御史大夫亞相故事為對翻以參知政事為丞相下一等穀失之矣壬申徒永州諸縣民之畜蠱者三百二十六家於縣之僻處不得復齒於鄉以秦再雄為辰州刺史再雄辰州徭人武健有竒略素為蠻黨畏服帝召至汴察其可任擢為刺史使自辟吏子以租賦再雄至州日訓土兵得三千人能被甲渡水歷水飛塹又遣人分使諸蠻傳朝廷懷來之意降附日衆自是荆襄無復邊患五月己卯知制誥髙錫坐受藩鎮賂貶萊州司馬辛巳宗正卿趙礪坐贓杖除籍六月左僕射王溥數勸其父宿州防禦使祚祚初見顯德四年請老祚不得已乃上章己未以祚為左領軍衛上將軍致仕祚大罵溥曰我筋力未衰汝欲自固名位而幽囚我舉大梃將擊之親戚勸諭乃止御史臺太常禮院奏東宫三師臣一品與僕射等若百官上表未知所先詔兩制議之戊辰翰林學士竇儀等奏僕射帥長百僚東宫三師臣太子之官當以僕射為表首從之己酉以光義為中書令光美同中書門下平章事子德昭貴州防禦使故事皇子出閣即封王帝以德昭未冠特殺其禮七月詔曰惟彼銓衡止憑資歷慮有英俊沉於下僚自今常調赴集選人委吏部南曹取歷任中多課績而無闕失者當與量材甄叙冨弼曰祖宗朝吏部南曹之任不專於循守常格所以拔擢材能有古銓選之體也辛卯詔陶穀等四十三人考異竇訓作四十七人未知孰是今從長編各於見任幕職京官及州縣中舉堪為藩郡通判者一人職任乖方事狀連坐冨弼曰祖宗朝舉官不限資考是取人之路寬事無大小皆坐舉主是責舉主之法密今除入已贓外皆不坐其法踈矣甲午令藩鎮無以初官為掌書記須歷兩任有文學者乃許奏辟九月甲戌朔周易博士奚嶼責乾州司戶庫部員外王貽孫責左贊善大夫並坐試任子不公也乙未幸北郊觀稼辛丑太子太傅魯國公范質卒質寢疾帝數幸其第臨視又令內夫人問訊質家迎奉器皿不具內夫人奏之帝即命翰林司賜以果牀酒器復幸其第謂曰卿為宰相何自苦如此質對曰臣曩在中書門無私謁所與飲酌皆貧賤時親戚安用器皿因循不置非力不及也質以亷介自持而性卞急好面折人過嘗謂同列曰人能鼻吸三㪷醇醋斯可為宰相矣五代以來宰相多取給於方鎮質始絶之所得祿賜遍及孤寡疾革戒其子旻毋請諡毋刻墓碑及卒帝甚悼惜之贈中書令賻賚甚厚後謂左右曰朕聞范質居第之外不殖資産真宰相也太宗亦素重質常對近臣稱纍朝宰相以為循規矩重名器持亷節無出質右者但缺世宗一死為可惜耳壬寅潘美等克郴州初南漢內常侍邵廷琄言於其主曰漢承唐亂居此五十餘年幸中國多故干戈不及而吾益驕於無事今兵不識旗鼓人主不知存亡請飭兵備且通好於宋鋹不能用至是始懼以廷琄為招討使既克郴獲內侍余延業帝訪其國政延業具言其主殘刑暴斂及珠寶飾宫殿課民供宴犒狀帝驚曰吾當救此一方民時方謀下蜀未遑也帝素謀伐蜀會蜀山南節度判官張廷偉說知樞密院事王昭逺曰公素無勳業一旦位至樞近不自建立大功何以塞時論莫若通好并州令發兵南下我自黃花子午谷出兵應之使中原表裏受敵則關右之地可撫而有也昭逺然其言勸蜀主遣孫遇趙彥韜楊蠲等以蠟丸帛書間行遺北漢主帛書言已於褒漢增兵約北漢濟河同舉遇等至都下彥韜潜取其書以獻有穆昭嗣者初以方伎事髙氏於是為翰林醫官帝數召問蜀中地理昭嗣曰荆南即西川江南廣南都會也今已克此則水陸皆可趨蜀帝大悅後數日得彥韜所獻書笑曰吾西討有名矣并赦遇蠲使指陳山川形勢戍守處所道里逺近畫圖以進考異李燾曰五代史實録皆言孫遇為邊吏所獲蓋因詔書也其實不然十一月甲戌命忠武節度使王全斌為西川行營鳳州路都部署武信節度使崔彥進副之樞密副使王仁贍為都監寧江節度使劉光義為歸州路副都部署考異案宋史王全斌與劉光義皆為都部署陳桱亦云全斌光義為都部署惟長編以光義為副都部署王宋沐宋元通鑑亦云副之今悉從長編樞密承㫖曹彬為都監合步騎六萬分路進討給事中沈義倫為隨軍轉運使均州刺史大名曹翰為西南面轉運使翰初見顯德元年王仁贍以樞密副使為行營都監在節度使下蓋此時西府品秩殊未崇也帝諭行營所至毋得焚蕩廬舍驅略吏民開發邱墳翦伐桑柘違者以軍法從事命八作司度右掖門南臨汴水為蜀主治第以待其至乙亥全斌等辭宴於崇德殿帝出畫圖授全斌等因謂曰凡克城寨止籍其器甲芻糧悉以錢帛分給戰士吾所欲得者其土地耳遼主遊畋無度或浹旬竟月而忘返壬午日南至宴飲逹旦自是晝寢夜飲蜀主聞有北師命王昭逺為北面行營都統趙崇韜崇韜初見顯德二年庭隱子庭隱見長興元年為都監韓保貞保貞初見乾祐元年為招討使李進進初見顯德二年為副招討使帥兵拒戰蜀主謂昭逺曰今日之師卿所召也勉為朕立功昭逺頗以方略自許始發成都蜀主命宰相李昊等餞之城外昭逺手執鐡如意指揮軍事自比諸葛亮酒酣攘臂謂昊曰吾此行何止克敵當領此二三萬雕面惡少兒取中原如反掌耳冬十二月辛酉王全斌等攻拔乾渠渡萬仭燕子等寨遂取興州敗蜀兵七千人獲軍糧四十餘萬斛其刺史藍思綰退保西縣全斌又攻石圌魚關白水關二十餘寨皆拔之蜀韓保貞聞興州破遂棄山南退保西縣馬軍都指揮使史延德以先鋒至保貞懦懼不敢出遣兵數萬人依山背城結陳自固延德擊走之追擒保貞及其副李進獲糧三十餘萬斛崔彥進與馬軍都監康延澤等逐北過三泉遂至嘉州殺獲甚衆蜀軍燒絶棧道退保葭萌劉光義等入峽路連破松木三會巫山等寨殺其將南光海等死者五千餘人考異宋史斬南光皮等八千餘級今從長編生禽戰棹都指揮使袁德宏等奪戰艦二百餘艘又斬獲水軍六千餘衆初蜀於䕫州鎖江為浮梁上設敵棚三重夾江列炮具光義等行帝出地圖指其處謂光義曰泝江至此切勿以舟師爭勝當先遣步騎潛擊之俟其稍却乃以戰棹夾攻可必取也光義等未至鎖江三十里許捨舟前逹浮梁復引舟而上遂破州城頓兵白帝城西蜀寧江節度使太原高彥儔彥儔初見顯德二字謂副使趙崇濟監軍武守謙曰北軍涉險逺來利在速戰宜堅壁待之守謙曰冦據吾城下而不擊又何待也戊辰守謙獨領麾下千餘人以出光義遣馬軍都指揮使張廷翰等引兵與守謙等戰於猪頭鋪守謙敗走廷翰等乘勝登其城拔之彥儔力戰不勝身被十餘槍左右皆散去彥儔奔歸府第拒戶整衣冠望西北再拜登樓縱火自焚後數日光義等得其骨於灰燼中以禮葬之考異李燾曰九國志云王師壞門而入彥儔挺劍拒之殺數十餘人乃登樓縱火自焚而死十國紀年亦云今不取王全斌以蜀人斷棧大軍不得進議取羅川路入蜀康延澤潛謂崔彥進曰羅川路險衆難並濟不如分兵修棧約會大軍於深渡彥進遣白全斌許之不數日閣道成遂進擊金山寨又破小漫天寨而全斌亦以大軍由羅川至深渡與彥進會蜀人依江而陳彥進遣步軍都指揮使張萬友等擊之奪其橋㑹暮夜蜀人退保大漫天寨明日彥進延澤萬友分兵三道擊之蜀人悉其精鋭來拒又大破之乘勝拔其寨擒寨主義州刺史王審超監軍趙崇渥三泉監軍劉延祚大將王昭逺趙崇韜引兵來戰三戰三敗追奔至利州北昭逺等遁去渡桔柏津焚浮梁退保劔門壬申晦全斌等入利州考異宋史云三年正月壬午全斌取利州東都事略云三年正月克利州皆非是今不取獲軍糧八十萬斛考異李燾曰九國志十國紀年蜀檮杌皆言蜀人雖燒棧道而江水淺涸岸路平濶王師皆徒涉而進與國史不同事恐不然今不取實録載大漫天之戰全斌擒其寨主王審超監軍趙崇渥三泉監軍劉延祚全斌本傳乃云趙崇渥逃出復與三泉監軍劉延祚及王昭逺等來戰按明年正月己丑實録書軍前部送大漫天寨主王審超監軍趙崇渥則似同時執獲也今從實録是月京師大雪帝設氊帷於講武殿衣紫貂裘帽視事忽謂左右曰我被服如此體尚覺寒西征將帥衝犯霜霰何以堪此即解裘帽遣中黃門馳驛齎賜全斌且諭㫖諸將以不能遍及也全斌拜賜感泣唐主酷信浮屠法出禁中金錢募人為僧時都下僧及萬人皆仰給縣官唐主退朝與后服僧衣誦佛書拜跪手足成贅僧有罪命禮佛而釋之帝聞其惑乃選少年有口辨者南渡見唐主論性命之說唐主信之謂之一佛出世由是不復以治國守邊為意詔江北許諸州民及諸監鹽亭戶緣江採捕及過江貿易先是江北置𣙜場禁商人渡江及百姓緣江採樵是嵗以江南薦饑特弛其禁三年春正月癸酉朔以出師不御殿蜀主聞王昭逺等敗甚懼乃益募兵守劍門命太子𤣥哲為元帥侍中李廷圭廷圭初見天福十二年同平章事張惠安副之帶甲萬餘旗幟悉用文繡綢其杠以錦將發而雨𤣥哲慮其沾濕悉令解去俄雨止復斾之則皆倒懸杠上𤣥哲又輦其姬妾及伶人數十以從見者莫不竊笑王全斌等自利州趨劔門次益光以劍門天險會議進取之䇿侍衛軍頭向韜曰降卒言益光江東越大山數重有狹徑名來蘇蜀人於江西置寨對岸有渡自此出劍門南二十里至青彊店與官道合若大軍行此路則劍門之險不足恃也全斌等即欲卷甲赴之康延澤曰蜀人數戰數敗膽氣奪矣可急攻而下也然來蘇狹徑主帥不須自行但可遣一偏將往耳若抵青彊北與大軍夾擊劔門昭逺等必成擒矣全斌等然之命史延德分兵趨來蘇跨江為浮梁以濟蜀人見之棄寨而遁延德遂至青彊王昭逺等引兵退駐漢原坡留其偏將守劍門全斌等以鋭兵奮擊破之及漢原趙崇韜布陳䇿馬先登昭逺據胡牀股栗不能起崇韜戰敗猶手斬數人乃被執昭逺免胄棄甲而逃甲戌全斌等遂取劔州殺蜀軍萬餘人昭逺投東川匿民舍悲嗟流涕目盡腫惟誦羅隱詩曰運去英雄不自由俄為追騎所獲乙亥詔瘞征蜀戰死士卒被傷者給繒帛蜀太子𤣥哲與李廷圭等日夜嬉遊不恤軍政至綿州聞劍門已破遂退保東川所過盡焚其廬舍倉廪乃去蜀主知劔州已破𤣥哲亦奔還惶駭不知所為問左右計將安出有老將石頵者對曰宋師逺來勢不能久請聚兵堅守以弊之蜀主嘆曰吾父子以豐衣美食養士四十年一旦遇敵不能為吾東向發一矢今雖欲閉壁誰肯效死者司空平章事李昊勸蜀主封府庫以請降蜀主從之因命昊草表己卯正月七日也據孟昶後所上表云爾遣通奏使伊審徴審徴初見廣順元年奉降表詣軍前初前蜀之亡也降表亦昊所為蜀人夜書其門曰世修降表李家乙酉王全斌等次魏城伊審徴以蜀主降表至全斌受之遣通事舍人田欽祚乘驛入奏又遣康延澤趨成都見蜀主諭以恩信慰撫軍民初劉光義等發䕫州萬施開忠遂等州刺史皆迎降考異宋史在正月癸巳長編東都事略皆無日今從之光義入城盡以府庫錢帛給軍士諸將所過咸欲屠戮獨曹彬禁之乃止故峽路兵始終秋毫無犯帝聞之喜曰吾任得其人矣賜彬詔褒之戊子吏部郎中鄧守中試諸司吏書判不當帝命覆試黜數人責守中本曹貟外冨弼曰郎官試數吏不實而削三官恩不濫授罰不茍免必行而已矣辛卯王全斌等至升仙橋蜀主備亡國之禮見於軍門全斌承制釋之蜀主復遣其弟雅王仁贄奉表求哀仁贄初見乾祐三年考異李燾曰九國志孟昶世家及蜀傳檮杌皆曰全斌承制釋昶罪昶翌日遂舉族歸朝據國史昶傳昶既見全斌復遣仁贄奉表得太祖還詔乃出蜀又據全斌傳全斌等入成都後十餘日劉光義始自峽路至昶饋遺光義及犒其師並如全斌等若全斌十九日入成都昶二十日遂行安能饋光義且犒其師也然所稱後十餘日亦恐差悮按新録光義遂州之奏以二十一日到京師度其克遂州時必在中旬初遂州距成都不逺無緣滯留兩月後始到也當是全斌等於魏城得昶降表後十餘日再得降表後十餘日乃二十三四間此時昶固未出蜀猶可以饋遺光義且犒其師也錦里耆舊傳云二月四日光義入城續傳又云十一日也南路大軍始入城前傳差近之續傳比全斌傳又增十餘日矣今皆不取昶舉族歸朝疑在丁酉赦書到後不然二月間與僞官同發恐不能待仁贄還詔矣續耆舊傳云二月十九日離成都自眉州乘船下峽前傳云十七日兩說又不同莫知孰是或者全師雄作亂二月間道路不通少留眉州三月上旬末始能下峽乎仁贄以正月十九日赴闕二月十九日見昶復上表謝不名及呼國母則三月七日也丙申田欽祚至自西川孟昶降表以其先人墳廟及老母為請帝優詔答之并諭西川將吏百姓使皆安堵丁酉赦蜀管內蠲乾德二年逋租賜今年夏稅之半除無名科役及增益賦調減鹽價賑乏食還俘獲生口自全斌等發京師至昶降才六十六日凡得州四十六縣二百四十戶五十三萬四千二十九口全斌既平蜀欲乘勝取雲南以圖獻帝鍳唐之禍以玉斧畫大渡以西曰此外非吾有也全斌等入成都後數日劉光義等始至孟昶饋遺光義等及犒師之禮並如初已而詔書頒賞諸軍亦無差降兩路將士爭功始相疾矣先是全斌受詔每制置必與諸將僉議因是各為異同雖小事亦不能即决全斌及崔彥進王仁贍等日夜飲宴不恤軍務縱部下劫掠子女貨財蜀人苦之曹彬屢請旋師全斌等不聽二月壬寅朔日當食不食癸卯命參知政事吕餘慶權知成都府樞密直學士馮瓉權知梓州考異李燾曰舊録在正月丁酉丁酉二十五日也今從新録及本紀續耆舊傳云餘慶以二月十二日到十二日癸丑也恐此時餘慶亦未能到但除目到耳餘慶至成都時盜賊四起將士恃功驕恣王全斌等不能禁一日藥市始集街吏馳報有軍校被酒持創奪賈人物餘慶立命擒捕斬之以徇軍中畏伏民乃寧居瓚至梓州視事才數日㑹僞蜀軍校上官進嘯聚亡命三千餘衆劫村民數萬夜攻州城瓚曰賊乘夜奄至此烏合之衆必無固志宜持重以鎮之旦自潰矣時城中兵止三百令分守諸門瓉坐城樓密促其更籌未夜分擊五鼓賊驚遁去因縱兵追之擒進斬於市招降千餘人並釋其罪州境遂安以蜀興州馬步軍都指揮使趙彥韜為興州刺史酬其鄉導功也丙午詔以西師所過民有調發供億之勞賜秦鳳隴成階襄荆南房均等州今年夏租之半安復郢鄧州光化漢陽軍十之二居坊郭者勿輸半年屋稅庚申孟仁贄至自成都孟昶所上表有自量過咎尚切憂疑等語詔答之略曰既自求於多福當盡滌其前非朕不食言爾無過慮詔仍不名又呼昶母為國母三月孟昶與其官屬皆挈族歸朝由峽州而下考異李燾曰據實録此月戊寅孟昶上表謝詔書不名及呼國母戊寅初七日也昶傳稱昶得太祖還詔乃赴闕故隱度附見其事於此月然續耆舊傳云二月十九日離府自眉州乘船下峽㳂路多值冦盜蓋二月十九日初發成都其發眉州則續傳無其日或少留滯不可知也得還詔乃赴闕疑本傳必不妄因附其事於此月初詔發蜀兵赴闕並優給裝錢王全斌等擅減其數仍縱部曲侵撓之蜀兵憤怨行至綿州遂作亂劫屬縣以叛推蜀舊將全師雄為帥衆至十餘萬號興國軍全斌遣馬軍都監朱光緒往招撫之光緒盡滅師雄之族納其愛女及橐裝師雄怒遂無歸志引衆急攻綿州不克攻破彭州入據之成都十縣皆起兵應師雄師雄自號興蜀大王開幕府置節度二十餘人分據要害崔彥進高彥暉等分道攻討為師雄所敗彥暉戰死賊衆益熾師雄分兵斷劍閣緣江置寨聲言欲攻成都自是隨師雄為亂者十六七州郵傳不通全斌等大懼自唐天寶以來方鎮屯重兵多以賦入自贍名曰留使留州其上供殊鮮五代方鎮益彊率令部曲主場院厚斂以自利其屬三司者補大吏以臨之輸額之外輒入已或私納貨賂名曰貢奉用冀恩賞帝始即位猶循前制牧守來朝皆有貢奉及趙普為相勸革去其弊是月申命諸州度支經費外凡金帛悉送都下無得占留去年已有此詔故此云申命又方鎮闕帥稍命文臣權知所在場院間遣京朝官廷臣監臨復置轉運使通判條禁文簿漸為精密由是利歸公上而外權削矣國初貢賦悉入左藏庫及取荆湖下西蜀儲積充羡帝顧左右曰軍旅饑饉當豫為之傋不可臨事厚斂於民乃於講武殿後别為內庫以貯金帛號曰封樁庫凡嵗終用度贏餘之數皆入焉别置庫本志及他書皆云在乾德初未審何年計必是平西川後也因命諸州不得占留金帛附見其事夏四月癸丑職方員外郎李嶽坐贓棄市癸亥導五丈河貫宫城歷後苑內庭池沼水皆至焉初王全斌慮蜀降兵為亂徙置成都夾城中至是諸將欲盡殺之康延澤請簡老幼疾病七千人釋之餘以兵衛還浮江而下賊若來劫奪殺之未晚諸將不從死者共二萬七千餘人先是帝遣使以御府供帳迓孟昶於江陵且命有司為昶官屬治第又遣使至江陵分給鞍馬車乘五月乙酉昶至近郊開封尹光義勞之玉津園丙戌大陳諸軍於闕前昶與弟仁贄子𤣥珏𤣥珏初見乾祐三年宰相李昊等三十三人素服待罪明德門外詔釋罪賜昶等襲衣冠帶帝御崇元殿備禮見之禮畢御明德門觀諸軍按部還營遂宴昶等於大明殿賜物有差六月甲辰以孟昶為開府儀同三司檢校大師兼中書令秦國公庚戍昶卒上為輟五日朝贈尚書令追封楚王諡恭孝考異蜀檮杌作恭惠今從宋史賻布帛千匹葬事官給初昶母李氏隨昶至京師帝數命肩輿入官謂之曰國母善自愛無戚戚懷鄉土異日當送母歸李氏曰使妾安往帝曰歸蜀耳李氏曰妾家本太原倘獲歸老并門妾之願也時帝已有北征意聞其言喜曰俟平劉鈞即如母所願因厚加賚賜及昶卒李氏不哭舉酒酹地曰汝不能死社稷貪生至今日吾所以忍死者為汝在耳今汝既死吾安用生因不食數日亦卒劉光義曹彬等屢破全師雄賊鋒稍衄未幾虎捷指揮使吕翰又以嘉州叛與師雄僞署將劉澤合衆至五萬殺逐刺史通判曹翰率兵會仁贍等圍翰於嘉州翰棄城走追襲大破之殺戮數萬人翰走保雅州秋七月帝聞西川行營有大校割民妻乳而殺之者亟召至闕斬於都市初近臣營救頗切帝因流涕曰興師弔伐婦人何罪而殘忍至此當速置法以償其寃南漢主鋹殺其招討使邵廷琄廷琄屯洸口招輯亡叛訓士卒修戰備國人賴以少安或譖廷琄將圖不軌鋹信之賜廷琄死珍州刺史田景遷內附八月己酉詔以西川兵馬都監康延澤為普州刺史延澤詣王全斌請兵護送全斌才給以百人延澤至簡州招集亡叛凡得千餘人教習戰陳擁以去及賊境揭示威信所招集又得三千人遂破劉澤三萬餘衆賊勢消沮辛酉以左散騎常侍歐陽炯為翰林學士炯性坦率無檢束雅善長笛帝聞召至便殿奏曲考異宋史孟氏世家作歐陽迥長編作炯按迥乃炯字之訛迥炯音同未知孰是今姑從長編御史中丞劉溫叟聞之叩殿門求見諫曰禁署之職典司誥命不可作伶人事帝曰孟昶君臣溺於聲樂炯至宰相尚習此伎故為我擒所以召炯欲驗言者之不誣耳自是遂不復召溫叟嘗晚過明德門西闕前帝方與中黃門數人登樓騶者潛知之以白溫叟溫叟令傳呼依常而過翌日請對具言人主非時登樓則近侍咸望恩宥輦下諸軍亦希賞給臣所以呵導而過者欲示衆以陛下非時不登樓也帝善之九月己巳帝御講武殿閲諸道兵得萬餘人名馬軍曰驍雄步軍曰雄武並屬侍衛司十一月丁卯朔康延澤入普州先是州城悉被焚蕩乃依山設栅且行且戰取糧於遂州復城普州既而劉澤領衆來降詔以延澤兼東川七州招安巡檢使祕書監判大理寺尹拙等言後唐劉嶽書儀稱婦為舅姑服三年與律不同然亦凖敕行用請别裁定之詔百官集議右僕射魏仁浦等奏議曰謹按禮內則云婦事舅姑如事父母舅姑與父母一也古禮有朞年之說雖於義可稽書儀著三年之文實在禮為當蓋五服制度前代增益已多只如嫂叔無服唐太宗令服小功曽祖父母舊服三月增為五月嫡子婦大功增為期衆子婦小功增為大功父在為母服期高宗增為三年婦人為夫之姨舅無服明皇令從夫而服又增姨舅同服緦麻又堂姨舅服袒免訖令遵行遂為典制况三年之內几筵尚存豈可夫衣衰粗婦襲紈綺夫婦齊體哀樂不同求之人情實傷至治况婦為夫有三年之服於舅姑止服期年是尊夫而卑舅姑也且昭憲皇太后喪孝明皇后親行三年之服可以為萬代法十二月丁酉朔始令婦為舅姑三年齊斬一從其夫己亥詔西川管內監軍巡檢毋預州縣事四年春正月丁亥命丁德裕等率兵巡撫西川二月安國節度使羅彥瓌等敗北漢兵於靜陽擒其將鹿英甲子免西川今年夏稅及諸徴之半田不得耕者盡除之三月癸酉罷義倉夏四月壬子罷光州貢鷹鷂丁巳遼天德軍節度使于延超率其子來降進士李藹坐毁釋氏辭不遜黥杖配沙門島是月知光化軍張全操上言三司令諸處場院主吏有羡餘粟及萬石芻五萬束以上者上其名請行賞典帝曰此茍非倍納民租私減軍食何以致之冝追寢其事勿復頒行除官所定耗外嚴加止絶初帝遣右拾遺孫逢吉至成都收蜀圖書法物五月乙亥逢吉還所上法物皆不中度悉命焚毁圖書付史館孟昶服用奢僣至於溺器亦裝以七寶帝遽命碎之曰自奉如此欲無亡得乎帝躬履儉約常衣浣濯之衣乘輿服用皆尚質素寢殿設青布緣葦簾宫闈帟幕無文采之飭常出麻屨布裳賜左右曰此吾舊所服用也開封尹光義因侍宴禁中從容言陛下服用太草草帝正色曰爾不記居甲馬營中時耶帝初改今元命宰相撰前世所無年號以進既平蜀蜀宫人有入掖庭者帝閲其奩具得舊鑑鑑背有乾德四年鑄字帝大驚出鑑以示宰相皆不能答乃召學士陶穀竇儀問之儀曰此必蜀物昔僞蜀王衍有此號當是其所鑄也耆舊續聞云江南保大中浚秦淮得石志按其刻有大宋乾德四年凡六字他皆磨滅不可識令諸人參驗乃輔公祏反江東時年號然則竇儀又不知輔公祏已有此號矣帝乃歎曰宰相須用讀書人由是益重儒臣趙普初以吏道聞寡學術帝每勸以讀書普遂手不釋卷帝性嚴重寡言獨喜觀書雖在軍中手不釋卷聞人間有竒書不吝千金購之顯德中從世宗平淮甸或譖帝於世宗曰下夀州時私所載凡數車皆重貨也世宗遣使驗之盡發籠篋惟書數千卷無他物世宗亟召帝諭曰卿方為朕作將帥闢封疆當務堅甲利兵何用書為帝頓首曰臣無竒謀上贊聖德濫膺寄任常恐不逮所以聚書欲廣聞見增智慮也世宗曰善六月詔人臣家不得私養宦者內侍年三十以上方許養一子士庶敢有閹童男者不赦王全斌破賊帥全師雄於灌口寨擒其黨二千人師雄以衆趨金堂秋七月丙寅以嵗穰詔州縣長吏勸民儲積節儉無游惰及禁民蒱博禁將帥取軍中精卒為牙兵戊辰西南夷首領董皓等內附甲戌以前永州刺史晉陽安守忠為漢州刺史守忠初護屯田兵於河隂蜀平帝召守忠謂曰逺俗苛虐南城走集之地卿為朕撫和之即遣守忠權取興元於是移守漢州時大兵未還供億倍費公帑不足守忠助以私錢帝每遣使必戒之曰安守忠在蜀能自律己汝行見之當效其為人壬午遼主諭有司凡行幸之所必髙立標識令民勿犯違者以死論是月以孔子四十四代孫宜為曲阜縣主簿宜舉進士不中因上書述其家世特命之八月辛丑召宰相樞密使開封尹翰林學士竇儀知制誥王祐等宴紫雲樓下因論及民事帝謂宰相趙普等曰下愚之民雖不分菽麥如藩侯不為撫養務行苛虐朕斷不容之普對曰陛下愛民如此乃堯舜之用心也考異李燾曰會要以為乾德元年八月九日今從實録本紀竇儀元年十一月乃為學士王祐三年二月乃知制誥安得元年八月二人便以兩制預宴會要誤記耳庚戌樞密直學士馮瓉凌錦副使李美殿中侍御史李楫為宰相趙普陷贓論死會赦流沙門島逢恩不還丙辰河決滑州壞靈河縣大隄發士卒丁夫數萬人治之被泛者蠲其秋租閠月詔求亡書凡吏民有以書籍來獻者令史館視其篇目館中所無則收之獻書人送學士院試問吏理堪任職官者以聞是嵗三禮涉弼三傳彭幹學究朱載皆應詔獻書分置書府賜弼等科名甲子以灌口鎮為永康軍王全斌言破賊帥吕翰克雅州考異東都事略載本年七月甲寅克雅州長編繫於閏八月蓋以捷書到日為據也姑從之乙丑河溢入南華縣乙亥詔民能樹藝桑棗墾闢荒田者不加征令佐能勸來者受賞考異東都事略載此詔於七月今從宋史九月壬辰朔虎捷指揮使孫進龍衛指揮使吳瓌等二十七人坐黨吕翰亂伏誅族進家丙午詔吳越立禹廟于會稽西川戍卒多亡命在賊黨中或請按誅其妻子帝語樞密使李崇矩曰朕慮其間有被賊驅脅者非本心也乃盡釋弗誅冬十月辛酉朔詔太常寺自今大朝會復用二舞先是中原多故禮樂之器浸廢帝始命判太常寺和峴講求修復之别造宫懸三十六􅒶設於庭登歌兩架設於殿又置鼓吹十二桉及舞人所執旌纛干戚籥翟等與其服皆如舊制又以雅樂聲高近於哀思命峴討論峴上疏謂西京銅望臬可校古法即今司天臺影表上石尺是也取王朴所定尺校短於石尺四分樂聲之髙蓋由此帝乃令依古法别造新尺并黃鍾九寸之管使工人校其聲果下於朴所定管一律又內出上黨羊頭山秬黍纍尺校律亦相契合遂重造十二律管以取聲由是雅樂音始和暢癸亥詔諸郡立古帝王陵廟置戶有差己巳禁吏卒以巡察擾民十一月癸巳日南至帝御乾元殿受朝畢常服御大明殿羣臣上壽初用雅樂登歌及文德武功二舞諸州所置通判多與長吏忿爭常曰我監州也朝廷使我來監汝長吏舉動多為所制或言其太甚宜抑損之乙未詔諸州通判無得怙權徇私須與長吏連署文移方許行下考異李燾曰㑹要云時以僞官初録用慮未悉事故有是命本紀詔語亦與會要略同惟新録不然今從新録仍以歐陽修歸田録附益之癸丑翰林學士禮部尚書竇儀卒帝以儀在滁州時弗與親吏絹事在顯德三年三月每嘉其有執守屢對大臣言欲用為相及趙普專政帝患之欲聞其過召儀語及普多不法且譽儀早負才望儀盛言普開國元勳公忠亮直帝不說儀歸語諸弟曰我必不能作宰相然亦不詣朱崖吾門可保矣普素忌儀剛直引薛居正吕餘慶參知政事陶穀趙逢高錫等又相黨附共排儀帝意中輟至是卒帝憫然曰天何奪我竇儀之速也優詔贈右僕射儀學問優博風度峻整弟儼侃稱僖皆有才名相繼登科時號為竇氏五龍癸丑寬鹽禁十二月庚辰妖人張龍兒等二十四人伏誅族龍兒李玉楊密聶贇家丁德裕同西川兵馬都監張延通帥師破賊擒其僞都統康祚磔於市康延澤既城普州王可璙復合數州兵來攻延澤擊走之追奔至合州全師雄病死金堂德裕及王全斌等分往招緝賊衆悉平是月北漢復取遼州韃靼入貢韃靼本東北靺鞨之别種唐元和後徙隂山至是來貢資治通鑑後編卷四
