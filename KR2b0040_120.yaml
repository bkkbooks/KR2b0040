body:
  text: 資治通鑑後編卷一百二十刑部尚書徐乾學撰宋紀一百二十起重光大荒落十一月盡𤣥黓敦牂十二月凡一年有二月髙宗受命中興全功至德聖神武文昭仁憲孝皇帝紹興三十一年十一月己巳朔邵宏淵遣統領崔皋及金人戰于定山敗之壬申以知潭州張浚判建康府召王權還以李顯忠代將其軍時劉錡病甚求解兵柄留其姪中軍統制劉汜以千五百人塞瓜洲李橫以八千人固守詔錡還鎮江金人攻瓜洲汜以克敵弓射却之葉義問至鎮江見錡病劇以橫權錡軍督兵渡江衆以為不可義問彊之汜請出戰錡不從汜拜家廟而行金人鐵騎奄至江上汜先退橫以孤軍不能當亦却失其都統制印橫左軍統制魏俊右軍統制王方死之橫汜僅以身免義問聞之惶怖退走由陸路趨建康市人皆媟罵之金人遊騎至無為軍守臣韓髦棄城走庚午金左司郎中鄂博庫等聞赦入白東京即位改元事金主拊髀歎曰朕本欲滅宋後改元大定此豈非天乎因出其素所書以示羣臣即預志改元事取一戎衣天下大定也是日以勸農使完顔元宜為浙西道兵馬都統制刑部尚書郭安國副之乙亥金主臨江築臺自被金甲以登刑白黑馬祭天投羊豕于江召賓都等謂之曰舟楫已具可濟江矣博勒呼曰臣觀宋舟甚大我舟小而行遲恐不可濟金主怒曰爾昔從梁王追趙構豈皆大舟耶誓以明日渡江晨炊玉麟堂先濟者與黃金一兩丙子金主置紅黃二旗于岸上中建黃屋坐其下以號令進止紅旗立則進黃旗仆則退時葉義問命虞允文往蕪湖趣李顯忠交王權軍且犒師允文至采石權已去顯忠未來權敗軍三五星散解鞍束甲坐道傍允文謂坐待顯忠則誤國事遂立召諸將勉以忠義曰金帛告命皆在此以待有功衆曰今既有主請死戰或謂允文公受命犒師不受命督戰他人壞之公受其咎耶允文叱之曰危及社稷吾將安避乃命諸將列大陳不動分戈船為五其二並東西岸其一駐中流藏精兵待戰其二藏小港備不測部分甫畢金主操小紅旗麾數百艘絶江而來瞬息抵南岸者七十艘直薄官軍軍小却允文撫統制時俊之背曰汝膽略聞四方立陳後兒女子爾俊即揮雙刀出士殊死戰中流官軍以海鰌船衝敵舟皆平沈敵半死半戰日暮未退㑹有潰卒自光州至允文授以旗鼓從山後轉出敵疑援兵至始遁允文又命徑弩尾擊追射大敗之金兵還和州凡不死于江者金主悉敲殺之遂召諸將帥謀北還且分兵渡江李通曰陛下親征深入異境無功而還若衆散于前敵乘于後非萬全計若留兵渡江車駕北還諸將亦將解體今燕北諸軍近遼陽者恐有異志宜先發兵渡江斂舟焚之絶其歸望然後陛下北還南北皆指日而定矣金主然之允文知金兵必復來夜半部分諸將分海舟泊上流别遣盛新以舟師截楊林河口明旦敵果至因夾擊之復大敗焚其舟三百敵遣詔來諭王權似有宿約者允文曰此反間也乃復書言權因退師已置憲典新將李世輔也願一戰以决雌雄金主得書大怒遂焚龍鳳車斬梁漢臣及造舟者二人漢臣教金主濟江者也己卯虛恨蠻犯嘉州籠蓬堡官軍大敗副將鄭祥等為所殺庚辰金主引軍趨淮東過烏江觀項羽祠歎曰如此英雄不得天下誠可惜也癸未吳璘病自仙人原還興州留姚仲節制軍事甲申贈姚興魏俊王方官是日金主至揚州劉錡以順昌之捷威名為金人所憚金主之南侵也令有敢言錡姓名者斬枚舉南朝諸將問其下孰敢當者皆隨姓名以對其答如響至錡莫有應者金主曰吾自當之至是錡命盡焚城外居屋以堊白其城壁書曰完顔亮死于此金主多忌見而惡遂趨瓜洲居龜山寺人衆不可容遂致生變云金曹國公在東京追尊考豳王為皇帝諡簡肅號號睿宗妣富察氏曰欽慈皇后李氏貞懿皇后羣臣上尊號曰仁明聖孝皇帝追復東昏王帝號諡武靈廟號閔宗陵曰思陵别立廟封子錫喇喇為許王呼塔噶為楚王乙酉劉汜貸死英州編管江州統制李貴忠義首領孟俊復順昌府金州將邢進復華州丙戌任天錫復陜州丁亥李顯忠至采石虞文允語之曰敵入揚州必與瓜洲兵合京口無備我當往公能分兵相助乎顯忠分萬六千與之允文遂還京口時敵屯重兵滁河造三閘儲水深數尺塞瓜洲口楊存中成閔邵宏淵諸軍皆集京口凡二十餘萬允文以戰艦數少不足用聚材改治之命張深守滁河口扼大江之衝以苖定駐下蜀為援謁劉錡問疾錡執允文手曰疾何必問朝廷養兵三十年一技不施而大功乃出一儒生我輩愧死矣以疾篤召還提舉萬壽觀尋以成閔等為招討使閔淮東李顯忠淮西吳拱湖北京西戊子吳璘復力疾上仙人原己丑膠西捷奏至帝大喜曰朕獨用李寶果立功為天下倡矣即賜詔奬諭書忠義李寶四字表其旗幟王權貸死瓊州編管是日金曹國公自東京如中都庚寅虞允文與楊存仲臨江按試命戰士踏車船中流上下三周金山回轉如飛敵持滿以待相顧駭愕金主笑曰紙船耳有一將跪奏南軍有備不可輕願駐揚州力農訓兵徐圖進取金主拔劍欲斬之哀謝良久杖五十而釋之遂還揚州使符寶郎耶律穆丹護神果軍扼淮渡凡自軍中還至淮上無都督府文字皆殺之乃出內箭飾以金龍題曰御箭繫帛書其上使人乘舟射之南岸其書言宋國遣人焚毁南京宫室及沿邊買馬招誘軍民今興師問罪義在弔伐大軍所至必無秋毫之犯以此招諭南人於是鎮江軍亦縱所獲金軍士三人齎書數金主罪李通奏其書即命焚之金驍騎髙僧欲誘其黨以亡事覺金主命衆刃銼之乃下令軍士亡者殺其富埒琿富埒琿亡者殺其穆昆穆昆亡者殺其明安明安亡者殺其總管衆益危懼甲午令軍士運鴉鶻船于瓜洲期以明日渡江敢後者斬諸將謀曰南軍有備如此進有淹殺之禍退有敲殺之憂奈何其中一人曰等死死中求生可乎衆皆曰願聞教有總管萬戴者曰殺郎主却與宋通和歸鄉則生矣衆皆曰諾乃决計於浙西都統制完顔元宜及明安唐古烏葉曰前阻淮渡皆成擒矣比聞遼陽新天子即位不若共行大事然後舉軍北還元宜曰待王祥至謀之元宜本耶律氏賜姓完顔王祥者元宜子為驍騎副都指揮使在别軍者也元宜召王祥至與諸將約詰旦衛軍番代即行事金主有紫茸等細軍不肯臨敵專以自衛衆患之蕭巴扎曰晚朝奏遣細軍東取海陵則事可濟矣從之乃謂細軍曰淮東子女玉帛皆逃在泰州我輩急渡江汝輩何不白郎主往取之細軍欣然共請金主許之于是細軍去者過半駙馬都尉唐古安禮金主妹壻也能文知兵掌黃頭女真金主聞東京之變遣安禮以本部兵歸故諸將益無所憚乙未黎明元宜王祥與武勝軍都統管圖克坦守素明安唐古烏葉穆琨斡盧保婁薛溫都長壽等率衆薄御營金主謂南人劫寨驚起求劍甲不得左右親兵盡散走諸將射帳中矢下如雨金主取視之曰我兵也近侍大慶山曰事急矣當出避之金主曰走將安往方取弓中箭仆地延安少尹納哈塔鄂勒博先刃之手足猶動遂縊殺之年四十驍騎指揮使大磐整兵來救王祥出語之曰無及矣大磐乃止軍士攘取行營服用皆盡乃取大磐衣巾裹金主尸焚之收其妃嬪五人及李通郭安國圖克坦永年梁琉太慶山等皆殺之初金人之犯邊也樞密院編修官莆田鄭樵言嵗星分在宋金主將自斃又有客詣葉義問上書言以太一局考之金主不煩齊斧冬至前當有蕭牆之變已而皆驗是日天重隂有樞密行府使臣胡斌者知天文謂樞密院檢詳洪邁曰昨夕四鼓濃雲塞空欲雪而東北忽穿漏一大星墜蓋金主死祥也未幾有軍中被掠散人張真及虢州簽軍雷政相繼渡江來歸報金主被弒考異三朝北盟㑹編輯中興遺史敗盟記神麓記采石斃亮記采石戰勝記正隆事跡記煬王江上録諸書言金海陵被弒事其謀逆者或無主名或雖有主名而與金史大異且不及完顔元宜唐古烏葉殊多滲漏按金史海陵記逆臣傳元宜實為首惡唯謀遣細軍事金史失載而宋史虞允文傳有之煬王江上録尤為委曲詳盡此事必不可遺今以逆臣傳為主而萬戴蕭巴扎唐古安禮等事則掇取諸書以補其未備乙未中興遺史作丙申誤是月己巳朔敗盟記云亮死于二十七日正乙未也宋金二史本紀並作乙未今從之丙申金細軍破泰州子女玉帛剽掠無遺考異宋史髙宗紀乙未金人陷泰州今從敗盟記戊戌金都督府遣人持檄來鎮江軍中議和十二月庚子楊存中虞允文渡江至瓜洲以察敵情金舟師犯慈湖鄂州軍擊却之金統軍劉萼聞敗遂退師楊椿夜攻金人殺其師髙定山復廬州壬寅天有白氣癸卯復嶽州舊名右軍統領沙世堅復泰州金細軍棄城而去甲辰虞允文自鎮江入見上慰藉嘉歎謂陳俊卿曰虞久文公忠出天性朕之裴度也詔免扈從往兩淮措置允文至鎮奏收兩淮三策不報乙巳李顯忠自慈湖引兵渡江判建康府張浚至嶽陽買舟冒風雪而行時金兵充斥浚遇東來者云敵方焚采石煙焰漲天慎毋輕進浚曰吾赴君父之急知求乘輿所在而已時長江無一舟行北岸者浚乘小舟徑進過池陽聞金人尚屯和州李顯忠兵在沙上浚往犒之一軍見浚以為從天而下浚謂顯忠曰聖駕將巡幸至此而賊未退得無慮乎顯忠乃以大軍濟江去和州三十里與金人相持浚赴建康先牒通判劉子昻辦行宫儀物丙午淮東統制王選等復楚州丁未吳拱遣將牛宏等復汝州戊申帝發臨安建王從行先是侍御史吳芾求對乞以建王為元帥先往撫師史浩遺大臣書言建王生長深宫平居未嘗與諸將接安能辦此議者又謂上親征可使王居守浩復以為不可帝欲令王遍識諸將遂扈蹕如建康時方雨雪帝御氊笠乘馬王亦騎往雨漬朝服略不少顧而宰相以下多肩輿者庚戌金人自盱眙渡淮北去癸丑鄂州水軍統制楊欽以舟師追至洪澤鎮敗之是夜鎮江統制吳超遣將假溫等追金人至淮隂縣又敗之獲其舟船糧食甚衆淮東統制劉鋭陳敏入泗州甲寅李顯忠與金人戰於楊林渡却之乙卯江北金人悉去李顯忠復入和州吳璘遣將復水洛城金人復破汝州殺戮殆盡丁巳李顯忠遣統制張榮追金人至全椒敗之得所掠老弱萬餘口是日金主雍至中都戊午謁太祖廟己未御貞元殿受百官朝庚申吳璘遣將復治平寨甲子金潁壽二州巡檢髙顯以壽春府來降金太子光英頗警悟海陵嘗言俟太子年十八以天下付之朕當日游宴宫掖苑囿中以自娛樂光英誦孝經一日忽謂人曰經言三千之罪莫大于不孝何謂不孝對曰今民家子博奕飲酒不養父母皆不孝也光英默然良久曰此豈足為不孝也蓋指言父亮弒母事及伐宋圖克坦后與光英挽衣號慟亮亦泣下曰吾行歸矣命光英居守時年十二以圖們額哩雅為太子少師兼河南路統軍使以衛護之完顔元宜既弒亮都督府移文額里頁是月殺光英于南京圖克坦后如中都居亮母大氏故宫頃之金主憐其無依詔歸父母家於會寧嵗賜錢二千貫奴婢皆給官廩大定十年卒三十二年春正月戊辰朔日有食之帝在鎮江是日金主不視朝減膳徹樂謂判大宗正事呼嚕等曰朕每見天象變異輒思政事之闕寤寐自責不遑凡事必審思而後行猶懼獨見未能盡善每令羣臣集議庶幾無過舉也呼嚕宗望子也己巳金人犯壽春府忠義將劉泰戰死金兵亦退庚午帝發鎮江金主謂宰相曰進賢退不肖宰相之職也有才能髙于己者或懼其分權往往不肯引置同列朕甚不取卿等毋以此為心辛未金主御太和殿宴百官宗戚命婦賜賚有差壬申帝至建康張浚入見丙子祧翼祖主于夾室金主如大房山獻享山陵禮畢欲獵而還左丞相晏等諫曰邊事未寧不宜游幸遂還宫因諭晏等曰朕常慕古之帝王虛心受諫卿等有言即言毋緘默以自便己卯李顯忠引兵還建康庚辰罷郡守年七十者辛巳金兵部尚書克實與延安府同知李老僧謀反伏誅老僧一名惟忠克實材武過人狠戾好亂自以太祖孫頗有異志金主初至中都倥傯多事扈從諸軍未暇行賞有怨言克實與惟忠及倭楞鄂爾多梁璋布呼謀欲因軍士怨望以作亂既而謀不遂克實璋布呼乃擒惟忠倭楞鄂爾多等詣有司自首下獄治克實初不肻承倭楞面質之然後款伏金主念兄弟少太祖孫惟數人惻然傷之詔罪止克實一身其兄弟子孫皆不緣坐遂誅克實惟忠倭楞等璋布呼並除名歷城辛棄疾少師蔡伯堅與黨懷英同學人號為辛黨始筮仕决以蓍懷英遇坎因留事金棄疾得離遂决意南歸海陵死中原豪傑並起耿京聚兵山東稱天下節度使節制山東河北忠義兵馬棄疾為掌書記即勸京决策南向僧義端者喜談兵棄疾間與之游及在京軍中義端亦聚衆千餘棄疾說下之使𨽻京義端一夕竊印以奔金京大怒欲殺棄疾棄疾急追義端斬其首歸報京益壯之至是令棄疾奉表來奏事乙酉召見嘉納之授棄疾承務郎天平節度掌書記并以節度印告使召京時有陳駐蹕利害者陳康伯不能决帝命侍從臺諫同赴都堂集議侍御史吳芾謂建康可以控帶襄漢經理淮甸若還臨安則西北之勢不能相接給事中金安節亦言淮壖瘡痍之人甫遂歸業賴聲勢以幸安堵一旦聞戎輅還軫恐乖始望衆不從遂定回鑾之議己丑金遣髙忠建張景仁來告即位左司員外郎洪邁充接伴使知閣門事張掄副之庚寅金行納粟補官法詔新復州縣搜訪仗節死義之士金遣右副元帥完顔默音率師討蕭窩幹壬辰洪邁張掄入對帝謂輔臣曰朕料此事終歸於和卿等欲首議名分而土地次之蓋卿輩事朕不得不為此言在朕所見當以土地人民為上若名分則非所先也何者若得復舊疆則陵寢在其中使兩國生靈不殘于兵革此豈細事丙申以楊存中為江淮荆襄路宣撫使虞允文副之帝嘗謂湯思退曰楊存中忠無與二朕之郭子儀也故有是命給事中金安節起居舍人劉珙繳還言存中頃以權勢太盛人言藉藉陛下曲示保全俾解軍職今復授以兹任事權益隆豈惟無以慰海宇之情亦恐非所以保全存中也倘以允文資淺未可專任宜别擇重臣以副盛舉奏入帝怒謂輔臣曰珙父為張浚所知此奏專為浚地耳宰相召珙諭㫖且曰再繳纍及張公珙曰珙為國家計豈暇為張公謀執奏如初乃改命存中措置兩淮允文為川陜宣諭使措置招軍市馬及與吳璘相見議事珙子羽之子也初魏勝起義時無州郡糧餉之給無府庫倉廪之儲勝經畫市易課酒𣙜鹽勸糴豪右環海州度視敵兵攻取處築城浚隍塞關隘在軍一日未嘗懈弛恆如冦至方糾集逺邇犒勞士卒期約有日㑹海陵被弒其兵北歸勝益得自治軍旅人皆精鋭獲金諜者犒以酒食厚賂遣還有自北方來歸者與之同臥起共飲食示以不疑周其貧窶自是山東河北歸附者日衆得金人虛實悉以上聞又第其忠義士功能假授官資因李寶轉達于朝悉如所請考異同臥起等事在海陵既死後薛鑑叙入復海州時誤也今據宋史魏勝傳改正金主追冊故妃烏林答氏為昭德皇后金翰林待制大頴以言盜賊忤廢帝杖而除名補闕馬欽以諂事廢帝得幸二月己亥起頴為祕書丞欽除名庚子虞允文陛辭言金主既死新主初立彼國方亂天相我恢復也和則海內氣沮戰則海內氣伸帝以為然允文至蜀遂與吳璘經略中原興州統領惠逢等復河州壬寅金人犯汝州守臣王宣逆戰敗之癸卯帝發建康楊存中議廢江淮州縣給事中金安節言廬之合肥和之濡須皆昔人控扼孔道魏明帝云先帝東置合肥南守襄陽西固析山賊來輒破於三城之下孫權築濡須塢魏軍纍次不克守將如甘寧等常以寡制衆蓋形勢之地攻守百倍豈有昔人得之成功今日有之而反棄之耶且濡須巢湖之水上接店步下接江口可通漕舟乞擇將經理存中議遂格惠逢復積石軍又克來羌城丁未太尉威武軍節度使劉錡卒錡美儀狀善射聲如洪鐘嘗為隴右都護與夏人戰屢勝夏人兒啼輒怖之曰劉都護來啼輒止至是以劉汜敗發怒嘔血數升卒諡武穆金有近侍進言欲罷科舉者金主問尚書令張浩曰自古帝王有不用文學者乎浩曰有之曰誰歟浩曰秦始皇金主顧近侍曰豈可使我為秦始皇事遂寢己酉王宣及金人再戰于汝州庚戌金以全軍來攻宣敗績棄城去癸丑金詔降廢帝幸臣蕭玉敬嗣暉許霖等官放歸田里乙卯帝至臨安甲子金澤州刺史特默格及其妻髙福娘伏誅乙丑王宣敗金人于確山於是趙撙自信陽歸德安而宣亦還屯襄陽金人復取蔡州丙寅瘞欽宗重于招賢寺立虞主帝親遣奠宰執議帝宜服袍履禮部侍郎黃中曰三年天下之通喪堯舜三代之所共也後世以日易月已有愧于古矣然猶於二十七日釋服之後因事則服之本朝典故大葬啓攢必服其初服是也若曰今十月而葬不可復服則真宗九月而葬何為亦服初服乎以故事考之衰服為當前二日陳康伯等進呈帝覽奏曰朕為天子豈可使事兄之禮過於事父中至都堂朱倬謂中曰徽考大行有故事矣中曰此前日之誤今所當改奈何復因之倬曰帝意實然臣子務為恭順可也中曰責難於君乃為恭耳閏月癸酉金人破河州屠其城甲戌金主謂宰臣曰比聞外議言奏事甚難朕於可行者未嘗不從自今敷奏勿有所隱戊寅祔欽宗神主于太廟癸未吳璘遣楊從儀等攻拔大散關分兵據和尚原金人走寶雞丙戌給張浚錢十九萬緡造沿江諸軍戰艦庚寅王剛破金人于海州辛卯參知政事楊椿罷金太和厚德殿火壬辰姚仲攻順德軍敗金人于瓦亭寨新店乙未金兵部侍郎溫敦珠圖喇等與窩斡戰敗于勝州是月張安國等攻殺耿京辛棄疾還至海州與衆謀曰我緣主帥來歸朝不期事變何以復命乃約李寶王世隆徑趨金營安國方與金將酣飲即衆中縳之以歸金將追之不及獻俘行宫斬安國於市三月壬辰更定金使入境接伴館伴舊儀癸卯成閔遣統制杜彥救淮寧擊敗金人于項城丁未金使高忠建等入國門始忠建責臣禮及新復州軍接伴使洪邁以聞且曰土疆實利不可與禮際虛名不足惜也禮部侍郎黃中聞之亟奏曰名定實隨百世不易不可謂虛土疆得失一彼一此不可謂實或又言土地實也君臣名也先實後名乃今之利兵部尚書陳俊卿曰今力未可守雖得河南不免為虛名臣謂不若先正名分名分正則國威張而嵗幣亦可損矣甲辰金追削李通官職戊申録文宣王四十九世孫孔琯為右迪功郎吳璘復德順軍璘初至城下自將數十騎繞城守陴者聞呼相公來觀望咨嗟矢不忍發璘按行諸屯預治夾河戰地斬不用命者先以數百騎嘗敵敵一鳴鼓鋭士空壁躍出突璘軍璘軍得先治地無不一當十至暮璘忽傳呼某將戰不力其人即殊死鬬敵大敗遁入壁黎明師再出敵堅壁不動㑹大風雷金人拔營去凡八日而克璘入城市不改肆父老擁馬迎拜辛亥金以亷平誡諭中外官吏壬子金使高忠建等見於紫宸殿詔館伴使徐嚞等以所定禮示之忠建固執帝特許殿上進書及升階猶執舊禮陳康伯以義折之忠建語塞乃請宰相受書康伯奏曰臣為宰相難以下行閣門之職忠建奉書跪不肯起康伯呼嚞至榻前厲聲曰館伴在館所議何事嚞徑前掣其書以進忠建氣沮帝嘉歎之癸丑金人圍淮寧府守臣陳亨祖死之舉家五十餘人皆死事聞贈容州觀察使甲寅吳璘自順德軍復還河池金人犯鎮戎軍丁巳遣洪邁等賀金主即位戊午知蘭州王宏拔㑹州金人陷淮寧府統領戴規戰死成閔歸自淮東辛酉金人攻原州是春淮水暴漲中有如白霧其闊可里所其長亘淮南北又有赤氣浮於淮南自髙郵軍至興化縣若血凝而成者夏四月丁卯朔姚仲遣兵救原州己巳金右副元帥完顔默音等敗窩斡於長濼辛未金降廢帝亮為海陵郡王諡煬煬海陵之弒也都督府以其柩置南京班荆館至是詔與其子光英同葬于大房山鹿門谷諸王兆域中乙亥金詔減御膳及宫中食物之半金完顔默音復敗窩斡於霿􅟶河戊寅以御史中丞汪徹參知政事辛巳金主宴夏使於貞元殿故事外國使三節人從皆坐廡下賜食金主察其食不精腆曰何以服逺人之心掌食官皆杖六十癸未夏使朝辭乞互市從之初議遣使如金報聘且賀即位工部侍郎張闡請嚴遣使之命正敵國之禮彼或不從則有戰耳如是則中國之威可以復振帝然之遂遣洪邁等使金帝謂輔臣曰向日講和本為梓宫太后雖屈己卑辭有所不憚今兩國之盟已絶宜正名畫境朝儀嵗幣當先定之邁乃奏接伴禮儀十有四事戊戌邁等辭行書用敵國禮帝手札賜邁曰祖宗陵寢隔濶三十年不得以時灑掃祭祀心實痛之若彼以河南北見歸必欲居尊如故正復屈已亦何所惜邁至燕金閣門見國書不如式抑令於表中改陪臣二字朝見之儀必欲用舊禮邁執不可金鎖使館自旦及暮水漿不通三日乃得見金人語不遜欲留邁張浩不可乃遣還壬辰金詔征契丹部將士曰應契丹與大軍未戰而降者不得殺傷仍安撫之以後招誘來降者除奴婢以已掠為定其親屬使各還其家仍官為贖之是月大雨淮水暴溢數百里漂沒廬舍人畜死者甚衆金人發諸路兵二十餘萬復攻海州先遣一軍自州西南斷魏勝軍餉道勝擇勇悍士三千餘騎拒於石闥堰金兵不能進逮夜始還留千人備險隘金兵十萬來奪勝率衆鏖戰殺數千人餘遁去勝還入城無何金兵環城圍數重勝與郭蔚分兵備禦或獨出擾之使不得休息又間夜發兵劫其營或焚其攻具既而金人併力急攻勝告急于李寶寶以聞五月戊戌金遣元帥左監軍高忠建㑹北征將帥討契丹己亥金右副元帥完顔默音坐逗遛召還京師罷之壬寅姚仲及金人戰於原州之北嶺官軍大敗金立楚王允迪為皇太子戊申復以楊存中為醴泉觀使奉朝請罷御營宿衛司辛亥鎮江都統制張子蓋率兵救海州進次石湫堰金人陳萬騎于河東子蓋率精鋭數千騎擊之統制張汜略陳中流矢死子蓋曰事急矣奮臂大呼馳入陳魏勝等繼之殊死戰賊大敗擁溺石湫河死者半圍遂解子蓋俊從子也甲寅命張浚專一措置兩淮事務兼節制淮東西沿江州郡軍馬己未吳璘遣將復熙州壬戌置御前萬弩營募淮民為之從張浚請也浚謂敵長于騎我長於步制騎莫如弩衛弩莫如車乃令專制弩治車帝之還臨安也傳位之意已决懲宣和吳敏輩自以為功不以語羣臣中書舍人唐文若獨請對言不宜急速㑹陳康伯乞去位帝曰更待數月康伯喻意不復言既而帝益倦勤康伯密贊大議且曰今不正名恐下有疑似之心且諸將分屯江上必使之曉然咸知聖意遂草立皇太子手詔以進甲子內降詔立皇子瑋為皇太子更名眘是月吳璘攻熙州拔之初三大將之出也興州路得秦隴環原熙河蘭㑹洮州積石鎮戎德順軍凡十二郡金州路得商虢陜華州凡四郡獨金以重兵扼鳳翔故散關之師不得進六月丙寅朔吳璘次大幽嶺以原州之敗檄召姚仲至軍前下河池獄命䕫路安撫使李師顔代將其兵先是以秦檜舊第為新宫戊辰名曰德壽命內侍張去為領之庚午以復與金議和罷三招討司初李顯忠隂結金都統蕭琦為內應請出師欲自宿亳趨汴由汴京以通關陜關陜既通則鄜延一路熟知顯忠威名必皆響應且欲起舊部曲數萬以取河東㑹詔罷兵乃止甲戌加贈皇兄子稱為太師中書令追封秀王諡安僖妻張氏封王夫人乙亥尚書左僕射同平章事朱倬罷侍御史張震右正言袁孚論其罪故也是日內出御札傳位於皇太子帝稱太上皇帝退處德壽宫皇后稱太上皇后丙子帝行內禪之禮百官班紫宸殿下有司設黃麾仗五百人太常官樂工百人設而不用先是帝嘗諭太子以傳禪意太子流涕固辭至是遣中使召太子入禁中復加面諭太子推遜不受即趨殿側便門欲還東宫帝勉諭再三帝遂出御紫宸殿百官起居畢宰相陳康伯執政葉義問汪徹黃祖舜升殿奏陛下超然髙蹈有堯舜之舉臣等不勝欣贊第自此不獲日望清光犬馬之情無任依戀因再拜泣下帝亦為之揮涕曰朕在位三十六年今老且病久欲閒退此事斷在朕意非由臣下開陳也卿等宜悉力以輔嗣君康伯等復奏曰皇太子賢聖仁孝天下共知似聞謙遜太過未肯即御正殿帝曰朕已再三邀留今在殿後矣帝入宫百官移班殿門外宣詔畢入班殿庭頃之皇太子服袍履內侍掖扶至御榻前拱手側立不坐奉應官以次稱賀內侍扶掖至於七八乃略就坐宰相率百僚稱賀太子遽興康伯等升殿奏願陛下即御座正南面以副太上皇付託之意太子愀然曰君父之命出於獨斷然此大位懼不克當尚容辭遜班退太上皇即日駕之德壽宫帝服赭袍玉帶步出祥曦殿門冒雨掖輦以行及宫門弗肯止上皇麾謝再三且令左右扶掖以還顧曰吾付託得人斯無憾矣左右皆呼萬嵗百官扈從上皇至德壽宫而歸頃之太上皇后赴德燾宫是日詔有司議太上皇帝太上皇后尊號以聞在內諸司日輪官吏應奉德壽宫少有怠慢以大不恭論史臣曰髙宗恭儉仁厚以之繼體守文則有餘撥亂反正則不足當其初立因四方勤王之師內相李綱外任宗澤天下之事宜無不可為者顧乃播遷窮僻坐失事機始惑于汪黃終制於秦檜甚而趙鼎張浚相繼竄斥嶽飛父子殺之於大功垂成之秋一時志士為之扼腕切齒而帝方偷安忍恥匿怨忘親以貽來世之譏悲夫丁丑朝德壽宫戊寅大赦詔宰相率百官月兩朝德壽宫金詔居庸關古北口譏察契丹姦細捕獲者加官賞己卯以即位告於天地宗廟社稷金詔守禦古北口及石門關癸未始御後殿甲申詔中外臣庶陳時政闕失監南嶽廟朱熹上封事首言陛下育德之初不過諷誦文詞比年以來頗留意老釋夫記誦詞藻非所以探本源而出治道虛無寂滅非所以貫本末而立大中帝王之學必先格物致知以極夫事物之本使義理所存纎悉畢照則自然意誠心正而可以應天下之務次言修攘在先定計定計在罷和議次言四海利病係斯民之休戚斯民之休戚係守令之賢否監司者守令之綱朝廷者監司之本欲斯民之得其所本原之地亦在朝廷而已今之監司姦贓狼藉肆虐以病民者莫非宰執臺諫之親舊賓客顧陛下無由知之耳帝始欲日朝德壽宫上皇以恐廢萬幾不許乃命禮官重定其期禮部侍郎黃中奏謹按漢髙帝五日一朝太上皇乞依此故事從之上皇復不許丁亥詔自今月四朝德壽宫復胡銓官知饒州己丑詔有司月奉德壽宫緡錢十萬庚寅金右副元帥布薩忠義大敗窩幹於裊嶺西陷泉獲其弟裊壬辰詔百官日一人入對癸巳蝗甲午上太上皇帝尊號曰光堯壽聖太上皇帝太上皇后曰壽聖太上皇后乙未晦金人屠原州秋七月戊戌興州中軍統制吳挺復鞏州帝手書召張浚入見癸卯以為少傅江淮宣撫使封魏國公浚見帝英武力陳和議之非勸帝堅意圖恢復欲遣舟師自海道搗山東命諸將出師犄角以向中原翰林學士史浩以潛邸舊臣時預樞密議欲城采石瓜州浚言不守兩淮而守江干是示敵以削弱怠戰守之氣不若先城泗州浩不悅遂與有隙及浩執政凡浚所規畫浩必沮之甲辰命汪徹視師河北京西遣劉珙等使金告即位戊申追復嶽飛官以禮改葬尋又官其子孫六人是夜地震大風拔木癸丑統制趙撙等復光州丁巳罷李寶措置海道金速頻軍士穆爾古等告完顔默音子色格寄書其父謀反金主覽書曰此誣也止訊告者訊之果然穆爾古伏誅戊午恩平郡王璩入見壬戍詔李顯忠軍馬聽張浚節制是月劉珙使金不至而復初洪邁張掄使回見張浚具言金不禮我使狀且令稱陪臣浚謂不當復遣使而史浩議遣珙告即位至境金人責舊禮不納而還八月乙丑朔四川統制髙師中與金人戰于摧沙敗死金左監軍髙忠建破奚于拷㧯山及招降旁近奚六營有不降者攻破之盡殺其男子以其婦女童孺分給諸軍己巳以翰林學士史浩參知政事壬申金萬户溫迪罕阿哩布與奚戰于古北口而敗詔完顔默音等禦之癸酉金主謂宰臣曰百姓上書陳時政其言猶有所補卿等位居幾要略無獻替可乎夫聽斷獄訟簿書期㑹何人不能唐虞之聖猶務兼覽博照乃能成治正隆專任獨見故取敗亡朕蚤夜孜孜冀聞讜論卿等宜體朕意於是詔百司官吏凡上書言事或為有司所抑許進表以聞朕將親覽以觀人材優劣丁丑金詔元帥右都監完顔思敬以所部軍㑹大軍討窩斡丁亥班寬恤事十八條起居舍人洪邁知閣門事張掄坐奉使辱命罷金主諭御史臺曰卿等所劾唯諸局移行稽緩及怠於赴局者耳此細事也自三公以下官寮善惡邪正當審察之若止劾細事而略其大者將治卿等罪矣金人攻德順軍甲申吳璘敗之於北山戊子追復李光資政殿學士趙鼎范沖並還合得恩數庚寅以生日為㑹慶節追册故妃郭氏為皇后諡恭懷尋改安穆辛卯金罷諸關征稅九月進封皇子愭為鄧王愷為慶王惇為恭王皆郭皇后所生也甲午金人攻順德軍東山堡中軍將李庠戰死乙未金詔尚書右丞赫舍哩良弼以便宜招撫奚契丹之叛者丁酉川陜宣諭使虞允文罷史浩言官軍西討東不可過寶雞北不可過德順若兵宿於外去川口逺則敵必襲之朝廷遂欲棄三路允文奏恢復莫先於陜西五路新復州郡又係于德順之存亡一旦棄之則窺蜀之路愈多西和成階利害至重不可不慮于是前後凡十五疏帝將召允文問陜西事執政忌其來罷允文知䕫州以王望之代之金陷泉之捷伊喇窩斡以數騎僅免收合散卒萬餘人奚部從者多降窩斡自知勢窮北走沙陀其徒執之獻于右都監完顔思敬送中都斬之餘衆悉平惟扎巴不服每為邊患先是窩斡漸逼居庸關金主懼與大臣謀曰兵勢如此若宋乘虛襲我國其危矣設有所求當割河南與之及窩斡平割地之意遂寢冬十月己巳同知樞密院事葉義問罷尋落職饒州居住詔登聞鼓院毋阻抑進狀甲申金人攻德順城吳璘擊走之復遣兵追襲遂為所敗乙酉升建州為建寧府戊子以資政殿學士張燾同知樞密院事金改葬睿宗于景陵大赦十一月癸巳朔金以布薩忠義為都元帥赫舍哩志寧副之率衆冦邊時金主以宋不稱臣乃詔忠義總戎事居南京節制諸軍復令志寧駐軍淮陽忠義將行金主諭之曰宋若歸侵疆貢禮如故則兵則罷忠義至汴簡閲士卒分屯要害戊申詔改明年為隆興元年辛丑立措置京西營田司從視師汪徹言也十二月乙丑詔宰相復兼樞密使丙寅詔吳璘班師金以重兵扼鳯翔爭吳璘新復州軍璘亟馳德順以備之已而金富察世傑率師十萬來攻璘力戰拒之時議棄三路遂詔璘棄德順城徙兵民於秦州界內帝謂輔臣曰昨聞臣僚言秦檜誣嶽飛舉世莫敢言李若朴為獄官獨言其非罪吕忱中發王晌所司皆迎合林待問為勘官獨直其寃狀章傑捕趙鼎送葬人又搜其家私書欲傅致士大夫之罪翁䝉之為縣尉毅然拒之沈昭逺為王鈇家治盜欲煆煉富民多取其賠償王正已為司理平反之此皆不畏强禦節槩可稱三省詳加訪問其人如在可與甄録戊辰詔侍從臺諫集議當今弊事仍命率其屬使極言無隱太上皇在北內頗屬意玩好帝極盡先意承志之道時訪求珍異以供娛悅是嵗祕書監正字奉祠胡憲卒憲平居危坐植立時然後言雖倉卒無疾言遽色人犯之未嘗校學者稱為籍溪先生資治通鑑後編卷一百二十
