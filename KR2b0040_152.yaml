body:
  text: 資治通鑑後編卷一百五十二刑部尚書徐乾學撰宋紀一百五十二起疆圉赤奮若正月盡屠維單閼十二月凡三年端宗裕文昭武愍孝皇帝景炎二年春正月元兵破汀關文天祥欲據城拒敵汀守黃去疾聞車駕航海擁兵有異志天祥乃移軍漳州時趙孟瀯等軍還吳浚不至未幾浚與去疾叛降元嗣漢天師張宗演赴元召至大都元主命百官郊勞待以客禮因賜號演道靈應沖和真人領江西諸路道教尋令修周天醮于長春宫事畢還龍虎山留弟子張留孫于大都癸卯元復立諸道提刑按察司知循州劉興知梅州錢榮之並以城降元二月癸亥彗出東北長四丈餘元兵入廣州遂陷廣東諸郡吳浚既降元因至漳州説文天祥降天祥責以大義斬之元主如上都元兵引還留潛説友為福州宣慰使王積翁副之時北方有警元主召諸將班師凡諸將及淮兵在福安者命李雄統之元墮吉撫二州城以隆興濵江姑存之元以嘉木揚喇勒智為江南總攝掌釋教除僧租賦禁擾寺宇者考異按元史世祖紀以康戩且琳沁嘉噶爾斡並為江南總攝掌釋教與此不同史稱並為則知非一西僧也當考三月文天祥復梅州元將李雄殺潛説友陳瓉舉兵誅林華復興化軍瓉文龍從子也元主以去冬無雨雪春澤未繼問便民之事於翰林國史院耶律鑄姚樞王磐竇默等對曰足食之道惟節浮費縻穀之多無踰醪醴况自周漢以來嘗有明禁祈賽神社費亦不資宜一切禁止從之夏四月廣東制置使張鎮孫復廣州文天祥引兵自梅州出江西吉贛兵皆會之遂復會昌縣淮人張德興與淮西野人原寨劉源等起兵興復司空山民傅髙舉兵應之遂復黃州壽昌軍用景炎正朔元賈居貞使湖北宣慰使鄭鼎將兵拒之鼎言鄂之大姓皆與髙通請先除之以絶禍本居貞不可鼎將行留其所善部將曰聞吾還軍汝即舉烽城樓內外合發當盡殺城中大姓鼎與德興遇於樊口戰敗溺死五月癸巳元申嚴大將酒禁犯者籍其家資散之貧民六月辛酉文天祥敗元軍於雩都秋七月文天祥遣趙時賞等分道復吉贛諸縣遂圍贛州衡山人趙璠撫州人何時皆起兵應之元諸王錫里濟劫北平王於阿里瑪圖之地械擊右丞相安圖脅諸王以叛使通好於海都海都弗納遂率兵至和林城北元主命巴延率軍往禦之巴延與其衆遇於鄂囉歡河夾水而陳相持彌日俟其懈掩擊破之錫里濟走死乙巳張世傑以元軍既退自將淮兵討蒲壽庚時汀漳諸路劇盜陳弔眼及許夫人所統諸洞畬軍皆會兵勢稍振壽庚閉城自守世傑遂傳檄諸路陳瓉起家丁義民五百人應世傑世傑遣將髙日新復邵武軍淮兵在福州者謀殺王積翁以應張世傑事覺為積翁所殺八月元李恆遣兵援贛而自將攻文天祥于興國天祥不意恆猝至遣兵戰鐘步不利時鄒㵯聚兵數萬於永豐天祥引兵就之會㵯兵先潰恆追天祥至方石嶺及之諸將鞏信以短兵接戰恆疑有伏斂兵不進信坐巨石餘卒侍左右箭雨集屹不動恆從間道就視之創被體而死不仆天祥至空坑兵盡潰時趙時賞坐肩輿元軍問為誰時賞曰我姓文衆以為天祥禽之天祥由是得與杜滸鄒􅘶乘騎逸去至循州散兵頗集天祥妻子及幕僚客將皆被執時賞至隆興奮罵不屈僚屬有係纍至者輒麾去云小小僉廳官耳執之何為得脫者甚衆臨刑劉洙頗自辨時賞叱曰死耳何必然於是被執者皆死恆送天祥妻子家屬于燕二子死于道信安豐軍人時賞和州宗室也咸淳元年進士己巳熒惑掩月天色赤九月戊申元將額森伊實陷邵武軍入福安帝舟次廣之淺灣元詔達實與李恆吕師夔等以步卒入大庾嶺蒙固岱索多蒲壽庚及元帥劉深等以舟師下海合追二王張世傑使謝洪永進攻泉州南門不利蒲壽庚復隂賂畬軍攻城不力得間道求救於索多至是索多來援世傑解圍還淺灣元劉深言王積翁嘗通書于張世傑積翁亦上言兵力單弱若不暫從恐為合郡生靈之患元主原其罪元遣昻吉爾等將襲司空山寨破之黃州復陷殺張德興執其三子以去傳髙變姓名出走尋被獲死之冬十月丙辰朔日有食之以陸秀夫同僉書樞密院事秀夫之謫張世傑讓陳宜中曰此何如時動以臺諌論人宜中惶恐亟召秀夫還行朝時播越海濵庶事踈略楊太妃埀簾與羣臣語猶自稱奴每時節朝會獨秀夫儼然正笏立如治朝或時在行中凄然泣下以朝衣收淚衣盡濕左右無不悲慟者甲辰元索多至興化陳瓉閉城自守索多臨城諭之矢石雨下乃造雲梯炮石攻破其城瓉以死自誓巷戰終日獲瓉車裂之屠其民血流有聲十一月元達實初令索多取道泉州泛海會於廣之冨陽索多既取興化軍及漳州進攻潮守臣馬發竭力拒守恐失期舍之去至惠州與吕師夔合軍趣廣州制置使張鎮孫及侍即談應斗以城降達實遂夷廣州城元將劉深犯淺灣張世傑戰不利奉帝走秀山至井澳陳宜中遁入占城元詔凡偽造寶鈔同情者並處死其分用者減死杖之具為令十一月庚子元命中書省檄諭中外江南既平宋宜曰亡宋行在宜曰杭州元以吏部尚書巴迪爾迪音參知政事十二月丙子帝至井澳颶風大作舟敗幾溺帝驚悸成疾旬餘諸兵士稍集死者過半元將劉深犯井澳帝奔謝女峽復入海至七里洋欲往占城不果乙亥元以參議中書省事耿仁參知政事是歲元遣使徵緬朝貢不從率衆侵擾永昌雲南行省遣兵伐之降其寨三百餘而還景炎三年春正月癸巳元順德府總管張文煥太原府達嚕噶齊達哈布哈以按察司發其姦贓遣人詣省自首反以罪誣按察御史臺臣奏按察司設果有罪不應因事而告宜待文煥等事決方聽其訴從之己亥元禁官吏軍民賣所娶江南子女及為娼者賣買者兩罪之官沒其直人復為良元賜湖州長興縣金沙泉名為瑞應泉金沙泉不常出唐時用此水造紫筍茶進貢有司具牲幣祭之始得水事訖輒涸宋末屢加浚治泉迄不出至是中書省遣官致祭一夕水溢可溉田千畝安撫使以事聞故賜今名戊午元從阿哈瑪特請自今御史臺非白於省毋擅召倉庫吏亦毋究錢榖數及集議中書不至者罪之元降封福王與芮為平原郡公元巴哈督汪良臣等兵入重慶李德輝遺書張珏曰君之為臣不親於宋之子孫合之為州不大於宋之天下彼子孫已舉天下而歸我汝猶偃然負阻窮山而曰忠於所事不己惑乎珏不答巴哈至城下營浮屠造梯衝將攻之珏悉衆與良臣鏖戰良臣身中四矢明日督戰益急珏與伊遜岱爾戰扶桑埧元兵從後合擊之珏兵大潰其夜都統趙安以城降珏率兵巷戰不支歸索鴆飲不得乃順流走涪巴哈遣州師邀之遂被執至安西解弓弦自經死珏隴西鳯州人先是瀘州食盡為萬户圗們塔爾等所陷安撫王世昌亦自經死東川副都元帥張德潤陷涪州守將王明及總轄韓文廣張遇春皆不屈被殺紹慶南平夔施恩播諸州相繼降於元元定武官承襲之制凡有功升秩者原職令他有功者居之不得令子姪復代陳亡者始得襲病死者降一等總把百户老死者不襲著為令二月戊午元祀先農蒙古胄子代耕藉田癸亥元命平章政事阿塔哈阿里選擇江南亷能之官去其冗員與不勝任者辛未元以川屬地多嵐瘴弛酒禁丁丑熒惑犯天街元吕師夔以張鎮孫及其妻子赴燕鎮孫自經死帝舟還廣州元達實令索多還攻潮州知州馬發城守益備索多塞塹填壕造雲梯鵝車日夜急攻發潛遣人焚之凡相距二十餘日而敗發死之索多屠其民壬午元置太史院命太子贊善王恂掌院事工部郎中郭守敬副之集賢大學士兼國子祭酒許衡領焉元改華亭縣為松江府元以參知政事夏貴范文虎陳巖並為中書左丞黃州路宣慰使唐古岱史弼參知政事三月乙酉元詔蒙固岱索多蒲壽庚行中書省事於福州鎮撫瀕海諸郡以沿海經略副使哈喇岱領舟師南征升經略使兼左副都元帥佩虎符乙未元命揚州行省選特穆爾巴哈所部兵助隆興進討丁酉元命達實毁夔府城壁乙巳廣南西道宣慰司招降雷化髙三州文天祥以弟壁及母在惠州乃趨之行收兵出海豐縣遂次於麗江浦都統凌雲及轉運判官王道夫復廣州帝遷駐碙洲曽淵子至自雷州以為參知政事廣西宣諭使時淵子起兵據雷州元兵諭降不聽進兵攻之淵子奔至碙州遂有是命夏四月戊辰帝崩于碙州年十一羣臣多欲散去陸秀夫曰度宗皇帝一子尚在將焉置之古人有以一旅一成中興者今百官有司皆具士卒數萬天若未欲絶宋此豈不可為國耶乃與宋共立衛王昺年八歲矣方登壇禮畢御輦所向有黃龍自海中見既入宫雲隂不見上大行皇帝諡曰裕文昭武愍孝皇帝楊太妃仍同聽政陳宜中入占城日候其還朝宜中竟不至時張世傑秉政而秀夫禆助之外籌軍旅內調工役凡有役作盡出其手雖匆遽流離中猶日書大學章句以勸講元以雲南境土曠逺未降者多簽軍萬人進討元以時雨霑足稍弛酒禁民之衰疾飲藥者官為醖釀量給之末帝祥興元年五月癸未朔改元乙酉升碙州為龍翔縣遣張應科王用將兵取雷州應科與元兵三戰不利用降元元諭翰林學士和爾果斯今後進用宰相及主兵重臣與儒臣老者同議六月丁巳張應科收兵復與元軍戰敗死張世傑悉衆圍城城中絶糧士食草元史格漕欽亷髙化諸州糧以給之世傑引還己未帝遷駐新會之崖山時六軍泊雷化犬牙處而崖山在新會縣南八十里大海中與竒石山對立如兩扉故有鎮戍張世傑以為天險可扼以自固乃奉帝移蹕遣人入山伐木造行宫三十間軍屋三千間正殿曰慈元楊太妃居之升廣州為祥興府時官民兵尚二十餘萬多居於舟資糧取辦於廣右諸郡海外四州復刷人匠造舟楫製器械至十月始罷己巳有大星隕於廣南聲如雷數刻乃己庚辰改廣州為龍翔府元張𢎞範言張世傑復立廣王閩廣響應宜進取之元主以𢎞範為蒙古漢軍都元帥賜寶劍專決軍事𢎞範薦李恆自副至揚州選將校發水陸之師二萬分道而南元主復命達實留後供軍費元敕省院臺司應聞奏事必由起居注秋七月湖南制置司李烈良及提刑劉應龍起兵以應崖山雷瓊全永與潭屬縣之民周隆賀十二等咸應之大者衆數萬小者不下數千元主命阿里哈雅往討獲周隆賀十二斬之烈良等舉宗及餘兵奔思州烏羅洞為元軍所襲皆戰死阿里哈雅略地海外甚猛唯瓊州安撫趙與珞及冉安國黃之傑等率兵拒于白沙口相約固守以死自誓日望援兵不至其南寧萬安吉陽諸州縣及八蕃羅甸諸蠻皆附于元元阿哈瑪特奏立江西𣙜茶運司及諸路轉運鹽使司宣課提舉司宣課司官吏多至五百餘人至是崔斌言江南官冗杭州地大民衆阿哈瑪特溺於私愛以任其不肖子穆蘇呼且阿哈瑪特先自陳乞免其子弟之任今乃身為平章而子若姪或為參政或為尚書或領將作監會同館一門悉處要津有虧公道元主命罷黜之然終不以為阿哈瑪特罪既而淮西宣慰使昻吉爾入朝亦言官冗於是詔江西省併入福建罷𣙜茶營田司歸本道宣慰司罷漕運司歸行省辛亥元改京兆府為安西府元詔江南浙西等處毋非理征科擾民元建漢祖天師正一祠于大都令張留孫居之八月庚申月貫南斗有星墮廣州南初隕色紅大如箕中爆裂為五既墜地聲如鼓一時頃止己巳加文天祥少保封信國公張世傑封越國公天祥聞帝即位上表自劾兵敗江西之罪乞入朝優詔不許更加官爵天祥移書陸秀夫曰天子幼沖宰相遁荒詔令皆出諸公之口豈得以遊辭相拒會軍中大疫士卒多死天祥母亦病沒詔起復之天祥長子復亡家屬皆盡壬申以姚良臣為右丞相夏士林參知政事王德同知樞密院事元以中書左丞董文炳僉書樞密院事參知政事索多蒲壽庚為中書左丞九月壬午朔葬裕文昭武愍孝皇帝于永福陵廟號端宗壬辰元中書左丞行江東道宣慰使囊嘉特言江南既平兵民宜各置官屬蒙古軍宜分屯大河南北以餘丁編立部伍絶其虜掠之患分揀官僚本以革阿哈瑪特濫設之弊其將校立功者例行沙汰何以勸後新附軍士宜令行省賜其衣糧毋使闕乏元主嘉納之元徵故相馬廷鸞章鑑赴闕甲午元開酒禁初阿里阿哈瑪特子庫克新阿薩森等以崔斌論列免官至是以張惠請詔復之惠又請復其子瑪蘇呼及姪巴迪爾迪音等職元主不從元詔諭沿海官司通日本國人市舶元蒙古漢軍數路並進張洪範以舟師由海道襲漳潮惠三州李恆以步騎由梅嶺襲廣州阿里哈雅遣人招安撫使趙與珞及冉安國黃之傑等於瓊州不從率兵禦之十一月癸巳瓊州民作亂執趙與珞等降于元與珞及冉安國黃之傑皆死之閠月庚戌朔羅氏鬼國主阿榨西南蕃主韋昌盛並附於元辛亥太白熒惑填星聚於房李恆兵至清逺王道夫迎戰大敗恆遂擊凌震震又敗二人棄廣州遁恆入廣州以待張洪範十二月壬午王道夫凌震攻廣州與李恆復戰兵敗震走崖山與翟國秀軍合文天祥屯潮陽鄒􅘶劉子俊皆集師會之遂討劇盜陳懿劉興於潮興死懿遁以海舟導張洪範兵濟潮陽天祥帥麾下走海豐元先鋒將張洪正追之天祥方飯五坡嶺𢎞正兵突至衆不及戰天祥遂被執吞腦子不死鄒􅘶自刎劉子俊自詭為天祥冀元兵不窮追天祥可間走也别隊執天祥至相遇于途各爭真偽得實元遂烹子俊天祥至潮陽見洪範左右命之拜天祥不屈𢎞範釋其縛以客禮之天祥固請死𢎞範不許處之舟中族屬被俘者悉還之􅘶吉水人徙永豐子俊廬陵人庚子元敕長春宫修金籙大醮七晝夜丙午元禁玊泉山樵採漁弋戊申元封伯夷為昭義清惠公叔齊為崇讓仁惠公元導肥河入于酅淤波皆為良田元會諸王于大都以臨安所俘寶玉器幣分賜之元江南釋教總統嘉木揚喇勒智怙恩橫肆窮驕極淫以是月十二日帥徒役頓蕭山發寧宗理宗度宗楊后四陵陵使中官羅銑守陵不去與之力爭凶徒痛箠銑脅之以刃銑慟哭而去乃大肆發掘得寶玉極多截理宗頂以為飲器是夕聞四山皆有哭聲晝夜不絶陵之初發也棄骨草莽間山隂唐珏聞之痛憤亟貨家具得白金百星許執劵行貸得白金又百星許乃具酒醪市羊豕邀里中少年若干輩狎坐轟飲酒且酣少年起請曰君儒者若是將何為焉珏慘然具以告願收遺骸共瘞之衆謝曰諾中一少年曰總浮屠耽耽虎視事露奈何珏曰余固籌之矣今四郊多暴骨竄取以易誰復知之乃造數木函刻紀年一字為號分委而散遣之衆如珏指夜往拾遺骸詰朝來集出白金羡餘酬之戒勿泄越七日嘉木揚喇勒智下令裒諸陵骨雜置牛馬枯骼中建白塔於故宫欲取髙宗所書九經石刻以築基杭州總管府推官壽張申屠致逺力拒之乃止塔成名曰鎮南以厭勝之杭人悲感不忍仰視殊不知陵骨之猶存也珏奉木函瘞蘭亭山南移常朝殿冬青樹一株植其上以識遇寒食則密祭之考異西僧發陵之年月陶宗儀輟耕録載羅有開唐義士傳作戊寅十二月十二日張孟兼撰唐珏傳亦云至元戊寅故陳桱通鑑續編薛應旗王宗沐宋元通鑑並繫其事於戊寅戊寅者元世祖至元十五年實宋末帝之祥興元年也獨周密癸辛雜識云至元二十二年乙酉八月發寧宗理宗度宗楊后四陵與羅張不合陶録辨之曰丙子下江南至己酉將十載版圖必已定法制必已明安得有此事惟戊寅距丙子不三年此時庶事草創故妖髠得以肆其惡愚謂此亦非篤論元縱妖髠為惡殆非一時一事二十一年九月籍發陵所收金寶修天衣寺其明年正月髠又因僧格請毁宋郊天臺以建寺世祖從之豈其時法制尚未明耶未足證發陵決在戊寅惟謝翶晞髮集有冬青樹引贈唐珏曰知君種年星在尾張孟兼注云嵗在寅也翺與珏友善其言必無誤蓋歲星十二歲一周天惟寅年在尾箕之間酉年則不爾寅必戊寅非二十七年之庚寅又可知也今彚考羣書舍短取長年月日從羅傳發止四陵西僧盜去理宗髑髏及羅銑事四山哭聲並從癸辛雜識函各刻紀年一字為號瘞蘭亭山從張氏唐珏傳申屠致逺事從元史截理宗頂為飲器珏遇寒食密祭從彭瑋書輟耕録後餘皆仍羅傳本文又按蘭亭去蕭山七八十里續通鑑者並云少年以是夕拾骸即以是夕瘞蘭亭則事止一夜恐倉卒不能往返珏冬青行云餘花拾飄蕩白日哀后土六合忽怪事蛻龍挂茅宇辭旨甚明其奉瘞蘭亭當在他日非即夕事今特為正之或疑戊寅發陵不應至甲申始籍其所收似太遲愚又謂戊寅冬粵東未下必妖髠獻厭勝之術欲使粵東速敗故世祖聽其發掘不兩月而崖山覆沒帝服其竒驗得寶非初志也後聞所收極多乃籍之於官安得以後事疑前事耶白塔後為雷擊珏感而賦詩曰犬之年羊之月霹靂一聲天地裂蓋丙戌六月事也詹載道曰嘗疑武王代商劍鉞斬擊事竊意王者之師未必爾也紂死矣既擊之又斷其首注太白不已甚乎當時舉天下無非之者而西山餓夫獨非之昌黎頌之曰若伯夷者特立獨行窮天地亘萬古而不顧者也會稽諸陵非有商辛之虐不幸而遭樊崇當時曽無一人動孟陽之哀者嗚呼痛哉唐生一寒士耳其勢位非如孤竹君之子徒以故國遺黎不忍視其上之人之禍之慘憤激於中毁家取義為人所不敢為於不可為之時深謀祕計全而歸之智名勇功足以驚世絶俗視伯夷固未易同日語而一念之烈行之而不顧豈非韓子所謂千百年乃一人者與是歲元雲南行省奏招降諸蠻城寨一百二十餘所安西王相府亦奏西蜀悉平得城邑山寨洞穴八十三所二年春正月己酉朔帝在崖山元無籍軍侵掠平民而諸王哲伯特穆爾所部為暴尤甚甲寅命捕為首者置之法辛酉合州安撫使王立以城降於元先是元東川行院恥功不成乃辭西川而自以兵圍合州立與東川有深怨懼降而受戮乃遣間使納欵於西川安西王相李德輝單舸至城下呼立出降安集其民而罷置其吏合人德之東川行院與德輝爭功因奏立久抗王師嘗指斥憲宗宜殺之降臣李諒亦訟立前殺其妻子有其財物遂詔殺立籍其家籍償諒既而安西王具立降附本末來上且言東川院臣憤德輝受降之故誣奏誅立元主乃召立入覲命為潼川路安撫使知合州事元張𢎞範由潮陽港乘舟入海至甲子門獲斥候將劉青顧凱知帝所在壬戌𢎞範兵至崖山或謂張世傑曰北兵以舟師塞海口則我不能進退盍先據之幸而勝國之福也不勝猶可西走世傑恐久在海中士卒離心動則必散乃曰頻年航海何時已乎今須與決勝負遂焚行朝草市結大舶千餘作一字陳碇海中中艫外舳貫以大索四周起樓棚如城堞奉帝居其間為死計人皆危之崖山北水淺舟膠不可進𢎞範由山東轉而南入大洋與世傑之師相遇薄之且出竒兵斷官軍汲路世傑舟堅不能動𢎞範乃舟載茅茨沃以膏脂乘風縱火焚之世傑戰艦皆塗泥縛長木以拒火舟不爇𢎞範無如之何時世傑有韓氏甥在元軍中𢎞範三使其甥招世傑世傑不從曰吾知降生且富貴但義不可移耳因歷數古忠臣以答之𢎞範乃命文天祥為書招世傑天祥曰吾不能扞父母乃教人叛父母可乎固命之天祥遂書所過零丁洋詩與之其末有云人生自古誰無死留取丹心照汗青𢎞範笑而止𢎞範復遣人語崖山士民曰汝陳丞相已去文丞相已執汝復欲何為士民亦無叛者𢎞範又以舟師據海口世傑兵士茹乾糧飲海水水鹹致嘔泄皆大困世傑帥蘇劉義方興等旦夕大戰庚午元李恆兵自廣州來會與𢎞範合守崖山北丙子元以中書左丞托克里伊實同知樞密院事元賜亷希憲鈔萬貫詔復入中書希憲稱疾篤皇太子遣侍臣問疾因問治道希憲曰君天下在用人用君子則治用小人則亂臣病雖劇委之於天所甚憂者大姦專政羣小阿附誤國害民病之大者殿下宜開聖意急為屛除不然日就沉痾不可藥矣戒其子曰丈夫見義勇為禍福無預於己謂臯夔稷契伊傅周召為不可及是自棄也天下事茍無牽制三代可復也又曰汝讀狄梁公傳乎梁公有大節為不肖子所墜汝輩宜慎之二月戊寅朔張世傑部將陳寶降元己卯都統張逹夜襲元軍敗還癸未元張洪範四分其軍自將一軍相去里許令諸將曰宋舟西艤崖山潮至必東遁急攻之聞吾樂作乃戰違令者斬時黑氣出山西李恆乘早潮攻其北張世傑以淮兵殊死戰至午潮上元軍樂作世傑以為且宴少懈不設備𢎞範以舟攻其南世傑南北受敵兵士皆疲不能復戰俄有一舟檣旗仆諸舟之檣旗皆仆世傑知事去乃抽精兵入中軍諸軍大潰翟國秀凌震等皆解甲降元元軍薄中軍會日暮風雨昏霧四塞咫尺不相辨世傑遣小舟至帝所欲奉帝至其舟謀遁去陸秀夫恐為人所賣或被俘辱執不肯赴帝舟大且諸舟環結秀夫度不得出脫乃先驅其妻子入海謂帝曰國事至此陛下當為國死德祐皇帝辱己甚陛下不可再辱即負帝同溺後宫諸臣從死者甚衆世傑乃與蘇劉義斷維奪港乘昏霧潰去餘舟尚八百盡為𢎞範所得越七日尸浮海上者十餘萬人元卒求物尸間遇一尸小而晳衣黃衣負詔書之寶卒取寶以獻𢎞範亟往求之已不獲矣遂以帝崩報時帝年九歲楊太后撫膺大慟曰我忍死間關至此者止為趙氏一凷肉耳今無望矣遂赴海死世傑葬之海濵世傑將趣占城土豪強之還廣東乃回舟艤南恩之海陵山散潰稍集颶風忽大作將士勸世傑登岸世傑曰無以為也登柂樓露香祝曰我為趙氏亦已至矣一君亡復立一君今又亡我未死者庶幾敵兵退别立趙氏以存祀耳今若此豈天意耶風濤愈甚世傑墮水溺死宋亡陸秀夫在海上記二王事為一書甚悉以授禮部侍郎鄧光薦曰君後死幸傳之光薦以其書還廬陵光薦卒遂失傳史臣曰宋雖起於用武功成治定之後以仁傳家然仁之弊失於弱中世有欲自強以革其弊用乖其方馴致棼擾建炎而後土宇分裂猶能六主百五十年而後亡豈非禮義足以維持君子之志恩惠足以固結黎庶之心與所可恨者嗣主昏庸姦臣接迹終焉大命以傾雖有善者亦末如之何區區奉二王為海上之謀固無救於亡然人臣忠於所事而至於斯其亦可悲也夫元以征日本敕揚州湖南贛州泉州造戰船六百艘詔湖南行省於戍軍還途每四五十里立安樂堂疾者醫之飢者廪之死者官給其需藁葬之禁諸鄂囉及漢人持弓矢其出征所持兵仗還即輸之官庫先是郭守敬言厯之本在於測驗而測驗之器莫先儀表今司天渾儀宋皇祐中汴京所造不與此處天度相符比量南北二極約差四度表石年深亦復欹側守敬乃盡考其失而移置之既又别圖髙爽地以木為重棚創作簡儀髙表用相比覆又以為天樞附極而動昔人展管望之未得其的作候極儀極辰正位天體斯正作渾天象象雖形似莫適所用作玲瓏儀以表之矩方測天之正圜莫若以圜求圜作仰儀古有經緯結而不動守敬易之作立運儀日有中道月有九行守敬易之作證理儀表髙景虛罔象非真作景符月雖有明察景則難作窺几厯法之驗在於交會作日月食儀天有赤道輪以當之兩極低昻標以指之作星晷定時儀又作正方案九表懸正儀座正儀為四方行測者所用又作仰規覆矩圖異方渾蓋圖日出入永短圖與上諸儀互相參考至是以王恂為太史令守敬同知太史院事始進儀表式守敬當上前指陳理致至於日晏元主不為倦守敬因奏唐一行開元間令南宫説天下測景書中見者凡十三處今疆宇比唐尤大若不逺方測驗日月交食分數時刻不同晝夜長短不同日月星辰去天髙下不同即目測驗人少可先南北立表取直測景元主可其奏遂設監候官一十四員分道而出東至髙麗西極滇池南踰朱崖北盡鐡勒四海測驗凡二十七所三月壬子囊嘉岱括兩淮造回回炮新附軍匠六百及蒙古回回漢人新附能造炮者俱至京師丙寅敕中書省凡掾史文移稽緩一日二日者杖三日者死潭州行省招下西南諸蕃甲戌以龍方零等為小龍蕃等處安撫使仍以兵三千戍之詔太常寺講究州縣社稷制度禮官折衷前代參酌儀禮定祭祀儀式及壇壝祭器制度圖寫成書名曰至元州縣社稷通禮夏四月大都等十六路蝗帝師帕克斯巴卒伊璘沁嗣為帝師賜帕克斯巴號皇天之下一人之上宣文輔治大聖至德普慧真智祐國如意大寶法王西天佛子大元帝師五月辛亥以泉州經張世傑兵減今年租賦之半丙辰以五臺僧多匿逃奴及逋賦之民敕西京宣慰司案察司搜索之丙寅敕江南僧司文移毋輒入遞丙子命宗師張留孫即行官作醮事奏赤章於天凡五晝夜初元軍破江西南安守臣迎降獨南安縣不下縣人李梓發黃賢共推縣尉葉茂為主繕治守具元軍至城下輒敗上年十二月達實引衆萬餘攻之邑猶彈丸城牆甫及肩梓發率衆死守晝則隨機應變夜則鳴金鼓劫寨達實等相顧曰城子如楪大人心乃爾硬耶遂親至城下諭降城上裸譟大罵俄炮發幾中達實乃徙寨水南自冬徂春力攻三十五日死者數千不能克久之葉茂出降元軍乃退梓發賢堅守如故及崖山破參政賈居貞又往諭降城上仍詬罵不已時衆稍稍徙去心力懈於前居貞命方文等進攻凡十五日城陷屠之梓發舉家自焚縣人多殺家屬巷戰殺敵猶過當甲申勑造戰船征日本以髙麗材用所出即其地製之令髙麗王議其便以聞雲南都元帥愛都尼雅斯迪音將兵扺金齒蒲驃緬國界內招下忙木巨木秃等三百寨籍户十一萬詔定賦租立站遞設衛送軍軍還獻馴象十二辛丑以通州水路淺舟運甚艱命樞密院發軍五千仍令食祿諸官雇役千人開浚以五十日訖工甲辰以阿哈瑪特子庫克新為潭州行省左丞呼實哈雅等並復舊職命五臺山作佛事秋七月丁巳交趾國遣使貢馴象壬戌阿里哈雅入覲獻金三千五百八十兩銀五萬三千一百兩罷潭州行省造征日本及交趾戰船癸酉西南八番羅氏等國內附洞寨凡千六百六十二命薩敦修佛事十有五日八月丁丑元主歸自上都如上都元史失書戊子范文虎言臣奉詔征討日本比遣周福欒忠與日本僧賫詔往諭其國期以來年四月還報待其從否始宜進兵從之庚寅元主以每歲聖誕節及元辰日禮儀費用皆斂之民詔天下罷之甲辰詔漢軍出征逃者罪死且沒其家九月庚戌詔行省左丞庫克新兼領杭州等路諸色人匠以杭州稅課所入歲造繒段十萬以進阿哈瑪特言王相府官趙炳云陜西課程歲辦萬九千錠所司若果盡心措辦可得四萬錠即命炳總之同知揚州總管府事董仲威坐贓罪行臺方按其事仲威反誣行臺官以他事詔免仲威官仍沒其産十之二戊午議罷漢人之為逹嚕噶齊者己巳樞密院臣言有唐古岱者冒禁引軍千餘人於辰溪沅州等處劫掠新附人千餘口及牛馬金銀幣帛而麻陽縣逹嚕噶齊武伯巴哈為之鄉導敕斬唐古岱武伯巴哈餘減死論以所掠者還其民崖山之破也張𢎞範等置酒大會謂文天祥曰國亡丞相忠孝盡矣能改心以事宋者事今將不失為宰相天祥泫然出涕曰國亡不能救為人臣者死有餘罪况敢二其心乎𢎞範義之遣使護送天祥赴燕太學生廬陵王炎午作生祭文以祭文天祥曰嗚呼大丞相可死矣華元踉蹡子胥脫走丞相自敘死者數矣誠有不幸則國事未定臣節未明今鞠躬盡瘁則諸葛矣保扞閩廣則田單即墨矣倡義勇出師則顔平原申包胥矣雖舉事率無所成而大節亦無愧所欠一死耳奈何再執涉月踰時就義寂寥聞者驚惜豈丞相尚欲脫去耶尚欲有所為耶昔東南全盛不能解襄圍今以亡國一夫而欲抗天下况趙孤蹈海楚懷入關商非前日之頑周無未獻之地南山之勢既合天人之際可知彼齊廢齊興楚亡楚復皆兩國相當之勢而兩君大臣固無恙耳今事勢無可為而臣皆為執矣臣子之於君父臨大節決大難事可為則屈意忍死以就義必不幸則仗大節以明分故身執而勇於就義當以顔杲卿張巡為上李陵降矣而曰欲有為且思刎頸以見志其言誠偽既不可知况形拘勢禁不及為者十八九丞相之不為陵不待智者而信奈何慷慨遲回日久月稽丞相不死當有死丞相者矣丞相何所俟乎以舊主尚在未忍棄捐也李忭篡楊行密之業遷其子孫於廣陵嚴兵守之至子孫自為匹耦然猶得不死周世宗征淮南下詔撫安楊氏子孫忭驚疑盡殺其族夫撫安本以為德乃反為禍幾微一失可不懼哉蜀王衍既歸唐莊宗發三辰之誓全其宗族未幾信伶人景進之計衍族盡誅幾微之倚伏可不畏哉夫以趙祖之遇降主天固巧於報施然建共暫處倨坐茍安舊主正坐危疑羈臣猶事骯髒而聲氣所逼猜嫌必生豈無李忭之疑或景進之計則丞相於舊主不足為情而反為害矣炎午丞相鄉之晚進也前成均之弟子員進而父沒退而國亡生雖愧陳東報汴之忠死不效陸機入洛之恥丞相起兵次鄉國時有少年狂子持棐牘呌軍門丞相察其幽憤而進之憐其親老而退之非僕也耶痛惟千載之事既負於前一得之愚敢沒於後進薄昭之素服先元亮之挽歌願與丞相商之廬陵非丞相父母之邦乎趙太祖語孟昶母曰勿戚戚行遣汝歸蜀昶母曰妾太原人願歸太原不願歸蜀契丹遷晉出帝及李太后安太妃于建州太后疾亟謂帝曰我死焚其骨送范陽僧寺無使為異地鬼也安太妃臨卒亦謂帝曰當焚我為灰向南揚之庶遺魄得返中國也彼婦人彼國后一死一生尚眷眷故鄉不忍飄棄仇讐外國况忠臣義士乎人不七日榖則斃自梅嶺以出縱不得留漢廄而從田橫亦當吐周粟而友孤竹至父母邦而首丘焉廬陵盛矣科目尊矣宰相忠烈合為一傳矣舊主為老死於降邸宋亡而趙氏絶矣不然或拘囚而不死或秋暑冬寒五日不汗瓜蒂噴鼻死溺死畏死排牆死盜賊毒蛇猛虎死輕一死於鴻毛虧一簣於泰山而或遺舊主憂縱不斷趙盾之殺君亦將悔伯仁之由我則鑄錯已無鐵噬臍寧有口乎嗚呼四忠一節待公而六為位其間聞訃則哭文天祥行至南安始繫頸縶足天祥痛恨不食八日猶生冬十月至燕館人供帳甚盛天祥不寢處坐逹旦遂移兵馬司設卒守之坐十餘日解手縛又十餘日天祥疾去械擊頸南冠而坐未嘗面北留夢炎説之則罵王積翁欲合降臣謝昌元等十人請釋天祥為道士夢炎不可曰天祥出復號召江南置吾十人於何地事遂已既而丞相博囉等召見於樞密院天祥入長揖欲使跪天祥曰南之揖北之跪豫南人行南禮博囉叱左右曳之地或抑頸或扼背或按足或以膝倚天祥不屈通事問有何言天祥曰自古有興有廢帝王將相滅亡誅戮何代無之我盡忠於宋以至此願求早死博囉曰汝謂有興有廢且問盤古至今日幾帝幾王天祥曰一部十七史從何處説起我今日非應博學宏詞科何暇泛論博囉曰汝不肯説廢興事且道古來有以宗社與人而復逃者乎天祥曰奉國與人是賣國之臣也賣國者必不去去者必非賣國者也豫前除宰相不拜奉使軍前尋被拘執不幸有賊臣獻國國亡當死所以不死者為度宗二子在浙東老母在廣故耳博囉曰棄德祐嗣君而立二王忠乎天祥曰當此之時社稷為重君為輕吾别立君為宗廟社稷計也從懷愍而北者非忠從元帝為忠從徽欽而北者非忠從髙宗為忠博囉不能詰平章以下皆笑有問晉元帝宋髙宗有所受命二王立不以正是篡也天祥曰景炎乃度宗長子德祐親兄不可謂不正即位於德祐去國之後不可謂篡陳丞相以太皇命奉二王出宫不可謂無所受命博囉等皆無辭但以無所受命為解天祥曰天與之人歸之雖無傳受之命推戴擁立亦何不可博囉怒曰汝立二王竟成何功天祥曰立君以存宗社存一日則盡臣子一日之責何功之有博囉曰既知其不可何必為天祥曰父母有疾雖不可為無不下藥之理盡吾心焉不可救則天命也文天祥今日至此惟有一死不在多言博囉欲殺之元主及諸大臣不可張𢎞範病中亦表奏天祥忠於所事願釋勿殺乃復囚之考異宋史天祥傳世祖多求才南官王積翁言南人無如天祥者遂遣積翁諭旨天祥曰國亡吾分一死矣倘緣寬假得以黃冠歸故鄉他日以方外備顧問可也若遽官之非直亡國之大夫不可與圖存舉其平生而盡棄之將安用我陳桱通鑑續編同按天祥對博囉之言惟求早死豈復有黃冠歸故鄉之想此必留夢炎輩忌天祥全節者因積翁有請釋為道士意遂附會其語以誣天祥耳今不取明季有井中心史一書載天祥對博囉之言頗不同是書乃姚士粦偽撰託名宋鄭思肖不可用此據薛氏宋元通鑑及唐順之史纂左編修入士粦字叔祥嘉興海鹽人乙酉元主御香閣命大樂署令完顔椿等肄文武樂千户托囉總把呼克岱擅引軍入婺州永康縣界殺略吏民事覺自陳扈從先帝出征有功乞貸死敕沒入其家資之半杖遣之辛丑以月直元辰命五祖真人李居壽作醮事五晝夜而畢居壽請間言皇太子春秋鼎盛宜預國政帝喜曰尋將及之明日詔皇太子燕王參決朝政凡省院臺司之事皆先啓後聞十二月丁酉敕自明年正月朔建醮於長春宫凡七日歲以為例增置宿衛初宿衛皆領於四集賽以太祖功臣博勒呼博爾濟穆呼哩齊爾溫四族世領集賽之長集賽者華言分番宿衛也年勞既久即擢為一品或以才能任使貴盛雖極一日歸至內庭則執事如故其後集賽增至四千八百而纍朝鄂爾多集賽尤多為國大費建聖壽萬安寺于京城帝師伊璘濟卒勑諸國教師禪師百有八人即萬安寺設齋圓戒賜衣是歲詔諭安南世子陳日煊及占城國王責其來朝雲南行省平章政事薩達齊瞻斯丹卒百姓巷哭交趾國王遣使者十二人衰絰為文致祭其辭有生我育我慈父慈母之語使者號泣震野資治通鑑後編卷一百五十二
