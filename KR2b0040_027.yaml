body:
  text: 資治通鑑後編卷二十七刑部尚書徐乾學撰宋紀二十七起屠維作噩正月盡上章掩茂五月凡一年有竒真宗膺符稽古神功讓德文明武定章聖元孝皇帝大中祥符二年正月丁巳朔召輔臣至內殿朝拜天書自是嵗以為常己巳封皇姊晉國長公主為大長公主皇妹魯國長公主為韓國長公主夀昌長公主為陳國長公主漢制天子之女稱公主姊妹稱長公主姑稱大長公主後漢皇女皆稱縣公主其尊崇者亦加號長公主唐制有以國名郡名或美名者而皇姊無長大之稱今有是命緣後漢尊崇故事也御史中丞王嗣宗言翰林學士楊億知制誥錢惟演祕閣校理劉筠唱和宣曲詩述前代掖庭事詞涉浮靡帝曰詞臣學者宗師也安可不戒其流宕乃下詔風厲學者自今有屬詞浮靡不遵典式者當加嚴譴其雕印文集令轉司擇部內官看詳以可者録奏吕中曰大風之歌其高帝霸心之所存乎秋風之歌其漢武悔心之所存乎蓋帝王之文不當以文論當以心論以我真宗之本心可知矣此書不載慶雲之歌而載明良之歌也至于下詔戒勵詞臣浮靡是又以人文化成天下者也變天下之文自朝廷始變朝廷之文自人主之文始人知西崑之體變於歐陽倡古文之時而不知已源流於此時矣帝自東封還羣臣獻賀功德者相繼惟進士孫籍獻書言封禪帝王之盛事然願陛下謹於盈成不可遂自滿假帝善其言即召試中書庚午賜同進士出身時知制誥周起亦上言天下之勢常患恬於逸安而忽於兢畏願毋以盈成為恃帝深納之去冬有詔京師賜酺五日以二月五日為始於是久旱右僕射張齊賢言宴樂陽事也甫經上元又將酺飲恐非所以答天意請俟雨足乃如詔旨從之初蘇州僧道元纘佛祖訖近世名僧禪語為傳燈録三十卷以獻詔楊億李維王曙刋定庚辰億等上其書命刻板宣布以殿中丞孔朂知曲阜縣兼檢校先聖廟賜緋魚朂請就先聖廟創立學舍及於齋廳講説皆許之乙酉命户部尚書溫仲舒右丞向敏中與吏部流內銓注擬選人先是帝謂輔臣曰吏部銓引對羣吏或經旬不入何也陳堯叟曰選人甚多極聞稽滯因言舊有鎖銓之制帝曰今員多闕少四時許選猶慮壅塞況鎖銓乎堯叟又請取舊省員復置如六曹官凡百州乃得六百員王旦曰今選集待闕者二千餘人縱增二三百員亦無益也乃詔仲舒等同領選事以督之是月以美人劉氏為修儀才人楊氏為媫妤二月令陜西發廪振糶旱故也辛丑分遣使臣出常平倉粟麥於京城四面開八場減價糶之以平物價己酉雨樞密院言昨奉詔賜酺以旱權罷今時雨霑洽欲奉行前詔從之以三月十六日為始庚戌布衣林虎伐登聞鼓上言國家遣官祈雨車駕遍詣宫寺雖再雨而未足願去邪佞尸素之臣明賞罰黜陟之令則天自雨帝曰所言邪佞尸素當斥其名賞罰黜陟悉陳非當朕豈吝於采拔然姓林名虎尚怪者也命中書召問虎無以對罷之以盧多遜子復州司士參軍察付吏部銓注簿尉察景德二年舉進士禮部奏名在髙等或言多遜子不當與科第故特命為州掾及是乃授親民官明年察奉多遜喪歸葬襄陽又詔本州賜察錢三十萬應天府民曹誠以資募工就戚同文所居造舍百五十間聚書千餘卷博延生徒講習甚盛府奏其事帝嘉之詔賜額曰應天府書院命奉禮郎戚舜賔主之仍令本府幕職官提舉又署誠府助教舜賔同文孫綸子也癸丑太常博士知溫州李邈言準詔禁金銀箔線裝飾服用之物伏見兩浙僧求丐金銀珠玉錯末和泥以塑塔像有髙袤丈者毁碎珍寶寖以成俗望嚴行禁絶違者重論其罪從之封太常博士陳從易祖母詹氏為河間縣太君從易以東封恩例當封母妻請回妻封以及祖母故也三月丙辰朔日有食之辛未帝御乾元樓觀酺自是凡五日夏四月戌子升州大火遣御史訪民疾苦蠲被火屋稅武勝節度使駙馬都尉吳元扆純謹謙遜在藩鎮有憂民之心待賔佐以禮處事畏敬所至能檢下未嘗踰矩奉身簡素鮮聲色狗馬之好所得祿賜皆分給親族之孤貧者於是受詔知徐州請對言臣族屬至多其堪任祿仕者皆已奏薦不任者悉均奉贍之公主有乳媪在得入參宫禁慮臣去後託以干祈望陛下不納帝深歎其賢分定天書及大駕儀仗别飾玉輅以奉天書題榜曰天書玉輅壬辰江淮發運使李溥言糧綱卒隨行有少貨物經歷州縣悉收稅算望與蠲免從之給事中判集賢院种放得告歸終南山是日召見宴錢于龍圖閣帝作詩賜放命羣臣皆賦且製序杜鎬辭以素不屬文詔令引名臣歸山故事鎬因誦北山移文其意蓋譏放也明日帝出朝迥以下詩序示王旦等因題品之以迥詩及楊億王曽序為優詔令别自繕寫送放時論榮之丙申入內供奉官鄭志誠自茅山使還言至升州見黃雀羣飛蔽日往往從空而墜又聞空中若水聲帝曰是皆異常而州不以言何也因出占書示王旦等曰此皆民勞之兆若守臣知人疾苦能防於未然則可免禍今張詠在彼吾無慮矣先是城中多火詠亷得不逞之民潛肆燔爇者折其足而斬之由是遂絶己亥以三司使丁謂為修昭應宫使初議作宫命謂經度謂欲殫國財用規摹宏大近臣多言其不可殿前都虞侯張旻亦言土木之侈不足以承天意帝召問謂謂曰陛下富有天下建一宫崇奉上帝何所不可且今未有皇嗣建宫於宫城之乾地正可以祈福羣臣不知陛下此意或妄有沮止願以此諭之既而王旦又密疏諌帝帝諭之如謂所對旦遂不敢復言於是特建使名令謂専總其事詔自今諸路轉運使副提點刑獄所舉官如進改後五年無過有勞幹者并舉主特加酬奬先是帝謂宰臣曰舉官犯贓則連坐而得人者賞弗之及非所以勸也故有是詔吕中曰分天下為郡縣總郡縣為一道而又總諸道於朝廷委郡縣於守令總守令於監司而又察監司於近臣此我朝內外之紀綱也故欲擇守令必責之轉運欲舉轉運必責之近臣既嚴連坐之罰又定舉官之賞而失察者又有罪賞罰行而紀綱正矣然賞罰但行於己舉之後舉官當擇於未舉之先蓋惟正知正惟邪知邪善惡各以類至此真宗所以先擇舉主也壬寅詔禁中外羣臣非休暇無得羣飲廢職五月乙卯朔詔追封孔子弟子兖公顔回為國公費侯閔損等九人為郡公郕伯曽參等六十二人為列侯宰相羣官分撰贊韶州獻頻婆果後以道逺罷之考異實録作千嵗果壬戌詔兖州長吏以天書降泰山日詣天貺殿建道場設醮以其節為天貺節令諸州皆設醮從知并州劉綜請也丙寅召宰相至龍圖閣觀道像又觀崇和殿瑞物凡四百餘種王旦等稱賀是日以昭應宫興工宴丁謂以下仍賜役卒緡錢祠部員外郎直集賢院錢塘楊侃請令諸州屬縣無遣胥吏下鄉追事從之侃虞卿之後也代州地震六月丁酉詔修昭應宫役夫三伏日執土作者悉罷之時丁謂欲速成請三伏不賜休假王旦言當順時令乃降是詔先是瑞應沓至知制誥王曽奏曰此誠國家承平所致然願推而弗居異日或有災沴則免輿議及帝既受符命大建玉清昭應宫復上疏曰伏睹國家誕受殊祥薦膺祕籙陛下寅畏寶符陟封名嶽奉若之心斯為至矣而清衷濬發成命亟行就嚴城之北隅啓列真之祕宇自經始以來庀徒斯廣輦他山之石伐豫章之材纍土陶甓揮鍤運斤功極彌年費將巨萬國家尊奉靈文之意不為不厚矣然臣之愚懇或異於斯既有見聞安敢緘默臣以為今之興作有不便之事五焉請為陛下陳之創立之宫規制宏大凡用材木莫非楩楠般運赴宫尤傷人力雖云只役軍匠寧免煩擾平民況復軍人亦是黎庶此未便之事一也方畢封崇復兹興造內帑傾積代之蓄藏百物盡生民之膏血散之孔易斂之惟艱此未便之事二也禍起隱微危生安逸今雙闕之下萬衆畢臻所役諸雜兵士多是不逞小民其或鼠竄郊鄽狗偷都市有一於此足貽聖憂此未便之事三也王者順承天地舉動必遵於時令財成不失於物宜臣謹按孟夏無發大衆無起土工無伐大樹今肇基卜築衝冒欎蒸俶擾厚坤乖違前訓矧復旱暵卒癢比屋罹災得非失承天地之明效歟此未便之事四也臣竊聆符命亦言清淨育民乃過興剖撅之功廣務雕鎪之巧屢殫物力未協天心此未便之事五也伏望陛下思祖宗之大猷察聖賢之深戒止敦朴素無取瑰竒俾四海之內知陛下重愛民力之意豈不美歟昔太宗皇帝建太一上清等宫亦不使窮極壯麗臣謂陛下宜遵而行之方今疆場甫定西北有姑息之虞民俗茍完倉箱無紅腐之積況關輔之地流亡素多近甸之氓農桑失望雖令有司安慰亦恐未復田廬秋冬之間飢歉是懼亟經營於神館慮稍欎於輿情且往古廢興之端前王得失之事布告方册足為商鑒者陛下覽之詳矣試觀自昔人君崇尚土木孰若清淨無為者之安全乎願陛下留神垂聽無忽臣言則天下幸甚考異王曽疏在言行録不得月日曽疏有云功極彌年恐合附來年五月疏又云旱暵案今年五月庚辰遣官祈雨來年五月辛丑京師大雨然則附今年五月為允帝自景德四年以來不復出獵壬寅詔五方鷹鶻量留十數以備諸王從時展禮餘悉縱之庚戌帝御崇政殿親試進士諸科賜進士梁固等及第出身有差固皓之子也初以皓遺廕賜進士出身服除詣登聞讓前命願赴鄉舉許之昭應宫初相地止盡內殿真班院丁謂等復請增衍之多黑土疏惡乃於東京城北取良土易之自三尺至一丈有六等日役工數萬上以道里稍逺憫其負擔之勞壬戌詔三司以空船給昭應宫運土仍浚治渠道秋七月丁巳置糾察在京刑獄司以知制誥周起侍御史趙湘領之三司請出內藏綾萬匹以助經費從之復以萬安宫為滋福殿先是有詔減鄜延路駐泊兵九指揮歸營乙丑鈐轄李繼昌等言邊防備豫望許如舊帝以夷落安靜冀省轉輸之勞不許辛未以昭應宫為玉清昭應宫戊寅詔封玄聖文宣王廟配享先儒魯史左丘明等十九人爵為伯贈蘭陵侯王肅司空當陽侯杜預司徒命近臣各撰贊庚辰侍御史趙湘判三司都催欠司彭維等條上封禪赦前天下逋負總千二百六十萬七千悉除之八月帝欲擇官知審刑院謂宰相曰當須詳悉法令之人王旦曰今司法有人知院者但能曉逹事理詳究物情不必熟法令者帝然之祕書丞董溫其上言漢以霍山為南嶽望令夀州長吏春秋致祭詔禮官與崇文院檢討詳定上奏言奉祀已久難以改制其霍山如有祈請及别敕致祭即委州縣奉行從之後宫杜氏昭憲皇后姪女也帝禁銷金嚴甚還自東封杜氏乃服以迎車駕帝見之怒遂令出家洞真宫為道士由是天下無敢犯禁者考異李燾曰杜氏入道事迹國史不載今據江休復雜志編入江云太常宫誤也知雜御史趙湘言臣聞君臣之際禮義攸行朝廷之儀進止有度故辨色而皆入或假寐以待時茍夙興之不勤何匪懈之能竭況乎稱疾尤屬慢朝若無察視之規孰執曠官之咎伏見常參文武官每日趨朝並早赴待漏院候開內門齊入今以辰漏上始放朝故多後時乃入望許令知班驅使官二人常在正衙門視之有入晚者具名申奏又風雨寒暑稍甚即多稱疾請假望委御史臺酌度聞奏遣官診視如顯有誑妄即具彈劾從之九月壬子朔入內供奉官王承勛言準詔於洺州塞漳河水口本州差權推官祖百世監督兵夫頗見勤盡望即授正任帝曰州縣官除幕職皆自特恩內臣豈當論請即令吏部銓擬官代之凡內侍有過者責為灑掃院子乙卯賜其名曰散內品先是命供備庫使謝德權決金水河為渠自天波門並皇城至乾元門歷天街東轉繚太廟皆甃以礲甓樹之芳木車馬所度又纍石為梁間作方井宫寺民舍皆得汲用復東引由城下水竇入于濠京師便之丁卯德權奏功畢詔宗正告廟室賜役卒緡錢司天言太隂當食之既翌日皇帝本命請禱祀之帝曰經躔已定何可祈也不許既而候之不虧宰臣表賀甲子命工部侍郎馮起為契丹國信使邵州防禦使廣平公德彛言女適殿直郭中和家族頗衆欲為别置一第帝曰中和有父母若從其請則婦事舅姑之禮闕矣不許乙亥無為軍言大風拔木壞城門營壘民舍壓溺者千餘人詔內臣恤視蠲來年租收瘞死者家賜米一斛先是帝謂王旦等曰朕在東宫講尚書凡七遍論語孝經亦皆數四今宗室諸王所習惟在經籍昨奏講尚書第五卷此甚可喜也於是召寧王元偓等赴龍圖閣觀書目帝諭之曰宫中嘗聽書習射最勝他事元偓曰臣請侍講張頴説尚書間日不廢弓矢因陳典謨之義帝喜乃詔每講日賜食命入內副都知張繼能主其事尚慮元偓等輕待専經之士又加訓督焉是秋京西河東陜西江淮荆湖路鎮定益梓卭密等州言豐稔京師粟斗錢三十冬十月癸未雄州奏契丹改築新城帝謂輔臣曰景德誓書有無創修城池之約今此何也陳堯叟曰彼先違誓修城亦此之利也帝曰豈若遺利而敦信乎且以此為始是當有漸宜令邊臣詰其違約止之則撫御逺俗不失其歡心矣濠州民齊睿坐惡逆逃亡會東封首露州用赦原之知定逺縣王仲微言通判度支員外郎趙况受睿錢三百千不以上聞請重置其罪詔特斬睿論況枉法除名為民況范陽人右丞上交子也御史中丞王嗣宗言許州積水害民田蓋惠民河不謹隄防每嵗決壞即詔閣門祗候錢昭厚經度之昭厚請開小潁河分導水勢帝曰泄其上源無乃移患於下流乎昭厚不能對判陳州石保吉復言此河浸廣則郡當水衝為害之大乃命白陂發運判官史瑩視之瑩請頓固雙斗門於減水河口為束水鹿巷以均節壅溢奏可因詔三班選幹局習事者巡護隄岸殿最如黃汴法自是吏謹其職而水災稍息甲午詔天下並建天慶觀先是道教之行時罕習尚惟江西劍南人素崇重及是天下始遍有道像矣殿中侍御史張士遜上言今營造競起逺近不勝其擾願因諸舊觀為之詔從其請御史中丞權判吏部銓王嗣宗剛果率易無所畏憚每進見極談時事或及人間細務頗輕險好進深詆馮拯之短而結王旦弟旭使逹意於旦以為助旦疾其醜行因力庇拯嗣宗大恚因托拾知制誥王曽從妹夫孔冕被曽誣搆及侯德昭援赦敘緋李永錫坐贓除名復引充舊職等事欲以傾旦帝曰止此乃致旱耶嗣宗理屈復以他辭侵旦旦不之抗乃已是月嗣宗請對言去嵗八月至今年十月不雨宿麥不登及秋兖鄆苦雨河溢害稼蓋刑政有失致成災沴因復言孔冕寃枉播在人口而王曽尚居近班願示黜退以正朝典臣請露章以聞帝謂王旦等曰曽實無罪若嗣宗上章亦須裁處旦曰冕不善之迹甚衆但以宣聖之後不欲窮究謂其寃枉感傷和氣恐未近理翌日嗣宗復對且謝前言之失帝優容之其狂妄多如此類十一月壬子朔知鄧州張知白言陜西流民相續入境有欲還本貫而無路糧者臣誘勸豪民出粟數千斛計口給之以半月為凖凡就路總二千三百家萬二百餘口其支貸有餘者悉給貧老詔奬之衛尉卿權判刑部填從吉言準淳化三年敕諸州所奏獄空須是司理院州司倚郭縣俱無繫囚又準後敕諸路自今獄空更不降詔奬諭臣伏見提點刑獄司所奏獄空本司比對多不應舊敕外州妄覬奬飾沽市虛名近邠滄二州勘鞫大辟囚干詿數人裁一夕即行斬決伏見前代京師決獄尚五覆奏蓋欲謹重大辟豈宜一日之內便決死刑朝廷比務審詳恐有寃濫非有求於急速其間州府不體朝廷邀為己功但務獄空必無所益欲望依準前詔不行奬諭其諸州府軍監以公事多少分為三等第一等公事多處五日其次十日其次二十日並須州司理院倚郭縣全無禁囚及責保寄店之類方為獄空委提點刑獄司據等第日數勘驗得實書於印歷從之丙辰帝作文武七條戒官吏謂宰相曰漢制刺史以六條諸葛亮有武臣七戒朕今參求要道以警勵羣臣又思先朝以儒行篇賜近臣今可并賜一軸甲子詔諸路官吏有蠧政害民辨鞫得實本路轉運使提點刑獄官不能舉察者論其罪先是知晉州齊化基知鄜州何士宗皆坐贓抵法監司初不以聞故申敕之帝謂宰相曰聞隴州推官陳漸不能謹潔轉運使以堯叟諸姪不能案舉昨因違越被劾堯叟特為請令罷任自今儻如此必正其罪不復貸矣十二月辛丑三司使丁謂等上泰山封禪朝覲祥瑞圖百五十昭宣使劉承圭上天書儀仗圖一召近臣觀於滋福殿俄又示百官於朝堂契丹承天皇太后蕭氏殂年五十七諡曰神聖宣獻契丹主哭必嘔血遣天平節度使耶律信寧馳騎來告涿州先牒雄州雄州以聞甲辰詔廢朝七日令禮官詳定服制復命太常博士王隨為祭奠使太常博士王曙等為弔慰使賻以衣五襲綾羅布帛萬匹乙巳賀正使耶律圖嚕古初入見既還館令客省使曹利用以涿州牒示之戊申告哀使耶律信寧至閣門使受書進內詔圖嚕古等就開寶寺設位奠哭百官詣都亭驛弔之己酉帝於內東門制服發哀召信專入內親加恤問羣臣進名奉慰蕭太后有機謀善馭左右大臣多得其死力先是蕃人毆漢人死者償以牛馬漢人則斬之仍沒其親屢為奴婢后一以漢法論每戎馬入冦親披甲督戰及通好亦出其謀然天性殘忍多殺戮始歸政於契丹主未踰月而殂耶律隆運尋亦卒隆運即韓德讓也內外制服與后同柩而葬無子以吳王隆裕子周王承業為後是嵗天下户八百四十萬有竒趙德明帥所部出侵回鶻長星晝見德明懼而還三年春正月丁巳邊臣奏韓德讓死帝曰德讓頗有智謀臣佐中未聞有其比者王欽若曰國主懦弱自今恐不能堅守和好帝曰朝廷始終待以誠信彼之部族亦當順從也种放歸終南山有使來自秦雍者得放答陳堯叟詩五章以聞帝嘉之謂宰相言放隱居力學嘗言古今殊時不當背時效古此最近於理乃詔放赴闕放表乞賜告帝許之詔答云儻再召勿復辭也又作歌以賜并賚衣服器幣令京兆府每季遣幕職就山存問放為弟汶求官即授祕書省正字知天雄軍冦凖言振武軍士接送契丹使過境臣已各給裝錢帝謂輔臣曰冦凖好收人情以求虛譽卿等今見之矣乃詔諭凖不當擅有給賜命備錢償官考異實録又云王旦對上以為此事忠臣必不為之别一夲乃無此語今削去二月契丹主暗弱自蕭太后與韓德讓相繼死其弟隆慶尤桀黠衆心附之言事者請因遣使特加恩隆慶帝曰柔逺之道務存大體正當講信修睦使之和協如其不法豈宜更加禮耶乙酉丁謂請承天節禁屠宰刑罰從之癸酉升州民以知州張詠秩滿願借留即授工部尚書令再任仍賜詔奬焉交州黎至忠苛虐國人不附大校李公藴為至忠親任乃逐至忠出城而殺之其二弟明提明昶爭立公藴又殺之自稱留後遣使奉貢帝曰黎桓不義而得之公藴又效尤焉甚可惡也然蠻俗何足責哉其用桓故事授以官爵右僕射判都省張齊賢言玉清昭應宫繢畫符瑞有損謙德及違奉天之意又屢請罷土木之役不聽辛丑齊賢出判孟州閏月甲寅冬官正韓顯符造銅候儀成并上所著經十卷其制則本唐李淳風及一行之遺法云己未河北轉運使李士衡言本路諸軍嵗給帛七十萬當春時民多匱乏常假貸於豪右方納稅租又償逋欠以故工機之利愈薄請官預給帛錢俾及期輸送民既獲利官亦足用詔從之仍令優與其直後遂推其法於天下乙卯帝幸射堂宴射又至西堂閲太宗御書圖畫帝作詩從臣皆賦甲戌增葺射堂為繼照堂設帟張樂許士民遊觀三日丁丑召宰臣於宣聖殿謁太宗聖容玉皇像三月壬辰以權靜海軍留後李公藴為靜海軍節度封交址郡王賜衣帶器幣丁酉帝謂王旦等曰自北鄙修好疆埸不聳朕居安慮危罔敢暇逸嘗著文自警置之座右乃出貴廪食珍田夫吟念農歌自戒針以示旦等天書殿屢有祥異帝以語輔臣王旦等曰陛下至誠奉天天示寶符神物相之固其宜矣帝作念邊詩賜近臣和帝謂輔臣曰將帥才難今文武中固亦有人蓋不經戰陳無由知之雖天下無事然兵不可去戰不可忘古之道也馬知節曰將帥之才非可坐而知之顧臨事機變如何爾咸平中將帥才略無聞措置未便不能擒戮戎寇蓋以未得其人故也今朝廷士馬雄盛城壘堅固器甲犀利茍契丹渝盟邊候有警陛下得人授之成算可使無噍類矣帝曰知節久任邊防以為禦戎之䇿何者為善知節曰邊防之地橫亘雖長然據要以扼其來路惟順安軍至西山不過二百里若列陳於此多設應兵使其久莫能進衆將疲弊時以竒兵輕騎逼而擾之如敢來犯即命將深入力戰彼必顛覆不暇今諸將喜用騎兵以多為勝且騎兵之多者布滿川谷而用之有限茍墻進而前小有不利則莫之能止非所謂節制之師也臣嘗謂善用騎兵者不以多為貴但能伏觀戎寇之多少度地形之險易寇少則逼而擊之衆則聚而攻之常依城邑以為旋師之所無不捷矣時契丹已盟大臣方言符瑞知節每不然之嘗言天下雖安不可忘戰因自陳年齒未暮五七年間尚可驅策如邊方有警願預其行但得副部署及良馬數匹輕甲一聮足矣帝以為然乃命製鋼鐵鎖子甲賜之夏四月鎮安節度使同平章事駙馬都尉石保吉卒於京師帝廢朝三日贈中書令諡莊武屬孟夏饗太廟未即臨喪遣使諭其家禮畢乃臨哭之保吉姿貌瓌碩頗有武幹纍世將相家富於財性驕倨好殺歷藩鎮多擾細民待屬吏不以禮帥大名時葉齊查道皆知名士悉命械頸以督糧運帝嘗賜密詔戒之先是曹瑋及張崇貴上涇原環慶兩路州軍山川城寨圖己未帝出以示王欽若等曰處置咸得其宜至於儲備亦極詳悉宜令别畫二圖用樞密印一付本路一留樞密院按圖以計事辛酉賜泰山隱士秦辨號貞素先生放還山辨自言百三十嵗帝召至京與語多言五代事亦無他術但能服食致長年耳癸亥詔幕職州縣官除廣南福建路令預借俸錢外江浙荆湖逺地麟府等州河北河東緣邊州軍自今並許預借兩月俸餘近地一月是日後宫李氏生子知開封府周起方奏事帝謂起曰知朕有喜乎起曰臣不知也帝曰朕始生子即入禁中懷金錢出探以賜起李氏杭州人初入宫侍劉修儀莊重寡言帝命為司寢既有娠從帝臨砌臺玉叉墜心惡之帝私卜叉完當生男子左右取叉以進殊不毁帝喜甚已而果生子是為仁宗後封李氏為崇陽縣君甲子契丹葬承天皇太后廢朝禁邊城樂太常博士石待問上時務策十數條大率言北鄙凶變非與中國渝盟即遭其弟篡奪乞選將練兵為之豫備又言先朝多任中人陵轢將帥故罕成功帝曰人臣指陳時政有關朕躬過失雖不近理亦當優容之待問乃以祖宗制度所無之事恣為矯誣是不可恕也即命翰林學士李宗諤詰之待問辭窮己而責授滁州團練副使不得僉署州事考異聖宋掇遺云待問上疏諌修昭應宫曰羣臣皆以陛下在堯舜之上臣謂不及唐太宗逺矣坐是命黜今從長編乙亥出內庫錢五百萬贖故宰相吕端居第賜其子蕃先是帝謂王旦等曰端諸子皆幼長子蕃病足家事不理舊第已質於人兄弟不同處昨令中使視之蕃扶杖附奏求賜差遣朕思之不若出內庫錢贖還舊第令其聚居又僦舍日得千錢可以贍養然蕃頗懦當諭百凡有支用置簿嵗上內侍省後六年蕃為弟蔚娶妻又表獻居第求加錫豫且言負人息錢甚多王旦曰陛下恤孤念往以勸人臣而蕃重煩聖念不可聽帝曰宜别出內庫金帛賜之俾償宿負蕃弟荀仍與西京差遣令蕃同往自今無得借使他財命有司為掌僦課給其家復詔樞密院察其妄費王旦曰陛下推恩終始極矣唐元和中還魏徵舊第止降一詔何嘗委曲如是耶是月知雄州兼河北安撫使李允則言久戍邊乞給假暫乘傳赴闕詔許之五月安定郡王惟吉薨魏王德昭之子也惟吉好學喜屬文雅善草𨽻飛白性至孝初太祖命孝章皇后撫養之后親為櫛沐及上仙哀過所生每誦詩至蓼莪父母劬勞之句涕泗交下宗室中有賢明之稱焉甲午詔奬知益州任中正轉運使言吏民列狀願借留之也中正及并州劉綜皆以善政聞帝謂輔臣曰藩方重地切在得人朝行中亦難其選自今須歷方面始可擢為大官卿等志之辛丑京師大雨平地數尺壞廬舍民有壓死者賜布帛資治通鑑後編卷二十七
