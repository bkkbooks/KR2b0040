body:
  text: 資治通鑑後編卷五十七刑部尚書徐乾學撰宋紀五十七起旃蒙作噩三月盡柔兆閹茂十二月凡一年有十月仁宗體天法道極功全德神文聖武睿哲明孝皇帝慶厯五年三月戊午御邇英閣講詩匪風篇曰誰能烹魚溉之釜鬵帝曰老子謂治大國若烹小鮮義與此同否丁度對曰烹魚煩則碎治民煩則散非聖學深逺何以見古人求治之意乎杜衍范仲淹富弼既罷樞密副使韓琦上疏言陛下用杜衍為宰相方及一百二十日而罷必陛下見其過失非臣敢議范仲淹以夏人初附自乞保邊朝廷因而命之固亦有名至於富弼大節難奪天與忠義昨使契丹蹈不測之禍以正辨屈強敵卒復和議忘身立事古人所難去年秋契丹點集大兵聲言討伐元昊朝廷未測虛實弼以河朔邊備未完又自請行於今在外已是半年經久禦戎之術固已蓄於胸中事畢還朝甫及都門未得一陳於陛下之前而責補間郡中外不知得罪之因臣亦痛弼有何負於朝廷而黜辱至此臣恐自此天下忠臣義士指弼為誡孰肯為國家用所損豈細哉臣固知成命不可追改然尚有一䇿可救其失願陛下試加詳擇臣竊見近日李用和多疾陛下欲召李昭亮赴闕管殿前司事而武臣中求一代昭亮者皆難中選臣謂陛下不若因此改弼知定州仍兼部署之職遣一中使宣諭令赴闕奏覆河北公事畢赴任俟其陛對慰而遣之弼素稟忠義又感此恩唯思效死豈敢更以內外職任為意别有論列如此則是朝廷以北事專委富弼以西事專委范仲淹使朝夕經營以防二國之變朝廷實有所倚臣所以不避朋黨之疑思一悟於聖聰耳疏入不報而董士亷又詣闕訟水落城事輔臣多主之琦不自安懇求補外辛酉琦罷樞密副使加資政殿學士知揚州甲子廣南轉運使杜把言宜州蠻賊區希範平祀初至直州先遣急遞以檄諭蠻聽其自新比至宜州蠻無至者把得州校吳香及獄囚區世容脫其械與衣帶使入洞説諭不聽乃勒兵攻破白崖黃泥九居山寨及五洞焚毁積聚斬首百餘級復環州希範與蒙趕散走把使香趣趕出降祀謂將佐曰蠻依險阻威不足制則恩不能懷所以數叛今特以窮蹙來降後必復動莫如盡殺之以絶後患乃擊牛馬為蔓陀羅酒大會環州坐中伏兵發禽誅七十餘人取五臟畫為圖釋尫病被脅與非敗而降者百餘人後三日又得希範醢之以遺諸溪洞考異初區希範入保荔波洞間出與官軍鬭及祀至環州使攝官區曄進士曾子華監押司官吳香誘其黨六百餘人始與之盟置蔓陀蘿酒中既昏醉稱呼起問勞至則推仆後廡下比暮衆始覺驚走而門有守兵不得出遂盡擒殺之後三日得蒙趕區希範區丕績等十數人剖其腹繢為五臟圖仍醢之以賜諸溪洞此實録所書也今從把本傳丙子詔禮部貢院增天下解額貢院請以景祐四年慶厯元年科場取解進士人數內擇一年多者令解及二分為率就試人雖多所贈人數各不過元額之半總諸州軍凡增三百五十九人詔遂為定額范仲淹既去執政以新定科舉入學預試為不便且言詩賦聲病易考而䇿論汗漫難知祖宗以來莫之有改得人常多帝下其議有司請如舊法乃詔曰科舉舊條皆先朝所定也宜一切如故前所更令宜罷之監察御史包拯言臣伏覩先降敕節文應奏蔭選人年二十五已上遇南郊大禮限半年內許令赴銓投狀京官每年春季赴國子監投狀並差兩制官於逐處考試內習詞業者或論或詩賦習經業者各專一經試墨義等及格者與放選注官及差遣自敕下之後天下士大夫之子弟莫不靡然向風篤於為學詔書所謂非惟為國造士是乃為臣立家實誨人育材之本也近聞有臣僚上言欲議罷去是之熟思耳且國家推恩之典其敝尤甚因循日久訓擇未精今詔命方行遽欲釐革則務學者曰以怠惰一旦俾臨民蒞政懵然於其間不知治道之所出猶未能操刀而使之割也或前條制有未盡事件望只令有司再加詳定依舊施行樞密副使龎籍言曩霄已受封册望早令延州保安軍立定封界甲申詔曰朕以元元之故已赦曩霄罪許復為藩臣納誓寢兵與之更始朕念師興以來陜西軍士暴露良苦民疲轉餉其降繫囚罪一等杖笞釋之邊兵賜緡錢民去年逋負皆勿責蠲其租稅之半麟府州嘗為羌所冦掠除逋負視此進士一舉諸科兩舉並與免今年取解丙戌罷入粟授官從殿中丞張庚所請也是月歐陽修上疏曰臣聞士不忘身不為忠信言不入耳不為諫諍故臣不避羣邪切齒之禍敢冒一人難犯之顔惟賴聖慈幸加省察臣伏見杜衍韓琦范仲淹富弼等皆是陛下素所委任之臣一但相繼而罷天下士皆素知其可用之賢而不聞其可罷之罪臣職雖在外事不審知然臣竊見自古小人讒害忠賢其識不逺欲廣陷良善則不過指為朋黨欲搖動大臣則必須誣以專權其故何也夫去一善人而衆善人尚在則未為小人之利欲盡去之則善人少過難為一二求瑕惟指以為朋黨則可一時盡逐至如大臣以被知遇而蒙信任者則不可以他事動搖惟有專權是人主之所惡故須此説方可傾之臣料杜衍等四人各無大過而一時盡逐富弼與仲淹委任尤深而忽遭離間必有朋黨專權之説上惑聖聰臣請詳言之昔年仲淹初以忠言讜論聞於中外天下賢才爭相稱慕當時姦臣誣作朋黨猶難辨明自近日陛下擢此數人並在兩府察其臨事可以辨也蓋杜衍為人清慎而謹守規矩仲淹則恢廓自信而不疑韓琦則純正而質直富弼則明敏而果鋭四人為性既各不同雖皆歸於盡忠而其所見各異故於議事多不相從至於杜衍欲深罪滕宗諒仲淹力爭而寬之仲淹謂契丹必攻河東請急修邊備富弼料九事力言契丹必不來又如尹洙亦號仲淹之黨及爭水洛城事韓琦則是尹洙而非劉滬仲淹則是劉滬而非尹洙此數事尤為彰著陛下素已知者此四人者可謂公正之賢也平日間居則相稱美之不暇為國議事則公言廷諍而無私以此而言臣見杜衍等真得漢史所謂忠臣有不和之節而小人讒為朋黨可謂誣矣臣聞有國之權誠非臣下所得專也臣竊思仲淹等自入兩府以來不見其專權之迹而但見其善避權也夫權者得名位則可行故好權之臣必貪名位自陛下召琦與仲淹於陜西琦等讓至五六陛下亦五六召之至如富弼三命學士兩命樞密副使每一命未嘗不懇讓愈切而陛下用之愈堅固天下之士所共知臣但見避讓太繁不見其專權貪位也及陛下堅不許辭方敢受命然猶未敢别有所為陛下欲其作事乃開天章召而賜坐授以紙筆使其條列乃衆人避讓不敢下筆弼等亦不敢獨有所建因此又煩聖慈出手詔指定姓名專責其條列大事而行行之已久冀皆有效弼性雖鋭然亦不敢自出意見但舉祖宗故事請陛下擇而行之自古君臣相得一言道合遇事而行更無推避弼等蒙陛下聖意委任督責丁寧而猶遲緩自疑作事不果然小人巧譖已曰專權豈不誣哉至如兩路宣撫國朝纍遣大臣况自中國之威近年不振故元昊叛逆一方而勞困及於天下契丹乘釁違盟而動其書辭侮慢至有責祖宗之言陛下憤恥雖深但以邊防無備不可與爭屈志買和莫大之辱弼等見中國纍年侵陵之患感陛下不次進用之恩故各自請行力思雪恥沿山傍海不憚勤勞欲使武備再修國威復振臣見弼等用心本欲尊陛下威權以禦四夷未見其侵權而作過也伏惟陛下睿哲聰明有知人之聖臣下能否洞達不遺故於千官百辟之中親選得此數人今一旦罷去使羣邪相賀於內四夷相賀於外此臣所以為陛下惜也疏入不報指修為朋黨者益惡焉夏四月丁亥朔司天言日當食而隂晦不見宰臣率百官稱賀是日上御崇政殿録繫囚遣監察御史劉元瑜等往三京疏決御史李京言陛下因天之戒恐懼修省避正殿減常膳故精意感格日當食而陰雲蔽虧然臣區區竊有所疑者自寶元初定襄地震十年未已豈非西北二邊有窺中國之意乎二月雷發聲八月收聲今孟夏雷未發聲豈非號令之不信乎願陛下飭邊臣備夷狄戒輔臣謹出命以厭禍於未形又尚美人棄外館多年比聞復召入臣慮假媚道以為蠱惑宜亟絶之苖繼宗嬪御子弟乃緣恩私為府界提點宜割帷薄之愛重名器之分庶幾不纍聖政帝嘉納之夏國主曩霄初遣素齋咩布移則張文顯來賀乾元節自是歲以為常戊申章得象罷為鎮安節度使同平章事判陳州得象在中書八年方陜西用兵帝鋭意天下事進用韓琦范仲淹富弼使同得象經畫當世急務得象無所建明琦等皆去得象居位自若監察御史裏行孫抗數以為言而得象亦十二章請罷帝不得已乃許之考異孫抗去年十二月癸丑乃自太常博士為監察御史裏行其言得象當是韓琦等去後傳云得象無所建明抗數以為言得象居位自若恐誤今稍易置其辭以工部侍郎參知政事陳執中依前官平章事兼樞密使庚戌以樞密副使吳育參知政事翰林學士承旨丁度為樞密副使癸丑徙知陳州資政殿學士任中師知曹州中師自言臣家本曹人今老矣願得守曹營歸休之計帝憐而許焉五月己未命翰林學士王堯臣翰林學士張方平侍講學士余靖並同刋修唐書西人歸石元孫諫官御史奏元孫軍敗不死為國辱請斬於塞下以示西人宰相陳執中謂宜如所奏賈昌朝獨曰在春秋時晉獲楚將穀臣楚獲晉將知罃亦還其國不誅因入對探袖出魏志于禁傳以奏曰前代將臣敗覆而還多不加罪帝乃貸元孫癸亥削除官爵編管全州其子弟嘗授陳亡恩澤者並追奪之知制誥余靖前後三使契丹益習外國語嘗對契丹主為蕃語時侍御史王平監察御史劉元瑜等劾奏靖失使者體請加罪元瑜又言靖知制誥不當兼領諫職庚午出靖知吉州癸未詔吏部流內銓自今試初入官選人其習文辭者試省題詩或賦論一首習經者試墨義十道並注合入官如所試紕繆試墨義凡九不中令守選候放選再試又不中與逺地判司其年四十以上依舊格讀律通即與注官仍命兩制一員同考試之閏月殿前副都指揮使建武節度使李用和以老乞解軍職戊子授宣徽北院使命步軍副都指揮使淮康軍留後李昭亮為武寧節度使殿前副都指揮使代用和也時承平久將帥多因循軍士縱弛昭亮雖緣恩澤進然本將家子習軍中事既統宿衛一切尚嚴多所建請萬勝龍猛軍蒱博爭勝徹屋椽相擊市人惶駭昭亮捕斬之杖其軍主諸軍股栗及帝祀南郊有騎卒亡所挾弓會赦當釋去昭亮以為宿衛不謹不可貸卒配隸下軍禁兵自是頗肅庚子以曾公亮趙師民何中立宋敏求范鎮邵必並為編修唐書官必以為史出衆手非是卒辭之丙午夏國主曩霄遣丁盧嵬名律營吕則張延夀來謝册命壬子詔中書門下曰朕有事大廟格於奉慈每懷保育之仁僾若見乎其位三后厭代多歷年所肆饋合食猶隔閟宫有司不時討論使國有闕典朕甚懼焉其令禮官稽考故籍議升祔之禮癸丑河北都轉運按察使歐陽修言轉運使雖合專掌金穀不與兵戎之事然鄉被朝廷密旨令熟圖本道利害陰為邊備今沿邊知州武臣不過諸司使副通判即是常參初入京朝官並得盡聞機事而臣之本司獨不得與非欲侵撓邊臣之權蓋調用軍儲須量邊事之舒急以至按察將吏亦當知處事之當否請自今許令本司與聞邊事從之六月癸亥以澤州進士劉羲叟為試大理評事羲叟精算術兼通大衍諸厯嘗注司馬遷天官書及著洪範災異論歐陽修薦之召試學士院故有是命丁卯減益州梓州上供絹歲三之一紅錦鹿胎半之壬申太常禮院言奉詔議升祔三后事謹按唐肅明皇后本中閫之正昭成皇后緣帝母之尊開元中並祔睿宗之室國朝懿德明德元德三后亦同祔太宗皇帝廟恭惟章獻明肅皇太后母儀天下輔成丕業章懿皇太后誕生聖躬恩德溥大伏請遷祔真宗皇帝廟序於章穆皇后郭氏之次章惠皇太后雖先朝遺制嘗踐太妃之貴然至明道中始加懿號與章懷皇后事體頗同伏請遷於皇后廟序於章懷之次又太者生事之禮不當施於宗廟至於章獻明肅皇太后以顧託之重著臨御之勞欲稱别廟則義無所嫌屬之配室則禮或未順况太廟諸室皇后並無四字之名伏請改上章獻明肅皇太后曰章獻皇后劉氏章懿皇太后曰章懿皇后李氏章惠皇太后曰章惠皇后楊氏如此則協李唐之故事孚本朝之正典如依所陳乞再行集議以示奉先謹重之意詔兩制及待制御史中丞同議以聞秋七月辛丑貶知潞州尹洙為崇信節度副使坐前在渭州貸公使錢用也壬寅翰林學士王堯臣等言禮官議改上章獻明肅皇太后曰章獻皇后章惠皇太后曰章惠皇后遷於皇后廟序於章懷皇后之次揆諸禮意竊所未安蓋諡告於廟册藏於陵無容異時更有輕改矧升祔廟祏本極孝思之報若裁損尊名恐非嚴奉之儀而又博詢典故參質人情有增崇之文無追減之例其章獻明肅之號伏請如舊章惠皇太后擁佑聖躬慈均顧復義專繫子禮須别祠請仍稱章惠皇太后依舊饗於奉慈廟乃詔中書門下覆議之請如禮官及學士等所議奉章獻章懿升配真宗廟室其尊諡如故章惠仍饗奉慈别廟皆得禮之變順祀無違乙巳詔循先朝祔元德故事恭依禮官所議奉章獻明肅皇太后章懿皇太后序於章穆皇后之次上致奉先之順下成繼志之美永修明祀冀享靈心戊申詔自今罪殊死若祖父母年八十以上及篤疾無期親者以其所犯聞戊申廣州地震考異東都事略作甲子地震乙卯荆南嶽州地震今從宋史八月知秦州田况遭父喪辛酉詔起復况固辭又遣內侍持手詔敦諭况不得已乞歸葬陽翟託邊事求見泣請終喪帝惻然許之帥臣得終喪自况始真宗封禪之後不復校獵廢五坊之職鷙禽走犬悉放山林於是直集賢院李柬之上言祖宗校獵之制所以順時令而訓戎事也陛下臨御以來未嘗講修此禮願詔有司草儀撰日命殿前馬步軍司出兵馬以從獵於近郊壬戌詔樞密院討詳先朝校獵制度以聞甲子以監察御史包拯為契丹正使契丹館伴者謂拯曰雄州新開便門乃欲誘南北人以刺候疆事乎拯曰欲刺知北事自有正門何必便門也本朝豈嘗問涿州開門邪議遂折不復言及拯使還具奏臣昨奉命出境彼中情偽頗甚諸悉自創雲州作西京以來不輟添置營寨招集軍馬兵甲糧食積聚不少但以西討為名其意殊不可測緣雲州至并代州甚近從代州至應州城壁相望只數十里地絶坦平此漢與胡古今所共出入之路也自失山後五鎮此路尤難控扼萬一侵軼則河東深為可憂不可信其虛聲弛其實備兼聞代州以北纍年來蕃户深入南界侵占地土居止耕佃甚多蓋邊臣畏懦不能隨時禁止今若不令固守疆界必恐日加滋蔓窺伺邊隙寖成大害不可忽也况邊上將帥尤在得人昔太祖經營四方選勇幹忠實者分控西北邊皆一任十餘年不遷卒獲其效今則不然蒞事未幾即圖遷徙又何暇於訓練備禦乎臣欲乞今後應沿邊要衝之處專委執政大臣精選素習邊事之人以為守將其代州尤不可輕授如得人責以實效雖有微纍不令非次移替則軍民安其政令緩急不致敗事矣庚午荆南府嶽州地震癸酉詔夏國比進誓表惟延州保安軍别定封界自餘皆如舊境其令陜西河東嚴戒邊吏務守疆土毋得輒有生事甲戌降河北都轉運按察使歐陽修知滁州權發遣戶部判官蘇安世監泰州鹽稅出內供奉官王昭明監夀春縣酒稅修既上疏論韓琦等不當罷為黨論者益忌之初修有妹適張龜正卒而無子有女實前妻所生甫四歲無所歸其母攜養於外氏及笄修以嫁族兄之子晟會張氏在晟所與奴姦事下開封府權知府事楊日嚴前守益州修嘗論其貪恣因使獄吏附致其言以及修諫官錢明逸遂劾修私於張氏且欺其財詔安世及昭明雜治卒無狀乃坐用張氏奩中物買田立歐陽氏劵安世等坐直牒三司取録問吏人而不先以聞故皆及於責安世開封人也獄事起諸怨修者必欲傾修而安世獨明其誣雖忤執政意與昭明俱得罪然君子多之修論奏日嚴據何郯章疏錢明逸劾修據修與蔣之竒辨第六劄雜録第三有修八劄鄜延經略司言夏國未肯明立封界詔保安軍移文宥州令遵守誓約指揮壬午監察御史李京言竊聞去年保州軍亂之後緣邊兵驕小不如意則譁言動衆近又永寧軍士潛謀竊發邊氓逺近不安嘗觀唐自至德以後河朔兵驕鎮魏尤甚易主謀帥僅如置棊濟以姦臣跋扈朝廷威令不行斯蓋不早制之失今沿邊主兵之臣既不遴擇其人及軍士作過不問亂所由起一槩被罪遂使驕兵增氣動要姑息守臣審前覆以避禍但務因循亂由是長今不早制之將復有至德之弊也宜下兩府按邊吏罷懦不任事及綺紈子弟一切罷之如素練師律則使之久任其有軍士作過本非長吏生事者只坐召禍之人所貴驕卒畏威而革心守臣竭節以專事此非特張紀律之本亦所以制機事之先也九月庚寅詔文武官已致仕而所舉官犯罪當連坐者除之從翰林學士張方平請也方平言坐繆舉而許首免蓋責其當察所舉者之不法也致仕官既謝事不當與在職者同責遂著為令辛卯以重陽曲宴近臣宗室於太清樓遂射苑中詔近臣考先朝正史實録為景德禦戎圖庚子置南京留守司御史臺甲辰徙江南東路轉運按察使楊紘知衡州紘常言不法之人不可貸如使肆貪殘於一郡一邑害良民千萬家不若去之不利一家耳聞者望風解去或及期不敢之官然竟坐苛刻下遷紘億從子為億後其為江東轉運按察使富弼所薦也冬十月乙卯契丹遣使來獻九龍車及所獲夏國羊馬辛酉祔章獻明肅皇后章懿皇后神主於太廟太赦天下諸路轉運使昨帶按察之名此聞過為煩苛吏不安職至有曉諭州縣俾互相告論有傷風化無益事體其並罷之時執政沮改范仲淹富弼所行事因肆赦遂有此命初議者請覃恩百官且優賜軍士參知政事吳育曰無事而啓僥幸誰為陛下建此者請治之已而帝語輔臣曰外人怨執政宜防喧譁育曰此必建議者欲以動搖上聽願無慮臣既以身許國何憚此耶帝常遣中使察視山東盜賊還奏盜不足慮而言兖州杜衍鄆州富弼山東尤尊愛之此為可憂帝欲徙二人淮南育曰盜誠無足慮然小人乘時以傾大臣非國家之福議遂格己巳詔送伴契丹使劉湜北界近築寨於銀坊城侵漢界十里其以誓約諭使人令毁去之庚午帝御內東門賜從官酒三行奏鈞容樂幸瓊林苑門賜從官食遂獵於楊村宴幄殿奏教坊樂遣使以所獲獐馳薦太廟既而召父老臨問賜以飲食茶絹及賜五坊軍士銀絹有差考異王安石志孫抗墓云上大獵於城南衛士不及整而歸以夜明日將復出有雉隕於殿中抗奏疏即是夜有詔止獵按仁宗以五年十月獵於楊村六年十一月獵於城南之東韓村七年三月即有詔罷獵而抗六年三月已罷御史其諫當是五年冬然五年冬不歸以夜又不在城南其在城南歸以夜乃六年冬事何郯奏議可考恐安石誤也今不取辛未始班厯於夏國庚辰罷宰臣兼樞密使時賈昌朝陳執中言軍民之任自古則同有唐别命樞臣專主兵務五代始令輔相亦帶使名至於國初尚沿舊制乾德以後其職遂分是謂兩司對持大柄實選才士用講武經向以關陜未寧兵議須一復兹兼領適合權宜今西夏來庭防邊有序當還使印庶協邦規臣等願罷兼樞密使既降詔許之又詔樞密院凡軍國機要依舊同商議施行十一月樞密院請自今進退管軍臣僚極邊長吏路分兵馬鈐轄以上並與宰臣同議從之丁亥冬至宴宗室於崇政殿辛卯詔提點京東路刑獄司體量石介存亡以聞先是介受命通判濮州歸其家待次是歲七月病卒夏竦銜介甚且欲傾富弼會徐州孔直溫謀叛搜其家得介書竦因言介實不死弼隂使入契丹謀起兵弼為內應執政入其言故有是命乃羈管介妻子於他州初徐州人告直溫等挾妖法誘軍士為變而轉運使不受亟詣提點刑獄吕居簡居簡令勿言有不受者復與轉運使合謀捕直溫等既就誅濮州復有謀叛者民相搖驚潰居簡馳往得其首惡誅之閲兵饗士姦不得發居簡蒙正之子也考異石介附傳並云介詐死北走契丹無往登萊結金坑凶惡事富弼朱墨史附傳乃有往萊結金坑惡少事附傳蓋依弼敘前後辭免恩命辨讒謗劄子按下詔京東體量介存亡在今年十一月辛卯此時弼猶在鄆州七年五月始移青州體量介存亡實録但有此五年十一月辛卯一詔耳七年五月後不聞别下詔也弼劄子則云在青州再體量蓋實録不詳今别見七年六月末時亦有詔下兖州劾介死虛實知州杜衍會官屬語之衆莫敢對泰寧節度掌書記髙苑龔鼎臣獨曰介平生直諒寧有是耶願以閣族保其必死衍悚然探懷中秦藁示之曰老夫既保介矣君年少見義必為安可量哉國子監直講孫復責監虔州稅孔直溫敗索其家得遺復詩故也考異孔直溫反實録不記按體量石介存亡據石介傳為直溫家有介書也然則直溫反必在此年今附見復貶官事歐陽修墓志云復貶在七年恐誤詔以邊事寧息盜賊漸衰知鄆州富弼知青州張存並罷安撫使知邠州范淹罷陜西四路安撫使其實讒者謂石介謀亂弼將舉一路兵應之故也仲淹先引疾求解邊任是日改知鄧州初翰林學士葉清臣居父喪言者嘗請起復為邊帥既而不行至是免喪宰相陳執中與清臣有隙不欲清臣居內乃申用其言庚子改除翰林侍讀學士知邠州壬寅以殿中侍御史劉提為禮部貟外郎兼侍御史知雜事議者謂湜探宰相意深致尹洙罪故得優擢十二月癸丑以知潞州郭承祐為并代副部署兼知代州始杜衍奏罷承祐軍職至是復之及包拯還自契丹言河北邊帥切宜精選而代州尤不可輕授今朝廷委任郭承祐恐必敗事按承祐纍任無狀朝野僉知物議喧然以為不可乞早令召還别用能者沿邊守將畏懦不勝任者亦乞速賜移易慶厯六年春正月戊子王堯臣罷三司使為翰林學士承旨兼端明殿學士羣牧使堯臣主計凡三年前使姚仲孫借內藏錢數百萬久不能償堯臣悉按籍償之而軍國之費猶沛然有餘未嘗加賦於民也益梓夔三路轉運使皆乞增鹽井課歲可得錢十餘萬堯臣固不從帝問其説對曰庸蜀僻逺恩澤鮮及而貢入常倍民力由此困朝廷既未有以恤之而又牟利焉是重困也雖小有益將必大損矣帝然其對然權幸因緣多見裁抑京師數為飛語及帝之左右往往有讒其短者帝一切不聞而堯臣為之自若已而言於帝曰臣之術止於是矣且臣母老願解煩劇既罷帝為勞之堯臣頓首曰非臣之能惟陛下信用臣耳禮部尚書知河南府范雍卒贈太子太師諡忠獻雍為治尚恕好謀而少成頗知人喜薦士後多至公卿者狄青初為小校坐法當斬雍貸之卒為名將甲午命翰林學士孫抃權知貢舉丙申以翰林學士知制誥蘇紳知河陽紳鋭於進取善中傷人衣冠憚疾之言者斥其狀故命出守紳自揚州復入翰林未三月也是歲卒於河陽紳與梁適同在兩禁人以為險詖語曰草頭木腳陷人倒卓考異李燾曰正傳云紳隂疏王德用宅枕乾岡貌類藝祖帝惡之匿其疏不下遂出紳按德用以寶元二年五月罷樞此時紳未入翰林紳既入翰林則德用不在樞密院矣宅貌二語孔道輔亦以奏德用不獨紳也附傳但云言者斥紳急於進取故出無疏德用事今從之魏泰雜録云仁宗既逐林瑀謂執政曰卿等謂瑀去朝廷遂無小人耶執政未喻上旨仁宗曰蘇紳可侍讀學士知河陽按林瑀以慶厯二年二月逐蘇紳三年七月始自翰林學士出知揚州其知河陽又在六年正月魏泰誤甚今不取戊申徙廣南戍兵善地以避瘴毒二月壬子朔賜太傅致仕張士遜月俸百千癸亥荆湖南路轉運使周沆言本路蠻冦未息而官軍久戍請歲給公使錢一千貫以犒設將校從之沆又言蠻驟勝方驕未易懷服宜須秋冬進兵蠻地險氣毒其人驍悍善用鋌盾北軍不能與之角請選雍宜融三州澄海忠敢知其山川習其伎藝者三千搗巢穴餘兵絡山足出則獵取之俟其勢窮力屈然後可撫也朝廷用其䇿卒平蠻冦戊寅青州地震詔陜西經略安撫及轉運司朝廷開納夏國本欲寬財息民自其受封進誓已及一年而調度猶不減用兵時其議裁節諸費及所增置官員指使使臣今無用者悉條奏之從樞密副使龎籍言也權同知禮部貢舉張方平言今之禮部程式定自先朝由景祐之初有以變體而擢髙等者後進傳效皆忘素習邇來文格日失其舊各出新意相勝為竒至太學盛建而講官石介益加崇長因其好尚寖以成風以怪誕詆訕為髙以流蕩猥瑣為贍踰越繩墨惑誤後學朝廷惡其然也故屢下詔書丁寧誡飭而學者樂於放逸罕能自還今貢院試者間有學新體賦至八百字以上每句或有十六字十八字而論或及千二百字以上䇿或置所問而妄肆胸臆條陳他事絀之則辭理粗通取之則公違詔意重虧雅俗驅扇浮薄忽上所令豈國家取賢斂材以備治具之意耶其增習新體而澶漫不合程式者悉已考落請申前詔揭而示之詔從其請時御史王平又請賦毋得過四百字而禮部復謂才藝所取一字之多遂至黜落殆非人情自是復以舊數為限考異本志以方平此奏繫之八年誤矣合從實録三月辛巳朔日有食之御崇政殿録繫囚雜犯死罪以下遞降一等杖以下釋之庚寅登州地震岠嵎山摧自是震不已每歲震則海底有聲如雷壬寅賜進士穰人賈黜等及第出身同出身有差癸卯賜諸科及第並出身甲辰賜特奏名諸科同出身及諸州長史司馬文學夏四月壬子降河東轉運使李昭遘知澤州坐奉使契丹其從者嘗盜彼中銀杯也昭遘從者既杖死詔以銀杯送契丹議者謂盜已正法送銀杯於體有損判大名夏竦亦奏乞罷送不聽知雄州王仁旭直納軍資庫人稱其得體丙子徙知定州王德基知雄州兼沿邊安撫使初守臣畏生事未嘗出獵德基至乃縱騎獵境上關城居民甚衆而故堞隳壞久莫敢修德基預調兵夫築完之契丹歲遣使獻果餌前皆改服以見德基按以常禮及每移文至者例以郡官主勞至是以指使代焉己卯權御史中丞張方平言中書樞密院比歲除授多預批聖旨俟半年或一二年後與轉官或改職失遷除之體率有常規若因勞應賞而擢之不次孰曰不然如其事出僥幸縱賖日月曷厭羣議譬之賈人交易於市作為契劵立期待償非惟滋長濫恩實亦有虧治體請自今文武官輒援前此而希遷改者並明行責降從之五月甲申雨雹地震戊子減卭州鹽井歲額緡錢一百萬川陜四路鹽課縣官之所仰給然井源或發或微而責課如舊任事者多務增課以為功往往貽患後人朝廷切於除民疾苦尤以逺人為意有司上言輒為蠲減前後不可悉數丙申詔陜西市蕃部馬丁酉京東人劉卺劉沔胡信謀反伏誅六月庚辰朔降御前劄子下夏安期等比令與陜西諸路經略安撫司議減節邊費其務悉心經畫以成朝廷悠久之利詔夏竦與河北監司察帥臣長吏之不職者初吳育在翰林薦唐詢為御史未至喪母服除育方參政事而宰相賈昌朝與詢有親嫌育數為昌朝言詢用故事當罷御史昌朝不得已以詢知廬州凡官外徙者皆放朝辭而詢獨許入見中丞張方平因奏詢材質美茂宜留備言職詔許之育爭不能得詢由是怨育而附昌朝方平留詢且譖育世皆以為昌朝意云丁酉流星出營室南大如杯其光燭地隱然有聲北行至王良沒占曰兵出辛酉詔河東經略使鄭戩裁減本道邊費以聞癸亥帝謂輔臣曰比有上言星變者國家雖無天異亦當修警况因謫見乎夫天之譴告人君使懼而修德亦猶人君知臣下之過先示戒敕使得自新則不陷於咎惡也賈昌朝等皆引咎再拜辛未知益州文彥博言益彭卭蜀漢五州非用馬之地而逐州共屯軍馬凡二千餘人請皆易以步軍詔易三之一參知政事吳育與宰相賈昌朝不相能監察御史唐詢既怨育遂希昌朝意上奏曰賢良方正直言極諫茂材異等科由漢涉唐皆不常置若天見災異政有闕失則詔在位薦之本朝稽用舊文訖真宗世三建此科陛下即位增科為六初應詔才數人後乃至十餘人今殆至三十餘人一中此科曾未纍歲悉至顯官雖非其人例不可抑請自今不與進士同時設科若因災異非時舉擢宜如漢故事親䇿當世要務罷祕閣之試疏上帝刋其名付中書育奏疏駮之帝是育言不復下兩制即詔禮部自今制科隨進士貢舉其著為令仍須近臣論薦毋得自舉帝因謂輔臣曰彼上言者乞從內批以行今乃知欺妄也育又奏陰邪沮事正當明辨願出姓名按效以明國法育本由制䇿進帝數稱其賢以為得人故詢力肆排詆意在育不在制科也育弟娶李遵朂妹有六子而寡詢又奏育弟婦久寡不使改嫁欲用此附李氏自進大抵希昌朝意且欲報怨帝訖不聽也秋七月三司使王拱辰言太祖時兵十二萬太宗時十八萬章聖時四十萬今過倍之兵在精不在衆冗散坐食非計也三司雖總財用大計而事實在外請諸道帥臣并任其責乙酉詔判大名府夏竦知并州鄭戩知永興軍程琳並兼本路計置糧草從拱辰言也庚寅河東經略司言雨壞欣代等州城壁丙寅以知吉州余靖分司南京許居韶州初靖為諫官嘗劾奏太常博士茹孝標不孝匿母喪坐廢靖既失勢孝標因與知諫院錢明逸言靖少遊廣州犯法受笞明逸即劾奏靖不宜在近侍靖聞之不自安求侍養去會朝廷下廣州按得其實靖初名希古舉進士未得解曲江主簿善遇之知韶州者疾主簿捃其罪無所得唯得與靖接坐主簿既以違敕停任而靖受笞後乃改名取解他州及第案牘具在故有是命靖受笞緣由據司馬光記聞壬寅帝謂宰臣曰前日除李用和子璋為閣門副使今次子珣求為通事舍人朕已諭之曰朝廷爵賞所與天下共也儻戚里之家兄弟遷補如己所欲朕何以待諸勳舊乎賈昌朝對曰母后之家自昔固多蒙恩澤今陛下能重惜爵賞不肯輕授非惟示天下以至公亦保全外戚之福也明年四月乙丑內殿承制以閣門祗候李珣為通事舍人癸卯以馬軍副都指揮使許懷德為安靜軍留後言事官上章論奏者相繼御史中丞張方平言懷德妄援體例僥幸陳乞隳紊軍制干撓朝章乞奪軍職付環衛或除一郡帝不聽乙巳户部副使夏安期等言與鄜延經略使沈邈已減罷官貟使臣四十四人八月詔臣僚子孫恃廕無賴嘗被刑者如再犯私罪更無得以贖論時邵武軍言故祕書監致仕龔曙之孫屢犯屠牛法當以廕免帝特命加其刑而更著此條壬戌詔陜西河東經略司西人雖納欵稱臣然其心詭譎難信恐諸路乘罷兵之後漸弛邊備其益務練兵卒完城壁若冦至有不如詔者亟以名聞癸亥䇿試賢良方正能直言極諫太常博士錢彥逺䇿入第四等擢祠部員外郎知潤州彥逺易之子明逸之兄也宋興以來父子兄弟制䇿登科者錢氏一家而已癸酉以參知政事吳育為樞密副使樞密副使丁度為參知政事育在政府遇事敢言知永靜軍向綬疑通判江中立譖已因誣以罪迫令自殺育欲坐綬死宰相賈昌朝頗營助之得輕比育遂爭論帝前拜罷録曰育廷爭以為不殺綬是天下無法也卒減死一等殿中皆失色育論辨不已乃請曰臣所辨者職也顧力不勝願罷臣職乃與度易位度為樞密副使在龎籍後時籍女嫁參知政事宋庠之子庠固言於帝以親嫌不可共事故越次用度始昌朝與育爭帝欲俱罷二人御史中丞張方平將對昌朝使人約方平助己當以方平代育方平怒叱遣之曰此言何為至於我既對極論二人邪正曲直然育卒罷考異通鑑續編云帝亦以昌朝故徙育樞密而謂近臣曰吳育剛正可用第疾惡太過耳當考世皆以方平實為昌朝地也考異此據方平墓志及本傳然志謂育卒罷而髙若訥代之蓋此年三月事非此時也又若訥代育實為樞密非參政墓志似委曲為方平諱今不取甲戌以監察御史唐詢知湖州竟以宰相親嫌罷也九月庚寅以户部副使夏安期為陜西都轉運使安期與諸路經略安撫司議邊費凡奏省官貟及沿邊兵之不任役者五萬人時數有災異户部員外郎兼侍御史知雜事梅摯引洪範上變戒曰王省惟歲謂王總羣吏如歲兼四時有不順則省其職今日食於春地震於夏雨水於秋一歲而變及三時此天意以陛下省職未至而丁寧告戒也伊洛暴漲漂廬舍海水入台州殺人民浙江潰防黃河溢掃所謂水不潤下陛下宜責躬修德以回上帝之眷佑陰不勝陽則災異衰止而盛德日起矣又言權陜西轉運使張堯佐非才由宫掖以進恐上纍聖德及奏減省資政殿學士員召待制官同議政復百官轉對帝謂大臣曰梅摯言事有體以為户部副使考異本傳以摯言災異為摯任殿中侍御史時蓋誤也按災異皆今年事今因摯遷官附見張堯佐權陜西漕是月即真摯言亦必在是月惟奏減資政殿學士貟請召待制議政及百官轉對恐别有月日當考癸卯登州地震帝曰山東連歲地震宜防未然之變其下登州嚴武備甲辰登州言巨木三千餘浮海而出冬十月丁未朔詔比遣張子奭往延州與夏國議疆事其豐州地當全屬漢界或所議未協聽以橫陽河外嚮所侵耕四十里為禁地若猶固執即以橫陽河為界初夏國既獻卧貴􅤞吳栘已在等九寨又納豐州故地欲以沒寧浪等處為界下河東經略鄭戩戩言沒寧浪等處並在豐州南深入府州之腹若如其議則麟府二州勢難以守直宜以橫陽河為界帝乃以戩所上地圖付子奭往議之辛未詔發兵討湖南猺賊十一月遣著作佐郎楚建中往延州同議夏國封疆事張子奭道病故也以權御史中丞張方平為翰林學士權三司使自開寶以來河北鹽聽人貿易官收其算歲為額錢十五萬緡上封者嘗請禁𣙜以收遺利余靖時為諫官言昔太祖皇帝特推恩意以惠河朔故許通鹽商止令收稅今若一旦𣙜絶價必騰踊民苟懷怨悔將何及乞令仍舊通商無輒添長鹽價以鼓民怨其議遂寢考異河北初議𣙜鹽價實録不載余靖諫草獨存此奏及王拱辰奏立𣙜法時靖絀久矣蓋先有建此議者靖論其不可故罷既而拱辰使三司復議舉行又為河北漕臣所沮而河北漕臣乃别議增算拱辰更立𣙜法未下而張方平亟奏罷之實録國史並疏略今參取靖諫草及食貨志方平墓志修入及王拱辰為三司使拱辰是年正月戊子以翰林學士兼龍圖閣學士權三司使復建議悉𣙜二州鹽下其議於本路都轉運使魚周詢亦以為不可考異本志以為都轉運使夏竦誤也竦五年八月判并州六年二月改大名拱辰十一月戊子罷三司使出知亳州張方平代之方拱辰在三司時竦無緣却為都轉運使據何郯奏為議都轉運使者乃魚周詢也王巖叟元祐初奏議亦誤以魚周詢為夏竦且言商人販鹽與所過州縣吏交通為弊所算十無二三請敕州縣以十分算之聽商人至所鬻州縣併輸算錢歲可得緡錢七十餘萬三司奏用其䇿帝曰使人頓食貴鹽豈朕意哉於是三司更立𣙜法而未下也方平見帝問曰河北再𣙜鹽何也帝曰始議立法非再也方平曰周世宗𣙜河北鹽犯輒處死世宗北伐父老遮道泣訴願以鹽課均之兩稅錢而弛其禁世宗許之今兩稅鹽錢是也豈非再𣙜乎且今未𣙜也而契丹常盜販不已若𣙜之則鹽貴契丹鹽益售是我為斂怨而使彼獲利也彼鹽滋多非用兵莫能禁邊隙一開所得鹽利能補用兵費乎帝大悟曰卿語宰相立罷之方平曰法雖未下民已皆知宜直以手詔罷之不可自有司出也帝大喜命方平密撰手詔下之河朔父老相率拜迎於澶州為佛老會七日以報上恩且刻詔北京其後父老過詔書下必稽首流涕考異食貨志云三司奏用其䇿仁宗曰使民頓食貴鹽豈朕意哉下詔不許若不許三司之請則不須下詔今既下詔蓋已立法而未行墓志當得其實今從之食貨志不載方平事蓋疏略也熙寧八年六月章惇又議𣙜鹽癸未湖南猺賊冦英韶州界辛丑獵於城南之韓村自玉津園去輦乘馬分騎士數千為左右翼節次旗鼓合圍場徑十餘里部隊相應帝按轡中道親挾弓矢屢獲禽是時道傍居民或畜狐兔鳬雉驅入場中帝因謂輔臣曰畋獵所以訓武事非專務獲也悉令縱之至棘店御帳殿召問所過父老子孫供養之數土地種植所宜且歎其飲食粗糲而能享夀人加慰勞還次近郊遣衛士更奏挍御駕前兩兩相當掉鞅挾槊以決勝又謂輔臣曰此亦可觀士之材勇也免所過民田在圍內租稅一年是歲邈川首領唃厮羅西蕃瞎氊磨氊角安化州蠻蒙光速等來貢髙麗王欽卒子徽嗣資治通鑑後編卷五十七
