body:
  text: 資治通鑑後編卷六十八刑部尚書徐乾學撰宋紀六十八起上章困敦六月盡重光赤奮若六月凡一年有一月仁宗體天法道極功全德神文聖武睿哲眀孝皇帝嘉祐五年六月乙丑詔戒上封告訐人罪或言赦前事及言官事彈劾小過不關政體者時殿中御史吕誨言故事臺諫官許風聞言事者蓋欲廣其采納以輔朝廷之闕失比來中外臣僚多上章告訐人罪既非職分實亦侵官甚者詆斥平素之缺暴揚曖昧之事刻薄之態浸以成風請懲革之故下是詔丙寅命天章閣待制張掞同詳定均稅壬申詔禮部貢院內外鎖廳并親戚舉人並同引試解十分之一如不及十人亦許解一名四人以下送鄰路聚試乙亥遣官分行天下訪寬恤民力事五月丁酉初置司張朋道雜志曰韓魏公當國遣使出諸道以寬恤民力為名既行魏公大悔之每見外來賔客必問寬恤使者不擾郡縣否意恐詔使擾民重不安也無幾皆罷之此事當考三司減省冗費所言比嵗內人請俸倍多乞酌天聖初嬪御以下人數著為定額從之閣門編纂條例所言伏見臣僚以疾乞免大起居舞蹈之類竊以臣下見君當極恭肅一有不至罰必及之以疾自言乞損拜伏人取其便非所以致恭肅尊朝廷也且有疾與告著令所容殺禮見君古訓無有自今敢干請者乞令閣門彈奏重致其罰惟勳德大臣必藉任使自從特旨從之秋七月戊子以美人周氏為媫妤皇第十二女媫妤所生也辛卯詔知許州兼京西北路安撫使知鄧州兼京西南路安撫使以許陳鄭滑孟蔡汝潁信陽九州軍𨽻北路鄧襄隨房金唐均郢光化九州軍𨽻南路其河南府即不𨽻所部癸巳雍州言交趾與甲洞蠻合兵冦邉都巡檢宋士堯拒戰死之詔發諸州兵討捕甲午以天章閣待制知諫院唐介知荆南從介請也敕過門下知封駮事何郯封還之言介為諫官有補朝廷不當出外詔介復知諌院如故戊戌翰林學士歐陽修等上所修唐書二百五十卷刋修及編修官皆進秩或加職仍賜器幣有差著作佐郎劉羲叟為崇文院檢討未入謝疽發背卒羲叟強記多識尤長於星厯數術其言多驗羲叟未病嘗曰吾及秋必死自擇地於父冡旁占庚穴以語其妻如其言葬之時天下生齒益蕃田野加闢獨京西唐鄧間尚多曠土唐州間田尤多入草莽者十八九或請徙户實之或請以卒屯田或請廢州為縣知州事比部員外郎趙尚寬言土曠可益墾闢民稀可益招徠而州不可廢乃案圖記得召信臣故迹益發卒復大三陂一大渠皆溉田萬餘頃又教民自為支渠數十轉相浸灌而四方之民來者雲集尚寬復請以荒田計口授之及貸民官錢買牛比三年廢田盡為膏腴增户萬餘監司上其狀三司使包拯亦以為言丙午詔留再任考異仁宗實録及本傳治平元年正月尚寬再任今從長編庚戍詔曰朕樂與士大夫惇德明義以先天下而在位殊趣弗率朕旨或為危言詭行務以驚衆而取譽罔上而邀寵論事之官搜抉隱微無忠恕長厚之風託迹於公而原其本心實以合黨圖私甚可惡也使吾俗靡然陷溺於薄而望教成治立其可得哉書不云乎堲讒説殄行震驚朕師中書門下其采端實之士眀進諸朝察辨矯激巧偽者加放絀焉眀揚朕言以厲多士御史中丞趙槩言比年以來縉紳之論多險刻競浮宜行戒敕之故降是詔壬子命翰林學士吳奎户部副使吳中復度支判官王安石右正言王陶同相度牧馬利害以聞時馬政因循不舉言者以為當有更革也秋八月丁巳朔以觀文殿學士吏部侍郎程戡為宣徽南院使判延州殿中侍御史吕誨言戡才微識暗外厚中險交結權貴因緣進擢徇私罔上怙勢作威况年逾七十自當還政近罷樞府既以匪能復委帥權曷由勝任且本朝故事宣徽使非勳戚未嘗除拜乞追寢戡恩命知雜御史范師道等相繼論列訖不從以度支判官金部員外郎薛向權陜西轉運使兼制置解鹽使范祥既卒故以向代之時西夏青鹽盜販甚賤而官賣解鹽價髙鹽以故不售向至始減價以抑之鹽池嵗調畦夫數千種鹽而鹽支十年未售向奏損其數至今便之甲子以眉州進士蘇洵為試校書郎洵年二十七始發憤為學嵗餘舉進士茂才異等皆不中悉焚其常所為文閉户益讀書遂通六經百家之説下筆頃刻數千言至和嘉祐間與其二子軾轍至京師翰林學士歐陽修上其所著權書衡論機䇿二十二篇宰相韓琦善之召試舍人院以疾辭本路轉運使趙抃等薦其行義推於鄉里而修又言洵既不肯就試乞除官故有是命壬申詔曰國初承五代之後簡編散落三館聚書才萬卷其後平定列國先收圖籍亦嘗分遣使者屢下詔令訪募異本校定篇目聽政之暇無廢覽觀然比開元遺逸尚衆宜加購賞以廣獻書中外士庶並許上館閣闕書每卷支絹一匹五百卷與文資官相度牧馬利害所吳奎等上言今陜西馬價多出解鹽三司所支銀絹許於陜西轉運司易錢權轉運副使薛向既掌解鹽復令陜西財賦可悉委之移用仍俾擇空地置鹽而孳養之蓋得西方不失其土性一利也因未嘗耕墾之地無傷於民二利也因向之才使久其任而經制之三利也帝可其奏甲申命向專領本路監牧及買馬事仍規度於原渭州德順軍置場同州沙苑監鳯翔府牧地使臣並委向保薦以聞歐陽修言唐之牧地西起隴右金城平涼天水外暨河曲之野內則岐豳涇寧東接銀夏又東至於樓煩以今考之或陷沒北敵或已為民田皆不可復得惟河東嵐石之間山荒甚多及汾河之側旱地亦廣其間草軟水甘最宜養牧此乃唐樓煩監地也迹而求之則樓煩元池天池三監之地尚兾可得臣往年奉使嘗行威勝以東及遼州平定軍見其不耕之地甚多而河東一路山川深峻水草甚佳地勢髙寒必宜馬性又京西路唐汝之間荒地亦廣請下河東京西轉運使遣官審度若可興置監牧則河北諸監尋可廢罷下其奏相度牧馬所奎等請如修奏乃詔選官分詣河北河南諸監按牧地肥瘠頃畝俟得實數即遣官二人按視其陜西估馬司仍委向規度以聞向乃上言秦人劵馬至京師計所值并道路之費一馬當錢數萬請於原渭州德順軍置場收市以解鹽交引募蕃商廣售良馬八千三千給緣邉軍騎五千入羣牧司詔從之乙酉罷諸同提點刑獄使臣置江南東西荆湖南北廣南東西福建成都梓利夔路轉運判官先是同提點刑獄使臣或有竊公用銀器及樂倡首飾者議者因言使臣多不習法令民事不可為監司故罷之十一路舊止一轉運使至是各增置判官以三年為一任九月以起居舍人知制誥劉敞為翰林侍讀學士知永興軍初臺諌劾敞行吕溱責官制詞不直又前議郭后祔廟嘗云上之廢后慮在宗廟社稷不得不然是欲道人主廢后也章十數上敞不自安會永興闕守遂請行詔從之己丑太白晝見丙申命樞密直學士右諫議大夫吕公弼同詳定均稅辛丑詔齊登密華邠耀鄜絳潤婺海宿饒歙吉建汀潮十八州並煩劇之地自今令中書選人為知州其知潮州委本路轉運提點刑獄司同保薦之翰林侍講學士給事中楊安國卒贈禮部侍郎安國講説一以注疏為主無他發眀引諭鄙俚世或傳以為笑素不喜緯書及注疏所引緯書則尊之與經等在經筵二十七年帝稱其行義淳質以比先朝崔遵度駙馬都尉安州觀察使李瑋與公主不協而瑋所生母又忤主意主夜開皇城門入訴禁中瑋惶恐自劾庚子降瑋為和州防禦使仍與外任眀日免降官止罰銅二十斤留京師癸丑右正言王陶言周禮閽人掌宫門之禁時其啓閉寺人掌女宫之令紏其出入以謹嚴周衛杜絶非常故漢光武出獵夜還上東門候郅惲拒關不納光武從中東門入眀日賞郅惲而貶中東門候魏武之子臨淄侯植開司馬門晝出魏武怒公車令坐死然則公主夜歸未辨真偽輒便通奏開門納之直徹禁中略無機防其所歷皇城宫殿內外監門使臣請並送劾開封府知諫院唐介殿中侍御史吕誨等亦以為言皆不報冬十月丙辰朔詔自今因奏舉改官及升差遣其所舉人各犯枉法自盜而會赦不原者舉主亦毋得以赦論庚申兖國公主宅都監入內供奉官梁懷一以下九人並逺小處監當入位祗候梁懷吉配西京灑掃班自今勿置都監别選內臣四十以上三班院使臣五十以上無私罪者二人在宅勾當內臣年十五以下二人為入位祗候並不得與駙馬都尉接坐時臺諫官皆言主第內臣數多且有不自謹者帝不欲深究其罪但貶逐之因省員更制七年二月癸卯梁懷吉又勒歸前省不知何時復召入也十一月丁亥以均州防禦使李珣為相州觀察使單州團練使劉永平為齊州防禦使知制誥楊畋封還珣永平詞頭因言祖宗故事郭進戌西山董遵誨姚內斌守環慶與強冦對壘各十餘年未嘗轉官移鎮重名器也今珣等無尺寸功特以外戚故除之恐祖宗意不報詔他舍人草制而范鎮言朝廷如以楊畋之言為是當罷珣等所遷官儻以為非乞復令畋命詞不許既而鎮復有論列遂罷之戊子録故陜西置解鹽使度支員外郎范祥孫景為郊社齋郎子太廟室長褒候服闋與堂除差遣權三司使包拯言祥建議通陜西鹽法行之十年嵗減𣙜貨務緡錢四百萬其勞可録也故有是命辛丑樞密使兵部尚書同平章事宋庠罷為河陽三城節度使同平章事判鄭州殿中侍御史吕誨等論庠老疾昏惰選用武臣輒紊舊法加外寬內忌近者李瑋家事猥陳均州繆例欲陷瑋深罪阿公主意賴上眀察不行其言且結交內臣王保寧隂求援助昨除御藥院供奉四人遙領團練使刺史保寧乃其一也三班院吏授官隔過年限略不懲誡御前忠佐年當揀退乃復姑息其徇私罔公率如此章凡四上右司諌趙抃亦論庠不才詔從優禮罷之以禮部侍郎參知政事曾公亮依前官充樞密使樞密副使右諌議大夫張忭禮部侍郎孫抃並參知政事翰林學士禮部侍郎知制誥史館修撰歐陽修樞密直學士右諌議大夫陳旭御史中丞趙槩並為樞密副使仍以槩為禮部侍郎詔自今臣僚之家毋得陳乞御篆神道碑額辛亥以直祕閣判度支勾院司馬光度支判官直集賢院王安石同修起居注光五辭而後受安石終辭之最後有旨令閣門吏齎敕就三司授之安石避於厠吏置敕於案而去安石遣人追還之上章至八九乃受十二月癸丑太常禮院言自今文武臣僚薨卒法當諡者考功於未葬前取索行狀移禮官考定如其家葬速集議不及則許賜之其有勳德既葬未嘗請諡者亦聽取旨詔可戊寅以樞密直學士吕公弼為龍圖閣學士知成都府公弼初至人疑其少威斷會營卒犯法當杖不肯受曰寧請劍不能受杖公弼再三諭之不從乃曰杖國法不可不受劍汝所請亦不汝違也命杖而復斬之軍中肅然先是知永興劉敞朝辭日言關中嵗比不登民多流移請發倉賑之又曰均田擾民帝令於所部徐訪利害以聞及敞至永興即具奏孫琳在河中府用方田法打量均稅百姓驚駭各恐增起租稅因此斫伐桑柘賴轉運使薛向在處張榜告諭方得暫止又聞只打量萬泉一縣近須一年乃畢蒙減者則必欣喜被增者自然怨嗟詞訴獄訟恐自此始乞且召還孫琳更俟豐嵗庶幾災傷之餘不至驚擾其後河中民果訴增減田稅不平凡數萬户歐陽修亦言均稅之事朝廷只於見在稅數量輕重均之初不令其别生額外之數也近聞衛州通利軍括出民冒佃田土不於見在管𣙜數內均減重者攤與冒佃户却生立稅數配之此非朝廷之意而民所以喧訴也欲望聖慈特賜指揮令均稅所只如朝廷本議將實𣙜見在稅數量輕重均之其餘生立稅數及逺年虛數却與放免及未均地分並且罷均己卯蘇茂州蠻冦雍州辛巳補諸州父老百嵗以上者十二人為州助教是嵗置三司推勘公事一人以京朝官充掌推劾諸部公事六年春正月權御史中丞王疇言比嵗兩制臣僚不得與執政相見及臺諫官往還議出一時初無典故當時論者即以為非今執政與諫官已弛其禁而臺官尚設科防臣愚以為臺官主於議論以補天子之聞見豈一二人能周知天下事乎兩制侍從之臣皆國之選今偶或相見交自為疑非所以示朝廷之大也請自今兩制亦許與臺官相見從之戊申降郢州防禦使宗懿為信州團練使宗懿葬其父濮安懿王而自以本命日不臨穴故也時任守忠護王葬事凌蔑諸子所饋遺近萬緡而心猶未厭宗懿得罪守忠實為之癸丑詔開封府自今有摹刻御書字而鬻賣者重坐之二月丁巳詔宗室賜名授官者須年及十五方許轉官乙丑詔曰如聞良民子弟或為人誘𨽻軍籍父母泣訴而不得還者朕甚閔之自今有司審其所從來𨽻籍百日內父母訴官者還之丙寅録繫囚降罪一等徒以下釋之戊辰詔樞密院自今內殿崇班以上須年二十方聽受差遣三月癸巳賜禮部進士掖人王俊民等一百三十九人及第五十四人同出身諸科一百二人及第並同出身特奏名進士諸科四十三人同出身諸州文學長吏考異案宋史賜進士諸科及第同出身二百九十五人與長編不合今姑從李氏己亥富弼以母喪去位庚子罷大宴時同知禮院晏成裕言君臣之義哀樂所同請罷春宴以表優恤大臣之意帝亟從其言成裕殊子弼妻弟也議者或以為過云壬寅封皇第十一女為永夀公主第十二女為寶夀公主甲辰詔翰林學士承旨宋祁遇直許一子主湯藥祁以羸疾請之也戊申幸後苑賞花釣魚遂宴太清樓出御製詩一章命從臣屬和以進詔周六廟在西京者令有司以三品祭服一四品祭服二及當用祭器給之考異長編以是日詔封柴氏後為崇義公今不從封柴氏後已見四年四月夏四月辛酉以權三司使包拯為給事中三司使拯在三司凡諸管庫供上物舊皆科率外郡積以困民拯特置場和市民得無擾吏負錢帛多縲繫間趣逃去械其妻子者類皆釋之詔嶺南官吏死於儂賊而其家流落未能自歸者所在給食護送還鄉庚午以右正言王陶知衛州時臺諌共言陳旭不當為樞密副使帝弗聽陶既引疾在告又先自乞罷因許之丙子命大理寺丞郭固編校祕閣所藏兵書先是置官編校書籍而兵書與天文為祕書獨不預大臣或言固知兵法即以命之然兵書殘缺者多不能遍補也庚辰以樞密副使右諫議大夫陳旭為資政大夫知定州三司使給事中包拯為樞密副使出禮部郎中天章閣待制知諫院唐介知洪州右司諫趙抃知虔州兵部員外郎兼侍御史知雜事范師道以本官知福州殿中侍御史吕誨知江州旭始除樞密副使或言旭隂結宦者史志聰王世寧等故有此命介等交章論列且言旭頃為諌官因張彥方事阿附貴戚已不為清議所與及知開封府嘗賤市富民馬納外弟甄昴於府舍恣意請託帝以其章示旭旭奏臣前任言職彈斥內臣其桀黠用事如楊懷敏何誠用武繼隆劉恢輩多坐黜逐今言者乃以此汚臣志聰臣不識面世寧弟娶臣妻舅之孤女久絶往來若嘗薦臣陛下必記其語乞付吏辨劾遂家居求罷帝手詔召出之介等復闔門待罪頃之復出如是者數四帝顧謂輔臣曰凡除拜二府朕豈容內臣預議耶而介等言不已故兩罷之樞密副使歐陽修言近見諫官唐介臺官范師道等因言陳旭事得罪或與小郡或竄逺方陛下自臨御以來擢用諍臣開廣言路雖言者時有中否而聖慈每賜優容一旦臺諌聨翩被逐命下之日中外驚疑臣謂方今言事者規切人主則易欲言大臣則難臣自立朝耳目所記景祐中范仲淹言宰相吕夷簡貶知饒州皇祐中唐介言宰相文彥博貶春州别駕至和初吳中復吕景初馬遵言宰相梁適並罷職出外其後趙抃范師道言宰相劉沆亦罷職出外前年韓絳言富弼貶知蔡州今又唐介等五人言陳旭得罪斥逐諫臣非朝廷美事阻塞言路不為國家之利而介等盡忠守節未蒙憐察欲望聖慈特賜召還介等置之朝廷以勸守節敢言之士初諸路敦遣行義文學之士赴京師者二十三人其至者十六人皆館於大學即舍人院試論䇿五月丙戍賜徐州顔復潤州焦千之成都章祀荆南樂京等七人進士出身四人同出身餘悉授試校書郎復太初子祀察子也時濮州李植道卒嶽州顧立有期喪梓州闕衮蜀州張中理處州吳戭廣安軍蒲伯明越州吳孜等五人辭不就試復等既推恩亦以試將作監主簿命之丁酉詔天章閣待制知諌院吕景初同詳定均稅翰林學士承旨工部尚書知制誥集賢殿修撰宋祁卒贈刑部尚書祁兄弟皆以儒學顯而祁尤能為文章善議論清約莊重不逮其兄論者謂祁不至公輔蓋亦以此祁自為遺奏曰陛下享國四十年東宫虛位天下係望人心岌嶪為社稷深計莫若擇宗室賢材進爵親王為匕鬯之主若六宫有就館之慶聖嗣蕃衍則降封郡王以避正嫡此定人心防禍患之大計也又自為左志右志及治戒以授其子其子遵治戒不請諡久之張方平言祁法應得諡諡曰景文己亥馬軍副都指揮使淮康節度使張茂實落管軍知曹州初趙槩代韓絳為御史中丞言茂實不宜典宿衛未聽及槩為樞密副使復言之而言者又劾茂實販易公使所遣卒殺人於外茂實因以老自請解兵權始命出守先是翰林侍讀學士劉敞嘗奏言為國之道防患於未然逺嫌於萬一所以安羣情止邪謀也伏聞張茂實本周王乳母子嘗養宫中故往年市人以狂言動茂實頗駭物聽近者韓絳又以讒説傾宰相重搖人心則是一茂實之身逺則為小人所指目近則為羣臣所疑懼雖聖心坦然於物無猜恐未能家至户曉使人人不惑也假令茂實其心如丹必無他腸亦未能家至户曉使人人不憂也如此則備宿衛典兵馬適足以啓天下之惑動天下之憂甚非重宗廟安臣民備萬一之計臣謂今日之宜要令兩善莫若解茂實兵權處以外郡於茂實不失富貴而朝廷得逺嫌疑䇿之善者也昔王郎自稱劉子輿盧方自號劉文伯因疑飾偽未必皆有犯上之心但流言驅扇羣情眩惑臣忝近列方當逺出心之所疑不敢不極論乞以臣言密付執政商量敞時受命知永興久之茂實乃罷詔凡府號官稱犯父祖名而非嫌名及二名者不以官品髙下並聽回避庚戌録繫囚降罪一等徒以下釋之分命官録三京繫囚六月壬子朔日有食之初司天言當食六分之半是日未初從西食四分而隂雲雷電頃之雨渾儀所言不為災權御史中丞王疇言頃嵗日食於正陽之月方食時實亦隂晦然於雲氣之間尚有見者固不得同不食當時有司乃稱食不及分而宰臣集班表賀甚失陛下祗畏奉天之意恐今有司或援近例乞賀班者臣故先事而言也同判尚書禮部司馬光言日之所照周遍宇宙雲之所蔽至為近狹雖京師不見四方必有見者此乃天戒至深不可不察漢成帝永始六年九月日食四方不見京師見者禍尚淺也四方見京師不見者禍變深也日者人君之象天意若曰人君為隂邪所蔽災慝甚明天下皆知其憂危而朝廷獨不知也食不滿分者乃厯官術數之不精當治其罪亦非所宜賀也於是詔百官毋得稱賀乙丑太白書見庚申賜草澤建安章友直銀百兩絹百匹友直篆國子監石經成除試將作監主簿辭不就因有是賜友直得象之族也得象為宰相常欲官之友直謝去終其身不仕詔還曹利用所沒田宅利用既昭雪其家纍請於朝至是用祫享赦書盡還之壬申嵗星晝見甲戍起復富弼為禮部尚書平章事昭文館大學士監修國史弼辭不拜故事執政遇喪皆起復弼謂金革變禮不可用於平世帝五遣使起之卒不從命考異李燾曰或言弼初與韓琦同在二府左提右潔圖致太平天下謂之韓富既又同為宰相琦性果斷弼性審謹琦質直語或涉俗俗謂語多者為絮嘗議政事弼疑難者數四琦意急曰又絮耶弼變色曰絮是何言與又嘗言及宰相起復故事琦曰此非朝廷盛典也於是弼力辭起復且言臣在中書蓋嘗與韓琦論此今琦處嫌疑之地必不肯為臣盡誠敷奏願陛下勿復詢問斷自宸慮許臣終喪琦見之不樂自是二人稍有間云按此據司馬氏記聞及蘇氏别志又參取弼所上劄子然謂弼與琦自此積有隙恐未必然今不取丙子以司馬光知諌院入對丁丑命翰林學士吳奎王圭同詳定茶法考異實録明年正月丁丑乃命王圭今從會要戊寅以度支判官直集賢院同修起居注王安石知制誥初安石辭修起居注既得請又申命之安石復辭至七八乃受及遷知制誥自是遂不復辭官矣時有詔今後舍人院不得申請除改文字安石曰審如是則舍人不得復行其職而一聽大臣所為自非執政大臣欲傾側而為私則立法不當如此今大臣之弱者則不敢為陛下守法強者則挾上旨以造令諫官御史無敢忤其意者臣實懼焉安石由是與執政忤資治通鑑後編卷六十八
