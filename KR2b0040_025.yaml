body:
  text: 資治通鑑後編卷二十五刑部尚書徐乾學撰宋紀二十五起柔兆敦牂正月盡彊圉協洽八月凡一年有竒真宗膺符稽古神功讓德文眀武定章聖元孝皇帝景德三年正月辛未始置常平倉先是言事者請于京東西河北河東陜西江淮兩浙每州計戶口多少量留上供錢自千貫至二萬貫令轉運使擇清幹官主之専委司農寺總領三司無得移用每嵗夏秋凖市估加錢收糴貴則减價出糶俟十年有增羡則以本錢還三司詔三司集議請如所奏大率萬戶嵗糴萬石止于五萬石或三年以上不糶則回充糧廪别以新粟補之二月丙子權三司使丁謂等言唐字文融置勸農判官檢戶口田土僞濫等事今欲别置慮益煩擾而諸州長吏職當勸農乃請知州並兼管內勸農使餘及通判並兼勸農事諸路轉運使副並兼本路勸農使詔可勸農使入銜自此始甲申升宋州為應天府以太祖舊藩也丙戌以唐張九齡九世孫元吉為韶州文學元吉詣闕獻眀皇墨跡及九齡真圖告身故録之復置都大發運使以虞部員外郎馮亮為之丁亥王繼英卒契丹既和朝廷無事冦凖頗矜其功雖帝亦以自得也待凖極厚王欽若深嫉之一日會朝凖先退帝目送凖欽若因進曰陛下敬畏冦凖為其有社稷功耶帝曰然欽若曰澶淵之役陛下不以為耻而謂凖有社稷功何也帝愕然曰何故欽若曰城下之盟春秋耻之今以萬乘之貴而為澶淵之舉是盟于城下也何耻如之帝愀然不悅欽若曰陛下聞博乎博者輸錢欲盡乃罄所有出之謂之孤注陛下寇凖之孤注也斯亦危矣由是帝顧凖稍衰凖在中書喜用寒俊每御史缺輒取敢言之士他舉措多自任同列屢目吏持例簿以進凖曰宰相所以進賢退不肖若用例一吏職爾因卻而不視戊戌凖罷為刑部尚書知峽州以參知政事王旦為工部尚書平章事旦入謝便坐帝謂曰寇凖以國家爵賞過求虛譽無大臣體罷其重柄庶保終吉也既而命凖出知峽州將行又遣近臣𫝊㫖戒約初張詠在成都聞凖入相謂僚屬曰寇公竒才惜學術不足耳及凖知峽詠適自成都還凖送之郊問曰何以教凖詠徐曰霍光𫝊不可不讀也凖莫喻其意歸取其𫝊讀至不學無術笑曰此張公謂我也吕中曰我朝善守格例者無若李沆王旦王曽吕夷簡富弼韓琦司馬光吕公著之為相破格例者無若王安石章惇蔡京王黼秦檜之為相考其成效驗其用人則破格例者誠不若用格例者之為愈也然寇凖以公心行之故破格例而用君子也王安石以私心行之故破格例而用小人也抑王安石嘗置中書條例司溫公譏之曰宰相以道佐主茍事皆檢例而行之胥吏可為宰相何必擇也如溫公所言則安石亦欲循格例乎蓋溫公亦未知安石用心之所在徒見其編修條例則謂之檢例耳不知安石正以用例為非而盡破舊例以立法溫公以言譏之是助之耳此又不可不知也元許浩曰孤注之喻其言甚踈第真宗不之察耳夫博之為道决于一擲偶雉則雉偶盧則盧爾能之我亦能之非可以用乎知力也于是乎有孤注焉蓋資竭勢窮不得已而為之以僥幸于一擲之得其危甚矣寇凖相天子以天下而當契丹財用我富也士馬我衆也土地我廣也人才我盛也地利我得也人心我和也不啻若善奕者灼見彼此之勢我嘗有餘而坐以取勝不待下子而後見也是豈博之僥幸于一得者所可喻乎欽若之說不攻自破真宗信之而後人亦以為疑豈皆知博而不知奕乎己亥以參知政事馮拯為兵部侍郎王欽若為尚書左丞陳堯叟為兵部侍郎並知樞密院事以趙安仁為諫議大夫參知政事樞密都承㫖韓崇訓東上閣門使馬知節並僉書樞密院事三月乙巳客星出東南太常丞任隨上言曰今諫議大夫司諫正言雖有數員但充位尸祿而已願陛下擇賢士黜具臣懸賞罰之文立懲勸之道其兩省諫官並准有唐故事定其員數優其俸給限以遷官之年月責以供職之否臧其或獻替推誠彌縫勵節言事有禆于時政抗章不避于天誅則請行甄擢以勸衆焉或尸利無慙弼違有闕務引腹非之咎多致面從之諛則請行降黜以勵衆焉夫如是則賢者勸惰者激庸者退懦者立朝廷之士咸願效忠而報國矣帝覽而嘉之己未詔諫臣悉心獻替賞罰之典斷在必行是月始命朝臣提㸃開封府界諸縣鎮公事其後又增置一員以閣門祗候充考異初置府界提㸃會要在景德三年增置在四年十二月而實録並無之本志亦甚略今且附見實録二年十二月嘗記命髙繼忠等提㸃府界刑獄錢帛疑此即置官事始也夏四月丙子幸崇文院觀四庫圖籍壬辰命使六人巡撫益利梓䕫福建等路犒設將吏存問父老踈决繫囚仍案察官吏能否民間利害以聞時屯田員外郎謝濤使益利路及還舉所部官三十餘人宰相以為多濤乃厯陳其治狀且願連坐奉使舉吏連坐自濤始乙未种放賜告歸終南山復詔羣臣轉對五月壬寅朔司天言日當食帝避正殿不視事百官各守其司既而隂翳不見帝語宰相曰此非朕德所致但喜分野之民不被其災耳司天奏周伯星見羣臣上表稱賀知雜御史王濟乘間言于上曰瑞星實符聖德然唐太宗以家給人足豐年為上瑞臣願陛下日謹一日居安慮危則為瑞大矣帝嘉納之甲辰趙德眀遣其兵馬使賀守文來貢先是向敏中及張崇貴與德眀議立誓約久未决德眀雖數遣使修貢然于七事訖莫承順纍表但云乞先賜恩命徐議之時已有詔許德眀毋納靈州既又賜敏中等詔諭德眀止遣子弟入宿衛及毋得攻劫西路進奉蕃部縱有爭競並取朝廷和斷他約悉除之然亦不聽回圖往來及放行青鹽之禁乙巳敏中等言二事苟不如約恐乖前議請皆與之帝以德眀變詐難信儻務姑息必貽後患復賜敏中等詔令熟計復奏丙子命王欽若陳堯叟同修時政記每月十五日送中書度支副使李士衡言關右自不禁解鹽已來計司以賣鹽年額錢分配永興同華耀四州軍而永興最多于民不便請减十分之四詔悉除之先是內帑嵗出緡錢三十萬助陜西軍資帝將幸洛士衡獻粟五十萬斛又以三十萬斛饋京西朝廷以為材故召令佐三司考異士衡𫝊云上謁陵寢因幸洛士衡獻粟五十萬斛又以三十萬斛助京西故得度支副使按士衡除度支副使乃景德二年三月丙申謁陵寢幸洛實四年正月二日事本𫝊誤矣今加刪潤使不相抵牾萊蕪判官歐陽冕求應賢良方正而大言自薦以姬旦臯為比且云使臣日試萬言一字不改日覽千字一句不遺由是促召赴闕令中書試五論三頌諸詩四十首共限萬言題既出冕惶駭自陳止應賢良不應萬言幸假貸乃以所上表示之冕不敢復言至晡但成五論一頌共三千字既奏御帝令問表中所陳條目冕伏躁妄之罪責授下州司戶參軍左諫議大夫陳省華卒省華辨智有吏幹妻馮氏性嚴訓諸子尤力不許事華侈堯叟既貴孝謹益不衰掌樞密時弟堯佐直史館堯咨知制誥與省華同在北省諸孫任官者十數人宗親登科者又數人榮盛無比客至堯叟等皆侍立其側客不自安多引去舊制登樞近者母妻即封郡夫人堯叟初拜以父在朝止封其妻而母但從夫邑封堯叟表讓朝廷以彛制不聽省華卒既逾年帝乃封其母為上黨郡太夫人後進封滕國年八十餘尚無恙涇原儀渭都鈐轄秦翰知鎮戎軍曺瑋等各請出兵討賊帝以德眀纍遣使修貢慮失誠信不許德眀初請命于朝瑋言繼遷擅河西地二十年兵不解甲使中國有西顧之憂今國危子弱不即禽滅後更盛强難制願假臣精兵出其不意擒德眀送闕下復以河西為郡縣時不可失朝廷方欲以恩致德眀寢其書不報丁巳幸北宅視德恭疾己未德恭卒六月丙子羣臣固請聽樂從之南平王黎桓卒諸子爭立攻戰連月有司請發兵平之帝以桓素修職貢豈宜伐喪不許而以邵曄為緣海安撫使令譬曉之丁丑京東轉運使張知白上疏曰司天奏周伯星見此聖德動天而辰象昭瑞也臣聞懼亂者治必興思危者安必久陛下誠能謹戒抑畏日新其德則瑞星不出臣亦稱賀苟異于是則瑞星雖出臣亦不敢同衆人之賀也况今西北二隅雖罷征戰之役然以比諸古者屈膝稱臣欵塞內附則亦事異而禮殊矣帝覽疏謂輔臣曰知白以諫官在外而乃心朝廷可謂知所職矣庚寅以殿中丞王旭同判吏部南曺旭旦之弟也自旦為政旭避嫌不復釐事至是虞部員外郎王矩言旭前宰緱氏廉白有政績帝謂旦曰旭之幹敏朕亦素知且屢有言其才堪任京府僚佐者旦以避嫌懇辭帝曰朝廷用才不可以卿故使之淪滯帝欲授三司判官旦又固讓帝重違其意故有是命後數日旭引對選人帝面賜緋魚謂旦曰朕向不知卿弟猶衣緑也秋七月知益州張詠嵗滿宰相王旦擬以任中正代之議者多云不可帝以詰旦旦曰非中正不能守詠規矩他人往妄有變更矣壬寅擢中正工部郎中知益州在郡凡五嵗遵詠條教人甚便之衆乃服旦知人乙巳太白晝見壬子邵曄上雍州至交趾水陸路及控制宜州山川等圖帝曰祖宗闢土廣大惟當慎守不必貪無用地苦勞兵力甲子大宴含光殿始用樂忠武節度使髙瓊卧疾帝欲臨幸其第王欽若恨瓊附寇凖且沮凖澶淵之功因言瓊雖久掌禁兵備宿衛然未嘗有破敵功凡車駕臨問所以寵待勳臣施之于瓊恐無以示甄别乃止及卒有司言當輟一日朝帝以瓊未嘗有過特廢朝二日考異按宋史瓊卒于十二月戊寅今從長編附記于此蓋李氏亦因真宗欲臨幸而并及之非謂其卒于是月也八月种放既歸終南教授山中表求太宗御書及經史音疏詔悉與之因謂輔臣曰近中使還言放居草屋食野菜蕎麵而已如此淡薄亦人所難也癸未詔以來年春朝謁諸陵王旦言行宫損壞要須修葺帝曰如此亦勞民矣乃詔所至州縣但增飾館驛不得更建行宫侍從臣僚并百司供擬及供御之物並令减省九月庚戌詔以稼穡屢登機務多暇自今羣臣不妨職事並聽遊宴御史勿得糾察上已二社端午重陽並旬時休務一日祁寒盛暑大雨雪議放朝著于令丙辰御崇政殿親試賢良方正直言極諫光祿寺丞錢易廣德軍判官石待問並入第四等以易為袐書丞待問為殿中丞雄州團練使何承矩以老疾求解邉任帝令自擇其代承矩薦安撫副使李允則丙寅即命允則知雄州兼安撫使改授承矩齊州團練使便道之任承矩至齊州才七日卒緣邉洎涿易州民聞之皆揮涕有相率詣雄州發哀飯僧者承矩習熟戎事有方略能綏撫異俗其後契丹使至者言國中皆畏服承矩之名嘗于雄州北築愛景臺植蓼花日至其處吟詩數十首刻于石人謂何六宅愛蓼花不知其經始塘泊也尤好儒學賔禮賢士大夫其知潭州日李沆王旦實為佐屬承矩器以公輔待之絶厚丁卯鄜延鈐轄張崇貴入奏趙德眀遣牙校劉仁朂來進誓表請藏盟府且言所乞回圖及放青鹽之禁雖宣命未許然誓立功效冀為異日賞典也帝賜詔嘉奬焉冬十月庚午朔以趙德眀為定難軍節度使兼侍中封西平王給俸如內地又録德眀誓表令渭州遣人齎至西凉府曉諭諸蕃轉告甘沙首領因責德眀子弟入質德眀謂非先世故事不遣惟獻駝馬謝恩而已未幾契丹亦册德眀為夏國王吕中曰太祖之待李彜興不過世襲之邉將耳李繼捧來朝朝廷不能行太祖收方鎮之法遽欲使之內屬而收其故地所以啓繼遷之叛其失一也然繼遷之叛其始亦不過邉庭叛將耳自其賜以國姓名以保吉保忠名不正言不順愈以啓其驕心其失二也然屢叛屢服未至于與契丹並立而為患也自朝廷力不能制乃使保吉復入夏臺故地自保吉既降朝廷復賜以夏綏銀靜宥五州則是無故而與之重地所以啓其入寇之心其失三也丁丑以張崇貴為趙德眀旌節官告使太常博士趙湘副之賜德眀襲衣金帶金鞍勒馬銀萬兩絹萬匹錢二萬貫茶二萬斤丁酉葬眀德皇后于永熙陵十一月壬寅周伯星再見庚戌徙知永興軍府周瑩為邠寧環慶都部署以孫全照代之乙卯以宰臣王旦為朝拜諸陵大禮使先是江淮嵗運米輸京師未有定制是嵗始定六百萬石為嵗額從發運副使李溥之請也考異按本𫝊云江淮運米輸京師嵗才三百五十萬斛李溥增至六百萬因除發運副使按溥除副使實録不書會要于景德三年十一月載溥請定嵗額則溥已為副使矣恐𫝊未必可據也今從會要契丹羣臣加上蕭太后尊號曰睿德神略應運啓化法道洪仁聖武開統承天皇太后上其主尊號曰洪文宣武至德廣道昭孝皇帝置中京于七金山下其地本奚王牙帳也十二月乙酉狩近郊以親獲白兔付有司薦廟是冬沙州曺宗夀致貢于契丹四年春正月遣工部尚書王化基乘驛詣河中祭后土廟用大祀禮告將朝陵也甲辰以樞密院事陳堯叟為東京留守乙巳以權三司使事丁謂為隨駕三司使鹽鐵副使林特副之謂機敏有智謀善附㑹而有心計在三司案牘填委吏久難解者謂一言判之衆皆釋然己未車駕發京師庚申次中牟縣除逋負釋囚繫賜父老衣幣所過如之甲子次鞏縣罷鳴鞭及太常奏嚴金吾𫝊呼或獻洛鯉帝曰吾不忍食也命放之丙寅齊于永安鎮行宫太官進蔬膳丁卯夜漏未盡三鼓帝乘馬却輿輦繖扇至安陵外次易素服步入司馬門行奠獻之禮次詣永昌永熙陵又各詣下宫凡上宫用牲牢祝册有司奉事下宫備膳羞內臣執事百官皆陪位又詣元德皇太后陵奠獻又于陵內設幄奠祭如下宫禮帝每至陵寢望門而哭初有司具儀止常服帝特制素服禮畢遍詣孝眀孝惠孝章懿德淑德眀德皇后陵又至莊懷皇后陵遂單騎尋視陵闕以內臣從又親奠䕫王魏王岐王恭孝太子鄆王周王安王諸墳辰後暫至幄次更衣復詣陵奉辭有司以朝拜無辭禮帝感慕哀切未忍去故復往焉及午而還左右進繖帝卻之度昭應水乃許進至行宫始御嘗膳又遣官祭一品墳皇諸親墓德音减西京及諸路流罪以下囚釋逋缺賜畿縣民租稅有差建永安鎮為縣二月戊辰朔車駕遂如西京夕次偃師縣始復奏嚴帝猶服鞾袍不舉樂己巳至西京始奏樂道經漢將軍紀信冡司徒魯恭廟詔贈信為太尉恭為太師辛未命吏部尚書張齊賢祭周六廟詔從官先塋在洛者賜告祭拜壬申謂輔臣曰前代內臣恃恩恣橫蠧政害物朕嘗深以為戒至于班秩賜與不使過分有罪未嘗矜貸此輩常亦畏懼王旦等曰前代事迹昭然足為龜鑒陛下言及此社稷之福也內侍史崇貴嘗使嘉州還上言知縣某貪濁有佐官某廉幹乞擢為知縣帝曰內臣將命能採善惡固亦可奬然便爾賞罰外人必未厭伏當須轉運使深察之富弼曰人主聽納不可不慎慎之之術惟在防微防微之術莫若左右之言不入也真宗不以一內侍之言進退官吏于聽納之道慎之至也甲戌幸上清宫詔賜酺三日乙亥詔罷西京𣙜酤官賣麴如東京之制丙子加號列子為冲虛至德真人帝之次鞏縣也太子太師吕䝉正輿疾來見不能拜命中使挾之以進賜坐勞問壬午幸其第賜賚甚厚甲申御五鳳樓觀酺召父老五百人賜飲樓下丁亥幸元偓宫戊子葺周六廟增封唐孝子潘良瑗及其子季通墓庚寅詔河南府置五代漢髙祖廟辛卯車駕發西京謂輔臣曰歸途陵闕在望雖已遣官祭告朕豈安然而過乎壬辰帝乘馬至孝義鎮吏訾村復設次與親王望陵祭奠羣臣于幄殿東望拜每進酒食帝執爵舉匕箸涕泗哀感甲午次鄭州遣使祀中嶽及周嵩懿二陵考異東都事略作嵩慶二陵今從宋史丁酉賜隱士楊璞繒帛三月己亥帝至自西京乙丑以曺瑋為西上閣門使賞其扞邉功也瑋在鎮戎嘗出戰少捷偵敵去已逺乃驅所掠牛羊輜重而還頗失部伍其下憂之言于瑋曰牛羊無用徒縻軍不若棄之整衆而歸瑋不答敵兵去數十里聞瑋利牛羊而師不整遽還襲之瑋行愈緩得地利處乃止以待之敵軍將至逆使人謂之曰蕃軍逺來必甚疲我不欲乘人之怠請憩士馬少選决戰敵方苦疲皆欣然嚴軍而歇良久瑋又使人諭之曰歇定可相馳矣于是各鼓軍而進一戰大破之敵帥遂棄牛羊而還徐謂其下曰吾知彼已疲故為貪利以誘之比其復來幾行百里矣若乘鋭便戰猶有勝負逺行之人若少憩則足痺不能立人氣亦闌吾以此取之契丹城遼西為中京大定府契丹主常過七金山土河之濵南望雲氣有郛郭樓閣之狀因議建都于此擇燕冀良工倣臨潢置宫掖樓閣府庫市肆廊廡城郭以漢户實之辛巳皇后郭氏崩周悼獻王后所生也王薨后悲感生疾遂不起后性謙約寬仁惠下尤惡奢靡族屬入謁禁中或服飾華侈必加戒朂有以家事求言于帝者后終不許兄子出嫁以貧欲祈恩賚但出裝具給之帝嘗使觀宜聖殿諸庫后辭曰國之寶庫非婦人所當入陛下欲惠賜六宫願量頒之妾不敢奉詔帝尤加禮重焉壬午帝謂輔臣曰皇后自東宫事朕至正位中壼小心遜順有內助之勤降年不永深所嗟悼宰相王旦言諸路各置轉運使復遣官檢舉酒稅競以增益課利為功煩擾特甚帝曰官吏務貪勞績不恤民困朕甚閔之乃詔三司取一年中等之數立為定額自今中外勿得更議增課以圖恩奬五月丙申朔日有食之帝與輔臣言及朝士有交相奏薦者王旦曰人之情僞固亦難知或言其短而意在薦揚或稱其能而情實排抑唐劉仁軌嘗忿李敬𤣥異己將以計去之乃稱其有將帥才而敬𤣥卒敗軍事此皆不以國家為慮者也帝曰若然則險僞之輩世所不能絶也戊申詔以鼓司為登聞鼓院登聞院為登聞檢院命右正言周起太常丞路振同判鼓院吏部侍郎張詠判檢院檢院亦置鼓先有內臣勾當鼓司自此悉罷諸人訴事先詣鼓院如不受詣檢院又不受即判狀付之許邀車駕如不給判狀聽詣御史臺自陳先是帝謂王旦曰開廣言路治國所先而近日尤多煩紊車駕每出詞狀紛紜洎至披詳無可行者故有此更置焉汀州黥卒王捷自言于南康遇道人姓趙氏授以小鐶神劍蓋司命真君也宦者劉承圭以其事聞命賜捷名中正是月戊申真君降中正家之新堂是為聖祖而祥瑞之事起矣戊午增孔子守塋二十戶初置雜賣場閏月戊辰减劍隴等三十九州軍嵗貢物䕫賀等二十七州軍悉罷之壬申御崇政殿試賢良方正著作佐郎陳絳溧水縣令史良丹陽縣主簿夏竦先是帝謂宰臣曰比設此科欲求才識若但考文義則濟時之用安得而知朕以為六經之㫖聖人用心固與子史異矣今策問宜用經義參之時務因命兩制各上策問擇而用焉絳竦所對入第四次等擢絳為右正言竦為光祿寺丞是月立中書樞密院互報法事關軍機民政者必互相關報時中書命楊士元通判鳳翔府樞密院又令監香藥庫兩府不相知故有是命吕中曰中書主民樞密主兵三司主財各不相知故財已匱而樞密益兵不已民已困而三司取財不已國初宰相都提舉發運使又以宰相兼樞密使其意微矣自王顯用事一日六召中書不聞于是有岐溝之敗至是中書用楊士元通判而樞密又令之掌庫正猶熙寧初趙德眀與西人戰中書賞功而樞密不知此蓋不相通之患互報之法不可以不立也六月壬子司天言五星當聚鶉火而近太陽同時皆伏按占云五星不敢與日爭光者猶臣避君之眀也厯千百載所未曽有望付史官以彰殊事從之乙卯葬莊穆皇后于永熙陵之西北初定諡命宗正卿告廟王欽若疑其事因對具言王旦曰國朝故事昭獻之諡太尉率百官告廟孝眀之諡止宗正卿告廟今當以孝眀為比帝顧欽若曰皆有故事不足疑也庚申知樞密院王欽若以五星聚東井慶雲見奉表稱賀詔付史館按紀志五星並無聚東井事不知欽若何據或即壬子司天所奏乎吏部侍郎張詠以病瘍乞郡辛酉詔詠知升州徙向敏中知河南府兼西京留守司事先是舊相出鎮者多不以吏事為意冦凖雖有重名所至終日宴遊張齊賢倜儻任情獲劫盜或時縱遣之所至尤不治帝聞之皆不以為喜惟敏中勤于政事所至著稱帝曰大臣出臨方面不當如向敏中邪秋七月丁卯祔莊穆皇后神主于别廟殿室在莊懷皇后之上髙班內品裴愈出隸唐州愈前監廣州綱遇交州使因言龍花蕊難得之物宜以充貢至是州採之為獻且言愈嘗道詔㫖帝曰朕懷撫逺俗何嘗有所宣索即下愈御史臺劾問而有是責仍以龍花蕊還交州帝謂輔臣曰近見詞人獻文多故違經㫖以立說此所謂非聖人者無法也有太甚者當黜以為戒知宜州劉永規馭下嚴酷六月乙卯軍校陳進因衆怨鼓譟殺永規擁判官盧成均為帥僣號南平王據城反甲戌奏至詔忠州刺史曺利用等領兵進討仍諭賊黨有來歸者並釋罪權三司使丁謂言景德三年新收戶比咸平六年計增五十五萬有竒賦入增三百四十六萬有竒望特降詔㫖自今以咸平六年戶口賦入為額嵗較其數具上史館從之黎龍廷自稱權安南靜海軍留後遣其弟眀昶等來貢帝賜以九經及佛氏書辛巳授龍廷靜海節度使交趾郡王賜名至忠給以旌節戊子帝謂輔臣曰近日以來殊無獻言者卿等宜勤接士大夫察問四方事以聞詔翰林遣畫工分詣諸路圖上山川形勢地里逺近付樞密院每發兵屯戍移徙租賦以備檢閲癸巳復置諸路提㸃刑獄官先是帝出筆記六事指其一謂王旦曰勤恤民隱遴揀庶官朕無日不念也所慮四方刑獄官吏未盡得人一夫受寃即召灾沴先帝嘗選朝臣為諸路提㸃刑獄今可復置仍以使臣副之所至専察視囚禁審詳案牒其官吏貪濁弛慢者具名以聞八月乙巳置羣牧制置使命知樞密院事陳堯叟兼之尋又增置判官一員丁未中書門下言莊穆皇后祥除已久秋宴請舉樂不允以右監門衛上將軍錢惟治為右武衛上將軍月給俸錢百萬仍許在家養疾時惟治弟太僕少卿惟演上聖德論帝覽之謂宰臣曰惟演文學可稱且公王貴族而能留意翰墨有足嘉者可記其名并以論付史館因曰錢氏繼世忠順子孫可念如聞惟治頗貧乏尤可軫惻也遂有是命己酉益州地震出府庫錢五十萬貫付三司市菽麥時宰臣言今嵗豐稔菽麥甚賤為富民所蓄請官為斂糴以惠農民故也辛亥賜孔子四十六世孫聖佑同學究出身聖佑延世子宜孫也翰林侍講學士兼國子祭酒邢昺以羸老自陳曺州故鄉願給假歸視田里帝命坐慰勞之壬子拜工部尚書知曺州是日特開龍圖閣召近臣宴崇和殿帝作詩二章賜之預宴者咸賦昺視壁間禮記圖因陳中庸九經大義帝嘉納焉及行又命近臣祖送設㑹于宜春苑侍講學士外使自昺始癸巳帝謂王旦等曰前詔羣臣言事除機密外不得用無名劄子非合面奏公事不得上殿蓋防人之多言寖成萋菲也且必有顯狀封章彈奏有何不可近日戚綸面陳詔㫖不便因出綸奏示旦等曰綸意以疏逺之人難得面奏然自下詔已來升殿奏事者未嘗有阻旦曰飛語譛言聖慮固不為惑但近日論利害者差少亦宜留意省察王欽若曰臣下升殿一二次即希恩澤比來中外章疏若以前詔條約皆當付所司鞫問帝曰綸性純謹有學問此奏乃未諭詔㫖耳丁巳詔修太祖太宗正史命王旦監修王欽若陳堯叟趙安仁朝迥楊億同修置龍圖閣直學士以杜鎬為右諫議大夫充其職班在樞密直學士之下權三司使丁謂上景德會計録六卷詔奬之是月諸路皆言大稔資治通鑑後編卷二十五
