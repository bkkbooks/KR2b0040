body:
  text: 資治通鑑後編卷一百五十四刑部尚書徐乾學撰元紀二起玄黓敦牂七月盡閼逄涒灘十二月凡二年有竒世祖聖德神功文武皇帝至元十九年秋七月戊午朔日有食之立行樞密院於掦州鄂州高麗國王請自造船一百五十艘助征日本戊辰令蒙古軍守江南者更番還家壬申立馬湖路總管府八月江南水民飢者衆真定以南旱民多流移和爾郭斯請所在官司發廪以賑從之申嚴以金飾車馬服御之禁甲寅聖誕節是日還宫乙卯御正殿受皇太子諸王百官朝賀九月丁巳朔賑真定飢民其流移江南者官給之糧使還鄉里辛酉俱藍國入貢海外諸蕃惟俱藍尤逺自泉州至其境約十萬里招討使楊廷璧三往招之遂遣使貢寶貨及黑猿一壬戌敕官吏受賄及倉庫官侵盜臺察官知而不糾者驗其輕重罪之中外官吏贓罪輕者杖決重者處死言官緘默與受贓者一體論罪仍詔諭天下己巳定雲南賦稅用金為則以貝子折納每金一錢直貝子二十索壬申敇平灤高麗耽羅及揚州隆興泉州共造大小船三千艘亦奚不薛之北蠻洞向世維兄弟及散毛諸洞叛命四川行省就遣亦奚不薛軍前往招撫之使與其主偕來丁丑遣使括雲南所産金以博囉為打金洞逹嚕噶齊壬午詔諸路嵗貢儒吏各一人中書省掾史有闕選樞密院御史臺六部令史轉用之令史則取諸路嵗貢之數仍詔諸路嵗貢儒吏儒必通吏事吏必知經史者各道按察使舉亷能者升等遷敘釐正選法置黑簿以籍阿哈瑪特黨人之名初阿哈瑪特用事併中書左右司為一以劉正為左右司員外即及中書省奉旨窮阿哈瑪特之黨捕正與參政匝哈魯鼐等偕至帝前問曰汝等皆黨於阿哈瑪特能無罪乎正曰臣未嘗阿附惟法是從耳會暮車駕還內俱械繫於闕東隙地踰數日姦黨多伏誅復械繫正於拱衛司和爾郭斯曰上嘗謂劉正衣白衣行炭穴十年可謂亷潔者乃得免歸冬十月辛卯以平章軍國重事耶律鑄復為中書左丞相丙申初立詹事院以旺扎勒為右詹事賽音為左詹事詔由大都至中灤中灤至瓜州設南北兩漕運司乙巳罷屯田總管府以其事𨽻樞密院令管軍萬户兼之庚戌詔兩廣福建五品以下官從行省銓注耶律鑄言有司官吏以采室女乘時害民如令大郡嵗取三人小郡二人擇其可者厚賜其父母否則遣還為宜從之十一月丁卯襲封衍聖公孔洙入覲以為國子祭酒兼提舉浙東學校孔子後自宋南渡初其四十八代孫端友子玠寓衢州帝既滅宋疑所立或言孔氏子孫寓衢者乃其宗子洙赴闕遜於居曲阜者帝曰寧違榮而不違親真聖人後也遂有是命就給俸祿與護持林廟璽書詔以阿哈瑪特罪惡頒告中外凡民間利病即與興除之壬申以勢家為商賈者阻遏官民船立沿河巡禁軍犯者沒其家十二月壬辰中書左丞張文謙為樞密副使乙未殺宋丞相信國公文天祥先是閩僧言土星犯帝座疑有變未幾中山有狂人自稱宋主有兵千人欲取文丞相京師亦有中山薛保住上匿名書告變言某日燒蓑城葦率兩翼兵為亂丞相可無憂者時盜新殺阿哈瑪特遂撤蓑城葦遷瀛國及宋宗室於上都疑丞相者天祥也乃召天祥入帝諭之曰汝移所以事宋者事我我當以汝為相天祥曰受宋恩為宰相安事二姓願賜之一死足矣帝猶未忍遽麾之使退左右力贊帝從其請乃詔有司殺于燕京之柴市俄有詔使止之至則天祥死矣天祥至柴市觀者萬人臨刑殊從容問市人曰孰南面或有指之者即向南再拜而死年四十七其衣帶有贊曰孔曰成仁孟曰取義惟其義盡所以仁至讀聖賢書所作何事而今而後庶幾無愧南北人聞者皆為流涕天祥妻歐陽氏曰我夫不負國我安忍負夫遂自剄死天祥二子俱亡有同郡張于載者天祥友也天祥貴顯時屢以官辟不就臨安既破天祥自廣還過吉州城下于載來見曰丞相赴北于載當偕行既至燕寓天祥囚所側近日以美饌餽凡三年始終如一且潛製一櫝天祥受刑日即以藏其首復訪求天祥妻歐陽氏於俘虜中俾出焚其尸于載收拾骸骨襲以重囊與先所函櫝南歸吉州付其家葬之張于載字毅父事見輟耕録劉辰翁之所紀也適家人亦自惠州奉天祥母曾氏柩同日至城下人以為忠孝所感史臣曰自古志士欲信大義於天下者不以成敗利鈍動其心君子命之曰仁以其合天理之正即人心之安爾宋德祐亡矣文天祥奉兩孱王﨑嶇嶺海以圗興復兵敗身執終不可屈而從容伏鑕就死如歸是其所欲有甚於生者可不謂之仁哉許有壬曰宋飬士三百年得人之盛軼唐漢而過之逺矣盛時忠賢雜遝人有餘力及天命已去人心已離有挺然獨出於百萬億生民之上而欲舉其已墜續其已絶使一時天下之人後乎百世之下洞知君臣大義之不可廢人心天理之未嘗泯其有功於名教為何如哉文天祥少年趠厲有經濟之志中為賈似道所沮回翔外寮其以兵入援也大事去矣其付以鈞軸也降表具矣其往而議和也冀萬有一濟耳平生定力萬變不渝父母有疾雖不可為無不用藥之理天祥之語天祥之心也是以當死不死可為即為逸于淮振于海真不可為矣則惟有死耳可死矣而又不死非有他也等一死耳昔則在己今則在天一旦就義死如歸焉光明俊偉俯視一世顧膚敏祼將之士不知為何物也推此志也雖與嵩華爭高可也宋之亡守節不屈者有之而未有有為若天祥者事固不可以成敗論也文天祥死之日大風掦沙天地晝晦帝臨朝歎曰文丞相好男子不肯為吾用殺之誠可惜也自後連日隂晦宫中白晝或秉燭行適正一天師張宗演來朝帝問之對曰此殆殺文丞相所致也乃贈天祥特進金紫光祿大夫開府儀同三司檢校太保中書平章政事廬陵郡公諡忠武令僉樞密院事王積翁書神主灑掃柴市設壇祀之丞相博囉初行奠禮狂飈旋地起卷主入雲中博囉等大驚改書曰宋少保右丞相信國公天始開霽此事據趙弼文信公傳修之癸卯御史中丞崔彧言臺臣於國家政事得失生民休戚百官邪正雖王公宰相亦宜糾察近惟御史有言臣以為臺官皆當建言庶於國家有補至於選用臺察官止由中書寧無偏黨之弊今宜令本臺得自選任用漢人十六員蒙古人十六員相參巡歷為宜既而江淮省臣有欲專恣而忌臺察之言者上議欲以行臺隸行省詔廷臣雜議兵部尚書董文用曰御史臺譬之卧虎虎雖未噬人人猶畏之今虛名僅存而綱紀猶不振更加抑之則風采薾然無復可望矣從之浚濟州河容城處士劉因天資絶人日記千百言過目成誦初為經學究訓詁注釋之説歎曰聖人精義殆不止此及見周邵程朱之書即曰我固謂其當有是也愛諸葛孔明靜以修身之語表所居曰靜修是嵗布呼密薦之徴至擢右贊善大夫尋以繼母老辭歸俸給一無所受大都之糧仰給江南者自浙西涉江淮由黃河泝流至中欒自中欒陸運至淇門入御河以至京師又或由大清河至利津入海或開膠萊河以通海勞費不資卒無成功宋季有海盜朱清者嘗為富家傭殺其主亡入海島與其徒張瑄乘舟抄掠海上備知海道曲折尋就招懷為防海義民巴延滅宋時遣清等載宋庫藏諸物從海道入京師授金符千戶二人遂言海運可通乃命上海總管羅璧暨清等造平底海船六十艘運糧四萬六千餘石由海道至京師初蘭溪金履祥以襄樊之師日急宋人坐視不敢救因進牽制搗虛之策請以重兵由海道直趨燕薊則襄樊之師將不攻而解且備敘海舶所經凡州郡縣邑下至巨洋别島難易逺近歷歷可據以行宋終莫能用及是清等獻海運之利而所由海道視履祥先所上書咫尺無異人始服其學之精核然清等創行海洋沿山求嶼風信失時踰年始至直沽朝廷未知其利仍立京畿江淮都漕運司二各置分司以督綱運每嵗令江淮漕運司運糧至中欒京畿漕運司自中欒運至大都陶宗儀曰國朝海運糧儲自朱清張瑄始以為古來未嘗有此按杜工部詩出塞云漁陽豪俠地擊鼓吹笙竽雲帆轉遼海粳稻來東吳又昔遊云幽燕盛用武供給亦勞哉吳門持粟帛泛海凌蓬萊則唐時已有海運矣朱張特舉行耳帝以所籍入權臣家婦賜後衛親軍副都指揮使元臣元臣辭曰臣家世清素不敢自汚帝嘉歎不已元臣别名哈喇哈遜契丹人鎮國上將軍邁努之子霸州元帥伊喇訥哷之孫也僉樞密院事趙良弼屢以疾辭得旨居懷孟良弼别業在溫縣故有地三千畝乃析為二六與懷州四與孟州皆永𨽻廟學以贍生徒自以出身儒素示不忘本也或問為治良弼曰必有忍其乃有濟人性易發而難制者惟怒為甚必克己然後可以制怒必順理然後可以忘怒能忍所難忍容所難容事斯濟矣建寧路管軍總管黃華叛衆幾十萬稱祥興五年髙興與戰于鉛山破其軍獲八千人太平宣徽羣盜起行管軍萬戶張圭討之數為賊所敗卒有殺民家豕而并傷其主者圭曰此軍之所以敗也斬其卒悉平諸盜二十年春正月己未立鴻吉哩氏為皇后時帝春秋高后頗預朝政相臣常不得見帝輒因后以奏事初鴻吉哩之族從太祖起兵有功尋立其女為后遂與約曰鴻吉哩氏生女世以為后生男世尚公主故元世諸后多其族焉癸亥敕藥爾哈領軍征緬國乙丑和爾郭斯言去冬中山府姦民薛保珠為匿名書來上妄效東方朔書欺罔朝廷希覬官賞敇誅之又言自今應訴事者必須實書其事赴省臺陳告其敢以匿名書告事重者處死輕者流逺方能發其事者給犯人妻子仍以鈔賞之又阿哈瑪特專政時衙門太冗虛費俸祿宜依劉秉忠許衡所定併省為便皆從之設務農司敇諸事赴省臺訴之理決不平者許詣登聞鼓院擊鼓以聞預備征日本軍糧令高麗國備二十萬石以安塔哈依舊為征東行省丞相丙寅發五衛軍二萬人征日本召太常少卿汪忠良擇日出師忠良奏曰僻陋海隅何足勞天戈不聽時帝意甚決朝臣無敢諫者淮西行省右丞昻吉爾上疏曰臣聞兵以氣為主而上下同欲者勝比者連事外夷三軍屢衄不可以言氣海內騷然一遇調發上下愁怨非所謂同欲也請罷兵息民南臺御史大夫相威亦遣使入奏曰倭不奉職貢可伐而不可恕可緩而不可急向者師行期迫戰船不堅前車已覆後當改轍今為之計預修戰艦訓練士卒耀兵揚武使彼聞之深自備禦遲以嵗月俟其疲怠出其不意乘風疾往一舉而下萬全之䇿也帝皆不聽丙寅御史臺言燕南河北山東去嵗旱災按察司已嘗閲視而中書不為奏免稅糧民何以堪詔令有司權停勿徴仍諭自今管民官凡有災傷過時不申及按察司不即行視者皆罪之河北流民渡河求食朝廷遣使者集官屬絶河止之按察副使程思亷曰民急就食豈得已哉天下一家河南河北皆吾民也亟令縱之且曰雖得罪死不恨章上不之罪也刑部尚書崔彧上疏言時政十八事帝命中書行其數事餘與御史大夫伊實特穆爾議行之彧又言江南盜賊相挻而起凡二百餘所皆由拘刷水手興造海船民不聊生激而成變日本之役宜姑止之又江西四省軍需宜量民力勿強以土産所無凡給物價與民者必以實召募水手當從其所欲伺民氣稍蘇我力粗備三二年後東征未晚也帝以為不切曰爾之所言如射然挽弓雖可觀發矢則非是矣彧又言昨中書奉旨差官度量大都州縣地畝本以革權勢兼并之弊欲其明白不得不於軍民諸色人戶通行核實又因取勘畜牧數目初意本非擾民而近者浮言胥動恐失農時乞降旨省諭詔中書即行之又言各路每嵗選取室女宜罷宋文思院小口斛出入官糧無所容隱宜頒行皆從之丁卯巴延岱等伐船材于烈堝都山乾山凡十四萬二千有竒起諸軍貼戶年及丁者五千人民夫三千人運之命右丞錫里特穆爾及萬戶三十五人蒙古軍習舟師者二千人特默齊萬人習水戰者五百人征日本壬午改廣東提刑按察司為海北廣東道廣西按察司為廣西海北道福建按察司為福建閩海道鞏昌按察司為河西隴北道二月辛丑定軍官選法立官吏贓罪法癸丑諭中書省大事奏聞小事便宜行之毋致稽緩三月己未御史臺臣言平灤造船五臺山造寺伐木及南城建新寺凡役四萬人乞罷之詔伐木建寺即罷之造船一事其與省臣議前後衛軍自願征日本者命選留五衛漢軍千餘其新附軍令悉行乙丑命烏努呼都岱往揚州録囚其江北重囚謫征日本立雲南按察司照刷行省文卷罷淮安等處淘金官惟計戶取金丙寅帝如上都丁卯增置蒙古監察御史六員廣州新會縣林桂芳趙良鈐等聚衆偽號羅平國稱延康年號官軍擒之伏誅餘黨悉平罷福建道宣慰司復立行中書省于漳州夏四月庚寅以侍衛親軍二萬人助征日本壬辰安塔哈求軍官習舟楫者同征日本命元帥張林招討張瑄總管朱清等行以高麗王就領行省規畫日本事宜甲午禁近侍為人求官紊亂選法申嚴酒禁有私造者財産女子沒官犯人配役申私鹽之禁許按察司糾察鹽司五月己未免五衛軍征日本發萬人赴上都縱平灤造船軍歸耕撥大都見管軍代役占城行省右丞索多率戰船千艘出廣州浮海伐占城占城迎戰兵號二十萬索多率敢死士擊之斬首并溺死者五萬餘人又敗之于大浪湖斬首六萬級占城降索多造木為城闢田以耕伐烏里越里諸小夷皆下之積穀十五萬以給軍六月戊子以征日本民間騷動盜賊竊發呼圗特穆爾蒙固岱乞益兵禦寇詔以興國江州軍付之初定官吏贓罪法自五十貫以上皆決杖除名不敘百貫以上者死崔彧言今百官月俸不能副贍飬之資難責以亷勤之操宜更議增庶官月俸所增俸鈔惟賦之於民官吏不貪民必受惠其有以貪抵罪亦復何辭從之己丑詔增內外官吏俸給初思播以南施黔鼎澧辰沅之界九溪十八洞蠻獠叛服不常詔四川行省討之參政竒爾濟蘇宣慰使阿爾呼蘭等鑿山開道分兵並進諸蠻伏險以拒然衆寡不敵多就擒戮其酋長內附赴闕辛亥詔分其地立州縣聽順元路宣慰司節制秋七月丙辰諭安塔哈所造征日本船宜少緩之所拘商船其悉給還丙寅開雲南驛路丁卯罷淮南淘金司以其戶還民籍八月癸未以明理察平章軍國重事商議公事立懷來淘金司丁未浙西道宣慰使史弼言頃以征日本船五百艘科諸民間民病之宜取阿巴齊所有船修理以付安塔哈庶寬民力并給鈔於沿海募水手從之濟州新開河成立都漕運司九月戊午哈喇岱等招降象山縣海賊尤宗祖等九千五百九十二人海道以寧壬戌調黎兵同征日本辛未以嵗登開諸路酒禁戊寅史弼陳弭盜之䇿為首及同謀者死餘屯田淮上帝然其言詔以其事付弼賊黨耕種內地其妻孥送京師以給鷹坊人等冬十月壬辰帝至自上都庚子左丞相耶律鑄坐不納職印妄奏東平人聚謀為逆間諜幕僚及黨罪囚阿里舒遂罷免仍沒其家資之半徙居山後黃華犯崇安浦城等縣圍建寧府命征東行省左丞劉國傑以其兵會江淮參政巴延等討之國傑攻破赤巖寨華投火死餘衆皆潰福建行省左丞呼喇蘇將兵來會梧桐川欲搜賊潰去者盡殺之國傑曰首亂者華也餘皆脅從招諭不歸誅之未晚未幾衆果出降十一月丁巳命各省印授時厯丁丑禁雲南管課官於常額外多取餘錢戊寅禁雲南權勢多取債息仍禁沒人口為奴及黥其面者十二月辛卯以中書參議溫迪罕圗嚕哈亷貧不阿附權勢賜鈔百錠丙午罷雲南造賣金箔規措所又罷都元帥府及重設官吏定質子令凡大官子弟遣赴京師樞密副使張文謙卒文謙為人剛明簡重凡所陳於上前莫非堯舜仁義之道數忤權幸而是非得喪一不以經意家惟藏書數萬卷尤以引薦人才為己任時論益以是多之是嵗用王積翁議令阿巴齊等廣開新河以通漕運然新河候潮以入船多損壞民亦苦之而蒙固岱言海運之舟悉至於是罷新開河頗事海運立萬戶府二以朱清為中萬戶張瑄為千戶蒙固岱為萬戶府逹嚕噶齊未幾又分新河軍士水手及船於揚州平欒兩處運糧命三省造船二千艘於濟州河運糧猶未專於海道也有江南人言宋宗室反者命遣使捕至闕下東宫宿衛士阿嚕威薩里趣入諫曰言者必妄使不可遣帝曰卿何以言之對曰若果反郡縣何以不知言者不由郡縣而言之闕庭必其仇也且江南初定民疑未附一旦以小民浮言輒捕之恐人人自危徒中言者之計帝悟立召使者還俾械繫言者下郡治之言者立伏果以嘗貸錢不從誣之帝曰非卿言幾誤但恨用卿晚耳自是命日侍左右湖南北盜賊乘舟縱橫劫掠行省平章哈喇哈遜患之右丞圖呼嚕曰樹茂鳥集樹伐則散戮一人足矣盜首喬大使者居九江郡守伊喇瑪卜丹取賂蔽之遣使擒以來獄成殺而令諸市羣盜頓息江淮行省宣使郤顯李兼訴平章蒙固岱不法有詔勿問仍以顯等付蒙固岱鞫之繫於獄必抵以死江南行臺監察御史申屠致逺慮囚浙西知其寃狀將縱之蒙固岱脅之以勢致逺不為動親脫顯等械使從軍自贖二十一年春正月乙卯帝御大明殿羣臣上尊號曰憲天述道仁文義武大光孝皇帝時議欲大赦參知政事張雄飛諫曰古人言無赦之國其刑必平故赦者不平之政也聖明在上豈宜數赦帝嘉納之遂止下輕刑之詔丁巳敇自今凡奏事者必先語同列以所奏既奏其所奉旨云何令同列知而後書之簿不明以告而輒書簿者杖筆且齊丁卯建都王烏蒙及金齒一十二部俱降建都先為緬所制欲降未能時諸王相輝和爾及行省右丞塔卜參知政事伊實德濟分道征緬於阿昔阿禾兩江造船二百艘順流攻之拔江頭城令都元帥袁世安戍之遂遣使招諭緬王不應建都太公城乃其巢穴遂水陸並進攻太公城拔之故至是皆降庚午立江淮荆湖江西四川行樞密院治建康鄂州撫州成都甲戍遣王積翁齎詔使日本取道慶元航海帝以其俗尚佛命補陀僧如智同往至日本境舟人有不願行者共謀殺積翁丁丑雲南諸路按察司官陛辭詔諭之曰卿至彼當宣明朕意勿求貨財名成則貨財隨之徇財則必失其名而性命亦不可保矣二月辛巳浚掦州漕河罷高麗造征日本船己亥放檀州淘金五百人還家丁未括江南樂工命安塔哈發兵萬五千人船二百艘助征占城船不足命江西省益之戊申徙江淮行省于杭州徙浙西宣慰司于平江省黃州宣慰司入淮西道立法輪竿于大內萬壽山高百尺漳州盜起命江浙行省調兵進討秦州總管劉發有罪嘗欲歸黃華事覺伏誅遷故宋宗室及其大臣之仕者於內地三月丁巳皇子北平王訥穆哈至自北邊王以至元八年建幕庭於和林北伊埒穆爾之地留七年至是始歸右丞相安圗繼至丙寅帝如上都夏四月己亥涿州巨馬河決衝突三十餘里壬寅江淮行省進各翼童男女百人戊申高麗王王睶及公主以其世子謜來朝呼圗特穆爾征緬之師為賊衝潰敇發思播田楊二家軍二千從征緬雲南行省為破緬國江頭城進童男女八十人五月癸丑樞密院臣言索多潰軍已令李恆收集江淮江西兩省潰軍别遣使招諭凡至者皆給之糧舟楫損者修之以俟阿里哈雅調用從之戊午敇中書省奏目文册及宣命劄付並用蒙古書不許用輝和爾字元自創業以來不用中國之字自制蒙古書用之括以四十八字母凡平上去入聲同一音者通以一字攝之故一字每十數用極礙義理然國人習而不察不知其非也又有輝和爾字尤為無理亦與蒙古字並行於國中故文書煩雜姦偽難窮至是始禁用之輝和爾者元人之雜種也蓋蒙古之初曰韃靼與回回國雜處而實二種韃靼回回各自娶其種女為妻後不能無亂則凡韃靼為父回回為母者號曰輝和爾種又自制字而用之所謂回回者即唐之回紇也其先豬種故世世不食豬肉其人勇悍善戰帝之滅宋多得其力又兵器之有炮始於回回號曰回回炮炮石大數尺火力所及勢極猛迅墜地猶陷深三四尺以棕櫚皮結網懸覆城上可以禦之乙丑蠲江南今年田賦十分之二其十八年以前逋欠未徴者盡免之阿嚕呼努言曩於江南民戶中撥匠戶三十萬其無藝業者多今已選定諸色工匠餘十九萬九百餘戶宜縱令為民從之庚午荆湖占城行省以兵進據烏馬境地近安南請益兵命鄂州逹嚕噶齊趙翥等奉璽書往諭安南河間任丘縣民李移住謀叛事覺伏誅括天下私藏天文圗讖太乙雷公式七曜厯推背圗苖太監厯有私習及收匿者罪之閏月丙戌行御史臺自揚州遷于杭州丙午以侍衛親軍萬人修大都城六月壬子遣使分道尋訪測驗晷景日月交食厯法增官吏俸以十分為率不及一錠者量增五分甲寅封皇子托歡為鎮南王駐鄂州庚申改蒙古都元帥府為蒙古都萬戶府秋七月己卯中書省臣言宰相之名不宜輕授今占城省臣已及七人宜汰之詔軍官勿𢃄相銜戊子詔鎮南王托歡征占城帝怒占城叛服不常命托歡與左丞李恆往會索多兵進擊之復以安南通謀占城令軍行假道於其國且徴其糧餉以給軍八月己酉御史臺臣言無籍之徒願從軍殺掠者初假之以張渡江兵威今各持弓矢剽劫平民若不分𨽻各翼恐生他變詔遣之還家辛亥占城國王遣使奉表乞回索多軍願以土産嵗修職貢庚午帝至自上都九月甲申京師地震籍嘉木揚喇勒智發宋陵所收金銀寶器修天衣寺其飲器則賜帝師蓋西僧欲得帝王髑髏以厭勝致富也侍衛士阿嚕威薩里擢朝列大夫左侍儀奉御遂勸帝治天下必用儒術宜招致山澤道藝之士以備任使帝嘉納之遣使求賢置集賢館以待之是月命阿嚕威薩里領館事辭曰陛下初置集賢以待士宜擇重望大臣領之以新觀聽請以司徒色勒敏領其事帝從之仍以阿嚕威薩里為集賢館學士兼太史院事士之應詔者盡命館穀之凡飲食供帳車服之盛皆喜過望其弗稱旨者亦請加賚而遣之有官於宣徽者欲隂敗其事故盛陳所給廪餼於內前冀帝見之帝果過而問焉對曰此一士之日給也帝怒曰汝欲使朕見而損之乎十倍此以待天下士猶恐不至况欲損之誰肯至者阿嚕威薩里又言於帝曰國學人材之本立國子監置博士弟子貟宜優其廪餼使學者日盛從之冬十月丁卯以招討使張萬為征緬招討使戊辰立常平倉以五十萬石價鈔給之十一月戊子命北京宣慰司修灤河道庚子以范文虎為中書左丞商量樞密院事辛丑和爾郭斯默珠丹張雄飛溫德亨並罷安圗復為中書右丞相以前江西𣙜茶運使盧世榮為右丞前御史中丞史樞為左丞布呼嚕伊蘇哈雅薩迪音並參知政事前戶部尚書拜珠參議中書省事世榮大名人阿哈瑪特專政世榮以賄進為江西𣙜茶運使後以罪廢阿哈瑪特死朝臣諱言利無可副上意者總制院使僧格薦世榮有才術謂能救鈔法增課額上可裕國下不損民帝召見奏對稱旨令與中書廷辨所欲行和爾郭斯等守正不撓為強詞所勝皆罷去故復起安圗而世榮擢右丞史樞等皆世榮所薦也初安圖與北平王被海都拘之十年始得還有譖其嘗受海都官爵者帝怒斷事官石天麟亦自海都部中還奏曰海都實宗親偶有違言非仇敵比安圗不拒絶之所以釋其疑心導其臣順也帝怒方解雄飛剛直亷慎始終一節嘗召見便殿語之曰聞卿貧甚今特賜卿白金二千五百兩鈔二千五百貫既出又加賜黃金五十兩雄飛拜受封識藏於家及其罷政阿哈瑪特之黨矯詔追奪之或有勸雄飛自辨者雄飛曰上以老臣亷故賜臣然臣未嘗敢輕用而封識以俟者正慮今日耳又可自辨乎尋起為燕南河北道宣慰使卒安圗之再入相也力辭不允遂往決於祈志誠志誠曰昔與子同列者何人今同列者何人安圗悟入見辭曰臣昔為宰相年尚少幸不失陛下事者丞佐皆臣所師友今事臣者皆進與臣俱則臣之為政能有加於前乎帝曰誰為卿言是對曰祈真人帝歎異者久之志誠丘處機之四傳弟子也居雲州金閣山道譽甚著安圗初為相嘗過而問之志誠告以修身治世之要故其為相也以清靜忠厚為主及罷還第退然若無與於世者人以為有得於志誠之言云盧世榮既入中書即日奉詔理鈔法之弊自謂其生財有法用其法當賦倍增而民不擾詔下會議人無敢言者翰林學士董用文謂曰此錢取於右丞家耶將取之民耶取於右丞之家則吾不知若取於民則有説矣牧羊者嵗常兩剪其毛今牧人日剪以獻主者固悅其得毛之多然羊無以避寒熱即死且盡毛又可得乎民財有限右丞將盡取之得無有日剪其毛之患乎世榮不能對議者出皆謝用文曰君以一言折聚斂之臣而厚邦本真仁人之言哉至元初丞相史天澤學士承旨王鶚等屢請以科舉取士詔令中書議定程式未及施行至是和爾郭斯與留夢炎等復言天下習儒者少而由刀筆吏得官者多帝曰將若之何對曰惟貢舉取士為便凡蒙古之士及儒吏隂陽醫術皆令試舉則用心為學矣方下中書省議而和爾郭斯罷事遂寢十二月甲辰朔中書省臣言江南官田為權豪寺觀欺隱者多宜免其積年收入限以日期聽人首實踰限為人所告者徴以其半給告者從之乙巳御史中丞崔彧言盧世榮不可為相帝大怒下彧吏欲致之法尋罷之以丁壯萬人開神山河立萬戶府以總之癸亥盧世榮言京師富戶釀酒價高而味薄以致課不時輸宜一切禁罷官自酤賣向之嵗課一月可辦從之癸酉命翰林承旨色勒敏翰林集賢大學士許國禎集諸路醫學教授增修本草是月鎮南王托歡軍至安南殺其守兵分六道以進安南興道王以兵拒于萬劫進擊敗之萬戶倪閏戰死于劉村安圗言於帝曰阿哈瑪特專政十年親故迎合者往往驟進據顯位獨劉宣張孔孫二人恬守故常終始如一乃除宣吏部尚書孔孫禮部侍即是嵗召燕南河北道按察使布呼密參議中書省事時盧世榮阿附僧格言能用已則國賦可十倍於舊帝以問布呼密對曰自昔聚斂之臣如桑𢎞羊宇文融之徒操利術以惑時君始者莫不謂之忠及其罪稔惡著國與民俱困雖悔何及臣願陛下無納其説帝不聽布呼密遂辭參議不拜湖廣平章政事約蘇穆爾貪縱淫虐誅求無厭或妄言初歸附時州縣長吏及吏胥富人比屋斂銀將輸之官銀已具而事遂中止約蘇穆爾即下令責民自實使者旁午隨地置獄株連蔓引備極慘酷民以考掠瘐死者載道所獲不資約蘇穆爾盡掩有之有使至永州判官烏古遜澤戒吏美供帳豐酒食務順適其意使者感愧無所發其毒因間以利害曉之一郡由是獲安盜起寶慶武岡皆永旁郡也行省遣澤討平之俘獲五百餘人簡出其詿誤者百有五十人上書言狀誅其首惡者三十一人餘得減死澤臨潢人其先女真烏古遜因以為氏權臣有欲以均輸法益國賦者慮按察司撓其事請令與轉運司併為一職詔集羣臣議之左贊善大夫瓜爾佳之竒言按察司者控制諸路發擲姦伏責任匪輕若使理財則心勞事冗將彌縫自救之不暇又安能繩糾他人哉併之弗便事遂寢之竒滕州人其先出女真加古部後稱為瓜爾佳資治通鑑後編卷一百五十四
