body:
  text: 資治通鑑後編卷三十三刑部尚書徐乾學撰宋紀三十三起者雍敦牂正月盡屠維協洽十二月凡二年真宗膺符稽古神功讓德文明武定章聖元孝皇帝天禧二年春正月乙未朔永州大雪六晝夜方止江陵溪魚皆凍死己亥以趙安仁為御史中丞兼尚書右丞左右丞兼中丞始此考異會要以為去年十二月今從百官表庚子芝草生真遊殿考異宋史作乙未今從長編及皇后所居崇徽殿帝作歌詩示宰相辛亥幸元符觀資善堂宴從臣及壽春郡王府官屬出御製賜壽春郡王恤黎民等歌元符觀資善堂等記頌并出壽春郡王詩什筆翰示宰相戊午王欽若等上天禧大禮記四十卷己未詔諸路災傷州軍並設粥賤糶官粟以惠貧民二月丁卯以升州為江寧府置軍曰建康命皇子壽春郡王為節度使加太保封升王先是宰臣屢言王性聰悟好學樂善孝謹彌篤逈然老成而未正封爵中外人情咸所屬望願早議崇建帝謙讓久之洎固請再三乃許焉考異以升州為江寧府號建康軍據實録在丁卯後一日今從本紀先書之戊辰以壽春郡王友張士遜崔遵度並為升王府咨議參軍左正言直史館晏殊為記室參軍庚午右正言劉燁請自今言事許升殿面對從之壬午對右正言劉燁魯宗道于承明殿凡八刻三月壬寅帝謂宰臣曰近日疆陲肅靜民亦安阜向敏中對曰陛下以德綏懷無逺不服但邉境雖安而兵數未減慮多冗費帝曰今京師兵可議裁減存其精鋭敏中等曰軍額漸多農民轉耗近準詔已住召募或斥去疲老則冗食漸少帝曰卿等常冝講求務在經久也冨弼曰兵之不出于農久矣近代養兵之法一係名籍非老不去一兵嵗約五六十緡則其中豈容冗乎臣聞太祖得周代之兵及平蜀揀成十萬蓋要人人精鋭也太宗添兵止三十餘萬真宗添兵至五六十萬尚慮耗費財用自慶厯以來添兵至百餘萬不擇精鋭而去冗雜非經久之計也甲寅右正言魯宗道言大辟罪如婺州訛言者望自今精加按覆帝出其狀以示輔臣且曰自今當詳議者更加審細貴無濫也宗道每有風聞多所論列帝意頗厭其數宗道因對自訟曰陛下所以任臣者豈欲徒事納諌之虛名耶臣竊愧尸祿請得罷斥帝慰諭良久他日念之因題殿壁曰魯直丙辰帝謂宰相曰雨足麥茂豐稔可期貧乏之民事須拯濟詔州縣先貸貧民糧種止勿收夏四月乙亥詔江淮方稔宜令更留糧儲三二百萬石以充軍食免其擾民庚寅降天下死罪一等流以下釋之災傷地分去年夏秋稅及借糧種悉與除放今年夏稅免十之三大名府登萊濰密青渭州免十之四不得折變支移欠負物色未及依限科校候豐熟日漸次催納諸處造上供物追集百姓工匠有妨農業並令權罷如係供軍切要者候次年奏議閠月癸卯知樞密院事馬知節罷為彰德軍節度觀察使考異史作留後今從宰輔編年録戊申奬州團練使李溥坐貪猥責為忠正節度副使初黃震發溥姦贓遣御史鞫治得溥私役兵健為姻家吏部侍郎林特起宅又附官船販鬻材木規取利息凡十數事未論次會赦有司以特故不窮治大理寺詳斷官考城劉隨請再劾之卒扺溥罪隨嘗為永康軍判官軍無城堞伐木為柵壞輒易之頗困民力隨令環植栁數十萬株使相聨屬以為限界民得不擾屬縣令受贓鬻獄隨劾之益州李士衡因為令請隨不從士衡怒奏隨苛刻罷歸初西南夷市馬入官苦吏誅求隨為繩按之既罷夷人數百訴于轉運使曰吾父何在事聞乃得調皇城司言拱聖營西南真武祠泉涌祠側汲之不竭疫癘者飲之多愈甲寅詔即其地建祥源觀十女徒跣奔走瞻拜判度支勾院河南任布言明朝不冝以神怪衒愚俗不報五月甲子太尉尚書令兼中書令徐王元偓薨帝臨奠慟哭贈太師尚書令追封鄧王諡曰恭懿丁卯命宰臣王欽若管勾修祥源觀事右正言劉燁言前世傳聖水者皆詭妄不經今盛夏亢陽不冝興土木以營不急疏入不報丙戌河陽三城節度使張旻言近聞西京訛言有物如帽蓋夜飛入人家又變為大狼狀微能傷人民頗驚恐每夕皆重閉深處至持兵器捕逐詔設祭醮禳禱契丹以張儉守司徒兼政事令考異通鑑續編云以儉為政事令今從遼史儉端慤不事外飾初為雲州幕官故事車駕經行長吏當有所獻契丹主獵雲中節度使進曰臣境無他産惟幕僚張儉一代之寶願以為獻先是契丹主夢四人侍側賜食人二口及聞儉名始悟因召見容止朴野訪及世務因奏二十餘事皆合旨由是眷注日隆竟至宰相六月乙未以曹利用知樞密院事乙巳京師民訛言帽妖至自西京民聚族環坐達旦呌譟軍營中尤甚帝慮因緣為姦詔立賞格募人告為妖者既而得僧天賞術士耿概張岡等鞫之並坐為邪法棄市其連坐配流者數人然訛言實無其狀時自京師以南皆重閉深處知應天府王曽今夜開里門敢倡言者即捕之妖卒不興辛亥有彗出北斗凡三十七日沒秋七月壬申以星變赦天下流以下罪死罪減一等詔自今鎖廳應舉人所在長吏先考藝業合格即聽取解如至禮部不及格當停見任其前後考試官舉送長吏並重置其罪甲戌以刑部侍郎知青州李士衡為三司使帝作寬財利論賜士衡士衡請刻聖製于本廳從之士衡方進用王欽若害之會帝論時文之弊欽若因言路振文人也然不識體帝曰何也曰士衡父誅死而振為贈告乃曰世有顯人帝頷之士衡以故不大用八月丁酉羣臣上表請立皇太子不允表三上許之考異按宋史真宗本紀作庚寅日羣臣請立皇太子從之今從長編作丁酉先是知梧州陳執中上復古要道三篇帝異而召之帝時已屬疾春秋髙大臣莫敢言建儲者執中既至進演要三篇以早定天下根本為説翌日帝以他疏示輔臣皆贊曰善帝指其袖中曰更有善於此者出之即演要也因召對便殿勞問久之尋擢為右正言執中恕之子也考異實録載執中得見于崇政殿其日甲寅在立太子後凡十日據本傳則執中既見逾月乃立太子不知孰是以事理推之本傳當得其實蓋羣臣因執中言始有建儲議見于崇政恐非初對也今從本傳執中附傳與正傳載所上演要亦小不同今從正傳考據必詳審耳癸卯詔前嵗上聖號册寶所賜酺今秋豐稔可追行之甲辰立升王受益為皇太子改名禎大赦天下宗室並加恩文武常參官子為父後見任官者賜勳一轉乙巳以翰林學士朝逈為册立皇太子禮儀使命祕書監楊億撰皇太子册文知制誥盛度書册陳堯咨書寶丁未以參知政事李迪兼太子賓客帝初欲授迪太子太傅迪辭以太宗時未嘗立保傅乃止兼賔客而詔皇太子禮賔客如師傅有殿侍張迪者春坊祇候太子不欲其名與賔客同改名克一迪奏其事帝喜以告輔臣詔中書門下五品尚書省御史臺四品諸司三品見皇太子並答拜自餘受拜壬子彭王元儼進封通王癸丑帝作元良針賜皇太子又作詩分賜賔客而下徐國長公主進封福國邠國長公主進封建國宿國長公主進封鄂國丁巳詔皇太子月給錢二千貫禮儀院言至道中敕百官於皇太子稱名宫僚稱臣續準敕依皇太子所請宫僚止稱名詔如至道之制九月丁卯御天安殿册皇太子三司假內藏銀十萬兩庚辰御正陽門考異宋史作乾元門觀酺凡五日帝作稼穡倍登詩欹器戒酒二論示輔臣祥源觀成觀宇凡六百一十三區冬十月乙未雪帝作瑞雪詩賜輔臣癸丑左諫議大夫孫奭言茶法屢改非示信之道望遣官重定經久之制即詔奭與三司詳定務從寬簡未幾奭出知河陽事遂止奭初自密州代還時方置天慶等節天下設齋醮張燕費甚廣奭請裁省浮用不報丙辰契丹命蕭巴雅爾等伐高麗十一月己未以翰林學士朝逈為承旨時朝廷數舉大禮詔令多出逈手嘗夜召對帝令內侍持御前巨燭送歸院乙亥起居舍人吕夷簡言澶魏豐熟望出內藏錢二十萬貫市芻糧從之十二月契丹蕭巴雅爾等與高麗戰于茶陀二河契丹師敗績參知政事張知白與宰相王欽若論議多相失因稱疾辭位丙午罷為刑部侍郎翰林侍讀學士知天雄軍帝賦詩餞之三年春正月壬戌契丹封沙州節度使曹順為燉煌郡王曹順即曹賢順也丁卯翰林學士錢惟演等四人權同知貢舉乙亥諸路貢舉人郭􅍬等四千三百人見于崇政殿時􅍬冒緦喪赴舉為同輩所訟殿三舉同保人並贖金殿一舉時有司欲脫宋城王洙問洙曰果保􅍬否不然可易也洙曰保之不願易也遂與􅍬俱罷考異王洙本傳云􅍬冒祖母禫墓銘作母禫今從實録吕中曰太祖之世進士不過三十人諸科五十人太宗在位二紀登科近百人真宗時一嵗至有千八百餘人當世道寬平之時法令簡約上之人雖不多為之塗以開其紛爭之習亦不狹為之塗以抑其好進之心是以考察之法雖不求詳而自不容於略也收取之門雖不求寬而自不容於狹也自糊名之法始于景德謄録之法始於祥符同保連坐之法嚴于天禧法令雖密所取非人望矣然猶未至盡委之法賈邉之背經旨以立異黜之李迪之偶失韻以越格收之朝廷議論質實如此故王洙寧受同保連坐之罪而不辭則人心風俗其淳厚尢可想也京西轉運使胡則言滑州進士楊世質等訴本州黜落即取元試卷付許州通判鄢陵崔立看詳立以為世質等所試不至紕繆已牒滑州依例解發詔轉運司具析不先奏裁直令解發緣由以聞其試卷仰本州繳進世質等仍未得解發及取到試卷貢院言不合充薦詔落世質等而劾轉運使及崔立罪立初為果州團練推官役兵輦官物他州道險乃率衆錢傭舟載歸知州薑從革論如率斂法三人當斬立曰此非私己罪止杖耳從革初不聽論奏詔如立議帝記其名代還特轉大理寺丞知安豐縣立性淳謹尤喜論事大中祥符間天子既封禪士大夫爭奏符瑞獻贊頌立獨言水發徐兖旱連江淮無為烈風金陵大火是天所以戒驕矜而中外多上雲露草木禽蟲諸物之瑞此何足為治道言哉願敕有司草木之異雖大不録水旱之變雖小必聞前後凡上四十餘事云考異按崔立此疏他史或載入丁謂上封禪祥瑞圖後亦因事而附見之耳其月日要不可考今從長編附載于此蓋緣看詳試卷一節彚立事而類書之通以列傳之體也不然則其為果州團練推官事又安從書乎編年紀事之法必以李氏長編為正是月三司言使臣傳宣取物承前止是口傳詔旨别無慿由致因緣盜取錢物今請下入內內侍省置傳宣合同司專差內臣一員主之以絶斯弊從之二月壬寅知越州高紳請嚴禁僧尼受父母禮拜詔從之違者重決罰丁未出皇太子所書御詩賜宰相帝作學書歌賜皇太子丙辰又作勸學吟賜之契丹以王繼忠為南院樞密使三月戊午朔日有食之乙丑三司假內藏庫銀一十三萬丙寅親試禮部奏名貢舉人得進士王整以下六十三人賜及第八十六人同出身又賜學究諸科各及第出身有差癸未入內副都知周懷政日侍內廷權任尤盛附會者頗衆中外帑庫皆得專取因多入其家性識凡近酷信妖妄有朱能者本單州團練使田敏家厮養性凶狡遂賂懷政親信得見妄談神怪事以訹之懷政大惑援引能至御藥使領階州刺史俄於終南山修道觀與殿直劉益輩造符命託神言國家休咎或臧否大臣時冦凖鎮永興能為巡檢倚凖舊望欲實其事凖性好勝喜其附己多依違是月凖奏天書降乾祐山中蓋能所為也中外咸識其詐帝獨不疑考異劉攽作冦凖傳云朱能獻天書上以問王旦旦曰始不信天書者冦凖也今天書降凖所當令凖上之則百姓將大服乃使周懷政諭凖凖始不肯而凖壻王曙居中與懷政善曙固要凖凖乃從之按王旦卒于天禧元年正月而凖上天書乃三年三月攽誤甚矣或欽若實為此非王旦也夏四月辛卯備儀仗至瓊林苑迎𨗳天書入內太子右諭德魯宗道上疏略曰天道福善禍淫不言示化人君政得其理則作福以報之失其道則出異以戒之又何書哉臣恐姦臣肆其誕妄以惑聖聽也知河陽孫奭上疏言朱能者姦憸小人妄言祥瑞而陛下崇信之屈至尊以迎拜歸祕殿以奉安上自朝廷下及閭巷靡不痛心疾首反脣腹非又曰天且無言安得有書天下皆知能所為獨陛下一人不知耳乞斬能以謝天下帝雖不聽然亦不罪奭也考異李燾曰奭本傳載天且無言安得有書之對在祥符初恐誤也移見祀汾陰前又見于此朱能所獻天書其迎奉之禮蓋不減祥符而國史寶録諱之遂不復詳且失其時日按稽古録于是年三月載冦凖奏天書降乾祐山中今用此為據繫之三月末魯宗道孫奭諫疏亦不得其時因此附見國老間談以宗道所諌為指祥符則誤也今追正之記聞載奭諫語比之正傳尤切直恐奭不但一疏今並載之可見先朝容直臣也按李維集有賀天書降兩表其一云四月四日迎奉入內其二云八月二十四日迎奉入內今並用此月日載之長編吕中曰至是李文靖之言驗矣封禪之議決于丁謂大計有餘之一言天書之降成于欽若神道設教之一語雖以王文正之碩德重望不敢有異議其後冦凖之復相亦以朱能之天書而入當時極言其非者惟孫奭一人而已天何言哉此真足以破人主之惑河東轉運使李放貢錢三十萬貫糧百二十萬石詔奬之己亥召山南東道節度使同平章事判永興軍府冦凖赴闕吕中曰冦忠愍之入相凡三忘身徇國守道嫉邪見於同列之稱薦者然也官居鼎鼐宅無樓臺播于處士之歌詠者然也堂吏之進例簿則叱之門生之獻三䇿則謝之甚至澶淵之役不沮不屈親扶日轂屹然如山百萬貔貅折箠笞之使三十餘年邊無牧馬公之勳烈何如哉壬寅召近臣詣真遊殿朝拜天書五月乙丑左諫議大夫知鄆州戚綸責授嶽州團練副使以提點刑獄官李仲容奏綸有訕上語故也綸篤于古學善談名理喜言民政頗近迂濶事兄維友愛甚厚與交遊故舊以信義著稱士子謁見者必詢其所業訪其志尚隨才誘掖之嘗云歸老後得十年在鄉閭講習亦可以恢道濟世大中祥符中恩寵甚盛樂于薦士每一奏十數人皆當時知名者晚節為權幸所排遂不復振乙亥以右正言劉燁判三司户部勾院蓋執政者不欲其專任言責故兼他職辛巳監察御史劉平為鹽鐵判官章頻為度支判官御史于是復兼省職考異劉平傳云平為御史數上疏論事為丁謂所忌久之除鹽鐵判官按此年六月戊戌謂方參政恐誤也元年二月丁丑詔别置諌官御史六員不兼他職今燁與平頻皆兼省職非當日詔意也甲申冦凖自永興來朝凖將發其門生有勸凖者曰公若至河陽稱疾堅求外補此為上䇿儻入見即發乾祐天書之詐尚可全平生正直之名斯為次也最下則再入中書耳凖不懌揖而起卒及于禍六月戊子保信軍節度使丁謂自江寧來朝召之也先是江淮發運使賈宗言諸路嵗漕自真揚入淮汴歷堰者五糧載剝卸民罷牽挽艦舟由此速壞今議開揚州古河繚城南接運渠毁龍舟新興茱萸三堰通漕路以均水勢嵗省官費十萬功利甚厚詔按視以為當然于是殺成水注新河與三堰平漕船無阻公私大稱其便賜詔奬之甲午左僕射平章事王欽若罷為太子太保時欽若恩遇浸衰人有言其受金者欽若於帝前自辨乞下御史臺覆實帝不悅曰國家置御史臺固欲為人辨虛實耶欽若惶恐因求出藩會商州捕得道士譙文易畜禁書能以術使六丁六甲神自言嘗出入欽若家得欽若所遺詩及書帝以問欽若欽若謝不省遂罷相制辭以均勞之意從優禮云尋命判杭州考異判杭州實録無其日于可太子太保歸班下即云尋命判杭州今仍之受金覆實據記聞載蘇頌子容語此必不妄丁酉以李允則為客省使知鎮州兼鎮定鈐轄允則在雄州十四年考異自景德三年四月為安撫副使九月乃知雄州至今凡十四年也二年正月嘗知雄州二月即改命何承矩而徙允則知瀛州司馬光記聞云允則在雄州十八年蓋誤也河北既罷兵允則治城壘不輟契丹疑違誓約既而有以為言詔詰之允則奏言初通好不即完治他日復安敢動乎帝以為然城北舊有甕城允則欲合大城為一先建東嶽祠出黃金百兩為供器導以鼓吹居人爭獻金銀久之密自撤去聲言盜自北至遂下令捕盜三移文北界乃興板築揚言以護祠而卒就關城浚壕起月堤自此甕城之人悉內城中始州民多以草覆屋允則取材木西山大為倉廩營舍教民陶瓦甓標里閈置廊市邸舍水磑城上悉纍甓下環以溝塹蒔麻植榆栁廣閻承翰所修屯田架橋引水作石梁築構亭榭列堤道以通安肅廣信順安軍嵗修禊事召界河戰棹為競渡縱北人遊觀潛寓水戰州北舊設陷馬坑城上起樓為斥堠望十里自罷兵人莫敢登允則曰南北既講和矣安用此為命撤樓夷坑為諸軍蔬圃浚井疏洫列畦壟築短垣縱橫其中植以荆棘而其地益險阻因治坊巷徙浮圖北垣上州民旦夕登望三十里下令安撫司所治境有隙地悉種榆久之榆滿塞下上元舊不然燈允則結綵山聚優樂使夜縱遊明日偵知北酋欲間入城觀之允則與同僚伺郊外果有紫衣人至遂與俱入傳舍不交一言出奴女羅侍左右劇飲而罷且置其所乘驢廡下使遁去即幽州統軍也後數日為契丹所誅嘗燕軍中而甲仗庫火允則作樂行酒不輟副使請救不答少頃火熄命悉瘞所焚物密遣使持檄瀛州以茗籠運器甲不浹旬兵數己完人無知者樞密院請劾不救火狀帝曰允則必有謂姑詰之對曰兵械所藏警火甚嚴方宴而燔必姦人所為舍宴救焚事或不測一日民有訴為強人毆傷而遁者允則不治與傷者錢二千衆以為怯逾月幽州以其事來詰答以無有蓋他諜欲以毆人為質驗比得報以為妄乃殺諜雲翼卒亡入北界允則移文督還契丹報以不知所在允則曰在某所契丹駭不敢隱即歸卒乃斬以徇後無敢亡者允則不事威儀間或步出遇民可與語者延坐與語以是洞知人情訟至無大小面訊立斷善撫士卒皆得其用盜發輒獲人亦莫知其由身無兼衣食無重羞不蓄資貨當時邉臣鮮能及之者戊戌以冦凖為中書侍郎兼吏部尚書平章事保信軍節度使丁謂為吏部尚書參知政事故事節度使除拜當降麻翰林學士盛度以為參知政事當屬外制遂命知制誥宋綬草辭謂甚恨焉謂在中書凖謹甚嘗會食羮汚凖鬚謂起徐拂之凖笑曰參政國之大臣乃為官長拂鬚耶謂甚愧之由是傾構始萌矣吕中曰王欽若罷則冦凖用此君子小人不可兩立也以冦凖為相而丁謂參政此又君子小人不可共政也然凖當是時不可出矣方其始召門生三䇿為凖謀甚善而凖不之悟甘蹈下䇿何耶龜鑑曰朋黨之禍其萌于丁冦並命之時乎薰蕕不可同器鸞隼不可並棲從古然也何當時之不察及此會食都堂拂鬚有責初無他意丁謂不堪而銜之結釁其兆于此矣澶淵之還大勳未報欽若念釁鼓之隙而忍肆投瓊之譛利用懷議事之憤而公為下石之謀錢惟演馮拯之徒翕于前劉承珏陳彭年之流推于後彼譖人者投畀豺虎可也營營青蠅止于樊豈弟君子何為一信讒言哉一出而守北門之鑰再出而涉雷陽之波公之迹危矣噫公之忠節義概能折百萬之兵而不能折衆口之讒能起外人之問而不能起邪人之敬能感雷陽之竹而不能感當時流俗之心然于真宗則何憾焉嘗因是而窺帝之本心史述澶淵歸上所待凖者甚厚曰甚厚云者蓋未嘗以薄待凖也史謂上既從惟演言擢丁謂利用平章事而所以待凖者如故曰如故者是待凖之心無以異于前日也有以深責冦凖為言者上則曰自太傅以上更加優禮有以且令凖出外為請者上則曰有何名目至于末年國史直筆以書之曰冦凖罷相繼以三黜皆非上本意嵗餘上忽問曰吾目中久不見冦凖何也吁真宗之心于是乎白矣巧言如簧熒惑聖聽謂之罪其可勝誅壯哉李迪奮身而憤曰迪起布衣而位宰相有以報國死且不恨安能附權臣為自安計直對上前歷數謂姦謂于是罷知河南有言自裏厥應如響不踰月而復相焉他時流落至死王曽聞之曰此人智數不可測若不死未必不復用天下之不幸可勝道哉死一謂則為天下福生一謂則為天下禍姦人可畏如是可不謹哉滑州決河泛澶濮鄆齊徐境遣使救被溺者恤其家丁未以吏部侍郎林特為尚書左丞玉清昭應宫副使特性邪險善附會故丁謂始終善特亟引用之秋七月辛酉知河南府馮拯言父老僧道舉人等列狀願赴闕請車駕封中嶽帝曰茲事體大未可輕議令拯慰遣之三司假內藏錢五十萬貫絹十萬匹學士院言凖詔大理評事胥偃與試偃乃盛度壻又錢惟演親戚欲乞下别處詔送舍人院試自是有親嫌者並如例戊辰詔以十一月十九日有事于南郊殿前都指揮使忠武節度使曹璨卒車駕即臨奠之贈中書令諡武懿録其子儀及二姪外孫官璨起貴胄以孝謹稱習知韜略雖無攻戰之效然纍歷邉任領禁衛十餘年善撫士卒忠厚謙靜未嘗有過晚節頗傷吝嗇物議少之璨母嘗閲其家帑見積錢數萬召璨謂曰汝父履歷中外未嘗有此積也可知不及汝父逺矣三司假內藏錢帛二百四十五萬己卯羣臣表上尊號曰體元御極感天尊道應真寶運文德武功上聖欽明仁孝皇帝不允凡五上從之庚辰屯田員外郎鍾離瑾言切見諸州長吏才境內雨足苖長即奏豐稔其後霜旱蝗螟災沴皆隱而不言上罔朝廷下抑氓俗請自今諸州有災傷處即時騰奏命官檢視如所部豐登亦須俟夏秋成日乃奏如奏後災傷者聽别上言隱而不言則論其罪從之八月丁亥以天書再降于乾祐縣大赦天下制曰朕寅奉丕基撫寧中宇慶靈積厚髙明博臨受河洛之圖書開聖真之鴻緒陳嘉牲于崇巘沈瑄玉於隆脽順拜文罽之壇恭薦鏤瓊之版儲精淵妙敷化醇醲矧惟咸鎬之區是為神明之奧名山之內福地在焉載嚴曲密之都式佇鴻濛之駕清心昭格璿極覽觀由兹鶉首之封薦錫龍綈之檢諭朕以輔德朂朕以愛民告臨降之先期述延洪之景祐介子孫於千億保宗社於大寧而又乃顧皇儲繼頒寶命昭其仁孝之志示以報應之祥齋莊載披惕厲彌至考諸册牒允謂殊尤昔燧皇掘機但有蒼渠之刻虞舜負扆止觀河渚之文豈若祚我菲躬慶及元嗣膺兹繁祉寶冠皇圖思與萬邦共均純嘏仰答髙旻之貺用推肆眚之恩考異李燾曰郊恩密邇忽降大赦蓋以乾祐天書再降故也及周懷政朱能等敗史官諱之遂改易制辭自恭薦鏤瓊之版以下但云逮兹二紀馴致小康邦本既寧天休允集顧惟陰隲奚獨在豫思與萬邦共膺純嘏遂大赦天下臣燾初讀實録國史固疑此赦之必有所為也檢會要云以天書而赦殊不及之因令于諸州所編録建隆以來赦文尋出全本則其辭蓋昭然且朱能等偽造天書實録正史皆略之惟此制辭差詳恐其忘逸今特著于此原史官所以深諱者為過舉也過而能改善莫大焉此尤可見真宗之盛德矣若乃抹殺其事竄改其辭使後人漫不可曉既失史官之職又沒帝王改過之善臣燾之所不敢從也今會要乃三朝會要今五朝會要已改云以天下小康故降赦蓋從史也孫奭等諌疏或在此赦後然三月末已載之不復遷改且天書實再降則奭等于初降即上諫疏亦不可知爾臣某曰為尊親諱春秋之遺意然事不可沒法亦所當昭也以天書再降而赦因朱能等敗而遽改其文并沒其事亦失史官之職矣臣按李燾考異方知長編紀事之善他詔書緣文繁帙廣不能盡載此詔同異不可不備列以示來兹制曰朕寅奉丕基撫寧中宇慶靈積厚髙明博臨受河洛之圖書間聖真之鴻緒陳嘉牲于崇巘沈瑄玉于隆脽順拜文罽之壇恭薦鏤瓊之版儲精淵妙敷化醇醲矧惟咸鎬之區是為神明之奧名山之內福地在焉載嚴曲密之都式佇鴻濛之駕清心昭格璿極覽觀由兹鶉首之封薦錫龍綈之檢諭朕以輔德朂朕以愛民告臨降之先期述延洪之景祜介子孫于千億保宗社于大寧而又乃顧皇儲繼頒寶命昭其仁孝之志示以報應之祥齋莊載披惕厲彌至考諸册牒允謂殊尤昔燧皇掘機但有蒼渠之刻虞舜負扆止觀河渚之文豈若祚我菲躬慶及元嗣膺兹繁祚寶冠皇圖思與萬邦共均純嘏仰答高旻之貺用推肆眚之恩此原詔文考異所謂今諸州縞録建隆以來赦文尋出全本者也自恭薦鏤瓊之版下削去儲精淵妙至末三十八句但接云逮兹二紀馴致小康邦本既寧天休允集顧惟陰隲奚獨在豫思與萬邦共膺純嘏此考異所謂周懷政朱能等敗史官諱之遂改易制詞者也今兩載其詔一則不敢沒前人作史之苦心二則使後世讀書尚論之士得其實迹有所折衷見立法垂戒固不可過諱以無徵立説著書尤不可鹵莽而塞責也滑州龍見河決彰德軍留後馬知節以疾留京師踰年表求外任命知貝州兼部署將行請對帝閔其羸令歸本鎮上黨大名之民爭來迎謁疾浸劇俄求還京師卒遺命諸子令辭詔葬帝深軫悼之贈侍中諡正惠官其子孫四人知節習兵事以方略自任頗涉文藝每應詔亦為詩詠所與遊接必一時名士為治専務抑豪強恤孤弱性剛直敢言無避未嘗少自卑屈求之武人蓋鮮儷云辛卯太白晝見大會道釋于天安殿建道場凡萬三千餘人己亥帝親臨視以藥銀鑄大錢面賜之戊申自瓊林苑迎奉天書入內庚戌遣使安撫水災州軍有合寬恤改更事件與轉運使副所在長吏會議施行九月庚申賜大理寺丞王質進士及第質旦之猶子獻文召試故也詔自今應犯贓注廣南川陜幕職州縣官委逐路轉運使常加紏察再犯贓罪者永不録用時司勳員外郎梁象言川陜幕職州縣官曽坐贓左降者多復恣貪逾擾逺民請自今犯贓者不注川陜官並除廣南逺惡州軍帝以廣南亦吾民也且非自新之道故特有是詔辛巳參知政事李迪言皇太子舉動由禮言不輕發視伶官雜劇未嘗妄笑左右瞻仰無不恭肅帝曰常日居內庭亦未嘗妄言也冦凖曰皇太子天賦仁德嚴重溫裕復稟聖訓勤道力學實邦家之慶也冬十月己酉知審刑院盛度言在京及諸路止有斷按三道值降聖節不奏自餘絶無刑牘請宣付史館冦凖曰漢文帝唐明皇時皆幾乎刑措蓋當時諸侯專殺有聞於朝廷者有便冝而行者今幅員萬里徒流以上合聞逹者皆奏牘以此較之則聖朝刑訟清簡過古昔逺矣此陛下以德化民精意欽恤所致臣等不勝大慶再拜稱賀詔奬度等十一月辛酉閣門太常禮院上大禮稱慶合班圖皇太子序位在宰相上太子懇讓帝以諭輔臣冦凖等面陳儲副之重不可讓抑望遵儀制凡再請乃許詔自今給事中諌議大夫中書舍人母妻並封郡君初止封縣樞密直學士給事中王曙冦凖女壻也因改舊制議者非凖專私而不忌云己巳謁景靈宫是日月重輪庚午饗太廟辛未合祭天地于南郊大赦天下甲戌皇太子言於玉清昭應宫建殿置經藏以資聖算功畢有詔褒答賜殿名曰長生崇夀丁丑謁玉清昭應宫還御天安殿受册尊號十二月丙戌富州蠻首向光澤表納疆土帝曰朝廷得之安用當是其親族不相容耳命轉運司察之果然癸巳以任中正周起並為樞密副使辛亥高麗王詢遣使乞貢方物于契丹契丹主許之是月河中府處士李瀆陜州處士魏野皆卒詔各贈祕書省著作郎賜其家禾帛州縣常加存恤二稅外蠲其差役野善王旦寇凖每贈詩必勸以早退旦凖皆不能用識者髙之是嵗天下户八百五十四萬五千有奇口一千九百四十七萬有奇資治通鑑後編卷三十三
