body:
  text: 資治通鑑後編卷一百二十九刑部尚書徐乾學撰宋紀一百二十九起昭陽赤奮若正月盡閼逄攝提格十二月凡二年光宗循道憲仁明功茂德溫文順武聖哲慈孝皇帝紹熙四年春正月己巳朔帝朝重華宫癸未金尚書省奏大興府推官蘇德秀為禮部主事金主曰朕嘗語卿百官當使久於其職彼方任理官復改户曹尋又除禮部人才豈能兼之若久於其職但中材勝於新人事既經練亦必有濟後不可輕易改除辛卯蠲臨安民身丁錢三年金賑河北諸路被水災者丙申金東京路副使王勝進鷹金主遣諭之曰汝職非輕民間利害官吏邪正略不具聞而乃以鷹進此豈汝所職耶後毋復爾二月戊戌朔詔內侍陳源特與在京宫觀甲戌皇孫生丙寅出米七萬石賑江陵飢民庚午金主將如景明宫御史中丞董師中侍御史賈鉉等上疏曰西北二京臨潢諸路比嵗不登加以民有養馬簽軍挑壕之役財力大困流移未復米價甚貴若扈從至彼又必增價商販或不時至則飢餓之徒將復有如曩嵗殺太尉馬毁太府瓜果出忿怨言起而為亂者矣况南北兩屬部數十年捍邊者今為必里克巴鄂誘脅傾族隨去邊境蕩搖如此可虞若忽而不戒豈聖人萬舉萬全之道哉左補闕許安仁右拾遺路鐸亦皆上疏論諫金主召師中等賜對即從其奏仍遣諭輔臣曰朕欲巡幸山後無他不禁暑熱故也今臺諫官咸言民間缺食處甚多朕初不盡知既已知之暑雖可畏其忍私奉而重民之困哉遂罷行三月丙子帝朝重華宫皇后從辛巳以葛邲為右丞相陳騤參知政事胡晉臣知樞密院事吏部尚書趙汝愚同知院事御史汪義端與汝愚有隙上言高宗聖訓不用宗室為宰執汝愚楚王元佐七世孫不宜用之汝愚亦力辭不許命當制學士申諭上意而黜義端汝愚乃拜命癸巳帝從夀皇聖帝夀成皇后如聚景園甲午金敕自今御史臺奏事修起居注並令回避金胥持國初以經童入仕為太子祇應司令金主在東宫識之及即位遂大用厯工部尚書除參知政事持國為人柔佞有智術時李妃得幸持國知金主好色陰以祕術干之又多遺賂左右妃亦自嫌門地寒薄藉外廷為重乃數稱譽持國由是金主信任之與妃表裏擅政躁進者爭趨其門四方為之語曰經童作相監婢為妃夏四月金百官三表請上尊號金主曰祖宗古先有受尊號者蓋有其德故有其名比年五穀不登百姓流離正當戒懼修身之日豈得虛受榮名耶不許仍斷來章其後親王大臣六學諸生屢請上尊號竟不許丁巳金敕女真進士及第後仍試以騎射中選者升擢之五月己巳賜禮部進士陳亮以下三百九十六人及第出身制策問禮樂刑政之要亮以君道師道對且曰臣竊歎陛下於夀皇蒞政二十八年間寧有一政一事之不在聖懷而問安視寢之餘所以察辭而觀色因此而得彼者其端甚衆亦既得其機要而見諸施行矣豈徒一月四朝為京邑之美觀也哉時帝不朝重華宫羣臣更進迭諌皆不聽得亮策以為善處父子之間親擢第一既知為亮乃大喜賜告詞曰爾蚤以藝文首賢能之書旋以論奏動慈宸之聽今閲大對嘉其淵源擢置舉首殆天留以遺朕也是榜又得喬行簡授亮簽書建康府判官㕔公事未至官卒朝廷惜其不獲大用官其一子亮志存經濟人人見其肺肝雖為布衣時薦士唯恐弗及從亮游者甚衆其篤於事師者則有喻侃喻南强當乾道淳熙間朱熹吕祖謙陸九淵張栻皆談性命而闢功利學者各騖其師說截然不可犯亮倔起其中獨以為不然且謂性命之微子貢不得而聞吾夫子之所罕言後生小子與談之不置其皆可與語上者哉禹無功何以成六府乾無利無以具四德如之何其可廢也于是推尋孔孟之志六經之㫖諸子百家分析聚散之故然後知聖賢經理世務與三才並立而不廢者皆明白簡易人多疑其說而未信侃獨出為諸生倡扶持而左右之已而亮不為世俗所容當路必欲擠之死地凡再下詔獄侃與同志之士極力營解幾陷羅織人皆義之南强侃之從弟初當路欲排善類指亮為根煅煉刺骨罪且不測門人畏其威焰不敢出一語南强義形辭色貽書誚責同門謂陳先生無辜受罪將齎恨入土吾曹為弟子當怒髮衝冠乃影響昧昧是得為人類耶復走東甌見葉適備陳寃狀適曰子真義士也即秉燭為作書數通南强持謁諸臺官訟言無忌竟直亮之寃史臣曰自道廢民散弟子之義缺平居則謬為恭敬一逢患難反目若不相識甚者至欲更名辟去雖以唐房杜之徒因其師王通與長孫無忌有隙遂不一言及通至使後人謂通中說借唐初名臣以自重嗚呼通何人哉何有於房杜諸人也向使侃與南强見之必將唾叱之矣傳曰民生於三事之如一唯其所在則致死焉其侃與南强之謂乎丙子淮西大水辛巳金主諭諸路令月具雨澤田禾分數以聞丙戌紹興大水召浙東副總管姜特立還壬辰太尉利州安撫使吳挺卒挺少起勳閥弗居其貴雖遇小官賤吏不敢怠忽拊循將士人人有恩璘故部曲拜於庭下輒降答之即失律誅治無少貸留正引唐憲宗召吐突承璀事乞罷召姜特立不報六月丙申朔正出城待罪六和塔上疏切諌戊戌祕書省著作郎沈有開著作佐郎李唐卿祕書郎范黼彭龜年校書郎王奭正字蔡幼學顔棫吳獵項安世上疏乞寢特立召命皆不報正因繳進前後錫賚及告敕乞歸田里亦不許賑江浙兩淮荆湖被水貧民戊申簽書樞密院事胡晉臣卒諡文靖帝自有疾不視朝晉臣與留正同心輔政中外帖然其所奏陳以溫清定省為先次及親君子逺小人抑僥幸消朋黨啓沃剴切彌縫縝密人無知者甲子雨雹秋七月乙丑太白晝見丙寅大雨雹己巳留正復論姜特立繳納出身以來文字待罪于范村帝不復召正而特立亦不至壬午以趙汝愚知樞密院事吏部尚書余端禮同知院事時知中江縣游仲鴻赴召至汝愚以仲鴻直諒多聞訪以蜀中利病汝愚欲親出經略西事仲鴻曰宥密之地斡旋者易公獨不聞吕申公經略西事當在朝廷之語乎汝愚悟而止以永州防禦使陳源為入內內侍省押班中書舍人陳傅良不草詞八月丙申蠲紹興丁鹽茶租錢八萬二千緡庚子金大赦丁未金主釋奠孔子廟北向再拜戊午賑江東浙西淮西旱傷貧民九月庚午重明節百官上夀請帝朝重華宫不聽己卯上夀聖皇太后尊號曰夀聖隆慈備福皇太后中書舍人陳傅良上疏曰陛下之不過重華宫者特誤有所疑而積憂成疾以至此爾臣嘗即陛下之心反覆論之竊自謂深切陛下亦既許之矣未幾中變以誤為實而開無端之釁以疑為真而成不療之疾是陛下自貽禍也給事中謝深甫言父子至親天理昭然太上之愛陛下亦猶陛下之愛嘉王太上春秋高千秋萬嵗後陛下何以見天下帝感悟甲申命駕往朝百官班立以俟帝出至御屏李后挽留曰天寒官家且飲酒百僚侍衛相顧莫敢言傅良趨進引帝裾請毋入因至屏後后叱曰此何地秀才欲斫頭耶傅良痛哭于庭后使人問曰此何理也傅良曰子諫父不聽則號泣而隨之后益怒遂傳㫖罷還內傅良下殿徑行詔改祕閣修撰不受戊子著作郎沈有開祕書郎彭龜年禮部侍郎倪思國子録王介等皆上疏請朝不從㑹上召嘉王倪思言夀皇欲見陛下亦猶陛下之於嘉王也帝為動容時李后寖預政思進講姜氏㑹齊侯于濼因奏人主治國必自齊家始家之不能齊者不能防其漸也始於褻狎終於恣橫卒至於陰陽易位內外無别甚則離間父子漢之吕氏唐之武韋幾至亂亡不但魯莊公也帝悚然趙汝愚同侍經筵退語人曰讜直如此吾黨不逮也帝怒出思知紹興府癸未夏國主仁孝卒年七十僞諡聖德皇帝廟號仁宗陵號夀陵仁孝始建學校立小學于禁中親為訓導尊孔子為文宣帝然權臣擅國兵政衰弱子純佑立改元天慶冬十月己酉朝獻于景靈宫夜地震庚戌朝獻于景靈宫夜地又震壬子祕書省官請朝重華宫疏三上不報甲寅雨土工部尚書趙彥逾等上書重華宫乞㑹慶節勿降㫖免朝夀皇曰朕自秋涼以來思與皇帝相見卿等奏疏已令進御前矣明日㑹慶節帝以疾不果朝葛邲率百官賀于重華宫侍從上章居家待罪詔不許嘉王府翊善黃裳力勸帝朝重華帝曰內侍楊舜卿告朕勿往裳即上疏請誅舜卿臺諫張叔椿章穎上疏乞罷黜太學生汪安仁等二百十八人上書請朝重華皆不報起居舍人彭龜年奏言臣所居之官以記注人君言動為職車駕不過宫問安如此書者殆數十矣恐非所以示後又言陛下誤以臣充嘉王府講讀官正欲臣等教以君臣父子之道臣聞有身教有言教陛下以身教臣以言教者也言豈若身之切哉不報庚申帝將朝重華宫復以疾不果丞相以下上疏自劾請罷政不報考異宋史光宗紀云是日彭龜年請逐陳源以謝天下按龜年傳云光宗嘗親郊值暴風兩感疾大臣希得進見久之疾平猶疑畏不朝重華宫龜年以書譙趙汝愚且上疏請首逐陳源居亡何光宗朝重華都人歡悅尋除起居舍人此蓋紹熙三年十一月事也紀繫是年十月庚申誤今據龜年傳正之黃裳嘗病疽及是憂憤創復作乃上疏曰陛下之於夀皇未盡孝敬之道者必有所疑也臣竊推致疑之因陛下無乃以焚廩浚井之事為憂乎夫焚廩浚井在當時或有之夀皇之子唯陛下一人陛下違豫夀皇焚香祝天為陛下祈禱愛子如此則焚廩浚井之事臣有以知其必無也陛下何疑焉又無乃以肅宗之事為憂乎肅宗即位靈武非明皇意故不能無疑夀皇當未倦勤親挈神器授之陛下揖遜之風同符堯舜與明皇之事不可同日而語矣陛下何疑焉又無乃以衛輒之事為憂乎輒與蒯瞶父子爭國夀皇老且病乃頥神北宫以保康寧非有爭心也陛下何疑焉又無乃以孟子責善為疑乎父子責善本生於愛惟知者能知此理則何至於相夷夀皇願陛下為聖帝責善之心出於仁愛非賊恩也陛下何疑焉乃若可疑則有之貴為天子不以孝聞敵國將肆輕侮此可疑也而陛下不疑小人將起為亂此可疑也而陛下不疑中外官軍豈無他志此可疑也而陛下不疑事有不須疑者則疑之其必可疑者反不以為疑顛倒錯亂莫甚於此禍亂之萌近在旦夕宜及今幡然改過整聖駕謁兩宫以交父子之歡則四夷向風天下慕義矣知䕫州劉光祖致書趙汝愚曰宜與羣賢并心一力若上未過宫宰執不可歸安私第林陳二閹自以獲罪重華日夜交搆宜用韓魏公逐任守忠故事以釋兩宫疑謗大臣又當收兵柄密布腹心俾緩急有可仗者十一月辛未日中有黑子癸酉太白晝見地生毛夜有赤雲白氣趙彥逾等復力請帝朝重華戊寅帝始往朝都人大悅尚書左選郎官葉適奏自今宜於過宫之日令宰執侍從先詣起居異時兩宫聖意有難言者自可因此傳致則責任有歸不可復使近習小人增損語言以生疑惑不報庚辰留正赴都堂視事命姜特立還浙東日中黑子滅正出城待罪凡百四十日帝遣左司郎中徐誼喻㫖乃復入布衣王孝禮言今年冬至日影表當在十九日壬午而㑹元厯乃在二十日癸未乞將修內作所掌銅表圭降付太史局測驗從之金遣完顔匡等來賀明年正旦命匡權易名弼以避宋諱十二月戊戌帝朝重華宫金判定武軍節度使鄭王永蹈以謀反伏誅初崔溫郭諫馬太初與永蹈家奴畢慶夀私說䜟記災祥慶夀以告永蹈諫頗能相人永蹈乃召之相已及妻子皆大貴不與諸王比復召溫太初論䜟記天象溫曰丑年有兵災屬兔命者來年春當收兵得位諫曰昨見赤氣犯紫微白虹貫月皆主丑後寅前兵戈僭亂事永蹈深信其說乃陰結內侍鄭兩兒伺金主起居以溫為謀主諫太初往來游說河南統軍使布薩揆尚永蹈妹韓國公主永蹈謀取河南軍以為助與妹澤國公主長樂謀使駙馬都尉富拉塔致書於揆且先請婚以觀其意揆拒不許結婚使者不敢復言不軌事永蹈家奴董夀諌不聽以語同輩齊嘉努齊嘉努上變永蹈時在京師詔平章政事完顔守貞等鞫問連引甚衆久不能决金主怒召守貞等問狀右丞相瓜爾佳清臣奏曰事貴速絶以安人心於是賜永蹈及妃卞玊二子安春愛辛公主長樂自盡富拉塔崔溫郭諫馬太初等皆棄市布薩揆雖不聞問猶坐除名董夀免死𨽻監籍齊嘉努賞錢二千貫特遷五官雜班叙使增置諸王府司馬一人檢察門户出入自是諸王制限防禁愈密矣壬寅右司諫章穎以地震請罷葛邲疏十餘上不報庚戌判隆興府衛國公趙雄卒後諡文定甲寅金冊長白山之神為開天𢎞聖帝以朱熹為湖南安撫知潭州使者自金還言金人問朱先生安在故有是命是嵗金大有年洺邢深冀河北十六穆昆之地野蠶成繭五年春正月癸亥朔帝御大慶殿受羣臣朝遂朝重華宫次詣慈福宫行慶夀禮癸酉夀皇不豫乙亥金以葉嚕固紳始製女真字詔加封贈依蒼頡立廟盩厔例祠于上京納爾琿莊本路官春秋致祭丙子大理寺奏獄空癸未右丞相葛邲罷邲為相專守祖宗法度薦進人才博採士論惟恐其人聞之嘗曰十二時中莫欺自已其實踐如此丁酉金詔購求崇文總目內所闕書籍金初定長吏勸課能否賞罰格二月乙未趙汝愚余端禮以奏除西帥不行居家待罪戊戌以荆鄂諸軍都統制張詔為興州諸軍都統制甲辰金鄆王琮卒諡莊惠琮輕財好施不喜聞人過善吟詠至於騎射繪塑之藝皆造精妙三月癸亥合利州東西為一路壬申金初定錢禁庚辰金初定日月風兩雷師常祀戊子金置𢎞文院譯寫經書夏四月夀皇疾浸革羣臣數請帝問疾重華宫皆不報甲午帝與皇后如玉津園兵部尚書羅㸃請先過重華且曰陛下為夀皇子四十餘年無一間言止緣初郊違豫夀皇嘗至南內督過左右之人自此讒間遂生憂疑以臣觀之夀皇與天下相忘久矣今大臣同心輔政百執事奉法循理宗室戚里三軍百姓皆無二志設有間離誅之不疑乃若深居不出久虧子道衆口謗讟禍患將作不可以不慮帝曰卿等可為朕調護之侍講黃裳對曰父子之親何俟調護㸃曰陛下一出即當釋然帝猶未許㸃乃率講官言之帝曰朕心未嘗不思夀皇㸃曰陛下久闕定省雖有此心何以自白起居舍人彭龜年連上三疏請對不報屬帝視朝龜年不離班位伏地扣額血流漬甃帝曰素知卿忠直欲何言龜年奏今日無大于過宫余端禮因曰扣額龍墀曲致忠懇臣子至此豈得已耶帝曰知之然猶不往丙申太師致仕魏國公史浩卒年八十九追封㑹稽郡王諡文惠浩喜薦人才嘗擬陳之茂進職與郡夀皇知之茂嘗毁浩曰卿豈以德報怨耶浩曰臣不知有怨若以為怨而以德報之是有心也莫濟狀王十朋行事詆浩尤甚浩薦濟掌內制夀皇曰濟非議卿者乎浩曰臣不敢以私害公遂除中書舍人兼直學士院待之如初蓋其寬厚類此然力主和議以沮張浚論者非之己亥朝獻于景靈宫癸卯雨土甲辰侍從入對請朝重華宫己酉太學生程肖說等以帝未朝移書大臣事聞帝將以癸丑朝至期丞相以下入宫門俟日昃帝復辭以疾于是羣臣請罷黜待罪者百餘人詔不許乙卯金主幸景明宫董師中賈守謙拾遺路鐸先後凡兩上封事切諫不報丙辰侍講黃裳袐書少監孫逄吉等再上疏請朝重華丁巳起居郎兼中書舍人陳傅良請以親王執政或近上宗戚一人充重華宫使臺諫交章劾內侍陳源楊舜卿林億年離間之罪請逐之五月夀皇疾大漸欲一見帝數顧視左右陳傅良以帝不往重華宫乃繳上告敇出城待罪戊辰丞相留正等率宰執進見帝拂衣起正引帝裾諫羅㸃進曰夀皇疾勢已危不及今一見後悔何及羣臣隨帝入至福寧殿內侍闔門衆慟哭而出越二日正等以所請不從求退帝令知閣門事韓托胄傳㫖云宰執並出正等俱出浙江亭待罪夀皇聞之憂甚托胄奏曰昨傳㫖令宰執出殿門今乃出都門請自往宣押入城於是正及趙汝愚等復還第明日帝召羅㸃入對㸃言前日迫切獻忠舉措失體陛下赦而不誅然引裾亦故事也帝曰引裾可也何得輒入宫禁乎㸃引辛毗事以謝且言夀皇止有一子既付神器惟恐見之不速耳甲申從官及彭龜年黃裳沈有開奏乞令嘉王詣重華宫問疾許之王至宫夀皇為之感動六月戊戌夜夀皇聖帝崩年六十八遺詔改重華宫為慈福宫建夀成皇后殿于宫後以便定省以宫錢百萬緡賜內外軍是夕重華宫內侍訃于宰執私第趙汝愚恐帝疑或不出視朝持其劄不上翌日帝視朝汝愚以聞因請詣重華宫成禮帝許之至日昃不出大宗正丞李大性上疏言今日之事顛倒舛逆况金使祭奠當引見于北宫素帷不知是時猶可以不出乎檀弓曰成人有兄死不為衰者聞子臯將為成宰遂為衰成人曰兄則死而子臯為之衰蓋言成人畏子臯之來方為制服其服乃子臯為之非為兄也若陛下必待使來然後執喪則恐貽譏中外豈特如成人而已哉史臣曰孝宗即位鋭志恢復重違高宗之命不輕出師又值金國平治無釁可乘然易表為書改臣稱姪減去嵗幣以定鄰好金人易宋之心至是亦寖異於前日故世宗每戒羣臣積錢穀謹邊備蓋忌帝之將有為也惜帝用兵之志弗遂而終自古人君起自外藩入繼大統而能盡宫庭之孝未有若帝者終喪三年又能却羣臣之請而力行之廟號孝宗其無愧矣庚子遣薛叔似等使金告哀辛丑丞相率百官拜表請就喪次成服壬寅夀皇大斂嘉王復入奏詔俟疾愈過宫成禮留正與趙汝愚議介少傅吳琚請夀聖皇太后垂簾暫主喪事太后不許正等附奏云臣等連日造南內請對不獲纍上疏不得報今當率百官恭請若皇帝不出百官相與慟哭於宫門恐人情騷動為社稷憂請如唐肅宗故事羣臣發喪太極殿皇帝成服禁中然喪不可以無主祝文稱孝子嗣皇帝宰臣不敢代行太皇太后夀王之母也請代行祭奠禮太后許之是夜白氣亘天乙巳尊夀聖皇太后為太皇太后夀成皇后為皇太后丁未葉適言于留正曰帝疾而不執喪將何辭以謝天下今嘉王長若預建參決則疑謗釋矣正從之率宰執入奏云皇子嘉王仁孝夙成宜早正儲位以安人心不報越六日又請帝批云甚好明日宰執同擬㫖以進乞帝親批付學士院降詔是夕御劄付丞相云厯事嵗久念欲退閒正得之大懼乙卯遣林湜等使金致遺留物秋七月辛酉留正因朝臨佯仆于庭即出國門上表請老且云願陛下速回淵鑒追悟前非漸收人心庶保國祚初正始議帝以疾未克主喪宜立皇太子監國若未倦勤當復明辟設議內禪太子可即位而趙汝愚請以太皇太后㫖禪位嘉王正謂建儲詔未下遽及此他日必難處與汝愚異遂以肩輿五鼓遁去甲子太皇太后詔嘉王擴成服即位尊帝為太上皇帝皇后為太上皇后時留正既去人心益搖㑹帝臨朝忽仆于地趙汝愚憂危不知所出徐誼以書譙汝愚曰自古人臣為忠則忠為姦則姦忠姦雜而能濟者未之有也公內雖心惕外欲坐觀非雜之謂與國家安危在此一舉汝愚問策安出誼曰此大事非太皇太后命不可知閣門事韓托胄琦五世孫太皇太后女弟之子也同里蔡必勝與托胄同在閣門可因必勝招之托胄至汝愚以內禪議遣托胄請于太皇太后托胄因所善內侍張宗尹以奏兩日不獲命逡巡將退內侍關禮見而問之托胄具述汝愚意禮令少俟入見太皇太后而泣問其故禮對曰聖人讀書萬卷亦嘗見有如此時而保無亂者乎太皇太后曰此非汝所知禮曰此事人人知之今丞相已出所賴者趙知院旦夕亦去矣言與淚俱下太皇太后驚曰知院同姓事體與他人異乃亦去乎禮曰知院未去非但以同姓故以太皇太后為可恃耳今定大計而不獲命勢不得不去去將如天下何願聖人三思太皇太后問托胄安在禮曰臣已留其俟命太皇太后曰事順則可令諭好為之禮報托胄且云來早太皇太后于夀皇梓宫前垂簾引對托胄復命日已向夕汝愚始以其事語陳騤余端禮亟命殿帥郭杲等夜以兵分衛南北內關禮使傅昌朝密製黃袍是日嘉王謁告不入臨時將禫祭汝愚曰禫祭重事王不可不出翌日羣臣入王亦入汝愚率百官詣梓宫前太皇太后垂簾汝愚率同列再拜奏皇帝疾未能執喪臣等乞立皇子嘉王為太子以係人心皇帝批出有甚好二字繼有念欲退閒之㫖取太皇太后處分太皇太后曰既有御筆相公當奉行汝愚曰兹事重大播之天下書之史冊須議一指揮太皇太后允諾汝愚袖出所擬指揮以進云皇帝以疾至今未能執喪曾有御筆欲自退閒皇子嘉王擴可即皇帝位尊皇帝為太上皇帝皇后為太上皇后移御泰安宫太皇太后覽畢曰甚善汝愚奏自今臣等有合奏事當取嗣君處分然恐兩宫父子間有難處者須太皇太后主張又奏上皇疾未平驟聞此事不無驚疑乞令都知楊舜卿提舉本宫任其責遂召舜卿至簾前面諭之太皇太后乃命汝愚以㫖諭皇子即位皇子固辭曰恐負不孝名汝愚奏天子當以安社稷定國家為孝今中外人人憂亂萬一變生置太上皇何地衆扶皇子入素幄被黃袍方却立未坐汝愚率同列再拜皇子詣几筵殿哭盡哀須㬰立仗訖催百官班皇子衰服出就重華殿東廡素幄立內侍扶掖登御座百官起居訖行禫祭禮命舜卿往南內請八寶初猶靳與舜卿傳奏皇太子即位乃得寶出汝愚即喪次召還留正尋詔秋暑上皇未須移御即寢殿為泰安宫以奉上皇民心悅懌中外晏然乙丑太皇太后命立崇國夫人韓氏為皇后后琦六世孫父同卿托胄其季父也被選入宫能順適兩宫意遂歸嘉王邸至是立為后丙寅大赦丁卯侍御史張叔椿劾留正擅去相位徙叔椿為吏部侍郎戊辰詔求直言校書郎蔡幼學奏陛下欲盡為君之道其要有三事親任賢寬民而其本莫先於講學比年小人謀傾君子為安靜和平之說以排之故大臣當興治而以生事自疑近臣當效忠而以忤㫖擯棄其極至於九重深拱而羣臣盡廢多士盈庭而一籌不吐自非聖學日新求賢如不及何以作天下之才帝稱善遣鄭湜等使金告禪位庚午召祕閣修撰知潭州朱熹詣闕復召留正赴都堂視事正既去及帝即位以為大行攢宫總護使入謝復出城太皇太后命速宣押趙汝愚復以為請帝手札遣使召正還趙汝愚首裁抑僥幸收召四方知名之士中外引領望治乙亥以汝愚為右丞相陳騤知樞密院事余端禮參知政事汝愚辭不拜曰同姓之卿不幸處君臣之變敢言功乎戊寅加殿前都指揮使郭杲為武康軍節度使辛巳以趙汝愚為樞密使壬午以知閣門事韓托胄為汝州防禦使初托胄欲推定策功意望節鉞趙汝愚曰吾宗臣汝外戚也何可以言功惟爪牙之臣則當推賞乃加杲節鉞但遷托胄冝州觀察使托胄大失望然以傳導詔㫖浸見親幸時時乘間竊㺯威福知臨安府徐誼告汝愚曰托胄異時必為國患宜飽其欲而逺之不聽汝愚欲推葉適之功適辭曰國危效忠職也適何功之有及聞托胄觖望與知閣劉弼言于汝愚曰托胄所望不過節鉞宜與之不從適歎曰禍自此始矣遂力求補外侍御史章穎等劾內侍林億年陳源楊舜卿詔億年源與外祠舜卿與內祠甲申以兵部尚書羅㸃簽事樞密院事戊子罷楊舜卿內祠林億年常州居住陳源撫州居住八月己丑朔安定郡王子濤卒辛卯初御行宫便殿聽政癸巳除知潭州朱熹為煥章閣待制兼侍講誥詞略曰朕初承大統未暇他圖首闢經闈詳延學士爾發六經之藴窮百氏之源其在兩朝未為不用至今四海猶謂多竒擢諸次對之班處以邇英之列若程頥之在元祐若尹焞之在紹興副吾尊德樂義之誠究爾正心誠意之說先是黃裳為嘉王府翊善上皇諭之曰嘉王進學皆卿之功裳謝曰若欲進德修業追跡古先哲王則須尋天下第一等人上皇問為誰裳以熹對彭龜年為嘉王府直講因講魯莊公不能制其母云母不可制當制其侍御僕從王問此誰之說對曰朱熹說也自後每講必問熹說如何至是趙汝愚首薦熹遂召入經筵熹在道聞泰安朝禮尚缺近習已有用事者即具奏云陛下嗣位之初方將一新庶政所宜愛惜名器若使幸門一開其弊不可復塞至於博延儒臣專意講學必求所以深得親歡者為建極導民之本思所以大振朝綱者為防微慮逺之圖不報甲午增置講讀官以給事中黃裳中書舍人陳傅良彭龜年為之丁酉以生日為天祐節尋改曰瑞慶壬寅詔經筵官開陳經㫖救正闕失進封皇弟許國公柄為徐國公辛亥金河決陽武故堤灌封丘而東尚書省奏都水監官見水勢趨南不預經畫詔王汝嘉等各削官兩階杖七十罷之命參知政事馬琪往視仍許便宜從事河自元符二年東流斷絶北流合御河至清州入海頗為通利南渡後地入于金河始離濬滑故道時有決溢至是河決陽武由封丘東注梁山濼分為二派北派由北清河入海南派由南清河入淮汲胙之間河流遂絶丙辰內批罷左丞相留正以趙汝愚為右丞相初正言陛下勉徇羣情以登大寶當遇事從簡示天下以不得已之意實非頒爵之時時韓托胄浸謀預政數詣都堂正使省吏諭之曰此非知閣日往來之地托胄怒而退㑹正與汝愚議攢不合托胄因間之于帝遂以手詔罷正出知建康府正謹法度惜名器毫髮不可干以私與周必大俱以相業稱汝愚本倚正共事怒托胄不以告及來謁因不見之托胄慙忿羅㸃謂汝愚曰公悮矣汝愚悟乃見之托胄終不懌朱熹辭新命不許及入對首言乃者太皇太后躬定大策陛下寅紹丕圖可謂處之以權而庶幾不失其正今三月矣或反不能無疑於逆順之際竊為陛下憂之猶有可諉者亦曰陛下前日未嘗有求位之計今日未嘗忘思親之心此則所以行權而不失其正之根本也充未嘗求位之心以盡負罪引慝之誠充未嘗忘親之心以致溫清定省之理始終不越乎此而大倫可正大本可立矣時趙彥逾按視夀皇山陵以為土肉淺薄下有水石孫逢吉覆按乞别求吉兆詔集議熹上議狀言夀皇聖德衣冠之藏當博求名山不宜偏信臺史委之水泉沙礫之中不報九月庚子簽書樞密院事羅㸃卒㸃孝友端介不為矯激崖異之行或謂天下事非才不辦㸃曰當論其心心苟不正才雖過人果何取哉時給事中黃裳亦卒趙汝愚泣謂帝曰黃裳羅㸃相繼淪謝二臣不幸天下之不幸也裳簡易端純篤于孝友恥一書不讀一物不知推賢樂善出乎天性事君隨事納忠上援古義下揆人情氣平詞切理盡事該與人言傾盡底藴其論天人之理性命之源皆足以發明伊洛之㫖辛未合祭天地于明堂大赦壬申以刑部尚書京鏜簽書樞密院事初帝欲除鏜帥蜀趙汝愚謂人曰鏜望輕資淺豈可當此方面鏜聞而憾之韓托胄引以自助鏜一變素守羣憸附和視正士如仇讐衣冠之禍自此始矣冬十月己丑右諫議大夫張叔椿再劾留正擅去相位詔落正觀文殿大學士庚寅更泰安宫為夀康宫金羣臣再表請上尊號不許金遣户部員外郎何格賑河決被災人户癸巳雷乙未詔以陰陽謬盩雷電非時令臺諫侍從各疏朝政闕失以聞甲辰以朱熹言趣後省看詳應詔封事乙巳上大行皇帝諡廟號孝宗丙午復以朱熹奏請郤瑞慶節賀表庚戌改上安穆皇后諡曰成穆安恭皇后諡曰成恭金故尚書左丞張汝弼妻高圗斡以謀逆伏誅汝弼與鎬王永中甥舅也陰相為黨金主即位高圖斡每以邪言怵永中覬非望畫永中母元妃張氏像奉之甚謹挾左道為永中祈福事覺有司鞫治高圖斡伏誅詞連汝弼金主以事覺在汝弼死後得免削奪是月建福寧殿韓托胄日夜謀去趙汝愚知閣門事劉㢸亦以不得預內禪心懷不平因謂托胄曰趙相欲專大功君豈惟不得節鉞將恐不免嶺海之行托胄愕然因問計㢸曰惟有用臺諌耳托胄問若何而可㢸曰御筆批出是也托胄然之遂以內批拜給事中謝深甫為御史中丞㑹汝愚請令近臣薦御史托胄密以其黨劉德秀屬深甫遂以內批除監察御史朱熹憂其害政每因進對為帝切言之又約吏部侍郎彭龜年同劾托胄㑹龜年充金人弔祭館伴使熹復貽書汝愚當以厚賞酬托胄之勞勿使預政汝愚為人疏謂其易制不以為慮右正言黃度將上疏論托胄之姦托胄覺之以御筆出度知平江府度言蔡京擅權天下所由以亂今托胄假御筆逐諫臣使俯首去不得效一言非國之利也固辭奉祠歸養閏月庚申以孝宗將祔廟議宗廟迭毁之制孫逢吉曹三復首請併祧僖宣二祖奉太祖居第一室祫祭則正東向之位詔集議僖順翼宣四祖祧主宜有所歸自太祖首尊四祖之廟治平間議者以世數寖逺請遷僖祖於夾室後王安石等奏僖祖有廟與稷契無異請復其舊趙汝愚不以復祀僖祖為然侍從多從其說吏部尚書鄭僑欲且祧宣祖而祔孝宗侍講朱熹以為藏之夾室則是以祖宗之主下藏於子孫之夾室又擬為廟制以辨以為物豈有無本而生者廟堂不以聞乃毁撤僖宣廟室更創别廟以奉四祖甲子金諸王百官奉表請上尊號不許乙丑遣林季友使金報謝戊辰金遣使來弔祭戊寅內批罷煥章閣待制兼侍講朱熹熹每進講務積誠意以感動帝心以平日所論著敷陳開析坦然明白可舉而行講畢有可以開益帝聽者罄竭無隱帝亦虛心嘉納焉至是以黃度之去因講畢奏疏極言陛下即位未能旬月而進退宰臣移易臺諫皆出陛下之獨斷中外咸謂左右或竊其柄臣恐主威下移求治反亂矣疏入韓托胄大怒使優人峩冠闊袖象大儒戲於帝前因乘間言熹迂闊不可用帝方倚任托胄乃出御批云憫卿耆艾恐難立講已除卿宫觀趙汝愚袖御筆見帝且諫且拜帝不省汝愚因求罷政不許越二日托胄使其黨封內批付熹熹即附奏謝遂行中書舍人陳傅良封還録黃起居郎劉光祖起居舍人鄧馹御史吳獵吏部侍郎孫逢吉知登聞鼓院游仲鴻交章留熹皆不報傅良光祖亦坐罷工部侍郎黃艾因侍講問逐熹之驟帝曰始除熹經筵耳今乃事事欲與聞艾力辨其故帝不聽熹在朝四十六日進講者七知無不言既去托胄益無所忌憚彭龜年奏始臣約熹同論托胄熹罷臣宜併斥不報托胄銜之游仲鴻上疏曰陛下宅憂之時御批數出不由中書前日宰相留正去之不以禮諫官黃度去之不以正講官朱熹復去之不以道自古未有舍宰相諫官講官而能自為聰明者也願亟還熹毋使小人得志以養成禍亂王介上疏言陛下即位未三月策免宰相遷移臺諫悉出內批非治世事也崇寧大觀間事出御批遂成北狩之禍杜衍為相常積內降十數封還今宰相不敢封納臺諫不敢彈奏此豈可久之道乎壬午詔改明年為慶元元年金參知政事馬琪自行省回具奏河防利害丙戌以翰林待制鄂屯忠孝權户部侍郎太府少監溫昉權工部侍郎行户工部事修治河防十一月丙午帝自重華宫還大內庚戌以韓托胄兼樞密都承㫖初詔托胄可特遷二官托胄覬覦節鉞意不滿力辭乃止遷一官為宣州觀察使怨趙汝愚益深至是特遷都承㫖辛亥雨木氷詔行孝宗皇帝喪三年先是有司請於易月之外用漆紗淺黃之制時朱熹在講筵奏言自漢文短喪厯代因之天子遂無三年之喪為父且然則嫡孫承重可知人紀廢壞三綱不明千有餘年莫能釐正夀皇聖帝至性以日易月之外猶執通喪朝衣朝冠皆用大布所宜著在方策為萬世法程陛下以世嫡承大統承重之服著在禮律宜遵夀皇已行之法一時倉卒不及詳議遂用漆紗淺黃之服使夀皇已行之禮舉而復墜臣竊痛之然既往之事不及追改啓殯發引禮當復用初喪之服至是詔遵用三年之制中外百官皆以凉衫視事用熹言也升明州為慶元府乙卯權攢哲文神武成孝皇帝于永阜陵十二月丁巳朔禁民間妄言宫禁事乙丑吏部侍郎兼侍講彭龜年見韓托胄用事權勢重于宰相上疏條奏其姦謂進退大臣更易言官皆初政最關大體今大臣或不能知而托胄知之假託聲勢竊㺯威福不去必為後患帝覽奏駭曰托胄朕托以肺腑信而不疑不謂如此龜年又言陛下逐朱熹太暴故欲陛下亦亟去此小人毋使天下謂陛下去君子易去小人難於是龜年托胄俱請祠帝欲兩罷其職陳騤進曰以閣門去經筵何以示天下既而內批龜年與郡托胄進一官與在京宫觀給事中林大中同中書舍人樓鑰繳奏曰陛下眷禮僚舊一旦龍飛延問無虛日不三數月間或死或斥賴龜年一人尚留今又去之四方謂其以盡言得罪恐傷政體且一去一留恩意不侔去者日逺不復侍左右留者內祠則召見無時請留龜年經筵而命托胄以外任則事適平人無可言者上批龜年已為優異托胄本無過尤可並書行大中復同鑰奏龜年除職與郡以為優異則托胄之轉承宣使非優異乎若謂托胄本無過尤則龜年論事實出於愛君之忱豈得為過龜年既已決去托胄難於獨留宜畀外任或外祠以慰公議不聽由是托胄愈橫御史中丞謝深甫劾陳傅良罷之丁邜金免被黃河水災今年秋稅戊辰以陳康伯配享孝宗廟庭己巳知樞密院事陳騤罷庚午以余端禮知樞密院事京鏜參知政事吏部尚書鄭僑同知樞密院事陳騤與趙汝愚素不協未嘗同堂語及爭彭龜年事韓托胄語人曰彭侍郎不貪好官固也元樞亦欲為好人耶故罷之引京鏜居政府以間汝愚汝愚孤立于朝帝亦無所倚信辛未監察御史劉德秀劾起居舍人劉光祖罷之以工部尚書趙彥逾為四川制置使彥逾自以有功于帝室冀趙汝愚引居政府及除蜀帥大怒遂與韓托胄合因陛辭疏廷臣姓名于帝指為汝愚之黨且曰老奴今去不惜為陛下言之由是帝亦疑汝愚癸酉上孝宗廟樂曰大倫之舞金遣使來賀即位甲戌祔孝宗神主于太廟戊寅封太保郭師禹為永寧郡王師禹成穆皇后之弟也資治通鑑後編卷一百二十九
