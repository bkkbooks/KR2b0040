body:
  text: 資治通鑑後編卷五十四刑部尚書徐乾學撰宋紀五十四起昭陽協洽十月盡閼逢涒灘二月凡五月仁宗體天法道極功全德神文聖武睿哲明孝皇帝慶厯三年冬十月乙未朔徙知江寧府劉沆知潭州經制蠻事諫官歐陽修言朝廷自河東移李昭亮為真定都部署其人不才不堪為將帥委以兵柄天下之人共為朝廷憂之伏望早令兩府擇人替換及早講求選將之法知光化軍韓綱性苛急不能拊循士卒皆怨憤員僚邵興率衆盜庫兵欲殺綱綱踰城逃興等遂焚掠居民劫其指揮使李美及軍士三百餘人趣蜀道美自縊死綱億長子也壬寅以玉清昭應宫田二十二頃賜國子監丙午以鹽鐡副使張昷之為河北都轉運按察司知諫院王素為淮南都轉運按察使鹽鐡判官沈邈為京東轉運按察使用富弼范仲淹等言也先是仲淹弼等言今轉運按察使古之嶽牧方伯刺史觀察採訪使之職也知州知縣古之諸侯守宰之任也內外官雖多然與陛下共理天下者惟守宰最要耳比年以來不加選擇非才貪濁老懦者一切以例除之其間縱有良吏百無一二是使天下賦稅不得均獄訟不得平水旱不得救盜賊不得除民既無所告訴必生愁怨而不思叛者未之有也民既怨叛姦雄起而收攬之則天下必將危矣今民方怨而未甚叛去宜急救之救之之術莫若守宰得人欲守宰得人請詔二府通選轉運使既得人即委逐路自擇知州知州已得人即委逐州自擇知縣其不任事者奏罷之直俟人人稱職而後已仍令久其官守勿復數易其異政者宜就與升擢則官修政舉朝廷唯總其大綱而振舉之可也帝既納其言於是昷之等首被兹選素入辭帝謂曰卿今便去諫院事有未言者可盡言之丁未以右正言余靖為契丹太后正旦使代張昷之也初洺州肥鄉縣田賦不平久莫能治轉運使楊偕患之大理寺丞郭咨曰是無難者得一往可立決也偕即以咨攝令并遣祕書丞孫琳與其事咨等用千步方田法括地得其數除無地之租者四百家正無租之地者百家收逋賦八十萬流民乃復而王素為諫官建議均天下田賦歐陽修即言咨與琳方田法簡而昜行願召二人者三司亦以為然且請於亳夀汝蔡四州擇尤不均者均之於是遣咨與琳先往蔡州首括上蔡一縣得田二萬六千九百三十餘頃均其賦於民既而咨言州縣多逃田未可盡括朝廷亦重勞人遂罷考異記聞以為執政不然其議沮罷之咨本傳以為遭母喪去今從食貨志戊申詔二府同選諸路提刑癸丑余靖使契丹入辭書所當奏事於笏各以一字為記凡數十字帝顧見之指其字令一一條奏日幾昃乃罷甲寅復置諸路轉運判官仍詔中書樞密院同選用天聖七年初置益廣東西運判其後闕不除故此云復置天聖後闕不除當考二府同選其日辛酉今并書乙卯詔修兵書翰林學士承旨丁度提舉集賢校理曽公亮朱寀為檢閲官己未范仲淹言臣竊見京朝官使臣選人等進狀或理會勞績或訴雪過犯或陳乞差遣其事理分明可行可罷者則朝廷便有指揮內有中書樞密院未見根原文字及恐審官三班院流內銓别有例難便與奪者多批送逐司其逐司為見批送文字别無與奪便不施行號為送殺以此官員使臣三五度進狀不能結絶轉成住滯乞特降聖旨今後凡進狀者仰逐司主判子細看詳如內有合施行者即與勘會具條例情理定奪進呈送中書樞密院再行相度别取進止如不可施行亦仰逐司告諭本人始委所貴逐司主判各揚其職事無漏落亦免官貟使臣選人等重疊進狀紊煩聖聽從之考異實録但書詔中外有陳敘勞績或訴雪罪狀中書批送有司者謂之送殺更不施行自今宜令主判官詳其可行者别奏聽裁按此乃范仲淹奏請實録刪取大略今存仲淹元奏壬戌詔二府新定磨勘式自是法密於舊矣此即范仲淹所上十事其一曰明黜陟也甲子陜西路經略安撫招討使鄭戩言順德軍生户大王家族元寧等以水洛城來獻其地西占隴坻通秦州往來道路隴之二水環城西流繞帶河渭田肥沃廣數百里雜氐十餘落無所役屬尋遣靜邉寨主劉滬招集其酋長皆願納質子求補漢官今若就其地築城可得蕃兵三五萬人及弓箭手共捍西賊實為封疆之利從之諫官歐陽修言近來傳聞燕度勘鞫滕宗諒事枝蔓勾追囚繫滿獄人人嗟怨自狄青种世衡等並皆解體若不早止絶則恐元昊因此邉上搖動將臣憂恐解體之際突出兵馬誰肯為朝廷用命又聞田况在慶州目見宗諒别無大罪并燕度生事張皇纍具奏狀並不蒙朝廷報答又遍作書告在朝大臣意欲傳逹於聖聽大臣各避嫌疑必不敢進呈况書臣竊思朝廷於宗諒必無愛憎但恐勘官希旨過當張皇騷動邉鄙伏望速令結絶仍令告諭邉臣以不枝蔓勾追之意兼令今後用錢但不入已外任從便宜不須畏避庶使安心用命立功其田况纍次奏狀並與大臣等書伏望聖慈盡取詳覽修又言臣今日復聞燕度輒行文牒劾問樞密副使韓琦議邉事因依深可驚駭樞密副使是輔弼之任宣撫使將君命而行本藉重臣特行鎮撫今若無故遭一獄吏侵欺而陛下不與主張則今後奉君命而出任者皆為邉鄙所輕為大臣而作事者反畏小人所制故燕度論於國體便合坐以深刑責其凌吏亦自違於條制罪須行遣情不可容其滕宗諒獄狀乞别選差官取勘結絶燕度亦乞别付所司勘罪行遣修又言臣風聞邉臣張亢近為使過公用錢見在陜西置院根勘干連甚衆亦聞狄青曽隨亢入界見已勾追照對臣伏見兵興以來所得邉將惟狄青种世衡二人其忠勇材武不可與張亢滕宗諒一例待之且青本武人不知法律縱有使過公用錢必非故意偷謾不過失於點檢致誤侵使而已方今議和之使正在賊中茍一言不合則忿兵為患必至侵邉謹備邉防正藉勇將豈可自將青等為賊拘囚使賊聞之以為得計望特降指揮元勘官毋得枝蔓勾追其狄青縱有干連仍乞特與免勘知渭州尹洙亦言青於公用錢物無毫分私用不可以細微詿誤令其畏懼望特旨諭青庶安心專慮邉事是月契丹北院樞密使蕭孝穆卒孝穆位髙益畏與人交結始終如一所薦拔皆忠直嘗語人曰樞密選賢而用何事不濟若自親煩碎則大事凝滯矣自蕭合卓以吏才進位宰相其後轉相倣效不知大體孝穆歎曰不能移風易俗偷安爵位臣子之道若是乎時稱為國寶臣十一月丙寅上清言火尋有詔以宫地為禁軍營考異監察御史裏行包拯有章乞勿修按拯為裏行乃在此月癸酉以宫地給禁軍當是癸酉後也景祐初置殿中侍御史裏行監察御史裏行凡四人以三丞以上嘗歷知縣人充既而久闕不除於是詔以兩人為額癸酉以太常博士趙人李京殿中丞合肥包拯並為監察御史裏行中丞王拱辰所薦也京嘗知魏縣奉法嚴正吏不便之欲以竒中京遂相率遁去監司果議以苛刻斥知府任布曰如此適墮吏計中矣京賴以免拯事父母以孝聞嘗知天長縣有訴盜割牛舌者拯使歸屠其牛鬻之既而又有告殺牛者拯曰何為割某家牛舌而又告之盜者驚伏徙知端州州歲貢研前守緣貢率取十倍以遺權貴人拯命製者才足貢數歲滿不持一研歸初光化軍賊邵興帥其黨趣蜀道遇華商虢等州提舉捉賊上官珙殺之又敗興元府兵於饒風嶺本府軍校趙明以衆降乃自州北循山而東捉賊使臣陳曙等領兵追擊興於壻水及其黨皆就禽壬午詔並凌遲處死曙若拙子也考異韓琦家傳云琦遣秦州將官王子方邀殺之今不取諫官歐陽修言臣竊見近日盜賊縱橫蓋由威令不行昨王倫既敗之後不誅家族凡小人作事亦須先計成則獲大利不成則無大禍有利無害誰不欲反只如淮南一帶官吏與王倫宴率民金帛獻送開門納賊道左參迎茍有國法豈敢如此而往來取勘已及半年未能斷遣古者稱罰不踰時所以威激士衆今遲緩如此誰有懼心遂致張海等官吏依前迎奉順陽縣令李正已延賊飲宴宿於縣廳恣其劫掠鼓樂送出城外其人敢如此者蓋為不奉賊則死不奉朝廷不死所以畏賊過於畏國法伏望陛下勿行小惠以誤大事其宣毅兵士必有家族乞盡戮於光化市中使逺近聞之悚畏以止續起之賊其正已聞已有臺憲上言亦乞斬於鄧州使京西一路官吏聞之知國法尚存不敢奉賊天下事勢如此不可更循舊弊武怒威斷惟陛下力行之又言臣聞江淮官吏等各為王倫事奏案已到多時尚未聞斷遣仍聞議者猶欲寬貸如此則紀綱隳壞在處官吏皆迎賊棄城獻兵納物天下何由不大亂也此由大臣之家父子兄弟並在朝廷權要之臣皆是相識多方營救故先於江淮官吏寬之只要韓綱行遣不重不思國體但植私恩惟陛下以天下安危為計出於聖斷以勵羣下庶幾國威粗振賞罰有倫其朝仲約等乞重行朝典初羣盜剽劫淮南將過髙郵知軍朝仲約度不能禦諭富民出金帛具牛酒使人迎勞且厚遺之盜恱徑去不為暴事聞朝廷大怒樞密副使富弼議欲誅仲約以正法參知政事范仲淹欲宥之爭於帝前弼曰盜賊公行守臣不能戰守而使民醵錢遺之法所當誅也不誅則郡縣無復肯守者矣聞高郵之民疾之欲食其肉不可釋也仲淹曰郡縣兵械足以戰守遇賊不禦而又賂之此法所當誅今髙郵無兵與械雖仲約之義當勉力戰守然事有可恕戮之恐非法意小民之情醵出財物而得免於殺掠理或喜之而云欲食其肉傳者過也上釋然從之仲約由此免死既而弼愠甚謂仲淹曰方今患法不舉舉法而多方沮之何以整衆仲淹密告之曰祖宗以來未嘗輕殺臣下此盛德事奈何欲輕壞之且吾與公在此同僚之間一心者有幾雖上意亦未知所定也而輕導人主以誅戮臣下他日手滑雖吾輩亦未敢自保弼終不以為然其後兩人不安於朝相繼出使弼還自河北及國門不許入未測帝意比夜倣徨不能寐繞床歎曰范六丈聖人也考異李燾曰范文正公作參知政事富文忠公作樞密副使時盜起京西掠商鄧均房光化軍棄城走奏至二公同對上前富公乞取知軍者行軍法范公曰光化無城郭無甲兵知軍所以棄城乞薄其罪仁宗可之罷朝富公怒甚謂范公曰六丈要作佛耶范公笑曰人何用作佛某之所言有理少定為君言之富公益不樂范公從容曰上春秋鼎盛豈可教之殺人至手滑吾輩首領將不保矣富公聞之汗下起立以謝曰非某所及也富公素以丈事范公云據邵伯溫見聞録所稱光化軍蓋繆也今從蘇氏龍川别志别志以為張海亦恐誤今削去賊名姓仍附誅光化反卒之後蓋慶歷間賊王倫起京東掠淮南張海起陜西掠京西不聞張海嘗過淮南也范仲淹正傳亦指王倫不稱張海傳所載守令當誅者不但仲約一人今但從别志王堯臣麈史記此事亦與邵伯溫同但稱王倫不稱張海伯溫蓋誤也癸未詔館職有闕以兩府兩省保舉然後召試補用自今見任前任兩府及大兩省已上官不得陳乞子弟親戚館職并讀書之類此即范仲淹等所陳十事其二曰抑僥幸也諫官歐陽修言近年風俗偷薄士子奔競至有偷竊他人文字干謁權貴以求薦舉如丘良孫者又有廣費資財多寫文册干求勢門日夜奔馳如林槩者此二人並是兩制臣僚奏乞召試舊來本無兩省以上舉館職明文尚猶如此奔競今若明許薦人則今後薦者無數矣臣欲於近降詔書內兩省舉館職一節添入遇館職闕人即朝廷先擇舉主方得薦人仍乞别定館閣合存貟數以革冗濫又近降詔書不許權貴奏子弟入館閣此蓋為近年貴家子弟濫任館閣者多如吕公綽錢延年之類尤為荒濫所以立此新規革其甚弊臣謂今後即貴家子弟入館閣者見在人中若無行業文詞為衆所知亦不得以年深遷補龍圖昭文館并待制修撰之類所貴侍從清班不至冗濫丁亥詔更蔭補法長子不限年餘子孫年過十五弟姪年過二十乃得蔭自是任子之恩稍殺矣此即范仲淹等所上十事其二曰抑僥幸也考異東都事略作四年正月丁亥事非是按宋史是年十一月丁亥更蔭補法今從之庚寅詔陜西安撫使韓琦副使田况赴闕諫官歐陽修言議和未決西人再來方有邀請在於事體必難便從邉上機宜正須處置臣謂琦等在彼撫遏則朝廷之議自可以持重不須屈就今中道召還則是使賊知朝廷意在必和自先弛偹况事無急切何必召歸乞仍令琦等在彼經略以俟和議之決辛卯同修起居注歐陽修請自今後上殿臣僚退令少留殿門俟修注官出面録聖語從之諫官孫甫言聞元昊欲稱臣然歲乞賣青鹽十萬石兼遣人回昜京師及乞增歲給之數如聞大臣議於緣邉置𣙜場許賣鹽五七萬石及互市諸物臣謂西鹽五七萬石其直不下錢十餘萬貫况朝廷已許歲給之物二十萬今又許賣鹽則與遺契丹物數相當契丹聞之其貪欲之心得自已乎况自德明之時纍乞放行青鹽先帝以其亂法不聼蓋鹽者中國之大利又西戎之鹽味勝解池所出而其産無窮既開其禁則流於民間無以隄防矣兼聞張子奭言元昊國中頗甚窮蹙就如其言當彼窘乏之際尤宜以計困之安得汲汲與和哉歐陽修言昨如定等回但聞許與之數不過十萬今張子奭所許乃二十萬仍聞賊意未已更有過求先朝與契丹通和只用三十萬及劉六符輩來又添二十萬今便許昊賊三十萬則他日更來又須二三十萬使四夷窺見國中廟謀勝算惟以金帛告人則邈川首領豈不動心一旦興兵又須三二十萬生民膏血有盡彼之溪壑無厭引之轉來何有限極今已許之矣既不可追分外過求尚可抑絶見今契丹往來在沿邉市易豈可令西蕃直至京師只以此詞自可拒止至如青鹽弛禁尤不可從於我雖所損非多在賊則為利甚博凡此三事皆難允許伏望陛下留意而思之且可不與彼若實欲就和雖不許亦可若實無和意與之亦有後虞也壬辰詔限職田此即范仲淹等十事其五曰均公田也詔詳定國朝勳臣名次本家見無人食祿者祿其下子孫一人司天監言五星皆在東方主中國大安乙巳桂陽監猺賊復冦邉戊申以祕書丞張子奭為祠部貟外即右侍禁王正倫為左侍禁閣門祗候並以纍使夏州之勞也己酉詔轉運使郭輔之等攻討蠻猺並就便招撫之丁巳大雨雪木冰戊午以南京府學為國子監庚申許廣州立學是月澧州獻瑞木有文曰太平之道諫官歐陽修言知州馮載本是武人不識事體便為祥瑞以媚朝廷臣謂前世號稱太平者須是四海晏然萬物得所方今西人叛逆北敵驕悖加以西則瀘戎南則湖嶺無一處無事而又內則百姓困弊盜賊縱橫以臣視之乃是四海騷然萬物失所實未見太平之象若是木文不偽實是天生則亦有深意蓋其文止曰太平之道明得其道則太平失其道則危亂也臣頃見太平州曽進芝草今又進瑞木竊慮四方相效爭造妖妄其所進瑞木伏乞勿示臣僚仍速詔天下告以四海困弊方當責已凡有竒獸異禽草木之類並不得進獻從之是歲河北降赤雪河東地震五六日不止韓琦至陜西屬歲大飢羣盜嘯聚商虢之郊張海郭邈山與邵興等合琦遣屬官乘傳齎宣撫司榜收集散軍諭以免罪歸所屬仍召謝雲行等將沿邉土兵入山捕張海等邵興以無援竄入興洋界被殺張海等相繼殱衄擒捕餘黨殆盡是冬大旱河中同華等十餘州軍物價翔貴飢民相率東徙琦即選官分詣州縣發省倉以賑之奏差提點刑獄許宗夀專切往來提舉蒲華同三州所活凡二百五十四萬餘人他州稱是時民力久困琦乃蠲賦役察官吏能否者升黜之又以兵數雖多而雜以疲老耗用度選禁軍不堪征戰者停放一萬二千餘人契丹改政事省為中書省四年春正月戊辰詔罷修水洛城從韓琦奏也庚午京城雪寒詔三司減價出薪米以濟之辛未降天章閣待制權知鳯翔府滕宗諒知虢州職如故并代副部署張亢為本路鈐轄宗諒及亢皆置獄邠州獄未具而有是命從參知政事范仲淹言也先是仲淹力辨宗諒亢等非有大過乞免下獄及是又言燕度勘到滕宗諒所用錢數分明並無侵欺入已張亢借公用錢買物事未發前已還納訖又因移任借却公用銀却留錢物準還皆無欺隱之情宗諒及亢由是得免重劾壬申西蕃磨氊角入貢乙亥荆王元儼薨元儼生而穎悟太宗尤所鍾愛不欲令早出宫年二十始出就封故宫中呼為二子太保廣顙豐頤資質嚴毅不可犯性謹約寡欲喜儒學好文詞兼善書法帝以十二歲即位章獻皇太后制朝事自以屬尊望重恐為太后所忌深自晦密及太后崩帝親政益加尊寵凡有請報可王必自書謝牘嘗問翊善王渙曰元昊平未對曰未也曰如此安用宰相聞者畏其言及病帝憂形於色親至卧內手調藥屏人語久之所獻多忠言賜白金五千兩辭不受帝為嗟泣臨終惟戒諸子以孝友及薨贈天策上將軍徐兖二州牧燕王諡恭肅詔取墨迹及所賦詩分頒輔臣餘藏祕閣丙戌詔自今臣僚毋得以奏薦恩澤及所授命為親屬乞賜科名及轉官升陟入通判以上差遣其親屬嘗降官降差遣亦毋得乞以恩澤牽復若因纍而為别更名奏蔭者重坐之辛卯太常禮院上新修太常新禮四十卷慶厯祀儀六十三卷賜提舉賈昌朝編修孫祖德等刀劍器幣有差二月丙申遣內侍賫奉宸庫銀三萬兩下陜西博糴穀麥以濟飢民歐陽修言臣計西賊無故而請和者不止與契丹通謀共困中國兼欲詐謀欵我併力以吞唃厮囉摩旃瞎旃諸族地大力盛然後東向以攻中國耳今若未見有他計拒其來和則當賜以詔書言唃厮囉等皆受朝廷官爵父子為國藩臣今若講和則不得攻此數族賊聞此言必難聽約用此為説自可拒絶臣所以區區願未和者蓋知不和患輕易為處置和後患大不可枝梧此天下安危大計臣不敢不極言也辛丑權御史中丞王拱辰言滕宗諒在邉盜用公使錢不俟具獄止削一官所坐太輕臣明日更不敢入朝乞賜責降一小郡以戒妄言監察御史裏行李京又言近聞興元府西縣奏滕宗諒差兵士以驢車四十兩載茶三百餘籠出引逐處不得收稅宗諒職在近侍而亂法太甚宜奪職以懲貪墨之人壬寅知光化軍韓綱除名英州編管兵馬監押許士從追三官舒州編管坐棄城也諫官歐陽修等言風聞朝廷近降指揮與諸路轉運使令體量州縣官吏酷虐軍民者臣謂光化兵變雖因韓綱自致然兵亦素驕處置之間須合中道韓綱自當行法驕兵亦合討除今若明行號令偏約官吏則驕兵增氣轉更生心長吏畏避無由行事伏乞速降指揮與諸路轉運使令密切稟行不得漏泄廣西宜州蠻區希範作亂希範思恩人狡黠頗知書嘗舉進士試禮部景祐末與其叔正辭應募從官軍討安化州叛蠻既而希範擊登聞鼓求録用事下宜州知州馮伸已言其妄編管全州正辭亦嘗自言其功不報二人皆觖望希範後趣遁歸與正辭率其族人及白崖山酋蒙趕荔波洞蠻謀為亂擇日殺牛建壇場祭天神推蒙趕為帝正辭為奉天開運建國桂王希範神武定國令公桂州牧以區丕績為宰相餘皆偽立名號補署四十餘人前月丙子率衆五百破環州劫州印焚其積聚以環州為武成軍癸卯事聞詔轉運鈐轄司亟發兵捕擊之乙巳以上清宫田園邸店賜國子監戊申遣入內供奉官王昭明往宜州召募勇敢人入洞捕擊蠻賊徙知虢州滕宗諒知嶽州用中丞王拱辰言也己酉宣拱辰赴臺諭曰言事官第自振職勿以朝廷未行為沮已而輒請解去以取直名自今有當言者宜力陳無避拱辰頓首謝甲寅罷陜西四路都部署經略安撫招討使復置逐路都部署考異宋史作都總管經略安撫招討使從韓琦議也以鄭戩為永興軍都部署兼知永興軍初命戬知永興軍仍兼四路都部署諫官歐陽修言戬雖名都部署而諸路自各有將又其大事不令專制必稟朝廷假如邉將有大事先稟於戬又稟於朝廷朝廷議定下戬戬始下於沿邉只此一端自足敗事且大事戬既不專小事又不由戬則部署一職虛名可廢若小事一一問戬則四路去永興皆數百里其塞柵逺者及千里使戬一一處分合宜尚有遲緩之失萬一耳目不及處置失宜則為害不細臣欲乞落其虛名只求坐鎮長安撫民臨政以為關中之重而使四路各責其將則名體皆順處置合宜從之考異鄭戬罷四路部署實録正史皆云韓琦所議據歐陽修誎疏則初移戬知永興尚兼四路後乃改命必緣修此疏但實録正史都不詳耳丙辰御迎陽門召輔臣觀畫其畫皆前代帝王美惡之迹可為規戒者因命天章閣侍講曽公亮講毛詩王洙讀祖宗聖政録翰林侍讀學士丁度讀前漢書數刻乃罷詔天章閣侍講曽公亮刪定審官三班院流內銓條貫從范仲淹請也資治通鑑後編卷五十四
