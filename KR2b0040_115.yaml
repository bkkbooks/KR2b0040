body:
  text: 資治通鑑後編卷一百十五刑部尚書徐乾學撰宋紀一百十五起重光作噩十月盡閼逄因敦十二月凡三年有三月髙宗受命中興全功至德聖神武文昭仁憲孝皇帝紹興十一年冬十月丙寅朔金人入泗州遂入楚州淮南大震戊辰楊政敗金人於寶雞禽萬户通檢貝勒戊寅詔修玉牒秦檜奏召嶽飛父子證張憲事使者至飛第飛笑曰皇天后土可表此心遂與雲就大理獄檜命中丞何鑄大理卿周三畏鞫之鑄引飛至庭詰其反狀飛裂裳以背示鑄有舊涅盡忠報國四大字深入膚理既而閲實俱無驗鑄察其寃以白檜檜曰此上意也鑄曰鑄豈區區為一嶽飛者強敵未滅無故戮一大將失士卒心非社稷之長計檜語塞時鑄已除執政奉使乃改命諫議大夫万俟卨為中丞以治之卨素與飛有怨遂誣飛令于鵬孫革致書張憲王貴令虛申探報以動朝廷雲與憲書令措置使飛還軍且云其書已焚飛坐繫兩月無可證者或教卨以臺章所指淮西逗遛事為言卨喜白檜簿録飛家取所賜御札御札往來日月皆可考悉收而藏之以滅跡卨誣飛常自言已與太祖皆三十歲建節為指斥乘輿又使鵬革等證飛受詔逗遛命評事元龜年取行軍時日雜定之傅㑹其獄大理卿薛仁輔寺丞李若朴何彥猷皆言飛無辜判宗正寺士􅩍請以百口保飛無他且曰中原未靖禍及忠義是忘二聖不欲復中原也皆不聽韓世忠心不平詣檜詰其實檜曰飛子雲與張憲書雖不明其事體必須有世忠曰必須有三字何以使人甘心固爭之亦不聽考異必須有史作莫須有何以使人甘心史作何以服天下今從中興紀事本末壬午以吏部侍郎魏良臣為金國禀議使知閣門事王公亮副之時烏珠遣劉光逺還要官尊望著者為使秦檜乃遣良臣癸巳樞密使韓世忠罷世忠深以和議為不然及魏良臣使金世忠諫曰中原豪傑莫不延頸以俟弔伐之師若自此與和日月侵尋人情消弱國勢委靡誰復振之北使之來乞與面議復抗疏言秦檜誤國之罪檜諷言官論之帝不聽而世忠連疏乞罷遂罷為醴泉觀使世忠懲嶽飛之事杜門謝客絶口不言兵時跨驢擕酒從一二童妓縱游西湖以自樂平時將佐罕得見其面是月金人入濠州邵隆復商虢陕州十一月己亥參知政事范同罷與職奉祠同雖附和議以獨奏事為秦檜所忌故逐之秦檜忌李光諷中丞万俟卨論光隂懷怨望與孫近朋比詔光滕州安置辛丑金烏珠以蕭毅邢具瞻為審議使與魏良臣偕來己酉雷壬子金蕭毅等入見議以淮水為界割唐鄧二州嵗幣銀絹各二十五萬許歸梓宫太后皇后帝悉從其請乙卯以何鑄簽書樞密院事充大金報謝進誓表使庚申命宰執及議誓撰文官告祭天地宗廟社稷何鑄奉誓表往其略曰臣構言今來畫疆以淮水中流為界西有唐鄧州割屬上國自鄧州西四十里外并西南盡屬光化軍為敝邑沿邉州城既蒙恩造許備藩方世世子孫謹守臣節每年皇帝生辰並正旦遣使稱賀不絶嵗貢銀絹二十五萬匹兩自壬戌年為首每春季差人般送至泗州交納有渝此盟明神是殛墜命亡氏踣其國家臣今既進誓表伏望上國早降誓詔庶使敝邑永為憑焉毅辭帝諭曰今嵗太后果還自當謹守誓約若猶未也則誓文為虛設耳辛酉福建安撫大使張浚罷為檢校少傅崇信軍節度使充萬壽觀使秦檜將議和遣工部員外郎蓋諒因事至閩中風浚使附其議當引為樞密使浚答書言敵不可縱和不可成檜不悅㑹浚以母老乞祠乃有是命十二月乙亥何鑄至汴見烏珠遂如㑹寧見金主初邵隆在商州十年披荆榛瓦礫以為治招徠流散屢敗金人值和議成割商與金隆常怏怏徙知金州嘗以兵出金境秦檜恨之復徙知敘州癸巳萬壽觀使嶽飛賜死於獄時嵗已暮而飛獄不成一日檜手書小紙付獄即報飛死矣年三十九雲與張憲皆棄市于鵬等從坐者六人令楊沂中涖其刑籍飛家資妻子遷嶺南于是薛仁輔李若朴何彥猷皆被黜布衣劉允升上書訟嶽飛寃下大理獄死凡傅成其獄者皆進秩後洪皓以蠟書奏金人所畏服者惟飛欲捐燕避之聞其死上下酌酒相賀飛少負氣節事親孝家無姬侍吳玠素服飛願與交歡飾名姝遺之飛曰主上宵旰豈大將安樂時耶却不受玠益敬服帝欲為飛營第飛辭曰國事未平何以家為或謂天下何時太平飛曰文官不愛錢武官不惜死天下太平矣師每休舍課將士注坡跳濠皆重鎧以習之卒有取民麻一縷以束芻者立斬以徇卒夜宿民開門願納無敢入者軍號凍死不拆屋餓死不鹵掠卒有疾飛躬為調藥諸將逺戍飛遣妻問勞其家死事者哭之而育其孤或以子婚其女凡有頒犒均給軍吏秋毫不私善以少擊衆嘗以八百人破羣盜王善等五十萬衆于南薰門以八千人破曹成十萬衆于桂嶺其戰烏珠于潁昌則以背嵬八百于朱仙鎮則以五百皆破其衆十餘萬凡有所舉盡召諸統制與謀謀定而後戰故有勝無敗猝遇敵不動敵為之語曰撼山易撼嶽家軍難張俊嘗問用兵之術飛曰仁信智勇嚴闕一不可每調軍食必蹙額曰東南民力耗敝極矣好賢禮士覽經史雅歌投壺恂恂如書生每辭官必曰將士效力飛何功之有然忠憤激烈議論持正不挫於人卒以此得禍十二年春正月癸卯罷樞密行府尚書省乞以嶽飛獄案令刑部鏤板遍牒諸路有進士和浹者好直言飛重禮之飛初下吏浹上書訟其寃秦檜怒併送大理獄坐決杖袁州編管先是提舉洪州玉隆觀薛弼為飛參謀官與飛厚檜之閒居永嘉也弼舊游其門万俟卨亦與之善故由是得免又有王輔者嘗知彭山縣以贓敗依飛鄂州飛亦厚待之至是輔遣其子孝忠上書指飛為姦凶隂合檜意脫罪籍尋擢知普州壬子金衍聖公孔璠卒子拯襲二月丁丑進封建國公瑗為普安郡王封崇國公璩為恩平郡王丙戌詔諸州修學宫戊子金皇子濟安生母皇后費摩氏金主年二十四始得子喜甚乃大赦告天地宗廟癸巳何鑄還自金初蕭毅至臨安帝曰朕有天下而養不及親徽宗無及矣今立信誓明言歸吾太后朕不耻和不然朕不憚用兵及何鑄曹勛往召至內殿諭之曰朕北望庭闈無淚可揮卿見金主當曰慈親之在上國一老人耳在本國則所繫甚重以至誠說之庶彼有感鑄至金首以太后為請金主曰先朝業已如此豈可輒改鑄伏地不能言勛再三懇請金主乃許歸徽宗鄭后之喪與帝母韋氏遣鑄等還三月壬寅命普安郡王瑗出就第朝朔望丙午金以烏珠為太傅辛亥放齊安郡王士􅩍于建州秦檜惡其救嶽飛也丙辰金遣左宣徽使劉筈等以衮冕圭寶珮璲玉冊冊帝為宋帝其冊文曰皇帝若曰咨爾宋康王趙構不弔昊天降喪于爾邦亟瀆齊盟自貽顛覆俾爾越在江表用勤我師旅蓋十有八年于兹朕用震悼斯民其何罪今天其悔禍誕誘爾衷封奏狎至願身列於藩輔今遣光祿大夫左宣徽使劉筈等持節冊命爾為帝國號宋世服臣職永為屏翰嗚呼欽哉其恭聽朕命筈宗彥之子也陜川宣撫副使胡世將卒以禮部侍郎鄭剛中代之剛中節制諸將尤極嚴肅每入謁必先庭揖然後就坐吳璘加少師語主閽吏乞講鈞敵之禮剛中曰少師雖尊猶都統制耳倘變常禮是廢軍容璘惶恐聽命戊午金立皇子濟安為皇太子封皇后父太尉呼達為王初制度未立嗣統者皆自諳巴貝勒即位至是立濟安始正名位定制度焉貢院上博學宏詞合格人京官洪遵選人沈介洪適詔賜遵出身適同出身介循一資介德清人遵適皆皓子也皓久在敵中至是和議定皓報太后歸耗辛酉宰執賀太后有來期帝曰洪皓身陷敵區乃心王室誠可嘉也二子並中詞科亦忠厚之報遂授遵館職適敇局删定官自中興以來詞科中選即入館自遵始夏四月甲子朔遣孟忠厚為迎護梓宫禮儀使王次翁為奉迎兩宫禮儀使庚午賜禮部進士陳誠之以下二百五十四人及第出身初秦檜無子取妻兄王㬇孽子熺養之至是舉進士考官擢為第一故事凡有官者赴試謂之鎖㕔人鎖㕔人不為狀元自皇祐初沈文通始政和末王昂榜嘉王楷亦降為第二熺時已除職檜以為嫌引故事辭㑹誠之䇿專主和議遂擢為第一而熺次之特遷左朝奉郎通判臨安府賜五品服時同年皆謁熺唯臨川李浩不往戊寅封韋淵為平樂郡王金五雲樓重明等殿成辛巳皇后邢氏凶問至后以九年六月庚戌崩于五國城金人祕之至是始聞喪帝為輟朝行釋服之祭諡懿節皇后祔神主于别廟考異宋史髙宗紀云紹興九年六月庚戌皇后邢氏崩於五國城十二年四月丁卯皇太后偕梓宫發五國城金遣完顔宗賢劉祹護送梓宫髙居安護送皇太后邢皇后傳云九年崩於五國城金人祕之顯仁太后回鑾始得崩問金史熙宗紀云皇統二年三月丙辰歸宋帝母韋氏及故妻邢氏天水年郡王并妻鄭氏喪於江南三朝北盟會編云紹興十二金人許還徽宗皇帝寧德皇后梓宫及皇太后皇后又云金國以徽宗顯肅梓宫及皇太后邢皇后還邢皇后中途上仙至是皇太后及三梓宫入楚州界按金史北盟㑹編與宋史所載不同未審孰是蓋邢后實崩於九年金人祕之許歸者其謾詞也及和議已成事不可掩而又欲匿其祕喪之情則紿曰既行而殂以梓宫來歸北盟㑹編云中途上仙是不辨其詐而遂以為實也顯仁太后還確知其崩日故宋史據實言之九年書邢后崩而是年於何鑄之還不言許歸邢后然又云以王次翁為奉迎兩宫禮儀使兩宫者何太后邢后也藉令何鑄使還金人不許歸邢后安得有奉迎兩宫之名耶四月辛巳之凶問其為金人之詭計也明矣今邢后崩年月日則從宋史金人許歸兩宫則從金史及北盟㑹編九年不書崩至是因凶問而詳言其故若中途上仙之說宋金二史皆無明文姑闕之甲申增修臨安府學為太學五月乙巳初置榷場于盱眙凡𣙜場之法商人資百千以下者十人為保留其貨之半在場以其半在泗州𣙜場博易俟得北貨復易其半以往大商悉拘之以待北賈之來兩地商人各處一廊以貨呈主管官牙人往來評議毋得相見每交易千錢各收五釐息錢入官其後又置於光州棗陽安豐軍金亦於壽鄧二州鳯翔府各置𣙜場金主自去年荒于酒與近臣飲或繼以夜宰相入見輒飲以酒曰知卿等意今既飲矣明日當戒因復飲辛酉宴羣臣于五雲樓皆盡醉而罷六月辛未安置王庶于道州御史胡汝明論其譏訕朝政故也初興元府有六堰引褒水溉民田數千頃故漢中地稱膏腴兵興以來嵗久弗治至是川陕宣撫都統制楊政率衆修復偶夏水隄决政親往督役其後堰成省漕運二十餘萬石又城南並䕃江岸水數至城下政仍作長隄捍之水遂趣南岸城賴以安諫官羅汝楫劾福建僉判胡銓飾非橫議秋七月壬辰朔除名新州編管丁酉金賜太傅烏珠金劵八月辛酉朔金烏珠以書來求商州及和尚方山二原地初朝廷遣川陜宣諭使鄭剛中照舊吳玠劉豫所管分畫地界宣撫副使胡世將奏秦商二州元不係玠所管合自二州以南為界惟和尚原係玠立寨元非劉豫地分宜依舊保守如悉為彼占則四川並無限隔雖興州殺金平仙人原稍險别有平路得以入川利害灼然不可許至是剛中言和尚原自紹興四年後便屬劉豫非吳玠地分當割還大金從之丙寅簽書樞密院事何鑄罷秦檜以鑄不傅㑹嶽飛之獄怨之諷万俟卨論其過欲竄諸嶺表帝不許遂出知徽州尋責授祕書少監徽州居住辛未金復封太宗子呼嚕為王甲戌以御史中丞万俟卨參知政事充大金報謝使壬午皇太后韋氏至自金后有智慮初聞金人許還三梓宫后恐其反覆呼役者畢至然後起攢宫時方暑金人憚行后慮有他變乃陽稱疾須秋凉進發既而稱貸于金使得黃金三千兩以犒其衆由是途中無虞后將發淵聖卧車前泣曰歸語九哥與丞相我得太一宫使足矣他不敢望也后許之誓而别及歸帝至臨平奉迎見后喜極而泣后以北方聞韓世忠名召至簾前曰此為韓相公耶慰問良久至臨安入居慈寧宫始知朝議遂不敢述淵聖車前之語己丑帝易緦服百官亦如之奉迎徽宗及顯肅懿莭二后梓宫奉安于龍德别宫初靖康之亂柔福帝姬隨北狩建炎四年有女子詣闕稱柔福自金濳歸詔遣老宫人視之其貌良是問以宫禁舊事略能言倣佛帝惻然不疑即召入宫封福國長公主下降髙世榮資粧一萬八千緡至是太后回鑾言柔福死久矣始知其詐執付詔獄乃開封尼李善靜也善靜嘗遇一宫婢謂子貌甚類柔福因告以宫禁事教之為詐計其前後請給賜賚凡四十七萬九千緡詔杖殺之金歸孟庾李正民川陜宣撫副使鄭剛中分畫陜西地界割商秦之半以畀金存上津豐陽天水三縣及隴西成紀餘地棄和尚方山二原以大散關為界于是宋僅有兩浙兩淮江東西湖南北蜀福建廣東西十五路而京西南路止有襄陽一府陜西路止有階成和鳯四州凡有府州軍監一百八十五縣七百三而已九月乙未以孟忠厚為樞密使充攢宫總護使秦檜欲罷張俊樞密之任乃假忠厚樞密使且外示加寵于戚里壬寅大赦乙巳加秦檜太師封魏國公檜入朝賜以玉帶使服之檜辭帝曰梓宫歸葬慈親就養皆卿之功也此未報百分之一不必辭先三年通和赦河南新復州軍樓照草赦金烏珠讀之謂不歸德其國遂指為釁以起兵至是檜懼當制者不能悅金遂屬其黨程克俊為文曰上穹悔禍副生靈願治之心大國行仁遂子道事親之孝可謂非常之盛事敢忘莫報之深恩而况中遣使軺許惇盟好來存殁者萬餘里慰契闊者十六年禮備送終大啓固陵之吉壤志申就養日承長樂之慈顔四方遺黎讀之有泣下者丙午金使劉筈等九人入見戊申以王次翁充大金報謝使藏金誓詔于內侍省遣沈昭逺如金賀生辰楊願賀正旦賀禮俱用金茶器千兩銀酒器萬兩錦綺千匹金循遼例不欲兩接使人故併遣使嵗以為常冬十月乙丑始聽中外用樂丙寅攢徽宗皇帝及顯肅皇后于㑹稽永固陵以懿節皇后祔尋改陵曰永裕乙亥以翰林學士程克俊簽書樞密院事丁丑以皇太后回鑾進封秦檜為秦魏兩國公檜以封兩國公與蔡京同辭不拜丁亥置福建路提舉茶司事十一月壬辰左朝散郎建陽黃達如言太后回鑾梓宫還闕兹為盛事望宣付史館然後褒功罰罪大明黜陟將前日異論沮謀者明正典刑其力主和議者重加旌賞庶上慰徽宗二后在天之靈少紓太母留滯抑鬱不平之氣詔禮部侍郎兼實録修撰王賞編付史館達如嘗知南雄州以贓罪為提㸃坑冶官韓球所按代還奏事乃上此奏焉癸巳樞密使張俊罷初俊贊秦檜成和議約盡罷諸將獨以兵權歸俊及和議定諸將罷而俊無去意檜諷侍御史江邈論之言俊據清河坊以應䜟兆占承天寺以為宅基大男楊存中握兵于行在小男田師中擁兵于上流他日變生禍不可測帝曰俊有復辟功無謀反事㑹樞密使孟忠厚竣事還朝而邈又言俊之過俊乃求去位遂罷為節度使充醴泉觀使進封清河郡王奉朝請左司員外郎李椿年言經界不正十害一侵耕失稅二推割不行三衙前及坊場户虛供抵當四鄉司走㺯稅名五詭名寄産六兵火後稅籍不信爭訟日起七倚閣不實八州縣隱賦多公私俱困九豪猾户自陳稅籍不實十逃田稅偏重故稅不行且言臣聞平江歲入昔七十萬斛有竒今按其籍惟三十九萬餘然實入才二十萬耳詢之土人皆欺隱也望考按核實自平江始然後施之天下則經界正而仁政行矣上謂宰執曰椿年之論頗有條理秦檜亦言其說簡易可行乃詔椿年措置椿年請先往平江諸縣俟就緒即往諸州要在均平為民除害更不增嵗額從之以知鎮江府劉子羽提舉江州太平觀先是子羽言和好本非久逺計宜及閒暇修城壘厲器械備舟楫以俟時變秦檜始以子羽復職由張浚所薦己不悅至是益怒諷諌官羅汝楫論其專任私意變亂是非遂罷歸己亥禁貶謫人私至臨安庚子作崇政垂拱二殿辛丑楊國公劉光世卒帝臨奠贈太師諡武僖光世在諸將中最先進律身不嚴馭軍無法不肯為國任事嘗入對言願竭力以報國他日史官書臣功第一帝曰卿不可徒為空言當見之行事建炎初結內侍康履以自固又早解兵柄與時浮沈不為秦檜所忌故能竊寵榮以終其身徽猷閣待制致仕尹焞卒于紹興府帝知其貧特賜錢三百緡焞質直𢎞毅實體力行程頥嘗曰我死而不失其正者尹氏子也學者稱為和靖先生寶文閣直學士綦崇禮卒崇禮聰敏絶人獨覃心辭章晚始登第以縣主簿驟升華要端方亮直不憚強禦秦檜初罷政崇禮草詞顯著其惡檜深憾之及再相矯詔下台州就崇禮家索其藁自于帝前納之且將修怨而崇禮已殁樓鑰叙其文以為當書命之任明白洞達雖武夫逺人曉然知上意所在人稱為北海先生詔祕書少監秦熺修日厯庚戌樞密使孟忠厚罷忠厚始以外戚貴顯然能避權勢不以私干朝廷秦檜忠厚之僚壻也未嘗親附世以此重之至是山陵畢檜諷臺諫引故事外戚不預政罷之以少傅知建康府加張中孚開府儀同三司中彥靖海軍節度使辛亥並遣還金十二月癸未以太師秦檜生辰賜宴於其第自是嵗為例金皇太子濟安病劇金主與皇后詣佛寺焚香流涕哀禱曲赦五百里內罪囚甲申太子卒諡英悼葬興陵之側金主送至烏濟赫水而還命工塑其像于儲慶寺金主與皇后詣寺安置之初陜西連嵗不雨至是涇渭灞滻皆竭五穀焦槁秦民無以食爭西入蜀鄭剛中以誓書所禁不敢納皆散去餓死其壯者北人多買為奴婢郡邑蕩然矣西遼感天后蕭氏卒子夷列立改元紹興籍民十八嵗以上者得八萬四千五百十三年春正月癸巳醴泉觀使韓世忠請以其私産及上所賜田租計從來未輸之稅并歸之官從之仍賜詔奬諭戊戌加上徽宗諡曰體神合道駿烈遜功聖文仁德憲慈顯孝皇帝己亥親饗太廟奉上册寶癸卯建國子監太學以嶽飛宅為之乙巳詔大理寺丞袁柟燕仰之往靜江府推勘提舉江州太平觀胡舜陟不法事先是舜陟帥廣西因奉詔討郴賊駱科餘黨饋餉不繼與轉運副使吕源有隙源即奏舜陟贓汙僣擬傲慢不恭又以書抵秦檜言舜陟非笑朝政檜素惡舜陟遂奏遣柟等雜治二月丙寅封韓世忠為咸安郡王張俊勳譽在世忠左特以主和議為秦檜所厚顧先得王至是世忠輸積年租賦于官乃有是命先是詔試進士兼用經義詩賦國子司業髙閌言取士之法國初循唐制用詩賦神宗始以經術造士遂罷詩賦又慮不足以盡人材乃設詞學一科試以雜文帝曰詩賦亦雜文也閌曰取士以經義為主不過三場後加詩賦為四場不能無礙蓋太學之法旬有課月一周之月有試季一周之若加一場則課試之法遂紊自元祐以來雖增為四場終不可行者蓋以此也今欲以經義第一詩賦第二論䇿第三帝可其奏庚辰閌具分三場乞永為定式辛巳祕書少監秦熺上建炎以來日厯五百九十卷秦檜自知不為士論所與乃以熺領國史取其罷相以來一時詔㫖章疏稍及于己者悉皆更易焚棄日厯時政記亡失已多不復可考是後凡所記録莫非其黨姦佞之辭不足以傳信天下後世矣乙酉建景靈宫以劉光世賜第為之遣官自溫州奉迎祖宗神御至遂詣天章閣西殿告遷徽宗及顯恭顯肅二后神御併奉安之三月辛卯金以尚書左丞朂為平章政事朂本名烏葉光懿皇后忌辰金主將出獵朂諫而止金主日與近臣酣飲莫能諫止朂上疏諫乃為止酒丁酉金太皇太后唐古氏殂于明德宫乙巳築太社太稷壇丙午築圜丘於龍華寺之西賑淮南饑民仍禁遏糴己酉金封皇子道濟為魏王封其母為賢妃道濟初居外至是養之宫中夏四月癸酉頒鄉飲酒儀于郡國祭酒髙䦎草上儀也僎介之位皆與古制不合慶元中朱熹以儀禮改定學者皆遵用之主賔僎介之位始有定說甲戌毁獄吏訊囚非法之具殿中侍御史李文㑹論寄居士大夫干擾州縣望嚴加戒約儻或不悛令監司郡守密具姓名聞奏重置典憲從之時士大夫與秦檜異論者多奉祠里居或僑寄他郡自是以次被罪是月䝉古復叛金金主命將討之閏月己丑立貴妃吳氏為皇后后開封人年十四選入王邸帝既即位后常以戎服侍左右習書史善翰墨寵遇日隆纍進貴妃帝憐邢后在金虛中宫以待其還至是秦檜纍表請立后皇太后亦以為言帝從之檜兄直學士院秦梓草詞遂以梓為翰林學士提舉洪州玉隆觀胡思直顯謨閣徐林坐議沮經界停官逺徙壬寅詔民田不上稅簿者沒入稅簿不謹書者罪官吏時兩浙轉運副使李椿年行經界法量田不實者罪至徒流江山尉汪大猷白椿年曰法峻民未喻固有田少而供多者願許陳首追正椿年為之輕刑戊申命史館編靖康建炎忠義録乙卯參知政事王次翁罷初太后回鑾次翁為奉迎扈從禮儀使時金使責貸金於太后然後許入境次翁以未得秦檜命堅不肯償相持境上凡三日中外憂慮副使王㬇裒金與之太后始得歸見帝泣訴其事曰王次翁不顧國家利害萬一有變則我子母不相見矣帝震怒欲暴其罪誅之次翁先白檜且道不敢專與之故檜大喜力為營救而帝怒不解故罷檜當國凡居政府者莫不以微忤斥始終不二于檜者惟次翁一人五月甲子張九成坐黨趙鼎謫居南安軍九成既免喪秦檜取㫖上曰自古朋黨畏人主知之此人獨無所畏可與宫觀先是徑山僧宗杲善談禪理從游者衆九成時往來其間宗杲嘗抗論和議檜深惡之編配宗杲至是右司諫詹大方言頃者鼓唱浮言九成實為之首僧宗杲從而和之今宗杲已逺竄為首者豈可置而不問望罷九成宫觀投之逺方以戒傾邪故有是命九成在南安十四年每執書就明倚立庭甎嵗久雙趺隱然廣帥致籯金九成曰吾何敢茍取悉歸之中書舍人楊願請依唐乾元及國朝故事令天下置故生池祝聖壽乙亥詔諸路監司措置申省丁丑天申節宰臣率百官上壽始用樂郡縣錫宴如承平時臨安府及屬縣並獄空甲申詔奬守臣王㬇是日金初立太廟社稷六月癸巳壽星院乞撥放度牒上曰朕觀昔人惡釋氏者即非毁其教好釋氏者即崇尚其徒二者皆不得中朕于釋氏但不使其太盛耳言者皆欲多鬻度牒以資國用朕謂不然一度牒所得不過一二百緡而一夫不耕其所失豈止一度牒之利若住撥十數年其徒當自少矣壬寅簽書樞密院事程克俊罷以万俟卨兼權簽書樞密院事庚戌通問使洪皓張邵朱辨還自金自建炎以來奉使如金被拘囚者三十餘人多物故惟三人以和議成許歸已而金人遣七騎追之及淮而皓等已在舟中矣皓居冷山距㑹寧二百里地苦寒穴居百餘家陳王烏克紳聚落也烏克紳敬皓使教其子或二年不給衣食盛夏衣粗布嘗大雪薪盡以馬矢然火煨麵食之或獻取蜀䇿烏克紳特以問皓皓力折之烏克紳鋭意南侵曰孰謂海大我力可乾但不能使天地相拍耳皓曰兵猶火也弗戢將自焚自古無四十年用兵不止者又數為言所以來為兩國事既不受使乃令深入教小兒非古者待使臣之禮也烏克紳或答或默忽發怒曰汝作和事官而口硬如此謂不能殺汝耶皓曰自分當死顧大國無受殺行人之名願投之于水以墜淵為辭可也烏克紳義之而止皓屢因諜者密奏敵情且力言和議非計乞興師進擊性勇於為義當艱危中不少變懿節皇后之戚趙伯璘𨽻烏克紳麾下貧甚皓每賙之范鎮之孫祖平為傭奴皓言于其主而釋之劉光世庶女為人豢豕贖而嫁之其他貴族名家子流落于北者無不盡力拯救留金十五年而還入對內殿力求郡養母帝曰卿忠貫日月志不忘君雖蘇武不能過豈可舍朕去耶請見慈寧宫帟人設簾太后曰吾故識洪尚書命撤之皓退見秦檜語連日不止曰張和公金人所憚乃不得用錢塘暫蹕而景靈宫太廟皆極土木之華豈非示無中原意乎檜不懌謂其子書省正字適曰尊公信有忠節得上眷但官職如讀書速則易終而無味須如黃鍾大吕乃可遂除徽猷閣直學士提舉萬壽觀邵初被囚柞山踰年送劉豫使用之邵見豫長揖而已又呼豫為殿院責以君臣大義詞氣俱厲豫怒械于獄久之復送于金拘之燕山僧寺從者皆莫知所之邵又以書言于金曰劉豫挾大國之勢日夜南侵不勝則首鼠兩端勝則如養鷹飽則揚去終非大國之利金人徙之㑹寧及還入見除祕書修撰主管佑神觀司諫詹大方論其使事無成改台州崇道觀辨初副王倫使金既就館守之以兵久之金將議和當遣一人受書還欲辨與倫探䇿決去留辨曰吾來固自分必死豈應今日覬幸先歸願正使受書歸報天子成兩國之好早申四海之養于兩宫則吾雖暴骨外國猶生之年也倫將歸辨謂曰古之使者有節以為信今無節有印印亦信也願留之使辨得抱以死死不腐矣倫解以授辨辨受而懷之卧起與俱金人迫辨仕劉豫且訹之曰此亦南歸之漸辨曰豫乃國賊吾嘗恨不食其肉忍北面臣之乎吾有死耳金人怒絶其餼遺以困之辨固拒驛門忍飢待盡誓不為屈金人亦感動致禮如初久之復欲易其官辨曰自古兵交使在其間言可從從之不可從則囚之殺之何必易其官吾官受之本朝有死而已誓不易以辱吾君也又以書訣洪皓曰殺行人非細事吾曹遭之命也要當舍生以全義耳乃具酒召被掠士夫飲半酣語之曰已得近郊某寺地一旦畢命報國諸公幸瘞我其處題其上曰有宋通問副使朱公之墓于我幸矣衆皆泣下莫能仰視辨談笑自若曰此臣子之常諸君何悲也及尼瑪哈死辨密疏金國虛實曰此不可失之時也遣李發間行歸報王倫還以辨奉徽宗大行之文為獻帝讀之感泣官其親屬五人謂丞相張浚曰辨歸日當以禁林處之至是入見便殿辨謝且曰人之所難得者時而時之運無已事之不可失者幾而幾之藏無形惟無已也故來遲而難遇惟無形也故動微而難見陛下與金人講和上返梓宫次迎太母又其次則憐赤子之無辜此皆知幾之明然時運而往或難固執幾動有變宜鑑未兆盟可守而詭詐之心宜默以待之兵可息而銷弭之術宜詳以講之金人以黷武為至德以茍安為太平虐民而不恤民廣地而不廣德此皆天助中興之勢若時與幾陛下既知於始願圖厥終帝曰善賜賚甚厚秦檜惡其言敵情奏以初補官易宣教郎直祕閣而卒帝書六經刻石于太學袁柟燕仰之至靜江以胡舜陟屬吏居兩旬辭不服而死于獄舜陟再守靜江有惠愛邦人聞其死皆為之哭丐者亦斂數十千致祭既而舜陟妻汪氏訴于朝詔通判德慶府洪元英究實元英言舜陟事涉曖昧其得人心雖古循吏無以過帝謂秦檜曰舜陟從官兼罪不至死勘官不可不懲遂送柟仰之吏部時䖍冦擾江西浸及閩廣而州縣多無備又兵官有常屯不敢越他界以故賊得往來如志環數千里民被其害侍御史李文㑹言州縣事同一家願令三路帥臣監司共議合兵將以據要衝仍令期㑹共為掩襲使賊出輒遇兵則竄無所逃庶易于滅從之秋七月甲子詔求遺書壬申雨雹癸未奉安至聖文宣王于國子監大成殿命秦檜行禮時監學初成帝自題賜書閣榜曰首善八月戊申金葬欽仁皇后于恭陵初錢塘江有石隄以捍水故無水患嵗久隄且圮乃置捍江兵二千人專令採石修隄人以為便其後壯者以給他役弱者且不可用蓋僅存十之一或謂近嵗潮頭東激而沙磧西湧故西岸雖不治而自固至是侍御史李文㑹言水勢不常方潮頭東激正西岸宜修之時乞詔補捍江兵仍稍增其數使專採石修隄如曩制則潮不能為患從之九月丁巳宗室子稱卒于秀州命安普郡王瑗為子稱解官持服甲子權直學士洪皓出知饒州時金人來取趙彬輩三十人家屬詔歸之皓曰昔韓起謁環于鄭鄭小國也能引義不與金既限淮官屬皆吳人宜留不遣若遽從之彼謂秦無人益輕我矣檜變色曰公無謂秦無人既而復上疏言恐以不與之故或致渝盟宜告之曰俟淵聖及皇族歸乃遣又言王倫郭元邁以身徇國棄之不取緩急何以使人檜大怒初檜在金軍中達蘭攻楚州久不下命檜草檄諭降有實訥者在左右知狀皓與檜語及金事因曰憶實訥否别時托寄聲檜意士大夫莫有知者聞皓語深以為憾遂令李文㑹奏皓不求省母檜進呈因及宇文虛中事上曰人臣之事君不可有二心有二心者春秋之法所不赦乃命出皓考異達蘭宋史秦檜在傳作尼雅滿誤按檜達蘭軍中與之善故令檜也草檄未嘗在尼雅滿軍中冬十月庚寅製渾天儀靖康之變五儀悉歸于金至是更謀制作十一月庚申日南至合祀天地于圜丘大赦十二月癸未朔日食雲隂不見秦檜率百官表賀自是率如之逮檜卒乃止庚寅秦檜以瑞雪應時率百官表賀自是嵗以為常癸巳賜喜雪御筵于尚書省初復故事也建祕書省乙巳秦檜辭生日賜宴詔曰以不世之英值難逢之㑹始生之日可不為天下慶乎宜服異恩無守沖節檜每生日四方獻壽者以金玉為不足搜世間之希竒以媚之錫賚踵至賜教坊樂佐酒一日伶人作雜劇之戲子熺笑言微髙檜目之少頃檜起更衣而不出其妻王氏使人伺之乃在一室中默坐蓋嘆其子不足以相副也己酉金遣完顔煜等來賀明年正旦以金酒器六事綾羅紗縠三百端馬六匹為禮自是使命往復不絶嵗遺物數亦無增損是月始頒來嵗厯于諸路復置三館上謂宰執曰人才須素養太宗置三館養天下之士至仁廟人才輩出今日若不興學校將來安得人才用耶是嵗行人宋汝為自金逃歸作恢復方略獻于朝秦檜置之不問以為通直郎汝為遂上檜書言金人轉輸淮北慮秋冬必復猖獗烏珠不死兵革不休雖欲各保邉陲安可得也檜惡其言欲縛送于金汝為乃變姓名為趙復徒步入蜀十四年春正月丁卯提舉江州太平觀黃龜年落職福州居住龜年為御史嘗論秦檜之罪故也戊申內出鎮圭付國子監以奉文宣王丁巳遣羅汝楫報謝金國是月樂平水鬭河衝里閭田隴數十百頃田中水類為物所吸聚為一直西行髙平地數尺不假隄防而自行里南程氏家井水溢髙數尺夭矯如長虹聲如雷穿墻毁樓二水鬬于杉墩且前且却約十餘刻乃解各復故二月辛卯復置教坊凡樂工四百十六人以內侍充丙午參知政事万俟卨罷初卨自金還秦檜假金人譽已數千言屬卨以聞卨難之他日奏事退檜坐殿廬中批上㫖輒除所厚者官吏箝紙尾進卨拱手曰不聞聖語却不視檜大怒自是不交一語諷中丞李文㑹諫議詹大方論之卨遂求去帝命以資政殿學士出守及入謝上問勞甚悉檜愈怒給事中楊願因封還録黃遂命提舉江州太平觀己酉以資政殿學士知建康府樓照簽書樞密院事兼權參知政事三月丁卯避金太祖嫌名改岷州為西和州又改川陜宣撫為四川宣撫司以陜西地盡入于金故也太學文宣王廟成司業髙閌表請臨視帝從之己巳幸太學止輦于大成殿門外步趨升降退御敦化堂命禮部侍郎秦熺執經髙閌講易泰卦學官內外舍生推恩有差即除閌禮部侍郎于是帝親製文宣王及七十二子贊並刻石置于太學右承務郎胡宏見閌表遺書責之曰太學明人倫之所在也太上皇帝劫制于強敵生往死歸此臣子痛心切骨卧薪嘗膽必報之大讐也太母天下之母其縱釋在金人此中華之大辱臣子所不忍言也而柄臣乃敢欺天罔人以大讐大辱為大恩乎昔晋廢太后董養游太學升堂嘆曰天人之理既滅大亂將作矣則逺引而去今閣下目覩忘讐逆理北面強敵以茍晏安之事猶偃然為天下師儒之首既不能建大論明天人之理以正君心乃阿諛柄臣希合風㫖求舉太平之典又從而為之辭是黨其惡也豈不與董養異哉宏寅之弟也壬申解潛坐黨趙鼎責授濠州團練副使南安軍安置時福建羣盜未滅而海賊朱明熾甚夏四月辛巳詔統制官張守忠往討之未幾悉降丙戌命秦檜提舉製渾儀以內侍邵鍔專領其事詔有司求蘇頌遺法來上帝謂檜曰宫中已製成小範可測天象日以晷度夜以樞星為則非久降出用之為式但廣其尺寸耳丁亥初禁野史時著作郎林機希秦檜意因言有失意之人匿跡近地窺伺朝廷作為私史以售其邪說檜遂請下詔禁之甲午金人來求淮北人之在南者詔願者聽還五月丙辰饒州言右迪功郎姜樓等獻錢十萬緡以助國用帝曰國用有常自不至闕不然雖多亦有不足之患其還之甲子簽書樞密院事樓照罷為李文㑹所劾故也乙丑李文㑹言禮部侍郎髙閌工部侍郎王師心起居舍人吳秉信此三人者若久在朝必害至治詔出閌知筠州師心知袁州秉信知江州先是上在經筵嘗與閌論張九成在何處檜曰九成頃以倡異惑衆為臺臣所論既與郡乃乞祠觀其意終不為陛下用帝曰九成清貧不可無祿檜疑閌薦之呼給事中楊願詢其事文㑹即劾閌是日拜文㑹簽書樞密院事自是執政免即以言者代之丙寅婺州大水初兩浙轉運副使李椿年置經界局於平江守臣周葵問曰公今欲均賦耶或遂增稅也椿年曰何敢增稅葵曰茍不欲增胡為言本州七十萬斛椿年曰若然當用圖經三十萬數為准時秦檜怒葵不已椿年因奏葵在郡錫宴北使飲食臭腐致行人有辭甲戌葵坐落職奉祠自是投閒十一年是月嚴信衢建四州水六月辛巳朔日有食之考異宋史髙宗紀天文志是年六月辛巳朔日食不書今據金史熙宗紀録之以右朝奉郎曽惇知台州惇嘗獻秦檜詩稱為聖相故以郡守處之自檜擅權凡投書啓者以臯䕫稷卨為不足比擬必曰元聖或曰聖相乙未賑閩浙被水之民內侍白鍔從太后北歸者因宣言閩浙大水燮理乖盩洪皓名聞中外胡不用鍔館客張伯麟嘗題太學壁云夫差而忘越人之殺而父乎秦檜怒之至是俱下獄丙申鍔坐誹謗刺配萬安軍伯麟亦刺配吉陽軍御史中丞詹大方遂奏皓與鍔為刎頸交更相稱譽然鍔初不識皓也特以從太后在金素聞皓名故為是言丁酉罷皓提舉江州太平觀甲辰淮東轉運判官湯鵬舉言五月乙亥楚州鹽城縣海清秦檜請賀帝不許乙巳詔國子監置小學秋七月戊午同簽書樞密院事王倫為金人所殺倫留居河間者六年至是金人欲以為河間平灤三路都轉運使倫已受命復辭金主曰此反覆之臣也俾縊殺之倫厚賂使人少緩冠帶南向再拜慟哭乃就死倫子述與從兄遵間入金境至河間得倫骨以歸官給葬事後諡愍節考異宋史王倫傳云倫死河間地震雨雹三日不止人皆哀之按金史熙宗紀是年十一月壬辰以河朔諸郡地震詔復百姓一年而七月不書地震雨雹所震亦不止河間藉令河間于是月地震亦復于倫死何涉耶蓋當時諛墓者傅㑹之辭不足信也庚午金建原廟于東京祕書省成丙子帝臨視八月癸未金主殺其子魏王道濟九月辛酉分利州為東西路壬申徙趙鼎吉陽軍安置秦檜怨鼎凡鼎所善者如張九成折彥質張戒解潜辛承宗皆指為鼎黨貶斥之鼎在潮五年杜門謝客絶口不言時事有問者惟自引咎而已先是鼎請正建國公皇子之號檜言鼎欲立皇太子是待陛下終無子也宜俟親子乃立至是中丞詹大方希檜意劾鼎與其黨范沖邪謀密計轉相扇惑以徼無妄之福蓋指皇子而沖嘗為翊善故也是日帝謂宰執曰可遷鼎逺地庶其門生故吏知不復用遂有是徙鼎謝表有曰白首何歸悵餘生之無幾丹心未泯誓九死以不移檜見之曰此老倔強猶昔遂必欲殺之以鼎在潮日録事參軍石恮待之有禮遂除恮名編管潯州癸酉命臨安府索蔡京子孫逮赴貶所遇赦永不量移從侍御史汪勃言也冬十月甲午右正言何若請戒內外師儒之官黜程頥張載之學禁絶遺書俾勿傳誦從之庚子詔州縣文臣初至官詣學祗謁先聖乃許視事從前知永州羅長源言也十一月甲子帝即宫中閲試三衙將士自是嵗以冬月行之號內教知藤州周誘李光唱和其間言及和議有諷刺者積得數篇密獻于秦檜檜怒令楊願論之癸酉徙光瓊州安置乙亥觀文殿學士提舉洞霄宫朱勝非卒勝非張邦昌友壻也始邦昌僣位勝非常械其使及金人過江勝非請尊禮邦昌録其後以謝敵苖劉之變保護功居多然忌趙鼎出之宣撫川陕為清議所抑壬辰金立借貸飢民酬賞格甲辰以河朔諸郡地震詔復百姓一年其壓死無人收葬者官為斂藏之陜西蒲解汝蔡等處因嵗饑流民典雇為奴婢者官給絹贖為良放還其鄉是月金黃龍府之北大雪色赤如血至暮方消十二月丁酉簽書樞密院事李文㑹罷尋責筠州居住以中丞楊願論之不已故也自秦檜再相每薦執政必擇世無名譽柔佞易制者不使預事備員書姓名而已百官不敢謁執政州縣亦不敢通書問如孫近樓照范同万俟卨程克俊及文㑹等不踰年必以罪罷尚慮復用多使居千里外州軍且令人伺察之庚子以御史中丞楊願簽書樞密院事願舉劾迎秦檜意人號為肉簡牌至是論李文㑹遂代其位資治通鑑後編卷一百十五
