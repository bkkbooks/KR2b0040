body:
  text: 資治通鑑後編卷二刑部尚書徐乾學撰宋紀起重光作噩正月盡𤣥黓閹茂六月凡一年有竒太祖啓運立極英武睿文神德聖功至明大孝皇帝建隆二年春正月丙申朔御崇元殿受朝退羣臣詣皇太后宫門稱賀壬寅幸造船務觀習水戰太僕少卿王承哲坐舉官失實責授殿中丞己酉帝御明德門觀燈宴從臣江南吳越使皆與焉周顯德末遣官度民田多為民所訴至是帝謂宰臣曰度田本欲勤恤下民而近者弊愈甚今當慎選其人以副朕意丁巳分遣常參官詣諸州度民田詔浚蔡渠通淮右之漕也以右領軍陳承昭督其役蔡渠後改為惠民河承昭初見顯德四年己未遣郭玘饗周廟甲子斬澤州刺史張崇詁以其黨李重進也監修王溥等上唐會要一百卷唐德宗時蘇冕始撰會要四十卷武宗時崔鉉又續四十卷溥等於是采宣宗以降故事共勒成一百卷詔藏史館遣使賜錢俶戰馬二匹羊五千槖駝三十二月丙寅幸飛山軍營閲炮車遼主釋其弟宋王舍音於獄辛未浚五丈河通東北之漕也亦命陳承昭督之汴都仰給漕運嵗調丁夫浚河糧皆自齎帝初即位即詔官給其食至是復謂侍臣曰煩民奉巳之事朕必不為開導溝洫以濟京邑蓋不獲巳耳後改為廣濟河荆南高保朂進黃金什器丁丑唐主景遣使來賀長春節己卯命通事舍人王守貞使江南勞唐主遷都先是藩鎮率遣親吏視民租入槩量增溢公取餘羡符彥卿在天雄軍取民尤悉帝於是遣常參官分主其事仍出公粟賜彥卿以愧其心乙卯詔禁民二月至九月無得採捕彈射著於令令文武官及百姓自今長春節及他慶賀不得輒有貢獻是月唐主景遷都南昌南唐建南都于洪州立吳王從嘉為太子監國守建康洪州迫隘宫府營廨十不容一二羣臣日夜思歸唐主悔怒欲誅始謀者北望金陵鬱鬱不樂樞密副使給事中唐鎬慚懼發瘍卒鎬初見顯德六年七月縊考異江南野史云嗣主怒鎬阿㫖欲致極法鎬懼死五代史及李燾長編云發病卒今從南唐書三月丙申內酒坊火坊與三司接火作之夕役夫突入省署盜官物上以酒坊使左承規等縱其為盜斬酒工五十人承規等皆棄市考異按長編云乘火為盜者五十人擒斬三十八人則非役夫也又云左承規等坐以酒工為盜棄市其說與鄭公寶訓所載相反蓋作坊與三司接酒工乘火入三司省署盜官物也别盜安得至此酒工既為盜則應斬酒坊使縱下為盜則應棄市其事甚明白長編支離舛錯今從寶訓富弼曰先朝行威令雖不為常法蓋取凶暴者行之以警於衆使人人畏懼不敢有犯是因威刑以至于省刑也辛亥以雄武節度使太原郡王掖人王景為鳳翔節度使充西面沿邊都部署景起兵伍性謙退每朝廷使至雖卑位皆盡禮或言王位尊崇不宜過自損抑景曰人臣重君命固當如此我惟恐不謹耳至是自秦州來朝帝優待之宴賜加等復遣鎮鳳翔北漢冦麟州防禦使楊重勳擊走之重勳即重訓也避周恭帝諱改今名重訓初見廣順二年顯德四年從麟州來降即命為防禦使遼司徒鄂勒濟子特爾格誣告其父謀反復詐乘𫝊及殺行人以其父請杖而釋之考異遼史穆宗紀書此事以辛亥繫二月案二月無辛亥蓋史脫三月字也今正之癸亥帝步自明德門幸作坊宴射酒酣顧前鳳翔節度使王彥超曰彥超初見廣運三年卿曩在復州朕往依卿卿何不納我彥超降階頓首曰當時臣一刺史耳勺水豈可容神龍乎使臣納陛下陛下安有今日帝大笑而罷閏月甲子朔彥超上表待罪於私第帝遣使慰撫之因謂侍臣曰沈湎於酒何以為人朕或因宴會至醉經宿未嘗不悔也侍臣皆再拜考異宋史太祖本紀云閏三月幸玉津園謂侍臣曰沉湎非令儀朕宴偶醉恆悔之按幸玉津園在己巳相去數日必王彥超事誤移于下耳李燾亦曰本紀及舊録皆於閏月甲子初一日也與癸亥實相接蓋因王彥超上表待罪故云殿前都㸃檢鎮寧軍節度使慕容延釗罷為山南西道節度使侍衛親軍都指揮使韓令坤罷為成德節度使自是殿前都㸃檢遂不復除授丁丑金商房三州民飢遣使賑之是春令長吏課民種植每縣定民籍為五等第一種雜木百每等減二十為差桑棗半之男女十嵗以上人種韭一畦闊一步長十步乏井者鄰伍為鑿之令佐以春秋巡視其數秩滿赴調有司第其課而為之殿最又詔自今民有逃亡者本州具戶籍頃畝以聞即檢視之勿使親鄰代輸其租夏四月癸巳朔日有食之甲午詔奪括田使給事中常凖官先是館陶民郭贄詣闕訴括田不均詔令他縣官按視所隱頃畝皆實帝怒責凖本縣令程迪决杖流海島壬寅詔先代帝王陵寢令所屬州府遣近戶守視前賢冢墓隳壞者即加修葺己未商河縣令李瑶坐贓杖死左贊善大夫申文緯奉使按田不能舉察除籍富弼曰祖宗朝令犯贓至死者未嘗貸則國有定法而犯者絶少近年臣寮受賕至死率䝉寬恕是恩無極刑而犯者愈多不足以禁貪墨也漢初犯私麴者棄市周令至五斤死帝以其法尚峻庚申詔民犯私麴十五斤以私酒入城至三斗者始處極典其餘罪有差考異李燾長編繫以壬申日按四月無壬申今從本紀又以前朝鹽法太峻定令官鹽䦨入禁地貿易至十斤煮鹻至三斤者乃坐死民所受蠶鹽入城市三十斤以上者奏裁考異李燾云按太宗實録先是官貨鹽于民蠶事既畢即以絲絹償官謂之蠶鹽令民從夏秋賦租償其直食貨志云唐有蠶鹽皆賦于民隨夏稅收錢絹與實録少異當再考之是月遼主射鹿不視朝五月癸亥朔帝御崇元殿受朝以皇太后疾赦雜犯死罪巳下詔司天少監王處訥等重核欽天厯先是欽天厯成處訥私謂王朴曰此厯不久即差因指其當差處以示朴朴深然之初周世宗命國子司業兼太常博士洛陽聶崇義崇義初見顯德四年詳定郊廟器玉崇義因取三禮舊圖考正同異别為新圖二十卷至是來上詔加褒賞仍命太子詹事尹拙集儒臣參議拙多所駁難崇義復引經解釋乃悉以下工部尚書竇儀裁處至當頒行甲戌令殿前侍衛司及諸州長吏閲所部兵驍勇者升其籍老弱怯懦者去之初置剩員以處退兵考異按李燾云此但令諸州揀去老弱者耳部送强壯以補兩司之闕乃乾德三年八月事兵志及經武聖略等多并言之非是今從實録罷常參官序遷法舊制皆以嵗月序遷帝謂宰相曰是非循名責實之道會監門衛將軍魏仁滌等治市征有羡利並詔增秩自是不以序遷矣庚寅供奉官李繼昭坐盜賣官船棄市詔諸州勿復調民給𫝊置悉代以軍卒五代以來州郡牧守多武人任獄吏恣意用法時金州民有馬漢惠者殺人無賴閭里患之其父母及弟共殺漢惠防禦使仇超判官左扶悉按誅之帝怒超等持法深刻並除名流扶海島自是人知奉法六月甲午皇太后杜氏崩於滋德殿太后聰明有智度每與帝參决大政猶呼趙普為書記嘗撫之曰趙書記且為盡心吾兒未更事也尤愛光義每出輒戒之曰必與趙書記偕行疾革召普入受遺命太后問帝曰汝知所以得天下乎帝嗚咽不能對太后曰吾方語汝以大事而但哭耶問之如初帝曰此皆祖考及太后之餘慶也太后曰不然正由柴氏使幼兒主天下羣心不附故耳汝與光義皆吾所生汝後當傳位汝弟考異薛應旗王宗沐宋元通鑑皆作后云汝百嵗後當傳位光義光義傳光美光美傳德昭又王洙史質云遺命光義光美德昭以次傳位今案宋史東都事略及陳桱通鑑續編但云傳位於汝弟並無傳光美德昭語李燾辨之甚詳今不取薛王之說四海至廣能立長君社稷之福也帝頓首泣曰敢不如太后教因謂普曰汝同記吾言不可違也考異東都事略云后因謂趙普曰爾同記哥言不可違也按是時太宗不在帝旁辨見長編注中今不取普即就榻前為誓書於紙尾署曰臣普記藏之金匱命謹密宫人掌之考異李燾曰司馬光記聞稱太后欲傳立二弟其意謂大宗及秦王廷美也今從正史及新録而舊録無有是事按太后以周鄭王幼羣情不附故令太祖授天下於大宗大宗當是時年二十三矣太祖母弟也若并及廷美則無謂廷美當是時才十四歲而太祖之子魏王德昭亦十嵗其齒蓋不甚相逺也舍嫡孫而立庶子人情殆不然然則太后顧命獨指太宗記聞誤也正史新録稱太宗亦入受顧命而記聞不載今從記聞按太宗初疑趙普有異論及普上章自訴且發金匱得普所書乃釋然若同於牀下受顧命則親見普書矣又何俟普上章自訴且發金匱乎蓋正史新録容有潤色按太祖實録載普自訴章其辭略與記聞同當顧命時太宗實不在旁也正史新録别加刪修遂失事實耳故必以太宗實録及記聞為正王禹稱建隆遺事又云廷美與太祖大宗皆杜太后所生今本傳以廷美為大宗乳母王氏所生非也謹按廷美與趙廷俊同母母耿氏實太宗親語宰相國史著之其迹明甚不知遺事果何所據乃云爾就使廷美真杜太后所生有罪黜廢於親親之道奚損而太宗特設此虛僞以自欺耶其不然决矣或者杜太后愛廷美與親所生不異故流俗因有是說且太后享年六十崩逝時廷美才十四嵗逆數之則生廷美時太后巳四十七也然宫掖事祕要不可用傳聞無驗語改國史明迹况所謂建隆遺事者亦不必皆禹稱所記耶臣燾嘗辨之具開寶九月十月興國六年九月己亥羣臣請聽政從之庚子以太后喪權停時享辛丑見百官於紫宸殿庚申帝釋服是日唐主景卒於南都遺令留葬西山纍土數尺為墳且曰違我言非忠臣孝子也考異唐主死日宋史作八月甲辰東都事略作八月庚子皆誤今從南唐書壬戌以太后殯不受朝秋七月唐主喪歸金陵考異按王舉天下大定録景喪歸在七月而南唐書則云八月至金陵今長編以大定録為據從之有司議梓宫不宜復大內太子從嘉不可乃殯於正寢從嘉即位改名煜尊母鍾氏為太后后父名泰章易其號曰聖尊后立妃周氏為國后大赦境內罷諸道屯田務歸本州縣先是唐主用尚書員外郎李德明議興復曠土為屯田以廣兵食所使典掌者多非其人侵擾州縣豪奪民利大為時患至是悉罷使職委所屬縣令佐與常賦俱徴隨所租入十分賜一以為祿廪民稍休息焉初帝既誅李筠及重進一日召趙普問曰自唐季數十年來帝王凡易八姓戰鬭不息生民塗地其故何也吾欲息天下之兵為國家計長久其道何如普曰陛下言及此天地人神之福也此非他故方鎮太重君弱臣强而已今欲治之惟稍奪其權制其錢穀收其精兵則天下自安矣時石守信王審琦等皆帝故人各典禁衛普數言於帝請授以他職帝曰彼等必不吾叛卿何憂普曰臣亦不憂其叛也然熟觀數人者皆非統御才恐不能制伏其下軍伍間萬一有作孽者彼臨時亦不得自由耳帝悟於是召守信等飲酒酣屏左右謂曰我非爾曹之力不及此然天子亦大艱難殊不若為節度使之樂吾終夕未嘗高枕卧也守信等請其故帝曰是不難知居此位者誰不欲為之守信等頓首曰陛下何為出此言今天命已定誰敢復有異心帝曰卿等固然其如麾下有欲富貴者一旦以黃袍加汝身汝雖欲不為其可得乎守信等頓首涕泣曰臣等愚不及此惟陛下哀矜指示可生之途帝曰人生如白駒過隙所為好富貴者不過欲多積金錢厚自娛樂使子孫無貧乏耳卿等何不釋去兵權出守大藩擇便好田宅市之為子孫立永逺之業多置歌兒舞女日飲酒相歡以終其天年朕且與卿等約為婚姻君臣之間兩無猜疑上下相安不亦善乎守信等皆拜謝曰陛下念臣等至此所謂生死而肉骨也明日皆稱疾請罷帝從之賞賚甚厚庚午以石守信為天平節度使高懷德為歸德節度使王審琦為忠正節度使張令鐸為鎮寧節度使皆罷軍職獨守信兼侍衛都指揮使如故其實兵權不在也殿前副都㸃檢自是亦不復除授云考異李燾曰按司馬光記聞云守信等皆以散官就第誤矣王氏筆録蓋得其實今從之文詞多取記聞稍益以丁謂談録大祖與趙普意但不欲守信等典軍耳豈不令守信等各居方鎮耶太祖云為天子不若為節度使樂是欲守信等出為節度使也及開寶三年冬十月乃罷王彥超等節度使蓋記閒誤併二事為一耳邵伯溫見聞録又云王審琦坐擅入禁中救火故罷不知同時罷者四人初不緣入禁中救火也今不取朱熹曰趙韓王佐太祖區處天下收許多藩鎮之權立國家三百年之安豈不是仁者之功壬申以光義行開封尹同平章事廷美為山南西道節度使考異宋史東都事略薛氏王氏宋元通鑑皆作壬申惟李燾長編作壬午今從壬申先是范質奏疏言光義廷美皆品位未崇典禮猶闕乞並加封册或列於公台或委之方鎮皇子皇女雖在襁褓者乞下有司許行恩制故有是命質又言宰相者以舉賢為職以掩善為不忠竊見端明殿學士吕餘慶樞密副使趙普精通治道經事霸府歷歲滋深皆公忠可倚仗乞授以台司俾申才用帝嘉納之是月陳承昭塞棣滑決河役成賜錢三十萬吳越自五月不雨至七月甲辰唐桂陽郡公徐邈奉其主景遺表來上義武節度使同平章事孫行友行友初見開運三年五月代兄方簡鎮易定逾八年而狼山妖尼深意黨益盛深意亦見開運三年五月帝初即位行友不自安纍表乞解官歸山帝不許行友懼乃繕治甲兵將棄其孥還據山寨以叛兵馬都監藥繼能密表其事帝遣閣門使武懷節馳騎會鎮趙之兵僞稱巡邊直入定州行友不之覺既而出詔示之令舉族歸朝行友倉皇聽命既至命侍御史李維嶽即訊得實己酉制削奪行友官爵禁錮私第取尼深意尸焚之都城西北隅女真國遣使貢名馬女真之先居古肅慎地元魏時號勿吉至隋改號靺鞨唐初有黑水粟末兩部後粟末盛强號渤海國黑水因役屬之渤海既滅黑水部民在南者繫籍於契丹號熟女真在北者不繫籍于契丹號生女真至是以馬入貢詔蠲登州沙門島居民租賦令專治舟船渡所貢馬永濟縣主簿郭顗坐贓一百二十萬棄市詔緣邊諸寨有犯大辟者送所屬州軍鞫之無得輒斷考異宋史在壬寅日今從長編國子易博士郭忠恕被酒與太子中舍符昭文喧競於朝御史彈奏忠恕叱臺吏奪其奏毁之己未責忠恕為乾州司戶參軍昭文免所居官庚申周世宗實録成四十卷唐主煜遣中書侍郎馮謐來進金銀繒綵謐即延魯唐主手表自陳紹襲之意帝優詔以答初周世宗既取江北貽書江南如唐與回鶻可汗之式但呼國主而已帝因之於是始改書稱詔甲子以高保朂為荆南節度使保朂淫恣又好營造臺榭窮土木之工軍民咸怨記室孫光憲諫之不聽光憲初見天成元年遼嘉哩來降高保朂遣其弟保寅來朝戊子遣鞍轡庫使梁義如江南弔祭帝召見面賜約束因謂左右曰朕每遣使四方常諭以謹飭頗聞鮮克由禮逺人何觀焉自今出使四方要當審擇其人詔罷大宴以皇太后喪故也冬十月癸巳唐主遣戶部侍郎韓熙載太府卿田霖助葬皇太后山陵熙載初見天成元年叔嗣之子也丙申命樞密承㫖王仁贍使江南賀唐主新立戊戌敕沿邊諸州禁民無得出塞侵盜戎馬前所盜者悉令還之丙午祔葬明憲皇太后於安陵是月命知制誥河南盧多遜看詳進䇿獻書人文字升降以聞甲子皇太后祔廟己巳幸相國寺遂幸國子監以李漢超為齊州防禦使尋命兼關南兵馬都監漢超在關南民有訟其强娶己女為妾及貸民錢不償者帝召謂曰汝女可適何人對曰農家耳又問漢超未至關南時契丹何如對曰歲苦侵暴曰今復爾邪對曰無也帝曰漢超朕之貴臣汝女為之妾不猶愈於農婦乎且使漢超不在關南汝家尚能保其所有耶責其人而遣之密使諭漢超曰亟還其女并所貸朕姑貰汝勿復為也不足於用何不以告朕耶漢超感泣由是政治益修吏民愛之濠楚民飢詔令長吏開倉賑貸西山巡檢使郭進敗北軍於汾西獲馬牛驢數千計進威令嚴肅帝每遣戍卒必諭之曰汝輩謹奉法我猶貸汝郭進殺汝矣嘗有軍校誣訟進不法事帝詰知其情送進令殺之會北漢來冦進語其人曰汝敢論吾信有膽氣今貰汝罪汝能掩殺敵兵當即薦汝其人踴躍赴戰大致克捷進具其事送之於朝請賞以官帝曰爾誣害我忠良此才可贖罪耳命以其人還之進復請曰使臣失信則不能用人矣帝乃從之十二月乙未昭義節度使李繼勳奏敗北漢軍千餘人斬首百餘級獲遼州刺史傅廷彥弟勳以獻代州刺史折仁里党項蕃部之大姓也世居河西帝以其有扞邊功召令入覲復命歸領刺史如故周廣順初鎮州諸縣十戶取才勇者一人為弓箭手餘九戶資以器甲芻糧是歲詔釋之凡一千四百人始置藏氷務常以孟夏命官用幣以黑牲祭𤣥冥之神乃開氷祭於太廟初南漢女巫樊胡自言玉皇降其身因宦者陳延壽以見其主鋹鋹於內殿設幄帳陳寶器胡冠逺遊衣紫袍坐帳中宣禍福呼鋹為太子皇帝國事皆决於胡內太師龔澄樞女侍中盧瓊仙等附之澄樞見顯德三年瓊仙見乾祐三年是歲芝菌生宫中野獸觸寢門苑中羊吐珠井旁石自起行百餘步乃仆胡以為符瑞諷羣臣入賀建隆三年春正月庚申朔以喪不受朝賀己巳命淮南道官吏發倉廪以賑飢民初戶部郎中沈義倫使吳越歸言揚泗饑民多死郡中軍儲尚百餘萬可貸民至秋乃收新粟沮之者曰若歲薦饑將無所取償孰執其咎帝以詰義倫對曰國家以廪粟濟民自宜感召和氣立致豐稔寧復憂水旱邪帝悅故有是命考異義倫名犯太宗偏諱故史稱沈倫李燾曰倫傳不載其年故事稱元年寶訓稱二年亦不知的是何日按倫於元年二月壬戌初除戶部郎中四月乙卯受詔分督在京諸倉則使吳越必在督倉以後安得尚指秋粟其稱元年者誤也稱二年者亦無所證據而此年正月乃有是命疑此即太祖用倫之言故載於此倫於此年十一月丙寅乃自戶部郎中除給事中甲戌廣皇城命有司畫洛陽宫殿按圖修之令諸州長吏勸課農桑自後歲首必下此詔詔州縣不得役僑居民癸未幸國子監丁亥以監察御史劉湛為膳部郎中湛𣙜茶蘄春歲入增倍遷拜越級非舊典也二月庚寅令翰林學士文班常參官曽任幕職州縣者各舉堪為賔佐令録者一人聽內舉貪濁畏懦舉主坐之甲午詔翰林學士文班常參官每五日內殿起居以次轉對須指陳時政得失朝廷急務刑獄寃濫百姓疾苦關急切者許非時上章無以觸諱為懼己亥更定竊盜律贓滿五千足陌者乃處死蜀主以秦王𤣥詰為皇太子壬寅帝謂侍臣曰朕欲武臣盡令讀書俾知為治之道左右皆莫對考異李燾曰賜崔頌等酒果據實録在此年六月崔頌𫝊亦云三年夏始聚生徒而寶訓載武臣讀書事乃因賜頌等誤也今不取丁未詔宰相樞密使帶平章事兼侍中中書令節度使者納禮錢宰相樞密使三百千藩鎮五百千充中書門下公用依唐制也甲寅北漢冦潞晉二州守將擊走之丙辰幸國子監遂幸迎春苑宴從官三月戊午朔控鶴右廂都指揮使尹勳配𨽻許州為教練使勳督浚五丈河陳留丁夫夜潰勳擅斬其隊長十人又追獲亡者七十人皆刖其左耳有詣闕稱寃者兵部尚書李濤臥病家居力疾草奏乞斬勳以謝百姓濤家人曰公宜自愛朝廷事姑置之濤憤然曰死者人之常吾豈能免但我掌兵柄軍校無辜殺人豈得不論帝覽其奏嘉之然念勳忠勇止薄責焉帝謂宰臣曰五代諸侯跋扈多枉法殺人朝廷置而不問刑部之職幾廢自今決大辟者録案聞奏委刑部詳覆戊寅詔三司春冬送戍卒衣並官給車粟毋得調發民丁己卯封邱縣令蘇允元坐申雨降不實免官丁亥徙北漢降民於邢洺州計口賦粟禁民火葬初泉州節度使留從效卒兄從願之子紹鎡嗣領軍務未幾衙將臨淮陳洪進誣紹鎡謀附錢氏執送於唐推統軍副使張漢思為留後洪進初見開運元年漢思亦見開運元年洪考異李燾曰留從效傳從效寢疾為牙校張漢思陳進所劫漢思自稱留後洪進為副而陳洪進傳乃稱從效卒紹鎡掌留務月餘洪進乃執紹鎡推漢思自相矛盾以他書參考洪進傳得其實而從效傳誤也從效病當在二年冬其死在今年春大定録於三月載從效卒然不知的是何日十國紀年亦不載日夏四月乙未延寧二州大雨雪溝洫氷丙申以趙贊為彰武節度使别受密㫖許便宜從事贊將至延州乃分置步騎前後絡繹林莽之中逺見旌旗羌渾迎者莫測其數無不畏服贊延壽子也贊初見天福十二年帝注意謀帥既令贊屯延州又命董遵誨屯環州王彥升守原州馮繼業鎮靈武以備西夏李漢超屯關南馬仁瑀守瀛州韓令坤鎮常州賀惟忠守易州何繼筠領棣州以拒契丹又以郭進控西山武守琪戍晉州李謙溥守隰州李繼勳鎮昭義以禦太原諸臣家族在京者撫之甚厚郡中管𣙜之利悉與之恣其圖回貿易免所過征稅由是邊臣皆富於財得以養募死士使為間諜洞知蕃情每入冦必能先知預備設伏掩擊自此纍年無西北之虞得以盡力東南取荆湖川廣吳越之地邢州言北漢民四百十人來降乙巳贈兄光濟為雍王弟光贊為夔王追册會稽郡夫人賀氏為皇后北漢冦麟州防禦使楊重勳擊走之定難節度使李彛興遣使貢馬三百匹帝方命玉工治𢃄即遣使以帶賜之彛興感服甲子幸相國寺禱雨遂幸迎春苑宴射乙亥發潞州民開太行道通餽運河北諸州旱遣使乘𫝊檢旱苖甲申復幸相國寺禱雨詔撤樂太官進蔬食乙酉大治宫闕倣西京制命韓重贇董其役六月癸巳以樞密使吳延祚為雄武節度使代知秦州高防秦州夕陽鎮古伏羌縣地西北接大藪材植所出戎人久擅其利及尚書左丞高防知秦州建議置采造務取其材以給京師蕃部尚頗裕帥衆來爭考異宋史太祖本紀六月壬子蕃部尚頗裕等爭采造務以兵犯渭北知秦州高防擊走之按是月癸巳以吳延祚代防如紀所書之日則擊走在命延祚後二旬恐誤今從長編防以狀聞帝不欲邊境生事乃遣延祚先一日謂之曰卿年高久掌樞務今與卿秦州庶均勞逸明日制出恐卿以離朕左右不能無憂故先告卿也富弼曰擴地而侵其疆則患生不測服而撫之聖人之逺算也先是周世宗之二年始營國子監置學舍帝既受禪即命增葺祠宇塑繪先聖先儒之像帝自贊孔顔命宰臣兩制以下分撰餘贊車駕屢臨幸焉於是左諌議大夫河南崔頌判監事始聚生徒講書頌協子初見廣順元年三月帝聞而嘉之遣中使遍賜酒果尋又詔用一品禮立十六㦸於文宣王廟門考異李燾曰據實録本紀及會要太祖以建隆二年十一月始幸國子監三年正月又幸而祖宗故事乃云元年正月初幸二月再幸因詔增葺祠宇繪塑聖賢其年月與諸書特異今不取若增葺祠宇塑繪聖賢則會要固以為國初事不緣幸監然後有此舉也故事蓋誤耳右補闕袁鳯坐檢田不實責授曲阜縣令己亥以旱故減京畿及河北諸州死罪以下壬寅京師雨丁未命吳延祚齎詔赴秦州赦尚頗裕等罪所擊戎俘並釋遣之遂罷采造務資治通鑑後編卷二
