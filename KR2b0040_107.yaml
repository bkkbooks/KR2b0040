body:
  text: 資治通鑑後編卷一百七刑部尚書徐乾學撰宋紀一百七起屠維作噩四月盡上章閹茂三月凡一年髙宗受命中興全功至德聖神武文昭仁憲孝皇帝建炎三年夏四月戊申朔太后下詔還政帝復位與太后御前殿垂簾詔尊太后為隆祐皇太后己酉詔訪求太祖神主以苗傅為淮西制置使劉正彥副之庚戌復紀年建炎命張浚知樞密院事苗傅劉正彥並檢校少保隆祐皇太后詔曰吾以國家變生倉卒遵用本朝故事同聽大政皇帝復位即願撤簾皇帝懇請者再義不獲已黽勉數日今中外寧一皇帝宜専決萬幾吾當退處東朝以遂初志可以今月四日撤簾此據北盟㑹編增入吕頥浩張浚軍次秀州頥浩諭諸將曰今雖反正而賊猶握兵居內事若不濟必反以惡名加我翟義徐敬業可監也進次臨平苗翊馬柔吉負山阻水為陳中流植鹿角以梗行舟韓世忠舍舟力戰張俊劉光世繼之翊衆少却世忠復舍馬操戈而前令將士曰今日當以死報國面不被數矢者皆斬於是士卒爭用命翊引神臂弩持滿以待世忠瞋目大呼挺刃突前翊衆辟易矢不及發遂敗走勤王兵入北關苗傅劉正彥急趨都堂取鐵劵擁精兵二千夜開湧金門遁犯富陽新城將南趨閩中遣統制王德喬仲福追之辛亥皇太后撤簾勤王之師入城韓世忠手執王世修以屬吏張浚等見帝伏地涕泣待罪帝問勞再三謂浚曰曩在睿聖兩宫隔絶一日啜羮忽聞貶卿不覺覆手念卿被謫此事誰任解所服玉帶賜之帝握世忠手慟哭曰中軍統制吳湛佐逆為最尚留朕肘腋能先誅乎世忠即謁湛握手與語折其中指與王世修俱斬於市逆黨王元左言馬瑗范仲熊時希孟皆責竄逺州癸丑尚書右僕射朱勝非罷為觀文殿大學士知洪州門下侍郎顔岐中書侍郎王孝迪尚書右丞張澄簽書樞密院事路允迪並罷以本職奉宫祠初勝非見帝言曰臣昔遇變義當即死偷生至此欲圗今日之事耳陛下不以臣即死而猶位宰相臣何面目以見士大夫因乞罷政帝不許勝非固請帝問誰可代者對曰吕頥浩張浚帝問孰優對曰頥浩練事而暴浚喜事而踈帝曰浚太年少對曰臣向被召軍旅錢榖悉付浚此舉浚實主之中丞張守論勝非不能預防致賊猖獗宜罷之不報至是與岐等俱罷以吕頥浩為尚書右僕射兼中書侍郎翰林學士李邴為尚書右丞御史中丞鄭瑴簽書樞密院事甲寅以劉光世為太尉御營副使韓世忠為武勝軍節度左右都統制張俊為鎮西軍節度右軍都統制凡勤王寮屬將佐各進官有差乙卯大赦舉行仁宗法度應嘉祐條制與今不同者自官制役法外賞格從重條約從寬罷上供不急之物元祐石刻黨人官職恩數追復未盡者令其家自陳許中外直言丁巳禁內侍干預朝政不得與主兵官交通及饋遺假貸借役禁軍外官非親戚亦不得往還違者處以軍法張浚薦朝奉大夫趙鼎鼎見浚言曰隆祐復辟其功甚大當檢纍朝卷簾故事推恩其家是日遂以孟忠厚為寧逺軍節度醴泉觀使鼎除司勳員外郎庚申重正三省官名自元豐肇建三省皆不置官長以左右僕射兼兩省侍郎二相既分班進呈首相遂不復與朝廷議論元祐初司馬光以為不便乃請令合班奏事分省治事至是從吕頥浩之言詔左右僕射並同中書門下平章事改中書門下侍郎為參知政事省尚書左右丞三省始合為一以李邴改參知政事潘良貴自考功郎遷左司郎中吕頥浩謂良貴曰旦夕相引入兩省良貴正色對曰親老方欲乞外兩省官非良貴可為也退語人曰宰相進退一世人才以為賢耶自當擢用何可握手密語先示私恩若士大夫受其牢籠又何以立朝即日乞補外遂出知嚴州丁卯帝發杭州留鄭㲄衛太后韓世忠言苗傅劉正彥擁精兵距甌閩甚邇倘成巢穴卒未可滅帝以世忠為江浙制置使與劉光世追討之壬申立魏國公敷為皇太子是月西北賊薛慶據髙郵軍金婁室取鄜坊二州五月戊寅朔帝次常州張浚謂中興當自關陜始慮金人或先入陜蜀則東南不可保因慷慨請行詔浚為宣撫處置使以川陜京西湖南北路𨽻之聽便宜黜陟與沿江襄漢守臣議儲蓄以待臨幸帝問浚大計浚請身任川陜之事置幕府於秦州别遣大臣與韓世忠鎮淮東令吕頥浩護蹕來武昌為趨陜之計復以張俊劉光世與秦州相首尾帝然之初張浚宣撫川陜之議未决監登聞檢院汪若海曰天下者常山蛇勢也秦蜀為首東南為尾中原為脊今以東南為首安能起天下之脊哉將圗恢復必在川陜浚大恱遂决此意季陵論任浚太專忤旨落職豫祠庚辰苗傅統領官張翼斬王鈞用馬柔吉降辛巳帝次鎮江謂宰執曰張慤古之遺直陳東誅死可念二人皆葬郡境已令有司置祭更議恤其家癸未以翰林學士滕康同簽書樞密院事中書舍人張忞入對甲申帝謂吕頥浩曰忞謂朕即位以來無纎毫之失自古人君不能無過患不能改耳忞諂諛如此豈可置之從班於是詔忞奉祠而去乙酉帝至江寧駐蹕神霄宫改府為建康起復朝散郎洪皓為金國通問使遺尼瑪哈書願去尊號用金正朔比於藩臣時所在盜梗皓艱難百端得逹太原留一年遣至雲中尼瑪哈軍前尼瑪哈迫皓使仕劉豫皓曰萬里銜命不得奉兩宫南歸恨力不能磔逆豫忍事之耶留亦死不即豫亦死不願偷生于草間願就鼎鑊無悔尼瑪哈怒將殺之旁一校曰此真忠臣也目止劍士為皓跽請得流遞冷山遂依左監軍悟室以居為之教子己丑韓世忠追討苗傅劉正彥自衢信進至浦城之魚梁驛與賊遇世忠步走挺戈而前賊望見咋曰此韓將軍也皆驚潰遂擒正彥王德亦執苗瑀傅亡入建陽張浚撫諭薛慶於髙郵為慶所留乙未浚罷以御營前軍統制王􅊅為淮南招撫使己亥苗傅裨將江池殺苗翊降於江浙制置使周望建陽縣人張標執苗傅獻於世忠以傅及劉正彥等悉械送行在下獄帝手書忠勇二字揭旗以賜世忠辛丑張浚還自髙郵復知樞密院事楊進居鳴皋山北京西安撫使翟興與子琮帥鄉兵時出擾之進懼是月棄輜重南走興邀擊於魯山進中流矢死其黨復推劉可拒官軍六月己酉吕頥浩張浚以久雨恆隂皆謝罪求去帝詔郎官以上言闕政司勳員外郎趙鼎上疏曰自熙寧間王安石用事變祖宗之法而民始病假闢國之謀造生邊患興理財之政窮困民力設虛無之學敗壞人材至崇寧初蔡京托紹述之名盡祖安石之政凡今日之患始於安石成於蔡京今安石猶配享神宗而京之黨未除時政之闕莫大於此帝從之遂罷安石配享以司馬光配王善攻淮寧府不克轉寇宿州統領王冠敗之乙卯命恤死事者家且録其後丙辰劉光世招安苗傅將韓雋戊午命江淮南引塘濼開畎澮以阻金兵庚申皇太后至建康府辛酉下詔以四失罪己一曰昧經邦之大略二曰昧戡亂之逺圗三曰無綏人之德四曰失馭臣之柄仍榜朝堂遍諭天下使知朕悔過之意中丞張守上疏曰陛下處宫室之安則思二帝母后穹廬毳幕之居享膳羞之奉則思二帝母后膻肉酪漿之味服細暖之衣則思二帝母后窮邊絶塞之寒享嬪御之適則思二帝母后誰為之尊禮思之又思兢兢業業聖心不倦而天不為之助順者萬無是理今罪己之詔數下而天未悔禍實有所未至耳丁卯右司諫袁植請誅黃潛善汪伯彥及失守者權邦彥等九人詔以朕方念咎責己豈可盡罪臣下植雖敢言然導朕以殺人此非美事吕頥浩滕康從而和之遂罷植知池州以趙鼎為右司諌甲戌移御行宫先是御史中丞張守嘗論頥浩難以專任而張浚不宜西去帝不恱是日除守禮部侍郎以中書舍人范宗尹代其任時殿中侍御史王庭秀亦論頥浩除擬不公詔庭秀罷職豫郡於是右正言建陽吕祉言今日緣論大臣移一言官明日緣論大臣罷一言官則後日大臣行事有失誰敢復言者願陛下以言章示大臣使之自省置身無過之地庶兩全之如或不悛黜之何惜乙亥諭中外以迫近防秋請太后率宗室奉神主入江表百司庶府非軍旅之事者並令從行朕與輔臣宿將備禦冦敵應接中原官吏士民家屬南遷者有司母禁賊貴仲正降金烏珠請大起燕雲河朔兵南侵金主從之是月陷磁州時以華藏寺為建康府治而江浙制置使韓世忠權住蔣山詔世忠候府治移保寧宫即聽居華藏寺而世忠逼守臣連南夫狼狽移家出寺於是侍御史趙鼎言世忠躬率使臣排闥而入逐天子之京尹此而可為則無不可為者矣南夫治郡緩不及事願先罷之然後降詔切責世忠仍治其使臣之先入者此為兩得帝深嘉納且曰唐肅宗興靈武諸事草創得一李勉然後知朝廷尊今朕得卿無愧昔人矣於是諸將帖然畏服尋罷南夫而以兵部侍郎湯東野兼知建康府秋七月辛巳苗傅劉正彥伏誅癸未命學士院草夏國書大金國表付張浚甲申詔以苗劉之變當軸大臣不能身衛社稷朱勝非顔岐路允迪並落職張􅊹衡州居住金達蘭略地山東安撫使劉洪道棄濰州遁萊州守將張成舉城降丁亥皇太子敷薨諡元懿太子從幸建康屬疾宫人蹴金爐有聲驚怖疾轉劇以致不起初張浚以敷嘗奸帝位建議去之至是竟連其乳母置死戊子簽書樞密院事鄭瑴卒汴京之陷也二帝及宗室北遷多范瓊之謀又乘時剽掠左右張邦昌為之從衛右正言吕祉論其罪且進取瓊之䇿至是自洪州入朝悖慢無禮乞貸苗劉等死帝畏其強以為御營司提舉一行事務張浚言及今不誅瓊他日必有王敦蘇峻之患帝深以為然浚乃與樞密檢詳文字劉子羽謀誅之命張俊以千兵渡江若備他盜者使皆甲而來丁亥召瓊俊及劉光世赴都堂議事設食食己相顧未發子羽坐廡下恐瓊覺取黃紙趨前麾之曰范瓊下有敕詣大理寺置對瓊愕不知所為子羽顧左右擁置輿中衛以俊兵送獄光世出撫其衆數瓊狀且曰誅止瓊爾汝等固天子自將之軍也衆皆投刃曰諾有㫖分𨽻御營五軍瓊下獄辭伏賜死子弟流嶺南己丑以資政殿學士王綯參知政事兵部尚書周望同簽書樞密院事庚寅仙井監鄉貢進士李時雨上書乞選立宗子繫屬人心帝怒斥還鄉里辛卯升杭州為臨安府初吕頥浩與浚定幸武昌之議及浚行頥浩以為道逺饋餉難繼乃變前議會滕康張守陳武昌有十害不可往帝從之將定都故升為府壬辰劉洪道復青州執金守臣向大猷丁酉遣工部尚書臨川崔縱使金通問二帝初帝將遣使廷臣以前使者相繼受繫莫肻往縱毅然請行比至金首以大義責金人請還二帝又三遺之書金人怒徙之窮荒縱不少屈恚忿成疾握節而死庚子張浚發建康金尼瑪哈鄂勒歡自濵州歸燕山右監軍烏珠請提兵下江浙尼瑪哈許之仍留左監軍達蘭屯濵州以守山東乃遣女真渤海漢軍諸萬户等大起燕雲河朔民兵付烏珠將之入寇壬寅命李邴滕康權知三省樞密院事從行凡四方奏讞吏部差注舉辟功賞之數皆𨽻焉命劉寧止制置江淮荆湖扈隆祐太后往洪州又命四廂都指揮使楊惟忠將兵萬人以衛初有司月供太后錢一千緡后性儉約至是斥賣本殿絹二千匹充費帝方知尋常用度不足因命户部供錢絹各二萬銀一萬可趣令辦之杜充留守東京以糧絶歸遂命同知樞密院事充將發汴嶽飛諌曰中原地尺寸不可棄今一舉足此地非我有他日取之非數十萬衆不可充不聽遂與俱歸朝廷命郭仲荀程昌㝢相繼代充留守司亦名存而已乙巳詔江西閩廣荆湖諸路團教峒丁槍杖手山東盜郭仲威陷淮陽軍仲威本李成之黨成先往泗上仲威乃引兵圍淮陽凡四月城陷仲威入城大掠取強壯以充軍翟興引兵入汝州與賊王俊戰敗之是月廣州教授林勳上本政書十三篇言朝廷兵農之政率因唐末之故今農貧而多失職兵驕而不可用是以饑民竄卒類為盜賊宜倣古井田之制使民一夫占田五十畝其有羡田之家毋得市田其無田與遊惰末作者皆驅之使為𨽻農以耕田之羡者而量取錢榖以為十一之稅宋二稅之數視唐增至七倍今本政之制每十六夫為一井提封百里為三千四百井率稅米五萬一千斛錢萬二千緡每井賦二兵馬一匹率為兵六千四百人馬三千四百匹嵗取五之一以為上畨之額以給征役無事則又分為四畨以直宫衛以給守衛是民凡三十五年而役使一遍也悉上則嵗食米萬九千餘斛錢三千六百餘緡無事則減四分之三皆以一同之租稅供之匹婦之貢絹三尺綿一兩百里之縣嵗收絹四千餘匹綿三千四百斤非蠶鄉則布六尺麻二兩所收視絹綿率倍之行之十年則民之口算官之酒酤與凡茶鹽香礬之𣙜皆可弛以豫民其說甚備書奏以勳為桂州節度掌書記後朱熹甚愛其書陳亮亦曰此書考驗古今思慮周密為井田之學無以加矣八月己酉移浙西安撫司於鎮江府庚戌李邴罷壬子以吏部尚書劉珏權知三省樞密院事甲寅王庶罷以知慶陽府王似為陜西節制使劉文舜陷舒州己未太后發建康壬戌以京畿轉運使上官悟為東京留守悟均之子也時金人南侵而洪皓崔縱未復帝求可使緩師者丁卯遣京東轉運判官杜時亮及修武郎宋汝為使金軍以請和致書於尼瑪哈曰古之有國家而迫於危亡者不過守與奔而已今以守則無人以奔則無地所以諰諰然惟冀閣下之見哀而已故前者連奉書願削去舊號是天地之間皆大金之國而尊無二上亦何必勞師逺涉而後為快哉又命吕頥浩遺書劉豫俾諭此意帝聞道君遣二內臣二宫女將與髙麗使人同至壬申謂宰執曰朕聞之一則以喜一則以懼朕别二聖已三年忽得安信豈不喜但道君當承平之日以天下奉之今彼中百凡粗陋而朕居深宫廣殿極不遑安且朕父母兄弟及妻皆在異域惟一子又殤孑然一身當此艱難所以悲也言未畢澘然淚下吕頥浩曰願陛下少寬懷抱力恢中興之業周望曰此必金人之意若非彼意數人者雖至髙麗髙麗亦不肻令來帝曰然金試舉人於蔚州以張孝純主文柄時遼人皆用詩賦兩河人皆用經義而欣州孫九鼎擢第一九鼎政和間逰太學與洪皓同舍陷金十年始登第皓在北方屢見之閏月乙酉帝謂宰執曰士大夫間有言李綱可復用者朕以其人雖忠義但志大才踈用之必至誤國故不復用吕頥浩曰志大才踈誠如聖諭帝曰如聽邢倞之計遂結余覩金人至今以為釁端周望曰如宣撫河東以救太原先於河陽置納級庫敵聞而笑之亦足見其踈也時倞知鼎州未幾以倞始禍除名送英州編管己丑以吕頥浩為尚書左僕射杜充為尚書右僕射並同中書門下平章事庚寅起居郎胡寅上疏曰陛下以親王介弟受淵聖皇帝之命出師河北二帝既遷則當糾合義師北向迎請而乃亟居尊位建立太子不復歸覲宫闕展省寢陵偷安嵗月略無捍禦及敵騎乘虛匹馬南渡一向畏縮惟務逺逃軍民怨咨恐非自全之計也因進七䇿一罷和議而修戰略二置行臺以區别緩急之務三務實效去虛文四大起天下之兵以自強五都荆襄以定根本六選宗室之賢才封建任使之七存紀綱以立國體書凡數千言吕頥浩惡其切直罷之帝聞金師將至召諸將議駐蹕之地張俊辛企宗請自鄂嶽幸長沙韓世忠曰國家已失河北山東若又棄江淮更有何地吕頥浩曰金人之謀以陛下所至為邊靣今當且戰且避奉陛下於萬全之地臣願留常潤死守帝曰朕左右不可無相辛卯以杜充兼江淮宣撫使守建康王􅊅𨽻之韓世忠為浙西制置使守鎮江劉光世為江東宣撫使守太平池州並受充節制丁酉太后至洪州過落星寺暴風覆舟宫人多溺死惟太后舟無虞壬寅帝發建康張俊辛企宗以其軍從考功員外郎樓照上疏言今日之計當思古人量力之言察兵家知己之計力可以保淮南則以淮南為屏蔽權都建康漸圗恢復力未可以保淮南則因長江為險阻權都吳會以飬國力於是帝一意還臨安不復議防淮矣甲辰次鎮江府賜陳東家金張浚次襄陽招官軍義兵分屯襄郢唐鄧是月知濟南府宫儀及金人數戰於密州兵潰儀及劉洪道俱奔淮南守將李逵以密州降金靳賽詣劉光世降九月丙午朔日有食之諜報金人陷登州烏珠將自登入海道以窺江浙而杜充在建康距錢塘明越道途繚繞慮失事機時韓世忠駐軍江隂是日遣世忠控守圌山福山辛亥次平江府壬子金人陷單州興仁府遂陷南京守臣凌唐佐被執劉豫因使為守唐佐與宋汝為密疏其虛實以蠟書告於朝事泄豫併其家捕之唐佐見豫責以大義豫怒殺之境上癸丑以周望為兩浙荆湖宣撫使總兵守平江以翰林學士張守同簽書樞密院事杜充嚴急劉光世不樂屬充會朝議以太后在豫章恐有震驚乃命光世移屯江州捍衛之丙辰以直龍圗閣張邵充金國軍前通問使武臣楊憲副之邵至濰州接伴使置酒張樂邵曰二帝北遷邵為臣子所不忍聽請止樂至於再三聞者泣下見左監軍達蘭命邵拜邵曰監軍與邵為南北朝從臣無相拜禮且以書抵之曰兵不在強弱在曲直宣和以來我非無兵也帥臣初開邊隙謀臣復起兵端是以大國能勝之厥後僞楚僭立羣盜蜂起曾幾何時電掃無餘是天意人心未厭宋也今大國復裂地以封劉豫窮兵不已曲有在矣達蘭怒取國書去執邵送密州囚於柞山寨金人陷沂州丁巳蠲諸路青苗積缺錢辛未追復鄒浩龍圗閣待制中書舍人綦崇禮當行詞推帝所以褒恤遺直之意有曰處心不欺飬氣至大言期寤意引裾嘗犯於雷霆計不顧身去國再遷於嶺徼羣臣動色志士傾心又曰英爽不忘想生氣之猶在奸諛已死知朽骨之尚寒同列推重考異薛應旗通鑑書此事在紹興四年十月壬寅帝次平江之下大誤按宋史髙宗紀確有明文帝是年次平江加贈陳東歐陽徹而不及鄒浩時崇禮方知紹興府亦非當制之任今從髙紀作九月辛未甲戌金婁宿攻長安經略使郭琰棄城遁以趙鼎為殿中侍御史中丞范宗尹因奏事言鼎由司諫遷殿中非故事帝曰朕除言官即置一簿考其所言多寡鼎所言四十事已行三十六事故除之金分河間真定二府為河北東西兩路平陽太原二府為河東南北兩路去中山慶源信德隆德府號皆復舊州名自餘軍壘亦多改焉下令禁民漢服及衣冠不如式者皆死河北賊酈瓊圍光州冬十月丙子朔詔按察官嵗上所發摘贓吏姓名以為殿最庚辰禁諸軍擅入川陜癸未帝至臨安留七日時金烏珠分兵南寇一自滁和入江東一自蘄黃入江西庚寅帝渡浙江郭仲威詣周望降望以仲威為本司統制李成掠淮北陷泗州殺知州耿堅據其城帝降詔撫慰之命成知泗州辛卯成復陷滁州守臣向子伋及諸官屬皆被殺壬辰帝至越州戊戌張浚治兵於興元以圗中原浚上疏言漢中實形勝之地前控六路之師後據兩川之粟左通荆襄之財右出秦隴之馬號令中原必基於此謹積粟理財以待巡幸時金烏珠遣當海先取夀春而自以兵繼之掠光州擊破張用軍庚子犯黃州守臣趙令􅍲以內艱還在道聞變疾趨入城守禦金人力攻城陷欲降之令􅍲大罵不屈死時都監王逺判官吳源巡檢劉卓亦皆殉義焉令􅍲燕懿王之元孫也辛丑張浚承制以趙開為隨軍轉運使専總四川財賦開見浚曰蜀之民力竭矣錙銖不可加獨𣙜貨尚存贏餘而奸猾認為己有共相隱匿惟不恤怨詈斷而敢行庶可救一時急浚鋭意興復委任不疑於是大變酒法即舊撲買坊場所置隔槽設官主之麴與釀具官悉自買聽釀户以米赴官自釀斛輸錢三十頭子錢二十二其釀之多寡惟錢是視不限數也又於秦州置錢引務興州鼓鑄銅錢官賣銀絹聽民以錢引或銅錢買之凡民錢當入官者並聽用引折納官支出亦如之民以為便嘗獲僞引三十萬盜五十人浚欲從有司議當擬死開白浚曰相公誤矣引誠僞加宣撫司印即為真而黜其徒使治幣是相公一日獲三十萬之錢而起五十人之死也浚從之時浚荷重寄旬犒月賞期得士死力費用不訾盡取辦於開開悉智慮於食貨算無遺䇿雖支費不可計而資財常有餘金人自黃州渡江逼江州劉光世日置酒宴會敵渡三日尚未之知及薄城下光世遂引兵走南康知江州韓梠棄城遁金入城殺掠遂由大冶縣趨洪州是月京西賊劉滿陷信陽殺守臣趙士真盜入宿州殺通判盛修己十一月乙巳朔金人寇廬州守臣李會以城降王善叛降金金人執之丁未詔聽李綱自便追復宋齊愈官貴仲正復叛犯荆南兵馬鈐轄渠成與戰斬之戊申金烏珠犯和州守臣李儔以城降通判唐璟死之己酉金烏珠陷無為軍守臣李知幾挈帑藏與民渡江南歸壬子滕康劉珏奉太后退保䖍州江西制置使王子獻棄洪州走丁巳金人陷臨江軍守臣吳將之遁戊午遣孫悟等充金國軍前致書使金人犯洪州權知州事李積中以城降時太后去已七日知撫州王仲山知袁州王仲嶷並以城降金於是福建諸州震恐中書舍人綦崇禮行責辭曰昔唐天寶之亂河北列郡並陷獨常山平原能為國守者蓋杲卿真卿二顔在焉爾等頃以家聲屢塵仕版未聞虧失浸預使令為郡江西惟兄及弟力誠不支死猶有說臨川先降宜春繼屈魯衛之政若循一途雖爾無恥不愧當時之公議顧亦何施面目見爾先人於地下哉此詞據困學紀聞編入二人並圭子仲山秦檜婦翁也淮賊劉忠犯蘄州韓世清逆戰破之忠復陷舒州殺通判孫知微庚申金人陷真州守臣向子忞棄城去辛酉太后至吉州壬戌金人陷溧水縣縣尉潘振死之癸亥金人陷太平州甲子杜充遣都統制陳淬嶽飛等及金人戰於馬家渡王􅊅先遁淬力戰死之太后在吉州金人追之急遂乘舟夜行乙丑至太和縣舟人景信反楊惟忠兵潰失宫人一百六十滕康劉珏皆遁兵衛不滿百遂自萬安登陸后及潘貴妃以農夫肩輿而行至䖍州府庫皆空衛兵所給惟得沙錢市買不售至與百姓交鬬縱火四掠鄉兵首領陳新率衆圍城惟忠部將胡友自外引兵破新於城下太后稍安護衛統制杜彥及後軍楊世雄率衆叛犯永豐縣知縣趙訓之死之金兵至吉州守臣楊淵棄城走時胡銓為舉子居薌城團結丁壯以保閭井乃自領民兵入城固守斬市中惡少攘亂者數人乃定張榜責楊淵棄城之罪淵懼自歸太后太后降敕諭銓事定新守來疑銓有他志不敢入城銓曰吾保鄉井耳豈有他哉即散遣民兵徒步歸薌城是日金人陷六安軍己巳帝發越州次錢清鎮將如浙西迎敵侍御史趙鼎力諌以為衆寡不敵不若為避狄之計庚午復還越州以周望同知樞密院事仍兼兩浙宣撫使守平江以御史中丞范宗尹參知政事御史中丞趙鼎上言經營中原當自關中始經營關中當自蜀始欲幸蜀當自荆襄始吳越介在一隅非進取中原之地荆襄左顧川陜右控湖湘而下瞰京洛三國所必爭宜以公安為行闕而屯重兵於襄陽運江浙之粟以資川陜之兵經營大業計無出此時江浙倚重於杜充而充日事誅殺無制敵之方及金烏珠與李成合兵攻烏江充閉門不出統制嶽飛泣諫請視師充不從烏珠遂乘充無備進兵陷和州及無為軍由馬家渡渡江至太平充始遣統制陳淬及飛帥師迎戰王􅊅以軍先遁淬敗死諸軍皆潰充兵亦散辛未烏珠入建康充渡江保真州諸將怨充嚴刻欲乘其敗害之充聞不敢入營居長蘆寺烏珠遣人說之曰若降當封以中原如張邦昌故事充遂還建康與守臣陳邦光户部書李梲率官屬迎拜烏珠於馬首通判吉水楊邦乂以血大書衣裾曰寧作趙氏鬼不為他邦臣烏珠使人誘以官終不屈大罵求死遂殺之事聞贈直祕閣諡忠襄賜廟褒忠帝聞杜充敗謂吕頥浩曰事迫矣若何頥浩遂進航海之䇿其言曰敵兵多騎必不能乘舟襲我江浙地熱必不能久留俟其退復還二浙彼來我去彼去我來此兵家之竒也帝然之癸酉入明州時連雨泥淖吏卒暴露命兩浙漕臣陳國瑞沿路犒設衛士肉才有六百斤炭倍之而已金人犯建昌軍兵馬監押蔡延世擊却之甲戌韓世忠自鎮江退守江隂江淮宣撫司潰卒攻陷鎮江淮西兵馬都監王宗望以濠州降於金是月詔諸路兵勤王知徐州趙立聞之乃將兵三萬趨行在杜充承制以立知楚州金人聞立去徐州赴楚乃以兵邀於淮隂立麾下勸立速還保徐州立奮怒嚼其齒曰回顧者斬於是率衆徑進與金人遇轉戰四十里至楚州城下立中箭貫兩頰口不能言以手指揮諸軍憩歇定方拔箭出之京西制置使程千秋軍襄陽招降劇盜曹端桑仲等未幾疑仲有異命端圗之端及千秋所部俱為仲所敗千秋棄城自金州入蜀仲遂據襄陽初張浚信用千秋久之又疑其跋扈乃以郭永為檢察軍馬李允文為京西憲使左右掣其肘二人險躁欲得其處更譖撓之使不得有所為尋又奪其便宜諸將由是解體千秋之庸繆固足以僨事然浚所以用之者不得其道故卒至於敗此據中興紀事本末所載王之望西事記修入十二月乙亥朔張浚承制廢積石軍丙子帝至明州丁丑江淮宣撫司將戚方擁衆叛犯鎮江府守臣胡唐老死之安撫司機宜鄭凝之亦遇害辛巳金人攻常州守臣周把遣赤心隊官劉晏擊之初烏珠將趨杭州嶽飛聞之邀擊至廣德境六戰皆捷擒其將王權駐軍鍾村將士無糧忍饑不敢擾民會金兵攻常州飛救之於是廣德無援城遂陷金人殺守臣周烈己卯帝在明州召集海舟甚急監察御史林之平自福建募船千隻相繼而至朝廷甚喜壬午定議航海避兵禁卒張寶等憚行謀亂命吕頥浩等伏兵執寶等十七人斬之甲申張浚承制拜曲端為威武大將軍宣撫處置司都統制初端欲斬王庶朝廷疑其叛浚以百口保之且以端屢與敵角欲仗其威聲遂有是拜軍士恱服浚又辟劉子羽參議軍事子羽薦涇原都監吳玠及弟璘之才勇浚以玠為統制璘掌帳前親兵金烏珠自廣德過獨松關見無戍者謂其下曰南朝若以羸兵數百守此吾豈能遽度哉乙酉遂犯臨安守臣康允之棄城走錢塘縣令安吉朱蹕率弓手土軍前路拒戰兩中流矢猶奮勇而進力竭死之烏珠聞帝在明州遣阿里富埒琿帥精騎渡浙追之己丑帝乘樓船次定海縣聞有金使至不欲令至行在留范宗尹趙鼎汪藻於明州以候之又謂張俊曰若能捍敵成功當加王爵吕頥浩奏令從官以下各從便去帝曰士大夫當知義理豈可不扈從若然則朕所至乃同寇盜耳於是郎官以下多從衛癸巳帝次昌國縣乙未杜彥犯潭州殺通判孟彥卿趙民彥邑士謝淳力戰而死金人屠洪州戊戌金人犯越州安撫使李鄴以城降金人使巴拜守之衛士唐琦袖石伏道旁伺其出擊之不中被執巴拜詰之琦曰欲碎爾首我即死為趙氏鬼耳巴拜歎曰使人人如此趙氏豈至是哉又問李鄴為帥尚以城降汝何人敢爾琦曰鄴為臣不忠吾恨不手刃之尚言及斯人耶乃顧鄴曰我月給石米不肻背主汝享國厚恩乃若此豈人類哉遂大罵巴拜趣殺之至死不絶口兩浙宣撫副使郭仲荀棄軍奔溫州庚子帝移次溫台癸卯黃潛善卒於英州李成自滁州引兵之淮西四年春正月甲辰朔帝次昌國縣碇舟於海中金阿里蒲盧渾攻明州乙巳張俊劉洪道遣兵掩擊金人奔北多死於江者夜拔寨退屯餘姚而遣人請濟師於烏珠丙午帝次台州章安鎮帝慮隆祐太后徑入閩廣己酉詔遣使臣齎書至䖍州尋問艤舟之所庚戌金兀术中分麾下兵會阿里富埒琿復攻明州張俊懼率衆趨台州劉洪道亦遁癸丑貶郭仲荀廣州安置丙辰詔原兩浙州郡降金官吏丁巳羅索陷陜州知州兼安撫使彭原李彥仙死之彥仙在陜搜軍實增陴濬隍益為戰守備遣統領邵興復虢州金將烏嚕來攻為彥仙所敗婁宿聞之自蒲解率兵大至彥又大敗之羅索僅以身免彥仙度金人必併力來攻即遣人求援於張浚羅索果率折可求等衆十萬來分其軍為十以正月旦為始日輪一軍攻城期以三旬必拔彥仙意氣如常數出與戰既而食盡告急於浚浚檄曲端以涇原兵援之端素嫉彥仙不奉命幕官謝升曰金若下陜則全據大河且窺蜀矣浚乃出師至長安道阻不得進彥仙日與金戰羅索奇其才誘啖百端彥仙悉斬其使力盡城陷彥仙投河死羅索怒盡屠之彥仙初名忠靖康初李綱宣撫兩河上書言綱不知兵恐誤國書奏下有司追捕乃亡去易名彥仙既出效用在陜再踰年大小二百戰未嘗敗衄至是力竭無援以身殉國烏珠遣兵益富埒琿復攻明州己未城陷遂屠之是夜大雨震電乘勝破定海昌國執守臣趙伯諤伯諤言帝在溫州將入福州金人遂以舟師來襲追三百餘里弗及提領海舟張公裕以大舶擊却之蒲盧渾引兵還辛酉帝發章安壬戌雷雨又作甲子泊溫州港口時明州失守海道可虞丙寅帝移次館頭丁卯台州守臣朝公為棄城遁處州衛兵及鄉兵相殺縱火肆掠三日劉可轉寇京西桑仲屢敗之至是為其黨所殺復推劉超據荆門軍戊辰權知三省樞密院事滕康劉珏罷侍御史張延夀論其不能憂國任事使太后涉險為敵人追迫故也是月金人攻楚州守臣趙立拒之金人犯邠州曲端遣涇原路副總管吳玠拒戰敗之於彭原又入同州張浚遣謝亮使夏國至則其主乾順已稱制遂還二月甲戌朔河北盜相人酈瓊降於劉光世瓊初𨽻宗澤澤死調戍滑州金人入寇戌軍亂殺其統制推瓊為主瓊因誘衆勤王行收兵北渡淮有衆萬餘為金當海所敗遂率衆降於光世詔以為楚州安撫使乙亥帝如溫州駐蹕江心寺因改名曰龍翔復以盧益為資政殿學士李回為端明殿學士並權知三省樞密院事金既破江西諸郡乃引兵犯湖南遂陷潭州將吏王暕劉玠趙聿之戰死向子諲率兵奪門亡去金兵遂大掠屠其城丙子金烏珠自臨安引兵還縱火焚掠以輜重不可遵陸取道秀州而北丙戌命劉光世率兵追之考異中興紀事本末云是年正月烏珠破明州屠其城陳桱通鑑續編亦云正月金阿里富埒琿復侵明州烏珠以師會之二月烏珠自明州還臨安縱火楚掠則是烏珠親行與富埒琿合攻明州也烏珠一名宗弼按金史宗弼傳云宋主自越奔明州宗弼留杭州使阿里富埒琿以精兵曰千襲之尋又中分麾下兵㑹攻明州克之是烏珠未嘗親行特濟師以助攻耳續編之誤薛應旗因之而不能改宋史髙宗紀云二月丙子金人自明州引兵還臨安又云丙戌金自臨安退兵命劉光世率兵追之亦誤按金史太宗紀云是年二月乙亥宗弼還自杭州庚寅取秀州戊戍取平江乙亥先丙子一日當即宋史所謂引兵還也然自臨安趨秀州非自明州趨臨安也其曰丙戌金人自臨安退兵者蓋是時帝在溫州烏珠以乙亥去臨安至丙戌帝始聞其退兵因命光世追襲宋史牽連書之殊令人惑或曰宋史但稱金人不著姓名丙子自明州還者富埒琿也丙戌自臨安退兵者烏珠也其說近是然溫州去臨安千餘里如烏珠果以丙戌去安得是日即聞而命光世追之乎今悉據金史改正丁亥金人入東京權留守上官悟出奔為盜所殺自是四京皆沒于金庚寅帝次溫州先是主管明道宫薛弼獻策請平其直以鬻官産既而駕留一月所費不資皆取給於鬻産之直弼永嘉人也時諸將無功翰林學士汪藻准詔言事上疏曰竊惟金人為中國患雖已五年而自陛下即位以來土宇日蹙宗社不絶如線以萬乘之尊至於乘桴入海者由將帥非人而陛下馭之未得其術也如劉光世韓世忠張俊王􅊅之徒兼兩鎮之重視執政之班金帛充盈錦衣玉食奢豪無所不至雖輿臺厮飬皆得以功賞補官其寵可謂極矣平時飛楊跋扈不遵朝廷法度所至焚掠驅虜及金人之來是數人者曽不能為陛下施鏃矢之勞獨張俊明州僅能少抗若更堅守數日待其再來極力勦除敵必終身懲創不敢復南奈何敵退數里遽狼狽引軍而行遂至明州屠戮無噍類是殺一城生靈而陛下有館頭之幸者張俊使之也陛下以建康京口九江皆要害之地當宿重兵故以杜充守建康韓世忠守京口劉光世守九江而以王􅊅𨽻杜充其措置非不盡善也若敵騎渡江充世忠􅊅并力扼其前光世掩其後可使奔北之不暇而世忠八九月間已掃鎮江所儲之資盡藏海舶焚其城郭為逃遁計洎充力戰於前世忠􅊛卒不為用光世亦偃然坐視不出一兵方與韓梠朝夕宴飲賊至數十里不知則朝廷失建康賊犯兩浙乘輿震驚者韓世忠王􅊅使之也使豫章太母播越六宫流離者劉光世使之也既而俊冒朝廷不資之賞自明引軍至溫道路雞犬為之一空居民皆逃避世忠逗留於秀放軍四掠至執縛縣宰以取錢糧平江城外無不被害陛下親御宸翰召之而不來元夕取民間子女張燈髙會王􅊛自信州入閩所過州縣邀索動以千計方國家危急之時所恃者諸將而諸將所為如此在古法皆當誅然不可盡誅也惟王􅊅本𨽻杜充充敗於前而􅊅不救此不可赦當先斬􅊅以令天下其他以次重行貶降使以功贖過可也臣愚以為退敵之後正朝廷大明賞罰之時莫若擇有威望大臣一人盡護諸將雖陛下親軍亦聽其節制稍稍以法裁之仍使於偏裨擇人材可用者間付以方面之權待其有功加以爵秩隂為諸將之代如此則守亦有功戰亦有功車駕徐議所向留江浙亦可幸湖湘亦可不然雖大臣忠貫日月謀臣如雨言利之臣能使錢流地上何益於事哉今日所急在於馭兵馭將其他皆非先務惟陛下與大臣熟議斷而行之辛卯金烏珠入秀州權知州事趙士醫死之金人去潭州羣盜大起鼎州民鍾相嘗以左道惑衆因結集忠義以捍賊為名甲午相自稱楚王改元天載尋冦澧州陷之殺守臣黃宗權尚書右僕射同平章事杜充已降金御營副使劉光世奏充敗事未知存亡㑹知真州向子忞言充已投降而去麾下兵有走回者乙未罷充為觀文殿學士提舉江州太平觀丙申以金兵退肆赦李成入舒州金遊騎至平江周望奔太湖守臣湯東野亦遁戊戌烏珠入城縱兵焚掠死者五十萬人辛丑白虹貫日湖北制置使傅雱招諭孔彥舟彥舟聽命因以為湖南北捉殺使金人陷醴州守臣王淑棄城去是月張浚自秦州引兵入衛聞金軍退乃還三月癸卯朔金人去平江統制陳思器以舟師邀擊敗其後軍於太湖壬子金人入常州守臣周把遁去甲寅帝謂輔臣曰隆祐太后朕初不識自迎至南京愛朕不啻已出今國多難越在數千里外兵馬驚擾朕何以堪當亟奉迎以慰朕懷遂遣盧益及辛企宗潘永思等如䖍州迎太后東還丙辰金人犯終南縣經略使鄭恩戰敗死之初韓世忠以前軍駐青龍鎮中軍駐江灣後軍駐海口俟金烏珠師還擊之烏珠自秀州趨平江世忠事不就遂移師鎮江以待之先以八千人屯焦山寺丁巳烏珠至鎮江欲濟乃遣使通問且約戰期世忠許之既而接戰江中凡數十合世忠妻梁氏親執桴鼓敵終不得濟俘獲甚衆烏珠懼請盡歸所掠以假道世忠不許復益以名馬又不許烏珠舟小契丹漢軍沒者二百餘人世忠襲之烏珠奪大舟十艘遂自鎮江泝流西上烏珠循南岸世忠循北岸且戰且行世忠以艨艟大艦進泊金山下預以鐡綆貫大鈎授驍健者明旦敵舟噪而前世忠分海舟為兩道出其背每縋一綆則曳一舟沉之烏珠窮蹙求㑹語世忠酬答如響時於所佩金鳯瓶傳酒縱飲烏珠祈請甚哀世忠曰還我兩宫復我疆土則可以相全烏珠語塞己未帝詣天慶觀朝辭九廟遂發舟回鑾辛酉帝發溫州御營前軍將楊勍叛乙丑帝次台州松門寨宰執奏駐蹕之所帝曰會稽只可暫住若稍久則人懷安而不樂屢遷吕頥浩曰將來宜駐浙右徐謀入蜀帝曰蜀財用富饒秦士馬精勇朕倚秦之兵資蜀之貨固善但張浚奏漢中只可備萬人糧恐太少若兩浙委得人錢帛猶可泝流而西至於糧斛豈可運致頥浩曰若只擕萬兵入蜀則淮浙江湖閩廣皆為盜區非國家之有矣帝曰當益進上流用淮浙鹽息以贍軍費江湖之粟以為軍食王綯曰或者輕議晋元帝逺都建業不能復中原而多以入蜀為便抑不知自秦用張儀至本朝王繼恩下蜀者八矣取輒得之不勞再舉亦未為便也范宗尹曰若使入蜀則恐兩失之據江表而圗關陜則將兩得之帝曰然是夕風順御舟過淺幾覆戊辰孔彥舟獲鍾相及其子子昻檻送行在誅之其黨楊太復聚衆於龍陽己巳戚方陷廣德軍權通判王濤不屈與判官李唐俊法司潘偊知縣韋績丞蔣䕫皆死之辛未帝次定海縣縣為金兵所焚惻然曰為民父母不能保民使至如此是月金達蘭自濰州遣貝勒太一等提兵南寇以援烏珠因圗楚州守臣趙立乘城禦之敵進圍揚州朝廷恐守臣張績力不能支許退保鎮江績不肻移績金壇人也有司議明堂配祀疑於嚴父之文不克時定禮部侍郎江都王居正議曰古之帝王非肇造區夏者皆無配天之祭聖宋崛起非有始封之祖太祖則周之后稷配祭於郊者也太宗則周之文王配祭於明堂者也皇祐宗祀固宜以太宗配當年蓋拘嚴父之說故配帝並登真宗其後英宗朝孫抃請専配以近考司馬光吕誨爭之以為絀祖進父而神宗亦謂周公宗祀在成王以文王為祖則明堂非配考明矣今上紹統自真宗至於神宗均為宗廟獨躋則患無名並配則同祫饗請今祭昊天上帝皇地祗於明堂宜奉太祖太宗配帝是其議是嵗詔分鄂嶽潭衡永道彬桂陽八郡為湖東路安撫置司於鄂分鼎澧辰沅靖合邵全武昌九郡為湖西路安撫置司於鼎金達蘭引兵攻泰州水寨張敵萬為敵萬所敗擒其壻萬户保喇殺五千餘人資治通鑑後編卷一百七
