body:
  text: 資治通鑑後編卷一百四十四刑部尚書徐乾學撰宋紀一百四十四起昭陽赤奮若正月盡著雍敦牂十二月凡六年理宗建道備德大功復興烈文仁武聖明安孝皇帝寶祐元年春正月庚寅詔以建安郡王孜為皇子改名禥封永嘉郡王製資善堂記賜之帝在位嵗久無子羣臣屢以為言故有是詔戊戌日生戴氣癸卯蒙古兵渡漢江寇萬州入西柳關京湖都統高達調將士扼河關上山大戰至鱉坑石碑港而還二月己酉朔日有食之戊辰陳垓以贓竄潮州三月蒙古攻海州守將王國昌逆戰于城下敗績夏四月乙亥賜禮部進士姚勉以下及第出身時弋陽謝枋得對策極攻副樞董槐與宦官董宋臣及奏名枋得中乙科除撫州司户參軍即棄去初利州都統王夔素殘悍號王夜義恃功驕恣桀驁不受節度所至劫掠每得富家穴箕加頸四面燃箕謂之蟇蝕月以弓弦繫鼻下高懸於格謂之錯繫喉縳人兩股以木交壓謂之乾榨酒以至用醋灌鼻惡水灌耳口等毒虐以一以脅取金帛稍不遂意即死其手蜀人苦之至是余玠至嘉定夔帥所部兵迎謁才羸弱二百人玠曰久聞都統兵精今疲敝若此殊不稱所望夔對曰夔兵非不精所以不敢即見者恐驚從人耳頃之班聲如雷江水為沸旗幟精明舟中皆戰掉失色玠自若徐命吏班賞夔退謂人曰儒者中乃有此人玠久欲誅夔患其握重兵居外恐輕動危蜀謀於親將楊成成曰今縱弗誅飬成其勢後一舉足西蜀危矣夔在蜀嵗久有威名孰與吳氏吳氏當中興危難之時能百戰以保蜀傳之四世根本益固一旦曦為叛逆諸將誅之如取狐豚况夔無吳氏之功而有曦之逆心恃稀突之勇敢慢法度縱兵殘民奴視同列誅之一夫力耳待其發而取之難矣玠意遂決夜召夔計事潛以成代領其衆夔才離營而新將已單騎入矣將士皆錯愕相顧不知所為成以帥指譬曉之遂相率下拜夔至玠斬之乃薦成為文州刺史會戎州帥欲舉統制姚世安為代玠素欲革軍中舉代之弊以三千騎至雲頂山下遣都統金某往代世安世安閉關不納世安素結謝方叔子姪至是求援於方叔方叔遂倡言玠失利戎之心非我調停且旦夕有變又隂嗾世安密求玠之短陳於帝前帝惑之于是世安乃與玠抗玠鬱鬱不樂玠専制四蜀凡有奏疏詞氣不謹帝不能平會徐清叟入對語及玠因言玠不知事君之禮陛下何不出其不意而召之帝不答清叟曰陛下豈以玠握大權召之或不至耶臣度玠素失士心必不敢帝然之六月四川制置使言玠疾亟乃以資政殿學士召玠而以知鄂州余晦代之辛亥以賈似道為資政殿大學士蒙古伐西域秋七月甲午資政殿學士余玠卒玠之治蜀也任都統張實治軍旅安撫王惟忠治財賦監簿朱文炳接賔客皆有常度至於修學養士輕徭以寬民力薄征以通商賈蜀既富實乃罷京湖之餉邊關無警又撤東南之戌自寶慶以來蜀閫未有能及之者然久假便冝之權不顧嫌疑昧於勇退遂來讒口又置機捕官雖足以亷得事情然寄耳目於羣小故人多懷疑懼至是聞召不自安一夕暴卒或謂仰藥死蜀人莫不悲之論曰宋之不競若天有以限之才得一人讒忌即入自其盛時固已有之熙豐以後類不相容迄於南渡日甚一日逮嘉寶間殘金雖亡蒙古方熾余玠治蜀措置有方猶足以為一本之支而謝方叔徐清叟之徒必為疑間以致之死嗚呼玠死之後不特蜀非宋有而國祚從可知矣尋又籍玠家財以犒師忠義之士有不解體者哉八月甲寅起居郎蕭泰來出知隆興府先是起居舍人牟子才與泰來並除子才四疏辭極陳泰來姦險汙穢恥與之伍泰來不得已請祠遂豫郡乙丑行皇宋元寶錢九月壬辰城夔門冬十月丙午朔詔出緡錢二百萬賑恤京城軍民十一月己丑賈似道獻所獲良馬賜詔褒嘉其將士增秩賞賚有差十二月蒙古呼必賚以烏蘭哈達總諸軍事分三道自臨洮經行山谷二千餘里自金沙江乘革囊及筏以濟摩莎蠻主迎降進薄大理城大理國主段氏微弱國政皆決于髙祥至是殺信使遁去呼必賚怒將屠其城張文謙劉秉忠姚樞諫曰殺使拒命者高祥耳非民之罪請宥之姚樞裂帛為旗書止殺之令分號街陌大理之民賴以全活惟虜其王段知興獲高祥斬之分兵取附都鄯善鳥㸑等部進入吐蕃其酋索和托懼而出降兵威所加鮮不欵附呼必賚遂班師留烏蘭哈達攻諸夷之未附者二年春正月乙亥朔蒙古城利州閬州自是蒙古兵且耕且守蜀土不可復矣蒙古呼必賚還京兆以姚樞為京兆勸農使教民耕植二月甲辰朔詔太常釐正秦檜諡諭輔臣曰諡繆狠可也熒惑犯權星庚申詔饒州布衣饒魯不事科舉一意經學補迪功郎本州教授辛酉賜朱熹門人李燔諡文定余晦遣都統甘閏以兵數萬城蜀要地紫金山蒙古汪德臣選精卒銜枚夜進大破之閏僅以身免城遂為蒙古所據蒙古寇合州廣安軍守臣王堅曹世雄等敗之三月甲午城東海賈似道以圖來上王善使蒙古留七年是月來歸夏四月辛亥詔邊兵貧困可閔間田甚多分給耕種守臣理之乙丑以徐清叟知樞密院事董槐參知政事六月甲寅侍御史吳燧等論故蜀帥余玠聚斂罔利七罪玠死其子如孫盡竊帑庾之積以歸詔簿録玠家財以犒師賑邊如孫遂認錢三十萬尋復追削玠職奪如孫告身所認錢徴之纍年始足丙辰利州將王佐堅守孤壘降將南永忠以兵薄城下佐罵之永忠流涕而退初隆慶教授鄭炳孫不從永忠降先縊死其妻女亦朝服自縊詔奬諭佐進官一秩炳孫贈朝奉郎直祕閣仍訪其子官以文資丁巳加呼必賚同知樞密院事庚午召余晦還初晦帥蜀制下徐清叟奏曰朝廷命令不甚行於西蜀者十有二年今天斃余玠乃祖宗在天之靈社稷無疆之福陛下大有為之機也今以素無行檢輕儇俘薄不堪任重如晦者當之臣恐五十四州軍民不特望而輕鄙之韃靼聞之亦且竊笑中國之無人矣所有除晦內批乞賜收回帝責清叟曰數十年來未見執政繳回成命者卿若固執則廟堂之間同列之義皆有不安詔命已頒決難反汗及晦在蜀屢敗邊事日急乃召晦還以李曾伯代之戊戌釋蒙古議和使北歸時伊埓默色已死於揚州矣秋七月己酉詔賈似道開閫以樞密行府為名八月乙亥詔以前知閬州兼利州西路安撫王惟忠付大理獄惟忠以余晦鎮蜀心輕之呼其小字曰余再五來也晦怒誣奏惟忠濳通北國致下大理勘官陳大方煆煉成獄籍其家財九月辛酉詔詣西太一宫為國祈祥起居郎牟子才再疏諫乃止丙寅詔戒外戚母干請冬十月癸酉進封永嘉郡王禥為忠王甲午斬王惟忠于都市血上流而色不變且謂陳大方曰吾死訴于天帝未幾大方入朝恍惚見惟忠遂病十一月壬寅日南至忠王禥冠丁未蒙古城光化舊治蒙古呼必賚以亷希憲為京兆宣撫使希憲輝和爾人父布嚕哈雅初拜亷使希憲適生喜曰吾聞古以官為姓天其以亷為吾宗之姓乎故子孫皆姓亷希憲篤好經史手不釋卷少入侍呼必賚一日方讀孟子聞召因懷以進呼必賚問其説希憲以性善義利仁暴旨對呼必賚善之目為亷孟子希憲嘗與諸貴臣校射連發三中衆驚曰文武材也呼必賚自大理還於京兆分地置宣撫司命希憲為使京兆控制隴蜀諸王貴籓分布左右民雜戎羌尤號難治希憲講求民間利害抑強扶弱摘伏摧姦境內大安暇則明經讀史凡義理精粗事物得失必研究之十二月庚午排保甲行自實法癸未雷甲午隆部兵周榮被獲歸北密約段元鑑入苦竹隘解圍事覺就禽不屈而死馬徽白端戰沒詔立廟于四川是嵗鈞州總管孫嗣遣人賫蠟書降于蒙古蒙古主命大臣求可以慎固封守間於將略者擢史樞征行萬户配以真定相衛懷孟諸軍駐唐鄧樞天倪子也蒙古張柔以連嵗勤兵兩淮艱于糧運奏請據亳之利蒙古主乃詔柔鎮亳州率山前八軍城之柔又以渦水北溢淺不可舟軍既病涉曹濮魏博粟皆不至乃築甬路自亳抵汴堤百二十里流深而不可築復為橋十五或廣八十尺橫以二堡戌之三年春正月己未迅雷庚申城鈞州龍山起居郎牟子才上疏言元夜張燈侈靡倡優下賤竒伎獻笑媟汙清禁上纍聖德今因震霆示威願聖明覺悟天意可回帝納其言祕書危昭德疏言國之命在民民之命在士大夫士大夫不亷朘民膏血為已甘腴民不堪命矣願陛下與二三大臣察利害之實究安危之本明詔郡國申嚴號令俾急其所急凡荒政之當舉者不可一日而置念緩其可緩凡苛賦之肆擾者易為此時之寬政固結人心乃所以延天命也蒙古侵漢蜀荆淮帝深憂之二月乙亥給事中王野言國家與蒙古本無深讐而兵連禍結皆原於入洛之師輕啓兵端二三狂妄如趙楷全子才劉子澄輩淺率寡謀遂致隻輪不返全子才誕妄慘毒今乃援劉子澄例自陳改正乞寢二人之命罷其祠祿以為喪師誤國之戒從之己卯復廣陵堡城賈似道以圖來上蒙古呼必賚徴河內許衡為京兆提學衡幼有異質七嵗入學授章句問其師曰讀書何為師曰取科第耳曰如此而已乎師大竒之謂衡父母曰兒頴悟非常他日必有過人者吾非其師也遂辭去稍長嗜學如飢渴然遭世亂且貧無書嘗從日者家見書疏義因請寓宿手抄歸既而避難徂徠山得易王弼説夜思晝誦身體而力踐之言動必揆諸義而後發嘗暑中過河陽暍甚道有梨衆爭取啖之衡獨危坐樹下或問之曰非其有而取之不可也人曰世亂此無主曰梨無主我心獨無主乎往來河洛間從栁城姚樞得程朱二氏書益大有得尋居蘇門與樞及竇默相講習慨然以道自任嘗語人曰綱常不可一日亡於天下茍在上者無以任之則在下之任也凡喪祭娶嫁必徴於禮以倡其鄉人學者浸盛衡謂之曰進學之序必當棄前日章句之習從事于小學因悉取向來簡帙焚之使無大小皆自小學入是時秦人新脫于兵欲學無師聞衡來人人莫不喜幸於是郡縣皆建學民大化之三月己未雨土詔不許傳播邊事五月久雨以監司州郡辟書冗濫詔申嚴禁止己酉前同知樞密院事李性傳卒辛酉嘉定大雨雹與敘南同日地震閩浙大水以內侍董宋臣幹辦佑聖觀宋臣逢迎上意起梅堂芙蓉閣香蘭亭豪奪民田引倡優入宫招權納賄無所不至人以董閻羅目之監察御史洪天錫上疏言天下之患三曰宦官外戚小人蓋指宋臣及謝堂厲文翁也帝俾天錫昜疏欲自戒飭之天錫又言自古姦人雖慿怙其心未嘗不畏人主之知茍知之而止於戒飭則慿怙愈張不若未知之為愈也不報六月以樞密院編修鎮江丁大全為右司諌大全面藍色為戚里婢壻夤緣閻妃及內侍盧允升董宋臣得寵于帝自蕭山尉纍拜是職時正言陳大方侍御史胡大昌與大全同除皆緘默不言人於其名大字旁各加一點目為三不吠犬戊子罷監察御史洪天錫時雨土天錫以其異為蒙力言隂陽君子小人之辨又言蜀中地震閩浙大水上下窮空逺近嗟怨獨貴戚巨閹享富貴耳舉天下窮且怨陛下能獨與數十人者共天下乎會吳民列訴董宋臣奪其田天錫下其事有司而御前提舉所謂田屬御莊不當白臺儀鸞司亦牒常平天錫謂御史所以雪寃常平所以均役若中貴人得以控之則內外臺可廢猶為國有紀綱乎乃申劾宋臣併盧允升又言修內司止于供繕修而已比年動曰御前姦贓之老吏逋逃之渠凶一竄名其間則有司不得舉手狡者獻謀暴者助虐其展轉受害者皆良民也願毋使史臣書之曰內司之橫自今始疏六七上留中不報天錫遂去詔遷太常少卿宗正寺丞趙崇嶓移書責謝方叔不能止救方叔得書甚慙而讒者又曰天錫之論方叔意也其去亦方叔擠之方叔上書自解帝終不信辛卯僉書樞密院事王野罷秋七月丙辰監察御史朱應元劾左丞相謝方叔參知政事徐清叟罷之董宋臣盧允升猶未快賂人上書力詆洪天錫謝方叔且乞誅之使天下明知宰相臺諫之去出自獨斷於內侍無預蒙古烏蘭哈達自吐蕃進攻西南夷悉平之八月乙丑朔以董槐為右丞相兼樞密使工部尚書程元鳯僉書樞密院事工部侍郎蔡抗同僉書樞密院事抗處士元定之孫也丁卯嵗熒惑合于栁庚寅前參知政事應􅀈為右司諫丁大全所劾落職罷祀辛邜卒九月壬戌權中書舍人陳大方言劉子澄端平入洛之師賈勇贊決北兵方入唐州界子澄已先率遁逃一敗塗地二十年來為國家患者皆原於此宜投之四裔詔罷子澄祠祿蒙古張柔會大帥于符離以百丈口為宋往來之道可容萬艘遂築甬路自亳而南六十餘里中為橫江堡又以路東六十里皆水可致宋舟乃立柵水中密置偵邏于所達之路由是鹿邑寧陵考城柘城楚丘南頓無宋患陳蔡潁息糧無不達冬十一月丁丑熒惑犯太微垣上相十二月己丑嗣濮王善奐卒四年春正月乙未詔謝方叔奪職罷祠己酉太隂犯熒惑辛酉詔史嵩之授觀文殿大學士依前金紫光祿大夫永國公致仕加食邑三月丙辰帝製字民訓賜改秩親民官夏四月癸未以程元鳯參知政事蔡抗同知樞密院事賈似道參知政事職任依舊似道威權日盛臺諫嘗論其部將即毅然求去孫子秀新除淮東總領外人忽傳似道已密奏不可執政遂置子秀以似道所善陸壑代之五月甲午賜孔子五十代孫元龍迪功郎授初品官甲辰羅氏鬼國遣報思播言蒙古兵屯大理國取道西南將大入邊詔以銀萬兩使思播結約羅鬼為援且嚴飭守備以待之徐清叟王野並奪職罷祠仍禠執政恩數甲寅賜禮部進士文天祥以下六百一人及第出身策以志勤道逺為問天祥以法天不息為對考官王應麟奏曰是卷古誼若龜鑑忠肝如鐵石臣敢為得人賀時謝枋得復出試教官中兼經科除建寧府教授未任吳濳宣撫江東西郡差幹辦公事團結民兵以扞饒信撫科降錢米以給之枋得説鄧傳二杜諸大家得民兵萬餘人守信州暨兵退朝廷核諸軍費幾至不免六月癸未右丞相董槐罷槐自以為人主所振拔茍可以利安國家者無不為嘗言于帝曰今有害治者三一戚里不奉法二執法大吏久於其官而擅威福三皇城司不檢士將卒不檢下故士卒橫士卒橫則變生於無時執法威福擅故賢不肖混淆賢不肖混淆則姦邪肆賢人伏而不出親戚不奉法故法令輕法令輕故朝廷卑三者不去政且廢願自上除之於是嫉之者滋甚時帝年寖髙操柄獨斷羣臣無當意者漸喜狎佞人丁大全方諂事內嬖得侍御史竊弄威權帝弗覺悟大全嘗遣客私於槐槐曰吾聞人臣無私交吾惟事上不敢私結約幸為謝丁君大全度槐終不容己乃日夜刻求槐短槐入對極言大全邪侫不可近帝曰大全未嘗短卿卿勿疑槐曰臣與大全何怨顧陛下拔臣至此臣知大全姦邪而噤不言是負陛下也且陛下謂大全忠而臣以為姦不可與俱事陛下矣上書乞骸骨不報大全益怨之乃上章劾槐章未下大全夜半以臺檄調省兵百餘人露創圍槐第迫之出輿槐至大理寺欲以此脅之須臾出北關棄槐囂呼而散槐徐步入接待寺罷相之制始下物論殊駭三學生屢上書言之乃詔槐以觀文殿大學士提舉洞霄宫大全既逐槐益恣橫用事道路以目太學生陳宜中黃鏞林則祖曾唯劉黼陳宗六人上書攻之大全怒使御史吳衍劾之削籍編管逺州立碑三學戒諸生勿得妄議國政士論稱宜中等為六君子時大全擅國柄以言為諱左司郎官陳宗禮歎曰此可一日居乎陛對言願為宗社大計毋但為倉廪府庫之小計願得天下四海之心毋但得左右便嬖戚畹之心願寄腹心於忠良毋但寄耳目于卑近願四通八達以來正人毋但旁蹊曲徑以引貪濁時祕書省正字鄱陽馬廷鸞將輪對大全知其必論已使王持垕往瞷之廷鸞素厚持垕且同館不虞其諜也密露其意持垕以告大全大全格之使不得見而令御史朱熠劾去之秋七月甲寅知敘州史俊調舟師連與蒙古兵戰却之乙卯以程元鳯為右丞相兼樞密使蔡抗參知政事刑部尚書張磻僉書樞密院事蒙古諸王塔齊爾駙馬特爾格軍過東平諸處掠民羊豕蒙古主聞之遣使問罪由是諸軍無犯者九月甲寅監察御史朱熠言境土蹙而賦斂日繁官吏增而調度日廣景德慶厯時以三百二十餘郡之財賦供一萬餘員之俸祿今日以一百餘郡之事力贍二萬四千餘員之冗官邊郡則有科降支移內地則欠經常納解欲寬民力必汰冗員帝嘉之而不能用侍講危昭德上言民者邦之命脈欲壽國脈必厚民生欲厚民生必寬民力願陛下為萬世根本之慮為一時倉卒之防必求安節之亨毋招不節之咎節之又節則宮闈之費差省帑藏之積自充上用足而下不匱矣蒙古主欲建城市修宫室為都會之所呼必賚以劉秉忠精於天文地理之術因命相宅秉忠以桓州東灤水北之龍岡為吉詔秉忠營之三年而畢名曰開平府既而升為上都以燕為中都冬十一月癸丑詔戒羣臣洗心飭行毋縱于貨賄其或不悛舉行淳熙成法又開國以來勳臣之裔有能濟美而不世其祿者所在州郡以聞以張璠同知樞密院事侍御史丁大全僉書樞密院事禮部侍郎馬天驥同僉書樞密院事時閻貴妃怙寵大全天驥用事有無名子書八字於朝門曰閻馬丁當國勢將亡十二月戊午朔熒惑犯填星庚申蒙古城棗陽帝以御寶黃册催內藏坊場錢知嚴州吳槃奏言內庫理財太急督催太峻龍章鳯篆施於帑藏之催科寶册泥封下同官司之文檄居萬乘之崇髙而商財賄之有無事雖至微關係甚大董宋臣諷給事中邵深劾罷之是嵗髙麗國王細嵯甫雲南酋長摩合羅嵯及素丹諸國皆入朝于蒙古蒙古烏蘭哈達伐白蠻等部克之遂自昔入兒地還至重慶府五年春正月丁亥朔以賈似道知樞密院事職任依舊召荆湖制置使吳淵參知政事未至卒諡莊敏淵有才略歷官所至有能名然政尚嚴酷好興羅織之獄籍入豪橫故有蜈蚣之謡丙午禁姦民作白衣會盟監司郡縣官失覺察者坐罪蒙古主左右讒呼必賚得中土心蒙古主信之遂遣阿勒達爾行省事于京兆劉太平佐之鈎考諸路財賦置局關中推集經略宣撫官吏下及征商煆鍊羅織無所不至曰俟終局曰入此罪者惟劉哈瑪爾史天澤以聞餘悉誅之呼必賚聞之不樂姚樞曰帝君也兄也大王為皇弟臣也事難與較逺將受禍莫若盡王邸妃主自歸朝廷為久居謀疑將自釋及呼必賚見蒙古主皆泣下竟不令有所白而止因罷鈎考局而呼必賚所署置諸司皆廢蒙古董文蔚既城光化棗陽儲餱糧會攻襄陽樊城南據漢江北阻湖水卒不得渡文蔚夜領兵于湖水狹隘處伐木拔根立于水實以薪草為橋頃之即成至曉兵悉渡圍已合城中大驚文蔚復統軍前行奪外城襄陽守將高達力戰于白河乃還二月戊午以賈似道為兩淮安撫使壬戌築思州三隘丁丑布衣余一飛高把陳襄陽備禦策命京湖宣撫使趙葵行之夏四月己卯蒙古兵攻苦竹隘詔荆湖調兵應援五月丁卯城荆山置懷逺軍以夏貴知軍事六月丁酉同僉書樞密院事馬天驥罷秋八月庚子以張磻參知政事丁大全同知樞密院事己酉觀文殿大學士永國公史嵩之卒嵩之為相雖飾詐要譽而肺肝如見終不為公論所容初諡忠簡改諡莊肅至德祐初以徐直方言奪諡九月壬子朔詔今後臺臣遷他職輒出關以違制論仍著為令回鶻獻水精盆珍珠􅏛等物于蒙古可直銀三萬餘錠蒙古主曰方今百姓疲敝所急者錢爾朕獨有此何為却之賽音迪延齊以為言蒙古主稍償其直且令勿復有獻蒙古諸王伊蘇肯駙馬伊遜岱爾等請伐宋蒙古主亦怒宋囚使臣是月議出師南侵冬十月庚寅參知政事張磻卒丁酉以吏部侍郎林存僉書樞密院事癸巳雷甲午龍見十一月乙丑奬諭安南國賜金器幣香茗蒙古將烏蘭哈達兵入交趾遣使諭降皆見囚及兵至洮江交人戰敗其王陳日照走海島蒙古得前所遣使於獄中以破竹束體入膚比釋縳一使死因屠其城留九日以熱不能堪班師十二月丁未熒惑入氐六年春正月辛亥朔以丁大全參知政事兼同知樞密院事二月辛巳以馬光祖為京湖制置使知江陵府兼夔路策應光祖為松江制置辟召僚屬皆極一時之選至是移鎮江陵請以汪立信吕文德王登王鑑充講議官從之壬辰雨土蒙古主命諸王阿爾布格居守和林阿拉克岱爾輔之自將南侵由西蜀以入先遣張柔從呼必賚攻鄂趣臨安塔齊爾攻荆山又使鳥蘭哈達自交廣引兵會于鄂張文謙劉秉忠言於呼必賚曰王者之師有征無戰當一視同仁不可嗜殺呼必賚曰期與卿等共守此言於是分命諸將毋妄殺毋焚人室廬所獲生口悉縱之阿爾布格呼必賚弟也蒙古耨埓將前軍欲會都元帥阿都呼於成都四川制置使蒲擇之遣安撫劉整等據遂寧江箭灘渡以斷東路耨埒軍至不能渡自旦至暮大戰整等軍敗耨埒遂長驅至成都擇之命楊大淵等守劍門及靈泉山自將兵趣成都會阿都呼卒耨埒率諸將大破大淵等于靈泉山進圍雲頂山城扼其歸路擇之兵潰城中食盡亦殺主將以降成都彭漢懷綿等州威茂諸蕃悉降蒙古主以耨埓為都元帥蒙古遣諸王錫里庫伐西域錫里庫以超瑪納郭顔郭侃總統諸軍前後平西域和斯摩哩十餘國轉鬪萬里又西渡海收富浪國遣使獻捷錫里庫遂留鎮西域安南王陳日照傳國於長子光昺光昺遣其壻以方物入貢于蒙古三月戊辰以馬光祖兼荆湖北路安撫使庚午熒惑退入氐夏四月乙巳程元鳯罷丁未以丁大全為右丞相兼樞密使林存同知樞密院事端明殿學士朱熠僉書院事時大全謀奪相位元鳯謹飭乏風節力請罷政遂豫祠蒙古主由東勝河渡次六盤山軍四萬號十萬分三道而進蒙古主由隴州趣散關諸王孟克由祥州趣米倉關萬户巴哩察由潼關趣沔州徴益都行省李璮兵璮言益都南北要衝兵不可撤從之璮遂攻海州漣水軍等處璮全之子也五月丁巳李曾伯言廣西多荒田民懼增賦不耕乞許耕者復三年租後兩年減其租之半守令勸墾闢多者賞之奏可丁邜嗣秀王師彌卒蒙古皇子阿蘇岱因獵傷民稼蒙古主責之撻近侍數人有拔民蔥者斬以徇由是秋毫莫敢犯秋七月庚戌城陵霄山癸丑熒惑犯房宿甲戌詔前福建漕臣高斯得已奪職鐫官共贓百餘萬嚴限徴償以懲貪吏蒙古主留輜重于六盤山率兵由寶雞攻重貴山所至輒陷八月癸未太隂行犯熒惑戊戌詔上流鎖江防禦癸邜詔申嚴倭船入界之禁九月甲寅詔安南情狀叵測申飭邊防蒙古主進次漢中都元帥耨埒留密拉和卓劉哈瑪爾等守成都自率衆渡馬湖獲守將張實遣之招諭苦竹隘實入隘遂與守將楊立堅守冬十月壬午蒙古主進次寶峯癸未如利州觀其城池並非深固以汪田哥能守賜巵酒奬諭之遂渡嘉陵江至白水命田哥造浮梁以濟進次劍門戊子遣史樞攻苦竹隘禆將趙仲竊獻東南門師入楊立巷戰死獲張實殺之庚子進圍長寧山守將王佐徐昕戰敗十一月己酉進攻鵝頂堡壬子知縣王仲降城破佐死焉翼曰蒙古主入城殺佐之子及徐昕等四十餘人青居大良運山石泉龍州守將劉淵蒲元圭張大悅趙順等俱以城降惟運山將施擇善不屈死之蒙古諸王孟克塔齊爾並略地還引兵來會蒙古主進攻長獲山遣王仲招守將楊大淵大淵殺之蒙古主督諸軍力攻大淵懼遂以城降推官趙廣死之大淵逃歸蒙古主怒欲屠其城將官李呼蘭濟曰大淵去事未可測當亟追之乃單騎至城下門未閉大呼入城曰皇帝使我撫汝軍民即下馬執大淵手曰上方宣諭賞賜不待而來何也大淵曰恐城寨有他變是以亟歸耳因與偕來蒙古主大悅以大淵為都元帥己酉同知樞密院事林存罷知建寧府壬子賈似道進樞密使職任依舊以朱熠同知樞密院事禮部侍郎饒虎臣同僉書樞密院事丁邜蒙古將李璮陷海州漣水軍海州通判侯畐鏖戰死之闔室遇害餘將士殺傷殆盡賈似道上章引咎詔以功自贖甲戌填星熒惑合于危龍州降于蒙古十二月戊寅詔改明年為開慶元年蒙古取資簡二州庚辰以蒙古兵入蜀詔荆湖制置使馬光祖移司峽州向士璧移司紹慶府以便策應時士璧不俟朝命進師歸州捐家資百萬供以軍費光祖亦不待奏請招兵萬人捐銀萬兩以募壯士迎戰于房州蒙古敗走丁亥詔光祖士璧各進一秩辛丑填星太白熒惑合于室蒙古取隆雅二州是嵗蒙古皇子璸都卒資治通鑑後編卷一百四十四
