body:
  text: 資治通鑑後編卷十八刑部尚書徐乾學撰宋紀十八起柔兆涒灘六月盡疆圉作噩十二月凡一年有竒太宗至仁應道神功聖德睿烈大明廣孝皇帝至道二年六月庚辰溫州言永嘉縣民陳侃五世同居內無異㸑侃事親至孝為鄉里所稱詔旌表門閭賜其母粟帛帝謂侍臣曰德安陳旭一族孝友恭儉未見其比參知政事張洎奏曰旭家長幼千口餘世世守家法孝謹不衰閨門之內肅如公府帝曰近聞嵗或小歉本郡以官米二千石貸之旭但受其半或謂之曰曷不受而糶之可以得善價旭曰朝廷以旭羣從聚居特出王賦貸私室豈可見利忘義為罔上之事乎此深可嘉賞旭侃之從父弟也乙未以祕書丞任中正為江南轉運副使中正軀幹頎長帝擇大笏命取緋衣之長者賜之至部嵗大稔賦租平糴皆有羡盈發運使王子輿欲悉調餉京師中正曰東南嵗輸五百餘萬江南所出過半今雖有餘而後或小歉則數不登將急取吾民乎子輿乃止秋七月己亥朔命殿前都指揮使王超為夏綏麟府州都部署庚申太常博士直史館陳靖上言古者彊幹弱枝之法必先實富於內今京畿周環二三十州幅員數千里地之墾者十才二三稅之入者又十無五六國用不充民食不足望擇大臣一人有深識逺略者兼領大司農事典領於中又於郎吏中選才智通明能撫民役衆者為副執事於外自京東西擇其膏腴未耕之處申以勸課借閒曠之地募游惰之民别置版圖便宜從事酌民力之豐寡相農畝之磽瘠均配畀之無煩督課耕桑之外更課令益種雜木蔬果孳畜羊犬雞豚俟至三五年間生計成立有家可戀有土可懷即計户定征量田輸稅斯實敦本化人之宏略也帝覽奏召對奬諭令條奏以聞尋以靖為勸農使按行陳許蔡潁襄鄧唐汝等州勸民墾田以大理寺丞皇甫選光祿寺丞何亮副之未幾三司以為多費其事遂寢丙寅參知政事寇凖罷為給事中先是郊祀行慶中外官吏皆進秩凖遂率意輕重其素所喜者多得臺省清秩所惡及不知者即平叙之廣州左通判左正言馮拯轉虞部員外郎右通判太常博士彭惟節乃轉屯田員外郎拯嘗與凖有隙凖故抑之惟節自以素居拯下章奏列銜皆如舊不易凖怒以中書劄子升惟節於拯上帝切責拯仍特免勘罪拯忿曰上日閲萬幾寧察見此細事蓋寇凖弄權耳因上疏極言并及嶺南官吏除拜不均凡數事又封中書劄子以進嶺南東路轉運使康戬亦言呂端張洎李昌齡皆凖所引端心德之洎曲奉凖昌齡畏懦皆不敢與凖抗故得以任胸臆亂經制帝大怒凖適祀太廟攝行事召端等責之端曰臣等皆陛下擢用待罪相府至於除拜專恣實凖所為凖性剛自任臣等忝備大臣不欲忿爭慮傷國體因再拜請罪既而凖入對前殿帝語及馮拯所訴事凖抗言與端等同議除拜帝曰若廷辨是非又深失執政之體矣凖猶力爭不已帝歎曰雀鼠尚知人意况人乎翌日凖又抱中書簿領論曲直於帝前帝益不悅遂罷之尋出知鄧州是月以丁惟清知西凉府凉州周回二千里東界原州南界雪山吐谷渾蘭州西界甘州北界吐蕃領姑臧神烏蕃禾昌松嘉麟五縣户二萬五千有竒城周四十五里李軌所築久不內屬至是請帥從之閏七月庚寅詔江浙福建民負人錢沒入男女者還其家敢匿者有罪九月戊寅右僕射宋琪卒贈司空諡惠安琪素有文學尤通明吏術頗諧給能周知人之情僞在相位日百執事有所求請多面折之以是取怨於人己卯夏州延州行營言兩路合勢破賊於烏白池斬首五千級生擒二千餘人賊首李繼遷遁去先是帝部分諸將攻討李繼隆自環州范廷召自延州王超自夏州容州觀察使丁罕自慶州錦州刺史張守恩自麟州凡五路率兵抵烏白池皆先授以方略守恩令鐸子也師巳有期銀夏鈐轄盧斌求對懇言曰蕃夷之族馬驕兵悍往來無定敗則走他境疾戰沙漠非天兵所利不若堅保靈州於內地多積芻粟以師援送茍其至也會兵首尾擊之庶幾無枉費且不失固圉之䇿帝不從改授斌環慶鈐轄領兵二萬為繼隆前鋒斌謂繼隆曰靈州趨烏白池月餘方至若自環州橐駝路才十日程耳繼隆因遣其弟繼和馳驛上言赤柳路回逺乏水請自清岡峽直抵繼遷巢穴不及援靈州帝怒召繼和於便殿詰之曰汝兄如此必敗吾事矣因手書切責繼隆命引進使周瑩賫詣軍前督之瑩至繼隆巳便宜發兵矣既而與罕兵合行數十日不見虜引兵還張守恩見虜不擊率兵歸本部獨超廷召至烏白池與賊遇大小數十戰雖頻克捷而諸將失期士卒困乏終不能擒賊焉時超子德用年十七為先鋒部萬人戰鐵門關斬首十三級俘掠畜産以萬計及進師烏白池虜鋭甚超不敢進德用請乘之得精兵五千轉戰三日虜既却德用曰歸師迫險必亂乃領兵距夏州五十里先絶其險下令曰敢亂行者斬一軍肅然超亦為之按轡虜躡其後望見隊伍嚴整不敢近超撫其背曰王氏有子矣丙戌秦晉諸州地晝夜十二震甲午詔壽寧節賜翰林學士兩省五品尚書省四品以上一子出身先是近臣因誕節或以疏屬求蔭補至是始為限制非其子孫及親兄弟多寢而不報冬十月己未以池州新鑄錢監為永豐監嵗增鑄錢數十萬緡甲子併三司勾院為一工部員外郎劉式專領之上面命式曰以汝一人當三人之職宜勉盡力副朕所望式久居計司深究簿領之弊江淮間舊有橫賦積逋至多式奏免之然檢校過峻卒為下吏所訟免官十一月丁卯朔司天冬官正楊文鎰上言請於新厯六十甲子外更增二十年事下有司判司天監苖守信等議以為無所稽据不可行用帝曰支干相承雖止於六十倘兩周甲子共成上壽之數期頥之人得見所生之嵗不亦善乎因詔有司新厯以百二十甲子為限十一月乙巳禮部侍郎知陳州蘇易簡卒易簡少好學才思敏贍在翰林八年眷遇敻絶遂參大政性嗜酒沉湎不已帝親書勸酒戒酒二詩以賜令對其母讀之自是每入直不敢飲帝聞其死曰易簡竟以酒敗深可惜也贈禮部尚書辛亥有司言鳳州出銅􅑭定州出銀􅑭請置官掌其事帝曰地不愛寶當與衆庶共之不許戊午詔自今州縣官部內流民及亡失租調什之一者並書下考是嵗大有年天下户三百五十七萬有竒三年春正月丙子以户部侍郎溫仲舒禮部侍郎王化基並參知政事給事中李惟清同知樞密院事化基寬中有度量所在僚屬或慢於禮者不以介意時邊境多事帝欲相仲舒而罷呂端會不豫乃止參知政事張洎罷為刑部侍郎乙酉葬孝章皇后於永昌陵辛卯以步軍都虞候傅潜為延州路都部署殿前都虞候王昭逺為靈州路都部署戶部使張鑑調陜西諸州軍儲鑑上疏曰伏見關輔之民數年以來併有科役畜産蕩盡室廬頓空今若復有差率益致流亡縱使驅迫而前復恐逗撓而潰願陛下特垂詔㫖無使重勞因兹首春俾務東作况靈州一方僻居塞外雖曰西陲之要地實為中夏之蠧區竭物力以供須困甲兵而援送事當深慮患宜預防若待川决而後隄火熾而方戢則焚溺之患深矣雖欲拯救其可得乎二月丙申朔靈州行營破李繼遷繼遷遁辛丑帝不豫始决事於便殿甲辰降京畿死罪囚流以下釋之三月壬辰帝不視朝癸巳崩於萬嵗殿參知政事溫仲舒宣遺制令皇太子即位於柩前初帝不豫宣政使王繼恩忌太子英明與參知政事李昌齡知制誥胡旦等考異陳桱通鑑續編又有殿前都指揮使李繼勳今從長編謀立楚王元佐頗間太子宰相呂端問疾禁中見太子不在旁疑有變乃以笏書大漸字令親密吏趣太子入侍及帝崩繼恩白后至中書召端議所立端前知其謀即紿繼恩使入書閣檢太宗先賜墨詔遂鎖之亟入宮后謂曰宫車晏駕立嗣以長順也今將奈何端曰先帝立太子政為今日豈容更有異論后默然太子既即位端平立福寧殿下不拜請卷簾升殿審視然後降階率羣臣拜呼萬嵗李燾曰王繼恩等謀廢立實録國史絶不見其事迹蓋若有所隱諱今據呂誨集正惠公補傳及司馬光記聞增修補傳所載比之記聞尤詳也夏四月乙未朔尊皇后為皇太后大赦天下常赦所不原者咸除之制曰先朝庶政盡有成規務在遵行不敢失墜然而纂圖伊始懼德弗明所宜拔茂異之才開諫諍之路撫綏鰥寡惠復疲羸庶幾延宗社之鴻休召天地之和氣京朝官衣緋緑及二十年並與改服色官未升朝亦聽敘賜緋紫自此始戊戌始見羣臣於崇政殿西序癸卯宰相呂端加右僕射改封弟元份雍王元傑兖王元偓封彭城郡王元稱封安定郡王甲辰以太子賓客李至為工部尚書李沆為户部侍郎並參知政事丁未中外羣臣進秩一等工部侍郎郭贄出知大名府贄翌日求對懇辭帝曰全魏之地所寄尤重卿宜亟去贄退帝召輔臣問曰郭贄願留如何對曰近例亦有之帝曰朕初嗣位命贄治大藩而不行則何以使人卒遣之帝謂宰相曰朝行中頗有淹滯之人如梁周翰夙負詞名三十年屈於衆僚甚可念也朕在宫府多令楊億草箋奏文理精當冝即加奬擢辛亥以工部郎中史館修撰周翰為駕部郎中知制誥著作郎直集賢院億為左正言館職並如故故事入西閣皆中書召試制誥三篇惟周翰不召試而命焉李應機者嘗知咸平縣帝尹開封時遣散從以帖下縣有所追捕散從恃王勢歡呼縣廷應機怒曰汝所事者王也我所事者王之父也父之人可以笞子之人杖之二十散從泣訴於王王不答而默記其名及即位擢應機通判益州召之登殿謂曰朕方以西蜀為憂故除卿此官此未足為大任也有便宜事密疏以聞應機至州未幾有走馬入奏事前一日知州置酒餞之應機故稱疾不會走馬心已不平及暮應機又謂走馬曰應機有密疏欲附走馬入奏明日未可行也走馬不知其受上㫖愈怒彊應曰諾明日使人謂應機曰某治裝已具且行矣願得所賫之疏應機曰疏不可與人傳也當自來受之走馬雖怒甚意欲積其驕橫之狀訴於帝乃詣應機廨舍受其疏以行既至升殿帝迎問曰李應機無恙乎有疏來否走馬愕然失據即對曰有因探其懷出之帝周覽稱善數四因問應機在蜀治行如何走馬踧踖轉辭更為稱譽帝曰汝還語應機凡所言事皆善已施行矣更有意見盡當以聞蜀中無事行召卿矣頃之召入遷擢數嵗中至顯官應機為吏彊敏而貪財多權詐後帝察其為人浸疏之進封交趾郡王黎桓為南平王辛酉知制誥胡旦責授安逺節度行軍司馬旦與王繼恩等邪謀既露帝新即位未欲窮究之而旦草行慶制詞頗恣胸臆多所溢美語復訕帝故先絀之五月丙寅從羣臣請始御正殿視朝退御後殿閲事如常儀丁卯詔諭內外文武羣臣自今人君有過時政或虧軍事臧否民間利害並許直言極諫抗疏以聞庚午詔三司及嵗稔市糴以實倉廪壬申罷江淮發運使諸路轉運使司承受公事朝臣使臣悉召歸闕帝初聽政務從簡易也甲戌參知政事李昌齡責授忠武節度行軍司馬宣政使王繼恩責授右監門衛將軍均州安置胡旦削籍流潯州太宗之即位也繼恩有力焉自是寵遇莫比繼恩喜結黨邀名譽乘間言事或薦外朝臣故士大夫之輕薄好進者輒與往來每以多寶僧舍為期潘閬得官亦繼恩所薦也閬傾險士嘗說繼恩乘間勸立儲二且言南衙自謂當立立之將不德我即議所立宜立諸王之不當立者南衙謂帝也繼恩信其說頗惑太宗太宗訖立帝閬尋坐狂妄絀太宗疾革繼恩與昌齡及旦更起邪謀呂端覺之謀不得逞帝既即位加恩百官繼恩又密託旦為褒詞旦已先坐絀於是并逐三人籍繼恩家資多得蜀土僣侈之物尋詔中外臣僚曽與繼恩交結及通書疏者一切不問後二年繼恩死於貶所甲申上謂輔臣曰宫中嬪御頗多幽閉可閔朕已令給事嵗深者悉放出之呂端等曰陛下踐阼之初首行此令實哲王之懿範也丁亥立秦國夫人郭氏為皇后帝為太子每事謙讓郭氏未嘗正妃號也庚寅追尊母隴西夫人李氏為賢妃妃真定人乾州防禦使英之女帝及楚王元佐皆妃所生也考異庚寅二十七日追尊賢妃實録本紀並闕此據㑹要六月戊戌追復皇叔涪王廷美為秦王贈皇兄魏王德昭太傅岐王德芳太保帝謂宰相曰諸州多以珍獸異禽祥瑞之物來獻此甚無益在朕薄德非所敢當但令稼穡豐稔且得賢臣乃為瑞也辛丑詔天下勿復獻珍禽異獸及諸祥瑞先是南康軍建昌縣民洪文撫六世同居室無異爨就所居雷湖北創書院舍來學者太宗遣內侍裴愈齎御書賜其家文撫遣弟文舉詣闕貢土物為謝太宗書飛白一幅曰義居人以賜之授文舉江州助教於是詔旌表其門閭自是每嵗入貢必厚賜答之甲辰以皇兄元佐為左金吾衛上將軍復封楚王聽養疾不朝帝始欲幸元佐第元佐固辭以疾曰雖來不敢見也由是終身不復見罷鹽鐵度支户部副使乙巳追册莒國夫人潘氏為皇后工部侍郎同知樞密院事錢若水罷為集賢院學士判院事先是太宗為若水言士遭時得位紆金拖紫延賞宗族豈得不竭誠報國乎若水對曰髙尚之士固不以名位為光寵忠貞之士亦不以窮達易志操其或以爵祿榮遇之故而效忠於上中人以下之所為也太宗然其言及劉昌言罷太宗問趙鎔等曰見昌言否鎔等曰屢見之太宗曰涕泣否對曰與臣等言多至流涕太宗曰大率如此當進用時不能悉心補職一旦斥去即汍瀾涕泗若水曰昌言實未嘗涕泣蓋鎔等迎合上意耳呂䝉正罷太宗又謂若水曰䝉正望復位目穿矣若水對曰蒙正雖登顯貴然其風望不為忝冒僕射師長百僚非寂寞之地且䝉正固未嘗以退罷鬱悒當今巖穴髙士不求榮爵者甚多如臣等輩但茍貪官祿誠不足重太宗默然若水因念人主待輔臣如此蓋未嘗有秉節髙邁不貪名勢能全進退之道者以感動之故也將移疾會太宗晏駕不果帝即位若水以母老請解機務章再上乃得請召謝便殿命坐問近臣誰大用者若水言中書舍人王旦有德望帝曰此固朕心所屬也若水好汲引後進推賢重士其在樞密同年生有為縣佐者每謁見若水必序齒而拜之考異談苑載若水辭位事甚美但頗顛倒又悮以對呂䝉正寂寞事為劉昌言事按昌言罷樞密在䝉正罷相前三月䝉正罷相時昌言已在襄州矣今皆改正之又田畫記若水事云王曽罷相章聖語若水若水憤而出被道士服歸嵩山此甚誤今不取帝居憂日對輔臣於禁中每見呂端等必肅然拱揖不以名呼端等再拜而請帝曰公等顧命元老朕安敢上比先帝又以端膚體洪大宫庭階戺命梓人皆為納陛焉秋七月乙丑御崇政殿召端等訪以軍國大事經久之制端陳當世急務皆有條理帝甚嘉納丙寅令諸路轉運使更互赴闕詢以民間利病吏部郎中直集賢院田錫應詔上疏言陜西數十州苦於靈夏之役生民重困上為之戚然他日謂宰相呂端等曰近詔中外直言羣臣奏對多及瑣細之事惟田錫康戬陳詞不繁指事尤切張齊賢頗留意於民政乃出其疏示端等曰卿等詳酌行之八月己亥趙鎔罷為壽州觀察使李惟清罷為御史中丞以曹彬為樞密使兼侍中罷旄鉞以戶部侍郎同知樞密院事向敏中給事中夏侯嶠並為樞密副使帝謂曰近密之司典領尤重必端亮謹厚者處之彬以耆舊冠樞衡之首敏中及嶠佽助之兵機邊要有所望矣敏中明辨有才略先是西北用兵敏中專主謀議至於二邊道路斥堠走集之所莫不周知嶠仕藩府最舊故首加擢用焉先是帝以漢唐封乳母為夫人邑君故事付中書因問呂端等曰斯禮可行否如不可行則止朕不敢以私恩紊正法也端等奏曰前代舊規斯可行矣或加以大國或益之美名事出宸衷禮無定制己酉詔封乳母齊國夫人劉氏為秦國延壽保聖夫人是月西川戍卒劉旴叛攻掠蜀漢等州益州鈐轄馬知節領兵三百追擊之招安使上官正飛書召知節還成都計議知節曰賊兵已數千若少緩之勞費必倍不如急擊破之必矣即率所部前進正亦尋至共擊斬旴其黨悉平旴自起至滅凡十日正始無出兵意知益州張詠以言激正將行仍盛為供帳餞之酒酣舉爵謂諸軍校曰爾曹俱有親屬在東䝉國厚恩無以報此行當亟殄賊無使越逸若師老曠日即此地還為爾死所矣正由是倍道力戰及凱旋詠迎勞大出金帛行賞衆皆悅服九月丙子帝因言西川叛卒事輔臣或曰蓋地無城池所以失其制禦帝曰在德不在險儻官吏得人善於綏撫使之樂業雖無城可也考異寶訓以蜀城為趙鎔之言然鎔時已罷樞密矣今不取戊寅以長葛縣令孔延世為曲阜縣令襲封文宣公并賜九經及太宗御書祭器加銀帛而遣之詔本道轉運使本州長吏待以賔禮延世孔子四十五世孫也壬午左正言孫何表獻五議一參用儒將二申明太學三釐革遷轉四議復制科五舉行鄉飲奏入帝稱善監察御史王濟上疏陳十事一擇左右二分賢愚三正名品四去冗食五加俸祿六謹政教七選良將八分兵戎九修民事十開仕進刑部員外郎馬亮上疏言陛下初政軍賞宜速而所在不時給請遣使分往督視又州縣逋負至多赦書雖為蠲除而有司趣責如故非所以布宣恩澤也國朝故事以親王判開封府地尊勢重疑隙易生非保親全愛之道契丹仍嵗內寇河朔蕭然請修好以息邊民凡四事帝善其言庚寅閣門奏每月朔望羣臣赴萬嵗殿哭臨十月朔在壬辰請改用九月晦帝問呂端曰此何禮也端曰陰陽家以辰日為哭忌帝曰哀疚之情寧有所避乎不許冬十月陳宋州並言先貸民錢千萬令市牛價納外所負尚多許隨來嵗夏秋稅輸送詔悉除之己酉葬神功聖德文武皇帝於永熙陵廟號太宗十一月甲子祔神主於太廟以懿德皇后配又祔莊懷皇后於别廟帝初踐阼告天地宗廟有司請署祝版帝涕泗交下不能署者久之靈駕發引帝與諸王徒步號慟從至乾元門禮官具儀遣奠畢改吉服帝不忍哭踊盡哀縗服還宫及神主至京迎拜涕咽觀者莫不歔欷先是帝謂參知政事李至等曰神主至京朕欲親𨗳及拜辭於禮可乎至曰此禮前代所闕陛下行之足以為萬世法矣即具儀以聞時有建議請增損舊政者帝曰先帝賜名之日撫朕背曰名此欲我兒有常德久於其道也罔極之訓朕何敢忘因涕泣沾衣左右無不感咽丙寅德音降兩京死罪以下囚緣山陵役民賜租有差復分三司勾院為三命官各判之以太常丞新喻王欽若判三司都催缺憑由司欽若初為亳州判官監倉天久雨倉司以穀濕不為受民自逺來輸租食穀且盡不得輸欽若悉命輸之倉且奏不拘年次先支濕穀即不至朽敗太宗大喜手詔褒答因識姓名及開封府以嵗旱蠲租時有言按田官司蠲放不實者御史臺請遣使覆實詔從之亳州當按太康咸平二縣州遣欽若覆按甚詳抗疏言田實旱開封止放七分今乞全放既而他州所遣官並言諸縣放稅過多悉追收所放稅物人皆為欽若危之至是擢用帝以其事語輔臣曰當此時朕亦自懼欽若小官獨敢為百姓伸理此大臣節也欽若既為三司屬虞部員外郎母賓古謂欽若曰天下宿逋自五代迄今理督未巳民病不能勝僕將啓而蠲之欽若即夕命吏治其數翌日上之帝大驚曰先帝顧不知耶欽若徐曰先帝固知之殆留與陛下收天下人心耳己巳詔工部侍郎集賢院學士錢若水修太宗實録若水舉官同修起居舍人李宗諤與焉帝曰自太平興國八年已後皆李昉在中書日事史䇿本慿直筆若子為父隱何以傳信於後代乎除宗諤不可餘悉許之考異按若水本傳初詔修太宗實録若水引柴成務宗度吳淑楊億同修成八十卷真宗覽書流涕錫賚有差無宗諤也既又重修太宗實録參以王禹稱李宗諤梁皓趙安未周嵗畢則宗諤與矣而又不載帝除宗諤一事至於長編亦不别言此為初修重修又按宗諤本傳則又但云預修太祖實録而不及太宗應是以帝不許宗諤之故今從長編呂中曰以李昉之子宗諤而修太宗實録真宗猶慮其隱父之事以章蔡之修神宗實録乃用王安石日録則神宗末年之悔與安石不盡之奸皆無所考矣此陳瑩中尊堯集所以作也是日同幹當審官院通進銀臺司封駮事田錫上疏曰今地震之災漸見下動之象已萌臣見銀臺司諸道奏報自九月初至冬節前申奏賊盜不少今不一一具奏且據其可言者言之九月四日施州奏羣賊四百餘人驚劫人户十月七日滑州奏有賊四十餘人過河北十五日衛州奏有賊七十餘人過河北十九日絳州奏垣縣賊八十餘人殺尉成柄西京奏十月二十三日有賊一百五十人入白波兵馬都監廨署并劫一十四家至午時奪舟船往向垣曲至河陽鞏縣界濮州奏羣賊入鄄城縣單州奏羣賊入歸恩指揮營濟州奏羣賊劫金鄉巨野縣郭十九家永興軍奏虎翼軍賊四十餘人劫永興南莊今月二日西京奏王屋縣賊一百餘人白髙渡潰散軍賊六十餘人七日陜府奏集津鎮羣賊六十餘人並驚劫人戶至午時乘船下去峽石縣軍賊自河北渡過河南八日西京奏草賊見把截土壕鎮官私往來不得豈有京師咫尺而羣盜如此邊防寧靜而叛卒如是臣所謂地震之災漸見下動之象已萌臣為陛下憂之今廟堂之上必有嘉謀樞軸之間必有善計若言小小寇盜不勞聖意憂虞遍遍指揮只令使臣捕逐如此則羣盜終難剪滅諸處終未平寧若賊徒聚得二三千人徑度淮南往保吳越則運糧綱船不至京師矣若賊徒取得一二州郡扼據要衝則上供錢帛不充國用矣人心必有向背軍情豈無動搖當此之時契丹輒來騷邊陛下不得不憂西戎輒來犯塞大臣不得不懼臣今所言激切不為身謀所慮安危實為國計先是西鄙運糧詔以諸軍代民挽送己卯士卒亦令放歸仍賜緡錢苦寒故也帝御便殿閲殿前指揮使內殿直騎射鬭槊擢精鋭者十餘人遷其職是月有司言冬至祀圜丘孟夏雩祀夏至祭方丘請奉太宗配上辛祈穀季秋大饗明堂奉太祖配上辛祀感生帝孟冬祭神州地祇奉宣祖配其親郊圜丘奉太祖太宗並配詔可是月髙麗國王王治卒從子誦立誦遣兵校徐逺來請命不得達而還遂與中國絶十二月甲午錢若水等言所修太宗實録自太平興國八年以前君臣獻替不著於話言淳化五年以前親决萬幾不聞於䇿府請降詔㫖許臣等於前任見任宰相參知政事樞密院使三司使等處移牒求訪以備闕文許之丙申追尊母賢妃李氏為皇太后后喪先殯於普安院於是議改卜圜陵立忌建廟有司言按周禮春官大司樂之職奏夷則歌仲呂以饗先妣先妣姜嫄也是帝嚳之妃后稷之母特立廟曰閟宫晉簡文宣后以不配食築室於外嵗時享祭唐先天元年始祔昭成肅明二后於儀坤廟又𤣥宗元獻楊后立廟於太廟之西稽於前文咸有明據望令宗正寺於后廟內修奉廟室為殿三間設神門齊房神厨以備薦饗從之辛丑詔諸路轉運使申飭令長勸課農桑先是帝訪宰輔以靈武事宜參知政事李至上疏以為靈州不可堅守萬口同議望釋李繼遷之罪厚推賜與降詔綏懷反覆言之甚切至是繼遷遣使修貢求備藩任帝雖察其變詐時方在諒暗姑務寧靜因從其請復賜姓名官爵甲辰以銀州觀察使趙保吉為定難節度使遣內侍右班都知張崇貴賫詔賜之甲寅遣張浦還考異李燾日繼遷入貢正史實録會要並不著其月日不知何也制辭據朝野雜編與實録所載差異疑史官或加潤色耳雜編云在真宗即位之次年又云張洎蘇易簡草制不稱㫖皆謬也今削去初刑部郎中知揚州王禹稱凖詔上疏言五事其一日謹邊防通盟好使輦運之民有所休息方今北有契丹西有繼遷戍兵餽餉固難寢停關輔之民倒懸尤甚臣愚以為宜敕封疆之吏致書遼人請尋舊好下詔赦繼遷罪復與夏臺彼必感恩內附且使天下知陛下屈己而為人也其二曰減冗兵併冗吏使山澤之饒稍流於下當乾道開寶之時土地未廣財賦未豐然而擊河東備北鄙國用亦足兵威亦彊自後盡取東南數國又平河東土地財賦可謂廣矣而兵威不振國用轉急其義安在所蓄之兵冗而不盡鋭所用之將衆而不自專故也臣愚以為宜經制兵賦如開寶中則可以髙枕而治矣且開寶中設官至少一州止有刺史一人司户一人當時未嘗闕事自後有團練推官一人又有通判副使判官推官而監庫監酒𣙜稅算又增四員曹官之外更益司理問其租稅減於曩日也問其人民逃於昔時也冗吏耗於上冗兵耗於下此所以盡取山澤之利而不能足也夫山澤之利不可棄也亦不可盡即如茶法從古無稅唐元和中以用兵齊蔡始建其法唐史稱是嵗得錢四十萬貫東師以濟今則數百萬矣民何以堪三曰艱難選舉使入官不濫太祖之世每嵗進士不過三十人經學五十人重以周祖之後諸侯不得奏辟士大夫罕有資蔭故有終身不獲一第沒齒不獲一官者先帝在位將逾二紀登第殆近萬人不無俊秀之才亦有容易而得臣愚以為數百年之艱難故先帝濟之以泛取二十載之霈澤陛下宜糾之以舊章望以舉場還有司如故事至於吏部銓官亦非帝王躬親之事太祖以來始令後殿引見因為常例以至先朝調選之徒多求僥幸臣愚以為宜以吏部還有司依格敕注擬其四沙汰僧尼使民無耗漢明之後佛法流入中國度人造寺歷代增加不蠶而衣不耕而食是五民之外又益一而為六矣假使天下有萬僧日食米一升嵗用絹一匹是至儉也猶月費三千斛嵗用萬縑何况五七萬輩哉又富者窮極口腹一齊一衣貧民百家未能供給不曰民蠧其可得乎願深鍳治本亟行沙汰如以嗣位之初未欲驚駭此輩且可一二十載不度人修寺使自銷鑠其五曰親大臣逺小人使忠良謇諤之士知進而不疑姦憸傾巧之徒知退而有懼疏奏即召禹稱還朝既用其䇿以夏綏銀宥靜五州賜趙保吉翌日命禹稱守本官復知制誥是嵗始分天下為十五路一曰京東路二曰京西路三曰河北路四曰河東路五曰陜西路六曰淮南路七曰江南路八曰荆湖南路九曰荆湖北路十曰兩浙路十一曰福建路十二曰西川路十三曰峽路十四曰廣南東路十五曰廣南西路富弼曰人君尚儉前代稍賢者能之太宗之尚儉其難哉時天下平定功業盛大自唐及五代四方僣僞之國盡為我有貢獻之物府無虛月加之生民脫去亂世各居富樂三代之下帝王致太平如此盛者有幾雖尚奢侈固有餘力亦未掩大德而過為儉素所難能也此無他正以厚天下之俗為子孫之法耳祖宗時天子嘗自選知州今宰相亦不自選委之審官審官亦不選而依次撥人故州郡多不治其長育人才文武不乏馮繼業自矜守邊之功以為他人難繼太宗命一郎官代之威名方略過於繼業當時養材如此之盛豈不休哉史臣曰帝沉謀英斷慨然有削平天下之志既即大位陳洪進錢俶相繼納土未幾取太原伐契丹繼有交州西夏之役干戈不息天災方行俘馘日至而民不知兵水旱螟蝗殆遍天下而民不思亂其故何也帝以慈儉為寶服浣濯之衣毁竒巧之器却女樂之獻悟畋遊之非絶逺物抑符瑞閔農事考治功講學以求多聞不罪狂悖以勸諫士哀矜惻怛勤以自勵日晏忘食至於欲自焚以答天譴欲盡除天下之賦以紆民力卒有五兵不試禾稼薦登之效是以青齊耆耋之叟願率子弟治道請登禪者接踵而至孟子曰得乎丘民而為天子其是之謂乎故帝之功德炳煥史牒號稱賢君若夫太祖之崩不踰年而改元涪陵縣公之貶死武功王之自殺宋后之不成喪則後世不能無議焉資治通鑑後編卷十八
