body:
  text: 資治通鑑後編卷六十三刑部尚書徐乾學撰宋紀六十三起昭陽大荒落八月盡閼逄敦牂十月凡一年有三月仁宗體天法道極功全德神文聖武睿哲眀孝皇帝皇祐五年八月丁酉朔詔民訴災傷而監司不受者聽州軍以狀聞丁未以通判潭州唐介為殿中侍御史裏行知復州戊申以知秦州文彥博為忠武節度使知永興軍兼秦鳯路兵馬事始用孫抃言也傅求言古渭寨方發兵戌守不宜更易主將己酉命知青州張忭復知秦州庚申以知復州唐介為殿中侍御史充言事御史遣內侍賫勑告賜之介貶斥不二嵗復召議者謂天子優容言事之臣近古未有也辛酉䇿試賢良方正能直言極諫太常寺太祝趙彥若彥若所對疏濶下有司考不中等而罷之先是制舉就祕閣試者凡十八人有司獨取彥若於是又被黜去議者謂宰相陳執中不由科第以進故隂風有司專抑儒士非彥若實不能也壬戌詔今後每遇南郊以太祖太宗真宗並配九月庚午以東上閣門使錢晦知河中府帝戒曰陜西兵方解民困久矣卿為朕愛撫無縱酒作樂使人謂為貴戚子弟晦頓首謝乙酉御崇政殿召近臣宗室臺諫官省府推判官觀新樂先是鐘磬之音未洽古法詔中書門下集兩制及太常禮官與知鐘律者考定其當議者各安所習久而不決乃命諸家各作鐘律以獻親臨視之然古者黃鍾為萬事根本故尺量權衡皆起於黃鍾至隋用纍黍為尺而制律容受卒不能合及平陳得古樂遂用之唐興因其聲以制樂其器無法而其聲猶不失於古五代之亂大樂淪散王朴始用尺定律而聲與器皆失之故太祖患其聲髙特減一律至是又減半然太常樂比唐聲猶髙五律比今燕樂髙三律帝雖勤勞制作未能得其當者有司失之於以尺生律也庚寅以國子監直講胡瑗為大理寺丞復勒停人阮逸為户部員外郎並以制鐘律成特遷之壬辰罷三司提舉司勾當公事官從宰臣陳執中所奏也康定元年十二月置冬十月丙申朔日有食之戊戌徐州録事參軍路盛追一官勒停盛馬斃怒廄人芻秣失時杖之令抱石立五晝夜又杖之大理寺斷杖八十私罪帝以盛所為苛暴貴畜而賤人特貶之判大宗正司允讓言宗室生子須五嵗然後賜名受官毋得依長子例不限年從之壬子作鎮國神室丙辰御延和殿召輔臣觀指南車丁巳以殿中侍御史唐介為工部員外郎直集賢院介始入見無一言及遷謫帝曰聞卿遷謫以來未嘗有私書至京師可謂不易所守介頓首謝後數論得失因言於帝曰臣繼今言不行必將固爭爭之急或更坐黜是臣重纍陛下願聽解言職許之御史中丞孫抃奏留介或補諫署不報尋以為開封府判官丁巳詔以蝗旱令監司諭親民官上民間利害甲子避神寶名改鎮國軍為鎮潼軍十一月丁卯朝享景靈宫戊辰享太廟奉慈廟己巳合祭天地於圜丘大赦先是張方平言王畿賦斂之重於是詔開封府諸縣兩稅務於元額上減三分永為定式丁丑加恩百官戊子放天下逋負庚寅罷荆湖南路江南西路廣南東西路轉運判官十二月丁酉廣西安撫使言捕獲儂智髙母阿儂及智髙弟智光子繼宗繼封詔護送京師阿儂有智謀智髙攻陷城邑多用其䇿僭號皇太后天資慘毒嗜小兒每食必殺小兒智髙敗走阿儂入保特磨依其夫儂夏卿收殘衆約三千餘人習騎戰復欲入冦余靖督部吏黃汾黃獻圭石鑑進士吳舜舉發洞兵入特磨掩襲并智髙弟子皆獲之庚子張方平加翰林侍讀學士知秦州代張忭也初忭命部署劉渙討叛羌渙逗遛不進忭奏以郭恩代之恩既多所斬馘渙疾恩出已上遂誣奏恩所殺皆老稚朝廷疑焉故罷忭而遣方平往帥亦徙渙涇原方平力辭曰涣與忭有階級今互言而兩罷帥不可訓也忭以故得不罷尋命方平知滑州癸丑詔入內內侍省都知押班非年五十以上歷任無贓私罪勿除戊午詔曰轉運之職本以澄清官吏綏撫人民豈特事誅求以剝下乎有能盡嵗入以致增盈者留為本路移用毋得進羡餘務寬民力以稱朕懷庚申以太常博士興國吳中復為監察御史裏行用中丞孫抃薦也中復嘗知犍為縣有善政抃未始識其面即奏為臺屬或問之抃曰昔人耻為呈身御史今豈薦識面臺官也考異張唐英政要以為仁宗親問然政要多誤今不取辛酉契丹賀正旦使請觀廟樂而歸帝以問宰相陳執中曰樂非祠享不作請以是告之樞密副使孫沔曰此可告而未能止也當告之曰廟樂之作以祖有功宗有德而歌詠之也使者能留與吾祭則可觀帝從之使者乃退初賈昌朝建議漢唐都雍置輔郡內翼京師國朝都汴而近京諸郡皆屬他道制度不稱王畿請析京東之曺州京西之陳許鄭滑州并開封府總四十二縣為京畿帝納之壬戌詔以曹陳許鄭滑五州為輔郡𨽻畿內置京畿轉運使五州各增鈐轄一員曹州更增都監一員留屯兵三千人以時教閲若出戌即於開封府近縣或鄰州徙兵足之以王贄為樞密直學士京畿水陸計度轉運使左司諌賈黯建言臣嘗讀隋史見所謂立民社義倉者取之以時而藏之於民下足以備凶災而上實無所利焉願倣隋制詔天下州軍遇年榖豐熟立法勸課畜積以備災即下其説司農寺且命李兊與黯合議以聞乃下諸路度可否而以為可行者才四路餘或謂賦稅之外兩重供輸或謂恐招盜賊或謂已有常平足以贍給或謂置倉煩擾於是黯復上奏一一辨之然當時牽於衆論終不果行至和元年春正月辛未詔京師大寒民凍餒死者有司瘞葬之壬申碎通天犀和藥以療民疾時京師大疫太醫進方內出犀牛角二本析而觀之其一通天犀也內侍李舜卿請留供帝服御帝曰吾豈貴異物而賤百姓哉立命碎之建寧留後楊景宗卒贈武安節度使兼太尉諡莊定景宗起徒中以外戚故至顯官然暴戾所至為人患使酒任氣知滑州嘗毆通判王述仆地帝深戒毋飲酒景宗雖書其戒於坐右頃之輒復醉其奉賜亦隨費無餘始宰相丁謂方盛築第敦教坊景宗為役卒負土第中後謂敗帝以其第賜景宗居三十年乃終癸酉貴妃張氏薨初妃既受封册寵愛日盛出入車御華楚頗侵后飾嘗議用紅繖增兵衛數有司以一品青蓋奏兵衛準常儀帝守法度事無大小悉付外廷議凡宫禁干請雖已賜可或輒中郤妃嬖幸少比然終不得紊政及薨帝悲悼不已謂左右曰昔者殿廬徼衛卒夜入宫妃挺身從别寢來衛又朕嘗禱雨宫中妃刺臂血書祝辭外皆不得聞宜有以追賁之入內押班石全彬探帝意請用后禮於皇儀殿治喪諸宦者皆以為可入內都知張惟吉獨言此事須翌日問宰相既而判太常寺翰林學士承旨王拱辰知制詔王洙等皆附全彬議宰相陳執中不能正遂詔近臣宗室皆入奠於皇儀殿移班慰於殿東楹特輟視朝七日命參知政事劉沆為監護使全彬及勾當御藥院劉保信為監護都監凡過禮皆全彬與沆合謀處置而洙等奏行之考異石全彬傳云王拱辰請治喪皇儀殿全彬以為當問大臣宰相陳執中不能正之遂詔近臣宗室皆入奠移班慰於殿東楹皆劉沆及洙與全彬合謀為之按張惟吉傳治喪皇儀諸宦者皆以為可獨惟吉言此當問宰相然則言當問宰相者獨惟吉耳全彬實與劉沆王洙等合謀又安得有此言而全彬傳乃攘取以為出自全彬今不取且妃喪那得關學士院其實全彬所請也事下禮官而拱辰判太常寺遂與王洙等附會全彬議朝廷既用禮官議故當時皆謂拱辰請之其實不自拱辰也拱辰特從全彬者耳初有司請依荆王故事輟視朝五日或欲更增日請上裁乃增置七日殿中侍御史酸棗呂景初言貴妃一品當輟朝三日禮官希旨使恩禮過荆王不可以示天下不報丁丑追册貴妃張氏為皇后賜諡溫成先是御史中丞孫抃三奏請罷追册不報初賜諡曰恭德樞密副使孫沔言太宗四后皆諡曰德從廟諡也今恭德之諡其法何從且張郭二后不聞有諡此雖禮官之罪實貽譏於陛下不可不改因改諡溫成抃及侍御史母湜殿中侍御史俞希孟等皆求補外知雜事郭申錫請長告皆以言不用故也禁京城樂一月己卯殯溫成皇后於皇儀殿之西階宰臣率百官詣殿門進名奉慰壬午以溫成皇后薨遣官告太廟皇后廟奉慈廟甲申宰臣梁適奉溫成皇后諡册於皇儀殿百官詣西上閣門進名奉慰是夕設警場於右掖門外帝宿於皇儀殿乙酉帝成服於殿幄百官詣殿門進名奉慰是日殯溫成皇后於奉先寺輴車發引由右升龍門出右掖門升大升輿設遣奠先是詔樞密副使孫沔讀哀册沔奏章穆皇后喪比葬行事皆兩制官今溫成追諡乃詔二府大臣行事不可於是執册立帝前陳故事且曰以臣孫沔讀册則可以樞密使讀册則不可置册而退宰相陳執中取而讀之既殯百官復詣西上閣門進名奉慰詔待制以上丁父母憂已聽解官行服今滿百日猶起復其罷之癸巳延福宫使武信留後入內內侍省都都知王守忠罷延福宫使為武信留後他毋得援例故事宦官未有真為留後者守忠介東宫舊恩數求之帝亦欲從其請時髙若訥為樞密使持不可故止及是守忠疾復求為節度使宰相梁適曰宦官無除真刺史况真節度使乎帝曰朕蓋嘗許守忠矣適曰臣今日備位宰相眀日除一內臣為節度使臣雖死有餘責御史中丞孫抃聞之亦奏疏力諌乃罷節度使不除然猶得真為留後言者方奏疏論列翌日守忠卒守忠謹願細密故眷遇最厚方在疾告帝令用浮屠法集僧于其家凡四十九日為之禬禳既卒贈太尉昭德節度使諡安僖特給鹵簿以葬二月丁酉詔禮院孝惠孝章淑德章懷皇后章惠皇太后溫成皇后皆立小忌先是有請立溫成忌者直集賢院劉敞言太祖以來后廟四室陛下之妣也猶不立忌豈可以私昵之愛至變古越禮乎於是并四后及章惠皆詔立忌樞密副使孫沔極陳其不可中丞孫抃纍奏論列而禮院官亦以為言皆不聽尋罷之戊申太常博士史官檢討張芻落職監潭州稅先是芻為禮官有詔立溫成忌禮官列言其不可宰相患之或謂宰相曰芻獨主茲議他人皆不得已從之耳芻父太祝牧當任蜀官芻嘗奏章乞代其父且求知廣安軍執政謂曰故事史館檢討不為外官若捨去此職則可往芻始謂必换職名及知弗得乃言父欲自行仍願留史館無何牧至京師復上疏乞免入蜀宰相既惡芻因追罪芻奏事前後異同而黜之其實欲絶禮官羣議借芻以警其餘耳庚子詔治河堤民有疫死者蠲戶稅一年無戶稅者給其錢三千戊午詔乾元節度僧尼己未以直史館張掞為戶部副使樞密副使孫沔數言追册溫成於禮不可且曰皆由佞臣贊兹過舉宰相陳執中等甚銜之沔不自安力求解職壬戌授資政殿學士知杭州浙俗貴僧或縱婦女與交沔嚴察之杖配者甚衆以三司使禮部侍郎田况為樞密副使三月樞密使彰德節度使同平章事王貽永數以疾求罷己巳罷為景靈宫使加右僕射兼侍中仍詔特依宗室例嵗賜在京公使錢五千緡其進奉聽如兩府例貽永性清謹寡言頗通書不為聲伎之樂本朝外姻未有輔政者貽永在樞密僅十五年嘗逺權利歸第則杜門謝賔客迄無過失人稱其謙靜慶厯間貽永位冠西府楊懷敏自河朔入奏塘泊事欲升黜者數十人兩府聚廳宰相賈昌期見懷敏為興呼押班太傅懷敏稱説云云獨貽永怒謂曰押班如此騰倒人太多寧謂穩便懷敏縮頭而退昌期大慙龎籍吳育時為樞密副使相謂曰常得此老發惡大是佳事以河陽三城節度使同平章事判鄭州王德用為樞密使詔諸路提點刑獄朝臣自今三嵗一代之置提點京畿刑獄官以度支貟外郎蔡挺為之乙亥司天監言日當食四月朔庚辰德音改元降天下死罪一等流以下釋之癸亥易服避正殿減常膳夏四月甲午朔日有食之遣官祀社以救日是日雷雨至申時見所食九分之餘丙申宰相率百官以日食不及算分拜表稱賀詔三司鑄至和元寶錢辛丑御正殿復常膳祥源觀火先是知制誥胡宿言竊以國家乘火而王火於五行其神屬禮漢書天文志曰火禮也陛下眀德恤祀虔供郊廟宜蒙福應乃遘災旱古者祭天神無二主禮專一配所以奉天帝之尊眀不敢瀆三代兩漢之盛莫之敢易唐初始有兼配之事垂拱中禮官希旨郊丘諸祠遂有三祖同配之禮開元十一年明皇親享圜丘禮官建議遂罷三祖同配此外未有三帝同配之禮國家至道三年詔書親郊圜丘以太祖太宗並配陛下即位景祐二年詔禮官詳案典禮辨崇配之序詔書節文自今以往太祖定配二宗迭侑去年八月八日詔書今次南郊三聖並侑後次却依舊禮未踰旬日復有今後每遇南郊三聖並侑之詔竊尋詔旨先後不同臣愚欲望今後南郊且依去年八月八日詔書及景祐二年禮官所定太祖定配之典追寢去年每遇南郊三聖並侑之詔告謝天地以順火性不報李燾曰按胡宗愈作宿行狀云宿因旱災奏章未幾祥源觀火乃下宿章禮官以郊廟事重未敢議宿復上章始從之然實録都不見此其後嘉祐六年正月罷三聖並侑蓋用楊畋議也今姑附宿章於祥源火之後五月乙亥以馬軍副都指揮使昭信留後張茂實為寧逺節度使知潞州茂實之母微既生茂實入宫乳悼獻太子茂實方襁褓真宗以付內侍張景宗曰此兒貌厚汝飬視之景宗遂以為子於是開封民繁用扣茂實馬首言茂實乃真宗子茂實執以聞事下開封府用蓋病狂易事既眀言者以嫌請罷茂實兵柄帝察其無他故擢節度使出守用坐下竇州牢城己丑客星出天關之東南可數寸嘉祐元年三月乃沒六月乙未詔益州路鈐轄司應蠻人出入處皆預擇人為備禦時黎州言儂智髙自廣源州遁入雲南故也癸丑殿中侍御史裏行吳中復上殿彈宰相梁適姦邪帝曰近馬遵亦有彈疏且言唐室自天寶而後治亂分何也中復對曰眀皇初任姚崇宋璟張九齡為宰相遂致太平及李林甫用事紀綱大壞治亂於此分矣雖威福在于人主然治亂要在輔臣帝曰朕每進用大臣未嘗不采天下公議所歸顧知人亦未易耳遵樂平人也甲寅出內藏庫紬絹五十萬緡錢三十萬下河北助糴軍儲秋七月甲子詔刋修唐書官宋祁編修官范鎮等速上所修唐書丁卯以端眀殿學士給事中知益州程戡參知政事禮院言奉詔參定即溫成皇后舊宅立廟及四時享祀之制檢詳國朝孝惠皇后太祖嫡配止即陵所置祠殿以安神主四時惟設常饌無薦享之禮今溫成皇后宜就葬所立祠殿參酌孝惠故事施行仍請題葬所曰溫成皇后園從之戊辰禮部侍郎平章事梁適罷以本官知鄭州先是殿中侍御史馬遵等彈適姦邪貪黷任情徇私且勿戢子弟不宜久居重位適表乞與遵等辨遵等即疏言光祿少卿向傅師前淮南轉運使張可久嘗以贓廢乃授左曹郎中又留豪民郭秉在家賣買奏與恩澤張掞還自益州賂適得三司副使故王逵於文德殿庭厲聲言空手冷面如何得好差遣中丞孫抃亦言適為宰相上不能持平權衡下不能訓督子弟言事官數論奏未聞報可非罷適無以慰清議帝不得已乃罷之己巳殿中侍御史馬遵知宣州吕景初通判江寧府殿中侍御史裏行吳中復通判虔州梁適之得政也中官有力焉及遵等彈適左右或言御史捃拾宰相自今誰敢當其任者適既罷左右欲并遵等去之始遵等言鹽鐡判官李虞卿嘗推案茶賈李士宗負貼納錢十四萬緡法當倍輸而士宗與司門貟外郎劉宗孟共商販宗孟與適連親適遽出虞卿提點陜西刑獄下開封府鞫其事宗孟實未嘗與士宗共商販且非適親遵等皆坐是絀而中復又落裏行知制誥蔡襄以三人者無罪繳還詞頭改付他舍人亦莫敢當者遂用熟狀降勑虞卿昌齡子也考異梁適因中官得相此據碧雲騢他書並無之然適嘗使石全彬訴狄青等賞薄而青遂為樞密使則適固交結中官者也碧雲騢所載或過當御史中丞孫抃言臣等昨論列宰相梁適事今日風聞吕景初以下並議譴責臣詳觀朝旨必是姦人以巧言移人主意遂使邪正曲直潰然倒置况威賞二柄帝王之權古先聖人尤所謹重今梁適內恃私邪外恃勢力重輕髙下皆在其手嗟怨之聲騰沸中外陛下庇而不問臣恐緣此之後朝廷事事盡由柄臣臺諫之官噤口結舌畏不敢言陛下深居九重何從而知之臣居風憲之長既不能警䇿權臣致令放縱私徇又不能防間姦人致令惑悮聖聽臣之罪多矣乞陛下奪臣官爵竄臣逺方以謝天下公議又言臣前與郭申錫等全臺上殿論列朝廷事陛下亦優容不罪今止言梁適遽有此行遣顯是犯天子之顔者其過輕言宰相之事者其罪重廟堂謀議重輕之際理宜然耶方今幅員數萬里生齒至夥治亂安危之要係執政數人而已既有過咎臺官不得言諫署不得奏朝廷其如何哉伏望陛下念祖宗大業而謹重之無使威賞二柄盡假於下又纍奏乞召還遵等皆不報翰林學士胡宿因召對乞留馬遵等退又上言剛猛御史自古難得近日謫見未息姦宄須防古人有言猛虎在深山藜藿為之不採言猶直臣在朝小人逺避也臣欲乞降旨留三御史在朝以警姦邪亦不報以權知開封府龍圖閣直學士吕公弼為樞密直學士知益州先是帝每念吕夷簡聞公弼有才書其名於殿柱公弼奏事帝目送之語宰相曰公弼甚似其父既召程戡入輔因使公弼代戡公弼固辭乃復授龍圖閣直學士同羣牧使甲戌以知滑州張方平為户部侍郎知益州戊子以龍圖閣直學士吏部郎中歐陽修知同州先是修守南京以母憂去服除入見帝惻然憐修髮白問在外幾年今年幾何恩意甚至命判吏部流內銓小人恐修復用乃偽為修奏乞汰內侍挾恩令為姦利者宦官忿怨隂求所以中修者會選人張俅胡宗堯例改京官宗堯前任常州推官知州以官舟假人宗堯連坐及引對修奏宗堯所坐薄且更赦去官於法當遷讒者因是言宗堯翰林學士宿子故修特庇之奪人主權修坐是出修在銓曹未浹日也八月癸巳以判吏部南曹吳充同知太常禮院同判吏部南曹馮京同判登聞鼓院二人皆以胡宗堯故易任充上疏為歐陽修辨不報出內藏庫錢二百萬緡令入內供奉官張茂則置司以市河北入中軍糧鈔先是上封者言河北入中軍糧京師給還緡錢紬絹商人以算清久未能得其鈔每百千止鬻六十千今若出內藏庫錢二百萬緡量增價收市之嵗可得遺利五十萬帝以為然故委茂則幹其事既而知諫院范鎮言內藏庫榷貨務同是國家之物豈有𣙜貨務固欲滯商人算鈔而令內藏庫乘賤以買之與民爭利傷體壞法莫此為甚帝是鎮言遽罷之甲午以知制誥賈黯權判吏部流內銓時承平日久百官職業皆有常憲樂於因循銓衡徒文書備具而已黯始欲以風義整救其弊益州推官桑澤在蜀三年不知其父死後代還應格當遷投牒自陳人皆知其嘗喪父莫肯為作文書澤知不可乃去發喪制服以不得家問為解澤既除喪求磨勘黯以為澤三年不與其父通問使澤雖非匿喪猶為不孝也言之於朝澤坐廢歸田里不齒終身晉州推官李亢故嘗入錢得官已而有私罪黜自引去匿所得官以白衣應舉及第積十年當磨勘乃自首言其初事黯以為此律所謂罔冒也奏罷之奪其勞考丁酉詔前代帝王後嘗仕本朝官八品以下其祖父母妻子犯流以下罪聽贖未仕而嘗受朝廷賜者所犯非凶惡亦聽贖丙午工部侍郎參知政事劉沆依前官平章事以知鄭州梁適為觀文殿大學士知秦州御史中丞孫抃再疏言舊相不當臨邊不報初古渭寨間為蕃部所鈔及益兵拒守而他族多驚疑適具牛酒召其大酋霞裕勒格羅等撫定之罷所益兵終適之去蕃部不為冦考異碧雲騢言適觀文殿大學士由內降按舊相為觀文殿大學士非異恩也疑碧雲騢所載或毁適過甚今不取丁未徙知宣州殿中侍御史馬遵為京東轉運使通判江寧府殿中侍御史吕景初知衢州通判虔州主客員外郎吳中復知池州初歐陽修罷判流內銓吳充馮京罷判南曹知諫院范鎮言銓曹承禁中批旨疑則奏稟此有司之常也今讒人以為撓權竊恐上下更相疑畏誰敢復論是非請出言者主名正其罪復修等職任言之至再帝意乃解而宰臣劉沆亦請留修戊申命修刋修唐書詔學士院自今當宿學士以故請告者令以次遞宿前一日命劉沆為宰相召當宿學士楊偉草麻不至乃更自外召趙槩草之故有是詔戊午知制誥賈黯言陛下日御邇英閣召侍臣講讀經史其咨訪之際動關政體而史臣不得預聞臣竊惜之欲乞令修起居注官入侍閣中事有可書隨即記録從之賜坐於御坐西南詔自今將相遷拜見辭之禮令閣門以故事舉行從知制誥韓絳言也九月辛酉朔以權三司使翰林學士知制誥楊察為户部侍郎提舉集禧觀事內侍楊永德建請蔡汴河置水遞鋪察條其不便罷之永德毁察於帝三司有獄辭連衛士皇城司不即遣而有詔移開封府鞫之察由是乞罷帝從其請知諫院范鎮言外議皆謂察近因點檢內衣庫積尺羅帛及建言水遞鋪非便內藏庫不當買交鈔香場人吏取乞錢物皇城司占護親從官不以付外勘鞫此等事皆是害政傷理之大者三司義當論列而讒邪小人多方沮毁使其請解使權朝廷因遂其請臣竊為陛下惜之夫邪正之辨治亂之所係也不可不審陛下以察之所陳是邪非邪以為是則宜使察主大計以塞姦幸之路以為非則不當改官使自暇逸纍日以來日色不光天氣沉隂欲雨而不雨此邪人用事之應而忠良之情不得上通也陛下宜以察所爭四事下中書樞密大臣詳正是非付有司依公施行復察所任庶幾土應天變下塞人言殿中侍御史西安趙抃亦言察若有罪不當更轉官資若本無罪不當遽罷乞令依舊職局追還新命不報抃為御史彈劾不避權幸時號鐵面御史先是鹽鐡判官王鼎為淮南江浙荆湖制置發運副使永德請沿汴置鋪挽漕舟嵗可省卒六萬鼎議以為不可永德橫猾執政重違其奏乃令三司判官一貟將永德就鼎議鼎發八難永德不能復鼎因疏言陛下幸用臣不宜過聽小人妄有所改以誤國計於是永德言不用居二年遂以為使前使者多漁市南方物因奏計京師持遺權貴鼎一無所市獨悉意精吏事事無大小必出於已凡調發綱吏度漕路逺近定先後為成法於是勞佚均吏不能為輕重官舟禁私載舟兵無以自給則盜官米為姦有能居販自贍者市人持以法不肯償所逋鼎為移州縣督償之舟人有以自給不為姦而所運米未嘗不足也以殿中丞王安石為羣牧判官安石力辭召試有詔與在京差遣及除羣牧判官安石猶力辭歐陽修諭之乃就職館閣校勘沈康詣宰相陳執中求為羣牧判官執中曰安石辭讓召試故朝廷優與差遣且朝廷設館閣以待天下賢才亦當以德讓相先而乃爭奪如此公視安石顔何厚也康慙沮而退癸亥起居舍人知制誥吕溱工部郎中知制誥兼侍講史館修撰王洙並為翰林學士故事翰林學士六貟時楊察趙槩楊偉胡宿歐陽修並為學士於是察加承旨溱及洙復同除學士洙蓋第七員也溫成皇后之喪洙鈎托非禮隂與石全彬附會時事陳執中劉沆在中書喜其助已故員外擢洙議者非之甲子以直集賢院同修起居注吳奎劉敞並知制誥仍以敞為右正言陳執中言奎敞修注未一月不應驟遷帝不聽曰此豈計資日月耶謝日上面諭以外間事不便有聞當一一語朕也丙寅翰林學士王洙上周禮禮器圖先是洙讀周禮帝命畫車服冠冕籩豆簠簋之制及是圖成上之樞密副使王堯臣務裁抑僥幸於是有鏤匿名書布京城以搖軍情者帝不信丁卯詔開封府揭榜募告者賞錢二千緡己巳邇英閣講周禮大荒大札則薄征緩刑楊安國曰所謂緩刑者乃過誤之民耳當嵗歉則赦之閔其窮也今衆持兵仗劫糧廩一切寬之恐不足以禁姦帝曰不然天下皆吾赤子也一遇飢饉州縣不能存恤餓殍所迫遂致為盜又捕而殺之不亦甚乎乙亥契丹遣蕭德吳湛來告與夏國平且言通好五十年契丹主思南朝皇帝無由一會見嘗遣耶律防來使竊畫帝容貌曽未得其真欲交馳畫象庶瞻覿以紓兄弟之情德等又乞親進本國酒饌不許考異交馳畫象朝廷多有議論趙抃疏其一也蘇頌作孫抃行狀云或者慮彼得御容敢行咒詛抃言其不然卒許之張唐英政要云彼後得御容具儀仗拜謁驚歎今皆不取丁丑詔開封府自今凡決大辟囚並覆奏之初開封府言得樞密院劄子軍人犯大辟無可疑者更不以聞其百姓則未有眀文帝重人命至是軍人亦令覆奏辛巳以三司使王拱辰為回謝契丹使德州刺史李珣副之拱辰見契丹主於混同江設宴垂釣每得魚必親酌拱辰酒又親鼓琵琶侑之謂其相劉六符曰南朝少年狀元入翰林十五年矣吾故厚待之癸未禮院言溫成皇后葬所請稱溫成皇后園陵從之乙酉溫成皇后改殯帝不御前後殿百官進名奉慰御史中丞孫抃率其屬言劉沆既為宰相不當領溫成皇后監護使且言立廟建陵皆非禮章纍上不報因相與請對固爭不能得抃伏地不起帝為改容遣之考異臺官諫宰相護喪實録止載孫抃及侍御史范師道母湜三人按趙抃時為殿中侍御史亦同論列實録偶遺之今但云率其屬則臺官俱在矣冬十月辛卯朔太白晝見壬辰詔士庶之家嘗更傭雇之人自今毋得與主之同居親為昏違者離之丁酉葬溫成皇后帝御西樓望柩以送自製挽歌詞宰臣率百官進名奉慰知諌院范鎮言太常議溫成皇后葬禮前謂之溫成園後謂之園陵宰相劉沆前為監護使後為園陵使如聞此議皆出禮官前日是則今日非今日是則前日非必有一非於此矣夫此禮典素定不可輕變者議論異同如此是為禮官而以禮自舞也古者法吏舞法而今世禮官舞禮若不加詰問恐朝廷典章寖壞而不可救乞下臣章劾禮官前後異狀以正中外之惑不報鎮又請葬溫成皇后罷焚瘞錦繡珠玉以舒國用從之先是都官貟外郎燕度建議川峽選人遭父母喪須代者至然後聽去官知制誥同判流內銓劉敞言此非所以全人子之孝也辛丑詔自今並聽奔喪敞嘗建議曰臣竊見舊制官自三司副使以上及班行使臣不論髙低遭父母喪者例皆百日公除孝子雖有思慕之心逼於王命不得遂行此誠傷教害禮無取於今臣伏以三年之喪通於天下以義制恩古人有之自謂身在軍旅躬備金革者不敢以私事辭王事耳本非承平之時遊談侍從之臣所當行也又非班行冗下之職所當預也習俗既久寖以成風其賢者則以不即人心為悲其不肖者遂以當喪墨縗為榮以之錫類是為傷恩以之教民是為忘孝今天下往往有聞哀不舉廢哀圖仕源自此始不可不慮傳曰君子不奪人之親人亦不可奪親竊謂唯在軍中者可權從變禮其舊制三司副使以上及班行使臣百日公除不合禮意宜聽行三年之服以崇孝弟之風臣又聞古者大夫去國三年然後收其田里眀有恩也今丁憂臣僚即日絶其俸祿亦為太確豈有行禮之人反不及被放之臣乎臣往見丁憂者家貧無食乞丐糊口皇皇傷孝子之心非所以化民成俗也臣以為文官兩制武官自諸司使以上與給全俸其餘京朝官班行使臣與給半俸以明朝廷篤於禮而厚於教也乞與近臣商量可否又言陛下幸加恩今諸近臣得為親服三年又不奪其俸以救人子匍匐之哀至仁至惠不可尚矣然常參京朝官班行使臣猶不用此令臣以為名位不同尊親一也茍取周急不宜分别書云無偏無黨王道蕩蕩無黨無偏王道平平惟陛下留意考異李燾曰慶厯二年七月聽三司副使以上持喪仍續俸武臣非在邊者亦聽嘉祐四年九月七年九月詔書當考丙午溫成皇后神主入廟丙辰以太常少卿周湛為淮南江浙荆湖制置發運使湛入辭帝諭曰朝廷遴選此職不可隂致苞苴於京師湛惶恐對曰臣蒙聖訓不敢茍附權要以進身也戊午幸城北炮場觀發炮宴從臣賜衛士緡錢資治通鑑後編卷六十三
