body:
  text: 資治通鑑後編卷九十五刑部尚書徐乾學撰宋紀九十五起玄黓敦牂七月盡閼逢涒灘四月凡一年有十月徽宗體神合道駿烈遜功聖文仁德憲慈顯孝皇帝崇寧元年秋七月甲申朔建長生宫以祠熒惑丙戌詔省臺寺監及監司郡守並以三年成任戊子以蔡京為尚書右僕射兼中書侍郎制下之日賜坐延和殿命之曰神宗創法立制先帝繼之兩遭變更國是未定欲上述父兄之志卿何以教之京頓首謝曰敢不盡死制詞極其褒美翰林學士張商英所草也己丑焚元祐法甲午詔於都省置講議司蔡京起於逐臣一旦得志隂託紹述之柄箝制天子用熙寧條例司故事即都省置講議司自為提舉以其黨吳居厚王漢之等十餘人為僚屬取政事之大者如宗室冗官國用商旅鹽法賦調尹牧每一事以三人主之凡所設施皆由是出而法制屢變無常矣詔杭州明州置市舶司庚子同知樞密院事章楶罷以老故也詔授資政殿學士中太一宫使未幾卒諡莊簡甲辰以雨水壞民廬舍詔開封府振恤壓溺者庚戍臣僚上言管勾明道宫張耒在潁州聞蘇軾身亡出已俸於薦福禪院為軾飯僧縞素而哭詔張耒責授房州别駕黃州安置辛亥詔昨降置講議司手詔內事件許中外臣庶具所見利害聞奏復罷春秋博士八月乙邜皇子烜改名桓臣僚上言陛下即位之始淵默不言嘗開獻書之路而以書獻者有自布衣取甲科以令百里或加秩一等或解武辨而寄寺監丞簿之祿天下之士不知彼所論列為何等語言往往懷疑迄今不釋欲望出其所上封事布之四方果其言有補國是則至公之議帖然自厭脫或志在覬望僥幸名器無忠嘉一定之論有姦憸兩可之語附下罔上纍先烈而害初政則於此時豈可以置而不問如以臣言可採乞早賜施行乙丑詔除鄭敦義江緷外鹿敏求追所授承事郎降充簿尉髙士育追所授官何大正追所賜出身及所授官並不得應舉辛未置安濟坊飬民之貧病者仍令諸州縣並置甲戌詔天下興學貢士建外學于國南蔡京請天下州縣並置學州置教授二員縣置小學縣學生選考升諸州學州學生每三年貢太學至則附試别立號考分三等入上等補上舍入中等補下等上舍入下等補內舍餘居外舍諸州軍解額各以三分之一充貢士州給常平或係省田宅充養士費縣用地利所出及非係省錢凡州縣學生曽經公私試者復其身如有孝弟睦姻任恤中和若行能尤異為鄉里所推者縣上之州免試入學州守二及教授詢審無謬即保任入貢不實者坐罪京又請建外學以待州縣學之貢士乃詔即京城南門外相地營建外圓內方為屋千百七十二楹是為辟雍太學專處上舍生內舍生而外學則處外舍生初貢至皆入外學經試補入上舍內舍始得進處太學太學外舍亦令出居外學其敕令格式悉用太學見制於是上舍至二百人內舍六百人外舍三千人凡州學上舍生升舍以其秋即貢入辟雍長吏集闔郡官及提學官具宴設以禮敦遣限歲終即集闕下自川廣福建入貢者續其路食以學錢給之奏入詔悉如其法施行丙子詔司馬光吕公著王巖叟朱光庭孔平仲孔文仲吕大防劉安世劉摰蘇軾梁燾李周范純仁范祖禹汪衍湯戫李清臣豐稷鄒浩張舜民子弟並毋得官京師己卯以趙挺之為尚書左丞翰林學士張商英為尚書右丞九月戊子京師置居養院以處鰥寡孤獨仍以户絶財産給養乙未詔中書籍元符三年臣僚章疏姓名分正邪各為三等於是中書奏正上鍾世美喬世材何彥正黃克俊鄧洵武李積中六人正中耿毅等十三人正下許奉世等二十二人邪上尤甚范柔中等三十九人邪上梁寬等四十一人邪中趙越等一百五十人邪下王鞏等三百十二人內侍郝隨諷蔡京再廢孟后會昌州判官馮澥上書言復后為非於是御史中丞錢遹殿中侍御史石豫左膚連章論韓忠彥等乘一布衣誑言復瑶華之廢后掠流俗之虛美當時物議固已洶洶乃至疏逖小臣詣闕上書忠義激切則天下公議從可知矣望詢考大臣斷以大義無牽於流俗非正之論以纍聖朝丁酉治臣僚議復元祐皇后及謀元符皇后者罪降韓忠彥曽布官追貶李清臣雷州司户參軍黃履祈州團練副使安置曽肇豐稷陳瓘龔夬等十七人于逺州擢馮澥鴻臚寺主簿己亥御批付中書省應元祐責籍并元符末敘復過當之人各具元籍定姓名進入於是蔡京籍文臣執政官文彥博等二十二人文彥博吕公著司馬光安燾吕大防劉摰梁燾王巖叟范純仁王圭王存傅堯俞趙瞻韓維孫固范百祿胡宗愈李清臣蘇轍劉奉世范純禮陸佃待制以上官蘇軾等三十五人蘇軾范祖禹王欽臣姚勔顧臨趙君錫馬默孔武仲王汾孔文仲朱光庭吳安持錢協李之純孫覺鮮于侁趙彥若趙卨孫升李周劉安世韓川賈易吕希純曽肇王覿范純粹楊畏吕陶王古陳次升豐稷謝文瓘鄒浩張舜民餘官秦觀等四十八人秦觀湯戫杜純司馬康宋保國吳安詩張耒黃隱歐陽棐吕希哲劉唐老朝補之黃庭堅畢仲遊常安民汪衍孔平仲王鞏張保源余爽鄭俠常立程頥余卞唐義問李格非商倚張庭堅李祉陳佑任伯雨陳郛朱光裔蘇嘉陳瓘龔夬吕希績歐陽中立吳儔吕仲甫徐常劉當時馬琮謝良佐陳彥默劉昱魯君貺韓跋內臣張士良等八人張士良魯燾趙約談扆楊稱陳詢張琳裴彥臣武臣王獻可等四人王獻可張遜李備胡田等其罪狀謂之姦黨請御書刻石於端禮門考異此據長編所列姓名人數李燾曰七月二日魯君貺劉昱李常吕仲甫朱光裔馬琮劉當時謝良佐陳彥默八人已出籍恐此姓名不當又見九月十七日十七日即己亥也今按宋史徽宗紀崇寧元年九月己亥籍元祐及元符末宰相文彥博等侍從蘇軾等餘官秦觀等內臣張士良等武臣王獻可等凡百有二十人御書刻石端禮門而長編所列姓名止一百十七人尚少三人恐有遺脫其出籍八人又不當在內則所闕共十一人矣又二年九月從臣僚之請頒端禮門石刻於天下長編載御史臺抄録到名數又止九十八人彼此參錯不齊未知何故更須博考庚子贈宣德郎鍾世美為右諌議大夫録其子為郊社齋郎世美元符末提舉福建路常平應詔上書乞復熙寧紹聖政事至是第為正上等第一故有此恩餘正等四十人悉加旌擢其邪等五百四十二人降責有差壬寅降授中大夫守司農卿分司南京太平州居住曽布責授武泰軍節度副使衡州安置冬十月癸亥知樞密院事蔣之竒罷為觀文殿學士知杭州己巳以觀文殿學士知太原府吕惠卿為武曷軍節度使知大名府蔡京許將溫益趙挺之張商英力主錢遹等説請廢孟后帝不得已從之甲戌詔罷元祐皇后之號復居瑶華宫丙子臣僚上言元祐黨人朝廷近已施行所有元符之末共成黨與變更法度復為元祐者伏望詳酌施行於是詔周常龔原劉奉世吕希純王覿王古謝文瓘陳師錫歐陽棐吕希哲劉唐老朝補之黃庭堅黃隱畢仲遊常安民孔平仲王鞏張保源陳郛朱光裔蘇嘉余卞鄭俠胡田並罷祠祿各於外州軍居住仍依陳乞宫觀新格不得同在一州戊寅以資政殿學士蔡卞知樞密院事詔河南府草澤裴筠上書語言狂悖事理誕妄特送五百里外州軍編管所有講議司許陳言利害指揮勿行十一月乙酉邵州言知溪洞徽州楊光銜內附戊子以婉儀鄭氏為賢妃辛邜置河北安濟坊癸巳置西南兩京宗正司及敦宗院戊戌置顯謨閣學士待制官己酉立卿監郎官三歲黜陟法十二月癸丑中丞錢遹言哲宗用王贍䇿取青唐邈川可謂不世出之略權臣逞一偏之曲説以欺朝廷盡委而棄之更以他罪戮及贍身若不追正其罪而顯黜之則無以伸往者之寃而激忠勇折衝之氣於是責授韓忠彥為崇信軍節度副使曽布為賀州别駕仍舊衡州安置安燾為寧國軍節度副使范純禮為試少府監分司南京庚申臣僚上言諡以易名所以昭其美惡而寵辱之不可忽也夫慮國忘家之謂忠美聞周逹之謂宣為范純仁者以忠宣命之可乎其世濟忠直既不得名其碑則前日未當之諡理所應論不特純仁而已有如司馬光之諡文正吕公著之諡正獻其類不一皆當奪本議各諡其惡以訓萬世詔范純仁諡定議覆議官各罰銅其神道碑如已鐫立令潁昌府毁磨鑄當五錢丙寅詔應責降安置及編管羈管人令所在州軍依元符令常覺察不得放出城丁丑詔諸邪説詖行非先聖之書并元祐學術政事不得教授學生犯者屏出戊寅蔡京等上州縣學敕令格式乞鏤板頒降從之是歲京幾京東河北淮南蝗江浙熙河漳泉潭衡郴州興化軍旱辰沅州猺入冦遼蕭哈里叛遼主使北面林牙郝嘉努討之哈里亡入女真阿典部遣其族人烏塔拉結和於英格曰願與太師為友同往伐遼英格執烏塔拉會遼命英格捕討哈里遂送烏塔拉于遼募兵得甲千餘阿固達喜曰有此甲兵何事不可圖蓋前此女真甲兵之數未嘗滿千也軍次混同水與哈里遇時遼追哈里兵數千攻之不能克英格謂遼將曰退爾軍我當獨取哈里遼將許之阿固達䇿馬突戰海里中流矢墮馬下執而殺之大破其軍函哈里首遣使獻于遼遼主大喜賜豫加等英格自是知遼兵之易與益自肆矣二年春正月乙酉貶竄元符末臺諌官於逺州任伯雨昌化軍陳瓘亷州龔夬象州馬涓澧州陳祐歸州李深復州張庭堅鼎州並除名勒停編管江公望責授衡州司馬永州安置鄒浩除名勒停昭州居住已上並永不得收敘王覿臨江軍居住豐稷建州陳次升建昌軍謝文瓘邵武軍張舜民房州亦皆除名勒停蔡京蔡卞怨任伯雨等之論已檢會其章疏以進故有是貶京之帥蜀也張庭堅在其幕府及入相欲引以自助庭堅不從京恨之至是亦除名編管知荆南府舒亶平辰沅猺賊復誠徽二州改誠為靖州徽為蒔竹縣曲赦荆湖兩路己丑詔許茅山道士劉混康修建道觀仍令直奏災福無得隱匿混康有節行頗為神宗所敬重故帝禮信之李燾曰此據蔡絛史補增入壬辰中書侍郎溫益卒益仕宦從微至著無片善可紀至其狡譎傅會蓋天性也丁未以蔡京為尚書左僕射兼門下侍郎以知岢嵐軍王厚權發遣河州兼洮西沿邊安撫司公事厚少從父韶兵間暢習羌事元祐棄河湟厚疏陳不可且詣政事堂言之蔡京既治元祐棄地之罪仍欲開邉故有是命二月辛亥安化蠻入冦廣西經略使程節敗之壬子遣官相度湖南北猺地取其材植入供在京營造甲寅尊元符皇后為皇太后宫名崇恩辛酉置殿中監庚午初令陕西鑄折十銅錢并夾錫錢召募私鑄人赴官充鑄錢工匠從蔡京奏也癸酉奉安哲宗御容于西京會聖宫及應天院丙子置諸路茶場茶自嘉祐通商至熙寧中李稷稍復𣙜法而利復歸於官及是蔡京請荆湖江淮兩浙福建七路仍舊禁𣙜官買即産茶州軍隨所置場申商人園户私易之禁商人買茶貯於籠篰官為抽盤第敘收息訖批引販賣歲入百萬緡以進御自此盜販公行民滋病矣戊寅王厚言熙寧間神宗以熙河邊事委任先臣韶當時中外臣僚凡有議論熙河事者蒙朝廷批送先臣看詳可否議論歸一無所搖奪今朝廷措置一方邊事已究見利害本末欲乞自今中外臣僚言涉青唐利害者乞依熙寧故事並付本路經略司及所委措置官看詳從之又詔入內供奉官童貫往來勾當仰本路經略安撫都總管司公共協力濟辦三月乙酉詔黨人親子弟毋得擅到闕下其應緣趨附黨人罷任在外指射差遣及得罪停替臣僚亦如之辛邜管勾玉隆觀黃庭堅除名勒停送宜州編管以湖北轉運判官陳舉奏庭堅撰荆南承天院碑語涉謗訕也癸卯賜禮部奏名進士諸科及第出身五百三十八人其嘗上書在正等者升甲邪等者黜之時李階舉禮部第一階深之子而陳瓘之甥也安忱對䇿言使黨人之子魁多士無以示天下遂奪階出身而賜忱第忱惇兄也又黃定等十八人皆上書邪等帝臨軒召謂之曰卿等攻朕短可也神宗哲宗何負於卿等亦並黜之皆從蔡京言也詔知河州王厚權管勾熙河蘭會路經略司職事夏四月甲寅詔侍從官各舉所知二人丁卯詔毁吕公著司馬光吕大防范純仁劉摯范百祿梁燾王巖叟景靈西宮繪像己巳童貫至熙州傳語勞軍庚午詔國子監印書賜諸州縣學甲戌王厚奏河南河北諸羌以大小隆贊爭國之故人心不寧諸族酋豪互有猜忌遂更相侵掠殺戮正所謂以外裔攻外裔乃中國之利臣見與童貫計議乘此從長措置候起發别具奏聞乙亥詔蘇洵蘇軾蘇轍黃庭堅張耒朝補之秦觀馬涓文集范祖禹唐鑑范鎮東齋記事劉攽詩話僧文瑩湘山野録等印板悉行焚毁戊寅以趙挺之為中書侍郎張商英為尚書左丞户部尚書吳居厚為尚書右丞兵部尚書安惇同知樞密院事詔追奪王圭贈諡王仲端王仲薿並放罷遺表恩例減半追毁程頥出身以來文字除名其入山所著書令本路監司覺察時臣僚上言神宗大漸王圭不早請建儲密召髙士充欲成其姦謀又言程頥學術頗僻素行譎怪勸講經筵有輕視人主之意議法太學則專以變亂成憲為事故有是詔范致虛又言頥以邪説詖行惑亂衆聽而尹焞張繹為之羽翼乞下河南盡逐學徒頥於是遷居龍門之南止四方學者曰尊所聞行所知可矣不必及吾門也五月辛巳以賢妃鄭氏為淑妃丙戍曽布以妻魏氏及子紆繅等交通請求受賂狼籍責授亷州司户參軍仍舊衡州安置紆永州編管繅除名甲午詔頒梁安國等二十二人昨上書謗訕節文責降有差六月庚申詔元符末上書進士類多詆訕令州郡遣入新學依太學自訟齋法候及一年能革心自新者許將來應舉其不變者當屏之逺方辛酉王厚童貫發熙州初厚與貫會諸將部分軍事諸將皆欲并兵直趨湟中厚曰賊恃巴沁巴藏之險挾大河之阻分兵死守以抗我師若進戰未克青唐諸部之兵繼至夏賊必為之援非小敵也不若分兵為二南道出安鄉衝其前北道出京玉搗其後賊腹背受敵勢不能支破之必矣貫猶未決厚曰他日身到其地計之熟矣願毋過疑遂以岷州將髙永年為統制官權知蘭州姚師閔佐之及管勾招納王端等率蘭岷州通逺軍漢蕃兵馬二萬出京玉關厚與貫親領大軍出安鄉關渡大河上巴沁嶺癸亥厚次河州甲子次安鄉關貫率李忠等以前軍趨巴沁城舊名安川堡在巴沁嶺上都爾伯使其三子長曰阿令結次曰斯多瑪爾令次曰阿蒙率衆拒守城據岡阜四面皆天塹深不可測道路險狹我師至望見城門不閉偏將辛叔詹安永國等爭先入賊出兵迎擊師少却永國墮天塹死叔詹等馳還幾為所敗會雨各收軍而止翼日乙丑賊以大衆背城而陳埤間建旗鳴鼓將決戰復有疑兵據髙阜張兩翼會厚以軍至賊望見氣沮厚乘髙列大帥旗幟示之遣人諭以恩信開示禍福數返阿令結等不肯降語益不遜遂命諸將攻城賊力戰拒險我軍不能過天塹厚親至陳前督強弩射之賊稍却别遣偏將鄒勝率精騎由間道繚出其背賊大驚因鼓之諸軍四面奮擊殺阿令結斯多瑪爾令於陳阿蒙流矢中目貫腦遁去都爾伯率衆來援聞敗亦遁去日未中大破賊衆遂克其城逺近爭降附厚誅強悍首領數百人入據城遣髙永年引兵萬餘出京玉關丙寅厚進軍次瓦吹舊名寧洮寨永年等進據巴藏宗城阿蒙道遇其父都爾伯引衆來援告之曰兵大敗二兄皆死我亦重傷漢家已入巴沁城矣父子相持慟哭恐追騎及偕馳而去至且達爾城所居附順者張心白旗甚衆復懼見禽踰城奔青唐然餘黨猶盛王厚慮其或掎我軍後丁卯大軍留寧洮厚與童貫率李忠等將輕騎二千餘人趨且達爾破巴順部族焚其巢穴臨大河據險命忠等率衆守之厚即日還寧洮戊辰進下隴朱黑城城舊名安隴寨己巳進至湟州會髙永年等軍於城東坂上諸將各率所部環城遣人約降其大首領丹巴圖令結盡拘城中欲降者據城不下厚與童貫登城南山視城中盡見其戰守之備分遣諸將各據一面攻城賊援兵自城北宗水橋上繼至勢益張日暮諸將有言賊得援力生我師攻戰久已疲請暫休士卒徐圖之厚謂貫曰大軍深入至此是為死地不急破其城青唐王子擁大衆來援據橋而守未易以旬日勝也形見勢屈將安歸乎諸將不以計取顧欲自便豈計之得邪敢再言者斬於是諸將各用命死士乘城賊以石縱擊垂至堞而墜奮復上者不可勝數鼓四合晝夜不絶聲矢下如雨城中負盾而立庚午别遣驍將王用率精騎出賊不意亂宗水上流擊破援兵絶其路乘勝奪水寨初元符間築城宗水之北以護橋至是賊據守之有蕃將包厚緣城而上撝槍擊賊引衆踰入賊退保橋南厚開其門王用因以其衆入據橋城而戰勢猶未沮遂火其橋中夜如晝諸將乘火光盡力攻城城中不能支大首領索諾木默令鄂特潛遣人縋城送欵請為內應許之是夜王亨奪水門入與其麾下登西城而呼曰得湟州矣諸軍鼓噪而進丹巴圖令結以數十騎由西門遁去辛未黎明大軍入湟州假髙永年知州事完其城而守之前後招納湟州境內漆令等族大首領七百五十人管户十萬厚具捷書以聞初湟州未克青唐王子溪錫羅薩勒率衆來援過安爾峽聞城已破遂駐宗格城以丹巴圖令結不能守斬之以徇時論者皆欲席卷而西王厚與童貫及諸將議曰湟州雖下形勢未固新附之人或持兩端青唐餘燼尚強未肯望風束手我師狃於新捷其實已罷若貪利深入戰有勝負後患必生歲將秋矣塞外苦寒正使遂得青唐諸城未可興築若不暴師勞費則必自引而歸玩敵致冦非萬全之䇿往年大軍之舉事忽中變正以此耳湟州境內要害有三其一曰且達爾在州之南前已城之矣其二曰省章在州之西正為青唐往來咽喉之地漢世謂之隍狹唐人嘗修閣道刻石記其事地極險阻若不城之異日兵出賊必乘間斷我歸路其三曰南宗寨在州之北距夏國卓羅右廂監軍司百里而近夏人交構諸羌易生邊患今若城之可以控制况此三城正據鄯湟腰背控制之利可斷其首尾之患厚在元符間已嘗建論不從竟致棄地之事覆車之轍何可復蹈且三城既畢湟境遂固降者悉為吾用地利可佐軍儲形勢所臨威聲自逺益加招撫降衆必多此支解羌虜之術也明年乘機一舉大功必成或謂厚曰朝廷之意必欲亟定青唐從而有功必受重賞違之且得罪厚曰忠臣之誼知體國耳遑他恤乎遂以是日甲戌移軍趨省章東峽之西得便地曰灑金平建五百步城一座後賜名曰綏逺關大軍駐關中溪鍚羅薩勒尚在宗格遣其大首領本巴令鄂爾坤等五輩持蕃書詣軍門請保渴驢嶺以西而和書辭每至益卑時軍中已定議保完湟境來春進取且欲懈賊鬭志使不為備於是以便宜聽所請移書張示威信賊中大震是月中太一宫火秋七月己卯以收復湟州百官入賀辛巳進蔡京官三等蔡卞以下二等壬午白虹貫日詔以王厚為威州團練使知熙州童貫轉入內皇城使果州刺史依前熙河蘭會路勾當公事賞復湟州功也甲申降德音于熙河蘭會路減囚罪一等流以下釋之庚寅曽肇責授濮州團練副使辛卯詔上書進士見充三舍生者罷歸丁酉詔自今戚里宗屬勿復為執政官著為令庚子賜茅山道士劉混康號葆真觀妙先生乙巳吏部言程頥子端彥見任鄢陵縣尉即係在京府界差遣宜放罷從之因下詔責降人子弟毋得任在京及府界差遣八月丁未再論棄湟州罪除許將已放罪曽布已責亷州司户外韓忠彥安燾范純禮蔣之竒各貶官龔夬化州張庭堅象州編管陳次升循州姚雄光州居住錢景祥秦希甫並勒停李清臣身死其子祉當時用事送英州編管又詔胡宗回頃帥熙州日屢陳堅守鄯湟之議見落職罷任可特與復寶文閣待制知秦州戊申御史中丞石豫殿中侍御史朱紱余深奏尚書左丞張商英於元祐丁卯嘗為河東守臣李昭敘作嘉禾篇謂神宗既登遐嗣皇帝沖幼中外震懼罔知社稷攸託方是時哲宗既即位尚曰罔知攸託可乎又曰成王沖幼周公居攝誅伐讒慝卒以天下聽於周公時則唐叔得嘉禾推古驗今迹雖不同理或胥近方是時文彥博司馬光等來自洛郊方掌機務比之周公可乎逮元符之末先帝遺弓陛下入繼大統而權臣用事乘君父不忍言之時起鄒浩於新州商英是時實典詞掖引晉平公問於叔向曰國家之患孰為大叔向曰大臣重祿而不諌小臣畏罪而不言此患之大者又曰思得端士司直在庭又曰浩徑行直情無所顧避所謂浩之直情徑行果先帝之所取乎先帝不取而商英取之可乎詔張商英秉國機政議論反復加之自取榮進貪冒希求元祐之初詆訾先烈臺憲交章豈容在列可特落職依前通議大夫知亳州考異李燾曰蔡絛國史後補鹺法篇云鈔法既行一日𣙜貨務申入納見錢已積三百萬緡魯公將上進呈上駭曰直有爾許耶張丞相商英時為中書侍郎忽儳進曰啓陛下皆虛錢魯公愕然即奏曰臣據有司申如此商英今以謂虛錢乞命商英與臣各選差官點檢字號分明皆在庫也翌日奏聞張大慙由是不安後又以隂通宫禁事未幾罷去又宣和殿記魯公在元豐中與商英素厚善其後商英出入魯公門下又與伯氏親欵魯公將為相商英預為草麻其辭甚美遂拜左丞遷中書侍郎及爭進頗攻魯公一日上在禁中偶視貴人之冠叉間垂一小卷文書戲取開視之乃細字曰張商英乞除右僕射上語貴人汝勿預外廷事因密降出示魯公上大怒而貴人方不安位魯公亦甚懼曰此獨商英無狀耳恐事干宫禁不可治於是掩之以他事黜商英商英亦隂德魯公至是以所出小卷進云臣僚因言商英作為謗書肆行誣詆宜更加誅責置之元祐籍中昭示無窮之戒辛酉詔以商英入元祐黨籍改知蘄州湟州既平王厚奉詔措置河南生羌其地在大河之南連接河岷部族頑梗厚以為若不先事撫存據其要害大軍欲向鄯廓必相影助或於熙河州界出沒為牽制之勢擾我心腹其害甚大乃留王端王亨在湟州與髙永年等就近招納宗哥青唐一帶部族存撫新屬羌人甲子大軍由來賔城濟河南出來羌拔當標城又進至分水嶺平一公城達南宗癸酉厚引軍赴米川城遇蕃賊三千餘騎與戰破之賊焚橋遁去明日厚修橋欲濟賊復來扼據津渡厚及童貫幾為流矢所傷乙亥來賔城陷賊掠取財物仍各散去九月庚午詔張商英罷職提舉靈仙觀壬午詔宗室不得與元祐姦黨子孫及有服親為婚姻內已定未過禮者並改正庚寅詔上書邪等人知縣以上資序並與外祠選人不得改官及為縣令壬辰置醫學癸巳令天下郡皆建崇寧寺辛丑改吏部選人七階曰承直郎儒林郎文林郎從事郎通仕郎登仕郎將仕郎從刑部尚書鄧洵武言也舊制以職為階官而以差遣為職名實混淆元豐雖定官制此猶未正故更名以革其弊臣僚上言近出使府界陳州士人有以端禮門石刻元祐姦黨姓名問臣者其姓名雖嘗行下至於御筆刻石則未盡知近在畿甸且如此况四逺乎乞特降睿旨以御書刋石端禮門姓名下外路州軍於監司長吏廳立石刋記以示萬世從之按長編御史臺抄録到元祐姦黨曽任宰臣文彥博吕公著司馬光吕大防劉摯范純仁韓忠彥王圭執政官梁燾王巖叟王存鄭雍傅堯俞趙瞻韓維孫固范百祿胡宗愈李清臣蘇轍劉奉世范純禮陸佃安燾待制以上官蘇軾范祖禹王欽臣姚勔顧臨趙君錫馬默孔武仲王汾孔文仲朱光庭吳安持錢協李之純孫覺鮮于侁趙彥若趙卨孫升李周劉安世韓川賈易吕希純曽肇王覿范純粹楊畏吕陶王古陳次升豐稷謝文瓘鄒浩張舜民餘官秦觀湯戫杜純司馬康宋保國吳安詩張耒歐陽棐吕希哲劉唐老朝補之黃庭堅黃隱畢仲遊常安民孔平仲王鞏張保源汪衍余爽鄭俠常立程頥唐義問余卞李格非商倚張庭堅李祉陳祐任伯雨陳邦朱光裔蘇嘉陳瓘龔夬吕希績歐陽中立吳儔而內臣武臣不與焉通計止九十八人其所列姓名次序亦與元年小異今具録以備參考王厚奉詔班師冬十月甲寅還至熙州遣童貫領護大首領掌年杓拶遵厮雞及酋長溫龍彪赴闕丙子朗阿章領河南部族冦來賔循化等城洮西安撫李忠統兵往救之是月遼生女真部節度使英格卒兄子烏雅舒襲節度使初諸部各有信牌馳驛訊事英格用阿固達議擅置信牌者罪之由是號令始一民聽不疑兵力益強土宇加廓矣考異李燾長編建中靖國元年女真英格死阿固達立注云此據金盟本末華夷直筆北遼事亡遼録增入今按英格即盈哥金史世紀盈哥癸未歲卒遼乾純三年實宋之崇寧二年而長編以為卒於建中靖國元年一誤也是嵗烏雅舒嗣盈哥襲節度使在位十一年乃卒而長編以為盈哥死阿骨打立竟脫却烏雅舒一代二誤也蓋沿金盟本末諸書之謬而未加考證耳十一月庚辰詔以元祐學術政事聚徒傳授者委監司舉察必罰無赦辛巳詔元祐係籍人通判資序以上依新條與管勾宫觀知縣以下資序與注監嶽廟並令在外投狀指射差注乙酉江南西路提舉常平韓宗直知亳州孫載並放罷臣僚論其嘗附元祐姦黨故也洮西安撫李忠行至骨延嶺距循化城尚五六里與賊遇三戰三敗忠及諸將李士旦辛叔詹辛叔獻皆為賊所傷却奔懷羌城是夕忠死十二月丁巳詔臣僚姓名有與姦黨人同者並令改名從權開封府吳栻奏請也時改名者五人朱紱李積中王公彥江潮張鐸癸亥祧宣祖皇帝昭憲皇后丙寅詔六曹長二嵗考郎官治狀分三等以聞癸酉詔别建熙河蘭會措置邊事司王厚措置邊事童貫同措置仍兼領秦鳳得以節制兵將應副興發是嵗諸路蝗纂府蠻楊晟銅融州楊晟天邵州黃聰內附三年春正月己卯安化蠻降辛巳詔上書邪等人毋得至京師戊子鑄當十大錢壬辰增縣學弟子員大縣五十人中縣四十人小縣三十人甲午賜蔡攸進士出身攸京長子也元符中監在京裁造院帝時為端王每退朝攸適趨局遇諸塗必下馬拱立王問左右知為攸心善之及即位遂有寵至是自鴻臚丞賜進士出身拜祕書郎帝鋭意制作以文太平蔡京復每為帝言方今泉幣所積贏五千萬和足以廣樂富足以備禮帝惑其説而制作營築之事興矣至是京擢其客劉昺為大司樂付以樂政甲辰昺引蜀方士魏漢津見帝獻樂議言伏犧以一寸之器名為含微其樂曰扶桑女媧以二寸之器名為葦籥其樂曰光樂黃帝以三寸之器名為咸池其樂曰大卷三三而九為黃鐘之律後世因之至唐虞未嘗易洪水之變樂器漂蕩禹效黃帝之法以聲為律以身為度用左手中指三節三寸謂之君指裁為宫聲之管又用第四指三節三寸謂之臣指裁為商聲之管又用第五指三節三寸謂之物指裁為羽聲之管第二指為民為角大指為事為徴民與事君臣治之以物養之故不用為裁管之法得三指合之為九寸即黃鍾之律定矣黃鍾定餘律從而生焉商周以來皆用此法因秦火樂之法度盡廢漢諸儒張蒼班固之徒惟用纍黍容盛之法遂致差誤晉永嘉之亂纍黍之法廢隋時牛𢎞用萬寶常水尺至唐室田畸及後周王朴並用水尺之法本朝為王朴樂聲太髙令竇儼等裁損方得律聲諧和然非古法今欲請帝三指為法先鑄九鼎次鑄帝坐大鐘次鑄四韻清聲鐘次鑄二十四氣鐘然後均絃裁管為一代之樂帝從之漢津本剩員兵士自云師事唐仙人李良授鼎樂之法皇祐中與房庶俱被召至京而黍律已成不得伸所學而退或謂漢津嘗執役於范鎮見其制作因掠取之蔡京神其説託以李良授云然漢津曉隂陽數術多竒中嘗語所知曰不三十年天下亂矣癸卯太白晝見甲辰鑄九鼎二月丙午以淑妃鄭氏為貴妃以刋定元豐役法不當黜錢遹以下九人丁未置漏澤園己酉詔王圭章惇别為一籍如元祐黨詔自今御後殿許起居郎舍人侍立庚申令天下坑冶金銀悉輸內藏辛未雨雹是月詔翰林學士張康國編類元祐臣寮章疏三月辛巳置文繡院丁亥作圜土以居強盜貸死者甲午躋欽成皇后神主於欽慈皇后之上辛丑大內災壬寅奉議郎黃輔國言元豐中太學生休假日引詣武學射廳習射紹聖嘗著為令乞頒其法於諸路州學從之成都府路轉運副使李孝廣遷一官以點檢學生費乂韋直方龎汝翼答䇿詆訕元豐政事故也三人並送廣南編管永不得入學童貫自京師還至熙州凡所措置與王厚皆不異於是始議大舉是日厚貫帥大軍發熙州出篩金平隴右都護髙永年為統制諸路蕃漢兵將隨行知蘭州張誡為同統制厚恐夏人援助青唐於蘭湟州界侵擾及河南蕃賊亦乘虛竊發騷動新邊牽制軍勢乃遣知通逺軍潘逄權領湟州知會州姚師閔權領蘭州控禦夏國邊面别遣知河州劉仲武統制兵將駐安強寨通往來道路由是措置完密無後顧之憂大軍得以專力西向夏四月甲辰朔尚書省勘會黨人子弟不問有官無官並令在外居住不得擅到闕下因具逐路責降安置編管等臣寮姓名以進凡一百四十四人乙巳以火災降德音于四京減囚罪一等流以下原之庚戌王厚童貫率大軍次湟州諸將狃於纍勝多言青唐易與宜徑往取之厚曰不然青唐諸羌用兵詭詐若不出弓兵分道而進不足以張大聲勢折賊姦謀且湟州之北有勝鐸谷西南有勝宗隘汪田丁零宗谷而中道出綏逺關斷我糧道然後諸部合勢夾攻渴驢嶺宗哥川之間勝負未可知也於是定議分出三路厚與貫率三軍由綏逺關渴驢嶺指宗哥城都護髙永年以前軍由勝鐸谷沿宗河之北别將張誡同招納官王端以其所部由汪田丁零宗谷沿宗河之南期九日會于宗哥城下是日貫猶以諸將之言為然先趨綏逺用馮瓘統選鋒登渴驢嶺候騎言青唐兵屯嶺下者甚衆貫止綏逺翌日厚以後軍至始下渴驢嶺溪鍚羅薩勒遣班禪迎於路竊覘虛實勞而遣之誡曰歸語而主欲降宜亟決大軍至鋒刃一交將無所逃矣班禪還報以為我軍不甚衆初不知分而進也溪錫羅薩勒喜曰王師若止如此吾何慮哉以其衆據朴江古城俄聞三路兵集遽退二十里宗哥城之東地名葛陂湯有大澗數重可恃而戰賊遂據之是夕中軍宿于河之南鷂子隘之左永年軍于丁零宗谷口壬子厚貫遣選鋒五將前行中軍渡河而北繼永年之後張誡夾河而行日未出至賊屯所賊衆五六萬人據地利列陳張疑兵於北山下其勢甚鋭厚命馮瓘統選鋒五將與賊對陳王亨統䇿選鋒繼其後永年馳前視賊未知所出厚謂貫曰賊以逸待勞其勢方熾日漸髙士馬飢不可少緩宜以中軍越前軍傍北山整陳而行促選鋒入戰破賊必矣既行諜者言溪錫羅薩勒與其用事酋長都爾伯等謂衆曰彼張蓋者二太尉也為我必取之貫欲召永年問賊勢厚曰不可恐失支梧貫不聽及永年至攬轡久之無一語厚謂永年曰兩軍相當勝負在頃刻間君為前軍將久此何耶永年惶恐馳去時賊軍與我選鋒相持未動溪鍚羅薩勒以精兵數千騎自衛登其軍北髙阜之上張黃屋列大斾指揮賊衆其北山下疑兵望見厚與貫引中軍傍山欲來奔衝厚遣遊騎千餘登山潛攻其背賊覺而遁遊騎追擊之短兵接中軍伐鼓大譟永年遽揮選鋒突陳賊少却張誡以輕騎涉河搗其中堅取溪鍚羅薩勒之斾及其黃屋乘髙而呼曰獲賊酋矣諸軍鼓聲震地會暴風從東南來塵大起賊軍不得視我軍士乘勢奮擊自辰至午賊軍大敗追北三十餘里溪錫羅薩勒單騎趨宗哥城城閉不納遂奔青唐諸將爭逐之幾及會暮而還是日斬首四千三百一十六降俘三千餘人大首領都爾伯等被傷逃去不知所在宗哥城中偽公主瞎且默凌珍戬率酋首以城歸順宗哥城舊名龍支城留兵將守之是夕合軍于河之南翌日勝宗首領沁斯結率衆來降甲寅厚貫入安兒城乙卯引大軍至鄯州偽龜兹公主青伊特結默及其酋豪李河溫率回紇于闐班禪諸族大小首領等開門出降鄯州平初溪錫羅薩勒敗于宗格夜至青唐謀為守計部族莫肯從之者翌日挈其長妻逃入溪蘭宗山中厚遣馮瓘統輕鋭萬騎由州南青唐谷入賊復覺之遁于青海之上追捕不獲丙辰下林金城西去青海約二百里置兵將守之己未王厚等帥大軍入廓州界大首領羅實結令結率其衆降辛酉厚入廓州馳表稱賀大軍駐于城西河南部族日有至者厚諭以朝廷撫存恩意宗哥戰敗所誅禍福之因戒其不得妄作逆自取屠戮皆唯諾聽命乙丑罷講議司詔王厚童貫提兵出塞曽未數月青唐一國境土盡復其以厚為武勝軍留後熙河蘭會經略安撫使兼知熙州貫為景福殿使襄州觀察使依舊勾當內東門司丁卯羣臣以盡復青唐故地稱賀己巳曲赦陜西庚午王厚過湟州沿蘭州大河並夏國東南境上耀兵巡邊歸于熙州資治通鑑後編卷九十五
