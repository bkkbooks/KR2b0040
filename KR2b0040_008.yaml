body:
  text: 資治通鑑後編卷八刑部尚書徐乾學撰宋紀起柔兆困敦正月盡彊圉赤奮若十二月凡二年太祖起運立極英武睿文神德聖功至明大孝皇帝開寶九年十二月太宗太平興國元年李燾曰司馬光資治通鑑例年號皆從後來者為定唐髙祖武德元年正月便不稱隋義寧二年明皇先天元年正月便不稱太極元年梁開平元年正月便不稱唐天祐四年今按太宗于開寶九年十月二十一日即位十二月二十二日改元雖不俟踰年與常例不同仍稱開寶九年按燾此例正謂太宗與異姓弋命者不同不與其不踰年而改元之意也其辭婉而義嚴矣今從之春正月戊辰朔御乾元殿受朝臣乾學曰國君踰年改元春秋之法此固世及者一定不易之常經也其他更姓改物者原不在此例父子相繼不踰年而改元惟唐肅宗即位靈武為之然明皇之受內禪已嘗于當年改延和為先天矣肅宗當國祚呼吸存亡之際欲借此以係天下之人心新四方之觀聽不得不然情亦有可原者至于太宗誠為有失無怪乎紛紛之議也然考太宗于開寶九年十月二十一日即位至十二月二十日改元亦已遲至兩月何難于此十日而不俟至明年為名正而義順乎明臣程敏政有言曰五代以來殘年改元殆成故事即太祖不嘗以乾德六年十一月改元開寶乎此論甚和平得情亦足以見太宗為無心之失矣而朱子於此事亦謂開國之初一時人才粗踈理㑹不得此語尤切中當時君臣之病刻者乃遽欲執此以定太宗無兄之罪然則明皇不踰年而改元豈亦有無父之心乎長編仍書九年後之修史者竟易為太平興國元年其說曰兄終弟及與父子等而汲汲改元所以直著其罪也愚謂如其言則是豫之非奪之也削太祖開寶將盡之九年而遵太宗太平興國十日之元年非豫之而何故應上大書開寶九年下分書十二月太宗太平興國元年既不失據事直書之體而所以待太宗者是是非非之際亦昭然不可掩矣辛未曹彬遣翰林副使郭守文奉露布以江南國主李煜及其子弟官屬等四十五人來獻帝御明德門受獻煜等素服待罪詔並釋之各賜冠帶器幣鞍勒馬有差時有司議獻俘之禮如劉鋹帝曰煜嘗奉正朔非鋹比也寢露布不宣煜初以拒命頗懷憂恚不欲生見帝守文察知之因謂煜曰國家止務恢復疆土以致太平豈復有後至之責耶煜心始安徐鉉從煜至京師帝召見鉉責以不早勸煜歸朝聲色甚厲鉉對曰臣為江南大臣而國滅亡罪固當死不當問其他帝曰忠臣也事我如事李氏賜坐慰撫之又責張洎曰汝教李煜不降使至今日因出帛書示之乃我師圍城洎所草召江上救兵蠟彈內書也洎頓首請死曰書實臣所為犬吠非其主此其一耳他尚多今得死臣之分也辭色不變帝初欲殺洎及是竒之謂曰卿大有膽朕不罪卿今事我無替昔日之忠也乙亥以李煜為右千牛衛上將軍封違命侯其子弟皆授諸衛大將軍宗屬皆授諸衛將軍其從降官屬俱授官有差庚辰詔幸西京將以四月有事于南郊二月己亥羣臣再奉表請加尊號曰一統太平帝曰燕晉未復遽可謂一統太平乎不許羣臣請易以立極居尊許之壬寅遼主諭史館學士書皇后言亦稱朕暨豫著為定式庚戌以宣徽南院使曹彬為樞密使領忠武節度使樞密領節度自彬始彬歸自江南詣閣門進榜子云奉勑差往江南勾當公事回時人嘉其不伐始彬之行帝許彬以使相及還語彬曰今方隅尚有未服者汝為使相品位極矣肯復力戰耶且徐之更為我取太原因密賜錢五十萬彬怏怏而退至家見布錢滿室乃嘆曰人生何必使相好官不過多得錢耳按以檢校官兼中書令侍中同平章事者並謂之使相帝愛惜爵位不妄與人類此己未吳越王俶及其子鎮海鎮東節度使惟濬等入見崇德殿宴長春殿先是車駕幸禮賢宅案視供帳之具及至即詔俶居之寵賚甚厚俶所貢奉亦增倍於前帝初即位召供備庫副使魏丕謂曰作坊久積弊爾為我修整之即授作坊副使丕在職甚盡力居八年乃遷正使帝討澤潞維揚下荆廣收川峽征河東平江南皆先期諭㫖修創器械無不精辦三月己巳以丕領代州刺史仍典作坊庚午命吳越王俶劎履上殿詔書不名辛未以俶妻賢德順穆夫人孫氏為吳越國王妃宰相為異姓諸侯王妻無封妃之典帝曰行自我朝表異恩也即令其子惟濬持詔賜之先是帝數召俶與惟濬宴射苑中時諸王預坐俶拜輒令內侍掖起俶感泣又嘗令俶與晉王光義京兆尹廷美叙兄弟之禮俶伏地叩頭固辭乃止帝將西幸俶懇請扈從不許乃留惟濬侍祠遣俶歸國是月宴講武殿謂俶曰南北風土異宜漸及炎暑卿可早發俶泣涕願三嵗一朝帝曰川陸迂逺俟有詔乃來也初時羣臣皆有章疏乞留俶而取其地帝不從於是命取一黃袱以賜俶封識甚固戒俶曰途中宜密觀及啓之則皆羣臣乞留俶章疏也俶益感懼既歸每視事功臣堂一日命徙坐於東偏謂左右曰西北者神京在焉天威不違顔咫尺俶豈敢寧居乎益以乘輿服玩為獻製作精巧每修貢必列於庭焚香而後遣之考異李燾曰俶在太祖朝止一入覲記聞及東軒録等或云江南未平俶來朝太祖遣歸江南既平復來朝皆謬也五代史又云俶還國益以器服珍竒為獻不可勝數太祖曰此吾帑中物何用獻為按太祖待俶甚寵當無此語蓋出於魏王繼岌破蜀時或𫝊者誤飾之今不取丙子車駕發京師丁卯次鄭州庚辰帝謁安陵奠獻號慟左右皆泣既而登闕臺西北嚮發鳴鏑指其所曰我後當葬此賜河南府民今年田租之半復奉陵户一年考異談苑載帝自西京還乃謁安陵蓋誤也今從實録正史辛未帝至西京見洛陽宫室壯麗甚悅召知河南府右武衛上將軍焦繼勳面奬之加彰德軍節度使以王全斌為武寧軍節度謂之曰朕以江左未平慮征南諸將不遵紀律故抑卿數年為朕立法今已克金陵還卿節鉞仍厚賜之夏四月庚子合祭天地於南郊時雨彌月不止及期始晴霽以訖成禮都民垂白者相謂曰我輩少經亂離不圖今日復觀太平天子儀衛有泣下者是日御五鳯樓大赦壬寅大宴賜賚有差帝生於洛陽樂其土風嘗有遷都之意始議西幸起居郎李符上書陳八難帝不從既畢祀事尚欲留居之羣臣莫敢諫鐵騎左右廂都指揮使李懷忠乘間言曰東京有汴渠之漕嵗致江淮米數百萬斛都下兵數十萬人咸仰給焉陛下居此將安取之且府庫重兵皆在大梁根本安固已久不可動搖帝亦弗從晉王又從容言遷都非便帝曰遷河南未己久當遷長安王叩頭切諌帝曰吾將西遷者無他欲據山河之勝而去冗兵循周漢故事以安天下也王又言在德不在險帝不答王出帝顧左右曰晉王之言固善今姑從之然不出百年天下民力殫矣考異李燾曰李懷忠為年節度使在太平興國二冬此時但領富州團練使三朝聖政録稱節度使者誤也晉王事據王禹稱建隆遺事正史闕之甲辰始下詔東歸丙午車駕發洛陽宫辛亥至東京初李煜既降曹彬令煜作書諭江南諸城守皆相繼歸順獨江州軍校胡則與牙將宋明德殺刺史據城不降詔先鋒都指揮使曹翰為招安巡檢使率兵討焉江州城險固翰攻之不克自冬訖夏死者甚衆丁巳始拔之時則病甚卧床上翰執縛責其拒命對曰犬吠非其主公何怪也翰腰斬之并殺明德遂屠其城死者數萬人所略金帛以億萬計翰僞言欲致廬山東林寺五百鐵羅漢像歸至潁川新造佛舍遂調發巨艦十餘艘盡載金帛置鐵像於其上時號為押綱羅漢是月遣田守竒如遼賀生辰自是嵗以為常己未著令自今旬假不視事賜百官休沐帝以晉王光義所居地勢髙仰水不能及六月庚子步自左掖門至其第遣工為大輪激金水注第中且數臨視促成其役王性仁孝帝雅鍾愛尹京十五年庶務修舉帝數幸其府恩禮甚厚嘗病殆不知人帝亟往問親為灼艾王覺痛帝亦取艾自灸自辰至酉王汗洽蘇息帝乃還又嘗宴宫中王醉不能乘馬帝起送至殿階親掖之王帳下士䝉城髙瓊左手執鐙以出帝顧見因賜瓊等控鶴官衣帶及器帛勉令盡心間謂近臣曰晉王龍行虎步且生時有異必為太平天子福德非吾所及也考異蔡惇䕫州直筆云太宗以晉王尹京對罷宣諭曰久不見汝所乘何馬牽來一觀遂傳呼至殿陛叩御馬臺敕令晉王對御上馬太宗皇懼辭遜乃密論曰他日汝自合常在此上下馬何辭焉太宗駭汗趨出命近侍挽留送上馬遂再拜乘馬馳走回旋於殿庭而出示太宗繼及之意也按太祖繼及之意蓋先定於昭憲榻前矣今不取武寧節度使王全斌卒全斌輕財重士不求顯赫之譽寬而容衆軍旅樂為之用其黜居山郡幾十年怡然自得識者多之及卒贈中書令八月乙未朔吳越國王進射火箭軍士丁未命侍衛馬軍都指揮使党進為河東道行營馬步軍都部署宣徽北院使潘美為都監虎捷右廂都指揮使楊光美為都虞候暨牛思進米文義率兵分五道伐北漢丙辰我兵入太原又命欣代行營都監郭進等分攻欣代汾沁遼石等州是月女真侵遼貴德州東境九月甲子党進敗北漢兵於太原城下北漢主求救於遼遼主遣其相耶律沙救之辛未遼東京統軍使徹林詳衮涸奏女真襲歸州五寨剽掠而去冬十月帝不豫驛召道士張守真至闕下壬子命內侍王繼恩就建隆觀設黃籙醮是夕帝召晉王光義入對屬以繼位夜分乃退李燾長編冬十月初有神降於盩厔民張守真自言我天之尊初號黑殺將軍玊帝之輔也守真每齊戒祈請神必降室中風肅然聲若嬰兒獨守真能曉之所言禍福多驗守真遂為道士帝不豫驛召守真至闕下壬子命內侍王繼恩就建隆觀設黃籙醮令守真降神神言天上宫闕已成玊鎖開晉有仁心言訖不復降帝聞其言即夜召晉王屬以後事左右皆不得聞但遙見燭影下晉王時或離席若有所遜避之狀既而上引柱斧戳地大聲謂晉王曰好為之注云此據吳僧文瑩所為湘山野録正史實録並無之野録云祖宗潛曜日嘗與一道士遊於關河無定姓名自曰混沌或又曰真無每有乏則探囊金愈探愈出三人者每劇飲爛醉生善歌步虛為戲能引其喉於杳冥問作清徵之聲時或一二句隨天風飄下惟祖宗聞之曰金猴虎頭四真龍得真位至醒詰之則曰醉夢間語豈足憑邪至膺圖受禪之日乃庚申正月初四日也自御極不再見下詔草澤遍訪之人或見於轘轅道中嵩洛間乃開寶乙亥嵗也上已祓禊駕幸西沼生醉坐於岸木陰下笑揖太祖曰别來喜安上大喜亟遣中人密引至後掖恐其遁去急回蹕見之一如平時抵掌浩飲上謂生曰吾久欲見汝决尅一事無它吾夀還得幾多生曰但今年十月二十日夜晴則可延一紀不爾則當速置上酷留之俾泊後苑苑吏或見宿於木末鳥巢中或數日不見上切切記其語至所期之夕御太清閣以望氣是夕果晴星斗明粲上心方喜俄而陰霾四起天地陡變雪雹驟降移仗下閣急傳宫鑰開門召開封尹即太宗也延入大寢酌酒對飲宦官宫妾悉屏之但遙見燭影下太宗時或避席有不可勝之狀飲訖禁漏三鼓殿下雪已數寸太祖引柱斧戳雪顧太宗曰好做好做遂解帶就寢鼻息如雷是夕太宗留宿禁內將五鼓侍廬者寂無所聞太祖已崩矣太宗受遺詔於柩前即位逮曉登明堂宣遺詔罷放聲大慟引近臣環玉衣以瞻聖體玉色瑩如出湯沐太祖英武其達生知命蓋有如此者文瑩宜不妄故特著於此然文瑩所言道士不得姓名豈即張守真耶或復一道士也恐文瑩得之傳聞故不審如云於西沼木陰下笑揖太祖止宿後苑烏巢中言十月二十日夜晴則聖夀可延一紀疑皆好事者飾說未必然也又云太宗留宿禁內此亦謬誤太祖既不豫寧復自登閣且至殿庭戮雪乎今略加刪潤更俟詳考顧命大事也而實録正史皆不能記可不惜哉蔡惇直筆云太祖召陳摶入朝宣問夀數對以丙子嵗十月二十日夜或見雪當辦行計若晴霽須展一紀至期前夕上不寢初夜遣宫人出視回奏星象明粲交更再令出視乃奏天陰繼言雪下遂出禁鑰遣中使召太宗入對命置酒付宸翰屬以繼位夜分退上就寢侍寢者聞鼻息聲異急視之已崩太宗於是入繼按惇所載與文瑩略同但即以道士者為陳摶爾摶本傳及談苑並稱摶終太祖朝未嘗入見恐惇亦誤矣當是張守真也王禹稱建隆遺事云上將晏駕前一日遣中使急召宰相趙普盧多遜入宫見於寢閣上曰吾知此疾必不起要見卿等無他為有數事未暇行之卿等將筆硯來依吾言寫之身後切須行之吾瞑目無恨也遂授普等筆硯上自陳述普等依上言而寫數事皆濟世安民之法普等因嗚咽流涕而言此則謹依謨訓而行之然有一大事未見陛下處置上曰何事也普等曰儲嗣未定陛下倘有不諱諸王中當立何人上曰可立晉王普等復曰陛下艱難創業卒致升平自有聖子當受命未可議及昆弟也臣等恐大事一去卒不可還陛下宜熟計之上曰吾上不忍違太后慈訓下為海內方小康思得長君以撫之吾已決矣願公等善為我輔晉王遂出御府珠玉金器賜普等令歸第翌日上崩於長慶殿由是晋王聞普等有此奏議大銜之嗣位後坐多遜事連秦府貶死於嶺表闕隆遺趙普以婦人取媚於禁中遂獲免謹按世所傳建事十三章此其第十一章也是尤悖謬不可信蓋開寶六年八月趙普已罷相出鎮河陽後三年太祖晏駕此時趙普實在河陽安得與盧多遜並居相位耶又遺事第七章稱杜太后及太祖召晉王秦王南陽王等相約傳位陶穀為誓書趙普告天地宗廟此固不然也設如所言則太祖傳位晉王約已定於建隆初矣開寶末命宰相又何請耶就復請則決非趙普也且遺事乃一人所著其首尾固當參同今第七章既云爾其第十一章又云爾豈不自相矛盾耶臣燾嘗反復推究此章蓋普之怨家仇人多遜親黨所為欲肆其詆毁故託名禹稱竄寄遺事中實非禹稱作也禹稱仕太宗坐直屢黜故羣小因之然禹稱素識道理忠義人也決不敢鑿空架虛汚衊君父若此不顧且禹稱集所載表章多代普作禹稱傳亦稱普雅愛重禹稱縱禹稱書惡不為普隱亦須驗實傳信方太祖晏駕時普不在相位士大夫孰不知之而此章乃云與盧多遜同入宫其非禹稱所著蓋明甚必多遜親黨不習朝廷典故者所妄作也且非獨此章為不可信其他章要不全是蓋禹稱用文章名天下今所傳遺事語多鄙俗略不似禹稱平日口聲故臣燾竊有疑焉特信其可信耳學士大夫以書託名禹稱則遽信之不復推究此最害義者故不可不辨以曉來世云考異按蔡惇直筆云十月二十日前夕太祖召太宗入對屬以繼位夜分乃退本甚明白李燾作長編改繼位為後事且去夜分乃退四字又據僧瑩湘山野録載道士降神語并燭影斧聲事其後又據司馬光紀聞載帝崩宋后召德芳而王繼恩等召晉王事兩說甚異燾俱列之不虞矛盾何也蓋燾此書固編以俟考者未成史也史以傳信即無燭影斧聲之訛妄亦當細考詳定主於一說豈可一時之事彼此異同况野録紀聞一出異端之徒一出名臣之手後人宜何所信乎史稱燾博極羣書其為長編專務廣採擇焉不精良然今從直筆紀聞餘一槩削去庶杜後人之疑其詳見癸丑帝崩後癸丑帝崩於萬嵗殿時夜四鼓宋皇后使王繼恩出召貴州防禦使德芳繼恩以太祖傳國晉王之志素定乃不詣德芳徑趍開封府召晉王見左押衙程德𤣥先坐於府門德𤣥滎澤人善為醫繼恩詰之德𤣥對曰我宿於信陵坊乙夜有當關疾呼者曰晉王召出視則無人如是者三吾恐晉王有疾故來繼恩異之乃告以故扣門與俱入見王且召之王大驚猶豫不行曰吾當與家人議之久不出繼恩促之曰事久將為他人有矣時大雪遂與王雪中步至宫繼恩止王於直廬曰王姑待此繼恩當先入言之德𤣥曰便應直前何待之有乃與王俱進至寢殿后聞繼恩至問曰德芳來耶繼恩曰晉王至矣后見王愕然遽呼官家曰吾母子之命皆託於官家王泣曰共保富貴勿憂也李燾曰此據司馬光記聞誤以王繼恩為繼隆程德𤣥為賈德𤣥今依國史改定按開寶皇后以開寶元年二月入宫德芳以開寶八年七月娶焦繼勳女出閣時年十七德芳傳不載母為開寶皇后后傳亦不言有子德芳非宋出也當考國史方技傳馬韶平棘人習天文三式之學開寶中太宗以晉王尹京邑時朝廷申嚴私習天文之禁韶素與太宗親吏程德𤣥善德𤣥每戒韶不令及門九年十月十九日既夕韶忽造德𤣥德𤣥恐甚且詰其所以來韶曰明日乃晉王利見之辰也德𤣥惶駭因止韶於一室中遽入白太宗太宗命德𤣥以人防守之將聞於太祖及詰旦太宗入謁果受遺踐阼數日韶以赦免按此與程德𤣥傳所稱宿信陵坊夜有扣門疾呼趣赴宫邸事不同疑必有一誤今但從德𤣥傳及司馬光記聞甲寅太宗即位羣臣謁見萬嵗殿之東楹帝號慟殞絶臣乾學曰宋太宗無兄之心授議於後人者不止一端被以惡名則倡於胡氏一桂而陳楊貝諸人和之然黃文獻溍宋潛溪濓劉文介儼皆已力辨其誣惟程篁墩敏政其說尤詳懼後人之疑復著宋紀受終考以證之臣謂太宗之必不為其事無容多喙即於太祖之必立其弟信之杜后之命太祖顧趙普曰汝同記吾言不可違也太宗寧不信之於張齊賢則曰吾留使輔汝平居則稱之曰他日必為太平天子太宗又寧不信之夫殺逆大惡常人之所不為即使太宗狠戾不如常人亦必懼此位之不吾屬而後不得已而為此也位已屬我矣兄已不豫且屬後事矣而猶汲汲為此極惡之舉雖至愚者斷不出此然則此疑何自而生曰起於李燾之並存野録紀聞成於陳桱之强合兩說而又附㑹增益之他因無所據也或曰顧命之事何以獨略曰太祖素彊無疾故崩於癸丑而己亥猶幸西教場相去不過旬日史亦不記帝得何疾則必暴疾發於數日之間者耳前一夕雖召太宗屬後事帝亦不自意其遽崩也壬子夜分太宗退癸丑之夕上即崩宋后乃有召德芳不遵遺詔之意而不意繼恩之以晉王至也故后見王愕然遽呼官家吾母子云云其事狀甚明何乃多載野史欲以解疑而反滋惑乎後之讀史者心既不平於太宗後日所行之事信其待兄之薄復據此怪誕不經之語直欲坐以大逆無道之事其意亦欲懲惡而不知適以長無父無君之膽而導不孝不悌者之路也夫說之足以害世道惑人心者寧為彼野録所登必不可輕為吾正史所載是以反覆討論慎重於筆削間而竊附於春秋惡惡欲短之義云乙卯大赦天下常赦所不原者咸除之詔令緣邊禁戢戍卒毋得侵撓外境羣臣有所論列並許實封以聞須面奏者閣門使即時引對富弼曰太宗求治至切故詔羣臣論事欲面奏者即時引對此言路所以無壅也今來臣寮非差遣合上殿者不得對近有朝臣乞上殿敷奏邊事踰月不得報邊事尚拘常例况他事乎此蓋大臣不言致采言之道未廣也庚申以皇弟永興節度使兼侍中廷美為開封尹兼中書令封齊王皇子山南西道節度使同平章事德昭為永興節度使兼侍中封武功郡王貴州防禦使德芳為山南西道節度使同平章事帝友愛最篤不欲德芳異其稱呼并詔王石魏氏三公主皆依舊為皇子皇女焉宰相薛居正加左僕射沈倫加右僕射倫即義倫也參知政事盧多遜為中書侍郎平章事樞密使曹彬加同平章事樞密副使楚昭輔為樞密使十一月甲子追冊故尹氏為淑德皇后越國夫人符氏為懿德皇后尹氏崇珂之女兄帝微時所娶也丁卯詔齊王廷美武功郡王德昭位在宰相上庚午以齊州防禦使李漢超為雲州觀察使判齊州仍護關南屯兵洺州防禦使郭進領應州觀察使判邢州兼西山巡檢如故時瀛州防禦使馬仁瑀監霸州軍擅發麾下兵入遼境略奪由是與漢超交惡帝恐生邊釁即遣使齎金帛賜漢超及仁瑀令置酒講解尋徙仁瑀知遼州漢超在齊州凡十七年為政簡易吏民信愛嘗詣闕請立碑頌德詔太子率更令徐鉉為之文漢超立碑在開寶八年十一月今附此進在洺州日嘗於城四面悉令種栁壕中雜植荷芰蒲葦後益繁茂州人見之有泣者曰此郭公所種也詔諸道轉運使各察舉部內知州通判監臨物務京朝官等以三科第其能否政績尤異者為上恪居官次職務粗治者為中臨事弛慢所涖無狀者為下嵗終以聞吕中曰轉運置於乾德本以總利權耳而兼糾察官吏自此始厥後有判官有副使又有提㸃刑獄皆所以糾察官吏此漢部刺史職也以供奉官薛惟吉為右千牛衛將軍沈繼宗及鄉貢進士盧雍並為水部員外郎雍多遜子也起家授官即與繼宗同多遜時方寵幸帝特命之非舊典云是月進封劉鋹衛國公李煜隴西郡公去違命侯舊號十二月癸巳朔上大行皇帝諡曰英武聖文神德廟號太祖甲寅帝御乾元殿受朝懸而不樂大赦改是嵗為太平興國元年戊午遼遣使來賻己未幸講武池遂幸玉津園是嵗高麗國人金行成始入學於國子監罷河東兵史臣曰五季亂極宋太祖起介胄之中踐九五之位原其得國視晉漢周亦豈甚相絶哉及其發號施令名藩大將俯首聽命四方列國次第削平此非人力所易致也建隆以來釋藩鎮兵權繩贓吏重法以塞濁亂之源州郡司牧下至令録幕職躬自引對務農興學慎罰薄斂與世休息迄於丕平治定功成制禮作樂在位十有七年之間而三百餘載之基傳之子孫世有典則遂使三代而降考論聲明文物之治道德仁義之風宋於漢唐蓋無讓焉烏呼創業垂統之君規模若是亦可謂逺也已矣臣乾學曰後世君臣其得天下與二帝三王異者祗此自私自利之心害之耳不然宋太祖之中外擁戴而受命不傳天下於其子而與弟何遽不若堯舜湯武矣哉跡其即位後全功臣於令終待降王以殊禮寬大以養民力誠信以勵臣工遂開太平永久之祚雖後稍衰弱播遷由其子孫失德非祖宗之咎也程子謂本朝有不可及者五事豈不信哉竊嘗論太祖之為君智略如漢高而忠厚過之謙雅如光武而豁達過之勤敏如唐太宗而方正過之惜乎天不假之以年治止此也三代以降質美而可與希帝希王者一人而已太平興國二年春正月壬戌以大行在殯不視朝丙寅命禮部員外郎賈黃中左補闕程能左贊善大夫馮瓉分掌左藏三庫先是貨錢與金帛同掌嵗久儲蓄盈羡始命分之黃中尋出知升州嘗按行府廨見一室扃鐍甚固命發鑰視之得金寶數十匱計其價直數百萬乃李氏宫闕中遺物未著於籍即表上之帝曰非黃中亷恪則亡國之寶將汚法而害人矣賜錢二十萬李燾曰黃中知升州不得其月日據本傳在二年今附見於此徐度國紀載之二月庚子不知何據帝初即位以疆宇至逺吏員益衆思廣振淹滯以資其間闕顧謂侍臣曰朕欲博求俊乂於科場中非敢望拔十得五止得一二亦可為致治之具矣先是諸道所發貢士凡五千三百餘人命太子中允直舍人院張洎右補闕石熙載試進士左贊善大夫侯陶等試諸科户部郎中侯陟監之於是禮部上所試合格人名戊辰帝御講武殿內出詩賦題覆試進士命翰林學士李昉扈䝉定其優劣為三等得河南吕䝉正以下一百九人庚午覆試諸科得二百七人並賜及第又詔禮部閲貢籍得十五舉以上進士及諸科一百八十四人並賜出身九經七人不中格帝憐其老特賜同三傳出身凡五百人皆先賜緑袍鞾笏錫宴開寶寺帝自為詩一章賜之第一第二等進士并九經授將作監丞大理評事通判諸州同出身進士及諸科並送吏部免選優等注擬寵章殊異歷代所未有也薛居正等言取人太多用人太驟帝意方欲興文教抑武事弗聼及䝉正等辭召令升殿諭之曰到治所事有不便於民者疾置以聞仍賜裝錢人二十萬太祖之幸西京也洛陽人張齊賢獻十䇿下并汾富民封建敦孝悌舉賢太學籍田選良吏懲姧謹刑太祖召見便坐問之齊賢以手畫地條陳太祖善其四䇿齊賢堅執其餘皆善太祖怒令衛士曳出及還語帝曰我幸西京惟得一張齊賢我不欲遂官爵之汝異時可收以自輔也於是齊賢舉進士帝欲置之髙等而有司第其名在數十人後帝不悅乃詔進士盡第二等及九經凡一百三十人悉與超除考異按前言凡五百人此言一百三十人者自一等至第二等及九經所取者也其他第三等及諸科三傳出身者不在其內意齊賢時在二等故然言悉與超除則是前所云第一第二等進士皆授京官及通判之謂耳後史不考皆云為張齊賢一榜盡賜及第非也齊賢雖在數十人後固已及第矣當云為齊賢二等盡與超除則是矣蓋為齊賢故也乙亥賜鄉貢進士孔世基同本科出身褒先聖後也庚辰詔以美名易禁軍舊號鐵騎曰日騎控鶴曰天武龍騎曰龍衛虎捷曰神衛吳越王俶遣其子溫州刺史惟演來修貢賀登極己卯吳越王妃孫氏薨詔給事中程羽為弔祭使二月壬辰朔樊若水請置監於升鄂饒等州大鑄銅錢凡山之出銅者悉禁民採並取以給官鑄且除銅錢渡江之禁詔從其請民甚便之癸巳吳越王俶遣使來修時貢甲午遼遣使來賀即位及正旦罷江南鐵錢悉鑄為農器以給江北流民之歸附者考異實録作七月丁亥今從宋史右千牛衛上將軍李煜自言其貧乙未詔賜錢三百萬煜雖貧張洎頗丐索之煜以白金頮面器與洎洎意猶不足己亥吳越王俶以山陵有期遣使來修賻禮庚子帝改名炅詔除已改州縣職官及人名外舊名二字不須回避初右監門衛率府副率王繼勳分司西京殘暴愈甚强市民家子女以備給使小不如意即殺而食之以槥櫝貯其骨出棄野外女儈及鬻棺者出入其門不絶民甚苦之不敢告帝在藩邸頗聞其事及即位㑹有訴者亟命户部員外郎知雜事雷德驤往鞫之繼勳具服所殺婢百餘人乙卯斬繼勳并女儈八人於洛陽市長夀寺僧惠廣常與繼勳同食人肉帝令先折其脛然後斬之民皆稱快壬寅大宴崇德殿不作樂三月香藥庫使高唐張遜建議請置𣙜場局大出官庫香藥寶貨稍增其價許商人入金帛買之嵗可得錢三十萬貫以濟國用使外國物有所泄帝從之一嵗中果得三十萬貫戊寅命翰林學士李昉等編類書為一千卷小說為五百卷初節度使得補子弟為軍中牙校豪橫奢縱民間苦之上雅知其弊始即位即詔諸州府籍其名部送闕下至者凡百人癸未悉補殿前承㫖以賤職羈縻之己丑置威勝軍許遼人互市隆平集云以李繼升築潞州北亂栁九圍中為威勝軍庚寅知江州周述言廬山白鹿洞學徒常數千百人乞賜九經使之肄習詔國子監給本仍傳送之夏四月甲寅遼遣鴻臚少卿耶律敞等來助葬乙卯葬太祖英武聖文神德皇帝於永昌陵五月癸亥向拱張永德張美劉廷讓皆罷節鎮為諸衛上將軍丙寅詔繼母殺子及婦者同殺人論庚午命起居舍人幸仲甫使於遼右贊善大夫穆被副之將至境聞朝議興師伐北漢仲甫知北漢倚遼為援遲留未敢進飛奏俟報有詔遣行既至遼主問曰聞中朝有党進者真驍將如進之比凡幾人仲甫對曰名將甚多如進鷹犬之材何可勝數遼主欲留之仲甫曰信以成命命不可留有死而已遼主知其不可奪厚禮遣還帝嘗謂左右曰仲甫逺使絶域練達機宜可謂不辱君命矣甲戌以十月十七日為乾明節己卯祔太祖神主於太廟廟樂曰大定之舞以孝明皇后王氏配又以懿德皇后符氏淑德皇后尹氏祔别廟庚辰詔修鳯翔府終南山北帝宫宫即張守真所築以祀神者也閠七月庚寅朔以陳洪進將入朝遣翰林使程德𤣥往宿州迎勞之己酉遣翰林學士李昉使吳越丁巳有司上諸州所貢閠年圖故事每三年一令天下貢地圖與版籍皆上尚書省國初以閠為限所以周知山川之險易户口之衆寡也是月河決孟州之溫縣鄭州之滎澤澶州之頓丘皆發緣河諸州丁夫塞之又遣左衛大將軍李崇矩騎置自陜西至滄棣案行水勢視隄岸之缺亟繕治之民被水災者悉蠲其租八月丙寅陳洪進入見於崇德殿禮遇優渥賜錢千萬白金萬兩絹萬匹宋史云乙丑平海軍節度使陳洪進來朝今從長編為丙寅帝初即位以少府監高保寅知懷州懷州故𨽻河陽時趙普為節度使保寅素與普有隙事多為普所抑保寅心不能平手疏乞罷節鎮領支郡之制乃詔懷州直𨽻京長吏得自奏事於是虢州刺史許昌裔訴保平軍節度使杜審進闕失事詔右拾遺李瀚往察之瀚因言節鎮領支郡多俾親吏掌其關市頗不便於商賈滯天下之貨望不令有所統攝以分方面之權帝納瀚言戊辰詔諸州並直屬京天下節鎮無復有領支郡者矣考異李燾曰按此時已盡罷節鎮所領支郡矣而實録興國七年五月辛亥又書詔以涇州直屬京不知何也今削去不著更須考之九月吳越王俶將入朝先遣其子惟濬來貢壬辰詔户部郎中侯陟至泗州迎勞之及惟濬至賜賚無算唐天祐中兵亂窘乏始令以八十五錢為百後唐天成中又減五錢漢乾祐初復減三錢國初因漢制其輸官亦用八十或八十五然諸州私用猶各隨俗至有以四十八錢為百者丁酉詔所在悉以七十七錢為百每千錢必及四斤半以上禁江南新小錢民先有藏蓄者悉令送官官據銅給其直私鑄者棄市帝屬意戎事每朝罷親閲禁卒命築講武臺於城西之楊村辛亥大閲帝與文武大臣從官等登臺而觀命天武左廂都指揮使崔翰分布士伍南北綿亘二十里建五色旗以號令將卒節其進退每按旗指縱則千乘萬騎周旋如一甲兵之盛近代無比帝恱即以金帶賜翰曰此朕藩邸時所服者也容州舊貢珠太祖平劉鋹詔廢媚川都及禁民採珠至是復貢珠百斤賜負擔者銀帶衣服丙辰帝始狩於近郊作詩賜羣臣令屬和國子監主簿郭忠恕決杖配𨽻登州禁錮忠恕縱酒肆言時政頗有謗讟帝怒故有是謫忠恕行至臨邑卒丁巳吳越王遣使乞呼名不允冬十月辛酉命左衛大將軍李崇矩為雍貴潯橫欽竇等州都巡檢使未幾徙瓊崖儋萬麾下軍士咸憚於從行崇矩盡出器皿金帛凡直數百萬悉分給之衆乃感恱時黎賊擾動崇矩悉至洞穴撫諭以已財遺其酋長衆皆懷附在嶺表及海上四五年恬然不以炎荒嬰慮舊涉海者多艤舟俟風或旬餘或彌月崇矩往來皆一日而渡未嘗留滯從者亦皆無恙人謂崇矩純德之報云遼遣使來賀乾明節己巳羣臣請舉樂表三上從之是月初𣙜酒酤十一月丁亥朔日有食之既遼司天奏日當食不虧庚寅日南至帝始受朝馬軍都指揮使党進出為忠武節度使進掌禁衛凡十二年嘗徼巡京師閭巷間有畜竒禽異獸者進或見必命左右取而放之罵曰買肉不供父母反飼禽獸乎嘗為杜重威家奴重威子孫貧賤進分月俸錢給之人亦以此稱焉十二月丁巳朔試諸州所送天文術士𨽻司天臺無取者黥配海島癸酉詔定晉州礬法私煮及私販易者罪有差靈州通逺軍界諸蕃族剽略官綱詔知靈州通遠軍使董遵誨討之遵誨分將出兵諸蕃族大懼盡歸所掠肉袒請罪遵誨即慰撫之自是各謹封略秋毫不敢犯帝命遵誨兼領靈州路巡檢在通逺軍凡十四年資治通鑑後編卷八
