body:
  text: 資治通鑑後編卷一百二十四刑部尚書徐乾學撰宋紀一百二十四起昭陽大荒落正月盡著雍閹茂三月凡五年有三月孝宗紹統同道冠德昭功哲文神武明聖成孝皇帝乾道九年春正月辛未僉書樞密院事王之竒罷癸酉金尚書省奏南客車俊等因𣙜場貿易誤犯邊界罪當死金主曰本非故意可免罪發還毋令彼國知之恐復治其罪乙亥以張說同知樞密院事户部侍郎沈復僉書樞密院事辛巳以刑部尚書鄭聞僉書樞密院事考異按薛鑑與沈復同日拜誤也今據宰輔表改正己丑樞密使王炎罷考異己丑采史孝宗紀作辛未與王之竒同日罷今從宰輔表閏月辛酉金洛陽縣賊攻盧氏縣殺縣令李庭才亡入南界二月乙卯修盧州城壬申蠲江西旱傷五州逋負乙亥青羌諾爾結冦安靜寨黎州推官黎商老戰死命䕫州轉運判官趙不息攝制司以討之諾爾結吐蕃小種也時遣其首領夢束畜列率數千人入漢地二百餘里成都大震不息靜以鎮之召僚屬飲夜遣步將領飛山軍徑赴沈黎又徙綿州兵戍邛州為後援戒之曰堅守勿動密檄諸蕃部生獲吐蕃一人賞十縑殺一人二縑於是邛部川首領崖襪合諸部落大破吐蕃于漢源殺夢束畜列以其首來獻凡十有六日而平不息嗣濮王宗暉曽孫也性篤孝生七歲父士圃從徽宗北遷每一思慕旦夕泣血及長力學不間寒暑母曹氏止之答曰君父之讎未報非敢志富貴也居官所至有聲民或畫像以祀立朝好言天下事與朱熹張栻為友每宴禁中帝必顧太子曰此賢宗室也乙酉皇孫榮國公挺卒追封豫國公丁亥特贈蘇軾為太師三月甲午禁北界博易銀絹乙卯金主謂宰臣曰㑹寧乃國家興王之地自海陵遷都永安女真人寖忘舊風朕及見女真風俗迄今不忘今之燕飲音樂皆習漢風蓋以備禮也非朕心所好東宫不知女真風俗第以朕故猶尚存之恐異時一變此風非長久之計甚欲一至㑹寧使子孫得見舊俗庶幾習效之太子詹事劉仲誨請增東宫牧人及張設金主曰東宫諸司局人自有常數張設已具尚可增益太子生於富貴易入於侈惟當導以淳儉朕自即位以來服御器物往往仍舊卿以此意諭之丙辰復分淮南安撫使為東西路夏四月己巳金制出繼子所繼財産不及本家者以所繼與本家財産通數均分乙亥金主御睿思殿命歌者歌女真詞顧謂太子及諸王曰朕思先朝所行之事未嘗暫忘故時聽此詞亦欲令汝輩知之汝輩自幼惟習漢俗不知女真純實之風至於文字語言或不通曉是忘本也汝輩當體朕意至於子孫亦當遵朕教誡也己丑皇太子解臨安尹事五月壬辰朔日有食之戊戌金禁女真人毋得譯為漢姓甲辰金尚書省奏鄧州民范三毆殺人當死而親老無侍金主曰在醜不爭謂之孝孝然後能養斯人以一朝之忿忘其身而有事親之心乎可論如法其親官與養濟醜下當有夷字豈史文因傳寫而脫之邪己未迪功郎朱熹特改宣教郎主管台州崇道觀先是陳俊卿劉珙薦熹為樞密院編修官屢召不至梁克家奏乞褒録之或言熹學問淹該但泥於所守差少通耳帝曰熹安貧樂道亷退可嘉遂有是命熹以求退得進於義未安再辭踰年始拜命秋七月庚子金復以㑹寧府為上京壬寅青羌諾爾結降庚戌金罷歲課雉尾八月丙子臣僚言江西連年荒旱不能預興水利為之備於是乃降詔曰朕惟旱乾水溢之灾堯湯盛時有不能免民未告病者備先具也豫章諸郡縣但阡陌近水者苖秀而實髙仰之地雨不時至苖輒就槁意水利不修失所以為旱備乎唐韋丹為江西觀察使治陂塘五百九十八所灌田萬一千頃今諸道名山川源甚衆民未知其利然則通溝瀆瀦陂澤監司守令顧非其職歟其為朕相邱陵原隰之宜勉農桑盡地利平繇行水勿使失時朕將即勤惰而寓賞罰九月丙申梁克家等上中興㑹要太上皇及皇帝玉牒庚子命盱眙軍以受書禮移牒泗州示金生辰使金使不從辛亥金大名府僧李智究等謀反伏誅冬十月辛未右丞相梁克家罷克家時獨相貴戚權幸不少假借而外濟以和以與張說議使事不合遂求去出知建寧壬申矞雲見甲戌以曽懷為右丞相鄭聞參知政事張說知樞密院事沈夏同知院事丁亥金賀㑹慶節使完顔襄等入辭别函申議受書之儀仍示虞允文速為邊備十一月辛卯詔樞密院除授及財賦事關中書門下省其邊機軍政更不録送戊戌合祀天地于圜丘大赦改明年為淳熙元年壬子金吏部尚書梁肅請禁奴婢服羅綺金主曰近已禁其服明金行之以漸可也且教化之行當自貴近始朕宫中服御常自節約卿等宜更從儉素使民知所效也十二月乙未朔戒敕沿邊諸軍毋輒遣間探招納叛亡甲子同知樞密院事沈復罷乙丑以御史中丞姚憲僉書樞密院事乙酉金遣完顔璋等來賀明年正旦以議受書儀不合詔俟改日以太上皇有㫖姑聽仍舊丁亥璋等入見是歲浙東江東西湖北旱淳熙元年春正月乙未禁淮西諸關採伐林木丙午禁兩淮耕牛出境以交址入貢詔賜國名安南封南平王李天祚為安南國王二月壬戌金以完顔璋之來宋使人就館奪其書而重賂之杖璋百五十除名仍以所受禮物入官癸酉四川宣撫使雍國公虞允文卒先是帝嘗謂允文曰丙午之耻當與丞相共雪之故允文許帝以恢復使蜀一歲無進兵期帝密詔趣之允文言軍需未備帝不樂至是遣二介持御札賜之而允文已卒不知其所言後數年帝幸白石大閲見軍皆少壯謂輔臣曰此虞允文行沙汰之效也尋贈太傅諡忠肅允文慷慨磊落有大志言動有則望而知為任重之器早以文學致身臺閣晚際時艱出入將相垂二十年夙夜忠勤無與二焉辛巳為郭浩立廟于金州三月甲午金主謂大臣曰海陵純尚吏事當時宰執止以案牘為功卿等當思經濟之術不可狃於故常也丙申參知政事鄭聞罷為四川宣撫使金完顔璋既以來使獲罪因遣刑部尚書梁肅為宋國詳問使其書略曰盟書所載止於帝加皇字免奉表稱臣稱名再拜量減歲幣便用舊儀親接國書兹禮一定於今十年今知歲元國信使到彼不依禮例引見輒令迫取於館姪國體當如是耶往問其詳宜以誠報癸丑肅入見帝仍立接國書肅還附書謝金主大喜欲以肅為執政左丞相赫舍哩良弼曰梁肅可相但使宋還即為之宋人自此輕我矣乃止夏四月乙丑金主諭宰臣曰聞愚民祈福多建佛寺雖已條禁尚多犯者宜申約束無令徒費財用戊寅遣張子顔等使金報聘己卯以姚憲參知政事户部尚書葉衡僉書樞密院事六月丙辰朔詔禮官討論别建四祖廟正太祖東向之位從禮部侍郎李燾議也癸酉改江陵府為荆南府戊寅右丞相曽懷罷先是臺官詹亢宗季棠論事因中懷懷遂求退且乞辨明誣謗大理寺根究無實乃貶責亢宗及棠言者追論參知政事姚憲與亢宗等通謀陷懷以取相位乃罷憲甲申落職與祠以葉衡參知政事秋七月丁亥復以四川宣撫使鄭聞參知政事壬辰復以觀文殿大學士曽懷為右丞相兼樞密使己酉詔姚憲南康軍居住八月乙未知樞密院事張說罷以徽猷閣學士楊倓僉書樞密院事帝亷知說欺罔數事命侍御史范仲芑究之遂與祠諫官湯邦彥又劾其姦贓乃責居撫州後許自便數年死九月乙酉朔以曽覿為開府儀同三司冬十月乙卯朔金圖畫功臣于衍慶宫金主思太祖太宗創業艱難求當時羣臣勳業最著者二十一人圖畫于衍慶宫聖武殿之左右廡遼王舍音金源郡王薩噶遼王鄂特本秦王尼瑪哈宋王斡里雅布梁王烏珠金源郡王蘇卜實金源郡王鄂囉金源郡王固紳金源郡王羅索楚王摩囉歡魯王棟摩金源郡王尼楚赫隨國公阿里罕金源郡王烏庫納豫國公蒲嘉努金源郡王薩里罕兖國公劉彥宗特進鄂囉古齊國公韓企先特進錫錫辛酉立金銀出界罪賞丙寅參知政事鄭聞卒壬午以魏王愷判明州十一月甲申朔日有食之戊戌以禮部侍郎龔茂良參知政事僉書樞密院事楊倓罷茂良先為廣東提刑建學右文掩骼埋胔有善政為江西運判救荒功尤著除禮部侍郎帝亟欲用之手詔問國朝典故有從官徑除執政例遂拜參知政事奏事賜坐帝顧葉衡及茂良曰兩參政皆公議所與衡等起謝帝從容曰自今諸事毋循私若鄉曲親戚未須援引朕每存公道設有誤卿等宜力爭君臣之間不可事形迹茂良曰大臣以道事君遇有不可自當啓沃豈容迹見於外因上言官人之道在朝廷則當量人才在銓部則宜守成法法本無弊例實敗之法者公天下而為之者也例者因人而立以壞天下之公者也昔之患在於用例破法今之患在於因例立法諺稱吏部為例部今七司法雖不無踈略然守之亦可以無弊而徇情廢法相師成風蓋用例破法其害小因例立法其害大法令繁多官曹冗濫職由此也望令重行考定非大有抵梧者弗去稍涉寬縱者悉刋止之庶幾賕謝之姦絶冒濫之門塞矣乃詔有司刋定七司法金主諭尚食局使曰大官之食皆民脂膏日者品味太多不可遍舉徒為虛費自今進可口者數品而已丙午右丞相曽懷罷戊申以葉衡為右丞相兼樞密使衡有才智由小官不十年至宰相人謂出於曽覿云十二月丁巳以吏部尚書李彥頴僉書樞密院事丙辰罷鐵錢改鑄銅錢壬申葉衡等上真宗玉牒臣僚言出賣官田二年之間三省户部困於文移監司州郡疲於出賣上下督察不為不至始限一年繼限二年已賣者才十三已輸者才十二蓋賣産之家無非大姓估價之初以上色之産輕立價貫揭榜之後率先投狀若中下之産無人屬意所立之價輕重不均莫若且令原佃之家著業輸租猶可歲得數十萬斛從之二年春正月癸巳前宰相曽懷梁克家坐擅改堂除克家落職懷降職三月乙巳詔武舉第一人補秉義郎堂除諸軍計議官夏四月乙卯賜禮部進士詹騤以下四百三十六人及第出身蜀人楊申對䇿言恢復之志不堅者二事一謂妃嬪滿前聖意幾於惑溺一謂䇿士之始以談兵為諱上覽不悅置之第五等是科得羅㸃己巳宴輔臣于玉津園帝謂葉衡等曰朕嘗觀無逸篇見周公為成王歷數商周之君享國久速真後世龜鑑衡等奏曰陛下能以無逸為鑑真社稷無窮之福也帝又曰朝廷用人止論其賢否如何不可有黨如唐之牛李其黨相攻四十年不解皆緣主聽不明所以至此文宗乃言去河北賊易去朝中朋黨難朕嘗笑之為人主者但公是公非何緣有黨又曰近來士大夫好倡為清議此語一出竊恐相師成風便以趨事赴功者為猥俗以矯激沽譽者為清髙駸駸不已如東漢激成黨錮之風深害治體豈可不戒卿等宜書諸紳龔茂良與周必大薦宜黃知縣劉清之召入對首論民困兵驕大臣退託小臣茍偷願陛下廣覽兼聽并謀合智清明安定提要挈綱而力行之古今未有俗不可變弊不可革者變而通之亦在陛下方寸之間耳又言用人四事一曰辨賢否道義之臣大者可當經綸小者可為儀刑功名之士大者可使臨政小者可使立事至於謀富貴利達者下也二曰正名實今百有司職守不明非曠官則侵逼願詔史官考究設官之本意各指其合主何事制㫖親定載之命書依開寶中差諸州通判故事使人人曉然知之而行賞罰焉三曰使材能軍旅武臣錢穀能吏必臨之以忠信不欺之士使皆得以效其所長四曰聽換授謂文武之官不可用違其才然不當許之自列宜令文武臣四品以上各以性行材略及文武藝每歲互舉堪充左右選者一人於合入資格外例與優奬帝深然之五月辛卯諭宰相以朝政闕失士民皆得獻言趙雄奏事帝曰今夏蠶麥甚熟絲米價平可喜雄奏孟子論王道始於不饑不寒帝曰近世士大夫好髙論恥言農事微有西晉風豈知周禮與易言理財周公孔子曷嘗不以理財為務且不獨此士夫諱言恢復不知其家有田百畝內五十畝為人所據亦投牒理索否雄曰陛下志在大有為敢不布堯言書之時政記茶寇賴文政起湖北轉入湖南官軍數為所敗庚子命鄂州都統李川調兵捕之乙巳詔知縣三年為任六月庚戌朔以四川宣撫使沈夏同知樞密院事辛酉罷四川宣撫司以倉部郎中辛棄疾為江西提刑節制諸軍討捕茶冦用葉衡之薦也丁卯以左司諫湯邦彥言蔣芾王炎並落職芾建昌軍炎袁州居住張說落節度使撫州居住是月茶冦自湖南犯廣東秋七月辛丑有星孛于西方八月丙辰江西總管賈和仲以捕茶冦失律除名賀州編管甲子賜安南國王印丁卯蠲湖南江西被冦州縣租稅丁丑遣左司諫湯邦彥使金申議九月乙卯朔湯邦彥請分揚廬州荆南襄陽府金州興元府興州為七路每路文臣一人充安撫使以治民武臣一人充都總管以治兵三載視其成以議誅賞從之乙酉振恤淮南水旱州縣辛卯髙麗西京留守趙位寵以慈悲嶺至鴨渌江四十餘城叛附于金金主曰朕懷綏萬邦豈助叛臣為虐執其使付髙麗位寵尋伏誅乙未右丞相葉衡罷初帝諭執政選使求河南陵寢地衡奏湯邦彥有口辨宜使邦彥請對知薦出於衡恨之因奏衡對客有訕上語帝大怒即日罷衡丁未同知樞密院事沈夏罷贈趙鼎太傅追封豐國公閏月丁巳以李彥頴參知政事翰林學士王淮僉書樞密院事是月辛棄疾誘賴文政殺之茶冦平遂奏疏曰今朝廷清明比年李全賴文政陳子明李峒相繼竊發皆能一呼嘯聚千百殺掠吏民至煩大兵翦滅良由州以趣辦財賦為急吏有殘民害物之狀而州不敢問縣以並緣科斂為急吏有殘民害物之狀而縣不敢問田野之民郡以聚斂害之縣以科率害之吏以乞取害之豪民以兼并害之盜賊以剽奪害之民不為盜去將安之夫民為國本而貪吏迫使為盜今年𠞰除明年剗蕩譬之木焉日刻月削不損則折欲望陛下深思致盜之由講求弭盜之術無徒恃平盜之兵申飭州縣以惠養元元為意有違法貪冒者使諸司各揚其職勿但按舉小吏以應故事自為文過之地詔奬諭之冬十月壬午加上德夀宫尊號曰光堯夀聖憲天體道性仁誠德經文緯武太上皇帝夀聖齊明廣慈太上皇后庚戌麗正門內火初金唐古部族節度使伊喇摩多之子殺其妻而逃金主命捕之至是皇姑梁國公主請赦之金主謂宰臣曰公主婦人不識典法罪尚可恕摩多請託至此豈可貸宥不許戊午提㸃坑冶王揖進羡餘十萬緡詔却之十二月辛巳班淳熙吏部七司法甲午立春帝以上皇來年夀七十預於是日詣德夀宫行慶夀禮大赦文武官封父母賞諸軍議放天下苖稅三之一大臣言國用不足乃止三年春正月甲寅以常州旱寬其逋負之半賑淮東饑仍命貸貧民種丙寅金主與親王宰執從官論古今興廢事曰經籍之興其來久矣垂教後世無不盡善今之學者既能誦之必須行之然知而不能行者多矣茍不能行誦之何益女真舊風最為純直雖不知書然其祭天地敬親戚尊耆老接賔客信朋友禮意欵曲皆出自然其善與古書所載無異汝輩當習學之舊風不可忘也戊辰金宫中火二月甲申賜韓世忠諡曰忠武庚寅金瀋王妃圖克坦氏以姦伏誅妃平章政事克寧之女也克寧坐是罷端明殿學士汪應辰卒諡文定應辰接物溫遜而遇事特立不回流落嶺嶠十有七年秦檜死始還朝剛方正直敢言不遜少從吕居仁胡安國游見張栻吕祖謙深器許之告以造道之方嘗釋克己之私如用兵克敵易懲忿窒欲書剛制于酒懲窒剛制皆克勝義可不常省察乎其義理之精如此好賢樂善出於天性尤篤友愛嘗以先疇遜其兄衢雖無屋可居不顧也三月丙午朔日當食隂雲不見戊申金臨潢雨豆辛亥上上皇日厯于德夀宫己未置六部編敕司壬申立任子參選覆試法夏四月丙戌金詔京府設學養士丁亥雨雹己丑貶葉衡郴州安置丁酉湯邦彥陳雷以奉使無狀除名邦彥新州雷永州編管邦彥至金拒不納旬餘乃引見夾道之士皆控弦露刃邦彥怖甚不能措一辭而還帝大怒竄之嶺南詔葉衡自便復官與祠自是陵寢之議息己亥詔諸路提刑歲五月理囚五月戊申金南京宫殿火留守轉運兩司官皆抵罪癸丑合利州東西路為一安南國王李天祚卒子龍翰嗣壬申太白晝見金翰林學士圖克坦子溫進所譯史記西漢書貞觀政要白氏策林金主命頒行之遂選諸路學生三十餘人令編修官溫德亨塔克達教以古書習作詩䇿六月乙酉減四川酒課四十七萬餘緡甲午召朱熹為祕書郎不至時熹主管台州崇道觀龔茂良奏熹操行耿介遂有是除熹力辭遂改主管武夷山冲佑觀除吕祖謙祕書郎國史院編修官以修撰李燾薦重修徽宗實録也是月金山東兩路蝗秋七月壬子金夏津縣令伊喇珊珠坐贓伏誅乙丑禁浙西圍田八月乙亥以王淮同知樞密院事禮部尚書趙雄僉書樞密院事除劉清之通判鄂州鄂俗計利而尚鬼家貧子壯則出贅病則聽于巫死則畀諸火清之皆諭止之九月提舉玉隆萬夀宫李浩卒浩立朝慨然以時事為己任忠憤激烈言切時弊以此見忌於衆平居未嘗假人以辭色不知者以為傲或譖於帝前帝謂斯人無他在朕前亦如此非為傲者小人謀害無所不至獨賴帝察其衷始終全之為郡尤亷潔自海右歸不載南海一物平生奉養如布衣時嘗論風俗不美者八其言曰陛下求規諫而臣下專務迎合貴執守而臣下專務順從惜名器而僥幸之路未塞重亷恥而趨附之門尚開儒術可行而有險詖之徒下情當盡而有壅蔽之患期以氣節而偷惰者得以茍容責以實效而誕慢者得以自售帝嘉其直諒云冬十月丙子冊貴妃謝氏為皇后后丹陽人幼孤鞠於翟氏冒其姓及長選入宫侍太上皇后后以賜帝纍位貴妃夏后崩中宫虛位妃侍帝過德夀宫太上諭帝立之遂復姓庚辰詔曰鬻爵非古也夫理財有道撙節出入足矣輕官爵以益財貨朕甚不取自今除歉嵗民願入粟賑飢有裕于衆者聽取㫖補官其餘一切停罷十一月癸丑郊大赦十二月甲午追封吳玠為涪王帝以袁樞所編通鑑紀事賜東宫與陸贄奏議并讀曰治道盡于此矣是歲京西湖北諸州興元府金洋州旱紹興府台婺州水並賑之四年春正月丙寅雨雹丁卯班淳熙厯丙午金有司奏髙麗所進帶乃石似玉者金主曰小國無能辨識誤以為玉耳且人不易物惟德其物若復却之豈禮體耶壬戌金詔海陵時大臣無辜被戮家屬籍沒者並釋為良金葬遼宋被害子孫于廣寧河南舊陵二月乙亥帝視太學命祭酒林光朝講中庸遂視武學學官諸生進秩賜賚有差傅伯夀上言從祀於文宣廟者若當時門弟子或歷代之名儒固無可議武成之廟所從祀者出於開元銓次失之太雜太祖去白起之像太宗黜韓信而升趙充國黜李績而升李晟去取之間所以示臣子之大節也然王翦無異白起而彭越臣節不終亦同韓信王僧辨雖平侯景反連和于齊吳明徹雖取河南然為周所俘不能死節韋孝寬楊素慕容恪長孫嵩慕容紹宗宇文憲王猛斛律光于謹或系出遐荒或屈節僣僞豈足多録若夫尹吉甫之伐玁狁召虎之平淮夷皆有周之名將陳湯之斬單于傅介子之刺樓蘭馮奉世之平莎車班超之定西域皆為漢之雋功在晉則謝安石祖逖在唐則王忠嗣張巡皆闕而不録宜命有司討論尋詔武成王廟升李晟於堂上降李績於李晟之次仍以曹彬從祀三月乙巳以史浩為少保觀文殿大學士醴泉觀使兼侍讀己酉龔茂良吕祖謙等上仁宗玉牒徽宗實録皇帝玉牒祖謙入對上言曰夫治道體統上下內外不相侵奪而後安向者陛下以大臣不勝任而兼行其事大臣亦皆親細務而行有司之事外至監司守令職任率為其上所侵而不能令其下故豪猾玩官府郡縣忽省部掾屬凌長吏賤人輕柄臣平居未見其患一旦有急誰與指而伸縮之耶如曰臣下權任太重懼其不能無私則有給舍以出納焉有臺諫以救正焉有侍從以詢訪焉儻得端方不倚之人分處之自無專恣之慮何必屈至尊以代其勞哉人之關鬲脈絡少有壅滯久則生疾陛下於左右雖不勞操制茍玩而弗慮則聲勢浸長趨附浸多過咎浸積內則懼為陛下所譴而益思壅蔽外則懼為公議所疾而益肆抵排願陛下虛心以求天下之士執要以總萬事之機勿以圖任或誤而謂人多可疑勿以聰明獨髙而謂智足遍察勿詳於小而忘逺大之計勿忽於近而忘壅蔽之萌又言國朝治體有逺過前代者有視前代為未備者夫以寬大忠厚建立規模以禮遜節義成就風俗此所謂逺過前代者也故於俶擾艱危之後駐蹕東南踰五十年無纎毫之虞則根本之深可知矣然文治可觀而武績未振名勝相望而幹略未優故雖昌熾盛大之時此病已見是以元昊之難范韓皆極一時之選而莫能平殄則事功之不競從可知矣臣謂今日治體視前代未備者固當激厲而振起逺過前代者尤當愛護而扶持遷著作郎以疾請祠歸辛亥金詔免河北山東陜西河東西京遼東等十路去年被旱蝗租稅壬子詔李龍翰襲封安南國王夏四月戊寅金主諭宰臣曰郡縣之官雖以罪解一二歲後亦須再用明安穆琨當太祖創業之際皆勤勞有功其世襲之官不宜以小罪奪免甲午給歸正官子孫田屋六月丁丑參知政事龔茂良罷自葉衡免茂良以首參行相事㑹史浩自明州召為醴泉觀使兼侍講茂良求去帝曰朕以經筵召浩卿不須疑既而曽覿欲以文資祿其孫茂良以文武官各隨本色䕃補格繳進覿大怒因茂良入堂俾直省官賈光祖等當道不避街司叱之光祖曰參政能幾時茂良奏臣固不足道所惜者朝廷大體帝諭覿往謝茂良取光祖於臨安府杖之御劄宣問施行太遽茂良待罪帝遣使諭復位户部員外郎謝廓然覿黨也忽賜出身除殿中侍御史中書舍人林光朝繳還詞頭帝怒罷光朝光朝與茂良同里茂良遂引疾求去除知建康帝諭茂良曰朕極知卿不敢忘俟議恢復卿當再來且令內殿奏事乃手疏恢復六事以進帝曰卿五年不說恢復何故今日及此退朝甚怒曰福建子不可信如此廓然因劾之遂責降英州安置父子卒於貶所皆覿所使也覿前雖預事未敢肆至是竄逐大臣士始側目重足矣茂良平生不喜言兵去國之日乃言恢復論者謂其迎合上意希冀復留及朱熹得其疏稿則事雖恢復而其意乃極論不可輕舉深為之歎息己卯以王淮參知政事金主謂宰臣曰朕年老矣恐因一時喜怒處置有所不當卿等即當執奏毋為面從成朕之失癸未升蜀州為崇慶府甲申詔自今宰執朝殿得㫖事須覆奏乃行秋七月辛丑賑襄陽饑民戊申班御史臺彈奉格乙酉罷王雱從祀孔子甲子班淳熙重修敕令格式是月金大雨河決八月辛巳禁耕牛過淮金主謂宰臣曰今之在官者同寮所見事雖當理亦以為非意謂從之則恐人謂政非己出如此者多朕甚惡之今觀大理寺所斷雖制有正條理不能行者别具情見朕惟取其所長夫人能取他人之善者而從之斯可謂善矣又曰今下僚豈無人材但在上者不為汲引惡其材勝已故耳九月丁酉朔日有食之己亥命修築海潮所壞塘岸辛丑金封皇子永德為薛王庚戍歲星熒惑太白聚于尾宋史無見金紀戊午閲蹴踘于選德殿冬十月己巳夏國進百頭帳於金金主詔却之境上其使因邊臣求入乃許之辛巳金主謂宰臣曰今在位不聞薦賢何也昔狄仁傑起自下僚力扶唐祚使既危而安延數百年之永仁傑雖賢非婁師德何以自薦乎癸未金主謂宰臣曰近觀上封章者殊無大利害且古之諫者既忠於國亦以求名今之諫者為利而已如户部尚書曹望之濟南尹梁肅皆上書言事蓋覬覦執政耳其於國事竟何所補達官如此況餘人乎昔海陵南伐太醫使祁宰極諫至戮于市本朝以來一人而已十一月壬戌太白晝見十二月戊辰金以渤海舊俗男女婚娶多不以禮必先攘竊以奔詔禁絶之犯者以姦論壬申金主謂宰執曰朕今年五十有五若踰六十雖欲有為而莫之能矣宜及朕康强凡國家政事之未完與法令之未一者皆修舉之卿等開陳朕不敢怠乙亥大閲是歲福州建寧府雨劒州水並賑之五年春正月辛丑侍御史謝廓然乞戒有司毋以程頥王安石之說取士未幾祕書郎趙彥中復疏言科舉之文成式具在今乃祖性理之說以浮言游詞相髙士之信道自守以六經聖賢為師可矣而别為洛學飾怪驚愚外假誠敬之名內濟虛僞之實士風日弊人才日偷望詔執事使明知聖朝好惡所在以變士風帝從之庚申金免中都河北河東山東河南陜西等路前年被災租稅陳亮自隆興初上中興五論不報退修於家益力學著書嘗圜視錢唐喟然歎曰城可灌爾蓋以地下於西湖也至是亮更名同詣闕上書曰臣惟中國天地之正氣也天命所鍾也人心所㑹也衣冠禮樂所萃也百代帝王之所相承也挈中國衣冠禮樂而寓之偏方雖天命人心猶有所係然豈以是為可久安而無事哉天地之正氣鬱遏而久不騁必將有所發泄而天命人心固非偏方所可久係也夫吳蜀天地之偏氣錢塘又三吳之一隅當唐之衰錢鏐以閭巷之雄起主其地自此不能獨立常朝事中國以為重及我宋受命俶以全家入京師而自獻其土故錢塘終始五代被兵最少而二百年之間人物日以蕃盛遂甲於東南及建炎紹興之間為六飛所駐之地當時論者固已疑其不足以張形勢而事恢復矣秦檜又從而備百司庶府以講禮樂於其中其風俗固已華靡士大夫又從而治園囿臺榭以樂其生於干戈之餘上下晏安而錢塘為樂國矣一隙之地本不足以容萬乘而鎮壓且五十年山川之氣蓋亦發泄而無餘矣故穀粟桑麻絲枲之利歲耗於一歲禽獸魚鱉草木之生日微於一日而上下不以為異也公卿將相大抵多江浙閩蜀之人而人才亦日以凡下場屋之士以十萬數而文墨小異己足以稱雄於其間矣陛下據錢塘已耗之氣用閩浙日衰之士而欲鼓東南習安脆弱之衆北向以爭中原臣是以知其難也荆襄之地在春秋時楚用以虎視齊晉而齊晉不能屈也及戰國之際獨能與秦爭帝其後三百餘年而光武起於南陽同時共事往往多南陽故人又二百餘年遂為三國交據之地諸葛亮由此起輔先主荆楚之士從之如雲而漢氏賴以復存於蜀周瑜魯肅吕蒙陸遜陸抗鄧艾羊祜皆以其地顯名又百餘年而晉氏南渡往往倚荆雍以為强梁竟以此代齊及其氣發泄無餘而隋唐以來遂為偏方下州五代之際髙氏獨常臣事諸國本朝二百年間降為荒落之邦至建炎紹興之際羣盜出沒於其間被禍尤極民食無所從出兵不可由此而進議者或以為憂而不知其勢之足用也其地雖要為偏方然未有偏方之氣五六百年而不發泄者況其東通吳㑹西連巴蜀南極湖湘北控關洛左右伸縮皆足以為進取之機今誠能開墾其地洗濯其人以發泄其氣而用之使足以接關洛之氣則可以爭衡於中國矣是亦形勢消長之常數也又曰今世之儒士自以為得正心誠意之學者皆風痺不知痛癢之人也舉一世安於君父之讎而方低頭拱手以談性命不知何者謂之性命乎陛下接之而不任以事臣於是服陛下之仁今世之才臣自以為得富國强兵之術者皆狂惑以肆叫呼之人也不以暇時講究立國之本末而方揚眉伸氣以論富强不知何者謂之富强乎陛下察之而不敢盡用臣於是服陛下之明陛下厲志復讎足以對天命篤於仁愛足以結民心而又明足以照臨羣臣一偏之論此百代之英主也今乃委任庸人籠絡小儒以遷延大有為之歲月臣不勝憤悱是以忘其賤而獻其愚書奏帝赫然震動欲榜朝堂以勵羣臣用种放故事召令上殿將擢用之左右大臣莫知所為惟曽覿知之將見亮亮恥為覿所知踰垣而逃覿不悅大臣尤惡其直言無諱交沮之乃有都堂審察之命宰相臨以上㫖問所欲言皆落落不少貶又不合待命十日復詣闕上書者再帝欲官之亮笑曰吾欲為社稷開數百年之基寧用以博一官乎亟渡江而歸日落魄醉酒與邑之狂士飲醉中戲為大言言涉犯上一士欲中亮以其事首刑部侍郎何淡嘗為考試官黜亮亮不平語數侵淡淡嗛之以狀聞事下大理笞掠無完膚誣服為不軌時帝已亷知其事奏入帝曰秀才醉後妄言何罪之有劃其牘于地亮遂得免居無何亮家僮殺人被殺者嘗辱亮父其家疑事由亮聞于官囚亮父于州獄臺官論亮情重下大理時丞相王淮知帝欲生亮辛棄疾羅㸃素髙亮才力援之復得不死亮自以豪俠屢遭大獄歸家益厲志讀書所學益博其學自孟子後惟推王通嘗曰研窮義理之精微辨析古今之同異原心於杪忽較理于分寸以積纍為工以涵養為正睟面盎背則於諸儒誠有愧焉至於堂堂之陳正正之旗風雨雲雷交發而並至龍蛇虎豹變現而出沒推倒一世之智勇開拓萬世之心胸自謂差有一日之長亮意蓋譏朱熹吕祖謙輩也二月甲申雨土三月丁未參知政事李彥頴罷壬子以觀文殿大學士史浩為右丞相兼樞密院使帝謂浩曰自葉衡罷虛席以待卿久矣己未以王淮知樞密院事趙雄參知政事資治通鑑後編卷一百二十四
