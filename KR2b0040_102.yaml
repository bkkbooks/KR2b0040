body:
  text: 資治通鑑後編卷一百二刑部尚書徐乾學撰宋紀一百二起昭陽單閼四月盡㫋䝉大荒落十二月凡二年有九月徽宗體神合道駿烈遜功聖文仁德憲慈顯孝皇帝宣和五年夏四月癸巳金使楊璞齎誓書以燕京及涿易檀順景薊六州來歸庚子童貫蔡攸入燕山府燕之金帛子女職官民户為金人席卷而東朝廷捐嵗幣數百萬所得者空城而已或告燕人曰汝之東遷非金人意也南朝留常勝軍利汝田宅給之耳燕人皆怨說尼瑪哈不當與我全燕尼瑪哈因欲止割涿易兩州金主曰海上之盟不可忘也我死汝則為之交燕畢金主於契丹漢兒兩府中擕劉彥宗等出居庸關由雲中天德路西巡留白水濼度夏且聞天祚北走塔坦經營擒之乃遣左企弓等部所掠職官富戶東取榆關平灤路以歸金主既得燕山子女加久駐氣候已熱遂大病而城外營寨日夜為燕之鄉兵劫撓因罵伊都曰汝勸我來此今外寨不安四面皆山大兵若在網羅中如何得歸乃大毁諸州及燕山城壁樓櫓要害皆平之時便有語謂使中國修理二三年間却取之趙良嗣亦嘗私語人曰只可保三年爾時上下皆知莫敢言也壬寅金薩里雅布齎御押燕山地圖至初欲令童貫蔡攸拜受馬擴姚平仲共曉之乃已貫攸厚賂之而還乙巳童貫奏撫定燕城丙午王黼等上表稱賀戊申金使楊璞同盧益趙良嗣等至齎國書并誓書以進庚戌曲赦河北河東燕雲路時山後雲中路地尚未得也而赦乃先及其後頗得武朔蔚三州尋復失之兵端蓋自此始辛亥童貫蔡攸自燕山班師五月己未以收復燕雲賜王黼玉帶進太傅總治三省事鄭居中為太保進宰執官二等童貫落節鉞進封徐豫國公蔡攸為少師趙良嗣為延康殿學士居中自陳無功不拜夏國主乾順遣使請遼主臨其國遼主從之中軍都統蕭迪里等切諌不聽遂渡河次于金蕭軍北遣使冊乾順為夏國皇帝人情惶懼不知所為迪里隂謂耶律元直曰事勢如此億兆離心正我輩效節之秋不早為計奈社稷何乃共劫遼主第二子梁王雅里走西北部三日遂立為帝改元神厯以迪里為樞密使特默格副之雅里性寬大惡誅殺獲亡者笞之而已自歸者即官之金斡里雅布趨天德聞夏人迎護遼主遼主已渡河乃遺書於夏使執送遼主且許割地左企弓等為金部燕人東徙流離道路不勝其苦過平州遂入城言於張㲄曰左企弓不能守燕致吾民如是公今臨巨鎮握強兵盡忠於遼免我遷者非公而誰㲄遂召官屬議皆曰聞天祚兵勢復振出沒漠南公若仗義勤王奉迎天祚以圖興復先責左企弓等叛降之罪而誅之盡歸燕民使復其業而以平州歸宋則宋無不接納平州遂為藩鎮矣即後日金人加兵內用營平之軍外藉宋人之援又何懼焉㲄曰此大事也當審畫以翰林學士李石明智召而問之石以為然遂拘兩府左企弓虞仲文曹義勇康公弼至灤河西岸數其十罪而殺之仍稱保泰三年畫天祚像朝夕朝謁事無大小告而後行止稱遼官秩以榜諭燕人令各安堵如故應田宅為常勝軍所占者悉還之燕人大悅往往南來至京師石改名安弼與三司使高履改名黨者詣燕說王安中曰平州形勝之地張㲄文武全材足以禦金人安燕境幸速招致毋令西迎天祚北合蕭幹也安中深納之令安弼黨赴闕以聞帝以手札付詹度第令羈縻之而度促㲄內附㲄乃遣人持書來請降王黼勸帝納之趙良嗣諌曰國家新與金盟如此必失其歡後不可悔不聽良嗣坐削五階朝廷又聞遷民得歸亟詔安中度加恤録士大夫之可用者復百姓田租三年㲄聞之大喜遂决䇿來納欵焉乙丑詔正位三公立本班帶節鉞若領他職者仍舊班著為令癸酉祭地于方澤六月丙戍張㲄遣人詣安撫司納土金人聞㲄叛遣棟摩將騎二千來討瑴率兵迎拒于營州金人以兵少不交鋒而歸大書州門有今冬復來之語㲄即妄以大捷聞宣撫司乙未詔今後內外宗室並不稱姓戊申領樞密院鄭居中卒以蔡攸領樞密院秋七月戊午以梁師成為少保童貫蔡攸歸自燕山頗失帝意王黼梁師成遂薦談稹為宣撫是日起復稹為河東燕山府路兼河北路宣撫使令駐河東交割金人所許山後之地己未詔童貫依前太師神霄宫使致仕庚午王黼等上尊號曰繼天興道敷文成武睿明皇帝不允八月辛巳朔日當食不見乙未郭藥師大敗蕭幹于峯山燕京既陷幹就奚王府自立為神聖皇帝國號大奚改元天嗣時奚人饑幹出盧龍嶺攻破景州又敗常勝軍張令徽劉舜臣於石門鎮陷薊州冦掠燕城其鋒鋭甚有涉河犯京師之意人情􅍅洶頗有謀棄燕者童貫自京師移文王安中詹度郭藥師等切責之已而安中命藥師擊破其衆乘勝窮追過盧龍嶺殺傷大半從軍之家悉為常勝軍所得招降奚渤海五千餘人生擒阿魯太師獲耶律德光尊號寶檢契丹塗金印等幹遁去尋為其部下巴爾達喀所殺傳首河間府詹度上之辛丑命王安中作復燕雲碑壬寅太白晝見先是金主次鴛鴦濼有疾王烏爾圖驛召其弟諳巴貝勒武奇邁赴行在至是㑹于渾河北率宗室百官上謁戊申金主殂年五十六考異宋史徽宗紀宣和五年五月金主阿固達殂長編亦云遼史天祚紀又竄入明年皆誤也今從金太祖太宗紀九月癸丑喪至上京葬宫城西南寧神殿丙辰武奇邁即皇帝位更名晟改天輔七年為天㑹元年上尊諡曰武元皇帝廟號太祖後改葬睿陵又改葬大房山仍號睿陵辛酉大饗明堂冬十月乙酉雨木氷壬寅罷諸路提舉常平之不職者是月京師地震詔建平州為泰寧軍以張㲄為節度使世襲平州其屬衛甫趙仁彥張鈞張敦固皆擢徽猷閣待制令李安弼齎詔還平州仍以金花箋御筆付㲄弟令面授之遼雅里死蕭迪里等復立耶律穆爾為帝穆爾聖宗孫也尋與迪里為亂兵所殺十一月乙卯以鄭紳為太師癸亥詔國子監刋印御注沖虛至德真經頒之學者從祭酒蔣存誠等奏請也丙寅幸王黼第觀芝帝由便門過梁師成家復來黼第因大醉不能語夜漏上五刻乃開龍德宫復道小門以還內侍十餘人執兵接擁是夜諸班禁從皆集教場備不虞幾至生變翌日猶不御殿殆半日人心始少安祖宗以來臨幸未之有也諸路漕臣坐上供錢物不足貶秩者二十二人丁卯王安中談稹加檢校少傅郭藥師為太尉壬申王黼子弟親屬推恩有差是月金遣斡里雅布督棟摩攻平州㑹張㲄聞朝命將至大喜率官吏郊迎金人諜知之以千騎襲破平州得朝廷所賜詔㫖㲄挺身走欲間道歸京師其弟懷御筆將奔燕山以其母為金人所得復往投之而㲄母及妻已為金人所戮并得瑴弟所懷御筆金人大怒自是歸曲朝廷㲄道燕山郭藥師留之匿姓名寄常勝軍中金人纍檄宣撫司取㲄宣撫司具奏朝廷初不欲發遣金人索之益急王安中取貌類㲄者斬其首與之金人曰非㲄也遂欲以兵攻燕安中言必不發遣恐啓兵端朝廷不得已令安中縊殺之函其首并瑴二子送于金燕降將及常勝軍士皆泣下郭藥師曰金人欲㲄即與若求藥師亦與之乎安中懼因力求罷召為玉清寶籙宫使以蔡靖知燕山府張令徽等由是切齒朝廷而常勝軍亦解體矣十二月乙巳金使高居慶楊意來賀正旦朝廷以山後諸州請於金金主晟新立將許之尼瑪哈自雲中至言於金主曰先帝初圗宋協力攻遼故許以燕地宋人既盟之後請加幣以求山西諸鎮先帝辭其幣而復與之盟曰無匿逋逃無擾邊民今宋數路招納叛亡纍疏姓名索之而不肻遣盟未期年今已如此萬世守約其可望乎且西鄙未寧割付山西諸郡則諸軍失屯據之所將有經略或難持久請勿與之金主遂遣使止以武朔二州來歸是嵗秦鳯旱河北京東淮南饑遣官賑濟六年春正月癸丑遣太常少卿連南夫伴送金使歸國尋兼祭奠弔慰使戊午置書藝所癸亥藏蕭幹首于太社庚午勒停人蔡絛復朝奉郎提舉明道宫癸酉御內東門别次為金主旻成服遼主趨都統瑪格軍金人來攻棄營北遁瑪格被執瑪克實來迎贐馬駝羊又率部人防衛時侍從乏糧數日以衣易羊至烏古迪里部以都㸃檢蕭伊實知北院樞密使事封瑪克實為神于越王二月己亥躬耕籍田丙午詔自今非歷臺閣寺監司郡守開封府曹官者不得為郎官卿監著為令尚書左丞李邦彥以父憂去位遼耶律遙設等十人謀叛伏誅三月己酉朔以錢景臻為少師金遣使詣宣撫司索趙良嗣所許糧二十萬石談稹曰二十萬石不易致良嗣口許豈足慿也遂不與金人大怒及舉兵亦以此為辭閏月辛巳皇后親蠶京師河東陜西地震宫殿門皆搖動有聲河東陜西尤甚蘭州諸山草木悉沒入地而山下麥苗皆在山上詔右司郎中黃潜善按視潛善不以實聞帝意乃安遷潛善為户部侍郎夏四月癸丑賜禮部奏名進士及第出身八百五人丁巳起復李邦彥為尚書左丞五月癸卯金使來告嗣位自得燕地悉出河北河東山東之力以往饋官軍率十數石致一石才一年三路皆困六月壬子詔京西淮浙江湖四川閩廣措置調夫各數十萬並納免夫錢每夫三十貫委漕臣限督之違者從軍法用王黼言也尋又詔宗室戚里宰執之家及宫觀寺院一例均敷於是遍率天下所得才二千萬緡而結怨四海矣秋七月戊子遣著作佐郎許亢宗等如金賀嗣位丁酉詔應係御筆斷罪不許詣尚書省陳訴改正王黼言頃得方士璣衡之書足以察七政甲辰詔置璣衡所以黼及梁師成領之初耶律大石自金歸遼遼主責之曰我在汝何敢立淳大石對曰陛下以全國之勢不能一拒敵棄國逺遁使黎民塗炭即立十淳皆太祖子孫豈不勝乞命於他人耶遼主無以答賜酒食而赦之遼主既得大石及居烏迪里部又得瑪克實之兵自謂有天助再謀出兵收復燕雲大石諌曰向以全師不謀戰備使舉國皆為金有國勢至此而方求戰非計也當養兵待時而動不可輕舉遼主不從大石遂殺知北院樞密事蕭伊實及博勒果自立為王率鐵騎三百宵遁遣校書郎衛膚敏如金賀生辰膚敏言彼生辰後天寧節五日今未聞彼遣使而吾反先之於威重已闕萬一彼使不至為朝廷羞請至燕而候之脫若不來則以幣置諸境上帝以為然洎至燕山金使果不來遂置幣而返夏人舉兵侵武朔二州地界宣撫使談稹遣李嗣本禦之兵數交夏人未即退聽金人怨朝廷納張瑴又以稹不給糧遂攻蔚州殺守臣陳詡陷飛狐靈邱兩縣逐應州臣蘇京等絶山後交割意朝廷咎稹措置乖方童貫蔡攸又共排稹八月乙卯責授稹順昌軍節度副使致仕以童貫領樞密院代其任時遼天祚在夾山帝欲誘致之始遣一畨僧齎御筆絹書通意及天祚許允遂易書為詔許待以皇弟之禮位燕越二王上築第千間女樂三百人天祚大喜貫是行出太原名為代稹交割山後地土實以密約天祚來降自往迎之也壬戌以復燕雲赦天下九月乙亥以白時中為特進太宰兼門下侍郎李邦彥為少宰兼中書侍郎辛巳大饗明堂丁亥以趙野為尚書左丞翰林學士承㫖宇文粹中為尚書右丞開封府尹蔡懋同知樞密院庚子遣校書郎賀允中等如金賀正旦庚寅金使布密古等來致遺留物冬十月庚午金使來賀正旦御筆道官可自大夫以上其帶職人並令封至朝官許䕃贖私罪為官户詔有收藏習用蘇黃之文者並令焚毁犯者以大不恭論癸酉詔內外官並以三年為任治績著聞者再任永為式冬十一月丙子太傅王黼致仕黼位元宰每陪曲宴親為俳優鄙賤之役以獻笑取悅太子聞而惡之黼以鄆王楷有寵隂為畫奪宗之計未成㑹帝幸其第觀芝而黼第與梁師成連牆穿便門往來帝始悟其與師成交結狀還宫眷待頓衰李邦彥素與黼不協隂結蔡攸共毁之㑹中丞何㮚論黼奸邪專橫十五事遂命致仕其黨胡松年等並免官太白晝見自蔡京以豐亨豫大之說勸帝窮極侈靡久而帑藏空竭言利之臣殆析秋毫宣和以來王黼專主應奉括剝橫賦以羡為功所入雖多國用日匱至是宇文粹中上言祖宗之時國計所仰皆有實數量入為出沛然有餘近年諸局務應奉司妄耗百出若非痛行裁減慮智者無以善後帝然其言丙戌詔蔡攸就尚書省置講議財利司除茶法已有定制餘並講究條上攸請內侍職掌事干宫禁應裁省者委童貫取㫖由是不急之物無名之費悉議裁省壬辰詔監司擇縣令有治績者保奏召赴都堂審察録用毋過三人童貫遣馬擴知保州辛興宗使尼瑪哈軍擴等至雲中府㑹尼瑪哈已歸國留羅索權元師遣人來諭庭參擴辭以見人臣無此儀羅索曰談宣撫時使人庭參我擴曰談稹以凡庸不知故事為朝廷所黜數往返辨論最後羅索遣高慶裔來曰二觀察既執舊儀此亦暫權元帥不敢輒見所言交山後事以國相詣閣不敢專兼兩朝誓書各不收納叛亡貴朝先失約雖山後亦難以便交擴曰職官富户逃歸燕京乃張㲄之罪本朝已斬首函送其餘民户多隱山谷間已見者相繼遣前未見者方行根捕如貴朝言山後别無經略及交蔚州復縱軍馬攻取若大國每如斯則兩朝和好何時可成慶裔曰山後疆土已許諒不食言但貴朝亦須常敦信誓前索職官民户繼踵發來事無不遂也即以牒遣使人回貫詢擴入境所見擴曰金人訓習漢兒鄉兵增飛狐靈邱之戌數指言張㲄邀索職官民户實有包藏願太師速營邊備貫不能用十二月甲辰朔詔太師致仕蔡京領講議司聽就私第裁處仍免僉書毋致勤勞詔百官遵行元豐法制丁未詔內外侍從以上各舉所知二人癸亥蔡京落致仕領三省事五日一赴朝請至都堂治事王黼既罷白時中李邦彥作相京黨鬨然以為宰相望輕朱勔因力勸用京帝從之京至是凡四當國年已八十目盲不能書字足蹇不能拜跪凡京所判皆季子絛為之仍代京禁中奏事於是肆為姦利賞罰無章出入紛紜絛妻兄韓梠者驟用為户部侍郎密與謀議貶逐朝士殆無虛日絛每造朝侍從以下皆迎揖呫囁耳語堂吏數十人抱文書以從遣使四出誅求採訪喜者令薦之否則劾之中外搢紳無不側目先是王黼領應奉司總四方貢獻之物以示權寵絛復效之創置宣和庫式貢司中分諸庫如泉貨幣帛服御玉食器用等皆其名也上自金玉下及蔬茹無不籠取元豐大觀庫及𣙜貨務見在錢物皆拘管封椿為天子私財時中邦彥等奉行文書而已此據長編所載朱勝非閒居録修入時河北山東轉糧以給燕山民力疲困重以鹽額科斂加之連嵗凶荒於是饑兵並起為盜山東有張仙者衆至十萬又有張迪者衆至五萬河北有高託山者號三十萬自餘二三萬者不可勝數命內侍梁方平討之都城中酒保朱氏女忽生髭長六七寸踈秀甚美宛然一男子特詔為道士又有賣青果男子孕而誕子七年春正月癸酉朔詔赦兩河京西流民為盜者仍給復一年癸巳詔罷諸路提舉常平官屬有罪當黜者以名聞仍令三省修已廢之法遣禮部員外郎邵溥送伴金使党項舒和掄遣人請遼主臨其地遼主遂趨天德過沙漠金兵忽至遼主徒步出走近侍進珠帽却之乘張仁貴馬得脫至天德遇雪無禦寒具北護衛太保蘇哲以貂裘帽進途次絶糧蘇哲進麨棗欲憩蘇哲即跪坐倚之假寐蘇哲輩惟齧冰雪以濟饑過天德至夜將宿田家紿曰偵騎其家知之乃叩馬首跪而大慟潜宿其家居數日嘉其忠遙授以節度使遂趨党項以舒和掄為西南面招討使總知軍事二月甲辰復置鑄錢監詔御史察贓吏己酉雨木冰庚戌詔京師運米五十萬斛至燕山令工部侍郎孟揆親往措置壬申京東轉運副使李孝昌言招安羣盜張萬仙等五萬餘人詔補官犒賞有差是月遼主延禧行至應州新城東六十里為金將羅索所獲遼亡天祚之在夾山也朝廷數遣使誘之往來皆由雲中金人盡知其事顧常以力不能入夾山為恨唯恐其不出出必得之而天祚畏尼雅滿據雲中以扼其前久不敢出一日忽報尼雅滿歸國羅索代為元帥天祚用是坦然遂領所得契丹韃靼等衆并携其后妃二子及官屬南來如履無人之境及才過雲中則羅索忽以大兵遮其歸路一擊而天祚之衆大潰勢不得還且畏中國不可仗乃亟走舒和掄帳中金人既破舒和掄以未得天祚遣使謂童貫曰海上元約不得存天祚彼此得即殺之而中國違約招徠今又藏匿不出我必欲得天祚也貫辭以無有又遣使迫促語大不遜貫不得已遣諸將出境上搜之曰若遇異色目人不問便殺以授使人㑹金人自得天祚事乃息史臣曰遼起朔野兵甲之盛鼓行塞外席卷河朔樹晉楨漢何其壯歟太祖太宗乘百戰之勢輯新造之邦英謀睿略可謂逺矣雖以世宗中才穆宗殘暴連遘弒逆而神器不搖蓋由祖宗威令猶足以震疊其國人也聖宗以來內修政事外拓疆宇申固鄰好四境乂安降及天祚既丁末運又觖人望崇信姦回自椓國本羣下離心金兵一集內難先作廢立之謀叛亡之迹相繼蜂起馴至土崩良可哀也初耶律達實北行三日過黑水見白達達詳衮崇烏魯崇烏魯獻馬四百駝二十羊若干西至可敦城駐北庭都護府㑹西鄙七州及十八部王諭之曰我祖宗艱難創業歷世九主歷年二百金以臣屬逼我國家殘我黎庶屠翦我州邑使我天祚皇帝䝉塵于外日夜痛心疾首我今仗義而西翦我仇敵復我疆宇惟爾衆亦有思共救君父濟生民之難者乎遂得精兵萬餘於是置官吏立排甲具器仗以青牛白馬祭天地祖宗整旅而西先遣書回鶻王必勒哈曰我與爾國非一日之好今我將西至大食假道爾國其勿致疑必勒哈得書即迎至邸大宴三日臨行獻馬駝羊願質子孫為附庸送至境外所過敵者勝之降者安之兵行萬里歸者數國獲財畜不可勝計軍勢曰盛至塔什干西域諸國舉兵十萬號呼拉沙來拒戰兩軍相望二里許諭將士曰彼軍雖多而無謀攻之則首尾不救我師必勝乃遣蕭額哩埒耶律松山等將兵攻其右蕭哈拉布耶律穆蘇等將兵攻其左自以衆攻其中三軍俱進呼拉沙大敗僵尸數十里駐軍塔什干凡九十日回回國王來降貢方物又西至奇爾愛雅文武百官冊立達實為帝以是月五日即位改元延慶號噶爾罕復上漢尊號曰天祐皇帝世謂之西遼既而追諡其祖曰嗣元皇帝祖母曰宣義皇后冊元妃蕭氏為昭德皇后三月癸酉朔雨電甲申知海州錢伯言奏招降山東冦賈進等十萬人詔補官有差先是童貫嘗問馬擴常勝軍且為患欲消之如何擴曰誠知必爾然今女真未敢肆而知有所忌者以有此軍也若遽消之則不特金人窺我兼此軍必變是自生一秦莫若且撫而用之貫曰其術安在擴曰今藥師之衆止三萬餘人多馬軍武勇太師誠能於陜西河東河北選精鋭馬步十萬分之為三擇智勇如藥師者三人統之一駐燕山與藥師對一駐廣信軍或中山府一駐雄州或河間府犬牙相制使藥師之衆進有所依退有所憚則金人雖肆豈能遽前貫曰善第十萬人未易得我當徐思之是月辛丑貫自太原真定瀛莫入燕山犒常勝軍奏請河北置四總管中山辛興宗真定王元河中楊惟忠大名王育令招逃卒遊手人為軍從之蓋用擴言也夏四月丙辰降德音于京東河北路庚申蔡京依前太師魯國公致仕蔡絛既擅權用事其兄攸愈嫉之白時中李邦彥亦惡絛乃與攸發絛奸私事帝怒詔安置韓梠於黃州罷絛侍讀提舉明道宫尋又毁絛賜出身敕時中等欲因以撼京而京猶未有去志帝乃命童貫與攸同往取謝事表京置酒飲貫攸酒方行京泣曰上何不容京數年當有相讒譛者貫曰不知也京又曰京衰老宜去而不忍遽乞身以上恩未報此心二公所知也時左右聞京并呼攸為公皆竊笑蔡攸同往取表據曲洧舊聞修入京不得已以章授貫帝命詞臣代為作三表請去乃降制從之復州縣免行錢戊辰詔行元豐官制復尚書令之名虛而勿授三公但為階官毋領三省事五月丁亥詔諸路帥臣舉將校有才略者監司如守令有政績者嵗各三人乙未遣奉議郎舒宸中如金賀生辰尋改命校書郎衛膚敏六月辛丑朔詔宗室復著姓帝援神宗遺訓能復全燕之境者胙土錫以王爵丙午封童貫為廣陽郡王加蔡攸太保戊申詔臣僚輒與內侍來往者論罪辛亥慮囚癸亥詔吏職雜流出身人毋得陳請改換乙丑罷减六尚嵗貢物是月寶文閣待制劉安世卒安世少從學於司馬光平居坐不傾倚書不草率不好聲色貨利忠孝正直皆取則於光除諫官在職纍年正色立朝其面折廷諍或逢盛怒則執簡却立俟威少霽復前抗辭旁列者見之蓄縮悚汗目之曰殿上虎年既老羣賢凋喪略盡巋然獨存以是名望益重梁師成用事心服其賢求得小吏吳默常趨走前後者使持書啖以即大用默因勸為子孫計安世笑謝曰吾若為子孫計不至是矣且吾廢斥幾三十年未嘗有一㸃墨與權貴吾欲為元祐全人見司馬光于地下耳還其書不答蘇軾嘗評元祐人物曰器之真鐵漢器之安世字也秋七月庚午朔詔士庶毋以天王君聖為名字及以壬戌日輔臣焚香是月熙河蘭州河東地震熙河有裂數十丈者蘭州尤甚倉庫皆沒河東義勝軍叛八月癸卯金西南北路都統鄂囉以遼主延禧至來流河甲辰告于太祖廟丙午見金主遂降封為海濱王以蕭穆爾之忠甚加禮遇九月壬辰金使李孝和等以天祚成擒來告慶詔宇文虛中高世則館之其實金將舉兵先使覘我也時河東奏尼瑪哈至雲中頗經營南冦詔童貫再行宣撫貫既受詔未即行㑹張孝純奏金人遣小使至太原欲見貫議交割雲中地帝頗信之詔趣貫行無留乙未詔吉州安置聶山復朝散郎乘驛赴闕時金人欲犯中原其謀已深懼我為備且揣知我必欲雲中故多為好辭以紿我然諜報已詳於是預謀雲中守蔡攸乃薦山遂召之是月有狐升御榻而坐又有都城外鬻菜夫至宣德門下忽若迷罔釋荷擔向門㦸手且詈云太祖皇帝神宗皇帝使我來道尚宜速改也邏卒捕之下開封嶽一夕方省初不知向者所為乃於獄中盡之清化縣𣙜鹽埸申燕山府言金人擁大兵前來劫掠居民焚毁廬舍時宣撫使蔡靖與轉運使吕頥浩李與權等修葺城隍團結人兵以為守禦之備使銀牌馬奏朝廷兼關合屬去處而大臣謂郊禮在近匿不以聞恐礙推恩奏薦事畢措置未晚但以大事委邊臣未嘗留意廟謀也冬十月己亥賜金告慶使李孝和等宴初張虛白嘗醉枕帝膝而臥每酒後盡言無所諱帝輒優容之曰張胡汝醉也至是宴金使罷召虛白入語其事虛白曰天祚臥在海上築宫以待陛下久矣左右皆驚帝亦不怒徐曰張胡汝又醉也後幸青城始悟其言此據曲洧舊聞辛亥賜曾布諡曰文肅戊午罷京畿和糴十一月乙亥遣使如金回慶童貫至太原遣馬擴辛興宗復詣雲中使尼瑪哈軍諭以得㫖且交蔚應飛狐靈邱餘悉還金仍覘其國有無南侵意擴等至軍前尼瑪哈嚴兵以待趣擴等庭參如見金主禮禮畢首議山後事尼瑪哈曰先帝與趙皇交好各立誓書萬世無毁不謂貴朝違約隂納張瑴收燕京逃去官民本朝屢牒追還第以虛文見紿今當略辨是非擴曰本朝緣談稹昧大計輕從張瑴之請上深悔之願國相存舊好不以前事置胸中乞且交蔚應飛狐靈邱之地尼瑪哈笑曰汝尚欲此兩州兩縣耶山前山後皆我家地復何論汝家州縣削數城來可贖罪也汝輩可即辭吾自遣人至宣撫司矣金人自擒天祚之後雖為劉彥宗伊都輩所怵然意尚猶豫㑹隆德府義勝軍二千人叛降于金具言中國虛實又易州常勝軍首領韓民義怨守臣辛綜率五百餘人見尼瑪哈曰常勝軍惟郭藥師有報國心如張令徽劉舜仁之徒以張瑴故皆觖望由是彥宗伊都輩力勸金人言南朝可圖仍不必用衆因糧就兵可也故尼瑪哈决意入冦而有是言翌日館中供具良厚薩里穆爾笑謂馬擴曰待使人止此回矣丙戌祀圜丘赦天下庚寅以保靜軍節度使种師道為河東河北路制置使十二月戊戌金人陷檀州己亥馬擴等自雲中回至太原以尼瑪哈所言告童貫驚曰金人初立國邊頭能有幾許兵馬遽敢作如此事耶擴曰金人深憾本朝結納張㲄又為契丹亡國之臣所激必謀報復擴固嘗關白獨未蒙信聽耳今猶可速作隄防然貫先已隂懷遁歸意矣金人陷薊州朝廷以故事遣吏部員外郎傅察迎金賀正旦使于玉田縣時金已渝盟或勸之毋遽行察曰受使以出聞難而止若君命何遂行遇斡里雅布促之使拜白創如林或捽之伏地衣袂顛倒愈植立不顧曰我有死而已膝不可屈也遂殺之察堯俞從孫第進士蔡京當國遣子倏往見將妻以女拒弗答在京師故人鼎貴罕至其門間一見寒溫談笑而已及倉卒殉義將官武漢英識其尸焚之裹其骨命虎翼卒沙立負以歸立至涿州金人得而繫諸土室凡兩月伺守者怠毁垣出歸以骨付其家壬寅金使王介儒薩里穆爾至太原出所齎書說張㲄渝盟諸事其語倨甚童貫厚禮之曰如此大事何不素告我薩里穆爾曰軍已興何用告為國相軍自河東路入太子軍自燕京路入不戮一人止𫝊檄而定耳馬擴曰兵凶器天道厭之貴朝滅契丹亦藉本朝之力今一旦渝盟舉兵相向豈不顧南朝積纍之國若稍飭邉備安能遽敵也薩里穆爾曰國家若以貴朝可憚則不長驅矣移牒且來公必見之莫若遣童大王速割河東河北以大河為界存宋朝宗社乃至誠報國也貫聞之憂悶不知所為即與參謀宇文虛中等謀赴闕禀議知太原府張孝純止之曰金人渝盟大王當㑹諸路將士竭力支吾今大王去人心必搖是棄河東與金也河東既失河北豈可保耶願少留共圗報國兼太原地險城堅人亦習戰未必金便能克也貫曰貫受命宣撫非守土地必欲留貫置帥臣何為乙巳遂逃歸京師孝純歎曰平生童太師作幾許威望及臨事乃蓄縮畏懾奉頭鼠竄何面目見天子乎初郭藥師與詹度同職自以節鉞欲居度上度以御筆所書有序藥師不從常勝軍士橫暴度不能制朝廷慮其交惡命蔡靖代度靖至坦懷待之藥師亦重靖稍為抑損而知燕山府王安中但諂事之朝廷亦曲徇其意所請無不從於是良械精甲藥師令其部曲持以貿易於他道為竒巧之物以奉權貴宦侍譽言日聞於帝遂專制一路增募兵號三十萬而不改契丹服飾朝論頗以為疑慮進拜太尉召之入朝藥師辭不至帝令童貫行邊隂察其去就欲挾之偕來貫至藥師迎于易州再拜帳下貫避之曰汝今為太尉位視二府與我等耳此禮何為藥師曰太師父也藥師唯拜我父焉知其他貫釋然遂邀貫視師至于迥野略無人迹藥師下馬當貫前掉旗一揮俄頃四山鐵騎耀日莫測其數貫衆皆失色歸為帝言藥師必能抗虜蔡攸亦從中力主之謂其可倚故內地不復防制屢有告變及得其通金國書朝廷輒不省詹度亦言藥師瞻視非常趣向懷異始詔遣官究實而金兵已南下斡里雅布至三河靖遣藥師及張之徽劉舜仁帥師四萬五千迎戰于白河敗績而還斡里雅布至燕山藥師率軍郊迎之執靖及都轉運使吕頥浩副使李與權以降於是燕山府所屬州縣皆為金有斡里雅布既得藥師益知中國虛實因以為鄉導懸軍深入矣初宣撫司招燕雲之民置之內地如義勝軍等皆山後漢兒也實勇悍可用其在河東約十萬餘人官給錢米雖諸司不許支用者亦聽之久之倉廪不足以饑而怒官軍又輒罵辱其心益二俟釁且發至是金人南犯朔武之境朔州守將孫翊者勇而忠出與之戰戰未决漢兒開門獻于金至武州漢兒亦為內應遂失朔武長驅至代州守將李嗣本率兵拒守漢兒又擒嗣本以降遂陷代州及至欣州州守賀權開門張樂以迓之尼瑪哈大喜下令兵不入城己酉知中山府詹度奏金人分道入冦是日連三奏至京師朝廷失色辛亥金斡里雅布引兵向闕令所過州縣毋得擅行誅戮乙卯斡里雅布攻保州安肅軍不克丁巳皇太子除開封牧修蕃衍北宅今諸王子分居十位戊午金人圍中山府詹度禦之是月皇太子入朝賜排方玉帶排方玉帶非臣下所當服也帝時已有內禪意矣己未下詔罪已其略曰言路壅蔽導諛日聞恩幸持權貪叨得志搢紳賢能陷於黨籍政事興廢拘於紀年賦斂竭生民之財戍役困軍伍之力多作無益侈靡成風利源酤𣙜已盡而謀利者尚肆誅求諸軍衣糧不時而冗食者坐享富貴灾異謫見而朕不悟衆庶怨懟而朕不知追惟已愆悔之何及詔宇文虛中所草也又令中外直言極諌郡邑率師勤王募草澤異才有能出竒計及使疆外者諸局及西城所見管錢物並付有司其拘收到元係百姓地土並給還舊佃人减掖庭用度從官以上月廪罷道官并宫觀撥賜田土及大晟府教樂所行幸局採石所凡釐革弊端數十事詔草既進帝覽之曰一一可便施行今日不吝改過虛中再拜泣下同列尚有猶豫者初童貫得金茹越寨牒及開拆乃檄文其言大不遜貫不敢奏至是詔草數改易未欲下也李邦彥謂不若進此以激聖心從之帝果涕下無語但曰休休內禪之意遂决遣通直郎李鄴使金諭以將內禪且求和初童貫既歸自太原金人又遣兩使來大臣不敢引見帝遂創小使之禮令大臣見之於尚書省㕔事才就位遂大不遜曰皇帝已命國相與太子郎君弔民伐罪大軍兩路俱入白時中李邦彥與蔡攸等俱失色不敢答徐問如何可告緩師者使人因大言曰不過割地稱臣耳大臣又俱失色不敢答遂議厚其禮而遣之攸弟絛說攸曰此覘我耳宜以行人失辭而斬其使使彼罔測不然且囚之不可使知吾情實攸不聽蓋與執政議恐激其兵之速也鄴奉使丐金三萬兩而朝廷頗難之遂出祖宗內帑金甕二各五千兩命書藝局銷鎔為金字牌子以授鄴先是有㫖幸淮浙詔集從臣赴都堂問計給事中直學士院吳敏入對于玉華閣下曰願請間帝顧羣臣少却立敏曰金人渝盟犯順陛下何以待之帝蹙然曰奈何時東幸計已定詔除戶部尚書李棁守建康敏率給舍詣都堂曰朝廷便為棄京師計何理也此命果行雖死不奉詔棁遂罷行及太子除開封牧帝去意益急敏於是奏曰聞陛下巡幸之計已决有之乎帝未應敏曰以臣計之今京師聞金大入人情震動有欲出奔者有欲守者有欲因而反者以三種人共守一國國必破帝曰然奈何敏曰陛下定計巡幸萬一守者不固則行者必不達帝曰正憂此敏曰陛下使守者威福足以專用其人則守必固守固則行者達矣帝稍開納敏曰陛下能定計事當不出三日過三日守者勢未定威福未行敵至無益也時金已越中山而南計程十日可至畿甸故敏以三日為期帝嘉許敏遂以劄子薦太常少卿李綱曰綱明雋剛正忠義許國自言有竒計長䇿願得召見蓋綱嘗過敏家為敏言上宜傳位如天寶故事與敏意合故薦之帝令綱來曰候對于文字外庫先是綱上禦戎五䇿其一曰正己以收人心聽言以收士用蓄財榖以足軍儲審號令以尊國勢施惠澤以弭民怨因謂敏曰敵勢猖獗非傳位太子不足以招徠天下豪傑敏曰監國可乎綱曰肅宗建號之議不出於明皇後世惜之主上聰明仁恕公言萬一得行將見金人悔禍宗社底寧天下受其賜翼日復刺臂血上疏請之帝乃除敏門下侍郎輔太子謂蔡攸曰我平日性剛不意金人敢爾因握攸手忽氣塞不省墜御牀下宰執亟呼左右扶舉僅得就宣和殿之東閣羣臣共議一再進湯藥俄少蘇因舉臂索紙筆書曰皇太子桓可即皇帝位豫以教主道君退處龍德宫可呼吳敏來作詔敏承命以詔草進帝左書其尾曰依此甚慰懷以宇文虛中為保和殿大學士河北東路宣諭使虛中初為童貫參議官以廟謨失䇿主帥非人將有納侮自焚之禍上書極言王黼大怒又纍建防邊䇿議皆不報及金兵南下虛中隨貫還朝勸帝下罪已之詔以感動人心至是詔熙河經略使姚古秦鳯經略使种師道令以本路兵㑹鄭洛外援河陽內衛京城遂命虛中宣諭使護其軍虛中以檄召古師道令直赴汴京應援庚申下詔內禪皇太子即位于福寧殿辛酉始御崇政殿太宰白時中率百官入賀日有五色暈挾赤黃珥又有重日相蕩摩久之乃隱尊帝為教主道君皇帝是日金人犯慶源府壬戌大赦天下常赦所不原者咸除之百官進官一等賞諸軍有差翰林學士王孝迪實草赦文而不著上自東宫傳位之意四方多以為疑士論非之立妃朱氏為皇后以耿南仲僉書樞密院事南仲帝東宫舊僚也癸亥詔遣何灌將兵二萬同梁方平守濬州河橋以金兵漸逼故也軍士行者往往上馬輒以兩手捉鞍不能施放人皆笑之甲子太學生陳東等伏闕上書乞誅蔡京王黼童貫梁師成李彥朱勔六賊大略言今日之事蔡京壞亂於前梁師成隂謀於內李彥結怨於西北朱勔結怨於東南王黼童貫又從而結怨於二邊敗祖宗之盟失中國之信創開邊隙使天下危如絲髮此六賊者異名同罪伏願陛下擒此六賊肆諸市朝傳首四方以謝天下是月金斡里雅布陷信德府尼瑪哈圍太原府詔京東淮西募兵入衛燕山都監武漢英從斡里雅布入冦見掠得中國人皆不殺行將至真定漢英說之曰某猶不知大國用兵之意况中國之人乎是宜其不降今睹所擒獲皆不殺人安得户曉謂如某等使得諭之則河北堅城可不戰而下也斡里雅布喜乃多出文榜命漢英出寨俾誘諭諸部漢英遂徑走闕下具以敵情告朝廷曰金人之謀深矣謂中國獨西兵可用耳今以尼雅滿一軍下太原取洛陽要絶西兵援路且防天子幸蜀斡里雅布一軍下燕山真定直掩東都二軍相㑹而後逞其不遜未知何以禦之時方內禪而漢英適至大臣憤眊益猶豫戰避之議皆未决丙寅上道君皇帝尊號曰教主道君太上皇帝居龍德宫皇后曰道君太上皇帝后居擷景西園上皇將出居龍德宰執率百官起居皆慟哭上皇亦出涕因諭羣臣曰內侍皆來言此舉錯浮議可畏吳敏曰言錯者誰願斬一人以厲其餘上皇曰衆雜至不及記也又曰皇帝之上豈容更有他稱乃有欲稱嗣君者仍密諭李邦彥曰師成也乃以邦彥為龍德宫使蔡攸副之詔改明年元曰靖康太常少卿李綱上封事言陛下履位之初當上應天心下順人欲攘除外患使中國之勢尊誅鋤內姦使君子之道長以副太上皇帝付託之意乙丑召對于延和殿翌日除兵部侍郎綱初得覲帝迎謂曰卿頃論水災章疏朕在東宫見之至今猶能誦憶綱叙謝訖因奏曰今金人先聲雖若可畏然聞有內禪之意事勢必消縮請和厚有所邀求於朝廷臣竊料之大槩有五欲稱尊號一也欲得歸朝人二也欲增嵗幣三也欲求犒師之物四也欲割疆土五也欲稱尊號如契丹故事當法以大事小之意不足惜欲得歸朝人當盡以與之以示大信不足惜欲增嵗幣遂告以舊約全歸燕雲故嵗幣視遼增兩倍今既背約自取之則嵗幣當减國家敦示舊好不校貨財姑如元數可也欲求犒師之物當量力以與之至於疆土則祖宗之地子孫當以死守不得以尺寸與人願陛下留神於此數者執之至堅不為浮議所搖可無後艱也并陳所以禦敵固守之䇿帝皆嘉納之遂有此命史臣曰宋中葉之禍章蔡首惡趙良嗣厲階然哲宗之崩徽宗未立惇謂其輕佻不可以君天下遼天祚之亡張覺舉平州來歸良嗣以為納之失信於金必啓外侮使二人之計行宋不立徽宗不納張覺金雖強何釁以伐宋哉以是知事變之來雖小人亦能知之而君子有所不能制也跡徽宗失國之由非若晉惠之愚孫皓之暴亦非有曹馬之篡奪特恃其私智小慧用心一偏踈斥正士狎近姦諛於是蔡京以狷薄巧佞之資濟其驕奢淫佚之志溺信虛無崇飾遊觀困竭民力君臣逸豫相為誕謾怠棄國政日行無稽及童貫用事又佳兵勤逺稔禍速亂他日國破身辱遂與石晉重貴同科豈得諉諸數哉昔西周新造之邦召公猶告武王以不作無益害有益不貴異物賤用物况宣政之為宋承熙豐紹聖椓喪之餘而徽宗又躬蹈二帝之弊乎自古人君玩物而喪志縱欲而敗度解不亡者徽宗甚焉故特著以為戒資治通鑑後編卷一百二
