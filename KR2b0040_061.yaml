body:
  text: 資治通鑑後編卷六十一刑部尚書徐乾學撰宋紀六十一起重光單閼八月盡玄黓執徐八月凡一年有一月仁宗體天法道極功全德神文聖武睿哲明孝皇帝皇祐三年八月辛巳特贈給事中孔道輔為工部侍郎時龍圖閣直學士王素入對語及道輔帝思其忠故有是命癸未知定州韓琦加觀文殿學士再任初明鎬引諸州兵平恩州獨定兵邀賞賚出怨語幾欲譟城下琦素聞其事以為不治且亂及至即用軍制勒習察其尤無良者捽首斬軍門外士死攻戰則賻賞其家籍其孤兒使繼衣廩威信並行又效古兵法作方圓鋭三陳指授偏將日月訓習之由是定兵精徑冠河朔京師發龍猛卒戍保州在道竊取人衣屨或飯訖不與人直至定琦悉留不遣曰保州極塞嘗有叛者豈可雜以驕兵戍之易素教者數百人以往而所留卒未踰月亦皆就律不敢復犯法嵗大歉為賑之活飢人數百萬詔書褒美鄰道視其政以為法由是中山屹然為雄鎮聲動契丹丙戌遣使安撫京東淮南兩浙荆湖江南飢民辛卯以張堯佐為宣徽南院使判河陽中丞王舉正言此授非當有損聖德不報乙未以翰林學士曾公亮為契丹太后生辰使知制誥王洙副之至鞾淀契丹使劉六符來伴宴言耶律防善畫向持禮南朝寫聖容以歸欲持至館中王洙曰此非瞻拜之地也六符言恐未得其真欲遣防再往傳繪洙力拒之御史中丞王舉正言陛下不納臣盡忠愛君之請必行堯佐濫賞竊位之典乞即黜臣以誡不識忌諱愚直之人不報知諌院包拯陳旭吳奎相繼言堯佐制命復下物議騰沸望檢會臣等前後奏劄必賜施行庚子詔自今張堯佐别有遷改檢會此劄子進呈執奏仍詔除宣徽使自今不得過二員乙巳馮道曽孫舜卿上道官誥二十通乞録用帝謂輔臣曰道相四朝而偷生茍祿無可旌之節所上官誥其給還之是月汴河絶流九月賜李繼隆神道碑額曰顯功乙卯武寧節度使兼侍中夏竦卒贈太師中書令賜諡文獻知制誥王洙當草制封還其目曰臣下不當與僖祖同諡遂改曰文正同知禮院司馬光言諡之美者極於文正竦何人乃得此諡判考功劉敞言諡者有司之事也竦姦邪而陛下諡之以正不應法光疏再上敞疏三上詔為更諡曰文莊竦以文學起家有名一時朝廷大典策屢以屬之又多識古文竒字至夜以指畫膚其為郡有治績喜作條教於閭里立保伍之法盜賊不敢發然人苦煩擾治軍尤嚴敢誅殺而疾病死喪拊循甚至嘗有龍騎卒戍邊羣聚剽劫州郡莫能止或密以告竦竦時在關中俟其至召詰之誅斬殆盡軍中大震其威略多類此然性貪數商販部中在并州使其僕貿易為所侵盜至杖殺之積家財纍巨萬自奉尤侈畜聲伎甚衆所在隂間僚屬使相猜阻以鈎致其事遇家人亦然庚申賜國子博士梅堯臣同進士出身仍改太常博士堯臣詢從子工於詩大臣屢薦堯臣宜在館閣召試學士院而有是命甲子為夏竦成服於苑中竦初以疾求還京師或言於上曰竦求還京師圗大用耳稱疾詐也竦既卒帝臨奠命內侍去竦面幕視之見竦顔色枯悴謂左右曰竦枯悴如此疾豈詐乎丙子改太子太師王溥諡文獻為文康司空致仕章得象諡文憲為文簡以知制誥王洙言得象諡同周公溥同僖祖故也有欲改溥諡為文忠者天章閣待制兼侍讀張揆曰溥周宰相國亡不能死安得為忠乃諡為文康丁丑詔邇英閣講讀官當講讀者立侍敷對餘皆賜坐侍於閣中天聖以前講讀官皆坐侍自景祐以來皆立侍至是帝屢面諭以經史義旨須詳悉詢説因有是詔遂為永制教坊官王世昌自陳年勞乞監永濟倉門帝曰世昌本亦士人以無行檢遂充此職倉門乃國家糧儲出入之所豈可令此輩主之宜與在京一廟令冬十月己亥朔詔三司解鹽聽通商候二年較其增損以聞初包拯自陜西還力主范祥所建通商法朝廷既從之已而判磨勘司李徽之又言不便乃下其事三司驛召祥令與徽之及兩制共議而議者皆以祥為是故有是詔包拯事在元年十月甲申大理寺言信州民有劫米而傷主者法當死帝謂輔臣曰飢而劫米則可哀盜而傷主則難恕然細民無知終緣於飢耳遂貸之又曰用刑寬則民慢猛則民殘為政者當得寬猛之中使上下無怨則水旱不作矣卿等宜戒之乙酉新作隆儒殿在邇英閣後甲午知諌院吳奎言迎送契丹使三番之弊所經道路如被寇賊自罷寢以來大河之北人人鼓舞裁兩月間輒復紛紛妄有攻奪明聖在上而羣小敢爾若不繩以法是朝廷不可為善治也乞以言者姓名付外施行乙未翰林學士兼禮部侍郎知制誥李淑落翰林學士淑初以端明侍讀二學士奉朝請尋復入翰林諌官包拯吳奎言淑性姦邪嘗乞侍養其父而不及其母既得侍養又復出仕有謀身之端無事親之實作周三陵詩語涉怨憤非所宜言且陛下事章獻太后母子之際無纎芥隙而淑志吕夷簡墓有過猜雞晨之語深纍上德宜奪禁職以戒懷姦隱慝之臣故有是命丙申京西轉運使蘇舜元言知許州郭承祐才堪將帥政比龔黃請徙判鄭州帝曰許鄭皆近甸何必徙且承祐庸人而舜元所舉如此使朝廷何所取信皆宜戒敕之丁酉殿中侍御史裏行唐介責授春州别駕初張堯佐除宣徽節度景靈羣牧四使介與包拯力爭又請王舉正留百官班廷論卒奪堯佐宣徽景靈二使頃之復除宣徽使知河陽或謂補外不足爭介以為宣徽次二府不計內外獨爭之帝諭介除擬初出中書介言當責執政退請全臺上殿不許自請貶亦不報於是劾宰相文彥博專權任私挾邪為黨知益州日作間金竒錦因中人入獻宫掖緣此擢為執政及恩州平賊幸會明鎬成功遂叨宰相昨除張堯佐宣徽節度使臣纍論奏面奉德音謂是中書進擬以此知非陛下本意蓋彥博姦謀迎合顯用堯佐隂結貴妃外陷陛下有私後宫之名內實自為謀身之計又言彥博向來求外任諫官吳奎與彥博相為表裏言彥博有才國家倚賴未可罷去臣見彥博自獨專大政凡所除授多非公議恩賞之出皆有夤緣三司開封諫官法寺兩制三館諸司要職皆出其門更相援引借助聲勢欲威福一出於己使人不敢議其過惡乞罷斥彥博以富弼代之臣與弼亦昧生平非敢私也帝怒却其奏不視且言將加貶竄介徐讀畢曰臣忠義憤激雖鼎鑊不避敢辭貶竄帝於座急召二府示以奏曰介言他事乃可至謂彥博因貴妃得執政此何言也進用冢司豈應得預而乃薦弼時彥博在帝前介面質之曰彥博宜自省即有之不可隱彥博拜謝不已帝怒益甚樞密副使梁適叱介下殿彥博再拜言臺官言事職也願不加罪不許乃召當制舍人即殿廬草制而責之時帝怒不測羣臣莫敢諌右正言蔡襄獨進言介誠狂直然容受盡言帝王盛德也必望矜貸之翌日己亥中丞王舉正復上疏言責介太重帝亦中悔恐內外驚疑遂敕朝堂告諭百官改介英州别駕復取其奏以入遣中使護送介至英州且戒必全之無令道死知制誥胡宿言唐介改貶英州此誠天恩於介無量然臣愚見猶有未安或聞專差中使押至貶所朝旨有在路不管疏虞之語此之處分頗非泛常竊尋嚮前臺諫官貶黜無此體例一旦介若因霜露之病死於道路四海廣逺不可家至户曉將使朝廷負謗於天下其傷不小就使介安全至於貶所然亦不可著為後法伏望追還使人以全朝體殿中侍御史梁蒨亦言陛下愛介故遣中使護送之即不幸介以疾死天下後世能無以殺疑乎帝曰誠不思此亟追還中使時朝中士大夫各贈介詩而待制李師中有並遊英俊顔何厚未死姦諛骨已寒之句由是介直聲聞天下稱真御史者必曰唐子方云庚子禮部尚書平章事文彥博罷為吏部尚書觀文殿大學士知許州考異李燾曰或言張堯佐彥博父客也彥博知益州貴妃有力焉因風彥博織燈籠錦以進貴妃服之帝驚顧曰何從得此妃正色曰文彥博所織也彥博與妾父有舊然妾鳥能使之特以陛下故耳帝悅自是意屬彥博及為參知政事明鎬討王則未克帝甚憂之語妃曰大臣無一人為國了事者日日上殿何益妃密令人語彥博翌日彥博入對乞身往破賊帝大喜彥博至恩州十數日賊果平即軍中拜相議者謂彥博因鎬以成功其得相由妃力也介既用是深詆彥博雖坐逺貶彥博亦出然事之有無卒莫得而辨云按長編所言皆採碧雲騢之説恐未確今不取邵氏見聞録云仁宗嘗幸貴妃閣見定州紅瓷器怪問曰安得此妃以王拱辰所獻為對帝怒曰戒汝勿通臣寮饋遺不聽何也因擊碎之妃愧謝良久乃已妃又嘗侍上元宴於端門服所謂燈籠錦者帝亦怪問妃曰文彥博以陛下眷妾故有此獻上不樂其後唐介彈彥博介雖以對上失禮逺謫彥博亦出守上蓋兩罷之也或云燈籠錦乃彥博夫人遺妃彥博不知也介章及梅堯臣書竄詩過矣以龎籍同中書門下平章事高若訥以本官充樞密使辛丑以樞密副使給事中梁適參知政事翰林學士承旨知制誥王堯臣為樞密副使起居舍人知諌院吳奎出知密州包拯奏乞留奎且言唐介因彈大臣并以中奎誣惑天聽帝曰介昨言奎拯皆隂結文彥博今觀此奏則非誣也乙巳帝謂龎籍曰諌官御史必用忠厚淳直通世務明治體者以革浮薄之弊籍既承聖諭自是中書奉詔舉臺官必以上語載敕中史館檢討司馬光以時政記及起居注並不載元昊叛命契丹遣使事會龎籍監修國史光請即樞密追尋本末自至史館議之修撰孫抃謂國惡不可書其事遂寢十一月辛亥詔漳泉州興化軍自偽命以來計丁出米甚重或貧不能輸朕甚閔之自今泉州興化軍舊納七斗五升者主户與減二斗五升客户減四斗五升漳州納八斗八升八合者主户減三斗八升八合客户減五斗八升八合為定制初龎籍為福建轉運使請罷漳泉興化軍丁米有司持不可於是籍為宰相遂行之乙亥帝謂輔臣曰江淮連年荒歉如聞發運司惟務誅剝以敷額為能雖名和糴實抑配耳其減今年上供米百萬石因詔免災傷人户所輸鹽米先是河北飢三司益增江淮米以餉河北及江淮飢有司責米數如常嵗度支副使梅摯奏減之十二月庚辰翰林天文院新作渾儀成御撰渾儀總要十卷論前代得失已而留中不出戊子中書言諸房人吏稽違案牒者自來量行罰典終未革心欲籍其名氏以輕重為差其罰數多及情重者取旨黜逐從之戊戌以資政殿學士吳育知陜州始命育翰林侍讀學士育辭以疾固請便郡帝謂近臣曰育剛正可用但疾惡太過耳宜聽其便因遣中使賜以禁中良藥不半嵗又徙汝州先是包拯請除范祥權本路轉運副使令擘畫鹽法利害計置沿邊斛斗事歸一局易為辦集而三司使田况亦請久任祥使專其事己亥以祥為陜西轉運副使仍賜金紫服以寵之庚子詔文武官年七十以上未致仕者更不考課遷官其有功於國有惠於民當加賞者勿拘以益州鄉貢進士房庶為試校書郎庶成都人宋祁嘗上其所著樂書補亡二卷田况自蜀還亦言其知音既召赴闕庶自言嘗得古本漢志云度起於黃鍾之長以子榖秬黍中者一黍之起積一千二百黍之廣度之九十分黃鍾之長一為一分今文脫之起積一千二百黍八字故自前世以來纍黍為尺以制律是律生於尺尺非起於黃鍾也且漢志一為一分者蓋九十分之一後儒誤以一黍為一分其法非是當以秬黍中者一千二百實管中黍盡得九十分為黃鍾之長九寸加一以為尺則律定矣直祕閣范鎮是之乃言曰李照以縱黍纍尺管空徑三分容黍千七百三十胡瑗以橫黍纍尺管容黍一千二百而空徑三分四釐六毫是皆以尺生律不合古法今庶所言實千二百黍於管以為黃鍾之長就取三分以為空徑則無容受不合之差校前三説為是請如其法試造尺律更以古器參考當得其真乃詔王洙與鎮同於修制所依庶説造律尺籥上之帝召輔臣同觀又令庶自陳其法因問律吕旋相為宫事令撰圗以進是時胡瑗等制樂已有定議特推恩而遣之鎮為論於執政曰今律之與尺所以不得其真由纍黍為之也纍黍為之者史之脫文也古人豈以難曉不合之法書之於史以為後世惑乎易曉而必合者房庶之法是矣今庶自言其法依古以律而起尺其長與空徑與容受與一千二百黍之數無不合之差誠如庶言此至真之法也執政不聽四年春正月辛亥徙英州别駕唐介為全州團練副使監郴州酒稅王堯臣王守忠陳旭等校慶厯皇祐總四年天下財賦出入凡金幣絲纊薪芻之類皆在其數參相耗登皇祐元年入一億二千六百二十五萬有竒而所出亡餘為書七卷丙辰上之詔送三司取一嵗中數以為定式庚申乾寧軍獻古鐘詔送詳定大樂所丙寅聽吉州司理參軍祝紳持兄服紳幼亡父母養於兄嫂已嘗為嫂服至是又請解官持兄喪帝曰近世蓋有匿父母喪而干進者今紳雖所服非禮然不忘鞠養之恩亦可勸也可聽之仍候服闋日與幕職官知縣詔昨為唐介顯涉結附合行降黜亦慮言路或梗尋與敘遷尚恐言事之臣有所顧忌御史臺諌院其務盡梗直以針闕失壬申樞密直學士工部侍郎知福州劉夔請解官歸武夷山為道士不許尋命知建州夔建州人也遂以户部侍郎致仕二月戊寅帝謂輔臣曰東南嵗比不登民力匱乏嘗詔蠲嵗漕百萬石今發運使施昌言許元乃欲分往兩浙江南調發軍儲是必謀誅剝疲民求羡餘以希進耳冝約束之因詔昌言等遵前詔毋得輒有科率庚辰以兵部郎中傅求為户部副使慶厯末求自梓州路轉運使移陜西時關中用當十鐵錢盜鑄不可勝計公私患之求獻策請變錢法至境問民所乏貸以種糧錢令麥熟納償而薄取其息民大悅求亟檄州縣凡散二百八十萬緡大錢息盡乃以聞已而朝廷變法遂下令以小鐵錢三折大鐵錢一民出不意破産失業自經死者甚衆而盜鑄亦以衰止所貸得麥四十萬斛商人入粟於邊而受錢於中都嵗五百萬緡時河北奏乞錢朝廷未有以給求言本道倉廩實請以所當受錢畀之帝嗟賞自康定用兵陜華以西移輸稅於邊民力大困求令輸本郡而轉錢以供邊糴民受其惠而兵食亦足王堯臣詳定課績上其事實賜詔褒之尋召入權糾察在京刑獄於是擢副三司考異李燾曰傳求傳云求獻䇿請變法既悉貸民大鐵錢遂下令以一拆三民多破産失業而盜鑄亦止按變法在慶厯八年六月乃用三司議或因求獻策亦不可知若謂求遂下令以一折三則是求自擅作法罔民初非朝廷變法也朝廷變法適與求貸民大鐵錢相先後蓋求悉貸民大鐵錢大錢雖折小錢而小錢十可改鑄大錢五且有餘即鄭戩所云盜鑄獲利十之六也求前貸民大錢今但取小錢又以小錢二折當十大錢一其名似優貸者其實隂奪盜鑄之利也求傳載此事殊不了了今略刪潤使易曉癸未命御史中丞王舉正與三司同詳定冗費三月丁未以知諌院包拯為龍圗閣學士河北都轉運使居數月徙為高陽關路安撫使因籍一路吏民積嵗所負公錢十餘萬悉除之丙辰蠲江南東西路民所貸種糧初帝謂輔臣曰頃江南嵗飢貸種糧數十萬斛且屢經倚閣而轉運司督索不已如聞民貧不能盡償非遣使安撫逺方無由上逹其蠲之壬戌出內藏庫絹十萬下三司以助軍費丙寅河北東陜西都部署司言郭咨所進獨轅衝陳無敵流星弩可以備軍之用詔弓弩院如樣製之尋以咨為鄜延路鈐轄給所製弩五百募土兵教之既成經略使夏安期言其便詔置獨轅弩軍以全州團練使監郴州稅唐介為祕書丞辛未詔雜買務自今凡宫禁所市物皆給實直其非所闕者勿得市初帝謂輔臣曰國朝鑒唐世宫市之患特置此務以京朝官內務參主之且防擾人近嵗物非所急者一切收市其擾人亦甚矣故降是詔夏四月戊寅禁內宿臣寮衆會先是內出欹器一陳於邇英閣御坐前諭丁度等曰朕思古欹器之法試令宫人製之以示卿等命以水注之中則正滿則覆虛則欹率如家語荀卿淮南之説其制度精好度等列侍觀之帝曰日中則昃月盈則虧朕欲以中正臨天下當與列辟共守此道度拜曰臣等亦願無傾滿以事陛下因言太宗嘗作此器真宗亦嘗著論庚辰帝製後述以賜度等丙戌契丹國母遣順義節度使蕭昌等契丹主遣彰國節度使蕭昱等來賀乾元節其國書始去國號而稱南北朝且言書稱大宋大契丹非兄弟之義帝召二府議之參知政事梁適曰宋之為宋受之於天不可改契丹亦其國名自古豈有無名之國又下兩制臺諫官議皆以講和以來國書有定式不可輒許乃詔學士院答契丹書仍舊稱大宋大契丹其後契丹復有書亦稱契丹如故初知制誥韓綜為館伴北使欲復書如其國但稱南北朝綜謂曰自古未有建國而無號者北使慚遂不復言其後北使來朝廷擇館伴者時綜已卒帝曰孰有如韓綜者乎初儂智高貢方物求內屬朝廷拒之後復貢金函書以請知雍州陳珙上聞不報智高既不得請又與交址為仇且擅廣源山澤之利遂招納亡命數出敝衣易榖食紿言洞中飢部落離散雍州信其微弱不設備乃與廣州進士黃瑋黃師宓及其黨儂建侯儂志忠等日夜謀入寇一夕焚其巢穴紿其衆曰平生積聚今為天火所焚無以為生計窮矣當拔雍州據廣州以自王否則必死是日率衆五千沿鬱江東下攻破橫山寨寨主張日新雍州都巡檢高士安欽橫州同巡檢吳香死之五月乙巳朔儂智高破雍州執知州陳珙通判王乾祐廣西都監張立初賊圍城珙令乾祐守來逺門權都監李肅守大安門指使武吉守朝天門張立自賔州來援既入珙犒軍城上酒行而城破珙立乾祐及節度推官陳輔堯觀察推官唐鑑司户參軍孔宗旦皆被執兵死者千餘人智高閲軍資庫得所上金函怒謂珙曰我請內屬求一官以統攝諸部汝不以聞何也珙對嘗奏不報索奏草不獲遂扶珙出珙病目不能視惶恐呼萬嵗求自效不聽并立乾祐輔堯鑑宗旦害之立臨刑大罵不為屈逾月得其尸如生而李肅武吉武緣令梅微之支使蘇從與賊黃師宓有舊獲免當智高未反時雍州有白氣出庭中江水溢宗旦以為兵象度智高必反以書告珙珙不聽宗旦言不已珙怒詆之曰司户狂耶及智高破橫山寨宗旦即載其親詣桂州曰吾有官守不得去無為俱死也既而賊執宗旦欲任以事宗旦叱賊且大罵遂被害宗旦魯人始官京東與李道徐程尚同等四人為監司耳目號為四􅀈人多惡之然其立節乃如此楊安國傳四􅀈作四瞪已見慶厯七年今兩存之智高既得雍州即偽建大南國僭號仁惠皇帝改年啓厯赦境內師宓以下皆稱中國官名考異會要云改年端懿今從正史孔宗旦傳云及智髙破橫州即載其親桂州按五月一日雍州破宗旦被殺後八日乃破橫州傳誤也當作橫山寨傳蓋因曽鞏書亦稱橫山寨不云橫州不知何以如此誤今改之丙午以太常丞致仕導江代淵為祠部員外郎淵性簡潔事親以孝聞嘗舉進士甲科得清水主簿歎曰祿不及親何以為即還家教授坐席常滿王拱辰安撫兩川遺書欲起之託疾不往見楊日嚴知益州又薦之遂以太子中允致仕謝絶諸生著周易旨要老佛雜説數十篇於是翰林學士田况上其書詔優加兩官淵晚年日菜食巾褐山水間自號虛一子長吏嵗時致問淡然與對略不及私庚戌詔國子監直講自今選通經有行實年四十已上者為之時侍御史梁蒨言近日薦楊忱為學官而忱年少輕肆不可用故降是詔忱偕之子也癸丑儂智高入橫州丙辰入費州庚申入龔州辛酉入藤州又入梧州封州知封州曹覲死之時嶺南州縣無備守將多棄城走智髙行至封州州人未嘗知兵士卒才百人不任鬬又無城隍以守或勸覲避賊覲正色叱之曰吾守臣也有死而已敢言避賊者斬麾都監陳曄引兵迎擊賊封川令率鄉丁弓手繼進賊衆數百倍曄兵敗走鄉丁亦潰覲率從卒決戰不勝被執賊戒勿殺捽使拜且誘之曰從我得美官付汝兵柄以女妻汝覲不肯拜且詈曰人臣惟北面拜天子我豈從爾茍生耶幸速殺我賊猶惜不殺徙置舟中覲不食者兩日探懷中印章授其從卒曰我且死若求間道以此上官賊知其無降意害之至死罵賊聲不絶投其尸於江時年三十五壬戌儂智高入康州知州趙師旦監押馬貴死之師旦稹從子也賊既破雍州順流東下師旦使人覘賊還報曰諸州守皆棄城走矣師旦叱曰汝亦欲吾走耶乃大索得諜者三人斬以徇而賊已薄城下師旦止有兵三百開門迎戰殺數十人會暮賊稍却師旦語其妻取州印佩之使負其子以匿曰明日賊必大至吾知不敵然不可以去爾留死無益也遂與貴部士卒固守州城召貴食貴不能食師旦獨飽如平時至夜貴卧不安席師旦即卧內大鼾遲明賊攻城愈急左右請少避師旦曰戰死與戮死何如衆皆曰願為國家死至城破無一人逃者矢盡與貴俱還據堂而坐智髙麾兵鼓譟爭入脅師旦師旦大罵曰餓獠朝廷負若何事乃敢反耶天子發一校兵汝無遺類矣智高怒并貴害之癸亥入端州知州丁寶臣棄城走考異歐陽修王安石作寶臣墓碑皆稱寶臣嘗出戰有所斬捕卒不勝乃去蓋飾説也今不取甲子知潁州資政殿學士户部侍郎范仲淹行至徐州而卒仲淹少有大節其於富貴貧賤毁譽歡戚不一動其心而慨然有志於天下嘗自誦曰士當先天下之憂而憂後天下之樂而樂也每感激論天下事奮不顧身一時士大夫矯厲尚風節自仲淹倡之性至孝以母在時方貧其後雖貴非賔客不重肉妻子衣食僅能自充而好施豫置義莊里中以贍族人泛愛樂義士多出其門下雖里巷之人皆能道其名字守杭之日子弟知其有退志乘間請治第洛陽樹園圃以為逸老之地仲淹曰人茍有道義之樂形骸可外况居室乎吾今年踰六十生且無幾乃謀治第樹園圃顧何待而居乎吾之所患在位高而艱退不患退而無居也且西都士大夫園林相望為主人者莫得常遊而誰獨障吾遊者豈必有諸己而後為樂邪語見名臣言行録及卒四方聞者皆為歎息帝嗟悼久之贈兵部尚書諡文正又遣使就問其家既葬帝親書其碑曰褒賢之碑仲淹為政主忠厚所至有恩邠慶二州之民與屬羌皆畫像立生祠事之其卒也羌酋數百人哭之如父齋三日而去丙寅儂智高圍廣州前二日有告急者知州仲簡以為妄囚之下令曰有言賊至者斬以故民不為備及賊至始令民入城民爭以金貝遺閽者求先入踐死者甚衆餘皆附賊賊勢益張丁卯詔制置發運使司六路轉運司仍舊以公牒往來先是許元欲廣收羡餘以媚三司憚諸路不從請以六路轉運司自隸皆令具狀印發運司唐詢既自江西徙福建轉運使相繼論列於朝卒罷之命知韶州考異宋史作知桂林陳曙領兵討儂智高朝廷初聞智髙反詔進奏院不得輒報知制誥吕溱言邊防警急一方有盜賊宜令諸路聞之共得為備今欲人不知此何意也六月乙亥起復前衛尉卿余靖為祕書監知潭州前屯田員外郎直史館楊畋為廣南西路體量安撫提舉經制賊盜靖及畋各居父喪先是靖與知韶州者結輯農兵完葺堡障共為守禦計朝廷聞而嘉之又以畋素習蠻事故有是命既即喪次命靖尋改為廣南西路安撫使知桂州畋被召至都門外辭以喪服不敢見帝賜以御服御巾入對便殿即日加起居舍人同知諫院而遣之甲申徙知廣州仲簡知荆南朝廷但以簡能守城故有是命不知廣人怨之深也詔諸州軍里正押司録事已代而令輸錢免役者以違制論先是王逵為荆南路轉運使率民輸錢免役得緡錢三十萬進為羡餘朝廷既降詔奬諭由是諸路盡為掊克欲以市恩至破産不能償所負朝廷知其弊故條約之丁亥以太子太師致仕王德用為河陽三城節度使同平章事判鄭州時將相王姓者數人而閭閻婦女小兒皆號德用為黑王相公德用雖致仕乾元節上夀預班廷中契丹使語譯者曰黑王相公乃復起耶帝聞之遂更付以方鎮以彰化節度使知延州狄青為樞密副使御史中丞王舉正言青出兵伍為執政本朝所無恐四方輕朝廷左司諫賈黯言國初武臣宿將扶建大業平定列國有忠勳者不可勝數然未有起卒伍登帷幄者今其不可有五四夷聞之有輕中國心一也小人無知聞風傾動翕然嚮之撼搖人心二也朝廷大臣將耻與為伍三也不守祖宗之成規而自比五季衰亂之政四也青雖才勇未聞有破敵功失駕御之術乖勸賞之法五也御史韓贄亦以為言皆不聽青面涅猶存帝嘗敕青傅藥除字青指其面曰陛下擢臣以功不問門第閥閲臣所以有今日由涅耳願留此以勸軍中不敢奉詔壬辰以祕書丞監郴州稅唐介為主客員外郎通判潭州己亥置廣南東西路湖南江西轉運判官各一員庚子以知宿州朱夀隆提點廣南西路刑獄朝廷懲嶺表無備命城貴州守者虐用其人人不堪命夀隆馳至州械守送獄奏黜之州人為立生祠夀隆台符子也秋七月乙巳出內藏庫錢三十萬緡絹十萬匹下河北助糴軍糧丙午命知桂州余靖經制廣南東西路盜賊時諌官賈黯言靖及楊畋皆許便宜從事若兩人指蹤不一則下將無所適從又靖專制西路若賊東嚮則非靖所統無以使衆不若併付靖經制兩路靖亦自言賊在東而使臣西非臣志也帝從其言故有是命樞密院言蠻賊徒黨無慮二萬人日食米五百石非有資其糧食者則勢不可留須法外禁之辛酉詔犯者其首處斬從者配嶺北牢城舟車沒官丁已大風拔木初魏瓘築廣州城鑿井蓄水作大弩為守備及儂智高攻城甚急且斷流水而城堅井飲不渴弩發輒洞中賊勢稍屈知英州晉江蘇緘始聞廣州被圍謂其衆曰廣與吾州密邇今城危在旦暮而恬不往救非義也乃搜募壯勇合數千人委州印於提點刑獄鮑軻夜行赴難去廣二十里駐兵黃師宓為賊謀主緘使縛其父斬以徇賊聞之喪氣時羣不逞皆旁緣為盜緘得六十餘人斬之招懷其驅脅詿誤使復故業者凡六千八百餘人城被圍日久戰數不勝賊方舟數百急攻南城番禺縣令新喻蕭注先自圍中出募得海上強壯二千餘人以海船集上流未發會颶風夜起縱火焚賊船煙焰屬天大破之積尸甲如山即日發縣門諸路援兵及民户牛酒芻糧相繼入城城中人乃有生意每戰必勝而轉運使王罕亦有外募民兵遂入城益修守備賊知不可拔圍五十七日壬戌解去由清逺縣濟江擁婦女作樂而行攻賀州不克遇廣東都監張忠於白田忠戰死虔州巡檢童玉康州巡檢王懿連州巡檢張宿賀州巡檢趙允明監押張全司理參軍鄧冕皆沒先是緘與洪州都監蔡保恭以兵八千人據邊渡村扼賊歸路會忠自京師至奪而將之臨戰謂其下曰我十年前一健兒以戰功為團練使爾曹勉之於是不介馬而前先鋒遇賊奔忠手拉賊帥二人馬陷濘不能奮遂中標槍死甲子廣東鈐轄蔣偕擊賊於路田兵敗南恩州巡檢楊逵南安軍巡檢邵餘慶權宜融州巡檢馬嶽西路捉賊王興萇用和皆沒考異實録稱皆沒於路田本紀亦云按本傳及智高傳則太平場也實録本紀並誤今改之考功議上故司空致仕張齊賢諡曰文定右僕射陳堯叟諡曰文忠太子太傅致仕辛仲甫諡曰康節贈吏部尚書溫仲舒諡曰恭肅贈户部尚書錢若水諡曰宣靖贈刑部尚書宋湜諡曰恭質右屯衛上將軍王嗣宗諡曰景莊威塞節度使馮守信諡曰勤威自齊賢而下皆祖宗舊臣也已葬而未諡至是其家始請之是月契丹主追尊納喇蘇為元祖簡獻皇帝薩喇達為德祖宣簡皇帝妣加為后復加諡太祖以下帝后八月丁巳以監新淦縣稅丘濬簽書滁州判官事初濬坐作詩刺譏時事謫官久之至是淮南安撫陳旭湖北提點刑獄祖無擇表薦之帝曰濬無雅行唯以口舌動人今旭等稱其才無乃長浮薄輔臣言濬所坐已更赦宜使自新故內徙之楊畋既趨廣南又奏請刪康定行軍約束及賞罰格頒下并置檢法官己卯詔諭畋曰智高乘飈鋭竊發二廣之民日徯官軍至故委卿節制以殄賊為期臨機趨變安用中覆今甲兵大集不能度形勢一舉撲滅乃奏請頒格令置檢法官此豈應速計耶賊或順風下海掠瓊管及海壖諸州厚戍則兵不足無備則寇乘之如能斷海道則不以日月淹速計也癸未詔開封府比大風雨民廬摧圯壓死者官為祭斂之乙酉降廣南東路轉運使王罕官監信州酒稅初罕往潮州議鹽事聞儂智髙圍廣州即領兵還入城為守禦備城所以得不陷者罕有力焉而朝廷未知也提點刑獄鮑軻自英州挈其孥欲過嶺北至雄州知州蕭勃留之乃具奏召罕至雄州計事罕輒不至諫官李兌遂劾罕怯懦避賊端居廣州朝廷亦以罕奏不時逹故及於責丙戌贈張忠為感德節度使録其父餘慶為左監門衛大將軍賜第一區給半俸終其身母賈氏為河內郡夫人丁亥以蕭注為禮賓副使仍權發遣番禺縣事戊子以資政殿學士兼翰林院侍讀學士吏部尚書知汝州吳育為集賢院學士判西京留守御史臺以育固稱疾求居散地故也留臺舊不領民事時張堯佐判河陽民訟久不決者多詣育育為辨曲直判書狀尾堯佐畏恐奉行鄜州兵廣鋭振武二指揮戌延州聞其家被水災詣副都署王興求還不能得乃相率逃歸至則家人無在者於是聚謀為盜州人震恐知州薛向遣親吏諭之曰冒法以救父母妻子乃人之常情而不聽汝歸乃武帥不知變之過耳汝聽吾言亟歸收親屬之尸貸汝擅還之罪不聽吾言汝無噍類矣衆徑入拜庭下泣謝境內以安經略轉運使言其狀帝嘉歎之辛卯改知秦州孫沔為湖南江西路安撫使入內押班石全彬考異宋史作全斌今從長編副之沔初入見帝以秦州事勉之對曰臣雖老然秦州不足煩聖慮當以嶺南為憂也臣覩賊勢方張官軍朝夕當有敗奏既而聞張忠死蔣偕敗帝諭執政曰南事誠如沔料宰相龎籍因奏遣沔行故有是命仍許沔便宜從事沔以南方兵連為賊所破氣懾不可用請益發騎兵且增選偏禆二十人求武庫精甲五千參知政事梁適謂沔曰毋張皇沔曰前日惟無備故至此今指期滅賊非可以僥幸乃欲示鎮靜耶夫實備不至而貌為鎮靜危亡之道也居二日促行才與兵七百沔憂賊度嶺而北乃檄湖南江西曰大兵且至其善治營壘多具燕犒賊疑不敢北侵沔行至鼎州復有詔加廣南東西路安撫使以知英州祕書丞蘇緘為供備庫使初廣州以賊遽至不及清野故賊得肆略後緘知賊將走分兵邊村渡扼其歸路布槎木巨石幾四十里賊至果不得前乃繞出數舍入沙頭渡江由清遠縣道連賀州西歸摧傷甚衆緘盡得賊所略去物資治通鑑後編卷六十一
