body:
  text: 資治通鑑後編卷九十刑部尚書徐乾學撰宋紀九十起重光協洽正月盡昭陽作噩十二月凡三年哲宗憲元繼道顯德定功欽文睿武齊聖昭孝皇帝元祐六年春正月癸酉詔祠祭游幸毋用羔丙戌以龍圖直學士知杭州蘇軾為吏部尚書中丞蘇轍言謹按自來河決必先因下流淤高上流不快然後乃決然則大吳之決己緣故道淤高今乃欲回河使行於此理必不可且見今北流深處水行地中實得水性捨此不用而欲引歸故道使水行空中雖三尺童子皆知其妄而建議之臣恣行欺罔居之不疑今雖變回河之名為分水之議而本司收買馬頭物料至今不絶又與本路監司奏隨宜開𨗳口地河槽務令深濶并修葺緊急堤岸釃為二渠臣覩其指意雖為減水其實暗作回河之計欲乞聖慈特選骨鯁臣僚及左右親信往河北同安撫轉運諸臣踏行開述利害聞奏如臣所言不妄即乞罷分水指揮廢東流一行官吏役兵拆去馬頭鋸牙所貴河朔及鄰路兵民早獲休息國家財賦不至枉費則天下幸甚二月辛卯以門下侍郎劉摯為尚書右僕射兼中書侍郎龍圖閣待制知開封府王巖叟僉書樞密院事癸巳以御史中丞蘇轍為尚書右丞命既下而右司諌楊康國不書讀詔范祖禹書讀行下蘇軾改翰林學士承㫖避嫌也以翰林學士承㫖鄧溫伯為端明殿學士禮部尚書辛丑授阿里庫子希邦巴且為化外庭州團練使辛亥王巖叟奏事罷留身曲謝言於太皇太后曰陛下聽政以來納諫從善凡所更改務合人心所以朝廷清明天下安靜唯願於用人之際更加審察復少進而西於帝前奏曰陛下今日聖學當辨邪正聞有以君子小人參用之說告陛下者此乃深誤陛下也自古君子小人無參用之理聖人但云君子內小人外則泰君子外小人內則否小人既進君子必引類而去若君子與小人競進則危亡之基也不可不察三月庚申朔御邇英閣呂大防奏仁宗所書三十六事請令圖寫置坐隅從之癸亥上神宗實録史官范祖禹趙彥若黃庭堅所修也壬午賜禮部奏名進士諸科及第出身九百五十七人是年得宗澤詳定官惡其對策極陳時弊置末甲丁亥罷幸金明池瓊林苑先是呂大防請為賞花釣魚之㑹有詔用三月二十六日而連隂不解太皇太后諭㫖天意不順宜罷宴衆皆竦服夏四月壬辰呂大防劉摯奏危竿諭一事在三十六事之前注釋失仁宗意蓋聖意以為人君居至高至危之地須用正直之人譬如危竿須用正直之木古人謂邪蒿人君不可食食之固無害以其名不正也况邪佞小人乎己未復置通禮科從禮官請也丙申詔恤刑辛丑詔大臣堂除差遣非行能卓異者不可輕授仍搜訪遺材以備擢任夏人寇熙河蘭岷鄜延路壬寅太白晝見壬子賜南平王李乾德袍帶金帛鞍馬癸丑以户部員外郎楊畏為殿中侍御史中丞趙君錫所舉也畏先除監察御史言者斥其附㑹呂惠卿舒亶以進罷之至是復有此擢王巖叟移書詰劉摰摯不從畏初刻志經術以所著書謁王安石為鄆州教授自是尊安石之學以為得聖人意畏與摯善後呂大防亦善之大防摯異趣皆欲得畏為助君錫薦畏實摯風㫖也然畏卒助大防擊摰焉五月己未朔日有食之罷文德殿視朝太史言日食二分不及元奏分數庚申詔呂惠卿除中散大夫光祿卿分司南京權中書舍人孫升封還詞頭以為惠卿量移未三年無名而復必不可行壬戌進呈呂大防劉摯等皆持兩端禀㫖太皇太后曰候及三年樞密院都承㫖劉安世言陛下初踐宸極以呂惠卿蔡確之徒殘民蠧國辜負任使為四海所疾是以逐之逺方謂宜永投荒裔終身不齒而惠卿自宣城方踰再歲考之常法猶未當叙不識何名遽復卿列議者謂蔡確之母見在京師干訴朝廷願還其子大臣未敢直從其請若惠卿之命遂行將藉以復確確既復用則章惇之類如蝟毛而起為天下國家之計者其得安乎不聽庚辰詔娶宗室女得官者毋過朝散大夫皇城使詔翰林學士承㫖蘇軾兼侍讀丁亥後省上元祐敕令格六月壬辰録囚甲辰置國史院修撰官秋七月己巳蘇軾言浙西諸郡二年灾傷而今歲大水尤甚杭州死者五十餘萬蘇州三十萬己卯詔賜米百萬石錢二十萬緡賑之侍御史賈易率同官楊畏安鼎疏論浙西灾傷不實乞行考驗詔用其說范祖禹封還録黃奏曰國家根本仰給東南今一方赤子呼天赴訴開口仰哺以脫朝夕之急奏灾雖小過實正當略而不問若因此懲責則自今官司必以為戒將坐視百姓之死而不救矣所言伏乞更不施行從之八月戊子朔賈易上疏言蘇軾頃在揚州題詩以奉先帝遺詔為聞好語草呂大防制云民亦勞止引周厲王詩以比熙寧元豐之政弟轍早應制科試文繆不及格幸而濫進與軾皆誹怨先帝無人臣禮至引李林甫楊國忠為喻奏既入又有别疏宰執進呈具言易前後異同之語退復具奏曰臣等竊知易乃王安禮所善安禮以十科薦之今羣失職之人皆在江淮易來自東南此疏不惟搖動朝政亦隂以申羣小之憤乃詔與易外任辛卯詔御史臺臣僚親亡十年不葬許依條彈奏及令吏部檢察壬辰翰林學士承㫖蘇軾罷軾既為賈易誣詆趙君錫相繼言之後數日軾入見具辨其事因復請外詔以龍圖閣學士知潁州乙未御史中丞趙君錫罷為吏部侍郎以附和賈易論蘇軾也尋出知鄭州己亥改宗正屬籍曰宗蕃慶系録令文武臣出入京城門書職位差遣姓名及所往癸卯詔章惇復右正議大夫惇坐蘇州買田不法降一官至是滿嵗當復故有是詔給事中朱光庭言惇凶悖狠戾强買民田姦邪貪汙之人不當用常法叙復於是更詔候一朞取㫖已酉修神宗寶訓癸丑詔鄜延路都監李儀等以違㫖夜出兵入界與夏人戰死不贈官餘官降等初兩宮幸李端願宅臨奠既還蔡確母明氏自氊車中呼太皇萬歲臣妾有表衛士取而去是日丁酉也辛亥三省進呈明氏馬前狀太皇太后宣諭曰蔡確不獨為吟詩謗讟緣此人於社稷不利若社稷之福確當便死此事公輩亦須與挂意劉摰曰只為見呂惠卿一年量移便來攀例蘇轍曰惠卿量移時未有刑部三年之法呂大防乞令開封府發遣從之既而摯以發遣為太甚大防復奏乞且令開封府告示詔可朱光庭封還録黃言確罪比四凶四凶之竄豈有復還之理乃以刑部常法預先告示理極不可遂寢前詔摯乃令本房出告示不復坐聖㫖既而復降録黃過門下給事中雖欲再論列不可得矣甲寅宰臣入對呂大防言近講筵官奏乞修邇英記注如仁宗朝故事已有㫖施行今史院有邇英延義二閣記注十餘卷具載仁宗與講讀官議論欲寫一本進入以備聖覽從之王巖叟言秋氣已凉陛下閒燕之中足以留意經史舜雞鳴而起大禹惜寸隂願以舜禹為法帝曰朕在禁中常觀書不廢也帝問巖叟從誰學對曰從河東寧智先生學後歷仕四方無常師帝問何自識韓琦對曰因隨侍閒居北門始識琦遂薦辟學官又辟幕府復隨之居相三年至其葬乃去琦嘗教臣以事君之道前不希寵後不畏死左右無所避中間惟有誠意而已臣佩以終身帝稱嘆久之他日又因入對論取士巖叟曰天下非無材取之不逺採之不博耳所遷所擢止於己用者數人而已故朝廷有乏材之患搢紳有沉滯之嘆且如天下郡守縣令最可以見治狀每歲使本道監司舉一二性行端良治狀優異者朝廷召而用之則人思自奮矣帝曰善又問治道何先對曰在上下之情交通而無壅蔽之患上下之情所以通由舉仁者而用之仁者之心上不忍欺其君下不忍欺其民故君有德意推而逹於下民有疾苦告而逹於上不以一身自便為心帝曰安知仁人而舉之對曰巧言令色鮮矣仁剛毅木訥近仁帝頷之乙邜夏人寇懷逺寨閏月壬戌嚴飭陜西河東諸路邊備甲子以龍圖閣待制知鄆州蔡京知永興軍從呂大防請也是日執政㑹議都堂呂大防劉摯欲以知永興軍李清臣為吏部尚書王巖叟曰恐公議不協既而奏可巖叟謂同列曰必致人言録黃過門下省范祖禹封還進呈不允祖禹執奏如初除命既下左正言姚勔又論其不當已而三省復欲用蒲宗孟為兵部尚書蘇轍言前日除李清臣給諌紛然爭之未定今又用宗孟恐不便太皇太后曰奈闕官何轍曰尚書闕官已數年何嘗闕事今日用此二人正與去年用鄧溫伯無異此三人者非有大惡但與王圭蔡確輩並進意思與今日聖政不合見今尚書共闕四員若並用此四人使互進黨與氣類一合非獨臣等無可奈何即朝廷亦無可奈何如此用人臺諌安得不言臣恐朝廷自此不安靜矣議遂止壬申以知揚州王存為吏部尚書清臣知成德軍刑部侍郎彭汝礪與執政爭獄事自乞貶逐甲申詔改禮部侍郎九月丁亥邊臣言夏人寇麟府二州壬辰詔州民為寇所掠廬舍焚蕩者給錢帛踐稼者賑之失牛者官貸市之癸巳䇿賢良方正能直言極諫科丁酉王普等遷官有差詔嵗出內庫緡錢五十萬以備邊費甲辰幸上清儲祥宮壬子宮成議將肆赦王巖叟曰昔天禧中祥源成治平中醴泉成皆未嘗赦古人有垂死諫君無赦者此可見赦無益於聖治也乃止冬十月丁卯有流星晝出東北庚午朝獻景靈宮還幸國子監詣至聖文宣王殿行釋奠禮一獻再拜幸太學國子祭酒豐稷講尚書無逸終篇遂幸昭烈武成王廟肅揖禮畢還內先是范百祿轉對請視學故有是舉或謂呂大防曰祖宗視學非有爵命之賞則有金帛之賜大防曰古者天子視學蓋常事吾固欲天子時一幸金爵之賚後日何可繼也聞者乃服癸酉御史中丞鄭雍侍御史楊畏對甚久論劉摯及蘇轍也雍言摰善牢籠士人不問善惡雖贓汙久廢之人亦以甘言誘致因具摯黨人姓名王巖叟劉安世韓川朱光庭趙君錫梁燾孫升王覿曽肇賈易楊康國安鼎張舜民田子諒葉伸趙挺之盛陶龔原劉槩楊國寶杜純杜紘詹適孫諤朱京馬傅慶錢世榮孫路王子韶吳立禮凡三十人左正言姚勔入奏並言摰朋黨不公右正言虞策言摯親戚趙仁恕王鞏犯法施行不當甲戌摯以鞏為姻家轍以嘗薦鞏皆自劾乞正典刑詔答不允轍又言頃復見臺官安鼎亦論此事謂臣欺罔詐謬機械深巧則臣死有餘責有何面目尚在朝廷然鼎與趙君錫賈易等同構飛語誣罔臣兄軾以惡逆之罪賴聖鍳昭察君錫與易即時降黜鼎今在言路是以盡力攻臣無所不至伏乞早賜責降使鼎私意得伸是日轍與摯俱宣押入對對已押赴都堂先出待命於僧舍乞賜罷免戊寅王巖叟言方今戮力盡忠之臣摯居其最豈可因一二偏辭輕示遐棄安知其間無朋邪挾私而隂與羣奸為地者不報太皇太后獨遣中使賜蘇轍詔諭令早入省供職庚辰貴妃苖氏卒初邢恕謫永州舟行過京師劉摯故與恕善因以簡别摯摯答簡其末云為國自愛以俟休復持簡者問監東排岸官茹東濟恕舟安在東濟傾險人也數有求於摯弗得怨之亟取摯簡録其本送鄭雍楊畏二人方附呂大防因釋其語上之以休復為復子明辟之復謂摯勸恕俟太皇太后他日復辟也又章惇諸子故與摰子游摯亦間與之接雍畏遂謂摯延見接納為牢籠之計以覬後福帝於是始有罷摯意太皇太后亦怒面諭摯曰言者謂卿交通匪人為異日地卿當一心王室若章惇者雖以宰相處之未必樂也摯惶恐退上章自辨且求去位奏入不報遼命燕國王延禧為天下兵馬大元帥總北南院樞密使事癸未詔京西提刑司歲給錢物二十萬緡以奉陵寢甲申王巖叟奏臣之區區欲有所言不為一劉摰為陛下惜腹心之人太皇太后宣諭曰垂簾之初摯排斥奸邪實為忠直但此二事非所當為也巖叟曰言事官未必皆忠直臣聞楊畏乃呂惠卿黨但欲除陛下腹心與奸邪開道路耳時已有詔鎖學士院草麻制罷摯而巖叟未知也十一月乙酉朔摯罷為觀文殿大學士知鄆州麻制以從摯所乞為辭給事中朱光庭封還曰摯有功大臣一旦以疑而罷天下不見其過言者以光庭為黨亦罷知亳州摯性峭直有氣節通逹明鋭觸機輒發不為利怵威誘自初輔政至為相修嚴憲法辨白邪正孤立一意不受請謁然持心少恕勇於去惡竟為朋讒竒中天下惜之初衛朴厯後天一日元祐五年十一月癸未冬至驗景長之日乃在壬午遂改造新厯至是厯成上之壬辰詔以元祐觀天厯為名辛丑中書侍郎傅堯俞卒太皇太后素知其清直謂輔臣曰堯俞金玉人也惜不至宰相對曰堯俞自仁宗時至今始終一節有德望真可為朝廷惜帝輟朝臨奠贈銀青光祿大夫諡憲簡初司馬光嘗謂邵雍曰清直勇三德人所難兼吾於欽之見焉雍曰欽之清而不耀直而不激勇而不猛是為難耳欽之堯俞字也十二月戊辰夕開封府火呂大防言聞有客星在昴畢間王巖叟曰天道逺不可知但朝廷每事修省天道自當順應太皇太后曰天道安敢忽更在大臣同修政事夏人犯邊知太原府范純仁自劾禦敵失䇿壬申詔貶官一等徙知河南府七年春正月甲辰以遼使耶律迪卒輟朝一日乙巳張誠一以穿父墓取犀帶降職與祠乙丑詔編修經武要略二月丁卯詔陜西河東邊要進築守禦城寨三月丁亥以程頥為直祕閣判西京國子監初頥在經筵歸其門者甚衆而蘇軾在翰林亦多附之者二家互相非毁頥竟罷去至是頥服闋三省言宜除館職判檢院蘇轍進曰頥入朝恐不肯靜太皇太后納其言故頥不復得召禮部侍郎兼侍講范祖禹言臣掌國史伏覩仁宗皇帝豐功盛德不可得而名言所可見者其事有五畏天愛民敬祖好學聽諌行此五者於天下所以為仁也願陛下深留聖思又言仁宗每因事示人好惡皇祐中楊安國講論語史魚蘧伯玉一章仁宗曰蘧伯玉信君子矣然不若史魚之直據孔子所言則史魚不若伯玉之為君子仁宗人主也欲臣下切直故言伯玉不如史魚天下由是知仁宗好直不好佞此聖人之大德也願陛下以此為法昭示所好以慰羣望帝然之己亥録囚辛亥以知河中府蒲宗孟知永興軍夏四月癸丑朔以知永興軍蔡京為龍圖直學士知成都府先是議兩制差除宰執異同不決呂大防顧梁燾問誰可燾曰公久居朝廷收養人材固多宜自有人惟不以愛憎牽於偏聽而以朝廷得人為已任此所望於公也大防曰苦乏材耳燾曰天下何嘗乏材但賢者不肯自向前求進須朝廷識拔則有以來之立賢無方不患無人也及蔡京帥蜀燾曰元豐侍從可用者多惟京輕險貪愎不可用後竟如其言己卯范祖禹言程頥經術行義天下共知司馬光呂公著與頥相知二十餘年然後舉之此二人者非為欺罔以亂聖聽也頥草茅之人未習朝廷事體迂踈則固有之人謂頥欲以故舊傾大臣以意氣役臺諌其言皆誣罔非實若復召頥勸講必有補聖明臣雖終老在外無所憾矣又言王存蘇軾趙彥若鄭雍孔武仲呂希哲呂大臨吳師仁等皆可用希哲公著之子大臨大防之弟也時祖禹屢請知梓州宰執擬從其請太皇太后曰皇帝未欲令去且為皇帝留之祖禹乃不敢復請後宮孟氏洛州人馬軍都虞候元之孫也帝年益壯太皇太后歷選庶家女百餘入宮孟氏年十六兩宮皆愛之教以女儀己未太皇太后諭宰執曰孟氏子能執婦道宜正位中宮命學士草制又以近世禮儀簡略詔翰林臺諌給舍與禮官議册后六禮儀制以進甲子命尚書左僕射呂大防攝太尉充奉迎使同知樞密院事韓忠彥攝司徒副之尚書左丞蘇頌攝太尉充發册使簽書樞密院事王巖叟攝司徒副之尚書右丞蘇轍攝太尉充告期使皇叔祖同知大宗正事宗景攝宗正卿副之皇伯祖判大宗正事高密郡王宗晟攝太尉充納成使翰林學士范百祿攝宗正卿副之吏部尚書王存攝太尉充納吉使權户部尚書劉奉世攝宗正卿副之翰林學士梁燾攝太尉充納采問名使御史中丞鄭雍攝宗正卿副之甲戌立考察縣令課績法丙戌詔程頥許辭免直祕閣權判西京國子監差管勾崇福宮初頥表請歸田里言道大則難容節孤者易躓入朝見嫉世俗之常態名髙毁甚史册之明言如臣至愚豈免衆口又曰前日朝廷不知其不肖使之勸學人主不用則亦已矣若復無恥以茍祿位孟子所謂是為壟斷也儒者進退當如是乎敢冒萬死上還恩命及崇福命下頥即承領敕牒但稱疾不拜假滿百日亟尋醫訖不就職戊戌帝御文德殿册孟氏為皇后太皇太后語帝曰得賢內助非細事也既而嘆曰斯人賢淑惜福薄耳異日國有事變必斯人當之庚子罷侍從官轉對楊畏黃慶基言王巖叟父子預政交通貨賄竊弄威福巖叟遂稱疾章再上丙午罷知鄭州是月遼生女直部節度使合里博卒合里博生十一子長曰烏雅蘇一名烏雅舒次曰阿固達曰武奇邁曰賽音曰烏色曰烏哲曰烏古納曰棟摩曰察喇曰烏塔合里博疾篤呼弟英格謂曰烏雅舒柔善若辨集契丹事阿固達能之遂卒母弟普拉舒襲為節度使合里博嚴重多智每戰未嘗被甲襲位之初內外潰叛合里博乃因敗為功變弱為强遂破桓𧹞達薩烏春烏木罕基業始大初建官屬統諸部其官之長皆稱勃極烈云普拉舒機敏善辨尤能知遼人國政民情每白事于遼聽者皆信服不疑五月甲辰以知青州曽布知瀛州六月癸丑詔淮南東西兩浙路諸逋負不問新舊有無官本並權住催理一年從知揚州蘇軾請也辛酉以尚書左丞蘇頌為尚書右僕射兼中書侍郎蘇轍為門下侍郎翰林學士范百祿為中書侍郎翰林學士梁燾為尚書左丞御史中丞鄭雍為尚書右丞韓忠彥知樞密院事户部尚書劉奉世簽書樞密院事梁燾纍章辭位帝遣中使趣拜已而入謝太皇太后曰官家聖德日成正須卿家輔助燾對曰臣不敢不盡忠如范純仁韓維輩在外賢德尚多願陛下留意又上疏言范祖禹劉安世久在侍從宜置諸左右使斷國事安燾許將皆舊人可倚任甲子置廣文館解額以待四方游士之試京師者乙丑夏人遣使乞援于遼戊辰渾天儀象成秋七月癸巳詔修神宗正史復翰林侍講學士以范祖禹為之祖禹時為翰林學士因叔百祿在中書改是官范氏自鎮至祖禹凡三世居禁林士論以為榮己酉詔諸路安撫鈐轄司及西京南京各賜資治通鑑一部八月丙辰罷監酒稅務增剩給賞法己未詔西邊諸將嚴備毋輕出兵前陷交趾將吏蘇佐等十七人自拔來歸時朋黨之論寖熾吏部尚書王存為帝言人臣朋黨誠不可長然或不察則濫及善人東漢黨錮是也慶厯中或指韓琦富弼范仲淹歐陽修為朋黨賴仁宗聖明不為所惑今復有進此說者願陛下察之由是與用事者不合己卯詔存出知大名府辭之改杭州九月詔議郊祀典禮顧臨范祖禹等八人議請合祭天地范純禮彭汝礪曽肇孔武仲等二十二人議南郊合祭天地不見於經范百祿亦言圜丘無祭地之禮先帝所廢稽古據經未可輕改壬辰太皇太后謂輔臣曰郊祀宜依仁宗先帝故事呂大防言皇帝臨御之始當親見天地而諸儒獻議欲南郊不設皇地示位恐亦未安蘇頌鄭雍意與大防合太皇太后是其言戊戌詔曰國家郊廟時祀祖宗以來命官攝事惟三歲一親郊則先饗清廟冬至合祭天地于圜丘元豐間有司援周制以合祭不應古儀先帝詔定親祀北郊之儀未之及行是歲郊祀不設皇地示位而宗廟之饗率如權制朕以凉昧嗣承六聖休德鴻緒今兹禋禮奠幣上帝祼鬯廟室而地示大神久未親祀矧朕方郊見天地之始其冬至南郊宜依熙寧十年故事設皇地示位以嚴並况之報厥後躬行方澤之祀則修元豐六年五月之制俟郊禮畢集官詳議以聞壬午以知永興軍蒲宗孟知大名府丙戌以知蔡州鄧溫伯知永興軍己酉永興軍蘭州鎮戎軍地震是月召知揚州蘇軾為兵部尚書兼侍讀冬十月庚戌朔環州地震丁已詔陜西有前代帝王陵廟處給民五家充守陵户戊午以開封府推官咸平來之邵復為監察御史辛酉詔以大河東流都水使者吳安特賜三品服北外都水監丞李偉任滿日令再任丁卯夏人寇環州十一月辛巳太白晝見甲申詔太中大夫以上許占永業田癸巳合祭天地于圜丘以太祖配赦天下中外羣臣加恩罷南京𣙜酒民有親喪者户以差等與免徭辛丑賜徐王皓劍履上殿乙巳梁燾言先帝大臣多以材進可稍復用委以别都名藩以全終始十二月甲子以京西路轉運副使賈易知蘇州八年春正月甲申英州别駕蔡確卒丁亥御邇英閣顧臨讀寶訓至漢武籍南山提封為上林苑仁宗曰山澤之利當與衆共之何用此為丁度言臣事陛下二十年每奉德音未始不及於憂勤此蓋祖宗家法耳呂大防因推廣以進曰三代以後唯本朝百二十年中外無事蓋由家法最善臣請舉其略自古人主事母后朝見有時如漢武帝五日一朝長樂宮祖宗以來事母后皆朝夕見此事親之法也前代大長公主用臣妾之禮本朝必先致恭仁宗以妷事姑之禮見獻穆大長公主此事長之法也帝曰今宮中見行家人禮大防曰前代宮闈多不肅宮人或與朝臣相見唐入閣圖有昭容位本朝宮禁嚴密內外整肅此治內之法也前代外戚多與政事常致敗亂本朝母后之族皆不預此待外戚之法也前代宮室多尚華侈本朝止用赤白為飾此尚儉之法也前代人君雖在宮禁出輿入輦祖宗皆步自內庭出御後殿豈乏人之力哉亦欲涉歷廣庭稍冒寒暑耳此勤身之法也前代人主在禁中冠服茍簡祖宗以來燕居必以禮竊聞陛下昨郊禮畢具禮服謝太皇太后此尚禮之法也前代多深於用刑大者誅戮小者逺竄惟本朝用法最輕臣下有罪止於罷黜此寬仁之法也至於虛已納諌不好畋獵不尚玩好不用王器不貴異味此皆祖宗家法所以致太平者陛下不須逺師前代但盡行家法足以為天下帝深然之壬辰幸太一宮庚子詔頒髙麗所獻黃帝針經于天下范百祿言自元祐四年正月降勑罷回河今來臣僚回河之意終不肯已然大河亦終不可回吳安特等日生巧計壅遏北流前後多端致大河漸有填淤之害寖壞禹迹之舊豈不深可惜哉二月己酉高麗遣使乞買歷代史及策府元龜等書禮部尚書蘇軾言宜却其請省臣許之軾又疏陳五害極論其不可且曰漢東平王請諸子及太史公書猶不肯與今高麗所請有甚于此其可與乎詔書籍曽經買者聽壬子詔刑部不得分禁繫人數瘐死數多者申尚書省癸丑詔大寧郡王以下出就外學乙卯依都水監所奏作北流軟堰蘇轍奏臣嘗謂軟堰不可施於北流利害甚明蓋東流本人力所開濶止百餘步冬月河流斷絶故軟堰可為今北流是大河正溜比之東流何止數倍見今河水行流不絶軟堰何由能立蓋水官之意欲以軟堰為名實作硬堰隂為回河之計耳河北轉運副使趙稱亦上議曰臣竊謂河事大利害有三北流全河患水不能分東流分水患水不能行宗城河決患水不能閉是三者去其患則為利未能去則為害今不謀此而専議閉北流止知一日可閉之利而不知異日既塞之患止知北流伏槽之水易為力而不知闞村方漲之摯未可併入東流是見近忘逺以河為戲也請俟漲水伏槽觀大河全盛之摯以治東流北流於是詔罷軟堰是月以崇政殿說書呂希哲為右司諌希哲固辭蘇軾戲謂希哲曰法筵龍象衆當觀第一義希哲笑而不應退謂范祖禹曰若辭不獲命必以楊畏為首時畏方在言路以險詐自任故希哲有是言既而不拜三月壬午尚書右僕射蘇頌罷頌為相務在奉行故事使百官守法遵職量能授任杜絶僥幸之原深戒邊臣生事論議有未安者毅然力爭之㑹除賈易知蘇州頌以易昔在御史名敢言既為監司矣今乃作郡則是因赦令反下遷也不可議未決諌官楊畏來之邵謂頌稽留詔命頌於是上章辭位罷為集禧觀使梁燾言頌不可降職處外以示踈逺遂詔以觀文殿大學士留京師李燾曰邵伯溫云楊畏攻劉相出意謂必相蘇轍朝廷乃以蘇頌為右僕射畏又與來之邵言蘇相留賈易詔命不下時中丞李之純與蘇相為姻家偶在病告畏入卧內見之純曰臺諫言蘇頌章纍上未有施行公與連姻託病在告恐言者將及公李長者為畏所劫亦上章言臣僚論蘇頌章疏乞早降出蘇相遂罷太皇太后察見畏等私意自召范純仁拜右僕射畏與之邵又言純仁不可用不報之純與頌為姻家當考實録亦不載之純有言李清臣與許將書云子容之罷雖言者乘之殆别有謂非面莫悉也不知清臣所稱有謂是何事豈即邵伯溫所記楊畏反覆攻擊為蘇轍地乎當考庚寅范祖禹言臣前上仁皇訓典欲陛下奉為法則今竊以畏天者莫如仁宗故願陛下先誠於事天仲春以來暴風雨雪寒氣過甚惟陛下戒之重之側身修德以鎖大異辛卯中書侍即范百祿罷蘇頌既罷百祿以同省待罪請外不許御史黃慶基上疏列百祿五罪又言洛黨雖衰川黨復盛百祿之親戚朋游皆在權要今因罪狀明白早賜罷黜以離其黨與庶使當路者有所畏憚百祿遂力求去許之初罷百祿不除職梁燾以為言乃除資政殿學士知河中府庚子詔來年御試將詩賦舉人復試三題經義舉人且令試策此後全試三題是月門下侍郎蘇轍奏臣近以董敦逸言川人太盛差知梓州馮如晦不當指為臣過逐面陳本末尋䝉宣諭深察敦逸之妄然亦須略加别白其敦逸言臣章疏乞早付三省施行敦逸又言奏舉差除之人唯蘇軾為多或是親知或其鄉人致仕路有不平之嘆近高麗買書黃河軟堰之事皆得㫖已行尋以軾轍見拒而罷臣聞人君者制命者也人臣者承君之命而奉行者也命令重則君尊命令輕則臣强今陛下已行之命而軾轍違而拒之語其情犯又非蘇頌范百祿之比釋而不治命令輕矣乞斷自宸衷指揮施行夏四月丁未朔夏人來謝罪願以蘭州易塞門安逺二寨詔數以違順不常而却其請甲寅令范祖禹依先朝故事止兼侍講丁巳詔今後南郊合祭天地依元祐七年例施行罷禮部集官詳議甲子以知永興軍李清臣為吏部尚書五月蘇軾同呂希哲吳安詩豐稷趙彥若范祖禹顧臨上言臣等備員講讀伏見唐宰相陸贄論深切於事情言不離於道德智如子房而文則過辨如賈誼而術不踈上以格君心之非下以通天下之志使德宗盡用其言則貞觀可得而復陛下能自得師莫若近取諸贄臣等欲取其奏議稍加校正繕寫進呈必能發聖性之髙明成治功於歲月己卯以吏部尚書李清臣為資政殿學士知真定府姚勔論其不當召用故也辛卯御史董敦逸黃慶基並罷敦逸四狀言蘇轍慶基三狀言蘇軾謂軾昔為中書舍人所行制詞指斥先帝而轍相為表裏以紊朝政三省同進呈呂大防奏曰敦逸慶基言軾制詞謗毁先帝臣竊觀先帝聖意本欲富國强兵以鞭撻四裔而一時羣臣將順太過故事或失當及太皇太后與皇帝臨御因民所欲隨事救改蓋事理當然耳昔漢武帝好用兵重斂傷民昭帝嗣位博採衆議多行寢罷明帝尚察屢興慘獄章帝易之以寬厚天下悅服未有以為謗毁先帝者也至如本朝真宗即位弛放逋缺以厚民財仁宗即位罷修宮觀以息民力凡此皆因時施宜以補助先朝闕政亦未聞當時士大夫有以為謗毁先帝者也近自元祐以來言事官有所彈擊多以謗毁先帝為辭非惟中傷善類兼欲搖動朝廷意極不善若不禁止久將為患蘇轍因奏曰臣昨取兄軾所撰呂惠卿制觀之其言及先帝者有曰始以帝堯之仁姑試伯鯀終然孔子之聖不信宰豫兄軾豈謗毁先帝者耶臣聞先帝末年亦自深悔已行之事但未暇改耳元祐變更蓋追述先帝美意而已太皇太后曰先帝追悔往事至於泣下大防曰聞永樂敗後先帝嘗咎兩府大臣略無一人能相勸諌然則一時過舉非出先帝本意明矣太皇太后曰此事官家當深知於是斥敦逸慶基為湖北福建轉運判官中丞李之純御史楊畏來之邵言二人誣陷忠良其責太輕丙申詔各與知軍差遣敦逸知臨江軍慶基知南康軍蘇軾以劄子自辨言臣任中書舍人日適值朝廷竄逐數人所行告詞皆是元降詞頭所述罪狀非臣私意所敢增損內呂惠卿告詞事涉先朝不無所忌臣愚意以謂古今如鯀為堯之大臣而不害堯之仁宰豫為孔子髙弟而不害孔子之聖又况再加貶黜深惡其人皆先朝本意則臣區區之忠蓋自謂無負矣今慶基乃反指以為誹謗不亦矯誣之甚乎其餘所言李之純蘇頌劉誼唐義問等告詞皆是慶基文致附㑹以成臣罪此風始於朱光庭盛於趙挺之而極於賈易今慶基復宗師之臣恐隂中之害漸不可長非獨為臣而言也太皇太后令轍諭曰緣近來衆人正相捃拾且須省事軾乃具劄子稱謝曰伏見東漢孔融才踈意廣負氣不屈是以遭路粹之寃西晉嵇康才多識寡好善不忘是以遇鍾㑹之禍當時為之扼腕千古為之流涕臣本無二子之長而兼有古人之短若非陛下至公而行之以恕至仁而照之以明察消長之往來辨利害於疑似則臣已下從二子游久矣豈復有今日哉謹當奉以周旋不敢失墜便須刻骨豈獨埀紳庶全螻蟻之軀以報丘山之德是月水官又請進梁村上下約束狹河門趙稱爭不能得既涉漲水遂壅而潰南犯德清西決內黃東淤梁村北出蘭村宗城決口復行魏店北流淤斷河水四出壞東郡浮梁幅員數百里縱橫散漫漂廬舍敗冢墓遺民之僅免者老弱聚金堤上哀號之聲數舍不絶六月甲寅禮部尚書蘇軾乞知越州詔不允戊午尚書左丞梁燾罷為資政殿學士同醴泉觀使故事宮觀使非宰相不除遂置同使之名以寵之燾初以議邊事不合即屬疾求罷章屢上帝皆遣內侍封還仍問所以必去之理并密訪人材燾曰信任不篤言不見聽而詢人材之可用者非臣所敢當也使者再至乃具奏曰陛下必欲知可大用之人且圖任舊人中堅正純厚有人望者不牽左右好惡之言以移聖意天下幸甚尋乞補外出知潁昌府臨行帝遣內侍賜茶藥宣諭曰已用卿言復相范純仁矣先是劉摯罷相帝欲復用范純仁乃出御札以問呂大防大防對曰如所宣示實允羣議至是遂遣內侍李倬齎詔書詔純仁赴闕己未楊畏言純仁方罷帥降官名在謫籍而陛下遽命以為相賞罰不明何以詔示天下來之邵又言純仁師事程頥暗狠不才皆不聽畏與蘇轍俱蜀人前擊劉摯後擊蘇頌皆隂為轍道地太皇太后覺之故復自外召純仁畏尋又言轍不可大用云秋七月丙子朔以范純仁為尚書右僕射兼中書侍即純仁自潁昌至入對延和殿遂降是命太皇太后曰人言相公必先進王覿彭汝礪如何純仁曰此二人實有士望臣終不敢保位蔽賢惟陛下加察八月辛酉太皇太后不豫帝不視事壬戌遣使按視京東西河南北淮南諸路水災戊辰赦天下呂大防范純仁蘇轍鄭雍韓忠彥劉奉世入崇慶殿後閣問太皇太后安太皇太后諭曰今疾摯有加與公等必不相見且善輔佐官家為朝廷社稷大防等欲退太皇太后獨留純仁意欲有所屬也帝令大防以下皆往太皇太后曰老身沒後必多有調戲官家者宜勿聽之公等亦宜早求退令官家别用一輩人乃呼左右問曽賜出社飯否因謂大防曰公等各去喫一匙社飯明年社飯時當思老身也九月戊寅太皇太后高氏崩自垂簾以來召用故老名臣罷廢新法苛政舉邊寨之地以賜西夏於是宇內復安遼主戒其臣下勿生事於疆場曰南朝盡行仁宗之政矣臨政九年朝廷清明華夏綏定杜絶內降僥幸裁抑外家私恩文思院奉上之物無問巨細終身不取其一人以為女中堯舜己卯詔以太皇太后園陵為山陵命呂大防為山陵使庚辰遣使告哀于遼戊子端明殿學士兼翰林侍讀學士禮部尚書蘇軾出知定州考異李燾曰政目於六月二十六日書蘇軾知定州按軾奏議八月十九日猶以端明侍讀禮書論漢唐正史則六月二十六日不應已除定州又實録於九月十三日再書除定州恐六月所書或誤今去前而從後冬十月丙午中書舍人呂陶言太皇太后保佑聖躬于今九年一旦棄四海之飬凡在臣庶痛心泣血然臣於此時以無可疑為疑以不必言而言蓋自太皇太后垂簾以來屏黜凶邪裁抑僥幸橫恩濫賞一切革去小人之心不無怨憾萬一或有姦邪不正之言上惑聖聽謂太皇太后斥逐舊臣更改政事今日陛下既親萬幾則某人宜復用某事宜復行此乃治亂之端安危之機君子小人消長之兆在陛下察與不察也昔元祐初臣任臺諌官嘗因奏事簾前恭聞德音宣諭云朝廷政事於民有害即當更改其他不繫利害亦不須改每改一事必說與大臣恐外人不知臣思此語則太皇太后凡有更改固非出於私意蓋不得已而後改也至如章惇悖慢無禮呂惠卿姦回害物蔡確毁謗不敬李定不持母喪張誠一盜父墓中物宋用臣掊斂過當李憲王中正邀功生事皆是積惡已久罪不容誅則太皇太后所改之事皆是生民之便所逐之臣盡是天下之惡豈可以為非乎臣又聞昔者明肅皇太后稱制之日多以私恩遍及親黨聽斷庶務或致過差及至仁宗親政遂有希合上意言其闕失者仁宗察見情僞降詔止絶應明肅垂簾時事更不得輒有上言於是天下之人皆謂仁宗深念社稷之功能全子母之愛聖德廣大度越古今載在史册垂範後世陛下所宜法而行之戊申羣臣七上表請聽政時太皇太后既崩中外􅍅􅍅人懷顧望在位者畏懼莫敢發言翰林學士范祖禹慮小人乘間害政上疏曰陛下方總攬庶政延見羣臣此乃國家隆替之本社稷安危之基天下治亂之端生民休戚之始君子小人進退消長之際天命人心去就離合之時也先太皇太后性氣嚴正不可干犯故能斥逐奸邪以清朝廷裁抑僥幸以肅宮禁雖德澤深厚結於百姓而小人怨恨亦不為少必將有以改先帝之政逐先帝之臣為太皇太后過者此離間之言不可不察也初太皇太后同聽政中外臣民上書者以萬計皆言政令不便太皇太后因天下人心變而更化既改其法則作法之人有罪當逐陛下與太皇太后亦順衆言而逐之其所逐者皆上負先帝下負萬民天下之所讎疾而共欲去之者也豈有憎惡於其間哉惟陛下辨析是非斥逺佞人有以姦言惑聽者明正其罪付之典刑痛懲一人以警羣慝則帖然無事矣此輩既誤先帝又欲誤陛下天下之事豈堪小人再破壞耶蘇轍方具疏進諌及見祖禹奏曰經世之文也遂附名同進而毁已草疏入不報後數日祖禹又言先太皇太后以大公至正為心罷王安石呂惠卿等新法而行祖宗舊政故社稷危而後安人心離而復合乃至遼主亦與其宰相議曰南朝遵行仁宗政事可敇燕京留守使邊吏約束無生事陛下觀遼國之情如此則中國人心可知今陛下親萬機小人必欲有所動搖而懷利者亦皆觀望臣願陛下上念祖宗之艱難先太皇太后之勤勞痛心疾首以聽用小人為刻骨之戒守元祐之政當堅如金石重如山嶽使中外一心歸於至正則天下幸甚呂希純言君子小人用心不同有昔時自以過惡招致公論坐法沉廢者朝思夜度唯望乘國家變故朝廷未寧之時進為險語以動上心其說大約不過有三一謂神宗所立法度陛下必宜修復二謂陛下當獨攬乾綱不可委信臣下三謂向來遷謫者當復收用三者之言行將至矣陛下不可以不察呂陶亦以為言皆不報十一月庚午復內侍劉瑗等六人蘇轍奏曰陛下方親政中外賢士大夫未曽進用一人而推恩先及於近習外議深以為非後數日復出內批以劉惟簡梁從政等四人並除入內內侍省職中書舍人呂希純封還詞頭帝曰止為禁中闕人兼有近例轍曰此事非為無例蓋謂親政之初先擢內臣故衆心驚疑帝釋然曰除命且留俟祔廟取㫖可也范祖禹請追改內侍除命不報因請對曰熙寧之初王安石呂惠卿造立新法悉變祖宗之政多引小人以誤國勳舊之臣屏棄不用忠正之士相繼逺引又用兵開邊結怨外國天下愁苦百姓流徙賴先帝覺悟罷逐兩人而所引羣小已布滿中外不可復去蔡確連起大獄王韶創取熙河章惇開五溪沈起擾交管沈括徐禧俞充种諤興造西事兵民死傷皆不下二十萬先帝臨朝悼悔謂朝廷不得不任其咎以至吳居厚行鐡冶之法於京東王子京行茶法於福建蹇周輔行鹽法於江西李稷陸師閔行茶法市易于西川劉定教保甲於河北民皆愁痛比屋思亂賴陛下與太皇太后起而救之天下之民如解倒懸惟是向來所斥逐之人窺伺事變妄意陛下不以修改法度為是如得至左右必進姦言萬一過聽而復用之豈惟正人不敢立朝臣恐國家自此陵遲不復振矣又論漢唐之亡皆由宦官自熙寧元豐間李憲王中正宋用臣輩用事統兵權摯震灼中正兼幹四路口敇募兵州郡不敢違師徒凍餒死亡最多憲陳再舉之策致永樂摧陷用臣興土木之工無時休息罔市井之微利為國斂怨此三人者雖加誅戮未足以謝百姓憲雖已亡而中正用臣尚在今召內侍十餘人而憲中正之子皆在其中二人既入則中正用臣必將復用惟陛下念之時紹述之論已興有相章惇意祖禹力言惇不可用帝不悅丙子始御垂拱殿十二月乙巳范純仁言臣多疾早衰自叨宰執以來益為職事所困竊位已將五月輔政訖無寸長上負國恩又况受命之始已招彈擊之言伏望察其至誠退之以禮詔不允帝語呂大防曰純仁有時望不宜去可為朕留之且趣入見問先朝行青苖法如何對曰先王愛民之意本深但王安石立法過甚激以賞罰故官吏急切以致害民退而疏陳其要以為青苖非所當行行之終不免擾民初太皇太后寢疾召純仁諭曰公父仲淹在章獻垂簾時唯勸章獻盡母道及仁宗親政唯勸仁宗盡子道可謂忠臣公必能繼紹前人純仁泣謝曰敢不盡忠至是羣小力排垂簾時事純仁奏曰太皇太后保佑聖躬功烈誠心幽明共鍳議者不恤國是一何薄哉因以仁宗禁言章獻垂簾時事詔書上之曰望陛下稽倣而行以戒薄俗韓忠彥亦言於帝曰昔仁宗始政羣臣亦多言章獻之非仁宗惡其持情近薄下詔戒飭陛下能法仁祖則善矣甲寅倣唐六典修官制丁巳遼遣使來弔祭出錢粟十萬賑流民是月蘇軾赴定州時國事將變軾不得入辭既行上書言臣日侍帷幄方當戍邊顧不得一見而行况踈逺小臣欲求自通難矣然臣不敢以不得對之故不效愚忠古之聖人將有為也必先處晦而觀明處靜而觀動則萬物之情畢陳於前陛下聖智絶人春秋鼎盛臣願虛心循理一切未有所為默觀庶事之利害與羣臣之邪正以三年為期俟得其實然後應物而作使既作之後天下無恨陛下亦無悔由此觀之陛下之有為惟憂太蚤不患稍遲亦已明矣臣恐急進好利之臣輒勸陛下輕有改變故進此說敢望陛下留神社稷宗廟之福天下幸甚范純仁之將入也楊畏嘗有言純仁不知至是呂大防欲用畏為諌議大夫純仁曰上新聽政諌官當求正人畏傾邪不可用大防曰豈以畏嘗言公耶純仁始知之大防素稱畏敢言且先密約畏助己竟超遷畏為禮部侍即及大防充山陵使甫出國門畏首叛大防上疏言神宗更法立制以垂萬世乞賜講求以成繼述之道疏入帝即召對詢以先朝故臣孰可召用者畏遂列上章惇安燾呂惠卿鄧溫伯李清臣等行義各加品題且密奏萬言具陳神宗所以建立法度之意與王安石學術之美乞召章惇為相帝深納之遂復章惇資政殿學士呂惠卿為中大夫王中正復遙郡團練使給事中吳安詩不書惇録黃中書舍人姚勔不草惠卿中正誥詞乞追回除命皆不聽先是水官鋭意回河請因河流淺狹權堰斷使水勢入孫村口論奏以千百數詔率下河北轉運司議同列多畏恐不敢正言或以不知河事為解轉運副使趙稱獨居中持議不少假借每沮却之因上河議其略曰自頃有司回河幾三年工費騷動半於天下復為分水又四年矣古所謂分水者因河流相地勢𨗳而分之蓋其理也今乃橫截河流置掃約以扼之開濬河門徒為淵潭其狀可見况故道千里其間又有髙處故纍歲漲落輒復自斷臣謂當完大河北流兩堤復修宗城棄堤閉宗城口廢上下約開闞村河門使河流端直以成深道聚三河工費以治一河一二年可以就緒而河患庶幾息矣資治通鑑後編卷九十
