body:
  text: 資治通鑑後編卷一百三十刑部尚書徐乾學撰宋紀一百三十起旃蒙單閼正月盡疆圉大荒落十二月凡三年寧宗法天備道純德茂功仁文哲武聖睿恭孝皇帝諱擴光宗第二子也母曰慈懿皇后李氏光宗為恭王慈懿夢日墜于庭以手承之已而有娠乾道四年十月丙午生帝于王邸五年五月賜今名淳熙五年十月封英國公七年二月始就傅十二年三月封平陽郡王十六年二月光宗受禪三月進封嘉王慶元元年辛卯金敕有司給欽宗家屬田宅辛亥金諭參知政事胥持國河上役夫聚居恐生疾疫可廩醫護視之丙辰白虹貫日二月己未金始祭髙禖壬戍詔嗣秀王伯圭贊拜不名丁丑金中都地震大雨雹晝晦震慮天門右鴟尾戊寅右丞相趙汝愚罷初韓托胄欲逐汝愚而難其名京鏜曰彼宗姓也誣以謀危社稷則一網打盡矣托胄然之以祕書監李沐有怨于汝愚引為右正言使奏汝愚以同姓居相位將不利于社稷汝愚出浙江亭待罪遂以觀文殿大學士出知福州己卯雨土甲申謝深甫等論汝愚冒居相位今既罷免不當加以書殿隆名帥藩重寄乞令奉祠請咎命提舉洞霄宫直學士院鄭湜草制有云頃我家之多難賴碩輔之精忠持危定傾安社稷以為恱任公竭節利國家無不為坐無貶詞亦免官兵部侍郎章頴侍經幃帝曰諫官有言趙汝愚者卿等謂何同列漫無可否頴奏言天地變遷人情危疑加以敵人嫚侮國勢未安未可輕退大臣願降詔宣諭汝愚毋聽其去頴遂以汝愚黨罷國子祭酒李祥言去歲壽皇崩兩宫隔絶中外洶洶留正棄宰相而去官僚幾欲解散居喪無主國命如髮汝愚不畏滅族決策立陛下風塵不搖天下復安社稷之臣也奈何無念功至意忽體貌常典使精忠巨節怫鬱黯暗何以示後世知臨安府徐誼素為汝愚所器凡有政務多咨訪之誼隨事禆助不避形迹又嘗勸汝愚早退及豫防托胄之姦托胄尤怨之及是與國子博士楊簡亦抗論留汝愚李沐劾為黨皆斥之時余端禮在樞府與汝愚同心輔政汝愚嘗曰士論未一非余處恭不能任及汝愚被逐端禮不能救但長吁而已處恭端禮字也三月丙戌朔日有食之庚寅太白經天夏四月丁巳太府寺丞吕祖儉奏言趙汝愚之忠韓托胄怒曰吕寺丞乃預我事耶祖儉乃上封事曰陛下初政清明登用忠良然曽未踰時朱熹老儒也彭龜年舊學也有所論列則亟許之去至於李祥老成篤實非有偏比蓋衆聼所共孚者今又終於斥逐臣恐自是天下有當言之事必將相視以為戒鉗口結舌之風一成而未易反是豈國家之利耶又曰今之能言之士其所難非在於得罪君父而在忤意權勢姑以臣所知者言之難莫難於論災異然言之而不諱者以其事不關於權勢也若乃御筆之降廟堂不敢重違臺諫不能深論給舍不敢固執蓋以其事關貴幸深慮乘間激發而重得罪也故凡勸導人主事從中出者蓋欲假人主之聲勢以漸竊威權耳比者聞之道路左右􅉏御於黜陟廢置之際間得聞者車馬輻湊其門如市恃權怙寵搖撼外庭臣恐事勢浸淫政歸幸門凡所薦進皆其所私凡所傾陷皆其所惡豈但側目憚畏莫敢指言而阿比順從內外表裏之患必將形見臣因李祥獲罪而深及此者是豈矯激自取罪戾哉實以士氣頺靡之中稍忤權臣則去不旋踵私憂過計深慮陛下之勢孤而相與維持宗社者寖寡也疏既上束擔待罪有旨祖儉朋比罔上送韶州安置中書舍人鄧驛繳奏祖儉不當貶內降祖儉意在無君罪當誅竄逐已從寬會樓鑰進讀吕公著元祐初所上十事因進曰如公著社稷臣猶將十世宥之祖儉乃其孫也今投之嶺外萬一即死陛下有殺言官之名臣竊惜之帝問祖儉所言何事人始知韶州之貶不出上意托胄謂人曰復有救祖儉者當處以新州衆乃不敢言或謂托胄曰自趙丞相去天下已切齒今又投祖儉瘴鄉不幸或死則怨益重曷若少徙內地托胄亦悟改送吉州己未以余端禮為右丞相鄭僑參知政事京鏜知樞密院事謝深甫僉書樞密院事庚申太學生楊宏中周端朝張衜林仲麟蔣傳徐範六人伏闕上書曰自古國家禍亂之由初非一端惟小人中傷君子其禍尤慘黨錮敝漢朋黨亂唐大率由此元佑以來邪正交攻卒成靖康之變臣子所不忍言陛下所不忍聞也近者諫官李沐論罷趙汝愚中外咨憤而沐以為父老歡呼蒙蔽天聼一至於此陛下獨不念去歲之事乎人情驚疑變在朝夕是時假非汝愚出死力定大義雖百李沐罔知攸濟當國家多難汝愚位樞府本兵柄指揮操縱何向不可不以此時為利今上下安妥乃有異意乎章頴李祥楊簡發於中激力辨其非即遭斥逐六館之士拂膺憤怨李沐自知邪正不兩立思欲盡覆正人以便其私於是託朋黨以罔陛下之聼臣恐君子小人消長之機於此一判則靖康已然之驗何堪再見於今日耶伏願陛下念汝愚之忠勤察祥簡之非黨灼李沐之回邪竄沐以謝天下還祥等以收士心疏上詔宏中等罔亂上書扇搖國是悉送五百里外編管天下號為六君子傳久居太學忠鯁有聞扣閽之事皆其屬藁中書舍人鄧驛言臣仰惟國家開設學校教飬士類德至渥也自建太學以來上書言事者無時無之纍朝仁聖相繼天覆海涵不加之罪甚者押歸本貫或他州聼讀而已紹熙間有布衣余古上書狂悖若以指斥之罪坐之誠不為過太上皇帝始者震怒降旨編管已而臣僚論奏竟從寬典陛下今日編管楊宏中等六人若以扇搖國是非之則未若指斥乘輿之罪大也以六輩言之則一夫為至寡也聖明初政仁厚播聞睿斷過嚴人情震駭所有録黃未敢書行是日知臨安府錢象祖捕諸生押送貶所未幾驛罷出知泉州癸亥金敕有司以增修曲阜宣聖廟工畢賜衍聖公以下三獻法服及登歌樂一部仍遣太常舊工往教孔氏子弟以備祭禮五月乙未金判平陽府事鎬王永中以罪賜死并及其二子初傅尉希望風旨過為苛細永中自以世宗長子且老矣動有掣制情思不堪殊鬱鬱乃表乞間居詔不許及鄭王永蹈以謀逆誅增置諸王司馬毬獵遊宴皆有制限家人出入皆有禁防河東提刑判官布嚕哈坐私謁永中杖一百解職同知西京留守費摩阿蘇坐受永中請託免先是永中舅張汝弼妻髙鄂屯以詛祝誅金主疑事在永中未有以發也會傅尉奏永中第四子阿里哈罕因防禁嚴密語涉不道詔同僉大睦卿府事牽御史中丞孫際康鞫問并求得第二子實圖梅所撰詞曲有不遜語家奴德格首永中嘗與侍妾瑞雪言我得天下子為大王以爾為妃詔遣官覆按狀同再遣禮部尚書張暐兵部侍郎烏庫哩慶裔覆之金主謂宰臣曰鎬王祇以語言得罪與永蹈罪異參知政事馬琪曰罪狀雖異人臣無將則一也遂令百官雜議皆曰請論如律詔賜永中死實圖梅阿里哈罕等皆棄市敕有司用國公禮收葬永中妻子威州安置戊戍詔戒百官朋比丙午詔諸路提舉司置廣惠倉六月丁巳復留正觀文殿大學士充醴泉觀使初程皓程頥傳孔孟之學其徒楊時傳之羅從彥從彥傳之李侗朱熹師侗致知力行其學大振流俗醜正多不便之遂有道學之名隂以攻詆及韓托胄用事士大夫素為清議所擯者教以凡與為異者皆道學之人疏姓名授之俾以次斥逐或又言道學何罪當名曰偽學善類皆不自安丁巳右正言劉德秀上言邪正之辨無過真與偽而已彼口道先生之言而行如市人所不為在興王之所必斥也昔孝宗鋭意恢復首務核實凡言行相違者未嘗不深知其姦臣願陛下以孝宗為法考核真偽以辨邪正詔下其章由是博士孫元卿袁燮國子正陳武皆罷司業汪逵入劄子辨之德秀以逵為狂言亦被斥癸酉以韓托胄為保寧軍節度使提舉萬壽觀是夏建昌軍民家木柱有聲如牛鳴者三日秋七月丁酉御史中丞何淡言頃歲有為專門之學者以私淑諸人為己任非不善也及其久也有從而附和之者有從而詆毁之者有畏而無敢竊議者附和之者則曰此致知格物精義入神之學而古聖賢之功用在是也一人唱之千百人和之幸其學之顯行則不問其人之賢否兼收而並蓄之以為此皆賢人也皆善類也皆知趨嚮者也則曰其説空虛而無補於實用其行矯偽而不近於人情一入其門而假借其聲勢小可以得名譽大可以得爵祿今日宦學之捷徑無以易此畏之而無敢竊議者則曰利其學者日繁而護其局者甚衆言一出口禍且及身獨不見某人乎因言其學而棄置矣又不見某人乎因論其人而擯斥矣彼欲以此箝人之口莫若置而不問臣嘗平心而論以為附和者或流而為偽詆毁者或失其為真或畏之而無敢竊議則真偽舉無所别矣是非何自定乎有人於此行乎閨門逹乎鄉黨其踐履可觀而不為偽行其學術有用而不為空言其見於事也正直而不私亷潔而無玷既不矯激以為異亦不詭隨以為同則真聖賢之道學也豈不可尊尚哉茍其學術之空虛而假此以蓋其短拙踐履之不篤而借此以文其姦詐或者又憑藉乎此以沽名譽而釣爵祿甚者屠沽贓穢士論之不齒而寅緣假託以借重則為此學之玷纍爾及人之竊議則不知自反又羣起而攻之曰彼其不樂道學也彼其好傷善類也彼此是非紛呶不已則為漢甘陵唐牛李國家將受其害可不慮哉臣聞紹興間諫臣陳公輔嘗言程頥王安石之學皆有尚同之弊髙宗皇帝親灑宸翰有曰學者當以孔孟為師臣願陛下以髙宗之言風厲天下使天下皆師孔孟有志於學者不必自相標榜使衆人得而指目亦不必以同門之故更相庇護是者從其為是非者從其為非朝廷亦惟是之從惟善之取而無彼此異同之説聼言而觀行因名而察實録其真而去其偽則人知勉厲而無敢飾詐以求售矣士風純而國是定將必由此帝是之詔榜於朝堂既而吏部郎官糜師旦復請考核真偽遷左司員外郎又有張貴模者指論太極圖亦被賞擢淡復上疏言在朝之臣熟知其邪迹然亦不敢自發以招報復之禍望明詔大臣去其所當去者詔趙汝愚落職罷祠己亥太白晝見九月丙戍熒惑入太微冬十月乙丑升秀州為嘉興府舒州為安慶府嘉州為嘉定府英州為英德府壬申封于恭為安定郡王金左丞相瓜爾佳清臣受命出師行尚書省事于臨潢府清臣偵知虛實自選精兵一萬進至合勒河前隊宣徽使伊喇敏等於栲栳濼攻營十四下之回迎大軍屬部斜出掩其所獲羊馬資物以歸清臣遣人責其賧罰北阻䪁由此叛去大侵掠十一月戊子金主罷清臣命右丞相襄代之初議征討清臣主其事既而領軍出征雖屢獲捷而貪小利遂至北邊不寧者數歲己丑雨土戊戌加上太皇太后皇太后太上皇太上皇后尊號丙午竄故相趙汝愚于永州初韓托胄忌汝愚必欲置之死以息人言用何淡疏落汝愚觀文殿大學士及宫觀監察御史胡紘遂上言汝愚倡引其徒謀為不軌乘龍授鼎假夢為符因條奏其十不遜且及徐誼詔責汝愚永州安置誼南安軍安置時汪義端當制遂用漢誅劉屈氂唐戮李林甫事迪功郎趙師古亦上書乞斬汝愚帝不從汝愚怡然就道謂諸子曰觀托胄之意必欲殺我我死汝曹尚可免也丁未命宰執大閲余端禮鄭僑言福建地狹人稠無以贍飬生子多不舉福建提舉宋之瑞乞免鬻建劔汀邵沒官田收其租助民舉子之費從之十二月戊午金禮部尚書張暐等進大金儀禮丁卯金應奉翰林文字同知制誥滏陽趙秉文上書論宰相胥持國當罷宗室守貞可大用金主召問言頗差異命知大興府事內族等鞫之秉文初不肯言詰其僕歷數交遊者秉文乃曰初欲上言嘗與修撰王庭筠御史周昂省令史潘豹鄭贊道高坦等私議庭筠等皆下獄決罰有差有司論秉文上書狂妄法當追解金主不欲以言罪人遂特免焉當時為之語曰古有朱雲今有秉文朱雲攀檻秉文攀人士大夫莫不耻之坐是久廢乙亥金詔加五鎮四瀆王爵煥章閣待制提舉南京鴻慶宫朱熹始以廟議自劾不許以疾再乞休致詔辭職謝事非朕優賢之意依舊祕閣修撰考異宋史寧宗紀是年十二月丙子命朱熹為煥章閣待制辭按朱熹傳煥章鴻慶之命在紹熙五年是年因乞休授祕閣修撰今從之是月金右丞相襄率駙馬都尉布薩揆等自臨潢進軍大鹽濼分兵攻取諸營金平章政事完顔守貞罷守貞剛忠明亮通習典故凡論對必傅經義時金有國七十年禮樂刑政多因舊制金主欲更定修正為一代法其儀式條約多守貞裁訂故明昌之治號稱清明又好接引善類以列朝廷為胥持國所忌罷去二年春正月金大鹽濼羣牧使伊埒圖等為翁吉喇特部兵所敗死之庚寅以余端禮為左丞相京鏜為右丞相謝深甫參知政事鄭僑知樞密院事何淡同知樞密院事趙汝愚行至衡州病作衡守錢鍪承韓托胄密諭窘辱百端庚子汝愚暴卒天下聞而寃之訃聞帝命追復元官許歸葬中書舍人吳宗旦繳還復官之命汝愚學務有用常以司馬光富弼韓琦范仲淹自期凡平昔所聞於師友如張栻朱熹吕祖謙汪應辰王十朋胡銓李燾林光朝之言欲次第行之未果而罷政初汝愚嘗夢孝宗授以湯鼎背負白龍升天後翼嘉王以素服即位讒者遂以為罪甲辰右諫議大夫劉德秀劾前丞相留正四大罪首言引用偽學之黨以危社稷詔正落職罷祠二月端明殿學士葉翥知貢舉與同知貢舉右正言劉德秀奏言偽學之魁以匹夫竊人主之柄鼓動天下故文風未能丕變乞將語録之類盡行除毁故是科取士稍涉義理者悉皆黜落六經語孟中庸大學之書為世大禁淮西總領張釜上言邇者偽學盛行賴陛下聖明斥罷天下皆洗心滌慮不敢為前日之習願明詔在位之臣上下堅守不變毋使偽言偽行乘間而入以壞既定之規模乃除釜尚書左司郎官辛未蠲臨安民身丁錢三年是月金初造虎符發兵三月己亥進封嘉國公柄為吳興郡王丙午有司上慶元會計録夏四月戊午金初行區種法民十五以上六十以下有土田者丁種一畝甲子左丞相余端禮罷時韓托胄擅權屏斥正士端禮鬱鬱不愜志稱疾罷政壬申以何淡參知政事吏部尚書葉翥僉書樞密院事五月乙酉申嚴獄囚瘐死之罰辛卯賜禮部進士鄒應龍以下四百九十九人及第出身是科得李道傳甲午減諸路和市折帛錢三年建華文閣藏孝宗御集甲辰更慈福宫曰壽慈六月丙子皇子埈生秋七月戊子量徙流人吕祖儉等於內郡祖儉移髙安尋卒髙安知縣徐應龍經紀其喪且為文誄之有勸之避禍者應龍曰吕君我所敬雖緣此獲譴亦所願也祖儉受業於兄祖謙尊信不渝韶州之謫朱熹與書曰熹嘗受上恩遇視羣小之為不能一言報效子約獨能發憤以蹈禍機熹愧生矣祖儉在謫所讀書窮理賣藥以自給每出必草履徒步為踰嶺之備嘗言因世變有所摧折失其素履者固不足言因世變而意氣有所加者亦私心也時中書舍人汪義瑞引唐李林甫故事以偽學之黨皆名士欲盡除之太皇太后聞而非之帝乃詔臺諫給舍論奏不必更及舊事務在平正以副朕建中之意詔下韓托胄及其黨皆怒劉德秀遂與御史張伯垓姚愈等上疏言繼自今舊姦宿惡或滋長不悛臣等不言則誤陛下之用人言之則礙今日之御劄若俟其敗壞國事如前日而後進言則徒有噬臍之悔三者皆無一而可望下此章播告中外令舊姦知朝廷紀綱尚在不至放肆從之乃改為不必專及舊事自是托胄與其黨攻治之志愈急矣殿中侍御史黃黼上言治道在黜首惡而任其賢使才者不失其職而不才者無所憾故仁宗嘗曰朕不欲留人過失於心此皇極之道也至於前事有合論列事體明證有關國家利害者臣不敢不以正對遂罷黼而以姚愈代之戊戌以韓托胄為開府儀同三司萬壽觀使八月丙辰太常少卿胡紘上書言比年以來偽學猖獗圖為不軌動搖上皇詆誣聖德幾至大亂賴二三大臣臺諫出死力而排之故元惡殞命羣邪屏迹自御筆有救偏建中之説或者誤認天意急於奉承倡為調停之議取前日偽學之姦黨次第用之或與宫觀或與差遣以冀幸其他日不至相報復往者建中靖國之事可以為戒陛下何未悟也漢霍光廢昌邑王賀一日而誅其羣臣一百餘人唐五王不殺武三思不旋踵而皆斃於三思之手今縱未能盡用古法宜令退伏田里循省愆咎遂詔偽學之黨宰執權住進擬自是學禁愈急大理司直邵褎然言三十年來偽學顯行場屋之權盡歸其黨乞詔大臣審察其所學詔偽學之黨勿除在內差遣已而言者又論偽學之禍乞監元佑調停之説杜其根源遂有詔監司帥守薦舉改官並於奏牘前聲説非偽學之人會鄉試漕司前期取家狀必令書以不是偽學五字撫州推官柴中行獨申漕司云自幼習易讀程氏易傳以收科第如以為偽不願考校士論壯之壬戍皇子埈卒追封兖王諡沖惠九月丁亥復分利州為東西路癸巳嗣濮王士歆卒追封韶王甲午流星晝隕冬十月甲戌大閲十一月戊戍金大赦改元承安十二月朱熹落職罷祠熹家居自以蒙纍朝知遇之恩且尚𢃄從臣職名義不容默乃草封事數萬言陳姦邪蔽主之禍因以明丞相趙汝愚之寃子弟諸生更進迭諫以為必且賈禍熹不聼蔡元定請以蓍決之遇遁之同人熹默然取藁焚之遂六奏力辭職名詔仍充祕閣修撰時臺諫皆韓托胄所引爭欲以熹為竒貨無敢發者胡紘未達時嘗謁熹於建安熹待學子惟脫粟飯遇紘不能異也紘不悅語人曰此非人情隻雞尊酒山中未為乏也及是為監察御史乃鋭然以擊熹自任物色無所得經年醖釀章疏乃成會改太常少卿不果有沈繼祖者為小官時嘗採托熹語孟之語以自售至是以追論程頥得為御史紘以疏草授之繼祖謂可立致富貴遂論熹資本回邪加以忮忍剽竊張載程頥之緒餘寓以喫菜事魔之妖術簧鼓後進張浮駕誕私立品題收召四方無行義之徒以益其黨伍相與褒衣博帶食淡餐粗或會徒於廣信鵝湖之寺或呈身於長沙敬簡之堂潛形匿迹如鬼如魅士大夫之沽名嗜利覬其為助者又從而譽之薦之因誣熹大罪有六其諸中冓曖昧之私盜竊攘奪之惡無所不至且目熹為大姦大憝乞加少正卯之誅以為欺君罔世汚行盜名者戒其徒蔡元定佐熹為妖乞編管别州詔熹落職罷祠竄元定於道州熹上表謝曰罪多擢髮分當兩觀之誅量極包荒姑示片言之貶逮復尋於白簡始知麗於丹書鐫延閣論撰之名輟真祠香火之奉兹為輕典允賴洪私捧戴奚勝感藏曷喻伏乞臣草茅賤品江海孤生蚤值明時已誤三朝之眷奬晚逢興運復叨上聖之深知召自藩維擢參帷幄略無可紀足稱所蒙暨逺去於朝行即永歸於農畝然猶賦之秩祿使庇身於卜祝之間置在清流容厠迹於圖書之府所宜恭恪或逭悔尤乃弗謹於尋章致自投於寬網果煩臺劾盡發隂私上瀆宸嚴交駭聞聼凡厥大譴大呵之目已皆不忠不孝之科至於衆惡之交歸亦乃羣情之共棄而臣憤眊初罔聞知及此省循甫深疑懼豈謂乾坤之造獨回日月之光略首從之常規既俾但書於薄罰稽眚終之明訓儻許卒遂其餘生是宜哀涕之易零已覺大恩之難報已而選人余嚞上書乞斬熹以絶偽學謝深甫抵其書於地語同列曰朱元晦蔡季通不過自相講明耳果何罪乎僅免窮治乃下竄旨於郡縣逮捕元定赴謫所甚急元定色不為動與季子沉徒步就道熹與從遊者百餘人餞别蕭寺中坐客興嘆有泣下者熹微視元定不異平時因喟然曰友朋相愛之情季通不挫之志可謂兩得之矣衆謂宜緩行元定曰獲罪於天天可逃乎杖履同其子沉行三千里腳為流血無幾微見於言靣至舂陵逺近來學者日衆州士莫不趨席下以聽講説愛元定者謂宜謝生徒元定曰彼以學來何忍拒之若有禍患亦非閉門塞竇所能避也貽書訓諸子曰獨行不愧影獨寢不愧衾勿以吾得罪故遂懈其志在道逾年卒元定生而頴悟父發博覽羣書以程氏語録邵氏經世張氏正蒙授元定曰此孔孟正脈也元定涵泳其義既長辨析益精登西山絶頂於書無所不讀於事無所不究著洪範解大衍詳説律吕新書行於世學者尊之曰西山先生初師朱熹熹叩其學大驚曰季通吾老友也不當在弟子列熹嘗曰造化微妙惟深於理者能識之吾於季通言而不厭也每諸生請疑必令先質元定而後為之折衷小人尤深嫉之故株連及禍韓托胄為其父誡請諡誡乃神宗外孫娶太皇太后女弟積官橫行未嘗更歷事任時黃唐為考功郎言其不可因求去遂命館職官暫權考功諡誡曰忠定金樞密使唐括貢率百官再請上尊號不許三年春正月壬寅知樞密院事鄭僑罷詔朱熹仍依前官與祠熹上表謝略曰臣惟知偽學之傳豈適明時之用頃叨任使已屢奏於罔功旋即便安復未能於寡過致煩重劾盡掎宿愆謂其習魔外之妖言履市㕓之汙行有母而嘗小人之食可驗恩衰為臣而髙不事之心足明禮闕以致私故人之財而納其尼女規學宫之地而改為僧坊諒皆考覆以非誣政使竄投而奚憾不虞恩貸乃誤保全第令少避於清班尚許仍居於散秩憗璽書之來下恍嵗律之還周視要囚詎止於旬時蓋存遷就逮數惡難從於末減猶聼循省口誦以還心銘敢墜二月己酉京鏜等上神宗玉牒髙宗實録金命襲封衍聖公孔元措世襲兼曲阜令三月庚子禁浙西州軍圍田壬寅詔自今有司奏讞死罪不當者論如律竄內侍王德謙帝即位德謙驟遷承宣使是春求建節帝許之德謙乃薦吳宗旦直學士院宗旦為德謙草制引天寶同光故事為比臺諫論宗旦交結德謙德謙為人求官贓動巨萬安置德謙汀州金親王百官再請上尊號不許夏四月丙午雨土封武功郎不􅀈為嗣濮王乙丑雨雹五月丙子金主集官吏於尚書省諭曰今紀綱不立官吏弛慢遷延茍簡習以成弊職官多以吉善求名計得自安國家何賴焉至於徇情賣法省部令史尤甚尚書省其戒諭之己丑金皇子生命禮部尚書張暐報祀髙禖六月戊辰頒淳熙寬恤詔令己卯金封皇子為壽王閏月甲戍內出銅器付尚書省毁之命申嚴私鑄器之禁甲午朝散大夫劉三傑免喪入見論奏今日之憂有二有邊境之憂有偽學之憂邊境之憂有大臣以任其責臣未敢輕論若夫偽學之憂姑未論其逺請以三十餘年以來而論之其始有張栻者談性理之學言一出口噓枯吹生人爭趨之可以獲利栻雖欲為義而學之者已為利矣又有朱熹者專於為利借大學中庸以文其姦而行其計下一拜則以為顔閔得一語即以為孔孟獲利愈廣而肆無忌憚矣然猶未有在上有勢者為之主盟已而周必大為右相欲與左丞相王淮相傾而奪之柄知此曹敢為無顧忌大言而能變亂黑白也遂誘而置之朝列卒藉其力傾去王淮而此曹愈得志矣其後留正之來雖明知此曹之非顧勢已成無可奈何反藉其黨與心腹至趙汝愚則素懷不軌之心非此曹莫與共事而此曹亦知汝愚之心也垂涎利祿甘為鷹犬以覬幸非望故或駕姍笑君父之説於鄰國或為三女一魚之符以惑衆庶甚至因雷風不時之變則引天動威以彰周公之德有如劉光祖因陛下未登極羣情洶洶之時則詐傳隆慈旨云但得趙家肉一塊足矣有如徐誼其他扇妖造怪不可勝數蓋前日之偽黨至此變而為逆黨矣賴陛下聖明去之之早此宗廟社稷無疆之福然今此曹潛形匿影日夜伺隙雨暘稍愆則喜見顔色聞敵國侵擾之報則移於吾之君父此如鬼蜮百方害人防之不至必受其禍臣謂今日之策惟當銷之而已其習偽深而附逆固者自知罪不容誅終不肯為國家用其他能革心易慮則勿遂廢斥使之去偽從正以銷今日之憂疏入韓托胄大喜即日除三傑右正言留正貶邵州居住是夏廣東提舉徐安國遣人捕私鹽于大奚山島民遂作亂秋七月壬寅朔金主詣天長觀建普天大醮禁屠宰七日無奏刑百司權停決罰八月辛卯知廣州錢之望遣兵入大奚山盡殺島民金胥持國為金主信任與淑妃李氏擅朝政張復亨等十人趨走其門俱為御史臺官時謂之胥門十哲至是為言者所論持國致仕十人皆外補未幾復召持國參知政事冬十月癸酉雷丁亥金皇子壽王卒十一月辛丑加諡孝宗曰紹統同道冠德昭功哲文神武明聖成孝皇帝太皇太后吳氏崩于壽慈宫年八十三遺詔太上皇帝疾未痊宜於宫中承重皇帝服齊衰五月后實以辛卯崩時郊祀期迫或謂韓托胄曰上親郊不可不成禮且有司所費既夥奈何已之托胄入其言甲辰祀圜丘乙巳始發喪詔服期年及托胄誅以劉光祖言乃改從本旨丁未遣趙介使金告哀十二月丙子始御正殿甲申雷雨土丁酉知綿州王沆上疏乞置偽學之籍仍自今曽受偽學舉薦關升及刑法亷吏自代之人並令省部籍記姓名與間慢差遣從之於是偽學逆黨得罪著籍者宰執則有趙汝愚留正周必大王藺四人待制以上則有朱熹徐誼彭龜年陳傅良薛叔似章頴鄭湜樓鑰林大中黃由黃黼何異孫逢吉十三人餘官則有劉光祖吕祖儉葉適楊芳項安世李􅐉沈有開曽三聘遊仲鴻吳獵李祥楊簡趙汝讜趙汝談陳峴范仲黼汪逵孫元卿袁燮陳武田淡黃度詹體仁蔡幼學黃灝周南吳柔勝王厚之孟浩趙鞏白炎震等三十一人武臣則有皇甫斌危仲壬張致逺三人士人則有楊宏中周端朝張道林仲麟蔣傳徐範蔡元定吕祖泰八人共五十九人時黃由尚為吏部侍郎言人主不可待天下以黨與不必置籍以示不廣殿中侍御史張巖劾由附阿罷之擢沆為利州路轉運判官金左諫議大夫高汝勵上言國家置諫臣以備侍從蓋欲周知時政以參得失非徒使排行就列而已故唐制凡中書門下及三品以上入閣必遣諫官隨之俾與聞政事冀其有所開説今臺省以下遇朝奏事則一切迥回避與諸侍衛之臣旅進旅退殿廷論事初莫得聞及其已行又不詳其始末遂事而諫斯亦難矣顧諫職為何如哉若曰非材擇人可也豈可置之言責而疏逺若此自今以往有司奏事諫官得以預聞庶望少補從之資治通鑑後編卷一百三十
