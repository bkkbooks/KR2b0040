body:
  text: 資治通鑑後編卷四十刑部尚書徐乾學撰宋紀四十起昭陽作噩正月盡十二月凡一年仁宗體天法道極功全德神文聖武睿哲明孝皇帝明道二年春正月戊寅罷館閣讀書己卯詔發運使以上供米百萬斛振江淮飢民癸未詔三司鑄明道元寶錢二月戊戌司天監言含譽星見東北方其色黃白上有光芒長二尺然觀者皆以為彗云庚子詔江淮民飢死者官為葬祭先是南方大旱人多流亡因飢成疫氣死者十二三官雖作粥糜以飼之然得食輒死村聚墟里幾為之空乙巳皇太后服衮衣儀天冠饗太廟為初獻皇太妃亞獻皇后終獻是日上皇太后尊號曰應元齊聖顯功崇德慈仁保夀皇太后丁未祀先農行籍田禮侍中奉耒進御帝秉耒三推禮儀使張士遜奏禮畢帝曰朕既躬耕不必泥古禮願終畝以勸天下士遜固請乃耕十有二畦而止三公以下咸推盡壠悉過五推之數禮成御正陽門大赦百官上尊號曰睿聖文武體天法道仁明孝德皇帝辛亥帝作籍田詩賜近臣三月庚寅以皇太后不豫大赦除常赦所不原者募天下善醫馳傳赴京師乾興以來貶死者復其官謫者皆內徙丁謂特許致仕甲午皇太后崩于寶慈殿遺詔尊太妃為皇太后軍國大事與太后內中裁處賜諸軍緡錢乙未帝御皇儀殿之東楹號慟見輔臣曰太后疾不能言而猶數引其衣若有所屬何也參知政事薛奎曰其在衮冕也服之何以見先帝乎帝悟以后服斂命吕夷簡為山陵使既宣遺誥閣門趣百官賀太后于內東門御史中丞蔡齊目臺吏毋追班入白執政曰上春秋長習知天下情偽今始親政豈宜使女主相繼稱制乎遂罷預政是月溫普奇囚嘉勒斯賚於穽中而出兵收不附己者守穽人出之嘉勒斯賚因集部衆討殺溫普竒而徙居青唐皇太后既崩左右有以宸妃事聞者考異通鑑續編云荆王元儼為帝言帝始知為宸妃所生號慟纍日不絶夏四月壬寅追尊宸妃為皇太后甲辰詔改葬于永定陵以大行皇太后山陵五使並兼追尊皇太后園陵使或言太后死非正命喪不成禮帝亦疑焉因易梓宫帝遣李用和視之則容貌如生服飾嚴具用和入告帝歎曰人言其可信哉遇劉氏加厚考異改葬易梓宫李用和視之據龍川别志邵伯溫見聞録乃云上親視之蓋不然也戊申帝聽改於崇政殿西廂己酉罷乾元節上夀庚戌以流人林獻可為三班奉職明道初獻可抗言請皇太后還政太后怒竄嶺南至是特録之壬子羣臣上表請御正殿不允表三上乃從之詔內外毋得進獻以祈恩澤及緣親戚通章表罷創修寺觀帝始親政裁抑僥幸中外大悅癸丑召知應天府宋綬通判陳州范仲淹赴闕初大行皇太后稱制宦者江德明羅崇勳楊餘懿張懷信武繼隆任守忠蔡舜卿等交通請謁權寵頗盛參知政事薛奎言不遂斥逐恐階以為亂帝從之己未吕夷簡張耆夏竦陳堯佐范雍趙稹晏殊俱罷初荆王子養禁中既長夷簡請出之太后欲留使從帝誦讀夷簡曰上富春秋非親儒學之臣恐無益聖德即日命還邸帝始親政夷簡手疏陳八事曰正朝綱塞邪徑禁賄賂辨佞壬絶女謁踈近習罷力役節冗費其語甚切帝與夷簡謀以耆竦等皆太后所任用欲悉罷之退告郭皇后后曰夷簡獨不附太后耶但多機巧善應變耳由是并罷夷簡及宣制夷簡方押班聞唱其名大駭不知其故而夷簡素厚內侍副都知閻文應因使為中詗久之乃知事由皇后云宰臣張士遜加詔文館大學士李迪同平章事王隨參知政事李咨為樞密副使王德用為僉書樞密院事始太后臨朝有求內降補軍吏者德用曰補吏軍政也不可與太后固欲與之卒不奉詔乃止興國寺東火近張耆宅耆乞兵防護德用不遣太后崩有司請衛士坐甲德用曰故事無為太后喪坐甲者又不奉詔帝閲太后閣中得德用前奏軍吏事竒之以為可大用故擢任樞密德用謝曰臣武人幸得以馳驅自效賴陛下威靈待罪行間足矣且臣不學不足以當大任帝遣使者趣入院以權御史中丞蔡齊為龍圖閣學士權三司使事天章閣侍制范諷為右諌議大夫權御史中丞時有飛語傳荆王元儼為天下兵馬都元帥者捕得繫獄逮及數百人帝怒使齊按之齊曰此小人無知不足治且無以安荆王一夕三疏帝大悟止笞數人而已先是諷出知青州時山東旱蝗前宰相王曽家多積粟諷發取數千斛濟飢民因請遣使安撫於是以御史中丞召其在青州不逾嵗也以范仲淹為右司諌仲淹初聞遺詔以太妃為皇太后參決軍國事上疏言太后母號也自古無因保育而代立者今一太后崩又立一太后天下且疑陛下不可一日無母后之助矣時已刪去參決等語然太后之號訖不改止罷其册命而已降殿中丞知吉州方仲弓為太子中舍監豐國監初仲弓請依唐武后故事立劉氏七廟太后見其奏怒曰吾不作此負祖宗事裂而擲之猶用是得知吉州帝以纍更赦宥止薄責焉壬戌始御崇政殿癸亥上大行皇太后諡曰莊獻明肅舊制后皆二諡稱制加四諡自此始追尊李太后諡曰莊懿五月丁卯判河南府錢惟演請以莊獻莊懿皇太后並祔真宗之室詔太常禮院詳定以聞惟演既罷景靈宫使還河南不自安乃建此議以希帝意戊辰詔禮部貢舉辛未以屯田員外郎龎籍為殿中侍御史籍奏請下閣門取垂簾儀制盡焚之又奏陛下躬親萬幾用人宜辨邪正防朋黨勿使受恩人主歸感權臣進擢近列願采公論毋令出於執政孔道輔嘗謂人曰言事官多觀望宰相意獨龎君可謂天子御史也癸酉詔曰大行皇太后保佑沖人十有二年恩勤至矣而言者罔識大體務詆訐一時之事非所以慰朕孝思也其垂簾日詔命中外毋輒以言始太后稱制雖政出宫闈而號令嚴明恩威加天下左右近習亦少所假借宫掖間未嘗妄改作內外賜與皆有節賜族人御食必易以扣器曰尚方器勿使入吾家也常服絁𥜗練裙侍者見帝左右簮珥珍麗欲效之太后戒曰彼皇帝嬪御飾也汝安得學晚稍進外家任內官羅崇勳江德明等訪外事崇勳等以此勢傾中外又以劉從德故絀曹修古等然太后保護帝既盡力而帝所以奉太后亦甚備及太后崩言者多追斥垂簾時事左司諌范仲淹言於帝曰太后受遺先帝保佑聖躬十餘年矣宜掩其小過以全大德帝大感悟乃降是詔丙子命宰臣張士遜撰籍田及恭謝太廟記以翰林學士馮元為編官直史館宋祁為檢討官既而祁言皇太后謁廟非後世法乃止撰籍田記帝始召宋綬將大用之為張士遜所沮丁丑以綬為翰林侍讀學士兼龍圖閣學士判都省六月甲午朔日有食之壬寅録周世宗及高季興李煜孟昶劉繼元劉鋹後辛亥太子少傅致仕孫奭卒帝謂張士遜曰朕方欲召奭還而奭遂死矣嗟惜久之罷朝一日贈左僕射諡曰宣奭以醇德奧學勸講禁中二十餘年朝廷典禮俱屬討論必取前代中正合彛法事類而陳之故政府奉行無疑當真宗封禪時舉朝皆歌誦盛德奭獨正言諌諍不少阿比晚節勇退優遊里中始終全德近世少儔性方重事親篤孝父亡舐其面以代頮疾甚徙正寢屏婢妾謂其子瑜曰無令我死婦人之手也初以錢惟演議下禮院禮院言夏商以來父昭子穆皆有配坐每室一帝一后禮之正儀開元肅明皇后始有並祔惟演引唐武宗母韋太后祔穆宗本朝孝明孝章祔太祖故事按穆宗惟以韋太后配太祖未嘗以孝章配伏尋先帝以懿德配饗太宗及明德園陵禮畢遂得升祔元德自追尊後凡十七年始克升配今莊穆著位長秋祔食真宗斯為正禮莊獻母儀天下與明德例同若從古禮止應祀后廟莊懿帝母之尊與元德例同若便升祔似非先帝慎重之意况前代無同日並祔之文惟上裁之詔都省與禮院議皆以為莊穆位崇中壼與懿德有異己祔真廟自協一帝一后之文莊獻輔政十年莊懿誕育聖躬德莫與並退就后廟未厭衆心按周禮大司樂職奏夷則歌小吕以饗先妣者薑嫄也帝嚳之妃后稷之母特立廟而祭謂之閟宫宜於太廟外别立新廟奉安二后神主同殿異室嵗時薦饗用太廟儀别立廟名自為樂曲以崇世饗忌前一日不御正殿百官奉慰著之甲令詔從之己未命權知開封府程琳內侍副都知閻文應度地營建新廟秋七月丁五詔知富平縣事張龜年增秩再任以其治行風告天下癸未降知永興軍陳堯佐知廬州為狂人王文吉所誣也堯佐罷政過鄭文吉挾故怨告堯佐謀反帝遣中官訊問復以屬御史臺中丞范諷夜半被旨詰旦得其誣狀上之堯佐猶坐是左降時復有誣諌官隂附宗室者宰相張士遜置二奏帝前且言憸人誣陷良善以搖朝廷若一開姦萌臣亦不能自保帝悟置大吉于法誣諌官事亦寢時孫祖德知諫院范仲淹為左司諌不知宗室謂誰當考先是右司諌范仲淹以江淮京東災傷請遣使循行未報仲淹請問曰宫掖中半日不食當如何今數路艱食安可置而不恤甲申命仲淹安撫江淮所至開倉廩賑乏絶禁淫祀奏蠲廬舒折役茶江東丁口鹽錢飢民有食烏昧草者擷草進御請示六宫貴戚以戒侈心又陳八事其一曰祖宗時江淮饋運至少而養六軍又取天下今東南漕米嵗六百萬石至於府庫財帛皆出于民加之飢年艱食如此願下各有司取祖宗嵗用之數校之則奢儉可見矣其二曰國家太平垂三十年暴斂未除濫賞未革近年赦宥既頻賞給復厚聚於艱難散於容易願推求典禮無數肆赦推賞且祖宗欲復幽薊故謹內藏務先豐財庶於行師之時不擾於下今橫為隳費或有急難將何以濟其三曰天之生物有時而國家用之無度天下安得不困江淮兩浙諸路嵗有饋糧于租稅外復又入糴計東南數路不下二三百萬石故雖豐年穀價亦高官以傷財民且乏食至于造舟之費及饋運兵未給受賞與每嵗又五七百萬緡故郡國之民率不暇給商賈無還禆販失業在京榷務課程日削國家以饋運數廣謂之有偹然冗兵冗吏遊惰工作充塞京都臣至淮南道逢羸兵自言三十人自潭州挽新船至無為軍在道逃死止存六人去湖南猶四千餘里六人者比還本州尚未知全活乃知饋運之患不止傷財其害人如此今宜銷冗兵削冗吏禁遊惰減工作既省京師用度然後減江淮饋運租稅上供之外可罷髙價入糴則東南嵗省官錢數百萬緡或上京實府庫或就在所給還商旅商旅通行則𣙜貨務所入漸廣國用不乏東南罷糴則米價不起商人既通則入中之法可以兼行矣其四曰國家重兵悉在京師而軍食仰於度支則所養之兵不可不精也禁軍代回五十以上不任披帶者降為畿內及陳許等處近下禁軍一卒之費嵗不下百千萬人則百萬緡矣七十嵗乃放停鄉園改易骨肉淪謝羸老者歸復何託是未停之前大蠧國用既廢之後復傷物情請下所司禁軍選不堪披帶者與本鄉州軍别立就糧指揮至彼有田園骨肉許之歸農則羸老之人亦不至失所矣其五曰沿邊市馬嵗幾百萬緡罷之則絶戎人行之則困中國今馬至京師宜多鬻於民間假其芻牧或有邊用一呼可集又重稅以禁江淮小馬勿使至近裏州軍則西北之馬可行外慰戎心內為武備且減芻秣以億萬計其六曰江淮發運使嵗漕六百餘綱省員殿侍並以嵗勞改班行若國家稍節用度則可減綱運酬奬之人其七曰百司流外日以增冗諸館人吏宜一歸崇文院而罷招置三五年可去其半其餘並移補諸司其八曰真州建長蘆寺役兵之糧已四萬斛棟宇像塑金碧之資又三十萬緡施之於民可以寬重斂施之於士可以增厚祿施之於兵可以拓舊疆矣自今願常以土木之勞為戒上嘉納之考異仲淹正傳云上救敝十事而不載事目今從附傳及奏議所上止八事不知正傳何據也今不取戊子詔以蝗旱去尊號睿聖文武四字仍令中外直言闕政先是帝遣曹琮如契丹告哀章得象致物八月甲午朔契丹使耶律壽寧等來祭奠弔慰丙申以太常丞永新劉沆直集賢院沆前同判舒州莊獻太后建資聖浮屠內侍張懷信挾詔命督役嚴急州將至移疾不敢出沆奏罷懷信歸贈工部員外郎曹修古為右諌議大夫修古鯁直有風節當莊獻時權幸用事人人顧望畏忌而修古遇事輒言無所回撓初論馬季良錢曖忤太后旨貶同判杭州未行改知興化軍卒于官貧不能歸葬賓佐賻錢五十萬季女泣白其母曰奈何以是纍吾先人也卒拒不納帝思修古忠故優贈之仍賜其家錢二十萬修古無子録其壻劉勳為試將作監主簿壬寅名莊獻明肅太后莊懿太后新廟曰奉慈癸卯詔凡除轉運使及藩鎮邊郡守臣自今並許上殿奏事甲辰詔中外毋避莊獻明肅太后父諱壬子宰臣張士遜等言比諸道旱蝗請用漢故事册免蒙賜詔不許今陛下既減損尊名願各降官一等以塞天異帝慰勉之丁巳置端明殿學士以翰林侍讀學士宋綬為之三司言自籍田後繼有賞賫用度不足請假於內藏庫庚申出緡錢百萬賜之帝謂張士遜曰國家錢本無內外蓋以助經費耳自是嵗歉或調發則出內藏以濟之九月丙寅崇信節度使同平章事判河南府錢惟演罷還本鎮初惟演欲為自安計首建二后並配議既與劉美為親又為其子曖娶郭皇后妹至是又欲與莊懿太后族為婚御史中丞范諷劾奏惟演擅議宗廟又言惟演在莊獻時權寵太盛且與后族連姻請行降絀帝不聽諷袖告身對曰陛下不聽臣言臣今奉使山陵而惟演守河南臣朝暮憂刺客願納此不敢復為御史中丞矣帝不得已可之諷乃趨出丁卯復奪曖一官聽隨惟演行諸子皆補外州監當甲戌幸洪福院臨莊懿太后梓宫丙子壬午臨如之丁丑詔國忌日罷佛像前設神御壬午莊獻明肅皇太后靈駕發引帝顧輔臣曰朕欲親行執紼之禮以申孝心乃引紼行哭出皇儀殿門禮官固請而止遣奠正陽門外遂詣洪福院服素紗幞頭淡黃衫從官常服黑帶奉引莊懿太后梓宫遣奠廷中皆改衰服奉辭隨梓宫攀號不已左右固請止帝泣曰劬勞之恩終身何所報乎步送至院西南隅仗轉乃還冬十月知諌院孫祖德言護國節度使兼侍中張耆建樓於私第下瞰社稷祠壇請毁撤之詔可丁酉祔葬莊獻明肅皇太后莊懿皇太后于永定陵甲辰詔兩川嵗貢綾錦羅綺之屬以三之二易為紬絹供軍須時帝富于春秋左右欲以巧自媚後苑珠玊之工頗盛殿中侍御史龎籍言今螽螟為災民憂轉死北有耶律西有拓拔陛下安得不以儉約為師奢靡為戒重惜國費以徇民之急帝深納其言己酉祔莊獻明肅太后莊懿太后主于奉慈廟辛亥帝諭輔臣曰近嵗進士所試詩賦多浮華而學古者或不得以自進宜令有司兼以策論取之以司封員外郎祕閣校理吳遵路為開封府推官始莊獻太后稱制遵路條奏十餘事語皆切直忤太后意出知常州遵路至常即令轉市吳中米以備嵗儉已而果大乏食民賴以濟自他郡流至者亦十全八九范仲淹按撫淮南薦遵路為郡得古人之風乞以遵路救災事迹頒諸州為法并付史館遵路淑子也癸丑下德音降東西京囚罪一等徒以下釋之緣二太后陵應奉民戶免租賦科役有差戊午張士遜罷為左僕射判河南府樞密使楊崇勳罷為河南三城節度使同平章事判許州先事天下蝗旱仍見士遜居首相不能有所建明帝頗復思吕夷簡及百官詣洪福院上莊獻太后諡册退而奉慰士遜乃過崇勳園飲酒日中不至羣臣離立以俟御史中丞范諷劾奏之遂與崇勳俱罷以判陳州吕夷簡同平章事知河南府王曙充樞密使僉書樞密院事王德用為樞密副使端明殿學士刑部侍郎宋綬參知政事權三司使蔡齊為樞密副使庚申詔自今每日御前殿視事帝即位之初尚循真宗晚年故事惟隻日御殿至是始復舊制自唐以來民計田諭賦外增取他物復析為賦謂之雜變亦謂之沿納名品煩細官司嵗附帳籍並緣侵擾民以為患帝既躬耕籍田因詔三司沿納物以類併合于是三司請悉除諸名品併為一物夏秋嵗入第分粗細二色百姓便之十一月癸亥朔禮部侍郎參知政事薛奎罷為資政殿學士戶部侍郎判都省始莊獻崩二府大臣皆罷去奎獨留帝且倚以為相而奎得喘疾數辭位有詔免朝謁視事如故又數賜告還第久之乃罷以龍圖閣待制孔道輔為右諌議大夫權御史中丞詔增宗室俸乙丑追册美人張氏為皇后甲戌贈冦凖中書令復萊國公其壻屯田員外郎張子皋復直史館仍令齎詔賜其家祭酹之戊寅以大理評事劉渙為右正言初渙上疏莊獻太后請還政太后怒議黥面配白州屬太后疾革宰相吕夷簡故為稽留不即行至是渙以前疏自言夷簡請褒擢帝既用渙顧謂夷簡曰向者樞密院亟欲投竄賴卿以免夷簡謝曰渙疏外敢言大臣或及此則太后必疑風旨自陛下使母子不相安矣帝喜以夷簡為忠己卯徙判天雄軍王曽判河南府始陳堯咨與曽有隙曽實代堯咨於天雄政有不便者徐更之彌縫不見其迹及去堯咨復繼曽後見府署及什器皆因堯咨舊規但完葺無所改嘆曰王公宜其為宰相我度量誠不及也己丑以度支判官刑部郎中章頻兼侍御史知雜事頻奉使契丹未還尋卒于紫濛館契丹遣內侍就館奠祭命接伴副使吳克荷護其喪以錦車駕橐駝載至中京斂以銀飾棺又具鼓吹羽葆吏士持甲兵衛送至白溝詔遣其子訪乘傳扈柩歸仍以知雜誥賜其家録子婺州司理參軍詢為大理寺丞訪為三班奉職十二月丙申帝謂輔臣曰朕每退朝凡天下之奏必親覽之吕夷簡曰若小事皆關聽覽恐非所以輔養聖神帝曰朕承先帝之託况以萬幾之重敢自泰乎又曰朕日膳不欲事珍美衣服多以縑繒為之至屢經浣濯而宫人或以為笑大官進膳有蟲在食器中朕掩而不言恐罪及有司也始天聖六年罷諸路提點刑獄官八年復置又權停於是帝謂輔臣曰諸路刑獄既罷提點官轉運司不能一一躬往讞問恐浸致寃濫宜選賢明亷幹不生事者委任之乃復置諸路提點刑獄官仍參用武臣丁酉詔諸路轉運司副嵗遍歷所部止許以兩吏自隨仍委諸州軍具所至月日以聞甲辰以京東飢出內藏庫絹二十萬下三司代本路上供之數丁未出侍御史張沔知信州殿中侍御史韓瀆知嶽州先是宰相李迪除二人為臺官既數月吕夷簡復入因議其事於帝前帝曰祖宗法不可壞也宰相自用臺官則宰相過失無敢言者矣迪等皆惶恐遂出沔瀆仍詔自今臺官有缺非中丞知雜保薦者毋得除授戊申出宫人二百帝時屢出宫人吕夷簡曰此聖朝美事然民間物貴恐出宫人或有失所者亦宜念之帝因曰曩者太后臨朝臣僚戚屬多進女口入宫今已悉還其家矣初郭皇后挾莊獻太后勢頗驕後宫為莊獻所禁遏希得進及莊獻崩帝稍自縱宫人尚氏楊氏驟有寵后性妬屢與忿爭尚氏嘗於帝前語侵后后不勝忿起批其頰帝自起救之后誤批帝頸帝大怒有廢后意內侍副都知閻文應白帝出爪痕示執政近臣吕夷簡以前罷相故怨后而范諷方與夷簡相結諷乘間言后立九年無子大義當廢夷簡贊其言帝意未決外人籍籍頗有聞者右司諌范仲淹因對極陳其不可居久之乃定議廢后夷簡先敕有司無得受臺諌章疏己卯詔封為淨妃玊京沖妙仙師賜名清悟别居長寧宫臺諌章疏皆不得入仲淹即與權御史中丞孔道輔率知諌院孫祖德侍御史蔣堂郭勸楊偕馬絳殿中侍御史段少連左正言宋郊右正言劉渙伏閣爭之守殿門者闔扉不為通道輔手撫銅環大呼曰皇后被廢奈何不聽臺諌入言尋詔宰相召臺諌諭以皇后當廢狀道輔等悉詣中書語夷簡曰人臣之於帝后猶子事父母也父母不和固宜諌止奈何順父出母乎衆譁然爭致其説夷簡曰發后有漢唐故事道輔及仲淹曰人臣當道君以堯舜豈得引漢唐失德為法夷簡不能答道輔與仲淹等退將以明日留百官揖宰相廷爭而夷簡即奏臺諌伏閣請對非太平美事乃議逐道輔等丙辰旦道輔等始至待漏院詔道道輔出知泰州仲淹知睦州祖德等各罰銅二十斤故事罷中丞必有告辭至是直以敕除道輔比還家敕隨至又遣使押道輔及仲淹亟出城仍詔諌官御史自今毋得相率請對絳偕奏乞與道輔仲淹俱貶勸及少連再上疏皆不報考異正史實録並云范諷權御史中丞按廢后時諷罷中丞兩月矣當云權三司使又恐諷前有此議今沒其官而不書庶不相抵牾郭勸傳云郭后廢議納陳氏勸進諫曰家以御天下自后妃始郭氏非有大故不當廢陳氏無世不可儷宸極疏入后已廢而陳氏議遂寢按議納陳氏在明年秋不與廢郭后同時今不取將作鹽丞簽判河陽富弼上疏曰郭皇后自居中宫不聞有過陛下忽然廢斥物議騰涌自太祖太宗真宗三后撫國凡七十年未嘗有此陛下為人子孫不能守祖考之訓而遂有廢后之事治家尚不以道奈天下何范仲淹為諌官所極諌者乃其職也陛下何故罪之假使所諌不當猶須含忍以招諌諍况仲淹所諌大愜衆心陛下乃縱私忿不顧公議取笑四方臣甚為陛下不取也昔莊獻臨朝陛下受制事體大弱而莊獻不敢行武后故事者蓋賴一二忠臣救護之今陛下始獲暫安遂忘舊日忠臣羅織其罪而譴逐之陛下以萬乘之尊廢一婦人甚為小事然所損之體則極大也夫廢后謂之家事而不聽外臣者此乃唐姦臣許敬宗李世績諂佞之辭陛下何足取法且莊獻莊懿山陵始畢墳土未乾便以色欲之心廢黜后氏不告宗廟陛下舉一事而獲二過於天下廢無罪之后一也逐忠臣二也此二者皆非太平之世所行臣實痛惜之又曰仲淹以忠直不撓莊獻時論冬仗事大正君臣之分陛下以此擢用之既居諌列聞纍曽宣諭使小大之事必諌無得有隱是陛下欲聞過矣雖古先聖哲亦無以過今仲淹聞過遂諌上副宣諭之意而反及於禍是陛下誘而陷之不知自今何以使臣雖日加宣諭諌臣以仲淹為戒必不信矣今廢后已行雖未可悔願且追還仲淹復其諌職疏入不報時仍嵗旱蝗執政謂宜有變更以導迎和氣丁巳詔改明年元曰景祐考異歐陽修歸田録云明道犯契丹諱故遽改恐誤契丹主隆緒者明記子雖諱明然不應二年始改要是契丹初不問年號但趙元昊以明字犯其父名故輒稱顯道契丹事則未間今止從詔語禁邊臣增置堡寨參知政事王隨言淮南積鹽一千五百萬石至無屋以貯露積苫覆嵗以損耗又亭戶輸鹽得本錢或無以給故亭戶貧困往往起為盜賊其害如此願得權聽通商三五年使商人入錢京師又宜置折博務于揚州使輸錢及粟帛計直豫鹽一石約售錢二千則一千五百萬石可得緡錢二千萬以資國用初范仲淹安撫江淮亦以疏通鹽利為言至是遂詔宋綬張若谷丁度與三司使江淮制置使同議可否皆以為聽通商則恐私販肆行侵蠧縣官請敕制置司監造船運至諸路使皆有二三年之畜復天禧元年制聽商人入錢粟京師及淮浙江南荆湖州軍易鹽在通泰楚海真楊漣水髙郵貿易者毋得出城餘州聽詣縣鎮毋至鄉村其入錢京師增鹽豫之并敕轉運司經畫本錢以償亭戶詔皆施行是嵗契丹改元重熙上太后號曰儀天皇太后資治通鑑後編卷四十
