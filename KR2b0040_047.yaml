body:
  text: 資治通鑑後編卷四十七刑部尚書徐乾學撰宋紀四十七起上章執徐五月盡十二月凡八月仁宗體天法道極功全德神文聖武睿哲明孝皇帝康定元年五月甲寅朔詔前殿奏事毋過五班餘對後殿命太官賜食乙卯再贈金明都監李士彬為宿州觀察使仍以其從兄內殿承制士紹為金明縣都監兼新寨解家河蘆關巡檢又贈其子懷寶為右千牛衛將軍録其子懷義懷矩並為左侍禁士彬父子正月戰死未嘗贈官也此云再贈疑實録或有脫闕也丁巳復太常博士知楚州孫沔為監察御史景祐初沔為御史裏行坐言事貶絀逾六年乃復召尋遷右正言先是詔御輦院㨂部下輦官年四十以下為禁軍輦官千餘人攜妻子遮宰相樞密使喧訴平章事張士遜方朝馬驚墮己未御史中丞栁植等奏其事請付有司治詔樞密院推鞫以聞時軍興機務填委士遜位首相無所補諌官以為言士遜不自安七上章請老又數面陳壬戌復拜太傅進封鄧國公致仕聽朔望大朝會綴中書門下班月給宰臣俸三之一又與一子五品服士遜乞免朝朔望從之宰相得謝者自士遜始考異士遜新傳云諌官韓琦上疏曰政事府豈養病坊耶士遜不自安七上章請老按士遜致仕琦已知制誥矣琦家傳及它書養病坊等語亦不指士遜附傳又不載琦有言新傳必誤今不取以鎮安節度使同平章事判天雄軍吕夷簡行右僕射兼門下侍郎平章事昭文館大學士以資政殿大學士户部尚書李迪為彰信節度使知天雄軍自元昊反武事久弛守將或為他名以避兵任迪願守邊詔不許然甚壯其意夷簡自天雄復入相即使迪代之權三司使公事鄭戬言國家承平八十載不用兵四十年生齒之衆山澤之利當十倍其初而近嵗以來諸道轉運使副公上輸入之目反益減耗若恬然不較則軍國常須將何取辦今後欲乞應諸道轉運使副得替到京别差近上臣僚與審官院同磨勘將任內諸處場務所收課利與租額近年都大比較除嵗有荒别敕權閣不比外其餘悉取大數為十分每虧五釐以下罰兩月俸一分已下罰三月俸一分已上降差遣若增及一分以上亦别與升陟從之甲子元昊陷塞門寨執寨主內殿承制髙延德監押左侍禁王繼元死之壬申詔諸路轉運司體量部下知州軍有年老昏昧貪濁踰違及非幹勒者具事以聞癸酉詔夏守贇王守忠進屯鄜州時大軍駐河中踰三月矣甲戍陜西都轉運使范仲淹言今緣邊城寨有五七分之備而關中之備無二三分若昊賊深入乘關中之虛或東阻潼關隔兩川貢賦則朝廷不得髙枕矣為今之計莫若且嚴邊城使持久可守實關內使無虛可乘若冦至使邊城清野不與大戰關中稍實豈敢深入復命五路修攻取之備待其間隙則行天討此上策也又聞邊城多請五路入討臣恐未可以輕舉太宗朝以宿將精兵圵伐西討艱難嵗月終未收復緣大軍之行糧車甲乘動彌百里虜騎輕捷邀擊前後乘風揚沙一日數戰進不可前退不可息水泉不得飲沙漠無可獲此所以無功而有患也况今承平嵗久中原無宿將精兵一旦興深入之謀係難制之虜臣以為國之安危未可知也然則唐漢之時能拓疆萬里者蓋當時授任與今不同既委之以兵又與之稅賦而不求速效故養猛士延謀客日練兵月計餉以待其隙進不俟朝廷之命退不關有司之責觀變乘勝如李牧之守邊可謂善破虜矣惟陛下深計而緩圗之乙亥元昊陷安逺寨戊寅罷陜西都部署夏守贇都鈐轄王守忠走馬承受黎用信張德明並赴闕守贇性庸怯寡方略不為士卒所附自河中徙屯鄜州未及行亟罷歸徙涇原秦鳳路緣邊經略安撫使夏竦為陜西都部署兼經略安撫使緣邊招討使知永興軍己卯以起居舍人知制誥韓琦為樞密直學士陜西都轉運使天章閣待制范仲淹為龍圗閣直學士並為陜西經略安撫副使同管勾都部署司事初仲淹與吕夷簡有隙及議加職夷簡請超遷之帝悅以夷簡為長者既而仲淹入朝帝諭仲淹使釋前憾仲淹頓首曰臣向所論蓋國事於夷簡何憾也以知同州龎籍為陜西都轉運使籍嘗上言連年災異天久不雨臣以為弭災消禍在朝廷自修比年費用奢廣出納不嚴內中須索既多有司以憑由除破無緣鈎校虛實臣竊謂凡乘輿所用宫中所費宜取先朝為則今宿師西鄙力戰重傷方獲功賞而內官醫官樂官無功時享豐賜故天下指目謂之三官願少裁損無厚賚子專勵戰功虜寇不足平也以國子監直講林瑀王洙並為天章閣侍講景祐末災異數起帝憂之深自貶損瑀言災異皆有常數不足憂又依周易推演五行隂陽之變為書上之帝素喜方術觀瑀書異之欲遷其官參知政事程琳以為不可止賜章服時瑀兼諸王宫教授琳因言瑀所挾書多圗緯之言不宜與宗室遊罷其宫職帝每讀瑀書有不解者輒令御藥院批問瑀由御藥院益得關説於帝大抵皆諂諛之詞緣飾以隂陽帝大好之於是天章閣侍講闕端明殿學士李淑等薦洙事在中書未行一旦內批用瑀執政皆怒瑀吕夷簡欲探帝意堅否乃曰瑀上所用洙臣下所薦不若并進二人唯上所擇乃以洙瑀名進帝問洙何如夷簡言洙博學明經帝曰吾已用瑀矣若何夷簡請並用二人帝許之既而右正言梁適劾瑀以內降除官請治其罪帝令以適章示之卒不罪瑀李燾曰此據記聞瑀為諸王教授未見當考辛巳賜張士遜以宣化門安重誨舊園帝嘗書飛白千嵗字賜士遜士遜因第中建千嵗堂壬午斬輦官曹榮陳吉於都市從者皆配逺惡州軍牢城卒練輦官為禁軍如初詔六月權簽書涇原秦鳳經略安撫判官尹洙數上疏論兵事其一請鬻爵為土軍葺營及所給物費鬻爵之法凡入粟五百斛為上爵百斛為下爵司封出空名爵牒下諸州軍給之願移賣者勿禁下三司使鄭戬等參議以聞戬等奏曰為國者禮義不可不立法度不可不行風俗不可不純今洙所言是棄三者之益而困生民之本也古設民爵以賞武功賜耆艾今則鬻爵以規貨財其編户産薄者或子孫驕靡希一爵因至貧窘使父母妻子離凍飢之患此禮義不立也先王之域民也貴賤有差器服有别今使下愚之民咸得僭上所為驅之忘本欲不困窮其可得乎此法度不行也遊惰豪縱之徒因輸財得僣服以踰憲防卒致澆漓之弊此風俗不純也况賣官之令已出權宜然行之寖久今更為煩細箕斂民財書揭徼塞使外裔有輕中國之心洙議遂寢丙戍詔自今假日御崇政殿視事如前殿丁亥以宣徽南院使夏守贇同知樞密院事侍御史趙及右正言梁適皆言守贇經略西事無功不可復處樞府踰七旬乃罷八月戊申守贇罷以鄜延副都部署任福為環慶副都部署兼知慶州福上言慶州去蕃族不逺願勒兵境上按亭堡謹斥候因經略所過山川道路以為緩急攻守之備帝善之聽便宜從事南京言鴻慶宫神御殿火侍御史方偕引漢罷原廟故事請勿復修詔罷修神御殿即舊基葺齋殿每醮則設三聖位而祠之瘞舊像於宫側壬寅陜西都轉運使龎籍言今已廢並邊小寨外其所存皆在近裏道路寬平之處請嚴戒邊吏自今逐寨緩急有警並令互為應援從之甲辰詔陜西河圵河東西等路量州縣户口籍民為鄉弓手強壯以備盜賊河北河東強壯自咸平已來有之承平嵗久州縣不復閲習多亡其數於是詔二路選補增廣其數并及諸路焉吕中曰王拱辰言契丹不畏官軍而畏土兵元昊不畏東軍而畏土軍蓋兩河陜西之風土習勇悍長戰鬭苟上之人優其田疇安其室廬使力耕死戰世為邊用則可以減屯戍省餽運為不易之兵制也強壯之兵始者若不過鳩集鄉閭後至抽赴京師又後刺為正軍矣待役之兵始者無異編民後至刺手黥面又後運糧戍邊矣至三路弓手之兵或刺充宣毅或刺充保捷皆永為禁軍矣自𨽻正籍終身失業自處連營仰給縣官此張方平所以歷言於慶厯之時也辛亥復權武成軍節度判官歐陽修為館閣校勘始范仲淹副夏竦為陜西經略安撫招討辟修掌書記修以親為辭且曰今世所謂四六者非修所好兼此末事有不待修而能者又曰古人所與成事者必有國士共之非帷在上者以知人為難士雖貧賤以身許人固亦未易欲其盡死必深相知知之不盡士不為用今竒怪豪傑之士往往已蒙收擇顧用之如何耳然尚慮山林草莽有挺特知義慷慨之士未得出門下也宜少思焉時西邊日警二府三司雖假不休務翰林學士丁度言苻堅以百萬師寇晉謝安命駕出遊以安人心請休務如故無使外夷窺朝廷淺深壬子詔自今遇旬假聽休務如舊帝嘗遣使問所以禦戎之策度奏曰今士氣傷沮若復窮追巢穴積糧千里輕用人命以快一朝之意非計之得也莫若謹亭障逺斥候控扼要害為制禦之全策因條上其策名曰備邊要覽秋七月癸亥鄜延鈐轄張亢上疏言舊制諸路部署鈐轄都監各不過三兩員髙止為一州部署鈐轄不預本路事今每路多至十四五員少亦不減十員皆兼路分事權均勢敵不相統制凡有議論互執不同按唐總管統軍都統處置使各有副二國朝亦有經略使排陳使請約故事别創使名每路軍馬事止三兩員領之其已係路分部署鈐轄都監者且仍舊職並屬新使處分所貴出於一又曰昨延州之敗蓋由諸將自守不相為援請令邊城預定其法凡賊入冦某處為聲援某城寨相近出敢死士某處設伏都同巡檢則各扼其要害又令鄰路將取某救應仍須暗以旗幟為號昨劉平救延州前鋒軍馬陷賊寨者四指揮平竟不知又趙瑜領軍馬間道先進而趙振與王達等趨塞門至髙頭平報賊張青蓋駐山東振麾兵掩襲乃其子瑜也臣在山外策應未嘗用本指揮旗號自以五行支干别為引旗若甲子日本軍相遇則先者張青旗後者以緋旗應之此是干相生也其干相尅支相生支干相生尅亦如之蓋兵馬出入則百步之外不能相認若不預立號必誤軍期又曰兵官務要張皇邊事劉平之敗正繇貪功輕進鎮戎軍最近賊境每探馬至不問賊之多少部署鈐轄知軍都監皆出至邊壕則賊已去矣蓋權均勢埓不肯相下若其不出則恐得怯懦之罪又曰比來諸班諸軍有授諸司使副至侍禁殿直者亦有自身試武藝而得官者而諸路弓箭手生長邊陲父祖效命纍世捍賊乃無進擢之路何以激勸邊民初亢請乘驛入對詔令手疏上之其後多施用者乙丑遣同修起居注郭稹等使契丹告以用兵西邊議者謂元昊潛結契丹恐益為邊患故特遣稹等論意契丹主厚禮之與同出觀獵延稹射一發中走免衆皆愕視契丹主遺以所乘馬及他物甚厚己巳降鄜延副都部署趙振為白州團練使知絳州賊自正月攻圍塞門寨振代范雍守延州有兵七千八百餘人按甲不動寨中兵才千人屢告急五月初振始遣百餘人赴之寨遂陷振語人曰賊乘新勝必徑進苟延州弗支則陜西未可量也塞門雖危吾寧以大易小於是都轉運使龎籍劾奏振畏懦不出故坐貶自金明陷敗安逺塞門二寨在金明之北振既不能救安逺遂棄之又移書塞門寨主髙延德曰可守則守不可守宜拔兵民以歸延德城守將半嵗振卒不救乃帥衆棄城賊據險邀之故及於敗二寨皆沒庚午御延和殿閲諸軍習戰陳戊寅皇子初賜名昕授檢校太尉忠正節度使封夀國公置旌節於資善堂命端明殿學士李淑典其書奏八月乙酉以太常丞田况為陜西經略安撫司判官試校書郎胡瑗為丹州軍事推官經略安撫司勾當公事况從夏竦瑗從范仲淹所辟也乙未以史館修撰富弼為契丹主正旦使弼入辭便殿建言朝廷悉發京東西淮南江南荆南湖圵兩浙福建廣南東西凡十一道兵以屯關中十一道兵素寡弱關中得之未足以充而十一道之兵盡朝廷獨念京東鄰河朔京西次關陜遂遣使閲鄉民俾習武以代官兵東南九道則不之省伏思朝廷用度盡出九道固宜保守之今盡取其兵不加保守一日乘虛盜起梗其津要則京師無故而坐困矣臣欲乞於九道中擇要害十餘郡如泗揚升洪吉潭荆桂廣福杭越之類按地里相去均者於本處募兵大郡五千小郡三千以多補少不過四五萬人以東南百三十郡之富豈不能贍養哉訓為精兵勿復它役每郡置二督護専領之每道别置一都護經略之九道置一總統者居中以節制之如此則欲為冦者知朝廷有備豈不憚耶設有盜起乘其未熾而撲滅之不為難矣又言京東西鄉兵要未足恃亦請擇要害數郡别募兵立帥如東南之制因歷舉隋唐巨盜以證其言執政謂弼不當引聖朝比隋唐昏亂之時遂寢其奏戊戌罷天下寺觀用金箔飾佛像癸卯遣屯田員外郎劉渙使邈川諭嘉勒斯賚出兵助討西賊渙請行也渙出古渭州循末邦山至河州國門守絶河踰廓州抵青唐城斯賚迎導供帳甚厚介騎士為先驅引渙至庭斯賚平揖不拜延坐勞問稱阿舅天子安否渙傳詔已斯賚召酋豪大犒約盡力無負然終不能有大功也戊申同知樞密院事夏守贇罷為太平節度使判澶州考異東都事略作戊午夏守贇罷非也八月無戊午日守贇以子隨卒引疾求罷從之以龍圗閣學士權知開封府杜衍同知樞密院事己酉徙知廣州段少連為龍圗閣直學士知涇州廣州多蛋猺雜四方遊手喜乘亂為冦敓上元然燈有報蕃市火者少連方燕客作優戲士女聚觀以萬計其僚請罷燕少連曰救焚不有官乎作樂如故須臾火息民不喪一簮衆服其持重范仲淹經略西邊薦少連才堪將帥故有是命命未至而少連卒矣少連通敏有才遇事無大小決遣如流不為權勢所屈帝甚嗟惜之庚戌以范仲淹兼知延州徙知延州張存知澤州初存自陜西都轉運使徙延州遷延不即行既至與仲淹議邊事乃云素不知兵且以親年八十求內徙仲淹因自請代存從之先是詔分邊兵部署領萬人鈐轄領五千人都監三千人有冦則官卑者先出仲淹曰不量賊衆寡而出戰以官為先後取敗之道也乃分州兵為六將將三千人分部教之量賊衆寡使更出禦賊賊不敢犯既而諸路皆取法焉賊相戒曰無以延州為意今小范老子腹中自有數萬甲兵不比大范老子可欺也大范蓋指雍云辛亥詔范仲淹葛懷敏領兵驅逐塞門等寨蕃騎出境仍募已前弓箭手給地居之壬子以益州草澤伊縝為試校書郎縝少倜儻不為章句學再舉茂才異等不中元昊反數上疏言事丁度楊偕薦其才召試學士院而命之延州都監周美言於范仲淹曰賊新得志其勢必復來金明當邊衝我之蔽也今不亟完將遂失之仲淹因屬美復城如故數日賊果來其衆數萬薄金明陳於延州城圵三十里美領衆三千力戰會暮援兵不至乃徙軍山北多設疑兵賊望見以為救至即引去時諸將多不利美十餘戰平族帳二百焚虜帳二十復故城堡甚衆參知政事李若谷以耳疾纍章辭位九月戊午罷為資政殿大學士吏部侍郎提舉會靈觀事宫觀置提舉自若谷始以知樞密院事宋綬為兵部尚書起復翰林學士朝宗慤為右諌議大夫並參知政事以龍圗閣直學士權三司使鄭戬為諌議大夫同知樞密院事戬在三司才半嵗復轉運使考課格分别殿最又勾校三司出入得羡錢四百萬緡己未以知制誥葉清臣為龍圗閣直學士權三司使事中書進擬三司使清臣不在選帝曰葉清臣才可用遂以命之清臣始奏編前後詔敕使吏不能欺簿帳之叢冗者一切刪去內東御門厨皆內侍領之凡所呼索有司不敢問乃為合同以檢其出入初三駕皆以待禮事而車駕近出止用常從以行議者以為近於闊略於是參知政事宋庠言漢魏以降有大駕法駕小駕之儀至唐又分殿中諸衛黃麾等仗名數次序各有施設國朝承五代荒殘之弊事從簡略鳴鑾遊豫僅同藩鎮而盡去戈戟旌旗之制士庶觀者夾道喧馳旗亭市樓甚或憑高下瞰邏司街使曽不呵正非所謂旄頭先驅清道後行防微禦變之義也宜委一二博學近臣檢尋前代儀注及鹵簿令於三駕諸仗內參定酌取稍增儀物具嚴法禁上以尊宸極下以防未然詔太常禮院與兩制詳定遂合奏量增儀衛之數禁乘髙下瞰夾道喧呼馳走者著於令其後亦寖弛云以都官員外郎普州景泰為左藏庫使知寧州泰嘗通判慶州言元昊雖稱臣奉貢然包藏禍心今主將無長策器械鈍缺士卒惰窳城池不修資糧無備一旦有警何以應敵三疏不報已而元昊果反泰復上邊臣要略二十卷平戎策十五篇於是有薦泰知兵者召對稱旨遂換武秩云辛酉降知杭州天章閣待制司馬池知虢州池性朴易不飾厨傳剸劇非所長轉運使江鈞張從革劾池決事不當十餘條及稽留德音坐是左遷始轉運使既奏池會吏有盜官銀器繫州獄自陳為鈞掌私厨出所費過半又越州通判載私物盜稅乃從革之姻遣人私請或謂池可舉劾以報仇池曰吾不為也人稱其長者癸亥知絳州趙振降責潭州安置坐觀望逗撓致陷塞門也詔自今都部署司及諸路部署司應有寨柵申報賊冦入界不以多少逺近並須畫時救應乙丑詔河圵河東路強壯陜西京東西路新置弓手皆以二十五人為團置押官四團為部置正副都頭各一人五部為指揮置指揮使各以階級伏事年二十係籍六十免取家人或它户代之聽私置弓弩每嵗十月後正月前分畨上州教閲半月即遣歸農或遇非時勾集守城及捕盜日給糧二升嵗正月縣以籍上州州以籍奏兵部按舉不如法者丙寅西賊寇三川寨鎮戎軍西路都巡檢揚保吉死之明日涇原路都監劉繼宗李緯王秉等分兵出戰皆失利涇州駐泊都監王圭將三千騎來援自瓦亭寨至師子堡賊圍之數重圭奮擊賊披靡殺賊將二人獲首級為多賊遂留軍縱掠凡三日官軍戰沒者五千餘人戊辰以知樞密院事晏殊為檢校太傅充樞密使同知樞密院事王貽永刑部侍郎杜衍右諌議大夫鄭戩並為樞密副使庚午以簽書定國節度判官事种世衡為內殿承制知延州青澗城世衡在青澗開營田二千頃募商賈貸以本錢使通貨得利城遂富實間出行部族慰勞酋長或解與所服帶嘗客飲有得虜事來告者即豫飲器繇是屬羌皆樂為用無定河蕃部鈔邊率屬羌討擊前後斬首數百壬申環慶副都部署任福等攻西賊白豹城克之俘獲甚衆軍還賊遣百騎襲其後守神林圵路都巡檢范全設伏崖險賊半度邀擊之斬首四百級生獲七十餘人壬午陜西經略安撫副使韓琦以三川寨諸將敗書聞且言劉繼宗權本軍才一日李緯等未曽經行陳倉卒出戰遂致退衄望特免推鞫但量其罪輕重等第削官或更移降差遣責其後效王圭以孤軍摧鋒血戰所殺賊兵不少既身被重創尚求益兵出鬬人皆服其勇節雖失亡數多蓋衆寡不敵望貸其罪必能感勵奮身盡死為報從之甲戌詔使臣諸班諸軍有武藝者自陳辛巳閲諸軍習戰冬十月癸未朔以御侍河南郡君朱氏清郡君張氏並為才人張氏河南人父堯封擢進士第補石州軍事推官未行卒京師堯封母錢氏女也張時八嵗與姊妹三人由錢氏入宫寢長得幸於帝性聰敏便巧挾智數能探測人主意先後將迎帝以其良家子待遇異諸嬪於是與朱氏並為才人朱開封人也考異慶厯元年八月朱氏生子曦張后本傳云慶厯元年封清河郡君誤也會要亦誤戊子詔自今內降指揮與臣僚遷官及差遣者並令中書樞密院具條執奏以聞帝性寬仁宗戚近幸有求內降者或不能違故也甲午賜涇原駐泊都監王圭名馬二匹黃金三十兩裹瘡絹百匹仍遣使撫諭之復下詔暴其功塞下以勵諸將尋命為本路駐泊都監復兼行營勒金字處置牌賜之使得專殺乙未端明殿學士李淑等上所定銅符木契傳信牌下有司製之銅符之制上篆刻曰某處發兵符下鑄虎豹為飾而中分之右符五左旁作虎豹頭四左符一右旁為竅令可勘合又以篆文相向側刻十干字為號一甲巳二乙庚三丙辛四丁壬五戊癸左符刻十干半字右符正刻甲巳等兩半字右五符留京師左符降部署鈐轄知州軍官高者掌之凡發兵樞密院下符一至五周而復始指揮三百人至五十人用一虎一豹符五千人以上用雙虎雙豹符樞密院下符右符第一為始內匣中緘印之命使者齎宣同下宣云下第一符發兵若干所在取左符勘畢即發兵與使者復緘右符以還仍疾置聞所在籍下符資次日月及兵數無得付所司其木契上下題某處契中剖之上三枚中為魚形題一二三下一枚中刻空魚令可勘合左旁題云左魚合右旁題云右魚合上三枚留部署鈐轄官高者掌之下一枚付諸州軍城寨主掌之部署鈐轄兵馬百人以上先發上契第一枚貯之韋囊緘印之遣指使齎牒同往所在驗下契與上契合即發兵復緘上契以還仍報部署鈐轄其發第二第三契亦如之掌契官籍發契資次日月及兵數互為照驗傳信牌中為池槽藏筆墨紙令主將掌之每臨陳傳命書紙內牌中持報兵官復書事宜內牌中而還主將密以事號驗毋得漏軍中丙申以環慶部署兼知慶州任福為龍神衛四廂都指揮使賞白豹城之功也尋命福兼鄜延路副都部署庚子出內藏絹一百萬下三司助邊費初鴻慶宫災集賢校理胡宿請修火祀以閼伯對祭大火禮官議因興王之地商丘之舊作為壇兆秩祀大火以閼伯配籩豆牲幣得視中祠嵗以三九月擇日留司長吏已下分三獻州縣官攝太祝奉祀詔從之甲辰録方略士六十一人十一月丙辰內出御撰洪範政監審樂要記風角集占以示輔臣仍以風角集占賜陜西諸路部署司贈延州塞門寨主高延德權兵馬監押王繼元官並録其子故延州西路同巡檢張圭三子亦皆授官壬戌有大星流西南聲如雷者三丙寅徙知河中府樞密直學士狄棐知鄭州有中貴人過河中言將援棐於上前棐答以他語退謂所親曰吾湘潭一寒士今官侍從可以老而自汚耶丁卯以鄜延部署司指使狄青為涇州都監青每臨敵被髮面銅具出入賊中皆披靡無敢當者尹洙為經略判官青以指使見洙與談兵善之薦於副使韓琦范仲淹曰此良將才也二人一見竒之待遇甚厚仲淹以左氏春秋授之曰將不知古今匹夫勇耳青折節讀書悉通秦漢以來將帥兵術由是益知名乙亥贈鎮戎軍西路都巡檢使楊保吉為深州防禦使封其妻趙氏為天水縣君又贈其父守信母蘇氏官號丙子以河東都轉運使楊偕為樞密直學士知并州有中官預軍事素橫前帥優遇之偕至一繩以法於是軍政肅然是月浙東軍士鄂鄰等殺巡檢使張懷信聚兵剽劫湖南福建廣南諸州縣逃入海懷信內臣性苛虐鄰等積怨忿遂作亂考異李燾曰鄂鄰等作亂國史無之此據富弼奏議稽古録載其事於九月不知何據今從弼奏議及司馬光記聞十二月癸未出內藏庫絹一百萬助糴軍儲丙戌詔司農寺以常平錢百萬緡助三司給軍費自景祐末不許移用常平至是以兵食不足始降是詔建神御庫於宗正寺西藏祖宗時神御法物於其中從直祕閣趙希言判太常寺宋祁請也乙未徙知隨州王德用知曹州德用道過許州梅詢謂德用曰道輔害公者今死矣德用曰孔中丞以其職言豈害德用者朝廷亡一忠臣可惜也朝宗慤等至永興議邊事夏竦等合奏今兵與將尚未習練但當持重自保俟其侵軼則乘便掩殺大軍蓋未可輕舉及劉承宗等敗帝復以手詔問師期竦等乃畫攻守二䇿遣副使韓琦判官尹洙馳驛至京師求決於帝己亥入對崇政殿先有詔琦遷禮部郎中洙加集賢校理琦言臣以大計不俟召赴闕若僥幸進秩將不容於清議辭不拜兵部尚書參知政事宋綬卒帝幸其第臨奠輟二日朝贈司徒兼侍中諡宣獻綬性清介事母孝言動有常為兒童時手不執錢後博通經史百家之書必正其得失楊億嘗稱其文沉壯淳麗尤善鋪賦吾不及也藏書萬餘卷手自校讎筆札精好帝嘗取所書千字文及卒多收其字帖藏禁中乙巳詔鄜延涇原兩路取正月上旬同進兵入討西賊帝與兩府大臣共議始用韓琦等所畫攻策也樞密副使杜衍獨以為僥幸出師非萬全計爭論久之不聽大臣至有欲以沮軍罪衍者遂求罷亦不聽據歐陽修墓銘云大臣至有欲以沮軍罪衍者不知大臣為誰當考始朝宗慤即軍中問攻守策衆欲大舉經略判官田京曰驅不習之師攖鋭鋒深入賊地爭一旦之勝此兵家所忌師出必敗或有議講和者京又曰賊兵未嘗挫安肯和也太子中允館閣校理歐陽修上書曰關西弛備而民不見兵者二三十年矣始賊萌亂之初藏形隱計卒然而來當是時吾之邊屯寡弱城堡未完民習久安而易驚將非素選而敗怯使其羊驅豕突可以奮然深入然國威未挫民力未疲彼得城而居不能久守虜掠而去可邀擊其歸此下策也故賊知而不為戎狄侵邊自古為患其攻城掠野敗則走而勝則來蓋其常事此中策也故賊兼而用之若夫假僭名號以威其衆先擊吾之易取者一二以悅其心然後訓養精鋭為長久之謀故其來也雖勝而不前不敗而自退所以誘吾兵而勞之也或擊吾東或擊吾西乍出乍入所以使吾兵分備多而不得減息也吾欲速攻賊方新鋭坐而待戰彼則不來如此相持不三四嵗吾兵已老民力已疲不幸又遇水旱之災調斂不勝而賊盜羣起彼方奮其全鋭擊吾困弊可也吾不堪其困忿而出攻決於一戰彼以逸而待吾勞亦可也幸吾苦兵計未知出遂求通聘以邀嵗時之賂度吾困急不得不從亦可也是吾力一困則賊謀無施而不可此兵法所謂不戰而疲人兵者上策也而賊今方用之今三十萬之兵食於西者二嵗矣又有十四五萬之鄉兵不耕而自食其民自古未有四五十萬之兵連年仰食而國力不困者也臣聞元昊之為賊威能畏其下恩能死其人自初僭叛嫚書已上逾年而不出一出則其鋒不可當執劫蕃官獲吾將帥多禮而不殺此其凶謀所畜皆非倉卒者也奈何彼以上策而疲吾吾不自知其已困彼為久計以撓我我無長策而制之哉夫訓兵養卒伺釁乘便用間出竒此將帥之職也所謂閫外之事而君不御者也至於外料賊謀之心內察國家之勢知彼知此因謀制敵此朝廷之大計也所謂廟算而勝者也不可以不思臣謹上便宜三事其一曰通漕運唐裴耀卿於三門東西置倉開山十八里為陸運以避其險其後劉晏遵耀卿之路悉漕江淮之米以實關西今宜浚治汴渠使嵗運不阻然後按求耀卿之迹不憚十許里陸運之勞則河漕通而物可致此水運之利也昔漢高入秦曹操等起兵誅董卓皆不由關東而道南陽蓋自古用兵往來之徑也今能按求而通之則沿漢十餘州之物皆可漕而頓之南陽自南陽為輕車人輦而遞之直輸關西此陸運之利也其二曰盡地利前世用兵者未嘗不先營田今鄉兵棄農業羣遊而飲博以為父兄之患宜盡驅之使耕於棄地官貸其種嵗田之入與中分之如民之法其三曰權商賈茶鹽之利官自為鬻使無用而積為朽壤誠能不校錙銖而思逺大勿復與商賈爭利則積朽之物散而錢幣通可不勞而用足矣行之一二嵗國力漸豐邊兵漸習賊鋭漸挫而隙有可乘然後一舉而滅之此萬全之策也丁未詔開封府京東西河東路括驢五萬以備西討從陜西經略司所上攻策也戊申以通判河中府皮仲容知商州兼提點采銅鑄鐵錢事仲容嘗建議鑄大錢一當十既下兩制及三司議其事謂可權行以助邊費故有是命初韓琦安撫陜西嘗言陜西産鐵甚廣可鑄錢兼用於是葉清臣從仲容議鑄當十錢翰林學士承旨丁度奏曰禁旅戍邊月給百錢得大錢裁十不可畸用舊錢不出新錢愈輕則糧芻增價復有湖山絶處凶魁嘯聚罏冶日滋居則鑄錢急則為盜民間銅鉊之器悉為大錢何以禁止乎考異本志云軍興陜西移用不足始用知商州皮仲容議采洛南縣紅崖山虢州青水冶青銅置阜民朱陽二監以鑄錢按實録乃鑄鐵錢與本志不同當考是嵗仍詔商人入芻粟陜西並邊願受東南鹽者加數豫之資治通鑑後編卷四十七
