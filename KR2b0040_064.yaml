body:
  text: 資治通鑑後編卷六十四刑部尚書徐乾學撰宋紀六十四起閼逄敦牂十一月盡旃蒙協洽十二月凡一年有二月仁宗體天法道極功全德神文聖武睿哲明孝皇帝至和元年十一月辛酉降同知太常禮院吳充知髙郵軍太常寺太祝鞠真卿知淮陽軍禮院故事常預為印狀列署衆銜或非時中㫖訪問不暇遍白禮官則白判寺一人書填印狀通進施行及追贈溫成皇后日有中㫖訪問禮典判寺王洙兼判少府監廨舍最近故吏多以事白洙洙常希望上㫖以意裁定填印狀進內事既施行而論者皆責禮官禮官無以自明乃召禮直官戒曰自今凡朝廷訪問禮典稍大無得輒以印狀申發仍責取知委後數日有詔問溫成皇后應如他廟用樂舞否禮直官李亶以事白洙洙即填印狀奏云當用樂舞事下禮院充真卿怒即牒送亶於開封府使按其罪洙抱案卷以示知府事蔡襄曰印狀行之久矣禮直官何罪襄患之乃復牒送亶於禮院禮院吏相率逃去殿中侍御史趙抃奏蔡襄不按治禮直官罪畏懦觀望執政以為充教抃上言又禮直官日在溫成葬所訴於內臣云欲送開封府按罪者充與真卿也明日詔禮直官及繫檢禮生各贖銅八斤充真卿俱補外抃及諌官范鎮等皆言充等無罪不當降絀不報甲子出太廟禘祫時饗及溫成皇后樂章肄於太常御史中丞孫抃言西川屢奏儂智髙收殘兵入大理國謀冦黎雅二州請下知益州張方平先事經制以安蜀人從之乙丑太常丞同修起居注馮京落同修起居注時臺諫爭言吳充鞠真卿不當補外京最後上疏言愈切宰相劉沆怒請出京知濠州帝曰京何罪然猶落修注臺諫又爭言京不當奪職請復之不報丙寅徙淮南江浙荆湖制置發運使許元知揚州元在江淮十三年以聚斂刻剝為能急於進取多聚珍竒以賂遺京師權貴尤為王堯臣所知在真州衣冠之求官舟者日數十輩元視勢家要族立𣙜巨艦與之即小官惸獨伺候嵗月有不能得人以是憤怨而元自謂當然無所愧憚己巳秦鳯經略安撫司言城秦州古渭寨畢工初築城費百萬緡其後留兵戍守每嵗費十萬緡辛巳詔宰臣劉沆子太常寺太祝瑾令學士院召試館職溫成皇后既葬賜后閣中金器數百兩沆力辭而為瑾請之壬午以入內押班石全彬為入內副都知知制誥劉敞封還詞頭奏曰全彬昨已有制㫖除宫苑使利州觀察使未能三日復換此命朝令夕改古人所非臣雖鄙賤實惜此體不敢輒撰誥詞從之後三月全彬卒為入內副都知丙戌詔宗正等故事屬籍十年一修今雖及八年而宗支蕃衍其增修之知制誥劉敞言臣昨聞吳充出外馮京落職將謂其人所行實有過當所言實有不可是以觸忤聖意不蒙矜恕及於延和殿奏事面奉宣詔充乃是振職京意亦無他中書惡其太直不與含容臣竊驚駭不覺憤咽前古以來唯有人主不能容受直言或致竄謪臣下今陛下慈聖好諫寬大如此不知中書何故不務將順聖德之美須要排逐言者又言臣前論吳充馮京謫官面䝉宣諭本末臣即言若如此則是大臣蔽君之明專君之權而擅作威福也必恐感動隂陽有地震日食風霧之異今臣竊聞鎮戎軍地震一夕三發去臣所言五日之內耳又京師雪後昏霧纍日復多風埃太陽黃濁此皆變異之可戒懼者也臣所以先知必然者按五行志云臣事雖正專之必震况其不正乎又尚書洪範䝉常風若而京房易𫝊臣之蔽君則䝉氣起臣以此數者合之故知必有異也陛下宜深究天地之意收攬威權無使聰明蔽塞法令不行則足以消伏災異矣十二月庚子翰林學士王洙直集賢院掌禹錫上皇祐方域繢圖知并州韓琦以疾奏乞太醫齊士明翰林醫官言士明當診御脉不可遣帝立命內侍竇昭押士明往視之丙午詔司天監天文算術官毋得出入臣僚家丁未殿中丞直祕閣司馬光上古文孝經詔送祕閣己酉如京使果州團練使入內都知張惟吉卒贈保順軍節度使諡忠安惟吉任事久頗見親信而言弗阿徇溫成治喪皇儀宰相既𨗳諛惟吉爭不能得至頓足泣下殿中侍御史趙抃言宰相陳執中本家捶撻女奴迎兒致死一云執中親行杖楚以致斃踣一云嬖妾阿張酷虐毆殺臣謂二者有一於此執中不能無罪若女使本有過犯自當送官斷遣豈宜肆匹夫之暴失大臣之體違朝廷之法立私門之威若女使果為阿張所殺自當擒付所司以正典刑豈宜不恤人言公為之庇夫正家而天下定執中家不克正陛下倚之以望天下之治定是猶却行而求前何可得也執中亦自請置獄已而有詔罷獄臺官皆謂不可翰林學士歐陽修亦以為言逮執中去位言者乃止甲寅以益州布衣章察為本州助教察雙流人通經術善屬文性淡泊屏居林泉以飬生治氣為事尤深於太𤣥著發隱三篇講疏四十五卷田况上其發隱特録之察辭不拜嘉祐四年十一月賜察處士號丙辰睦州防禦使宗諤上所撰太平盤維録降敕褒諭帝春秋髙未有繼嗣皇祐末太常博士張述上書請遴選宗親才而賢者異其禮秩試以職務俾內外知聖心有所屬則天下大幸是嵗復上疏言嗣不蚤定則有一旦之憂而貽萬世之患歷觀前世事出倉猝則或宫闈出令或宦官主謀或奸臣首議貪孩孺以久其政兾暗昧以竊其權安危之機發於頃刻而朝議恬不為計豈不危哉述前後七上疏最後語尤激切帝終不以為罪述小溪人也考異李燾曰皇祐五年仁宗春秋四十四述疏即以五年上𫝊云皇祐中誤也是歲融州大丘洞蠻楊光朝內附二年春正月戊辰雍州言蘇茂州蠻內冦詔廣西發兵討之辛未幸奉先資福襌院謁宣祖神御殿先是議者謂帝特行此禮因欲致奠溫成陵廟御史中丞孫抃言陛下臨御以來未嘗朝謁祖宗山陵今若以溫成故特行此禮虧損聖德莫此為大翰林學士歐陽修亦論諫帝從之不復至溫成陵廟丁亥觀文殿大學士兵部尚書晏殊病浸劇乘輿將往視之即馳奏曰臣老病行愈矣不足為陛下憂已而卒帝雖臨奠以不視疾為恨特罷朝二日贈司空兼侍中諡元獻既葬篆其碑首曰舊學之碑殊剛峻簡率雖早貴然奉養清儉纍典州吏民頗畏其悁急善知人如孔道輔范仲淹皆出其門而富弼楊察皆其壻也初命張方平知益州未至而程勘已先入為參知政事轉運使髙良夫攝守事時西南夷有卭部川首領者妄言蠻賊儂智髙在南詔欲來冦蜀良夫聞之亟移兵屯邊郡益調額外弓手發民築城日夜不得休息民大驚擾詔促方平行且許以便宜從事方平言南詔去蜀二千餘里道險不通其間皆雜種不相役屬安能舉兵與智髙為冦哉此必妄也臣當以靜鎮之道遇戍卒兵仗輒遣還入境下令卭部川曰冦來吾自當之妄言者斬悉歸所調兵散遣弓手罷築城之役㑹上元張燈城門三夕不閉人心稍定已而得卭部川譯人始為此謀者斬之梟首境上而配流其餘黨於湖南蜀人遂安二月壬辰以汾州團練推官郭固為衛尉寺丞知并州韓琦言固嘗造車陳法其車前鋭後方上置七槍以為前後二拒可用於平川之地一則臨陳以折奔衝二則下營以為寨腳今令固自賫軍式詣闕進呈既試用之而有是命廣州司理參軍陳仲約誤入人罪死有司當仲約公罪應贖帝謂知審刑院張揆曰死者不可復生而獄吏雖暫廢他日復得叙官可不重其罰耶癸巳詔仲約特勒停㑹赦不許叙用給事中崔嶧受詔按治陳執中縱嬖妾殺婢事嶧以為執中自以婢不恪笞之死非嬖妾殺之頗左右執中甲午授嶧龍圖閣待制知慶州庚子殿中侍御史趙抃言臣嘗言宰臣陳執中不學無術措置顛倒引用邪佞招延卜祝私讐嫌隙排斥良善狠愎任情家聲狼藉八事伏恐陛下猶以臣言為虛至今多日未賜省納臣若不概舉一二明白條陳即是負陛下耳目澄察之任又得憲臺瘝官失職之罪臣不忍為也去年春正以後制度禮法率多非宜蓋執中不知典故惟務阿諛敗壞國體又翰林學士素有定制執中愚暗自用遂除至七員此執中空踈宜罷免者一也執中賞罰在手率意卷舒如劉湜自江寧府移知廣州煙瘴之地而待制之職仍舊及向傳式自南京移知江寧府近便之任乃轉傳式龍圖閣直學士又吳充鞠真卿摘發禮院生代署文字等事人吏則贖金免决充真卿並降軍壘此執中繆戾宜罷免者二也館閣清官豈容纎巧而執中樹恩私黨如崔嶧非次除給事中知鄭州既罷而給事中不奪故嶧治執中之獄依違中罷以酬私恩又執中嘗寄嬖人於周豫之家而豫姦諂受知執中遂舉豫召試館職此執中朋附宜罷免者三也執中之門未嘗待一俊傑禮一才能所與語者苖逹劉抃劉希叟之徒所預坐者元季寧程惟象之輩且處台鼎之重測候災變窮占吉凶意將奚為此執中頗僻宜罷免者四也邵必知常州日詿誤决人徒刑既自舉覺復㑹赦宥又該去官執中素惡必乃罷必開封府推官落館職降充邵武軍監當後有汀州石民英勘入使臣犯贓杖皆黥面配廣南牢城本家訴雪悉是虛枉却只降民英差遣以邵必比之民英則民英所犯重而斷罪反輕邵必所犯輕而斷罪反重此執中舞法宜罷免者五也呂景初馬遵吳中復彈奏梁適既得罪出知鄭州呂景初輩隨又逐去有行行及我之語馮京疏言吳充鞠真卿刁約不當以無罪黜充等尋押發出門又落京修起居注使朝廷有罪忠拒諫之名此執中嫉賢宜罷免者六也女奴迎兒才十三嵗既纍行箠撻從嬖人阿張之言窮冬裸凍封縳手腕絶其飲食幽囚扄鎖遂致斃踣又海棠者因阿張决打逼脅遍身痕傷既而自縊後來又女使一名髠髮杖背自經不殊亦係開封府施行凡一月之內殘忍事發者三名前後幽寃聞固不少此執中酷虐宜罷免者七也執中帷簿醜穢門閫混淆放縱嬖人信任胥史而又身貴室富藏鏹巨萬視姻族輩如行路人雖甚貧窘不一毫賑恤此執中鄙惡宜罷免者八也今執中有是可罷免者八奈何不識亷恥復欲居廟堂之上願陛下為社稷生靈計正執中之罪早賜降黜尋有詔邵必復職知髙郵軍吳充鞠真卿刁約呂景初馬遵召還馮京候修注有闕吳中復候臺官有闕並牽復甲辰殿中侍御史趙抃言臣近纍次彈奏乞正宰臣陳執中之罪未䝉施行風聞同知諫院范鎮妄行營救伏望陛下開日月之明判忠邪之路取內外之公議立朝廷之大法則天下幸甚先是知諫院范鎮言范鎮纍奏不得其時今附見趙抃劾章後去年十二月熒惑犯房上相未幾陳執中家决殺婢使議者以為天變應此臣竊謂為不然執中再入相未及二年變祖宗大樂隳朝廷典故緣葬事除宰相除翰林學士除觀察使其餘僭賞不可悉紀自陛下罷內降五六年來政事清明近日稍復奉行至有侍從臣寮之子亦求內降內臣無名超資改轉月須數人又今天下民困正為兵多而益兵不已執中身為首相義當論執而因循茍簡曾不建言天變之發實為此事陛下釋此不問御史又專治其私捨大責細臣恐雖退執中未當天變乞以臣章宣示執中宣示御史然後降付學士草詔使天下之人知陛下退大臣不以其家事而以其職事後來執政不敢恤其家事而盡心於陛下職事至是鎮又言御史以諫院不論奏陳執中家事乞加罪諫官臣聞執中狀奏女使有過指揮决打因風致死而外議謂阿張决死臣再三思維就阿張下獄自承非執中指揮有司亦未可結案須執中證辨乃是為一婢子令宰相下獄國體亦似未便所以不敢雷同上言然臣有不言之罪二而御史不知初朝廷為禮直官逐禮官而臣再奏論列以正上下之分及為一婢子困辱宰相而臣反無一言臣之罪一也臣不及衆議未定時辨理執中至執中勢去已决始入文字臣之罪二也臣雖不雷同以存國體一事不足以贖二事乞以臣章下御史臺榜於朝堂使士大夫知臣之罪臣雖就死無所憾也乙巳以觀文殿學士户部侍郎知河陽富弼為宣徽南院使判并州丙午徙知并州武康軍節度使韓琦知相州琦以疾自請也先是潘美帥河東避冦鈔為己纍令民內徙空塞下不耕號禁地而欣代州寧化火山軍廢田甚廣歐陽修嘗奏乞耕之詔范仲淹相視請如修奏尋為明鎬沮撓不得行及琦至遣人行視曰此皆我腴田民居舊迹猶存今不耕適留以資敵後且皆為敵有矣遂奏代州寧化軍宜如岢嵐軍例距北界十里為禁地餘則募弓箭手居之㑹琦去即詔弼議請如琦奏凡得户四千墾地九千六百頃初翰林學士吕溱上疏論陳執中外雖强項內實姦邪又歷數其過惡十餘事帝還其疏溱進曰若止用口陳是隂中大臣也請付執中令自辨於是溱改翰林侍讀學士知徐州辭日特賜燕資善堂遣使諭曰此㑹特為卿設可盡醉也仍詔自今由經筵出者亦如例宰臣劉沆言面奉德音凡傳宣內降其當行者自依法律賞罰外餘令二府與所屬官司執奏蓋欲杜請託僥幸之路也因陳三弊一曰近臣保薦官吏之弊二曰近臣陳自親屬之弊三曰叙勞干進之弊願詔中書樞密凡三事毋得用例餘聽如舊事既施行而衆頗不說未幾復故乙卯流內銓引對前雍邱縣主簿陳琪改京官帝謂判銓賈黯曰琪雖無他過而歷三任皆因緣陳乞不由有司奏擬琪乃龎籍女壻今保薦多至二十四人得非專欲諂附大臣故爾耶且與幕職官知縣琪鹽鐵副使洎之子也知諫院范鎮等言恩州自皇祐五年秋至去年冬知州凡換七人河北諸州大率如此欲望兵馬練習固不可得伏見雄州馬懷德恩州劉渙冀州王德恭皆有材勇智慮可責以辦治乞令久任從之三月丁卯詔修起居注自今每御邇英閣立於講讀官之次初賈黯請左右史入閣記事帝賜坐於御榻西南至是修起居注石易休言恐上時有宣諭咨訪而坐逺不悉聞因令立侍焉丙子詔封孔子後為衍聖公初太常博士祖無擇言文宣王四十七代孫孔宗願襲封文宣公按前史孔子之後襲封者在漢魏曰褒成褒宗尊聖在晉宋曰奉聖後魏曰崇聖北齊曰恭聖後周及隋並封以鄒國唐初曰褒聖開元初始追諡孔子為文宣王又以其後為文宣公然祖諡不可加後嗣乞詔有司更定美號乃下兩制定議更封宗願而令世襲焉考異長編在丁卯今依宋史作丙子翰林學士羣牧司楊偉等言判官殿中丞王安石文行雅髙乞除職名中書檢㑹安石纍召試不赴詔特授集賢校理安石又固辭不拜癸未以權知開封府蔡襄為樞密直學士知泉州以母老自請也襄工筆札帝尤愛之御製李用和碑文詔使襄書後又敕襄書溫成皇后父清河郡王碑襄曰此待詔職也卒辭之丙戌邇英閣王洙講周官典瑞含玉帝曰若使人用此而骨不朽豈如功名之不朽哉丁亥知審刑院張揆言知虢州周日宣妄言澗水衝注城郭當坐不實之罪帝曰州郡多奏祥瑞至水旱之災或抑而不聞今守臣自陳墊壞官私廬舍意亦在民當恕其罪也翰林學士歐陽修言朝廷欲候秋興大役塞商胡開橫隴回大河於故道夫動大衆必順天時量人力謀於其始而審然後必行計其所利者多乃可無悔往年河决商胡執政之臣不審計慮遽謀修塞凡科配稍芟一千八百萬騷動六路百餘州軍官吏催驅急若星火虛費民財為國斂怨今又聞復有修河之役聚三十萬人之衆開一千餘里之長河計其所用物力數倍往年當此天災嵗旱民困國貧之際不量人力不順天時知其有大不可者五蓋自去秋至春半天下苦旱而京東尤甚河北次之國家常務安靜賑恤之猶恐民起為盜况於兩路聚大衆興大役乎此其必不可者一也河北自恩州用兵之後繼以凶年人户流亡十失八九數年以來稍稍歸復而物力未充又京東自去冬無雨雪麥不生苖將踰春暮粟未布種農心焦勞所向無望若别路差夫又逺者難為赴役一出諸近則兩路力所不任此其必不可者二也往年議塞滑州决河儲積物料誘率民財數年之間始能興役今國用方乏民力方疲且合商胡塞大决之洪流自一大役也鑿橫隴開久廢之故道又一大役也自橫隴至海千餘里掃岸久已廢頓須興緝又一大役也往年公私有力之時興大役尚須數年今猝興三大役於災害貧虛之際此其必不可者三也就令商胡可塞故道未必可開鯀障洪水九年無功禹因水之流疏而就下水患乃息今欲逆水之性障而塞之奪洪河之正流使人力斡而回注此其必不可者四也橫隴湮塞已二十年商胡决又數嵗故道已平而難鑿安流已久而難回此其必不可者五也宜速止罷用安人心是月以旱除畿內民逋租及去年秋逋稅罷營繕諸役詔中外咸言得失龎籍密疏曰太子天下本今陛下春秋固方盛然太子不豫建使四方無所係心願擇宗室之宜為嗣者早决之羣情既安則災異可塞矣夏四月丙申上封者言有䕃子孫犯杖以上私罪情理重者令州縣批所犯於用䕃官誥之後若三犯奏聽裁從之宰臣陳執中初為御史所劾即家居待罪不敢出庚戌復入中書視事己亥契丹遣使賀乾元節以其主之命持本國三世畫象來求御容辛亥罷諸路里正衙前先是知并州韓琦言州縣生民之苦無重於里正衙前自兵興以來殘剝尤甚至有孀母改嫁親族分居或棄田與人以免上等或非命求死以就單丁規圖百端茍脫溝壑之患殊可痛傷自今罷差里正衙前只差鄉户衙前令於一縣諸鄉中第一等選一户物力最髙者為之於是下京畿河北河東陜西京西轉運使相度利害皆謂如琦所議便又知制誥韓絳言臣嘗安撫江南東西路見兩路衙前應役不均請行鄉户五則之法又知制誥蔡襄言臣嘗為福建路轉運使見一縣之中所差里正衙前有三四年或五七年輪差一次者一百貫皆入十分重難請止以産錢多少定其所入重難之等乃命絳襄與三司使副判官置司同定奪遣都官員外郎吳幾復往江東殿中丞蔡稟往江西與本路長吏轉運使相度因請行五則法更著淮南兩浙荆湖福建之法下三司頒行之其法雖逐路小有不同然大率得免里正衙前之役民甚便之知諫院范鎮言竊以水旱之作由民之不足而怨民之不足而怨由有司之重斂有司之重斂由官冗兵多與土木之費廣而經制不立也國家自陜西用兵增兵以來賦役煩重及近年不惜髙爵重祿假借匪人轉運使復於常賦外進羡錢以助南郊其餘無名斂率不可勝計皆貪政也貪政之發發於掊克暴虐此民所以怨干天地之和而水旱作也臣欲乞使中書樞密院通知兵民財利大計與三司量其出入制為國用則天下民力庶幾少寬以副陛下憂勞之心自天聖以來帝每以經費為慮命官裁節臣下亦屢以為言而有司不能承上之意牽於習俗卒無所建明議者以為恨焉乙卯出米京城門下其價以濟流民丙辰殿中侍御史趙抃言宰臣陳執中退處私第不赴朝請前後數月外議謂陛下禮貌大臣雖執中罪惡彰著不即降黜是欲使全而退之故臣不敢再三論列煩瀆宸聽此月二十二日執中遽然趨朝再入中書供職如舊中外驚駭未測聖情不知陛下以臣向來之言為是耶為非耶復不知陛下以執中之罪為有耶為無耶陛下若以臣言為是而以執中為非即乞罷免相位以從天下之公議若以臣言為非而執中為無罪亦乞竄臣逺方宣布中外以誡後來不報五月己未録繫囚辛酉詔中書公事自今並用祖宗故事施行初宰臣劉沆建言中書不用例議者皆以為非便左司諫賈黯奏罷之戊寅詔曰朕祇紹駿謨勵精庶政眷茲文武之烈所謂邦家之基推古今治忽之常繫上下義利之分吁惟近嵗洊至煩言以為參顧問者間怵於私尸言責者或失於當蒞官無匪懈之恪專覬謬恩薦士乖責實之誠時容私謝至於命令之下以及詔除之行論議所移綱條益紊朕惟舜德之盛股肱有賡載之和周道之衰朝廷多讒怨之訴咨爾周行之士適逢至治之期與其陟險以徼榮曷若飭躬而馴致爰申戒告以厲浚明茍迷修省之方浸長澆浮之俗必從吏議以正邦彛時上封者言古之取士以德行故淳明朴茂之人用後世取士以辭章故浮薄纎巧之人進望條列弊事申戒百官故降是詔御史中丞孫抃與其屬乞正陳執中之罪以塞中外公議不報於是抃與知雜事郭申錫侍御史毋湜范師道殿中侍御史趙抃同乞上殿閣門以違近制不許壬午詔抃等輪日入對知諫院范鎮言御史全臺請對陛下何不延問聽其所陳别白是非可行則行其不可亦當明諭其故使知自省今拒其請非所以開言路也御史中丞孫抃侍御史知雜事郭申錫入對言宰臣陳執中以杖殺女使事遂起詔獄尋又入劄子乞不枝蔓其制院從而希㫖鹵莽結絶樞密院亦無所建明所以制獄之興由執中而廢亦由執中家聲醜穢物議喧騰豈宜更居台司使輔國政又言前日詔獄言事官屢有彈奏未聞陛下特降指揮臣僚中亦有解救者伏慮陛下因而疑惑臣愚竊以彈奏之言為朝廷為法為紀綱解救之語為宰相為身為利祿二途事意黑白可驗陛下縱全君臣之分免執中責罰亦當罷去以懲不法之罪奈何優游遷延固執不下臣恐而今而後宰相得欺朝廷大臣得罔君上居近列者得執私恩而毁公議為獄官者得捨實狀而結虛案紛紛讒寃望風而起將何以止之願陛下聖治之間一講祖宗遺範公賞公罰再清朝路臣不勝懇悃之劇乙酉殿中侍御史趙抃言陳執中信縱嬖人殺虐無罪陳乞置獄復自廢之情涉誣罔託疾歸第不赴大宴不赴聖節上夀一旦昂然復入中書殊無亷恥不恤人言身為大臣既破禮又壞法望亟正其罪六月壬子朔趙抃入對又言執中破壞禮法侮弄朝廷臣極口論列纍章抨彈誠恐陛下不得聞執中之罪而外庭之庸人又多附㑹迎承之者如此積日持久使天下之勢危則臣之為罪雖伏斧鑕肆市朝不足以償其默默也伏望陛下早發宸斷正執中之罪而罷免之則公議大協慶流宗社矣己丑以翰林學士歐陽修為翰林侍讀學士知蔡州知制誥賈黯知荆南皆從所乞也先是修奏疏言臣伏見宰臣陳執中自執政以來不叶人望纍有過惡招致人言而執中遷延尚玷宰府陛下憂勤恭儉仁愛寬慈堯舜之用心也推陛下之用心天下宜至於治者久矣而紀綱日壞政令日乖國日益困流民滿野濫官滿朝其亦何為而致此由陛下用相不得其人也近年宰相多以過失因言者罷去陛下不悟疑心一生視聽既惑遂成自用之意以謂宰相當由人主自去不可因言者而罷之故宰相雖有大過顯過而屈意以容之彼雖惶恐自欲求去而屈意以留之雖天災水旱饑民流離死亡道路皆不暇顧而屈意以用之其故非他直欲拒言事者耳言事者何負於陛下哉使陛下上不顧天災下不恤人言以天下之事委一不學無識諂邪狠愎之執中而甘心焉言事者本欲益於陛下而反損聖德者多矣然而言事者之用心本不圖至於此也由陛下好疑自用而自損也今陛下用執中之意益堅言事者攻之愈切陛下方思有以取勝於言事者而邪佞之臣得以因隙而入必有希合陛下之意者將曰執中宰相不可以小事逐不可使小臣動搖甚者則誣言事者欲逐執中而引用他人陛下方患言事者上忤聖聰樂聞斯言之順意不復察其邪佞而信之所以拒言事者益峻用執中益堅夫以萬乘之尊與一二言事小臣角必勝之力萬一聖意必不可回則言事者亦當知難而止矣然天下之人與後世之議者謂陛下拒忠言庇愚相以陛下為何如主也前日御史論梁適罪惡陛下赫怒空臺而逐之而今日御史又復敢論宰相不避雷霆之威不畏權臣之禍此乃至忠之臣也能忘其身而愛陛下者也陛下嫉之惡之拒之絶之執中為相使天下水旱流亡公私困竭而又不學無識憎愛挾情除改差繆取笑中外家私穢惡流聞道路阿㫖順意專事逢君此乃諂上傲下愎戾之臣也陛下愛之重之不忍去之陛下睿知聰明羣言善惡無不照見不應倒置如此直由言事者太切而激成陛下之疑惑耳執中不知亷恥復出視事此不足論陛下豈忍因執中上纍聖德而使忠臣直士卷舌於明時也臣願陛下廓然回心釋去疑慮法成湯改過之聖遵仲虺自用之戒盡以御史前後章疏出付外廷議正執中之過惡罷其政事别用賢才以康時務則天下幸甚已而修及黯皆得補外殿中侍御史趙抃言竊見近日以來所謂正人賢士者紛紛引去如吕溱知徐州蔡襄知泉州吳奎被黜知夀州韓絳知河陽府此皆衆所共惜其去又聞歐陽修乞知蔡州賈黯乞知荆南府侍從之賢如修輩無幾今堅欲請郡者非他蓋傑然正色立朝既不能曲奉權要而乃日虞中傷皆欲效溱襄奎絳而去耳今陛下又從其請而外補之萬一有緩急之事則陛下何從而詢訪也何從而質正也伏望陛下勿使修等去職留為羽翼以自輔助知制誥劉敞亦以為言修黯遂復留戊戌吏部尚書平章事陳執中罷為鎮海節度使同平章事判亳州孫抃等既入對極言執中過惡請罷之退又交章論列抃最後乞解憲職補外以避執中朋黨中傷之禍於是執中卒罷抃尋改翰林學士承旨始御史因執中殺婢事欲擊去之帝未聽而諫官初無論列者御史并以為言而趙抃攻范鎮尤力臺官皆助之鎮纍奏乞與御史辨不報及御史入對又言執中私其女子傷化不道執中既罷帝以諭鎮鎮復言朝廷置御史以防讒慝非使其為讒慝也審如御史言則執中可誅如其不然亦當誅御史并繳前五奏乞宣示執政相與庭辨之卒不報鎮由是與趙抃有隙以忠武節度使知永興軍文彥博為吏部尚書平章事昭文館大學士宣徽南院使判并州富弼為户部侍郎平章事是日宣制帝遣小黃門數輩覘於庭士大夫相慶得人後數日翰林學士歐陽修奏事殿上帝具以語修且曰古之求相者或得於夢卜今朕用二相人情如此豈不賢於夢卜哉修頓首稱賀癸卯以龍圖閣直學士張忭權御史中丞帝嘗諭執政以忭清直可任風憲故使代孫抃時弼初入相修復為翰林學士士大夫咸謂三得人云甲辰以觀文殿大學士知鄆州龎籍為昭德節度使知永興軍尋改知并州籍過京師入對帝新相文彥博富弼意甚自得謂籍曰朕用二相何如籍曰二臣皆朝廷髙選陛下拔之甚副天下望帝曰誠如卿言文彥博猶多私至於富弼萬口一詞皆曰賢相也籍曰文彥博臣頃與同在中書詳知其所為實無所私但惡之者毁之耳况前者被謗而出今當愈畏謹矣富弼頃為樞密副使未執大政朝士大夫未有與之為怨故交口譽之冀其進用而已亦有所利焉若弼以陛下之爵祿樹私恩則非忠臣何足賢若一以公議槩之則向之譽者將轉而為謗矣陛下所宜深察也且陛下既知二臣之賢而用之用之則當信之堅任之久然後可以責其成功若以一人言進之未幾又以一人言疑之臣恐太平之功未易卒致也帝曰卿言是也乙巳儂智髙母儂氏弟智光子繼宗繼隆伏誅以工部侍郎知桂州余靖為户部侍郎知雍州蕭注為引進副使留再任注募死士使大理國購智髙南詔久與中國絶林箐險深接生蠻語皆重譯行百日乃通智髙亦自為大理所殺函其首至京師考異大理國函智髙首送京師此據蕭注傳然智髙本𫝊云智髙卒不出其存亡莫可知未知孰是又司馬光百官表大事記至和二年四月亦書儂智髙死於大理秋七月癸亥翰林學士歐陽修請自今兩制兩省以上非因公事不得與執政相見及不許臺諫官往還詔如有公事許就白於中書樞密院甲子詔凡宰相召自外者令百官班迎之自內拜者聽行上事儀國朝待宰相蓋令有故事其後多承例辭至是文彥博富弼入相御史梁蒨請班迎於國門范師道又請行上事禮然亦辭之戊辰以資政殿大學士兼翰林侍讀學士吳育為宣徽南院使判延州育侍讀禁中帝因語及臣下毁譽多出愛憎育曰聖言要切實四海之幸然知而形之於言不若察而行之於事自古人君因信讒邪而致亂照奸險而致治至於安危萬端不出愛憎二字逹之則羣書不足觀不逹雖博覽無益也蓋人主事有不可不密者有不可不明者語及軍國幾微或干權要不可不密也若指人姓名隂言其罪而事狀未見者不可不明也若不明則讒邪得計忠正難立曲直莫辨愛憎遂行故曰偏聽生奸獨任成亂是故聖王之行如天地日月坦然明白進一人使天下皆知其善黜一人使天下皆曉其惡則邪隂不能陷害公正可以立身此百王之要道也帝益重之數欲大用而諫官或誣奏育在河南嘗貸民出息錢久之遂命出帥考異李燾曰育正傳云為諌官劉元瑜誣奏案元瑜此時實知潭州必非元瑜也今沒其姓名當徐考之蘇軾常記王鞏云陳執中罷相仁宗問誰可代執中舉吳育上即召赴闕㑹乾元節侍宴偶醉坐睡忽驚顧拊床呼其從者上愕然即除西京留臺鞏父素為鞏言此案育自陜州召入至和二年二月判都省此時陳執中方家居待罪不知何時薦育所云醉拊御床仁宗愕然因不復相育育有心疾當得事實足見非劉元瑜誣奏也然育為執中所薦亦未可曉又育出知延州非西京留臺嘉祐元年五月乃自延州徙河中二年八月自河中徙河南鞏所云差誤附見待考己巳罷三司市御箭翎初三司言御箭翎皆以兩末黑中白羽為之今監錮市人求之不可得帝曰箭之傳黑白羽但取其文采耳然不若雞翎之徑也因令罷市翰林學士歐陽修奏疏言臣近者為京師土木興作處多乞行減罷尋准敕差臣與三司相度減定續具奏聞次今又聞聖㫖下三司重修慶基殿及奉先寺屋宇臣伏見近年民力困貧國用窘急小人不識大計但欲廣耗國財務為己利託名祖宗張大事體况諸處神御殿棟宇堅固未必損動近年以來不住修換昨開先殿只因兩柱損遂換一十三柱廣張功料以圖酬奬恩澤臣切見纍年火災自玉清昭應洞真上清鴻慶夀寧祥源㑹靈七宫開寶興國兩寺塔殿並皆焚燒蕩盡足見天意厭土木之華侈為陛下惜國力民財譴戒丁寧前後非一陛下與其廣興土木以事神不若畏懼天戒而修省其已興作者既不可及其未修者宜速寢停八月己酉契丹主殂於秋山之行宫年四十一諡曰神聖孝皇帝考異契丹國志云諡文成長編因之今從遼史興宗紀廟號興宗興宗性佻逹嘗與教坊司王稅輕等數十人約為兄弟出入其家至拜其父母數變服入酒肆佛寺道觀王綱姚景熙馮立輩遇之於微行後皆任顯官尤重浮圗法僧有正拜三公三師兼政事令者凡二十人馬保忠嘗勸以臣下無勳勞宜且序進之怫然怒曰若爾則是君不得專豈社稷之福耶保忠惶恐自是欲有遷除必先厚賜貴臣以絶其言親信者拉和爾楚等數十人皆拔處將相嘗夜燕與劉四端兄弟及王綱入樂隊命后易衣為女道士后父蕭穆濟曰漢官皆在后妃入戲恐非所宜興宗毆穆濟敗面曰我尚為之若女何人耶興宗善畫嘗以所畫鵝雁來獻帝作飛白書答之子燕趙國王洪基受遺詔即皇帝位改重熙二十三年為清寧元年以重元為皇太叔庚寅詔流內銓臣僚陳乞子孫當得試銜知縣者自今並與權注初等幕職官仍著為令辛卯知諫院范鎮言比者京師及輔郡嵗一赦去嵗再赦今嵗三赦又在京諸軍嵗再賜緡錢姑息之政無甚於此夫嵗一赦者細民謂之熱恩以其必在五月六月間也猾胥奸盜倚為過惡指以待免况再赦至三赦乎今防秋備塞之人無慮五六十萬使聞京師端坐而受賜者能不動心哉請自今罷所謂一赦以摧姦猾而使善良得以立罷兵士之特賜錢以均內外而使民力得以寬乙未知諫院范鎮言先朝以御寶印紙給言事官使以時奏上所以知言者得失而殿最之今陛下雖喜聞諫諍然考其施行其實無幾豈大臣因循而多廢格乎請據今御史諫官具員置章奏簿於禁中時時觀省仍以尚書省所置簿具言行否每季録付史官詔中書置臺官言事簿令以時檢句銷注之仍録與樞密院壬子詔曰任職之臣則有考課遷官之法而宗姓不預吏事先朝著格使十八年一遷所以隆族示愛教忠厚也朕尚念夫本支之秀昭穆之近而有耆老久次者其令中書樞密院第其服屬自明堂覃恩後及十年咸與進官近緣特恩改轉者須更十年乙卯觀文殿學士尚書左丞髙若訥卒車駕臨奠贈右僕射諡文莊御篆其碑首曰儒賢之碑九月戊午契丹告哀使至帝為發哀成服於內東門幕次遣使祭奠弔慰及賀其新主癸亥詔學士舍人院自今召試未有科名人復試三題冬十月丙戌録唐長孫無忌後己丑詔京畿毋領輔郡罷京畿轉運使提㸃刑獄乙未出內藏庫錢百萬下河北市糴軍儲丙申以主客員外郎吳中復為殿中侍御史裏行戊戌監修南京鴻慶宫內臣請於本宫隙地建皇帝本命殿帝曰建宫觀所以為民祈福豈可勞民自為耶其遇本命道場日止令設板位祠之己亥以開封府判官殿中侍御史俞希孟為言事御史御史中丞張忭等言希孟自入臺以來論事私邪動多迎合今略舉一二事衆所共聞者言之前年內臣王守忠請節度使俸給漸開其端以圖節鉞諫官韓絳力言不可家居待罪希孟輒上言稱恩命己行只乞後不得為例又中書劄子下御史臺同刑法寺定百官行馬失序事同時聚議皆云臣子對君失儀尚䝉矜恕不作遺闕豈為偶近兩府行馬趨朝既已贖銅又作過犯希孟承望大臣風㫖不顧君臣輕重之分不肯同署奏狀而乃獨入文字乞理為過犯此皆憸邪迹狀明白後因全臺上殿奏事陛下面責希孟不踰兩月除開封府判官中外喜快咸謂朝廷公明今却自府判復除言事臺官士人相顧失望伏乞别與一差遣壬寅改希孟為祠部員外郎荆湖南路轉運使癸卯侍御史梁蒨言近制兩府大臣遇假休日方許一見賓客非所以廣朝廷聰明也其開禁使接士如故從之考異御史臺記云蒨欲結文富故上言乞舉班迎故事朝議哂之又希執政意上言乞兩府私第不許接見賓客蒨性諂諛所言大抵類此按實録十月癸卯所書則蒨乃乞開兩府私第見客之禁與御史臺記不同恐馮潔已亦私有好惡也今不取此雖云從蒨所請然賈黯明年自知制誥出知許州猶以客禁為言則蒨所請初亦未從也當考己亥禮部貢院上删定貢舉條十二卷庚戌翰林學士刋修唐書歐陽修言自漢而下惟唐享國最久其間典章制度本朝多所參用所修唐書新制最宜詳備然自武宗以下並無實録以傳記别說考證虛實尚慮闕略聞西京內中省寺留司御臺及鑾和諸庫有唐朝至五代以來奏牘案簿尚存欲差編修官吕夏卿詣彼檢討從之十一月丙辰出內藏庫絹三十萬下并州市糴軍儲癸丑下溪州蠻彭仕羲入寇下溪州自彭允林至仕羲相繼為刺史者五世矣至是仕羲子師寶怨父取其妻來奔辰州訴仕羲嘗殺誓下十三州將奪其印符而併其地自號如意大王補置官屬將起為亂知辰州宋守信聞之乃以師寶為鄉𨗳帥兵數千深入討之仕羲遁入他洞不可得俘其孥而官軍戰死者十六七守信等皆坐貶自是蠻獠數入寇掠邊吏不能制矣乙卯交趾來告平南王李德政卒子日尊嗣詔贈德政侍中南越王初虞部郎中薛向言河北糴法之弊以為被邊十四州悉仰食度支嵗費錢五百萬緡得米粟百六十萬斛其實才直二百萬緡耳而嵗常虛費三百萬緡入於商賈蓄販之家今既用見錢實價革去三說虛估之弊矣然必有以佐之則其法可行故邊穀貴則糴澶魏粟漕黃御河以給邊新陳未交則散糴滅價以救民乏軍食有餘則坐倉收糴以待不足使見錢行而三利舉則河北之榖不可勝食矣於是詔置河北都大提舉便糴糧草及催遣黃御河綱運公事己未以向為之行並邊見錢和糴法十二月丁亥修六塔河河入中國行太行山曲折山間不能為大患既出大伾東更平地二千餘里特以隄防為之限夏秋霖潦百川所㑹不免决溢而大名鄆澶滑孟濮齊淄滄棣濱德博懷衛鄚等郡及開封往往受其害至是河决大名館陶殿中丞李仲昌請自澶州商胡河穿六塔渠入橫隴故道以披其勢富弼是其策詔發三十萬丁修六塔河以回河道以仲昌提舉河渠翰林學士歐陽修以常奉使河北知河决根本上疏言河水重濁理無不淤淤從下流下流既淤上流必决水性避髙决必趨下以近事驗之决河非不能力塞故道非不能力復但勢不能久必决於上流耳橫隴功大難成雖成必有復决之患六塔狹小不能容受大河以全河注之濱棣德博必被其害不若因水所趨增治隄防疏其下流浚之入海則河無决溢散漫之憂數十年之利也帝不聽知制誥劉敞奉使契丹素習知山川道徑契丹道之行自古北至栁河回互殆千里欲夸示險逺敞質譯人曰自松亭趨栁河甚徑且易不數日可抵中京何為故道此譯相顧駭愧曰實然但通好以來置驛如是不敢變也順州山中有異獸如馬而食虎豹契丹不能識問敞敞曰此所謂駮也為說其音聲形狀且誦山海經管子書曉之契丹益歎服丁酉詔武臣有贓濫者毋得轉橫行其立戰功者許之庚子契丹遣使致興宗遺留物及謝弔祭庚戌太白晝見壬子新修醴泉觀成即祥源觀也因火更其名契丹主自即位以來求直言者再是月親御清凉殿策進士張孝傑等四十四人復詔設學飬士頒五經傳疏置博士助教各一員資治通鑑後編卷六十四
