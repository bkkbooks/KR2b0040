body:
  text: 資治通鑑後編卷一百三十一刑部尚書徐乾學撰宋紀一百三十一起著雍困敦正月盡𤣥黓掩茂十二月凡五年寧宗法天備道純德茂功仁文哲武聖睿恭孝皇帝慶元四年春正月己亥朔日有食之宋史不書今據金史章宗紀書之癸卯金諭有司凡館接伴并奉使者毋以語言相勝務存大體乙卯上欽宗朱皇后諡曰仁懷皇后后北遷無凶問丙寅以葉翥同知樞密院事二月辛未詔兩省侍從臺諫各舉所知毋薦宰執親黨三月壬寅金始𣙜醋丁巳金敕隨處盜賊毋以强為竊以多為少以有為無嘯聚三十人以上奏聞違者杖百甲子權攢憲聖慈烈皇后于永思陵乙丑金遣烏凌噶天益來弔祭夏四月丙戌祔仁懷皇后憲聖慈烈皇后神主于太廟丙申始御正殿是月右諫議大夫張釡請下詔禁僞學遣湯碩使金報謝五月己亥加韓托胄少傅賜玉帶己酉右諫議大夫姚愈復上言近世行險僥幸之徒倡為道學之名竊取程頥張載之說張而大之聾瞽愚俗權臣力主其說結為死黨陛下取其罪魁之顯然者止從竄免餘悉不問所以存全之意可謂至矣奈何習之深者怙惡不悛日懷怨望反以元祐黨籍自比如近日徐誼令弟藝援韓維謫筠州日諸子納官贖罪以求歸待此皆假借元祐大賢之名以欺天下後世當元祐時宰輔如司馬光輩其肯隂蓄邪謀窺伺神器自謂夢壽皇授鼎白龍登天如汝愚之無君者乎侍從如蘇軾輩其肯阿附權臣妄謂風雷之變為今天動威以彰周公之德如劉光祖者乎其肯當揖遜之際有但得趙家肉一塊足矣以助汝愚之為姦如徐誼者乎其餘百職事如秦觀輩其肯推尋宗派以為汝愚乃楚王之裔宜承大統如游仲鴻者乎其肯獻佞汝愚以為外間軍民推戴相公如沈清臣者乎其肯隂受汝愚指教圖兼握兵柄如張致逺者乎如此之類見於論疏不一而足此天下之所共知安可誣也夫元祐之黨如此而今僞黨如彼臣願特降明詔播告天下使中外曉然知邪正之實庶姦僞之徒不至假借疑似以盜名欺世於是命直學士院髙文虎草詔有云竊附元祐之衆賢實類紹聖之姦黨韓托胄大喜即遷文虎於要職秋七月己未四川都大茶馬丁逢入對極論元祐建中調停之害且引蘇轍任伯雨之言為證時薛叔似葉適坐汝愚黨久斥皆起為郡故逢有是言京鏜何淡深悅之薦為軍器監辛酉同知樞密院事葉翥罷以姚愈為兵部尚書愈浮沈州縣忽忽不得志阿附韓托胄遂得驟遷尋以病免八月丙子以謝深甫知樞密院事吏部尚書許及之同知院事及之諂事韓托胄無所不至居二年不遷見托胄流涕叙其知遇之意衰遲之狀不覺屈膝托胄惻然憐之故有是命托胄嘗值生辰羣公上壽既畢集及之後至閽人掩關大窘㑹門闌未閉及之俯僂而入當時有由竇尚書屈膝執政之語庚辰白氣亘天是月京鏜等以帝未有嗣請擇宗室子育之詔育太祖後燕懿王德昭九世孫與願于宫中時年六歲趙師􅋷附韓托胄得知臨安府托胄生日百官爭貢珍異師􅋷最後至出小合曰願獻少果核侑觴啓之乃粟金蒲桃小架上綴大珠百餘顆衆慙沮托胄有愛妾張談王陳四人皆封郡夫人其次有名位者又十人或獻北珠冠四枚於托胄托胄以遺四夫人其十人亦欲之師􅋷亟市北珠製十冠以獻十人者喜為求遷官拜工部侍郎托胄嘗與衆客飲南園過山莊顧竹籬草舍曰此真田舍間氣象但缺犬吠雞鳴耳俄聞犬嘷叢薄視之乃師􅋷也托胄大笑九月丁未頒慶元重修敕令式格詔造新厯先是太史言月食於晝而草澤言月食于夜詔祕書監楊子美測驗如草澤言有㫖改作仍命正字馮履常參定冬十月丁亥金定官民存留見錢之數設回易務更立行用鈔法十二月甲子朔金主獵于酸棗林大風寒罷獵凍死者五百餘人丙戍蠲臨安府民身丁錢三年五年春正月庚子奪前起居舍人彭龜年等官初趙汝愚定策時樞密院直省官蔡璉從旁竊聽因而漏言汝愚竄之既而逃還臨安韓托胄聞之乃使璉誣告汝愚定策時有異謀具列賓僚所言凡七十餘紙詔下大理捕鞫彭龜年曽三聘沈有開葉適項安世等以實其事中書舍人范仲藝謂托胄曰章惇蔡確之權不為不盛然而至今得罪于清議者以同文獄故耳相公胡為蹈之托胄曰某初無此心以諸公見迫不容但已蓋京鏜劉德秀主其議也托胄取録黃藏之事遂格張釜劉三傑張巖程松等論之不已詔纍經赦宥宜免然猶奪龜年三聘官而擢璉進義副尉壬戌建玉堂二月庚午金主御宣華門觀迎佛金西南路招討使布薩揆沿徼築壘穿塹連亘九百里營柵相望烽候相應人得恣田牧北邊遂寧辛未司空襄言揆治邊有功召赴闕拜參知政事癸酉白氣亘天乙酉諫議大夫張釡劾劉光祖佐逆不成蓄憤懷姦欺世罔上五罪先是光祖撰涪州學記謂學者明聖人之道以修其身而世方以道為僞以學為棄物好惡出于一時是非定于萬世學者宜謹其所先入以待豪傑之興此語聞于朝釡因劾之詔光祖落職房州居住夏四月癸亥金改提刑司為按察使司壬午金進封英王從憲為􅘵王五月壬辰朔班統天厯先是詔造新厯至是成賜名統天蓋自建隆迄慶元二百五十年間厯四十變上距黃帝之厯凡五十變矣議者謂自渡江以來統天尤為疏謬金主以旱下詔責躬求直言避殿减膳審理寃獄戊戍賜禮部進士曽從龍以下四百十一人及第出身是榜得真德秀魏了翁己亥金應奉翰林文字陳載言四事其一言邊民苦于冦掠其二農民困于軍須其三審决寃滯一切從寬茍縱有罪其四行省官員例獲厚賞而沿邊司縣曽不霑及金主是之壬子命諸州學置武士齊舍六月丁丑金右補闕楊庭秀言自轉對官外復令隨朝八品以上外路五品以上及出使外路有可言者並許移檢院以聞則時政得失民間利病可周知矣從之丁亥金定宫中親戚非公事傳逹語言轉遞諸物及書簡出入者罪是夏盜竊太廟金寶秋七月甲寅禁髙麗日本商旅博易銅錢八月乙亥白氣亘天辛巳太上皇疾平帝率羣臣詣壽康宫上壽成禮而還明日羣臣奉表稱賀戊子立沿邊諸州武舉取士法九月庚寅朔加韓托胄少師封平原郡王冬十月甲申金初置審官院十二月庚午建安仁宅惠濟倉庫于廣東諸州以給士大夫之死而不能歸者京鏜何淡等令言者上疏曰向來僞徒其大者已屏斥禁錮用懲首惡其次者亦投閒置散使省愆咎蓋為天下後世計使已往者得以悔過方來者可以逺罪融㑹黨偏咸歸皇極也今此類茍有洗濯自新者乞明詔大臣仰遵皇祖之訓姑與祠祿使知小懲大戒之福其長惡弗悛者必重置典憲投之荒逺庶幾咸知懲創宿道向方悉為皇極至正之歸以成聖明極辨之治是時劉德秀胡紘皆去韓托胄亦厭前事故鏜等令言者以建極之說投之托胄用其言而學禁漸弛一時廢絀之士稍稍牽復議者亦以為幸焉是月金右補闕楊庭秀請類集太祖太宗世宗三朝聖訓以時觀覽從之金進封淑妃李氏為元妃妃名師兒其家有罪沒入宫籍監父湘母王盼兒皆微賤大定末以監户女子入宫與諸宫女從宫教張建學故事以青紗障隔內外諸宫女居障內宫教自障外口說授之諸宫女中唯師兒易為領解建不知其誰但識其聲音清亮金主嘗問建諸宫女誰可教者建對曰就中聲音清亮者最可教金主以建言求之得師兒宦者梁道盛譽其才美勸金主納之金主好文辭師兒性慧黠能作字知文義尤善伺候顔色迎合㫖意遂大愛幸封昭容進為淑妃父湘以上三世皆追贈官爵兄喜兒舊嘗為盜與弟特爾格皆擢顯近勢傾朝廷射利競進之徒爭趨走其門南京李炳中山李著與通譜系超取美官胥持國附依以致宰相上下知其姦蠧不敢擊之雖擊之亦莫能去也自欽懷皇后殂中宫久虛位金主意屬李氏而祖宗故事與圖克坦唐古富察納喇等諸貴家世為婚姻李氏微甚恐為衆所格至是遂欲立之大臣固執不從臺諫以為言金主不得已進封元妃而勢位熏赫與皇后侔矣六年春正月己亥皇子坦生二月己巳雨土己卯率羣臣奉上太上皇玉牒聖政日厯㑹要于壽康宫甲申封媫妤楊氏為貴妃閏月庚寅以京鏜為左丞相謝深甫為右丞相何淡知樞密院事乙巳復留正少保觀文殿大學士致仕丁未雨土金右補闕楊庭秀言乞令尚書省左右官一人應入史事者編次日厯或一月或一季封送史院金主是其言仍令送著作局潤色付之三月甲子提舉南京鴻慶宫致仕朱熹卒熹登第五十年仕於外者僅九考立朝才四十日家故貧少依父友劉子羽寓崇安後徙建陽之考亭諸生自逺至者豆飯藜羮率與之共往往稱貸于人以給用非其道義一介不取也時攻僞學日急士之繩趨尺步稍以儒自名者無所容其身從游之士特立不顧者屏伏丘壑依阿巽懦者更名他師過門不入甚至變易衣冠狎游市肆以自别其非黨而熹日與諸生講學不休或勸其謝遣生徒笑而不答及疾革以深衣及所著書授黃幹手書與訣曰吾道之託在此吾無憾矣正坐整衣冠就枕而卒將葬右正言施康年言四方僞徒期㑹送僞師之葬其相聚也非妄談時人短長則繆議時政得失望令守臣約束從之於是門生故舊不敢送葬唯李燔率一二同志往㑹視封窆不少怵辛棄疾亦為文往哭焉熹少時慨然有志於道既博求之經傳復遍交當世有道之士延平李侗老矣嘗學於南劍羅從彥熹不逺數百里徒步往從之其為學大抵窮理以致其知反躬以踐其實而以居敬為主嘗謂聖賢道統之傳散在方冊自經㫖不明而道統之傳始晦於是竭其精力以研窮聖賢之經訓所著有易本義啓䝉蓍卦考誤詩集傳大學中庸章句或問論語孟子集注太極圖通書西銘解楚辭集注辨證韓文考異所編次有論孟集義孟子指要中庸輯略孝經刋誤小學書通鑑綱目宋名臣言行録家禮近思録河南程氏遺書伊洛淵源録儀禮經傳通解並行于世其門人最知名者黃幹李燔張洽陳淳李方子黃灝蔡沈輔廣戊辰金親王宰執百官再請上尊號不許己卯安定郡王子恭卒夏四月丙戍朔金百官再請上尊號不許己酉封宗子不璺為嗣濮王五月辛未以久旱詔中外陳朝廷過失及時政利害庚辰金地震六月乙酉朔日有食之考異金史章宗紀不書戊子太上皇后李氏崩于壽康宫年五十六壬辰遣吳旴使金告哀戊申同知樞密院事許及之以母喪去位秋七月癸亥金定居祖父母喪婚娶聽離法丁卯以御史中丞陳自强僉書樞密院事自强嘗為韓托胄童子師及托胄當國自强入都待銓欲見之無以自通僦居主人出入托胄家為言之托胄召自强比至則從官畢集托胄設褥于堂延自强升坐再拜次召從官同坐從官踧踖莫敢居上者托胄徐曰陳先生老儒汨沒可念坐客唯唯明日交章薦其才即除太學録未踰歲三遷為祕書郎既入館即改右正言踰月拜諫議大夫御史中丞旬日遂秉政提舉洞霄宫黃洽卒八月辛卯太上皇崩于壽康宫年五十四史臣曰光宗幼有令聞嚮用儒雅即位之初總權綱屏嬖幸薄賦寬刑有可觀者及夫宫闈妬悍閹寺交搆驚憂至疾孝養日怠孝宗之業衰焉甲午遣李寅仲使金告哀乙未日中有黑子丁酉左丞相京鏜卒鏜居政府唯奉行韓托胄風㫖又嘗薦劉德秀排擊善類僞學之名鏜實發之及卒諡文穆其子沆以家諱請改文忠言者以為楊億巨儒既諡曰文議者欲加一忠字竟不之與夫欲加一字猶且不可况諡以二字又欲極美乎望敕所司自今議諡務當其實其或不然當推古法以選舉不實論若定諡已下其子孫請再更易者以違制論從之壬寅皇子坦卒追封邠王諡冲溫癸卯權攢慈懿皇后于修吉寺九月乙卯祔慈懿皇后神主于太廟己未金修玉牒成定皇族收養異姓男為子者徒三年姓同者减二等立嫡違法者徒一年甲子婺州布衣吕祖泰上書請誅韓托胄祖泰祖儉從弟也性疏逹尚氣誼論世事無忌諱先是祖儉以言事貶祖泰語其友曰自吾兄之貶諸人箝口我雖無位義必以言報國當少須之今亦未敢以纍吾兄也至是祖儉卒祖泰乃擊登聞鼓上書論韓托胄有無君之心請誅之以防禍亂其略曰道學自古所恃以為國者也丞相趙汝愚今之有大勳勞者也立僞學之禁逐汝愚之黨是將空陛下之國而陛下不知悟耶陳自强何人徒以韓托胄童稚之師躐致宰輔陛下舊學之臣若彭龜年今安在哉蘇師旦平江之吏胥周筠韓氏之厮役人共知之今師旦乃以潜邸隨龍筠以皇后親屬俱得大官不知陛下在潜邸時果識所謂蘇師旦者椒房之親果有厮役之周筠者乎托胄之徒自尊大而卑朝廷一至於此願亟誅托胄師旦筠而逐罷自强之徒故大臣在者獨周必大可用宜以代之不然事將不測書下三省朝論雜起御史施康年以為必大實使之遂露章奏劾且謂淳熙之季王淮為首相必大嘗擠而奪之位首倡僞徒私植黨與今屏居田野不自循省而誘致狂生扣閽自薦以覬召用林采言僞學之成造端自周必大乞加貶削遂鐫必大一官降詔吕祖泰挾私上書語言狂妄拘管連州右諫議大夫程松與祖泰狎友懼曰人知我素與逰其謂我與聞乎乃獨奏言祖泰有當誅之罪且其上書必有教之者今縱不殺猶當杖脊黥面竄之逺方殿中侍御史陳讜亦以為言乃杖祖泰一百配欽州牢城必大上表謝曰臣疏庸一介際遇四朝逮事髙皇已遍塵於臺省受知孝廟復久玷于機衡不思勉效于同寅乃敢與聞於異論既肺腑衆所共見豈口舌獨能自明惟光宗興念元僚亦屢分於閫寄肆陛下曲憐末路爰俾遂于里居首將正於狐丘巢忽危於燕幕狂生妄發姓名輒及樵蘇公議大喧論罰盍輸薪粲僅削司徒之秩猶存平土之官陛下崇德尚寬馭民敬故國皆曰殺雖微可恕之情耄不加刑姑用惟輕之典遂令衰朽亦與生全臣有愧積中無階報上省愆田里視桑䕃之幾何托命乾坤比櫟材而知免初當路欲文致以罪而難其重名意或有辨論乃置於貶及奏至引咎紆徐言正文婉詔復其秩祖泰自期必死冀以身悟朝廷了無懼色既至府廷尹為好語誘之曰誰教汝共為章試言之吾且寬汝祖泰笑曰公何問之愚也吾固知必死而可受教于人且與人議乎尹曰汝病風喪心耶祖泰曰以吾觀之若今之附韓氏得美官者乃病風喪心耳尹乃宗室善堅据案作色涖制挺焉祖泰大呼曰公為天族同國休戚祖泰乃為何人家計安危而獲斯辱也尹亦慚趣使去祖泰道出潭州錢文子為醴陵令私贐其行托胄使人迹其所在祖泰乃匿襄鄧間時又有太學生於齊生題名中削去何淡以其排道學也淡大怒臨安尹希指捕治之太學生福人敖陶孫嘗為詩以弔趙汝愚而托胄未得其名俾其人併承之辭不伏乃移送大理劾其事掠治無完膚獄竟不就猶坐不應削淡名嶺南編管丙子遣丁常任使金致遺留物冬十月加韓托胄太傅辛丑雨土十一月癸丑朔日有食之考異宋史不書今據金史章宗紀書之詔宗子與願更名曮除福州觀察使令資善堂授書乙卯金以國史院編修官吕卿雲為左補闕兼應奉翰林文字審官院以資淺駁奏金主諭曰明昌間卿雲嘗上書言宫掖事辭甚切直皆他人不能言者卿輩蓋不知也臣下言事不令外人知乃是謹密正當顯用卿等宜悉之己未皇后韓氏崩諡恭淑癸亥皇子增生丙寅東北地震十二月癸未朔皇子增卒追封郢王諡冲英金詔改明年為泰和元年乙酉日中有黑子辛卯雨土權攢憲仁聖哲慈孝皇帝于永崇陵廟號光宗己亥金遣烏庫哩誼來弔癸壬寅權攢恭淑皇后于廣教寺癸卯祔光宗神主于太廟詔改明年為嘉泰元年遣虞儔使金報謝乙巳日中黑子滅庚戌祔恭淑皇后神主于太廟嘉泰元年春正月壬戍謝深甫等薦士三十有五人詔籍名中書以待選擢己巳金太府監孫復言方今在仕者三萬七千餘員而門廕補叙居三之二諸司待闕動至纍年蓋以補廕猥多流品混淆本末相舛至於進納之人既無勞績又非科第而亦廕及子孫無所分别欲流之清非澄其源不可金主從之詔更定廕叙法庚午以葛邲配饗光宗廟庭丙子金遣完顔充來弔祭二月戊子詔諸州訪求明厯之士壬辰遣俞烈使金報謝癸巳修光宗實録辛丑雨土三月丙寅雨雪雨雹戊辰雨電頒慶元寬恤詔令役法撮要己巳復雨雹戊寅臨安大火四日乃滅焚民居五萬三千餘家帝下詔罪已避殿减膳命臨安府察姦民縱火者治以軍法出內府錢十六萬米六萬餘斛分賜被火之家夏四月辛卯詔以風俗侈靡災後官軍營造務遵法制內出銷金鋪翠焚之通衢禁民無或服用五月丁卯命有司行寬恤之政十有六條乙亥監太平惠民局夏允中請用文彥博故事以韓托胄平章軍國重事托胄上疏歷叙家世榮寵言臣不能自奮濫叨世賞陛下龍飛之日面奉憲聖皇后㫖俾臣朝夕仰禆初政臣深惟綿薄不足以副使令忽聞局務言有劄子引文彥博故事肆為狂妄之言臣駭汗如雨斯人固不足責而臣之出處豈容不明伏望特降睿㫖許臣守本官致仕以全愚分帝手批慰留允中坐免仍令臨安府押出國門丁丑雨雹六月己亥金敕尚書省舉行奢僣之禁丙午太白經天秋七月乙卯知樞密院事何淡罷時吳挺子曦為殿前副都指揮使自以世守西蜀為國籓屏而身留行都不得如志乃厚賂宰輔規圖帥蜀未及賂淡韓托胄已許之淡持不可托胄怒曰始以君肯相就黜僞學汲引至此今顧立異耶遂與祠淡急於榮進阿附托胄斥逐善類賢士為之一空士論罪之癸亥雨雹甲子以陳自强參知政事張釡僉書樞密院事金主諭刑部官凡上書言及宰相者不得申省己巳以吳曦為興州都統制曦至興州因譖副都統制王大節罷之由是兵權悉歸于曦異志遂成矣金初禁廟諱同音字八月甲申僉書樞密院事張釜罷以張巖參知政事程松同知樞密院事巖松皆附韓托胄松諂之尤甚初托胄嘗以小故出其愛姬松時知錢塘縣以百千市之至則盛供帳舍諸中堂夫婦奉之甚謹居亡何托胄意解復召姬姬具言松敬待之意托胄大喜不二年擢為諫議大夫滿歲未遷殊怏怏乃市一妾獻之名曰松壽托胄曰奈何與大諫同名答曰欲使賤名常逹鈞聽耳托胄憐之遂得佐樞直龍圖閣致仕李祥卒祥直諒老成遏過揚善以植公論因罹黨籍後諡肅簡西遼主珠勒呼出獵奈曼屈出律伏兵八千擒之而據其位尊珠勒呼為太上皇朝夕問起居珠勒呼尋死遼祀始絶九月戊申朔金更定贍學養士法生員給民佃官田人六十畝歲支粟三十石國子生人百八畝歲給以所入官為掌其數先是户部尚書袁說友等言浙西圍田相望皆千百畝陂塘漊瀆悉為田疇潦則無地可瀦旱則無水可戽不嚴禁之後將益甚無復稔歲矣辛亥遣大理司直留佑賢宗正寺主簿李澄往浙西行視自淳熙十一年立石之後凡官民圍裏者悉開之己未雨土冬十月丙戍起居郎王容請以韓托胄定策事迹付史館從之壬寅金敕有司購遺書宜髙其價以廣搜訪其藏書之家有珍惜不願送官者官為謄寫畢復還之仍量給其直之半甲辰編光宗御集十一月丙寅太白晝見十二月乙卯太白經天庚寅復蠲臨安民身丁錢三年辛卯雨土辛巳金司空襄等率百官再請上尊號不許仍斷來章丁酉金司空襄等進新定律令敕條格式五十二卷辛丑詔頒行之乙巳金初定亷能官升注格二年春正月癸丑以蘇師旦兼樞密都承㫖初韓托胄為平江兵馬鈐轄時師旦以刀筆吏事之托胄愛其辨慧帝登極竄姓名于藩邸吏士內遂以隨龍恩得官至是權勢日盛丁卯陳自强等上髙宗實録侍御史林采右正言施康年上疏曰臣聞習僞者名教之僇人欺君者臣子之大罪欺與僞蓋人材風俗之所深患不可不察也茍有人焉方僞習之熾則從之及僞習之衰則攻之彼自以為媒身干進之計而不知墮在欺君之域其罪莫贖也臣嘗謂由慶元初迄今人之趨嚮一歸于正謹守而隄防之權在二三執政大臣其次在給舍又其次在臺諫設使朝廷未知其人有所除授給舍不繳駁臺諫不論列百執事從而指其人聲其罪可也今乃不然徒肆諸空言遂使當世譁然指攻僞為釣取爵祿之資乃投匭而上書陛辭而進說召見而賜對其論一本於此臣愚亦竊料陛下之厭聞也欲望下臣此章播告中外繼自今專事忠恪毋肆欺謾不唯可以昭聖朝公正之心抑亦有以杜僞習淆亂之患時禁學之禍雖本於韓托胄欲去異已以快所私然實京鏜創謀及鏜死托胄亦厭前事之紛紜欲稍更改以消中外之議且欲開邊而往時廢退之人又有以復讐之說進者故言官遂有此疏二月甲申弛僞學黨禁張孝伯知韓托胄已厭前事因謂之曰不弛黨禁恐後不免報復之禍籍田令陳景思托胄之姻也亦謂托胄當勿為己甚托胄然之於是趙汝愚追復資政殿學士黨人見在者徐誼劉光祖陳傅良章頴薛叔似葉適曽三聘項安世范仲黼黃灝詹體仁游仲鴻諸人咸先後復官自便又削薦牘中不係僞學一節俾勿復有言丁亥修髙宗正史寶訓戊子頒治縣十二事以風厲縣令癸巳禁私史有商人私持起居郎熊克中興小厯及九朝通略等書欲渡淮盱眙軍以聞遂命諸道察郡邑書坊所鬻書凡事干國體者悉令毁棄言者因請取禮部員外郎李燾續通鑑長編知龍州王稱東都事略監都鹽倉李丙丁未録及通略語録家傳等書下史房考訂或有禆于公議即乞存留從之夏四月庚寅雨雹五月甲辰朔日有食之金主如泰和宫壬戌諭有司曰金井捺鉢不過二三日留朕之所止一凉厦足矣若加修治徒費人力其籓籬不急之處用圍幕可也甲子更泰和宫曰慶寧長樂川曰雲龍己巳賜禮部進士傅行簡以下四百九十七人及第出身金敕御史臺京師拜廟及巡幸所過州縣止令灑掃不得以黃土覆道違者糾之六月己卯臨安火壬午濬浙西運河辛卯禁都民以火說相驚者庚子大雨雹秋七月辛亥封子覿為安定郡王八月丙子以吏部尚書袁說友同知樞密院事癸未建寶謨閣以藏光宗御集己丑作壽慈宫請太皇太后還內丙申金有司奏鳳凰見于磁州武安縣鼓山石聖臺甲午謝深甫等上慶元條法事類丁酉金皇子特哩生羣臣上表稱賀特哩元妃李氏所生也金主宴羣臣于神龍殿遣官報謝太廟山陵太清宫北嶽長白山九月丙寅嗣秀王伯圭卒追封䝉王諡憲靖庚午金封皇子特哩為葛王冬十月乙亥加上太皇太后尊號是月追復朱熹煥章閣待制致仕十一月甲辰金更定德運為土臘用辰庚戍以陳自强知樞密院事前同知樞密院事許及之參知政事十二月癸酉金以皇子特哩晬日放僧道度牒三千設醮于𤣥真觀為特哩祈福甲戍日中有黑子凡十二日乃消丁丑金主御慶和殿浴皇子詔百官用元旦禮儀進酒稱賀五品以上進禮物甲申立貴妃楊氏為皇后后少以姿容選入宫帝即位封媫妤恭淑皇后崩貴妃與曹美人俱有寵韓托胄以后頗涉書史知古今性警敏任權術而曹美人柔順勸帝立曹氏帝不從竟立后后由是怨托胄加韓托胄太師托胄以勢利蠱士大夫薛叔似辛棄疾陳謙等皆起廢顯用當時困于久斥者往往損晚節以規榮進政府樞密臺諫侍從皆出托胄之門而蘇師旦周筠又托胄厮役亦得預聞國政羣小滿朝勢焰熏灼庚寅大閲閏月丁未詔講官隨事開陳乙卯封福州觀察曮為衛國公復周必大少傅觀文殿大學士是冬皇子坰生未踰月卒追封華王諡冲穆䝉古特穆津姓却特氏其十世祖曰勃端察爾勃端察爾卒子巴噶哩台哈必齊嗣生子曰瑪哈多丹瑪哈多丹之孫曰海都衆立為君以兵攻伊囉勒而臣屬之形勢寖大四旁部族歸之者漸衆海都卒子拜星呼爾嗣拜星呼爾卒子敦巴該嗣敦巴該卒子噶布勒汗嗣噶布勒汗卒子巴爾達木嗣巴爾達木卒子伊蘇克依嗣并吞諸部落勢益盛大是為烈祖初伊蘇克依伐塔塔爾獲其部長特穆津伊蘇克依妻諤楞適生男因以所獲特穆津名之是為青吉斯皇帝䝉古本韃靼國漢胸奴北單于地也其種有二曰白韃曰黑韃白韃與山後九州接壤地狹而族少黑韃通漠北地廣而族多因蒙古山以為號韃語謂銀曰蒙古女真名其國曰大金故黑韃亦名其國曰大銀自是為青吉斯至此據徐霆黑韃事略鄒伸之使韃日録修入族人岱齊古特部號最强舊與伊蘇克依相善後生嫌隙絶不與通及特穆津卒伊蘇克依幼岱齊古特率衆來攻特穆津太集諸部兵與戰破走之時岱齊古特諸部多苦其主非法見特穆津寬仁時賜人以裘馬心悅之往往慕義來降㑹塔塔爾部長瑪固沁實埒圖背金約金主遣丞相襄帥兵逐之北走特穆津聞之發近兵自鄂諾河迎擊殺瑪固沁實埒圖盡虜其輜重克埒部長王汗名托里受金封爵為王番言音重故稱王為王汗初王汗為其叔父珠爾所敗以百餘騎奔蒙古伊蘇克依親將兵逐珠爾走西夏復奪部衆歸王汗王汗德之後復為奈曼所敗王汗出而復歸中道糧絶困乏之甚特穆津以父交好遣人往招王汗安置軍中振給之遂㑹于圖喇河上尊之為父王汗因此部衆稍集已而特穆津與弟楚齊格爾伐奈曼大敗之盡殺其諸將族衆積尸以為京觀奈曼之勢遂弱時岱齊古特猶强特穆津㑹王汗與其部長杭愛等大戰鄂諾河上敗走之斬獲無算是歲奈曼大㑹諸部衆來侵特穆津與王汗倚阿爾蘭為壁大戰于吹丹之野奈曼使神巫祭風雪欲因其勢進攻既而反風逆擊其陳奈曼軍不能戰欲引還雪滿溝澗特穆津勒兵乘之奈曼大敗資治通鑑後編卷一百三十一
