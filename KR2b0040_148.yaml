body:
  text: 資治通鑑後編卷一百四十八刑部尚書徐乾學撰宋紀一百四十八起屠維大荒落正月盡𤣥黓涒灘十二月凡四年度宗端文明武景孝皇帝咸淳五年春正月丁未以李庭芝為兩淮制置大使兼知揚州州新遭火公私蕭然庭芝放民負鹽二百餘萬又鑿河四十里入金沙餘慶場以省車運始平山堂瞰揚城敵至則構望樓其上張弓弩以射城中庭芝築大城包之募汴南流民二萬餘人以實之號武鋭軍修學賑飢民德之如父母戊午䝉古阿珠率衆侵復州德安府荆山等處掠萬人而去右丞相葉夢鼎扼於賈似道不得行其志乃引杜衍故事致仕單車宵遁癸亥詔以少保觀文殿大學士判福州辭不拜以馬廷鸞參知政事甲戌以江萬里參知政事蒙古括諸路以益襄揚遣史天澤與樞密副使呼拉齊往經畫之天澤至吕文焕遣使餉以鹽茗天澤築長圍起萬山包百丈山令南北不相通又築現山虎頭山為一字城聮亘諸堡為久駐計蒙古阿哈瑪特專總財賦以新立憲臺言於䝉古主曰庶務責成各路錢穀付之轉運今繩治之事何由辦請罷御史臺及諸道提刑司亷希憲曰立臺察內則彈劾奸邪外則察視非常訪求民瘼禆益國政無大於此者如阿哈瑪特所言必使上下専恣貪暴公行然後事可集耶阿哈瑪特語塞乃止二月己丑蒙古頒行新字詔曰國家創基朔方制用文字皆取漢楷及畏吾字以逹本朝之言考諸遼金及遐方諸國例各有字今文治寢興字書方缺特命國師帕克斯巴創䝉古新字頒行諸路譯寫一切文字期於順言逹事而已更號帕克斯巴為大寶法王其字凡千餘大要以諧聲為宗尋又詔主諸路䝉古字學各置教授三月丙午蒙古自白河率兵圍樊城遂築堡鹿門山己未詔浙西六郡公田設官督租有差辛酉京湖都統制張世傑將兵拒䝉古圍樊之軍戰於赤灘浦敗績世傑蒙古萬户張柔之從子從柔戌杞有罪來奔阮思聰見而竒之言於吕文德文德召置麾下纍功至都統制戊辰以江萬里為左丞相馬廷鸞為右丞相廷鸞每見文法太密功賞稽遲將校不出死力於邉閫升辟稍越拘攣賈似道頗疑異己黥堂吏以泄其憤己巳以馬光祖知樞密院事夏四月髙郵縣夏世賢七世義居詔署其門五月己酉知樞密院事馬光祖罷乙卯少保觀文殿大學士醴泉觀使程元鳯卒元鳯之在政府也一仕者求遷元鳯謝之其人纍請不許乃以先世為言元鳯曰先公疇昔相薦者以元鳯恬退故也今子所求躐次豈先大夫意哉矧以國家官爵報私恩元鳯所不敢有嘗遭元鳯論列者後見其可用更薦拔之曰前日之彈劾成其才也今日之擢用盡其才也帝聞訃震悼贈少師諡文清六月庚辰皇子是生母淑妃楊氏秋七月癸酉䝉古立國子學沿江制置副使夏貴襲䝉古阿珠於新郢敗績初貴率衆援襄樊乘春水漲輕兵部糧至襄陽城下懼蒙古軍掩襲與吕文焕交語而還及秋大霖雨漢水溢貴分遣舟師出沒東岸林谷間阿珠謂諸將曰此虛形不可與戰宜整舟師以備新城明日貴舟果趣新城至虎尾洲為䝉古萬户解汝楫等舟師所敗士卒溺漢水死者甚衆戰艦五十艘皆沒范文虎以舟師援貴至灌子灘亦為䝉古所敗文虎以輕舟遁九月丙寅明堂禮成加上皇太后尊號曰夀和聖福辛未蒙古以呼拉齊史天澤並平章政事阿里為中書右丞行河南等路中書省事薩達齊行陜西五路西蜀四川中書省事䝉古主歸自上都髙麗權臣林衍廢其主植而立植弟安慶公淐䝉古遣使往其國詳問條具以聞冬十月己卯蒙古定朝儀服色䝉古斡朵斯巴哈李諤還自髙麗以其臣金方慶至奉權國王淐表訴國王植遘疾令弟淐權國事丁亥詔遣兵部侍即黑達淄萊總管判官徐世雄召植淐及林衍俱赴闕命國王圗輦格以兵壓其境趙璧行中書省於東京仍降詔諭髙麗國軍民十一月癸卯髙麗都統領崔坦等以林衍作亂挈西京五十餘城附於䝉古丁未發兵往定髙麗髙麗國王植遣其臣朴烋從黑達入朝表稱受詔已復位尋當入覲乃命止誅林衍餘無所問䝉古築新城於漢江西十二月癸酉少師衛國公吕文德卒文德以許䝉古置權場為恨每曰誤國家者我也因疽發背致仕卒諡武忠賈似道以其壻范文虎為殿前副都指揮使總禁兵己丑䝉古作佛事於太廟七晝夜六年春正月壬寅以李庭芝為京湖制置大使督師援襄樊時夏貴范文虎相繼大敗聞庭芝至文虎遺書賈似道曰吾將兵數萬入襄陽一戰可平但願無使聽命於京閫事成則功歸恩相矣似道即命文虎為福州觀察使其兵從中制之庭芝屢約進兵文虎但與妓妾嬖幸擊鞠飲宴以取㫖未至為辭丙午蒙古左丞相耶律鑄右丞相亷希憲並罷希憲立朝讜正有內侍入朝堂傳㫖言某事當爾希憲曰此閹宦預政之漸不可啓也入奏杖之䝉古主嘗令希憲受帝師戒希憲對曰臣已受孔子戒矣䝉古主曰汝孔子亦有戒耶對曰為臣當忠為子當孝孔子之戒如是而已時有詔釋大都囚西域人特贊瑪丁為怨家所訴繫獄亦被原免蒙古主自開平還怨家復訴之時希憲在告實不預其事乃取堂判補署之曰天威不測豈可幸其獨不署以茍免耶遂與鑄俱罷䝉古主嘗問侍臣希憲居家何為阿哈瑪特曰日與妻孥宴樂耳䝉古主曰希憲清貧何從宴設阿哈瑪特愧而退希憲嘗有疾醫言須用沙糖作飲時最艱得家人求於外阿哈瑪特與之二斤且致密意希憲卻之曰使此物果能活人吾終不以奸人所與求活也䝉古立尚書省罷制國用使司以平章政事呼圗克岱爾為中書左丞相國子祭酒許衡為中書左丞制國用使阿哈瑪特平章尚書省事阿哈瑪特多智巧言以功利自負䝉古主急於冨國試以事頗有成績又見其與史天澤爭辨屢有以詘之由是竒其才授以政柄言無不從専愎益甚尚書既立詔凡銓選各官吏部定擬資品呈尚書尚書咨中書中書然後聞奏阿哈瑪特擢用私人不由部擬不咨中書安圗以為言蒙古主令問阿哈瑪特阿哈瑪特言事無大小皆委之臣所用之人臣宜自擇安圗因請自今惟重刑及遷上路總管始屬之臣餘並付阿哈瑪特䝉古主從之阿哈瑪特遂請重定條畫下諸路括户口增太原鹽課以千錠為常額甲寅髙麗國王植遣使詣蒙古言臣已復位今從七百人入覲詔令從四百人來餘留之西京詔改西京曰東寧府畫慈悲嶺為界以䝉古為安撫髙麗使率兵戌其西境辛酉頒成天厯丙寅以廣東經略安撫使陳宗禮僉書樞密院事吏部尚書趙順孫同僉書樞密院事故事宫中飲宴名曰排當理宗朝排當之禮多內侍自為之一有排當則必有私事密啓帝即位益盛至出內帑為之宗禮為給事中嘗上疏言內侍用心非借排當以侵羡餘則假秩筵以奉殷勤不知費幾州汗血之勞而供一夕笙歌之樂請禁絶之不報丁卯帝製字民牧民二訓以戒百官戊辰左丞相江萬里罷萬里以襄樊為憂屢請益師往救賈似道不答萬里遂力求去出知福州二月辛未䝉古以前中書右丞相巴延為樞密副使甲戌䝉古築昭應宫于髙梁河丙子䝉古主御行宫觀劉秉忠博囉許衡及太常卿徐世隆所起朝儀大恱舉酒賜之丁丑蒙古以嵗饑罷修築宫城役夫壬辰䝉古立司農司以參知政事張文謙為卿設四道巡行勸農司乙未襄陽出步騎萬餘人兵船百餘艘攻蒙古萬山堡為萬户張𢎞範等所敗髙麗國王植朝於䝉古䝉古令國王圗輦格舉軍入髙麗舊京以托克托多爾任一天翼為其國逹嚕噶齊護送植歸國仍下詔林衍廢立罪不可赦安慶公淐本非得己在所寬宥有能執送衍者雖其黨亦必重增官秩三月庚子朔日有食之蒙古改諸路行中書省為行尚書省甲寅蒙古主如上都戊午䝉古阿珠與劉整言圍守襄陽必當以教水軍造戰艦為先務詔許之於是造戰艦五千艘日練水軍七萬人雖雨不能出亦畫地為船而習之蒙古平章尚書省事阿哈瑪特勢傾中外一時大臣多阿附之中書左丞許衡每與之議必正言不少讓已而其子呼新有同僉樞密之命衡獨執奏曰國家事權兵民財三者而已今其父典民與財子又典兵不可䝉古主曰卿慮其反耶衡對曰彼雖不反此反道也帝以語阿哈瑪特阿哈瑪特由是怨衡欲以事中之衡屢入辭免䝉古主不許䝉古崔斌守東平聘夀張申屠致逺為學官致逺初與李謙孟琪等齊名蒙古主南征駐兵小濮奇實伊台薦為經略司知事軍中機務多所謀畫師至隨州所俘男女致逺悉縱遣之夏四月戊寅以文天祥兼崇政殿說書直學士院尋罷賈似道以去要君命學士降詔天祥當制語皆諷似道時內制相承必先呈藁於宰相天祥獨不循此例似道見制意不滿諷别院改作天祥援楊億故事亟求解職遷祕書監似道又使臺官張志立劾罷之天祥數被斥乃援錢若水例致仕時年三十七壬午䝉古檀州隕黑霜二夕己丑䝉古髙麗行省奏言髙麗權臣林衍死其子惟茂擅襲令公位為尚書宋宗禮所殺島中民皆出降己遷之舊京衍黨裴仲孫等復集餘衆立王植庶族承化侯為王竄入珍島五月辛丑以吳革為沿江制置宣撫使是月官軍及蒙古陜西僉省伊蘇岱爾嚴忠範等戰於嘉定重慶釣魚山馬湖江皆敗都統牛宣為蒙古所獲陷三寨虜掠人民及馬牛戰艦無算六月庚午詔太極圗說西銘易傳序春秋傳序天下士子宜肄其文丙申䝉古主籍田于大都之東南郊秋七月復開州更鑄印給之八月戊辰朔蒙古築環城以逼襄陽詔賈似道入朝不拜每朝退帝必起避席目送之出殿庭始坐繼復詔十日一朝時䝉古攻圍襄樊甚急似道日坐葛嶺起樓閣亭榭作半閒堂延羽流塑己像其中取宫人葉氏及倡尼有美色者為妾日肆淫樂與故博徒縱博人無敢窺其第者有妾兄來立府門若將入狀似道見之縛投火中嘗與羣妾據地鬭蟋蟀所狎客戲之曰此軍國重事耶酷嗜寶玩建多寶閣一日一登玩聞余玠有玉帶已殉葬發塜取之人有物求不與輒得罪自是或纍月不朝雖朝享景靈宫亦不從駕有言邉事者輒加貶斥一日帝問曰襄陽圍已三年奈何似道對曰北兵已退陛下何從得此言帝曰適有女嬪言之似道詰其人誣以他事賜死由是邉事雖日急無敢言者九月庚戌以黃萬石為沿海制置使冬十月丁丑詔范文虎總統殿司兩淮諸軍往襄樊備禦賜犒師錢一百五十萬台州大水己卯詔發倉米三萬餘石以賑之己丑䝉古主歸自上都閏月己酉以安吉州水免公田租四萬四千餘石十一月丁丑以嘉興華亭兩縣水免公田租五萬餘石民田租四千八百石乙未僉書樞密院事陳宗禮罷尋卒諡文定十二月丙申朔蒙古改司農司為大司農司添設巡行勸農使副各四員以御史中丞博囉兼大司農卿安童言博囉以臺臣兼領前無此例䝉古主曰司農非細事朕深喻此故令博囉總之尋以都水監𨽻大司農司䝉古以趙良弼為祕書監充國信使使日本丁未金齒驃國二部酋長內附於䝉古辛酉蒙古建大獲國仁王寺於髙梁河敕更定僧服色䝉古張𢎞範言於史天澤曰今規取襄陽周於圍而緩於攻者計待其自斃也然夏貴乘江漲送衣糧入城我無禦之者而江陵歸峽行旅休卒道出襄陽南者相繼寧有自斃之時乎若築萬山以斷其西立柵灌子灘以絶其東則速斃之道也天澤從之遂城萬山徙𢎞範于鹿門自是襄樊道絶糧援不繼七年春正月乙丑朔封皇子是為建國公己卯蒙古以同僉河南行省事阿里哈雅參知尚書省事丙戌䝉古髙麗安撫阿哈等略地珍島與林衍餘黨遇多所亡失中書省臣言諜知珍島餘糧將竭宜乘弱攻之詔不許令巡視險要常為之備二月丁酉䝉古發中都真定順天河間平灤民二萬八千餘人築宮城己亥蒙古移陜蜀行中書省于興元癸卯蒙古以東京行省事趙璧為中書右丞甲辰䝉古命呼圗克岱爾持詔招諭髙麗林衍餘黨裴仲孫乙巳䝉古大理等處宣慰都元帥寶哈丁王傅庫庫岱等謀毒殺皇子雲南王呼格齊事覺並伏誅辛酉蒙古敕凡訟而自匿及誣告人罪者以其罪罪之三月甲申蒙古主如上都䝉古中書左丞許衡上疏論阿哈瑪特專權罔上蠧政害民諸事不報因以老疾請解機務䝉古主不許且命舉自代者衡奏曰用人天子之大柄也臣下泛論其賢否則可若授之以位則當斷自宸衷不可使臣下有市恩之漸乙酉拜衡集賢大學士兼國子祭酒即燕京南城舊樞密院設學衡聞命喜曰此吾事也因請徴其弟子王梓耶律有尚姚燧等十二人為齊長時所選弟子皆幼稚衡待之如成人愛之如子出入進退其嚴如君臣其為教因覺以明善因善以開蔽相其動息以為張弛課誦少暇即習禮或習書算少者則令習拜跪揖讓進退應對或射或投壺負者罰讀書若干遍久之諸生人人自得尊師敬業下至童子亦知三綱五常為生人之道䝉古封皇子燕王乳母趙氏為豳國夫人鞏德祿追封德育公夏四月壬寅髙麗鳯州經略司欣都遣人詣蒙古言逆黨裴仲孫稽留使命負固不服乞與呼琳齊王國昌分道進討䝉古主從之命髙麗簽軍征珍島戊午范文虎與蒙古阿珠等戰於湍灘軍敗統制朱勝等百餘人為䝉古所獲五月乙丑䝉古以東道兵圍守襄陽命薩達齊鄭鼎率諸將水陸並進以趣嘉定汪良臣彭天祥出重慶扎拉巴哈出瀘州竒爾濟蘇出汝州以牽制之所至順流縱筏斷浮橋獲將卒戰艦甚衆己巳蒙古修佛事于瓊華島己卯蒙古以史天澤平章軍國重事髙麗欣都上表於䝉古言珍島賊徒敗散餘黨竄入耽羅乙酉賜禮部奏名進士張鎮孫以下五百二人及第出身六月甲午䝉古敕樞密院凡軍事徑奏不必經由尚書省其干錢糧者議之己亥詔以陸九淵孫溥補上州文學范文虎將衛卒及兩淮舟師十萬進至鹿門時漢水溢阿珠夾江東西為陳别令一軍趣㑹湍灘犯其前鋒諸將順流鼓譟文虎軍逆戰不利棄旗鼓乘夜遁去蒙古俘其軍獲戰船甲仗不可勝計是月城五河口命鎮江轉米十萬石貯新城賜名安淮軍秋七月丁丑詔以張栻後人義倫補將仕郎壬午四川制置使朱祀孫言夏五以來江水凡三泛溢自嘉而渝漂蕩城壁樓櫓圮壞又嘉定地震者再被災害為甚乞賜黜罷上答天譴詔不允乙酉襄陽兵出興國攻䝉古百丈山營為阿珠所敗追至湍灘殺傷二千餘人八月壬戌朔日有食之壬子䝉古主歸自上都九月己丑皇子㬎生癸未蒙古主以四川民力困敝詔免茶鹽等課以軍民田租給軍食仍敕有司有言茶鹽之利者以違制論冬十月丙申嗣秀王與澤卒追封臨海郡王十一月乙丑䝉古建國號曰大元取易大哉乾元之義從太保劉秉忠請也十二月辛亥初置士籍賈似道欲制東南士心乃令御史陳伯大請籍士人開其鄉里姓名年甲三代妻室令鄉鄰結勘於科舉條制無礙方許納卷又嚴後省覆試法比校中省元卷字蹤稍異者黜之覆試之日露索懷挾有李鈁孫者少時戲雕股間索者視之駭曰此文身者事聞被時邉事危急束手無策而以科舉纍士人其悖謬至此初陳仲微為江西提刑忤賈似道罷去至是起知惠州遷太府寺丞輪對言祿餌可以釣天下之中才而不可以啖嘗天下之豪傑名航可以載天下之猥士而不可以陸沉天下之英雄似道怒又諷言者論罷其官甲寅元以尚書省遷入中書省八年春正月甲子元併尚書省入中書省平章尚書阿哈瑪特張易並為中書平章政事參知尚書省事張惠為中書左丞參知尚書省事李堯咨敏珠爾丹並為參知中書政事罷給事中中書舍人檢正等官仍設左右司省六部為四改稱中書辛未皇子昺生二月庚寅元奉使日本趙良弼遣書狀官張鐸同日本二十六人至中都求見壬辰元改中都為大都癸巳故左丞相謝方叔卒方叔相業無過人者晚困於權臣至以玩好丹劑夀其君為時論所鄙前知台州趙子寅死無所歸詔特贈直祕閣給沒官宅一區田三百畝飬其孤遺以旌亷吏甲午元命阿珠典䝉古軍劉整阿里哈雅典漢軍庚子元建中書省署於大都戊申元主如上都三月甲戌元阿珠劉整阿里哈雅陷樊城外郛守將堅閉內城阿珠等增築重圍以困之元賑濟南路飢夏四月辛巳元敕修築都城凡費悉從官給母取諸民元賑大都路飢襄陽被圍五年援兵不至吕文焕竭力拒之城中稍有積粟乏鹽薪布帛張漢英守樊城募善泅者置蠟書於髻藏積草下浮水而出謂鹿門既築勢須自荆郢救援至隘口元守卒見積草多鈎為薪泅者被獲郢鄧之路亦絶至是詔荆湖制置使李庭芝移屯郢州將帥悉駐新郢及鈞州河口以守要津庭芝闖知襄陽西北一水曰清泥河源於鈞房即其地造輕舟百艘每三舟聨為一舫中一舟裝載左右舟則虛其底而掩覆之出重賞募死士得襄郢山西民兵之驍悍善戰者三千人求將得民兵部轄張順張貴俱智勇素為諸將所服俾為都統號貴曰矮張順曰竹園張出令曰此行有死而已汝輩或非本心宜亟去毋敗吾事人人感奮漢水方生順流發舟稍進團山下又進髙頭港口結方陳各船置火鎗火炮熾炭巨斧徑弩夜漏下三刻起矴出江以紅燈為號貴先登順殿之乘風破浪徑犯重圍至磨洪灘元舟師蔽江無隙可入順等乘鋭斷鐵絙攢筏數百轉戰百二十里元兵皆披靡黎明抵襄陽城中久絶援聞順等至踴躍過望勇氣百倍及收軍獨失順越數日有浮尸溯流而上被甲胄執弓矢直抵浮梁視之則順也身中六箭怒氣勃勃如生諸軍驚以為神結塜斂葬之六月壬辰夜元大都大雨壞牆屋壓死者衆丙申徙皮龍榮於衡州龍榮舊宫僚也知賈似道忌之家居杜門不預人事一日帝偶問龍榮安在似道恐其召用隂諷湖南提刑李雷應誣劾以事徙衡州居住龍榮恐不為雷應所容未至飲藥卒龍榮少有志略精於春秋性伉直故卒為似道所擯死丁酉以吏部尚書章鑑同僉書樞密院事發錢千萬緡命京湖制置司糴米百萬石轉輸襄陽積貯己亥元山東行樞密院達實奏攻破宋漣州射龍溝五港口鹽場白頭河四堡斬首三百級俘獲人牛萬計辛亥臺臣言江西推排田結局已久舊設都官團長等虗名尚在占吝常役為害無窮又言廣東運司銀場病民詔俱罷之髙麗國王禃請元討耽羅餘冦秋七月元集都城僧誦大藏經九㑹壬午元和爾郭斯奏蒙古字設國子學而漢官子弟未有學者及官府文移猶有畏吾字詔自今凡詔令並以䝉古字行仍遣百官子弟入學八月丙戌朔日有食之乙巳元主歸自上都張貴入襄陽吕文焕固留共守貴恃其勇欲還郢乃募得死士二人能伏水中數日不食持蠟書赴郢求援於范文虎時元軍增守益密水路連鎖數十里列撒星椿雖魚蝦不得度二人遇椿即鋸斷之竟逹郢還報許發兵五千駐龍尾洲以助夾擊刻日既定九月貴别文焕東下㸃視所部軍泊登舟帳前一人亡去乃有過被撻者貴驚曰吾事泄矣亟行彼或未及知乃舉炮鼓譟發舟乘夜順流斷絙破圍冒進夜半天黑至小新河阿珠劉整分率戰艦邀擊貴以死拒戰沿岸束荻列燭火光如白晝至鈎林灘漸近龍尾洲遙望軍船旗幟紛披貴軍以為郢兵來㑹喜躍而進舉流星火示之軍船見火即前迎及勢近欲合則來舟皆元軍也蓋郢兵前二日以風水驚疑退屯三十里而元軍得逃卒之報先據龍尾洲以逸待勞貴力困且出不意與之戰所部殺傷殆盡貴身被數十創力不能支遂被執見阿珠於匱門關欲降之貴誓不屈乃見殺元令降卒四人舁貴尸至襄陽城下曰識矮張都統乎守陴者皆哭城中喪氣文焕斬四卒以貴祔葬順塜立雙廟祀之考異此事薛鑑連叙五月下非也今據元史世祖紀改正辛未有事於明堂以賈似道為大禮使禮成詣景靈宫將還大雨似道期帝雨止升輅胡貴嬪之兄帶御器械顯祖請如開禧故事却輅乘逍遙輦還宫帝曰平章得無不可顯祖紿曰平章已允帝遂歸似道大怒曰臣為大禮使陛下舉動不得預聞乞罷政即日出嘉㑹門帝固留之不得乃罷顯祖涕泣出貴嬪為尼似道始還自是專恣日甚畏人議己務以權術駕馭上下以官爵牢籠一時名士以故言路斷絶威福肆行相視以目冬十月丙戌元封皇子僧喇格為安西王賜京兆為分地癸巳元以趙璧為平章政事張易為樞密副使癸邜元初立㑹同館十一月馬廷鸞扼於賈似道力辭相位乙卯授觀文殿大學士知饒州入辭帝惻怛久之曰丞相勉為朕留廷鸞對曰臣死亡無日恐不得再見君父然國事方殷疆圉孔棘天下安危人主不知國家利害羣臣不知軍前勝負列閫不知陛下與元老大臣惟懷永圗臣死且瞑目泣拜而出丁卯元城光州己巳元發兵伐耽羅時朝廷患劉整為元用荆湖制置使李庭芝請以整為盧龍軍節度使封燕郡王帝從之遣永寧僧賫告身金印牙符及庭芝書期致之僧入元境事覺元主敕張易姚樞雜問整自軍中入見元主曰此宋人患臣用兵襄陽欲以此殺臣耳臣實不知元主賞整使還軍中誅永寧僧及其黨友且令整移書來責執政十二月元阿里哈雅奏言襄陽之有樊城猶齒之有唇也宜先攻樊城斷其聲援樊城下則襄陽可不攻而得元主以為然㑹回回人伊斯瑪音創作巨石炮來獻用省而所擊甚逺命送襄陽軍前用之甲寅召葉夢鼎入相詔加少傅夢鼎引疾力辭使者相繼促行扶病至嵊縣疏奏願上厲精寡欲規當國者收人心固邦本扁舟徑還使者以禍福告夢鼎曰亷恥事大死生事小萬無可回之理賈似道大怒勒令致仕是月遣將咎萬夀攻成都元僉省嚴忠範出戰失利同知王世英等八人棄城遁元以罪在主將免世英等縛忠範至都治之罷其官資治通鑑後編卷一百四十八
