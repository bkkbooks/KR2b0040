body:
  text: 資治通鑑後編卷七刑部尚書徐乾學撰宋紀七起昭陽作噩正月盡旃䝉大淵獻十二月凡二年太祖啓運立極英武睿文神德聖功至明大孝皇帝開寶六年春二月丙辰朔棣州兵馬殿直傅延翰謀反伏誅丙申曺州饑漕太倉米二萬石賑之是月髙麗王王昭卒子胄立三月乙卯朔房州言周鄭王殂帝素服發哀輟視朝十日諡曰恭帝命還葬慶陵之側號順陵辛酉新及第進士宋凖等十人諸科二十八人詣講武殿謝帝以進士武濟川三傳劉睿材質最陋應對失次絀去之時翰林學士李昉權知貢舉濟川昉鄉人也帝頗不恱㑹進士徐士亷等擊登聞鼓訴昉用情取舍非當帝以問翰林學士盧多遜多遜曰頗亦聞之帝乃令貢院籍終場下第者姓名得三百六十人癸酉召見擇其一百九十五人并凖以下及士亷等各賜紙札别試詩賦命殿中侍御史李瑩左司員外郎侯陟等為考官乙亥帝御講武殿親閲之得進士二十六人士亷與焉五經四人開元禮七人三禮三十八人三傳二十六人三史三人學究十八人明法五人皆賜及第又賜凖錢二十萬以張宴㑹責昉為太常少卿考官右贊善大夫楊可法等皆坐責自兹殿試為常式試朝臣死王事者子陸坦等賜進士出身壬午以教船池為講武池關河為惠民河五丈河為廣濟河禁銅錢不得入畨界及越江海至化外夏四月乙酉詔諸州考試官今長吏精選僚屬才學公正者充知貢舉與考試官同看詳義卷定其通否即駁放不得優假虛至終場申禁私薦屬舉人募告者其賞有差舉人勒還本貫重役永不得入科場辛丑翰林學士盧多遜等上所修開寶通禮二百卷義纂一百卷並付有司施行是日遣盧多遜為江南生辰國信使多遜至江南得其臣主歡心及還檥舟宣化口使人白國主曰朝廷重修天下圗經史館獨闕江東諸州願各求一本以歸國主亟令繕寫與之於是江南十九州形勢屯戍逺近户口多寡多遜盡得之歸即言江南衰弱可取狀帝嘉其謀始有意大用戊申詔參知政事薛居正監修梁後唐晉漢周五代史知制誥王祐等上重定神農本草二十卷帝制序摹印頒天下先是江南饑詔諭江南國主借船漕湖南米麥以賑之辛亥國主遣使修貢謝恩命錢文敏知瀘州召見帝謂曰瀘州近蠻獠尤宜撫綏聞知州郭思齊監軍郭重進擅斂不法卿為朕鞫之茍有一毫侵民朕必不赦富弼曰祖宗憂恤天下瀘州去京師四千一百里至僻逺其差知州必盡自處分蓋憂民恤物不限逺近故延接臣下亦無所間也五月癸丑帝知堂吏擅中權多為姦贓欲更用士人而有司所選終不及數遂召舊任者劉仲華等四人面加戒勵令復故嵗滿無過與上縣令稍有愆咎重置其罰樞密副使沈義倫居第卑陋處之宴如時貴要多冒禁市巨木秦隴間以營私宅及李守信受詔市木以盜官錢敗皆自啓於帝前義倫亦嘗市木為母營佛舍因奏其事帝笑謂義倫曰爾非踰矩者知居第尚不葺因遣中使按圗督工匠五百人為治之義倫私告使者願得制度狹小使者以聞帝亦不違其志庚申參知政事劉熙古以户部尚書致仕己巳交州刺史丁璉遣使入貢詔以璉為靜海軍節度使安南都護交址郡王武寧節度使髙繼冲卒辛未女真侵遼邊殺遼都監烏勒達伊喇鄂囉羅驅掠邊民牛馬而去初京城左右軍巡院典司按鞫開封府舊選牙校分掌其職帝哀矜庶獄始詔改任士人六月辛卯閲試在京百司吏寶訓作流外人七百餘人于便殿勒歸農者四百人富弼曰流外入官最為冗雜出臨民政罕不侵漁于人太祖特减員數俾歸業省吏者正謂此耳初蜀民所輸兩稅皆以匹帛充折其後市價愈髙而官所收止依舊例帝慮其傷民壬寅詔西川諸州凡以匹帛折稅並凖市價知商州奚嶼希宰相意奏司户參軍雷德驤為文謗訕朝廷械繫德驤具狀以聞帝貸其罪削籍徙靈武德驤子有鄰意趙普實擠排之日夜求所以報普者於是舉發普堂後官胡贊李可度受賕事詞連祕書丞王洞及前攝上蔡主簿劉偉偉兄前進士侁并宗正丞趙孚帝怒悉下御史獄鞫實始有疑普意矣壬寅詔參知政事吕餘慶薛居正升都堂與宰相同議政事癸卯偉坐棄市孚等並决杖除名贊可度仍籍沒其家財以有鄰為祕書省正字厚賜之有鄰自是纍上疏告人隂事俄被病白晝見偉入室以杖擊其背有鄰號呼聲聞於外數日死趙普之為政也専廷臣多疾之帝初聽趙玭之訴欲逐普既而止盧多遜在翰林因召對數毁短普具言普嘗以隙地私易尚食蔬圃廣第宅營邸店奪民利帝訪諸李昉昉曰臣職司書詔普所為臣不得而知也帝默然自李崇矩罷帝於普稍有間及趙孚等抵罪普恩益替庚戌復詔薛居正吕餘慶與普知印押班奏事以分其權易州刺史賀惟忠卒惟忠性剛果洞曉兵法在易州葺治亭障撫士卒能得其心所向無敵十餘年無北寇邊民賴之及卒帝甚嗟悼即録其子昭度為供奉官先是諸道州府任牙校為馬步都虞候及判官斷獄多失其中秋七月壬子朔詔罷之改馬步院為司寇院以新及第進士九經五經及選人資叙相當者為司寇參軍中書擬左補闕辛仲甫為淮南轉運使帝不許乙亥選授三司户部判官賜錢百萬有𣙜酤主吏武希璉等二十餘輩逋嵗課三十餘萬緡連年械繫竭資産不能償餒死者數人搒督不已仲甫奏除之又請百官折俸今估實直八月乙酉罷成都府僞蜀嫁裝稅草澤王德芳考異宋史太祖本紀作王澤方今從長編上修河利害辛卯賜德芳同學究出身甲辰左僕射兼門下侍郎平章事趙普罷為河陽三城節度使同平章事普獨相凡十年剛毅果斷以天下事為己任嘗欲除某人為某官帝不用明日復奏之又不用明日更奏之帝怒裂其奏投諸地普顔色自若徐拾奏歸補綴復奏如初帝悟卒可其奏後果以稱職聞又有立功當遷官者帝素嫌其人不與普力請與之帝怒曰朕故不與遷官將奈何普曰刑以懲惡賞以酬功刑賞者天下之刑賞非陛下之刑賞也豈得以喜怒專之帝弗聽起普隨之帝入宫普立于宫門良久不去帝竟從其請一日大宴雨驟至帝不恱良久不止怒形於辭色左右皆震恐普因進言外間百姓政望雨于大宴何損不過沾濕供帳樂衣耳此時雨難得乞令樂官就雨中奏技帝大恱終宴普臨機制變能回帝意類此常設大瓦壺于視事閣中中外表疏普意不欲行者必投之壺中束緼焚之其多得謗咎殆由此也普既出鎮上書自訴云外人謂臣輕議皇弟開封尹皇弟忠孝全德豈有間然矧昭憲皇太后大漸之際臣實預聞顧命知臣者君願賜昭鑒帝手封其書藏之金匱九月吏部侍郎參知政事吕餘慶以疾求解職丁卯罷為尚書左丞餘慶為帝霸府元僚趙普李處耘皆先進用餘慶恬然不以介意處耘獲罪時餘慶知江陵還朝帝委曲問處耘事餘慶以理解釋及普忤㫖左右爭傾之餘慶獨為明辨帝意稍解時稱長者己巳封皇弟開封尹光義為晉王以山南西道節度使光美為永興節度使兼侍中皇子貴州防禦使德昭為山南西道節度使同平章事吏部侍郎參知政事薛居正為門下侍郎樞密副使户部侍郎沈義倫為中書侍郎並平章事翰林學士兵部貟外郎知制誥盧多遜為中書舍人參知政事左驍衛大將軍判三司楚昭輔為樞密副使壬申詔晉王光義班宰相上江南內史舍人潘佑與户部侍郎李平平初見乾祐元年最相親善佑好神仙事平頗知修練導養之術佑特信之佑嘗言於國主曰富國之本在厚農桑因請復井田之法深抑兼并有買貧者田皆令歸之又依周禮造牛籍使盡闢曠土以種桑薦平判司農寺以督之符令行下急於星火百姓大撓國主遽遣罷之佑疑執政沮已乃歷詆大臣與握兵者兩為朋比旦夕將謀反叛且言國將亡非已為相不可救江南政事多在尚書省因薦平可知省事司天監楊熙澄可任樞密軍校侯英可典禁衛國主不納佑益忿抗疏請誅宰相湯恱等數十人國主手書教誡之佑遂不復朝謁居家屢上表言陛下既不能強又不能弱不如以兵十萬助收河東因率官吏朝覲此亦保國之良策也國主始恨之不復答佑復請致仕入山避難國主以為狂悉置不問冬十月壬午佑復上表曰古有桀紂孫皓破國亡家孽自己作尚為千古所笑今陛下取則姦回敗亂國家是陛下為君不及桀紂孫皓逺矣臣不能與姦臣雜處而事亡國之主使一旦為天下笑陛下必欲罪臣願賜誅戮以謝中外國主大怒推其狂悖謗訕始由李平乃先收平下大理獄後收佑佑即自殺母及妻子徙饒州平亦縊死獄中國主尋謂左右曰吾誅佑不獲已也明年皆宥其家廪給之佑初與張洎為忘形交其後俱為中書舍人稍相持佑嘗答洎書云堂堂乎張也難與並為仁矣佑之死洎頗有力焉洎時為清輝殿學士殿在苑中國主不欲洎逺離左右故授此職洎與太子太傅徐遼太子太保徐游别居澄心堂密畫中㫖多自澄心堂出游從子元楀等出入宣行之中書密院乃同散地甲申葬周恭帝不視朝丁酉以除名人雷德驤為祕書丞分判御史臺三院事初左藏庫使元城田仁朗為宦官所譛帝怒立召仁郎面詰之至殿門命去冠帶仁朗神色不撓從容言曰臣嘗為鳯州路壕寨都監伐木除道從大軍破蜀秋毫無所犯陛下固知之今主藏禁中豈復為姦利以自汚帝怒解止停其官乙巳起為𣙜易使少府監致仕盧億有髙識惡其子多遜所為嘗曰趙普元勳也而小子毁之禍必及我我得蚤死不及見其敗幸矣十二月庚子億以憂卒丙午多遜起復是嵗命參知政事盧多遜知制誥扈蒙張淡以見行長定循資格及泛降制書考正違異削去重復補其闕漏為長定格三卷循資格一卷起請條一卷書成上之頒為永式自是銓注益有倫矣李燾曰重定循資格實録在七月己未今從本志繫之嵗末始行開寶通禮七年春正月北漢改元廣運十國春秋曰歐陽五代史言孝和帝殁于天㑹十三年英武帝嗣位即改元廣運皆非也嘗稽定王劉繼顒碑文為右諫議大夫楊夢申所撰中云天㑹十二年今皇帝踐祚之初年也十七年繼顒卒末署廣運元年嵗次甲戍九月丙午朔而李惲千佛樓碑銘亦署廣運二年嵗次乙亥八月庚午朔夢申與惲本北漢臣此最可信云二月庚辰朔日有食之丙戍日有二黑子考異東都事略作丙子今從宋史壬辰慶州刺史姚內斌卒遣中使護喪歸葬洛陽內斌在慶州踰十年邊人畏伏目為姚大蟲言其虓勇如虎也三月遣使如遼四月丙午命左補闕南皮賈黃中檢視廣南民田黃中亷直平恕逺人便之還奏利害數十事皆稱㫖是月遼遣使耶律昌珠來聘五月戊申朔殿中侍御史李瑩坐受江南餽遺責授左贊善大夫監察御史劉蟠受詔於廬舒等州巡茶蟠乘羸馬僞稱商人抵民家求市民家不疑出茶與之即擒置於法壬戌命蟠同知淮南諸州轉運事江南國主天性友愛以弟從善被留悲戀不已嵗時宴㑹皆罷為却登髙文以見意於是遣常州刺史陸昭符入貢奉手疏求從善歸國考異南唐書繫此事於秋今姑從長編帝不許出其疏示從善慰撫之六月甲申以從善掌書記江直木為司門貟外郎通判兖州僚佐悉推恩又封從善母凌氏為吳國太夫人陸昭符在江南與張洎有隙帝雅知之因從容謂昭符曰爾國弄權者結喉小兒張洎何不入使爾歸可諭令一來朕欲觀之昭符懼遂不敢歸秋七月盧多遜既還江南國主知帝有南伐意遣使願受封冊帝不許於是復遣閣門使梁迥使焉迥從容問國主曰朝廷今冬有柴燎之禮國主盍來助祭國主唯唯不答迥歸帝始决意意伐之梁迥以此嵗夏出使不知何月今附此初江南人樊若水考異長編作若氷今從陳桱續編舉進士不中第上書言事不報遂謀北歸先釣魚采石江上用小舫載絲繩維於南岸而疾棹抵北岸以度江之廣狹凡數十往反而得其丈尺之數遂詣闕自言有策可取江南帝令送學士院試賜及第授舒州團練推官若水啓帝以老母及親屬皆在江南恐為李煜所害願迎至治所帝即詔國主護送國主聽命戊辰召若水為贊善大夫且遣使詣荆湖如若水之策造大艦及黃黑龍船數千艘南丹州蠻莫洪燕內附先是吳越王俶遣元帥府判官黃夷簡入貢帝謂之曰汝歸語元帥當訓練兵甲江南倔強不朝我將發師討之元帥當助我無惑人言帝又命有司造大第於薰風門外連亘數坊棟宇宏麗儲偫什物無不悉具乃召吳越進奏使錢文贄謂之曰朕數年前令學士承㫖陶榖草詔比於城南建離宫今賜名禮賢宅以待李煜及汝主先來朝者賜之且以詔草示文贄遂遣文贄賜俶羊馬諭㫖于俶八月戊寅俶遣其行軍司馬孫承佑入貢丁亥辭歸上厚賜俶器幣且密告以師期九月癸亥命潁州團練使曺翰領兵先赴荆南丙寅復命宣徽南院使曺彬侍衛馬軍都虞候洛陽李漢瓊判四方館事田欽祚同領兵繼之帝已部分諸將而未有出師之名欲先遣使召李煜入朝擇羣臣可遣者以左拾遺知制誥李穆使江南穆至諭㫖國主將從之光政使門下侍郎陳喬曰臣與陛下俱受元宗顧命今往必見留其若社稷何臣雖死無以見元宗於九泉矣張洎亦勸國主無入朝國主遂稱疾固辭且言謹事大國者蓋望全濟之恩今若此有死而已穆曰朝與否國主自處之然朝廷兵甲精鋭物力雄富恐不易當其鋒也宜熟計之無貽後悔使還具言其狀帝以為所諭要切江南亦謂穆言不欺己使還當在此月後今并言之是日又命山南東道節度使潘美侍衛步軍都虞候劉遇東上閣門使梁迥等同領兵赴荆南冬十月甲申帝幸迎春苑登汴隄發戰艦東下丙戍幸東水門發戰櫂東下江南國主復遣其弟江國公從鎰水部郎中龔慎修重幣入貢且買宴帝皆留之不報曺彬與諸將入辭帝謂彬曰南方之事一以委卿切勿暴略生民務廣威信使自歸順不須急擊也且以匣劒授彬曰副將而下不用命者斬之潘美等皆失色不敢仰視自王全斌平蜀多殺人帝每恨之彬性仁厚故専任焉考異邵氏見聞録云趙普實薦曺彬按此時普已罷相出鎮矣恐邵氏誤今不取丁酉以吳越王俶為升州東南面行營招撫制置使仍賜戰馬二百匹遣客省使丁德裕以禁兵步騎千人為俶前鋒且監其軍乙亥曺彬等自蘄陽過江破峽口寨殺守卒八百人生擒二百七十人獲池州牙校王仁震王宴錢興等三人甲辰以曺彬為升州西南面行營馬步軍戰櫂都部署潘美為都監曺翰為先鋒都指揮使初王師直趨池州緣江屯戍皆謂每嵗朝廷所遣巡兵但閉壁自守遣使奉牛酒來犒師尋覺異於他日池州守將戈彥遂棄城走閏月己酉曺彬等入池州先是上遣八作使郝守濬率丁匠自荆南以大艦載巨竹絙并下朗州所造黃黑龍船于采石磯跨江為浮梁先試於石牌口既成命前汝州防禦使靈丘陸萬友往守之丁巳曺彬等及江南兵戰於銅陵敗之獲戰艦二百餘艘生擒八百餘人庚申知制誥史館修撰扈䝉上言昔唐文宗每開延英召大臣論事必命起居郎舍人執筆螭拗以紀時政故文宗實録最為詳備至後唐明宗亦命端明殿學士及樞密直學士輪修日厯送史館近朝以來此事都廢每季雖有內殿日厯樞密院録送史館然所記者不過臣下對見辭謝而已帝王言動莫得而書緣宰相以漏泄為虞無因肯說史官以疏逺自隔何由得聞望自今凡有裁制之事優恤之恩發自宸衷可書簡冊者並委宰臣及參知政事每月輪知抄録以備史官撰集詔從之命盧多遜専其職壬戍曺彬等至當塗雄逺軍判官魏羽以城降我師先拔蕪湖又克當塗遂屯采石磯甲子監修國史薛居正等上所修五代史百五十卷明日上謂宰相曰昨觀新史見梁太祖暴亂醜穢之跡乃至如此宜其旋被賊虐也丁卯曺彬等敗江南二萬餘衆於采石生擒馬步軍副部署楊收兵馬都監孫震等又獲戰馬三百餘匹初江南無戰馬朝廷每嵗賜百匹至是驅為先鋒以拒我師既獲之驗其印記皆朝廷所賜者十一月癸未選大寧節度使李從善麾下及江南水軍凡一千三百餘人為禁旅號曰歸聖考異按宋史云黥李從善部下及江南水軍一千三百九十人為歸化軍今從楊仲良長編紀事本末詔移石牌鎮浮梁於采石磯繫纜三日而成不差尺寸大兵過之如履平地初為浮梁國主聞之以語張洎洎對曰載籍以來無有此事此必不成國主曰吾亦謂此兒戲耳於是遣鎮海節度使鄭彥華督水軍萬人天德都虞候杜真領步軍萬人同禦我師將行國主誡之曰兩軍水陸相濟無不捷矣彥華見顯德三年戊子吳越王俶遣使修貢謝招撫制置之命也并上江南國主所遺書其略云今日無我明日豈有君明天子一旦易地酬勳王亦大梁一布衣耳己丑知漢陽軍李恕敗江南鄂州水軍三千餘人獲戰艦四十餘艘甲午曺彬等敗江南兵於新寨考異作新竹寨今從楊氏長編紀事本末獲戰艦三十艘鄭彥華杜真與我師遇真以所部先戰彥華擁兵不救真衆大敗遼涿州刺史耶律琮致書於權知雄州孫全興其略云兩朝初無纖隙若交馳一介之使顯布二君之心用息疲民長為鄰國不亦休哉辛丑全興以琮書來上帝命全興答書許修好焉十二月金陵始戒嚴下令去開寶之號公私記籍但稱甲戌嵗益募民為兵民以財及粟獻者官爵之丁未漢陽兵馬監押寧光祚敗鄂州水軍於江北岸吳越王俶率兵圍常州己酉曺彬敗江南軍於白鷺洲癸亥吳越兵拔利城寨丙寅曺彬等破江南兵於新林港口庚午北漢寇晉州守臣武守琦敗之於洪洞辛未吳越王俶敗江南兵於常州北境上開寶八年春正月丙子權知池州樊若水敗江南兵四千人於州界初曺彬等師未出帝命王明為黃州刺史密授方略明既視事亟修葺城壘訓練士卒至是以明為池州至嶽州江路巡檢戰棹都部署辛巳明遣兵馬都監武守謙等渡江敗江南兵於武昌拔樊山寨是日行營左廂戰棹都監田欽祚破江南兵於溧水江南都統李雄謂諸子曰吾必死於國難爾曺勉之父子八人皆沒于陳乙酉帝御長春殿謂宰相曰古之為君鮮能正身自致無過之地朕常夙夜畏懼防非窒欲庶幾以德化人之義如唐太宗受人諫疏直詆其失曽不愧恥豈若不為之而使天下無間言哉為臣者或不終名節陷於不義蓋忠信之薄而獲福亦鮮斯可戒矣庚寅曺彬等進攻金陵行營馬軍都指揮使李漢瓊率所部渡淮南取巨艦實以葭葦順風縱火攻其水寨拔之初次秦淮江南兵水陸十餘萬背城而陳時舟楫未具潘美率所部先濟大兵隨之江南軍大敗江南復出兵將泝流奪采石浮梁美旋擊破之癸巳命京西轉運使李符益調荆湖軍食赴金陵城下二月權知潭州朱洞遣兵馬鈐轄石曦敗江南兵於袁州西界癸丑曺彬等敗江南兵於白鷺洲乙卯拔升州關城守陴者皆遁入其內城甲子知揚州侯陟敗江南兵於宣化鎮丁卯以知制誥王祐權知貢舉知制誥扈䝉左補闕梁周翰祕書丞雷德驤並權同知貢舉權同知貢舉始此戊辰帝御講武殿覆試王祐等所奏合格舉人王式等因語之曰向者登科名級多為勢家所取塞孤貧之路今朕躬親臨試以可否進退盡革前弊矣式等皆頓首謝於是內出詩賦題試之得進士王嗣宗以下三十人諸科紀自成等三十四人江南進士林松雷說試不中格以其間道來歸並賜三傳出身三月尚食供膳有蝨緣食器旁帝性寬仁多恕謂左右曰勿令掌膳者知帝嘗讀堯典歎曰堯舜之世四凶之罪止從投竄何近代憲綱之密耶蓋有意於措刑也故自二年至今詔所貸死罪凡四千一百八人乙亥權知廬州邢琪領兵渡江至宣州界攻拔義安寨庚寅曺彬等敗江南兵於江中壬寅遣中使王繼恩領兵數千人赴江南己亥遼使克實克慎思以書講和夏四月教坊使衛德仁以老乞外官且援同光故事求領郡帝曰用伶人為刺史此莊宗失政豈可效之宰相擬上州司馬帝曰上佐乃士人所處資望甚優亦不可輕授此輩但當於樂部遷轉爾乃命為太常寺大樂署令王明敗江南兵於江州界吳越兵圍常州刺史禹萬城距守大將金成禮劫萬城以其城降壬戍幸都亭驛臨汴觀飛江兵乘刀魚船習水戰曺彬等敗江南兵於秦淮北五月壬申朔以吳越國王錢俶守太師尚書令益食邑甲申吳越王俶言江隂寧逺軍及松江諸寨皆降丁酉王明破江南兵於武昌初陳喬張洎為江南國主謀請所在堅壁以老吾師吾師入其境國主弗憂也日於後苑引僧道誦經講易不恤政事軍書告急非徐元楀等皆莫得通師傅城下纍月國主猶不知時宿將皆前死神衛統軍都指揮使皇甫繼勳者暉之子也暉初見乾祐六年年尚少國主委以兵柄繼勳素貴驕初無效死意但欲國主速降而口不敢發每與衆云北軍強徑誰能敵之聞兵敗則喜見顔色曰吾固知其不勝也偏禆有募敢死士欲夜出營邀我師者繼勳鞭其背而拘之由是衆情憤怒一日國主自出巡城見吾師列柵城外旌旗滿野知為左右所蔽始驚懼乃收繼勳付獄殺之軍士爭臠割其肉頃刻都盡繼勳既誅凡兵機處分皆自澄心堂宣出實洎等専之也於是遣使召神衛軍都虞候朱令贇以上江兵入援令贇擁十萬衆屯湖口請將請乘江漲速下令贇曰我今進前敵人必反據我後戰而捷可也不捷糧道且絶奈何乃以書召南都留守柴克貞使代鎮湖口克貞以病遷延不行令贇亦不敢進國主纍促之令贇不從詔以嶺表之俗疾不呼醫自皇化攸及始知方藥商人齎生藥度嶺者勿算六月辛酉前鳯翔節度使太師兼中書令魏王符彥卿卒輟三日朝官給葬事彥卿武勇有謀善用兵遼人自陽城之敗尤畏彥卿或馬疾不飲齕必唾而咒曰是豈有符王耶初契丹滅晉北歸耶律德光母問其左右曰符彥卿安在或對曰在徐州母曰不以彥卿來何失策之甚也甲子彗出栁長四丈晨見東方西南指凡八十三日乃滅癸卯曺彬等敗江南兵於城下秋七月辛未朔日有食之初江南捷書纍至邸吏督李從鎰入賀潘慎修以為國且亡當待罪何賀也自是羣臣稱慶從鎰即奉表請罪帝嘉其得禮遣中使慰撫供帳牢餼悉從優給壬午復命李穆送從鎰還國手詔促國主來降且令諸將緩攻以待之左司員外郎權知揚州侯陟受賕不法為部下所訟追赴京師陟素善參知政事盧多遜私遣人求哀時金陵未拔帝以南土卑濕方秋暑軍中多疾疫議令曺彬等退屯廣陵休士馬以為後圗多遜爭不能得㑹陟新從廣陵來知金陵危蹙多遜教令上急變言江南事陟時被病帝令皇城卒掖入見即大言江南平在朝夕陛下奈何欲罷兵願急取之臣若誤陛下願夷三族帝屏左右召升殿問狀遽寢前議赦陟罪不治八月甲辰復以陟判吏部流內銓或云已發詔罷兵因陟言始命追還蓋誤也時方有此議爾癸亥丁德裕言敗江南軍於潤州城下九月壬申帝狩近郊逐兔馬蹶墜地因引佩刀刺馬殺之既而悔之曰吾為天下主輕事畋獵又何罪馬哉自是遂不復獵我師初起江南國主以京口要害擢素所親任侍衛都虞候劉澄為潤州留後臨行謂曰卿未合離孤孤亦難與卿别但此行非卿不可澄涕泣辭歸盡輦金玉以往謂人曰此皆前後所賜今當散此以圖勳業國主聞之喜及吳越兵初至營壘未成左右請出兵掩之澄不肯國主尋命凌波都虞候盧絳引所部舟師八千來救時澄已通降欵徐謂絳曰閒者言都城受圍日久若都城不守守此何為絳亦知城終陷遂潰圍而出戊寅澄帥將吏開門請降潤州平絳聞金陵危甚乃趣宣州日夕酣飲為樂或勸赴難皆不答初李從鎰至江南諭帝㫖國主欲出降陳喬張洎廣陳符命以為金湯之固未易取也北軍旦夕當自退國主乃止李穆既還帝復命諸將進兵及潤州平外圍愈急始謀遣使入貢求緩兵道士周惟簡常以冠褐侍講周易纍官至虞部郎中致仕於是張洎薦惟簡有逺略可以談笑弭兵鋒復召為給事中與修文館學士承㫖徐鉉同使京師時國主方督朱令贇舉湖口兵入援謂鉉曰汝既行即當止上江援兵勿令東下鉉曰臣此行未必能排難解紛城中所恃者援兵爾奈何止之國主曰方求和好而復召兵於汝豈不危乎鉉曰要以社稷為計置臣於度外耳國主泣下又以惟簡雅素髙尚不近榮利親寫十數紙題寫奏目令惟簡乘間求哀欲謝政養病冬十月己亥朔曺彬等遣使送鉉及惟簡赴闕鉉居江南以名臣自負其來也欲以口舌馳說存其國於是大臣亦先白帝言鉉博學有才辨宜有以待之帝笑曰第去非爾所知也既而鉉入朝仰而大言曰李煜無罪陛下師出無名帝徐召之升殿使畢其說鉉曰煜以小事大如子事父未有過失奈何見伐其說纍數百言帝曰爾謂父子為兩家可乎鉉不能對惟簡尋以奏目進帝覽之謂曰爾主所言我一不能曉帝雖不為緩兵然所以待鉉等皆如未舉兵時壬寅鉉等辭歸江南考異按實録徐鉉同惟簡凡再至京師故五代史及談苑太祖對鉉辭有不同今以五代史所載附之初見時談苑所載附之後見時上初答惟簡但云不曉爾主所言後遂詰責之初猶以理折鉉後乃直加威怒其事勢或當然也辛亥詔郡國令佐察民有孝弟力田竒才異行或文武可用者遣詣闕丁巳遣使修洛陽宫室帝始謀西幸也江南國復遣使貢銀五萬兩絹五萬匹乞緩師朱令贇自湖口以衆入援號十五萬縛木為筏長百餘丈戰艦大者容千人順流而下將焚采石浮梁王明屯獨樹口遣其子馳騎入奏帝密遣使令明于州浦間多立長木若帆檣之狀以疑之令贇獨乘大航髙十餘重上建大將旗幡至皖口行營步軍都指揮使劉遇聚兵急攻之令贇勢蹙因縱火距鬭㑹北風甚火反及之其衆悉潰己未生擒令贇及戰棹都虞候王暉等獲兵仗數萬金陵獨恃此援由是孤城愈危蹙矣考異本紀及劉遇傳皆云禽令贇于皖口王明傳乃云小孤山江南野録又云虎踞洲未知孰是今從本紀及劉遇傳監察御史劉蟠性清介寡合頗任數設詐以卜人主之遇蟠時領染院乙丑車駕臨幸蟠伺上將至輒衣短後衣芒屩持梃以督役頭蓬不治遽出迎謁帝以為能勤其官賜錢二十萬十一月徐鉉及周惟簡還江南未幾國主復遣入奏辛未對于便殿鉉言李煜事大之禮甚恭徒以被病未任朝謁非敢拒詔也乞緩兵以全一邦之命其言甚切至帝與反覆數四鉉聲氣愈厲帝怒因按劒謂鉉曰不須多言江南亦有何罪但天下一家臥榻之側豈容他人鼾睡乎鉉皇恐而退帝復詰責惟簡甚懼乃言臣本居山野非有仕進意李煜強遣臣來耳臣素聞終南山多靈藥他日願得棲隱帝憐而許之仍各厚賜遣還庚辰王明言敗江南兵於湖口先是曺彬等列三寨攻城潘美居其北以圗來上帝視之指北寨謂使者曰此宜深溝自固江南人必夜出兵來寇爾亟去語曺彬等併力速成之不然將為所乘矣賜使者食且召樞密使楚昭輔草詔令徙置戰棹以防他變使者食已即行彬等承命自督丁夫掘塹塹成丙戍江南人果夜出兵五千襲北寨人持一炬鼓噪而進彬等縱其至乃徐擊之皆殲焉又獲其將帥佩符印者凡十數人我師圍金陵自春徂冬居民樵采路絶曺彬終欲降之纍遣人告國主曰此月二十七日城必破矣宜蚤為之所國主不得已約先令其子清源郡公仲㝢入朝既而久不出彬日遣人督之且曰郎君不須逺適若到寨即四面罷攻矣國主終惑左右之言但報云仲㝢趣裝未辦宫中宴餞未畢二十七乃可出也彬又遣人告曰即二十六日出亦無及矣國主不聽先是帝數遣使者諭彬以勿傷城中人若猶困鬭李煜一門切無加害于是彬忽稱疾不視事諸將皆來問疾彬曰余疾非藥石所愈須諸公共為信誓破城日不妄殺一人則彬之病愈矣諸將許諾乃相與焚香為誓翼日彬即稱愈乙未金陵城陷將軍卨彥馬誠信及弟承俊帥壯士巷戰而死勤政殿學士豫章鍾蒨朝服坐於家亂兵至舉族就死不去初陳喬張洎同建不降之議事急又相要以同死社稷然洎實無死志於是擕妻子及槖裝入止宫中引喬同見國主喬曰臣負陛下願加顯戮若中朝有所詰責請以臣為辭國主曰歷數已盡卿死無益也喬曰縱不殺臣何面目見士人乎遂自經死洎曰臣與喬共掌樞務國亡當俱死又念陛下入朝誰與陛下辨明此事所以不死者將有待也考異張洎傳言洎與陳喬同升閣喬自經死洎視喬氣絶乃下而談苑載喬縊于視事㕔洎猶不知國史蓋因九國志陳喬傳所云恐九國志未可信也洎既已背約不死亦何待喬氣絶乃下閣乎談苑又言國主求喬不得或告洎以為喬已北降明年乃得喬尸按此則所云升閣者謬甚矣大抵城破時洎與喬猶同見國主請如前約喬遂死而洎不死耳洎固不能死所以同見國主者度國主必不許其死也彬整軍成列至其宫城國主乃奉表納降與其羣臣迎拜於門先見潘美設拜美答之次欲拜彬彬先使人語之曰介胄在身拜不敢答即選精卒千人守其門外令曰有欲入者一切拒之始國主令積薪宫中自言若社稷失守則盡室赴火死及見彬彬慰安之且諭以歸朝俸賜有限費用至廣當厚自齎裝既為有司所籍一物不可復得矣因復遣煜入宫惟意所欲取梁迥田欽祚等諫曰茍有不虞咎將誰執彬但笑而不答迥等力爭不已彬曰煜素無斷今已降必不能自引决可亡慮也又遣五百人為輦載輜重煜方憤歎國亡無意蓄財所攜極鮮頗以黃金分賜近臣彬既入金陵申嚴禁暴之令士大夫保全者甚衆仍大搜於軍無得匿人妻子倉廪府庫委轉運使許仲宣按籍檢視彬一不問師旋舟中惟圗籍衣衾而已十二月己亥朔江南捷書至凡得州十九軍三縣一百有八户六十五萬五千六十有五羣臣皆稱賀帝泣謂左右曰宇縣分割民受其禍攻城之際必有橫罹鋒刃者此實可哀也即詔出米十萬石賑城中饑民辛丑赦江南管內州縣常赦所不原者僞署文武官吏見釐務者並仍其舊令太子洗馬河東吕龜祥詣金陵籍李煜所藏圗書送闕下己未以恩赦侯劉鋹為左監門衛上將軍改封彭城郡公户部貟外郎知制誥王祐判門下省與判吏部流內銓侯陟不協陟所注擬祐多駁正陟訴於盧多遜多遜初為學士隂傾宰相趙普纍諷祐助己祐不聽多遜不恱癸亥祐坐陟事黜為鎮國行軍司馬考異司馬光日記云祐坐以百口保大名節度使符彥卿非跋扈逆上意故貶蓋誤也開寶三年彥卿已徙鳯翔祐貶時彥卿死矣先是帝嘗召吳越進奏使任知果令諭㫖於其王俶曰元帥克毗陵有大功俟平江南可暫來與朕相見以慰延想即當復還不久留也朕三執圭幣以見上帝豈食言乎崔仁冀亦告俶曰主上英武所向無敵今天下事勢已可知保族全民䇿之上也俶深然之甲子遼遣耶律烏珍來賀正旦丁卯俶請以長春節朝覲許之資治通鑑後編卷七
