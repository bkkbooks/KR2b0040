body:
  text: 資治通鑑後編卷五十三刑部尚書徐乾學撰宋紀五十三起昭陽協洽六月盡九月凡四月仁宗體天法道極功全德神文聖武睿哲眀孝皇帝六月甲辰詔天下茶鹽礬鐡銅銀坑冶之利慮有過取而傷民者轉運司諭所部官吏條上利害以聞初議欲弛茶鹽之禁及減商稅范仲淹以為茶鹽商稅之入但分減商賈之利耳於商賈未甚有害也今國用未省嵗入不可闕既不取之於山澤商賈必取之於農與其害農孰若取之商賈今為計莫若先省國用國用有餘當先寬賦役然後及商賈弛禁非所當先也其議遂寢癸丑知諫院歐陽修言近日四方賊盜漸多皆由國家素無禦備而官吏賞罰不行也今欣州軍賊王倫所過楚秦等州連騎揚旗如履無人之境而巡檢縣尉反赴賊召其衣甲器械皆束手而歸之此可謂心腹之大憂為今計者必先峻法令法令峻則人知所畏自趍擊賊請自今賊所經州縣奪衣甲官吏並追官勒停巡檢縣尉仍除名勒從軍自效俟破賊日則許敘之詔送樞密院施行甲子右正言余靖言今官吏弛事細民聚而為盜賊不能禁止者蓋賞罰不行也若非大設隄防以矯前弊則臣憂國家之患不在西北而起於封域之內矣南京者天子之别都也賊入城斬關而出解州池州之賊不過十人公然入城虜掠人户鄧州之賊不滿二十人而數年不能獲又清平軍賊入城變主泣告而軍使反閉門不肯出又京東賊大者五七十人小者三二十人桂陽監賊僅二百人建昌軍賊四百餘人處處蜂起而巡檢縣尉未知處以何罪當職大臣尚規規守常不立法禁深可為國家憂且以常情言之若與賊鬭動有死亡之憂避不殺賊止於罰銅及罰俸誰惜數斤之銅數月之俸以冒死傷之患哉乞朝廷嚴捕賊賞罰及立被賊劫質亡失器甲除名追官之法從之戊辰以翰林學士知制誥蘇紳知河陽先是王素歐陽修等為諫官數言事紳惡之會京師閔雨紳請對言洪範五事言之不從是謂不乂厥咎僣厥罰常暘紳意蓋指諫官時除太常博士馬端為監察御史紳所薦也修即上言端性險巧往年常發其母隂事母坐杖脊端為人子不能以禮防間陷其母於過惡又不能容隱使其母被刑理合終身不齒官聨豈可更為天子法官臣不知朝廷何故如此用人蓋其初不當令蘇紳舉人紳之姦邪天下共惡視端人正士如仇讎唯與小人氣類相合冝其所舉如此也伏乞寢端成命黜紳外任不可更令為人主侍從紳由是黜端尋亦出外己巳徙宣徽南院使忠武節度使夏竦判亳州竦之及國門也上封章疏示焉竦既還鎮言者猶不已會韓億致仕竦請代之故有是命既至亳州因上書自辨凡萬餘言詔付學士批答孫抃為之辭略曰圖功效莫若罄忠勤弭謗言莫若修行實竦得之甚恨語人曰吾於孫素無嫌而批答見詆如此何哉七月御史中丞王拱辰請用朔望日退御後殿召執政之臣賜坐以講時政得失帝曰執政之臣朕早暮所與圖事者至於從容開述雖至中昃朕何怠焉又何朔望之拘也辛未詔自今中書樞密院臣僚除常程奏事外如别有所陳或朕非時留對者不限時刻丙子參知政事王舉正罷為禮部侍即知許州初御史臺舉李徽之為御史舉正友壻也格不行徽之訟曰舉正妻悍不能制如謀國何而諫官歐陽修余靖蔡襄咸言舉正懦默不任職樞密副使范仲淹有宰輔才不宜局在兵府願罷舉正以仲淹代之舉正亦自求罷丁丑以樞密副使范仲淹為參知政事資政殿學士冨弼為樞密副使仲淹曰執政可由諫官而得乎固辭不拜弼直攜誥命納於帝前口陳所以牢避之意且曰願陛下坐薪嘗膽不忘修政帝許焉乃復以誥命送中書弼因乞補外纍章不許知諫院歐陽修言朝廷以郭承祐為鎮定部署臣自聞此除夙夜思惟國家用兵已五六年未有纎毫所得挫朝廷之威勢困天下之生靈患在朝廷拘守常例不肯越次擇材心知小人付以重任後雖敗事亦終不悔至如葛懷敏頃在西邉天下皆知其不可當時議者但曰捨懷敏别未有人難為換易及其戰敗身亡橫尸原野懷敏既不復生亦須别求人用臣謂今日任承祐亦猶當時用懷敏也况如承祐者凡庸奴𨽻之才不及懷敏逺甚頃在澶州只令築城幾至生變豈可當此一路臣謂朝廷非不知承祐非才議者不過曰例當敘進别無他人此乃因循之説耳方今黠冦狂謀禍端已兆前劉六符之來朝廷忍耻就議蓋為河朔無可自恃難與速爭須至屈意茍和少寬禍患今幸得此自紓之計冝多方精選將臣先為禦備猶恐不及豈是因循守例任用小人之日也其郭承祐欲乞早移與一不用兵處知州或召還别與一間散職秩壬午罷陜西管內營田甲申以樞密副使任中師為河東宣撫使范仲淹為陜西宣撫使仲淹既辭參知政事願與韓琦迭出行邉帝因付以西事而仲淹又言河東亦當為備中師嘗守并州帝即命使河東兩人留京師第先移文兩路云乙酉元昊復遣吕你如定等與邵良佐俱來所要請凡十一事其欲稱男而不為臣猶執前議也諫官歐陽修言元昊再遣使人至和之與否決在此行臣謂此最大事天下安危繫之今憂國者各為陛下深思逺慮惟恐廟堂失䇿遂落強冦之姦謀一曰天下困矣不和則力不能支少屈就之可以紓患一曰羌人險詐和而不敢罷兵則與不和無異是空包屈就之羞全無紓患之實一曰請和之後不過欲退而息休訓兵選將以為後圖然以河朔料之才和之後因循廢弛為患轉深一曰縱使元昊稱臣西邉減費然猶有大可憂者契丹必攬通和之事以為已功過有邀求遂興兵革是暫息小患於關西復生大患於河北臣旁採衆論雖有異同然大抵皆謂既和則難不和則易不和則害少和則害多不知朝廷之意其議云何請於使人未至之前先集百官廷議必有長䇿以禆萬一余靖言臣竊見朝廷每遇契丹遣使到闕元昊差人來朝大臣商量惟欲祕密兩制兩省御史中丞已下雖名侍從供奉之官當時並不聞知及處置既了縱或不便無由論列臣伏思國家建置侍從之官以救闕失蓋欲舉無過事謀無遺䇿也今柄臣密議外不得聞一慮或失救之不及勢之可憂者也伏乞宣諭大臣凡西北二邉之事繫於安危者侍從諌諍之官悉令聞之使陳利害不為漏泄傳云謀之欲多斷之欲獨此御國之要也惟陛下裁幸先是歐陽修言賊使此來意極不遜須有以挫之方能抑其驕慢乃可商量今若便於禮數之間過加優厚則彼謂我為怯知我可欺議論之間何由屈折伏乞將元昊一行來人凡事減勒無令曲加優厚至是修又言聞朝廷欲以殿中丞任顓館待元昊所遣來人臣竊謂事體之間所繫者大兵交之使來入大國必先窺伺將相勇怯覘察國家強弱若見朝廷威怒未息事意莫測必內憂斬戮次恐拘留使其偶得生歸自為大幸則我弱形未露壯論可持今若便損國威過加厚禮先為自弱長彼驕心使其知我可欺則議論愈益難合必欲成就其事尤須鎮重為先况其議未必成可惜空損事體前次元昊來人至少朝廷只以一班行待之今來漸盛遂差朝士若其後來者更盛則必須差近侍矣是彼轉自強我轉自弱况聞邵良佐昨來自彼僅免屈辱而還則彼雖小醜不謂無謀今其來人必須極騁強辭以圖相勝若能先薄其禮以折之亦挫賊之一端也其元昊來人欲乞更不差官館待送置驛中不須急問至於監視饋犒傳道語言一了事班行足矣修雖有此議然朝廷竟不能從也以著作佐郎邵良佐為著作郎仍賜五品服賞使夏州之勞也先是元昊書至既未肯稱臣及如定等來又多所要請兩府厭兵欲姑從之獨韓琦以為不可屢請對於帝前晏殊曰衆議已同惟韓琦獨異帝顧問琦琦歷陳其不便帝曰更審議之及至中書琦持不可益堅殊變色而起琦退復上章言與西界遣人議和其患有三昨朝廷曽逹意契丹欲令元昊納欵其答書云已遣人齎詔諭令息兵今朝廷若許其不臣契丹聞之必然别索名分既不可屈則恐因此為名再隳誓約此一患也若只許册為國主略增良佐所許嵗遺之數恐賊未副所望則謂朝廷已與之絶必忿而興兵契丹亦謂阻其意緣此生事此二患也若再使人齎詔諭以封册之禮不可異於北朝更優增良佐所許之數賊既從命則契丹以為已功遣使來賀或自尊大或頻有邀求久則難從此三患也朝廷始欲假契丹以制元昊事未可知而三患已形不得已則莫若擇其輕者行之其欲呼為吾祖及自稱年號又遣使到彼參於殿上與陪臣為列此事豈終為便望且令中書樞密院再三論難使朝廷得大體契丹無爭端以此議和庶為得䇿諫官蔡襄言元昊始以兀卒之號為請及邵良佐還欲更號吾祖吾祖者蓋先時兀卒之名知中國將許其稱呼即譯為吾祖足見羌人悖慢之意也吾祖猶言我翁今縱使元昊稱臣而上書於朝廷自稱曰吾祖朝廷賜之詔書亦曰吾祖是何等語耶時歐陽修余靖亦以為言修又曰方今不羞屈志急欲就和者其人有五一曰不忠於陛下者欲急和二曰無識之人欲急和三曰姦邪之人欲急和四曰疲兵懦將欲急和五曰陜西之民欲急和前四者皆不足聽惟西民困乏意必望和請因宣撫使告以朝廷非不欲和而賊未遜順之意然後深戒有司寬其力役可也其餘一切小人之論伏望絶而不聼甲午樞密副使韓琦上疏曰臣聞漢文帝時國治民冨刑措不用而賈誼上書言事以為可痛哭太息今陛下仁德逺被民樂其生而臣竊覩時事謂可晝夜泣血非直痛哭太息者何哉蓋以西北二邉禍釁已成而上下泰然不知朝廷之將危宗社之未安也近者契丹見朝廷西方用兵遣使求關南之地邀獻納之名其輕視中國意蓋可見而元昊好亂逞志初併甘涼諸蕃以拓境土自度種落強盛僣號背恩北連契丹欲成鼎峙之勢纍嵗盜邉官軍屢衄今乘定川全勝之氣遣人約和則知其計愈深而甚可虞也議者或謂昨假契丹傳導之力必事無不合豈不思契丹既能使元昊罷兵豈不能使元昊舉兵乎比來辭禮驕抗殊未屈下契丹之言既已無驗亦恐有合從之䇿以困中原朝廷若軫西民之勞暫求休飬且以金帛啖之待以不臣之禮臣恐契丹聞之謂朝廷事力已屈又將遣使移書過邀尊大之稱或求朝廷不可從之事隳其誓約然後長驅部衆直趣大河復使元昊舉兵深冦關輔當是時未審朝廷以何術禦之臣是以夙夕思惟輒畫當今所冝先行者七事一曰清政本冝詔中書樞密院凡苛碎眇末之務悉歸有司使從容謀議賜對之際專論大計二曰念邊事今政府但循舊制才午即出匆遽僉書謂冝須未正方出延此一時以專邉論二曰擢材賢冝倣祖宗舊制於武臣中不次超擢以試其能四曰備河北自契丹通好三十餘年武備悉廢宜選轉運使二員密授經略責以嵗月使營守禦之備五曰固河東前嵗昊賊陷豐州掠河外屬户殆盡麟府形勢孤絶宜責本道帥臣度險要建城堡省轉餉為持久之計六曰收民心祖宗置內藏庫蓋備水旱兵革之用非私畜財以充已欲也自用兵以來財用匱竭宜稍出金帛以佐邉用七曰營洛邑今帝都無城隍之固以備非常遽議興築則為張皇勞民不若隂葺洛都以為遊幸之所嵗運太倉羡餘之粟以實其廪庾繼又陳八事略謂當今救弊之術不過選將帥眀按察豐財利抑僥幸進有能之吏退不才之官去冗食之人謹入官之路帝嘉納之八月戊戌詔諫官日赴內朝先是知制誥田况言有唐兩省自諫議大夫至拾遺補闕共二十人每宰相奏事諫官隨入有所闕失即時規正其實皆中書門下之屬官也今諫議大夫無復職業地勢不親位序不正臣前在諫院每聞一事皆諸處采問比及論列或至後時今若令諫官得奉內請則可以日聞朝廷之事又王素歐陽修蔡襄皆以他官知諫院居兩省之職而不得預其列於禮未便乞今後並令綴兩省班次詔送兩制詳定學士承旨丁度等言諫官號清望之選燕間紬繹最為切近乞今後比直龍圖閣及修起居注例令日赴內朝從之已􅕀出內藏庫紬絹三百萬下三司以助經費用韓琦之言也丁未以樞密副使范仲淹為參知政事資政殿學士冨弼復為樞密副使弼猶欲固辭會元昊使入辭羣臣班紫宸殿門上俟弼綴樞密院班乃坐又使宰臣章得象諭弼曰此朝廷特用非以使契丹故也弼不得已乃受晏殊以弼其女之壻引嫌求罷相帝不許又求解樞密使亦不許修媛張氏寵愛日盛冠於後庭忽感疾進白帝曰所以召災者資薄而寵厚也願貶秩為美人帝許之戊申以修媛為美人知諫院蔡襄言已差范仲淹宣撫陜西近又除參知政事未有巡邉之日竊以西賊遣使入朝其言驕慢必無可從之理朝廷既罷遣人勢必舉兵仲淹久留邉郡威名在敵若早令經制事冝關中百姓庶可休息如或堅守城寨使賊逺來無所虜掠亦足以挫賊之鋭氣邉將雖多莫如輟柄臣以臨之柄臣之中莫如仲淹自行望於西使未行之間早遣巡邉無使後時以失大計壬子白氣貫北斗癸丑以樞密副使韓琦為陜西宣撫使先是范仲淹及任中師分路宣撫踰月皆未行琦言於帝曰賊請和無他則二人遙領宣撫事可矣彼若未副所望必乘忿盜邉當速遣仲淹河東則臣方壯可備奔走中師宿舊大臣毋勞往也詔琦代仲淹宣撫陜西而中師卒不行以大理寺丞張子奭為祕書丞與右侍禁王正倫使夏州子奭宗禮子齊賢孫歐陽修言方今兩議未決正是各爭名分之時尤不可自虧事體如朝廷但欲遷延嵗月不拒絶之則止當因如定之回賜以甘言許其厚賂諭以若能遜順則使通意邉臣俟得其實然後定議不可令天子使臣待賊命而進退萬一遭其拒絶或被拘執則於事無益空損國威為今計者不若速遣范仲淹嚴備邉境徐放如定等還當自為謀以求勝算戊午罷武學九月丁卯召輔臣及知雜御史以上於天章閣朝謁太祖太宗御容及觀瑞物既而帝問禦邉大略久之乃罷帝既擢任范仲淹韓琦冨弼等每進見必以太平責之數令條奏當世務仲淹語人曰上用我至矣然事有後先且革弊於久安非朝夕可能也帝再賜手詔督促曰比以中外人望不次用卿等今琦暫往陜西仲淹弼與宰臣章得象留心國事毋或有所顧避其當世急務有可建明者悉為朕陳之既又開天章閣召對賜坐給筆札使疏於前仲淹弼皆惶恐避席退而列奏言十事一曰明黜陟二曰抑僥幸三曰精貢舉四曰擇官長五曰均公田六曰厚農桑七曰修武備八曰減徭役九曰覃恩信十曰重命令帝方信嚮仲淹等悉用其説當著為令者皆以諸事畫一次第頒下獨府兵輔臣共以為不可而止司徒吕夷簡固請老戊辰授太尉致仕朝朔望及大朝會並綴中書門下班諫官歐陽修言夷簡為陛下宰相而致四夷外侵百姓內困二十餘年間人臣大冨貴夷簡享之而去天下大憂患留與陛下當之凡百紀綱幾至大壞况今筋力已衰神識昏耗豈能更與國家事據夷簡當此病廢即合杜門自守不交人事縱有未忘報國之意凡事即合公言豈可暗入文書眩惑天聼伏乞明賜止絶於是始命宰臣章得象監修國史初夷簡罷相為司徒猶帶監修及致仕乃以還得象賜知諫院王素三品服余靖歐陽修蔡襄五品服面諭曰卿等皆朕所自擇數論事無所避故有是賜襄數求補外以便親養富弼曰諌臣不當逺去許給假迎親可也帝許襄歸省而不許其罷以端明殿學士李淑為翰林學士諫官歐陽修奏事延和殿面論淑姦邪在開封猶踈外復拜學士益親近請罷之退又上言淑自來朋附吕夷簡在三尸五鬼之數蓋夷簡藉為肘腋所以援引至此今日朝廷清明更欲此人何用伏望早與一外任差遣使正人端士安心作事不憂讒毁之言尋有旨令淑知夀州既而不行修又言竊聞中書須得淑自上章求出方敢差除此乃大臣避怨不肯為陛下除去望特出聖旨處分直除一外郡使天下皆知此姦邪穢惡之人是陛下自除去以彰聖眀之德乙亥任中師罷丁丑詔執政大臣非假休不許私第接見賓客從知諫院蔡襄言也議者以為唐元和用兵時裴度為相請私第延見四方賢俊以廣謀慮今一切禁絶賓客非諫官所宜言也是日羣盜晨入金州劫府庫兵仗散錢帛與其黨及貧民知州王茂先將直兵二十四人禦之不敵遂走羣盜恣行掠奪日暮乃出城去茂先具以聞樞密副使冨弼言伏見西鄙用兵以來物力窮困朝廷不能存撫遂使為盜今張海郭邈山等驚擾州縣殺傷吏民巡檢縣尉不敢向前遂從京師遣兵仍令中使監督尚猶遷延日月倔強山林以至白晝公行平入州縣開發府庫劫取貨財散募凶徒嘯聚漸衆陜府西京唐汝均房金商襄鄧千餘里間所在瘡痍諸郡無兵各不自保賊既轉盛不可不防秦隋唐末諸冦或起於畎畝或起於商客或起於士卒或起於負擔觀其初起莫不甚微尚不得如張海郭邈山輩之強盛然以小合大漸成巨盜縱橫難制遂亂天下今兹賊黨未見翦除所宜多設隄防以備滋蔓臣又思京西諸州賊盜見今往來之處長吏皆非其人伏乞先選轉運兩人令往彼體量諸州長吏不才及贓濫老病者急罷之令於轄下通判或知縣中保舉人權充知州如不足則朝廷下審官院選人填補知州得人則就令選部內知縣縣令昔前漢宣帝時渤海郡盜起帝選能治之者丞相舉龔遂遂至郡盜賊悉平後漢安帝時朝歌縣盜賊屯聚連年未獲乃以虞詡為朝歌長賊遂駭散此守宰得人賊自破滅之驗也丙辰命王洙余靖孫甫歐陽修同編修祖宗故實先是富弼請選官置局將三朝典故及諸司所行可用文字類聚編成一書置在兩府俾為模範帝納其言故命靖等編修弼總領之明年九月書成分别事類凡九十六門二十卷丁亥徙知慶州滕宗諒權知鳯翔府時鄭戬發宗諒前在涇州枉費公用錢十六萬緡而監察御史梁堅亦劾奏之詔太常博士燕度往汾州鞫其事宗諒坐是徙范仲淹言梁堅奏宗諒於涇州賤買人户牛驢犒設軍士臣切見去年葛懷敏敗後向西州軍官員驚憂計無所出涇州無兵賊已到渭州宗諒起遣人户強壯數千人入城防守時值苦寒軍情愁慘得宗諒管設環慶路節次䇿應軍馬四頭一萬五千餘人酒食薪柴並足衆心大喜雖未有大功顯是急難可用之人所以舉知慶州倉卒收買牛驢犒軍縱有虧價情亦可恕堅又奏宗諒在邠州聲樂數日樂人弟子得銀楪子三二十片者臣與韓琦到邠州筵會一日其時衆官各將射中楪子散與過弓箭軍人及妓樂即非宗諒散與而罪歸宗諒堅又奏宗諒到任後使過錢十六萬貫其間有數萬貫不明今來中使體量却稱只是使過三千貫是加誣錢數料是諸軍請受在十六萬貫之內豈可諸軍請受亦作宗諒使過且環慶一路四州共二十六寨將佐數十人兵馬五萬自宗諒勾當已閲八九月並無曠闕邉將軍民亦無詞訟處置蕃部軍馬公事又無不了今一旦逐之如一小吏後來主帥豈敢便冝行事臣欲乞朝廷指揮宗諒止在任勾當委范宗傑在邠州一面勘鞫如宗諒顯有欺隱入已及乖違大過臣甘與宗諒同行貶黜壬辰翰林學士李淑罷知鄭州以權知開封府吳育言淑前在府多褻近吏人故也育領府事才數日發大姦吏一人流嶺外又得巨盜積贓萬九千緍獄具而輒再變衆疑其寃帝遣他吏按之卒伏法由是京師肅然范仲淹疏言臣聞唐武德九年憫宮掖數多詔一時減省各從娶娉自是前後所出三千餘人又貞觀二年大宗謂侍臣曰婦人幽閉深宫情實可憫命戴胄杜正倫於掖庭西門揀出之臣不知今來宫中人數幾多或供使有餘宜降詔旨特令減放以遂物性又省冗費臣又聞淳化中太宗皇帝以邉户飢荒多賣人口入蕃頗憫惻之時遣使以物貨收贖各還父母近年沿邉漢户被西戎俘略不少今既通人使乞聖意以內帑物帛委邉臣漸次收贖陷蕃漢户人口各還其家癸未詔曰先王用法簡約使人知禁而易從後代設茶鹽酒稅之禁奪民厚利刑用滋章今之編敕皆出律外又數改更官吏且不能曉百姓安得聞之而一陷於理身體毁傷室家離散情雖可哀法不可贖其議科條有非著於律者或細民難知或常情不免或冒利犯禁或奢侈違令或過誤可閔之類别為贖法鄉民以穀麥市人以錢帛使民重榖帛免刑罰則農桑自勸冨夀可期矣時范仲淹請制贖刑故有是詔諫官余靖言臣不知誰為陛下畫此謀者徒知髙談而不知適時之變也今三邉有百萬待哺之卒計天下二稅上供之外能足其食乎故茶鹽酒稅山澤雜産之利盡歸於官尚猶日算嵗計恐其不足民貪其利而犯禁者雖死不避也今乃一為贖刑以寬其禁三軍之食於何取之臣伏見二年已來陜西淮南江浙添取鹽酒價錢而民犯愈多今若更為輕刑得以贖論則民輕犯而莫之禁矣伏乞追改前詔特令寢罷其陜西淮南江浙二年已來所添鹽酒價錢並放仍舊時議者皆以為若遂行此詔則冨人皆得贖罪而貧者不能以自免非朝廷用法之意卒不果行是月桂陽洞蠻冦邉湖南提刑募兵討平之資治通鑑後編卷五十二
