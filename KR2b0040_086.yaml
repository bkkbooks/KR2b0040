body:
  text: 資治通鑑後編卷八十六刑部尚書徐乾學撰宋紀八十六起閼逢困敦七月盡旃蒙赤奮若十二月凡一年有六月神宗體元顯道法古立憲帝德王功英文烈武欽仁聖孝皇帝元豐七年秋七月甲辰伊洛溢河決元城知大名府王拱辰言河水暴至數十萬衆號呌求救而錢穀稟轉運常平歸提舉軍器工匠𨽻提刑掃岸物料兵卒即屬都水監逐司在逺無一得専倉卒何以濟民望許不拘常制詔事干機速奏覆牒稟所屬不及者如所請丙午遣使賑恤賜溺死者家錢甲寅王安禮罷先是侍御史張汝賢彈奏王圭與安禮陳乞子姪差遣以謂引用都省批狀例外起例實害大政帝以有條許用例奏鈔汝賢章格不下安禮聞之面奏乞治汝賢罪帝令分析汝賢奏安禮不能修身治家且言在湖潤與倡女共政帝以其章付三省謂安禮曰汝賢奏彈不當固有罪其所言姦汚事卿果如此何以復臨百官帝雖黜汝賢安禮亦不自安因奏往以兄安石疾病嘗乞知江寧願申前請遂以端明殿學士知冮寧府安禮資貌魁偉有口辨常以經綸自任而闊略細謹為世所譏八月庚午詔知瀘州王光祖遣人招諭乞弟許出降免罪補官乞弟既失土窮甚往來諸蠻間無所依帝猶欲招來之許以自新未幾乞弟死於是羅始黨斗然斗更等酋長及新取生界兩江夷族請依諸姓團結皆為義軍從之瀘夷震懾不復為邊患癸巳衢州言太子少保致仕趙抃卒贈太子少師諡清獻抃和易長厚氣貌清逸人不見其喜愠平生不治資業不畜聲伎嫁兄弟之女十數他孤女二十餘人施德惸貧蓋不可勝計日所為事入夜必衣冠露立焚香以告天不可告則不敢為也其為吏善因俗施設寬猛不同在處與成都尤為世所稱道帝每詔二郡守必舉抃為言要之以惠利為本知越州時諸州皆榜衢路禁增米價抃獨令有米者任增價糶之於是米商輻輳價乃更賤人無飢者九月乙丑夏人圍定西城燒龕谷族帳熙河將秦貴敗之冬十月乙亥以給事中韓忠彥為禮部尚書忠彥入謝帝諭曰先令公之勳朕所不敢忘卿復盡忠朝廷此未足以酬卿也夏人冦熙河庚辰饒州童子朱天申對于睿思殿賜五經出身寶元初罷童子科至元豐始置在京小學有就傅初筮兩齋因復試童子前後賜出身者五人戊子詔分畫交址界以六縣二洞賜之先是交址以追捕儂智會為辭犯歸化州又遣其臣黎文盛來廣西辨理順安歸化境界經略使熊本遣左江巡檢成卓與議文盛稱陪臣不敢爭執詔以文盛能遵乾德恭順之意賜之袍帶及絹五百匹至是乃以八隘之外保樂六縣宿桑二洞豫乾德乙未夏人冦靜邊寨涇原鈐轄彭孫敗之殺其首領仁多㖫丁十一月丁酉朔冦清邊寨隊將白玉李貴死之甲辰夏國主秉常遣使來貢乙卯太白晝見戊辰以端明殿學士兼翰林侍讀學士司馬光為資政殿學士校書郎前知龍水縣范祖禹為祕書省正字並以修資治通鑑書成也自治平開局光與劉攽劉恕范祖禹及子康編集歷知永興軍判西京留司御史臺及提舉崇福宫前後六任聽以書局自隨給之祿秩光於是遍閲舊史旁采小説抉摘幽隱校計毫釐上起周威烈王二十三年下終五代凡一千三百六十二年修成二百九十四卷又略舉事目年經國緯以便檢尋為目録三十卷參考羣書評其同異俾歸一塗為考異三十卷合三百五十四卷歷十九年而成至是上之降詔奬諭賜銀帛衣帶鞍馬帝謂輔臣曰前代未嘗有此書過荀恱漢紀逺矣輔臣請觀之遂命付三省遷光及祖禹官時劉恕已卒劉攽坐廢黜故不及後光病目録太簡更為舉要厯八十卷而未成又别著歷年圖七卷通厯八十卷稽古録二卷庚寅詔門下中書外省官同舉言事御史遼詔改明年元曰大安是嵗河東飢河北水壞洺州廬舍並蠲其稅初元豐五年將行官制帝謂輔臣曰官制將行欲取新舊人兩用之御史大夫非司馬光不可王圭蔡確相顧失色確進曰國是方定願少遲之圭憂甚不知所出確曰上久欲收靈武公能任責則相位可保也圭喜謝之因薦俞充帥慶使上平西夏策其意以為既用兵深入必不召光雖召將不至已而不即召除光提舉崇福宫詔滿三十月不候替人即赴闕蓋將復用光也是嵗秋宴帝感疾始有建儲意又謂輔臣曰來春建儲其以司馬光吕公著為師保考異李燾曰此據邵伯溫元祐辨誣及吕大防所為吕公著墓碑大防止稱公著不及光當考陽武邢恕少俊邁博通經籍能文章喜功名論古今成敗事有戰國縱橫氣習從程皓學因出入光公著門公著薦為崇文院校書王安石亦愛之恕對其子雱語新法不便安石聞之怒斥恕知延陵縣縣廢不復調浮湛陜洛間者七年復為校書吳充用為館閣校勘歷史館檢討著作佐郎確代充相盡逐充所用人恕深居懼及帝見其送文彥博詩稱於確謂恕久在館中當遷確不可帝弗顧確有機巧知帝將擢恕退即除職方員外郎自是恕為確黨矣帝有復用光公著意確以恕於兩人為門下客亟結納之恕亦深自附託乃為確畫策稍收召名士於政事微有更革及光為資政殿學士確知其必復用欲自託於光乃謂恕曰上以君實為資政學士異禮也君實好辭官確晚進不敢進書和叔門下士宜以書言不可辭之故和叔恕字也恕但與光子康書致確語康以白光光笑而不答亦再辭而後受之八年春正月戊戌帝不豫甲辰赦天下乙巳命輔臣代禱景靈宫乙卯分遣羣臣禱于天地宗廟社稷自帝不豫後三省樞密院日詣寢閣問疾至是疾小瘳手書諭王圭等自今可間日入問二月辛巳開寶寺貢院火丁亥命禮部鎖試别所癸巳帝大漸遷御福寧殿三省樞密院入問見帝於榻前王圭言去冬嘗奉聖旨皇子延安郡王來春出閣願早建東宫凡三奏帝三顧微首肯而已又乞皇太后權同聽政候康復日依舊帝亦顧視首肯圭等乃出先是蔡確慮上復用吕公著及司馬光則必奪己相乃與邢恕謀為固位計恕雅與皇太后姪高公繪公紀遊帝初寢疾恕密問公繪公繪具言疾可憂狀恕聞此更起邪謀確嘗遣恕邀二人二人辭不往明日又遣人招置東府確曰宜往見邢職方既見恕曰家有桃著白花可愈人主疾其説出道藏幸枉一觀入中庭則紅桃花也驚曰白花安在恕執二人手曰右相令布腹心上疾未損延安郡王幼沖宜早定議雍曹皆賢王也二人復驚曰此何言君欲禍我家耶急趨出恕計不行反謂雍王皓有覬覦心皇太后將捨延安郡王而立之王圭實主其事與內殿承制致仕王棫共造誣謗棫開封人嘗從高遵裕掌機宜于涇原傾巧士也故恕因之又知確與圭素不相能欲借此以陷圭他日亟問確曰上起居狀比何如確曰疾向安將擇日御殿恕微哂曰上疾再作失音直視聞禁中已别有處分首相外為之主公為次相獨不知耶一日片紙下以某為嗣則公未知死所矣公自度有功德在朝廷乎天下士大夫素歸心乎確竦然曰然則計將安出恕曰延安郡王今春出閣上去冬固有成言羣臣莫不知公盍以問疾率同列俱入亟於上前白發其端若東宫因公言而早建千秋萬嵗後公安如泰山矣確深然之恕又曰此事當略設備今與平時不同庶可以自表見其曲折第告子厚餘人弗使知子厚章惇字也確謝謂恕曰和叔見子厚具言之惇許諾遂與確定議仍約知開封府蔡京以其日領壯士待變於外廷謂曰大臣共議建儲若有異議者當以壯士入斬之是日三省樞密院俱入問疾初亦未敢及建儲事既退乃於樞密院南廳共議之確惇屢以語迫圭幸其小持異即首誅之圭口吃連稱是字數聲徐曰上自有子復何議確惇顧無如圭何尋復入奏得請俱出逢雍曹二王於殿前惇厲聲曰已得旨立延安郡王為皇太子矣奈何雍王曰天下幸甚已而禁中按堵如故確等邪謀雖不得逞其蹤迹詭祕亦莫辨詰各自謂有定策功事久語聞卒為朝廷大禍其實本恕發之三月甲午朔執政詣內東門入問候皇太后垂簾皇子立簾外太后諭圭等皇子清俊好學已誦論語七卷略不好弄止是學書自皇帝服藥手寫佛經三卷祈福因出所寫經示圭等書字極端謹圭等拜賀遂宣制立為皇太子改名煦仍令有司擇日備禮册命又詔應軍國事並皇太后權同處分候康復日依舊李燾曰元豐末年建儲事諸家異論紹興史官既别加考定専取元祐舊文固得本實矣第恨其弗詳今參取諸書稍增益之推原後來致禍如彼慘毒蓋由王圭任首相不早建白立太子致蔡確章惇蔡京等得乘隙造謗而萌芽則自邢恕發之其令京領劊子入內庭確惇此時亦必有他説紿圭故圭不以為疑然開封知府何與朝廷事此政坐圭愚暗耳若圭能即拒絶既無疑似之迹則橫禍又何從而來疑似之迹當時不過如此其後浸淫轉加增飾遂有宣訓事粉昆事黃履疏高士京書至蔡懋宣和間劄子用誣訕文字託名御製極矣誠可為痛哭也非建炎初聖主覺悟果斷明辨則朝廷之禍豈有極乎此事既存真實仍悉取異説附見於後庶觀者曉然究其真實謬妄小人情狀無所遁逃亦猶孟子必著許行楊墨等語不用掃除絶滅之也哲宗新録宣仁聖烈皇后傳云先是元豐七年三月大宴中宫延安郡王侍立王圭率百官賀及升殿神宗又諭王與圭等相見復分班再拜稱謝是冬諭輔臣曰明年建儲以司馬光吕公著為師保神宗彌留后敕中人梁惟簡曰今汝歸製一黃袍十嵗兒可衣者密懷以來蓋為上倉猝踐祚之備神宗太母所以屬意於上者確然先定無􅊏芥疑邢恕傾危士也少遊光公著間蔡確得師保語求所以結二公者而深交恕要后姪光州團綀使公繪等二人辭不往明日又遣人招置東府確曰宜往見邢舍人恕曰家有桃著白華可愈人主疾其説出道藏幸留一觀入中庭紅桃華也驚曰白華安在恕執二人手曰右相令布腹心上疾未損延安幼沖宜早定議岐嘉皆賢王也公繪等懼曰君欲禍我家徑去已而恕反謂后與王圭為表裏欲捨延安而立其子皓賴已及惇確得無變確使山陵韓縝簾前具陳恕等所以語太后者使還之日暴其姦再貶知隨州尋竄新州劉摯拜左僕射恕坐黨與謫監永州酒稅新録載建儲事具此確貶新州恕責永州皆元祐四年五月事摯拜左僕射乃六年二月事不知新録何故相連書之恕除起居舍人在元豐八年七月二十四日方神宗寢疾時恕但為職方員外郎公繪公紀遷團練使在哲宗即位後此時但為刺史耳新録稍似抵牾今改之趙子嵩云余既書元豐末命紹興二年四月避地潯江偶司諫韓璜叔夏謫監潯州鹽稅暇日語及因借得其父文若記莊敏丞相作樞密長時神宗服藥日久韓一日語張璪曰上服藥日久建儲如何璪曰子厚多言試説與看韓乃語章惇惇曰此議甚好二相亦以為然約集議于密阮南廳屏人留筆硯一副紙數幅就坐久之皆無語韓視王圭曰今日之議立延安郡王為太子延安郡王去年上已令侍宴出見羣臣又有旨四月一日出閣此事何故都無一言圭云諸公之議亦圭之意也别有何疑張璪推筆硯紙與章惇令於紙上寫立延安郡王為皇太子來日至寢門召內臣張茂則云今日奏事欲立延安郡王為皇太子茂則令於御榻前設案圭將所書紙鋪在案上奏欲立延安郡王為皇太子時神宗風眩不能語但慘怛久之衆皆久立未敢復言時太妃亦在帳中露半面國婆婆抱上坐頃之再奏國婆婆云聖意已允王圭問茂則太后在甚處太后自云在此中茂則令內臣張簾太后在簾下云相公等立得這孩兒便好這孩兒直是孝自官家服藥只是喫素寫經簾內出經兩卷一卷延壽經一卷消災經逐卷後題云延安郡王臣某奉為皇帝服藥日久寫某經一卷願早康復自簾內宫人抱出哲廟哲廟裹帽子著衫帶立於簾外諸公環侍久之無他語遂宣制施行後神宗上仙宣遺制立皇太子內外欣戴初無異聞已上韓氏手録不敢增損一字案子嵩所書與伯溫辨誣所載並同辨誣具注在三月甲午朔乙未赦天下遣官告於天地宗廟社稷諸陵丁酉皇太后命吏部尚書曾孝寬為册立皇太子禮儀使戊戍帝崩于福寧殿年三十有八宰臣王圭讀遺制皇太子即皇帝位尊皇太后為太皇太后皇后為皇太后德妃朱氏為皇太妃應軍國事並太皇太后權同處分依章獻明肅皇后故事帝天性孝友其入事兩宫必侍立終日雖寒暑不變親愛二弟無纎毫之間終帝之世乃出居外第總攬萬幾小大必親御殿決事或日昃不暇食侍臣有以為言者帝曰朕享天下之奉非喜勞惡逸誠欲以此勤報之耳將定官制獨處閣中考求沿革一年而成人皆不知每當用兵或終夜不寢邊奏絡繹手札處畫號令諸將授以成算謙沖退託去華務實終身不受尊號時承平日久事多舒緩帝厲精圖治欲一振其弊又以祖宗志吞幽薊靈武而數敗兵奮然將雪數世之恥王安石遂以富強之謀進而青苗保甲均輸市易水利諸法一時並興天下騷然痛哭流涕者接踵而至帝終不覺寤方廢逐元老擯斥諫士行之不疑祖宗之良法美意變壞幾盡而邪佞日進人心日離馴致靖康之禍己亥赦天下常赦所不原者遣使告哀于遼白虹貫日庚子命宰臣王圭為山陵使甲寅以羣臣固請始同太皇太后聽政帝甫十嵗臨朝莊嚴左右僕御莫能窺其喜愠己未賜叔雍王皓曹王頵贊拜不名令中外避太皇太后父遵甫名詔邊事稍重者樞密院與三省同議以進庚申進封尚書左僕射郇國公王圭為岐國公雍王皓為揚王曹王頵為荆王並加太保進封弟寧國公佶為遂寧郡王儀國公佖為大寧郡王成國公俁為咸寧郡王和國公似為普寧郡王以高密郡王宗晟漢東郡王宗瑗華原郡王宗愈安康郡王宗隱建安郡王宗綽並為開府儀同三司太師潞國公文彥博為司徒濟陽郡王曹佾為太保特進王安石為司空餘進秩賜致仕服帶銀帛有差祕書省正字范祖禹上疏論喪服之制曰先王制禮君服同於父皆斬衰三年蓋恐為人臣者不以父事其君此所以管乎人情也自漢以來不惟人臣無服而人君遂不為三年之喪惟國朝自祖宗以來外廷雖用易月之制而宫中實行三年之服且易月之制所以難改者以人君自不為服也今君服己如古典而臣下猶依漢制是以大行在殯百官有司皆已復其故常容貌衣服無異於行路之人豈人之性如此其薄哉由上不為之制禮也今羣臣雖易月而人主實行喪故十二日而小祥期而又小祥二十四日而大祥再期而又大祥小祥大祥不可以有二也既以日為之又以月為之此禮之無據者也古者再期而大祥中月而禫禫者祭之名非服之色也今乃為之慘服三日然後禫此禮之不經者也既除服至葬而又服之祔廟後即吉才八月而遽純吉無所不佩此又禮之無漸者也易月之制因襲已久不可復追宜令羣臣朝服正如今日而未除衰至期而服之漸除其重者再期而又服之乃釋衰其餘則君服斯服可也至於禫不必為之服惟未純吉以至于祥然後無所不佩則三年之制略如古矣詔禮官詳議禮部尚書韓忠彥等言朝廷典禮時世異宜不必循古且先王恤典節文甚多必欲循古又非特如所言而已今既不能盡用則當循祖宗故事及先帝遺制詔從其議司馬光入臨衛士見光皆以手加額曰此司馬相公也所至民遮道聚觀馬至不得行曰公無歸洛留相天子活百姓光懼會放辭謝遂徑歸洛太皇太后聞之詰問主者遣內侍梁惟簡勞光問所當先者光乃上疏曰近嵗士大夫以言為諱閭閻愁苦於下而上不知明主憂勤於上而下無所訴此罪在羣臣而愚民無知歸怨先帝臣愚以為今日所宜先者莫若明下詔書廣開言路不以有官無官凡知朝政闕失及民間疾苦者並許進實封狀盡情極言仍頒下諸路州軍出榜曉示在京則於鼓院投下委主判官畫時進入在外則於州軍投下委長吏即日附遽奏聞皆不得責取副本強有抑退羣臣若有沮難者其人必有姦惡畏人指陳専欲壅蔽聰明此不可不察從之夏四月丙寅初御紫宸殿辛未詔寬保甲養馬蠲元豐六年以前逋賦壬申罷免行錢甲戍詔曰先皇帝臨御十有九年建立政事以澤天下而有司奉行失當幾於煩擾或茍且文具不能布宣實惠其申諭中外協心奉令以稱先帝惠安元元之意加李乾德同中書門下平章事董氊檢校太尉乙亥詔以太皇太后生日為坤成節丁丑諭樞密中書通議事都堂命資政殿大學士吕公著兼侍讀公著時知揚州特召用之遵先帝意也庚辰知太原府吕惠卿遣步騎二萬襲夏人于聚星泊斬首六百級辛巳遣使以先帝遺留物遺遼及告即位以資政殿學士司馬光知陳州光上疏曰昔仁宗皇帝擢臣知諫院臣初上殿即言人君之德三曰仁曰明曰武致治之道三曰任官曰信賞曰必罰英宗皇帝時臣曾進歷年圖其後序言人君之道一其德有三其志亦猶所以事仁宗也大行皇帝新即位擢臣為御史中丞臣初上殿言人君修心治國之要其志亦猶所以事英宗也今皇帝陛下新承大統猥蒙訪落謹復以人君修心治國之要為獻其志亦猶所以事大行皇帝也臣近曾上奏乞下詔書開言路伏望聖慈早賜施行以職方員外郎邢恕為右司員外郎蔡確欲因恕以結司馬光吕公著故驟遷都司樞密院言府界三路保甲兩丁之家止有病丁并田不及二十畝者聽自陳提舉司審驗與放免從之丁亥復蠲舊年逋賦五月丙申詔百官言朝政闕失榜於朝堂時大臣有不欲者於詔語中設六事以禁切言者曰若隂有所懷犯非其分或扇搖機事之重或迎合已行之令上則顧望朝廷之意以僥幸希進下則眩惑流俗之情以干取虛譽若此者必罰無赦詔知陳州司馬光過闕入見先是光上疏言諫爭之臣人主之耳目也太府少卿宋彭年言在京不可不並置三衙管軍臣僚水部員外郎王諤乞令依保馬元立條限均定逐年合買之數又乞令太學增置春秋博士朝廷以非其本職而言各罰銅三十斤陛下臨政之初而二臣首以言事獲罪臣恐中外聞之忠臣解體直士挫氣太平之功尚未可期也於是令光過闕入見使者勞問相望於道丁酉羣臣請以十二月七日為興龍節帝本以六日生避僖祖忌辰故移其節於次日戊戌詔常州安置蘇軾復朝奉郎知登州己亥詔吕公著乘傳赴闕以程皓為宗正寺丞壬寅城熙蘭通逺軍賜李憲趙濟銀帛有差甲辰作受命寶丙午京師地震起酉時即止復置遼州詔開封府界三路弓兵並依保甲未行以前復置庚戍尚書左僕射兼門下侍郎岐國公王圭卒贈太師諡文恭禮部言當舉哀成服詔以大行在殯罷之圭自執政至宰相凡十六年無所建明率導諛將順時號三旨宰相以其上殿進呈云取聖旨上可否訖云領聖旨既退諭稟事者云已得聖旨故也又與蔡確比以沮司馬光而興西師之役為清議所抑改命蔡確為山陵使丙辰賜禮部奏名進士諸科及第出身同出身四百六十一人太皇太后驛召司馬光吕公著未至遣中使迎勞手書問今日設施所宜先未及條上已散遣修京城役夫減皇城邏卒止禁庭工技出近侍尤無狀者戒中外毋苛斂寬民間保戶馬罷所買物貨場事由中旨王圭等弗預知也從父遵裕坐西征失律抵罪蔡確欲獻諛以固位乞復其官后曰遵裕靈武之役塗炭百萬先帝中夜得報起環榻行徹旦不能寐自是驚悸馴致大故禍由遵裕得免刑誅幸矣先帝肉未冷吾何敢顧私恩而違天下公議乎確悚栗而退戊午以尚書右僕射兼中書侍郎蔡確為尚書左僕射兼門下侍郎知樞密院事韓縝為尚書右僕射兼中書侍郎門下侍郎章惇知樞密院資政殿學士司馬光為門下侍郎初光以知陳州過闕入見太皇太后遣中使以五月五日詔書示光光言詔書始末之言固已盡善中間逆以六事防之臣以為人惟不言言則入六事矣或於羣臣有所褒貶則謂之陰有所懷本職之外微有所涉則謂之犯非其分陳國家安危大計則謂之扇搖機事之重或與朝旨暗合則謂之迎合已行之令言新法不便當改則謂之觀望朝廷之意言民間愁苦可閔則謂之眩惑流俗之情然則天下之事無復可言者是詔書始於求諫而終於拒諫也乞刪去中間一節使人盡所懷不憂黜罰則中外之事逺近之情如指諸掌矣至是拜門下侍郎光辭二劄並進其一請釐革新法曰先帝厲精求治以致太平不幸所委之人不足以仰副聖志多以已意輕改舊章謂之新法其人意所欲為人主不能奪天下莫能移搢紳士大夫望風承流競獻策畫作青苗免役市易賖貸等法又有邊鄙之臣行險僥幸輕動干戈深入敵境使兵夫數十萬暴骸於曠野又有生事之臣建議置保甲戶馬以資武備變茶鹽鐡冶等法增家業侵街商稅錢以供軍須非先帝之本志也先帝升遐臣奔喪至京乃蒙太皇太后陛下特降中使訪以得失顧天下事務至多但乞下詔使吏民得實封上言庶幾民間疾苦無不聞逹既而聞有旨罷修城役夫撤巡邏之卒止御前造作京城之民已自歡躍及臣歸西京之後繼聞斥退近習之無狀者戒飭有司奉法失當過為煩擾者罷物貨場及所養戶馬又寬保馬年限四方之人無不鼓舞聖德凡臣所欲言者陛下略已行之然尚有病民傷國有害無益者如保甲免役錢將官三事皆當今之急務釐革所宜先者别狀奏聞伏望早賜施行時方遣中使召光受告光復辭太皇太后賜以手詔曰先帝新棄天下天子幼沖此何時而君辭位耶且使梁惟簡宣旨曰早來所奏備悉卿意再降詔開言路俟卿供職施行光由是不敢復辭時民日夜引領以觀新政而議者猶以為三年無改於父之道光慨然爭之曰先帝之法其善者雖百世不可變也若王安石吕惠卿等所建為天下害非先帝本意者改之當如救焚拯溺猶恐不及昔漢文帝除肉刑斬右趾者棄市笞五百者多死景帝元年即改之武帝作鹽鐡𣙜酤均輸算法昭帝罷之唐代宗縱宦官求賂遺置客省拘滯四方之人德宗立未三月罷之德宗晚年為宫市五坊小兒暴橫鹽鐡月進羡餘順帝即位罷之當時恱服後世稱頌未有或非之者也况太皇太后以母改子非子改父乎於是衆議乃息六月丙寅罷府界三路保甲不許投軍及充弓箭手指揮庚午賜楚州孝子徐積絹米積三嵗父殁每旦哭甚哀母使讀孝經輒流涕不能止以父名石終身不用石器行遇石則避而不踐事母盡孝朝夕冠帶定省從胡瑗學所居一室寒止一衲裘啜菽飲水瑗饋以食弗受年四十不婚不仕不婚者恐異姓不能盡心於母也不仕者恐一日去其親也鄉人勉之就舉遂偕母之京師既登第未調官而母亡遂不復仕監司上其行以為郡教授一時陳瓘鄒浩皆禮之久之致仕歸山陽於是始娶而操履彌篤積嘗語蘇軾曰自古皆有功獨稱大禹之功自古皆有才獨稱周公之才以其有德以將之故爾軾然其言積廬墓側十餘年每嵗甘露降於墳域必踰月木為連理郡守迎入學甘露又降其舍鄉閭化之州具以聞賜絹三十匹米三十石後以壽終政和中賜諡曰節孝處士官其一子丙子以資政殿學士韓維知陳州維初赴臨闕庭太皇太后降手詔勞問維奏治天下之道不必過求高逺在審人情而已識人情不難以己之心推人之情可見矣大凡人情貧則思富苦則思樂勞困則思息鬱塞則思通陛下誠能常以利民為本則人富矣常以愛民為心則人樂矣役事之有妨農務者去之則勞困息矣法禁之無益治道者蠲之則鬱塞通矣又奏臣嘗請陛下深察盜賊之原罷非業之令寬訓練之程蓋為保甲保馬發也臣非謂國馬遂可不養但官置監牧可矣非謂民兵遂可不教但於農隙一時訓練可矣至是起知陳州未行召兼侍讀加大學士丁丑宗正寺丞程皓卒皓資性過人充養有道和粹之氣盎於面背門人交友從之嵗久未嘗見其忿厲之容遇事優為雖當倉卒不動聲色神宗嘗問皓曰王安石何如人皓曰安石博學多聞則有之守約則未也又問是聖人否皓曰詩稱周公公孫碩膚赤舄几几聖人蓋如此安石剛𥚹自任聖人豈其然哉熙寧初嘗與張戩爭新法遂以語觸安石後乃自咎曰新法之行乃吾黨激成之當時自愧不能以誠感上心遂成今日之禍豈可獨罪安石也皓自十五六時與弟頥聞周惇頥論學遂厭科舉慨然有求道之志泛濫於諸家出入於釋老者幾十年反求諸六經而後得之秦漢以來未有臻斯理者其言曰道之不明異端害之也昔之害近而易知今之害深而難辨昔之惑人也乘其迷暗今之惑人也因其高明自謂窮神知化而不足以開物成務名為無不周通實則外於倫理天下之學非淺陋固滯則必入於此自道之不明也邪誕妖妄之説競起塗生民之耳目溺天下於汙濁雖高才明智膠於見聞醉生夢死不自覺也是皆正路之榛蕪聖門之蔽塞闢之而後可以入道皓有經濟之術方召用遽卒士大夫識與不識莫不哀傷焉文彥博表其墓曰明道先生弟頥序之曰周公沒聖人之道不行孟軻死聖人之學不傳道不行百世無善治學不傳千載無真儒無善治士猶得以明夫善治之道以淑諸人無真儒則貿貿焉莫知所之人欲肆而天理滅矣先生生於千四百年之後得不傳之學於遺經以興起斯文為己任辨異端闢邪説使聖人之道煥然復明於世蓋自孟子之後一人而已以奉議郎知安喜縣事清平王巖叟為監察御史初神宗詔近臣舉御史舉者意屬巖叟而未及識或謂可一往見巖叟笑曰是所謂呈身御史也卒不見至是用劉摯薦入臺癸未吕公著入見太皇太后遣中使賜食公著上奏十事一曰畏天二曰愛民三曰修身四曰講學五曰任賢六曰納諫七曰薄斂八曰省刑九曰去奢十曰無逸皆隨事解釋粗成條貫不為繁辭以便觀覽是日又上奏言先帝新定官制設諫議大夫司諫正言員數甚備宜選骨鯁敢言之士遍置左右使職諫諍又御史之官號為天子耳目而比年以來専舉六察故事廢國家治亂之大計則察官司簿領之過也伏乞盡罷察案止置言事御史四人或六人仍詔諫官御史並須直言無諱規主上之過失舉時政之紕繆指羣臣之姦黨陳下民之疾苦詔戶部拘催市易息錢準赦除放外其本錢特與展限三年丁亥詔曰朕紹承燕謀獲奉宗廟初攬庶政鬱於大道夙夜祗畏不敢荒寧懼無以章先帝之休烈而安輯天下之民永惟古之王者御治之始必明目逹聰以防壅蔽敷求讜言以輔不逮然後物情遍以上聞利澤得以下究詩不云乎訪豫落止此成王所以求助而羣臣所以進戒上下交警以遂文武之功朕甚慕焉應中外臣僚及民庶並許實封直言朝政闕失民間疾苦在京於登聞諫鼓院投進在外於所屬州軍驛置以聞朕將親覽以考求其中而施行之司馬光凡三奏乞改前詔於是始用其言也吕公著既上十事太皇太后遣中使諭公著曰覽卿所奏深有開益當此拯民疾苦更張何者為先庚寅公著復上奏曰自王安石秉政變易舊法羣臣有論其非便者指以為沮壞法度必加廢斥是以青苗免役之法行而取民之財盡保甲保馬之法行而用民之力竭市易茶鹽之法行而奪民之利悉若此之類甚衆更張須有術不在倉卒且如青苗之法但罷逐年比校則官司既不邀功百姓自免抑勒之患免役之法當少取寬剩之數度其差雇所宜無令下戶虛有輸納保甲之法止令就冬月農隙教習仍委本路監司提按既不至妨農害民則衆庶稍得安業至於保馬之法先朝已知有司奉行之繆市易之法先帝尤覺其有害而無利及福建江南等路配賣茶鹽過多彼方之民殆不聊生恐當一切罷去而南方鹽法三路保甲尤宜先革者也陛下必欲更修庶政使不驚物聽而實利及民莫若任人為急是日又上奏言孫覺方正有學識可以充諫議大夫范純仁剛徑有風力可以充諫議大夫或戶部右曹侍郎李常清直有守可備御史中丞劉摯資性端厚可充侍御史蘇轍王巖叟並有才氣可充諫官或言事御史太皇太后封公著劄子付司馬光詳所陳更張利害直書以聞光奏公著所陳與臣言正相符合惟保甲一事既知其為害於民無益於國家當一切廢罷更安用教習光又奏言陛下推心於臣俾擇多士竊見劉摯公忠剛正終始不變趙彥若博學有父風內行修飭傅堯俞清正安恬滯淹嵗久范純仁臨事明敏不畏強禦唐淑問行已有恥難進易退范祖禹溫良端厚修身無缺此六人者皆臣素所熟知若使之或處臺諫或侍講讀必有禆益餘如吕大防王存李常孫覺胡宗愈韓宗道梁燾趙君錫王巖叟晏知止范純禮蘇軾蘇轍朱光庭或以行義或以文學皆為衆所推伏望陛下紀其姓名各隨器能臨時任使至文彥博吕公著馮京孫固韓維等皆國之老成可以倚信亦令各舉所知庶幾可以參考異同無所遺逸考異李燾云此奏得之雜録不著姓名推究本末蓋司馬光也知慶州范純仁言郡邑之弊守令知之一路之弊監司知之茶鹽利局民兵刑法差役之弊提其局及受其寄者知之軍政之弊三帥與將領者知之邊防之弊守邊者知之伏望特下明詔各使條陳本職限一月內聞奏亦可因其所陳略知其人之才識然後審擇而行之秋七月甲午詔諸鎮寨市易抵當並罷戊戍以資政殿大學士兼侍讀吕公著為尚書左丞公著言國朝之制每便殿奏事止中書樞密院兩班昨先帝修定官制中書省門下省尚書省各為一班雖有三省同上進呈者蓋亦鮮矣執政之臣皆是朝廷遴選正當一心同力集衆人之智以輔維新之政遂詔應三省合取旨事及臺諫章奏並同進呈施行詔府界三路保甲自來年正月以後並罷團教仍依義勇舊法每嵗農隙赴縣教閲一月甲辰司馬光乞盡罷諸處保甲保正長使歸農依舊置耆長壯丁巡捕盜賊戶長催督稅賦其所養保馬揀擇勾收太僕寺量給價錢分配兩騏驥院蔡確等執奏不行詔保甲依樞密院今月六日指揮保馬别議立法時臣僚民庶應詔言新法不便者數千人司馬光奏乞降付三省委執政看詳擇其可取者用黃紙簽出再進或留置左右或降付有司施行從之丙午遼遣使來弔祭丙辰白虹貫日吏部侍郎熊本奏歸化儂智會異同坐罰金罷沅州增修堡寨考異東都事略熊本傳本為吏部侍郎以疾乞外知洪州言者謂本棄八洞為失謀奪一官徙知杭州宋史熊本傳同皆不言儂智會事蠻夷傳廣源州下亦不載今據宋史神宗紀書之不知所謂異同者何也當考八月乙丑詔按察官所至有才能顯著者以名聞癸未諫議大夫孫覺言乞依天禧元年手詔言事左右諫議大夫左右補闕拾遺凡發令舉事有不便於時不合於道大則廷議小則上封若賢良之遺滯於下忠孝之不聞於上則條其事狀而薦言之詔依此申明行下詔府界新置牧馬監并提舉經度制置牧馬司並罷司馬光言近降農民訴疾苦實封狀王嗇等一百五十道除所訴重復外俱已簽帖進入竊惟四民之中惟農最苦蠶婦治繭績麻紡緯其勤極矣農蠶者天下衣食之源人之所仰以生也是以聖王重之竊聞太宗嘗遊金明池召田婦數十人於殿上賜席坐問以民間疾苦勞之以帛太宗興於側微民間事固無不知所以然者恐富貴而忘之故也真宗乳母秦國夫人劉氏本農家也喜言農家之事真宗自幼聞之及踐大位咸平景德之治為有宋隆平之極景德農田敕至今稱為精當自非大開言路使畎畝之民皆得上封事則此曹疾苦何由有萬分之一得逹於天聽哉初熙寧六年立法勸民栽桑有不趨令則倣屋粟里布為之罰吏不能究宣德意民以為病至是楚丘民胡昌等言其不便詔罷之且蠲所負罰金興平縣抑民田為牧地民亦自言詔悉還之九月戊戌上大行皇帝諡曰英文烈武聖孝皇帝廟號神宗己酉以祕書少監劉摯為侍御史摯上疏曰伏見諫官止有大夫一員御史臺自中丞侍御史兩殿中法得言事外監察御史六員専以察治官司公事欲望聖慈於諫院增置諫官員數本臺六察御史並許言事其所領察案自不廢如故所貴共盡忠力交輔聖政召朝奉郎知登州蘇軾為禮部郎中戊午監察御史王巖叟上疏曰今民之大害不過三五事如青苗實困民之本須盡罷之而近日指揮但令減寬剩而已保甲之害蓋由提舉一司上下官吏逼之使然而近日指揮雖止令冬教然官司尚存此皆姦邪遂非飾過將至深之弊略示更張以應陛下聖意願令講究而力除之冬十月甲子夏國遣使進助山陵馬癸酉詔倣唐六典置諫官其具所置員以聞從劉摯之言也丁丑詔尚書侍郎給舍諫議中丞待制以上各舉堪充諫官二人以聞初中旨除范純仁為左諫議大夫唐淑問為左司諫朱光庭為左正言蘇轍為右司諫范祖禹為右正言令三省樞密院同進呈太皇太后問此五人何如章惇曰故事諫官皆令兩制以上奏舉然後宰執進擬今除目由中出臣不知陛下從何知之得非左右所薦此門不可浸啓太皇太后曰皆大臣所薦非左右也惇曰大臣當明揚何以密薦由是吕公著以范祖禹韓縝司馬光以范純仁親嫌為言惇曰臺諫所以糾繩執政之不法故事執政初除親戚及所舉之人見為臺諫者皆徙他官今當循故事不可違祖宗法光曰純仁祖禹作諫官誠協衆望不可以臣故妨賢者路臣寧避位惇曰縝光公著必不至有私萬一他日有姦臣執政援此為例純仁祖禹請除他官仍令兩制以上各得奏舉故有是詔淑問光庭轍除命皆如故純仁改為天章閣待制祖禹為著作佐郎詔監察御史兼言事殿中侍御史兼察事用吕公著及劉摯言也詔罷義倉其已納數遇歉嵗以充賑濟己卯詔均寬民力有司或致廢格者監司御史糾劾之河決大名小張口河北諸郡皆被水災知澶州王令圖建議濬迎陽掃舊河又於孫村金堤置約復故道轉運使范子竒仍請於大吳北岸修進鋸牙劈約河勢於是回河東流之議起侍御史劉摯言州縣之政廢舉行失其責在監司宜稍復祖宗故事於三路各置都轉運司用兩制臣僚充職以重其任自餘諸路亦望推擇資任較高練逹民情識治體近中道之人使忠厚安民而不失之寬弛敏給應務而不失之淺薄癸未以龍圖閣待制趙彥若兼侍讀朝請郎傅堯俞兼侍講先是劉摯言皇帝陛下春秋鼎盛在所資養左右前後宜正人與居語默見聞宜正事是接伏見兼侍講陸佃蔡卞皆新進少年欲望於兩制以上别選通經術有行義忠信孝悌淳茂老成之人以充其任於是佃卞皆罷以彥若堯俞代之乙酉葬神宗英文烈武聖孝皇帝于永裕陵丙戌詔罷方田以夏國主母喪遣使弔祭詔提舉府界三路保甲官並罷令逐路提刑及府界提點司兼領王巖叟言風聞章惇於簾前問陛下御批除諫官事曲折再三語涉輕侮外庭聞之衆所共憤憤又問陛下何從而知是不欲威權在人主端良入朝廷侵官犯分慢上瀆尊國有常憲乞行顯黜劉摯言神宗皇帝靈駕進發準敕前一日五使三省執政官宿於幕次竊聞宰臣蔡確獨不入宿慢廢典禮有不恭之心奏入皆不報左正言朱光庭言蔡確先帝簡拔位至宰相靈駕發引輒先馳去數十里之逺以自便安為臣不恭莫大於此又言章惇欺罔肆辨韓縝挾邪冒寵章數上其言甚切十一月癸巳詔按問強盜欲舉自首者毋減以主管西京御史臺鮮于侁為京東轉運使司馬光語人曰今復以子駿為轉運使誠非所宜然朝廷欲救東土之弊非子駿不可此一路福星也可以為轉運使模範矣安得百子駿布在天下乎考異按侁前後兩為京東轉運使撰通鑑者或以光此語竄入元豐二年今據宋史鮮于侁傳改正子駿侁字也侁至奏罷萊蕪利國兩監鐡冶又乞海鹽依河北通商民大恱丁酉祧翼祖祔神宗于太廟廟樂曰大明之舞辛丑減兩京河陽囚罪一等杖已下釋之民緣山陵者蠲其賦己酉遼遣使來賀即位丁巳以鄉貢進士程頥為汝州團練推官充西京國子監教授用司馬光吕公著及韓絳之薦也十二月壬戍詔今月十五日開經筵講論語讀三朝寶訓講讀官日赴資善堂以雙目講讀仍輪一員宿直初講及更旬宰相執政並赴罷太學保任同罪法于闐進獅子詔却之丙寅劉摯言宰臣蔡確山陵使回必須引咎自劾而確不顧亷隅恐失爵位無故自留伏望早發睿斷罷確政事以明國憲詔府界三路保甲第五等兩丁之家免冬教從王巖叟請也夏人以其母遺留物馬白駝來獻甲戍罷後苑西作院以天章待制范純仁中書舍人王震並為給事中王巖叟言震出使無亷介之譽立朝無端亮之稱封駁之任非震所當處尋命震出守初蔡確與章惇邢恕等共謀誣罔太皇太后自謂有定策功韓縝素懷不平及確為山陵使縝乃於簾前具陳確等姦狀由是內朝與外廷備知之劉摯言昨者確等覃恩轉官學士草確制有云獨高定策之功命下之日識者皆知其過而確乃偃然受之又確與章惇素相親今固結朋黨自陛下進用司馬光吕公著以來意不以為便故確內則陽為和同而陰使惇外肆強悍陵侮沮害中外以謂確與惇不罷則善良無由自立天下終不得被仁厚之澤乙亥帝初御邇英閣講論語丙子朱光庭奏言蔡確章惇韓縝宜令解機務司馬光范純仁宜進之宰輔韓維宜置之宥密退三姦於外以清百辟進三賢於內以贊萬幾太平之風自兹始矣戊寅罷增置鑄錢監十有四資治通鑑後編卷八十六
