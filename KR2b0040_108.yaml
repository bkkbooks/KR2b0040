body:
  text: 資治通鑑後編卷一百八刑部尚書徐乾學撰宋紀一百八起上章閹茂四月盡重光大淵獻九月凡一年有六月髙宗受命中興全功至德聖神武文昭仁憲孝皇帝建炎四年夏四月戊寅金羅索與薩里罕自陜州長驅入潼關曲端遣吳玠拒之於彭原店而擁兵邠州為援金人來攻玠擊敗之薩里罕懼而泣婁宿整軍復戰玠軍敗績部將楊晟死之端退屯涇原金乘勝焚邠州玠怨端不為援大詬之由是二人有隙己卯張浚引兵至房州知金兵退乃還癸未帝次越州甲申詔親征巡幸浙西韓世忠追金烏珠至黃天蕩以輕舟邀戰一日數捷烏珠窘甚或謂烏珠曰老鸛河故道今雖湮塞若鑿之可通秦淮烏珠從之一夕渠成凡三十里遂趨建康嶽飛以騎三百步兵三千邀擊於新城大破之烏珠乃復自龍灣出江中趨淮西會貝勒太一自天長趨建康來援烏珠乃復東還欲濟江世忠扼之於黃天蕩貝勒太一軍江北烏珠軍江南見海舟乘風使篷往來如飛謂其下曰南軍使船如使馬奈何乃募人獻破海舟之䇿有閩人王某者教其舟中載土以平板鋪之穴船板以棹槳俟風息則出有風則勿出海舟無風不可動也且以火箭射其篛篷則不攻自破矣烏珠然之又用方士技刑白馬剔婦人心自割其額以祭天丙申天霽風止烏珠以小舟出江世忠絶流擊之海舟無風不能動而舟上皆有五緉烏珠令善射者乘輕舟以火箭射之五緉皆自焚煙焰蔽江孫世詢嚴允皆戰死師遂大潰焚溺死者不可勝數世忠奔還鎮江烏珠遂濟江屯兵六合初世忠謂鎮江形勢無如龍王廟者敵來必登此覘我虛實乃遣兵百人伏廟中百人伏岸滸約聞鼓聲岸兵先入廟兵合擊之時果有五騎闖入廟兵喜先鼓而出獲二騎其三騎則振䇿以馳一人絳袍玉帶既墜復跳而免詰之乃烏珠也是役也世忠以八千人拒烏珠十萬之衆凡四十八日而敗帝前後六賜扎褒奬拜檢校少保武成感德軍節度使神武左軍都統制梁夫人疏奏世忠失機縱敵乞加罪責舉朝為之動色初御營使本以行幸總齊軍政而宰相兼領之遂專兵柄樞府幾無所預吕頥浩在位尤顓恣中丞趙鼎嘗疏論之及聞韓世忠敗金人頥浩請帝下詔親征帝從之鼎以為不可輕舉頥浩惡鼎異己改鼎翰林學士鼎不拜改吏部尚書又不拜乃上疏論頥浩過失凡千餘言頥浩因求去詔以頥浩倡義勤王宜從優禮乃罷為鎮南軍節度使醴泉觀使而復命鼎為中丞諭之曰朕每聞前朝忠諫之臣恨不之識今於卿見之命三省樞密院同班奏事己亥以張俊為浙西江東制置使是月金人犯江西者聞烏珠北還亦自荆門引去留守司統制牛臯潛軍寶豐擊敗之五月甲辰以范宗尹為尚書右僕射同平章事宗尹時年三十自近世以來宰相未有如宗尹之年少者辛亥統領赤心隊軍馬劉晏及戚方戰於宣州敗死壬子金人在建康者聞烏珠渡江而北大肆焚掠自靜安鎮渡宣化而去嶽飛邀擊金人於靜安敗之是夜紫微垣內有赤雲亘天白氣貫其中癸丑帝至越州駐蹕州治以白金三萬兩賜韓世忠軍贈戰歿將士孫世詢嚴永吉張淵等官以張守參知政事御史中丞趙鼎簽書樞密院事前此兵政悉𨽻御營使司事權既分又再經大變文移紛亂鼎始檢故事舉行以正西府之體甲寅金人陷定逺縣執閻勍去勍不屈死之乙卯參知政事王綯罷綯在政府一年無所建眀噤默而已丁巳命劉光世移軍捕戚方癸亥詔中原淮南流寓士人聽所在州郡附試甲子同知樞密院事兼兩浙宣撫使周望罷以侍御史沈與求論望脫身先遁縱兵大掠故也乙丑升髙郵軍為承州時諸路盜賊蜂起大者數萬人據有州郡朝廷不能制范宗尹言於帝曰羣盜皆烏合之衆急之則并死力以拒官軍莫若析地以處之盜有所歸則衆當懷土可以漸制帝善之乃以翟興等為京湖淮南諸路鎮撫使分地畀焉興河南府孟汝唐州趙立楚泗州漣水軍劉位滁濠州趙霖和州無為軍李成舒蘄州吳翊光黃州李彥先海州淮陽軍薛慶承州天長軍丁卯慶及金人戰於承州城下纍敗之未幾又授陳規德安府復州漢陽軍解潛荆南府歸陜州荆門公安軍程昌宇鼎澧州陳求道襄陽府鄧隨郢州范之才金均房州馮長寧順昌府蔡州軍翟興聽便宜從事俾立顯功許以世襲李成薛慶輩起於羣盜翟興劉位土豪李彥先等皆潰將既無統屬有急又不遣援故諸鎮鮮能自守是月劉超據荆南分兵犯陜州又合叛將彭筠犯復州河東北經制使王俊舉兵及金人戰於襄城縣敗之復潁昌府金達蘭圍楚州急趙立命撤廢屋城下然火壯士持長矛以待金人登城鉤取投火中金人選死士突入又搏殺之乃稍引退至是烏珠將北歸以輜重假道於楚立斬其使烏珠大怒乃設南北兩屯絶楚餉道六月辛未朔楊勍犯處州癸酉遣統制陳思器討勍貶周望連州安置甲戌罷御營司以范宗尹兼知樞密院事乙亥王􅊛遣統領林閠等追襲楊勍於東陽縣軍敗禆將李在死之丁丑楊勍焚建州戚方犯安吉縣詔張俊捕之戊寅更御前五軍為神武五軍御營五軍為神武副五軍滁濠鎮撫使劉位為賊張文孝所殺命其子綱襲職癸未召劉光世赴行在甲申嶽飛破戚方於廣德軍乙酉鍾相偽將引兵入慈利縣執其黨陳誠來降丙戍以吕頥浩為建康路安撫大使朱勝非為江州路安撫大使戚方詣張俊降時占象者言夜有赤氣蔽天又有白氣如練貫之侍御史沈與求言天子所在謂之朝廷今虔州一朝廷秦州一朝廷至以號為詔願敕張浚等止降指揮勿得為詔又天子禁旅劉光世輒擅之號曰太尉兵願如龍騎虎騎之類别立軍號戊午詔三省條上庚寅召韓世忠率兵赴行在壬辰權密州都巡檢徐文率部兵泛海來歸乙未真揚州鎮撫使郭仲威叛犯鎮江府遣嶽飛擊之是月張浚以金兵萃於淮上懼其復擾東南謀牽制之且欲出兵分道由同州鄜延以搗其虛乃遣秦鳯副總管吳玠帥師復永興軍烏珠聞之遂自六合趨陜西以為援前簽書樞密院事陳過庭卒於燕山府秋七月癸卯劉光世援宣撫使例乞便宜行事不許詔軍興以來諸州得便宜指揮者並罷乙巳馮長寧復順昌府張浚雖重用都統制曲端然以人言浸潤不能無疑乃使張彬詣渭州察之彬至謂端曰今兵合財備羅索以孤軍深入我合諸路攻之不難端曰彼將士精鋭且因糧於我我今反為客未可勝也若按兵據險時出偏師以擾其耕穫彼不得耕穫必取糧河東則我為主矣如此一二年彼必困敝乃可圗也萬一輕舉後憂方大彬還白浚浚不以為然及烏珠留江淮浚議出師撓之端曰平原廣野敵便於衝突而我軍未嘗習水戰金人新造之勢難與爭鋒宜訓兵秣馬保疆而已俟十年乃可浚積前疑遂承制以彭原之敗罷端兵柄尋貶階州居住戊申張浚獻黃金萬兩助軍用遣統制吕世存王俊復鄜州其餘州縣多迎降庚戍楊勍受劉光世招安尋復叛去犯泉州乙卯金人徙二帝自韓州之五國城去上京東北千里洪皓自雲中密遣人奏書以桃栗粟麵等獻丙辰張俊合諸將兵萬餘赴行在丁巳申命元祐黨人子孫於州郡自陳盡還當得恩數己未禁閩廣淮浙海舶商販山東慮為金人鄉導庚申以嶽飛為通泰州鎮撫使初諸將討戚方飛與戰數十合皆捷方遂降於張俊俊還盛言飛可用乃有是命飛辭乞淮東一重難任使收復本路州郡乘機漸進使山東河北河東京畿等路次第而復不聽八月辛未朔以禮部尚書謝克家參知政事壬申李成請降於江州詔撫納之張浚承制停程千秋官文州編管甲戌詔侍從官日一員輪直進故事關治體者丁丑贈監察御史常安民為左司諫江公望為左諫議大夫録其後二人庚辰太后至自虔州薛慶及金人戰於揚州城下死之户部侍郎季陵始為范宗尹所薦遂致顯職宗尹嘗仕偽楚故凡受偽命者皆録用陵因上疏乞詔宰執於罪戾中選擇實能量付以事勿以一眚廢其終身仍詔臺諫為國愛人勿復言詔榜其疏於朝堂侍御史沈與求劾陵承望宰相風旨且言宗尹年少為相恐誤國事辛巳斥與求知台州陵提舉洞霄宫宗尹復視事考異宋史髙宗紀是月辛巳沈與求季陵以論宰相范宗尹皆黜按二人一黨宗尹一劾宗尹紀以陵為論宰相被黜大誤今從季陵傳癸未權知三省樞密院事盧益罷張浚復永興軍再貶曲端萬州安置丙戍命李成吳翊捍禦上流翊棄城去以成為四州鎮撫使命李捧便道過信州招捕靳賽戊子貶滕康永州劉珏衡州並居住乙丑詔嶽飛救楚州仍命劉光世遣兵往援壬辰盜入梅州殺守臣沈同之大掠而去癸巳命福建安撫使程邁會兵討范汝為甲午知虢州邵興遣統制閻興及金人戰於解州東屢破之金人入承州命陳思恭屯兵明州以防海道劉光世遣王德酈瓊以輕兵渡江乙未遇金遊騎於召伯埭敗之戊戍以桑仲為襄鄧隨郢鎮撫使范宗尹念鄉國被禍請赦仲罪而授以官從之是月孔彥舟入潭州宣撫司主管機宜文字傅雱在彥舟軍中承制以彥舟權湖南副總管九月甲辰太上皇后鄭氏崩於五國城戊申金立劉豫為齊帝初金主聞帝如東南遣尼瑪哈南伐諭之曰俟宋平當援立藩輔如張邦昌者及烏珠北還衆議折可求劉豫皆可立豫以重寶賂達蘭請立己達蘭許之乃言於尼瑪哈未之許髙慶裔説之曰吾家舉兵只欲取兩河故汴京既得則立張邦昌今河南州郡官制不易者豈非欲循邦昌故事邪元帥何不早建議而使恩歸他人也尼瑪哈從之乃遣使即豫所部咨軍民所宜立者衆未及對豫鄉人張浹請立豫議遂定達蘭以聞於是金乃遣慶裔及知制誥韓昉備璽綬寶册立豫為大齊皇帝世循子禮奉金正朔置丞相以下豫即位都大名府改元曰阜昌以張孝純為丞相李孝揚為左丞張柬為右丞鄭億年為工部侍郎李儔為監察御史王瓊為汴京留守子麟為提領諸路兵馬兼知濟南府弟益為北京留守册其母翟氏為皇太后妾錢氏為皇后錢氏宣和內人也朝臣之凡仕於豫而其家屬在東南者悉厚加撫恤豫受册之初告天祝版誤書年號為靖康又純用趙野家廟祭器識者知其不久劉豫命偽帥趙斌以禮聘尹焞焞不從以兵恐之焞遂自商州奔蜀庚戌禁宣撫司僚屬便宜行事及京西湖南北路勿𨽻川陜宣撫司節制癸丑涇原同統制李彥琦及金人戰於洛河車渡敗之乙卯桑仲陷均房州進犯白土關丙辰金烏珠攻楚州鎮撫使趙立遣人告急趙鼎欲遣張俊救之俊辭不行乃命劉光世督淮南諸鎮救楚海州李彥先首以兵至淮河扼不得進揚州郭仲威按兵天長隂懷顧望光世將王德酈瓊多不用命惟嶽飛僅能為援而衆寡不敵帝覽立奏以書趣光世會者五光世迄不行金人知外援絶進攻東城立登磴道以觀飛炮中其首左右馳救之立曰我終不能為國殄賊矣言訖而絶金人疑立詐死不敢動越旬餘城始陷立徐州人以敢勇𨽻兵籍為人木強不知書忠義出天性善騎射不喜聲色財利仇視金人所俘磔以示衆未嘗獻馘也事聞贈奉國節度使諡忠烈丁巳趙霖復和州己未金均房州安撫使王彥及桑仲戰於平麗縣敗之辛酉李捧擊范汝為於建州官軍皆潰捧遁去金人犯揚州統制靳賽逆戰於港河敗之金人陷延安府執呂世存又陷保安軍張浚聞金烏珠將至檄召熙河劉錫秦鳯孫偓涇原劉錡環慶趙哲四經略及吳玠之兵合四十萬人馬七萬匹以錫為統帥迎敵決戰王彥諫曰陜西兵將上下之情未通若不利則五路俱失不如且屯利閬興洋以固根本敵入境則檄五路之兵來援萬一不捷未大失也浚不從劉子羽亦力言未可浚曰吾寧不知此顧東南事方急不得不為是耳吳玠郭浩皆曰敵鋒方鋭宜各守要害須其弊而乘之亦不從遂行次於富平縣癸亥劉錫會將議戰玠曰兵以利動今地勢不利未見其可宜擇髙阜據之使不可勝諸將皆曰我衆彼寡又前阻葦澤敵有騎不得施何用他徙已而婁宿引兵驟至輿柴囊土藉淖平行進薄諸營錫等與之力戰劉騎身率將士薄敵陳殺獲頗多勝負未分而敵鐡騎直擊趙哲軍他將不及援哲因離所部其將校望見塵起遂驚遁諸軍皆潰敵乘勝而進關陜大震浚時駐邠州督戰既敗退保秦州召趙哲斬之而安置劉錫於合州令諸將各還本路上書待罪帝手詔慰勉之自是關陜不可復論者咎浚之輕舉失律戊辰荆襄賊趙延夀焚郢州金人入楚州淮揚鎮撫使李彥先率兵救之敗死冬十月辛未秦檜自金歸初檜從二帝至燕金主以檜賜達蘭為所任用達蘭信之及南侵以為參謀軍事又以為隨軍轉運使達蘭攻楚州檜與妻王氏自軍中趨漣水軍自言殺金人監己者奪舟而來欲赴行在遂航海至越州帝命先見宰執檜首言如欲天下無事須是南自南北自北朝士多疑其與何栗孫傅等同被拘執而檜獨還又自燕至楚二千八百里踰河越海豈無譏訶之者安得殺監而南就令從達蘭軍金人縱之必質妻屬安得與王氏偕惟范宗尹李回素與檜善盡破羣疑力薦其忠檜入對首奏所草與達蘭求和書帝謂輔臣曰檜朴忠過人朕得之喜而不寐既聞二帝母后消息又得一佳士也先是朝廷雖數遣使於金但且守且和而專意與敵解仇息兵則自檜始蓋檜在金庭首倡和議故達蘭縱之歸也丁亥以端眀殿學士李回同知樞密院事庚寅召張俊以兵入援追復李邦彥觀文殿大學士乙未嶽飛破金人於承州淮寧鎮撫使馮長寧叛以城附劉豫環慶路統制慕洧叛附於夏國涇原統制張仲彥經略司幹辦趙彬叛降於金十一月癸卯詔追贈元祐故相吕公著吕大防范純仁慕洧引金人圍環州甲辰簽書樞密院事趙鼎罷帝欲以副都統辛企宗為節度使鼎言企宗非軍功持不下帝不樂遂罷鼎提舉洞霄宫帝欲申企宗前命謝克家曰如此是使鼎得名企宗得利而陛下獨負謗於天下後世也乃止丙午嶽飛棄泰州渡江先是飛戰於承州三戰三捷殺髙太保俘酋長七十餘人劉光世等皆不敢前楚州遂陷詔飛還守通泰有旨如不可守但於沙洲保護百姓伺便掩擊飛以泰州無險可恃退保柴墟渡百姓於沙上丁未金人犯泰州飛退保江隂沙上以御史中丞富直柔簽書樞密院事直柔弼之後也以秦檜為禮部尚書戊申金人陷涇原經略使劉錡退屯瓦亭金人遂取渭州鎮戎軍慕洧復引金兵陷環慶己酉以孔彥舟為湖南副總管部兵屯潭州壬子日南至帝率百官遙拜二帝自渡江至是始有此禮其後正旦亦然時所在盜起加以飢饉無所資食惟蜀富饒巨盜往往窺覬桑仲據金州白土關衆號三十萬仲王彥舊部曲也以申牘請於彥曰仲於公無敢犯願假道入蜀就食彥遣統領閔立為先鋒擊之賊鋭甚立戰死將士失色或請避之彥叱曰樞相張公方有事關陜若仲越金而至梁洋則腹背受敵大事去矣敢言避者斬即勒兵趨長沙坪阻水據山設伏以待仲見官軍少蟻附搏戰彥執幟以麾士殊死鬬仲敗走彥休士進擊追奔至白沙磧遂復房州丁巳張浚以彥為金均房州鎮撫使甲子詔諸路守臣節制管內軍馬是月金人陷德順軍張浚聞之乃退保興州時輜重焚棄將士散亡惟親兵千餘自隨人情大沮或請徙治夔州參軍事劉子羽叱之曰孺子可斬也四川全盛敵欲入寇久矣直以川口有鐡山棧道之險未敢遽窺爾今不堅守縱使深入而吾僻處夔峽與關中聲援不相聞進退失計悔將何及今幸敵方肆掠未逼近郡宣司但當留駐興州外繫關中之望內安全蜀之心急遣官屬出關呼召諸將收集散亡分布隘險堅壁固壘觀釁而動庶幾可以補前愆耳浚然其言而諸參佐無敢行者子羽請奉命北出單騎至秦州召諸亡將時諸將不知宣司所在及聞命大喜悉以其衆來會凡十餘萬人軍勢復振子羽因請遣吳玠聚兵扼險於鳯翔大散關東之和尚原以斷敵來路關師古等聚熙河兵於岷州大潭孫偓賈世方等聚涇原鳯翔兵於階成鳯三州以固蜀口金人知有備遂引去十二月丙子禁節制軍馬守臣便宜行事壬辰金人攻熙州副總管劉惟輔擊敗之殺五千餘人甲午復至惟輔念城外尚有積粟恐敵因之以守出焚之為金人所執誘之百方終不言捽其頭以去惟輔曰今若斬即斬吾頭豈汝捽也顧坐上客曰國家不負汝一旦遽降敵邪即閉口不復言而死知蘭州龕谷寨髙子孺聞城陷先創其家而後死熙河馬步軍將韓青為金人所擒亦罵不絶口遂遇害惟輔涇州人事聞贈昭化軍節度使立廟成州號忠烈乙未以張俊為江南招討使討李成丁酉范汝為降詔補民兵統領是月定差役法初帝在河朔親見閭閻之苦嘗歎知縣不得其人一充役即至破家及即位深加講議乃為定法以二十五家為一保一大保為一都內選才力髙富者二人充都保主一都盜賊煙火之事其次有保長若品官則一品限田五十頃至九品五頃免差子孫蔭盡則同編户太學生及得解經省試者許募人充役軍丁女戶及孤弱悉免張浚承制復海州團練副使曲端左武大夫興州居住金密諭諸路令同日大索兩河之民及拘行李於道凡三日而罷客户並籍入官刺其耳為官字鎖之雲中及散飬民間立價鬻之或驅之於韃靼諸國以易馬蓋既立偽齊以舊河為界恐陷金者逃歸豫地故爾時樂夀縣得客户六十八人誤作六百八人以報尼瑪哈必責其數縣官執窮民以足之被掠出雲中者不令出城無以自活士大夫往往乞食於途尼瑪哈見其多恐或生事聚三千餘人坑之紹興元年春正月己亥朔帝在越州不受朝賀下詔改元釋流以下囚復賢良方正直言極諫科翰林學士汪藻上疏曰方今諸將爵祿已極家資已盈習成悍驕無復鬭志一方有警輒狐疑相杖無一人奮然為國請行者或敦迫不得已而行則邀例外之賞肆無名之求使朝廷黽勉曲從不啻如奉驕子是豈能為國家平禍立功者哉臣於此有馭將之説三一曰示之以法古者人君以恩結人必有人臣為朝廷任其責者李祐夜入蔡州縛吳元濟其功大矣違詔進馬溫造劾之祐曰今日膽落於溫御史夫違詔進馬於軍政未有害也而且不貸如此今諸將雖驕然臣得之傳聞亦尚知畏朝廷之法使知朝廷有人小過不貸則惡意不復萌於胸中矣二曰運之以權君之於將必得其要領而使之心畏誠服唐宰相杜黃裳令髙崇文將兵討蜀以崇文素憚劉澭使人謂曰君不奮命當以澭代崇文懼盡力縛賊以獻是以澭代崇文者黃裳得其要領也陛下於平居之時亦當深察其好惡如劉澭代崇文之術不可不知三曰别之以分唐太宗所與謀者房杜而已英衛之徒不得而與也今陛下對大臣不過數刻而諸將皆得出入禁中是大臣見陛下有時而諸將無時也此曹何識不能上補聰眀不過入則求恩澤出則藉權勢而已道路流傳遂謂陛下進退人材諸將或與焉致人言如此必有可疑之迹不可不慎也又廟堂者具瞻之地大臣為天子立政事以令四方者也今諸將率驟謁徑前便衣密坐視大臣如僚友百端營求期於必得朝廷豈不懼卑哉祖宗時三衙見大臣必執梃趨庭肅揖而退非文具也以為等威之嚴乃足相制以今觀之一何陵夷之甚邪兼國家出師遣將詔侍從集議者所以博衆人之見也而諸將必在焉夫諸將聽命者也乃使之預謀彼既各售其説則利於公不利於私者必不以為可行便於己不便於國者必不以為可罷欲責其冒鋒鏑趨死地難矣自今諸將當律以朝儀每有奏陳必使如有司之式毋數燕見其至政事堂亦有祖宗故事且毋使參議論庶名分不致混淆而可以責其功效是三説者果行足以駕馭諸將何憂乎保民何艱乎弭盜何患乎遏敵哉若夫財用則民窮至於骨臣願陛下毋以生財為言也今國家所有不過數十州則所謂生者必生之於此數十州之民其何以堪惟痛加裁損庶乎其可耳外之可損者軍中之冒請內之可損者禁中之泛取今一軍之中非戰士者率三居其二有詭名而請者一人而挾數人之名是也有以使臣之名而請者一使臣之俸實兼十戰士之費有借補官資而請者四方遊手竄名軍中既得主帥借補便悉支祿廪與命官同訪聞嶽飛軍中如此類者數百人州縣懼於憑陵莫敢訶詰其盜支之物不可勝計臣竊觀國家軍旅之餉百官之廩乘輿之奉悉在有司而禁中時有須索如戶部銀絹以萬計禮部度牒以百計者月有進焉以陛下清心恭儉必無宴遊侈費營繕浮耗然人主用財要須有名使有司與聞用而無名是取民膏血擲而棄之溝中耳至於度牒則國家以虛名而權實利以濟軍興之用誠非小補幸毋以為方寸之紙捐以豫人而不惜也若內外並加裁損大農之計雖未至有餘其視不知節用而專務生財者有間矣臣復有私憂過計者自古以兵權屬人久未有不為患國家以三衙管軍而一軍之出必待密院之符祖宗於兹蓋有深意今諸將之驕密院己不得制臣意偏裨中必有英豪及今之時用漢建諸侯法衆建之而少其力精擇偏禆十餘人人裁付兵數千直𨽻御前而不𨽻諸將合為數萬以漸銷諸將之權此萬世計也時孔彥舟據武陵張用據襄漢李成據江淮湖湘十餘郡連兵數萬有席卷東南之意多造符讖幻惑中外朝廷患之戊申以張俊為江淮路招討使俊請嶽飛同往許之以李光為吏部侍郎光奏疏極論朋黨之害曰今議論之臣各懷顧避莫肯以持危扶顛為己任駐蹕會稽首尾三載自去秋迄今敵人無復南渡之意淮甸咫尺了不經營長江千里不為限制惴惴焉日為乘桴浮海之計晉元帝區區草創猶能立宗社修宫闕保江浙劉琨祖逖與北人拒戰於并冀兖豫司雍諸州未嘗陷沒也石季龍重兵已至歷陽命王導都督中外諸軍以禦之未嘗專主避敵如今也陛下駐蹕會稽江浙為根本之地使進足以戰退足以守者莫如建康建康至姑孰一百八十里其隘可守者有六曰江寧鎮曰碙砂夾曰采石曰大信其上則有蕪湖繁昌皆與淮南對境其餘皆蘆篠之場或崎岸水勢湍悍難施舟楫莫若預於諸隘屯兵積粟命將士各管地分調發旁近鄉兵協力守禦乞明詔大臣參酌施行復江池路為江東西路分荆湖江南諸州為荆湖東西路置安撫司治池江鄂鼎四州以吕頥浩為江東路安撫大使朱勝非為江西路安撫大使馬進陷江州守臣姚舜眀棄城走端眀殿學士王易簡等二百人皆遇害己酉金人攻揚州吳玠敗金人於秦州庚戌金人犯西寧州守臣俱重迎降辛亥參知政事謝克家罷壬子張仲孚以原州叛降於金辛酉詔曰太祖創業垂統德被萬世神宗詔封子孫一人為安定郡王世世勿絶自宣和末至今未舉有司其上應襲封人名依故事施行金人再圍環州二月壬申初定嵗祀天地社稷如奏告之禮戊寅禁州郡統兵官擅招安亂軍盜賊己卯日中有黑子四日乃沒辛巳以禮部尚書秦檜參知政事丙戍復置祕書省壬辰雨雹丁酉宣教郎范夀與孟忠厚有憾誣與太后密飬欽宗子帝曰朕與太后如母子安得有此即治其罪除名潮州編管是月馬友遣其黨犯鄂州總管張用拒却之李允文以友權湖南招捉公事友大掠漢陽而去過嶽州守臣吳錫遁友據之三月戊戌朔吕頥浩遣崔增王􅊅合兵擊李成於湖口大敗之壬寅禁諸路遏糴丙午孔彥舟焚掠潭州趨衡州初越王偲從上皇北行至慶源境乏食而卒至是有男子崔紹祖諸夀春府稱越王中子受上皇蠟詔為天下兵馬大元帥興師恢復鎮撫使趙霖以聞辛亥召赴行在事敗送臺獄伏罪斬於越州市甲寅罷諸免行錢乙卯金人陷階州甲子始下詔罪李成募人禽斬赦脅從者是月張俊聞李成將馬進在筠州以洪州介江筠之間遂急趨之既入城喜曰我已得洪破賊決矣及進犯洪州連營西山俊斂兵若無人者居月餘進以大書牒索戰俊以細書狀報之進以俊為怯嶽飛曰賊貪而不慮後若以騎兵自上流絶生米渡出其不意破之必矣因請自為先鋒俊大喜乃令楊沂中絶生米渡飛重鎧躍馬潛出賊右突其陳所部從之進大敗走筠州飛抵東城進出城布陳飛設伏以紅羅為幟上刺嶽字選騎二百隨幟而前賊易其少薄之伏發進復敗走飛使人呼曰不從賊者坐吾不汝殺坐而降者八萬人俊與沂中復前後夾擊賊大潰進以餘卒奔南康飛夜引兵至朱家山又斬其將趙萬成聞進敗自引兵十餘萬來飛遇成於樓子莊大破之追斬進遂復筠州成復以十萬衆與俊夾河而營沂中夜銜枚渡河與俊夾攻成又大敗俊乘勝追至江州成勢迫絶江而去走蘄州興國軍等處羣盜皆遁振淮南京東西流民金烏珠陷鞏洮河樂蘭廓積石西寧州自是涇原熙河二路皆為金有武功大夫張榮擊敗金兵於興化榮本梁山濼漁人聚舟數百以劫掠金人杜充時嘗借補武功大夫金人南侵攻之不克及金兵退榮襲據通州聯舟入興化縮頭湖作水寨以守金達蘭在泰州謀再渡江欲先破榮寨榮率舟師與之遇見金戰艦不多餘皆小舟時水退隔泥淖不能前乃舍舟登岸大呼擊之金人不得騁舟中自亂溺水及陷泥淖者不可勝計俘馘五千餘人達蘭收餘衆奔還楚州退屯宿遷尋北去榮告捷於朝遂以榮知泰州金人破福津蹂同谷以迫興州張浚退保閬州而以張深為四川制置使與劉子羽趨益昌王庶為利夔制置使節制陜西諸路知興元府夏四月己巳張浚承制分利閬劍文政五州為利州路置經略安撫使秦檜言臣昨與何栗孫傳陳過庭張叔夜同扈二聖北狩今臣偶獲生還而四人皆死異域望依聶昌例贈官仍給其家以為死事之勸詔並特贈開府儀同三司各與十資恩澤既而御史章誼論栗誤國遂格贈典檜再為眀其死節乃贈觀文殿大學士庚午金達蘭渡淮屯宿遷縣樂馬湖壬申太白晝見乙亥劉光世復楚州階州統領杜肇復其城庚辰隆祐皇太后孟氏崩帝事太后極孝雖帷帳皆親或得時果必先獻太后太后患風疾帝旦暮不離左右衣弗解帶者連夕至是崩於行宫之西殿年五十九遺命擇地攢殯俟軍事寧歸葬園陵太后性節儉謙謹有司月供千緡而止帝嘗詔文書應奏者避太后父名不許羣臣請上太皇太后號亦不許命學士院降詔戒敕孟忠厚不得與聞朝政通貴近至私第謁見宰執以恩澤當得官者近八十員未嘗陳請癸未桑仲陷鄧州守將談兖棄城走河東招捉使王俊引兵來援仲執斬之以其黨李橫知州事乙酉為太后制期年服辛卯羣臣三上表始聽政癸巳命荆湖東路安撫向子諲發兵及廣西安撫許中同拒險要防孔彥舟入廣仍許脅從自新以招諭之是月京西賊李忠陷商州守臣楊伯孫棄城走金聞耶律大石在和州之域恐與夏人合遣使索之夏國報以境土不相接亦不知大石所往尼瑪哈以耶律伊都遼之近族必知其巢穴以番漢及女真軍萬人付伊都使攻大石於漠北曷董城臨行質其妻子仍起燕雲河東夫運餉曷董去雲中三千餘里三路之夫道路死者不可勝計五月癸卯內殿宣示大宋受命中興之寶并道君所獲元圭金人犯和尚原吳玠擊敗之丙午初復召試館職之制劉光世使都統制王德襲揚州擒郭仲威送行在斬之時仲威謀據淮南以通劉豫故也己酉詔以米價踴貴令州縣誘積穀之家出糶自三千石至二萬石補官有差辛亥水軍統制邵青叛圍太平州劉光世招降之趙彬及金人合兵圍慶陽府守臣楊可升擊敗之元懿太子卒帝未有後范宗尹造膝請建太子帝曰太祖以神武定天下子孫不得享之遭時多艱零落可憫朕若不法仁宗為天下計何以慰在天之靈甲寅詔知內外宗正事令廣選年幼宗子將育於宫中庚申孔彥舟引衆過潭州馬友迎擊大敗之彥舟趣鄂州李允文以彥舟為湖東副總管屯漢陽賊趙延據分寧縣壬戍吕頥浩招降之是月張俊引兵渡江追李成至蘄州黃梅縣大敗之其衆數萬皆潰成北走降劉豫舒蘄鎮撫使張用復叛冦江西嶽飛與用俱相人以書諭之曰吾與汝同里今吾在此欲戰則出不戰則降用得書遂帥衆降江淮悉平俊奏飛功第一尋詔進飛右軍都統制屯洪州彈壓盜賊飛過廬陵託宿㕓市質眀為主人泛掃門宇洗滌盆盎而去郡守供帳餞别於郊師行將絶謁未得通問大將軍何在云已雜偏禆去矣其嚴肅如此湖州進士吳木上書論宰執送徽州編管初給事中陳戬嘗疏論五失一謂宰執尚寬厚示大體而務姑息二謂寵任將臣輕授之柄遂使邀賞恃恩至謂本兵大臣出其門下三謂臺諫觀望朝廷交結權幸毛舉細務以塞責四謂監司郡守身自犯法豈能律姦五謂內侍之權漸盛附結將帥恐臨安之變生於不測帝奬其言至是又論諸將造政事堂與大臣狎紊亂朝綱恐緩急不可用於是樞臣上章待罪諸將亦不自安矣蠲江西路被賊州縣賦稅六月己巳始鬻承直修武郎以下官壬申册諡皇太后曰昭慈獻烈乙亥月犯心庚辰上虞縣丞婁寅亮上書曰先正有言太祖舍其子而立弟此天下之大公周王薨章聖取宗室育之宫中此天下之大慮仁宗感悟其説詔英宗入繼大統文子文孫宜君宜王遭罹變故不斷如帶今有天下者獨陛下一人而已屬者椒寢未繁前星不耀孤立無助有識寒心天其或者深戒陛下追念祖宗公心長慮之所及乎崇寧以來諛臣進説獨推濮王子孫以為近屬餘皆謂之同姓遂使昌陵之後寂寞無聞僅同民庶藝祖在上莫肯顧歆此金人所以未悔禍也望陛下於伯字行內選太祖諸孫有賢德者視秩親王俾牧九州以待皇嗣之生退處藩服庶幾上慰在天之靈下繫人心之望書奏帝讀之感歎壬午權櫕昭慈獻烈皇后於越州張琪犯徽州守臣郭東棄城去琪入據之詔舊相吳敏復觀文殿學士充廣西湖南宣撫使范宗尹薦之也敏尋辭去邵青復叛己丑犯江隂之福山遣海州鎮撫使李進彥中軍統制耿進率舟師會劉光世討之張浚承制以吳玠為陜西諸路都統制時關隴六路盡沒於金止餘階成岷鳯洮五郡及鳯翔之和尚原隴州之方山原而已尼瑪哈以所得陜西地悉與偽齊劉豫置招受司於宿州誘宋逋逃秋七月乙未朔以馬友權荆湖東路副總管趣討孔彥舟劉光世以枯秸生穗為瑞奏之帝曰嵗豐人不乏食朝得賢輔佐軍中有十萬鐡騎乃可為瑞此外不足信朕在潛邸時梁間有芝草府官皆欲上聞朕手自碎之於是宰執以下歎服資政殿學士提舉洞霄宫吕好問卒於桂州辛丑封太祖後令話為安定郡王令話德昭元孫也甲辰詔密書省長二通修日厯丙午金達蘭自宿遷北歸癸亥尚書右僕射同平章事兼知樞密院事范宗尹罷宗尹有才智毅然以國事自任然為政多私屢為言者所詆是嵗當祀眀堂文武有合轉官者宗尹以為多所僥幸乃建言討論崇觀以來濫賞而秦檜力贊之帝手劄云朕不欲歸過君父斂怨士夫而宗尹堅謂可行即日求出於是檜復以此事擠宗尹帝亦惡其為人會侍御史沈與求條宗尹罪狀二十宗尹力請罷政遂豫祠未幾又落職是月王彥數擊敗李忠趙彬來歸張浚承制以彬為陜西轉運使八月丙寅以孔彥舟為蘄黃鎮撫使丁卯張浚殺前威武大將軍曲端浚自敗於富平乃思端言召之還稍復其官徙閬州將復用之吳玠憾端因言端再起必不利於公王庶又從而間之玠復書曲端謀反四字於手以示浚庶又言端嘗作詩題柱曰不向關中興事業却來江上泛漁舟謂其指斥乘輿浚乃送端於恭州獄有武臣康隨者嘗以事忤端端鞭其背隨恨端入骨浚以隨提點夔路刑獄端聞之曰吾其死矣呼天者數聲端有馬名鐡象日馳四百里至是連呼鐡象可惜者又數聲乃赴逮既至隨令獄吏縶維之糊其口熁之以火端乾渴求飲與之酒九竅流血而死初浚嘗按視端軍營中閴無一人浚欲點視端以所部五軍籍進浚命點其一則於庭間開籠縱一鴿以往而所點之軍隨至浚為愕然既而欲遍閲乃悉縱五鴿則五軍頃刻而集戈甲煥爛旗幟精明浚雖賞而實忌之端既死陜西士大夫莫不痛惜軍士悵恨有叛去者張用部兵至瑞昌歸張浚浚以用為本軍統制癸酉復以汪伯彥為江東安撫大使時黃潛善已死張守復薦用伯彥侍御史沈與求論劾之詔禠伯彥新職守亦引疾求去尋罷為資政殿學士提舉洞霄宫乙亥袝昭慈獻烈皇后神主於溫州太廟工部侍郎韓肖胄嘗密啓帝追褒元祐諸臣是日詔復程頥任伯雨龔夬張舜民官帝謂宰執曰黨籍追贈至今未了卿等為朕留意此四人名德尤著者也戊寅以李回參知政事富直柔同知樞密院事時沈與求再居言路或疑其凡范宗尹所引用者將悉論出之與求曰近世人才以宰相出處為進退蓋習以成風今當别人之邪正能否而公言之豈可謂一時所用皆不賢哉人服其言中書省言池江二州地勢僻隘失祖宗分道置帥之意庚辰詔江東西路依舊以升洪為帥府壬午鑄紹興錢丁亥以秦檜為尚書右僕射同平章事兼知樞密院事范宗尹既去相位久虛檜欲得其位因揚言曰我有二策可聳動天下或問何不言檜曰今無相不可行也帝聞乃有是命庚寅復李綱資政殿大學士募人往京東河南伺察金齊動止是月知鄂州曹成掠湖西犯沅州與知復州李宏合屯瀏陽既而攻宏宏奔潭州九月丁未詔嵗再遣使者謁諸陵因撫問河南將士庚戍命宗室右監門衛大將軍士芑朝饗溫州太廟辛亥合祭天地於眀堂太祖太宗並配大赦罷諸州守臣節制軍馬録用元符末上書人子孫癸丑復以吕頥浩為尚書左僕射同平章事兼知樞密院事頥浩入對首言先平內冦然後可禦外侮今李成摧破江淮雖張琪邵青兩冦不久可平而閩中之冦不一又孔彥舟據鄂馬友據潭曹成等在湖南江西之間而南雄英韶諸郡賊兵多寡不等然閩寇最急廣盜次之蓋閩去行在不逺二廣不經殘破若非速除為害不細帝深然之龍圗閣學士知湖州汪藻上疏言本朝實録自艱難以來金匱石室之藏無復存者伏觀列聖自哲宗皇帝而上皆有成書流人間頗有其本朝廷已詔藏御府若太上皇帝淵聖皇帝及陛下建炎改元至今三十餘年並無日厯乞詔有司纂述未見施行臣竊惟自古有國必有史故書榻前議論之辭則有時政記録柱下見聞之實則有起居注類而次之謂之日厯修而成之謂之實録所以廣記備言成一代之典也若曠三十年之久漫無一字之傳將何以示來世乎及今耳目所接尚可追求更數年間事將埋沒雖有良史莫知所憑况比年風俗之衰公論不立士大夫取豫皆出愛憎因一事為一人而著書行世者多矣若不乘時訂正則數世之後信以傳信疑以傳疑是非渾殽白黑顛倒小人之説行而君子受其誣矣可不懼哉臣政和中為著作佐郎修太上皇帝日厯東觀凡例臣與聞焉今所領州又幸經兵火之餘獨不殘燬視諸故府案牘具存如御筆手詔賞功罰罪之文尚班班可考失今不輯臣實惜之古之有國家者雖在顛沛中史官不廢况今邉烽稍息羣盜屏除正朝廷搜補闕疑之時也伏望睿慈許臣郡政之餘將本州所有御筆手詔賞功罰罪文字截自元符庚辰至建炎己酉三十年間分年編類仍量給官錢市紙劄募書工之類繕寫進呈以備修日厯官採擇帝從之即以命藻其後中書舍人兼史官纂修綦崇禮奏乞令藻以已成文字赴本所藻奉詔訪求甚備未及排纂崇禮取而專之甲寅帝諭宰執曰朕居位五祀而王室已微念兹永懷慘苦焚灼比因宗祀明堂投誠上帝冀獲悔禍以雪神人之耻而赦文夸大殊咈朕心又除吕頥浩制首以中興聖緒兼創業守文為言徒使四方誚於有識可與外任於是中書舍人兼直學士院席益豫郡而去辛酉詔四方有建䇿能還兩宫者實封以聞有效者賞以王爵是月長星見詔求直言金達蘭北歸路由東平府劉豫不出迎且遣人議於達蘭曰豫今為帝相見無拜禮逹蘭大憾之盡却所獻之物而去豫遣偽相張孝純隨而和解之數日乃還達蘭至祁州遷其民許只擕行李其錢穀之類皆留遂以祁城為元帥府資治通鑑後編卷一百八
