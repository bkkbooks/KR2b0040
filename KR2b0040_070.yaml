body:
  text: 資治通鑑後編卷七十刑部尚書徐乾學撰宋紀七十起元黓攝提格正月盡十二月凡一年仁宗體天法道極功全德神文聖武睿哲明孝皇帝嘉祐七年春正月己酉朔大慶殿受朝壬戍御宣德門觀燈顧從臣曰此因嵗時與萬姓同樂耳非朕獨肆遊觀也先是諌官楊畋司馬光等以去年水災乞罷上元觀燈故特宣諭之乙亥詔太常禮院自今南郊以太祖皇帝定配改溫成皇后廟為祠殿嵗時令宫臣以常饌致祭先是詔太常禮院檢詳郊廟未順之事乃言自皇祐五年詔書以三聖並侑為定制雖出孝思然其事頗違經禮又溫成皇后廟四時祭奠並同太祖之禮蓋當時有司失於講求昔髙宗遭變飭已思咎祖己訓以祀無豐於昵况以嬖寵列於秩禮非所以享天心奉祖宗之意也復下兩制議而翰林學士王圭等議曰追尊尊以享帝義之至推親親以享親仁之極尊尊不可以瀆故郊無二主親親不可以僣故廟上其先今三后並侑欲以致孝也而適所以瀆乎享帝後宫有廟欲以廣恩也而適所以瀆乎享親請如禮官所議故降是詔辛巳以知蘄州張田提舉荆湖南路刑獄諌官司馬光再疏言田傾邪險薄不可任以監司尋改知湖州初江湖運鹽既雜惡官估復髙故百姓利食私鹽由是盜販者衆捕之急則起為盜賊江淮間雖衣冠士人狃於厚利或以販鹽為事江西則虔州地連廣南而福建之汀州亦與虔接虔鹽弗善汀故不産鹽二州民多盜販廣南鹽以射利每嵗秋冬田事才畢往往數十百為羣持甲兵旗鼓往來虔汀漳潮循海惠廣八州之地所至劫人榖帛掠人婦女與巡捕吏卒鬭格至殺傷吏卒則起為盜依阻險要捕不能得或赦其罪招之嵗月浸淫滋多朝廷以為患嘗遣職方員外郎黃炳乘驛會所屬監司及知州軍通判議於是炳等合議以為虔州食淮南鹽已久不可改第損近嵗所增官估斤為錢四十以十縣五等户夏稅率百錢令糴鹽二斤隨夏稅入錢償官繼命提點鑄錢沈扶覆視可否扶及江西福建廣東轉運司虔州官吏又請選江西漕船團為十綱以三班使臣部之直取通泰楚都倉鹽既又命比部貟外郎曽楷詣廣南與監司復議通廣南鹽而轉運判官陳從益請惠循梅潮置五都倉貯鹽令虔州募鹽鋪户入錢二州趣五倉受鹽還二州貿易所謂變私鹽為官鹽易盜賊為商旅朝廷難之卒用炳扶等䇿然嵗才增糴六十餘萬斤癸卯詔兖國公主入內安州觀察使駙馬都尉李瑋知衛州瑋所生母楊氏歸其兄璋公主乳母韓氏出居外公主宅勾當內臣梁懷吉歸前省諸色祗應人皆散遣之瑋貌陋性朴公主常庸奴視之韓氏復相離間公主嘗與懷吉飲楊氏窺之公主怒毆楊氏夜開禁門訴於帝所言者皆咎公主懷吉等既坐責公主恚懟欲自盡或縱火欲焚第以邀上必召懷吉等還上不得已亦為召之諌官楊畋司馬光龔鼎臣等皆力諌上弗聽然公主意終惡瑋不肯復入中間狀若狂易欲自盡者數矣苗賢妃與俞充儀謀使內臣王務滋管勾駙馬宅以伺瑋過瑋素謹務滋不得其過乃告苗俞曰但得上旨務滋請以巵酒了之苗俞白上上不答頃之上與皇后同坐俞又白之皇后曰陛下念章懿皇后故瑋得尚主今奈何欲為此都知任守忠在旁曰皇后言是也務滋謀訖不行尋有是命此據司馬氏記聞及奏議懷吉先配西京灑掃班在五年十月庚申其復召不得時月癸未録繫囚權陜西轉運副使薛向言陜西之兵廂禁軍凡二十五萬其間老弱病患伎巧占破數乃過半請下諸路㨂其不任征役者汰之敢占伎巧者論如法從之辛亥詔禮部貢舉壬子兖國公主降封沂國公主安州觀察使李瑋為建州觀察使落駙馬都尉自公主入禁中瑋兄璋上言瑋愚騃不足以承天恩乞賜離絶上將許之司馬光言陛下始者追念章懿太后故使瑋尚主欲以申固姻戚常貴其家今瑋母子離析家事流落大小憂愁殆不聊生豈陛下初意哉近者章懿太后忌日陛下閲奩中故物思平生居處獨能無雨露之戚悽愴之心乎瑋既蒙斥公主亦不得無罪上感悟遂并責公主待李氏思禮不衰且賜瑋黃金二百兩謂曰凡人富貴亦不必為主壻也此亦據司馬光記聞癸丑大宗正司言右屯衛大將軍嶽州團練使宗實乞還泰州防禦使知宗正寺告敕不許乙卯以禮部侍郎參知政事孫抃為觀文殿學士兼翰林侍讀學士同羣牧制置使抃居兩府年益耄無所可否又善忘語言舉止多可笑好事者至傳以為口實性不便騎馬或驚雖通逵必下而趨時樞密使張忭請老朝論以抃當次補必不勝任殿中侍御史韓縝因進見極言抃不才雖無顯過保身持祿實懷姦之大者乞置諸散地監察御史裏行傅堯俞亦以為言後數日輔臣朝退韓琦曽公亮獨留抃下殿謂歐陽修曰丞相留身何也修曰得非奏君耶抃曰抃有何事修曰韓御史言君君不知耶抃乃頓足摘耳曰殊不知也遂稱疾求免上許之以樞密副使禮部侍郎趙槩為參知政事翰林學士權知開封府吳奎為右諌議大夫樞密副使丙辰召右正言知蔡州王陶赴諌院供職陶言臣與唐介范師道吕誨趙抃同出為郡今獨召臣與師道非是請還介等職任時師道亦自福州召為鹽鐡副使誨抃及介皆未遷故也丁巳詔審刑院奏補京朝官初該磨勘者自今須有舉主一員方聽改官庚申以龍圗閣直學士兼侍講錢象先為右諌議大夫知蔡州象先善講説語約而義眀上有所顧問必依經以對反覆諷諭遂及當世之務號知經術留侍經筵前後十五年特被恩禮故事講官分日迭進象先已得請補外上曰大夫行有日宜講徹一編於是同列罷進者浹日以天章閣侍講崇文院檢討吕公著為天章閣待制兼侍講公著初召試中書將除知制誥三辭不就故有是命辛酉命參知政事歐陽修提舉三館祕閣寫校書籍壬申徐州言彭城縣白鶴鄉地生麵凡十餘頃民皆取食上遣內侍竇承秀往視之占曰地生麵民將飢也既而濠州亦言鍾離縣地生麵民取食之丁亥作凝機殿於禁中夏四月宰臣韓琦等上所修嘉祐編敕起慶厯四年盡嘉祐三年凡十二卷其元降敕但行約束而不立刑名者又析為續附令敕凡五卷壬申改命起居舍人知制誥兼侍講司馬光為天章閣待制先是光與吕公著並召試中書光已試而公著終辭及除知制誥光乃自言拙於文辭本當辭召初疑朝廷不許故黽勉從命繼聞公著終辭得請臣始悔恨向者之不辭而妄意朝廷之不許也章九上卒改他官己丑夏國主諒祚上表求太宗御製詩草𨽻書石本欲建書閣寶藏之且進馬五十匹求九經唐史册府元龜及本朝正至朝賀儀詔賜九經還其馬諒祚又求尚主詔答以昔嘗賜姓不許五月丁未朔命起居舍人天章閣待制兼侍講司馬光仍知諌院光上疏曰自魏晉以降人主始貴通才而賤守節人臣始尚浮華而薄儒術以先王之禮為槽粕而不行以純固之士為鄙朴而不用於是風俗日壞入於偷薄叛君不以為恥犯上不以為非惟利是從不顧名節至於有唐之衰麾下之士有屠逐元帥者朝廷不能討因而撫之拔於行伍授以旄鉞其始也取偷安一時而已及其久也則衆庶習於聞見以為事理當然不為非禮不為無義是以在上者惴惴焉畏其下在下者暌暌焉伺其上平居則酒肉金帛甘言屈體以相媚悅得間則鋸鋒利創狠心詭計以相屠儈成者為賢敗者為愚不復論尊卑之序是非之理陵夷至於五代天下蕩然莫知禮義為何物矣是以世祚不永逺者十餘年近者四三年敗亡相屬生民塗炭及大宋受命太祖太宗知天下之禍生於無禮也於是以神武聰明躬勤萬幾征伐刑賞斷於聖志然後人主之勢重而羣臣懾服矣於是剪削藩鎮齊以法度擇文吏為之佐以奪其殺生之柄攬其金榖之富選其麾下精鋭之士聚諸京師以備宿衛制其腹心落其爪牙使不得陸梁然後天子諸侯之分明而悖亂之原塞矣於是以節度使之權歸於州鎮員之權歸於縣又分天下為十餘路各置轉運使以察州縣百吏之臧否復漢部刺史之職使朝廷之令必行於轉運使轉運使之令必行於州州之令必行於縣縣之令必行於吏民然後上下之敘正而紀綱立矣於是申明軍法使自押官以上各有階級以相臨統小有違犯罪皆殊死然後行伍之政肅而士皆用命矣此皆禮之大節也故能四征不庭莫不率服汛掃九州以陟禹之迹至於真宗重之以明德繼二聖之志夙夜孜孜宣布善化銷鑠惡俗以至於今治平百年頑民殄絶衆心咸安此乃曠世難成之業陛下當戰戰栗栗守而勿失者也臣竊見陛下有中宗之嚴恭文王之小心而小大之政多謙讓不決委之臣下誠所委之人常得忠賢則可矣萬一有姦邪在焉豈不危甚古人所謂委任而責成效者擇人而授之職業叢脞之務不身親之也至於爵祿廢置生殺豫奪不由己出不可也洪範曰惟辟作威惟辟作福臣之有作威作福害於而家凶于而國威福之柄失於人而習以為常則不可復收矣此明王之所謹也又頃以西鄙用兵權置經略安撫使一路之兵得以便宜從事及西事已平因而不廢其河東一路總二十二州軍嚮時節度使之權不過如是而已洛誥曰毋若火始焰焰厥攸灼敘弗其絶言謹其微也又將相大臣典諸州者多以貴倨自恃轉運使欲振舉職業往往故違戾而不肯從夫將相大臣在朝廷之時則轉運使名位固相逺矣及在外為知州則轉運使統諸州職也烏得以一身之貴庇一州之事而令轉運使不得問哉漢刺史以六百石吏督察二千石豈以名位之貴賤耶又自景祐以來國家怠於久安樂因循而務省事執事之臣頗行姑息之政於是胥吏歡譁而斥逐御史中丞輦官悖慢而廢退宰相衛士凶逆而獄不窮姦澤加於舊軍卒詈三司使而法官以為非犯階級疑於用法朝廷雖特誅其人而已停之卒復收養之其餘有一夫流言於道路而為之變令推恩者多矣凡此數者殆非所以習民於上下之分也夫朝廷者四方之表儀也朝廷之政如是則四方必有甚焉者遂至元帥畏偏禆偏禆畏將校將校畏士卒姦邪怯懦之臣或有簡省教閲使之驕惰保庇羸老使之繁冗屈撓正法使之縱恣詆訾粟帛使之憤惋甘言諂笑靡所不至於是士卒翕然譽之而歸怨於上矣彼既為之則此效之下既言之則上從之前既行之則後襲之長此不已日滋月益民之耳目習而安之此有以異唐之季世乎後魏孝明帝時征西將軍張彛子仲瑀上封事欲抑損武人不預清品羽林虎賁千餘人焚彛第殺彛父子官為收捕凶強者八人斬之其餘大赦以安之懷朔鎮人髙歡時奉使至洛陽見之歸而散家財以結客曰朝政如此事可知矣於是始有飛揚之志由是觀之紀綱不立則姦雄生心夫祖宗苦身焦思以變衰唐之俗而陛下髙拱熟視以成後魏之風此臣之所為陛下痛惜也臣愚以為陛下當奮剛健之志宣神明之德凡羣臣奏事皆察其邪正辨其臧否熟問深思求合於道然後賞罰黜陟斷而行之則天下孰不曠然悅喜詩曰君子如怒亂庶遄沮君子如祉亂庶遄已蓋言無所臧否之為患大也經略安撫使有征討之事則置之無事則當廢之倘未能廢則軍事迫急不暇奏知者使專之可也其餘民事皆委之州縣一斷于法或法重情輕情重法輕可殺可徒可宥可赦並聼本州申奏決之朝廷何必出於經略安撫使哉轉運使規畫號令行下諸州違戾不從者朝廷當辨其曲直若事理實可施行而州將恃貴勢故違之者當罪州將勿罪轉運使將校士卒之於州縣及所統之官或公卿大臣有悖慢無禮者眀著階級之法使斷者不疑將帥之官廢法違道以取悅於下歸怨於上者當隨其輕重誅竄廢黜公正無私御衆嚴整者當量其才能擢用褒賞如是則上之人難動而下用命矣上之人難動而下用命此所以尊朝廷也上下已明綱紀已定然後修儒術隆教化進敦篤退浮華使禮義興行風俗純美則國家萬世無疆之休猶倚南山坐平原也光又上疏論財利以為朝廷特置寬恤民力之官分命使者旁午四出爭言便宜以變更舊制米鹽靡密之事皆張設科條不可勝紀適所以擾民耳未聞其困弊小瘳於前也為今之術惟在隨材用人而久任之養其本原而徐取之減損浮冗而省用之又曰食貨者天下之急務今窮乏如是而宰相不以為憂意者以為非己之職故也臣願復置總計使之臣使宰相領之凡天下之金帛錢榖𨽻於三司及不𨽻三司如內藏奉宸庫之類總計使皆統之小事則官長專達大事則謀於總計使而後行之嵗終則上其出入之數於總計使量入以為出若入寡而出多則總計使察其所以然之理求其費用之可省者以奏而省之必使嵗餘三分之一以為儲蓄備禦不虞凡三司使副使判官轉運使及掌內藏奉宸等庫之官皆委總計使察其能否考其功狀以奏而誅賞之若總計使久試無效則乞陛下罷退其人更置之議者以為宰相論道經邦燮理隂陽不當領錢榖之職是皆愚人不知治體者之言昔舜舉八愷使主后土奏庶艱食貿遷有無地平天成九功惟敘周禮冡宰以九職九賦九式九貢之法治財用唐制以宰相領鹽鐡度支户部國初亦以宰相都提三司水陸發運等使是則錢榖自古及今皆宰相之職也今譯經潤文猶以宰相領之豈有食貨國之大政而謂非宰相之事乎必若府庫空竭閭閻愁困四方之民流轉死亡而曰我能論道經邦燮理隂陽非愚臣之所知也治平元年十二月更定三司判官久任法或因光此疏也己酉龍圖閣直學士吏部員外郎兼侍講知諌院楊畋卒贈右諌議大夫畋素謹畏每奏事必發封數四而後上之自奉甚約及卒家無餘資特賜黃金二百兩其後端午賜講讀官御飛白書扇亦遣使特賜置其柩所己未以知荆南府李參為羣牧使執政初議欲用參為三司使孫抃獨不可曰此人若主計外臺承風刻削則天下益困弊矣乃不果用庚申大宗正司言右衛大將軍嶽州團練使宗實繳還泰州防禦使知宗正事敕告詔不許庚午樞密副使給事包拯卒贈禮部尚書諡孝肅拯性峭直立朝剛毅人以其笑比黃河清知開封府時京師為之語曰關節不到有閻羅包老然奏議平允常惡俗吏苛刻務為敦厚雖甚疾惡而未嘗不推以忠恕與人不茍合不偽為辭色以悅人平居無私書故人親黨有干請一皆絶之居家儉約衣服器用飲食雖貴如布衣時六月丙子朔嵗星晝見癸未以單州團練使劉永年知代州契丹取山木積十餘里輦載相屬於路前守懼生事不敢遏永年曰彼伐木境中而不治他日將不可復制遣人縱火一夕盡焚之上其事帝稱善契丹移文代州捕縱火盜永年報曰盜固有罪然在我境何預汝事遂不敢復言鄜延經略司言得宥州牒夏國改西市監軍司為保秦軍威州監軍司為靜塞軍綏州監軍司為祥祐軍左廂監軍司為神勇軍且言諒祚舉措近嵗多不循舊規恐更僭擬朝廷名號漸不可長乞擇一才臣下詔詰問以杜姦萌從之於是遣供備庫副使張宗道賜諒祚生辰禮物宗道初入境迎者至欲先宗道行焉及就坐又欲居東宗道固爭之迎者曰主人居左禮之常也天使何疑焉宗道曰宗道與夏主比肩以事天子夏主若自來當為賔主爾陪臣也安得為主人當循故事宗道居上位爭久不決迎者曰君有幾首乃敢如是宗道大笑曰宗道有一首耳來日已别家人今欲取宗道首則取之宗道之死得其所矣但夏國必不敢耳迎者曰譯者失辭某自謂無兩首耳宗道曰譯者失辭何不斬譯者乃先宗道迎者曰二國之歡有如魚水宗道曰然大朝水也夏國魚也水可無魚魚不可無水丁亥祕閣上補寫御覽書籍先是歐陽修言祕閣初為太宗藏書之府並以黃綾裝潢號曰太清本後因宣取入內多留禁中而書頗不完請降舊本令補寫之遂詔龍圖天章寶文閣太清樓管勾內臣檢所闕書録上於門下省補寫至是上之賜判祕閣范鎮及管勾補寫官銀絹有差秋七月戊申太白經天壬子詔秋季有事於明堂羣臣毋請加尊號太常禮院言皇祐參用南郊百神之位不應祀法宜如隋唐舊制設昊天上帝五方位以真宗配而五人帝五官神從祀餘皆罷又前一日親饗太廟當時嘗停孟冬之薦考詳典禮宗廟時祭未有因嚴配而輟者今明堂去孟冬畫日尚逺請復薦廟前者祖宗並侑今用典禮獨配前者地祗神州並饗今以配天而亦罷是皆變禮中之大者也開元開寶二禮五帝無親獻儀舊禮先詣昊天奠獻五帝並行分獻以侍臣奠幣皇帝再拜次詣真宗神座於禮為允詔恭依而五方帝亦行親獻甲寅廣西轉運使李師中轉運判官劉牧各罰銅二十斤先是嶺南多曠土茅菅茂盛蓄藏瘴毒師中募民墾田縣置籍期永無稅以種及三十頃為田正免科役於是地稍開闢瘴毒減息而師中與牧坐擅除稅不以聞故蒙罰甲子以知虔州趙抃為禮部員外郎兼侍御史知雜事丁卯右衛大將軍嶽州團練使宗實辭泰州防禦使知宗正寺不許是月右正言王陶上疏曰去嵗親發德音稽唐故事擇宗子使知宗正寺中外聞之咸謂此舉設施安穩不驚人耳目而天下搖搖之心一旦而定厥後寖聞稽緩四方觀聽豈免憂疑流言或罪宗實以為自唐以來判宗正寺者皆用宗子求之典故乃一尋常差遣何必過為辭讓或云事由宫中嬪御宦官姑息之言聖意因而微惑臣聞宗實自有此命以來夙夜恐懼閉門不敢見人昨自二月服除今半年有餘矣臣恐天下之人謂陛下始者順天心人欲而命之今者聽左右姑息之言而疑之不獨百世之後使人歎惜聖政始卒之不一亦恐自今逺近中外姦雄之人得以窺伺間隙矣因請對言宫嬪宦官有以上惑聖聰而使宗實畏避不敢前上問陶欲别與一名目如何陶對曰此止是一差遣名目乞與執政大臣議之上曰當别與一名目於是韓琦等始有立為皇子之議八月乙亥朔內出明堂樂章迎神送神曲𨽻於太常丙子右衛大將軍嶽州團練使宗實辭秦州防禦使知宗正寺許之初宗實屢乞繳還告敕上謂韓琦曰彼既如此盍姑已乎琦曰此事安可中輟願陛下賜以手札使知出自聖意必不敢辭比遣使召之稱疾不入琦與歐陽修等私議曰宗正之命既出外人皆知必為皇子矣不若遂正其名修曰知宗正寺告敕付閣門得以不受今立為皇子止用一詔書事定矣遂入對乞聽宗實辭所除官上曰勿更為他名便可立為皇子明堂前速與了當琦因請諭樞密院及張忭至帝面諭之忭曰陛下不疑否帝曰朕欲民心先有所繫屬但姓趙者斯可矣忭即再拜稱賀琦等乞帝書手札付外施行既退輔臣未分廳中使已傳手札至中書丁丑琦召翰林學士王圭令草詔圭曰此大事也非面受旨不可明日請對曰海內望此舉久矣果出自聖意乎帝曰朕意決矣圭再拜賀始退而草詔歐陽修嘆曰真學士也己卯詔曰人道親親王者之所先務也蓋二帝之隆治由兹出朕甚慕之右衛大將軍嶽州團練使宗實皇兄濮安懿王之子猶朕之子也少鞠於宫中聰知仁賢見於夙成日者選宗子近籍命以治宗正之事使者數至其第乃崇執謙退久不受命朕默喜焉朕蒙先帝遺德奉承聖業罔敢失墜夫立愛之道自親者始固可以厚天下之風而上以嚴宗廟也其以為皇子辛巳上悉召宗室入宫諭以立皇子之意壬午詔入內內侍省皇城司即內香藥庫之西偏營建皇子位癸未賜皇子名曙初中書擇日旁十字上點最下一字用之邈川首領嘉勒斯賚既老國事皆委其子棟戬知秦州張方平嘗誘棟戬入貢許奏為防禦使棟戬尋遣使入貢知雜御史吳中復劾奏方平擅以官爵許外裔啓其貪心方平議遂不行先是契丹以女妻棟戬與之共圗夏國夏主諒祚與戰屢為所敗及是諒祚舉兵擊棟戬屯於古渭州其熟户酋長皆懼亟詣方平求救方平懼飾樓櫓為守城之備盡籍諸縣馬悉發下番兵皇祐末古渭州熟户反增秦州戌兵甚多事平文彥博悉分屯永興涇原環慶三路期有警則召之以省芻糧謂之下番兵方平至是乃發之關西震聳仍驛奏乞發京畿禁軍十指揮赴本路樞密使張忭言於上曰臣昔在秦州邉人言敵欲入寇者甚衆後皆無事實今事未可知而發京畿兵以赴之驚動逺近非計也請少須之上從其言數日方平復奏諒祚已引兵西去擊棟戬矣諒祚尋復為棟戬所敗築堡於古渭州之側而還諌官司馬光因劾奏方平怯懦輕舉請加竄謫宰相曾公亮獨右方平乃言曰兵不出塞何名為輕舉且冦所以不入者以有備故也有備而賊不至顧以輕舉罪之邉臣自是不敢為先事之備矣光奏三上甲申徙方平知應天府乙酉詔太常寺登歌用柷敔用翰林學士王圭言也辛卯以司封郎中李受為皇子位伴讀改宗正寺伴讀王獵為皇子位説書大宗正司言皇子纍奏辭所除恩命己卯還其奏壬辰詔權以皇城司𪠘宇為皇子位乃命入內髙班王中慶梁德政發車乘津置行李入內上既下己卯詔書皇子猶堅卧稱疾不入司馬光王陶等言凡人見絲毫之利至相爭奪今皇子辭不資之富已三百餘日不受命其賢於人逺矣有識聞之足以知陛下之聖能為天下得人然臣聞父召無諾君命召不俟駕而行使者受命不受辭皇子不當避遜使者不當徒反凡詔皇子內臣皆乞責降且以臣子大義責皇子宜必入上與輔臣謀之韓琦曰今既為陛下子何所間哉願令本宫族屬敦勸及選親信內人就諭旨彼必不敢違也丁酉賜皇子襲衣金帶銀絹各一千詔登州防禦使同判大宗正事從古沂州防禦使虢國公宗諤敦勸皇子獨與潤王宫大將軍以上同入內皇子若稱疾即乘肩輿己亥從古等言皇子猶固稱疾是夕使者往返數四留禁門至四鼓皇子終不至乃詔改擇異日庚子以立皇子告天地宗廟及諸陵辛丑皇子以肩輿入內先是宗諤責皇子曰汝為人臣子豈得堅拒君父之命而終不受耶我非不能與衆人執汝強置汝於肩輿恐使汝遂失臣子之義陷於惡名耳皇子初讓宗正與記室周孟陽謀之所上表皆孟陽筆也每一表餉孟陽十金孟陽辭皇子曰此不足為謝俟得請於朝方當厚賞耳凡七八表孟陽獲千餘緡及立為皇子猶固稱疾孟陽入見於卧內曰主上察知太尉之賢參以天人之助乃發德音太尉獨稱疾堅卧其義安在皇子曰非敢徼福以避禍也孟陽曰今已有此迹設固辭不拜使中人别有所奉遂得燕安無患乎皇子撫榻而起曰吾慮不及此遂與宗諤等同入內良賤不滿三十口行李蕭然無異寒士有書數橱而已中外聞之相賀中外相賀此據歐陽修私記及范祖禹帝學甲辰皇子見上於清居殿自是日再朝於內東門或入侍禁中九月乙巳朔以皇子為齊州防禦使進封巨鹿郡公丁未以貴人董氏為充媛己酉朝饗景靈宫庚戍饗太廟辛亥大饗明堂大赦令天下系帳存留寺觀及四京管內雖不係帳而舍屋百間以上者皆特賜名額諌官司馬光言竊以釋老之教無益治世而聚匿遊惰耗蠧良民是以國家明著法令有創造寺觀百間以上者聽人陳告科違制之罪仍即時毁撤蓋以流俗戅愚崇尚釋老積弊已深不可猝除故為之禁限不使繁滋而已今若有公違法令擅造寺觀及百間以上則其罪已大幸遇赦恩免其罪犯可矣其棟宇瓦木猶當毁撤沒入縣官今既不毁又明行恩命賜之寵名是勸之也臣聞為人上者洗濯其心一以待民是以令行禁止而莫敢不從今立法以禁之於前而發赦以勸之於後則凡國家之令將使民何信而從乎臣恐自今以往姦猾之人將不顧法令依憑釋老之教以欺誘愚民聚斂其財廣營寺觀務及百間以冀後赦之恩不可復禁矣伏望追改前命更不施行初帝享明堂方宿齋而充媛董氏疾革使白皇后曰妾不幸即死願勿亟聞以慁上精意后泫然從之壬子帝臨奠悽惻追贈婉儀癸丑加贈淑妃特遷其父右侍禁資為內殿崇班官其弟姪四人葬奉先資福院後又命有司為之定諡及行䇿禮於葬日仍給鹵簿光言古者婦人無諡近世惟皇后有諡及有追加䇿命者鹵簿本以賞軍功未嘗施於婦人伏望陛下特詔有司悉罷議諡及䇿禮事其葬日更不給鹵簿凡喪事所需悉從減損上嘉納之己未內外官並以明堂赦書加恩宰相韓琦封儀國公戊辰改夀星觀為崇先觀冬十月乙亥皇子上表辭所除官賜詔不允壬午封贈媫妤周氏三代舊制惟皇后得贈三代自妃以下皆不過二代知制誥張瓌請追改新命不報丙戌白虹貫日甲午命知制誥王安石同勾當三班院先是安石紏察在京刑獄有少年得鬭鶉其儕求之不與恃與之昵輒持去少年追殺之開封府按其人罪當死安石駁之曰按律公取竊取皆為盜此不與而彼強擕以去是盜也追而驅之是捕盜也雖死當勿論遂劾府司失入府官不伏事下審刑大理皆以府斷為是詔放安石罪舊制放罪者皆詣閣門謝安石言我無罪不肯謝御史臺舉奏之釋不問以祕閣校理蔡抗為廣東轉運使先是岑水銅冶大發官市諸民止給空文積逋巨萬姦民無所取資羣聚私鑄與江西鹽盜合郡縣患之督捕甚嚴抗曰採銅皆惰遊之民銅悉入官而不畀其直非私鑄衣食安所給又從而誅之是罔民也因命銅入即給其直民皆樂輸私鑄遂絶番禺嵗運鹽給英韶二州道逺多侵竊雜惡抗命十舟為一運擇攝官主之嵗終會其殿最是嵗鹽課增十五萬緡乙未太白晝見丙申詔天下常平倉多所移用而不足以支凶年其令內藏庫與三司共支緡錢一百萬下諸路助糴之從右正言判司農寺王陶所請也十二月乙巳進封沂國公主為岐國公主建州觀察使知衛州李瑋改安州觀察使復為駙馬都尉戊子皇子徙入位十二月皇城司邏卒吳清等密奏富人張文政嘗殺人有司鞫問無狀願得清詰所從而主者不遣御史傅堯俞言陛下惜清恐自是不復聞外事矣不若付之有司辨其是非而賞罰之則事之上聞者皆實乃所以廣視聽也諫官司馬光等亦極言其害詔清等決杖配下軍丙申幸龍圖天章閣召輔臣近侍三司副使臺諌官皇子宗室駙馬都尉主兵官觀祖宗御書又幸寶文閣為飛白書分賜從臣下逮館閣作觀書詩韓琦等為和遂宴羣玉殿傳詔學士王圭撰詩序刋石於閣庚子再召羣臣於天章閣觀瑞物復宴羣玉殿帝曰天下久無事今日之樂與卿等共之宜盡醉勿辭賜禁中花金盤香藥又召韓琦至御榻前别賜酒一巵從臣霑醉至暮而罷吕氏家孰記云皇子坐在舍人待制之後是嵗冬無氷天下斷大辟一千六百八十三人資治通鑑後編卷七十
