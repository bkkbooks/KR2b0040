body:
  text: 資治通鑑後編卷一百五十一刑部尚書徐乾學撰宋紀一百五十一孝恭懿聖皇帝起柔兆困敦正月盡十二月凡一年德祐二年春正月丁卯朔元兵蟻附登潭州城知衡州長沙尹榖寓城中時方為二子行冠禮或曰此何時行此迂闊事榖曰正欲令兒曹冠帶見先人於地下耳既畢禮乃積薪扃户朝服望闕拜已即縱火自焚鄰家救之火熾不可前但遙見烈焰中榖正冠危坐闔門少長皆死李芾命酒酹之字榖曰尹榖實男子也先我就義矣因留賔佐會飲夜傳令猶手書盡忠字為號飲逹旦諸賔佐出參議楊霆赴園池死芾坐熊湘閣召帳下沈忠遺之金曰吾力竭分當死吾家人亦不可辱於俘汝盡殺之後殺我忠伏地叩頭辭以不能芾固命之忠泣而諾取酒飲其家人盡醉乃遍刃之芾亦引頸受刃忠縱火焚其居還家殺其妻子復至火所大慟舉身投地自刎幕僚陳億孫顔應焱鍾蜚英皆死潭民聞之多舉家自盡城無虛井縊林木者相望守將吳繼明劉孝忠以城降元兵利於鹵掠欲屠之行省郎中華善宣言曰拒我師者宋將耳其民何罪既受其降即是吾民殺之何忍且今列城多未附降而殺之是堅其效死之心也阿爾哈雅從之由是袁連衡永郴全道桂陽武岡皆降寶慶通判曽如驥亦不屈死芾為人剛介不畏強禦臨事精敏姦猾不能欺且強力過人自旦治事至暮無倦容夜率至三鼓始休五鼓復起視事望之凛然若神明而好賢禮士亦復藹然可親雖一藝小善必奬薦之居官亷家無餘資榖性剛直莊厲士友皆嚴憚之居官亷正有聲丁內艱家居教授諸生舉動有禮每行市中市人相謂曰是必尹先生門人也至是死節諸生往哭之者數百人霆自少以志節聞辟京湖制置司幹官時吕文德為帥素侮慢士常試以難事霆倉卒立辦皆合其意一日謂霆曰朝廷有密旨出師䇿應淮東誰可往者即對曰某將可又曰兵器糧草若何即對曰某營兵馬某庫器甲某處石矢芻糧口占授吏頃刻案成文德大驚曰平生輕文人以其不事事也君材幹若此何官不可為吾何敢不敬後通判江陵江陵雄據上流表裏襄漢兵民雜處庶務叢集霆隨事裁決處之泰然霆有心計善出竒應變故所至有能聲元吕師夔與萬户武秀分定江東地謝枋得以兵逆之使前鋒呼曰謝提刑來師夔軍馳至射之矢及馬前枋得走入安仁調淮士張孝忠逆戰團湖坪矢盡孝忠揮雙刃擊殺百餘人前軍稍却後軍繞出孝忠後衆驚潰孝忠中流矢死馬奔歸枋得坐敵樓見之曰馬歸孝忠敗矣遂奔信州師夔陷安仁及信州枋得變姓名入建寧唐石山轉茶坂寓逆旅中日夜麻衣躡草履東鄉而哭人不識之以為病也已而去賣卜建陽市中有來卜者惟取米屨委以錢率謝不取其後人稍稍識之多延至家使為子弟論學參知政事陳文龍同僉書樞密院事黃鏞遁辛未以吳堅為左丞相兼樞密使端明殿學士常楙參知政事日午宣麻慈元殿文班止六人諸關兵皆潰知嘉興府劉漢傑以城降元元兵圍安吉州知州趙良淳與提刑徐道隆同守范文虎致書誘良淳降良淳焚書斬使及元兵迫臨安道隆召入衛良淳率衆獨守夜苃舍陴上既而戍將吳國定開門納元兵良淳命車歸府兵士止之曰侍郎何自苦良淳叱去之閉閣自經道隆未至臨安元兵追及之一軍盡沒道隆見執守者稍怠赴水死長子載孫亦赴水死良淳汝愚之曽孫道隆婺州武義人也癸酉熒惑犯歲星陸秀夫自元軍還言巴延不肯從伯姪之稱太皇太后命用臣禮陳宜中難之太皇太后涕泣曰茍存社稷稱臣非所較也乙亥遣監察御史劉岊如巴延軍奉表稱臣上尊號歲貢銀絹二十五萬兩匹乞存境土以奉蒸嘗且約巴延會長安鎮以輸平己卯參知政事常楙遁以夏士林僉書樞密院事士林亦遁獨三學生誓死不去癸未進封吉王是為益王判福州信王昺為廣王判泉州先是召文天祥知臨安府天祥辭不拜請以福王秀王判臨安以係民望身為少尹以死衛宗廟又乞命吉王信王鎮閩廣以圖興復俱不許至是宗親復請太皇太后從之以駙馬都尉楊鎮及楊淑妃弟亮節俞充容弟如圭提舉二王府事召留夢炎不至以為江東西湖南北宣撫大使陳宜中以元不許和計無所出乃率羣臣入宫請遷都太皇太后不許宜中慟哭以請太皇太后命具裝及暮宜中不入太皇太后怒曰吾初不欲遷而大臣數以為請顧欺我耶脫簮珥投之地遂閉閣羣臣請見皆不納蓋宜中實以翌日行倉卒失於陳奏耳元巴延至長安鎮陳宜中違約不往議事甲申巴延進次臯亭山阿嘍罕董文炳之師皆會遊騎至臨安北關文天祥張世傑請移三宫入海而已帥衆背城一戰宜中不許白太皇太后遣監察御史楊應奎上傳國璽降表曰宋國主顯謹百拜奉表言顯眇然幼沖遭家多難權姦賈似道背盟誤國至勤興師問罪顯非不欲遷避以求茍全今天命有歸顯將焉往謹奉太皇太后命削去帝號以兩浙福建江東西湖南二廣四川兩淮見存州郡悉上聖朝為宗社生靈祈哀請命伏望聖慈埀念不忍顯三百餘年宗社遽至隕絶曲賜存全則趙氏子孫世世有賴不敢弭忘巴延受之遣使召陳宜中出議降事而使囊嘉特奉璽表赴上都是夜宜中遁歸溫州之清澳張世傑劉師勇及蘇留義以朝廷不戰而降各以所部去世傑次於定海元石國英使都統卞彪説世傑降世傑以彪來從已俱南也椎牛享之酒半彪從容為言世傑大怒斷彪舌磔之於巾子山師勇至海上見時不可為憂憤縱酒卒楊應奎自北軍還言巴延欲執政面議乙酉太皇太后以文天祥為右丞相兼樞密使都督諸路軍馬丙戌以家鉉翁僉書樞密院事賈餘慶同僉書樞密院事知臨安府元巴延下令禁軍士入城違者以軍法從事復遣吕文煥賫榜諭臨安中外軍民安堵如故時三司衛兵白晝殺人閭里小民乘時剽殺令下民大悅戊子命文天祥同吳堅謝堂賈餘慶使元軍先是天台杜滸糾合四千人來勤王當國者不省往見天祥于西湖上天祥奬異之至是聞天祥北使倡言於朝以為斷斷不可當事遂去之滸隨天祥北行天祥見巴延於明因寺據胡牀中坐辭色慷慨因説巴延曰本朝承帝王正統衣冠禮樂之所在北朝將以為與國乎抑將毁其社稷也巴延以北詔為辭言社稷必不動百姓必不殺天祥曰爾國前後與我國約多失信今兩國丞相親定盟好北朝若欲以為與國請退兵平江或嘉興然後議歲幣與金帛犒師北朝全兵以還策之上若欲毁其宗社則淮浙閩廣尚多未下利鈍未可知兵連禍結必自此始巴延語漸不遜天祥曰我南朝狀元宰相但欠一死報國刀鋸鼎鑊非所懼也巴延辭屈諸將相顧動色巴延見天祥舉動不常疑有異志留之軍中遣堅等還天祥怒數請歸曰我此來為兩國大事何故留我巴延曰勿怒君為宋大臣責任非輕今日之事正當與我共之令萬户蒙古岱宣撫索多羈縻之且以其降表不稱臣仍書宋號遣程鵬飛洪君祥偕賈餘慶來易之駙馬都尉楊鎮等奉益王廣王走婺州楊淑妃秀王與擇從行辛卯元張洪範孟祺程鵬飛齎所易宋稱臣降表至軍前二月丁酉朔日中有黑子相蕩帝率文武百僚詣祥曦殿望元闕上表乞為藩輔元巴延承制以臨安為兩浙大都督府命蒙古岱范文虎入城治都督事又令程鵬飛取太皇太后手詔及三省樞密院吳堅賈餘慶等檄諭天下州郡降附執政皆署家鉉翁獨不署鵬飛命縛之鉉翁曰中書省無縛執政之理歸私第以待命可也乃止元巴延進屯湖州市復令李文煥及范文虎慰諭太皇太后文煥因使人上表謝而出有曰兹銜北命來抗南師視以犬馬報以仇讐非曰子弟攻其父母不得已也尚何言哉巴延令張惠阿嘍罕董文炳張𢎞範索多等封府庫收史館祕省圖書及百司符印告勑罷官府及侍衛軍壬寅罷遣文天祥所部勤王兵以賈餘慶為右丞相兼樞密使劉岊同僉書樞密院事與吳堅謝堂家鉉翁並充祈請使詣元大都餘慶凶狡殘忍岊狎邪小人皆乘時竊美官謂使畢即歸不以為意謝堂獨納賂北軍得先歸元巴延引文天祥與吳堅等同坐天祥面斥賈餘慶賣國且責巴延失信吕文煥從旁諭解之天祥并斥文煥及其姪師孟父子兄弟受國厚恩不能以死報國乃合族為逆尚何言文煥等慙恚遂與餘慶共勸巴延拘天祥令隨祈請使北行是日元兵屯錢塘江沙上臨安人方幸波濤大作一洗而空之潮三日不至丁未元詔諭臨安新附府州司縣官吏軍民人等曰間者行中書省右丞相巴延違使來奏宋母后幼主暨諸大臣百官已於正月十八日齎璽綬奉表降附朕惟自古降王必有朝覲之禮已遣使特往迎致爾等各守職業其勿妄生疑畏凡歸附前犯罪悉從原免公私逋欠不得徵理一應抗拒王師及逃亡嘯聚者並赦其罪百官有司諸王邸第三學寺監祕省史館及禁衛諸司各宜安居所在山林河泊除巨木花果外餘物權免徴稅祕書省圖書太常寺祭器樂器法服樂工鹵簿儀衛宗正譜牒天文地理圖册凡典故文字并户口版籍盡仰收拾前代聖賢之後髙尚儒醫僧道通曉天文厯數并山林隱逸名士即所在官司具以名聞名山大川寺觀廟宇并前代名人遺迹不許拆毁鰥寡孤獨不能自存之人量加贍給於是巴延就遣宋內侍王野入宫收宋衮冕圭壁符璽及宫中圖籍寶玩車輅輦乘鹵簿麾仗等物益王廣王自嘉會門出渡浙江而南巴延聞之遣范文虎將兵追之楊鎮得報即還曰我將就死於彼以緩追兵楊亮節等遂負二王及楊淑妃徒步匿山中七日統制張全以兵數十人追及遂同走溫州是月夏貴以淮西叛降元初阿珠屯淮南東道其西道屬之萬户昻吉爾俾駐和州進攻廬州貴以書扺巴延曰毋費國力攻奪邊城若行都歸附邊城焉往至是舉所部納欵元以貴為淮西安撫使洪福貴家僮也從貴積勞知鎮巢軍貴既北降招福不聽使其從子往福斬之元兵攻城久不拔貴至城下好語紿福請單騎入城福信之門發伏兵起執福父子屠其城貴蒞殺福一門福子大源大淵呼曰法止誅首謀何乃舉家為戮福叱曰以一命報宋朝何至告人求活耶次及福福大罵數貴不忠請身南向死以明不背國聞者流涕元人索宫女內侍及諸藥官宫女赴水死者以百數三月丁丑元巴延入臨安城建大將旗鼓率左右翼萬户巡城觀潮於浙江又登獅子峰觀臨安形勢部分諸將以獨松關守將張濡嘗殺亷希賢斬之籍其家時福王與芮自紹興至巴延深慰之太皇太后及帝欲與相見巴延固辭曰未入朝無相見之禮明日發臨安安塔哈孟祺等入宫宣詔趣帝及全太后入覲祺讀至免繫頸牽羊之語太后泣謂帝曰荷天子聖慈活女宜拜謝禮畢帝與太后肩輿出宫太皇太后以疾留內與芮及沂王乃猷度宗母隆國夫人黃氏并楊鎮謝堂髙應松庶僚劉裦然等及三學諸生皆行太學生徐應鑣與其二子琦嵩女元娘同赴井死應鑣衢州江山人元巴延北還承制留阿嘍罕董文炳經略閩浙以蒙固岱鎮江西索多鎮浙東會江西都元帥宋都木達言宋二王在閩廣聚兵將攻江西乃遣達實移軍與李恆吕師夔會阿嘍罕文炳同取未下州縣以追二王閠月陸秀夫蘇劉義等聞二王走溫州繼追及於道遣人召陳宜中於清澳宜中來謁復召張世傑於定海世傑亦以所部兵來溫之江心寺舊有髙宗南奔時御座衆相率哭座下奉益王是為天下兵馬都元帥廣王昺副之發兵除吏以秀王與檡為福建察訪使先入閩中撫吏民諭同姓檄召諸路忠義同奬王室會太皇太后遣二宦者以兵百人召二王還臨安宜中等沉其兵於江中遂入閩時黃萬石降元以嘗為福建漕使欲取全閩為己功汀建諸州方謀從萬石送欵聞二王至復閉門以拒萬石南劍守臣林起鼇遣軍逐之萬石敗走其將士多來歸兵勢稍振宜中等遂傳檄嶺海言夏貴已復瀕江州郡元諸戍將以江路既絶不可北歸皆欲託計事還靜江獨廣西宣慰使史格曰君等勿為虛聲所懼待貴踰嶺審不可北歸取途雲南未為不可豈敢輒棄戍哉元行省又欲棄廣之肇慶德慶封州并戍梧州亦為格所沮格天澤子也全太后與帝隨元兵北行至瓜州李庭芝與薑才涕泣誓將士出兵奪兩宫將士皆感泣乃盡散金帛犒兵以四萬人夜搗瓜洲戰三時衆擁帝避去才追戰至浦子市夜猶不退呼遜使人招之才曰吾寧死豈作降將軍耶真州苗再成亦謀奪駕不克夏四月元郝經歸見元主賜宴大庭咨以政事其從行者賞賚有差先是文天祥至鎮江與其客杜滸等十二人夜亡入真州安撫使苗再成出迎喜且泣曰兩淮兵足以興復特二閫少隙不能合從耳時猶未知夏貴納欵故再成以二閫為言天祥問計將安出再成曰今先約淮西兵趣建康彼必悉力以扞吾西兵指揮淮東諸將以通泰兵攻灣頭以髙郵寶應淮安兵攻楊子橋以揚兵攻瓜步吾以舟師直搗鎮江同日大舉灣頭楊子橋皆沿江脆兵且日夜望我師之至攻之即下合攻瓜步之三面吾自江中一面薄之雖有智者亦不能為之謀矣瓜步既舉以淮東兵入京口淮西兵入金陵要其歸路其大帥可坐致也天祥大稱善即以書遺李庭芝遣使四出結約初天祥未至真時揚有逸卒言元密遣一丞相入真州説降矣庭芝信之以天祥為元説降也使再成亟殺之再成不忍紿天祥出相城壘以制司文字示之閉之門外久之復遣二路分覘天祥果説降者即殺之二路分與天祥語見其忠義亦不忍殺導之如揚四鼓扺城下聞候門者談制置司下令捕文丞相甚急衆相顧吐舌天祥乃變姓名為清江劉洙東入海道遇元兵伏環堵中得免飢莫能起從樵者乞得餘糝羮行入板橋元兵又至衆走伏叢篠中元兵入索之虞候張慶矢中目身被二創執杜滸金應以去滸應解所懷金與卒得逸募二樵者以蕢荷天祥至髙郵嵇家莊嵇聳迎天祥至家遣子德潤衛送至泰州遂由通州泛海以求二王是月始得扺溫州端宗裕文昭武愍孝皇帝景炎元年五月乙未朔天下兵馬都元帥益王是即皇帝位於福州改元曰景炎遙上天瑞皇帝尊號為孝恭懿聖皇帝又上太皇太后尊號册楊淑妃為皇太妃進封廣王昺為衛王升福州為福安府以大都督府為埀拱殿便廳為延和殿王剛中知福安府是日有大聲出府中衆皆驚仆福州城南壁忽崩七里初吳堅等使元不得命留館中髙應松絶粒不語七日而卒賈餘慶病死家鉉翁聞國亡旦夕哭泣不食飲者數日元主髙其節欲尊官之鉉翁辭不受孝恭懿聖皇帝及全太后至燕堅鉉翁迎謁伏地流涕稱謝奉使無狀不能保存宗社帝太后遂赴上都丙申見元主於大安殿降封為瀛國公凡家資在杭越者有司輦至京師付之有隨駕內嬪某氏或欲犯之不從自經死有留題於裙帶曰誓不辱國誓不辱身考異元史世祖紀五月乙未朔巴延以宋主顯至上都制授顯開府儀同三司檢校大司徒封瀛國公宋史瀛國公紀作丙申今從之以陳宜中為左丞相兼樞密使都督諸路軍馬陳文龍劉黼參知政事張世傑為樞密副使陸秀夫直學士院蘇劉義主管殿前司召李庭芝為右丞相薑才為保康軍承宣使召故相葉夢鼎為少師充太一宫使夢鼎聞命即航海赴之道梗不能進南向慟哭而還詔以趙溍為江西制置使進兵邵武謝枋得為江東制置使進兵饒州李世逵方興等進兵浙東吳浚為江西招諭使鄒鳯副之毛統由海道至淮約兵會合仍詔傳卓翟國秀等分道出兵時枋得敗走已不能軍文天祥至福安拜右丞相兼樞密使都督諸路軍馬天祥以國事皆決於陳宜中議論多不合固辭不拜乃以為樞密使同都督天祥使吕武招豪傑於江淮杜滸募兵於溫州元主召宋降將問曰汝等何降之易耶對曰賈似道專國每優禮文士而輕武臣臣等久積不平故望風送欵元主遣董文忠語之曰似道實輕汝曹特似道一人之過汝主何負焉正如汝言則似道輕汝也固宜元巴延入朝元主命百官郊迎以勞之既至拜同知樞密事以陵州藤州户六千為食邑罷直學士院陸秀夫陳宜中以秀夫久在兵間知軍務每事咨訪始行秀夫亦悉心贊之旋與宜中議不合宜中使言者劾罷之謫居潮州時衢婺諸州皆復起兵元董文炳謂索多曰嚴州不守臨安必危公往鎮之未十日諸州連兵來攻索多拒戰三閲月復陷婺州衢守備甚嚴索多率總管髙興等鼓譟先登拔其城權知府事蕭雷龍脫走與同里人黃巡檢起兵時元兵四合雷龍度不可支與黃巡檢及麾下數人奔入閩未出境為同安武人徐浚沖獲送縣縣尹劉聖仲素與雷龍有怨殺之後聖仲北來泊舟小孤山有巨艦衝前建大旗書曰蕭知府兵繼見雷龍坐船上聖仲大呼有頃不見病驚悸而死故相留夢炎降元廣東經略使徐直諒遣其將梁雄飛請降於隆興阿爾哈雅假雄飛招討使使徇廣東既而直諒聞帝即位乃命權通判李性道摧鋒軍將黃俊等拒雄飛於石門性道不戰俊戰敗直諒棄城遁六月丁卯雄飛入廣州諸降將皆授以官俊獨不受被殺吳浚聚兵於廣昌遂復南豐宜黃寧都三縣翟國秀取鉛山傅卓至衢信諸縣民多應之者會浚兵遇元兵敗走國秀引還卓兵亦敗詣元軍降壬申元罷兩浙大都督府立行尚書省于鄂州臨安設諸路宣慰司以行省官為之並𢃄相銜其立行省者不立宣慰司甲戌元以大明厯浸差命太子贊善王恂與江南日官置局更造新厯以樞密副使張易董其事易恂奏今之厯家徒知厯術罕明厯理宜得耆儒如許衡者商訂從之詔衡赴大都戊寅元詔作平金平宋録及諸國臣服傳記命耶律鑄監修國史秋七月丁酉文天祥開府南劍州經略江西天祥欲還溫州進取陳宜中不從蓋宜中棄溫入閩欲倚張世傑復浙東西以自洗濯故命天祥開府南劍初臨安既陷阿珠以太皇太后手詔諭李庭芝使降庭芝登城謂使者曰奉詔守城未聞以詔諭降也及帝次瓜洲太皇太后復賜庭芝詔曰比詔卿納欵日久未報豈未悉吾意尚欲固圉耶今吾與嗣君既已臣服卿尚為誰守之庭芝不答命發弩射使者斃一人餘皆奔去阿珠乃遣兵守髙郵寶應以絶其餉道博囉歡又攻拔泰州之新城驅夏貴淮西降卒至城下以示庭芝庭芝幕客或勸為計庭芝曰吾惟一死而已阿珠復遣使者持元主詔招庭芝庭芝開壁納使者斬之焚其詔於陴上既而淮安盱眙泗州以糧盡降元庭芝猶括民間粟以給兵粟盡又令官人出粟粟又盡令將校出粟雜牛皮麴蘖以給之兵有自食其子者然猶力戰不屈薑才聞髙郵米運將至出步騎五千戰於丁村自夜逹旦元兵多敗阿珠使巴延徹爾救之所將皆阿珠麾下才軍識其旗幟皆潰才脫身走時髙郵水路已絶阿珠復遣將於陸路邀擊米運殺負米卒數千由是餉益不繼阿珠請元主降詔赦庭芝焚詔殺使之罪令早歸欵庭芝不納會福安使至庭芝欲赴召命制置副使朱煥守揚而自與薑才將兵七千趣泰州將東入海庭芝既行煥即以城降阿珠分道追及庭芝殺步卒千餘人庭芝走入泰州阿珠圍之且驅其妻子至陴下招降會薑才疽發背不能戰泰州禆將孫貴胡惟孝尹端甫李遇春開北門納元軍庭芝投蓮池中水淺不死遂與才俱被執至揚州阿珠責其不降才曰不降者我也憤罵不已然阿珠猶愛其材勇未忍殺之朱煥請曰揚自用兵以來積骸滿野皆庭芝與才所為不殺之何俟阿珠乃皆殺之揚民聞者莫不泣下有宋應龍者以儒生通兵出入行陳三十餘年至是為泰州咨議官州守孫良臣之弟舜臣自軍中來説降良臣召應龍與計應龍極陳國家恩澤君臣大義請殺舜臣以戒持二心者良臣不得已殺之及泰州降應龍夫婦自經死提刑司咨議廬人禇一正置司髙郵督戰亦被創投水死淮東之地盡陷甲寅元以楊村至浮雞泊漕渠回逺改從孫家務是月元翰林侍讀學士郝經卒經為人尚氣節為學務有用拘宋十六年從者皆通於學書佐茍宗道後為國子祭酒經還之嵗汴中民射雁金明池得繫帛書詩云霜落風髙恣所如歸期回首是春初上林天子援弓繳窮海纍臣有帛書後題云至元五年九月一日放雁獲者勿殺國信大使郝經書於真州忠勇軍營新館其忠誠如此及卒官為護喪還葬諡文忠八月己巳元穿武清蒙村漕渠揚州既陷元兵攻真州益急趙孟錦乘霧襲其營少頃霧開元兵見孟錦兵少逐之孟錦登舟失足墮水死城遂陷安撫苗再成死之元主召阿珠入朝賜泰興户二千為食邑楊亮節居中秉權秀王與檡自以國家親賢多所諌正遂犯忌嫉諸將俱憚之至是詔出兵浙東朝臣言與檡有劉更生之忠曹王臯之孝宜留輔以隆國本譛者益急卒遣之與檡圍婺州元董文炳拒之乃還以王積翁為福建招捕使黃恮副之積翁兼知南劍州備禦上三州恮兼知漳州備禦下三州張世傑遣都統張世虎與吳浚合兵十萬期必復建昌與元李恆戰兵敗浚奔寧都元主歸自上都以鄂囉齊參知政事太皇太后謝氏以病久留臨安至是元人自宫中舁其牀以出同侍衛七十二人北赴大都降封壽春郡夫人九月壬辰朔元命國師僧琳沁預作佛事于太廟丙午元勑常德府歲貢包茅元軍分道略閩廣阿嘍罕董文炳及蒙固岱索多以舟師出明州達實及吕師夔李恆等以騎兵出江西東莞民熊飛為元人守潮惠聞趙溍至即以兵應之攻梁雄飛于廣州雄飛遁飛遂復韶州新會令曽逄龍亦率兵至廣州李性道出迎謁飛與逢龍執性道殺之溍遂入廣州知雍州宕昌馬塈將入衛而臨安已陷因留靜江總屯戍諸軍會元使阿爾哈雅取廣西塈發所部及諸洞兵守靜江而自將三千人守嚴關元軍攻關不克乃以偏師入平樂過臨桂夾攻塈塈退保靜江阿爾哈雅使人招降塈發弩射之攻三月塈不解甲前後百餘戰城中死傷相藉訖無降意冬十月文天祥帥師次于汀州天祥遣趙時賞等將一軍趣贛以取寧都吳浚將一軍取雩都劉洙等皆自江西起兵來會元吕師夔等將兵度梅嶺趙溍使雄飛及曽逄龍禦之于南雄逄龍敗死飛走韶州元兵圍之守將劉自立以城降飛率兵巷戰兵敗赴水死十一月元阿嘍罕董文炳犯處州知州李玨以城降秀王與檡偕弟與慮子孟備及觀察使李世逹監軍趙由􅀈察訪使林溫知瑞安府方洪被執皆不屈死元兵陷建寧府邵武軍陳宜中張世傑備海舟奉帝及衛王楊太妃等登舟時軍十七萬民兵三十萬淮兵萬人與北舟相遇值天霧晦冥舟得進王積翁棄南劍走福安遣人納欵於元至是元軍集城下積翁為內應遂與知府王剛中同降帝行至泉州舟泊于港招撫使蒲壽庚來謁請駐蹕張世傑不可初壽庚提舉市舶擅舶利者三十年或勸世傑留壽庚不遣凡海舶不令自隨世傑不從縱之歸繼而舟不足乃掠其舟並沒其資壽庚怒殺諸宗室及士大夫與淮兵之在泉者宜中等乃奉帝趣潮州壽庚遂與知泉州田子真以城叛降元十二月辛卯朔熒惑掩鉤鈐江西制置使趙溍棄廣州遁副使方興亦遁降將王世強導元兵陷福安王剛中既降元遣使徇興化軍知軍事陳文龍斬之而縱其副使持書責世強剛中負國遂發民兵固守阿嘍罕復遣使招之文龍復斬之有風其納欵者文龍曰諸君特畏死耳未知此生能不死乎乃使其部將林華伺元兵于境上華反導元兵至城下通判曹澄孫開門降元兵執文龍欲降之文龍不屈左右陵挫之文龍指其腹曰此皆節義文章也可相逼耶卒不屈乃械送臨安文龍不食死其母繫福安尼寺病甚左右視之泣下母曰吾與兒同死又何恨哉亦死之衆歎曰有是母宜有是子為收葬之元東西川守將合兵萬人圍重慶大肆剽掠軍政不一城中益得自守張珏領重慶之命不能赴官留合州以抗元軍遣師復瀘涪二州元軍以不和而潰珏乃得入城遣將四出元軍屢敗元阿爾哈雅致書馬塈許以為廣西大都督塈不聽又請元主降手詔諭之塈焚詔斬使靜江以水為固阿爾哈雅乃築堰斷大陽小溶二江以遏上流決東南埭以涸其隍城遂陷塈閉內城堅守又破之塈率死士巷戰刀傷背被執斷其首猶握拳奮起立踰時始仆塈家世以忠勇為名將至塈死節最烈淮人黃文政先戍蜀軍潰走靜江塈邀與同守城陷亦被執文政大詬不屈元人斷其舌以次劓刖之文政含胡叱咄比死不絶聲雍守馬成旺及其子都統應麒以城降塈部將婁鈐轄猶以二百五十人守月城不下阿爾哈雅笑曰是何足攻圍之十餘日婁從壁上呼曰吾屬飢不能出降茍賜之食當聽命乃遺之牛數頭米數斛一部將開門取歸復閉壁元軍登髙視之兵皆分米炊未熟生臠牛啖立盡鳴角伐鼓諸將以為出戰也甲以待婁乃令所部將擁一火炮然之聲如雷霆震城城皆崩煙氣漲天外兵多驚死者火熄入視之灰燼無遺矣阿爾哈雅悉坑其民民得逃入西山者七百人阿爾哈雅許以不殺招之使降七百人皆自殺無一人肯降者阿爾哈雅乃分兵取鬱林潯容藤梧等州廣西提刑卭人鄧得遇聞靜江陷朝服南望拜辭書幅紙云宋室忠臣鄧氏孝子不忍偷生寧甘溺死彭咸故居乃吾潭府屈公子平乃吾伴侣優哉遊哉吾得其所遂投南流江而死帝駐蹕惠州甲子門遣倪宙奉表詣元軍請降索多命其子元帥伯家努偕宙赴大都元軍分道入西川以哈坦庫爾濟蘇領東川行樞密院攻合州巴哈李德輝領西川行樞密院攻重慶仍令德輝留成都給軍食元李思敬告運使薑毅所言悖妄指毅妻子為證元主曰妻子豈為證者耶詔勿問是歲行省雲南薩達克齊以所改郡縣上聞雲南俗無禮義男女往往自相配偶親死則火之不為喪祭無粳稻桑麻子弟不知讀書薩達克齊教之拜跪之節婚姻行媒死者為之棺槨奠祭教民播種為陂池以備水旱創建孔子廟明倫堂購經史授學田由是文風稍興雲南民以貝代錢是時初行鈔法民不便之薩達克齊為聞於朝許仍其俗又患山路險逺盜賊出沒為行者病相地置鎮每鎮設土酋吏一人百夫長一人往來者或值劫掠則罪及之有土吏數輩怨薩達克齊不己用至京師誣其專僭數事帝顧侍臣曰薩達克齊憂國愛民朕洞知之此輩何敢誣告即命械送薩達克齊處治之既至脫其械且諭之曰若曹不知上以便宜命我故訴我專僭我今不汝罪且命汝以官能竭忠自贖乎皆叩頭拜謝曰某有死罪平章既生之而又官之誓以死報交趾叛服不常湖廣省發兵屢征不利薩達克齊遣人諭以逆順禍福且約為兄弟交趾王大喜親至雲南薩達克齊郊迎待以賔禮遂乞永為藩臣蘿槃甸叛往征之有憂色從者問故薩達克齊曰吾非憂出征也憂汝曹冒鋒鏑不幸以無辜而死又憂汝曹劫虜平民使不聊生及民叛則又從而征之耳師次蘿槃城三日不降諸將請攻之薩達克齊不可遣使以理諭之蘿槃主曰謹奉命越三日又不降諸將奮勇請進兵薩達克齊又不可俄而將卒有乘城進攻者薩達克齊大怒遽鳴金止之召萬户叱責之曰天子命我安撫雲南未嘗命以殺戮也無主將命而擅攻於軍法當誅命左右縛之諸將叩首請俟城下之日從事蘿槃主聞之曰平章寬仁如此吾拒命不祥乃舉國出降將卒亦釋不誅由是西南諸夷翕然欵附夷酋每來見例有所獻納薩達克齊悉分賜從官或以給貧民私毫無所私為酒食勞酋長製衣冠襪履易其卉服草履酋皆感悅資治通鑑後編卷一百五十一
