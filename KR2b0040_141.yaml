body:
  text: 資治通鑑後編卷一百四十一刑部尚書徐乾學撰宋紀一百四十一起柔兆涒灘正月盡著雍閹茂十二月凡三年理宗建道備德大功復興烈文仁武聖明安孝皇帝端平二年春正月甲寅詔議胡瑗孫復邵雍歐陽修周惇頥司馬光蘇軾張載程皓程頥等十人從祀孔子廟庭升孔伋十哲丙辰詔孟珙黃州駐劄措置邉防珙赴樞密院禀議因入對帝問恢復珙對曰願陛下寬民力蓄人材以俟機㑹問和議珙對曰臣介胄之士當言戰不當言和賜賚甚厚珙至黃增埤浚隍搜訪軍實邉民來歸者日以千數為屋三萬間以居之厚加賑貸又慮軍民雜處因髙阜為齊安鎮淮二寨以居諸軍辛酉遣程芾等為䝉古通好使二月䝉古城和林作萬安宫和林本唐回鶻毗伽可汗故城䝉古以為㑹同之所至是城之周圍五里許三月乙未詔太學生陳均編宋長編綱目進士陳文蔚著尚書解並補迪功郎乙巳以真德秀參知政事吏部尚書陳卓同簽書樞密院事德秀既參大政撫州司法羅必元遺德秀書曰老醫嘗云傷寒壞證唯獨參湯可救然其活者十無二三先生其今之獨參湯乎德秀奏息民講武帝嘉納之是春天狗墜懷安金堂縣聲如雷三州之人皆聞之化為碎石其色紅夏四月甲子詔前四川制置使鄭損城池失守且盜陜西五路府庫財巨萬削官謫居溫州簿録其家尋復削兩秩竄南劍州丁卯臨安火戊子大閲五月乙未雨雹軍民交閧御前諸軍都統制趙勝罷命韓昱代之丙申大雨雹甲申真德秀卒諡文忠德秀立朝不滿十年奏疏無慮數十萬言皆切當世要務直聲震朝廷四方人士誦其文想見其風采及宦游所至惠政深洽不愧其言由是中外交頌都城人時驚傳澒洞奔擁出關曰真直院至矣果至則又填塞聚觀不置史彌逺以是忌之輒擯不用而聲聞愈彰且慨然以斯文自任不因黨禁之餘而少有疑沮正學遂明於天下後世多其力也六月戊寅以鄭清之為左丞相喬行簡為右丞相並兼樞密使己卯參知政事葛洪罷庚辰流星晝隕時十三朝㑹要書成召李心傳赴闕為工部侍郎上言臣聞大兵之後必有凶年蓋其殺戮之多賦斂之重使斯民怨怒之氣上干隂陽之和至於此極也陛下所宜與諸大臣掃除亂政與民更始以為削惡運迎善祥之計而法弊未嘗更張民勞不加振德既無能改於其舊而殆有甚焉故帝德未至於罔愆朝綱或苦於多紊亷平之吏所在鮮見而貪利無耻敢於為惡之人挾敵興兵四面而起以求逞其所欲如此而望五福來備百榖用成是緣木而求魚也臣考致旱之由曰和糴增多而民怨流散無所歸而民怨檢稅不盡實而民怨籍資不以罪而民怨凡此皆起於大兵之後而勢未有以消之故愈積而愈極也成湯聖主也而桑林之禱猶以六事自責陛下願治七年於此災祥飢饉史不絶書其故何哉朝令夕改靡有常規則政不節矣行齎居送略無罷日則使民疾矣陪都園廟工作甚殷則土木營矣潜邸女冠聲㷔滋熾則女謁盛矣珍玩之獻罕聞郤絶則包苴行矣鯁切之言類多厭棄則讒夫昌矣此六事者一或有焉猶足以致旱願亟降罪已之詔修六事以回天心羣臣之中有獻聚斂剽竊之論以求進者必重黜之俾不得以上誣聖德則旱雖烈猶可弭也不然民怨於內敵逼於外事窮勢迫何所不至陛下雖謀臣如雨猛將如雲亦不知所以為策矣帝從之未幾復以言去奉祠居潮州壬午以曾從龍知樞密院事崔與之參知政事鄭性之同知樞密院事賜禮部進士吳叔告以下四百五十四人及第出身潘牥對策曰陛下承休上帝皈德匹夫何異為人子孫身荷父母劬勞之賜乃指豪奴悍婢為恩私之地欲父母無怒不可得也又曰陛下手足之愛生榮死哀反不得視士庶人此如一門之內骨肉之間未能親睦是以僮僕疾視鄰里生侮宜厚東海之恩裂淮南之土以致人和時對者數百人牥語最直初崔與之自成都乞歸廣州每有除命皆力辭不起及拜廣東安撫㑹摧鋒軍士以久戍不撤相率倡亂縱火惠陽郡長驅至廣州城聲言欲得連帥洎幕屬而甘心焉與之肩輿登城曉以逆順禍福賊遁入古端州以自固與之即家治事屬提刑彭鉉討捕俄而諸軍畢集戮其桀黠不悛者餘分𨽻諸州帝注想彌切至是召參大政與之力辭帝乃遣使趣之且訪以政事之當行罷者人材之當用舍者與之上疏曰天生人材自足以供一代之用惟辨其君子小人而已忠實而有才者上也才雖不髙而忠實有守者次也用人之道無逾於此蓋忠實之才謂之有德而有才者也若以君子為無才必欲求有才者用之意嚮或差名實無别君子小人消長之勢基於此矣陛下勵精更始擢用老成然以正人為迂濶而疑其難以集事以忠言為矯激而疑其近於好名任之不專信之不篤或謂世數將衰則人才先已凋謝如真德秀洪咨䕫魏了翁方此柄用相繼而去天意固不可曉至於敢諫之臣忠於為國言未脫口斥逐隨之一去而不可復留人才豈易得而輕棄如此陛下悟已往而圖方來昨以直言去位者亟加峻擢補外者蚤與召還使天下明知陛下非疏逺正人非厭惡忠言一轉移力耳陛下收攬大權悉歸獨斷謂之獨斷者必是非利害胸中卓然有定見而後獨斷以行之比聞獨斷以來朝廷之事體愈輕宰相進擬多沮格不行或除命中出而宰相不與知立政造命之原失其要矣大抵獨斷當以兼聽為先儻不兼聽而獨斷其勢必至於偏聽實為亂階威令雖行於上而權柄潜移於下矣又曰戚畹舊僚凡有絲髮夤緣者孰不乘間伺隙以求其所大欲近習之臣朝夕在側易於親昵而難於防間司馬光謂內臣不可令其采訪外事及問以羣臣能否蓋干預之門自此始也若謂其所言出於無心豈知愛惡之私因此而入其於聖德寧無玷乎帝覽奏嘉歎趣召愈力與之控辭至十三疏不許己丑熒惑入太微垣蒙古主命子奎騰庫楚等侵蜀漢及江淮又命子古裕姪䝉格伐西域部圖嚕和爾齊伐髙麗䝉古人每甲一人西征一人南征中州户每十户一人南征一人征髙麗秋七月丁酉有流星大如太白戊戌太白經天辛丑流星晝隕庚申禮部尚書魏了翁上十事不報䝉古將扣肯布哈冦唐州全子才等棄師走趙范帥兵敗蒙古於上閘而還閏月乙酉賜趙方諡忠肅安丙諡忠定丁亥謫全子才衡州居住劉子澄端州居住八月甲寅惠陽建安京口髙沙諸軍作亂討平之乙卯以趙汝愚配享寧宗廟庭仍圖像於昭勳崇德之閣冬十月金鞏昌總帥汪世顯降䝉古時金郡縣皆降獨世顯堅守不下一日謂其衆曰宗祀已失吾何愛一死千萬人之命懸於吾手平居享髙爵厚祿死其分也餘者何罪與其自經於溝瀆姑狥一時之節孰若屈己以紓斯人之禍㑹䝉古奎騰入蜀次於鞏昌城下世顯率耆老持牛羊酒幣迎謁奎騰謂之曰吾征討有年所至皆下汝獨固守何也世顯曰有君在上賣國之人諒所不取奎騰大悅戒其下秋毫勿犯俾世顯仍舊職即日令帥所部從征世顯遂絶嘉陵進趣大安奎謄資其糧械十一月乙丑以曾從龍為樞密使督視江淮軍馬魏了翁同僉書樞密院事督視京湖軍馬了翁在朝凡六月前後二十餘疏皆當世急務帝將引以共政而忌者合謀排擯之且言了翁知兵體國故有是命戊子安南國入貢蒙古中書省請契勘大明厯從之十二月甲辰江淮督府曾從龍卒命魏了翁兼督視江淮軍馬朝論以為不可三學亦上書爭之適邉警日聞了翁五辭弗獲遂受命視師賜便宜詔書如張浚故事陛辭御書唐嚴武詩及鶴山書院四大字賜之了翁開幕府於江州以吳潜為參謀官趙善瀚馬光祖為參議官以余嶸同簽書樞密院事庚戌賜李璧諡文懿辛亥雷軍器局監丞杜範入對言陛下親覽大政兩年於兹今不惟未覩更新之效而或者乃有寖不如舊之憂夫致弊必有原救弊必有本積三四十年之蠧習浸漬薰染日深日腐有不可勝救者其原不過私之一字耳陛下固宜懲其弊原使私意净盡顧以天位之重而或藏其私憾天命有德而或濫於私豫天討有罪而或制於私情左右近習之言或溺於私聽土木無益之工或侈於私費隆禮貌以尊賢而用之未盡溫辭色以納諌而行之惟艱此陛下之私有未去也和衷之美不著同列之意不孚紙尾押勑事不預知同堂决事莫相可否集議盈庭而施行决於私見諸賢在列而密計定於私門此大臣之私有未去也君相之私容有未去則教條之頒徒為虛文近者召用名儒發明格物致知誠意正心之學有好議論者乃從而詆訾訕笑之陛下一惑其言即有厭棄儒學之意此正賢不肖進退之機天下安危所係願以其講明見之施行改祕書郎尋拜監察御史奏曩者權臣所用臺諫必其私人約言已堅而後出命其所彈擊悉承風㫖是以紀綱蕩然風俗大壞陛下親政首用洪咨䕫王遂痛矯宿弊斥去奸邪然廟堂之上奉制尚多言及貴近或委曲回護而先行丐祠之請事有掣肘或彼此調停而卒收論罪之章亦有彈墨尚新而已頒除目沙汰未幾而旋得美官自是臺諫風采昔之振揚者日以鑠朝廷紀綱昔之漸起者日以壞帝深然之䝉古奎騰入沔州知州事髙稼死之稼在沔葺理創殘招集流散民皆襁負歸之及數與䝉古力戰奇功甚多至是奎騰自鳯州入西川東路之師多敗遂搗西池谷距沔九十里吏民議退保大安稼言於制置使趙彥呐曰今日之事有進無退若能進據險地以身捍蜀敵有後顧必不深入如倉皇召兵退守內地敵長驅而前蜀事去矣彥呐曰是吾志也已而竟行留稼守沔蒙古自白水關入六股株距沔六十里沔無城依山為阻稼升髙鼓噪盛旗鼓為疑兵彥呐至置口輟帳前總管和彥威以軍還沔召小校湯俊何璘以兵㑹又選精兵千人命王宣帥以助之已而䝉古兵大至何璘遁沔州遂陷衆擁稼出户稼叱之不能止敵圍殺之彥呐聞稼死沔州破乃進屯青野原䝉古圍之曹友聞曰青野為蜀咽喉不可緩也即往救之夜半截戰遂解其圍既而蒙古先鋒汪世顯搗大安友聞又救之指麾甫畢蒙古衆數萬突至友聞迎戰又敗之敵乃退友聞遂引兵扼仙人關友聞彬十二世孫也三年春正月己未朔以星行失度雷發非時罷天基節宴賜安南國王封爵尋復來貢壬申䝉古兵連攻洪山張順翁大成等禦却之䝉古將特默岱攻江陵統制李復明戰沒詔贈三秩官其二子二月壬寅詔侍從臺諫給舍條具邉防事宜起居郎吳泳上疏論淮蜀荆襄捍禦十事不報左司諌李宗勉上言均房安蘄光化等州兵禍甚烈然江面可藉以無憂者猶有襄陽今又告變矣襄陽失則江陵危江陵危則長江之險不足恃昔之所慮猶在秋今之所慮者祗在旦夕江陵或不守則事迫勢蹙必有危亡之憂悔將何及甲辰召魏了翁還簽書樞密院事時廷臣多忌了翁故謀假出督以外之雖恩禮赫奕而督府奏陳動相牽制甫二旬復以建督為非召還為簽書樞密院事前後皆非帝意於是了翁固辭求去以陳韡為沿江制置使兼知建康府史嵩之為淮西制置使兼知廬州蒙古從耶律楚材之請初行交鈔以萬定為額䝉古復修孔子廟及司天臺京湖制置使趙范在襄陽以北軍主將王旻李伯淵樊文彬黃國弼為腹心朝夕酣狎民訟邉防一切廢弛既而南北軍將交爭范失於撫馭三月旻伯淵焚襄陽城郭倉庫降於蒙古時城中官民尚四萬七千有奇財粟在倉庫者無慮三十萬軍器二十四庫金銀鹽鈔不與焉皆為䝉古所有南軍大將李虎因勢劫掠襄陽一空自嶽飛收復以來百三十年生聚繁庶城髙池深甲於西陲一旦灰燼范坐失撫御削三官落職仍舊職任夏四月己酉僉書樞密院事魏了翁改湖南安撫使知潭州復力辭詔提舉臨安洞霄宮侍御史李韶訟曰了翁刻志問學幾四十年忠言讜論載在國史比者有㫖豫祠不知國家人才奕然有稱如了翁者幾人願亟召還處以台輔不報蒙古陷隨郢二州及荆門軍殿中侍御史李宗勉率全臺奏曰蜀之四路已失其二成都隔絶莫知存亡諸司退保䕫門未必能守襄漢昨失九郡今郢破荆門又破江陵孤城何以能立兩淮之地人民奔迸井邑邱墟陛下誠能亟下哀痛之詔以身率先深自貶損出內帑儲蓄以風動四方然後勸諭戚畹世臣隨力輸財以佐公家之調度分上流淮東淮西為二帥而以江淮大帥總之或因今任或擇長才分地而守聽令而行以公私之財分給四處俾之招潰卒募流民之強壯者以充遊兵以補軍籍仍選沿流諸郡將士為捍禦之圖猶可支吾不然將水陸俱下大合荆楚之衆擾我上流江以南震蕩矣或謂其勢強盛宜於講和欲出金繒以奉之是抱薪救火空國與敵也初䝉古唯事進取所降之户因以與將士一社之民各有所主不相統攝至是詔括户口以大臣呼圖克領之民始𨽻州縣時羣臣皆欲以丁為户耶律楚材以為不可衆皆曰我朝及西域諸國莫不以丁為户豈可捨大朝之法而從亡國之政耶楚材曰自古有中原者未嘗以丁為户若果行之可輸一年之賦隨即逃散矣䝉古主從楚材議及呼圖克以所括中州户一百四萬上䝉古主議以真定民户奉太后湯沐諸州民户分賜諸王貴戚楚材奏曰裂土分民易以生隙不如多與金帛足以為恩蒙古主曰業已許之矣楚材曰若置官吏必自朝命除恆賦外不令擅自徵斂差可久也䝉古主從之楚材又定賦稅每二户出絲一斤以供官用五户出絲一斤以給受賜貴戚功臣之家上田每畝稅三升半中田三升下田二升半水田畝五升商稅三十分之一鹽價銀一兩四十斤以為永額朝議皆謂太輕楚材曰作法於凉其弊猶貪將來必有以利進者則今重矣時河南民北徙至濟南䝉古將張榮下令民間分屋與地居之俾得樹畜且課其殿最由是曠野盡為樂土五月甲申以趙葵為淮東制置使兼知揚州葵墾田治兵邉備以飭六月己亥端明殿學士洪咨䕫卒咨䕫慱雅忠亮長於經濟而出處不茍及卒詔與執政恩例特贈兩官諡忠文癸卯熒惑填星合於畢丙午熒惑犯填星䝉古耶律楚材請立編修所於燕京經籍所於平陽編集經史召儒士梁陟充長官以王萬慶趙著副之秋七月僉書樞密院事陳卓罷丁卯以鄭性之參知政事李鳴復僉書樞密院事戊辰御史杜範吳昌裔以言事不報上疏乞罷詔改授範太常少卿以右正言李韶為殿中侍御史辭不允韶奏曰頃同臣居言職者四人未踰月徐清叟去未三月杜範吳昌裔免獨臣尚就列清叟昨言三漸臣繼其說李宗勉又繼之陛下初不加怒而清叟竟去猶曰清叟倡之也今臣與範昌裔言未嘗不相表裏二臣出臺臣獨留豈臣言不加切於二臣耶抑先去二臣以警臣使知擇而後言耶清叟所言三漸臣猶以為未甚切今國柄有陵夷之漸士氣有委靡之漸主勢有孤立之漸宗杜有阽危之漸上下偷安以人言為諱此意不改其禍豈直三漸而已甲申雨血八月丙戍詔趙范更削兩秩謫居建寧李虎削三秩各令任責捍禦䝉古陷襄陽軍德府初䝉古破許州獲金軍資庫使姚樞楊惟中見之以兄事樞與之偕覲太宗至是南伐詔樞從惟中即軍中求儒釋道醫卜之人樞招致稍衆及破棗陽特默岱欲坑士人樞力與辨得脫死者數十既拔德安得名儒趙復復以儒學見重於世其徒稱江漢先生及被獲不欲北行力求死樞譬說百端曰徒死無益隨吾而北可保無他復強從之至燕名益著學徒百人由是北方始知經學而樞亦得覩程朱之書九月辛未有事於明堂大雨震電乙亥左丞相鄭清之右丞相喬行簡並罷召崔與之為右丞相兼樞密使復辭不至壬午御前諸軍統制曹友聞與蒙古戰於大安軍陽平關敗績死之初友聞帥師扼仙人關諜報䝉古合蕃漢軍五十餘萬將至友聞謂弟萬曰國家安危在此一舉衆寡不敵豈容浪戰唯當乘髙據險出奇設伏以待之䝉古攻武休關敗都統李顯忠軍遂入興元欲衝大安軍制置使趙彥呐檄友聞控制大安以保罝口友聞馳書彥呐曰沔陽蜀之險要吾重兵在此敵有後顧之憂必不能越沔陽而入蜀又有曹萬王宣首危應援可保必捷大安地勢平曠無險可守正敵騎所長而吾步兵所短况衆寡不敵豈可於平地控禦彥呐不從友聞計以寡擊衆非乘夜出奇內外夾擊不可乃遣弟萬及友諒引兵上雞冠隘多張旗幟示敵堅守自選精鋭萬人夜渡江密往流溪設伏約曰敵至內以鳴鼓舉火為應外呼殺聲蒙古兵果至萬出逆戰蒙古巴圖爾及塔海帥步騎萬餘人往來摶戰矢石如雨萬身被數創令諸軍舉烽友聞分所部為三以禦敵親帥精兵三千人疾馳至隘下先遣統領劉虎帥敢死士五百衝敵前鋒不動友聞乃伏三百騎道旁而令虎銜枚突陳㑹大風雨諸將請曰雨不止淖濘深沒足宜俟稍霽友聞叱曰敵知我伏兵在此緩必失機遂擁兵齊進西軍素以綿裘代鐡甲經雨濡濕不利步鬪黎明䝉古以鐵騎四面圍繞友聞歎曰此殆天乎吾有死而已於是血戰愈厲與萬俱死軍盡沒䝉古兵遂長驅入蜀一月之間成都利州潼川三路俱陷唯在䕫州一路及潼川順慶府而已友聞少有大志寶慶初辟天水軍教授時天水已被圍友聞單騎夜入與守臣張維糾民厲戰兵退制置使製大旗書滿身膽三字以旌之纍立戰功及是死節汪世顯過其戰地歎曰曹將軍真男兒也事聞贈龍圖閣學士諡毅節冬十月壬寅蒙古兵陷固始縣淮西將呂文信杜林率潰卒數萬叛六安霍邱皆為羣盜所據丙午䝉古奎騰兵攻文州知州劉鋭通判趙汝嚮乘城固守晝夜摶戰時汲道絶兵民水不入口者半月至吮妻子之血卒無叛志而援兵不至鋭度不免集家人飲以藥皆死乃聚其尸及公私金帛告命焚之家素有禮法幼子同哥才六歲飲藥時猶下拜受之左右感慟城破鋭及二子自刎死汝嚮被執臠殺之軍民同死者數萬人䝉古皇子庫春卒十一月壬寅以喬行簡為左丞相兼樞密使蒙古扣肯布哈入淮西蘄舒光三州守臣皆遁扣肯布哈合三州人馬糧械趣黃州游騎自信陽趣合肥詔史嵩之援光趙葵援合肥陳韡過和州為淮西聲援䝉古特默岱攻江陵史嵩之遣孟珙救之珙遣張順先渡江而自以全師繼其後變易旌旗服色循環往來夜則列炬照江數十里相接珙又遣趙武等與戰珙親往節度遂破䝉二十四寨奪所俘二萬口而歸蒙古將察罕攻真州知州邱嶽部分嚴明守具周悉䝉古薄城輒敗嶽乘勝出戰於胥浦橋以強弩射殺其致師者一人敵兵少郤嶽曰敵衆十倍於我不可以力勝也乃為三伏設炮石待之西城敵至伏起炮發殺其驍將敵衆大擾嶽選勇士襲敵營焚其廬帳越二日皆引去戊辰以魏了翁知紹興兼浙東安撫使壬申詔群臣各陳防邉方略戊寅復成都府十二月壬寅詔改明年為嘉熙元年丁未觀文殿大學士致仕宣繒卒以定策功贈太師諡忠靖嘉熙元年春正月甲子詔江隂鎮江建寧太平池州興國鄂嶽江陵境內流民其計口給米期十日竣事以聞癸酉熒惑守鬼宿二月癸未朔以鄭性之知樞密院事禮部尚書鄒應龍僉書院事諫議大夫李宗勉同僉書院事參知政事李鳴復罷癸卯詔經筵進講朱熹通鑑綱目初䝉古諸路官府自為符印僣越無度耶律楚材請中省依式鑄給名器始重時諸王貴戚皆得自起驛馬道路騷擾所至須索百端楚材復請給牌劄定分例其弊乃革三月乙亥資政殿學士魏了翁卒諡文靖賜第宅於蘇州欽察部去中國三萬餘里夏夜極短日暫沒輒出土産良馬富者以萬計俗祍金革勇猛剛烈青目赤髮蒙古發兵擊之至衮騰吉斯海㑹大風海水涸遂進屠其衆生獲部長巴特瑪又進圍俄囉斯密且斯等諸部皆降之夏四月壬午朔以李􅐉同知樞密院事宣撫四川知成都府庚子熒惑犯權星丙午詔沔州諸鎮將帥昨以䝉古兵壓境皆棄官遁䕫路鈐轄知恩州田興隆獨自大安德勝堡至潼川迎戰雖兵寡不敵而忠節可尚特進一官五月太隂犯熒惑丙辰前同知樞密院事奉祠袁韶卒考異宋史袁韶傳云端平初奉祠卒今從理宗紀壬申臨安大火自已至酉延燒民廬五十三萬士民上書咸訴濟王之寃初進士潘牥對䇿嘗以為言并及史彌遠至是侍御史蔣峴謂火災天數何預故王遂疏劾方大琮王萬劉克莊等鼓煽異論并斥牥姓同逆賊語涉不順請皆論以漢法自是羣臣無敢復言王寃者峴彌遠之黨也福建安撫司幹辦公事豐城徐鹿卿上封事言積隂之極其徵為火略曰臣聞至不可玩者上天之怒尤不可忽者斯人之疑知所以解人心之疑則可以息天地之怒矣陛下承嗣丕緒十有四年其間異災何所不有而三變為尤大辛卯之災人以為權臣專擅之應陛下方且念其羽翼之勞潜晦隂芘於是天怒未息而警之以喪師失地之變三京之敗人以為諸臣狂易之致顧乃委曲諱護三年而始下哀痛之詔於是天怒未息而警之以迅雷之威明禋之異人以為燮理所致非人之咎陛下雖能逐一宰臣然桀政宿弊大率多仍其故於是天怒未息而鬱攸之警至於再矣火迫於開元陽德之宮獨不之燬豈非天以彰我寧宗盛德以警動陛下之心乎此衆心之所疑也椒房之親富顯之可也節鉞之華不以待有功而汲汲及此恩寵先之火亦先之衆心之所以重疑貴親懿戚人頗疑其干請之數火越兩河而徑趨之所以愈疑也非獨四疑又有三謗一曰惑嬖寵二曰溺燕私三曰用小人如政令出於朝廷是矣然御筆時至於中書宣諭或及於要地事關封駁不免留中方面置局以行囑托每有科降樁留供費此錢此物歸之誰乎朝廷每一舉措令未至而彼亦知之每一議論意未决而彼亦聞之臣以為不窒交通之路則謗不解除授出於公朝是矣然除目未頒已有謂某為某邸之客某登某人之門既而有吻合者矣除目既下則又曰某出於懿㫖之叮嚀某出於御札之訓諭雖卑官小職有不能不然者矣伴食故臣生無錙銖之勞沒乃論定策之功潜邸外姻豈不可薄加恩數而參錯於邉方守倅之任臣以為不杜僥幸之門則謗不解人心之疑不解天之所以怒也考異宋史徐鹿卿傳云辟福建安撫司幹辦公事㑹都城火鹿卿應詔上封事言積隂之極其徵為火指言惑嬖寵溺燕私用小人三事真德秀稱其氣平論正有憂愛之誠心按德秀卒於端平二年之五月若此疏果係是年所上則德秀已不及見安得有此言或疑當在紹定四年按疏中明言陛下嗣承丕緒十有四年又云辛卯之變人以為權臣專擅之應又云天怒不息鬱攸之警至於再所謂辛卯之變即紹定之火警至於再即是年之火也理宗自嘉定甲申即位至嘉熙丁酉恰十四年鹿卿之疏其為是年事無疑傳言德秀稱之妄也今不取又薛應旗續通鑑曰監簿徐鹿卿面對云云按鹿卿傳遷國子監主簿入對陳六事傳具列其目與此疏無涉今姑從傳作福建安撫幹辦俟别考丙子熒惑犯將星六月癸巳僉書樞密院事鄒應龍罷知慶元府䝉古左翼諸部訛言括民女蒙古主怒因括以賜麾下秋七月壬申日生背氣八月甲申追封秦國公汝愚為福王癸巳以李鳴復參知政事李宗勉僉書樞密院事䝉古耶律楚材奏制器者必用良工守成者必用儒臣儒臣之事業非積數十年殆未易成也䝉古主曰果爾可官其人楚材請校試之乃命稅課使劉中楊奐隨郡考試以經義詞賦論分為三科儒人被俘為奴者亦令就試其主匿弗遣者死得士凡四千三十人免為奴者四之一楚材又請一衡量立鈔法定均輸庶政略備民稍蘇息九月蒙古諸將實巴爾等渡河入汴城守臣劉甫置酒大慶殿塔斯曰此故金主所居我人臣也不敢處此遂宴於甫家塔斯穆呼哩之孫也英才大略綽有祖風穆呼哩常曰成吾志者必此兒也及長每語必先忠孝曰大丈夫受天子厚恩當效死行陳間以圖報稱安能委靡茍且目前以墮先世勳業哉冬十月扣肯布哈攻黃州孟珙帥師救却之遂攻安豐杜杲繕完守禦䝉古以火炮焚樓櫓杲隨陷隨補蒙古令巴圖爾斫牌杈木巴圖爾者敢死之士攻城輒先驅杲募善射者用小箭射其目巴圖爾多傷而退䝉古填濠為二十七壩杲分兵扼埧䝉古乘風縱火俄而風雪驟作杲募壯士奪埧路士皆奮躍死戰㑹池州都統制安豐呂文德突圍入城合力捍禦蒙古引去淮右以安文德魁梧勇悍嘗鬻薪城中趙葵見其遺履長尺有咫異而訪之值文德出獵暮負虎鹿各一而歸召置帳下遂纍功勞超擢軍職十二月戊寅朔日有食之時日與金木水火四星纒於斗食將既樞密副都承㫖兼右司郎官王伯大進對言天下大勢如江河之决日趨日下而不可挽其始也搢紳之論莫不交口誦詠謂太平之期可蹻足而待也未幾則以治亂安危之制為言矣又未幾則置治安不言而直以亡言矣嗚呼以亡為言猶知有亡也今也置亡而不言矣人主之患莫大乎處危亡而不知人臣之罪莫大乎知危亡而不言陛下親政五年於兹盛德大業未能著見於天下而招天下之謗議者何其藉藉而未巳也議逸欲之害德則天下將以陛下為商紂周幽之人主議戚宦近習之撓政則天下將以朝廷為恭顯許史武韋仇魚之朝廷議奸儔佞朋之誤國則天下又將為漢黨錮元祐黨籍之君子數者皆犯前古危亡之轍迹忠臣􅈤惻而言之志士憤激而和之陛下雖日御治朝日親儒者日修辭飾色而終莫能弭天下之議言者執之而不肯置聽者厭之而不憚煩於是厭轉而為疑疑增而為忿忿極而為愎則罪言黜諌之意藏伏於陛下之胸中而凡忤己者皆可逐之人矣彼中人之性利害不出於一身莫不破崖絶角以阿陛下之所好其稍畏名義者則包羞閔默而有跋前㚄後之憂若其無所顧戀者則皆攘袂遠引不願立於王之朝矣陛下試反於身而自省曰吾之制行得無有屋漏在上知之在下者乎徒見嬖昵之多選擇未已排當之聲時有流聞則謂精神之內守血氣之順軌未可也陛下又試於宮閫之內而加省曰凡吾之左右近屬得無有因微而入緣形而出意所狎信不復猜覺者乎徒見內降干請數至有司裏言除官每實人口則謂浸潤之不行邪徑之已塞未可也陛下又試於朝廷政事之間而三省曰凡吾之諸臣得無有讒說殄行震驚朕師惡直醜正側言敗度者乎徒見剛方峭直之士昔者所進今不知其亡柔佞闒茸之徒適從何來而遽集於斯也則謂舉國皆忠臣聖朝無闕事未可也夫以陛下之好惡用舍無非有招致人言之道及人言之來又復推而不受不知平日之際遇信任者肯為陛下分此謗乎無也陛下誠能布所失於天下而不必曲為之回護凡人言之所不貸者一朝赫然而盡去之務使蠧根悉拔孽種不留如日月之更如風雨之迅則天下之謗不攻而自息矣陛下何憚何疑而不為也哉考異陛下親政五年於兹薛鑑改云十有四年於兹按親政與即位不同徐鹿卿封事云陛下嗣承丕緒十有四年謂即位也伯大云五年於兹蓋前此史彌遠擅權政不在帝及紹定六年彌遠卒帝始親政至是恰五年故曰陛下親政五年於兹薛氏妄改可笑今據宋史王伯大傳正之二年春正月戊申朔以吏部尚書余天錫同僉書樞密院事二月庚寅詔史嵩之以參知政事督視京西荆湖南北路江西軍馬置司鄂州癸巳大宗正丞賈似道奏言北使將至地界名稱歲例宜有成說又奏裕財之道莫急於去贓吏藝祖治贓吏杖殺朝堂孝宗真决刺面今日行之則財自裕戊戌詔近覽宣撫使李􅐉奏知蜀漸次收復然創殘之餘綏撫為急宜施蕩宥之澤淮西被兵恩澤亦如之其降德音諭朕軫恤之意䝉古再遣王楫來求歲幣銀絹各二十萬李宗勉言輕諾者多後患當守元約可也然比之開禧時物價騰踴奚啻倍蓰矣史嵩之開督府力主和議宗勉言使者可疑者三嵩之職在督戰如收復襄光控扼施澧招集山寨保固江流皆今所當為若所主在和則凡有機㑹可乘不無退縮之意必至虛捐歲月坐失事功三月己丑命將作監周次說為䝉古通好使壬子以李心傳為史館修撰修髙孝光寧四朝實録庚申詔史嵩之兼督視光蘄黃䕫施州軍馬夏四月癸未以四川宣撫使李􅐉同僉書樞密院事督視江淮京湖軍馬己酉雨土閏月壬申賜禮部進士周坦以下四百二十二人及第出身五月癸未以李鳴復知樞密院事余天錫僉書院事李宗勉參知政事甲申喬行簡請以兵事委鳴復財用委宗勉楮幣委天錫當㑹議者臣則參酌行之帝從其請詔嚴州布衣錢時成忠郎吳如愚以隱居著書並選為祕閣校勘丙戍詔崔與之提舉洞霄宫任便居住以李鳴復參知政事六月甲辰朔流星晝隕丙寅同僉書樞密院事督視江淮京湖軍馬李􅐉卒蒙古築圖蘇湖城作迎駕殿秋七月壬午以霖雨不止烈風大作令中外之臣極言闕失壬寅熒惑犯鬼積尸氣以右文殿修撰趙以夫同知樞密院事八月癸酉流星晝隕䝉古陳時可髙慶民等言諸路旱蝗詔免今年田租仍停舊未輸納者俟豐歲議之九月壬午熒惑犯權星皇子維生以禮部尚書游似為吏部尚書入侍經幄帝問唐太宗貞觀治效何速如是似對曰人主一念之烈足以旋乾轉坤或謂霸圖速而王道遲不知一日歸仁期月而可王道曷嘗不速一念有時間斷則無以挽回天下之大勢至於憂勤既切宸念而佐理非人亦何以宣布九重之實德乃托唐太宗事以陳且謂太宗矜心易起漸弗克終僅止貞觀之治陛下嗣服十有五年艱危之勢滋甚回視太宗治效敏速相越乃爾意者親儒而從諫敬畏以檢身未若貞觀之超卓乎節用以致愛選亷以共理未若貞觀之切至乎願陛下益加聖心䝉古察罕帥兵號八十萬圍廬州期破廬造舟巢湖以窺江左於濠外築土城六十里鑿雨濠攻具數倍於攻安豐特杜杲極力守禦蒙古築埧髙於城樓杲以油灌草即埧下焚之皆為煨燼又於串樓內立雁翅七層俄炮中埧上衆驚杲乘勝出戰䝉古敗走杲追躡數十里又練舟師扼淮河遣其子庶監呂文德聶斌伏精鋭於要害䝉古不能進遂引軍歸詔加杲淮西制置使冬十月庚戍雷丁卯淮東總領財賦知鎮江府吳潜言宗子趙時集真滁豐濠四郡流民十餘萬團結十七寨其強壯二萬可籍為兵近調五百援合肥宜補時􅀈官又沙上蘆場可得二十餘萬畝賣之以贍流民以佐寨兵從之以孟珙為京湖制置使詔收復京襄珙謂必得郢然後可以通餽餉得荆門然後可以出奇兵及至嶽州檄江陵節制司搗襄郢召諸將指授方略發兵深入遂入郢州及荆門軍乙巳日中有黑子辛未復光州守臣董壵臣伏誅蒙古建太極書院於燕京時周惇頥之名未至河朔楊惟中用師於蜀湖京漢得名士數十人始知其道之粹乃收集伊洛諸書載送燕京師還與姚樞謀建太極書院及周子祠以程皓程頥張載楊時游酢朱熹配食請趙復為師王粹佐之選俊秀有識度者為道學士由是河朔始知道學十一月甲子皇子維卒追封祁王諡冲昭十二月乙卯詔四川諸州縣鹽酒𣙜額减免三年戊辰詔諸路和糴給時直平概量毋科抑申嚴收租苛取之禁起李韶為禮部侍郎辭詔不允令所在州軍護送至闕史嵩之遣人謂韶曰毋言濟邸宫媪國本韶不答上疏曰臣生長淳熙初猶及見渡江盛時民生富樂吏治修舉事變少異政歸私門紹定之末元氣索矣端平更化陛下初意豈不甚美國事日壞其人或罷或死莫有為陛下任其責者考論至是天下事豈非陛下所當自任而力為乎左氏載史墨言魯公世從其失季氏世修其勤蓋言所由來者漸矣陛下臨御日久宜深思熟念威福自已誰得而盜之哉舍此不為悠悠玩愒乃幾於左氏所謂世從其失者蓋以世卿風嵩之也疏出嵩之不悅曰治春秋人下語毒當是時杜範亦在列二人亷直中外稱為李杜是歲臣僚言陛下自登大寶以來蠲賦之詔無歲無之而百姓未霑實惠蓋民輸率先期歸於吏胥攬户及遇詔下則所放者吏胥之物所依閣者攬户之錢是以寬恤之詔雖頒愁歎之聲如故嘗觀漢史恤民之詔多减明年田租今宜倣漢故事如遇朝廷行大惠則以今年下詔明年减租示民先知减數則吏胥不得欺而民䝉實賜矣從之資治通鑑後編卷一百四十一
