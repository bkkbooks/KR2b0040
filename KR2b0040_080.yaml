body:
  text: 資治通鑑後編卷八十刑部尚書徐乾學撰宋紀八十起玄黓困敦正月盡昭陽赤奮若十二月凡二年神宗體元顯道法古立憲帝德王功英文烈武欽仁聖孝皇帝熙寧五年春正月己丑詔聽降羌歸國己亥置京城邏卒察謗議時政者收罪之辛丑司天監靈臺郎尤瑛言天久隂星失度宜罷免王安石上以瑛狀付中書安石遂謁告馮京等進呈送英州編管詔刺配英州牢城安石翌日乃出二月以兩浙水賜穀十萬石賑之仍募民興水利癸亥太白晝見丙寅以知鄭州吕公弼為宣徽南院使龍圖閣直學士知渭州蔡挺為樞密副使挺在渭州籍禁兵悉還府不使有隱占建勤武堂輪諸將五日以教閲隊伍金鼓之法甚備儲徑卒於行間遇用竒則别為一隊出戰甲兵整習常若寇至時土兵有闕詔募三千人挺奏土兵不必補當以涇渭儀原四州義勇分五畨畨三千人防秋以八月十五日上九月罷防春以正月十五日上三月罷周而復始比之募土兵省費多矣從之歲省粟帛錢緡十三萬有竒挺又括並邉生地冒耕田千八百頃募人佃種以益邉儲取邉民闌市蕃部田八千頃以給弓箭手養馬鎮戎軍壕外有土山挺因險築寨乘髙四望覘賊往來開膏腴之地二千頃募弓箭手三千耕守賜名熙寧寨諜告夏人數萬集胡盧河挺出竒兵迎擊之遂潰遣四將分路追討破其七族夏人復犯諸寨環慶兵不能禦挺遣張玉以萬人往解其圍慶州軍變關中大優挺討平之帝曰慶卒為亂不至猖獗涇原之力也進龍圗直學士至是遂有此命帝問挺涇原訓兵之法召部將按於崇政殿善之下以為諸路法挺為人有智計多詭譎自以有勞久留邉鬱鬱不得志寓意詞曲有應念玉關人老之句中使至則使優伶歌之以達於禁掖帝聞而閔之故有是拜三月甲午南平王李日尊卒子乾德嗣日尊公藴之孫也既死乾德幼母黎氏燕燕太妃與宦者李若吉同主國事訃至遣使弔贈戊戌判汝州富弼致仕弼至汝兩月即上言新法臣所不曉不可以治郡願歸洛養疾許之弼雖家居朝廷有大利害知無不言帝雖不盡用而眷禮不衰王安石嘗有所建明帝却之曰富弼手疏稱老臣無所告訴但仰屋竊歎者即當至矣其敬之如此丙午行市易法自王韶倡為緣邉市易之説王安石善之以為與漢平凖法同可以制物低昻而均通之遂用草澤魏繼宗議以內藏庫錢帛置市易務於京師凡貨之可市及滯於民而不售者平其價市之願以易官物者聽以抵當物力多少均分賒請相度立限嵗出息二分納還以户部判官吕嘉問為提舉嘉問上建置十三條其一云兼并之家較固取利令市易務覺察申三司按置以法帝削去此條御史劉孝孫言於此見陛下寬仁愛民之至安石曰孝孫稱頌此事以為聖政臣愚竊謂此乃聖政之闕也自是諸州上供藨席黃蘆之類悉令計直從民願者市之以給用尋改在京市易務為都提舉市易司秦鳳兩浙滁州成都廣州鄆州六市易司皆𨽻焉考異陳瓘論王安石日録所載熙寧中奏對語多不實其言曰神考不欲於律外立較固之條可謂仁厚愛民之意劉孝孫將順聖美不為過也日録但為顯掦吕嘉問故不以御批為是不以孝孫為然於是造神考之言曰若設法傾之則兼并不能為害又撰對上之言曰若不能明立法令但設法相傾即是紙鋪孫家所為紙鋪孫家為是百姓制百姓不得故止如此豈有為天下主乃只如紙鋪孫家所為何以謂之人主嗚呼設法相傾之語謂之不誣可乎紙鋪孫家之語謂之不詆可乎按帝既減去較固之條豈更欲設法相傾其誣帝明甚若紙鋪孫家之語陵悖褻嫚無復人臣禮削而不録可也羣牧使李肅之知永興軍帝戒令綏撫一路肅之曰自是朝廷以常平助役擾州縣耳帝不恱夏四月庚戌朔立殿前馬步軍春秋校試殿最法己未括間田知定州滕元發言河北州縣近山谷處民間各有弓箭社及獵射人習慣便利與諸邊無異乞下本道逐州縣并令募諸色公人及城郭鄉村百姓有武勇願習弓箭者自為之社每嵗之春長吏就閲試之北人徑悍緩急可用從之元發即甫也以避高魯王諱改字為名丁卯二股河成深十尺廣四百尺方浚河則稍障其決水至是水入於河而決口亦塞五月辛巳以古渭寨為通逺軍帝志復河隴會定州駐泊都監張守約請以古渭為軍根本隴右帝從之以王韶知軍事行教閲法詔宗室非袒免親者許應舉初試黜其不成文理者餘令覆試纍覆試不中者亦量才擢用庚寅以青唐大首領包順為西頭供奉官辛卯王安石以王韶書進呈韶言已拓地千二百里招附三十餘萬口帝與安石論人有才不可置之間處因言漢武亦能用人安石曰武帝所見下故所用將帥止衛霍輩至天下户口減半然亦不能滅丐奴帝曰武帝自為多欲耳安石曰欲亦不能害政如齊桓公亦多欲矣而注厝方略不失為霸於天下能用人故也帝曰漢武至不仁以一馬之故勞師萬里侯者七十餘人視人命若草芥所以户口減半也人命至重天地之大德曰生豈可如此壬辰以趙尚寬等前守唐州辟田疏水有功增秩以勸天下丙午太白晝見行保馬法王安石始建此議文彥博吳充以為不便安石持論益堅乃詔開封府界諸縣保甲願牧馬者聽仍令以陕西五路義勇保甲願養馬者户一匹物力高願養二匹者聽皆以監牧見馬給之或官與其直令自市先行於開封府及陕西五路府界無過三千匹五路無過五千匹襲逐盜賊外乘越三百里者有禁歲一閲其肥瘠死病者補償在府界者免體量萆二百五十束加給以錢布在五路者歲免折變緣納錢三等以上十户為一保四等以下十户為一社以待病斃補償者保户馬死保户獨償社户馬死社户半償之其後遂遍行於諸路六月壬子司空兼侍中河陽三城節度使判永興軍曾公亮以太傅致仕癸亥詔分經義論䇿為四場以試進士丙寅作京城門銅魚符樞密院言仁宗時嘗建武學乞復之乙亥詔於武成王廟置武學選文武官知兵者為教授是月河溢北京夏津秋七月壬午詔以𣙜貨務為市易西務下界市易務為東務上界辛邜詔在京商稅院雜買務並𨽻提舉市易務壬寅以曾孝寬為史館修撰兼樞密都承旨舊用武臣以文臣兼領自孝寬始也編修三司敕條例刪定官郭逢原上疏曰陛下固以師臣待王安石矣而使之自五鼓趨朝僕僕然北面而亟拜尚守君臣之常分臣之所未諭也又曰宰相代天理物無所不統臣愚以謂當廢去樞府併歸中書合文武於一途歸將相於一職復兵農於一事此堯舜之舉也今安石居宰輔之重朝廷有所建制特牽於樞府而不預則臣恐陛下所以任安石者蓋不專矣疏奏帝甚不恱他日謂安石曰逢原必輕俊安石曰陛下何以知之帝曰見所上書欲併歸樞密院安石曰人才難得如逢原亦且曉事可試用也閏月庚戌遣中書檢正官章惇察訪荆湖北路帝思用兵以威四方湖北提點刑獄趙鼎上言峽州洞酋刻剝無度蠻衆願內附辰州布衣張翹亦上書言南北江利害遂詔惇察訪荆湖北路經制蠻事時北江則彭氏主之有州二十南江則舒氏有四州田氏有四州向氏有五州皆自太祖以來受朝命𨽻辰州入貢者及惇往經制蠻相繼納土願為王民始創城寨比之內地矣詔入內供奉官以下已有養子而更養次子為內侍者斬帝因河溢語輔臣曰聞京東調夫修河有壞産者河北調急夫尤多若河復決奈何且河決不過占一河之地或東或西利害無所校聽其所趨如何王安石曰北流不塞占公私田至多又水散漫久復澱塞昨修二股費至少而公私田皆出向之潟鹵俱為沃壤庸非利乎况急夫已減於去歲若復葺理隄防則河北歲夫愈減矣帝以為然章惇經制夔夷狎侮郡縣吏無敢與共語知南川縣新津張商英負氣倜儻豪視一世部使者念獨商英足抗惇檄至夔與惇相見商英著道士服長揖就坐惇肆意大言商英隨機折之落落出其上惇大喜延為上客薦諸王安石得召對除光祿寺丞尋加太子中允權監察御史裏行時帝方厲精政事廷臣片言悟意者驟見進用商英上疏曰陛下即位以來更張改造者數十百事其最大者三事一曰免役二曰保甲三曰市易三者得其人緩而講之則為利非其人急而成之則為害臣願陛下與大臣宜安靜休息擇人而行之茍一事未巳一事復興雖使禆諶適野而謀墨翟持籌而算終莫見其成也壬子詔武學生員以百人為額遇科場一年委樞密院降宣命武臣路分都監及文臣轉運判官以上各奏舉堪應武舉者一人其被舉人遇生員闕願入學者聽監察御史裏行張商英言判刑部王庭筠立法凡蝗蝻為害須捕盡乃得聞奏今大名府祁保邢莫州順安保定軍所奏凡四十九狀而三十九狀除捕未盡進奏院以不應法不敢通奏夫蝗蝻幾遍河朔而邸吏拘文封還奏牘必俟其撲盡方許上聞陛下即欲於此時恐懼修省以上答天戒而下恤民隱亦晚矣御批進奏院遍指揮諸路轉運安撫司今後有災傷令所在畫時聞奏王安石曰諸路安撫司有無限合經制事又何暇管勾奏災傷狀乎帝笑而不答先是內批付安石聞市易買賣極苛細市人籍籍怨謗以為官司浸淫盡收天下之貨自作經營可令但依魏繼宗元擘畫施行於是安石留身白帝曰必有事實乙宣示帝曰聞𣙜貨賣氷致民賣雪都不售又聞買梳朴即梳朴貴買脂麻即脂麻貴又聞立賞錢捕人不來市易司買賣者安石曰果爾則是臣欲以聚斂誤陛下也臣素行陛下所知何緣有此事帝曰恐所使令未體朝廷意更須審察耳安石曰此事皆有迹容臣根究勘問别有聞奏甲戌徙知青州趙抃為資政殿大學士知成都時成都以戍卒為憂朝廷選擇大臣為蜀人所信愛者故以命抃召見之抃乞以便宜從事即日辭去既至蜀治益尚寬密為經略而燕勞間暇如他日兵民晏然劍州民李孝忠集衆二百餘人私造符牒度民為僧或以謀逆告獄具抃不下法吏以意決之但處孝忠以私度罪餘皆不問八月甲申觀文殿學士太子少師致仕歐陽修卒太常初諡曰文以配韓愈常秩方兼太常與修相失乃言修有定䇿之功請加以忠字實抑之也修天資剛徑見義勇為雖機穽在前觸發之不顧放逐流離至於再三志氣自若凡歷數郡不見治迹不求聲譽簡而不擾故所至民便之或問為政寬簡而事不弛廢何也曰以縱為寬以略為簡則政事弛廢而民受其弊吾所謂寬者不為苛急簡者不為繁碎耳修父觀蚤卒母嘗謂修曰汝父為吏常秉燭治官書屢廢而歎吾問之則曰死獄也我求其生不得耳吾曰生可求乎曰求其生而不得則死者興我皆無恨夫常求其生猶失之死而世常求其死也其平居教他子弟常用此語吾耳熟焉修聞而服之終身奬引後進如恐不及賞識之下率為聞人曾鞏王安石蘇洵洵子軾轍布衣屏處未為人知修即遊其聲譽謂必顯於世篤於朋友生則振掖之死則調護其家為文豐約中度其言簡而明信而通五代以來文體卑弱至是一變而復於古奉詔修唐書紀志表自撰五代史記法嚴辭約多得春秋遺旨蘇軾序其文曰論大道似韓愈論事似陸贄記事似司馬遷詩賦似李白識者以為知言秦鳳路沿邉安撫使王韶引兵城渭源堡破蒙羅角遂城乞神平破抹耳水巴族初羌各保險諸將謀置陳平地韶曰賊不舍險來鬭則我師必徒歸今已入險地當使險為吾有乃徑趨抹邦山踰竹牛嶺壓賊軍而陳令曰敢言退者斬使皆下馬少息賊乘高下鬪軍小却韶躬被甲胄麾帳下兵逆擊之羌潰走焚其廬帳洮西大震會木征渡洮來援餘黨復集韶命别將由竹牛嶺路張軍聲而師越武勝遇木征首領霞裕勒等與戰破之遂城武勝韶言措置洮河只用回易息錢未嘗輒費官本文彥博曰工師造屋初必小計冀人易於動工及既興作知不可已乃始增多帝曰屋壞豈可不修王安石曰主者善計自有忖度豈為工師所欺也彥博不復敢言自是韶進討輒肆欺誕朝廷不與計財丁亥詔求歐陽修所撰五代史壬辰以武勝城為鎮洮軍乙未詔侍從及諸路監司各舉有才行者一人己亥詔以京西路分南北兩路襄鄧隨房金均郢唐八州為南路西京許孟陳汝蔡潁七州信陽軍為北路辛丑貶太子中允同知諫院唐坰為潮州别駕初王安石喜坰令鄧綰舉為御史遂除太子中允數月將用為諫官安石疑其輕脫將背已立名不除職以本官同知諫院非故事也坰果怒安石易已凡奏二十疏論時事皆留中不出坰乃因百官起居日扣陛請對帝令諭以他日坰伏地不起遂召升殿坰至御座前進曰臣所言皆大臣不法請對陛下一一陳之乃搢笏展疏目安石曰王安石近御座聽劄子安石遲遲坰訶曰陛下前猶敢如此在外可知安石竦然而進坰大聲宣讀凡六十條大抵言安石専作威福曾布表裏擅權天下但知憚安石不復知有陛下文彥博馮京知而不敢言王圭曲事安石無異厮僕且讀且目圭圭慙懼俯首又言元絳薛向陳繹安石頥指氣使無異家奴張璪李定為安石爪牙張商英乃安石鷹犬逆意者雖賢為不肖附已者雖不肖為賢至詆安石為李林甫盧把帝屢止之坰慷慨自若略不退懾讀已下殿再拜而退侍臣衛士相顧失色閣門糾其瀆亂朝儀貶潮州别駕鄧綰申救之且自劾謬舉安石曰此素狂不足責改監廣州軍資庫甲辰王韶破木征於鞏令城降其部落二萬餘人帝患田賦不均詔司農重定方田及均稅法頒之天下方田之法以東西南北各千步當四十一頃六十六畝一百六十步為一方歲以九月縣委令佐分地計量隨陂原平澤而定其地因赤淤墨壚而辨其色方量畢以地及色參定肥瘠而分五等以定其稅則至明年三月畢揭以示民一季無訟即書户帖連莊帳付之以為地符均稅之法縣各以其租額稅數為限舊嘗收蹙竒零如米不及十合而收為升絹不滿十分而收為寸之類今不得用其數均攤增展致溢舊額凡越額增數皆禁若瘠鹵不毛及衆所食利山林陂塘溝路墳墓皆不立稅凡田方之角立土為峰植其野之所宜木以封表之有方帳有莊帳有甲帖有户帖其分煙析産典賣割移官給契縣置簿皆以今所方之田為正令既具乃以巨野縣尉王曼為指教官先自京東路行之諸路倣焉九月丁未御史裏行張商英言近日典掌誥命如陳繹王益柔許將皆不稱其職乞精擇名臣以代之不報癸丑許宗室試換文資癸亥始御便殿旬校諸軍武技丁卯詔以淮南路分東西兩路揚亳宿楚海泰泗滁真通十州為東路夀廬蘄和舒濠光黃八州無為軍為西路權發遣延州趙卨奏根括地萬五千九百餘頃招漢蕃弓箭手四千九百餘人騎團作八指揮壬申詔以卨為吏部員外郎賜銀絹二百匹兩冬十月戊寅知華州呂大防言九月丙寅少華山前阜頭谷山嶺摧陷其下平地東西五里南北十里潰散墳裂涌起堆阜各高數丈長若隄岸至陷居民六社凡數百户林木廬舍亦無存者詔賜陷沒之家錢有差戊戌升鎮洮軍為熙州以熙河洮岷四州及通逺軍置熙河路除王韶龍圖閣直學士為經略安撫使知熙州然河洮岷猶未能復也減秦鳳囚罪一等十一月癸丑河州首領霞裕勒來降以為內殿崇班賜姓名包約丁邜貶監察御史裏行張商英監荆南稅時臺勘劫盜李則從輕定罪樞密檢詳官劉奉世駁之詔糾察司劾治商英言此出大臣私忿願陛下收還主柄自持威福使耳目之官無為兩府所脅帝為停其獄商英遂言樞密庇博州親戚失入死罪及縱院吏任逺犯法十二事於是文彥博吳充蔡挺並上印求去帝難之為謫商英壬申分陕西為永興秦鳳路仍置六路經略司章惇招降梅山洞蠻蠻姓蘇氏舊不通中國其地東接潭南接邵西接辰北接鼎澧惇招降之籍其民萬四千八百餘户田二十六萬四百餘畝均定其稅使嵗一輸築武陽開峽二城置安化縣𨽻邵州十二月丙子赦亡命荆南溪洞者丁丑詔太原置弓箭手戊寅改溫成廟為祠壬申陳升之起復為檢校太傅行禮部尚書同平章事樞密使癸未雨土乙未築熙州南北關及諸堡寨是歲河北大蝗帝嘗言祖宗皆愛惜天地不肯橫費漢文帝云朕為天下守財耳王安石曰人主能以堯舜之政澤其民雖竭天下之力以奉乘輿不為過當守財之言非天下正理然安於節儉自是盛德足以率厲風俗此臣所以不敢不體聖心也六年春正月辛亥詔奉禧祖為太廟始祖遷順祖神主藏夾室孟夏祀感生帝以僖祖配先是中書奏請議僖祖神主祧遷下兩制詳議元絳等言自古受命之主既以功德享有天下皆推其本統以尊事其祖商周以契稷有功於唐虞之際故謂之祖有功若祖必有功則夏后氏何以郊鯀乎今太祖受命之初立親廟自僖祖始僖祖以上世數既不可復得而知則僖祖之為始祖無疑矣儻謂僖祖不當比契稷為始祖是使天下之人不復知尊祖而子孫得以有功加其祖考也請以僖祖為始祖之廟庶合先王禮意翰林學士韓維言昔先王既有天下迹基業之所由起奉以為太祖所以推功美重本始也太祖皇帝孝養仁聖睿智神武兵不血刃坐靖大亂子孫遵業萬世蒙澤功德卓然為宋太祖無可議者僖祖雖為髙祖然仰迹功業未見所因上尋世系又不知其所始若以所事稷契奉之竊恐於古無考而於今有所未安也天章閣待制孫固請特為僖祖立室禘祫之日以僖祖權居東向之位以伸其尊由太祖而下親盡迭毁之主皆藏諸僖祖室是時韓琦還判相州聞之歎曰此議足以傳不朽矣禮官章衡等請以僖祖為别廟蘇祝請以僖祖祔景靈宫帝以固議問王安石安石曰為祖立别廟自古無此禮薑嫄所以有别廟者蓋薑嫄禖神也以先妣故盛其禮與歌舞皆序於先祖之上不然則周不為嚳廟而立薑嫄者何也帝遂以安石論薑嫄之言為然詔依絳等議二月辛卯夏人寇秦州都巡檢使劉惟吉敗之丙申永昌陵上宫東門火王韶復河州獲木征妻子壬寅韓絳自許州徙知大名府三月己酉詔贈熙河死事將田瓊禮賓使録其子三人孫一人庚戌置經義局修詩書周禮三經義命王安石提舉吕惠卿王雱同修撰帝欲召程皓預其事安石不可乃止辛亥試明經諸科丙辰司天監言四月朔日當食九分詔自丁巳避殿減膳降天下囚罪一等流以下釋之己未詔諸路學官並委中書選京官朝官選人或舉充又詔諸路擇舉人最多州軍依五路法各置教授一員壬戌御集英殿賜奏名進士明經諸科余忠以下及第出身同出身同學究出身總五百九十六人賜及第進士錢三千緡諸科七百緡為期集費丁卯宰相上表請復膳不許詔進士諸科並試明法注官戊辰置諸路提點刑獄司檢法官各一員從吕惠卿請也庚午封李乾德為交址郡王夏四月甲戌朔日當食雲隂不見宰臣進賀以為聖德所感乞御殿復膳從之乙亥以期集院為律學置教授四員公試習律令生員義三道習斷案生員一道刑名五事至七事私試義二道案一道刑名五事至三事命官舉人皆得入學習律令戊寅知桂州沈起乞自今本路有邉事止申經略司專委處置及具以聞從之自王安石用事鋭意開邉知雍州蕭注喜言兵羡王韶等獲高位乃上疏言交址雖奉朝貢實包禍心失今不取必為後憂會交人為占城所敗或言其餘衆不滿萬可計日以取詔即以注知桂州經略之注入朝帝問攻取之䇿注復以為難時起為度支判官言南交小醜無不可取之理乃以起代注起迎合安石遂一意事攻擊交址始二乙酉熙河經略司上河州得功將卒王安石白帝士氣自此益振帝曰古人謂舉事則才自練此言是也安石曰舉事則才者出不才者困此不才者所以不樂舉事也甲午定齊徐等州保甲戊戌裁定在京吏祿己亥文彥博罷市易司既立至果實亦官監賣彥博以為損國體斂民怨致華嶽山崩為帝極言之且曰衣冠之家罔利於市搢紳清議尚所不容豈有堂堂大國皇皇求利而天意有不示警者乎王安石曰華山之變殆天意為小人發市易之起自為細民久困以抑兼并爾於官何利焉先是韓絳與安石協力排彥博每議事絳多面沮之又置審官西院以奪其權彥博內不平堅求補外帝遣中使召入押赴樞密院者數矣彥博輒歸臥帝又面諭之乃復視事至是求去益力遂以守司徒兼侍中河東節度使判河陽是月始置疏濬黃河司先是有選人李公義者獻鐡龍爪揚泥車法以濬河其法用鐡數斤為爪形以繩繫舟尾而沉之水篙工急棹乘流相繼而下一再過水已深數尺宦官黃懷信以為可用而患其太輕王安石請令懷信公義同議增損乃别置濬川杷其法以巨木長八尺齒長二尺列於木下如杷狀以石壓之兩旁繫大繩兩端矴大船相距八十步各用滑車絞之去來撓蕩泥沙已又移船而濬或謂水深則杷不能及底雖數往來無益淺則齒礙泥沙曵之不動卒乃反齒向上而曵之人皆知不可用惟安石善其法使懷信先試之以濬二股又謀鑿直河數里以觀其效且言於帝曰開直河則水勢分其不可開者以近河每開數尺即見水不容施功耳今第見水即以杷濬之水當隨杷改趨直河茍置數千杷則諸河淺澱皆非所患歲可省開濬之費幾百千萬帝曰果爾甚善聞河北小軍壘當起夫五千計合境之丁僅及此數一夫至用錢八緡故歐陽修嘗謂開河如放火與其勞人不如勿開王安石曰勞人以除害所謂毒天下而民從之者帝乃許春首興工而賞懷信以度僧牒十五道公義與堂除以杷法下北京令都大提舉大名府界金隄范子淵與通判知縣共試驗之皆言不可用會子淵以事至京師安石問其故子淵意附會遽曰法誠善第同官議不合耳安石大恱至是乃置濬河司將自衛州濬至海口以子淵為都大提舉公義為之屬五月癸卯朔湖北蠻向永晤舒光銀以其地來降戊申詔興水利凡創水磑碾碓有妨灌溉民田者以違制論不以赦原官司容縱亦如之考異宋史本紀繫八月戊申今從長編乙丑詔京東路察士人有行義者以聞以瀘夷叛詔遣中書檢正官熊本為梓夔察訪司得以便宜措置諸夷事六月丁丑提舉在京市易務奏三班借職張吉甫為上界勾當公事吉甫辭以見為李璋指使方在降謫一旦捨去義所不安帝嘆曰十室之邑必有忠信吉甫雖小人陳義甚高賢於李清臣逺矣可遂其志初韓絳宣撫清臣從辟會絳無成功被貶清臣規自全多毁絳故帝薄之辛巳提舉司天監陳繹等言本監測驗簿氣朔差互而崇天厯氣後天明天厯朔後天其失皆置元不當未可考正浮漏渾儀亦各有舛戾詔衛朴别造厯與舊厯比校疏密其浮漏渾儀令依新樣製造司天别測驗以聞王雱言今天下甲胄弓弩以千萬計而無一堅利者莫若更制其法斂數州之所作而聚以為一若今錢監之比擇知工之臣使典其職且募良工為匠師從之己亥知軍器監總內外軍器之政以吕惠卿判監事軍器舊領於三司胄案至是按唐令置監而廢胄案焉己丑中書以勸課栽桑之法奏御帝曰農桑衣食之本宜以勸民然民不敢自力者正為州縣約此以為資升其户等耳舊有條禁可申明之遂以其法下諸路每嵗二月終點檢栽及十分者有賞不及七分者有罰是月知南康軍營道周敦頥卒初因舅鄭向任為分寧主簿有獄久不決敦頥至一訊立辨邑人驚曰老吏不如也調南安司理有囚法不當死轉運使王逵欲深治之敦頥力與辨逵不聽敦頥委手板將棄官去曰如此尚可仕乎殺人以媚人吾不為也逵悟囚得釋調桂陽令改知南昌富家大姓黠吏惡少不獨以得罪為憂而且以汙穢善政為恥纍遷至廣東轉運判官施設未竟而病作遂求知南康以歸至是卒敦頥信古好義以名節自砥礪奉已甚約俸祿盡以周宗族賓友其家饘粥或不給而亦曠然不以為意黃庭堅稱其人品最高胸懷灑落如光風霽月亷于取名而鋭於求志薄於徼福而厚於得民菲於奉身而燕及煢嫠陋於希世而尚友千古不由師傅默契道體嘗著太極圖説明天理之根源究萬物之終始又著通書四十篇發明太極之藴序者謂其言約而道大文質而義精得孔孟之本原大有功於學者為南安司理時通判程珦以其學為知道使二子皓頥往與之逰敦頥每令尋孔顔樂處所樂何事皓嘗曰自再見周茂叔後吟風弄月以歸有吾與點也之意侯師聖學於頥未悟因見敦頥敦頥留與對榻夜談越三日乃還頥驚異之曰非從周茂叔來邪其善開發人如此敦頥雅有高趣尤樂佳山水既至南康即築室於蓮花峰下前有溪合於湓江取營道所居濓溪以名之學者稱為濓溪先生秋七月乙巳詔京西淮南兩浙江西荆湖六路各置一鑄錢監江南荆湖南路以十五萬緡餘以十萬緡為額己酉禱雨甲寅録在京囚死罪以下降一等杖罪釋之丁巳詔沿邉吏殺熟户以邀賞者戮之乙丑分河北為東西路大名開德河間三府滄冀博棣莫雄霸德濱恩清十一州德清保順永靜保安保定五軍為東路真定中山信德慶源四府相濬懷衛洺深磁祁保九州天威北平安肅永寧廣信順安六軍為西路丙寅夜西北有聲如磑八月命檢正中書刑房公事沈括辟官相度兩浙水利帝謂王安石等曰此事必可行否安石曰括乃土人習知其利害性亦謹密宜不妄舉帝曰事當審計無如郟亶妄作中道而止為害不細也丁丑括奏言浙西諸州水患久不疏障隄防川瀆多皆湮廢今若一出民力必難成功乞下司農貸官錢募民興役從之甲申罷簡州嵗貢綿紬甲午賜熙河涇原軍士特支錢戊戌復比閭族黨之法九月壬寅置兩浙和糴倉立斂散法戊申詔興水利辛亥御崇政殿䇿武舉初樞密院修武舉法不能答䇿者答兵書墨義王安石曰武舉而試墨義何異學究誦書不曉理者無補於事先王收勇力之士皆屬於車右者欲以備禦侮之用則記誦何所施帝從之至是始䇿試焉戊午岷州首領木令征以其城降初王韶既復河州會降羌叛韶回軍擊之吐蕃木征以其間據河州韶進破訶諾木藏城穿露骨山南入洮州境道狹隘釋馬徒行日至六七木征留其黨守河州自將尾官軍韶力戰破走之河州復平進攻宕州拔之通洮山路木令征聞先聲遂以城降韶入岷州於是疊洮二州羌酋皆相繼詣軍中以城聽命軍行凡五十四日涉千八百里得州五斬首數千級獲牛羊馬以萬計是役也人皆傳韶已全師覆沒及奏捷帝乃大喜進韶左諫議大夫端明殿學士王安石謂韶謀中機會故所至皆捷云戊辰收免行錢先是京師百物有行官司所須俱以責辦下逮貧民負販類有賠折吕嘉問請約諸行利入厚薄令納錢以賦吏祿與免行户祗應而禁中賣買百貨並下雜買場務仍置市司估物低昻凡內外官司欲占物價則取辦焉至是遂行之冬十月辛未章惇擊南江蠻平之初湖北蠻向永晤舒光銀等各以其地歸順獨田氏有元猛者頗桀驁難制惇遣左侍禁李資招諭之資褊宕無謀褻慢夷獠為懿州蠻所殺惇遂進兵破懿州南江州洞悉平駙馬都尉馬敦禮乞立春秋學官不許帝謂王安石曰卿嘗以春秋自魯史亡其義不可考故未置學官敦禮好學不倦第未知此意耳彼但讀春秋而不讀傳春秋未易通也辛巳以復熙河洮岷疊宕等州御紫宸殿受羣臣賀解所服玉帶賜王安石安石固辭曰陛下拔王韶於疏逺之中恢復一方臣與二三執政奉承聖旨而已不敢獨當此賜帝又諭旨曰羣疑方作朕亦欲中止非卿助朕此功不成安石乃受賜甲申朝獻景靈宫丙戌賑兩浙江淮飢壬辰行折二錢丁酉遣使瘞熙河戰骨是月開直河時北流閉已數年水或橫決散漫常虞壅遏外都水監丞王令圗獻議於大名第四第五掃等處開修直河使大河還二股故道乃命范子淵及朱仲立領其事聞直河深八尺又用杷疏濬二股及清水鎮河凡退背魚肋河則塞之王安石乃盛言用杷之功若不輟工雖二股河上流可使行地中也知定州滕元發入覲言新法之害曰臣始以意度其不可耳今為郡守親見其害於民者具道所以然之狀元發在定州以上已宴郊外有報契丹入塞邉民耒逃者將吏大駭請即治兵元發笑曰非爾所知也益置酒作樂遣人諭逃者曰吾在契丹不敢動使各歸業明日問之果妄諸將以是愧服韓忠彥使契丹楊興公迎勞問元發所在且曰滕公可謂開口見心矣忠彥歸奏上喜進元發禮部侍郎使再任詔曰寬嚴得體邉人安焉元發因作堂以安邉名之元發去國久而心在王室著書五篇一曰尊主勢二曰本聖心三曰校人品四曰破朋黨五曰贊治道上之其略曰陛下神聖文武自足斡運六合譬之青天白日不必點綴自然清明識者韙其言十一月癸丑中太一宫成乙卯親祀太一宫丙寅詔京畿收養老弱凍餒者資治通鑑後編卷八十
