body:
  text: 資治通鑑後編卷九十二刑部尚書徐乾學撰宋紀九十二起強圉赤奮若正月盡著雍攝提格十二月凡二年哲宗憲元繼道顯德定功欽文睿武齊聖昭孝皇帝紹聖四年春正月丙戌朔班內外學制庚寅以阿里庫子瑪爾珍襲河西軍節度使邈川首領瑪爾珍即希邦巴且也甲午涇原路鈐轄王文振敗夏人于沒煙峽丙午詔應紹聖二年十二月十五日類定姓名責降人子孫弟姪各不得住本州其鄰州內子孫仍並與次路逺分合入差遣己授未赴并見任人並罷庚戌李清臣罷帝幸楚王似第有狂婦人遮道呌呼告清臣謀反乃清臣姑子田氏外婦也清臣不能引去御史劾免之二月丁巳資政殿學士提舉崇禧觀王存表乞致仕詔許之薄其蔭補恩例言者指存元祐之初論事附會故也己未三省言司馬光呂公著倡為姦謀詆毁先帝變更法度罪惡至深及當時凶黨同惡相濟首尾附會之人偶緣今已身死不及明正典刑而亡殁之後尚且優以恩數及其子孫親屬與見存者罪罰未稱輕重不倫若謂其已死一切不問則使後世亂臣賊子何以創艾至於告老之人雖已謝事亦宜少示懲沮於是下制追貶呂公著為建武軍節度副使司馬光為清海軍節度副使王巖叟為雷州别駕奪趙膽傅堯俞贈官追韓維子孫親屬所得蔭補恩例孫固范百祿胡宗愈各與恩例兩人餘悉追奪非姦凶悖惡無人臣之義如光公著者不用此例初議再貶光公著等曽布謂章惇蔡卞曰追奪恩澤此例不可啓異時姦人施於仇怨則吾輩子孫皆為人所害矣惡惡止其身不若就其身上追奪惇曰彼已死雖鞭尸何益追削何補不若奪其恩例乃實事布又曰不若止治其渠魁為便惇曰范百祿胡宗愈之徒亦無顯惡姑置之布曰韓維在政府不久又與衆不合而去恐亦無他惇曰與光倡和者正此人也布反復甚久卞曰亦有可議惟許將默無一言布疑將以元祐為嫌故爾壬戌罷夔州路提舉常平張競辰以御史蔡卞言其諂事呂大防蘇轍故也競辰蜀人王安國女壻與曽布有連其得提舉官布實薦之章惇而蔡卞以競辰嘗忤其妻最惡競辰亟罷之丙辰夏人寇綏德城己邜復元豐𣙜茶法庚辰追奪趙瞻傅堯俞諡告詔罷春秋科閏月戊申以權知洪州張商英為江淮荆浙等路發運副使三省言近降指揮以司馬光等各加追貶其首尾附會之人亦稍奪其所得恩數謹按呂大防劉摰蘇轍梁燾等為臣不忠罪與光等無異頃者朝廷雖常懲責而罰不稱愆內范純仁又自因别過落職於本罪未嘗略正典刑輕重失當生死異罰無以垂示臣子萬世之戒其餘同惡相濟幸免失刑者尚多亦當量罪示懲癸未制呂大防責授舒州團練副使循州安置劉摯責授鼎州團練副使新州安置蘇轍責授化州别駕雷州安置梁燾責授雷州别駕化州安置范純仁責授武安軍節度副使永州安置劉奉世韓維王覿韓川孫升呂陶范純禮趙君錫馬默顧臨范純粹孔武仲王汾王欽臣張耒呂希哲呂希純呂希績姚勔吳安詩朝補之賈易程頥錢協楊畏朱光庭孫覺趙卨李之純杜純李周等三十一人或貶官奪恩或居住安置輕重有差其郴州編管秦觀移送橫州大防等責詞皆葉濤所草也考異李燾曰曽布日録云庚辰晚乃聞再貶大防摯轍燾等於嶺表以次黜責者三十餘人三省素未嘗以此語布及已得旨亦不復道上亦不語及是日葉濤來頗惶惑於命詞然何可遏也實録貶大防等在癸未二十八日今按宋史本紀亦係癸未與實録同當從之甲申太師致仕文彥博特降授太子少保致仕閏月丙戌朔詔文彥博諸子並令解官侍養司馬康追奪贈官帝以張天説所進書立意狂妄詆訕之言往往上及先帝下及朝廷送開封府取勘開封府言天説私有景祐福應太一集要及上書詆訕先帝情不可恕詔特處死觀文殿學士知定州韓忠彥降充資政殿學士以中書舍人蹇序辰論其忘恩附姦毁訿先帝故也詔上清儲祥宮御篆碑文蘇軾所撰已令毁棄宜使蔡京撰文并書壬辰詔通州居住王覿改送袁州孔文仲鮮于侁吳處厚亦各追貶鄭雍落資政殿學士安燾落觀文殿學士依前官差遣如故用蹇序辰之言也壬寅以曽布知樞密院事許將為中書侍郎蔡卞為尚書左丞吏部尚書黃履為尚書右丞翰林學士林希同知樞密院事章惇之初拜相也曽布在翰林草惇制詞極其稱美望惇用為同省執政惇忌之止拜同知樞密院故事樞密日得獨對惇疑布更引林希同知樞密院使察之希尋為布所誘亦背惇布與惇益不合卒傾惇居其位癸卯大雨雹自辰至申甲辰詔寧逺軍節度副使惠州安置蘇軾責授瓊州别駕移送昌化軍安置賀州安置范祖禹移送賔州英州安置劉安世移送髙州昌化故儋耳地軾初至僦官屋以居有司猶謂不可軾遂買地築室儋人運甓畚土以助之獨與幼子過處著書為樂時時從其父老遊若將終身焉三月壬戌夏人犯麟州神堂堡出兵討之進築胡山寨癸亥賜禮部奏名進士諸科及第出身共六百九人是日未啓封讀程文至第四人才讀數百字曽布蔡卞俱云文字顯不如第三恐不須讀啓封乃章惇之子持也至第五人上宣諭曰對䇿言先朝法度當損益恐無可降之理使先帝在位至今亦當隨宜損益承旨蔡京進曰先帝則當損益陛下方紹述先志不當損益布曰恐無此理帝顧卞曰如何卞曰不知欲何如損益京曰但言事當損益者不可不損益布曰如此乃是卞亦默然帝曰更不須降然卒降為第七及啓封則李元膺乃察之子也後五日布同林希言前侍集英放進士因言及損益先朝法度事未敢極陳時變有所不同人情有所不便豈得不損益如此則是膠柱而鼓瑟也况即今行保甲如先朝團教事皆未敢行三省行八路差官法纍經修改終未如舊法凡此之類豈非損益乃所以守先帝之法帝曰但不失大意可矣布曰德音如此臣復何言然今日在朝之人設此網罟以為中傷羅織之術凡有人言及政事所未安便以為非毁先朝因此斥逐者不一願陛下更加審察希亦言法度無不損益之理所陳略如布指帝頗欣納布又言第二人方天若程文中言元祐大臣當一切誅殺子弟當禁錮資産當籍沒此姦人附會之言不足取帝曰只是敢言布曰此有所憑恃非敢言也天若乃蔡京門客故為此言人臣欺罔莫大於此帝頷之天若興化人也丁卯詔瀘南安撫司南平軍毋擅誘楊光榮獻納播州疆土庚午夏人大至葭蘆城下知石州張構等擊走之甲戌幸金明池丙子尅胡山新寨成賜名平羌寨辛巳西上閣門使折克行破夏人于長波川斬首二千餘級獲牛馬倍之壬午中書舍人同修國史蹇序辰言前日追正司馬光等罪惡實狀具明而包藏邪心蹤迹詭祕相去八年之間已有不可備究者至其章疏文字行遣案牘又散在有司莫能會見若不乘時取索編類必恐歲久淪失或邪黨交構有藏匿棄毁之弊乞選官將姦臣所言所行事狀並取會編類人為一本分置三省樞密院以示天下後世之大戒從之章惇蔡卞請命序辰及直學士院徐鐸主其事由是搢紳之禍無一得脫者矣夏四月甲午以校書即陳瓘通判滄州曽布林希同白上瓘登高科不宜補外帝曰章惇亦云瓘當作館閣但議論乖僻故止布曰瓘不見其乖僻但議論詆訾蔡卞爾他無所聞希曰瓘嘗為越州簽判與卞論事不合遂拂衣去然人材實不可得布曰主張士類正在陛下願少留聖意帝欣然納之初瓘為太常博士時薛昻林自乞毁資治通鑑瓘因䇿士題引神宗所製序文以問二人議沮遂得不毁熙河築金城關丁酉進編臣僚章疏一百四十三帙己亥舒州團練副使循州安置呂大防卒大防赴循至虔州信豐而病語其子景山曰吾不復南矣吾死汝歸呂氏尚有遺種遂卒年七十一其兄大忠請婦葬許之大防身長七尺聲音如鐘自少持重無嗜好過市不左右遊目燕居如對賔客每朝會威儀翼如神宗常目送之與大忠及弟大臨同居論道考禮冠昏喪祭一本於古關中言禮學者推呂氏庚子知保安軍李沂伐夏國破洪州辛丑制以呂公著司馬光雖嘗小懲未符衆議特追貶公著昌化軍司户參軍光朱崖軍司户參軍先是邢恕章惇言元豐八年神宗晏駕三月二十七日范祖禹自西京赴召司馬光送别於下浮橋船中光謂祖禹曰方今主少國疑宣訓事不可不慮宣訓者北齊武明婁太后宮名也婁太后廢其孫少主殷立其子常山王演恕誣宣仁有廢立意又偽造光此言以信已讒然祖禹實以七年冬末赴召雖惇亦知其誕妄故不復窮究但借此以罪光責詞云引宣訓衰亂不道之謀喻寶慈聖烈非意之事謂此也惇嘗稱司馬光村夫子無能為呂公著素有家風凡變改法度皆公著教之故亦纍加追貶壬寅詔范純仁元祐四年罷相恩例不追奪並給還王巖叟依例追奪又詔趙卨歷任職名及贈官亦行追奪更有似此者依此施行因吏部刑部有請也環慶軡轄張存入鹽州俘戮甚衆及還夏人追襲之復多亡失知渭州章楶以夏人猖獗上言城葫蘆河川據形勝以逼夏朝廷許之遂合熙河秦鳯環慶鄜延四部之師陽繕理他寨數十所以示怯而隂具版築守戰之備出葫蘆河川築二寨于石門峽江口好水川之隂夏人聞之帥衆來襲楶迎擊敗之二旬有二日城成甲辰賜名曰平夏城靈平寨章惇因請絶夏人嵗賜而命沿邊諸路相繼築城進拓境土凡五十餘夏人大懼詔成都府路産茶州軍復行禁榷丁未三省言元豐八年二月二十九日御史中丞黃履言訪聞兩府大臣嘗議奏請皇子就傅建儲事王圭輒語李清臣云彼家事外庭不當與知蔡確章惇聞之對衆窮其所立圭不得已方云上自有子確惇乃宣言於衆其議遂定臣又聞圭隂交高遵裕嘗招其子士充傳逹語言臣伏思陛下以槐位處圭以鼎餗養圭凡十有六年今聖躬偶感微疹而圭己懷二心何以懲勸天下至三月初履又言臣論王圭議儲之事果合於義圭不可以無罪不然則臣亦當有責伏望早賜指揮又紹聖二年十一月右正言劉拯言王圭持二心為姦其卒也恩禮甚厚蔡確定䇿受顧命輔翼陛下而擠死投竄之地功罪不明孰大於此伏望聖慈究圭之罪録確之功又今年二月西京副將高士京進狀稱先臣遵裕當先帝服藥危疑之際有故宰相王圭召臣親弟承議郎士充密議取決于先臣欲知皇太后意所欲立先臣大怒曰姦臣敢如此况國家自有正統何決於我因叱罵士充曰敢再往即杖汝死有此忠義不獲伸訴於陛下乞詳酌優賜褒贈又給事中葉祖洽言當先帝違豫臣道在朝廷親聞士大夫之論籍籍罪圭圭死天下莫不快之而朝廷周恤過厚仍賜甲第一區圭何以得此異數伏乞特下有司正圭之罪以戒天下不忠不孝之臣於是詔圭遺表恩例並行追奪所賜宅拘收入官制追貶圭萬安軍司户參軍帝之嗣位邢恕與蔡確隂有異意確死貶所恕亦斥不用心恨之日夜圖報復黃履舊與恕相得恕誣謗宣仁履與其謀元豐八年二月三日章疏乃追為之非當日所奏也高士京者遵裕假子嘗與恕同官士京庸暗恕一日置酒從容問士京曰公知元祐間獨不與先公推恩否士京曰不知又問有兄弟否士京曰有兄士充已死恕曰此乃傳王圭語言者也當是時王圭為相欲立徐王遣公兄士充傳道語言於禁中知否士京曰不知因誘士京以官爵曰公不可言不知當為公作此事第勿語人因令所親信王棫為士京作奏上之圭由是得罪遵裕最愛少子士育病且死士育未嘗離左右士育每為人言初不見士充來告遵裕以圭所問事也其後恨所得官爵不稱意屢欲自陳虛妄高氏諸族皆惡之絶不與通己酉復文德殿侍從轉對五月丁巳太子少保致仕潞國公文彥博卒年九十二彥博逮事四朝任將相五十年名聞四夷元祐間契丹使耶律永昌劉霄來聘蘇軾館客與使入覲望見彥博於殿門外却立改容曰此潞公也耶問其年曰何壯也軾曰使者見其容未聞其語其綜理庶務雖精練少年有不如其貫穿古今雖専門名家有不逮使者拱手曰天下異人也既歸洛西羌首領溫溪心有名馬請於邊吏願以餽彥博詔許之其為外國所敬如此洛人邵雍程皓程頥皆以道自重彥博賔接之如布衣交與富弼司馬光等十二人用白居易九老會故事置酒賦詩相樂序齒不序官圖形妙覺僧舍謂之洛陽耆英會好事者莫不慕之辛酉以皇太妃服藥及亢旱決四京囚壬戌詔陜西添置蕃落馬軍十指揮辛未詔榜示朝堂曰朕以眇躬獲承先構永惟休烈盛美欲以昭示萬世而頃遭羣姦同逞宿憾興訛造訕力肆詆排政事人材廢毁殆盡夙夜悼懼靡敢遑寧思與卿士大夫共承厥志庶幾德業傳信無窮念今在廷之臣鮮知事君之義崇鄉原以為善士造虛譽以進無能以交私合黨為先以奉法守公為諱才智勝任則闒茸共嫉趨向至正則頗側深仇端亮徑挺有特立之操者不見容於衆人媕阿回遹持兩可之説者必得名於流俗沉溺忘返險薄可嗟乃隂懷私恩顯廢公議以姦臣所斥逐為當罪所變更為得宜以先帝所建立為不然所裒擢為非當借譽餘黨幸復甄收務令舊章末能淳一扇為是非不定之論欲開善否更用之端浸長小人之道於難知之中以疑天下之聽於未孚之際幸時事之中變庶人情之翕從每懷及茲良用慨歎朕察言觀事灼見邪心欲正典刑當申警戒繼自今日爾其自新式懲厥愆畢趨於正示以好惡非曰茍然其或怙終必罰無赦咨爾在位尚克欽承元祐初章惇爭論役法劄子有云役法可以緩改非如京東鐡馬福建茶鹽不改一日則有一日之害也及蔡卞與蹇序辰謀共作詔榜慮惇不從乃持惇元祐劄子以脅之曰若謂吳居厚京東所行非是則先帝褒詔亦非是矣惇噤不能語於是從序辰所請降詔榜云太子少保致仕韓縝卒年七十九贈司空諡莊敏縝所至以嚴稱雖出入將相而寂無功烈厚自奉養世以比晉何曽丁丑三省言韓維以先帝東宮舊臣在元豐末朋附司馬光最為盡力又奏謝止稱太皇太后更不及皇帝顯有無君之心詔維責授崇信軍節度副使均州居住時年八十一諸子乞盡納已官聽父里居且告章惇云父執政與光議論多不合故得旨免行六月癸未朔日有食之丁亥太白犯太微垣戍子嗣濮王宗楚卒以其弟宗祐嗣丙申詔翰林學士吏部尚書各舉監察御史二人丁酉環慶路安疆寨成甲辰熙河進築青石峽工畢賜名西平乙酉封世開為安定郡王世開燕懿王德昭曽孫也太原地震八月丙戌鄜延將王愍復宥州丁酉詔以蔡確無辜貶死弟除名勒停人前朝奉即碩特與敘換內殿崇班確子少府監主簿渭奏臣叔父碩曩於邢恕處見文及甫元祐中所寄恕書具述姦臣大逆不道之謀及甫乃彥博愛子必知當時姦狀詔翰林學士承旨蔡京權吏部侍郎安惇即同文館究問初及甫與恕同為館職相善其與恕書自謂畢禫當求外入朝之計未可必聞己逆為機穽以榛梗其塗又謂可馬昭之心路人所知濟之以粉昆朋類錯立欲以眇躬為甘心快意之地及甫嘗語蔡碩云司馬昭指劉摯粉昆指韓忠彥眇躬及甫自謂蓋俗謂駙馬都尉曰粉侯而韓嘉彥尚主故指其兄忠彥為粉昆朋類錯立謂王巖叟梁燾也及甫除都司為摯論列又摯嘗論彥博不可除三省長官故止為平章重事彥博致仕及甫以修撰守郡母喪除及甫與恕書請補外肆為詆毁之辭恕以此書與渭使訴其事及置對及甫為京惇所脅即妄自解釋唯以昭比摯如舊而眇躬乃以為指上粉昆指王巖叟梁燾巖叟面如傅粉故曰粉燾字况之以况為兄故曰昆也又言父彥博臨終屏左右獨告以摯等將謀廢立故亟欲彥博罷平章重事問其證驗則俱無有確母明氏嘗有狀訴邢恕云梁燾嘗對懷州致仕人李詢言若不誅確則於徐邸安得穩便朝廷封其狀不為施行至是渭以告章惇惇遂檢明氏狀進呈并付京惇追問詢依違以答亦無證驗戊戌築威戎城己酉彗出西方九月壬子以星變避殿減膳罷秋宴詔公卿悉心修政以輔不逮求中外直言乙卯赦天下出元豐庫緡錢四百萬付陜西廣糴丙寅詔蹇序辰及入內內侍省使臣一員同審問文及甫事從蔡京請也戊辰彗滅癸酉謁中太一宮為民祈福丙子御殿復膳己卯封婉儀劉氏為賢妃冬十月乙酉詔鄭雍及呂大防等永不引用期數及赦恩敘復從三省言也壬寅以權吏部尚書兼侍讀邢恕為御史中丞十一月丁卯詔諫議大夫以上各舉監察御史一人癸酉詔中大夫郴州安置劉奉世責授隰州團練副使弟知常州當時差監南嶽廟以邢恕言其隂合劉摰傾害䇿立顧命大臣故也丁丑詔程頥涪州編管坐與司馬光同惡相濟也李清臣尹洛即日迫遣之先是帝與輔臣語及元祐事曰程頥妄自尊大至欲於延英講説令太母同聽在經筵多不遜雖已放歸田里可與編管遂有涪州之命頥編管蓋林希力希意邢恕必救頥則因以傾恕恕語希曰便斬頥萬假恕亦不救聞者笑之是日雷州别駕化州安置梁燾卒燾自立朝一以援引人物為意在鄂作薦士録具載姓名客或見其書曰公所植桃李乘時而發但不向人開耳燾笑曰燾出入侍從位至執政八年之間所薦用之不盡負愧多矣十二月癸未鼎州團練副使新州安置劉摯卒先是蔡京安惇共治文及甫事八月十六日將大有所誅戮會星變帝諭曰朕遵祖宗遺志未嘗誅殺大臣劉摯等可釋勿治此據東都事略章惇傳然京惇極力煆錬不少置而燾先卒後七日摯亦卒衆皆疑兩人不得其死摯嗜書家藏書多自讐校得善本或手抄録究三禮春秋辨諸儒同異其教子弟先行實而後文藝每曰士當以器識為先一號為文無足觀矣考異長編載曽布日録是年九月辛酉布獨奏事因言呂大防劉摯初貶淮南湖北至昨來明堂赦方逾年故有不得遷敘指揮今皆在嶺表惡地與前日不同今以天變肆赦謂宜稍徙善地足以感召和氣上笑曰劉摯等安可徙布曰臣所見如此更在陛下裁擇編刺配𨽻罪人亦分廣南與逺惡處為兩等若稍徙之於端康英連之類似亦未為過上極難之按此事不見他書唯見於布所自録又係獨奏無同時左證布姦邪恐屬虛妄今不取乙酉侍御史董敦逸坐奏對不實貶秩知興國軍乙未詔鄭佑李伸各遷一官賞回河功也又詔首建言及主議回河者郭知章李偉王孝先各遷一官王令圖贈左中散大夫丁酉詔祕閣校理劉唐老落職監桂陽監稅務以唐老元祐姦黨故有是命甲辰涪州安置黃庭堅移戎州避部使者親嫌也是歲兩浙旱飢詔行荒政移粟賑貸宣城民妻一産四男子播州夷楊光榮等內附元符元年春正月戊午以右諌議大夫安惇權國子祭酒丙寅咸陽縣民段義於河南鄉劉銀村修舍得古玉印有光照室其文曰受命于天既夀永昌上之癸酉以宣德即周餘為監察御史甲戌幸瑞聖園觀北郊齋宮二月丙戌白虹貫日壬辰復罷翰林侍讀侍講學士癸巳詔河北路轉運副使呂升卿提舉荆湖南路常平等事董必並為廣南東西路察訪蔡京等究治同文館獄卒不得其要領乃更遣二人嶺外謀盡殺元祐流人時朝廷猶未知劉摯梁燾之死已而知之二人並罷丁酉嗣濮王宗祐卒以其弟宗漢嗣戊申知蘭州王舜臣討夏人于塞外築興平城三月壬子命三省樞密吏三歲一試刑法丙辰米脂寨成丁巳五王外第成賜名懿親宅戊午三省言前皇城使張士良以御藥院官給事宣仁聖烈皇后與陳衍更直宮中掌文書輒自豫奪頒降間有臣僚奏請東朝還政者衍輒詆之為不忠不孝之人匿其奏置匱中不以聞東朝亦不以聞於上於是蔡京安惇言司馬光劉摯呂大防等交通中人張茂則梁惟簡陳衍之徒獵取高位快其忿心盡變先帝成法公肆詆誣無所忌憚深懼陛下一日親政則必有欺君罔上之刑乃回顧却慮密為傾搖之計於是疏隔兩宮及隨龍內侍十人悉行放罷以去陛下之腹心廢受遺顧命元臣置以必死之地先帝任事之人無一存者以翦陛下之羽翼先帝之所治而得罪者縱而釋之以立陛下之仇敵先帝之所忌惡而棄逐者收而用之以植陛下之怨讎以王府為要途以朝廷歸私室上下協心同惡相濟大逆不道死有餘責陳衍罪在不赦亦乞更賜審問正以國法詔誅衍於崖州徙士良羈管白州初章惇恐元祐舊臣一旦復起日夜與邢恕謀所以排陷之者既再追貶呂公著司馬光又責呂大防劉摯梁燾范祖禹劉安世等過嶺意猶未慊仍用黃履疏髙士英狀追貶王圭皆誣以圖危上躬其言浸及宣仁皇后帝頗惑之最後起同文獄將悉誅元祐大臣內結宦者郝隨為助専媒糵垂簾時事建言欲追廢宣仁自皇太后太妃皆力爭之帝感悟焚其奏隨覘知之密語惇卞明日惇卞再有言帝怒曰卿等不欲朕入英宗廟乎惇卞乃已自皇太后至此據東都事略及宋史章惇傳餘皆從長編張士良者前竄雷州惇卞逮赴詔獄欲使證宣仁廢立及士良至以舊御藥告并列鼎鑊刀鋸置前謂之曰言有即還舊官言無則死士良仰天哭曰太皇太后不可誣天地神祗何可欺也乞就戮京惇無如之何但以陳衍罪狀塞詔宣仁廢立之議由是得息乙丑詔蔡京等辨驗段義所獻玉印京以為秦璽遂名曰天授傳國受命寶中丞邢恕言新除直龍圖知青州張舜民在元祐間蹤迹駮雜今不次擢用實駭觀聽望寢罷詔舜民差除指揮更不施行戊辰吏部即中方澤等坐私謁后族宴聚罰金補外庚午幸申王府辛未幸端王府甲戌進封咸寧郡王俁為莘王普寧郡王似為簡王祁國公偲為永寧郡王太常寺定韓縝諡曰莊敏申吏部覆議尚書葉祖洽言垂簾之初縝交結張茂則梁惟簡以取宰相又附司馬光變法逐蔡確為自安之計莊敏美諡非其所宜詔更不定諡丙子築熙河通會關夏四月庚辰安定郡王世開卒甲申幸睿成宮及莘王簡王府丙戌章惇等進神宗帝紀詔梁燾不許歸葬家屬令昭州居住壬辰同知樞密院事林希罷知亳州御史中丞邢恕罷知汝州希既叛章惇至是恕論希罪惇因并去之丙申建顯謨閣藏神宗御集丁酉詔權禮部尚書蹇序辰兼侍讀庚子幸睿成宮壬寅學士院上寶璽靈光翔鶴樂章癸卯詔學官增習兩經五月戊申朔御大慶殿受天授傳國受命寶行朝會禮己酉班德音於天下減囚罪一等徒以下釋之蔡京治同文獄畢言劉摯等有司馬昭之心為同時之人所發乞正典刑以及其子孫辛亥詔劉摯梁燾諸子並勒停永不收敘仍各令於元指定處居住辛亥以給事中徐鐸為吏部侍郎癸丑以受寶恭謝景靈宫庚申詔獻寶人段義為右班殿直賜絹二百匹六月戊寅朔詔改紹聖五年為元符元年丙戌遣官分詣鄜延涇原河東熙河按驗所築城寨甲午翰林學士承旨蔡京等上常平免役敇令格式壬寅詔蹇序辰安惇看詳元祐訴理所陳述語言於先朝不順者職位姓名别具以聞序辰初有是請帝亦難之蔡卞勸章惇力使必行故有是詔自後緣訴理被禍者凡七八百人序辰及惇實啓之秋七月庚午詔范祖禹移化州安置劉安世梅州安置王巖叟朱光庭諸子並勒停永不收敘以三省言其包藏姦言誣罔聖德故也壬申京師地震時有請以王安石三經義發題試舉人者右正言晉陵鄒浩言三經義者所以訓經而其書非經也以經造士而以非經之題試之甚非先帝専任經術之義乃止此據文獻通考八月丙子朔熙河蘭岷路復為熙河蘭會路戊寅賢妃劉氏生皇子丁亥詔侍從中書舍人以上各舉所知二人權侍即以上舉一人仍指言所堪職任九月丁未以霖雨罷秋宴己酉吏部尚書葉祖洽言王圭罪惡比劉摯等最為暴著今罪罰輕重不侔何以慰天下公議詔圭諸子並勒停永不收敘庚戌橫州編管秦觀特除名永不收敘移送雷州丙辰朝奉大夫充祕閣校理孔平仲特落職送吏部與合入差遣坐黨附元祐用事者非毁先朝所建立也是日蹇序辰安惇以訴理事入對曽布言此事株連者衆恐失人心昨朝廷指揮令言有不順者具名奏聞中外皆以為平允然恐議論者更有所加願聖意裁察臣嘗以謂訴理之人本無可罪今刑部左右兩曹一主斷獄一主敘雪蓋自祖宗以來凡得罪經斷訴雪者比比而有但元祐用事之人特置一司以張大其事信為可罪其訴雪者似不足深責昔真宗踐祚有建議欲放天下欠負者真宗云先帝何以不放大臣言先帝留此以遺陛下以固結天下人心真宗欣然從之蓋人心不可失也帝深納其言而序辰及惇所陳已紛紛矣右正言鄒浩言初旨但分兩等謂語及先帝并語言過差而已而今所施行混然莫辨以其近似難分之迹而典刑輕重隨以上下是乃陛下之威福操柄下移於近臣願加省察以為來事之監壬戌看詳訴理所言鄭俠上書謗訕朝政并王安國非毁安石等罪名元祐初除雪不當又王斻王斿進狀內言父安國寃抑未除詔鄭俠除名勒停依舊送英州編管永不量移王斻罷京東轉運判官差監衡州鹽酒稅王斿監江寧府糧料院癸亥詔贈太傅王安石就京師賜第百間以上冬十月甲午昭州别駕化州安置范祖禹卒祖禹平居恂恂口不言人過至遇事則别白是非不少借隱在邇英獻納尤多嘗進唐鑑十二卷深明唐三百年治亂學者尊之目為唐鑑公云乙未詔武官試換文資丁酉以河北京東河溢遣官賑恤己亥詔朝散郎汪衍瀛州防禦推官余爽並除名勒停永不收敘衍送昭州爽送封州編管先是蔡京薦爽章惇惡之具言元豐末爽及衍各上書詆誣先朝爽又元祐中曽上書乞宣仁歸政險詐反覆故有是命夏人寇平夏城知渭州章楶禦之獲其勇將威明阿密西夀監軍美楞都逋斬俘甚衆夏主震駭捷至帝為御紫宸殿受賀楶在涇原久時夏人肆暴邊吏畏愞楶上言夏人嗜利畏威不有懲艾邊不得休息宜稍取其土疆如古削地之制以固吾圉然後諸路出兵據其要害不一再舉勢將自蹙章惇與楶同宗言多見採由是創州一城寨九屢敗夏人而諸路亦多建城寨以逼夏及平夏之敗夏人遂不復振庚子中書省言元祐初起居舍人邢恕上書言王安石呂惠卿用事臣時得召對先帝詢及二人臣具道安石之短惠卿之姦卒見排嫉又言太皇太后躬親聽斷並用忠良全去弊蠧臣於此時首蒙擢右司員外郎職為宰相屬官與聞政事臣以謂千載之一時又言韓維端諒名德乃與司馬光呂公著一等詔邢恕特降授承議即知南安軍恕始罷中丞以本官知汝州居五月改知應天府章惇恐恕復用乃檢出恕所上書白帝曰邢恕除蔡確一事外無事不同元祐故特責之癸卯駙馬都尉張敦禮坐元祐初上疏譽司馬光奪留後授環衛官詔祕閣校理權知潞州歐陽棐落職送吏部與合入差遣坐朋附元祐權臣每希進用也十一月癸丑三省言王鞏張保源纍上書議論朝政表裏姦臣欲盡變先朝法度詔鞏除名勒停全州編管保源特勒停峽州居住甲子祀昊天上帝于圜丘大赦除元祐餘黨及特旨行遣者並與量移十二月丙子知淮陽軍葉濤改管勾崇禧觀以給事中范鏜言其訴理之狀辭情不遜侵黷先朝故也丁丑以江淮荆浙等路發運副使張商英為集賢殿修撰江淮荆浙等路發運使資治通鑑後編卷九十二
