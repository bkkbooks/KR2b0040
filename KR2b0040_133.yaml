body:
  text: 資治通鑑後編卷一百三十三刑部尚書徐乾學撰宋紀一百三十三起彊圉單閼正月盡上章敦牂十二月凡四年寧宗法天備道純德茂功仁文哲武聖睿恭孝皇帝開禧三年春正月丁丑朔兩淮宣撫使丘崈罷己卯命知樞密院張巖督視江淮軍馬時金已有和意崈上疏乞移書金帥以成前議且言金人既指韓托胄為元謀若移書宜暫免繫銜托胄大怒以巖代崈李璧力爭言崈素有人望托胄變色曰方今天下獨有一丘崈耶金完顔匡進攻襄陽庚辰以陳自强兼樞密使癸未金人破階州乙酉金贈故夀州軍士魏全官賜錢百萬初李爽圍夀州刺史圗克坦羲募人往斫營全在選中為爽兵所執爽謂全曰若為我罵金主免若死全至城下反罵宋主爽乃殺之至死罵不絶口丁亥皇子圻生辛卯吳曦招通判興元府權大安軍事楊震仲震仲不屈飲藥死甲午僞蜀王吳曦遣將利吉引金兵入鳯州以四郡付之表鐡山為界曦即興州為行宫改元置百官使人告其伯母趙氏趙怒絶之叔母劉日夜號泣罵不絶口曦又遣董鎮至成都治宫殿欲徙居之議削髮左祍稱臣于金分其所統兵十萬為統帥遣祿祁等戍萬州泛舟下嘉陵江聲言約金人夾攻襄陽下黃榜於成都潼川利州䕫州四路以興州為興德府召隨軍轉運使廣安安丙為丞相長史權行都省事吳睍為曦謀宜收用蜀名士以係民心於是陳咸自髠其髮史次秦自瞽其目李道傳鄧性甫楊泰之悉棄官去金布薩揆有疾丙申命左丞相宗浩兼都元帥行省于南京以代揆二月丁巳金追復永中永蹈王爵己未程松罷以楊輔為四川制置使吳曦逐之初輔知成都嘗言吳曦必反帝意輔能誅曦乃密詔授輔制置使許以便宜從事青城山道人安世通獻書於輔曰世通在山中忽聞關外之變不覺大慟世通雖方外人而大人先生亦嘗發以入道之門竊以為公初得曦檄即當還書誦其家世激以忠義聚官屬軍民素服號慟因而散金發粟鼓集忠義閉劒門檄䕫梓興仗義之師以順討逆而士大夫皆酒缸飯囊不明大義尚云少屈以保生靈何其不知輕重如此夫君乃父也民乃子也豈有棄父而救子之理此非曦一人之叛乃舉蜀士大夫之叛也聞古有叛民無叛官今曦叛而士大夫皆縮手以聼命是驅民而為叛也且曦雖叛逆猶有所忌未敢建正朔殺士大夫尚以虛文見招亦以公之與否卜民之從違也今悠悠不决徒為婦人女子之悲所謂停囚長智吾恐朝廷之失望也凡舉大事者成敗死生皆當付之度外區區行年五十二矣古人言可以生而生福也可以死而死亦福也决不忍汙面戴天同為叛民也輔有重名蜀士大夫多勸舉義兵而世通之言尤切輔自以不習兵事且內郡無兵遷延不發曦移輔知遂寧府輔遂以印授通判韓植棄成都去以知建康府葉適兼江淮制置使適謂三國孫氏嘗以江北守江自南唐以來始失之乃請于朝兼節制江北諸州詔從之時羽檄旁午而適治事如平時軍須皆從官給民以不擾其防守皆盡法度癸亥皇子圻薨追封順王諡沖懷戊辰皇子墌生金平章政事兼左副元帥布薩揆卒于下蔡揆體剛內和與物無忤臨民有惠政其為將也軍門鎮靜賞罰必行初渡淮即命撤去浮梁所至皆因糧於敵無餽運之勞未嘗輕用士卒而與之同甘苦人亦樂為之用故南征北伐為一代名將庚午金人去襄陽監興州合江倉益昌楊巨源謀討吳曦乃隂與曦將張林朱邦寧及忠義士朱福等深相結眉州人程夢錫知之以告轉運使安丙丙時稱疾未視事乃屬夢錫以書致巨源延之卧所巨源曰先生而為逆賊丞相長史耶丙號哭曰目前兵將我所知不能奮起必得豪傑乃滅此賊巨源曰非先生不足以主此事非巨源不足以了此事㑹興州中軍正將下邽李好義亦結軍士李貴進士楊君玉李坤辰李彪等數十人謀誅曦好義曰此事誓死報國救四蜀生靈但曦死後若無威望者鎮撫恐一變未已一變復生欲至期立長史安丙以主事使坤辰來邀巨源與㑹巨源往與約還報丙丙始出視事君玉與白子申共草密詔乙亥未明好義帥其徒七十四人入僞宫時僞宫門洞開好義大呼而入曰奉朝廷密詔以安長史為宣撫令我誅反賊敢抗者夷其族曦衛兵千餘聞有詔皆棄梃而走巨源持詔乘馬自稱奉使入內户㬢啓户欲逸李貴前執之刃中曦頰曦反撲貴仆于地好義急呼王换斧其腰曦始縱貴貴遂斫其首馳告丙宣詔軍民拜舞聲動天地持曦首撫定城中市不易肆盡收曦黨殺之衆推丙權四川宣撫使巨源權參贊軍事丙陳曦所以反及矯制平賊便宜賞功狀上疏自劾待罪函曦首及違制法物與曦所受金人詔印送朝廷曦僣立凡四十一日金遣珠赫果勒齊奉册于曦未至曦已誅先是韓托胄聞曦反大懼與曦書許以茅土之封且召知鎮江府宇文紹節問計紹節云安丙或能討賊托胄乃密以帛書諭丙云若能圗曦報國以明本心即當不次推賞書未逹而誅曦露布已至朝廷大喜曦首至臨安獻于廟社梟之市三日詔誅曦妻子家屬徙嶺南奪曦父挺官爵遷曦祖璘子孫出蜀存璘廟祀玠子孫免連坐三月丁丑斬僞四川都轉運使徐景望于利州庚子以楊輔為四川宣撫使安丙副之許奕為宣諭使壬寅四川宣諭使程松落職筠州安置尋徙澧州楊巨源李好義謂安丙曰曦死賊破膽矣關外西和成階鳯四州為蜀要害盍乘勢復取之不然必為後患丙從之遣好義復西和州張林李簡復成州劉昌國復和州張翼復鳯州孫忠鋭復大散關好義進兵次于獨頭嶺㑹忠義及民兵夾擊金人死者蔽路七日至西和人人樂死前無留敵金將完顔欽遁去好義整衆而入軍民歡呼迎拜好義籍府庫以歸于官欲乘勝徑取秦隴以牽制淮寇宣撫司楊輔安丙不許士氣皆沮夏四月戊申皇子墌卒追封申王諡冲懿己未以方信孺為國信所參議官如金軍時韓托胄募可以報使金帥府者近臣薦信孺可使自蕭山丞召赴都命以使事信孺曰開釁自我金人設問首謀當以何詞答之托胄矍然信孺遂持張巖書以行丁卯召楊輔還以吳獵為四川制置使時朝廷察安丙與輔異召輔赴闕輔抵建康引咎不進著作佐郎楊簡言輔棄成都不當召遂命輔知建康戊辰以資政殿學士錢象祖參知政事己巳改興州為沔州庚午贈楊震仲官仍官其子一人癸酉金人復破大散關安丙素惡孫忠鋭至是散關失守丙檄忠鋭還欲廢之先命楊巨源偕朱邦寧以沔兵二千䇿應巨源至鳯州因忠鋭出迎伏壯士於幕後突出殺之及其子揆丙遂以忠鋭附僞表聞於朝五月戊寅詔吳曦黨李伸之等十六人除名編管兩廣及湖南諸州辛卯太皇太后謝氏崩六月李好義以中軍統制知西和州吳曦將王喜遣其黨劉昌國聽節制好義與之酬酢歡飲逹旦好義心腹暴痛死昌國遁去既殮口臭爪指皆青黑居民號慟如私親朝廷慮喜為變授節度使移荆鄂都統制既而昌國白日見好義持刃刺之驚怖仆地疽發死史臣曰當時知王喜為吳曦之黨既不能罪又以節鎮賞之不惟踵唐末姑息藩鎮之禍而益知宋事之不可為矣癸酉安丙殺參議官楊巨源初吳曦之誅實楊巨源李好義首倡安丙以勞績上于朝僞言以巨源好義為首實則獨後二人及奬諭誅叛詔書至沔州巨源謂人曰詔命一字不及巨源疑有蔽其功者俄報王喜授節度使而巨源僅與通判心益不平乃為啓以謝丙曰飛矢以下聊城深慕魯仲連之髙誼解印而去彭澤庶幾陶靖節之清風既又訴功于朝或謂安丙曰巨源謀亂丙令王喜鞠其黨皆抵罪時巨源方與金人戰敗于鳯州之長橋丙密使興元都統制彭輅收巨源械送閬州獄至大安龍尾灘丙使將校樊世顯取刀斷其頭不絶者踰寸遂以巨源自殪聞忠義之士聞者莫不扼腕流涕劔外士人張伯威為文以弔其辭尤悲切李璧在政府聞之曰嘻巨源其死矣丙以人情􅍅􅍅上章求免楊輔亦謂丙殺巨源必召變請以劉甲代之論曰人嘗有言大姦似忠大詐似信豈不誠然乎哉余觀安丙心跡之間蓋有不容掩者矣蓋丙嘗容於吳曦之父素知曦者徒微語於程松而不盡吐肝膈早為之所及曦反形既熾顧又聼其召辟既不能如楊震仲之死又不能如陳咸史次秦之自戕李道傳鄧性甫之棄去乃甘受其丞相長史之僞職托名陽與而隂圗其實左觀而右望及曦膏梁之習不除軍士之心盡失而楊巨源李好義輩又且决意討賊丙於是知曦必敗乃設計自全遂相結而誅曦比上捷書則又掩巨源好義之首功而及於王喜劉昌國之逆黨卒之喜遣昌國鴆好義而丙令喜誣巨源遂遣將校殺之二人之死慘不可言此其心跡分明為賊報讐及合丙之前後觀之其惡孫忠鋭則伏壯士殺之而併及其子揆其惡王大才則臠以癸楊九鼎險刻跋扈從古鮮有而一時君臣漫不省究以致丙之功名日盛飾詐文姦聾瞽豪傑雖魏了翁宇文紹節之屬皆信之不惟享冨貴於一時且垂榮名於竹帛果將誰欺也哉昔荀彧不悟曹操之姦以其為漢討賊而從之操謀漸露大業垂成彧始悟而自殺司馬公以死漢許之而尚論者猶有遺議矧如丙者素知曦逆而所為若是其又何辭天日在上鬼神臨之必有斷斯獄者矣秋七月己卯封不儔為嗣濮王壬午金詔民間交易典質一貫以上並用交鈔毋用錢大旱飛蝗蔽天食浙西豆粟皆盡乙酉下詔罪已命郡邑賑恤之九月甲戌朔金左丞相兼都元帥宗浩卒于軍諡通敏宗浩與布薩揆穆延薩克達相繼而死一時良將俱盡金人和好之意遂决初方信孺至濠州赫舍哩子仁止之于獄露創環守之絶其薪水要以五事信孺曰反俘歸幣可也縛送首謀自古無之稱藩割地則非臣子所敢言子仁怒曰若不望生還耶信孺曰吾將命出國門時已置生死度外矣子仁遣至汴見完顔宗浩出就𫝊舍宗浩使將命者來堅持五說且謂稱籓割地自有故事信孺曰昔靖康倉卒割三鎮沼興以太母故暫屈今日可用為故事耶請面見丞相决之宗浩坐幄中陳兵見信孺曰五事不從兵南下矣信孺辨對不少詘宗浩叱之曰前日興兵今日求和何也信孺曰前日興兵復讐為社稷也今日屈巳求和為生靈也宗浩不能詰授以報書曰和與戰俟再至决之信孺還詔侍從兩省臺諌官議所以復命衆議還俘獲罪首謀增嵗幣五萬遣信孺再往時吳曦已誅金人氣頗索然猶執初議信孺曰夲朝謂增幣巳為卑屈况名分地界哉且以曲直校之本朝興兵在去年四月若貽書誘吳曦則去年三月也其曲固有在矣如以彊弱言之若潯滁濠我亦得泗漣水若夸胥浦橋之勝我亦有鳯凰山之捷若謂我不能下宿夀若圍廬知楚果能下乎五事已從其三而猶不我聽不過再交兵耳金人見信孺忠懇乃曰割地之議姑寢但稱籓不從當以叔為伯嵗幣外别犒師可也信孺固執不許宗浩遂密與定約復命朝廷以林拱辰為通謝使與信孺持國書誓草及許通謝百萬緍至汴宗浩怒信孺不曲折建白遽以誓書來有誅戮禁錮語信孺不為動將命者曰此非犒軍可了别出事目以示之信孺曰嵗幣不可再增故代以通謝錢今得此求彼吾有隕首而已㑹興州遣師復大散關宗浩益疑之乃遣信孺還復書于張巖曰若能稱臣即以江淮之間取中為界欲世為子國即盡割大江為界且斬元謀姦臣函首以獻及添嵗幣五萬兩匹犒師銀一千萬兩方可議和好信孺還致其書韓托胄問之信孺言敵所欲者五事一割兩淮三增嵗幣三索歸正人四犒軍銀五不敢言托胄固問之信孺徐曰欲得太師頭耳托胄大怒壬午信孺坐用私覿物擅作大臣饋遺金將奪三官臨江軍居住信孺三使金師以口舌折强敵敵人計屈情見雖未即和然已有成說及貶欲再遣使顧在廷無可者近臣以王柟薦乃命柟假右司郎中持書北行柟倫之孫也乙酉權攢成肅皇后于永阜陵辛卯以殿前都指揮使趙淳為江淮制置使乙未張巖罷韓托胄怒金人欲罪首謀和議遂輟復鋭意用兵乃以淳鎮江淮而罷張巖巖開督府九月費耗縣官錢三百七十萬緡壬寅祔成肅皇后神主于太廟䝉古再伐西夏克韓羅孩城冬十月乙卯復珍州遵義軍十一月甲戍詔韓托胄輕啓兵端罷平章軍國事陳自强阿附充位罷右丞相乙亥禮部侍郎史彌遠等以兵興以來蜀口漢淮之民死於兵戈者不可勝計公私之力大屈而韓托胄意猶未已中外憂懼因力陳危迫之勢請誅托胄皇后楊氏素怨托胄因使皇子榮王曮具疏言托胄再啓兵端將不利于社稷帝不答后從旁力贊之帝猶未許后請命其兄楊次山擇羣臣可任者與共圗之帝始允可次山遂語彌逺彌逺得密㫖以錢象祖嘗陳用兵忤托胄乃先白象祖象祖許之以告李璧璧謂事緩恐泄乃命主管殿前司公事夏震統兵三百候托胄入朝至太廟前呵止於途擁至玉津園側殺之彌逺象祖以聞帝猶未信既乃知之遂下詔暴托胄罪惡于中外蓋其謀始於彌逺而成于楊后及次山帝初無意也論功進彌逺為禮部尚書加震福州觀察使托胄専政十四年宰執待從臺諫籓閫皆出其門天子孤立于上威行官省權震宇內嘗鑿山為園下瞰太廟出入宫闈無度孝宗思政之所偃然居之老宫人見之垂涕顔棫草制以為得聖之清易祓撰答詔以元聖褒之四方投獻者謂伊霍旦奭不足以擬其勳余嚞請加九錫趙師􅋷乞置平原王府官屬托胄皆當之不辭其嬖妾皆封郡國夫人每內宴與妃嬪雜坐恃勢驕倨掖庭皆惡之及籍其家多乘輿服御之飾初托胄為南海尉延一士人作館客甚賢而文既别音問不通托胄當國嘗思其人一日忽至已改名登第數年矣一見歡甚館遇極厚嘗夜闌酒罷托胄屏左右促膝問曰托胄謬當國秉外間議論如何其人太息曰平章家族危如纍卵尚復何言托胄愕然問故對曰是不難知也椒殿之立非出於平章則椒殿怨矣皇子之立非出於平章則皇子怨矣賢人君子自朱熹彭龜年趙汝愚而下斥逐貶死不可勝數則士大夫怨矣邉釁既開三軍暴骨孤兒寡婦之哭聲相聞則三軍怨矣並邉之民死於殺掠內地之民死於科需則四海萬姓皆怨矣叢是衆怨平章何以當之托胄默然久之曰何以教我其人辭謝再三固問乃曰僅有一䇿主上非心黃屋若急建青宫開陳三聖家法為揖遜之舉則皇子之怨可變而為恩而椒殿退居德夀雖怨無能為矣於是輔佐新君涣然與海內更始曩時諸賢死者贈恤生者召擢遣使聘金釋怨請和以安邉境優犒諸軍厚恤死士除苛解慝盡去軍興無名之賦使百姓有更生之意然後選擇名儒遜以相位乞身告老為緑野之游易危為安其庶幾乎托胄猶豫不能决欲留其人處以掌故其人力辭去未幾禍作韓托胄既死錢象祖探懷中堂帖授陳自强曰有㫖丞相罷政自强即上馬顧曰望大參保全丁丑貶自强永州居住戊寅貶蘇師旦韶州安置己卯斬師旦詔姦臣竄殛當首開言路以來忠讜中外臣僚各具所見以聞辛巳貶鄧友龍南雄州安置尋徙循州丙戌以御史中丞衛涇僉書樞密院事丁亥詔立皇子榮王曮為皇太子更名儔尋又更名詢戊子貶郭倪梅州郭僎連州並安置籍其家貶李璧撫州居住癸巳貶張巖徽州居住十二月壬寅朔金修遼史成癸卯以許奕為大金通問使乙巳太白晝見己酉落葉適寶文閣待制庚戌貶許及之泉州居住薛叔似福州居住再貶皇甫斌英德府安置癸丑金人復破隨州辛酉以錢象祖為右丞相兼樞密使衛涇及給事中雷孝友並參知政事吏部尚書林大中僉書院事初韓托胄欲納交於大中大中不許而上書極論其姦因辭官屏居絶口不及時事托胄當國或勸其通書以免禍大中曰福不可求而得禍可懼而免耶不聽凡十二年而復起乙丑以禮部尚書史彌逺同知樞密院事丙寅贈吕祖儉朝奉郎直祕閣官其子一人丁卯詔改明年為嘉定元年嘉定元年春正月戊寅右諌議大夫葉時等請梟韓托胄首于兩淮以謝天下不報辛巳下詔求言丙戍葉時復請梟韓托胄首于兩淮戊子安定郡王伯栩卒壬辰以史彌逺知樞密院事權兵部尚書倪思求對言大權方歸所當防微一有干預端倪必且仍蹈覆轍厥今有更化之名無更化之實今托胄既誅而國人之言猶有未靖者蓋以樞臣猶兼宫賔不時宣召宰執當同班同對樞臣亦當逺權以息外議樞臣謂史彌逺也以許奕為大金通謝使金主以左司郎中劉昴等七人與蒲隂令大中私議朝政皆杖之二月戊申追復趙汝愚觀文殿大學士諡忠定以韓托胄定䇿功詔史官自紹熙以來托胄事迹悉從改正戊午再貶程松賔州安置是月栁州黑風峒寇羅世傅作亂招降之三月癸酉以毛自知首論用兵奪進士第一人思例戊子復秦檜王爵贈諡王柟至金請依靖康故事世為伯侄之國增嵗幣為三十萬犒軍錢三百萬貫蘇師旦等俟和議定後當函首以獻完顔匡具以柟言奏于金主金主命匡移書索韓托胄首以贖淮南地改犒軍錢為銀三百萬兩㑹錢象祖移書金帥府諭以誅韓托胄事柟未之知也匡問柟曰韓托胄貴顯幾年矣柟曰已十餘年平章國事才二年耳匡曰今欲去此人可乎柟曰主上英斷去之何難匡顧笑和議始决因遣柟己丑詔百官集議倪思謂有傷國體吏部尚書樓鑰曰和議重事待此而决姦宄已斃之首又何足惜遂命臨安府斫棺取首梟之兩淮遂以韓托胄及師旦之首付王柟送金師以易淮陕侵地初方信孺為托胄所貶至是柟奏和約之成皆方信孺備嘗險阻再三將命之功信孺當其難臣當其易每見金人必問信孺安在公論所推雖讐敵不能掩也乞録信孺功而蠲其過乃詔信孺自便尋除知韶州甲午金瀛王從憲卒諡敦懿從憲顯宗子也召江西常平提舉袁燮為都官郎遷司封燮入對言陛下即位之初委任賢相正士鱗集而竊威權者從旁睨之彭龜年逆知其必亂天下顯言其姦龜年以罪去而權臣遂根據幾危社稷陛下追思龜年蓋嘗臨朝太息曰斯人猶在必大用之固已深知龜年之忠矣今正人端士不乏願陛下常存此心急聞剴切崇奬朴直一龜年雖沒衆龜年繼進天下何憂不治臣昨勸陛下勤於好問而聖訓有曰好問則明臣退與朝士言之莫不稱善而側聼十旬陛下之端拱淵默猶昔也臣竊惑焉夫既知如是而明則當知反是而暗明則光輝旁燭無所不通䦣則是非得失懵然不辨矣遷國子司業祕書少監進癸酒祕書監延見諸生必迪以反躬切己忠信篤實是為道本聞者悚然士氣益振時史彌逺主和燮爭益力臺論劾燮罷之提舉鴻慶宫臨安大火凡四日焚御史臺等官舍十餘所民舍五萬八千餘家死者甚衆城中廬舍十燬其七百官多僦舟以居民訛言相驚無賴因而縱火為姦是春皇子垍生夏四月丙辰贈彭龜年寶謨閣直學士落李沐寶文閣學士尋貶信州居住戊午再貶陳自强雷州安置籍其家閠月辛未置拘𣙜安邉錢物所凡韓托胄與他權幸沒入之田及圍田湖田之在官者皆𨽻焉所輸錢租籍以給行人金繒之費逮後與北方絶好軍需邉用每於此取之壬申雨雹癸未皇子垍卒追封肅王諡冲靖甲申詔自今視事令皇太子侍立丁酉以旱求直言五月王柟以韓托胄蘇師旦首至金丁未金主御應天門備黃麾立仗受之百官上表稱賀懸二首并畫像于通衢令百姓縱觀然後漆其首藏軍器庫遂命完顔匡等罷兵更元帥府為樞密院遣使來歸大散關及濠州辛酉賜禮部進士鄭自成以下四百六十二人及等出身丁卯以蝗災詔侍從臺諌疏奏關政監司守令條上民間利害六月乙亥參知政事衛涇罷甲申僉書樞密院事林大中卒諡正惠大中少力學趣向不凡清修寡欲退然如不勝衣及遇事而發凛乎不可犯秋七月辛丑詔吕祖泰特補上州文學癸丑召江淮制置大使丘崈同知樞密院事未至卒崈儀狀魁傑機神英悟嘗慷慨曰生無以報國死願為猛將以滅敵其忠義性然也録用趙汝愚子奉議郎知南昌縣崇憲為籍田令崇憲上疏力辭以為先臣之寃未悉昭白而其孤先被寵光非公朝所以勸忠孝厲亷恥之意俄改監行在都進奏院又引陳瓘論司馬光吕公著復官事申言之乞以所陳下三省集議若先臣心迹有一如言者所論即近日恩典皆為冒濫先臣復官賜諡與臣新命俱合追寢如公論果謂誣衊乞昭示中外使先臣之讒謗既辨忠節自明而憲聖慈烈皇后擁佑之功德益顯然後申飭史館改正誣史垂萬世之公又請正趙師召妄貢封章之罪究蔡璉與大臣為仇之姦毁龔頥正續稽古録之妄詔兩省史館考訂以聞吏部尚書兼修國史樓鑰等請施行如章從之已而誣史尚未正崇憲復言前日史官徒以權臣風㫖刋舊史焚元藁略無留難今被詔再三莫有慨然奮直筆者何小人敢於為惡而謂之君子者顧不能勇於為善耶聞者愧之其後玉牒日厯所卒以重修龍飛事實進呈因崇憲請也八月辛巳以禮部尚書樓機同知樞密院事吏部尚書樓鑰簽書樞密院事鑰持論堅正忤韓托胄意奉祠纍年機初為太常少卿托胄開邊機曰恢復之名非不美今人才難得財力未裕萬一兵連禍結奈何鄧友龍曰不逐此人則異議無所回遂斥外及入樞府時干戈甫定信使往來機禆贊之功為多尤惜名器守法度進退人物直言可否不市私恩不避嫌怒甲午發米三十萬石賑糶江淮流民九月卒丑金使完顔侃喬宇入見詔以和議成諭天下中書議表賀又有以此為二府功欲差次遷秩權兵部尚書倪思曰澶淵之役捷而班師天子下詔罪已中書樞密待罪今屈已以盟奈何君相反以為慶乃止壬子出安邉所錢百萬緡命江淮制置大使司糴米振飢民史彌逺漸作威福權禮部尚書倪思進對因言臣前日論樞臣獨班奏事恐蹈往轍宗社不堪再壞宜親擢臺誎以革權臣之弊並任宰輔以防專權之失彌遠聞而恚恨思遂求去出知鎮江府召太學浦城真德秀為博士入對首言權臣開邉南北塗炭今兹繼好豈非天下之福然日者行人之遣金人欲多嵗幣之數而吾亦曰可增金人欲得姦人之首而吾亦曰可與往來之稱謂犒軍之金帛根括歸明流徙之民皆承之唯謹得無滋嫚我乎抑善謀國者不觀敵情觀吾政事今號為更紀而無以使敵情之畏服正恐彼資吾嵗賂以厚其力乘吾不備以長其謀一旦挑爭端而吾無以應此有識所為寒心又言托胄自知不為清議所貸至誠憂國之士則名以好異於是忠良之士斥而正論不聞正心誠意之學則誣以好名於是僞學之論興而正道不行今日改絃更張正當褒崇名節明示好尚召李道傳為太學博士遷太常博士兼沂王府小學教授㑹沂府有母喪遺表官吏例進秩道傳曰有襄事之勞者推恩可也吾屬何預於是皆辭不受遷著作佐郎見帝首言憂危之言不聞於朝廷非治世之象今民力未裕民心未固財用未阜儲蓄未豐邉備未修將帥未擇風俗未能知義而不偷人才未能彚進而不乏而八者之中復以才為要願陛下搜羅人才以待天下未至之憂帝嘉納之初道傳為蓬州學教授吳曦黨以意脅道傳道傳棄官去且貽書安撫使楊輔謂曦可坐而縛至是曦平詔以道傳抗節不撓召入執政有不喜道學者道傳略不為動冬十月丙子以錢象祖為左丞相史彌逺為右丞相雷孝友知樞密院事樓鑰同知樞密院事婁機參知政事陳晦草彌遠制用昆命元龜語倪思歎曰董賢為大司馬冊文有允執厥中一語蕭咸以為堯禪舜之文長老見之莫不心懼今制詞所引此舜禹揖遜也天下有如蕭咸者讀之得不大駭乎乃上省牘請貼改麻制詔下分析彌逺遂除晦殿中侍御史即劾思藩臣僣論麻制鐫職而罷自是不復起矣詔朱熹特賜諡令有司議定申奏仍與遺表恩澤一名己卯褒録慶元上書楊宏中等六人庚辰封伯柷為安定郡王辛巳蔡璉除名配贑州牢城金主得嗽疾頗困時承御賈氏范氏皆有娠未及乳月㑹衛王永濟自武定軍來朝永濟世宗苐七子也金主無嗣疏忌宗室以永濟柔弱鮮智能故愛之欲傳以位朝辭之日力疾與之擊毬謂衛王曰叔王不欲作主人遽欲去耶李元妃在傍謂金主曰此非輕言者十一月乙卯金主疾革衛王未發元妃與黃門李新喜議立衛王使內侍潘守恆召之守恆頗知書識大體謂元妃曰此大事當與大臣議乃使守恆召平章政事完顔匡匡顯宗侍讀最為舊臣有征伐功故獨召之匡至遂與定策立衛王丙辰金主殂于福安殿年四十一遺詔皇叔衛王即皇帝位且曰朕內人見有娠者兩位如其中有男當立為儲二皆男則擇可立者立之衛王承詔舉哀即皇帝位戊午右丞相史彌逺以毋憂去位十二月戊辰左丞相錢象祖罷庚午四川初行當五大錢升嘉興府為嘉興軍節度戊寅遣曽從龍使金弔癸己丑遣宇文紹彭使金賀即位是冬䝉古再伐托克托及庫楚類罕時拉拉部等遇䝉古前鋒不戰而降因用為鄉𨗳至伊埒達實河討默爾齊部滅之托克托中流矢死庫楚類罕奔契丹二年春正月辛丑金太史奏飛星如火起天市垣有尾跡若赤龍金遣費摩正來告哀丁巳以樓鑰參知政事御史中丞章良能同知樞密院事吏部尚書宇文紹節僉書院事鑰上疏曰臣竊惟諸道置帥官稱安撫兼兵民之權有分閫之制朝廷選擇甚重不輕比年以來遇有盜賊竊發州縣所不能制者必使帥臣親行雖多成功臣竊慮此水旱饑饉既不能免潢池弄兵安保其無若自此以為故事帥臣動輒臨戎恐非國家之長䇿也仰惟神宗皇帝垂意邊事廟謨深逺乃熙寧九年知成都府蔡延慶言乞發陜西兵援茂州候兵集自將以往令轉運司攝府事詔朝廷已遣將部兵延慶務在持重毋得輕去成都元豐六年河東經略司言西賊入麟州神堂寨知州訾虎等領兵出戰有功詔虎自今毋得輕易出入遇有寇邉止令禆將出兵掩逐神宗之慮深矣蓋帥守之臣民之司命一有失宜衆心易動當令指授方略調度軍食持重鎮撫以靖一方雖有挫衄根本不搖若使輕出利害實大蓋帥臣之行建牙郊野堪戰之士咸在行陳從行兵卒必是單弱而又隨宜遷次登陟險隘脫有桀黠之盜伏隱篁竹乘間捷出以犯大帥之顔行則賊勢易張國威難振倉卒之頃可勝言哉故延慶有請既拒而不從訾虎成功亦因以切戒此臣平日之所慮適合信使之所傳無事而言似非時務愚者一得願效君前庚申金遣富察知剛來致遺留物壬戌金改元大安大赦立元妃圗克坦氏為皇后二月己巳金遣使來告即位丁亥罷法科試經義復六場舊法戊子熒惑入太微垣金平章政事布薩端尚書左丞孫即康奏先帝承御賈氏當以十一月免乳今則已出三月范氏産期合在正月醫稱胎氣有損用藥調治胍息雖和胎形已失范氏願削髮為尼壬辰金主以其事詔中外金封皇子六人為王三月丙申雨雹甲辰金葬憲天光運仁文義武神聖英孝皇帝于道陵廟號章宗己酉詔民以减㑹子之直籍沒家財者有司立還之戊午禁兩淮官吏私買民田是春輝和爾國降于䝉古輝和爾即唐之髙昌也䝉古主入河西夏主安全遣其太子率師拒戰敗之獲其副元帥髙令公克烏拉海城俘其太子西璧氏進至克夷門復敗夏帥獲其將嵬名令公薄中興府引河水灌之隄決水外潰遂撤圍還遣太子阿達入中興招諭夏主夏主納女請和夏四月戊辰放廬濠二州忠義軍歸農庚辰金主下詔暴章宗元妃李氏之罪言章宗儲嗣稱有身俟將臨月於李家取兒以入日月不偶則規别取以為皇嗣章宗崩謀不及行又章宗平昔或有幸御李氏嫉妬令女巫李定奴作紙木人鴛鴦符以事魘魅致絶聖嗣令事既發露遣大臣按問俱已欵服有司議法當極刑以其久侍先帝令賜自盡王盻兒李新喜各正典刑李氏兄安國軍節度使喜兒弟少府監特默格仍追除復係監籍於逺地安置諸連坐並依律令施行賈氏亦賜自盡初完顔匡與李氏同受遺詔立衛王匡欲專定䇿功遂構殺李氏數日匡拜尚書令封申王戊子賜楊震仲諡曰節毅五月丙申起復右丞相史彌逺彌逺以母憂歸治喪太子請賜第行在令就第持服以便咨訪戊戌借補武訓郎羅日願謀為變伏誅是月諸路旱蝗六月辛卯以京湖制置司言放諸州新軍及忠義人歸農秋七月乙未詔荒歉州縣七嵗以下男女聼異姓收飬著為令癸卯募民以賑饑免役八月甲戌冊皇太子丙戌發米十萬石賑兩淮饑民九月金百官表請建儲不允冬十一月辛卯朔沔州統制張林等謀作亂事覺貸死除名廣南羈管甲午詔浙西監司募饑民修水利丙申金平陽地震有聲如雷自西北來戊戌又震浮山縣尤甚城廨民居圮者十七人死者二三千人是月桞州黑風峒寇李元礪作亂衆數萬連破吉郴諸縣詔遣荆鄂江池四州軍討之初羅世傳之降洞中實苦於乏食而江西帥急欲以買降為功遂餽之以糧餉之以鹽賊喜謀益逞外雖送欵隂治器械而主兵者更奏授以官爵峒中義丁皆恚曰作賊者得官赴義者捐命豈足以服人哉於是五合六聚各以峒名其鄉元礪及陳廷佐之徒並起為賊掀永新撇龍泉江西列城皆震十二月甲子四川制置大使司調官軍討黎州蠻敗績己巳賜朱熹諡曰文贈蔡元定迪功郎三年正月庚戍朔金太史奏日中有流星出大如盆其色碧向西行漸如車輪尾長數丈沒于濁中至地復起光散如火甲辰下詔招諭羣盜丙午雨土二月辛酉黎州蠻復寇邉壬午以工部侍郎王居安知隆興府督捕峒寇是月金太史奏客星入紫微垣光散為赤龍地大震有聲如雷三月己亥以湖南轉運判官曹彥約知潭州督捕峒寇庚子賜彭龜年諡曰忠肅甲寅誅楚州渠賊胡海夏四月癸亥峒寇李元礪犯南雄州官軍大敗是月金太史奏北方有黑氣如大道東西亘天徐邳二州奏河清五百餘里以告宗廟社稷詔中外臨洮楊圭上書曰河性本濁而今反清是水失其性也正猶天動地靜使當動者靜當靜者動則如之何其為災異明矣且傳曰黃河清聖人生假使聖人生恐不在今日又曰黃河清諸侯為天子正當戒懼以消災變而復誇示四方臣所未喻宰相以為妖言議欲誅之又慮絶言路乃詔大興府鎖還本管五月乙未淮東賊悉平詔寬恤殘破州縣乙巳命沿海諸州督捕海寇贈朱熹中大夫寶謨閣直學士六月丁巳朔日有食之考異是月日食金史衛紹王紀不書乃於十二月書辛酉朔日食按是嵗六月丁巳朔則十二月朔不得有辛酉衛紹王記注亡失無實録後人旁搜而得之以著為本紀其間不能無誤此其一事也丙寅金地震己卯封楊次山為永陽郡王是月李元礪數敗官軍於江西勢益熾江西帥李珏漕使王補之議平之而各持其說運司幹辦李燔曰寇非吾民耶豈必皆惡有司貪刻者激之將校之邀功者逼成之耳反是而行之則皆民矣帥漕曰幹辦議是誰可行者燔請自往乃駐兵萬安㑹近峒諸巡尉察隅保之尤無良者易置之分兵守險馳辨士諭賊逆順禍福於是旁峒頗有慕義而起者金大旱下詔罪已振貧民闕食者曲赦西京太原兩路雜犯死罪减一等徒以下免秋七月辛卯申嚴圍田增廣之禁是月金地震八月乙丑今立皇子胙王從恪為皇太子乙亥大風拔木是月臨安府蝗金地震夏自天㑹初與金議和八十餘年未嘗交兵至是為䝉古所攻求救于金金主新立不能出師夏人怨遂侵葭州金慶善努擊却之九月金地大震詔求直言招勇敢撫流亡冬十月壬申雷十一月李元礪迫贑州南安軍詔以重賞募人討之金中都大悲閣東渠內火自出逾旬乃滅閣南剎竿下石罅中火自出人近之即滅俄復出如是者復旬日十二月戊午參知政事婁機罷機立朝能正言好稱奬人才不遺寸長訪問賢能疏列姓名及其無用之實以備采取至是以老罷丙寅羅世傳縛李元礪以降時四川兵討元礪者皆失利知隆興府王居安以書曉都統制許俊曰賊勝則民皆為賊官勝則賊皆為民勢之翕張决於此舉將軍素以勇名為山賊所挫可乎俊得書惶恐乃為之盡力敗賊于黃山賊始懼走韶州居安駐軍廬陵召土豪問便宜皆言賊勇健趫捷陟降險阻如猿猱若鈔吾糧運吾事危矣居安曰吾自有以破之先是羅世傳雖文降而實隂與元礪相表裏故元礪敢肆其猖獗自黃山之敗元礪有悔心而練木橋賊首李才全世傳之黨也居安欲鬪羅李乃令人謂元礪曰汝能擒送才全則貰爾之罪元礪從其言居安賞元礪而厚撫才全世傳果疑元礪之二已遂交惡元礪率衆攻世傳居安語俊曰兩虎鬪於穴吾可成卞莊嗾才全之黨襲元礪巢穴俘其孥元礪無所歸世傳擒之以獻元礪伏誅峒寇悉平改黑風峒名曰效忠世傳授通直郎尋復叛為其黨所殺武學生羣訴臨安尹趙師􅋷罷之韓托胄將用兵師􅋷度必召禍乃持異論托胄誅其黨多坐謫師􅋷獲免至是始黜是嵗臨安紹興二府嚴衢二州大水賑之仍蠲其賦金大饑禁百姓不得傳說邉事金欲伐䝉古築烏沙堡䝉古主特穆津命哲伯襲殺其衆遂略地而東初䝉古主入貢于金金主時為衛王章宗使受貢于靜州䝉古主見衛王不為禮衛王歸欲請兵攻之㑹章宗殂金主嗣位有詔至䝉古傳言當拜受蒙古主問金使曰新君為誰金使曰衛王也蒙古主遽南面唾曰我謂中原皇帝乃天上人此等庸懦亦為之耶何以拜為即乘馬北去金使還奏金主益怒欲俟蒙古主再入貢就進場殺之蒙古主知之遂與金絶益嚴兵為備資治通鑑後編卷一百三十三
