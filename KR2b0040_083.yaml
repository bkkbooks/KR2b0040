body:
  text: 資治通鑑後編卷八十三刑部尚書徐乾學撰宋紀八十三起疆圉大荒落正月盡屠維協洽六月凡二年有六月神宗體元顯道法古立憲帝德王功英文烈武欽仁聖孝皇帝熙寧十年春正月乙丑御宣德門觀燈戊辰仙韶院火不視朝己丑白虹貫日辛巳詔天章閣待制楚建中罰銅三十斤先是范純仁代建中知慶州擅發常平封樁粟麥收恤流亡多所全活會蓬生蔽野如粟公私取給焉復為營求耕稼之具嵗以大穰或言純仁廩貸過多遣使按視民聞之爭先輸官比使者至則已無所負邠寧間有叢冡使者發冡籍骸劾純仁全活不實之罪詔本路監司窮治其地乃建中所封也朝廷即欲移罪建中純仁言建中守法申請間不免有殍死者已坐罪罷去今因按臣而及建中是一罪再刑也建中竟不免罰二月辛卯日中有黑子如李至癸巳始散乙未御史中丞鄧潤甫言嘗有興利之臣議前代帝王陵寢許民請射耕墾而司農可之緣此唐之諸陵悉見芟刈詔除元定禁止頃畝外民已請射者許依舊耕佃餘並禁止丁酉詔諸州嵗以十一月給老疾貧乏者粟盡三月乃止己亥王韶罷安南之役韶言決里廣源之建臣以為貪虛名而忘實禍執政乃疑臣為刺譏方舉事之初臣力爭極論欲寬民力省財用但同列莫肯聽至以熙河事折臣臣本意不費朝廷而可以至伊吾盧甘初不欲令熙河作路洮岷作州也今與衆異論儻不求退必致不容遂以母老乞外韶本鑿空開邊驟躋政地乃以勤兵費財歸曲朝廷帝由是不恱以觀文殿學士戶部侍郎知洪州尋又以謝表怨慢落職知鄂州丙午以復廣源等五州縣羣臣表賀詔以廣源州為順州赦李乾德罪郭逵判潭州己酉以交址降赦廣南東路荆湖南路繫囚餘各降一等徒以下釋之是月右正言寶文閣待制權判西京留守御史臺常秩卒詔贈右諫議大夫賻絹三百匹秩起處士在朝廷碌碌無所發明聞望日損為時譏笑三月辛未慮囚降死罪一等杖以下釋之壬申召張載同知太常禮院從吕大防薦也載至與有司議禮不合復以疾歸詔州縣捕蝗夏四月辛巳復置憲州癸巳文州蕃賊冦邊州兵擊走之丁酉賜熙河路兵特支錢戰死者賜帛免夏秋稅五月庚戍朔監西京稅務太子中允程皓改太常丞以知河南府賈昌衡京西北路轉運副使李南公等言皓博通古今行誼修潔改官八年未嘗磨勘故也戊午詔修仁宗英宗兩朝正史庚申詔以歐陽修五代史記藏祕閣甲戍太白晝見乙亥遼北院樞密使魏王耶律伊遜奏右護衛太保耶律察喇等告北院樞密使蕭蘇色等八人謀立皇太子遼主詔按之初太子以母后之故憂見顔色伊遜黨欣躍相慶讒謗沸騰忠良之士斥逐殆盡副㸃檢蕭十三辨黠善揣摩人意常出入伊遜家凡朝臣不附者輒令去之會蕭呼琨謀殺伊遜事覺下獄十三謂伊遜曰今太子猶在臣民屬心大王素無根柢之固復有誣皇后之怨一旦太子立大王置身何地宜熟計之伊遜曰吾憂此久矣是夜召蕭德勒台謀所以構太子事陰令察喇告蘇色等共謀廢立按之竟不得其狀乃出速撒等三人補外護衛餘各鞭百徙于邊耶律奴舊與伊遜有隙至是亦在徙中其妻蕭意辛胡獨公主女也遼主以公主故使意辛與奴絶婚意辛辭曰陛下以妾葭莩之親使免流竄實天地之恩然夫婦之義生死以之妾自笄年從奴一旦臨難頓爾乖離背綱常之道於禽獸何異幸陛下哀憐與奴俱行妾即死無恨從之意辛久在流所親執役事雖勞無難色事夫禮敬有加於舊遼主嘉其節壽隆中舉家召還戊寅遼詔告謀逆事者重加官賞六月己卯朔遼耶律伊遜令牌印郎君蕭額都溫誣首已嘗預耶律徹爾等謀欲殺伊遜而立太子耶律察喇前告非妄今若不言恐事發連坐遼主信之杖太子幽諸别室命伊遜及耶律仲僖蕭伊勒雅耶律孝傑楊遵朂耶律雅克蕭十三等鞫治太子具陳枉狀謂雅克曰上惟我一子今為儲副復何求公與我為昆弟行當念無辜逹意於上蕭十三聞之曰如此則大事去矣使雅克易其辭為伏欵雅克本伊遜之黨乃盡如所教以奏遼主大怒將誅徹爾及蕭蘇色等伊遜恐遼主猶有所疑引諸人庭詰各令荷重校繩繫其頸不能出氣諸人不堪其酷惟求速死伊遜乃入奏曰别無異辭遂殺徹爾蘇色等二十餘人及其家屬時方暑尸不得瘞臭聞道路壬午注輦國朝貢丙戌遼廢太子濬為庶人徙之上京太子將出曰我何罪至是蕭十三叱令登車遣衛士闔車門而去蕭德勒台監送太子時促其行不令下車起居飲食數加凌侮至則築圜堵囚之丁未置岷州鐡城堡秋七月辛亥遼賞告謀廢立者自耶律察喇以下進官有差蕭額都溫尚皇女趙國公主授駙馬都尉始平軍節度使後與耶律伊遜議不合銜之以車服僣擬人主被誅額都溫臨刑語人曰前告耶律撒刺事皆伊遜教我恐事彰殺我以滅口耳癸丑潁州團練推官邵雍卒雍始為學堅苦刻厲寒不爐暑不扇夜不就席者數年初北海李之才受易於河南穆修修受於种放放受於陳搏源流最逺之才遂授雍以河圖洛書伏羲六十四卦圖象雍由是探賾索隱妙悟神契洞徹藴奧汪洋奧博多其所自得者晚乃衍伏羲先天之㫖著書十餘萬言富弼司馬光吕公著諸賢退居洛中雅敬雍恆相從游為市園宅雍名其居曰安樂窩留守王拱辰薦雍遺逸授將作主簿後舉逸士補潁州團練推官皆固辭乃受命竟稱疾不之官程皓初侍其父識雍論議終日退而歎曰堯夫內聖外王之學也雍智慮絶人遇事能前知皓嘗曰其心虛明自能知之雍卒皓為銘其墓稱雍之道純一不雜就其所至可謂安且成矣甲寅禱雨丁巳令諸路嵗上縣令課績辛酉羣臣五上尊號曰奉天憲古文武仁孝皇帝不許乙亥貶郭逵為左衛將軍西京安置趙卨為直龍圖閣知桂州以御史知雜事蔡確言逵經制安南逗撓不即平賊卨失措置芻糧故也是月河溢衛州王拱及汲縣上下掃懷州黃沁滑州韓村諸處乙丑遂大決于澶州曹村北流斷絶河道南徙東匯于梁山張澤濼分為二派一合南清河入于淮一合北清河入于海凡灌郡縣四十五而濮齊鄆徐尤甚壞田三十萬頃民廬舍三十八萬家遣使修閉八月丙戍詔監察御史裏行黃亷為京東路體量安撫使亷嘗言都檢正俞充結中人僥幸富貴不宜使佐具瞻之地帝曰人才蓋無類顧駕御之如何耳亷對曰雖然漸不可長帝曰且置此事河決曹村京東尤被其害今以纍卿亷既受命條舉百餘事發廩賑饑逺不能至者分遣吏移給擇高地作舍以居民養男女棄於道者凡所活饑民三十五萬三千口壯者就功而食又二萬七千人得七十三萬二千工給當年牛借種錢八萬六千三百緡歸而論薦士大夫多朝廷所收用云壬寅詔潭州置將及增武臣一員遣蘇頌等賀遼主生辰正旦故事使遼者冬至日與北人交相慶是嵗奉元厯先契丹一日北人固執其厯為是頌曰厯家算術小異遲速不同如亥時節氣當交猶是今夕若踰刻則屬子時為明日矣或先或後各從其厯可也北人不能屈遂各以其日為節使還以奏帝喜曰朕嘗思之此最難處卿所對殊善因問其山川人情向背對曰彼講和日久頗竊中國典章禮義以維持其政上下相安未有離二之意昔漢武帝自謂高皇帝遺朕平城之憂雖久勤征討而胸奴終不服至宣帝時呼韓單于稽首稱藩唐自中葉以後河湟陷于吐蕃憲宗每讀貞觀政要慨然有收復意至宣宗時乃以三關七州歸於有司由此觀之彼國之叛服不常不繫中國之盛衰也頌意蓋有所諷帝以為然甲辰詔侍從臺諫監司各舉文臣有才行者一人令中書審察隨材試用毋得舉館職及兩府若己之親從御史黃亷奏請也時應詔者百餘人亷又言勢孤族寒逺跡下僚者既得以名聞於上願詔中書審察其能否用之則急才之詔不虛行於天下矣是月河又決鄭州滎澤判河陽文彥博言臣正月嘗奏德州河底淤澱泄水稽滯上流必至壅遏又河勢變移四散漫流兩岸俱被水患若不預為經制必溢魏博恩澶等州之境而都水略無施設止固護東流北岸而已適纍年河流低下官吏希省費之賞未嘗增修堤岸大名諸掃皆可憂虞即如曹村一掃自熙寧八年至今三年雖每計春料當培低怯而有司未嘗如約其掃兵又皆給他役今者果大決溢此非天災實人力不至也九月庚戍詔河決害民田所屬州縣疏瀹仍蠲其稅老幼疾病者賑之乙卯詔諸傳宣內批面諭事無法守並從中書樞密覆奏其祈恩澤規免罪者劾之辛酉詔鎮戎德順軍各置都監一員癸酉詔開封府界先自豐稔畿縣立義倉法甲戍濮國公宗朴進封濮陽郡王贈邵雍祕書省著作郎雍初與常秩同召雍竟辭不起士大夫高之吳充請於帝賜諡曰康節冬十月戊寅朔濮陽郡王宗朴薨癸巳宗朴弟宗誼襲封濮國公詔濮王子以次襲封奉祀乙未以知河陽吕公著提舉中太一宫公著詣闕對延和殿勞問周至公著面奏伏覩近詔舉才行堪任升擢官竊詳今日詔意正欲逹所未逹然數年以來天下之士陛下素知其能嘗試以事而就閒出外者尚多恐其間亦有材實忠厚欲為國家宣力者未必盡出於迂闊繆戾而難用也自熙寧初論新法不附執政者皆譴逐不復收用故公著見上首言之戊戌太子太師致仕張忭卒贈司徒兼侍中諡康節十一月庚午以西蕃邈州首領董戬都首領青伊結果莊為廓州刺史阿里庫為松州刺史甲戍祀天地于圜丘遼北院樞密副使蕭十三復為耶律伊遜陳陰害太子計伊遜從之遣其黨旗鼓伊喇詳衮蕭逹囉克與近侍直長薩巴詣上京同留守蕭塔坦夜引力士至囚室紿以有赦召太子出殺之函其首以歸伊遜黨大喜聚飲數日塔坦以疾薨聞太子死時年二十遼主哀之命有司葬龍門山欲召其妃還伊遜復遣人殺之以滅其口有女子常格者太師耶律實魯之妹也操行修潔自誓不嫁能詩文不茍作讀通厯見前人得失歷能品藻咸雍中撰文一篇以述時政上之遼主稱善伊遜愛其才屢求詩常格遺以回文伊遜知其諷已銜之太子坐事伊遜誣以罪按問無迹獲免會實魯謫鎮州常格與俱恆布衣蔬食人問何自苦如此常格曰皇儲無罪遭廢我輩豈可美食安寢及太子被害不勝哀痛年七十卒於家前同知太常禮院張載卒載舉進士調雲巖令以敦本善俗為先每月吉具酒食召鄉人高年會縣庭親勸酬之使人知養老事長因訪民疾苦及告所以訓戒子弟之意為崇文校書與王安石不合移疾家居與諸生講學以易為宗以中庸為體以孔孟為法黜怪妄辨鬼神其家昏喪葬祭率用先王之意而傅以今禮又論定井田學校之法皆欲條理成書使可舉而措諸事業有志未就而卒翰林學士許將等乞加贈恤詔賜館職半賻載學古力行為關中士人宗師世稱為橫渠先生所著有正䝉東西銘行於世程頥謂西銘明理一而分殊擴前聖所未發與孟子性善養氣之論同功十二月壬午詔改明年為元豐甲申以郊祀文武官加恩丁亥封子傭為均國公司馬光以書與吳充言今日救天下之急保國家之安茍不罷青苗免役保甲市易息征伐之謀而欲求其成效是猶惡湯之沸而益薪鼓槖也欲去此五者必先别利害以悟人主之心欲悟人主之心必先開言路今病雖已深猶未至膏肓失今不治遂為痼疾矣充代王安石為相知天下不便新法欲有所變更嘗乞召還光及吕公著韓維蘇頌又薦孫覺李常程皓等十數人皆安石所斥退者故光遺以此書而充不能用光亦竟不起是嵗江淮兩浙發運副使德清盧秉奏計京師帝問曰聞滁和民捕蝗充食有之乎秉對曰有之民饑甚死者相枕藉帝慘然曰前此獨趙抃為朕言之耳先是發運司入奏多獻羡餘以希恩秉獨以錢七十萬緡償三司舊負因言發運司但督六路財武以時上之本無羡今稱羡者率正數也乞遂禁絶帝嘉納之秉未冠時嘗謁蔣堂坐池亭堂曰亭沼粗商日恨林木未就耳秉曰亭沼如爵位時來或為之林木非培植根株弗成甚似士大夫立名節也堂賞味其言曰吾子必為佳器元豐元年春正月庚戍詔河北轉運司令所在長吏禱名山靈祠以旱故也戊午命判太常寺陳襄集賢校理黃履李清臣王存詳定郊廟奉祀禮文帝嘗詢天地合祭是非履對曰本朝冬至祭天南郊夏至祭地北郊每嵗行之皆合於古猶以有司攝事為未足以盡志於是三嵗一郊而親行之所謂因時制宜者也施之於今誠不可易惟合祭之非在所當正然今日禮文之失非獨此也願敕有司正羣祀為一代損益之制於是遂置局詳定命履董之履邵武人也權發遣三司使李承之言近年朝廷寬假資格稍高之人為其衰遲或不任事未欲遽令休退故置提舉管勾宫觀之職不立員數而臣僚趨間貪祿冒居無恥或精神未衰便私避事亦求此職乞今後在京宫觀毋得過十五員諸路倍之如有除授令依例待闕詔自今陳請宫觀者年六十以上聽差仍毋過兩次庚申御宣德門召從臣觀燈乙丑以太皇太后疾驛召天下醫者閏月辛巳以翰林侍讀學士提㸃中太一宫吕公著兼端明殿學士知審官院戊子以監察御史裏行彭汝礪為江南東路轉運判官辭日上疏論時事言今不患無將順之臣患無諫諍之臣不患無敢為之臣患無敢言之臣帝察其忠慰諭久之己丑詔贈尚書令韓琦依趙普故事三省長官尚書令為尤重贈者必兼他官唯普與琦乃單贈至是又詔雖當追策不更加師保蓋貴之也壬辰以樞密直學士知開封府孫固同知樞密院事初固言王安石不可為宰相及新法行數議事不合出補外至是帝思其先見召知開封遂大用之己亥太傅兼侍中致仕曾公亮卒恩禮視韓琦始諡忠獻禮官劉摯駁曰丞相居三事不聞薦一士安得謂忠家纍千金未嘗濟一物安得謂獻衆不能奪改宣靖配享英宗庭御篆其碑首曰兩朝顧命定策亞勳之碑公亮謹畏周密然性吝嗇殖貨至巨萬力薦王安石以間韓琦更張庶事不能救正持祿固寵為世所譏簽書樞密院曾孝寬以父憂罷庚子日中有黑子如李凡十九日乃散庚戍濮國公宗誼薨甲寅弟宗暉襲封濮國公戊辰詔赦安南戰棹都監楊從先等仍論功行賞三月辛巳慮囚降死罪一等杖以下釋之御邇英閣黃履進講周禮八柄帝曰坐而論道謂之王公而八柄非太宰所得與何也履曰八柄以馭羣臣馭者主道也故非太宰所與帝曰善考異宋史神宗紀云沈季長進講周禮八法按太宰之職唯八柄八統言詔王故曰非太宰所得與若八法則太宰自主之矣紀誤無疑黃履傳不載此事其為履與季長未知孰是今姑從續資治通鑑壬午吕公著讀後漢書畢帝留公著極論治體至三皇無為之道釋老虛寂之說公著問帝曰此道高逺堯舜能知之乎帝曰堯舜豈不知公著曰堯舜雖知之然常以知人安民為難此所以為堯舜也帝又論前世帝王曰漢高祖武帝有雄材大略高祖稱吾不如蕭何吾不如韓信至張良獨曰吾不如子房蓋以子房道高尊之故不名公著曰誠如聖諭帝又曰武帝雖以汲黯為戇然不冠則不見後雖得罪猶以二千石祿終其身公著曰武帝之於汲黯僅能不殺而已帝又言唐太宗能以權智御臣下公著曰太宗所以成帝業者以能屈己從諫耳帝臨御日久羣臣畏上威嚴莫敢進規至是聞公著言竦然敬納之癸未詔內外文武官各舉堪應武舉者一人廣南西路經略司乞教閲峒丁從之乙未御崇政殿閲諸軍辰沅猺賊冦邊州兵擊走之夏四月辛亥高麗遣使詣遼乞賜鴨渌江以東地不許丙辰詔增置兩浙路提舉官庚申詔除九經外餘書不得出界癸亥太白晝見乙丑封虢國公宗諤為豫章郡王丙寅曹村決河口塞戊辰詔名其掃曰靈平五月甲戍朔賜塞河役死家錢六月癸卯朔日有食之甲辰夜東南有光燭地大星出匏瓜裂於內階聲如雷乙巳詔以靈平掃功遷太常博士苗師中等各一官是月開封鞫相州民訟事連判官陳安民安民嘗以相州坐失入死罪屬其甥大理評事文及甫求援於吳充之子安持及甫充壻也知諫院蔡確言事關大臣非開封可了遂移御史臺時獄起皇城卒事多不讎中丞鄧潤甫御史上官均按之與府獄同王圭奏遣確詣臺參治確煆鍊為獄潤甫均密奏確慘掠諸囚確伺知之即劾二人庇有罪又任殘賊吏日引諸囚如使者慮問狀囚稱寃輒苦辱之帝頗疑其濫遣諫官黃履內侍李舜舉審覆囚不知為詔使無敢一辭異於是皆抵罪而潤甫均並罷確遂代潤甫為中丞吳充上表乞罷相及闔門待罪者三四帝遣中使召令出視事確屢率言事官登對言罪陳安民太輕帝曰此何足深罪卿輩但欲共攻吳充去之是何意也以確彈劄還之言者乃已秋七月癸酉朔以西上閣門使韓存寶為忠州團練使經制瀘州納溪夷初納溪寨民與羅茍夷競魚誤殺夷人吏為按驗夷忿謂漢殺吾人官不償我骨價反暴露之遂叛犯納溪寨提㸃刑獄穆珦言納溪去瀘一舍羅茍去納溪數里今託事起端若不加誅則烏蠻觀望為害不細故有是命丁酉御史黃亷言前嵗科場逐經發解人數不均乞於逐經內各定取人分數均收所長以専士習詔自今在京發解并南省考試詩書易各取三分周禮禮記通取二分己亥詔齊州預備水災庚子吕公著上疏曰曹村掃決聖心惻然即議閉塞功未踰時而有成患不閲嵗而尋弭實由陛下至誠愛物之心天相神助殆非人力近日數起詔獄有司酷於煆鍊比至臨決多從末減昔于定國一郡決曹耳猶以陰德有報况於萬乘之尊固宜受福無疆施于萬世然臣願陛下親正士距壬人必有忍以濟事功推內恕以及人物于以崇起忠厚保合太和則易所謂自天祐之吉無不利詩所謂干祿百福子孫千億者蓋將以類而應未幾公著入對帝迎謂曰覽卿所奏深得人臣進規之義時獄犴寖蕃而帝繼嗣不廣公著辭順而意婉故嘉納之八月癸卯蕃將訥兒溫祿尊謀叛伏誅方鬼章犯境時列帳納兒溫及祿尊率部族叛附之既來降又隂與董氊通事聞詔知岷州种諤集酋長斬之以妻女田産賜包順丁未詔河北被水者蠲其租己巳詔濱棣滄三州被水民以常平糧貸之庚午詔青齊淄三州給流民食九月癸酉交趾來貢癸未李乾德表乞還廣源等州縣詔不許乙酉以端明殿學士戶部侍郎吕公著樞密直學士工部侍郎薛向並同知樞密院事公著既就職與同列奏事畢獨留謝因言自熙寧以來朝廷論議不同端人良士例為小人排格指為沮壞法度之人不可復用此非國家之利也願陛下加意省察帝曰然當以次收用之向幹局絶人尤善商財計算無遺策然不能無病民所上課間失實時方尚功利王安石從中主之御史數有言不聽也向以是益得展奮至於論兵帝所通暢明決遂由文俗吏得大用其事公著甚恭既久公著亦稍親之議事頗相左右詔祀天地及配帝並用特牲冬十月甲辰命元絳參定傳法院新編法寶録考異玉海太平興國五年作譯經院八年改譯經院為𫝊法院大中祥符六年參政趙安仁等纂集新經并所降制詔賜名祥符法寶録御製序賜之景祐三年詔續修法寶録四年吕夷簡上所定景祐法寶新録請御製序元豐元年十月甲辰命參政元絳參定𫝊法院新編法寶録按𫝊法者院名也法寶録者書名也宋史神宗紀於元豐二年六月戊申書曰命蔡確參定編修傳法寶録以新編為編修合院名於書名誤矣且元絳蔡確兩次參定例當並書不應記後而遺前今據玉海第五十八卷及第二百六十八卷於元年補書絳之參定而二年則正紀之誤焉庚戍定秋試諸軍賞法辛亥韓存寶召烏蠻酋乞弟等共擊羅茍蕩五十六村十三囤乞弟斧望箇恕之子也初韓絳曾布嘗建議復肉刑至是復詔輔臣議吕公著曰後世禮教衰而獄訟繁肉刑若復將有踊貴屨賤之譏或欲劓刖死囚以試之公著曰不可試之不死則此法遂行矣議遂寢十一月己丑命宋敏求等詳定正旦御殿儀注癸巳辰州猺賊叛詔沅州兵討之己亥罷文武功臣號十二月辛丑朔詔提舉司天監集厯官考算遼高麗日本厯與本朝奉元厯同異聞奏其後厯官趙延慶等言遼己未年氣朔與宣明厯合日本戊午年氣朔與遼厯相近高麗戍午年朔與奉元厯合其二十四氣內有七氣時刻并逐月太陽過宫日數時刻不同丙午日中有黑子如李凡十三日乃散辛亥録囚降死罪一等杖以下釋之丙辰詔青州民王贇以復父讐免死刺配鄰州戊午復置大理獄帝謂國初廢大理獄非是詔曰京師官寺凡有獄皆繫開封府司録司及左右軍巡三院囚逮猥多難於隔訊又暑天瘐死者衆因緣流滯動涉嵗時參稽故事宜屬理官可復置大理獄於是中書言應三司及寺監等公事除本司公人杖笞罪非追究者隨處裁決餘並送大理獄結斷置卿一人少卿二人丞四人専主推鞫從之己未詔罷都大提舉在京諸司庫務司甲子以婉容邢氏為賢妃詔罷三司推勘公事官帝每憤契丹倔强侵侮有復幽燕之志即景福殿庫聚金帛為兵費是嵗始更庫名自製詩以揭之曰五季失圖玁狁孔熾藝祖造邦思有懲艾爰設內府基以募士曾孫保之敢忘厥志凡三十二庫後積羡贏又揭以詩曰每䖍夕惕心妄意遵遺業顧豫不武姿何日成戎捷帝將有事於幽燕已與大臣定議乃詣慶壽宫白其事太皇太后曰儲蓄賜豫備乎鎧仗士卒精乎帝曰固已辦之矣后曰事體至大吉凶悔吝生乎動得之不過南面受賀而已萬一不諧則生靈所繫未易以言茍可取之太祖太宗收復久矣何待今日帝曰敢不受教二年春正月癸酉遼賜北府宰相耶律孝傑名仁傑遼主嘗宴羣臣謂曰先帝用仁先化葛以賢智也朕有孝傑乙辛不在仁先化葛下誠為得人歡飲至夜乃罷及乙辛誣陷太子并按太子黨人孝傑之謀居多至是乙辛薦孝傑忠於社稷遼主以為然謂孝傑可比狄仁傑賜名仁傑仍許放海東青鶻仁傑久居相位黷貨無厭時與親戚會飲言無百萬兩黃金不足為宰相家乙亥罷岢嵐火山軍市馬丙子詔立高麗交易法癸未詔知沅州謝麟督捕徭賊甲申御宣德門觀燈丁亥詔以經義論試宗室甲午京兆府學教授蔣夔言春秋釋奠以孔子為先聖顔子為先師先聖先師肆祭器實牲體盥水灌爵奠幣讀祝曾無少異而九人之像坐於兩旁樽酒豆肉不及乞下臣議於禮官薦享祝獻顔子降於孔子九人降於顔子以正開元之失禮禮官言孔子顔子稱號歷代各有據依難輒更改儀物祝獻亦難隆殺檢會熙寧祀儀十哲皆為從祀各設籩二豆二俎簠簋爵各一命官分獻一奠而止乞自今二京及諸州文宣王廟十哲像春秋釋奠並準熙寧祀儀從之詔辰州溆浦縣置龍潭堡二月甲寅日中有黑子如李凡十日乃散罷程皓判武學皓自知扶溝縣召除是職數日即罷以御史中丞李定言皓學術迂闊趨向僻異故也吕公著上疏曰臣向輒論及判别忠邪之道大抵小人之害君子必求要切之語以中之使不能自解陛下頗賜開納近日除程皓判武學命下數日復因言者罷去則知臣前所陳者其風猶未殄也况如皓者其立身行道素有本末講學論議久益疏通使得復見用於聖世其奮身報國未必在時輩之後兼所除武學差遣亦未為仕宦要津而小人斷斷必以為不可者直欲深梗正路廣沮善人其所措意非特一二人而已疏奏不納皓還任扶溝廣濟蔡河在縣境瀕河惡子無生理専脅取行舟財貨嵗必焚舟十數以立威皓捕得一人使引其類得數十人不復根治舊惡分地而處之使以挽舟為業且察其為惡者自是縣境無焚剽之患內侍都知王中正按閲保甲權焰熾盛諸邑競侈供張以恱之主吏以請皓曰吾邑貧安能效它邑且取於民法所禁也獨有令故青帳可用耳嵗餘中正往來境上卒不入尋坐獄逸囚責監汝州酒稅考異劾程皓罷判武學者或以為李定或以為何正臣按宋史李定何正臣吕公著傳並不載此事東都事略李定吕公著程皓傳亦無之今據宋史程皓傳作李定烏蠻乞弟率步騎六千至江安城下責平羅茍之賞城中守兵才數百震恐不能授甲數日蠻乃引去乙卯詔王光祖等討之考異宋史蠻夷傳此事紀繫元豐元年今從神宗丙辰詔定解鹽嵗額先是解鹽分東西西鹽賣有分域又並邊州軍市芻糧給鈔過多故鈔及鹽甚賤官價自分為二乃增西鹽價比東鹽以平鈔法嵗約增十二萬緡毋復分東西悉廢西鹽約束解池鹽鈔舊以二百二十萬緡為額轉運使皮公弼請增十萬以助邊糴至是又為二百四十二萬商人已請西鹽令加納錢使與新法價平乙丑滄州饑發倉粟賑之三月庚午朔董氊遣使來貢庚辰親試禮部進士壬午試特奏名進士及武舉癸未賜董氊緡錢銀帛對衣金帶等物丙戌詔雄州兩輸戶南徙者諭令復業庚寅命入內供奉宋用臣為都大提舉導洛通汴使以西頭供奉官張從惠言洛水可引入汴知都水監丞范子淵又畫十利以獻故也癸巳御集英殿賜進士明經諸科開封時彥以下及第出身同出身同學究出身總六百二人夏四月幸金明池觀水嬉宴射瓊林院己未檢校太尉同平章事鎮江軍節度使致仕陳升之卒贈太保中書令諡成肅癸亥宋敏求等上正旦御殿儀二篇令式四十篇詔頒行之甲子興工疏汴洛遣禮官祭告河道侵民冡墓給錢徙之無主者官為瘞藏知審刑院安燾言天下奏案益多於往時自熙寧八年減議官斷官力既不足故事多疏謬詔增詳議詳斷官各一員罷刑部校法官五月丙子順氏蠻叛峒兵討平之庚辰詔曰濮安懿王先帝斟酌典禮即園立廟詔王子孫嵗時奉祀義叶恩稱後世無得而議今王夫人名位或未正塋域或異處有司置而不講曷足以彰先帝甚盛之德仰承在天之志乎三夫人可並稱曰王夫人命有司擇嵗月遷祔濮園俾其子孫以時奉主與王合食而致孝思焉辛巳太子太師致仕趙槩上所集諫林百二十卷帝賜詔曰請老而去者類以聲問不至朝廷為高唯卿有志愛君雖退處山林未嘗一日忘也當置於坐右時用省閲甲申元絳罷初王安石更學校法令判監直講程第諸生所業處以上中下三舍人間傳謂凡試中上舍者朝廷當以不次升擢一時輕薄諸生矯飾言行奔走公卿之門於是太學生虞蕃伐登聞鼓訟學官去取不公事下御史臺辭連絳子耆寧嘗囑其從孫伯虎於直講孫諤葉唐懿得升補內舍生又囑諤求判監黃履以伯虎為小學教諭臺司捕耆寧下獄絳請納還職祿而容耆寧即訊於外許之於是御史至第薄責絳絳一不自辨罷為工部侍郎知亳州而耆寧罰金諤等坐聽請皆得罪絳入辭帝猶眷絳曰朕知卿一嵗即召矣卿意欲陳訴乎絳謝曰願得潁遂改知潁州乙酉詔安南軍死事孤寡廩給之戊子以權御史中丞直學士院判司農寺蔡確參知政事確善觀人主意與時上下以王安石薦再調監察御史因為之用知帝已厭安石因安石乘馬入宣德門與衛士競即疏其過以賈直文彥博言濬川杷非濬河之具帝遣知制誥熊本行視以彥博言為是確遂論本附彥博本坐罷確因代其職改知諫院判司農寺復覬得臺端因論中丞鄧潤甫御史上官均按獄失實潤甫均皆罷而確得中丞猶領司農凡常平免役之法皆成其手及虞蕃事起確與御史舒亶深探其獄連引朝士自翰林學士許將至元絳子耆寧以下皆逮捕械繫令獄卒與同寢處飲食旋溷共為一室設大盆於前凡羮胾飯餅舉投其中以杓混攪分飼之如犬豕久繫不問幸而得問無一事不承遂劾絳使去而代其位確自諫院歷參政皆以起獄奪人位而居之士大夫交口唾罵而確自以為得計也時吳充數為帝言新法不便欲稍去其甚者確爭曰曹參與蕭何有隙至代為相一遵何約束今陛下所自建立一人協相而成之一人挾怨而壞之民何所措手足乎充屢屈法遂不變六月甲辰廣西捕斬儂智春執其妻子以獻戊申命蔡確參定傳法院新編法寶録考異見元年癸丑詔五路帥臣副總管軍臣僚各舉任將領及大使臣者二人甲寅清汴成自任村沙口至河陰縣瓦亭子并凡水關北通黃河接運河長五十一里兩岸為堤總長一百三里引洛水入汴考異甲寅宋史河渠志作戊申今從神宗紀辛酉追封魏國公宗懿為舒王資治通鑑後編卷八十三
