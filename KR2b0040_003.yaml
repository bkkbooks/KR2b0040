body:
  text: 資治通鑑後編卷三刑部尚書徐乾學撰宋紀三起𤣥黓閹茂七月盡昭陽大淵獻十二月凡一年有竒太祖啓運立極英武睿文神德聖功至明大孝皇帝建隆三年秋七月己未禁諸州中元張燈壬戌放唐降卒弱者數千人歸國乙丑知舒州左諫議大夫馮瓚言州界有菰蒲魚鱉之利居民舊以自給前防禦使司超增收為市征漁奪苛細疲俗告病宜蠲除其稅從之文思使常岑子勳詐稱供奉官為泗州長史所覺捕送闕下乙亥斬勳於東市先是雲捷軍士有僞刻侍衛司印信者捕得斬之帝曰諸軍比加簡練尚如此不逞耶命搜索悉配沙門島於是姦猾斂迹詔朝臣出使還日具所見民生利病以聞右衛率府率薛勳掌常盈倉受民租槩量重詔免勳官配𨽻沂州倉吏棄市考異李燾曰舊録以為二年事今從新録八月丙戌朔敕大理卿劇可久為光祿卿致仕可久年逾七十無請老意帝特命之考異李燾曰新録云可久懇求休退國史亦同今從㑹要庚寅以鎮海鎮東節度副使錢惟濬為建武節度使惟濬吳越王俶子也俶請授以嶺南旄鉞帝從之癸巳蔡河務綱官王訓等四人坐以糠土雜軍糧磔於市是日遣引進使郭承遷會知秦州吳延祚率兵往尚書寨驅蕃族歸本部乙未左拾遺知制誥高錫上言近廷臣承詔各舉所知或有因行賂獲薦者請自今許近親奴婢鄰里告訴加以重賞又請注授法官及職官各宜問書法十條以代試判皆施行之詔及第舉人不得呼知舉官為恩門師門及自稱門生九月戊午天平節度使侍衛馬步軍都指揮使同平章事石守信表解軍職許之特加爵邑庚午吐蕃尚頗裕獻伏羌縣地壬申修武成王廟癸酉以百官次對章奏下尚書省集丞郎以上及御史中丞兩省五品以上參詳其有禆政治者以聞禁民伐桑棗為薪又詔黃汴河兩岸每歲委所在長吏課民多栽榆柳以防河決癸未復置書判拔萃科考異宋史太祖本紀于八月乙未即書舉此科今從宋實録及長編蓋乙未始令有司條奏而施行固在癸未也甲申武安節度使兼中書令周行逢病革召將吏屬其子保權曰衡州刺史張文表與吾同起隴畝文表朗州人初見廣順二年以不得行軍司馬志常怏怏吾死必為亂當令楊師璠討之行逢卒保權領軍務時年十一考異路振九國志保權以九月襲位十國紀年亦繫之九月而太祖實録乃於十月乙未書行逢卒蓋以奏到之日書也今從紀年九國志李燾長編言行逢崇信釋氏廣度僧尼齊懴不輟每見僧無老少輒拜之捧匜執帨親為煎洗因謂左右曰吾殺人多矣不假佛力何以解其冤乎按五代宋史十國春秋諸書俱不言行逢佞佛惟云保權大㑹齊僧見被緇之輩雖三尺童子必搶地伏拜今不取李氏之說冬十月丙戌幸造船務觀習水戰戊子以棣州團練使何繼筠為關南兵馬都監癸巳班循資格及長定格編敕格各一卷己亥幸嶽臺命諸軍習騎射廣濟縣令李守中坐贓決杖配沙門島辛丑以樞密副使兵部侍郎趙普為檢校太保充樞密使樞密使不帶正官自普始張文表聞周保權立怒曰我與行逢俱起微賤立功名安能北面事小兒乎會保權遣兵更戍永州路出衡陽文表遂驅以叛保權即命楊師璠悉衆討文表告以先人之言感激泣下師璠亦泣顧謂其衆曰汝見郎君乎未成人而賢若此軍士皆奮保權又乞師荆南且來求援文表亦上疏自理考異李燾曰據渤海行年紀張文表攻下潭州在當年十月而國史周保權傳乃云明年春蓋誤也按實録十二月甲辰巳遣趙璲持詔宣諭文表豈得却在明年春始叛蓋明年正月文表尚據潭州耳辛亥畋近郊十一月癸亥詔縣令考課以戶口增減為黜陟甲子大閲於西郊帝謂近臣曰晉漢以來衛士不下數十萬然可用者極寡朕頃按籍閲之去其冗弱親校其擊刺騎射之藝今悉為精鋭矣唐遣水部郎中顧彝來貢考異宋史在丙寅日南唐書無日今從長編荆南節度使高保朂寢疾召牙內都指揮使梁延嗣曰我疾遂不起兄弟孰可付後事者延嗣曰先王舍其子繼沖以軍府付公今繼沖長矣保朂曰子言是也即以繼沖權判內外軍馬事甲戌保朂卒考異九國志保朂卒于明年非是東都事略是月癸亥卒亦誤也渤海行年紀卒于十一月二十日長編從之今取其說壬午頒建隆四年厯於唐十二月丙戌左贊善大夫段昭裔坐檢視民田失實責授海州司法參軍丁亥以武平節度使副使權知朗州周保權為武平節度使舊制强盜贓滿十匹者絞庚寅詔改為錢三千足陌者處死癸巳詔縣復置尉一員在主簿下凡盜賊鬭訟先委鎮將者命令與尉領其事自萬戶至千戶各置弓手有差五代以來節度使補署親隨為鎮將與縣令抗禮凡公事專逹於州縣吏失職至是還統於縣鎮將所主不及鄉村但郭內而已從樞密使趙普言也考異按宋史太祖紀是月丙戌詔縣置尉一員理盜訟置弓手視縣戶為差當即此事而月不同今從長編戊戌蒲晉慈隰相衛六州饑詔所在發廪振之庚子班捕盜令給以三限限各二十日第一限內獲者令尉各減一選獲踰半者減兩選第二限內獲者各超一資踰半超兩資第三限內獲者令尉各加一階踰半加兩階過三限不獲尉罰一月俸令半之尉三罰令四罰皆殿一選三殿停官令尉與賊鬭而盡獲者並賜緋尉除令仍超兩資令别加升擢甲辰遣中使趙璲等賫詔宣諭潭朗聽張文表歸闕且命荆南發兵助周保權帝以西鄙羌戎屢為冦改虢州刺史姚內斌為慶州刺史內斌初見顯德六年四月是嵗遷周鄭王於房州考異按東都事略新舊實録李燾長編宋史皆云建隆三年出居房州不載月日惟陳桱通鑑續編繫於是年冬十月王薛通鑑皆因之至王皥唐餘録以為開寶三年則誤矣河北陜西京東諸州旱蝗悉蠲其租刑部尚書邊歸讜授戶部尚書致仕富弼曰唐李靖功高當世自僕射告老止加特進近歲大臣致仕於三公三師之位加三五資不知是何典故三公三師惟大勳全德始可居今因致仕而超拜若别有大勳不知何位待之蜀主命官追督四鎮十六州逋稅龍游令田淳上疏諫曰今甲子欲交隂陽變動天運人事合有改更如采厚斂之末議必亂經國之大倫又言四海財貨盡屬至尊百姓足則君莫不足今務奪百姓專贍六軍非本計也蜀主不能用淳謂所親曰吾觀僭僞紛紛改制妃后妻妾卿相僚佐何如常稱成都尹乃無滅族之禍乎或勸淳遜詞抑節以取貴仕淳曰吾安能附狗鼠求進哉蓋指樞密使王昭逺輩也昭逺初見乾祐元年南漢許彥真既殺鍾允章益恣橫惡龔澄樞等居已上頗侵其權澄樞怒㑹有告彥真與先主李麗妃私通者澄樞發其事彥真懼與其子謀殺澄樞澄樞使人告彥真謀反下獄族誅久章見乾祐元年彥真初見顯德六年南漢主納李托二女長為貴妃次為美人皆有寵拜托為內太師政事必先禀托而行托初見顯德六年乾德元年春正月甲寅朔不御殿丁巳發近甸丁夫數萬修築畿內河堤庚午以慕容延釗為湖南道行營都部署樞密副使李處耘為都監發兵會襄陽以討張文表先是盧懷忠使荆南帝謂曰江陵人情去就山川向背吾盡欲知之懷忠使還報曰繼沖控弦之士不過三萬年穀雖登民困於暴斂其勢日不暇給取之易耳於是帝召宰相范質等謂曰江陵四分五裂之國今假道出師因而下之蔑不濟矣遂以成算授處耘等癸亥命太常卿邊光範權知襄州户部判官滕白為南面軍前水陸轉運使乙丑幸造船務觀造戰船丙寅以張勳為南面行營馬軍都監盧懷忠為步軍都監丙子詔荆南發水兵三千人赴潭州考異宋史作甲戌今從長編庚辰以高繼沖為荆南節度使楊師璠之討張文表也兵稍失利相持既久文表出戰師璠大敗之遂取潭州執文表初文表聞王師來伐潛送欵於趙璲璲遣使撫慰之指揮使高超語其衆曰觀中使之意必活文表若文表至闕圖害朗州吾輩無遺類矣乃斬文表於市考異宋史云二月壬辰臬文表于朗陵市今從長編臠食其肉初命文臣知州事懲五代藩鎮彊盛之弊也時異姓王及𢃄相印者不下數十人至是用趙普謀漸削其權或因其卒或因遷徙致仕或遙領他職皆以文臣代之二月甲申朔翰林學士中書舍人王著責授比部員外郎著不拘細行嘗乘醉宿倡家為巡吏所執既知而釋之密以事聞帝置不問於是宿直禁中夜叩滋德殿求見帝令中使引升殿近燭視著著大醉垂髮被面帝怒發前事黜之御史中丞劉溫叟等並坐失於彈劾奪兩月俸丙戌天雄節度使符彥卿來朝帝欲使典兵趙普以為彥卿名位已盛不可復委以兵柄屢諫不聽宣已出普復懷之請見曰惟陛下深思利害勿復悔帝曰卿苦疑彥卿何也朕待彥卿至厚彥卿豈能負朕普曰陛下何以能負周世宗帝默然事遂中止高繼沖自以年幼未知民事刑政賦役委節度判官孫光憲軍旅調度委衙內指揮使梁延嗣謂曰使事事得中人無間言吾何憂也李處耘至襄州先遣閣門使丁德裕喻繼沖以假道之意請具薪水給軍兵馬副使李景威說繼沖曰王師雖假道以收湖湘恐因而襲我願假兵三千設伏荆門險隘處候其夜行發伏擊之繼沖不聽曰吾家纍嵗奉朝廷必無此事光憲曰景威峽江一民耳安識成敗且中國自周世宗時已有混一天下之志聖宋受命凡所措置規模益宏逺今伐文表如以山壓卵爾湖湘既平豈有復假道而去耶不若早以疆土歸朝廷則荆楚免禍公亦不失富貴繼沖以為然景威知計不行出而歎曰大事去矣何用生為因扼吭而死繼沖遣延嗣與其叔父保寅奉牛酒來犒師且覘師之所為壬辰師次荆門處耘見延嗣等待之有加延嗣喜馳使報繼沖以無虞荆門距江陵百餘里是夕延釗召延嗣等宴飲於其帳處耘密遣輕騎數千倍道前進繼沖但俟保寅延嗣之還遽聞大軍奄至即惶恐出迎遇處耘於江陵北十五里處耘揖繼沖令待延釗而率親兵先入登北門比繼沖與延釗俱還王師已分據衝要布列街巷矣繼沖大懼江陵志餘云宋兵入城繼沖以轎覆井紿內人入輿多墜井死遂盡籍其三州十七縣十四萬二千三百戶奉表來歸癸巳我師既收荆南益發兵日夜趨朗州周保權懼召觀察判官李觀象觀象初見廣順元年謀之觀象曰文表已誅而王師不還必將盡取湖湘之地今高氏束手聽命唇齒既亡朗州勢不獨全莫若幅巾歸朝幸不失富貴保權將從之指揮使張從冨等不可乃相與為距守計庚子荆南表至帝復命高繼沖為荆南節度使遣樞密承㫖王仁贍赴荆南巡檢上聞李景威之謀曰忠臣也命仁贍厚恤其家帝遣使諭周保權及將校曰大軍既拯爾難何為反距王師自取塗炭保權不答遂進討之慕容延釗大破其軍於三江口遂取嶽州考異李燾曰實録于三月初八日始書此蓋用延釗奏到日也然取嶽州當在二月末今移入而不書日十國紀年亦繫之二月是月遣使往澶滑魏晉絳蒲孟開倉賑貸三月張從富等出軍澧州南與我師遇未及戰望風先潰李處耘逐北至敖山寨賊棄寨走俘獲甚衆賊縱火焚州城奔竄山谷壬戌我師入朗州擒從冨梟其首周保權匿僧舍處耘遣麾下捕之遂獲保權以歸荆南平凡得州十四監一縣六十六户九萬七千三百八十八命户部侍郎吕餘慶權知潭州癸酉吏部尚書張昭等詳定五刑之制凡流刑四徒杖笞刑各五令州縣復置義倉官所收二稅每石别輸一斗貯之以備凶儉夏四月甲申減荆南潭朗州死罪囚流以下釋之配役人放還蠲三年以前逋稅及場院課利初置諸州通判凡軍民之政皆統治之事得專逹與長吏均體大州或置二員又令節鎮所領支郡皆直𨽻京師得自奏事不屬諸藩於是節度使之權益輕用趙普之言也庚寅出內府錢募諸軍子弟數千人鑿池於朱明門外引蔡水注之造樓船百艘選卒號水虎捷習戰池中考異按續通鑑言選卒習戰池中非以習戰為池名也宋史云出內錢募諸軍子弟鑿習戰池非是辛卯王處訥上新定建隆應天厯帝製序頒行之丙申兵部郎中曹匪躬棄市海陵鹽城屯田副使張藹除名並坐令人齎輕貨往江南兩浙販易故也戊戌符彥卿辭歸鎮以華州團練使張暉為鳳州團練使兼西面行營巡檢壕寨使暉前在華州治有善狀帝既誅李筠將事河東召暉入覲問以計䇿暉曰澤潞瘡痍未起軍旅薦興民不堪命當俟富庶後圖之帝慰勞遣還於是始謀伐蜀乃徙暉鳳州暉盡得其山川險易密疏進取之計帝覽之甚悅清源留後張漢思年老不能治軍務事皆决於副使陳洪進漢思患其專乃設燕伏甲將殺之酒數行地忽大震同謀者懼以告洪進洪進亟出甲士皆散漢思由是嚴兵備洪進一日洪進袖大鎖常服安步入府中叱去直兵漢思方處內齊洪進即鎖其門謂之曰軍吏以公耄荒請洪進知留務衆情不可違當以印見授漢思錯忤不知所為乃自門扇間授印與之洪進遽召將吏告之曰漢思昏耄不能為政授吾印矣將吏皆賀即日遷漢思外舍以兵守之遣使請命於唐又遣牙將魏仁濟間道奉表來告且請制命漢思退居數年以壽終考異李燾曰徐鉉江南録并九國志載洪進遣使告李煜煜即以洪進為清源節度使國史因之按煜傳載上表乞寢洪進恩命安得便自除洪進節度使也今不取國史又稱荆湖平洪進懼始遣魏仁濟按洪進既奪漢思印即遣仁濟告於朝不緣平荆湖也慕容延釗言辰錦溪叙等州各奉牌印請命甲辰詔重鑿砥柱三門禁涇原邠慶州不得補蕃人為沿邊鎮將乙巳幸玉津園閲諸軍騎射辛亥令諸州造輕車以給餽運五月壬子朔慕容延釗言唐主遣使以牛酒來犒師己未鳯翔節度使王景卒諡元靖辛酉命尚書左丞高防權知鳳翔府乙丑命鐵騎都將李懷義內班都知趙仁璲增修宫闕既成帝坐正殿令洞開諸門直望之謂左右曰此如我心小有邪曲人皆見之考異富弼三朝寶訓載在建隆三年九月前諸史皆因之不知正月命有司畫洛陽宫殿按圖修治五月始大治宫闕倣西京制至是始落成故帝坐正殿而有是言也當從長編不應入前戊辰以工部侍郎文頴為戶部侍郎致仕帝命執政擇廷臣督在京諸倉頴與焉頴自以清望官不宜親濁務辭不肯為帝曰惟致仕乃可免耳頴遂諸老頴初見顯德五年蜀宰相李昊言於蜀主曰臣觀宋氏啓運不類漢周天厭亂久矣一統海內其在此乎若通職貢亦保安三蜀之長䇿也考異按十國春秋此語在建隆元年十一月今從長編蜀主將發使樞密使王昭逺固止之乃以文思使景處塘等率兵屯峽路又遣使往涪瀘戎等州閲櫂手增置水軍六月乙酉詔免潭州諸縣無名配斂壬辰以大暑罷京城營造賜工匠衫履初帝幸武成王廟歷觀兩廊所畫名將以杖指白起曰起殺已降不武之甚何為受饗於此命去之左拾遺知制誥高錫因上疏論王僧辨不克善終不宜在配饗之列乃詔吏部尚書張昭工部尚書竇儀與錫别加裁定取功業始終無瑕者癸巳昭等議升漢灌嬰後漢耿純王霸祭遵班超晉王渾周訪宋沈慶之後魏李崇傅永北齊段韶後周李弼唐秦叔寶張公謹唐休璟渾珹裴度李光顔李訴鄭畋梁葛從周後唐周德威符存審凡二十三人退魏吳起齊孫臏趙亷頗漢韓信彭越周亞夫後漢段紀明魏鄧艾蜀關侯張飛晉杜元凱陶侃北齊慕容紹宗梁王僧辨陳吳明徹隋楊素賀若弼史萬嵗唐郭元振李光弼王孝傑張齊邱凡二十二人詔塑齊相管仲像於堂畫魏西河太守吳起於廡下餘如昭等議詔荆南兵願歸農者聽官為葺舍給賜耕牛種食丙申令有司三歲一舉先代帝王祀典各以功臣配饗高辛堯舜禹湯文武漢高祖皆因其故廟又别建漢世祖廟於南陽唐太宗廟於醴泉世祖以鄧禹吳漢賈復耿弇配太宗以長孫無忌房𤣥齡杜如晦魏徴李靖配並畫像廟壁庚子羣臣三上表請舉樂從之己酉命鎮國節度使宋延渥帥禁旅數千習戰於新池帝數臨觀焉庚戌命大理正奚嶼知館陶縣監察御史王祐知魏縣楊應夢知永濟縣屯田員外郎于繼徽知臨清縣常參官知縣自嶼等始也時符彥卿久鎮大名專恣不法屬邑頗不治故特選强幹者往蒞之其後右贊善大夫周渭亦知永濟彥卿郊迎渭揖於馬上就館始與彥卿相見略不降屈縣有盜傷人而逸渭捕獲暴其罪斬之不以送府渭先為白馬主簿縣大吏犯法渭即斬之帝竒其才故擢右贊善大夫考異李燾曰渭知永濟不知何時按實録此年十二月癸亥以主客員外郎董樞知臨濟縣國子博士王仁濟知魏縣王祐與于繼徽到任才半年耳已除替人則楊應夢未必久居永濟或渭即繼應夢之後而實録失不復載也既不的知其月日因附見於此秋七月甲寅以湖南死事靳彥朗男承勳等三十人補殿直監修國史王溥上新修梁後唐漢晉周五代會要三十卷丁巳安國節度使王全斌與洺州防禦使郭進趙州刺史陳萬通登州刺史高行本客省使曹彬等率兵入北漢界獲生口數千人來獻詔釋之彬從母為周太祖貴妃初帝典宿衛尤器重彬彬非公事未嘗造門平居燕會亦罕與帝即位自晉州都監召入見謂曰疇昔我親汝何故踈我彬頓首謝曰臣周室近親列職禁庭安敢交結尊貴帝益嘉奬焉戊午頒量衡於澧朗諸州懲割據厚斂之弊也己未詔民有疾而親屬遺去者罪之丁卯幸武成王廟遂幸新池觀習水戰賜荆南管內民今年夏租之半甲戌周保權詣闕待罪詔釋之以為右千牛衛上將軍乙亥命增築朗州城浚其壕賜管內民今年夏租己卯判大理寺事竇儀等上重定刑統等書詔刋板摹印頒天下儀等參酌輕重時稱詳允北漢宿衛殿直行首王隱劉詔趙蠻等謀叛事覺被誅詞連樞密使段常北漢主出常為汾州刺史尋縊殺之初鈞寵姬郭氏醫僧之女也僧與婺婦通而生姬有殊色鈞將立為妃常以為所出非偶恐貽笑鄰國鈞乃止姬之昆弟姻戚又多抑而不用故咸怨常因譖之死非其罪國人憐焉八月庚子朔詔以冬至有事於南郊既而有司言冬至乃十一月晦前一日皇帝始郊不應近晦請改用十六日甲子詔可考異李燾曰太祖乾德元年初郊有司以冬至迫近晦日請用十一月十六日甲子按章德象所編三朝㑹要初不及此而王圭等所編五朝會要始載近晦事蓋五朝㑹要得之於妣闢所修太常因革禮所載實得之宋敏求春明退朝録云壬午殿前都虞候嘉州防禦使張瓊自殺時軍校史圭石漢卿等方得幸瓊數輕侮之漢卿因譖瓊養部曲百餘人自作威福且毁皇弟光義為殿前都虞候時事帝召瓊面訊之瓊不伏帝怒令擊之漢卿即奮鐡檛擊其首氣垂絶乃曳下御史府按鞫瓊自殺上旋聞其家無餘財止有奴三人甚悔之責漢卿曰汝言瓊部曲百人今安在漢卿曰瓊所養者一敵百耳帝亟命優恤瓊家然亦不罪漢卿考異李燾曰新録及國史并宋白所為瓊傳並云獄具乃賜死於城西井亭今從舊録疑新録與國史及宋白或加潤色也先是龍捷左廂都指揮使馬仁瑀嘗私以士屬知貢舉薛居正居正實不許而陽諾之榜出無其人及聞喜宴日仁瑀乘醉攜所屬士慢罵居正御史中丞劉溫叟劾奏仁瑀帝曲為容忍龍捷右廂都指揮使王繼勳皇后母弟也挾勢驕倨多陵蔑將帥仁瑀獨與抗相忿爭輒攘臂欲毆繼勳繼勳憚其勇頗為屈而怨隙愈深於是受詔都試郊外兩人因欲相圖隂勒所部兵私市白梃上微聞其事即詔罷講武甲申出仁瑀為密州防禦使置繼勳不問以泰州團練使潘美為潭州防禦使南漢人數寇桂陽及江華美擊走之溪洞蠻獠自唐末之亂不供王賦頗恣侵掠為居民患美帥兵深入窮其巢穴斬首百餘級餘黨散潰美悉令招誘貸其罪以已俸市牛酒宴犒賜金帛慰撫之夷落遂定丁亥王全斌復與郭進曹彬等帥師攻北漢樂平縣降其拱衛指揮使王超等北漢將蔚進郝貴超悉蕃漢兵來救三戰皆敗之遂下樂平即建為平晉軍考異路振九國志云郝貴超被擒按貴超明年復戰遼州以為被擒者誤也今從長編平晉軍一作樂平軍今從宋史壬辰詔九經舉人落第者宜依諸科舉人例許再試丙申北漢靜陽等十八寨首領相帥來降泉州陳洪進遣使來貢齊州河决己亥幸造船務遼幽州岐溝關使柴庭翰等來降癸卯宰相范質等率百官上尊號不允是月遼主如近山呼鹿射之旬有七日而後返甲寅羣臣三上表請加尊號曰應天廣運仁聖文武從之高麗國王昭遣使時贊等入貢涉海值大風溺死者九十餘人贊僅而獲免詔勞恤之詔開封府選樂工八百三十人權𨽻太常寺習樂將行郊祀禮也詔諸州府長吏禁以僕從人干預政事丙寅大宴廣政殿始用樂丁卯宣徽南院使兼樞密副使李處耘責授淄州刺史處耘與慕容延釗不協更相論奏帝以延釗宿將赦其過止罪處耘處耘亦恐懼不敢自明丙子詔朝臣無得公薦貢舉人故事每歲知貢舉官將赴貢院臺閣近臣得薦抱才藝者號曰公薦然去取不能無所私至是禁之慕容延釗獲汪端磔於朗州市端初攻州城不克與其黨聚山澤為盜監軍使疑城中僧千餘人謀應端悉捕繫欲誅之薛居正以計緩其事及端被擒詰之僧無與謀者皆得全活北漢主誘遼兵攻平晉軍命郭進張彥進曹彬陳萬通領步騎萬餘往救之未至一舍北漢引兵去考異李燾曰國史契丹傳載此事在杜延韜以遼州來降之後今從新録及本紀癸未令襄州盡索湖南行營諸軍所掠生口遣吏分送其家放潭邵州鄉兵數千人歸農減江陵府民舊租之半翰林學士中書舍人扈䝉以僕夫扈繼逺為從子屬之同年生淮南轉運使仇華使釐務繼逺盜官鹽事發戊申蒙坐奪金紫黜為左贊善大夫魏仁濟以陳洪進表至洪進自稱清源節度副使權知泉南等州聽命於朝帝遣通事舍人王班齎詔撫諭之十一月癸亥饗太廟是夕隂晦至夜分開霽帝初詣太廟乘玉輅左諌議大夫崔頌攝太僕問儀仗名物甚悉頌應對詳敏帝大悅甲子合祭天地於南郊以宣祖配還御明德門大赦改元乾德羣臣奉册上尊號於崇政殿先是帝謂大禮使范質曰中原多故百有餘年禮樂儀制不絶如線今幸時和歲豐克舉禋祀報神資乎備物卿與五使宜講求遣逸遵行典故無或廢墜副朕寅恭之意於是質與陶穀張昭等討尋故事詳定新制曰南郊行禮圗又令司天監定從祀星辰圖上之又言饗廟郊天從祀羣官合前七日受誓戒於尚書省今併於一日受之有虧誠慤望令分日各誓百官並從之將升壇有司具黃褥為道帝曰朕潔誠事天不必如此命撤之還宫將駕金輅顧左右曰於典故可乘輦初有司議配饗請以僖祖升配張昭獻議曰隋唐以前雖追立四廟或六七廟而無遍加帝號之文梁陳南郊祀天皇配以皇考北齊圜丘祀昊天以神武升配隋祀昊天於圜丘以皇考配唐貞觀初以高祖配圜丘梁太祖郊天以皇考烈祖配恭惟宣祖積纍勳伐肇基王業伏請奉以配饗從之丙寅唐主煜遣使來助祭南郊及賀册尊號丁卯詔防禦團練刺史州舊有都督府號者并停仍為上州壬申以南郊禮成大宴廣德殿號曰飲福宴自是為例十二月庚辰殿前散祗候李璘以父讐殺寮員陳友於市璘自首上壯而釋之荆南節度使高繼沖表乞陪祀許之因舉族歸朝己未改命繼沖為武寧節度使甲申皇后王氏崩翰林醫官王守愚坐進藥不精審減死流海島己亥以殿前侍御史鄭起為西河令顯德末起為殿中侍御史見帝握禁兵有人望乃貽書范質極言其事質不聽嘗遇帝於路橫絶前導而過帝初不問於是出掌泗州市征刺史張延範官檢校司徒吏輒呼以太保起貧常乘騾一日從延範出近郊延範揖起行馬起曰此騾也安用過呼延範深銜之密奏起嗜酒廢職遂左遷右拾遺浦城楊徽之亦嘗言於世宗以為帝有人望不宜典禁兵帝即位將因事誅之光義曰此周室忠臣也不宜深罪於是亦出為天興令庚子尚書左丞高防卒於鳳翔帝甚悼惜之遣供奉官陳彥珣部署歸葬西洛凡所費用並從官給防性沈厚守禮法所踐歷皆有能名乙巳唐主煜上表乞呼名詔不允禁道州調民取硃砂除衡嶽州二稅外所賦米并毋得發民烹銅􅑭及作炭遣內客省使曹彬通事舍人王繼筠分詣晉潞州與節度使趙彥徽李繼勳會兵入北漢境收其邊邑及遼石州閏月乙卯山南東道節度使慕容延釗卒贈中書令追封河南郡王帝雅與延釗友善常兄事之及即位猶呼為兄延釗寢疾帝自封藥以賜聞其卒哭之慟禮官言為近臣發哀哭聲宜有常帝曰吾不知哀之所從出也龍捷軍校王明詣闕獻陳圖請討幽州帝嘉之賜以錦袍銀𢃄錢十萬或言帝將北征大發民餽運河南民相驚逃亡者四萬家帝憂之丙寅命樞密直學士薛居正馳傳招集踰旬乃復故初周世宗始征淮南之歲宣祖葬安陵安陵在京城東南隅辛未命司天監趙修已修已初見乾祐元年內客省使王仁贍等改卜安陵於西京鞏縣之鄧封鄉乙亥詔乘輿所服冠冕去珠玉之飾永安節度使折德扆敗北漢軍數千人於府州城下獲其衛州刺史楊璘國子博士聶崇義上言皇家以火德上承正統請奉赤帝為感生帝每歲正月别尊而祭之為壇於南郊奉宣祖升配常以正月上辛奉祀北漢主嗣位所以事遼者多略不如世祖時每事禀之劉旻廟號世祖於是遼持書來責北漢主得書恐懼遣使幣往謝遼執其使而不報北漢地狹産薄又歲輸於遼故國用日削乃拜五臺僧繼顒為鴻臚卿繼顒故燕王劉守光之子守光死以孽子得不殺削髮為浮屠後居五臺山為人多智善商財利世祖頗倚賴之繼顒能講華嚴經四方供施多積蓄以佐國用五臺當遼界上繼顒常得其馬以獻號添都馬歲率數百匹又於柏谷置銀冶募民鑿山取礦烹銀北漢主取其銀以輸遼歲千斤因即其冶建寶興軍資治通鑑後編卷三
