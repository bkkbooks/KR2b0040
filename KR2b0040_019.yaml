body:
  text: 資治通鑑後編卷十九刑部尚書徐乾學撰宋紀十九起著雍茷正月盡屠維大淵獻五月凡一年有竒真宗膺符稽古神功讓德文明武定章聖元孝皇帝帝名恆太宗第三子也母曰元德皇后李氏后夢以承日有娠開寶元年十二月二日生帝於開封府第赤光照室左足指有文成天字幼而聰睿姿表特異與諸王戲好作戰陳之狀自稱元帥太祖愛之撫而問曰天子好作否對曰由天命耳初名德昌太平興國八年授檢校太保同中書門下平章事封韓王改名元休端拱元年封襄王改元侃淳化五年九月進封壽王加檢校太𫝊開封尹至道元年八月立為皇太子改今名仍判府事咸平元年春正月辛酉朔改元癸亥賜近臣嵗節宴於宰相呂端第自是遂以為例丙寅有司上皇太后李氏諡曰元德翰林學士楊礪等受詔知貢舉請對帝召坐語之曰貢舉重任當務選擢寒俊精求藝實以副朕心壬申昭宣使王延德上太宗皇帝南宫事迹三卷命送實録院癸酉始令諸王府記室翊善侍讀等官分兼南北宅教授南北宅始此當考詳時又有伴讀然無定員是年十一月賜南宫伴讀李文益緋然不知始於何時今附見百官志繫之祥符二年後誤也甲戌詔諸路場務逋缺官物令主典賠償者監臨官非同為欺隱勿令填納初李至判國子監校定諸經音疏薦國子博士杜鎬直講孫奭崔頥正皆苦心强學博貫九經問義質疑有所依據望令重加刋正除去舛謬太宗從之丁丑帝訪羣臣通經義者至復以頥正對帝曰朕宫中無事樂聞講誦因召頥正於後苑講尚書大禹謨賜五品服他日謂輔臣曰頥正講誦甚精卿等更於班行中選經明行修之士一二人具以名聞自是日令頥正赴御書院待對講尚書至十卷呂中曰本朝以家學為家法故子孫之守家法自家學始此范祖禹帝學一書極言本朝承平百三十年異於漢唐由祖宗無不好學也然人君之學尤在於所共學之人故在太祖時則有若王昭素太宗時則有若孫奭邢昺在真宗時則有若崔頥正馮元之徒皆極一時之選也戊寅帝御崇政殿召御龍直二百七十餘人閲試武藝遷擢者二十六人庚寅審刑院詳議官監察御史韓見素表求致仕時年四十八帝問輔臣曰見素齒髮尚少遽求致仕何也呂端曰見素性恬退喜修煉帝難之李至曰近世朝行中躁競求進者多知止求退者少若允其請亦足以激勸薄俗帝默然乃授刑部員外郎致仕見素鳳翔人退居華山年八十餘乃卒甲申有彗出營室北光芒尺餘二月壬辰帝謂輔臣曰朕即位以來罔敢暇逸今彗出甚異為將奈何呂端等言變在齊魯之分帝曰朕以天下為憂豈獨一方耶李至曰陛下此言可以却妖星矣甲午詔百官極言得失避正殿減常膳臣乾學曰以豐稔得賢為瑞此得太宗不喜芝草之心也因彗變而却分野之說此即趙普上疏之意也然自景德以前一瑞不敢賀一災不敢忽誠真宗之本心景德以來奸臣初意不過欲排寇公耳於是請行封禪以誇示夷狄雖天書之詐而士大夫無敢言其非者矣雖升州之火而士大夫有爭奏符瑞者矣此李文靖日奏水早告其君劉元城所以稱其為真宰相王文正所以稱其為真聖人歟乙未慮繫囚老幼疾病流以下聽贖杖以下釋之詔諸州長吏平决獄訟申理寃濫吏部郎中直集賢院田錫出知泰州未之任會星變錫上疏言李繼遷不合與夏州又不合呼之為趙保吉以臣愚蒙料彼變詐必不肯久奉朝命永保塞垣是時事舛誤之大者又言密院公事宰相不得與聞中書政事樞密使不得與議致兵謀不精國計未善去年靈州之役關西之民無辜而死者十五萬餘罪在何人而不問咎將誰執而不知此政化堙鬱之大者也疏奏即日召對移晷將行又貢封事復召對謂曰卿第去不半嵗召卿歸矣事有當面論者聽乘傳赴闕再遣中使賜與之甚厚丁酉彗滅戊戌詔以久停貢舉頗滯時才今禮部據合格人內進士放五十人諸科百五十人來嵗不得為例三月壬申賜進士孫僅等宴瓊林先是吏部銓擬官告身悉書其過犯癸酉詔自今勿復書淳化初宗正少卿趙安易言别廟祭饗懿德皇后在淑德皇后之上臣未測升降之由請改正之太宗不許及議合食有司咸請以懿德升配安易又言百官議論茍且隳瀆尊卑若序以後先當用淑德配食詔尚書省集議及禮官同詳定上議曰淑德皇后生無位號沒始追崇况在初潛早已薨謝懿德皇后享封大國作配先朝雖不及臨御之期已夙彰賢懿之美請奉懿德皇后神主升配大宗室詔從之其淑德皇后仍舊别廟祭饗辛巳以趙保吉歸順遣使諭陜西縱綏銀流民還鄉家給米一月夏四月己丑朔詔諸州長吏潔除牢獄疏理淹繫有疾病及貧乏者療治資給之壬寅趙保吉遣弟繼瑗入謝帝謂宰相曰諸路逋缺先朝每有赦宥皆有蠲放而有司尚更理督頗聞細民愁嘆己丑遣使乘傳按百姓逋缺悉除之用判理缺司王欽若之言也除逋缺凡一千餘萬釋繫囚三千餘人帝由是眷欽若益厚呂中曰漢唐之小人易知我朝之小人難見熙寧以後之小人易知熙寧以前之小人難識蓋自古小人之所以誤國者聚斂也嚴刑也用兵也而我朝之指目為小人者自欽若丁謂始然欽若則請蠲負釋繫囚謂則請罷兵撫蠻寇自今觀之與君子之處事何異惜其入政府以後患得患失之心生而改節易行矣故為判官之時一欽若也為參政之時一欽若也為轉運之時一謂也為宰相之時一謂也故當時知二子之奸者王旦李沆而已五月戊午朔日有食之是時旱甲子幸大相國寺祈雨升殿而雨六月庚寅密州發解官鞠傳坐薦送非其人當贖金特詔停任仍令告諭諸道以警官吏帝謂輔臣曰凡所舉官多聞謬濫宜選擇舉主以類求人今外官要切惟轉運使卿等可先擇人後令舉之辛卯詔於常參官內舉材堪轉運使者不限人數富弼曰祖宗朝轉運使並是朝廷先擇舉主舉主擇轉運使惟材堪者為之不治資序今來只是依資循例又不由舉主所以大半不才致州縣之不治也詔議太祖廟號先是判太常禮院李宗訥請改僖祖以下稱號下尚書省集議時張齊賢言為人後者為之子安得宗廟中有伯氏之稱詔禮官詳定禮官引春秋閔僖同為一代及唐中睿故事請太祖太宗昭穆同位詔都省復集議議同齊賢又詔禮官再討典故禮官言按太宗饗祀太祖二十有二年稱曰孝弟此不易之制又安可追改乎唐𤣥宗謂中宗為皇伯考德宗謂中宗為髙伯祖伯氏之稱復何不可臣等參議自今合祭日太祖太宗依典禮同位異坐太祖位仍舊稱孝子奏可秋七月廣西轉運使陳堯叟上言部州土風本異地少蠶桑其民除耕水田外惟種麻苧周嵗三收布出之時每端止售百錢蓋織者衆而市者少故也今臣以國家軍須所急布帛為先因勸諭部民廣植麻苧以錢鹽折變收市之未及二年已得三十七萬餘匹望自今許以所種麻苧頃畝折桑棗之數諸縣令佐依例書厯為課民以布赴官賣者免其算稅如此則布帛上供泉貨下流公私交濟其利甚博詔從之八月丁亥朔詔三司經度茶鹽酒稅以充嵗用勿得增加賦斂重困黎元諸色費用並宜節約并條析未盡事件以聞辛卯京西轉運使姚鉉上言諸路官吏或强明蒞事惠愛及民者則必立教條除其煩擾然所更之弊事多不便於狡胥俟其罷官悉藏記籍害公蠧政莫甚於兹應知州府軍監通判幕職州縣官於所在有經畫利濟事可經久者嵗終書厯替日録付新官俾之遵守不得妄信下吏輒有改更若灼然不便州以上聞幕職以下聞於長吏俟報改正禮云其人存則其政舉其人亡則其政息語曰舊令尹之政必以告新令尹此實聖人之格言國家之急務也詔從之乙巳工部侍郎集賢院學士錢若水等上太宗實録八十卷帝覽書流涕賜詔褒諭時若水判集賢因用院印史館無所預才九月而畢初太宗有畜犬甚馴常在乘輿左右及上仙犬輒號呌不食因送永熙寢宫李至常作歌紀其事以遺若水其斷章云白麟朱鴈且勿書勸君書此懲浮俗而若水不為載呂端雖為監修而未嘗涖局書成不署端名至抉其事以為專美若水稱詔㫖監修不𨽻史局又援唐朝故事以折之時議不能奪癸丑詔監倉京朝官無得以羡餘為課九月己未秦國延夀保聖夫人劉氏卒帝以乳保之恩事之如母自被疾親調藥餌者逾月既終發喪苑中輟朝三日給鹵簿以葬先是太宗命張洎重修太祖實録未成而死己巳詔宰相呂端集賢院學士錢若水同領其事若水懇辭帝曰卿新修太宗實録甚為周備太祖時多缺漏故再命卿毋多讓也豹林谷隱士种放母死貧不克葬遣僮奴告於翰林學士宋湜等湜與錢若水王禹稱同上言先帝嘗加召命今無以葬母欲行私覿恐掠朝廷之美壬申優詔賜放粟帛緡錢令綾綿院改織絹上嘗語輔臣曰治國之道儉約為先甲申始以新織絹進御舊制國子監開封府舉人有與發解官親戚者止兩司更互考試帝慮涉私徇是秋特選官别試冬十月宰相呂端久被病詔免朝謁就中書視事纍上疏求解戊子罷為太子太保初李惟清自知樞院左遷御史中丞意端抑已及端免朝謁乃彈奏常參官有疾告逾年受俸者又教人訟堂吏過失欲以纍端端曰吾直道而行無所愧風波之言不足慮也考異按本傳端自今夏始被病詔免朝謁而實録於三月辛酉已書李惟清卒然則惟清彈奏常參官時端尚未移疾也恐此傳亦誤又按百官表載惟清於今年八月實録審誤此傳不誤也加張齊賢兵部尚書與參知政事李沆並平章事參知政事李至罷為武勝節度使至以目疾解機務及授旄鉞入見懇辭帝曰此唐朝故事廢之久矣特命振舉示優賢也又賜御詩寵其行己丑參知政事溫仲舒罷為禮部尚書樞密副使夏侯嶠罷為戶部侍郎加樞密副使向敏中兵部侍郎參知政事翰林學士楊礪為工部侍郎宋湜為給事中並為樞密副使先是有攀附居近職者乘寵放恣民家子既定婚强取之其家詣開封訴焉知府事畢士安即請對白其事卒得民家子還其父母使成婚攀附者日夜訴士安於帝前士安因求解府事帝許之復入翰林為學士翰林學士承㫖宋白嘗獻擬陸贄榜子集帝察其意欲干事任乃命白權知開封白倦於聽斷不半嵗亦丐罷云考異畢仲游文簡公事亦載文簡白上卒得民家子還其父母使成婚今從之仲游又載文簡之請封也事連王禹稱故其人日夜訴文簡及禹稱于上前久之文簡罷開封復入翰林請出遂知潞州禹稱亦責黃州士安明年四月乃出知潞州禹稱事在今年十二月亦與本史不合今不取庚寅帝謂輔臣曰羣臣中有謗言達於朕聽者詢之似得其實然人誰無過但能循省遷革則為善矣朕固不以一眚廢終身之用也乙未宰相張齊賢李沆入對帝諭之曰上下和睦同濟王事忠孝之誠始終如一齊賢曰君為元首臣為股肱上下一體豈有不同其心而能濟國事者哉帝曰推其公共思而後行惟宜謹審無至差失况先朝皆有成憲但與卿等遵守期致和平耳時戚里有分財不均者更相訟又入宫自訴齊賢請自治之乃坐相府召而問曰汝非以彼所分財多汝所分少乎曰然命具欵乃召兩吏令甲家入乙舍乙家入甲舍貨財無得動分書則交易之明日奏聞帝大悅曰朕固知非卿莫能定也初張齊賢為户部尚書詔同監察御史王濟刪定制敕舊條持杖行劫不計有贓無贓悉抵死齊賢議貸不得財者濟曰以死懼之尚不畏可緩其死乎與齊賢廷諍數四詞氣甚厲手疏言齊賢腐儒不知適時之要帝問輔臣孰可從者呂端請召百官集議并劾濟未幾齊賢入相丁酉齊賢奏臣今在中書不欲與庶寮爭較曲直願收前詔帝嘉其容物遂罷集議濟得免劾刑名卒如齊賢之請而犯盜者嵗亦不增己酉崇政殿視事至午而罷帝自即位每旦御前殿中書樞密院三司開封府審刑院及請對官以次奏事至辰後還宫進食少時復出御後殿視諸司事或校閲軍士武藝日中而罷夜則召儒臣詢問得失或至夜分還宫率以為常考異李燾曰聖政録云召侍講讀學士按二年七月初一日置講讀學士此時未有今改為儒臣庶不相妨癸丑命錢若水等覆考開封府得解進士試卷故事京府解十人已上謂之等甲非文業優贍有名稱者不處時以髙輔堯為首錢易次之易頗為流輩所推許輒不平遂上書指陳發解官所試朽索馭六馬賦及詩論䇿題意涉譏訕又進士數百輩詣府訟薦送不當輔堯亦投牒遜避請以易為首開封府以聞故有是命時翰林學士承㫖宋白深佑易考官度支員外郎馮拯奏易與白交結狀帝大怒遣中使下拯御史獄拯力言易無行不可冠天府多士帝亦以為士流紛競不可啓其端且欲鎮壓浮俗乃詔釋拯罷兩制議及覆考止令若水等擢文行兼著者一人為首乃以孫暨為第一輔堯第二易第三餘並如舊十一月丙辰朔河西軍右廂副使歸德將軍扎卜伊特隆貝來朝河西軍即西凉府也隆貝四世受朝命為酋長雖貢方物未嘗自行今始至獻馬二千餘匹加隆貝安逺大將軍戊午帝謂輔臣曰國家所謹儉約為先節用愛人民俗自化張齊賢曰書稱大禹克儉于家老氏三寶儉居其一上之所好下必從之好儉則國有餘財下不僣則家有餘資自然廉讓興行盜賊鮮少蚩蚩之衆登於冨壽也臣等恭聞聖訓期共遵守三司上經費之數帝曰先帝以財賦國之大本莫不求諸中道而為永制輔臣曰先帝非止愛人嗇費至於節損服用御浣濯之衣蓋前古哲王莫能偕也帝初命三司具中外錢穀大數以聞鹽鐵使陳恕久而不進帝命輔臣詰之恕曰天子冨於春秋若知府庫充美恐生侈心故不敢進也帝聞而善之呂中曰皇祐之録不上於田况則所出多於所入其誰知之元祐之録不作於蘇轍則一嵗之入不足償一嵗之出其誰知之真宗欲知中外錢穀之數而陳恕諾而不進何也蓋時方多事公私殫竭使人君知此則必知節浮費崇儉德一役不妄興一賞不妄增至於時方承平府庫充溢則易以動人君之侈心故丁謂上景德會計録而封禪定林特上祥符會計録而天書成矣至此而後知陳晉公之逺慮也蓋嘗考我朝之用度所入莫多於天禧祥符之時所出亦莫多於天禧祥符之時且以至道末年計之至道中𣙜酒稅錢一百二十萬貫至天禧則增至七百七十九萬餘貫而鐵錢不與焉其他關市津渡等稅率增培之至道課鹽錢七十二萬餘貫天禧末至一百六十三萬餘貫至道中嵗鑄錢八十萬貫景德末至一百八十三萬貫則財之所入多於國初矣然國初三嵗一郊費五百餘萬景德郊祀費七百餘萬貫祀汾陰上寶冊不預焉至道末所出皆不過二千餘萬貫至天禧末天下總收二千六百餘萬貫總費錢二千七百一十餘萬貫穀帛不與焉至此益信陳晉公之為君子而丁謂林特真小人矣是月置估馬司估蕃部及進貢馬價凡市馬之處河東府州嵐岢軍陜西秦渭川峽益黎等州皆置務嵗得五千餘匹以布帛茶他物凖其直甲子詔葺歷代帝王陵廟契丹冊王誦為髙麗國王契丹于越耶律興格卒興格智略宏逺料敵如神每戰勝讓功諸將故士卒樂為之用身更百戰未嘗殺一無辜鎮燕十有七年省賦役恤孤寡戒戍兵無犯宋境雖馬牛逸於北者悉還之逺近向化邊境以寧十二月丙午給事中柴成務上新定編敕共八百五十六條請鏤板頒下與律令格式刑統同行優詔褒答之甲寅知制誥王禹稱坐修太祖實録以私意輕重其間落職知黃州考異李燾曰按禹稱黃州謝上表則此出端坐史事而本傳乃云宰相張齊賢李沆不協意禹稱讒構其間故罷職今但從記聞更須考之或云禹稱撰太宗增上徽號册文語涉譏訕此大誤也江休復云真宗初即位禹稱謁畢相於開封云某事某事舊僚宜有規諷出知黃州此亦誤真宗初即位禹稱實自揚州召入當其責時畢相去開封矣是嵗以如京使栁開知代州開至葺城壘修戰具諸將多沮議不叶開謂其從子曰吾觀昴星有光雲多從北來犯境上寇將至矣吾聞師克在和今諸將怨我一旦寇至我其危哉因上言請徙他州尋改知欣州二年春正月甲子詔尚書丞郎給舍舉升朝官可守大州者各一人俟更三任有政績當議奬其善舉有贓私罪亦連坐之乙丑命禮部尚書溫仲舒知貢舉御史中丞張永刑部郎中知制誥師頏同知貢舉仍當日入貢院始封印卷首禮部侍郎楊徽之以衰疾求解職甲戌授兵部侍郎依前兼祕書監及占謝便殿命坐屏左右勞問久之且曰圖書之府清淨無事可以養性也徽之純厚清介守規檢尚名教尤疾非道以干進者嘗言溫仲舒寇凖用摶擊取貴仕使後世務習趨競禮俗浸薄世謂其知言亦以是寡合於世云二月丙申以太師贈尚書令韓忠獻王趙普配饗太祖廟庭辛丑太常丞判三司催缺司王欽若表述帝登位以來放天下逋缺錢物千餘萬釋繫囚三千餘人考異李燾曰實録本紀及食貨志並云繫三千餘萬恐數太多今從欽若本傳請付史館帝謂近臣曰兹事先帝方欲行之朕奉成先志耳因命學士院召試欽若及覽所試文謂輔臣曰欽若非獨敏於吏事兼冨於文詞今西掖闕官可特任之即拜右正言知制誥己酉帝謂宰相曰聞朝臣中有交結朋黨互扇虛譽速求進用者浮薄之風誠不可長乃命降詔申警有弗率者御史臺糾之祕書監楊徽之薦著作佐郎通判泰州戚綸文學純謹宜在儒館三月甲寅以綸為祕閣校理綸父同文隱居教授學者不逺千里而至登科者凡五六十人徽之與門人追號同文曰堅素先生丙辰命度支郎中裴莊等分詣江南兩浙發廩粟賑飢民除其田租癸亥詔今嵗舉人頗衆若依去年人數取合格者慮有所遺落進士可增及七十人諸科增及一百八十人禮部尋以孫暨二百五十人名聞內諸科一舉者六人特黜去之餘並賜及第京西轉運副使太常博士直史館朱台符上言陛下自受天命與物更始授繼遷以節鉞加黎桓以王爵咸命使者鎮撫其邦惟彼契丹未䝉渥澤非所以柔逺能邇昭王道之無偏也臣愚以為宜因此時赦契丹之罪擇文武才略習知邊境之士為一介之使以嗣位服除禮當修好往告諭之彼十年以來不復犯塞以臣料之力有不足志欲歸嚮而未得其間也今若垂天覆之仁假來王之便必歡悅慕義遣使朝貢因與之盡棄前惡復尋舊盟利以貨財許以關市如太祖故事使之懷恩畏威則兩國既和無北顧之憂可以專力西鄙繼遷當自革心而束手是一舉而兩獲也台符又自請北使時論稱之考異本傳云咸平元年北戎為梗經武聖略云北戎寇邊按元年虜未始動觀台符此疏可知也疏云已訖諒䦣將終祥禫則台符上疏時乃二年春矣今附三月末甲戌詔川陜廣南福建路官丁憂許給驛歸先是小官逺任遭喪多芒屨䇿杖流落不能歸故有是詔秦悼王旅葬涪陵閏月詔擇汝鄧間地改葬庚寅詔有司力役無名營繕不急者悉罷之皇太后居西宫嘉慶殿宰相引漢唐故事上宫名曰萬安從之己丑宰相張齊賢言於帝曰臣受陛下非常之恩當以非常報因述皇王帝霸之說帝曰朕謂皇王之道非有迹但庶事無撓則近之矣帝以亢旱詔中外臣庶並直言極諫時有上書指中書過失請行罷免者帝覽之不悅謂宰相曰此輩皆非善良止欲自進當譴責以警之李沆進曰朝廷比開言路茍言之當理宜加旌賞不則留中可也况臣等非才備員台輔如蒙罷免乃是言事之人有補朝廷帝曰卿真長者矣以河北轉運使右諫議大夫索湘為戶部使湘質朴少文而長於吏事歷任邊部所至必廣儲蓄為備豫計出入軍旅間著能名先在河北擾民之事多所奏罷又自京輦茶至𣙜場最為煩擾多所損敗湘建議請許商賈緣江載茶詣邊郡入中既免道途之耗復有征算之益又威虜靜戎軍嵗燒邊草地以虞南牧言事者請於北寨山麓中興置銀冶湘以為召寇亦奏罷之詔三館寫四部書二本來上一置禁中之龍圖閣一置後苑之太清樓以備觀覽京西轉運副使朱台符上疏請重農積穀任將選兵慎擇守令考課黜陟輕徭節用均賦慎刑責任大臣與圖治道奏入優詔褒答丙午詔江浙飢民入城池漁採勿禁夏四月丙辰詔文武羣臣封事閣門畫時進入勿致稽留辛酉御史中丞張詠上言請自今御史京朝官使臣受詔推劾不得求升殿取㫖及詣中書咨禀從之丙寅河東轉運使掖人宋摶言大通監冶鐵盈積可供諸州軍數十年鼓鑄請權罷采取以紆民詔從其請時西北二邊屯師甚廣摶經制饋餉以幹治稱朝廷難其代凡十一年不徙丙子上謂輔臣曰庶官中求才幹則不乏詢德行則罕見其人夫德為百行之本德行之門必有忠臣孝子豈無德行者能全其忠孝乎又庶官所掌之務多不修舉而捃拾他局利害以圖進身若能自幹本局則百職不嚴而肅又何患乎政事之撓瀆哉以御史中丞張詠為工部侍郎知杭州詠既至屬嵗歉民多私鬻鹽以自給捕犯者數百人詠悉寬其罰而遣之官屬請曰不痛繩之恐無以禁詠曰錢塘十萬家飢者八九茍不以鹽自活一旦蜂起為盜則其患深矣俟秋成當仍舊法有民家子與姊訟家財壻言妻父臨終此子才三嵗故見命掌資産且有遺書令異日以十之三與子七與壻詠覽之以酒酹地曰汝妻父智人也以子幼甚故託汝儻遽以家財十之七與子則子死於汝手矣亟命以七分給其子餘三給壻皆服詠明斷拜泣而去先是左正言耿望知襄州建議襄陽縣有淳河舊作堤截水入官渠溉民田三十頃宜城縣有蠻河溉田七百頃又有屯田三百餘頃請於舊地兼括荒田置營田上中下三務調夫五百築堤仍集鄰州兵每務二百人開河市牛七百頭分給之帝曰屯田之廢久矣茍如此亦足為勸農之始令望躬按視即以望為右司諫京西轉運使與副使朱台符並兼本路制置營田事是嵗種稻三百餘頃汝州舊有洛陽南務遣內園兵士種稻雍熙中以所收薄且擾人廢之賦貧民於是從台符之請復募民二百餘户自備耕牛就置團長京朝官專掌之墾六百頃𨗳汝水澆溉嵗收二萬三千石五月丙戌詔天下貢舉人應三舉者今嵗並免取解其餘依例舉送必求實藝無使遺賢帝謂宰相曰近聞風俗侈靡公卿士庶服用踰制至有鎔金飾衣或以珠翠者張齊賢曰此弊當亟懲先責大臣之家使各遵朴素則可以𨗳民宣化矣丁亥令有司禁臣庶泥金鋪翠之飾違者坐其家長丁酉以殿中丞馬元方權户部判官從户部使陳恕所奏也元方嘗建言方春民乏絶時請預貸庫錢約至夏秋令輸絹於官公私便之朝廷因下其法於諸道令預買絹蓋始於此考異李燾曰馬元方傳户部使陳恕奏元方為戶部判官元方言方春民貧請預貸庫錢至夏秋令以絹輸官行之公私果便因下其法諸路按元方為户部判官在咸平二年五月後知徐州景德元年十一月為梓州路轉運使本傳附傳皆同范鎮東齊記云太宗時馬元方為三司判官建言方春民乏絶時預給庫錢貸之至夏秋令輸絹于官預買絹蓋始于此鎮所記與元方傳同今從之乙巳幸曹彬第問疾賜白金萬兩先是知雄州何承矩奏契丹謀寇邊帝以問彬對曰太祖英武定天下猶委孫全興經營和好陛下初登極時承矩常發書道意臣料北鄙終復成和好帝曰此事朕當屈節為天下蒼生然須執紀綱存大體即久逺之利也考異李燾曰此事三朝經武聖略繫之咸平二年而無月日今因問曹彬疾附見蓋必是彬為樞密使未卧家時也王曽筆録云侍中曹彬為樞密使向敏中為樞密副使當契丹犯塞繼遷叛命每軍書狎至上必亟召樞臣計議彬則曰此狂冦當速發兵誅討斬决而已止用强弩若干步騎若干足矣敏中徐曰某所儲糧未備或道路迂逺或出兵非時當别施方略制之繼慝措置多從敏中所議上或謂將帥難其人彬必懇激而言臣請自效更無他說敏中常私怪之子瑋亦有將材略歷邊郡威名甚著晚自樞二出殿西鄙臨事整衆酷類其父復果于戰鬬而不肯以安民柔逺為意豈將帥之體固當若是耶按彬復為樞密使敏中自同知樞密院改副使乃至道三年八月己亥咸年元年十月戊子敏中改參政二年六月戊午彬卒兩人同在西府才一年耳真宗初即位便令西邊戢兵繼遷尋納欵契丹蓋未嘗犯塞不知曽所稱軍書狎至指何時也經武聖略于咸平二年載何承矩言契丹謀犯塞或曽實指此時然經武聖略稱彬對真宗以北鄙終復成和好與曽筆語特異或筆語誤也當考嘗有詔聽民越拒馬河抵契丹中市馬承矩言緣邊戰櫂司自淘河至泥姑海口屈曲九百里許天設險固真地利也太宗置寨二十八鋪百二十五命廷臣十一人戍卒三千餘部舟百艘往來巡警以屏奸詐則緩急之備大為要害今聽公私貿市則人馬交渡深非便宜若然則寨鋪為虛設矣帝納其言即停前詔資治通鑑後編卷十九
