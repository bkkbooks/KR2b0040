body:
  text: 資治通鑑後編卷一百二十五刑部尚書徐乾學撰宋紀一百二十五起著雍閹茂四月盡重光赤奮若十二月凡三年有九月孝宗紹統同道冠德昭功哲文神武明聖成孝皇帝淳熙五卿夏四月以陳俊卿判建康府時曽覿王抃甘升三人盤結擅政進退大臣權震中外士大夫爭附之俊卿自興化赴建康過闕入對因極言三人招權納賄薦進人才而以中批行之等事且曰去國十年風俗大變向士大夫奔覿抃之門十才一二尚畏人知今則公然趨附蓋已七八不復顧惜矣此曹聲勢既張侍從臺諫多出其門大非朝廷美事臣恐二人壞朝廷紀綱廢有司法度敗天下風俗纍陛下聖德帝感其言丙寅以禮部尚書范成大參知政事辛未知紹興府張津進羡餘四十萬緡詔以代民輸和買身丁之半賜禮部進士姚頴以下四百十七人及第出身丁丑雨土己卯以趙思奉使不如禮罷起居舍人仍降二官五月庚子置武學國子員丁未修臨安城六月庚午飭百官及諸監司毋得請託金尚書左丞赫舍哩良弼卒諡武定良弼性聰敏忠正善斷決言論器識出人意表雖起寒素致位宰相朝夕惕惕盡心於國謀慮深逺薦舉人材常如不及居家清檢親舊貧乏者周給之與人交久而愈敬居位幾二十年以成太平之功號賢相焉乙亥參知政事范成大罷癸未詔京西湖北商人以牛馬負茶出境者罪死甲申以給事中錢良臣僉書樞密院事己丑減四川茶課十五萬緡閏月丙申贈强霓强震官立廟西和州賜名旌忠己亥復分利州東西路為二壬寅置鎮江建康府轉般倉秋七月甲子太尉提舉萬夀觀李顯忠卒諡忠襄顯忠生而神竒立功異域父子破家徇國志復中原忤秦檜屢遭廢黜符離之役又為邵宏淵所忌竟無成功帝嘗竒其狀貌魁偉命繪像閣下丁亥以歲豐命沿江糴米百六十萬石以廣邊儲八月甲午復制科舊法詔諸路監司曰此年以來五穀屢登蠶絲盈箱嘉與海內共享阜康之樂尚念耕夫蠶婦終歲勤動價賤不足以償其勞郡邑兩稅除折帛折變自有常制當輸正色者毋以重價强之折錢若有故違重置于法史浩薦朱熹知南康軍熹至南康值歲旱講求荒政多所全活訪唐李渤白鹿洞書院遺址奏復其舊為學規俾守之九月戊寅賜嶽飛諡曰武穆冬十月戊戌史浩等上三祖下第六世仙源類譜仁宗玉牒戊年封皇孫擴為英國公十一月庚申朔金尚書省奏擬同知永寧軍節度使事阿克為刺史金主曰阿克年幼於事未練授佐二官可也平章政事唐古安禮奏曰臣等以阿克宗室故擬是職金主曰郡守繫千里休戚可不擇人而私其親耶若以親親之恩賜與雖厚無害于政使之治郡而非其才一境何賴焉甲戌史浩罷乙亥以錢良臣參知政事丙子金尚書省奏崇信縣令石安節買車材於部民三日不償其直當削官一階金主曰凡在官者但當取其貪汚與清白之尤者數人黜陟之則自知懲勸矣夫政太寬則人不知懼太猛則小玷亦將不免於罪惟當用中典耳丁丑以趙雄為右丞相王淮為樞密使庚辰復監司互察法丙戌金以吏部尚書烏庫哩元忠為御史大夫元忠嘗知大興府有僧犯法皇姑梁國大長公主屬使釋之元忠不聽金主聞之召元忠謂曰卿不徇情甚可嘉也治京如此朕復何憂十二月庚寅朔班新定薦舉式丙午禁兩淮銅錢復行鐵錢壬子金羣臣奉上大金受命萬世之寶以通判鄂州劉清之知常州未任上疏曰今日之俗惟知得而忘義詔令一下仕者曰增秩乎士曰開科乎兵曰受賞乎民曰蠲租乎有是則欣然奉承否則雖有良法美意利國而便人謂之空文視之蔑如也蓋為治之道有政有教理也義也人心所同謂今世明於理義者為難其人不亦誣乎今日當精擇百官求其明於義理者以為監司為學官為守令為將帥則風俗知義上下一心陛下又與大臣端本清源所以儀型萬邦者不出於他而舉出於理義將以紹復大業斯無難矣改知衡州衡自建炎軍興有大軍月椿過湖錢者嵗送漕司無慮七八萬緡疏請于朝願酌量蠲減不報先是郡飾厨傳以事常平刑獄二使者月一㑹集互致折餽清之歎曰此何時也與其取諸民孰若裁諸公吾之所以事上官者唯究心於所職無負於吾民足矣豈以酒食貨財為致敬哉初至之日兵無糧官無俸上供送死無備清之百凡撙節民力稍蘇或有禀白手自書之吏不預焉作諭民書一編簡而易從每因月講具酒肴以燕諸生相與輸情論學示以先後本末之序士民興起部使者以清之不媚已貽書所厚臺臣論罷之歸築槐隂精舍以處從游之士有一善則亟稱而成就之常歎曰王介甫不憑注疏欲修聖人之經不憑今之法令欲新天下之法可謂知務第出於己者反不逮舊故上誤裕陵以至於今後之君子必不安于注疏之學必不局於法令之文二者正則治道自舉矣六年春正月戊辰賑淮東饑民丁丑雨雹辛巳復置光州中渡𣙜場二月己丑朔帝如佑聖觀召史浩及曽覿賜酒尋加覿少保醴泉觀使時周必大當草制人謂必不肯從及制出其詞有云敬故在尊賢之上士論惜之壬辰錢良臣以失舉贓吏奪三官丙申詔前宰執侍從有已見利便聽不時以聞丙午詔逃軍犯强盜者毋擬貸吕祖謙詮擇聖宋文海成編定為一百五十卷奏御賜名文鑑并賜祖謙銀三百兩絹三百匹三月丙寅録嶽飛趙鼎子孫賜京秩己巳置廣西義倉辛未再賑淮東饑民壬申雨雹己卯金制糾彈之官知有犯法而不舉者減犯人罪一等科之關親者許回避金主謂宰臣曰人多奉釋老意欲邀福朕早年亦頗惑之旋悟其非且上天立君使之治民若盤樂怠忽欲以僥幸祈福難矣果能愛養下民上當天心福必報之夏四月己酉金升祔閔宗于太廟加諡曰𢎞基纘武莊靖孝成皇帝金主將如金蓮川有司具辦薛王府掾絳人梁襄上疏極諫其略曰金蓮川在重山之北氣候殊異中夏降霜一日之間寒暑交至特與上京中都不同非聖躬將攝之所凡奉養之具無不逺勞飛挽其費數倍至於頓舍之處軍騎闐塞主客不分馬牛風逸以難收臧獲逋逃而莫得奪攘蹂躪未易禁止公卿百官衛士富者車帳僅容貧者穴居露處輿臺皂𨽻不免困踣飢不得食寒不得衣一夫致疾染及衆人夭傷無辜何異刃殺此特細故耳更有大於此者臣聞髙城峻池深居邃禁帝王之籓籬也壯士健馬堅甲利兵帝王之爪牙也今行宫之所非有髙殿廣宇城池之固是廢其籓籬也挂甲常坐之馬日暴雨蝕臣知其必羸瘠禦侮待用之軍寒眠冷啖臣知其必疲瘵衛宫周廬才容數人一旦霧潦衣甲弓刀霑濕柔脆豈堪為用是失其爪牙也秋杪將歸人已疲矣馬已弱矣裹糧已空褚衣已敝猶且逺幸松林以從畋獵行於不測之地往來動踰旬月設烈風暴至塵埃漲天宿霧四塞跬步不辨以致翠華有崤陵之避襄城之迷百官狼狽於道途衛士參錯於隊伍當此宸衷寧無戒悔所次之宫草略尤甚殿宇周垣唯周氊布押宿之官上番之士終日驅馳加之飢渴已不勝倦更使徹曙巡警露坐不眠精神有限何以克堪雖陛下悅以使人勞而不怨豈若不勞之為愈也臣聞漢唐離宫去長安才百許里然武帝幸甘泉遂中江充之姦太宗居九成幾致結社之變太康畋于洛汭后羿拒河而失邦魏帝拜陵近郊司馬懿竊權而篡國隋煬海陵雖惡德貫盈人誰敢議止以離棄宫闕逺事巡征其禍遂速皆可為殷監且燕京之涼非濟南之比陛下牧濟南日每遇炎蒸不離府署今九重之內臺榭髙明宴安穆清何暑得到議者謂北幸已久每嵗隨駕大小前歌後舞而歸今兹再出寧遽有不可乎臣愚以為患生於不戒者多矣狃於無虞往而不止臣甚懼焉議者又謂前世守文之主生長深宫畏見風日彎弓上馬皆所不能志氣銷懦筋力拘柔臨難戰懼束手就亡陛下監其如此不憚勤身逺幸金蓮至於松漠名為坐夏打圍寶欲服勞講武臣愚以為戰不可忘畋獵不可廢宴安鴆毒亦不可懷事貴適中不可過當今過防驕惰之患先蹈萬有一危之途何異無病而服藥也況欲習武不必度關涿易雄保順薊之境地廣且平畋獵以時誰曰不可伏乞陛下發如綸之㫖回北轅之車安處中都不復北幸則宗社無疆之休天下莫大之願也金主納之遂為罷行襄由是以直聲聞五月癸未給襄陽歸正忠義人田詔諸路轉運常平司凡沒官田營田沙田沙蕩之類復括數賣之六月戊子朔金詔更定制條甲午建豐儲倉辛亥廣西妖賊李接破鬱林州守臣李端卿棄城遁遂圍化州命經略司討捕之端卿梅州編管是夏旱詔求直言知南康軍朱熹上疏其略曰天下之務莫大於恤民而恤民之本在人君正心術以立綱紀蓋綱紀不能以自立必人主之心術公平正大無偏黨反側之私然後有所繫而立君心不能以自正必親賢臣逺小人講明義理閉塞私邪然後可得而正今宰相臺省師傅賔友諫諍之臣皆失其職而陛下所與親密謀議者不過一二近習之臣上以蠱惑陛下之心志使陛下不信先王之大道而悅於功利之卑說不樂莊士之讜言而安於私􅉏之鄙態下則招集士大夫之嗜利無恥者文武彚分各入其門所喜則隂為引援擢置清顯所惡則密行訾毁公肆擠排交通貨賂所盜者皆陛下之財命卿置將所竊者皆陛下之柄陛下所謂宰相師傅賔友諫諍之臣或反出入其門牆承望其風㫖其幸能自立者亦不過齪齪自守而未嘗敢一言以斥之其甚畏公論者乃能略警逐其徒黨之一二既不敢深有所傷而終亦不敢正言以搗其囊槖窟穴之所在勢成威立中外靡然向之使陛下之號令黜陟不復出於朝廷而出於一二人之門名為陛下獨斷而實此一二人者隂執其柄臣恐莫大之禍必至之憂近在朝夕而陛下獨未之知也帝讀之大怒熹以疾請祠不報諭趙雄令分析雄言於帝曰士之好名者陛下疾之愈甚則人之譽之者愈衆無乃適所以髙之不若因其長而用之彼漸當事任能否自見矣帝以為然乃置不問秋七月戊辰班隆興以來寬恤詔令于諸路趙雄等上㑹要癸酉金密州民許通等謀反伏誅癸未太白晝日經天八月大定初金吏部侍郎石琚奉命詳定制度因上疏言六事大略謂正紀綱明賞罰近忠直逺邪佞省不急之務罷無名之役金主嘉納之遷吏部尚書琚自員外郎至尚書未嘗去吏部典選十年凡宋齊換授官格南北通注銓法皆能縷指而次第之當時號為詳明至是以右丞相致仕後金主謂宰臣曰近來左選多不得人惟石琚舉能其官又曰石琚最為知人卒諡文憲戊戌金以宋大觀錢當五用壬寅以知楚州翟畋過淮生事奪五官筠州居住丙午金濟南民劉溪忠謀反伏誅九月辛未大饗明堂復合祭天地奉太祖太宗配大赦自乾道以後議者以德夀宫為嫌止行郊禮至是用李燾等議復行明堂之禮遂合祭並侑焉從祀百神並依南郊禮例冬十月乙酉朔蠲連州被冦民租稅辛卯金西南路招討使哲典以贓罪伏誅庚子蠲四川鹽課十七萬餘緡辛丑除紹興民逋賦五萬餘緡戊申廣西妖賊平十一月乙卯朔帝著論數百言深原用人之弊因及誅賞之法命宰執示從臣于都堂壬戌金改葬昭德皇后于坤厚陵諸妃祔焉初金主自濟南改西京留守過良鄉使魯國公主葬后于宛平縣之土魯原至是改葬大房山太子允恭徒行挽靈車十二月丙戌班重修淳熙敕令格式己亥詔自今鞫贓吏後雖原貸者毋以失入坐獄官辛亥蠲臨安征稅一年為錢百二萬緡趙雄薦太學正陽安劉光祖試館職光祖答策論科場取士之道進入帝親批其後略曰用人之弊患君不能擇相而相不能擇人每除一官則曰此人中髙第真佳士也終不考其才行國朝以來過於忠厚宰相而誤國大將而敗軍未嘗誅戮要在君必審擇相相必為官擇人懋賞立乎前嚴誅設乎後人才不出吾不信也御筆既出中外大聳議者謂曽覿視草為光祖甲科及第發也帝遣覿持示史浩浩奏曰唐虞之世四凶極惡止於流竄而三考之法不過黜陟幽明未嘗有誅戮之科誅戮大臣乃秦漢法耳太祖制治以仁待臣下以禮列聖傳心逮仁宗而德化隆洽本朝之治與三代同風此祖宗家法也而聖訓則曰過於忠厚夫為國忠厚不易得豈有所謂過哉臣恐議者以陛下自欲行刻薄之政歸過祖宗不可以不審也若必欲宣示乞改云一於忠厚尚庶幾焉雄亦為帝言宰相如司馬光恐非懋賞所能誘嚴誅所能脅帝悔乃改削其辭宣付史館七年春正月丁丑金以玉田縣行宫之地偏林為御林大淀濼為長春淀己卯詔京西州軍並用鐵錢及㑹子民户銅錢以鐵錢或㑹子償之滿二月不輸官許告賞二月癸未朔初置廣南煙瘴諸州醫官辛卯魏王愷卒于明州年三十五愷寬慈為帝深愛雖出於外心每念之賜賚不絶及卒帝泫然曰向所以越次建儲正為此子福氣差薄耳諡惠憲愷治郡有仁聲四明父老乞建祠立碑以紀遺愛己巳封宜州觀察使子棟為安定郡王右文殿修撰張栻卒栻病且死猶手疏勸帝親君子逺小人信任防一己之偏好惡公天下之理邸吏以庶僚不得上遺表却之帝迄不見也及卒帝嗟悼不已朱熹與黃幹書曰吾道益孤矣栻頴悟夙成父浚愛之自幼學所教莫非仁義忠孝之實長師胡宏益自奮厲為人表裏洞然勇於從義無毫髮滯吝每進對必自盟于心不可以人主意輒有所隨順帝嘗言仗節死義之臣難得栻對當於犯顔敢諫中求之若平時不能犯顔敢諫他日何望其仗節死義帝又言難得辦事之臣栻對陛下當求曉事之臣不當求辦事之臣若但求辦事之臣則他日敗陛下事者未必非此人也其逺小人尤嚴為都司日肩輿出遇曽覿覿舉手欲揖栻急掩其忩覿慙手不得下所至郡暇日召諸生告語民以事至庭必隨事開曉具為條教大抵以正禮俗明倫紀為先斥異端毁淫祠而崇社稷山川古先聖賢之祀栻聞道甚蚤朱熹嘗言己之學乃銖積寸纍而成如敬夫則大本卓然先有見者敬夫栻字也栻嘗言學莫先於義利之辨義者本心之當為非有為而為也有為而為則皆人欲非天理矣學者稱為南軒先生三月己未金詔有罪犯被問之官雖遇赦不得復職壬戌詔舉賢良方正能直言極諫者乙丑金詔免中都西京河北山東河東陜西路去年租稅庚午迎太上皇太上皇后宴翠寒堂丁丑蠲臨安民身丁錢三年己卯帝問輔臣進讀三朝寶訓幾時終篇史浩周必大等奏陛下日御前後殿大率日旰方罷朝隻日又御講筵恐勞聖躬帝曰朕樂聞祖宗謨訓日盡一卷亦未為多雖雙日及休暇亦當特坐自是每講讀帝必注目傾耳或隨事咨詢率漏下十刻而罷詔諸州招補軍籍之闕自今歲以為常辛巳金以徒單克寧為右丞相克寧在相位持正守大體至于簿書期㑹不屑屑然也夏四月丁亥金大寧宫火乙巳金主謂宰臣曰女真官多謂朕食用太儉朕謂不然夫一食多費豈為美事貴為天子能自節約正自不惡也朕服御或舊常使浣濯至於破碎方始更易向時帳幕常用塗金為飾今則不爾但令足用何必事紛華也丙戌趙雄等上哲宗玉牒戊子除明州積缺諸司錢十五萬緡甲辰黎州五部落犯盤陀寨兵馬都監髙晃以綿潼大軍三千人與戰敗走蠻人深入大掠而去己酉命廕補武舉宗室小使臣行三年喪五月丙寅金中都地震生黑白毛戊辰以吏部尚書周必大參知政事刑部尚書謝廓然僉書樞密院事必大為翰林學士幾六年制命溫雅周盡事情為一時詞臣之冠及拜參政帝謂之曰執政於宰相固當和而不同前此宰相議事執政更無語何也必大對曰大臣自應互相可否自秦檜當國執政不敢措一辭後遂以為當然陛下虛心無我人臣乃欲自是乎惟小事不敢有隱則大事何由蔽欺帝深然之袁州分宜縣大水蠲其稅己卯申飭書坊擅刻書籍之禁六月壬辰五部落再犯黎州鈐轄成光延戰敗官軍死者甚衆提㸃刑獄權州事折知常棄城走甲午制置司益兵遣都大提舉茶馬吳總討平之秋七月丁卯以旱決繫囚分命羣臣禱雨于山川八月甲申以禱雨未應諭輔臣令職事官以上各實封言事是夕雨校書郎羅㸃上封事謂今時姦諛日甚議論凡陋無所可否則曰得體與世浮沈則曰有量衆皆默己獨言則曰沽名衆皆濁己獨清則曰立異此風不革陛下雖欲大有為於天下未見其可也自旱暵為虐陛下禱羣祠赦有罪曽不足以感動及朝求讜言夕得甘雨天心所示昭然不誣獨不知陛下之求言果欲用之否乎如欲用之則願以所上封事反覆詳熟當者審而後行疑者咨而後決如此則治象日著而亂萌自消矣初求言之詔將下宰相謂此詔一下州縣必乞賑濟何以應之約周必大同奏止其事必大曰上欲通下情而吾儕阻隔之何以塞公論乃止甲辰五部落犯黎州左軍統領王去惡拒却之折知常因重賂蠻帥使之納欵端明殿學士致仕黃巾卒諡簡肅中為秦檜所扼二十年不遷官檜死乃擢用又為湯思退所沮言每不能盡行然上皇獨心嚮之曰黃中恬退有守錫賚甚厚致仕家居凡邑里後生上謁必訓以孝弟忠信朱熹裁書求見曰今日之來將再拜堂下惟公坐而受之俾進於門弟子之列其為賢者所敬慕如此屬疾手草遺表猶以山陵欽宗梓宫為言深以人主之職不可假之左右為戒九月癸亥詔自今常朝毋稱丞相名甲子命樞密使亦如之丙子金富森羣牧羅和謀叛伏誅冬十月庚辰朔金詔西北路招討司每進馬駝鷹鶻等輒率斂部內自今並罷之金定銓注縣令丞簿格丙戌詔限田太寬民役煩重其令臺諫給舍同户部長二詳議以聞乙未黎州五部落進馬三百匹及珊瑚等乞降詔却所獻許其互市戊戌金主謂宰臣曰凡人在下位欲冀升進勉為公亷賢不肖何以知之及其通顯觀其施為方見本心如招討哲典初任定州同知又為都司所至皆有清名及為招討即不能固守人心險於山川誠難知也十一月辛酉詔蠲兩淮州軍二稅一年辛巳金主謂宰臣曰岐國用人但一言合意便升用之一言之失便責罰之凡人言辭一得一失賢者不免自古用人咸試以事若止於奏對之間安能知人賢否朕取人惟衆所與者用之不以獨見為是庚寅趙雄等上神哲徽欽四朝國史志時袁樞同為編修官章惇家以同里之情宛轉致意請樞文飾其傳樞曰子厚為相負國欺君吾為史官書法不隱寧負鄉人不可負天下後世之公論雄時總史事見之歎曰無愧古良史矣丙申嗣濮王士輵卒癸卯金授衍聖公孔總曲阜令封爵如故是月資政殿學士致仕胡銓卒銓剛方直諒知無不言言無不盡勇往直前不以一毫利害動其心後諡忠簡曽覿與王抃甘升相結文武要職多出三人之門至於譛逐大臣貶死嶺表帝因陳俊卿極論寖覺其姦嘗謂左右曰曽覿誤我不少遂稍踈覿覿憂恚疽發背死凡前論覿得罪者皆録贈是歲金河決衛州及延津京東掃瀰漫至于歸德府詔南北兩岸增築隄以捍湍怒八年春正月詔罷內侍兼兵職時擬以德夀宫提舉陳源帶浙西副總管給事中趙汝愚論駁以為不當帝諭宰執曰汝愚言有理且可防微杜漸進呈太上亦以為然遂下此詔令樞密院遵守永為定制時有介椒房之援求為郎者帝令周必大諭給舍繳駮之必大曰臺諫給舍與三省相維持豈可諭意不從失禮從則壞法命下之日臣等自當執奏帝喜曰肯如此任怨耶必大曰當豫而不豫則有怨不當豫而不豫何怨之有丙辰金追貶海陵煬王亮為庶人先是閔宗既祔廟有司奏曰煬王之罪未正凖晉趙王倫廢惠帝自立惠帝反正誅倫廢為庶人煬王罪惡過於倫不當有王封亦不當在諸王塋域至是詔降為海陵庶人改葬于山陵西南四十里宗幹去帝號復為遼王徒單氏降為妃大氏降為夫人金主如春水丙子次永清縣契丹人伊喇伊呼雅有一妻一妾妻子六妾子四妻死其六子廬墓下更宿守之妾子皆曰是嫡母也我輩獨不當守墳墓乎於是亦更宿焉金主因獵過而聞之賜錢五百貫仍令縣官積錢於市以示縣民然後給之以為孝子之勸二月庚寅詔三省樞密六部置籍稽考興利除害等事庚子金主還中都乙巳以元妃李氏之喪致祭興德宫過肆市不聞樂聲謂宰臣曰豈以妃故禁之耶細民日作而食若禁之是廢其生計也其勿禁朕前將詣興德宫有司請由薊門朕恐妨市民生業特從他道顧見街衢門肆或有毁撤障以簾箔何必爾也自今勿復毁撤三月除朱熹提舉江西常平茶鹽金主初聞平灤等州民乏食命有司發粟糶之貧不能糴者貸之有司以貸貧民恐不能償止貸有户籍者金主至長春宫聞之更遣人閲實賑貸以監察御史舒穆嚕元禮鄭達卿不糾舉各笞四十前所遣官皆論罪閏月戊子賜禮部進士黃由以下三百七十九人及第出身是榜得袁燮乙未金主謂宰臣曰朕觀自古人君多進用讒諂其間䝉蔽為害非細若漢明帝尚為此輩所惑朕雖不及古之明君然近習讒言未嘗入耳至于宰輔之臣亦未嘗偏用一人私議也夏四月庚戌金奉安昭祖以下三祖三宗御容于衍慶宫行親祀禮癸丑修湖南諸州城丁卯安定郡王子棟卒癸酉立彬州宜章桂陽軍臨武縣學以教養峒民子弟五月戊寅詔監司守令勸課農桑戊子金西北路招討使完顔守能以贓罪杖一百除名是月嚴州大水漂沒民居萬九千五百四十餘家紹興大水漂沒民居八萬三千餘家田稼盡腐六月戊午除淳熙七年諸路旱傷檢放米一百三十七萬石錢二千六萬緡戊辰史浩薦薛叔似楊簡陸九淵石宗昭陳謙葉適袁燮趙善譽趙靜之張子智等十五人詔並赴都堂審察九淵不赴調袁燮為江隂尉浙西大飢常平使羅㸃屬任賑恤燮命每保畫一圖田疇山水道路悉載之民居分布凡名數治業悉書之合保為都為鄉為縣征發爭訟追胥披圖可立決以此為荒政首浩所薦皆江浙之士為小官者其後並擢用不至通顯者六人而已考異十五人宋史孝宗紀作十六人今從朝野雜記及宋史史浩傳秋七月癸未永陽郡王居廣卒追封永王壬辰以紹興大水出秀婺州平江府米賑糶丁酉嚴州水詔被災之家蠲其和買三等以上户減半辛丑録范質後除朱熹直祕閣再辭不許著作郎兼國史院編修官吕祖謙卒諡曰成祖謙學本家庭有中原文獻之傳長從林之竒汪應辰胡憲游而友張栻朱熹學以關洛為宗旁稽載籍心平氣和不立崖異少卞急一日誦論語躬自厚而薄責於人忽覺平時忿􅓰渙然氷釋朱熹嘗言學如伯恭方是能變化氣質帝嘗令祖謙編次皇朝文鑑稱其用意有補治道平生著書至多皆以繼絶表微扶正息邪海內家傳人誦與伊洛之書並行于世八月己酉地震庚戌右丞相趙雄罷雄自四川幕官陳恢復之䇿為帝所竒不數年致位右相每進見必言二帝在沙漠及帝眷衰有言雄多私里黨者帝疑之㑹陳峴帥四川命從中出雄遂求去乃出知瀘州癸丑以王淮為右丞相兼樞密使淮既相問太子侍讀楊萬里曰宰相先務何事萬里曰人才淮因問其人萬里即疏朱熹袁樞以下六十人時趙雄罷相蜀士之在朝者皆有去意淮言于帝曰此唐季黨禍之始也豈聖世所宜有皆以次進遷蜀士乃安甲寅以謝廓然同知樞密院事丙辰更後殿幄次為延和殿改除朱熹提舉浙東常平茶鹽時浙東薦飢王淮薦熹即日單車就道九月辛巳參知政事錢良臣罷庚寅以謝廓然兼權參知政事冬十月甲子詔灾傷州縣諭民賑糶十一月甲戌以旱傷罷喜雪宴戊寅蠲富陽新城錢塘夏稅辛卯浚臨安至鎮江府運河己亥朱熹奏事延和殿熹去國二十年至是召對極陳災異之由與夫修德任人之說凡兩劄大略言陛下即政之初蓋嘗選建豪英任以政事不幸其間不能盡得其人是以不復廣求賢哲而姑取軟熟易制之人以充其位於是左右私䙝使令之賤始得以奉燕閒備驅使而宰相之權日輕又慮其勢有所偏而因重以壅已也則時聽外廷之論將以隂察此輩之負犯而操切之陛下既未能循天理公正心以正朝廷之大體則固已失其本矣而又欲兼聽士大夫之公言以為駕御之術則士大夫之進見有時而近習之從容無間士大夫之禮貌既莊而難親其議論又苦而難入近習便嬖側媚之態既足以蠱心志而胥吏狡獪之術又足以胘聰明此其生熟甘苦既有所分恐陛下未及施其駕馭之術而已墮其計中矣是以雖欲微抑此輩而此輩之勢日重雖欲兼采公論而士大夫之勢日輕重者既挾其重以竊陛下之權輕者又借力於所重以為竊位固寵之計中外相應更濟其私日往月來浸淫耗蝕使陛下之德業日隳綱紀日壞邪佞充塞貨賂公行兵愁民怨盜賊間作災異數見飢饉薦臻羣小相挺大人皆得滿其所欲惟有陛下了無所得而國家顧乃獨受其弊帝為動容竦聽因條陳救荒之策首劄畫為七事其一以為救荒之務早行檢放從實蠲減其二勸分之數量與增減使得其平其三上户蓄米不多特許減半推賞使應募者衆其四乞撥豐儲倉米三十萬石以備糶濟其五民間官物並與住催其户部指定支遣之數且於內庫支借紹興丁錢宜預行蠲放其六受命之初即當印榜招海商販廣米至浙東許以不收雜稅錢到則依價出糶更不裁減其七乞申嚴行下官吏奉行不䖍者奏劾老病昏愚者汰遣惻怛愛民才力可使者許不拘文法時暫差權次復陳二說一乞著令自今水旱約及三分以上第五等户並免檢踏具帳先與全户蠲放如及五分以上則第四等户亦如之及推行崇安社倉法於天下一言紹興和買均輸之重請革其弊帝深納之賑臨安府及嚴州飢民十二月癸卯朔以徽饒二州民流者衆罷守臣官出南庫錢三十萬緡付新提舉浙東常平朱熹賑糶戊申諡劉安世曰忠定甲寅雨雹丙辰詔縣令有能舉荒政者監司郡守以名聞甲子下朱熹社倉法於諸路初熹始拜命即移書他郡募米商蠲其征及至視事于西興則客舟之米已輳集熹日鈎訪民隱按行境內始于㑹稽諸縣次及七郡窮山長谷靡所不到每出皆乘單車屏徒御一身所需皆自賫以行秋毫不及州縣以故所至人不及知郡縣官吏憚其風采至有自引去者所部肅然凡政有不便於民者悉釐革之因上言乾道四年民艱食熹請於府得常平米六百石賑貸夏受粟于倉冬則加息計米以償自後隨年斂散歉則蠲其息之半大饑則盡蠲之凡十有四年以元數六百石還府見儲米三千一百石以為社倉不復收息每石止收耗米三升以故一鄉四五十里間雖遇歉年民不缺食詔下其法於諸路其法以十家為甲甲推一人為首五十家則推一人通曉者為社首其逃軍及無行之士與有稅糧衣食不缺者並不得入甲其應入甲者又問其願與不願願者開具一家大小口若干大口一石小口五斗五歲以下者不預置籍以貸之其以濕惡不實還者有罰帝謂王淮曰朱熹政事却有可觀淮言熹行其所學民被實惠詔諸路各行其法戊辰金遣魏貞吉等來賀明年正旦先是王抃紿金使取國書及使歸金主誅之嗣歲金使至帝以德夀宫之命為離席受國書尋悔之至是復要帝立受帝還內令抃往諭㫖抃擅許貞吉用舊儀見帝不懌者數日權吏部尚書趙汝愚因亟攻抃帝始有黜抃意金主謂宰臣曰山東大名等路明安穆琨户之民往往驕縱不親稼穡不令家人農作盡令漢人佃蒔取租富家盡服紈綺酒食逰宴貧者爭慕效之欲望家給人足難矣更當委官閲實户數計口授地必令自耕力不贍者方許佃於人仍禁其農時飲酒又曰奚人六明安已徙居咸平臨潢泰州其地肥沃且精勤農務各安其居女真人徙居奚地者聞皆自耕歲用亦足彼地肥美異於他處惟附都民以水害稼者賑之其惰農飲酒勸農謀克及都管各以等第科罪資治通鑑後編卷一百二十五
