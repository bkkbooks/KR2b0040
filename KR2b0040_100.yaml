body:
  text: 資治通鑑後編卷一百刑部尚書徐乾學撰宋紀一百起著雍閹茂正月盡上章困敦十二月凡三年徽宗體神合道駿烈遜功聖文仁德憲慈顯孝皇帝重和元年春正月甲申朔御大慶殿受定命寶百僚稱賀初金主用鐡州楊朴策即位改元矣朴又言自古英雄開國或受禪必先求大國封册金主遂遣使如遼丁亥遼遣耶律訥格等如金議和以蕭奉先等言許之可以彌兵故也考異按金史太祖紀不書遣使求封册蓋醜其事而隱之也今據遼史天祚紀修入己丑大赦應元符末上書邪中等人亦得凖依無過人例庚戌以翰林學士承旨王黼為尚書左丞黼美風姿有口辨才踈雋而寡學術然多智善佞初因何執中薦擢校書郎遷左司諫張商英在相位寖失帝意帝遣使以玉環賜蔡京於杭黼覘知之因數條奏京所行政事并擊商英及京復相德其助已嵗中三遷為御史中丞黼欲去執中使京專國遂疏執中二十罪已而改翰林學士會京與鄭居中不合黼復納交居中京由是怨之徙為户部尚書將陷以罪黼以智獲免還為學士承旨至是遂入政府遼保安軍節度使張崇以雙州二百户降金時東路諸州盜賊蜂起至掠民自隨以充食二月戊辰增諸路酒價庚午遣武義大夫馬政同高藥師等使女真講買馬舊好初藥師等兵船至海北見女真邏者不敢前復回青州稱已入蘇州界女真不納幾為邏者所殺青州安撫使崔直躬具奏其事時政和七年八月也帝怒詔元募借補人并將校一行並編配逺惡仍委童貫措置通好女真事監司帥臣不許干預如違並以違御筆論貫更令王師中别選能吏以往政洮州人也謫官青州寓家於平師中言政可使遂用之考異宋史徽宗紀重和元年二月庚午遣馬政由海道使女真約夾攻遼金史太祖紀天輔元年十二月亦云宋使登州防禦使馬政以國書來其略曰日出之分實生聖人竊聞征遼屢破勍敵若克遼之後五代時陷入契丹漢地願畀下邑是初遣馬政即欲夾攻求故地也李燾長編辨此為封氏編年之説未可全信云議夾攻實自宣和二年二月四日遣趙良嗣始前此馬政及呼慶兩畨所議但買馬耳若果議夾攻則政子擴茅齊自序不應不載兼趙有開死政止不行獨呼慶見阿固達何緣便議夾攻不知封氏據何書當並削去今從之金史所載國書或是良嗣所齎誤繫之馬政且遣使在重和元年乃金天輔二年也元年十二月安得見政所致之國書其為舛錯無疑矣甲戌升六安縣為六安軍丁丑詔監司輒以禁錢買物為苞苴饋獻者論以大不恭遼使耶律訥格還自金金主復書曰能以兄事朕嵗貢方物歸我上中京興中府三路州縣以親王公主駙馬大臣子孫為質還我行人及元給信符并宋夏高麗往復書詔表牒則可以如約三月丙戌詔監司郡守自今須滿三嵗乃得代仍得通理癸巳令嘉王楷赴廷對楷帝第二子也丁酉知建昌陳并等改建神霄宫不虔及科決道士詔並勒停戊申賜禮部奏名進士及第出身七百八十三人有司以嘉王楷第一帝不欲楷先多士遂以王昂為榜首召管勾棣州韓君文人觀劉棟赴闕遼復使耶律訥格如金申前議也夏四月癸丑朔築靖夏城制戎城録吕餘慶後乙卯御筆以淮南轉運使張根輕躁妄言落職監信州酒稅是時承平日久賜豫無藝營繕並興殆無虛日以故國用益窘帝多命臣僚條具財計於是中外所陳非一根因而進節用之説權幸以其不利於己也莫不切齒而大臣以賜第事謂根議已力謀所以中根者於是言章交上而帝察根之誠不之罪也會御前人船所拘占直達綱船以應花石之用根以上供期迫奏乞還之重忤權幸意且因被命督促竹石又上言東南花石綱之費官買一竹至費五十緡本路尚然他路猶不止此今不以給苑囿而入諸臣之家民力之奉將安所涯願示休息之期以厚幸天下於是權幸益怒故有是命癸亥減捶刑己卯詔每嵗以季秋親祀明堂如孟月朝獻禮以太上混元上德皇帝二月十五日生辰為貞元節辛巳道録院上看詳釋經六千餘卷內詆謗道儒二教惡談毁詞分為九卷乞取索焚棄仍存此本永作證驗又林靈素上釋經詆誣道教議一卷乞頒降施行並從之五月壬午朔日有食之乙酉詔諸路選漕臣一員提舉本路神霄宫丁亥以林靈素為通真達靈元妙先生張虛白為通元沖妙先生虛白南陽人通太一六壬術帝召管太一宫恩賚無虛日官太虛大夫金門羽客出入禁中終日論道無一言及時事曰朝廷事有宰相在非豫所知也帝每以張胡呼之而不名壬辰頒御製聖濟經以青華帝君八月九月生辰為元成節戊戌遼復遣耶律訥格使金要以酌中之議金主遣呼都堪與訥格持書報如前約庚戌手敕兩浙漕司以權添酒錢盡給御前工作六月乙卯以賢妃劉氏為淑妃壬申門下侍郎薛昂奏承詔編集王安石遺文乞差檢閲文字官三員從之遼通祺雙遼四州之民八百餘户降于金金主命分置諸部擇膏腴之地處之秋七月壬午以西師有功加蔡京恩官其一子鄭居中為少傅余深為少保鄧洵武為特進進執政官一等癸未詔蔡京鄭居中余深童貫並兼充神霄玉清萬夀宫使鄧洵武薛昂白時中王黼蔡攸並兼充副使己酉遣亷訪使者六人振濟東南諸路氷災遼耶律訥格等齎宋夏高麗書詔表牒至金金乃遣呼都堪如遼免取質子及上京興中府所屬州郡裁減嵗幣之數如能以兄事朕册用漢儀可以如約遼於是遣訥格托多如金議册禮金留托多遣訥格還謂之曰言如不從勿復遣使八月甲寅以童貫為太保戊午知兖州王純奏乞令學者治御注道德經間於其中出論題從之庚午詔自今學道之士許入州縣學教養所習經以黃帝內經道德經為大經莊子列子為小經外兼通儒書俾合為一道大經周易小經孟子其在中選人增置士名分入官品元士高士上士良士方士居士逸士隱士志士每嵗試經撥放州縣學道之士初入學為道徒試中升貢同稱貢士到京入辟雍試中上舍並依貢士法三嵗大比許襴鞹就殿試當别降䇿問庶得有道之士以稱招延辛未資政殿大學士知陳州鄧洵仁奏乞選擇道藏經數十部先次鏤板頒之州郡道録院看詳取旨施行又乞禁士庶婦女輒入僧寺詔令吏部申明行下壬申詔執政非入謝及丐去毋得獨留奏事乙亥升兖州為襲慶府是月掖庭大火自甲夜達曉大雨如傾火益熾凡爇屋五千餘間後苑廣聖宫及宫人所居幾盡焚死者甚衆九月辛巳大饗明堂壬午詔罷拘白地禁𣙜貨增方田稅添酒價取醋息河北加折耗米東南水災強糴等事丙戌詔太學辟雍各置內經道德經莊子列子博士二員戊子金主詔曰國書詔令宜選善屬文者為之其令所在訪求博學雄才之士敦遣赴闕己丑以嵗當戌月當壬為元命降德音于天下庚寅門下侍郎薛昂罷以白時中為門下侍郎王黼為中書侍郎翰林學士承旨馮熙載為尚書左丞刑部尚書范致虛為尚書右丞頒御注道德經刻石神霄宫壬辰禁州郡遏糴及邊將殺降以幸功賞者癸巳禁羣臣朋黨丁酉用蔡京言集古今道教事為紀志賜名道史辛丑鄭居中罷乞持餘服詔從之壬寅詔視中大夫林靈素視中奉大夫張虛白並特授本品真官先是帝用方士言鑄神霄九鼎名曰太極飛雲洞劫之鼎蒼壺祀天貯醇酒之鼎山嶽五神之鼎精明洞淵之鼎天地隂陽之鼎混沌之鼎浮光洞天之鼎靈光見耀錬神之鼎蒼龜火蛇蟲魚金輪之鼎至是始成奉安於上清寶籙宫之神霄殿閏月己未以劉棟為守靜先生視中大夫棟辭不受庚申詔江淮荆浙閩廣監司督責州縣還集流民乙亥給事中趙野奏乞諸州添置道學博士擇本州官兼充從之丙子詔用柴氏後已封崇義公復立恭帝後以為宣義郎監周陵廟世世為國三恪冬十月己卯太白晝見壬辰知陳州鄧洵仁奏本州學內舍生宋瑀係故翰林學士宋祁之孫行藝清修願換道學內舍生舊有撰到道論十篇及近撰神霄玉清萬夀宫雅謹具繳奏呈御筆宋瑀特與志士仍許赴將來殿試己亥改興慶軍為肇慶府癸卯帝如上清寶籙宫傳度玉清神霄祕籙會者八百人時道士有俸每一齋施動獲數十萬每一觀給田亦不下數百千頃貧下之人多買青布幅巾以赴日得一飲餐及襯施錢三百甲辰置道官二十六等道職八等有諸殿侍晨校籍授經以擬待制修撰直閣之名戊申徽猷閣待制提舉萬夀觀蔡絛以罪勒停長編載絛訴神文曰臣舉家兄弟諸姪皆投名請受神霄祕籙獨臣不願受於是九重始大怒因遣梁師成諭旨戒臣不許接見賓客嗚呼事既掣肘謀既盡露臣亦決知得罪矣一日臣兄來宣諭臣父將通延福宫江路徹閶闔門跨城為復道飛橋入賜第自此往來無間君臣相悉時已大毁民居數千家如荒動矣臣不勝憤悶亟夜草書力爭臣父愕然實愛惜臣猶不肻出臣兄伺知及鄭昂泄臣語因下開封府捕繫昂盡搜索其篋笥然獨無有於是昂遂枷項編管安州臣始勒住朝參不許接見賓客又降御筆謂臣狂妄不循分守特落職而怒終不解臣父因賞橘內宴丐入中禁獨拜懇於太上之前臣遂得不死始議貶新州俄而置諸光州臣父以謂出則必隂殺之因持之久乃俾臣父上章特勒停令侍養遇有臨幸則出避耳今按蔡絛之勒停史不著其所以據絛自言如此恐其間容有文過之辭然宋史蔡攸傳云攸以絛鍾愛於京數請殺之過不許則此事為其兄所媒糵理或然也十一月己酉朔詔改明年元曰宣和大赦天下辛亥日中有黑子如李大丙辰以婉儀王氏為賢妃丁卯茂德帝姬下嫁蔡鞗父京請免見舅姑行盥饋之禮詔不允己巳升梓州為潼川府丙子提舉成都府路學事翟栖筠奏王安石參酌古今篆𨽻而為之説此造道之指南而窮經之要術也然字形書畫纎悉委曲咸有不易之體世之學者知究其義而至於形畫則或略而不講從俗就簡轉易偏旁傳習既殊漸失本真如期朔之類從月股肱之類從肉勝服之類從舟丹青之類從丹靡有不辨而今書者乃一之若此者不可勝舉故幼學之士終年誦書徒識字之近似而不知字之正形甚可歎也願詔儒臣重加修定去其訛謬存其至當一以王安石字説為正分次部類號為新定五經字樣頒之庠序詔太學官集衆修定十二月戊寅朔復京西錢監己卯詔九鼎新名乃狂人妄有改革皆無稽據宜復舊名狂人指王仔昔也馬政等還自女真與其使者俱來是日至登州登州遣赴闕政與平海指揮使呼慶隨高藥師曹孝才以閏月六日下海才達北岸為邏者所執并其物奪之欲殺者屢次已而縛之行經十餘州至金主所居安扎川來流河約三千餘里其用事人曰尼罕曰阿呼曰烏舍尼雅滿烏舍金主之侄而阿呼其長子也皆呼為郎君詰問海上遣使之由政以實對金主與衆議數日遂質登州小校王美劉亮等六人發渤海人李善慶熟女真薩都生女真布克達三人齎國書并北珠生金貂革人參松子同政等來報使甲申遼議定册禮遣耶律訥格使金時山前諸路大飢乾顯宜錦興中等路斗粟直數縑民削皮食之既而人相食寧昌軍節度使劉宏以懿州户三千降于金金以為千户己丑置裕民局丙申御筆莊周列禦冦所著書與太上真經並行方之孔門不在孟軻揚雄下其令神霄玉清萬夀宫使司議所以褒顯之設像並配太上祠是嵗江淮荆浙梓州水出宫女百七十人黃巖民妻一産四男子宣和元年春正月戊申朔日下有五色雲乙卯詔佛改號大覺金仙餘為仙人大士之號僧為德士易服飾稱姓氏寺為宫院為觀即住持之人為知宫觀事所有僧録司可改作德士司左右街道録院可改作道德院德士司隸屬道德院蔡攸通行提舉天下州府僧正司可並為德士司尋又女冠為女道尼為女德時林靈素欲廢釋氏以逞前憾請悉更其號故有是命丁巳金使李善慶等入國門館於寶相院詔蔡京童貫及鄧文誥見之議事補善慶修武郎薩都從義郎布克達秉義郎給全俸居十餘日遣朝議大夫直祕閣趙有開武義大夫馬政忠翊郎王瓌充使副齎詔書禮物與善慶等渡海聘之瓌師中子也初議報女真儀趙良嗣欲以國書用國信禮有開曰女真之酋止節度使世受契丹封爵常慕中朝恨不能臣屬何必過為尊崇用詔書足矣問善慶何如善慶曰二者皆可用惟朝廷所擇於是從有開言有開與善慶等至登州未行而有開死會河北奏得諜者言契丹已割遼東地封女真為東懷王且妄言女真常祈修好并以其表聞乃詔馬政等勿行止差呼慶持登州牒送李善慶等歸戊午以余深為太宰兼門下侍郎王黼為特進少宰兼中書侍郎黼賜第城西日導以教坊樂供帳什器悉取于官寵傾一時是時朝廷已納趙良嗣之計將會金以圗燕會諜云遼主有亡國之相黼聞畫學正陳堯臣善丹青精人倫因薦堯臣使遼堯臣即挾畫學生二人與俱繪遼主像以歸言於帝曰遼主望之不似人君臣謹畫其容以進若以相法言之亡在旦夕幸速進兵兼弱攻昧此其時也并圗其山川險易以上帝大喜取燕雲之計遂定乙丑改湟州為樂州乙丑帝耕籍田罷裕民局封占城楊卜麻疊為占城國王占城在中國西南所統大小聚落一百五略如州縣自上古未嘗通中國周顯德中始入貢自是朝貢不絶然北與交州接壤互相侵擾及詔封為王始與交址加恩均矣金使烏陵噶贊謨如遼迎封册也二月庚辰改宣和殿為保和殿戊戌以鄧洵武為少保三月丁未朔遼遣蕭實訥埒等册金主為東懷國皇帝庚戌蔡京等進安州所得商六鼎己未以馮熙載為中書侍郎范致虛為尚書左丞翰林學士張邦昌為尚書右丞詔天下和宫觀道士與監司郡縣官以客禮相見童貫令熙河經略使劉法取朔方法不欲行強遣之出至統安城遇夏主弟察克率步騎三陳以當法前軍而别遣精騎登山出其後大戰移七時兵飢馬渴死者甚衆法乘夜遁比明走七十里至和敏峗守兵追之法墜崖折足乃斬首而去是役也喪師十萬貫隱其敗而以捷聞察克見法首惻然語其下曰劉將軍前敗我庫庫里木多泉吾嘗避其鋒謂天生神將豈料今為一小卒梟首哉其失在恃勝輕出不可不戒遂乘勝圍震武震武在山峽中熙秦兩路不能餉自築後三嵗間知軍李明孟清皆為夏人所殺至是城又將陷察克曰勿破此城留作南朝病塊乃自引去宣撫使司以捷聞受賞者數百人甲子知登州宗澤坐建神霄宫不敬除名編管辛未賜上舍生四十五人及第甲戍皇后親蠶夏四月丙子朔日有食之庚寅童貫以鄜延環慶兵大破夏人平其三城辛丑進輔臣官一等五月丙午朔京師茶肆傭晨興見大犬蹲榻傍近視之乃龍也軍器作坊兵士取而食之逾五日大雨如注歷七日而止京城外水高十餘丈帝懼甚命戶部侍郎唐恪決水下流入五丈河起居郎李綱言隂氣太盛當以盜賊外患為憂詔貶綱監沙縣稅務丁未詔德士並許入道學依道士法丙辰敗夏人於靈武壬辰班御製九星二十八宿朝元冠服圖是月西北有赤氣亘天遼準布博斯齊等叛執招討使耶律鄂爾多都監蕭蘇爾特死之六月戊寅呼慶等至金主軍前金主及尼雅滿等責以中輟且言登州不當行牒呼慶對本朝知貴朝與契丹通好又以使人至登州緣疾告終因遣慶與貴朝使臣同行欲得早到軍前權令登州移文非有他故若貴朝果不與契丹通好即朝廷定别遣使人共議金主不聽遂拘留慶等又以薩都受宋團練使杖而奪之考異金史太祖紀天輔三年六月書宋使馬政及其子宏來聘宏即擴聲之訛也按先是馬政已輟行獨呼慶至耳金史誤書今不取壬午詔西邉武臣為經略使者改用文臣甲申詔封莊周為微妙元通真君列禦寇為致虛觀妙真君仍用册命配享混元皇帝童貫因關右既困諷夏人因遼進誓表納欵己亥詔六路罷兵及夏遣使來賀天寧節授以誓詔夏使辭不取貫不能屈但遣館伴強之使持還及境棄之道中而去賈琰得而上之貫始大沮尋加貫太傅封涇國公時人稱蔡京為公相貫為媪相秋七月丙辰詔以蔡絛向緣狂率廢黜幾年念其父京元老勳在王室未忍終棄可特敘舊官外與宫觀任便居住既而京言敘不以法乞賜寢罷詔候過大禮取旨金復遣烏陵噶贊謨如遼責册文無兄事之語不言大金而云東懷乃小邦懷其德之義又册文有渠材二字語涉輕侮若遙芬多戩等語皆非善意殊乖體式如依前書所定然後可從遼楊詢卿羅子韋率衆降金金主命各以所部為穆琨八月戊寅詔諸路未方田處並令方量均定租課丙戌御製御書神霄玉清萬夀宫記令京師神霄宫刻記於碑以碑本賜天下如太平祥符故事摹勒立石以垂無窮己丑金頒女真字於國中女真初無文字及獲契丹漢人始通契丹漢字於是烏葉摩囉歡固紳等學之摩囉歡兩月盡通大小字遂與鄂特本等立法定制凡與遼宋往來書問皆摩囉歡固紳主之金主因命固紳依倣漢人楷字因契丹字制度合本國語製女真字行之丁酉尚書左丞范致虛以母憂去位時朝廷欲用師契丹致虛言邉隙一開必有意外之患宰相謂其懷異竟不起復九月乙卯曲宴蔡京于保和新殿殿西南廡有玉真軒者安妃妝閣也京請見安妃帝許之命使傳旨曰雅燕酒酣添逸興玉真軒內見安妃詔京賡補成篇京即題曰保和新殿麗秋暉詔許塵凡到綺闈及至玉真軒不見安妃但畫像挂西垣京即以詩奏謝曰玉京軒檻暖如春只見丹青不見人月裏姮娥終有恨鑑中姑射未應真須臾中使詔京至玉華閣帝手持詩曰因卿有詩况姻家自當相見京曰頃緣葭莩已得拜望故敢以詩請帝大笑妃素妝而出京進前再拜敘謝妃拜京又拜翌日京作記以進辛酉大饗明堂癸亥幸道德院觀金芝由景龍江至蔡京第鳴鸞堂賜京酒京訴開封尹聶山離間事山即坐絀因作鳴鸞記以進時京子攸倏翛及攸子行皆為大學士鞗尚帝姬家人厮養亦居大官媵妾封夫人京每侍上恆以君臣相悅為言帝時乘輕車小輦頻幸其第命坐賜酒略用家人禮京謝表有云主婦上夀請釂而肻從稚子牽衣挽留而不却蓋實事也丙寅蔡京奏臣伏蒙聖慈以臣夏秋疾病特命於龍德太一宫設普天大醮又親製青詞以見誠意至曰臨幸醮筵别製密詞親手焚奏仰惟異禮今昔所無殞首殺身難以仰報方京病篤人謂其必死獨朝沖之謂陸宰曰未死也彼敗壞國家至此若使晏然死牖下備極哀榮豈復有天道哉已而果愈此據陸遊家世舊聞丁卯以蔡攸為開府儀同三司攸有寵於帝進見無時與王黼得預宫中祕戲或侍曲宴則短衫窄袴塗抹青紅雜倡優侏儒中多道市井淫媟謔浪語以獻笑取悅攸妻宋氏出入禁掖攸子行領殿中監寵信傾其父攸嘗言於帝曰所謂人主當以四海為家太平為娛嵗月能幾何豈可徒自勞苦帝深納之因令苑囿皆倣江浙為白屋不施五采多為村居野店及聚珍禽異獸動數千百以實其中都下每秋風夜靜禽獸之聲四徹宛若山林陂澤間識者以為不祥之兆金主以遼册禮使失期詔諸路軍過江屯駐遼乃令實訥埒等先持册藁如金而後遣使送烏陵噶贊謨持書以還冬十月甲戌以紹述熙豐政事書布告天下遼耶律陳圗努等二十餘人謀反伏誅十一月辛亥蔡京奏乞以神霄玉清萬夀宫觀玉真王所説玉嬰神變妙經刋印頒行從之乙卯祀圜丘赦天下甲子詔東南諸路水災令監司郡守悉心振救戊辰以張邦昌為尚書左丞翰林學士王安中為尚書右丞安中附童貫王黼為中丞因論蔡京罪為帝所知遂居政府淮甸旱飢民失業遣監察御史察訪太學生鄧肅以朱勔花石綱害民進詩諷諌詔放歸田里壬申放林靈素歸溫州釋氏既廢靈素益尊重官沖和殿侍宸出入呵引至與諸王爭道都人稱曰道家兩府靈素與道士王允誠共為怪神後忌其相軋毒之死都城暴水遣靈素厭勝方率其徒步虛城上役夫爭舉梃將繫之走而免帝知衆所怨始不樂靈素恣橫不悛道遇皇太子弗斂避太子入訴帝怒以為太虛大夫斥還故里命江端本通判溫州幾察之端本亷得居處過制罪詔徙置楚州而已死遺奏至猶以侍從禮葬焉考異長編載蔡絛云久之上復思靈素使道流保明欲再召入伯氏大懼而靈素不知何故匆死矣端本乃以靈素遺表上之曰靈素不血死按伯氏謂蔡攸也詳絛此語靈素死不分明疑攸使端本殺之十二月甲戌詔京東東路盜賊竊發令東西路提刑督捕之辛卯大雨雹自政和以來帝多微行乘小轎子數內臣導從置行幸局局中稱出日為有排當次日未還則傳旨稱瘡痍不坐朝始民間猶未知及蔡京謝表有輕車小輦七賜臨幸之語自是邸報傳之四方而臣僚阿順莫敢言祕書省正字曹輔上疏諌曰陛下厭居法宫時乘小輦出入㕓陌郊坰極遊樂而後返臣不意陛下當宗社付託之重玩安忽危一至於此夫君之與民本以人合合則為腹心離則為楚越畔服之際在於斯須甚可畏也萬一當乘輿不戒之初一夫不逞包藏禍心雖神靈垂護然亦損威傷重矣又况有臣子不忍言者可不戒哉帝得疏出示宰臣令赴都堂審問余深曰輔小官何敢論大事輔曰大官不言故小官言之王黼陽顧張邦昌王安中曰有是事乎皆應以不知輔曰兹事雖里巷小民無不知相公當國獨不知耶曽此不知焉用彼相黼怒令吏從輔受詞輔操筆曰區區之心一無所求愛君而已退待罪於家黼奏不重責輔無以息浮言丙申詔編管郴州初輔將有言知必獲罪召子紳來付以家事乃閉戶草疏及貶怡然就道將樂楊時初登進士第聞程皓兄弟講孔孟絶學調官不赴以師禮見皓於潁昌相得甚歡其歸也皓目送之曰吾道南矣及皓卒又師事程頥於洛蓋年四十矣一日頥偶瞑坐時與遊酢侍立不去頥既覺則門外雪深一尺矣後歷知瀏陽餘杭蕭山三縣皆有惠政民思之不忘時安於州縣未求聞達而德望日重四方之士不逺千里從之遊號曰龜山先生蔡京客張觷言於京曰今天下多故至此必敗宜亟引舊德老成置諸左右庶幾猶可及京問其人觷以時對京因薦之會路允迪自高麗還言高麗國王問龜山先生安在乃召為祕書郎呼慶留金凡六月數見金主執其前説再三辨論金主與尼雅滿烏舍議乃遣慶歸臨行語曰跨海求好非吾家本心吾已獲大遼數路其他州郡可以俯拾所以遣使人報聘者欲交鄰耳暨聞使至不以書來而以詔詔我此已非其宜使人雖卒自合復遣止遣汝輩尤為非禮足見翻悔本欲留汝念過在汝朝非汝罪也歸見皇帝若果欲結好請早示國書或仍用詔決難從命且我嘗遣使求遼主册吾為帝取其鹵簿使人未歸爾家來通好而遼主使人册吾為東懷國立我為至聖至明皇帝吾怒其禮儀不備又念與汝家已通好遂鞭其來使不受法駕等乃本國守兩家之約不謂貴朝如此見侮汝可速歸為我言其所以慶以是月戊戌離金主軍前朝夕奔馳從行之人有裂膚墮指者是嵗京西飢淮東大旱遣官賑濟嵐州黃河清升趙州為慶源府均州為武當軍二年春正月癸亥追封蔡確為汝南郡王甲子罷道學以儒道合而為一不必别置道學也二月乙亥遣中奉大夫右文殿修撰趙良嗣忠訓郎王環使金先是呼慶以正月至自登州具道金主所言并其國書達于朝廷王師中亦遣子環同慶詣童貫白事貫時受密旨圖遼欲假外援因建議遣良嗣等持御筆往仍以買馬為名其實約夾攻遼取燕京舊地第面約不齎國書夾攻之約蓋始於此考異馬擴茅齋自序云政和八年父政過海至女真所居來流河重和元年正月父入國門宣和元年正月呼慶等齎到女真文字因復遣趙良嗣今考之他書其年並誤蓋擴所稱政和八年即重和元年而所稱重和元年當作宣和元年所稱宣和元年當作宣和二年也夾攻之約實自二年始唐恪罷戊子令所在贍給淮南流民諭還之甲午詔别修哲宗正史金主使烏陵噶贊謨持書及册文副本至遼且責其乞兵于高麗遼以金人所定大聖二字與先世稱號同遣實訥埒往議金主怒謂羣臣曰遼人屢敗遣使求成惟飾虛辭以為緩師之計當議進兵乃令咸州路統軍司治軍旅修器械具數以聞將以四月進師令斜葛留兵一千鎮守棟摩以餘兵來會于渾河和議遂絶三月乙卯賜上舍生二十一人及第乙卯改熙河蘭湟路為熙河蘭廓路遼復遣實訥埒以國書如金夏四月丙子詔江西廣東兩界羣盜嘯聚添置武臣提刑路分都監各一員乙未金主自將伐遼分三路出師趣上京五月庚子朔以淑妃劉氏為貴妃己酉日中有黑子如棗大趙良嗣等以四月甲申至蘇州守臣高國寶迎勞甚恭會金主已出師以是月壬子會青牛山議所向翌日良嗣等至金主令良嗣與遼使實訥埒並從軍每行數十里輒鳴角吹笛鞭馬疾馳比明行六百五十里至上京命進攻且謂良嗣等曰汝可觀吾用兵以卜去就遂臨城督戰諸軍鼓噪而進自旦及已棟摩以麾下先登克其外城留守托卜嘉以城降良嗣等奉觴為夀皆稱萬嵗金主乃還丁巳祭地於方澤降德音于諸路布衣朱夢説上書論宦寺權太重編管池州戊辰詔宗室有文行才術者令太宗正司以聞六月癸酉詔開封府賑濟飢民丁丑太白晝見太師魯國公神霄玉清萬夀宫使蔡京屢上章乞致仕戊寅詔依所請守本官在京賜第居住仍朝朔望京專政曰久公論益不與帝亦厭薄之子攸權勢既與父相軋浮薄者復間焉由是父子各立門户遂為仇敵攸别居賜第一日詣京京正與客語使避之攸甫入遽起握父手為診視狀曰大人􅍺勢舒緩體中得無有不適乎京曰無之攸曰禁中方有公事即辭去客窺見以問京京曰君固不解此此兒欲以為吾疾而罷我耳閲數日果有致仕之命辛巳詔自今請改元豐法制論以大不恭中牟縣民訴方田不院凡田百户乙酉詔罷諸路方田丙戌詔三省樞密院額外吏職並從裁汰及有妄言惑衆稽違詔令者重論之詔諸司總輔提點之類非元豐法並罷丁亥復寺院額尋又復德士為僧甲午罷禮制局并修書五十八所秋七月壬子罷文臣起復己未罷醫算學八月庚辰詔減定醫官額乙未詔監司所舉守令非其人或廢法不舉令亷訪使者劾之是月趙良嗣於上京出御筆與金主議約以燕京一帶本漢舊地約夾攻契丹取之金主命譯者曰契丹無道其土疆皆我有尚何言顧南朝方通歡且燕京皆漢地當特與南朝良嗣曰今日約定不可與契丹復和也金主曰有如契丹乞和亦須以燕京與爾家方許和遂議嵗幣良嗣初許三十萬辨論久之卒與契丹舊數金主又謂良嗣曰吾軍已行九月至西京汝等到南朝請發兵相應遂以手札付之約以本國兵徑自平地松林趨古北口南朝兵自雄州趣白溝夾攻不如約即地不可得金師至松林會大暑馬牛疫金主乃還遣驛追良嗣至易國書約來年同舉尼雅滿烏舍曰使副至南朝奏皇帝勿如前時中絶也留良嗣飲食數日及令契丹吳王妃歌舞妃初配吳王天祚私納之復與下通遂囚于上京金破上京得之謂良嗣曰此契丹兒婦也今作奴婢為使人歡甲辰金主遣實喇赫嚕貝勒大達呼高隨等持其國書來報聘九月壬寅金實喇赫嚕等至詔衛尉少卿董耘館之止作新羅人使引見後三日對于崇政殿帝臨軒實喇赫嚕等捧書以進禮畢而退詔罷政和二年給地牧馬條法收見馬以給軍應收田地及置監處並如舊制丙辰詔登州鈐轄馬政借武顯大夫使聘于金是日實喇赫嚕等入辭于崇政殿賜宴顯靜寺命趙良嗣押宴王環伴送政持國書及事目隨赫嚕等行書曰大宋皇帝謹致書於大金皇帝逺承信介持示函書具聆啓處之詳殊副瞻懷之素契丹逆天賊義干紀亂常肆害忠良恣為暴虐知夙嚴於軍旅用綏集於人民致罰有辭逖聞為慰今者確示同心之好共圖問罪之師念彼羣黎舊為赤子既久淪於塗炭思永靖於方陲誠意不渝義當如約已差太傅知樞密院事童貫勒兵相應使回請示舉軍的日以慿夾攻所有五代以後陷沒幽薊等州舊漢地及漢民并居庸古北松亭榆關已議收復所有兵馬彼此不得過關外據諸色人及貴朝舉兵之後背散到彼餘處人户不在收留之數絹銀依與契丹數目嵗交仍置𣙜場計議之後契丹請和聽命各無允從乃别降樞密院劄目付政遣政子擴從行初朝廷止欲得燕京舊地及趙良嗣還朝言嘗問金主燕京一帶舊漢地并西京亦是金主曰西京我安用止為拏阿古須一臨爾事竟亦與汝家阿古天祚小字也又言平營本燕京地高慶裔曰平灤非一路金主曰此不須議故事目并及山後雲寰應朔蔚媯儒新武諸州兩國之釁由此生矣冬十月戊辰朔日有食之己巳尚書省言州縣武學已罷內外願入京武學人乞依元豐法試補入學舉試其考選升補推恩並以大觀武學法從之以內侍梁師成為太尉師成黠慧習文法初領睿思殿文字外庫主出外傳上旨政和中漸得幸因竄名進士籍中纍遷河東節度使至是遂有此命時中外泰寧帝留帝禮文符瑞之事師成逢迎希恩寵帝本以𨽻人畜之命入處殿中凡御書號令皆出其手多擇善書吏習倣帝書雜詔旨以出外廷莫能辨師成實不能文而高自標榜自言蘇軾出於時天下禁誦軾文其尺牘在人間者皆毁去師成訴於帝曰先臣何罪自是軾之文乃稍出以翰墨為己任四方名士必招致門下往往遭點汙多置書畫卷軸於外舍邀賔客縱觀得其題識合意者輒密加汲引執政侍從可階而升王黼以父事之稱為恩府先生蔡京父子亦諂附焉都人目為隱相所領職局多至數十百睦州清溪民方臘世居縣之堨村託左道以惑衆初唐永徽中睦州女子陳碩真反自稱文佳皇帝故其地相傳有天子基臘因得慿藉以自信縣境梓桐幫源諸洞皆在山谷幽險處民物繁夥有漆楮杉材之饒富商巨賈多往來臘有漆園造作局屢酷取之臘怨而未敢發時吳中因於朱勔花石之擾比屋致怨臘因民不忍隂聚貧乏遊手之徒以誅勔為名遂作亂馬政等達金來流河留帳前月餘議論不決金主初不認事目內已許西京之語且言平灤營三州不係燕京所管政等不能對唯唯而已金主又與其羣臣謀謂北朝所以雄盛邁古者緣得燕地漢人今一旦割還南朝不惟國勢微削兼退守五關之北無以臨制南方坐受其弊若我將來滅契丹盡有其地與宋為鄰時或以兵厭境更南展提封有何不可羣臣皆以為然唯尼雅滿云南朝四面被邊若無兵力安能立國未可輕之金主遂將馬擴逺行射獵久之乃還令諸酋具飲食遞邀南使十餘日始草國書遣赫嚕貝勒大達呼與政等來報聘書中大略云前日趙良嗣等回許燕京東路州鎮已載國書若不夾攻應難如約今若更欲西京請便計度收取若難果意冀為報示考異按趙良嗣金主已許西京等語出其所自撰奉使總録而金盟本末華夷直筆及詔旨諸書皆取之李燾因採入長編今金主不認此語豈果彼之食言乎或云此良嗣實為姦以罔上致事目妄求為國家之禍本也此説得之十一月戊戌朔方臘自號聖公建元永樂以其月為正月置官吏將帥以巾飾為别自紅巾而上凡六等無弓矢介胄唯以鬼神詭祕事相扇訹焚室廬掠金帛子女誘脅良民為兵不旬日聚衆至數萬陷清溪縣己亥少傅太宰兼門下侍郎余深罷時福建以取花果擾民深為言之帝不悅出知福州庚戌以王黼為少保太宰兼門下侍郎初蔡京致仕黼陽順人心悉反其所為四方翕然稱為賢相及拜太宰遂乘高為邪多畜子女玉帛自奉僣擬禁省因請置應奉局自兼提領中外名錢皆許擅用竭天下財力以供費官吏承望風旨凡四方水土珍異之物悉苛取於民進帝所者不能什一餘皆入於黼家己未兩浙都監蔡遵顔坦擊方臘于息坑死之十二月戊辰方臘陷睦州殺官兵千人於是夀昌分水桐廬遂安等縣皆為賊據甲申方臘陷休寧縣知縣事麴嗣復為賊所執脅之使降嗣復罵賊不絶口曰何不速殺我賊曰我休寧人也公宰邑有善政前後官無及公者我忍殺公乎委之而去朝廷因命嗣復知睦州進官二等尋為賊所傷自力渡江將乞兵於宣撫司未及行而卒丙戌方臘陷歙州東南將郭師中戰死士曹掾粟先守獄詬賊遇害於是婺源績溪祁門黟縣官吏皆逃去尋又陷富陽新城遂逼杭州凡賊兵所至得官吏必斷臠支體探其肺腸或熬以膏油叢鏑亂射備盡楚毒以償積怨警奏至京師時方聚兵以圖北伐王黼匿不以聞於是附者益衆東南大震淮南發運使陳遘上言賊衆強官軍弱乞調京畿兵及鼎澧槍牌手兼程以來使不至滋蔓帝得疏大驚乃罷北伐之議丁亥以談稹為兩浙制置使童貫為江淮荆浙宣撫使率禁旅及秦晉蕃漢兵十五萬討之己丑以少傅鄭居中權領樞密院庚寅詔訪兩浙民疾苦真臘在占城南東際海地方七千里政和中始通中國是嵗遣郎將來朝詔封其主金褒賓深為真臘國王比占城資治通鑑後編卷一百
