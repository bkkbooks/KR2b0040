body:
  text: 資治通鑑後編卷九十九刑部尚書徐乾學撰宋紀九十九起旃蒙協洽正月盡疆圉作噩十二月凡三年徽宗體神合道駿烈遜功聖文仁德憲慈顯孝皇帝政和五年春正月壬申朔遼生女真部節度使阿固達因其下奉上尊號遂即皇帝位謂其下曰遼以賓鐡為號取其堅也賔鐡雖堅終亦變壞惟金不變不壞金之色白完顔部色尚白於是國號大金改元收國更名旻丙子自將攻黃龍府進臨益州州人走保黃龍取其餘民以歸丙戍瀘南晏州夷卜漏等反攻梅嶺堡陷之晏州六縣水路十二村及十州五村團思峩洞諸熟夷素黠勇善鬭大中祥符元豐間屢為邊患瀘帥賈宗諒武人也喜生事嘗以需竹木擾夷夷怨之至是又誣致其酋斗箇旁等罪杖脊黥配諸夷憤怒卜漏遂主盟合從入冦因上元張登襲破梅嶺堡知寨髙公老妻族姬也公老嘗攜族姬以金玉器與卜漏輩飲思峩洞卜漏艷之故來攻公老遁去遂略其妻及金玉四出焚掠以歸族姬濮安懿王之曽孫於帝服屬為近事聞帝甚駭時蜀久安人巽愞不習兵所至闕戰守備逺近聞警騷動梓州轉運使趙遹適按部次昌州即馳至瀘而提點刑獄賈若水亦至遹恐賊逾瀘水益難禦乃急督宗諒躬率兵進屯江安縣據水當賊衝且以近邊諸壘轉餉給軍儲備無乏若水摘比近巡尉兵既至又成都利夔路援師亦集與宗諒所部得衆萬餘逮賊再犯武寧樂共梅嶺宗諒出兵與賊戰官軍大衄禆將陳世基等死之賊屢勝愈猖獗出沒無虛日蜀土大震此據長編所載趙遹行狀修入己丑令諸州縣置醫學立貢額甲午改龍州為政州遼遣行軍都統耶律鄂爾多左副統蕭伊實右副統耶律卓諾都監蕭色佛哷率騎二十萬步卒七萬戌邊金主率兵趨達嚕克城次寧江州西遼主下詔親征遣僧嘉努持書約和斥金主舊名且使為屬國金主遣薩喇復書若歸叛人阿蘇遷黃龍府於别地然後議之庚子進師有火光正圓自空而墜金主曰此祥徴殆天助也酹白水而拜將士莫不喜躍進逼達嚕克城金主登髙望遼兵若連雲灌木狀顧謂左右曰遼兵心二而情怯雖多不足畏遂趨髙阜為陳摩囉歡以右翼先馳遼左軍却左翼出其陳後遼右軍皆力戰羅索尼楚赫衝其中堅凡九陷陳皆力戰而出尼雅滿請以中軍助之金主使鄂特本往為疑兵摩囉歡已得利擊遼右軍遼兵遂敗乘勝追躡至其營會日已暮圍之黎明遼軍潰圍出逐北至阿嚕岡遼步卒盡殪是役也遼人本欲屯田且戰且守故金并得其耕具以給諸軍童貫遣熙河經略使劉法將步騎十五萬出湟州秦鳯經略使劉仲武將兵五萬出會州貫以中軍駐蘭州為兩路聲援仲武至清水河築城屯守而還法與夏右廂軍戰于庫庫哩大敗之斬首三千級二月乙巳立定王桓為皇太子甲寅册皇太子赦天下庚午以童貫領六路邊事時永興鄜延環慶秦鳯涇原熙河各置經略安撫司以貫總領之於是西兵之柄皆屬於貫遼饒州渤海古裕等反自稱大王遼主遣蕭色佛哷等討之三月辛未朔太白晝見癸酉張商英復通奉大夫提舉崇福宫梓州路轉運使趙遹密奏賈宗諒激變晏夷之罪且曰瀘南邉事轉運司官不當干預臣不敢坐視已收羸兵馳赴樂共城權行招安之䇿庶邉徼早得寧息然遹本意乃欲專事進討兵端愈大矣詔罷宗諒代以康延魯而聽遹節制甲申追論至和嘉祐定䇿功封韓琦為魏郡王復文彥博官丁亥詔以立皇太子見責降文武臣僚並與牽復甄敘凡千五百人壬辰升舒州為德慶軍癸巳賜禮部奏名進士出身六百七十人夏四月甲辰作葆真宫丙午趙遹奏節次招到晏州夷賊千餘人及首領斗岡等二百四十七人又説諭到賊首卜漏等千餘人俱來梅賴村壩去軍城十里與所差使臣同刺貓牲雞血和酒飲誓稱一心歸宋更不作過比引至公庭臣與走馬承受丁升卿引問於聽事之所先以疏其過惡次以明􅏡君父不殺之恩率皆面闕稽顙再拜以謝臣即犒以酒食錫以銀綵俾令著業遂分兵修復梅嶺堡兼創築諸城寨以備不虞丁未詣景靈宫還幸祕書省進館職官一等庚戍改集英殿為右文殿癸丑遼蕭色佛哷等為渤海古裕所敗以南面副部署蕭圖薩溫為都統赴之圖薩溫與古裕戰復敗績癸亥置宣和殿學士詔東宫講讀官罷讀史遼主使耶律卓諾等齎書使金金主亦斥遼主名以報之且諭之使降癸丑以修三山河橋降德音于河北京東京西路蔡京以孟昌齡為都水使者獻議導河大伾可置永逺浮橋謂河流自大伾之東而來直大伾山西而止數里方回南東轉而過復折北而東則又直至大伾山之東地形水勢迫束相直曽不十餘里且地勢卑下可以成河倚山可為馬頭又有中潭正如河陽若引使穿大伾大山及東北二小山分為兩股而過合於下流因三山為趾以繫浮梁省費數十百倍可寬河朔諸路之役朝廷喜而從之置提舉修築浮橋所調役夫數十萬民不聊生至是工畢詔提舉所具功力等第聞奏又詔居山至大伾山浮橋屬濬縣者賜名天成橋大伾山至汶子山浮橋屬滑州者賜名榮光橋俄改榮光曰聖功御製橋銘磨崖刻之昌齡遷工部侍郎方河之開也水流雖通然湍激猛暴遇山稍隘往往泛溢近寨民夫多被漂溺因及通利軍後遂注成巨濼云秋七月戊辰朔日有食之乙亥升汝州為陸海軍丁丑詔建明堂于寢殿之南趙遹奏晏州夷賊渝盟作過出沒剽掠若置而不問恐養成姦惡别生大患不可不早為之計但事力未勝不敢輕舉深入乞就秦鳯涇原環慶路共調兵二萬前來攻討詔永興路選兵二千人赴之辛巳又詔涇原發兵三千環慶二千押赴瀘南聽用仍以趙遹為瀘南招討統制使王育馬覺為同統制雷迪丁升卿軍前承受孫羲叟王良弼應副錢糧並聽趙遹節制甲申以昭慶軍節度使蔡卞為開府儀同三司是月遼使錫喇以國書致金主金主留之不遣遼九百奚營降于金八月戊戌金主自將攻黃龍府次混同江無舟金主使一人導前乘赭白馬徑涉曰視吾鞭所指而行諸軍隨之水及馬腹後使舟人測其渡處深不得其底己亥都水監言大河已就三山通流正在通利之東慮水溢為患乞移軍城於大伾山居山之間以就髙仰從之己酉詔祕書省移於他所以其地為明堂杭州觀察使陳彥言明堂基宜正臨丙方稍東以據福德之地故有是詔命蔡京為明堂使開局興工日役萬人庚戍詔中書舍人陳邦光提舉洞霄宫池州居住先是邦光以中書舍人兼太子詹事會蔡京獻太子以大食琉璃酒器羅列宫庭太子怒曰天子大臣不聞道義相訓乃持玩好之具蕩吾志耶命左右擊碎之京聞邦光實激太子含怒未發因事遂斥邦光辛亥升通利軍為濬州嗣濮王仲增薨弟仲御嗣丙寅陳瓘特敘承事郎許任便居住緣立太子赦也瓘既寓通州而盛章與石悈有隙取密旨編置通州揚言為瓘執仇瓘聞而歎曰此豈盛世所宜有耶因謀徙避遂挈家至九江卜居焉九月丁卯朔遼黃龍府陷于金金主遣遼使錫喇還遂班師至混同江徑渡如前金尼雅滿烏珠等遺書遼主陽為卑哀之辭實欲求戰遼主怒下詔親征有女真作過大軍翦除之語金主聚衆剺面仰天慟哭曰始與汝等起兵蓋苦契丹殘忍欲自立國今天祚親征奈何非人死戰莫能當也不若殺我一族汝等迎降轉禍為福諸軍皆曰事已至此惟命是從王厚與劉仲武合涇原鄜延環慶秦鳯之師攻夏臧底河城敗績死者十四五秦鳯等三將全軍萬人皆沒厚懼罪重賂童貫匿不以聞未幾夏人大掠蕭關而去遼師渡混同江副都統耶律卓諾反奔上京謀迎立魏國王淳遼主遣駙馬蕭昱領兵詣廣平淀護后妃行宫小砥伊遜持書馳報淳時卓諾先遣淳妃親弟蕭迪里以所謀説淳淳曰此非細事主上自有諸王當立北南面大臣不來而汝言及此何也密令左右拘之有頃伊遜齎御札至備言張奴等謀廢立事淳立斬迪里首以獻單騎間道詣廣平淀待罪遼主遇之如初卓諾知淳不見聽乃率麾下掠取上京府庫財物至祖州率其黨告太祖廟數遼主過惡移檄州縣遂結渤海羣盜數萬趨廣平犯行宫不克北趨降虜山順國女真阿固察以三百騎一戰勝之擒其貴族二百餘人並斬以徇餘得脫者皆奔金卓諾詐為使者亦欲奔金為邏者所獲縛送行在腰斬於市剖其心以獻祖廟支解以徇五路冬十月癸卯以嵩山道人王仔昔為沖隱處士仔昔豫章人始學儒後自言遇許遜真君授以大洞隱書豁落七元之法能知人禍福王老志死後仔昔來都下帝知之召令踵老志事寓蔡京第因有是命己酉趙遹統兵發江安縣親督王育由樂共城路命馬覺以别部由長寧軍路張思正由梅嶺堡水蘆氊中路期悉會于晏州輪縛大囤合陜西三路兵并本路土軍義軍土丁子弟保甲弓手人夫共三萬五百四十人戊午夏人入貢十一月癸酉録昭憲皇后杜氏之裔庚辰趙遹攻破晏州輪縛大囤夷賊卜漏遁去官軍追獲之降者相繼而至諸囤悉平初王育等既攻破上下落樣村及思峩州所向若破竹無不即下遹遂與馬覺張思正軍皆至輪縛大囤其山崛起數百仞周四十餘里卜漏居之凡諸囤之奔亡者悉歸於此共保聚拒守賊自上施矢石直瞰官軍中者即韲粉官軍以強弓弩射之曽不能及半凡纍日將士相顧無計瀘州都巡檢使种友直山西將家子沉密能任事思黔州巡檢田祐恭本思黔夷所部土丁藥箭手輕趫習山險遹乃微服乘馬命友直祐恭從按視形勢見山隈崖壁尤陟絶賊以險故不設備遹乃悉移軍當賊而命二人率所部軍于下謂曰此處崖壁疑可以計登且山多猱思黔人善能捕取汝等亟辦之信宿友直捕得生猱數千遹喜曰事濟矣乃悉以成算授友直且令諸軍曰各備雲梯視山上火發即以進是日友直選所部與祐恭之衆得二千餘紉麻為長炬灌以膏蠟使羣猱背負之暮夜先以數輩登崖巔繫繩梯數十縋而下衆各銜枚挈羣猱次第挽繩梯而登雞方唱衆已悉登及柵乃燃炬縱猱賊廬舍皆茅竹為之羣猱所歷火輒發賊奔呼撲救不暇猱益驚跳火益熾爭前驅逐羣猱官軍已破柵鼓譟擊其後賊猶與官軍力鬭遹望火發令諸軍撾鼓俱以雲梯進賊蹂亂官軍內外相應遂斬關環城而登卜漏從諸酋突圍遁遹命友直及統領官劉慶以步騎五千追至山後擒卜漏及諸酋長遹自入賊境至破輪縛凡所平州二縣八諸囤三十餘城以其地之要害者建置寨堡拓地環二千餘里皆衍沃宜種植畫其疆畝募並邊之人耕之使習戰守如西北弓箭社之制號曰勝兵遹自出師迄還才兩月鬚髮為之盡白庚寅髙麗遣子弟入學是月遼主自將親軍七十萬至駱駝門駙馬蕭特默林牙蕭察喇等將騎兵五萬步卒四十萬至沃稜濼金主自將禦之十二月己亥升遂州為遂寧軍丙午以趙遹為龍圖閣直學士知熙州金主行次爻刺會諸將議皆曰遼兵號七十萬其鋒未易當吾軍逺來人馬疲乏宜深溝髙壘以待從之丁未金主以騎兵親候遼軍獲督餉者知遼主以耶律卓諾叛西還二日矣諸將請追擊之金主曰敵來不迎戰去而追之欲以此為勇耶衆皆悚愧願自效金主曰誠欲追敵約齎以往無事餫饋若破敵何求不得衆皆奮躍追及遼主于護步答岡是役也兵止二萬金主曰彼衆我寡兵不可分視其中軍最堅其主必在焉敗其中軍可以得志乃使右翼先戰兵數交左翼合而攻之遼兵潰金師馳之橫出其中死者相屬百餘里獲輿輦㡩幄兵械軍資他寶物馬牛不可勝計金師乃還己未遼錦州刺史耶律珠徹叛應卓諾遣北面林牙耶律瑪格討之庚申以平晏夷曲赦四川癸亥置瀘南沿邉安撫司以孫羲臾為集賢殿修撰知瀘州充安撫使是歲平江府常湖秀三州水六年春正月丙寅朔遼東京有惡少年十餘乘酒執刃踰垣入留守府問留守蕭保先所在今軍變請為備保先出刺殺之户部使大公鼎聞亂即攝留守事與副留守髙清明集奚漢兵千人盡捕其衆斬之撫定其民東京故渤海地遼太祖力戰二十餘年乃得之而保先嚴酷北海苦之故有是變其禆將渤海髙永昌時以兵三千屯八甔口見遼政日衰金勢方強遂覬覦非常誘渤海并戍卒入遼陽據之旬日之間逺近響應有兵八千人因僣號稱隆基元年遼主遣蕭伊實髙興順招之永昌拒命不從戌子以瀘南獻捷轉宰執一官以童貫為陕西河北宣撫使是日金主下詔曰自破遼兵四方來降者衆宜加優恤自今諸部官民已降或為軍所俘獲逃遁而還者勿罪仍官其酋長且使從宜居處閏月壬寅升潁州為順昌府庚申太府寺丞王鼎奏五禮新儀既已成書欲乞依倣新樂頒行之仍許令州縣召募禮生肆業於官使之推行民間專以新儀從事辛酉開封府尹王革奏乞下國子監委學官將新儀內冠昏喪祭民間所當通知者别編類作一帙鏤板付諸路學事司勸諭學生務令通知節文之意並從之遼貴德州耶律伊都以廣州渤海叛附髙永昌遼主遣蕭韓嘉努張琳討之二月壬申令道教改𨽻祕書省癸未詔訪聞棣州士人劉棟蔬食葆神虛心契道人之隱奧洞然照知處方書符每有應驗可令敦遣赴尚書省審驗外於上清寶籙宫安下仍給路費驛劵遞馬無令失所丁亥詔增廣天下學舍庚寅詔廣京城遼侍御司徒托卜嘉等討卓諾戰于祖州敗績復遣漢人行宫都部署蕭特默率諸將討之卓諾誘饒州渤海及中京賊侯槩等萬餘人攻陷髙州三月癸丑賜上舍生十一人及第乙卯賜王仔昔號通妙先生夏四月乙丑會道士於上清寶籙宫宫建於景龍門對晨暉門密連禁署用道士林靈素言也靈素永嘉人少從浮屠學苦其師笞罵去為道士左街道録徐知常引之以附會諸閹時王仔昔寵稍衰帝訪方士於知常以靈素對一見帝視如舊識靈素大言曰天有九霄而神霄最髙其治曰府神霄玉清王者上帝之長子主南方號長生大帝君陛下是也既下降於世其弟號青華帝君者主東方攝領之已乃府仙卿曰禇慧亦下降佐帝君之治又目蔡京為左元仙伯王黼為文華吏蔡攸為園苑寶華吏鄭居中劉正夫盛章王革及諸巨閹皆有名位而貴妃劉氏方有寵則曰九華玉真安妃也帝心獨喜其説賜號通真先生作上清寶籙宫帝時登皇城下視之由是開景龍門城上作復道通寶籙宫以便齋醮之事辛未尚書右僕射何執中致仕執中輔政一紀年髙疾甚賜之寬告他日造朝命止赴六參起居退治省事遂以太傅就第朝朔望儀物廪稍一如居位時入見帝曰自相位致為臣數十年無此矣執中對曰昔張士遜亦以舊學際遇用太傅致仕與臣適同帝曰當時恩禮恐未必爾執中頓首謝未幾卒贈太師清源郡王諡正獻執中嘗為端王侍講故終始恩遇不替然無所建明惟以謹畏迎順主意贊飾太平而已丁丑詔天寧諸節及壬戍日杖以下罪聽贖丙戌郤監司守臣進獻蔡京三上章乞致仕帝不允庚寅詔京三日一造朝正公相位通治三省事辛卯髙陽關路安撫使吳珍言冀州棗強縣黃河清詔許稱賀五月甲午朔令蔡京遇朔望赴朝三日一知印當筆不赴朝日許府第書押尋又詔自今遇有奏事非造朝日亦赴仍許正謝丁酉廢錫錢庚子以鄭居中為少保太宰兼門下侍郎劉正夫為特進少宰兼中書侍郎時蔡京大興工役民不聊生變亂法度吏無所師居中每為帝言帝亦惡京專乃拜居中太宰使伺察之又以正夫議論數與京異拜為少宰居中存紀綱守格令抑僥幸振淹滯士論翕然望治壬寅以保大軍節度使鄧洵武知樞密院事是月金達嚕攻髙永昌殺之遂陷遼東京州縣永昌使托卜嘉必罕求援于金且曰願併力以取遼金主使呼實布謂永昌曰同力取遼固可東京近地汝輒據之以僣大號則不可若能歸欵當授王爵永昌不從金主乃遣達嚕帥諸軍攻永昌遇遼兵敗之遂取瀋州永昌聞之大懼使家奴鐸刺詣金師請去僣號稱藩達嚕知其詐進兵攻之永昌遂殺胡沙補等率衆拒金遇于活水金師既濟永昌之軍不戰而却逐北至遼陽城下明日永昌盡率其衆與金戰大敗以五十騎奔長松島遼陽人恩勝努仙格執永昌妻子以城降托卜嘉亦執永昌以獻金主命殺之於是遼之東京州縣及南路係遼女真皆降于金金主詔除遼法省賦稅置明安穆琨以達嚕為南路都統倭楊知東京事六月乙丑遼籍諸路兵有雜畜十頭以上者皆從軍丙寅班中書官制格庚午慮囚甲戍詔堂吏遷官至奉直大夫止庚辰遼以秦晉國王淳為上京留守蕭托卜嘉為契丹行宫都部署兼副元帥癸未皇太子立妃朱氏妃祥符人武泰軍節度使伯材女也秋七月壬辰朔以震武城為震武軍甲午以德妃崔氏為貴妃辛亥晏州夷賊卜漏及沅州黃安俊定邉軍李吪􅗹並伏誅詔函首于甲庫壬子曲赦湖北戍午蔡京請名三山橋銘閣曰纘禹冀文之閣門曰銘功之門己未解池生紅鹽辛酉改走馬承受公事為亷訪使者遼渤海二千餘户叛東北路統軍使勒兵追及盡俘以還八月壬戍朔戒北邉帥臣毋生事庚辰蔡京奏臣昨以年逮七十加之疾病乞解機務蒙恩特許三日一朝今臣病已痊筋力尚可勉強伏望許臣日奉朝請其治事即依已降指揮從之壬午詔天下監司郡守搜訪巖谷之士雖恢詭譎怪自晦者悉以名聞丁亥詣建隆觀遂幸蔡京賜第己丑升晉州為平陽府夀州夀春府齊州濟南府是月金薩哈陷遼保州保州本髙麗地薩哈攻之久不克請濟師金主乃益薩哈兵至是拔之九月辛卯朔帝奉玉册玉寶詣玉清和陽宫上尊號曰太上開天執符御厯含真體道昊天玉皇上帝蓋以論者析玉皇大天帝昊天上帝言之不能致一故也丙申赦天下令洞天福地修建宫觀塑造聖像又禁中外不許以龍天君玉帝上聖皇等為名字禁人名字事據洪邁容齋續筆增入癸卯詔定鼎閣于天章閣以方士王仔昔言九鼎神器宜納之禁中不可處外也命蔡京為定鼎禮儀使己未以童貫為開府儀同三司冬十月乙丑太白晝見戊寅張商英復觀文殿學士甲申詔誠感殿長生大帝君神像可遷赴天章閣西位鼎閣奉安考異李燾據王黼宣和殿降聖記云歲在丁酉皇帝乃悟本長生大帝君丁酉蓋政和七年也蔡絛史補亦云政和七年林靈素有神霄玉清王者之説則六年猶未有長生大帝君因以此條為誤書今按宋史六年四月書會道士于上清寶籙宫則其時靈素已見幸宫已建而像已設黼絛所言乃降神之事耳非謂建宫設像亦在七年也辛卯蔡京等言冀州三山河清乞拜表稱賀遼烏古部叛遣中丞耶律托卜嘉等招之庚辰烏爾固部來降十一月甲午詔帝鼐改為隆鼐正南彤鼎為明鼎西南阜鼎為順鼎正西皛鼎為藴鼎西北魁鼎為健鼎正北寶鼎依舊東北牡鼎為和鼎正東蒼鼎為育鼎東南岡鼎為潔鼎鼎閣為圜象徽調之閣閣上神像左周鼎星君中帝席星君右大角星君閣下鼎鼐神像各守逐鼎排列亦用王仔昔建議也己亥祀圜丘赦庚子以禮部尚書白時中為尚書右丞戊申以侯蒙為中書侍郎薛昂為尚書左丞夏人大舉攻涇原靖夏城時久無雪夏人使數萬騎繞城踐之塵起漲天乃潛穿壕為地道入城中城遂陷屠之而去十二月庚申朔金諳巴貝勒武奇邁及羣臣上其主尊號曰大聖皇帝改明年為天輔元年己巳以婉儀劉氏為賢妃乙亥遼封庶人蕭氏為太皇太妃戊寅以熙河進築功成進執政一官乙酉奠九鼎于圜像徽調閣翼日復詣閣行香百官陪位特進少宰劉正夫罷正夫由博士入都馴致宰相能迎時上下持祿養權至是以開府儀同三司致仕是歲出宫女六百人茂州夷郅永夀內附以其地置壽寧延寧軍七年春正月乙未令天下道士與免階墀迎接衙府宫觀科配借索騷擾郡官監司相見依長老法庚子以殿前都指揮使髙俅為太尉是月金軍攻遼春州遼東北面諸軍不戰自潰女古皮室四部及渤海人皆降于金金舍音復陷泰州二月癸亥以大理國主段和譽為雲南節度使大理國王甲子詔通真先生林靈素於上清寶籙宫宣諭青華帝君降臨事初劉混康虞仙姑王老志王仔昔皆為帝所禮然其神怪事多出自方士也及靈素至乃以事歸之於帝而曰已獨佐之每自號小吏佐治故上下莫有攻其非者然靈素實無術徒敢為大言是時帝興道教將十年獨思未有一厭服羣下者靈素因希指造為青華帝君夜降宣和殿事假帝誥天書雲篆帝乃會道士二千餘人于上清寶籙宫俾靈素宣諭其事左街道録傅希烈等皆作記上之此據蔡絛史補增修丁卯御右文殿䇿髙麗進士辛未詔天下天寧萬夀觀改為神霄玉清萬夀宫仍於殿上設長生大帝君青華帝君聖像乙亥幸上清寶籙宫命靈素講道經自是每設大齋費緡錢數萬謂之千道會令士庶入殿聽講帝為設幄其側靈素據髙座使人於下再拜請問然所言無殊絶者時時雜以捷給嘲詼以資媟笑復令吏民詣宫受神霄祕籙朝士之嗜進者亦靡然趨之三月庚寅賜髙麗祭器髙麗進士權適等四人賜上舍及第乙未以童貫權領樞密院丙申升鼎州為常德軍節度壬子御製明堂上梁文夏四月庚申帝諷道録院曰朕乃昊天上帝元子為神霄帝君覩中華被金狄之教焚指煉臂捨身以求正覺朕甚憫焉遂哀懇上帝願為人主令天下歸於正道帝允所請令弟青華帝君權朕神霄之府朕夙夜警懼尚慮我教所訂未周卿等可上表章册朕為教主道君皇帝於是羣臣及道録院上表册之然止用於教門章疏而不施於政事也辛酉升溫州為應道軍節度為林靈素也丙子詔親祀明堂五月戊子朔升慶州為慶陽軍節度渭州為平涼軍節度己丑詣玉清和陽宫上地祇徽號詔曰王者父天母地乃者祗率萬邦黎庶強為之名以玉册玉寶昭告上帝而地祇未有稱謂謹上徽號曰承天效法厚德光大后土皇地祇詣宫上寶册儀禮一如上帝辛卯命蔡攸提舉祕書省并左右街道録院乙未詔權罷宫室修造辛丑祭地于方澤降德音于諸路以監司州縣共為姦贓令亷訪使者察奏仍許民徑赴尚書省陳訴癸卯改玉清和陽宫為玉清神霄宫丁未詔應監司兼領措置起發花石六月戊午朔以明堂成進封蔡京為陳魯國公京辭兩國不拜詔官其親屬二人己未童貫加檢校少傅梁師成為檢校少保宣和殿學士蔡攸盛章開封尹王革顯謨閣待制蔡倏蔡翛各遷官有差皆以明堂成推賞也乙亥蔡京等上表請御明堂聽朝頒常視朔詔答不允表三上乃從之壬午詔禁巫覡丙戌貴妃宋氏薨秋七月丁亥令僧徒如有歸心道門願為道士者許赴輔正亭陳訴立賜度牒紫衣壬辰熙河環慶涇原地震庚子詔八寶內增定命寶今後以九寶為稱仍以定命寶為首建隆以來熟女真嘗由蘇州泛海至登州賣馬故道雖存久閉不通至是女真蘇州漢兒髙藥師曹孝才及僧即榮等率其親屬二百餘人以大舟浮海欲趨髙麗避亂是月為風漂達我界駝基島備言女真既斬髙永昌渤海漢兒羣聚為盜契丹不能制女真攻契丹奪其地已過遼河之西知登州王師中具奏其事朝廷固欲交女真圖契丹聞之甚喜乃詔蔡京及童貫等共議即共奏國初時女真常貢奉而太宗屢詔市馬女真其後始絶宜降詔遵故事以市物為名就令訪聞事體虛實乃詔師中選差將校七人各借以官用平海指揮兵船載髙藥師等齎市馬詔泛海以往考異李燾曰此據金盟本末稍增以北征記如蔡絛所云蔡京久不知上曰太師莫是要作禮數否今皆不取絛私為其父諱獨歸其事於童貫耳要京與貫皆始禍者京偶以十一月六日免簽細務遂欲藉此欺世人固不信也政和初蔡京被召帝戲京子攸謂須進土宜遂得橄欖一小株雜諸草木進之當時以為珍其後又有使臣王永從士人俞輖皆𨽻蔡攸每花石至動數十舟盛章守蘇州及歸作開封尹亦主進奉然朱勔之綱為最四年以後東南郡守二廣市舶率有應奉多主蔡攸至是則又有不待旨者但進物至計會諸閹人閹人亦爭取以獻焉天下乃大騷然矣大率太湖靈璧慈溪武康諸石二浙花竹雜木海錯福建異花荔子龍眼橄欖海南椰實湖湘木竹文竹江南諸果登萊淄沂海錯文石二廣四川異花竒果貢大者越海渡江毁橋梁鑿城郭而至植之皆生成異味珍苞率以健步捷走雖萬里用四三日即達色香未變也蔡京因奏陛下無聲色犬馬之奉所尚者山林竹石乃人之棄物但有司奉行過當可節其浮濫而懲艾之乃作提舉人船所命巨閹鄧文誥領焉又詔監司郡守等不許妄進其係應奉者獨令朱勔蔡攸王永從俞輖陸漸應安道六人聽旨他悉罷之由是稍戢未幾天下復爭獻如故又增提舉人船所進奉花石綱運所過州縣莫敢誰何殆至劫掠遂為大患此據長編所載蔡絛史補修入八月丙辰宣和殿大學士蔡攸奏莊列亢桑文子皆著書以傳後世今莊列之書已入國子學而亢桑子文子未聞頒行乞取其書精加讎定列於國子之籍與莊列並行從之癸亥詔明堂并祀五帝少保太宰鄭居中以母憂去位居中與蔡京不相能及居喪京懼其起復以居中王圭之壻乃使蔡確子懋重理定䇿事以沮之遂追封確清源郡王御製碑文立石墓前而擢懋同知樞密院事懋即渭也丙寅遼命都元帥秦晉王淳赴沿邉會四路兵馬防秋金之拔保州也髙麗兵已在城中金人入守髙麗王使蒲馬如金賀捷且曰保州本吾舊地願以見還金主曰保州近爾邊境聽爾自取今乃勤我師徒破敵城下地何可得也九月戊子詔湖北民力未舒胡耳西道可罷進築辛卯祀上帝于明堂以神宗配享赦天下乙未特進少宰劉正夫卒丙申以御史中丞王安中為翰林學士安中之為中丞也一日請對曰臣起諸生蒙陛下親擢備員中執法日夜懼無以報今臣所論事關宗社儻陛下少留聽採幸甚帝悚然安中出袖中疏所論乃蔡京也帝曰誠如卿言安中即伏奏曰臣孤逺一介不自量力輒論大臣京老姦多智必將為所中害自此竄逐無復再望清光矣願拜辭帝曰勿如此當為卿罷京時蔡攸日夜出入禁中盡率子弟見帝泣且拜帝曰中司文字如此奈何攸等固懇曰陛下儻全臣宗乞移安中一别差遣則事自已矣帝惻然許之安中方草第三疏翌日求對中夜有扣門者曰適御筆中丞除翰林學士日下共職矣安中歎曰吾禍其在此乎自是京之勢益盛此據長編所載王安中行狀修入丁酉西蕃王子益麻黨征降見于紫宸殿癸丑貴妃王氏薨遼主自燕至隂涼河置怨軍八營募自宜州者曰前宜後宜自錦州者曰前錦後錦自乾自顯者曰乾曰顯又有乾顯大營凡二萬八千餘人屯衛州蒺藜山冬十月乙卯朔御明堂平朔左個以是月天運政治布告天下又頒來歲歲運厯數戊寅中書侍郎侯蒙罷蔡京惡之也辛巳詔以來年正月一日祇受受命寶時得于闐大玉踰二尺色如截肪帝乃製為寶文曰範圍天地幽贊神明保合太和萬夀無疆篆以蟲魚制作之工幾於秦璽號曰受命寶帝甚重之曰八寶者國之神器至於定命乃我所自製也十一月庚寅手詔太師魯國公蔡京自再還廊廟于今七年邇者章疏十上卻之復來繼以消息盈虛之理告老乞骸祈於得請而後已朕體貌元老不欲固違可五日一朝次赴都堂治事恩禮寵數並如舊制辛卯鄭居中起復為太宰以余深為特進少宰兼中書侍郎白時中為中書侍郎壬辰復置醴州丙申太傅致仕何執中卒贈太師清源郡王諡正獻升石泉縣為軍十二月甲寅朔有星如月丁巳以薛昂為門下侍郎甲子金咸州都統達嚕克等敗遼秦晉國王淳兵于蒺藜山淳初遺達嚕克書議和達嚕克告於金主金主曰歸我行人薩喇及送阿蘇等則和議可成淳軍蒺藜山達嚕克及知東京事倭楞等進攻顯州遼怨軍帥郭藥師乘夜來襲倭楞擊走之達嚕克遂與淳戰淳敗走達嚕克追至阿爾占陂遂拔顯州於是乾懿豪徽成川惠等州皆降于金遼主下詔自責遣額爾欽察喇與大公鼎諸路募兵戊辰詔天神降于坤寧殿刻石以紀之庚午以童貫領樞密院命户部侍郎孟揆於上清寶籙宫之東築山以象餘杭之鳯凰山號曰萬歲周十餘里辛未御筆改老子道德經為太上混元上德皇帝道德真經癸未以張商英為觀文殿大學士是歲大旱帝以為念侍御史黃葆光上疏言蔡京強悍自專侈大過制無君臣之分鄭居中余深依違畏避不能任天下之責故致此災不報且欲再上章京權勢震赫舉朝結舌葆光獨出力攻之京懼中以他事貶知昭州立山縣又使言官論其附會交結泄漏密語詔以章揭示朝堂安置昭州王仔昔倨傲而戅帝待以客禮故遇宦者若僮奴又欲羣道士宗已林靈素忌之與宦者馮浩誣以言語怨望下獄死資治通鑑後編卷九十九
