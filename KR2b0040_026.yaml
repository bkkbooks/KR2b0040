body:
  text: 資治通鑑後編卷二十六刑部尚書徐乾學撰宋紀二十六起彊圉協洽九月盡著雍涒灘十二月凡一年有竒真宗膺符稽古神功讓德文眀武定章聖元孝皇帝景德四年九月甲子朔知華州張舒與官屬率民錢修孔子廟為民所訟並坐贖金因詔諸州縣文宣王廟自今並官給錢完葺無得輒賦民財庚午三司請令左藏庫出次色金為帶以備賜與帝曰朝廷褒寵近臣惜費豈在于此即詔已成者悉鎔之别用上色金改造帝以庶僚勤事壬申遂詔自今文武官月俸有折支者並給實錢願給他物者亦聽己卯詔羣臣家有藏太祖舊實録者悉上史館無得隱匿時知杭州薛映嵗滿當代帝與宰相議擇其人王旦曰天下重地為朝廷屏翰者不過一二十州若皆得人則鎮撫有方威惠兼著小寇不能為患帝深然之因曰近如宜州止因劉承規虐用其下聚為寇剽延及他境若長吏得人豈致是耶因越班簿指孫僅王濟謂旦曰二人孰優旦曰濟有吏幹可副是選遂改濟工部郎中出知杭州宜賊圍象州久不克曺利用等以大軍擊破之盧成均挈其族來降陳進伏誅利用等入象州安撫軍民分兵捕餘寇自乾德開寶以來用兵及水旱振給慶賜賞賚有司計度支所闕者必稽其數以貸于內藏俟課賦有餘即償之淳化後二十年間嵗貸百萬有至三百萬者纍嵗不能償則除其籍冬十月帝命陳彭年撰內藏庫記述其事出以示王旦等曰此庫乃為計司備經費耳計司有闕必取于民苟非節用何以獲救翰林學士朝迥等上考試進士新格詔頒行之初陳彭年舉進士輕俊喜謗主司宋白知貢舉惡其為人黜落之彭年憾焉于是更定條制多意白舊事而設關防所取士不復揀擇文行止較一日之藝雖杜絶請託然置甲等者或非人望自彭年始也詔翰林學士朝迥等各舉常參官堪知大藩者二人乙卯詔曰拷掠之法素著科條非理擅行兹謂慘酷諸道官有非法訊囚之具一切毁棄种放復自終南山來朝召之也帝令陳堯叟諭意曰朕慮放卷而懷之能副朝㫖誠為美也既而堯叟言放云自被聘召及遷諫署無所補報其幸已甚今主上聖眀朝無闕政若更處之顯位則重增其過矣帝乃遣內侍齎詔賜放欲以樞務處之放上表固讓帝曰放能守分益可嘉也十一月丁丑刑部尚書宋白為兵部尚書致仕白年踰六十圖進不休御史中丞王嗣宗屢使人諷之知樞密院事陳堯叟其子壻也亦數懇勸白不得已始上表帝猶以舊臣未許再表乃許焉庚辰殿中侍御史趙湘上言請封禪中書以聞帝拱揖不答王旦等曰封禪之禮曠廢已久若非聖朝承平豈能振舉帝曰朕之不德安敢輕議初王欽若既以城下之盟毁冦凖帝自是常怏怏他日問欽若曰今將奈何欽若度帝厭兵即繆曰陛下以兵取幽薊乃可刷此耻也帝曰河朔生靈始得休息吾不忍復驅之死地卿盍思其次欽若曰陛下苟不用兵則當為大功業庶可以鎮服四海誇示外國也帝曰何謂大功業欽若曰封禪是矣然封禪當得天瑞希世絶倫之事乃可為既而又曰天瑞安可必得前代蓋有以人力為之者若人主深信而崇奉焉以眀示天下則與天瑞無異也陛下謂河圖洛書果有此乎聖人以神道設教耳帝久之乃可然心憚王旦曰王旦得無不可乎欽若曰臣請以聖意諭旦宜無不可乘間為旦言之旦僶俯而從然帝意猶未决他日晚幸袐閣惟杜鎬方直宿帝驟問之曰卿博逹墳典所謂河出圖洛出書果何事耶鎬老儒不測帝㫖漫應曰此聖人以神道設教耳其言偶與欽若同帝由此意决遂召王旦飲于內中歡甚賜以尊酒曰此酒極佳歸與妻孥共之既歸發視乃珠也旦自是不復持異天書封禪等事始作龜鑑曰謬哉神道設教之言何其敢于自欺如是耶若呼萬嵗者三若有景光者十二武帝之惑于文成五利至今為天下後世笑今之詐又甚于文成五利矣吾誰欺欺天乎自是丁謂則以大計有餘而投之惟演則以獻祥符頌而順之朋邪翼設相率為欺聖眀天子鮮有不為之惑然而天瑞安可必得之言王旦得無不可之論聖心眀知其非雙鶴飛舞之奏帝曰文則文矣恐不為實遽令易奏是帝之心蓋已燭破其姧而不可以惑之也卒至姧人得以售欺而王旦諸賢亦且俯首順從而無異議者或者以邊事方定人心未寧將假是以鎮撫之耳而况岱山之封出于兖州父老之請天子嘗止之曰大事不可輕議汾隂之祠迫于河中父老之進說天子亦以地逺人勞為戒則是行也亦非天子之本心當是時周起有諫馬知節有諫孫奭又數數有諫下至草澤之士亦以持盈守成其道尤難為戒莫不優容而嘉納之奉天有述矣以庇民而並名祥瑞有論矣與勤政而偕作真誠感格瑞以類至圖授包羲策授黃帝自昔亦皆有之恐亦不得盡以為僞也辛巳雨雪帝謂王旦等曰瑞雪盈尺來嵗麥苗應有望也遂賜近臣飲于中書又宴館閣官于崇文院帝作瑞雪詩令三館即席和進兩制次日來上辛卯契丹遣使左領軍衛上將軍耶律元等來賀承天節元館于京師嘗詢左右曰館中日聞鼓聲豈習戰陳耶或對以俳優戲場閭里設宴帝聞之謂宰相曰不若以實諭之諸軍比無征戰閲習武藝亦國家常事耳且可以示無間于彼也十二月乙未手札賜王欽若曰編修君臣事迹官各置厯仍書逐人名下隨卷奏知異時比較功程庶分勤惰欽若為人傾巧所修書或當帝意褒賞所及欽若即自名表首以謝或謬誤有所譴問則戒書吏稱楊億以下所為同僚皆疾之先是帝嘗問輔臣以天下貢舉人數王旦曰萬三千有餘約常例奏名十一而已帝曰若此則當黜者不啻萬人矣典領之臣必須審擇朝迥兢畏當以委之周起王曽陳彭年皆可參預馮拯曰封印卷首尤宜用素有操守之人旦曰滕𤣥晏于士大夫間少交逰帝曰今當以朱㢲代周起知舉令起與𤣥晏同掌封印事于是命翰林學士朝迥知制誥朱巽王曽龍圖閣待制陳彭年同知貢舉始命禮部封印卷首考異按周起𫝊云起創糊名之法又陳靖𫝊亦云糊名考校始于靖蓋靖先請用之殿試起復請用之禮部故起首為彌封官也庚戌同判太常禮院孫奭言伏覩來年正月一日享先農九日上辛祈榖祀昊天上帝按春秋𫝊啓蟄而郊郊而後耕月令云天子以元日祈榖于上帝乃擇元辰親載耒耜躬耕帝藉先儒皆云元日即上辛郊天地元辰謂郊後吉亥享先農而耕藉也六典禮閣新儀並先云上辛祀昊天次云吉亥享先農伏望改用上辛祀昊天後亥日享先農仍即著令詔太常寺與崇文院檢討官詳定既而判寺李宗諤言宋書後魏書所載並以上辛後日享先農請如奭奏從之詔諸路所上軍儲之數自今先下樞密院籍記送中書蓋凡遣戍兵必預度所在資廪豐約故也大中祥符元年春正月乙丑帝召宰臣王旦知樞密院事王欽若等對於崇政殿之西序帝曰朕寢殿中帟幕皆青絁為之旦暮間非張燭莫能辨色去年十一月二十七日夜將半朕方就寢忽一室明朗驚視之俄見神人星冠絳袍告朕曰來月三日宜於正殿建黃籙道場一月當降天書大中祥符三篇勿泄天機朕悚然起對忽已不見命筆志之十二月朔即蔬食齊戒於朝元殿建道場結綵壇九級又雕木為輿飾以金寶恭佇神貺雖越月未敢罷去適覩皇城司奏左承天門屋之南角有黃帛曵於鴟吻之上朕潜令中使往視回奏云其帛長二丈許緘一物如書卷纒以青縷三周封處隱隱有字朕細思之蓋神人所謂天降之書也旦等曰陛下以至誠事天地仁孝奉祖宗恭己愛人夙夜求治以至殊鄰修睦獷俗請吏干戈偃戢年榖屢豐皆陛下兢兢業業日謹一日所致也臣等嘗謂天道不逺必有昭報今者神告先期靈文果降實彰上穹佑德之應皆再拜稱萬嵗又言啓封之際宜屏左右帝曰天若謫示闕政固宜與卿等祗畏改悔若誡告朕躬朕亦當側身自修豈宜隱之而使衆不知也帝即步至承天門焚香望拜命內侍周懷政皇甫繼明考異封禪記不載周懷政今從實録升屋對捧以降旦跪奉而進帝再拜受書置輿上復與旦等步導却繖蓋撤警蹕至道場授知樞密院陳堯叟啓封上有文曰趙受命興於宋付於眘居其器守於正世七百九九定既去帛啓緘命堯叟讀之其書黃字三幅詞類尚書洪範老子道德經始言帝能以至孝至道紹世次諭以清净簡儉終述世祚延永之意讀訖藏以金匱旦等稱賀於殿之北廡是夕命旦宿齊中書晚詣道場旦趨往而帝已先至丙寅羣臣入賀於崇政殿賜宴帝與羣臣皆蔬食遣吏部尚書張齊賢等奏告天地宗廟社稷及京城祠廟丁卯設黃麾仗於殿前陳宫懸登歌文武官契丹使陪列酌獻三清天書禮畢帝步𨗳入內行避黃道司天監奏三日五日有紫雲覆宫殿乞付史館從之戊辰大赦改元文武官並加恩改左承天門為左承天祥符門詔東京賜酺五日以二月一日為始壬申邊臣言趙德明邀留回鶻貢物又令張浦率騎數千侵擾回鶻今嵗夏州饑饉此衰敗之勢也帝曰朕知其旱歉已令𣙜場勿禁西蕃市粒食者蓋撫御外國當務含容不然須至殺伐害及生靈矣趙德明嘗以民飢上表乞糧數百萬帝出其奏示輔臣衆皆怒曰德明方納欵而敢渝誓約妄有干請乞降詔責之王旦請敕三司在京積粟百萬令德明自來取之帝從其言既而德明受詔望闕再拜曰朝廷有人乃止太僕少卿錢惟演獻祥符頌帝嘉之甲申擢司封郎中知制誥天書降之翌日翰林學士李宗諤上皇帝奉迎酌獻樂章優詔答之時學士朝迥知貢舉楊億被病參知政事趙安仁實草詔云二月壬辰朔帝御乾元門觀酺丁酉分遣中使六人錫邊臣宴戊戌帝語輔臣曰京師士庶漸事奢侈衣服器玩多鎔金為飾工人鍊金為箔其徒日繁計所費嵗不下十萬兩浸以成風良可戒也丙午詔三司使丁謂申明舊制募告者賞之自今乘輿服御塗金繡金之類亦不須用富弼曰國之去奢自上者始則天下無不從化真宗朝禁銷金服甚嚴然纍下制令而犯者不絶故內則詔宫中已下外則自大臣之家悉不得以金飾衣服復申嚴憲布於天下自此更無犯者蓋自上者始而法禁明也宋摶等使契丹言契丹惟國母願固盟好而年齒漸衰國主奉佛其弟秦王隆慶尚武吳王隆裕慕道又國相韓德讓専權既久老而多疾帝曰與彼約和已來武臣屢言彼本疲困懼於兵戰今國家嵗贈遺之是資敵也馮拯曰儒臣中亦有此言帝曰武臣無事之際喜談䇿略及其赴敵罕能成功好勇無謀蓋其常耳儒臣豈不知利害耶前代多用儒將然亦難其才也臣乾學曰澶淵之役寇萊公嘗畫百年無事之䇿矣而真宗畏事厭兵曰百年後當有捍禦之者遂使淫后姧臣邀盟結好嵗遺金繒以資敵坐失機㑹至於子孫民力已殫雖明君賢相猶難為功况昏庸如徽宗姧貪如蔡京童貫而辦此耶朱子曰太宗真宗之朝可以有為而不為又曰真宗東封西祀縻費巨萬計不曽做得一事豈非有慨於此而言乎惜哉甲戌兖州父老吕良等千二百八十七人詣闕請封禪對於崇德殿帝令引進使曹利用宣勞而諭之曰封禪大禮歷代罕行難徇所請良等進而言曰國家受命五十年已致太平今天降祥符昭顯盛德固宜告成岱獄以報天地帝復曰此大事不可輕議良等又曰嵗時豐稔華夏安泰願上答靈貺早行盛禮詔賜緡帛遣之知州邵曄又率官屬抗表以請亦不允己卯兖州并諸路進士等八百四十人詣闕請封禪壬午宰相王旦等率文武百官諸軍將校州縣官吏蕃夷僧道耆夀二萬四千三百七十人詣東上閣門凡五上表請封禪夏四月辛卯朔天書又降於大內之功德閣甲午詔以今年十月有事於泰山遂遣官告天地宗廟嶽瀆諸祠乙未以知樞密院事王欽若參知政事趙安仁並為封禪經度制置使初議封禪未决帝以經費問權三司使丁謂謂曰大計固有餘矣議乃决即詔謂計度泰山路糧草引進使曹利用宣政使李神福相度行營道路翰林學士朝迥李宗諤楊億龍圖直學士杜鎬待制陳彭年與太常禮院詳定儀注王旦請依郊禋故事面命五使帝曰升中大禮五使之職當於中書樞密院以班次領之丙申以王旦為大禮使王欽若為禮儀使馮拯為儀仗使陳堯叟為鹵簿使趙安仁為橋道頓遞使其禮儀橋道頓遞使事令拯堯叟分掌之欽若安仁並判兖州仍更迭往乾封縣禁於泰山樵採者山下工役無得調發丁夫止用兖鄆州兵行宫除前後殿外餘悉張幄幕金帛芻糧委三司規度收市或轉輸供用他所須物悉自京輦致無得輒有科率發陜西上供木由黃河浮筏鄆州給置頓之費詔東都緣路禁採捕修建行宫無得侵占民田扈駕步騎輒蹂踐苗稼者御史糾之壬寅帝御崇政殿親試進士仍録題解摹印以示之初於殿廊設幔列坐席標其姓名又揭榜表其次序令視訖就坐命翰林學士李宗諤等八人為考官帝遍至幄次諭宗諤等務極精詳勿遺賢俊翌日又命宗諤等出諸科義題刻板模本遣中使就坐給之宗諤等上所定進士文卷詔宰相覆考訖乃臨軒賜進士鄭人姚曄等及第出身有差先是謝恩始令釋褐是日特賜緑袍鞾笏即命以職丙午詔作昭應宫以奉天書時上封事者言兩漢舉賢良多因兵荒災變所以詢訪闕政今國家受瑞建封不當復設此例於是悉罷吏部科目丙辰詔太祖太宗朝諸路所獻祥禽異獸皆在苑囿可上其數俟封禪禮畢縱之遣使馳詣嶽州采三脊茅三十東備藉神縮酒之用有老人董皓識之授皓州助教賜束帛戊午詔東巡取鄆州臨酅路赴泰山禮畢幸兖州取中都路還京先是監察御史張士遜為貢院監門官時貢舉初用糊名之法士遜白主司有親戚在進士中明日當引試願出以避嫌主司不聽乃自言引去帝是之記名於御屏遂詔自今舉人與試官有親嫌者皆移試别頭是月江南轉運使闕中書進擬人數見郤帝乃自除士遜為之士遜謁宰相王旦於政事堂自言驟領使職願聞善教旦從容曰朝廷𣙜利至矣士遜起謝士遜後徙廣西河北每思旦言不敢妄有興建云五月壬戌王欽若言泰山下醴泉出錫山蒼龍見河北轉運使李士衡奏罷內帑所助錢八萬緡於是又請輦本路金帛芻粟四十九萬赴京東以助祀事帝曰士衡臨事有心力遂賜褒詔因留士衡於澶州管勾東封事有司詳定儀注請於泰山上置圜壇徑五丈髙九尺圜壇東南置燎壇髙一丈二尺方一丈山下封祀壇如圜丘制社首壇如方丘制又為瘞坎於壬地及天地玉牒玉册石䃭金玉匱受命寶之制甚備詔悉從之丙寅命王旦馮拯趙安仁等分撰玉牒玉册文帝諭之曰其文當首叙上天降鑒符瑞沓委次述為民祈福之意初有司請依唐故事皇帝告廟出京泰山社首山並用法駕帝以前詔惟祀事豐潔餘從簡約於是改用小駕儀仗尋改小駕名曰鸞駕辛未趙安仁奏得太僕寺狀金玉輅合先赴泰山輅髙二丈三尺濶一丈三尺所經州縣城門橋道有隘狹請令修拆帝曰若此則勞人矣可於城外過有墳墓處避之三司假內藏庫銀十萬兩從之甲申放後宮一百二十人厚資遣之六月壬辰詳定所上封禪儀注帝覽之曰此儀久廢非典禮具備豈為盡美即手札疑難凡十九事令五使參議釐正而行之命都官員外郎孫奭至契丹境上告以將有事於泰山先是五月丙子帝復夢向者神人言來月上旬復當賜天書於泰山帝即密諭王欽若於是欽若奏是月甲午木工董祚於醴泉亭北見黃素書曳林木之上有字不能識言於皇城使王居正居正見其上有御名馳告欽若欽若等就取得之遂建道場明日跪授中使捧詣闕奏至帝亟召王旦等諭其事欲自出奉迎即命旦為導衛使具儀仗奉迎天書安于含芳園之正殿帝再拜受授陳堯叟啓封其文曰汝崇孝奉育民廣福錫爾嘉瑞黎庶咸知祕守斯言善解吾意國祚延永夀歷遐嵗讀訖召百官示之時久雨頓晴景色澄廓苑中有雲五色讀天書次黃雲如鳯駐殿上賜文武百官泰山醴泉庚戌曲赦兖州繫囚流罪以下辛亥羣臣上尊號曰崇文廣武儀天尊道寶應章感聖明仁孝皇帝秋八月己丑朔上太祖尊諡曰啓運立極英武聖文神德𤣥功大孝皇帝太宗曰至仁應道神功聖德文武大明廣孝皇帝命詳定儀注官朝迥而下習泰山圜臺封祀儀於都亭驛乙巳令天下禁屠宰一月自十月始己酉王欽若來朝獻芝草八千餘本九月戊午令有司勿奏大辟案己未詔告太廟以芝草嘉禾瑞木列於天書輦前及陳於六室庚申命兵部侍郎向敏中權東京留守皇城使劉承圭詣崇政殿上新製天書法物有鶴十四來翔天書扶侍使丁謂奏雙鶴度天書輦飛舞良久翌日帝顧謂曰昨所睹鶴但於輦上飛度若云飛舞良久文則文矣恐不為實卿當易此奏也謂再拜曰陛下以至誠奉天以不欺臨物正此數字所繫尤深皇帝徽猷莫大於此望付中書載於時政記帝俯首許之癸亥奉天書於朝元殿甲子扶侍使等奉天書升玉輅赴太廟南城門內幄殿有頃車駕至詣幄殿酌獻訖奠告六室至太祖太宗室告以嚴配之意帝涕泗交下行祀次白雲如龍鳯仙人正在廟室上有鶴十四來翔庚辰趙安仁獻五色金玉丹紫芝六千七百餘本乙酉帝親習封禪儀於崇德殿初禮官言無帝王親習之文帝曰朕以逹寅恭之意豈憚勞乎是月京東西河北河東江淮兩浙荆湖福建廣南路皆大稔米㪷錢七文冬十月庚寅詔所經州縣採訪民間不便事并市物之價車服權衡度量不如法者舉儀制禁之有竒才異行隱淪不仕者與所屬長吏論薦鰥寡惸獨不能自存者量加振恤官吏政迹尤異民受其惠及不守亷隅昧於政理者孝子順孫義夫節婦為鄊里所稱者並條析以聞官吏知民間利病者亦為録奏司天言五星順行同色辛卯車駕發京師奉侍使奉天書先導辛丑次鄆州壬寅駐蹕知制誥朱巽言奉玉册玉牒至翔鑾驛有神光起昊天玉册上亟遣翰林學士李宗諤馳往致謝丙午次翔鑾驛丁未法駕入乾封縣奉髙宫帝即詣昊天玉册前焚香再拜以謝神光之貺占城大食諸蕃國使以方物迎獻道左大食蕃客李麻勿獻玉圭長尺二寸自言五代祖得自西天屈長者云謹守此俟中國聖君行封禪禮即馳貢之戊申帝齊於穆清殿王欽若等獻芝草三萬八千餘本己酉五色雲起嶽頂帝與近臣登後亭望之名亭曰瑞雲知制誥朱㢲奉玉册牒及圜臺行事官並先升山上以回馬嶺至天門路險絶人給橫板各二兩首施綵帛㢲親從卒推引而上庚戌晝漏未上五刻帝服通天冠絳紗袍乘金輅備法駕至山門改服鞾袍乘步輦以登鹵簿仗衛列于山下黃麾仗衛士親從卒自山址盤道至太平頂凡兩步一人綵繡相間供奉馬止於中路御帳亞獻寧王元偓終獻舒王元稱鹵簿使陳堯叟從登有黃雲覆輦上道經險峻必降輦步進有司議益扶衛皆却之導從者或至疲頓而帝辭氣益壯至御幄召近臣觀玉女泉及唐髙宗明皇二碑前一夕山上大風裂帟幕遲明未已及帝至天氣溫和纎蘿不動奉祀官㸃檢習儀於圜臺祥光瑞雲交相暉映是夕山下罷警場辛亥享昊天上帝於圜臺以太祖太宗配命羣官享五方帝諸神於封祀壇儀衛使奉天書於上帝之座帝衮冕奠獻侍從導衛悉減去茀翟止於壝門籠燭前導亦撤之攝中書侍郎周起讀玉册玉牒文帝飲福攝中書令王旦跪稱曰天賜皇帝太一神策周而復始永綏兆人三獻畢封金玉匱攝太尉王旦奉玉匱置于石䃭攝太尉馮拯奉金匱以降將作監領徒封䃭帝登臺閲視訖還御幄司天監奏慶雲繞壇月有黃輝氛宰臣率從官稱賀山下𫝊呼萬嵗振動山谷帝即日還奉髙宫百官奉迎於谷口日有冠戴黃氣紛郁壬子禪祭皇地祗於社首山如封祀之儀前夕隂晦風勢徑猛不能然燭及行事風頓止天㝢澄霽燭焰凝然封䃭訖紫氣䝉壇黃光如星繞天書匣悉縱四方所獻珍禽竒獸於山下法駕還奉髙宫日重輪五色雲見詔以奉髙宫為㑹真宫癸丑有司設仗衛宫懸於朝覲壇下壇在奉髙宫之南帝服衮冕御壇上之夀昌殿受朝賀大赦天下常赦所不原者咸除之文武官並進秩加恩賜天下酺三日改乾封縣為奉符縣泰山下七里內禁樵採大宴穆清殿又宴近臣及泰山父老於殿門賜父老時服茶帛甲寅車駕發奉符縣次太平驛是日始復常膳帝勞王旦等以久食蔬旦等皆再拜馬知節獨言蔬食唯陛下一人臣等在道未嘗不私食肉帝顧旦等曰知節言是否旦再拜曰誠如知節言知節為人質直類此丙辰次兖州以州為大都督府十一月戊午朔上服鞾袍詣文宣王廟酌獻孔氏家屬陪列有司定儀止肅揖帝特再拜又幸叔梁紇堂命刑部尚書溫仲舒等分奠七十二子先儒暨叔梁紇顔氏帝制贊刻石廟中復幸孔林以樹木擁道降輿乘馬至文宣王墓奠拜詔加諡曰𤣥聖文宣王仍修葺祠宇給近便十户奏塋廟翌日又遣吏部尚書張齊賢等以太牢致祭賜其家錢三十萬帛三百匹以四十六世孫同學究出身聖佑為奉禮郎近屬授官及賜出身者六人又追封叔梁紇為魯國公顔氏為魯國夫人人伯魚母亓官氏為鄆國太夫人又追諡齊太公曰昭烈武成王令青州立廟周文公曰文憲王曲阜縣立廟己未帝御回鑾覃慶樓觀酺凡三日壬戌發兖州丁卯次范縣賜曲阜縣𤣥聖文宣王廟九經三史令兖州選儒生講說又賜太宗御製御書又以經史賜兖州丙子發陳橋次含芳園時近輔淮甸京東河朔之民自泰山迎候車駕者道路不絶丁丑車駕至自泰山扶侍使丁謂奉天書歸大內賜百官休假三日中書樞密院一日帝之巡祭也往還四十七日未嘗遇雨雪嚴冬之候景氣恬和咸以為誠感所致詔以正月三日天書降日為天慶節丁謂請以祥瑞編次撰贊繪畫於昭應宫從之甲申命王旦攝太尉奉上太祖太宗諡册禮畢親享六室乙酉大宴含光殿勞旋也十二月辛卯御朝元殿受册尊號命丁謂李宗諤等編修封禪記從陳彭年之請也丁酉內出泰山封祀上尊酒及玉女白龍王母池水新醴泉賜輔臣詔東京留守司及在京掌事內臣不該賜物者特給之詔江淮發運司部內各留三年之儲以備水旱先是江淮米悉運送京師至是司天監言揚楚之分當水旱為沴防患故也庚戌置京新城外八廂帝以都門之外居民頗多舊例惟赤縣尉主其事至是特置廂吏命京府統之辛亥命户部尚書冦凖知天雄軍兼駐泊都部署契丹使嘗過大名謂凖曰相公望重何故不在中書凖曰主上以朝廷無事北門鎖鑰非凖不可耳吕中曰君子內則小人外小人內則君子外當冦凖之主親征也恐欽若有以沮其議則出於天雄軍及欽若之用國事也恐冦公有以奪其議則亦出於天雄軍然君子在朝廷則朝廷重在邊郡則邊郡重此冦公所以起北使敬畏之心歟許浩曰澶淵之役冦凖奮不顧身竭力捍禦功固在宋而契丹亦實懼之矣凖之用舍彼所屬意故問也使凖於是時微有不平之意而稍露其所以不在之故豈不為所窺乎今權詞以應之儼然若朝廷之重乎邊事而特置於此者敵莫測矣夫在內而能使朝廷重在外而又能使邊境重凖則忠矣真宗有臣如此不使之居內以重夫朝廷顧使之居外而使敵人窺伺可勝惜哉甲寅以南衙為錫慶院先是酺宴則集于尚書省或都亭驛誕節齊㑹則就相國寺帝以佛舍中烹飪優笑有虧恭潔乃令內臣度館於顯敞者易之南衙即太宗尹京時府邸秦王許王繼居焉厥後虛其位故以為院詔進奏院不得非時供報朝廷事宜令進奏官五人為保犯者科違制之罪是嵗天下戶七百九十萬八千有竒口一千七百八十萬有竒契丹主追尊按巴堅廟曰太祖德光曰太宗璟曰世宗烏裕明曰穆宗舒嚕賢曰景宗明記又贈東丹人皇倍為護國皇帝自在太子阮為恭順皇帝契丹蕭圖玉伐甘州回鶻降之資治通鑑後編卷二十六
