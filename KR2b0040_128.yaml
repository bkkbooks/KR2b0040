body:
  text: 資治通鑑後編卷一百二十八刑部尚書徐乾學撰宋紀一百二十八起上章閹茂正月盡玄黓困敦十二月凡三年光宗循道憲仁明功茂德溫文順武聖哲慈孝皇帝諱惇孝宗第三子也母白成穆皇后郭氏紹興十七年九月乙丑生于藩邸孝宗即位封恭王及莊文太子薨孝宗以帝英武類己欲立為太子而以其非次遲之乾道七年二月癸酉乃立為皇太子四月甲子命判臨安府尋領尹事紹熙元年春正月丙辰朔金改元明昌起浙西提點刑獄陳傅良為吏部員外郎傅良自太學録出去朝二十年鬚髮盡白因輪對言曰太祖皇帝垂裕後人以愛惜民力為本熙寧以來用事者取太祖約束一切紛更之諸路上供嵗額增於祥符一倍崇寧重修上供格頒之天下率增至十數倍其他雜斂則熙寧以常平寬剩禁軍闕額之類别項封樁而無額上供起於元豐經制起於宣和總制月樁起于紹興皆迄今為額折帛和買之類又不與焉茶引盡歸於都茶場鹽鈔盡歸於𣙜貨務秋苗斗斛十八九歸於綱運皆不在州縣州縣無以供則豪奪於民於是取之斛面折變科敷抑配贓罰而民困極矣方今之患何但四夷蓋天命之永不永在民力之寬不寬耳豈不甚可畏哉陛下宜以救民窮為己任推行太祖未泯之澤以為萬世無疆之休且言今天下之力竭於養兵而莫甚於江上之軍都統司謂之御前軍馬雖朝廷不得知總領所謂之大軍錢糧雖版曹不得與於是中外之勢分而事權不一施行不專雖欲寬民其道無繇誠使都統司之兵與向者在制置司時無異總領所之財與向者在轉運司時無異則內外為一體內外一體則寬民力可得而議矣帝從容嘉納且勞之曰卿昔安在朕不見久矣其以所著書示朕退以周禮説十三篇上之遷祕書少監兼實録院檢討嘉王府贊讀壬申再蠲臨安民身丁錢三年壬午諫議大夫何淡請置紹熙會計録詔淡同户部長二檢正都司稽考財賦出入之數以聞金上封事者言自古以農桑為本今商賈之外又有佛老與他遊食浮費百倍農嵗不登流殍相望此末作傷農者多故也金主乃下令禁自披剃為僧道者二月辛亥殿中侍御史陽安劉光祖入對言近世是非不明則邪正互攻公論不立則私情交起此固道之消長時之否泰而實國家之禍福社稷之存亡係焉甚可畏也本朝士大夫學術最為近古初非有強國之術而國勢尊安根本深厚咸平景德之間道臻皇極治保太和至於慶厯嘉祐盛矣不幸而壞於熙豐之邪説踈棄正士招徠小人幸而元祐君子起而救之末流大分事故反覆紹聖元符之際羣凶得志絶滅綱常其論既勝其勢既成崇觀而下尚復何言臣始至時聞有譏貶道學之説而實未覩朋黨之分中更外艱去國六載已憂兩議之各甚而恐一旦之交攻也逮臣復來其事果見因惡道學乃生朋黨因生朋黨乃罪忠諫夫以忠諫為罪其去紹聖幾何陛下即位之初凡所進退率用人言初無好惡之私豈以黨偏為主而一嵗之內斥逐紛紛以人臣之私意纍天日之清明往往納忠之言謂為沽名之舉至於潔身以退亦曰憤懟而然欲激怒於至尊必加之以訐訕事勢至此循默乃宜循默成風國家安賴臣欲熄將來之禍故不憚反覆以陳伏冀聖心豁然永為皇極之主使是非由此而定邪正由此而别公論由此而明私意由此而熄道學之譏由此而消朋黨之迹由此而泯和平之福由此而集國家之事由此而理則生靈之幸社稷之福也不然相激相勝展轉反覆為禍無窮臣實未知稅駕之所帝下其章讀者至於流涕何淡見之數日恍惚無措光祖又劾户部尚書葉翥中書舍人沈揆結近習以圖進取比年以來士大夫不慕廉靖而慕奔競不尊名節而尊爵位不樂公正而樂軟美不敬君子而敬庸人既安習以成風謂苟得為至計良由前輩老成零落殆盡後生晚進議論無所據依學術無所宗主正論益衰士風不競幸詔大臣妙求人物必朝野所共屬賢愚所同敬者一二十人參錯立朝國勢自壯臣雖終嵗無所奏紏固亦未至曠官今日之患在於不封殖人才臺諫但有推殘廟堂無所長養臣處當言之地豈以排擊為能哉帝善之初殿中侍御史闕帝方嚴其選一日謂留正曰卿監郎官中有一人焉卿知之乎正沈思久之曰得非劉光祖耶帝笑曰是久在朕心矣及居官果稱職癸丑金地生白毛三月丁卯詔秀王襲封置園廟録趙普後一人乙亥金初設應制及宏詞科辛巳金詔修曲阜孔子廟學夏四月己丑以伯圭為太保嗣秀王即湖州秀國立廟奉神主伯圭謙謹不以近屬自居每入見帝行家人禮宴私隆洽伯圭執臣禮愈恭帝益愛重之丁未殿中侍御史劉光祖以論帶御器械吳端罷初何淡劾免周必大光祖素與淡相厚善嘗過淡淡曰近日之事可謂犯不韙光祖曰周丞相豈無可論第其門多佳士不可并及其所薦者淡不聽時薑特立譙熙載方用事光祖屏人語淡曰曾龍之事不可再淡曰得非薑譙之謂乎光祖曰然既而淡引光祖入便閣有數客在焉視之皆薑譙之徒也光祖始悔失言至是淡同知貢舉光祖除臺官首上學術邪正之章及奏名光祖被旨入院拆號與淡席甫逼淡曰近日風采一新光祖曰非立異也但嘗為大諫言者今日言之耳既出同院謂光祖曰何自然見君所上章數日恍惚餌定志凡他可知也未幾謝深甫除右正言光祖以論吳端忤旨罷淡遷御史中丞議論自此分矣自然淡字也吳端者舊以巫醫為業帝在潛邸時端療夀皇疾有功李后德之帝既受禪擢閣門宣贊舍人又遷帶御器械淡三上疏論之不報給事中胡紘亦封還録黃帝以御筆諭止之淡紘皆聽命光祖再上疏言小人踰分干請而使給諌不得行其職輕名器虧綱紀褻主權是一舉而三失也疏入帝命大臣令都司諭止之光祖言益力帝不樂先是光祖監拆號差誤士人試卷既舉覺放罪矣至是乃用前事徙光祖為太府卿求去不已除潼川轉運判官戊申賜禮部進士余復以下五百三十七人及第出身婺州進士王介策言今之所謂道學者即世之君子正士也君子正士之名不可逐故設為此名一網去之聖明在上而天下以道學為諱將何以立國哉帝嘉歎擢為第三是榜又得李燔道學之譏少沮五月乙卯前丞相趙雄坐所舉以賄敗降秩己未出吳端為浙西馬步軍副總管丙寅修楚州城丙子太白晝見六月金制定親王家人有犯其長史府掾失覺察故縱罪秋七月癸丑詔秀王諸孫並授南班甲寅以葛邲參知政事給事中胡晉臣簽書樞密院事乙卯以留正為左丞相王藺為樞密使癸酉建秀王祠堂于臨安以藏神御如濮王故事八月乙酉金始設常平倉己亥帝率羣臣上夀皇玉牒日厯于重華宫己酉詔造新厯九月己未升劍州為隆慶府冬十月丙午詔內外軍帥各薦所部有將才者十一月壬戌潼川轉運判官王溉撙節漕計代輸井户重額錢十六萬緡詔奬之十二月壬午賜王倫諡曰節愍丙戌樞密使王藺罷時帝厲精初政藺亦不存形迹除目或自中出未愜人心者輒留之納諸御坐每事盡言無隱然疾惡太甚同列多忌之竟為中丞何淡所論罷戊子以葛邲知樞密院事胡晉臣參知政事陳賈以靜江守臣將入奏殿中侍御史林大中極論其庸回無識嘗表裏王淮創為道學之目陰廢正人儻許入奏必再留中善類聞之紛然引去非所以靖國命遂寢金大定初户口才三百餘萬至二十七年户口六百七十八萬九千是嵗户部奏户口六百九十三萬九千二年春正月庚戌朔命兩淮行義倉法詔守令到任半年後具水源湮塞合開修處以聞任滿日以興修水利圖進擇其勞效著明者賞之壬子詔尊高宗為萬世不祧之廟甲寅金始許宫中稱聖主辛酉金皇太后圖克坦氏殂於隆慶宫年四十五太后廣平郡王貞之女也素謙謹每畏其家世崇寵見父母流涕而言曰高明之家古人所忌願善自保持其後家果以海陵事敗蓋其逺慮如此世宗嘗謂諸王妃公主曰皇太子妃容止合度服飾得中爾等當法效之及尊為太后愈加敬儉尤惡聞人過讒佞之言不得入恕以容物未嘗見喜慍之色然義有不可雖至親無所阿徇嘗誡諸姪曰皇帝以我故乃推恩外家當盡忠圖報勿謂小善為無益而弗為小惡為無傷而弗去毋藉吾之貴輒肆非違以干國憲也性好詩書及老莊學純淡清懿造次必於禮逮嬪御以和平其有生子而母亡者視之如己出慈訓無間戊寅雷電雨雹二月庚辰朔大雨雪壬午遣宋之瑞等使金弔祭癸未名新厯曰會元甲申福建安撫使趙汝愚等以盜發所部與守臣監司各降秩一等縣令追停以辛棄疾為安撫使棄疾嘗攝帥每歎曰福州前枕大海為賊之淵藪上四郡民頑獷易亂帥臣空竭緩急奈何至是務為鎮靜未期嵗積鏹至五十萬緡榜曰備安庫謂閩中土狹民稠嵗儉則糴于廣今幸連稔宗室及軍人入倉請米出即糶之候秋價賤以備安錢糴二萬石則有備無患矣又欲造萬鎧招強壯補軍額嚴訓練則盜賊可以無虞事未行臺臣劾其用錢如泥沙殺人如草芥遂丐祠歸祕書郎普城黃裳為嘉王府翊善每勸講必援古證今即事明理凡可以開𨗳王心者無不言也至是遷起居舍人帝方寵任潘景圭臺諫交章論之多被斥逐裳奏言自古人君不能從諫者其蔽有三一曰私心二曰勝心三曰忿心事苟不出於公而以己見執之謂之私心私心生則以諫者為病而求以勝之勝心生則以諫者為仇而求以逐之因私而生勝因勝而生忿忿心生則事有不得其理者焉如潘景圭常才也陛下固亦以常人遇之特以臺諫攻之不已致陛下庇之愈力事勢相激乃至於此宜因事靜察使心無所係則聞臺諫之言無不悅而無欲勝之心待臺諫之心無不誠而無加忿之意矣乙酉詔以陰陽失時雷雪交作令侍從臺諫兩省卿監郎官館職各具時政闕失以聞監察御史林大中以事多中出乃上疏曰仲春雷電大雪繼作以類求之則陰勝陽之明驗也蓋男為陽女為陰君子為陽小人為陰當辨邪正毋使小人間君子當思正始之道毋使女謁之得行吏部侍郎陳騤疏三十條如宫闈之分不嚴則權柄移內謁之漸不杜則明斷息謀臺諌於當路則私黨植咨將帥於近習則賄賂行不求讜論則過失彰不謹舊章則取舍錯宴飲不時則精神昏賜豫無節則財用竭皆切時病出米五萬石賑京城貧民權罷修皇后家廟辛卯布衣余古上書曰陛下自即位以來星見再周當思付託之重朝夕求治為急乃或不然間者側聞宴遊無度聲樂無絶晝日不足繼之以夜宫女進獻不時伶人出入無節宦官侵奪權政隨加寵賜或至超遷內中宫殿已歷三朝何陋之有奚用更建樓臺接於雲漢月榭風亭不輟興作深為陛下不取也甚者奏蕃部樂習齋郎舞乃使幸臣嬖妾雜以優人聚之數十飾怪巾拖異服備極醜惡以致戲笑至亡謂也自古宦官敗國備載方册臣觀宦者之盛莫如方今上而三省下而百司皆在此曹號令之下蓋自副將以至殿步帥各為高價不問勞績過犯驍勇怯弱但如價納賄則特旨專除故將帥率皆貪刻軍士不無飢寒兵器朽鈍士馬羸瘠未嘗過而問焉設有緩急計將安出此為害之大者良由公卿持祿保位備員全身如漢之石慶唐之蘇味道滿朝皆小人也求海內不盜賊民生不塗炭日月不食水旱不作其可得乎臣願陛下以漢文帝為法唐莊宗為戒問安視膳之餘宫庭燕間講讀經史無為南面或鼓琴投壺習射以頥養神性享名教不窮之樂固嵩嶽無涯之夀豈不休哉帝覽書震怒始擬編管言者救之乃送筠州學聽讀考異筠州或作秀州今從宋史光宗紀此書字字剴切薛鑑載之甚略今依宋史全文本補録壬午金敇親王及三品官之家毋許僧尼道士出入丙午金初置王傅府尉官名為官屬實檢制之也丁未金遣完顔亶等來告哀三月丁巳詔自今邊事令宰相與樞密院議仍同簽書癸亥金敇有司國號犯漢遼唐宋等名者不得封臣下丙寅詔福建提點刑獄陳公亮知漳州朱熹同措置漳泉汀三州經界熹初為泉之同安簿知閩中經界不行之害至是訪問講求纎悉備至乃奏言經界為民間莫大之利紹興已推行處公私兩利獨漳泉汀未行臣不敢先一身之勞逸而後一州之利病竊獨任其必可行也然必推擇官吏委任責成度量步畝算計精確畫圖造帳費從官給隨産均稅特許過鄉通縣均紐庶幾百里之內輕重齊同今欲每畝隨九等高下定計産錢而合一州租稅錢米之數以産錢為母每文輸米幾何錢幾何其於一倉一庫受納既輸之後却視原額分𨽻為省計為職田為學糧為常平各撥入諸倉庫版圖一定則民業有經矣但此法之行貧民下户固所深喜然不能自達其情豪家猾吏實所不樂皆善為説辭以惑羣聽賢士大夫之喜安靜厭紛擾者又或不深察而望風沮怯此則不能無慮帝得奏詔監司條具其事且令公亮與熹協力奉行會農事方興熹益加講究冀來嵗行之細民知其不擾而利於己莫不鼓舞而貴家豪右占田隱稅侵漁貧弱者胥為異論以搖之前詔遂格熹請祠去癸酉建寧雨雹大如桃李壞民居五千餘家溫州大風雨雷雹田苗桑果蕩盡夏四月戊寅朔金尚書省言齊民與屯田户往往不睦若令遞相婚姻實國家長久安寧之計從之乙酉金葬孝懿皇太后于裕陵戊子金制諸部內災傷主司應言而不言及妄言者杖七十檢視不以實者罪如之因而有傷人命者以違制論致枉有徴免者坐贓論妄告者户長坐詐不以實罪計贓重從詐匿不輸法癸巳金諭有司自今女真字直譯為漢字國史院專寫契丹字者罷之甲午金改封永中為并王永功為魯王永成為兖王永升為曹王永蹈為鄭王永濟為韓王永德為豳王辛丑徽州火二日乃滅五月己酉朔福州水庚申詔侍從經筵翰苑官自今並不時宣對庶廣咨詢以補治道戊辰金州大火己巳潼川崇慶二府大安石泉淮安三軍興利果合綿漢六州大水六月戊子金禁稱本朝人及本朝言語為蕃違者杖之癸巳詔宰臣執政自今不時內殿宣引奏事司諫鄧馹以言事罷為將作監御史林大中言臺諌以論事不合而遽遷臣恐天下以陛下為不能容不聽秋七月丁未朔詔故容州編管人高登追復原官己未出會子百萬緡收兩淮私鑄鐵錢己巳興州大水漂沒數千家八月御史中丞何淡有本生繼母喪乞有司定所服禮寺言當解官淡上疏引禮不逮事之文請下臺諫給舍議之於是太學生喬嘉朱九成黃會卿移書責之其略曰竊謂人之大倫莫重於父母禮有出繼其服雖異而鍾於天性者未嘗不同也故所承父母則三年終喪而所生父母則心喪三年閣下自長成均而更長臺諫此三綱五常之所繫者也今閣下有所生繼母之喪初請解官莫不義之繼上疏稱逮事不逮事之異中外閧然夫禮經所謂逮事父母則諱王父母不逮事父母則不諱王父母非謂無恩於先祖也蓋逮事父母則親聞父母之言所嘗諱其祖不逮事父母則不聞父母之言所嘗諱其祖是以子莫知其所諱也故本朝方慤解此一節以謂特庶人之禮耳若學士大夫則知尊祖矣何逮事不逮事之拘乎今聞閣下引此欲不持喪恐與禮經相反何者禮經謂逮事父母則從父母之言今閣下所生之父果以繼室為正乎若所生之父果以繼室為正則閣下亦當從而為正不得黜之也今四十餘年以所生繼母事之及其終也反以為生不逮事而不持心喪可乎夫閣下之意必謂所生繼母無生我之恩則不當為之服抑不思黜其所生之母是賤其所生之父也為人子者尚忍言哉不然必以生我者為正而繼之者為不正是閭巷小人知有母而不知有父者非天理之公人倫之正也閣下為天子耳目之官將以厚人倫移風俗正宜致辨於此時奉常禮所由出而請下臺諌給舍議識者有以窺之矣淡方待命六和塔得書乃去甲申寬兩浙𣙜鐵之禁九月壬子召知福州趙汝愚為吏部尚書時知潭州趙善俊得旨奏事殿中侍御史林大中疏劾之且言宗室汝愚之賢當召帝用其言召汝愚而出善俊陸九淵至荆門軍民有訴者無早暮得達令其自持杖以追為立期皆如約而至即為酌情決之多所勸釋其有涉人倫者使自毁其狀以厚風俗不可訓者始置之法境內官吏之貪廉民之習尚善惡皆素知之有訴人殺其子者九淵曰不至是及追究其子果無恙有訴竊取而不知其人九淵出二人姓名使捕至訊之伏辜盡得所竊物還訴者且釋其罪使自新因語吏以某所某人為暴翌日有訴遇奪掠者即其人也乃加追治吏驚以為神申嚴保伍之法盜賊或發擒之不逸一人羣盜屏息荆門為次邊而無城九淵以為郡居江漢之間為四集之地南捍江陵北援襄陽東護隨郢之脅西當光化夷陵之衝荆門固則四鄰有所恃否則有胸脅腹心之虞由唐之湖陽以趨山則其涉漢之徑已在荆門之脅由鄧之鄧城以涉漢則其趨山之道已在荆門之腹自此之外間道之可馳漢津之可涉坡陀不能以限馬灘瀨不能以濡軌者所在尚多自我出奇制勝徼敵兵之腹脅者亦正在此雖四山環合易於備禦而城池闕然將誰與守乃請於朝而城之自是民無邊憂罷關市吏譏察而減民稅商賈畢集稅入日增舊用銅錢以其近邊以鐵錢易之而銅有禁復令貼納九淵曰既禁之矣又使之輸耶盡蠲之平時教軍伍射郡民得與中者均賞薦其屬不限流品嘗曰古者無流品之令而賢不肖之辨嚴後世有流品之分而賢不肖之辨略每旱禱即雨郡人異之故事上元則設齋醮曰為民祈福九淵不設但會士民於公廳講洪範皇極斂時五福一章代醮事大略言五福但當論人一心此心若正無不是福此心若邪無不是禍逾年政行令修民俗為變諸司交薦丞相周必大稱荆門之政以為躬行之效云九淵與兄九齡九韶號金溪三陸乾道中九齡調興國軍教授未上會湖南茶冦剽廬陵聲搖旁郡舊有義社以備冦郡從衆請以九齡主之門人多不悅九齡曰文事武備一也古者有征討公卿即為將帥比閭之長則伍兩之卒也士而恥此則豪俠武斷者專之矣遂領其事調度屯禦皆有法冦雖不至而郡縣倚以為重九韶隱居山中晝之言行夜必書之其家纍世義居一人最長為家長一家之事聽命焉嵗選子弟分任家事凡田疇租稅出內庖㸑賔客之事各有主者九韶以訓戒之辭為韻語晨興家長率衆子弟謁先祠畢擊鼓誦其辭使列聽之子弟有過家長會衆子弟責而訓之不改則撻之終不改則言之官府屏之逺方焉冬十月甲申復吳端帶御器械十一月丙午朔金制諸女真人不得以姓氏譯為漢字戊申安定郡王子彤卒甲寅金禁伶人不得以厯代帝王為戲及稱萬嵗犯者以不應為重法科戊午夏人殺金邊將阿嚕岱夏人肆牧於鎮戎之境邏卒逐之夏人執邏卒而去阿嚕岱率兵詰之夏廂官吳明契信陵都卜祥徐餘立伏兵三千於澗中阿嚕岱中流矢死詔索殺阿嚕岱者夏人處以徒刑索之不已夏人乃殺明契等甲子金制投匿名書者徒四年己巳加諡高宗曰受命中興全功至德聖神武文昭仁憲孝皇帝初帝欲誅宦者近習皆懼遂謀離間三宫帝疑之不能自解會帝得心疾夀皇購得良藥欲因帝至宫授之宦者遂訴於皇后曰太上合藥一丸俟宫車過即投藥萬一不虞奈宗社何后覘藥實有心銜之頃之內宴后請立嘉王擴為太子夀皇不許后曰妾六禮所聘嘉王妾親生也何為不可夀皇大怒后退持嘉王泣訴於帝謂夀皇有廢立意帝惑之遂不朝夀皇一日帝浣手宫中覩宫人手白悅之他日后遣人送食合于帝啓之則宫人兩手也黃貴妃有寵因帝祭太廟宿齋宫后殺貴妃以暴卒聞及郊風雨大作黃壇燭盡滅不能成禮而罷帝既聞貴妃卒又值此變震懼增疾自是不視朝政事多決于后后益驕恣夀皇聞帝疾亟往南內視之且責后后怨愈深伶人胡永年積官至武功大夫遇郊乞任子吏部尚書趙汝愚奏永年樂官不當任子著為令十二月乙酉金罷契丹字丁亥帝始召對輔臣于內殿乙未增楚州更戍兵一千五百人甲辰詔內侍省都知楊皓懷姦凶恣刺面杖脊配吉州押班黃邁私相朋附決杖編管撫州尋送皓撫州邁常州居住馬大同為户部侍御史林大中劾其用法嚴峻帝欲易置他部大中曰是嘗為刑部固以深刻稱章三上不報又論大理少卿宋之瑞章四上亦不報大中以言不行求去改吏部侍郎不拜乃除大中直寶謨閣與大同之瑞俱出知外郡初占星者謂朱熹曰某星示變正人當之其在林和叔乎和叔大中字也至是熹遺書朝士曰聞林和叔入臺無一事不中的去國一節風義凜然當於古人中求之三年春正月乙巳朔帝有疾不視朝起居舍人陳傅良奏曰一國之勢猶身也壅底則致疾今日遷延某事明日阻節某人即有姦險乘時為利則內外之情不接威福之柄下移其極至於天變不告邊警不聞禍且不測矣庚戌蠲四川鹽酒重額錢九十萬緡出度僧牒二百收淮東鐵錢二月丁酉申嚴錢銀過淮之禁閏月丙午禁郡縣新作寺觀壬戌詔州縣未斷之訟監司毋得移獄違者許執奏甲子成都路轉運判官王溉以代民輸激賞等絹錢三十三萬緡詔進一官仍令再任三月辛巳帝疾稍愈始御延和殿聽政封子濤為安定郡王帝自有疾重華溫凊之禮以及誕辰節序屢以夀皇傳旨而免至是宰輔百官下至韋布之士以過宫為請者甚衆至有叩頭引裾號泣者帝開悟有命駕意竟不果行都人始以為憂甲申築峽州城丁亥金賜孝子劉瑜劉慶祐絹粟旌其門閭復其身瑜棣州人慶祐錦州人也己亥詔技藝補授之人毋得奏補著為令夏四月金瀛王瓌卒瓌鄆王琮之同母弟也重厚寡言內行修飭工詩精於騎射書藝金主令在左右及卒三臨奠哭之慟諡文敬乙卯以户部侍郎丘崈為四川安撫制置使初留正帥蜀慮吳氏世將謀去之不果至是議更蜀帥正言西邊三將惟吳氏世襲兵柄號為吳家軍不知有朝廷遂以户部侍郎丘崈往崈陛辭奏曰臣入蜀後吳挺脫至死亡兵權不可復付其子臣請得以便宜撫定諸軍許之戊午帝朝重華宫金賜雲內孝子孟興絹粟興早喪父事母孝謹母沒喪葬盡禮事兄如事其父又賜同州人妻師氏諡曰節師氏夫亡孝養舅姑姑病刲臂肉飼之姑即愈舅姑既沒兄師逵與夫姪規其財産偽立媒證致之官必欲嫁之師氏畏逼乃投縣署井中而死是月金主以旱災下詔責躬五月帝有疾不視朝戊寅金出宫女一百八十三人庚子常德大水入其郛己亥蠲四川水旱郡縣租賦安豐軍大水平地三丈餘漂田廬絲麥皆空六月辛丑朔下詔戒飭風俗禁民奢侈與士為文浮靡吏苟且飾偽者以禮部尚書陳騤同知樞密院事乙丑金以民乏食詔户部預給百官冬季俸令就倉以時直糶與貧民秋七月己巳刺沿邊盜萬人為諸州禁軍壬申監文思院常良孫坐贓配海外前丞相周必大坐繆舉良孫降秩壬午瀘州騎射卒張信等作亂殺其帥臣張孝芳甲申軍士卞進張昌擊殺信己亥金主謂宰臣曰聞諸王傅尉多苛細舉動拘防亦非朕意是職之設本欲輔導諸王使歸之正得其大體而已平章政事瓜爾佳清臣曰請以聖意遍行之金主曰已諭之矣八月辛亥金尚書省奏提刑司察舉河中胡光謙年雖八十三尚可任用召赴闕命學士院以雜文試之稱旨特賜光謙進士及第授太常寺奉禮郎舊設是職未嘗除人以光謙德行才能故特授之戊午總領四川財賦楊輔奏已蠲東西兩川畸零絹錢四十七萬緡激賞絹六萬六千匹詔奬之自是嵗以為例九月丙申勸兩淮民種桑冬十月壬寅修大禹陵廟辛亥帝詣重華宫進香壬子金有司奏增修曲阜宣聖廟畢敕黨懷英撰碑文朕將親行釋奠之禮其檢討典故以聞甲寅金敕置常平倉處並令州府官以本職提刑縣官兼管勾其事以所糴多寡酌量升降永為之制戊午金主諭尚書省訪求博物多聞之士癸亥金主遣諭諸王傅尉曰朕分命諸王出鎮蓋欲政事之暇安便優逸有以自適耳然慮其舉措之間或違於理所以分置傅尉使勸導彌縫不入於過失而已若公餘遊宴不至過度亦復何害今聞爾等或用意太過凡王門細碎之事無妨公道者一一干與贊助之道豈當如是宜各思職分事舉其中無失禮體仍就諭諸王使知朕意十一月壬申賑襄陽府被水貧民丙子金詔臣庶名犯古帝王而姓復同者禁之周公孔子之名亦令回避內侍陳源為夀皇所逐蓄憾已深帝即位自郴州召還源與其黨楊舜卿林億年朝夕離間兩宫故帝雖疾平猶疑畏不朝重華丙戌日南至丞相留正率百官詣重華宫拜夀稱賀兵部尚書羅點給事中尤袤中書舍人黃裳御史黃度尚書左選郎官葉適等皆上疏請帝朝重華宫不從祕書郎清江彭龜年以書譙趙汝愚且上疏言夀皇之事高宗備極子道此陛下所親覩也况夀皇今日止有陛下一人聖心拳拳不言可知特遇過宫日分陛下或遲其行則夀皇不容不降旨免到蓋為陛下辭責於人使人不得以竊議陛下其心非不願陛下之來自古人君處骨肉之間多不與外臣謀而與小人謀之所以交鬭日深疑隙日大今日兩宫萬萬無此然臣所憂者外無韓琦富弼吕誨司馬光之臣而小人之中已有任守忠者在焉惟陛下裁察又言使陛下虧過宫定省之禮皆左右小人間諜之罪宰執侍從臺諫但能仗父子之義責望人主至於疑間之根盤固不去曾無一語及之今內侍間諜兩宫者固非一人獨陳源在夀皇朝得罪至重近復進用外人皆謂離間之機必自源始宜亟發威斷首逐陳源然後肅命鑾輿負罪引慝以謝夀皇使父子歡然宗社有永顧不幸與及汝愚入對又往復規諌帝意乃悟汝愚更屬嗣秀王伯圭調護於是兩宫之情始通辛卯帝朝重華宫皇后繼至從容竟日都人大悅戊戌詔李純乃皇后親姪可特除閣門宣贊舍人除袐書郎彭龜年為起居舍人入謝帝曰此官以待有學識人念非卿無可者龜年述祖宗之法為內治聖鑑以進帝曰祖宗家法甚善龜年曰臣是書大抵為宦官女謁之防此曹若見恐不得數經御覽帝曰不至是皇后益驕奢封其先三代為王家廟踰制衛兵多於太廟后歸謁家廟推恩親屬二十六人使臣一百七十二人下至李氏門客亦奏補官是嵗陸九淵卒于荆門軍會葬者以千數私諡曰文安九淵之學務窮本原不為章句訓詁唯篤信孟子之書嘗謂學者汝耳自聰目自明事父自能孝事兄自能弟本無欠闕不必他求在乎自立而已又曰此道與溺於利欲之人言猶易與溺於意見之人言却難或勸九淵著書曰六經注我我注六經又曰學苟知道六經皆我注腳學者稱象山先生秦檜當國無道程氏學者九淵兄九齡獨尊其説而九淵則謂伊川之言不類孔孟張栻與九齡不相識晚嵗以書講學期以世道之重吕祖謙嘗稱之曰子夀所志者大所據者實公聽並觀却立四顧弗造於至平至粹之地弗措也初九淵嘗與朱熹會鵝湖論辨所學多不合及熹守南康九淵訪之熹與至白鹿洞九淵為講君子小人喻義利一章聽者或至泣下熹以為切中學者隱微深痼之病門人楊簡袁燮舒璘沈煥能傳其學資治通鑑後編卷一百二十八
