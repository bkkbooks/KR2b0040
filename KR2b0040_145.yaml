body:
  text: 資治通鑑後編卷一百四十五刑部尚書徐乾學撰宋紀一百四十五起屠維協洽正月盡重光作匿十二月凡三年理宗建道備德大功復興烈文仁武聖明安孝皇帝開慶元年春正月乙巳朔詔飭中外奉公法圖實政國子監主簿徐宗仁伏闕上書曰賞罰者軍國之綱紀賞罰不明則綱紀不立今天下如器之欹而未墜於地存亡之機間不容髮兵虛將惰而力匱財殫環視四境類不足恃而所恃以維持人心奔走豪傑者惟陛下賞罰之微權在耳權在陛下而陛下不知所以用之則未墜者安保其終不墜乎臣為此懼久矣陛下當危急之時出金幣賜土田授節鉞分爵秩尺寸之功在所必賞故當悉心效力圖報萬分可也自出兵越江踰廣以來凡閲數月尚未聞有死戰陳死封疆死城郭者豈賞罰不足以勸懲之耶今通國之所謂佚罰者乃丁大全袁玠沈翥張鎮吳衍翁應弼石正則王立愛高鑄之徒而首惡則董宋臣也是以廷紳抗疏學校叩閽至有欲借尚方劍為陛下除惡而陛下乃釋而不問豈真欲愛護此數人而重咈千萬人之心哉今天下之事勢急矣朝廷之紀綱壞矣若誤國之罪不誅則用兵之士不勇東南一隅半壞於此數人之手而罰不損其毫毛彼方擁厚資挾聲色髙卧華屋而使陛下與二三大臣焦心勞思可乎三軍之在行者豈不憤然不平曰稔禍者誰歟而使我捐軀兵革之間百姓之罹難者豈不羣然胥怨曰召亂者誰歟而使我流血鋒鏑之下陛下亦嘗一念及此乎又極論邊事謂惠䙝而威不振論董宋臣盤固已久䝉蔽日甚又請使有言責者皆得以盡其言則國論深而國威振臣雖屏處山林亦有生氣不報時又有旴江廖應淮者抱負竒氣通方技諸家學詣臨安上疏言丁大全誤國狀大全怒中以法配漢陽軍應淮荷校行歌出都門道旁觀者嘖嘖壯之此據宋濓溟涬生贊序修入己酉蒙古兵攻忠涪漸薄䕫境詔蒲擇之馬光祖戰守調遣便冝行事丁卯賈似道以樞密使為京西湖南北四川宣撫大使移馬光祖為沼江制置使史巖之副之似道尋兼督江西二廣人馬通融應援上流䝉古兵破利州隆慶順慶諸郡閬蓬廣安守將相繼降䝉古烏蘭哈達率四王騎兵三千蠻僰萬人破橫山狥內地守將陳兵六萬以俟烏蘭哈達濳自間道衝其中堅大敗之乘勝蹴賔象二州入靜江府連破辰沅直抵潭州官軍斷其歸路烏蘭哈達出官軍後命其子阿珠夾擊官軍敗走遂壁潭州城下蒙古主遣降人晉國寶招諭合州守王堅臣執之殺於閲武場䝉古主遂命大將琿塔噶以兵二萬守六盤竒塔特布哈守青居山命耨埒造浮梁于涪州之藺布以杜援兵二月䝉古主自雞爪灘渡直抵合州城下俘男女萬餘堅力戰以守蒙古主會師圍之己丑詔蠲建康太平寧國池州廣德等處沙田租三月丁巳以吕文德為四川制置副使蒲擇之在蜀無功故以文德代之尋命兼湖北安撫使時䝉古軍中大疫將議班師庚申馬光祖奏䝉古兵自烏江還北辛酉雨土夏四月甲戌朔以段元鑑楊禮殁于王事立廟賜額各官一子是月蒙古兵在合州城下大雷雨凡二十日五月甲辰朔城金州開州辛未賜禮部進士周應炎以下四百四十二人及第出身婺州大水發義倉賑之六月吕文德乘風順攻涪水浮梁力戰得入重慶即率艨艟千餘泝嘉陵江而上䝉古史天澤分軍為兩翼順流縱擊文德敗績天澤追至重慶而還辛巳以朱熠參知政事饒虎臣同知樞密院事合州受圍自二月至于是月王堅固守力戰䝉古主屢督諸軍攻之不克前鋒將汪德臣選兵夜登外城堅率兵逆戰遲明德臣單騎大呼曰王堅我來活汝一城軍民冝早降語未既幾為飛石所中因得疾卒㑹天大雨攻城梯折後軍不克進而止秋七月庚戌參知政事蔡抗致仕癸亥卒諡文肅是日蒙古主䝉格殂于釣魚山夀五十二後追諡桓肅皇帝廟號憲宗史天澤與羣臣奉喪北還留布哈爾及布爾札同領重慶軍馬於是合州圍解憲宗沉斷寡言不樂宴飲不好侈靡雖后妃亦不許之過制初定宗朝羣臣擅權政出多門帝即位凡有詔㫖必親起草更易數四然後行之御羣臣甚嚴嘗諭㫖曰爾輩每得朕奬諭之言即志氣驕逸志氣驕逸而災禍有不隨至者乎爾輩其戒之性喜畋獵自謂遵祖宗之法不蹈襲他國所為然酷信巫覡卜筮之術凡行事必謹叩之殆無虛日八月䝉古呼必賚遣楊惟中郝經宣撫荆湖江淮將歸德軍先至江上經言于呼必賚曰經聞圖天下之事於未然則易救天下之事於已然則難已然之中復有未然者使往者不失而來者得遂是尤難也國家奮起朔漠滅金源并西夏蹂荆襄克成都平大理􅏳躒諸夷奄征四海垂五十年遺黎殘姓游氣驚魂䖍劉劘蕩殆欲殱盡自古用兵未有若是之久且多也且括兵率賦朝下令夕出師闔境大舉伐宋而圖混一以志則鋭以力則强而術則未盡也茍於諸國既平之後創法立制敷布條綱任將相選賢能平賦足用屯農足食內治既舉外禦自備今西師之出久未即功兵連禍結底安於危王宜遣人禀命行在遣使諭宋令降名進幣割地納質偃兵息民以全吾力而圖後舉禀命不從然後傳檄示以大信使知殿下仁而不殺之意一軍出襄鄧一軍出壽春一軍出維揚三道並進東西連衡殿下處一軍為之節制使我兵力常有餘裕如是則未來之變或可弭已然之失或可救也丙戌㑹兵渡淮呼必勒由大勝關張柔由虎頭關分道並進官軍皆遁壬辰次黃陂得沿江制置司榜有云今夏諜者聞北兵㑹議取黃陂民船繫筏由陽邏堡以渡㑹于鄂州呼必賚曰此事前所未有願如其言時沿江制置副使袁玠徴漁利虐甚蒙古兵至黃陂漁人獻舟為鄉𨗳九月壬寅朔親王孟克自合州遣使以憲宗凶問告呼必賚請北還以繫人望呼必賚曰吾奉命南來豈可無功遽還甲辰登香爐山俯瞰大江大江之北曰武湖武湖之東曰陽邏堡其南岸即滸黃州官軍以大舟扼江渡軍容甚盛董文炳言於呼必賚曰長江天險宋所恃以為國勢必死守不奪其氣不可臣請嘗之乙巳文炳率死士數十百人當其前令其弟文用文忠載艨艟鼓櫂疾趣呌呼畢奮鋒既交文炳麾衆趨岸搏戰官軍大敗明日帥諸軍渡江軍士有擅入民家者以軍法從事凡所俘獲悉縱之進圍鄂州中外大震己未嗣濮王善騰卒庚申下詔責己勉諭諸閫進兵以右諫議大夫戴慶炣僉書樞密院事䝉古兵至臨江時制置使徐敏子在隆興頓兵不進知軍事陳元桂力疾登城督戰力不能敵有欲抱而走者元桂曰死不可去此左右俱遁兵至元桂瞪目叱罵遂死之懸其首於敵樓事聞贈寶章閣待制官其二子諡正節䝉古兵入瑞州知州陳昌世治郡有善政百姓擁之以逃詔諸路出師以禦蒙古大出內府銀幣犒師前後出緡錢七千七百萬銀帛各一百六萬兩匹䝉古侵軼日甚右丞相丁大全匿不以聞冬十月丁未朔罷判鎮江府壬申以吳濳為左丞相兼樞密使賈似道為右丞相兼樞密使職任依舊屯漢陽以援鄂濳入相首言鄂渚被兵湖南擾動推原禍根由近年奸臣險士設為虛議迷國誤君附和逢迎媕阿諂媚公道晦蝕私意橫流仁賢空虛名節喪敗忠嘉絶響諛佞成風天怒而陛下不知人怨而陛下不察稔致兵戈之禍積為宗社之憂章鑑髙鑄嘗與丁大全同官傾心附麗躐躋要途蕭泰來等羣小噂㳫國事日非浸淫至于今日沈炎實趙與籌之腹心爪牙而任臺臣甘為之摶擊奸黨盤據血脈貫穿以欺陛下致危亂者皆此等小人為之乞令大全致仕炎等與祠鑄等羈管州軍不報壬午沿江制置副使知江州袁玠以貪殘削五秩竄南雄州尋詔除名不叙移萬安軍中書舍人洪芹言丁大全鬼蜮之資穿窬之行引用凶惡陷害忠良遏塞言路濁亂朝綱乞追官逺竄以伸國法御史朱貔孫等相繼論大全奸回險狡狠害貪殘假陛下之刑威以箝天下之口挾陛下之爵祿以籠天下之財饒虎臣又論其絶言路壞人才竭民力誤邊防四罪癸未詔大全落職致仕乙酉雷時邊報日急臨安團結義勇招募新兵增築平江紹興慶元城堡朝野震恐內侍董宋臣請帝遷都四明以避鋒鏑軍器太監何子舉言于吳濳曰若上行幸則京師百萬生靈何所依賴御史朱貔孫亦言鑾輿一動則三邊之將士瓦解而四方之盜賊蜂起必不可㑹皇后亦請留蹕以安民心帝遂止寧海節度判官文天祥乞斬宋臣不報十一月乙卯以趙葵為江東西宣撫使許便宜行事䝉古圍鄂州都統張勝權州事以城危在旦夕登城諭之曰城已為汝家有但子女玉帛皆在將臺可從彼取蒙古信之遂焚城外民居將退㑹高逹等引兵至賈似道亦駐漢陽為援蒙古乃復進攻遣徹辰巴圖爾領兵同降人諭鄂州使降抵城下勝殺使者以軍出襲徹辰巴圖爾戰敗死逹恃其武勇殊易似道每見督戰即戲之曰巍巾者何能為哉將戰必須似道親勞始出否則使兵士譁於其門吕文德諂事似道使人訶曰宣撫在此何敢爾耶曹世雄向士璧皆從在軍事未嘗關白似道由是銜三人而親文德時諸路重兵咸聚于鄂䝉古兵由永全至潭州江西大震吳濳用御史饒應子言移賈似道于黃州黃雖下流實當兵衝孫虎臣以精騎七百送之至蘱草坪候騎言前有北兵似道大懼謂左右曰奈何虎臣匿似道出戰似道歎曰死矣惜不光明俊偉爾及北兵至乃老弱部所搶金帛子女而還者江西降將儲再興騎牛先之虎臣出擒再興似道遂入黃州閏月丁丑以向士璧為湖南制置副使知潭州甲申以吕文德為京西湖北安撫使知鄂州䝉古呼必賚攻鄂州益急城中死傷至萬三千人烏蘭哈達略地諸蠻又由交趾歷雍桂抵潭州賈似道聞之大懼十二月己亥密遣宋京詣蒙古營請稱臣納幣呼必賚不許㑹合州守臣王堅使阮思聰棹急流走鄂以䝉古主訃聞似道再遣京往時䝉古阿拉克岱爾琿塔噶托和斯托爾齊等謀立阿爾布格阿拉克岱爾使托爾齊括兵于漢南諸州而又乘傳行漠北諸郡調兵去開平僅百餘里皇后鴻吉哩氏使人謂之曰發兵大事太祖皇帝曽孫珍戩在此何故不令知之阿拉克岱爾不能答又聞托爾齊亦至燕后即遣使馳至呼必賚軍前密報令速還呼必賚召羣臣議郝經曰易言知進退存亡而不失其正者其唯聖人乎國家自平金以來惟務進取老師費財三十年矣今國內空虛塔齊爾錫喇諸王觀望所立莫不覬覦神器一有狡焉或啓戎心先人舉事腹背受敵大事去矣且阿爾布格已令托爾齊行尚書省據燕都按圖籍號令諸道行皇帝事矣雖大王素有人望且握重兵獨不見金世宗海陵之事乎若彼果稱遺詔便正位號下詔中原行赦江上欲歸得乎願大王以社稷為念與宋議和令割淮南漢上梓䕫兩路定疆界嵗幣置輜重率輕騎而歸直造燕都則彼之奸謀氷釋瓦解遣一軍逆大行靈舁收皇帝璽遣使召錫喇阿爾布格孟克諸王㑹喪和林差官于諸路撫慰安輯命王子珍戩鎮守燕都示以形勢則大寶有歸而社稷安矣呼必賚以為然㑹宋京至請稱臣割江南為界嵗奉銀絹匹兩各二十萬呼必賚許之遂拔寨而去留張傑閻旺以偏師候湖南烏蘭哈達之兵似道奏鄂州圍解詔論功行賞丁未熒惑犯房宿鉤鈐星辛亥詔改明年為景定元年蒙古烏蘭哈達攻潭州甚急帥臣向士璧極力守禦既置飛江軍又募斗弩社朝夕登城撫勞聞䝉古後軍且至遣王輔佑師五百衆覘之遇于南嶽市大戰却之呼必賚遣默德齊將來迎烏蘭哈達遂解圍引兵趣湖北䝉古呼必賚軍還至燕托爾齊方括民兵民甚苦之呼必賚詰其由託以憲宗臨終之命呼必賚知其將為亂所集兵皆縱之人心大悅景定元年春正月丙子詔奬賈似道功庚辰嵗星熒惑合于尾乙未城潼川仙侣山二月蒙古張傑閻旺作浮橋于新生磯烏蘭哈達兵至傑等濟師北還賈似道用劉整計命夏貴以舟師攻斷浮橋進至白鹿磯殺殿卒百七十人辛酉䝉古遣偏師取道大理由廣南抵衡州向士璧合劉雄飛兵逆戰于道敗之奪還俘民甚衆賈似道賜金器千兩幣千匹丙寅䝉古兵犯分寧武寧二縣河湖寨都監張興宗死之三月戌辰朔日有食之賈似道匿議和稱臣納幣之事以所殺獲俘卒殿兵上表言諸路大捷鄂圍始解江漢肅清宗社危而復安實萬世無疆之休帝以似道有再造功下詔褒美賞賚甚厚以少傅右丞相召入朝乙酉蒙古兵至漢陽鄂州統制張勝力戰死丙戌賈似道上言自鄂趣黃與北朝回軍相遇諸將用命捍禦大戰敗之白氣如匹練亘天䝉古呼必賚還至開平亷希憲聞阿爾布格命劉太平及大將霍魯海行尚書省事于關右恐結諸將以動秦蜀請遣趙良弼往覘之良弼得實還報時諸王哈坦孟克塔齊爾與諸大臣俱㑹于開平錫喇亦自西域遣使至並勸進惟阿爾布格不至呼必賚三讓諸王大臣固請希憲良弼及商挺等力言先發制人後發人制逆順安危間不容髮宜早定大計辛卯呼必賚即位是為色辰皇帝䝉古陜西宣撫使亷希憲言髙麗國王㬚嘗遣世其子倎入覲㑹憲宗將兵攻宋倎留三年不遣今聞㬚已死若立倎遣歸國彼必懷德是不煩兵而得一國也蒙古主是其言改館倎遣兵衛送之仍赦其境內夏四月戊戌朔蒙古立中書省以王文統為平章政事張文謙為左丞文統本李璮幕屬有薦其才智者遂得親幸更張庶務悉委裁處文統性忌刻而文謙以安國便民為務屢相可否積不能平思有以陷之文謙遂求出宣撫大名臨發語文統曰民困日久况當大旱不量减稅賦何以慰來蘇之望文統曰上即新位國家經費止仰稅賦茍復减損何以供給文謙曰百姓足君孰與不足俟時和嵗豐取之未晚於是蠲常賦十之四商酒稅十之二丁未䝉古以翰林侍讀學士郝經為國信使使于宋王文統素忌經有重名既請遣經復隂屬李璮潛師侵宋欲假守害經或謂經曰文統叵測盍以疾辭經曰自南北搆難江淮遺黎弱者被俘略壯者死原野兵連禍結斯亦久矣聖上一視同仁務通兩國之好雖以微軀蹈不測之淵茍能弭兵靖亂活百萬生靈於鋒鏑之下吾學為有用矣遂行竇默自金季避亂轉徙隱於大名與姚樞許衡相講習至忘寢食䝉古主在藩邸嘗召之默變姓名以自晦使者俾其友人往見之微服踵其後默不得已乃拜命既至問以治道默首以綱常為對且曰失此則無以自立于世矣又言帝王之道在誠意正心心既正則朝廷逺近莫敢不一于正蒙古主敬待加禮久之南還至是復與許衡同召己酉揚州大火右丞相吳潛罷初賈似道在漢陽以潛移之黃州為欲殺已銜之至是帝欲立忠王禥為太子濳密奏云臣無彌逺之才忠王無陛下之福帝積怒潛似道因陳建儲之策令侍御史沈炎劾潛且云忠王之立人心所屬潛獨不然章汝鈞對館職策乞為濟王立後濳樂聞其論授汝鈞正字奸謀叵測請速召賈似道正位鼎軸帝從之遂罷潛奉祠先是䝉古兵日迫帝問潛策安出潛對曰當遷幸又問卿如何潛曰臣當守此帝泣下曰卿欲為張邦昌乎潛不敢復言未幾北兵暫退帝語群臣曰若從吳潛遷幸之議幾誤朕及潛罷帝怒猶不已而似道又隂圖之帝夜出象簡書疏藁授劉應龍使劾潛應龍謂潛本有賢譽獨論事失當臨變寡斷祖宗以來大臣有罪未嘗輕肆誅戮欲望姑從寬典以全體貌帝大怒史臣曰吳潛忠亮剛直論事雖近于訐度宗之立謀議及之潛以正對人臣懷顧望為子孫地者能為斯言哉潛既罷尋以竄死且有遺表可謂死諫不負科名矣癸丑進賈似道少師封衛國公以朱熠知樞密院事饒虎臣參知政事戴慶炣同知樞密院事刑部尚書皮龍榮僉書樞密院事帝手詔曰賈似道為吾股肱之臣任此旬宣之計隱然殄敵奮不顧身吾民賴之而更生王室有同于再造及似道至又詔百官郊勞如文彥博故事奬眷禮甚至諸將士悉進官吕文德檢校少傳髙逹寧江軍承宣使劉整知瀘州兼潼川安撫副使夏貴至淮安州兼京東招撫使孫虎臣和州防禦使范文虎黃州武定諸軍都統制向士璧曹世雄各加轉有差初似道惡髙逹嘗侮己言於帝欲殺之帝知其有功不從故論功以吕文德為第一而逹居其次帝在位久內侍董宋臣盧允升為之聚斂以媚之引薦奔競之士交通賄賂置諸通顯又用外戚子弟為監司郡守作芙蓉閣香蘭亭於宫中進倡優傀儡奉帝為遊燕竊弄權柄臺臣有言及者帝宣諭去之謂之節帖似道既相悉逐董盧所薦林光世等勒外戚罷監司郡守子弟門客斂跡不敢干朝政由是權傾中外先朝舊法率意紛更矣考異按宋史賈似道傳引薦奔競至奉帝遊燕等語皆董盧二閹事似道入相臺反其所為而權乃悉歸己薛應旗以為似道事謬矣今正之禮部侍郎牟子才上言開慶之時天下岌岌矣今幸復安不知天將去疾遂無復憂耶抑順適吾意而基異時不可知之禍也奈何懷晏安之鴆毒而不明閒暇之政刑乎因具道田里疾苦之狀帝顰蹙久之䝉古自太祖以來諸事草創設官甚簡以斷事官為至重之任位三公上丞相謂之大筆且齊掌兵柄則左右萬户而已後稍倣金制置行省及元帥宣撫等官色辰嗣位遂命劉秉忠許衡酌古今之宜定內外官制總政務者曰中書省秉兵柄者曰樞密院司黜陟者曰御史臺其次內則有監寺院司衛府外則有行省行臺宣慰亷訪牧民則有路府州縣官有常職位有常員食有常祿其長則蒙古人為之而漢人南人二焉於是故老舊臣山林遺逸之士咸見録用一代之制始備秉忠雖居左右而猶不改舊服時人稱為聰書記蓋以其初從釋氏名子聰也䝉古以亷希憲為陜西四川宣撫司商挺副之䝉古阿爾布格聞色辰立分遣心腹易置將佐散金帛賚士卒又命劉太平霍魯懷拘收關中錢榖時琿塔噶自先朝將兵屯六盤太平等隂相結納琿塔噶復分遣人約成都密拉和卓青居竒塔特布哈同舉事是月阿爾布格遂自稱帝于和林阿拉克岱爾及六盤守將琿塔噶舉兵應之五月戊辰朔參知政事饒虎臣罷蒙古劉太平霍魯懷聞亷希憲將至乘傳急入京兆謀為變秦人前被阿拉克岱爾太平等威虐聞其來皆破膽越二日希憲亦至宣示詔㫖遣人馳往六盤宣諭安撫未幾城門候引一急使至云來自六盤希憲詢之盡得太平魯懷與琿塔噶等要結狀希憲集僚佐謂曰主上命我輩正為今日遂分遣人掩捕太平魯懷等復遣劉哈瑪爾誅密拉和卓於成都汪惟正誅竒塔特布哈于青居又命總帥汪良臣率秦鞏諸軍進討琿塔噶良臣以未得㫖為辭希憲即解所佩虎符銀印授之曰此皆身承密㫖君但辦吾事制符已飛奏矣良臣遂行又摘蜀卒四千命巴椿帥之為良臣聲援會有詔赦至希憲命殺太平等於獄尸於通衢方出迎詔庚辰同知樞密院事戴慶炣卒癸未以右諫議大夫沈炎僉書樞密院事䝉古以王鶚為翰林學士承㫖金正大初鶚登進士第一歷官尚書左右司郎中金亡將被殺張柔聞其名救之館于保州䝉古主在藩邸召對甚禮重之嘗因見請曰天兵克蔡金主自縊其奉御絳山焚葬汝水之旁禮為舊君有服願往葬祭蒙古主義而許之至則為河水所沒具牲醴為位而哭及是為承㫖制詔典章皆所裁定又薦李冶李昶王磐圗克坦公履徐世隆髙鳴為學士皆從之丙戌蒙古主建元中統䝉古有年號自此始乙未熒惑入南斗留五十餘日䝉古分漢池為十路置宣撫司以亷希憲史天澤姚樞劉肅采子貞楊果李德輝張德輝趙良弼徐世隆為宣撫使六月庚子竄丁大全于南康軍壬寅立忠王禥為皇太子帝家教甚嚴太子雞初鳴問安再鳴回宫三鳴往㑹議所參决庶事退入講堂講經史將晡復至榻前起居問今日講何經答之是則賜坐賜茶否則為之反覆剖析又不通則繼以怒明日須更覆講率以為常蒙古撤江上軍以史天澤為江淮經略使李璮為江淮大都督璮寇淮安主管制置使事李庭芝擊敗之䝉古召真定劉郁邢州郝子明彰德胡祗遹燕京馮渭王光益楊恕李彥通趙和之東平韓文獻張昉等乘傳赴開平秋七月戊子䝉古使者郝經來告即位且徴前日請和之議先是賈似道還朝使其客廖瑩中輩撰福華編稱頌鄂功通國皆不知所謂和也經至宿州遣其副使何源劉人傑請入國日期不報經教遺書于三省樞密院及兩淮制置使李庭芝似道恐經至謀泄遂以李璮為辭命庭芝寓書于經誣以欵兵拘經于真州忠勇軍營經答書言弭兵息民通好兩國實出聖衷衆所聞知今啓釁自李璮一旦律以違詔將無所逃罪此何預使人事也復上書于帝及移文執政辨論古今南北議和戰攻利害甚悉皆不報驛吏棘垣鑰户晝夜守邏欲以動經經不屈但語其下曰嚮受命不進我之罪也一入宋境死生進退聼其在彼屈身辱命我終不能汝等不幸同在患難宜忍以待之揆之天時人事宋祚殆不久矣帝聞有北使謂宰執曰北朝使來事體當議似道奏和出彼謀豈容一切輕徇倘以交鄰國之道來當令入見蒙古遣詳問官崔明道李全義詣淮東制司訪問經等所在李庭芝奏䝉古使者久留真州亦為似道所格庚寅以賈似道兼太子太師朱熠皮龍榮沈炎並兼賔客是月䝉古主自將討阿爾布格八月己酉䝉古主立秦蜀行中書省以京兆等路宣撫使亷希憲為中書右丞行省事癸丑蒙古李璮乞遣將益兵渡淮攻宋䝉古主以方遣使修好不從九月乙亥李璮復進攻宋䝉古主諭止之壬午蒙古初置拱衛儀仗䝉古琿塔噶知京兆有備西渡河趣甘州㑹阿拉克岱爾自和林帥兵至遂合軍而南諸王哈坦率騎兵與巴椿汪良臣兵合分三道以拒之既陳大風吹沙良臣令軍士下馬以短兵突其左繞出陳後潰其右而出巴椿直搗其前哈坦勒精騎邀其歸路大戰于甘州東殺琿塔噶阿拉克岱爾關隴悉平亷希憲乃遣使自劾停赦行刑徴調諸軍擅以良臣為帥請罪䝉古主曰委卿方面之寄正欲從宜若拘常制豈不坐失事機詔賜希憲金虎符進平章政事行省秦蜀如故以商挺參知政事冬十月甲辰詔黨丁大全吳潛者臺諫其嚴覺察舉劾以聞當置于罪以為同惡相濟者戒時賈似道專政臺諌何夢然孫附鳯桂錫孫承順風㫖凡為似道所惡者無賢否皆斥癸丑蒙古初行中統實鈔先是王文統創造交鈔以絲為本每銀五十兩易絲鈔一千兩諸物之直並從絲例至是又造中統元寶每一貫同交鈔一兩二貫同白銀一兩詔行之立互市于潁州漣水光化軍允寶鈔不限年月諸路通行賦稅並聽收受仍申嚴私鹽酒醋麵貨等禁文統又以文縷為中統銀貨每兩同白銀一兩未及行而罷壬戌竄吳潛于潮州十一月戊子熒惑與填星順行䝉古發常平倉賑益都濟南濵棣飢民建陽縣嘉禾生一本十五穗十二月辛丑詔改建陽為喜禾縣乙卯廬陵郡王思正卒諡簡惠是月䝉古主至自和林次燕京近郊始置享太廟祭器法服蒙古以僧帕克斯巴為國師帕克斯巴者土蕃薩斯嘉人足克衮氏也敏悟過人國中號為聖童年十五自其國來見色辰于藩邸與語大悅日見親禮至是尊為國師授以玉印統釋教時年二十二髙麗自䝉古憲宗之世兵日見加國大困及王倎還感見立之恩遂請附貢且乞出水就陸䝉古主許之二年春正月癸亥朔詔監司率半嵗且劾去贓吏之數來上視多寡行賞罰守臣助監司所不及以一嵗定賞罰本路州無所劾而臺諫論列則監司守臣皆罰有治狀亷聲者具實以聞丁丑命皇太子謁拜孔子於太學太子還奏曰先聖之道至我朝而後有以續孟氏之傳然諸說並駕未知統一逮朱熹張栻吕祖謙志同道合切思講磨擇精語詳開牖後學人心一正聖道大明今熹已秩從祀而栻祖謙尚未奉明詔臣竊望焉帝從之乙酉封栻華陽伯祖謙開封伯並從祀二月丙午䝉古主如開平詔减民間差發秦蜀行省借民免錢給軍以今年稅賦償之三月壬戍朔日有食之戊子知樞密院事朱熠罷知建寧府夏四月乙未以皮龍榮參知政事沈炎同知樞密院事右諫議大夫何夢然僉書樞密院事乙卯竄吳潛于循州丙辰竄丁大全于貴州蒙古詔軍中所俘儒士聽贖為民時淮蜀士遭俘虜者皆沒為奴翰林學士高智耀奏言以儒為驅役古無有也陛下方以古道為治宜除之以風天下䝉古主從之命循行郡縣區别之得數千人貴臣或言其詭濫蒙古主詰之對曰譬則金也金色有淺深謂之非金不可才藝有淺深謂之非士不可䝉古主大悅䝉古主命宣撫司官勸農桑抑游惰禮高年問民疾苦舉文學才識可以從正及茂才異等列名上聞擢用其職官汚濫及民不孝弟者量輕重議罰五月庚辰䝉古敕使臣及軍士所過城邑官給廪餼毋擾於民䝉古主問竇默曰朕欲求如唐魏徴者有其人乎默對曰犯顔諫諍剛毅不屈則許衡其人也深識逺慮有宰相才則史天澤其人也蒙古主納之遂以天澤為中書右丞相以默為翰林侍講學士䝉古敕平陽路安邑縣葡萄酒自今無貢䝉古詔宣聖廟及管內書院有司嵗時致祭月朔釋奠禁諸官員使臣軍馬毋得侵擾䙝瀆違者加罪蒙古平章政事王文統以言利進許衡姚樞輩入侍每言治亂休戚必以義為本竇默復與王鶚面論文統學術不正必禍天下䝉古主曰然則誰可相者默曰以臣觀之無如許衡䝉古主不悅文統疑衡與默相表裏奏授樞為太子太師默太子太傅衡太子太保陽為尊用之實不使數侍其主也默屢攻文統不中欲因東宫以避禍與樞拜命將入謝衡曰此不安於義也且禮師傅與太子位東西嚮師傅坐太子乃坐公等度能復此乎不能則師道自我廢也因相與懷制立殿下言太子未立豈宜虛設官稱乃改授樞大司農衡國子祭酒默仍侍讀學士未幾衡稱疾還懷孟六月潼川安撫副使劉整以瀘州叛降蒙古賈似道既憾髙達曹世雄之輕己令吕文德捃托其罪逼世雄死達廢棄整懼㑹俞興帥蜀整素與興有隙而似道方㑹計邊費興遣吏下整整訴于朝不得達遂籍瀘州十五郡户三十萬降于䝉古䝉古以整為夔路行省兼安副使䝉古由是盡得國事虛實而似道不以為虞初整將叛命制置司參謀官許彪孫草表彪孫不屈仰藥死䝉古城臨洮䝉古罷金銀銅鐵丹粉錫碌坑冶所役民夫及河南舞陽薑户藤花户還之州縣出工局繡女聽其婚嫁蒙古懷孟廣濟渠提舉王允中大使楊端仁鑿沁河渠成溉田四百六十餘所髙麗國王倎更名植遣其世子愖奉表入朝于䝉古䝉古以布哈為中書右丞相耶律鑄為中書左丞相張啓元為中書右丞鑄楚材之子也秋七月辛酉朔蒙古立軍儲都轉運使司癸亥䝉古初立翰林國史院王鶚請修遼金二史又言唐太宗置𢎞文館宋太宗設內外學士院今宜除拜學士院官作養人才乞以右丞相史天澤監修國史左丞相耶律鑄平章政事王文統監修遼金史仍採訪遺事並從之甲子蜀帥俞興以劉整叛移檄討之㑹䝉古成都經略使劉元振將兵逆整至瀘興進軍圍之晝夜急攻城幾陷左右勸元振曰事勢如此宜思變通整非吾人與俱死無益也元振曰人以誠歸我既受其降豈可以急而棄之且瀘之得失關國家利害吾有死而已未幾援兵至元振與整出城合擊興大敗而還詔以興妬功啓戎罷任鐫職乙丑蒙古遣使持香幣祀嶽瀆辛未制置使蒲擇之坐密通蠟書于叛賊羅顯竄萬安軍戊寅王惟忠家訟寃詔奪謝方叔應得恩數壬午前知樞密院事奉祠致仕陳韡卒年八十三諡忠肅己丑䝉古主諭將士舉兵攻宋詔曰朕即位之後深以戢兵為念故年前遣使于宋以通和好宋人不務逺圖伺我小隙反啓邊釁東剽西掠曽無寧日朕今春還宫諸大臣皆以舉兵南伐為請朕重以兩國生靈之故猶待信使還歸庶有悛心以成和議留而不至者今又半載矣往來之禮遽絶侵擾之暴不已彼嘗以衣冠禮樂之國自居理當如是乎曲直之分灼然可見今遣王道貞往諭卿等當整爾士卒礪爾戈矛矯爾弓矢約㑹諸將秋髙馬肥水陸分道而進以為問罪之舉尚賴宗廟社稷之靈其克有勳卿等當布宣朕心明諭將士各當自勉毋替朕命八月丁酉詔奪向士璧官鄂州圍解賈似道忌功行打算法於諸路欲以軍興時支取官物為罪深怨士璧諷侍御史孫附鳯等劾罷之送漳州安置又遣官㑹計邊費於是趙葵史巖之杜庶皆坐侵盜掩匿罷官徴償而士璧所費尤多至是逮至行部責償幕屬方元善逄似道意士璧坐是死復拘其妻妾徴之潭人聞之垂涕元善俄得狂疾常呼士璧而死焉光祖代趙葵與葵素有隙且迎合似道召吏稽勾簿書卒不能得其疵乃以正月望夕張燈宴設錢三萬緡為葵放散官物聞于朝汪立信力爭之曰方艱難時趙公涖事勤勞而公以非理攟拾之公一旦去此後來者復效公所為可乎光祖怒曰吾不才不能為度外事知奉朝命而已君他日處此勉為之立信曰使立信不為則已果為之必不效公所為也光祖益怒立信遂投劾去初立信通判江陵府葵制置荆湖嘗以公事劾立信及在沿江府亦謀議寡諧而立信不廢公道如此信州謝枋得以趙葵檄給錢粟募民兵守禦及㑹計者至信枋得曰不可以纍宣撫自償萬緡餘不能辦乃上書似道有云千金而募徙木將取信于市人二卵而棄干城豈可聞于鄰國遂得免徴似道又忌王堅出知和州堅鬱鬱而卒戊戌蒙古以燕京等路宣撫使薩達齊為平章政事辛丑䝉古以宣撫紐赫納木喀為中書右丞庫庫為中書左丞乙巳以吏部尚書江萬里同僉書樞密院事是月䝉古頒斗斛權衡蒙古賜慶壽寺海雲寺陸地五百頃九月李庭芝言䝉古使郝經久留真州乙亥帝趣與錫賚經之留謀出賈似道帝不悟䝉古用王鶚言立諸路提舉學校官以王萬慶敬鉉等三十人充之冬十月丙午以何夢然同知樞密院事甲寅皇太子擇配帝詔其母族全昭孫之女擇日入見寶祐中昭孫沒于王事全氏見帝帝曰爾父死可念對曰臣妾父固可念淮湖百姓尤可念帝曰即此語可母天下逮丁大全用事以京尹顧岩女為議大全敗乃有是命丙辰同知樞密院事沈炎罷䝉古修燕京舊城蒙古主以阿爾布格違命自將討之十一月壬戌與戰于錫圖特穆爾之地諸王哈坦等斬其將哈坦和爾齊及兵三千人塔齊爾等分道奮擊大破之追北五十里䝉古主率諸軍躡其後合三路蹙之其部將多降阿爾布格北遁癸未封全氏為永嘉郡夫人䝉古罷十路宣撫使止存開元路十二月庚寅蒙古封其皇子珍戩為燕王領中書省事辛卯熒惑犯房壬辰犯鈎鈐甲午以皮龍榮權知樞密院事何夢然參知政事馬光祖同知樞密院事兼知臨安府浙西安撫使䝉古主還中都命太常少卿王鏞教習大樂壬寅僉書樞密院事江萬里罷萬里在賈似道幕下最久雖俯仰容默然性峭直臨事不能無言似道常惡其輕發故不能久于其位蒙古初立宫殿府秩正四品專職營繕癸卯册永嘉郡夫人全氏為皇太子妃是嵗高麗王世子植朝于䝉古宴于中書省問曰傳聞汝邦有古文尚書及海外異書答曰與中國不殊據王惲中堂事記修入䝉古張庭瑞臨潢全州人也幼以功業自許兵法地志星厯卜筮無不推究以宿衛從憲宗伐蜀至是授元帥府參議留戌青居諸軍攻開州達州庭瑞將兵築城虎嘯山扼二州路夏貴以師數萬圍之城當炮皆穿築柵守之柵壞乃依大樹張牛馬皮以禦炮貴以城中飲於澗外絶其水庭瑞取人畜溲沸煮之瀉土中以泄臭人日飲數合唇皆瘡裂堅守踰月援兵不敢進庭瑞度我兵稍懈三分其兵夜劫貴營我兵驚潰都統欒俊雍貴胡世雄等五人皆遇害庭瑞亦被傷數處已而東西川行樞密院發兵圍重慶蒙古主知庭瑞練習軍事遷成都總管佩虎符舟楫兵仗糧儲皆倚以辦蜀平升諸蠻夷部宣慰使甚得蠻夷心碉門羌與婦人老幼入市爭價殺人碉門魚通司繫其人羌酋怒斷繩橋謀入劫之魚通司來告急左丞汪惟正問計庭瑞曰羌俗暴悍以鬭殺為勇今如蜂毒一人而即以門牆之寇待之不可宜遣使往諭禍福彼悟當自回矣惟正曰使者無過於君遂從數騎抵羌界羌陳兵以待庭瑞進前詔之曰殺人償死羌與中國之法同有司繫諸人欲以為見證耳而汝即肆無禮如行省聞於朝召近郡兵空汝巢穴矣其酋長棄槍弩羅拜曰我近者生裂羊胛視肉之文理何如則吉其兆曰有白馬將軍來可不勞兵而罷今公馬果白敢不從命乃論殺人者餘悉縱遣之遂與約自今交市者以碉門為界無相出入官買蜀茶增價鬻於羌人以為患庭瑞更變行法使每引納二緡而付文劵與民聼其自市於羌羌蜀便之先時運糧由楊山泝江往往覆陷庭瑞始立屯田人得免患都掌蠻叛蠻善飛鎗聨松枝為牌自蔽行省命庭瑞討之庭瑞所射矢出其牌半簳蠻驚曰何物弓矢如此之力即請服惟斬其酋蘭德酉等十餘人而招復其餘民遷潭州路總管時湖廣省臣方剝民為功庭瑞知不可拒乃辭歸關中踰年以疾卒庭瑞初屯青居其土多橘時中州艱得蜀藥其價倍常庭瑞課間卒曰入橘皮若干升儲之人莫曉也賈人有喪其資不能歸者人給橘皮一石得錢以濟莫不感之家有愛妾一日見老人與之語乃其父也妾以告庭瑞召視之其貌甚似問欲得汝女歸耶其人以為幸侍左右非敢求與歸庭瑞曰汝女居我家不過羣婢歸嫁則良人矣盡取奩裝書劵還之人皆以為難資治通鑑後編卷一百四十五
