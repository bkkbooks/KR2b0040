body:
  text: 資治通鑑後編卷一百七十五刑部尚書徐乾學撰元紀二十三起玄黓執徐七月盡昭陽大荒落十二月凡一年有竒順帝至正十二年秋七月庚辰徐夀輝將項普略引兵自徽饒犯昱嶺關攻杭州城中倉猝無備參政樊執敬遽上馬率衆出中途與賊遇射死賊四人賊又逐之復射死三人已而賊來益盛填咽街巷且縱火衆皆潰去賊呼執敬降執敬怒叱之曰逆賊守關吏不謹汝得至此恨不碎汝萬段何為降邪乃奮刀斫賊因中槍而死從僕田額森馳救之亦中槍死時董摶霄從江浙平章嘉輝征安豐乘勝攻濠州會朝廷命移軍援江南遂渡江至德清而杭州已陷嘉輝問計摶霄曰賊見杭州子女玉帛必縱欲不暇為備宜急攻之今欲退保湖州設使賊乘鋭趣京口則江南不可為矣嘉輝猶豫未決諸將亦難其行摶霄正色曰江浙相君方面既陷而及今不取誰任其咎復拔劍顧諸將曰諸君荷國厚恩而臨難茍免今相君在是敢有慢令者斬遂進兵薄杭州賊迎敵至鹽橋搏霄麾壯士突前諸軍相繼夾擊凡七戰追殺至清河坊賊奔接待寺塞其門而焚之賊皆死遂復杭州餘杭武康德清次第以平搏霄亦受代去賊之入城也偽帥項葵陽蘇一屯明慶寺一屯北關門妙行寺稱彌勒佛出世以惑衆不殺不淫招民投附者注姓名於簿籍庫金帛悉輦以去平章嘉輝自湖州統軍還舉火焚城殘傷殆盡附賊充偽職者范縣尹等明正典刑里豪施尊禮顧巴為迎敵官軍剮于市家産並沒入官明慶妙行亦然省都事以下坐失守城池罷黜不敘省官復任如故偽帥以下據元史續編修入賊復自昱嶺關冦於潛行省乃假摶霄為參知政事俾復提兵討之摶霄即日引兵至臨安新溪新溪為入杭要路命分兵守之而以大軍進至呌口及虎檻遇賊皆大破之追殺至於潛遂復其縣治既又克復昌化及昱嶺關降賊將潘大奫二千人賊又有犯千秋關者摶霄還軍守於潛而賊兵大至焚倚郭廬舍摶霄按軍不動左右請出兵摶霄曰未也遣人執白旗登山望賊約曰賊以我為怯必少懈伺其有隙則麾所執旗又伏兵城外皆授以火炮復約曰見旗動炮即發已而旗動炮發兵乃盡出斬首數千級遂復千秋關未幾賊復攻獨松百丈幽嶺三關搏霄乃先以兵守多溪多溪三關要路也既又分為三軍一出獨松一出百丈一出幽嶺然後會兵搗賊巢遂乘勝復安吉賊帥梅元等來降且言復有帥十一人欲降者即遣偏將余思忠至賊寨諭之賊皆入暗室潛議思忠持火投入室內拔劍語衆曰元帥命我來活汝汝復何議已而火起焚其寨叱賊黨散去而引賊帥來降明日進兵廣德克之時蘄饒諸賊復犯徽州賊中有道士能作十二里霧摶霄引兵擊之已而妖霧開豁諸伏兵皆起賊大潰斬首數萬級擒道士焚其妖書而斬之徽州遂平辛巳命通政院使達爾瑪實哩與樞密副使圖卜堅巴哈討徐州賊給敕牒三十道以賞功己丑湘鄉賊陷寶慶路丁酉湖南元帥副使碩裕實哈雅尋率兵復之托克托為相諱言兵亂哈瑪從而媒蘖其過帝怒召托克托責之曰汝嘗言天下太平無事今紅軍半宇內丞相以何䇿待之托克托汗流浹背庚寅自乞督軍討徐州許之兵部尚書穆爾瑪哈穆特等言大臣天子之股肱中書庶政之根本不可一日離乞留托克托以弼亮天工庶內外有兼治之宜不報遂詔托克托以達喇罕太傅右丞相分省於外總制諸路軍馬凡爵賞誅殺悉聽便宜從事是月徐夀輝將王善康壽四江二蠻等陷福安寧德等縣八月癸卯方國珍率其衆攻台州浙東元帥伊特色默福建元帥赫迪爾擊退之甲辰以同知樞密院事哈瑪為中書添設右丞丁未日本國白髙麗賊過海剽掠身稱島居民髙麗國王合巴延特穆爾調兵勦捕之己酉命知樞密院事糾珠中書平章政事綽斯嘉伊克扎嚕呼齊福夀並從托克托出師征徐州丁卯托克托發京師安陸賊將俞正君復陷荆門州知州聶炳死之荆門之初陷也炳出募土兵得衆七萬復州城既而君正復來攻炳率孤軍晝夜血戰援絶城復陷為賊所執極口罵不絶賊以刀抉其齒盡乃斷左臂而支解之炳江夏人也賊將黨仲逹陷嶽州九月乙亥俞正君復陷中興糾珠領兵與戰于樓臺敗績奔松滋本路判官上都統兵出擊之既而東門失守上都倉皇反鬬被執大罵賊刳其腹而死己卯監察御史及河南分御史臺行樞密院亷訪司等官交章言額森特穆爾出征河南功績帝從其言賜額森特穆爾金繫腰及金銀鈔幣癸未中興義士范中偕荆門僧李智率義兵復中興路俞君正敗走龍鎮衛指揮使掩圖哈喇曼領兵入城糾珠自松滋還屯兵于石馬乙酉托克托至徐州有淮東元帥祿善主者言官軍不習水土宜募場下鹽丁可使攻城乃以禮部郎中祿曽嚕為淮南宣慰使領征討事募瀕海鹽丁五千人從征徐州又有淮東豪民王宣者言鹽丁本野夫不如募城市趫勇便捷者可以攻城托克托復從之前後各得三萬人皆黃衣黃帽號曰黃軍托克托知城有必克之勢已上據庚申外史修入辛卯下令攻其西門賊出戰以鐵翎箭射馬首托克托不為動麾軍奮擊之大破其衆入其郛明日大兵四集亟攻之城堅不可猝拔托克托用宣政院參議伊蘇計以巨石為炮晝夜攻之不息賊不能支城破芝麻李等遁去獲其黃傘旗鼓燒其積聚追擒其偽千户數十人遂屠其城帝遣中書平章政事布紀等即軍中命托克托為太師依前右丞相趣還朝而以樞密院同知圗爾齊等進師平潁亳師旋賜上尊珠衣白金寶鞍皇太子錫燕于私第是役也托克托以得芝麻李奏功及班師後伊徹察勒代之月餘始獲芝麻李械送京師托克托密令人就雄州殺之考異按元史芝麻李不知其所終今據庚申外史修入己亥賊攻辰州達嚕噶齊華善擊走之是月帝至自上都蘄黃賊陷湖州常州之托克托平徐州彭大趙君用率芝麻李餘黨奔濠州托克托命賈魯追擊之孫德崖等與郭子興不協互相猜防會彭趙奔濠德崖等納之二人本以窮蹙來奔德崖與子興反屈已下之事皆稟命遂為所制彭大頗有智數攬權專決君用唯唯而已子興禮彭大而易君用君用銜之德崖等遂與君用謀伺子興出執之通衢械于孫氏將殺之朱元璋時在淮北聞難亟歸念子興素厚彭而薄趙禍必趙發非彭不可解乃與子興二子往訴於彭大彭大怒曰我在此誰敢爾即命左右呼兵以出元璋亦被甲持短兵與俱至孫氏圍其家發屋破械使人負子興以歸子興遂得免考異彭大明太祖實録作彭卓珠錢氏辨證曰元史順帝紀辛卯八月蕭縣李二及老彭趙君用攻陷徐州老彭者卓珠之父彭大也芝麻李既敗則彭大當與君用俱奔濠實録不書彭大而書卓珠又書於甲午六月上取滁陽之後云未踰月彭趙遣人邀上守盱泗上辭弗往未幾二人自相吞併卓珠亦亡惟君用專兵柄云云按順帝紀又於丁酉嵗書趙君用及彭大之子卓珠同據淮安趙僣稱永義王彭僣稱魯淮王則丁酉嵗卓珠尚在以理度之癸巳之夏與君用併吞而亡者乃彭大非卓珠也實録於卓珠既亡之後記上使人説君用及賂其左右以解子興而廟碑與天潢玉牒俱云彭趙東屯泗州挾王以往遣人賂彭趙得縱歸則又卓珠不死之明證也龍鳯事迹云先是芝麻李故將趙均用彭卓珠據淮安僣稱王卓珠死均用益自專未幾奔山東依宋將毛貴此卓珠死于淮安之明證也元史稱彭大之子卓珠其意甚明修實録者殆未及考耳按錢説極其精核實録以父事為子事大謬今悉改彭卓珠為彭大江西行省平章政事星吉受命出師湖廣行至江東更令守江州時江州已陷趙普勝周驢等據池陽大平官軍止有三百人賊號百萬衆皆欲走星吉曰畏賊而逃非勇也坐而待攻非智也汝等皆有妻子財物縱逃其可免乎乃貸冨人錢募人為兵先是行臺募兵人給百五十千無應者至是星吉募兵人五十千衆爭赴之一日得三千人乃具舟楫直趨銅陵克之又破賊白馬灣賊敗走分兵躡之抵白湄賊窮急回拒官軍官軍乘勝奮擊賊盡殪擒其渠魁周驢奪船六百艘軍聲大振遂復池州乃命諸將分道討賊復石埭諸縣賊復來攻命王惟恭列陳當之鋒始交出小艦從旁橫擊大破走之進據清水灣伺者告賊艦至自上流順風舉帆衆且數十倍諸將失色星吉曰無傷也風勢盛彼倉卒必不得泊但伏橫港中偃旗以待俟過而擊之無不勝矣風怒水駛賊奄忽而過乃命舉旗張帆鼓譟而薄之官軍殊死戰風反為我用又大破之時賊久圍安慶捷聞遽燒營走進復湖口縣克江州留兵守之命王惟恭柵小孤山而星吉自據番陽口綴江湖要衝以圖恢復時湖廣己陷江西被圍淮浙亦多故卒無繼援之者日久糧益乏士卒咸困或曰東南完實盍因糧以圖再舉乎星吉曰吾受命守江西必死於此衆莫敢復言有頃賊乘大船四集來攻我軍取蒹葦編為大筏塞上下流火之我軍力戰衆死且盡星吉之從子伯巴哈與親兵數十人死之星吉猶堅坐不動賊發矢射星吉乃昏仆賊素聞星吉名不忍害舁置密室中至旦乃蘇賊羅拜爭饋以食星吉斥之遂不復食凡七日乃自力而起北面再拜曰臣力竭矣遂絶星吉為人公亷明決及在軍中能與將士同甘苦以忠義感激人心故能以少擊衆得人死力云考異星吉之死元史本傳無月日宋濓為撰神道碑云九月二十九日元史續編平胡録並載在十一月今以神道碑正之冬十月霍山崩前三日山如雷鳴禽獸驚散隕石數里是月蘄黃賊陷江隂州州大姓許晉與其子如章聚無賴惡少資以飲食賊四散抄掠誘使深入殪而埋之戰于城北之祥符寺父子皆死採輟耕録十一月乙亥以星吉為江西行省平章政事出師湖廣丙子中書省臣請為托克托立徐州平冦碑及加封王爵癸未命江浙行省右丞特哩特穆爾總兵討方國珍是月蘄黃賊悉衆冦安慶水陸並進上萬户蒙古綢斯連破之輕舟追北中流矢卒先是綢斯鎮江隂時海內無事州人王逄謂曰太嵗在辰侯當保障一方戰勝恐後不利己而果然採王逢梧溪集十二月辛亥詔以杭常湖信廣德諸路皆以克復赦詿誤者蠲其夏稅秋糧命有司撫恤其民癸亥托克托言京畿近地水利召募江南人耕種嵗可得粟麥百萬餘石不煩海運而京師足食帝曰此事有利於國家其議行之是月賈魯以兵圍濠州先是中書左司郎中田本初言江南漕運不至宜墾內地課種昔漁陽太守張堪種稻八百餘頃今其迹尚存可舉行之於是起山東益都般陽等十三路農民種之秋收課所得不償所費是嵗農民皆罷散乃復立都水庸田司于汴梁掌種植之事田本初事據庚申外史修入察罕特穆爾者系出北庭其祖父徙家河南為潁州沈丘人察罕特穆爾幼篤學嘗應進士舉有時名身長七尺修眉覆目左頰有三毫怒則毫皆直指居常慨然有當世之志及汝潁盜發乃奮義起兵沈丘子弟願從者數百人與信陽州羅山人李思齊同設竒計襲破羅山縣事聞朝廷授察罕特穆爾汝寧府達嚕噶齊思齊知府事於是所在義士俱將兵來會得萬人自成一軍屯沈丘數與賊戰輒克捷改淮東宣慰司為都元帥府移治淮西起余闕為宣慰副使僉府事分兵守安慶時南北音問隔絶兵食俱乏闕抵官十日而寇至拒却之乃集有司與諸將議屯田戰守計環境築堡寨選精甲外扞而耕稼於中屬縣灊山八社土壤沃饒悉以為屯湖廣行省平章政事多爾濟巴勒卒于黃州蘭溪驛多爾濟巴勒自陜西間道行至重慶聞江陵陷道路阻不可行或請少留以俟之不從期必達乃已湖廣行省時權治澧州既至律諸軍以法而授納粟者以官人心翕然汝中柏巴克特穆爾言於丞相曰不殺多爾濟巴勒則丞相終不安蓋謂其帝意所屬必復用耳乃命多爾濟巴勒職專供給軍食時官廩所儲無幾即延州民有粟者親豫酒諭勸之而貸其粟約俟朝廷頒鈔至即還其直民無不從者又遣官糴粟河南四川之境民聞其名爭輸粟以助軍餉右丞巴延巴哈方總兵承順風旨數侵辱之多爾濟巴勒不為動會官軍復武昌至蘄黃巴延巴哈百計徵索無不給之猶欲言其供需失期達喇罕軍帥王巴哈奮言曰平章國之貴臣今坐不重茵食無珍味徒為我曹軍食耳今百需立辦顧猶欲誣之是無人心也我曹便當散還鄉里矣托克托又遣國子助教旺扎勒至軍中風使害之旺扎勒至則反加敬禮語人曰平章勳舊之家國之祥瑞吾茍傷之則人將不食吾餘矣多爾濟巴勒素有風疾軍中感霧露所患日劇遂卒年才四十多爾濟巴勒立朝以扶持名教為己任薦拔人才而不以為私恩留心經術凡伊洛諸儒之書未嘗去手喜為五言詩於字畫尤精翰林學士承旨臨川危素嘗客於多爾濟巴勒諫之曰明公之學當務安國家利社稷毋為留神於末藝多爾濟巴勒深服其言其在經筵開陳大義為多間采前賢遺言各以類次為書凡四卷一曰學本二曰君道三曰臣職四曰國政帝覽而善之賜名曰治原通訓藏於宣文閣蘄黃賊之犯江東西也詔江浙行省平章布延特穆爾率軍討之布延特穆爾益募壯健為兵得驍勇士三千人戰艦三百艘時湖廣平章布延特穆爾江西平章星吉江南行臺中丞曼濟哈雅皆以兵駐太平宿留不進布延特穆爾至乃與俱前賊方聚丁家洲官軍猝與遇奮擊敗之遂復銅陵縣擒其賊帥復池州分遣萬户普努賢屯陵陽王建中屯白面渡庫爾討無為州而自率鎮撫巴哈萬户明安駐池口以防遏上流為之節度已而江州再陷星吉死曼濟哈雅及威順王軍俱潰而東安慶被圍益急遣使來求援諸將皆欲自守信地布延特穆爾曰何言之不忠也安慶與池止隔一水今安慶固守是其節也而救患之義我其可緩且上流官軍雖潰然皆百戰之餘所乏者錢穀器具而已吾受命總兵其可坐視而不恤哉即大發帑藏以周之潰軍皆大集而兩軍之勢復振安慶之圍遂解江浙行省左丞相額琳沁巴勒移官江西時蘄黃賊據饒州饒之屬邑安仁與龍興接瓖其民皆相挻為亂額琳沁巴勒道出安仁因駐兵招之來者厚加賞賚不從則乘髙縱火攻散之餘干久為盜區亦聞風順服先是江西平章道童以寬容為政軍民懈弛額琳沁巴勒既至風采一新威聲大振所在羣盜咸謀歸欵矣江浙行省參知政事蘇天爵總兵於饒信所克復者一路六縣憂深病積遂卒于軍中天爵為學博而知要長於紀載著國朝名臣事略十五卷時中原前輩凋謝殆盡天爵獨身任一代文獻之寄學者稱為滋溪先生翰林學士承旨張起巖卒諡文穆起巖眉目清揚望而知為雅量君子及其臨政決議意所背鄉屹若泰山不可回奪或時面折人面頸發赤不少恕廟堂憚之識者謂其外和中剛不受人籠絡如歐陽修名聞四裔安南修貢其陪臣致其世子之辭必候起巖起巖性孝友少處窮約下帷教授躬致米百里外以養父母撫弟如石教之宦學無不備至舉親族弗克葬者二十餘喪且買田以給其祭凡獲俸賜必與故人賔客共之卒之日廩無餘粟篋無餘財江淮蘆荻多為旗槍人馬之狀節間拆開有紅暈成天下太平四字蘄黃二州大旱人相食十三年春正月庚子朔用帝師請釋放在京罪囚中書添設右丞哈瑪正除右丞考異元史本紀是年正月以中書添設平章政事哈瑪為平章政事今從姦臣傳詔印造中統元寶交鈔一百九十萬錠至元鈔一十萬錠辛未以托克托先言京畿近地水利立分司農司以中書右丞烏蘭哈達左丞烏固遜良楨兼大司農卿給分司農司印西自西山南至保定河間北抵檀順州東及遷民鎮凡係官地及元管各處屯田悉從分司農司立法佃種給鈔五百萬錠以供工價牛具農器穀種之用癸酉以皇第二子育於太尉衆嘉努家賜衆嘉努及乳母鈔各一千錠甲戌重建穆清閣乙亥命中書右丞圖圖以兵討商州賊庚辰中書省臣言近立分司農司宜於江浙淮東等處召募能種水田及修築圍堰之人各一千名為農師教民播種宜降空名添設職事敕牒一十二道遣使齎往其地有能募農民一百名者授正九品二百名者正八品三百名者從七品即書填流官職名給之就令管領所募農夫不出四月十五日俱至田所期年為滿即放還家其所募農夫每名給鈔十錠從之丙戌以武衛所管鹽臺屯田八百頃除軍見種外荒間之地盡付分司農司戊戌熒惑太白辰星聚于奎二月丁未祭先農甲寅中書省臣言徐州民願建廟宇生祠右丞相托克托從之詔仍立托克托平徐勳德碑三月己卯命托克托領大司農司甲申詔修大承天護聖寺賜鈔二萬錠丁亥命托克托以太師開府提調太史院回回漢兒司天監己丑以各衙門係官田地并宗仁等衛屯田地土並付分司農司播種是月會州定西靜寧莊浪等州地震命江浙行省左丞特穆爾江南行臺侍御史左達納實哩招諭方國珍賊衆十萬攻池州布延特穆爾會諸將分番與戰大敗之乘勝率舟師以進夏四月戊戌朔特命中書左丞烏固遜良楨得用軍器庚子以禮部所轄掌薪司并地土給付分司農司己酉詔取勘徐州汝南南陽鄧州等處荒田并户絶籍沒入官者立司牧署掌分司農司耕牛又立王田屯署降徐州路為武安州以所轄縣屬歸德府其滕州嶧州仍屬益都路是月帝如上都五月己巳命東安州武清大興宛平三縣正官添給河防職名從都水監官巡視渾河隄岸或有損壞即修理之辛未江西行省左丞相額琳沁巴勒江浙行省左丞羅羅引兵取道自信州元帥韓邦彥哈默取道自徽州浮梁同復饒州蘄黃等賊聞風皆奔潰壬午中書左丞賈魯卒于軍中魯攻濠州同總兵官平章裕克察勒督戰魯誓師曰吾奉旨統八衛漢軍頓兵於濠七日矣爾將同心協力必以今日己午時取城池然後食魯上馬麾進抵城下忽頭眩下馬且戒兵馬弗散病愈亟却藥不肯汗遂卒官軍解圍去乙未泰州賊張士誠陷髙郵據之士誠泰州白駒場亭民也以操舟販鹽為業少有膂力無賴諸富家多陵侮之或弗酬其直弓兵丘義屢辱之士誠欲報其怨與其弟士義士德士信結壯士李伯升等十八人殺丘義及所仇富家焚其廬舍延燒居民甚衆自懼獲罪乃入旁近場招集少年謀起兵行至丁溪大姓劉子仁集衆拒之士義中矢死士誠益怒決戰子仁衆潰入海士誠遂乘勢攻泰州有衆萬餘克興化結寨于德勝湖朝廷遣使以萬户告身招之士誠不受命淮東宣慰司掾納蘇喇丹以兵捍德勝湖賊船七十餘柁乘風而來即前擊之焚其二十餘船賊潰去既而士誠襲髙郵屯兵東門納蘇喇丹以舟師會諸軍討之距三垜鎮賊衆猝至納蘇喇丹麾兵挫其鋒賊鼓譟而前乃發火筒火鏃射之死者蔽流而下賊繚船於背盡力來攻而阿蘇衛軍及真滁萬户府等官見賊勢熾皆遁走納蘇喇丹顧必死謂其三子寶通哈嚕丹錫實勒曰汝輩可出走寶通等不肯去遂皆死之士誠陷髙郵據以為都僣國號大周自稱誠王建元曰天祐考異按明太祖實録張士誠僣號建元在明年正月甲子朔今從元史本紀是月布延特穆爾以舟師與賊戰于望江又戰小孤山及彭澤又戰龍開河皆敗走之進復江州濠州圍解軍士多死傷朱元璋乃歸鄉里募兵得七百餘人六月丙申朔還至濠郭子興喜以元璋為鎮撫時彭大趙君用馭下無道所部多橫暴元璋恐禍及已乃以七百人屬他將而獨與濠人徐達等二十四人南去略定逺中途遇疾復還聞定逺張家堡有民兵號驢牌寨者孤軍乏食欲來降未決元璋曰此機不可失也乃強起白子興選騎士費聚等從行至寶公河其營遣二將出大呼曰來者何為聚恐請益人元璋曰多人無益滋之疑耳乃直前下馬渡水而往其帥出見元璋曰郭元帥與足下有舊聞足下軍乏食他敵欲來攻特遣吾相報能相從即與俱往否則移兵避之帥許諾請留物示信元璋解佩囊與之彼以牛脯為獻令諸軍促裝且申密約元璋還留聚俟之越三日聚還報曰事不諧矣彼且欲他往元璋即率兵三百人抵營誘執其帥於是營兵焚舊壘悉降得壯士三千人又招降秦把頭得八百餘人繆大亨以義兵二萬屯橫澗山元璋命花雲夜襲破之大亨舉衆降軍聲大振雲懷逺人體長大面鐵色驍勇絶人丁酉立皇子阿裕爾實哩達喇為皇太子授以金寶詔天下大赦命右丞相托克托兼詹事院詹事庚子知樞密院事實喇巴圖總河南軍平章政事達實巴圖爾總四川軍自襄陽分道而下克復安陸府癸卯沃濟野人以皮貨來降辛亥命前河西亷訪副使額森巴哈為淮西添設宣慰副使以兵討泰州初張士誠陷泰州河南行省遣知髙郵府李齊往招降被拘久之賊酋自相殺始縱齊來歸俄而興化陷行省以左丞偰哲篤偕宗王鎮髙郵使齊出守甓社湖已而髙郵破省憲官皆遁有詔凡叛逆者赦之詔至髙郵不得入賊紿曰請李知府來乃受命行省強齊往至則下齊獄中官軍諜知之乃進攻城士誠呼齊使跪齊叱曰吾膝如鐵豈肯為賊屈士誠怒扼之跪齊立而詬之乃曵倒捶碎其膝而卨之齊廣平人元統初擢進士第一論者謂大科三魁若台哈巴哈沒海上李黼隕九江洎齊之死皆不負所學云詔淮南行省平章政事福壽討張士誠秋七月丁卯泉州天雨白絲海潮日三至壬申湖廣行省參政阿嚕輝復武昌及漢陽是月布延特穆爾進兵攻蘄州擒偽帥魯普恭遂克其城進兵道士洑焚其柵抵蘭溪口殱黃連寨賊巢分兵平巴河於是江路始通朱元璋率兵略滁陽道遇定逺人李善長與語恱之留置幕下俾掌書記語之曰方今羣雄並爭非有智者不可與謀議吾觀羣雄中持案牘及謀事者多毁左右將士將士弗得效其能以至於敗羽翼既去主者安得獨存亦相繼而亡汝宜鑒其失務協諸將以成功毋效彼所為也善長曰謹受命考異太祖實録辨證曰鄭曉名臣記云上嘗與善長從容談論天下事善長稱上豁達大度類漢髙祖天下不足定也上因問善長卿可方蕭何徐達可方韓信誰可方張良者善長稱金華宋濓上曰孤所聞青田有劉基按髙皇帝是時居滁陽甥館名位在諸將之後安得偃然稱孤以漢髙君臣相命善長典司書記上戒勿言諸將得失遑及其他龍鳯戊戌克婺上始召見濓庚子克處始有人薦基此時殆未必知有兩人也流俗有英烈傳稱太祖三顧中山中山談經世大略髣佛如韓侯葛生識者嗤之不謂鄭氏通儒亦剽取俗説如此又黃金開國功臣録載善長當元季隱居東山思佐明主以安天下按庚午詔書善長挈家草莽詣軍門俯伏於前豈隱居髙尚者耶太祖之於善長一則曰以文吏相從一則曰知小吏之心善長之為吏審矣必欲諱胥吏之名標隱遁之目則鄼侯雍奴將不得為兩漢之宗臣乎俗儒膚陋往往如此宜痛削之是月進攻滁陽花雲為先鋒單騎前行遇官軍數千人雲提劍躍馬橫衝其陳而過敵大驚曰此黑將軍勇甚不可與爭鋒遂克滁陽因駐師焉彭大趙君用挾郭子興往泗州遣人邀共守盱眙元璋以二人粗暴淺謀不可與共事辭弗往未幾二人自相吞併戰士多死而彭大亦亡唯君用專兵柄狠戾益甚將圖子興元璋憂之遣人説君用曰公昔困於彭城南趨濠使郭公閉壁不相納死矣得濠而據其上更欲害之背德不祥且郭公易與耳其别部在滁者兵勢重可慮也君用聞之心頗恐待子興稍以禮子興乃得間將萬人至滁州閲元璋所部兵三萬餘號令嚴明軍容整肅乃大恱八月帝至自上都資正院使托和齊以兵復江州路左遷四川行省平章烏薩為淮西元帥供給烏薩軍進討蘄黃九月乙丑朔日有食之己丑建皇太子鹿頂殿于聖安殿西是月太白再經天是秋大旱溪澗皆涸冬十月庚戌詔授方國珍徽州路治中國璋廣德路治中國瑛信州路治中督遣之任國珍等疑懼不受命仍擁船千艘據海道阻絶糧運復遣江浙右丞阿爾溫斯等率兵討之先是江浙左丞特哩特穆爾議招撫浙東元帥府都事青田劉基持不可曰國珍首亂赦之無以懲後左丞稱善進基行省都事聞之朝而國珍使人浮海至京賄用事者許國珍官聽其降坐基擅持威福奪職羈管紹興并罷左丞特哩特穆爾國珍遂不可制基讀書七行俱下年十四通春秋遍及五經凡天官隂符家言無不精析其奧初舉進士揭奚斯深愛重之曰子魏玄成流也嘗入行省幕府與其長抗議不合投劾去尋補浙江儒學副提舉上言御史失職數事受臺抨歸至是又被謫遂放浪山水間多為詩歌以自適命立水軍都萬户府于崑山州以浙東宣慰使納琳哈喇為正萬户宣慰副使董搏宵為副萬户是月撤世祖所立氊殿改建殿宇郭子興居滁再閲月惑於讒言悉奪朱元璋兵又欲收李善長置麾下善長涕泣自訴不肯從自是征討之權元璋皆不得與且日踈逺而事之愈恭既而官軍圍滁有譛元璋戰不力者子興信之即令其人與元璋俱出戰其人出未十步即被矢反走元璋直前奮擊衆皆披靡徐還了無所傷子興頗內愧時諸將各有所獻元璋所至禁剽掠即有獲以分部下無所獻子興不恱馬氏知其意悉所有遺子興妻張氏張喜由是疑釁漸釋十一月丁亥江西右丞和尼爾齊以兵平富州臨江遂復瑞州是月立義兵千户水軍千户所于江西事平願為民者聽十二月癸卯托克托請以趙完普家産田地賜知樞密事僧格實哩庚戌京師天無雲而雷鳴少頃有火見于東南懷慶路及河南府西北有聲如擊鼓者數四已而雷聲震地是月大同路疫死者大半江浙行省平章布延特穆爾南臺中丞曼濟哈雅及四川行省參政哈琳圖左丞僧圖實哩西寧王雅罕沙合軍討徐夀輝于蘄水拔其偽都夀輝遁入黃梅山中獲偽官四百餘人陜西行省平章博囉四川行省右丞達實巴都圖復均房等州詔博囉等守之達實巴都圖討東正陽是冬彭大之子卓珠自稱魯淮王趙君用稱永義王考異太祖實録辨證曰滁陽王廟碑及皇明本紀記二姓僣稱俱在壬辰奔濠之時與實録異以髙帝紀夢考之則云明年元將賈魯死城圍解當年冬彭趙僣稱部下多陵辱人所謂當年冬者癸巳之冬也以時勢言之二姓雖草草僣稱亦當在元兵解圍之後而不在自徐奔濠之日當以實録為正今從之是嵗自六月不雨至八月造清寧殿前山子月宫諸殿宇以宦官留守額森特穆爾等董其役托克托信任汝中柏由郎中為參議中書自平章以下見其議事皆唯唯獨右丞哈瑪性剛決與之論數不合汝中柏因譛哈瑪於托克托出哈瑪為宣政院使又位居第三哈瑪由是深銜托克托初哈瑪嘗隂進西天僧以運氣術媚帝帝習為之號延徹爾法延徹爾華言大喜樂也哈瑪之妹壻集賢學士圖嚕特穆爾故有寵於帝與埒克達實巴朗等十人俱號伊納克圖嚕特穆爾性姦狡帝愛之言聽計從亦薦西蕃僧嘉琳沁於帝其僧善祕密法謂帝曰陛下雖尊居萬乘富有四海不過保有見世而已人生能幾何當受此祕密大喜樂禪定帝又習之其法亦名雙修法曰延徹爾曰祕密皆房中術也帝乃詔以西天僧為司徒西蕃僧為大元國師取良家女奉之謂之供養於是帝日從事於其法伊納克輩用髙麗女為耳目刺探貴人之命婦及士庶之室家擇其美而善淫者媒入宫中數日乃出伊納克輩至此採庚申外史語八郎者帝諸弟也與諸伊納克皆在帝前相與褻狎甚至男女裸處號所處室曰色濟克烏格依華言事事無礙也君臣宣淫而羣僧出入禁中無所防間醜聲穢行著聞於外雖市井之人亦惡聞之皇太子年日以長尤深疾圖嚕特穆爾等所為欲去之未能也江西賊帥王善冦閩官軍守羅源縣拒之羅源與連江接壤勢將迫連江寧善鄉巡檢劉濬妻真定史氏故相家女也有才識謂濬曰事急矣可聚兵以捍一方於是盡出奩中物募壯士百餘命仲子健將之浹旬間衆至數萬賊尋破羅源分兩道攻福州濬拒之辰山三戰三捷俄聞福州陷衆多潰去濬獨帥健兵進遇賊于中麻突其陳斬前鋒五人賊兵大至鏖戰三時頃濬中箭墮馬健下馬掖之俱被獲濬憤戟手大罵賊縛濬階下先斫手一指罵彌厲再斫一指亦如之指且盡斫兩腕次及兩足濬色不少變罵聲猶不絶遂割其喉舌而死健亦以死拒賊善義之舍健使斂濬尸瘞之健歸請兵於帥府以復父讐弗聽健盡散家資結死士百人詐為工商流丐入賊中夜半發火大譟賊驚擾自相屠戮健手斬殺其父者張破四并擒善及冦首陳伯祥來獻磔之事聞贈濬福建行省檢校官授健古田縣尹為濬立祠福州北門外有司嵗時致祭濬河南人也知福寧州王巴延既死賊時覩其引兵出入及林德誠起兵討賊乃望空呼曰王州尹王州尹宜率隂兵助我斬賊時賊正祠神覩紅衣軍來以為偽帥康將軍亟往迎之無有也四面皆青衣官軍賊大敗斬其酋江二蠻福寧遂平事聞贈巴延濟寧路總管追封太原郡侯泉州大飢死者相枕藉其能行者皆老幼扶携就食永春永春縣尹盧琦命分詣浮屠及大家使食之所存活不可勝計先是琦任永春初下車即賑飢饉止橫斂均賦役減口鹽一百餘引蠲包銀𣙜鐵之無徵者已而訟息民安乃新學宫延師儒課子弟月書季考文風翕然鄰邑仙遊盜發琦適在彼境盜遙見之迎拜曰此永春大夫也為大夫百姓者何幸甚吾邑長乃以暴毒驅我故至此耳琦因立馬諭以禍福衆皆投刃槊請縛其酋以自新琦許之酋至琦械送帥府自是威惠行於境外故泉民皆來就食資治通鑑後編卷一百七十五
