body:
  text: 資治通鑑後編卷一百六十七刑部尚書徐乾學撰元紀十五起昭陽大淵獻正月盡閼逢困敦十二月凡二年英宗睿聖文孝皇帝至治三年春正月癸巳朔禹城縣去秋霖雨縣人邢著程進出粟以賑飢民命有司旌其門己亥思明州盜起湖廣行省督兵捕之庚子刑部尚書烏瑪喇坐贓杖免壬寅以行省平章政事復兼總軍政軍官有罪重者以聞輕者就決罷上都雲州興和宣德蔚州奉聖州及雞鳴山房山黃蘆三義諸金銀冶聽民採鍊以十分之三輸官起前樞密院副使吳元圭王約為集賢大學士翰林侍講學士韓從益為昭文館大學士並商議中書省事丞相拜珠又言前集賢侍講學士趙居信直學士吳澄皆有德老儒請徵用之帝喜曰卿言適副朕心更當使訪山林隱逸之士遂以居信為翰林學士承旨澄為學士王約年老俾以其祿家居每日一至中書時政多所參酌帝嘗謂臺臣曰朕深居九重臣下姦貪民生疾苦豈能周知故用卿等為耳目曩者特們德爾貪蠧無狀汝等拱默不言其人雖死宜籍其家以懲後也辛亥申命御史大夫特克實振舉臺綱詔諭中外壬子遣回回炮手萬户赴汝寧新蔡遵世祖舊制教習炮法靜江雍柳諸郡獠為冦命湖廣行省督兵捕之丙辰泉州民留應總作亂命江浙行省遣兵捕之辛酉禁故殺子孫誣平民者初四川行省平章政事趙世延為其弟訟不法事繫獄待對其弟逃去特們德爾必欲殺之有司承望風旨數脅令自裁世延終不為動至是丞相拜珠為言其無罪詔釋之仍著令原告逃百日不出則釋待對者二月癸亥朔作上都華嚴寺帕克斯巴帝師寺及丞相拜珠第役軍六千二百人定軍官襲職嫡長子孫幼者令諸兄弟姪攝之所受制敇書權襲以息爭訟是夜熒惑太白填星聚于胃丙寅翰林國史院進仁宗實録進前數日監修拜珠詣國史院聽讀首卷書大德十年事不書左丞相哈喇哈斯定策功惟書越王圖喇勇決拜珠從容謂史官曰無左丞相雖百越王何益録鷹犬之勞而略發蹤指示之人可乎立命書之其他筆削未盡善者一一正之人皆服其卓識己巳修廣惠河閘十有九所治野狐桑乾道癸酉畋於柳林帝顧謂拜珠曰近者地道失寧風雨不時豈朕纂承大寶行事有闕歟對曰地震自古有之陛下自責固宜亦由臣等失職不能燮理帝曰朕在位三載於兆姓萬物豈無乖戾之事卿等宜與百官議有便民利物者朕即行之拜珠患法制不一有司無所守奏詳定舊典以為通制於是命樞密副使完顏納丹集賢學士侍御史曹伯啓等纂集纍朝格例而損益之書成辛巳奏上凡二千五百三十九條名曰大元通制頒行天下伯啓言五刑者刑異五等今黥杖徒役於千里之外百無一生還者是一人身備五刑非五刑各底於人也法當改易丞相雖是之而不果行丙戌雨土造五輅旗丁亥敇金書藏經二部命拜珠等總之戊子封鷹師布哈為趙國公辛卯以太子賔客巴圖廉貧賜鈔十萬貫三月壬辰朔帝如上都丁酉平江路嘉定州飢發粟六萬石賑之丁未西番咱巴凌諸族叛敇鎮西武靖王吹巴勒等發兵討之戊申祔太皇太后于順宗廟室上尊諡曰昭獻元聖皇后辛亥以圓明王道明之亂禁僧道度牒符籙丙辰敇醫卜匠官居喪不得去職七十不聽致仕子孫無蔭敘能紹其業者量材録用監察御史拜珠嘉琿坐舉巴爾濟蘇失當並黜免晉王府內史都爾蘇得幸於王常偵伺朝廷事機以其子哈克繖事丞相拜珠且入宿衛久之哈克繖歸言御史大夫特克實與拜珠意相忤欲傾害之是月宣徽使塔坦來王邸為都爾蘇言主上將不容於晉王汝盍思之於是都爾蘇與塔坦深相要結夏四月壬戌朔敇天下諸司命僧誦經十萬部丁卯旌內黃縣節婦王氏己巳浚金水河甲戌敇都功德司科爾羅至京師釋囚大辟三十一人杖五十七以上者六十九人放籠禽十萬命有司償其直己卯詔行助役法遣使考視稅籍高下出田若干畝使應役之人更掌之收其嵗入以助役費官不得與敇京師萬安慶夀聖安普慶四寺楊子江金山寺五臺萬聖祐國寺作水陸佛事七晝夜五月戊戌太白經天庚子大風雨雹拔柳林行宫大木二千七百辛丑以特克實獨署御史大夫事戊申監察御史蓋繼元宋翼言特們德爾姦貪負國生逃顯戮死有餘辜乃命毁所立父祖碑并追奪官爵及封贈制書籍沒其家資告諭中外帝御大安閣見太祖世祖遺衣皆以縑素木綿為之重加補綴嗟歎良久謂侍臣曰祖宗創業艱難服用節儉乃如此朕焉敢頃刻忘之戊午奉元行宫正殿災上都利用監庫火帝命衛士撲滅之因語羣臣曰世皇始建宫室於今安焉至朕而燬實朕不能圖治之故也欽察衛兵戍邊有卒纍功請賞以官帝曰名爵豈賞人之物命賜鈔三千貫六月冦圍寧都州民孫王臣出糧餉軍旌其門丁卯西番咱巴凌諸冦未平遣徽政使綽羅往督師戊辰贈乳母呼圖克台定襄郡夫人其夫阿拉追封定襄王諡忠愍壬申將作院使哈扎爾布哈坐罔上營利杖流東裔籍其家留守司以雨請修都城有旨不宜大興土功其略完之癸酉太常請纂修纍朝儀禮從之乙酉諸王奇卜數冦邊至是遣使來降帝曰朕非欲彼土地人民但吾民不罹邊患軍士免於勞役斯幸矣今既來降當厚其賜以安之帝遣中書左丞蘇蘇詔翰林學士吳澄撰金書藏經序澄曰主上寫經為民祈福甚盛事也若用以追薦臣所未知蓋福田利益雖人所樂聞而輪回之事彼習其學者猶或不言不過謂為善之人死則上通高明其極品則與日月齊光為惡之人死則下淪汙穢其極下則與沙蟲同類其徒遂為薦拔之説以惑世人今列聖之神上同日月何庸薦拔且國初以來凡寫經追薦不知幾舉若未效是無佛法矣若已效是誣其祖矣撰為文辭不可以示後世請俟駕還奏之秋七月辛卯朔宣政使竒徹台自傳旨署事中書以體制非宜請通行禁止從之癸卯太廟成前殿十有五間東西二間為夾室南向知樞密院事巴勒丹坐贓杖免乙巳招諭左右兩江黃勝許岑世興己酉丞相拜珠以海運糧視世祖時頓增數倍今江南民力困極而京倉充滿奏請嵗減二十萬石帝遂併特們德爾增科江淮糧免之丙辰御史臺請降旨開言路帝曰言路何嘗不開但卿等選人未當爾朕知嚮所劾者率由宿怨羅織成獄加之以罪遂玷其人終身不復伸御史嘗舉巴爾濟蘇可任大事未幾以貪墨伏誅言路選人當乎否乎時特們德爾兩子俱獲罪毁碑籍資明致其罰帝方委任拜珠以進賢退不肖為急務特克實以姦黨不自安而帝又屢飭臺綱深知阿比特們德爾之事特克實由是益懼是月冀寧興和大同三路屬縣隕霜帝在上都夜寐不寧命作佛事拜珠以國用不足諫止之既而姦黨懼誅者復隂誘羣僧言國當有厄非作佛事而大赦無以禳之拜珠叱曰爾輩不過圖得金帛而已又欲庇有罪耶姦黨聞之知必不免遂萌逆節八月辛酉晉王獵於圖喇之地特實密遣烏魯斯來告曰我與哈克繖額森特穆爾實達爾謀已定事成推立王為皇帝又命烏魯斯以其事告都爾蘇且言汝與巴蘇呼知之勿令舒瑪爾節聞也於是王命囚烏魯斯遣巴勒密實等赴上都以逆謀告未至車駕南還癸亥駐蹕南坡是夕御史大夫特克實知樞密院事額森特穆爾大司農實達爾前中書平章政事齊琳特穆爾前雲南行省平章政事諤勒哲特們德爾子前治書侍御史索諾木特克實弟宣徽使索諾木典瑞院使托和齊樞密院副使額森簽書樞密院事章台衛士圖們及諸王按達布哈博囉伊嚕特穆爾竒爾布哈烏魯斯布哈等以特克實所領阿蘇衛兵為外應殺右丞相拜珠而特克實直犯禁幄手弒帝於卧所年二十一從葬諸帝陵帝性剛明嘗以地震減膳徹樂避正殿有近臣稱觴以賀問何為賀朕方修德不暇汝為大臣不能匡輔反為諂耶斥出之嘗戒近臣曰卿等居高位食厚祿當勉力圖報茍或貧乏朕不惜賜汝若為不法則必刑無赦巴爾濟蘇下獄謂左右曰法者祖宗所制非朕所得私巴爾濟蘇雖侍朕日久今其有罪當論如法嘗御鹿頂殿謂拜珠曰朕以幼沖嗣承大業錦衣玉食何求不得惟我祖宗櫛風沐雨戡定萬方曾有此樂耶卿元勳之裔當體朕至懷毋忝爾祖拜珠頓首對曰創業惟艱守成不易陛下睿思及此億兆之福也又謂大臣曰中書選人署事未旬日御史臺即改除之臺除者亦然今山林之士遺逸良多卿等不能盡心求訪惟以親戚故舊更相引用耶其明斷如此然以果於刑戮姦黨畏誅遂構大變云諸王按達布哈及額森特穆爾奉皇帝璽紱北迎晉王于鎮所癸巳晉王即皇帝位于龍居河詔大赦天下是日以知樞密院事額森特穆爾為中書右丞相甲午以內史都爾蘇為中書平章政事奈曼岱為中書右丞御史大夫特克實知樞密院事博囉為宣徽院使舒瑪爾莭為宣政院使乙未以樞密副使額森為御史中丞內使舒蘇為中書左丞丁酉以諤勒哲知樞密院事圖們同簽樞密院事戊戌以薩題勒默色知樞密院事章台同知樞密院事己亥敕諭百司凡銓授官遵世祖舊制惟樞密院御史臺宣政院宣徽院得自奏聞餘悉由中書辛丑以茂穆蘇知樞密院事實達爾為大司農召諸王屬流徙逺地及還元籍者二十四人還京師冬十月癸亥修佛事於大明殿特克實之變諸王邁努逃赴濳邸願效死力且言於帝曰不誅元凶則陛下善名不著天下後世何從而知帝深然之甲子以舒瑪爾節為中書右丞相陜西行省左丞圖嚕通政院使寧珠並為御史大夫蘇蘇為御史中丞遣使至大都以即位告天地宗廟社稷命舒瑪爾節寧珠誅逆賊特克實實達爾齊琳特穆爾托和齊章台等於大都並戮其子孫籍入家産惟特們德爾子索諾木議逺流張圭曰索諾木逆賊親斫丞相拜珠乃欲活之耶初特克實使齊琳特穆爾遽至京師趣召兩院學士北上翰林直學士曹元用獨不行曰此非常之變吾寧死不可曲從也未幾賊伏誅人服其先見之明壬申以內史阿勒坦綽克為太師知樞密院事癸未以舒瑪爾節兼阿蘇衛達嚕噶齊八番順元及靜江大理威楚諸路猺兵為寇敇湖廣雲南二省招諭之十一月己丑朔帝次於中都修佛事於昆剛殿辛丑車駕至大都丁未御大明殿受諸王百官朝賀初特克實遣使至大都封府庫收百司印監察御史許有壬知事急即往告中丞董守庸守庸謂宫禁事非子所當問有壬即疏守庸及經厯多爾濟巴勒監察御史郭額森呼圖克阿附特克實之罪以俟及御史大夫寧珠至有壬即袖疏上之辛亥守庸坐黨特克實免官壬子敇營繕不急者罷之癸丑遣使詣曲阜以太牢祀孔子敇會福院奉北安王諾木罕像於高梁河寺祭遁甲五福神丙辰御史中丞蘇蘇坐貪淫免官丁巳廣州路新會縣民汜長弟作亂廣東副元帥烏瑪喇率兵捕之詔凡有罪自首者原其罪十二月乙未御史臺經厯多爾濟巴勒御史實勒塔克烏德義郭額森呼圖克並坐黨特克實免官監察御史許有壬上章言曩者特們德爾専政誣殺楊多爾濟蕭拜珠賀勝觀音保索約勒哈迪密實黥竄成圭李謙亨罷免王毅高昉張志弼而趙世延受禍尤慘天下咸知其寃請昭雪之詔存者召還録用死者贈官有差壬戌浚鎮江路漕河及練湖省臣奏江浙行省言鎮江運河全藉練湖之水為上源官司漕運供億京師及商賈販載農民來往其舟楫莫不由此宋時専設人夫以時修濬練湖瀦蓄潦水若運河淺阻開放湖水一寸則可添河水一尺近年淤淺舟楫不通凡有官物差民運遞甚為不便委官相視疏治運河自鎮江路至吕城埧長百三十一里計役夫萬五百十三人六十日可畢又用三千餘人浚滌練湖九十日可完人日支糧三升中統鈔一兩詔從之以來春興工戊辰追尊皇考晉王噶瑪拉曰光聖仁孝皇帝廟號顯宗妣晉王妃鴻吉哩氏曰宣懿淑聖皇后庚午盜入太廟竊仁宗及莊懿慈聖皇后金主時參知政事烏瑪喇兼領太常禮儀使當遷左丞集賢大學士張圭曰太常奉宗祀不謹當待罪而反遷官何以謝在天之靈命遂格甲戌命道士吳全節修醮事乙亥太常院臣言世祖以來太廟嵗惟一享先帝始復古制一嵗四祭請裁擇之帝曰祭祀大事也朕何敢簡其禮仍命四祭監察御史托克托趙成慶等言特們德爾在先朝包藏禍心離間親藩誅戮大臣使先帝孤立卒罹大禍其子索諾木親與逆謀久逭天憲乞正其罪以快元元之心伊嚕托克托哈蘇台皆特克實之黨不宜寬宥遂並伏誅丙子命嶺北守邊諸王齊齊克圖月修佛事以却冦兵己卯命僧作佛事于大內以厭雷癸未流諸王伊嚕特穆爾于雲南諳達布哈於海南竒爾布哈於尼嚕罕博囉及烏魯斯布哈於海島並坐與特克實逆謀也乙酉諭百司惜名器各遵世祖定制丙戌舒瑪爾節言臣等議宗戚之中能自拔逆黨盡忠朝廷者惟有諸王邁努請加賞以示激勸遂以泰寧縣五千户益封邁努為泰寧王丁亥議賞討逆功賜舒瑪爾節金銀鈔都爾蘇為中書左丞相茂穆蘇寧珠索多並加授光祿大夫詔改明年元曰泰定雲南花腳蠻為寇詔招諭之泰定皇帝諱額森特穆爾顯宗噶瑪拉之長子裕宗珍戩之嫡孫也初北安王諾木罕薨世宗以噶瑪拉封晉王代鎮北邊至元十三年十月二十九日帝生于晉邸大德六年晉王薨帝襲封是為嗣晉王泰定元年春正月帝以元夕命有司於禁中張燈山為樂監察御史趙師魯上言燕安怠惰肇荒淫之基竒巧珍玩發奢侈之端張燈之事雖微而縱耳目之欲則上纍日月之明疏聞遽命罷之仍賜上尊酒以嘉其忠直辛丑諸王大臣請立皇太子壬寅以故丞相拜珠子達爾瑪實哩為宗仁衛親軍都指揮使齊哩克為左右衛阿蘇親軍都指揮使初拜珠為相憂國忘家常直內廷知無不言太官以酒進則憂形於色有盜其家金器百餘兩他寶直巨萬繼而獲盜得金家僮來告色無喜愠自延祐末水旱相仍民不聊生及拜珠入相振立紀綱修舉廢墜裁不急之務杜僥幸之門加惠兵民輕徭薄斂英宗倚之相與勵精圖治時天下晏然國富民足逺夷有古未通中國者皆朝貢請吏而姦臣畏之卒構禍難天下哀之特克實等既伏誅帝乃詔有司備儀衛百官耆宿前導輿拜珠畫像於海雲寺大作佛事觀者萬數無不歎惜泣下中書奏丞相拜珠盡忠效節殞於羣凶乞賜褒崇以光後世制贈清忠一德功臣太師上柱國追封東平王諡忠獻復官其二子以長宿衛拜珠母克哷氏年二十二寡居守節初拜珠為太常禮儀使方弱冠吏就第請署事適在後圃閲羣戲母厲聲呵之曰官事不治若爾所為豈大臣事耶拜珠深自克責一日入內侍宴英宗素知其不飲是日強以數巵既歸母戒之曰天子試汝量故強汝飲汝當日益戒懼無酣於酒又嘗代祀睿宗原廟歸侍左右母問之曰真定官府待汝若何對曰所待甚厚母曰彼以天子威靈汝先世勳德故耳汝何有焉拜珠之賢母之教也後封東平王夫人命僧諷西畨經于光天殿己酉命諸王逺徙者悉還其部召親王圖卜特穆爾于瓊州阿穆爾克于大同初英宗在上都謂丞相拜珠曰朕兄弟實相友愛曩以小人譖訴俾居逺方當亟召還明正小人離間之罪未及召而遇弒至是帝悉召之甲寅敇高麗王王章歸國章嘗請於仁宗降御香南遊江浙至寶陀山而還及英宗即位復請降香於江南許之行至江南遣使急召令騎士擁逼以行章侍從皆奔竄還至京師命中書省護送本國安置章遲留顧望不即發英宗下章於刑部既而祝髮置之石佛寺尋又流章于吐蕃薩斯嘉之地帝即位以大赦得還至是命章還本國仍歸其印此事據鄭仁趾高麗史修入丙辰賜故監察御史觀音保索約勒哈迪密實妻子鈔各千錠敕封解州鹽池神曰靈富公虞集赴召至京師除國子司業尋遷祕書少監二月丁巳朔作顯宗影堂己未修西畨佛事于壽安山僧四十人三年乃罷庚申監察御史傅巖起李嘉賓言遼王托克托乘國有隙誅屠骨肉其惡已彰恐懷疑二如令歸藩譬之縱虎出柙請廢之别立近族以襲其位不報甲子作佛事命僧百八人及倡優百戲導帝師遊京城舊制臺憲嵗各舉守令推官二人有罪連坐至是言其不便庚午命中書復於常選擇人用之壬申上大行皇帝尊諡曰睿聖文孝皇帝廟號英宗國語曰格根甲戌浙江行省左丞趙簡請開經筵及擇師傅令太子及諸王大臣子孫受學遂命平章政事張圭翰林學士承旨和塔拉都哩默色學士吳澄集賢直學士鄧文原以帝範資治通鑑大學衍義貞觀政要等書進講復敇右丞相額森特穆爾領之丁丑監察御史宋本等言逆賊特克實等雖伏誅其黨樞密副使額森身親弒逆以告變得不死竄嶺南乞早正天討國制範黃金為太廟神主仁宗室主為盜竊去本言在法民間失盜捕之違期不獲猶治罪太常失典守及在京應捕官皆當罷去又言中書宰執日趨禁中固寵茍安兼旬不至中堂壅滯機務乞戒飭臣僚自非入宿衛日必詣所署治事皆不報戊寅監察御史李嘉賓劾逆黨左阿蘇衛指揮使圖卜特穆爾罷之癸未加封廣德路祠山神張真君曰普濟寧國路廣惠王曰福祐先是至治末詔作太廟議者習見同堂異室之制乃作十三室未及遷奉而國有大故有司疑於昭穆之次命集議之翰林學士吳澄議曰世祖混一天下悉考古制而行之古者天子七廟廟各為宫大祖居中左三廟為昭右三廟為穆神主各以次遞遷其廟之宫頗如今之中書六部夫省部之設亦倣金宋豈以宗廟敘次而不考古乎時有司以急於行事竟如舊次云國學舊法每以積分次第貢以出官執政用監丞張起巖議欲廢之而以推擇德行為務中書左司員外郎許有壬折之曰積分雖未盡善然可得博學能文之士若曰惟德行之擇其名固佳恐皆厚貌深情專意外飾或懵不能識一丁矣三月丁亥朔罷徽政院立詹事院以祕書少監虞集為禮部考試官初集與元明善劇論以相切劘明善言集治諸經惟朱子所定者耳自漢以來先儒所嘗盡心者考之殊未博集初不相下後以明善之言為然每見明經之士即以其言告之至是謂同列曰國家科目之法諸經傳注各有所主者將以一道德同風俗非欲使學者專門擅業如近代五經學究之固陋也聖經深逺非一人之見可盡試藝之文推其高者取之不必先有主意若先定主意則求賢之心狹而差自此始矣後兩為考官率持是説故所取每稱得人戊戌廷試進士賜巴拉張益等八十四人及第出身有差會試下第者亦賜教官有差庚子以四川行省平章政事囊嘉特兼宣政院使往征西畨冦咱巴凌丙午御大明殿册巴拜哈斯氏為皇后皇子阿勒濟雅巴為皇太子己酉以皇子巴特瑪雅爾藏布嗣封晉王泰寧王邁努卒以其子琳沁多爾濟嗣庚戌監察御史宋本李嘉賓傅巖起言太尉司徒司空三公之職濫假僧人及會福殊祥二院並辱名爵請罷之不報夏四月己未以珠字詔賜帝師所居薩斯嘉部庚申作昭聖皇后御容殿於普慶寺親王圖卜特穆爾還至潭州有詔止之居數月乃行辛酉至上都賜車帳駝馬癸亥修佛事于夀昌殿甲子帝如上都以講臣多高年命虞集與侍讀學士王結執經以從集自是嵗嘗在行經筵之制取經史中切於心德治道者用國語漢文兩進讀潤譯之際患夫陳聖學者未易盡其要指時務者難於極其情每選一時精於其學者為之猶數日乃成一篇集為反覆古今名物之辨以通之然後得以無忤其辭之所達萬不及一則未嘗不退而竊歎也發兵民築渾河隄辛未月食既甲戌命咒師作佛事以厭雷庚辰以風烈月食地震手詔戒飭百官并令大都守臣集議以聞王結昌言於朝曰今朝廷君子小人混淆刑政不明官賞太濫故隂陽錯繆咎徵薦臻宜修政事以弭天變時宿衛士自北方來者復遣歸乃百十為羣剽劫殺人桓州道中既逮捕舒瑪爾節奏釋之蒙古千户使京師宿邸中適民間朱甲妻女車過邸門千户恱之并從者奪以入朱泣訴於中書舒瑪爾莭庇不問於是國子監丞宋本復抗言特克實餘黨未誅仁廟神主盜未得桓州盜未治朱甲寃未伸刑政失度民憤天怨災異之見職此之由辭氣激奮衆皆聳聽辛巳太廟新殿成五月丁亥監察御史董鵬南劉濳邊笥慕旺舒卜以災異上言平章奈曼岱宣徽院使特穆爾布哈詹事圖們岱爾黨附逆徒身虧臣節太常守廟不謹遼王擅殺宗親布哈濟蘭矯制亂法皆蒙寬宥甚為失刑乞定其罪以銷天變不允己丑帝諭都爾蘇曰朕即位以來無一人能執法為朕言者知而不言則不忠且陷人於罪繼自今凡有所知宜悉以聞使朕明知法度斷不敢自縱非獨朕身天下一切政務能守法以行則衆皆乂安反是則天下罹於憂苦矣又曰凡事防之於小則易救之於大則難爾其以朕言明告於衆俾知所慎壬辰御史臺臣圖固勒寧珠言御史奏災異屢見宰相宜避位以應天變可否仰自聖裁顧惟臣等為陛下耳目有徇私違法者不能糾察慢官失守宜先退避以授賢能帝曰御史所言其失在朕卿等何必遽爾圖固勒又言臣已老病恐誤大事乞先退於是中書省臣額卜德哷勒張圭楊廷玉皆抗疏乞罷丞相舒瑪爾節都爾蘇言比者災異陛下以憂天下為心反躬自責謹遵祖宗聖訓修德慎行敇臣等各勤乃職手詔至大都居守省臣皆引罪自劾臣等為左右相才下識昏當國大任無所襄贊以致災祲罪在臣等所當退黜諸臣何罪帝曰卿若皆辭避而去國家大事朕孰與圖之宜各相諭以勉乃職癸巳前翰林學士蘇爾約蘇哈雅卒贈集賢學士追封京兆郡公諡文靖初議科舉事蘇爾約蘇哈雅多所建明忽喟然歎曰辭尊居卑昔賢所尚也今禁林清選與所讓軍資孰髙人將議吾後矣乃稱疾辭還江南賣藥於錢唐市中詭姓名易服色人無有識之者其視死生若晝夜絶不入念慮翛然欲遺世而獨立也戊戌遷列聖神主於太廟新殿辛丑循州猺冦長樂縣丙午御史高奎上書請求直言辨邪正明賞罰帝善其言賜以銀幣己酉賓州民方二為冦有司捕擒之癸丑詹事丞和和請如裕宗故事擇名儒輔太子敇中書省臣訪求以聞和和博果密之子庫庫之兄也敦默寡言嗜學能文歷山南淮西河南廉訪使皆有政聲中書平章政事張圭與樞密院御史臺翰林集賢兩院官極論當世得失與左右司員外郎宋文纘詣上都奏之其略曰前宰相特們德爾姦狡險深隂謀叢出專政十年凡宗戚忤己者巧飾危間隂中以法忠直被誅竄者甚衆始以贓敗諂附權姦實勒們及嬖幸伊埓薩巴之徒茍全其生尋任太子太師未幾仁宗賓天乘時幸變再入中書當英廟之初與實勒們等恩義相許表裏為姦誣殺蕭楊等以快私怨天討元凶實勒們之黨既誅坐要上功遂獲信任諸子內布宿衛外據顯要蔽上抑下杜絶言路賣官鬻獄威福已出由是羣邪並進如逆賊特克實之徒名為義子實其腹心終以遺患構成弒逆其子索諾木與逆謀所由來者漸矣雖剖棺戮尸夷滅其家猶不足以蔽罪今復回給所籍家産諸子尚在京師夤緣再入宿衛世祖時阿哈瑪特貪殘敗事雖死猶正其罪況如特們德爾之姦惡者哉臣等議宜遵成憲仍籍特們德爾家産逺竄其子孫外郡以懲大姦特克實之黨結謀弒逆天下之人痛心疾首比奉旨諸王諳達布哈等亦己流竄逆黨脅從者衆何可盡誅後之言事者其勿復舉臣等議古法弒逆凡在官者殺無赦聖朝立法強盜劫殺庶民其同情者猶且首從俱罪況弒逆之黨天地不容宜誅諳達布哈之徒以謝天下遼王托克托位冠宗室居鎮遼東乘國有變報復讐忿殺親王妃主百餘人分其羊馬畜産殘忍骨肉聞者切齒今不之罪乃復厚賜放還臣恐國之紀綱由此不振且遼東地廣素號重鎮若使托克托久居彼既縱肆將無忌憚況令死者含寃感傷和氣宜削奪其爵土置之他所以彰天威武備卿濟勒前太尉布哈以纍朝待遇之隆俱致高列不思補報專務姦欺矯制令鷹師強收鄭國寶妻果斡刑曹逮鞫服實竟原其罪夫匹婦銜寃三年不雨以此論之即非細務宜以濟勒布哈仍付刑曹鞫正其罪賈胡中賣寶物始自成宗分珠寸石售直數萬以經國有用之鈔而易此不濟飢寒之物又非有司聘要和買大抵皆時貴與商賈中寶之人妄稱呈獻冒給回賜高其直且十倍蠶蠧國財暗行分用宜下令禁止其纍朝未酬寶價俟國用饒給日議之比者建西山寺損軍害民費以億萬計近詔雖已罷之又聞姦人乘間奏請復欲興修宜守前詔示民有信蕭拜珠楊多爾濟等枉遭誣陷籍其家以分賜人比奉明詔還給元業子孫奉祀家廟修葺茍完未及寧處復以其家財仍賜舊人止酬其直即與再罹斷沒無異宜如前詔以元業還之量其直以酬後所賜者則人無寃憤矣額森特穆爾之徒遇朱太醫妻女過省門外強拽以入姦宿館所事聞有司以扈從上都為解竟弗就鞫宜遵世祖成憲以姦人付有司鞫之廣州東莞縣大步海及惠州珠池始自大德元年姦民劉進程連言利分蛋户七百餘家官給之糧三年一採僅獲小珠五兩六兩入水為蟲魚傷死者衆遂罷珠户為民其後同知廣州路事塔齊爾等又獻利於實勒們創設提舉司監採廉訪司言其擾民復罷歸有司既而內正少卿魏阿勒逹爾冒啓中旨馳驛督採耗廩食疲民驛非世祖舊制請悉罷之特克實弒逆之變學士布哈指揮布延和爾院使托果斯皆以無罪死特們德爾專權之際御史徐元素以言事鎖項死東平及賈圖沁布哈之屬皆未申理宜追贈死者優敘其子孫內外增置官署員冗俸濫白丁驟升出身入流壅塞日甚軍民俱蒙其害宜悉遵世祖成憲凡至元三十年已後改升創設員冗者悉減併除罷之自古聖君惟誠於治政可以動天地感鬼神未嘗徼福於僧道也至元三十年醮祠佛事之目止百有二大德七年再立功德使司積五百有餘僧徒又復營幹近侍買作佛事嵗用鈔數千萬錠僧徒貪慕貨利畜養妻子彼既行不修潔適足褻慢天神何以要福比年佛事愈繁纍朝享國不永致災愈速事無應驗斷可知矣宜罷功德使司其在至元三十年以前及纍朝忌日醮祠佛事名目止令宣政院主領修舉餘悉減罷遊惰之徒妄投宿衛部屬及宦者女紅太醫隂陽之屬不可勝數一人收籍一門蠲復一嵗所請衣馬芻糧數十户所徵入不足以給之耗國損民為甚宜如世祖時支請之數給之餘悉簡汰咱巴凌盜始者劫殺使臣利其財物而已至用大師期年不戢傷我士卒費國資糧宜遣良使抵巢招諭仍敇邊吏勿生事則逺人格矣世祖時淮北內地惟輸丁稅特們德爾為相專務聚斂遣使括勘兩淮河南田土重併科糧又以兩淮荆襄沙磧作熟收徵徼名興利農民流徙宜如舊制止徵丁稅其括勘之糧及沙磧之稅悉除之世祖左右之臣雖甚愛幸未聞無功而給一賞者比年賞賜泛濫蓋因近侍之人窺伺天顏喜恱之際或稱乏財無居或稱嫁女娶婦或以技物呈獻遞互奏請要求賞賜既傷財用復啓幸門自今以後非有功勳勞效著明實迹不宜加以賞賜乞著為令議凡數千言辭甚剴切六月庚申圭至上都奏上帝不允圭復進曰臣聞日食修德月食修刑應天以實不以文動民以行不以言刑政失平故天象應之惟陛下矜察允臣等議乞悉行之帝終不能用癸亥作禮拜寺於上都及大同路給鈔四萬錠丙寅遣使詔諭咱巴凌遣庫庫楚等詣高麗取女子三十人廣西左右兩江黃勝許岑世興乞遣其子弟朝貢許之丁卯大幄殿成作辰類坐靜佛寺辛未修黑雅滿達噶佛事于水晶殿癸酉帝受佛戒於帝師己卯詔疏決繫囚存恤軍士免天下和買雜役三年蛋户差稅一年逺仕瘴地身故不得歸葬妻子流落者有司資給遣還仍著為令雲南大理路你囊為冦是月大同渾源河真定滹沱河陜西渭水黑水渠州江水皆溢並漂民廬舍秋七月丙戌思州平茶楊大車酉陽州冉世昌冦小石耶凱江等寨調兵捕之癸卯罷廣州福建等處採珠蛋户為民仍免差稅一年丁未中書省臣言東宫衛士先朝止三千人今增至萬七千請命詹事院汰去仍依舊制從之戊申以籍入特們德爾及子巴勒丹觀音努資産給還其家是月朝邑楚丘開州濮陽黃河溢固安州清河溢任縣沙澧洺水皆溢真定廣平廬州十一郡雨傷稼龍慶州雨雹大如雞卵平地深三尺定州屯河溢山崩免河渠營田租餘賑恤有差廣西慶逺猺酋潘父絹等率衆來降署為簿尉等官有差加封溫州故平陽侯曰英烈侯八月丁巳禁言赦前事庚申市牝馬萬匹取湩酒辛亥賜親王圖卜特穆爾鈔三千錠庚午作中宫金脊殿辛未繪帝師帕克斯巴像十一頒各行省俾塑祀之丁丑帝至自上都罷浚玉泉山河役癸未秦州成紀縣大雨山崩水溢壅土至來谷河成丘阜九月丙申葺太祖神御殿乙巳昭獻元聖皇后忌日修佛事飯僧萬人癸丑奉元路長安縣大雨灃水溢延安路洛水溢冬十月庚申命左右相日值禁中有事則赴中書己巳雲南車里蠻為冦遣鄂爾多奉詔招諭之其酋乃出降壬申真州珠金沙河吳江州諸河淤塞詔有司傭民丁浚之丙子命帝師作佛事於延春閣丁丑封親王圖卜特穆爾為懷王賜金印徙封雲南王旺沁為梁王仍以其子特穆爾襲封雲南王十一月己丑命道士修醮事辛丑造金寶蓋飾以七寶貯佛舍利甲辰作歇山鹿頂樓於上都十二月乙卯雲南猺阿吾及歪鬧為冦行省督兵捕之庚申同州地震有聲如雷癸亥鹽官州海水溢屢壞隄障浸城郭遣使祀海神仍與有司視形勢所便還請疊石為塘帝曰築塘是重勞吾民也其增石囤扞禦庶天其相之丙寅命翰林國史院纂修英宗顯宗實録敇內外百官凡行朝賀等禮雨雪免朝服辛未新作棕殿成乙亥太白經天曲赦重囚三十八人為三宫祈福夔路容米洞蠻田先什用等九洞為冦四川行省遣使諭降五洞餘發兵捕之太子賓客巴圖江浙行省平章博羅歡之次子也以疾辭職寓居高郵英宗命為江南行臺御史大夫巴圖固辭詔以平章之祿歸養於家復賜鈔十萬緡所服藥酒空青詔遣使江南訪求之巴圖辭謝曰臣曩膺重寄深懼弗稱況敢叨濫厚祿以受重賜乎并以所給平章之祿歸有司是嵗還京師卒朝廷知其貧賻鈔二萬五千貫御史奏益一萬貫仍還所辭祿妻鴻吉哩氏弗受曰始巴圖仕於朝不敢虛受廩祿今沒矣茍受是祿非其意也卒辭之王克敬為兩浙鹽運使司首減紹興民食鹽五千引溫州逮犯私鹽者以一婦人至怒曰豈有逮婦人千百里外與吏卒雜處者汚教甚矣自今毋得逮婦人建議著為令資治通鑑後編卷一百六十七
