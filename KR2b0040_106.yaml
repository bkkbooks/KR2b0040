body:
  text: 資治通鑑後編卷一百六刑部尚書徐乾學撰宋紀一百六起著雍涒灘正月盡屠維作噩三月凡一年有三月髙宗受命中興全功至德聖神武文昭仁憲孝皇帝建炎二年春正月丙戌朔帝在揚州金尼瑪哈諜知鄧州將為行在所令寧珠可急攻之知州范致虛遁安撫使劉汲分兵守要害自以牙兵四百登陴禦敵皆死鬭矢下如雨軍中請汲去不聽戊子城陷遂死之初議南陽備巡幸儲峙甚多至是悉為金人所有先是杭溫二州上供物留鎮江府有以螺鈿為之者帝惡其竒巧乃命守臣錢伯言毁之於市觀者悅服辛卯置行在𣙜貨務壬辰金烏珠自鄭抵白沙去汴京密邇都人震恐僚屬入問計宗澤方對客圍棋笑曰何事張皇劉衍等在外必能禦敵乃選精鋭數千使繞出敵後伏其歸路金人方與衍戰伏兵起前後夾擊之金人果敗先是有撰勸勇文者揭於關王廟中略曰蕃賊擾散甚久百姓因賊破家者皆當復讎力戰若不能此枉作男兒雖活何益去嵗賊來百姓已錯今年防賊不可怯懦汝若怕賊則敗不怕則勝况賊有五事易殺連年戰辛苦易殺馬倒便不能起易殺身入重地力孤易殺各宜齊心協力共保今嵗無虞京西提刑謝貺得而上之詔兵部刋板散示諸路甲午詣夀寧寺謁祖宗神主迪功郎周公彥言今兹正月之交乃太一遷正之日宜於禁中設壇拜迎是日帝問宰執當如何許景衡曰修德愛民天自降福何拜迎太一之有㑹有前朝奉郎崔穆所生母沈氏訴穆舊未嘗罵母抱寃久廢乞因赦叙於是張慤言臣知穆為詳穆乃翰林學士張閣之壻蔡京謫詞閣所草也京憾之開封尹盛章阿京意鍛錬穆罪人以為寃帝曰抱寃者獲伸則人心悅而天意格豈不賢於周公彥望拜之禱乎乃詔復穆本官金羅索既陷同華諸州遂圍永興軍時京兆兵皆為經制使錢蓋調赴行在經略使唐重度勢不可支以書别其父克臣曰忠孝不兩立義不茍生以辱吾父克臣報之曰汝能以身徇國含笑入地矣及金兵圍城重與守臣會盟死守前經制副使傅亮以精鋭數百出戰被擒乙未城陷重遂與副總管楊宗閔轉運副使桑景詢判官曾謂提舉軍馬程迪提㸃刑獄郭忠孝經略司總管機宜文字王尚及其子建中俱死之重彭山人忠孝河南人嘗受易中庸於程頥迪開封人父博古戰死以䕃得官迪又以戰死東平府兵馬鈐轄孔彥舟聞金兵將至山東遂率所部劫殺居民南渡淮犯黃州守臣趙令􅍲拒之丙申金人陷均州守臣楊彥明遁去詔自今犯枉法自盜贓者中書籍其姓名罪至徒者永不録用丁酉金人陷房州己亥張遇焚真州祕閣修撰孫昭逺戰不利其下欲擁之南還昭逺罵曰若等衣食縣官不以此時報國南去何為叛兵怒反擊昭逺遂遇害庚子張遇陷鎮江府守臣錢伯言棄城走辛丑金人陷鄭州通判趙伯振死之時所在盜起黃潛善汪伯彥匿不以聞內侍邵成章上疏言二人必誤國帝以祖宗以來未有內侍言大臣者詔除名南雄州編管後思成章忠直召赴行在有沮之者乃止之於洪州金人入洪聞其名訪求得之謂曰知公忠正能事吾主可享富貴成章不應脅之以威亦不從金人曰忠臣也吾不忍殺遺之金帛而去癸卯金額爾衮陷濰州知州韓浩與通判朱廷傑皆力戰死之又陷青州浩琦之孫也鳯翔府進方士彭知一所燒金帝札付三省曰朕不忍燒假物以誤人今發還仍毀其燒金之具丁未詔諭流民潰兵之為盜賊者釋其罪己酉禁諸將引潰兵入蜀置大散關以審驗之辛亥王淵招降張遇以所部萬人𨽻韓世忠右諌議大夫衛膚敏因論孟忠厚不合改除中書舍人不肯就職張慤言忠厚當換武階帝即以臣僚論疏付忠厚令自請太后與換武階遂除正任承宣使膚敏始受命金人焚鄧州癸亥太學生魏佑上書論黃潛善汪伯彥誤君十大罪是月以中奉大夫劉豫知濟南府豫景州人為河北提刑金人南侵豫棄官避地真州張慤薦之起知濟南時盜起山東豫不願行請易東南一郡執政不許豫忿而去金人陷潁昌府殺守臣孫默金羅索既陷永興鼓行而西秦州帥臣李復以城降敵勢益張引兵犯熙河經略使張深遣兵馬都監劉惟輔以精騎二千人禦之夜趨新店金人恃勝不虞黎明軍進惟輔刺其帥哈富墮馬死金人引去深檄隴右都護張嚴往追之二月金尼瑪哈據西京與宗澤相持澤遣部將閻中立郭俊民李景良等帥兵趨鄭丙辰遇敵大戰兵敗中立死之俊民降景良遁去澤捕景良斬之既而俊民與金將持書來招澤澤皆斬之金人陷唐州言者論龍圗閣直學士鄭修年乃居中之子顯謨閣直學士劉阜民乃正夫之子皆乳臭小兒初無出身及文學政事乞並鐫其職詔從之壬戌宇文虛中應詔使絶域復中大夫召赴行在癸亥罷市易務甲子金人犯滑州宗澤部將張撝往救之撝至滑衆寡不敵或請少避之撝曰避敵偷生何面目見宗公力戰而死澤聞撝急遣王宣往援已不及因與金人大戰破走之澤以宣知滑州金自是不敢復犯東京澤得金將王䇿於河上本遼臣也澤解其縛問金之虛實得其詳遂決大舉之計召諸將曰汝等有忠義心當協謀勦敵期還二聖以立大功言訖泣下諸將皆聽命金人屢戰不利悉引去乙丑澤復表請帝還闕曰臣為陛下保護京師自去秋至今春又三月矣陛下不早回則天下之民何所依戴不報澤威聲日著敵聞而憚之與南人言必曰宗爺爺河北盜楊進等降於宗澤進號沒角牛聚衆三十萬與丁進王再興李貴王大郎等擁衆各數萬往來京西淮南河南北侵掠澤遣人諭以禍福悉招降之有王善者河東巨寇也擁衆七十萬車萬乘欲據京城澤單騎馳至善營泣謂之曰朝廷危難之時使有如公一二輩豈復有敵患乎今日乃汝立功之秋不可失也善感泣曰敢不效力遂解甲降丁卯復延康述古殿直學士為端明樞密直學士壬申赦福州叛卒張員等癸酉金人陷蔡州執守臣閻孝忠時劇賊張遇等雖受招安而猶縱兵四劫乃詔知揚州吕頥浩率劉安世王淵等圗之於是頥浩單騎入賊營遇等皆出迎唯劉彥不至乃主謀不降者頥浩斷其足釘於揚子橋餘黨怖而釋甲丙子金人陷淮寧府守臣開封向子韶死之時金人晝夜攻城子韶率軍民固守遣人詣宗澤乞援未至城陷金人欲降之酌酒於前左右抑令屈膝子韶直立不動㦸手大罵遂為所殺闔門皆遇害事聞賜諡忠毅吕中曰當建炎之初河北惟失真定等四郡河東惟失太原等六郡其他固在也李綱招撫經制之事既沮故當時無連衡合從相援之勢金兵方勝又非一州之所能敵見破一州又取一州使忠臣義士守孤城以待盡豈不惜哉丁丑以劉誨充金國軍前通問使王貺副之辛巳和州防禦使馬擴聚兵於真定五馬山得皇弟信王榛於民間奉之以總制諸寨兩河遺民聞風響應金人遷洛陽襄陽潁昌汝鄭均房唐鄧陳蔡之民於河北中山府受圍三年城中糧絶人皆羸困不能執兵知府陳遘欲盡括城中兵力戰部將沙振潛衷刃入府害遘及其子錫等十七人振出為帳下卒所殺捽裂之身首無餘三月辛卯城陷金人見遘尸曰忠臣也斂而葬之金尼瑪哈聞張嚴東出自河南西入關以援羅索丁酉盡焚西京廬舍掠其民而去庚子河南統制官翟進復西京宗澤奏進為京西北路安撫制置使言者以前起居舍人許亢宗前祕書少監李光皆附蔡攸以擢要官乙巳詔亢宗光並管崇福宫丙午遙授何㮚為觀文殿大學士陳過庭聶昌為資政殿大學士時㮚已卒於金昌為人所殺惟過庭在金軍中己酉張員等復作亂擁衆突城出命右路提㸃刑獄李芘討捕之庚戌金人陷洺州是月金羅索陷鳯翔府守臣劉清臣棄城去又犯涇原經略使曲端遣將吳玠逆擊於清溪嶺敗之金兵走同華石壕尉李彥仙保三寨屢敗金師破其五十餘壁復陜州及絳解諸縣事聞詔彥仙知陜州兼安撫使前同知樞密院事孫傅卒於燕山府夏四月丙辰詔文臣從官至牧守武臣管軍至遙郡各舉所知二人戊午宗澤遣將趙世興復滑州先是澤去磁以州事付兵馬鈐轄李侃統制趙世隆殺之至是世隆及弟世興以兵二萬來歸衆懼其變澤曰世隆本吾一校耳何能為世隆至責之曰河北陷沒吾宋法令與上下之分亦陷沒邪命斬之世興佩刃在側衆兵露刃庭下澤謂世興曰汝能立功足以雪恥世興感泣遣往滑州掩擊金人敗之遂復其城時諸路方行巡社之法東平府守臣權邦彥亦奏東阿縣民自相糾集為巡社寇不敢犯言者以為其法利於西北而不利於東南乞罷之乙未詔陜西河北巡社依舊餘路並罷時杭溫二州已就緒請留亦不聽言者謂近日帥守之棄城者習已成風如鄧雍之於荆南何元同之於潁昌趙子嵩之於鎮江皆擁兵先遁今則安居薄責而未正其罪至於康允之之於夀春陳彥文之於九江以數千之疲旅捍十萬之強寇而允之止遷一職彥文方復舊官議者惑焉願著其賞罰以示勸懲詔從之乙丑翟進以兵襲金烏珠於河南兵敗其子亮死之進又率韓世忠丁進等戰於文家寺又敗世忠南歸烏珠復入西京尋棄去張嚴追及金羅索於鳯翔境鋭意擊敵至五里坡羅索伏兵坡下嚴與曲端期不至徑前遇伏戰敗而死尼瑪哈聞之遂自平陸渡河歸雲中丁卯金人入洛州壬申軍賊孫琦焚隨州癸未入唐州是月信王榛遣馬擴來奏事詔以榛為河外都元帥擴為馬步軍都總管楊時連章求去遂以龍圖閣直學士提舉洞霄宫時在東郡所交皆天下士先逹陳瓘鄒浩皆以師禮事之暨渡江東南學者推時為程氏正宗宗澤招撫羣盜聚城下又募兵儲糧召諸將約日渡河諸將皆掩泣聽命五月澤遣子頴詣闕上疏言祖宗基業可惜陛下父母兄弟蒙塵沙漠日望救兵西京陵寢為賊所占今年寒食節未有祭享之地而兩河二京陜右淮甸百萬生靈陷於塗炭乃欲南幸江東蓋奸邪之臣一為强敵方便之計二為其親屬皆已津置在南故也今京城已增固兵械已足備士氣已勇鋭望陛下無沮萬民敵愾之氣而循東晉既覆之轍帝得疏又聞信王榛將渡河入汴乃降詔擇日還京既而不果乙酉尚書右丞許景衡罷景衡在位朝廷有大政事必請間極諫黃潛善等素惡其異巳時方下詔還京因共以渡江之議為景衡罪罷為資政殿學士提舉洞霄宫行至瓜洲得暍疾卒景衡得程頥之學志慮忠純議不與時俯仰既卒帝思之曰朕自即位以來執政忠直遇事敢言惟許景衡耳詔賜其家溫州官舍一區諡忠簡丙戌定詩賦經義試士法初元祐中科舉以經義詩賦兼取紹聖以來罷試詩賦至是命參酌元祐科舉條制定試士法中書省請習詩賦舉人不兼經義習經義者人占一經解試省試並計數各取通定髙下殿試仍對策三道故事廷試上十名內侍先以卷奏定高下帝曰取士當務至公豈容以己意升降自今勿先進卷戊子以翰林學士朱勝非為尚書右丞辛卯以金人分兵渡河詔統制官韓世忠閻勍各領所部兵逆戰令宗澤遣楊進等援之丙申復宇文虛中資政殿大學士充金國祈請使楊國輔副之稱臣奉表於金時金方興兵南下已留王倫朱辨矣虛中至金人遣虛中及楊國輔劉誨王貺並歸虛中曰奉命北來祈請二帝二帝未還虛中不可歸遂獨留時金國初建制度草創愛虛中有才藝每加官爵虛中即受之遂與韓昉俱掌制宗澤聞王彥聚兵太行山欲大舉趨太原澤即以彥為忠州防禦使制置河北軍事恐彥孤軍不可獨進召彥計事彥悉召諸寨指授方略以俟㑹合乃以萬餘人先發金人以重兵躡其後而不敢擊既至汴澤令宿兵近甸以衛根本彥遂屯滑州之沙店澤上疏曰臣欲乘此暑月遣彥等自滑州渡河取懷衛濬相等州王再興等自鄭州直護西京陵寢馬擴等自大名取洺相真定楊進王善丁進等各以所領兵分路並進既渡河則山寨忠義之兵相應不啻百萬願陛下早還京師臣當躬冒矢石為諸將先中興之業必可立致疏入黃潛善等忌澤成功從中沮之癸卯中書侍郎張慤卒諡忠穆慤善理財論錢榖利害如指諸掌修身行己雖細必矜立朝謇諤有大臣節及卒帝每念之謂慤謀國盡忠遇事敢諫古之遺直也初宗澤承制以王庶為陜西制置使曲端為河東經制使未幾錢蓋聞敵陷長安檄庶兼節制懷憂涇原兵既而金人東還庶以金人重載可襲取勝移文兩路協力更戰而環慶帥王似涇原帥席貢不欲受庶節度具文以報實不出兵金人至清溪為吳玠所扼至咸陽望渭南義兵滿野不得渡循渭而東其支軍入鄜延攻康定庶急遣兵斷河橋又令劉延亮屯神木峽斷其歸路敵遂去甲辰金羅索陷絳州己酉秀州卒徐明等作亂執守臣朱芾迎前守趙叔近復領州事詔御營中軍統制張俊討之女真初未有文字尼瑪哈訪問其國老人多得祖宗遺事及金主嗣位復進士科而韓昉輩皆在左右文學之士稍見拔擢六月己未詔求祖宗遣事以備國史命烏葉與耶律達斡掌之烏葉等採托遺言舊事自始祖函普以下至太祖綜為三卷上之考異陳桱通鑑續編此事附見十一月按金史太宗紀則詔求祖宗遺事乃六月己未事也今正之乙丑張俊至秀州執徐明斬之趙叔近與王淵有宿憾俊故淵之部曲希淵㫖誣以同叛并殺叔近借刑部尚書楊應誠等奉使至髙麗丁卯見國王楷傳旨借道以逹金國髙麗君畏金人之強堅不肯假道且言二聖見留燕雲不在金國又言金人決不肯和應誠等遂還建州卒葉濃等作亂甲戌陷福州丁丑詔江浙沿流州軍練水軍造戰艦是月以知延安府王庶節制陜西六路軍馬涇原經略使曲端為節制司都統制時陜西撫諭使謝亮持詔賜夏國庶移書曰夏人之患小而緩金人之禍大而迫今占據同華畏暑休兵秋髙必大舉盍仗節督諸路協同義舉爭先並進驅逐渡河徐圗恢復亮不能從京畿淮甸蝗秋七月甲申葉濃入寧德縣復還建州命張俊同兩浙提㸃刑獄趙哲率兵討之丙戌東京留守宗澤卒澤前後請帝還京二十餘奏每為黃潛善汪伯彥所抑澤憂憤成疾疽發於背諸將入問疾澤矍然曰吾以二聖蒙塵憤憤至此汝等能殱敵則我死無恨衆皆流涕曰敢不盡力諸將出澤歎曰出師未捷身先死長使英雄淚滿襟無一語及家事但連呼過河者三而卒年七十都人號慟訃聞贈觀文殿學士諡忠簡澤質直好義親故貧者多依之而自奉甚薄常曰君父側身嘗膽臣子乃安居美食邪始澤招集羣盜聚兵儲糧結諸路義兵連燕趙豪傑自謂渡河克復可指日冀有志弗就識者皆以為恨澤子頴居戎幕素得士心都人請以頴繼父任時己命杜充代澤不許充酷而無謀至汴悉反澤所為於是豪傑離心降盜聚城下者復去剽掠唯嶽飛仍為留守司統制𨽻充麾下辛丑詔以春霖夏旱蝗州縣災甚者蠲田賦八月甲寅作御寶金之入汴也九寶惟大宋受命寶及定命寶存至是帝作金寶三一曰皇帝欽崇國祀之寶二曰天下合同之寶三曰書詔之寶甲戌罷殿中侍御史馬伸伸自河南還上書言黃潛善汪伯彥不法十七事乞速罷二人政柄别選賢者共圗大事疏入留中明日改授衛尉少卿伸辭不拜録其疏申御史臺且言臣論可采即乞施行非是合坐誣誑之罪因移疾待命詔伸言事不實送吏部責監濮州酒稅趣使上道伸怡然擕襆被而行竟死道中聞者寃之伸東平人弱冠登第從程頥學勇於為義每曰吾志在行道若以富貴為心則為富貴所纍以妻子為念則為妻子所奪道不可行也趙子砥至燕山遁歸命輔臣問北事甚悉子砥大略言金人講和以用兵我國斂兵以待和本朝與金勢不兩立昔契丹主和女真主用兵十餘年間竟滅契丹今復蹈其轍譬人畏虎以肉喂之食盡終噬人若設陷穽以待之然後可以刺虎矣執政不恱遂命子砥知台州河北京東捉殺使李成叛辛巳犯宿州丁丑二帝自霫部赴上京以素服見金太祖廟遂見金主於乾元殿金主封道君皇帝為昏德公淵聖皇帝為重昏侯未幾徙之韓州韓州在燕山東北一千五百餘里令下之日盡空其城命晉康郡王孝騫等九百餘人至韓州同處給田十五頃令種蒔以自給惟秦檜不與徙依達蘭以居達蘭亦厚待之先是道君在霫部一日謂駙馬都尉蔡鞗曰宸極失御播越至此荷天眷祐建炎中興今草得一書欲厚遺本路都統求通於左副元帥且命鞗以書示檜檜讀之嗚咽不勝遂具酒殽延本路都統逹書於尼瑪哈尋徙居韓州道君每南望必注目久之曰陵寢在何處泣數行下遇忌辰時輟膳追慕終日宗室自孝騫以下每相見撫問再三有挾私恨而致爭者必告以身在他鄉幸得相聚毋挾私憤然紹述神宗之志未嘗忘懷時有貨王安石日録者輟衣而易之此據中興記事本末修入九月甲申丁進叛復寇淮西庚寅御集英殿賜禮部進士李易以下四百五十一人及第出身癸巳金人陷冀州將官李政死之甲午金人再犯永興軍經略使郭琰棄城退保義谷丁未東京留守統制官薛廣及金人戰於相州敗死己酉同知樞密院事郭三益卒曲端雅不欲屬王庶是月金人攻陜西庶召端會雍耀間端辭以未受命庶以鄜延兵先至龍坊端又稱已奏乞廽避席貢别遣統制官龎世才將步騎萬人來會庶無如之何則檄貢勒端還舊任遣陜西節制司將官賀師範趨耀州别將王宗尹趨白水且令原慶出師為援二帥各遣偏將劉仕忠寇鯶來與師範㑹庶欲往耀督戰㑹世才兵至邠端中悔以狀白庶言已赴軍前庶乃止師範輕敵不戒卒遇敵於八公原戰死二將各引去端遂得涇原兵柄是秋金將鄂爾多襲破信王榛於五馬山寨遂會尼瑪哈入寇初馬擴自五馬山詣行在黃潛善汪伯彥疑其非真及行授密旨使譏察信王榛且令擴聽諸路節制擴知事不成遂留大名不進金鄂爾多恐擴以援兵至急發兵攻下五馬山諸寨探知擴兵南來使人馳會尼瑪哈共備之尼瑪哈將歷懷衛而東聞鄂爾多已敗擴軍於清平遂由黎陽渡河㑹兵以攻澶濮榛亡走不知所終冬十月戊午遣劉光世討李成金右副元帥額爾衮以衆渡河攻陷開德府遂圍濮州時四方貢賦不能如期而至行在仰給惟茶鹽鈔法然視商賈去來不可為準初宣和困方臘之亂江浙被賊諸州皆蠲其賦而官兵無所給乃詔發運使陳遘經制東南遘請以七路之財補其乏始設比較酒務量添酒價及商稅額亦增一分并賣契紙與公家出納每緡收二十三文並號經制錢斂之少聚之多而無損於民靖康罷之至是翰林學士葉夢得言經制之法皆求於民之所欲而非強其所不欲望復行之户部尚書吕頤浩亦言其法創於陳遘若循之可以助國而無害於民賢於緩急暴斂多矣壬戌詔諸路提刑司拘收仍依封樁錢法不可擅用癸亥尼瑪哈圍濮州遣韓世忠范瓊至東平開德分道拒戰又命馬擴援之侍御史張浚請先定六宫所居地甲子詔孟忠厚奉太后及六宫皇子如杭州以苗傅為扈從都統制劉正彥副之楊進復叛兵至數萬剽掠汝洛間翟進患之與其兄興謀擊之未果楊進遣騎數百絶洛水犯進營進乘半渡擊之追奔數十里至鳴臯山破賊四寨馬驚墜塹為賊所殺賊乘勝大敗官軍詔以興為京西北路安撫招討使是月劉正彥擊丁進降之十一月辛巳朔提舉嵩山崇福宫李綱萬安軍安置劉光世及李成戰於新息縣成敗走金人圍陜州守臣李彥仙戰却之壬辰金人陷延安府通判魏彥明坐於城樓上金人并其家執之諭使速降彥明曰吾家食宋祿爾輩使吾背君乎金人怒殺之初曲端為都統制𨽻王庶庶政嚴多誅將士嘗曰設曲端有誤亦當斬之端聞而恨未有以報金人知端與庶不協併兵攻鄜延庶在坊州聞之夜趨鄜延以遏其衝金人詭道入丹州州界鄜延之間庶乃自當延安路時端盡統涇原精兵庶屢督其進端陽許而不行乃遣吳玠攻華州拔之端迂路由邠之三水與玠會襄樂金攻延安急庶收𣪚亡往援知鳯翔府王􅊅將所部兵赴之比庶至甘泉而延安已失庶無所歸以軍付􅊅自將百騎與官屬馳赴襄樂勞軍庶猶以節制望端欲倚以自副端彌不平庶初至坐帳中端先以戎服趨於庭既而與隨軍應副張彬及走馬承受公事髙中立同見帳中良久端聲色俱厲問庶延安失守狀曰節制固知愛身不知愛天子城乎庶曰吾數令不從誰其愛身者端怒曰在耀州屢陳軍事不一見聽何也因起歸帳庶留端軍終夕不自安端欲即軍中殺庶奪其兵夜走寧州見撫諭使謝亮曰延安五路襟喉今已失矣春秋之義大夫出疆得以専之請誅庶歸報亮曰使事有指今以人臣擅誅於外是跋扈也公為則自為之端沮而歸明日庶見端為言已自劾待罪端拘繫其官屬奪其節制使印庶乃得去時王􅊛在慶陽端使其統制張中孚往召之曰􅊅若不聽則斬以來會􅊅己去追之不及癸巳趙哲大破葉濃於建州城下濃遁而降復謀為變張俊擒斬之金人之圍濮州也以州小易之至城下知州楊粹中固守命將姚端夜搗其營尼瑪哈跣足走免攻城益急凡三十三日乙未城遂陷粹中被執不屈死烏珠又入開德府守臣王棣死之以太學生建安魏行可充金國軍前通問使假禮部侍郎以行金人知其應募借官待之甚薄因留不遣行可遺金人書警以不戢自焚之禍且曰大國將舉中原與劉豫劉氏何德趙氏何罪若亟以還趙氏賢於奉劉氏萬萬也竟卒於金贈朝奉郎祕閣修撰庚子詣夀寧寺朝享祖宗神主壬寅祀昊天上帝於圜丘大赦時鹵簿樂舞之類率多未備嚴更警場就取軍中金鼓權一時之用金烏珠入相州守臣趙不試死之不試太宗六世孫也州久被圍不試知事不可為既啓門乃納其家井中然後以身赴井甲辰金人陷德州兵馬都監趙叔皎死之是月濵州賊蓋進陷棣州守臣姜剛之死之金人攻晉寧軍知軍事徐徽言拒却之知府州折可求叛降金先是徽言隂結汾晉土豪約以復故地則奏官為守長聽其世襲會朝論與金結和抑其所請金人忌徽言欲速拔晉寧以除其患既破延安遂自綏德渡河圍之三月徽言屢却之至是徽言約可求出兵夾攻羅索聞之執可求之子彥文使為書招可求可求遂以所屬麟府豐三州降金可求故與徽言連姻金人使招徽言於城下徽言引弓射之可求走徽言引兵擊敵大敗之斬羅索之子金人陷淄州史斌圍興元不克引兵趨關中義兵統領張宗誘斌還長安欲徐圗之曲端怒宗遣都監吳玠襲斬斌而自襲宗殺之嶽飛與金人戰胙城又戰黑龍潭皆大捷飛從閻勍保護陵寢大戰泛水關射殪金將大破其衆駐兵竹蘆渡與敵相持選精鋭三百伏前山下令各以薪芻交縛兩束夜半爇四端而舉之金人疑援兵至驚潰趙開善心計好詗問天下利病每有通變救弊之志宣和末為成都轉運判官多所更革至是陳𣙜茶買馬五害朝議是之即擢開都大提舉川陜茶馬事使推行之開乃罷官買賣茶給引通商與茶户自相貿易不二年茶引收息至百七十餘萬緡買馬踰二萬匹十二月乙卯太后至杭州扈從統制苗傅以其軍八千人駐奉國寺庚申金人攻東平府京西路制置使權邦彥棄城去又攻濟南府劉豫遣子麟禦却之達蘭遣人啖以利豫懷前忿遂殺濟南驍將關勝率百姓降金百姓不從豫縋城納欵甲子金鄂爾多攻大名府守臣張益謙欲遁提㸃刑獄郭永曰北門所以遮梁宋敵得志則朝廷危矣因自率兵晝夜乘城且縋死士告急於行在會大霧四塞城遂陷益謙與轉運判官裴億迎降鄂爾多問曰城破乃降何也二人以永不從為辭鄂爾多遣騎召永永正衣冠南向再拜訖易幅巾而入鄂爾多問沮降者誰永曰不降者我鄂爾多以富貴啖之永大罵曰恨不醢爾以報國何說降乎鄂爾多怒並其家屬皆殺之永大名元城人少剛明勇決身長七尺鬚髯若神常知太谷縣縣有潭出雲雨嵗旱巫乘此譁民永杖巫身暴日中雨立至部使者及郡文移有不便於民者必條利病反復或遂寢不行燕山兵起以永為轉運判官郭藥師恃恩肆暴永力折之藥師雖謝無愧容永退謂安撫使王安中曰他日亂邊者必此人也移河北西路提舉常平金人南下㑹天寒城池皆凍金人率藉冰梯城不攻而入永在大名弛濠梁之禁人爭取魚冰不能合金人至城下睥睨久之而去至是遇害雖素不與永合者皆哭之至慟永見古人立名節者慨然慕之靖康時聞兩宫北狩號絶仆地家人舁歸不食者數日聞大元帥檄書至始勉強一餐其忠義蓋天性然也紹興初贈資政殿學士諡勇節金尼瑪哈入襲慶府軍士有欲發孔子墓者尼瑪哈問其通事髙慶裔曰孔子何人曰古之大聖人尼瑪哈曰大聖人墓安可發遂殺軍士乙丑金人陷虢州丙寅始命修國史己巳以黃潛善為尚書左僕射兼門下侍郎汪伯彥為尚書右僕射兼中書侍郎顔岐為門下侍郎朱勝非為中書侍郎兵部尚書盧益簽書樞密院事潛善伯彥入謝帝曰潛善作左相伯彥作右相朕何患國事不濟時金兵橫行山東羣盜蜂起潛善等既無謀略專權自恣東京委之御史南京委之留臺泗州委之郡守言事者不納其說請兵者不以上聞金兵日南乃以為李成餘黨無足慮者惟率同列聽浮屠說法而已時户部尚書葉夢得嘗請帝南巡阻江為險以備不虞帝曰自揚至瓜洲五十里聞警而動未晚夢得曰運河僅通一舟恐非一日可濟也後乞命重臣為宣總使一居泗上總兩淮及東方之師以待敵一居金陵總兩浙之路以備退保不報帝一日召諸軍議事帶御器械張俊奏敵勢方張宜且南渡俟國勢定圗之復請移左藏庫於鎮江吏部侍郎劉珏亦言備敵之計兵食為先今以降冦為見兵以糴本為見糧二者無一可恃維揚城池未修軍旅多闕卒有不虞何以待之潛善等終不以為然辛未金人寇青州戊寅以禮部侍郎張浚兼御營參贊軍事教習長兵是冬東京留守杜充決黃河自泗入淮以阻金兵是嵗召潘良貴為左司諫既見請誅僞黨使叛命者受刃國門即敵人不敢輕議宋鼎又乞封宗室賢者於山東河北以壯國體巡幸維揚飬兵威以圗恢復大為黃汪所忌左遷工部良貴求去主管明道宫三年春五月庚辰朔帝在揚州河北制置使王彥以所部兵馬付東京留守司而率親兵趨行在見黃潛善汪伯彥力陳兩河忠義延頸以望王師願因人心大舉北伐言辭憤激二人大怒遂請降旨免對差充御營平寇統領彥遂稱疾致仕京西賊貴仲正陷嶽州甲申以資政殿學士路允迪簽書樞密院事丁亥金人焚青州西去京東安撫使劉洪道入城守之辛卯陜州都統邵興及金人戰於潼關敗之復虢州甲午金以南京留守韓企先同中書門下平章事知樞密院事企先柳城人初太祖定燕京始用漢官宰相賞左企弓等置中書省樞密院於廣寧府而朝廷宰相亦自用女真官號天會初無所更改及張敦固伏誅移置中書樞密於平州蔡靖以燕山降移置燕京凡漢地選授調發租稅皆承制行之故自時立愛劉彥宗及企先輩官為宰相其職大抵如此乙未杜充遣嶽飛桑仲討叛將張用於城南其徒王善救之官軍敗績庚子張用王善寇淮寧府守臣馮長寧却之詔百官聞警輒遣家屬避兵者徒二年因而動搖人情者流二千里金尼瑪哈圍徐州知州王復與子倚率軍民力戰外援不至丙午城陷復謂尼瑪哈曰死守者我也願殺我而舍僚吏百姓尼瑪哈欲降之復嫚罵求死闔門百口皆被殺州教授鄭褒罵敵與巡檢楊彭年並死焉御營平寇左將軍韓世忠屯淮陽會山東兵以援濮州尼瑪哈聞之分兵萬人趨揚州自率大軍迎戰世忠以衆寡不敵夜引還尼瑪哈躡之至沭陽世忠棄軍走鹽城衆遂潰部將張遇戰死尼瑪哈入淮陽以騎兵三千取彭城間道趨淮東戊申入泗州二月庚戌朔聽士民從便避兵劉正彥部兵衛皇子六宫如杭州金尼瑪哈至楚州守臣朱琳降辛亥入天長軍江淮制置使劉光世率衆迎敵未至而潰光世奔還辛亥金人陷天長軍壬子內侍鄺詢報金兵至帝即被甲上馬馳至瓜洲步得小舟渡江惟護聖軍卒數人及王淵張俊內侍康履等從行日暮至鎮江府黃潛善汪伯彥方會食堂吏大呼曰駕已行矣二人相顧倉皇戎服䇿馬南馳居民爭門而出死者相枕藉無不怨憤司農卿黃鍔至江上軍士以為黃潛善罵曰誤國誤民皆汝之罪鍔方置辨而首已斷矣初右諌議大夫建安鄭㲄纍章請移蹕建康宰執沮之至是㲄扈從帝曰不用卿言至此金將馬五帥五百騎先馳至揚州城下聞帝已南行追至揚子橋癸丑游騎至瓜洲太常少卿季陵亟取九廟神主以行為金人所追亡太祖神主於道帝召從臣問去留吏部尚書吕頥浩乞留蹕以為江北聲援羣臣皆以為然王淵獨言鎮江止可捍一面若金人自通州渡江以據姑蘇將若之何不如錢塘有重江之險帝意遂決留朱勝非守鎮江府以吕頥浩為江淮制置使劉光世充行在五軍制置使駐鎮江控扼江口又以楊惟忠節制江東軍馬駐江寧府是夕發鎮江次吕城鎮金人陷真州甲寅帝次常州羣盜丁進等雖已受招而縱兵掠民至是欲走山東朱勝非至丹陽都統制王淵遣使臣張青領五十騎馳護勝非因令青圍進青以白勝非勝非曰丁進不除必為巨盜聞渠有數百人爾五十騎可敵否青曰不足畏於是以檄誘進至勝非所而誅之其衆惕息聽命丙辰帝次平江府丁巳金人攻泰州守臣曾班以城降戊午帝次吳江縣命朱勝非節制平江府秀州軍馬禮部侍郎張浚副之留王淵守平江用朱勝非計詔録用張邦昌親屬遣閣門祗候劉俊民使金軍仍命俊民持邦昌遺金人約和書藁以行金人陷滄州守臣劉錫棄城走己未帝次秀州庚申次崇德縣時吕頥浩從行即拜同簽書樞密院事江淮兩浙制置使以兵二千還屯京口又命御營中軍統制張俊以兵八千守吳江壬戌帝駐蹕杭州即州治為行宫金羅索破晉寧軍守臣徐徽言悉焚其炮機篦格一切守具曰無以遺敵據子城拒戰置妻子室中積薪自焚被擒使之拜不拜臨之以兵不動命折可求諭使降徽言大罵羅索射殺之既死僵立不仆統制孫昻及士卒皆不屈被害事聞贈徽言晉州觀察使諡忠壯徽言衢州西安人少為諸生負氣豪邁至是與子岡同死昻父翊宣和末知朔寧府救太原死之世著忠義癸亥下詔罪已求直言令有司具舟常潤迎濟衣冠軍民家屬省儀物膳羞出宫人之無職掌者乙丑降德音赦雜犯死罪以下囚放還士大夫被竄斥者惟李綱罪不赦更不放還蓋用黃潛善計罪綱以謝金也和州防禦使馬擴應詔上書言前日之事其誤有四其失有六今願陛下西幸巴蜀用陜右之兵留重臣使鎮江南撫淮甸破金人之計回天下之心是為上䇿都守武昌襟帶荆湖控引川廣招集義兵屯布上流扼據形勢密約河南諸路豪傑許以得地世守是為中策駐蹕金陵備禦江口通逹漕運精習水軍厚激將士以幸一勝觀敵事勢預備遷徙是為下策若倚長江為可恃幸金人之不來猶豫遷延候至秋冬敵兵再舉驅掠舟楫江淮千里數道並進方當此時然後又悔是為無䇿擴纍數千言皆切事機戊辰金人焚揚州而去士民皆死存者才數千人黃潛善汪伯彥自知不為衆所容聫疏求退中丞張􅊹論其大罪二十致陛下蒙塵天下怨懟乞加罪斥己巳罷潛善知江寧府伯彥知洪州尋落職二人嫉害忠良逐李綱沮宗澤殺陳東歐陽徹臺諫內侍言者隨陷以竒禍中外為之切齒以户部尚書葉夢得為尚書左丞御史中丞張澄為尚書右丞辛未金人逼髙郵軍守臣趙士瑗棄城走壬申吕頥浩遣將陳彥渡江襲金餘兵復揚州癸酉靳賽犯通州韓世忠小校李在叛據髙郵甲戌金詔禁醫巫閭山遼代山林樵採乙亥詔朱勝非赴行在留張浚駐平江贈陳東歐陽徹承事郎官有服親屬一人恤其家贈馬伸諫議大夫直龍圖閣學士丙子詔士民直言時政得失是月張用據確山號張莽蕩三月己卯朔日中有黑子庚辰以朱勝非為尚書右僕射兼中書侍郎故事命相進官三等勝非特進五官辛巳尚書左丞葉夢得罷以盧益為左丞未拜復罷為資政殿學士以御營都統制王淵同簽書樞密院事舊制簽書必帶檢校官故治平中郭逵以檢校太保為之而淵以節制直除非制也先是帝渡江劉光世見帝泣曰王淵專管江上海船每言緩急不誤今臣所部竒兵數萬二千餘騎皆不能濟淵忿其言斬江北都巡檢使皇甫佐以自解朱勝非馳見淵督之淵始悔然已無及遂失諸將心至是簽書制下諸將口語藉藉朱勝非言臣記武臣作樞有免進呈書押故事臣欲用故事免之仍罷其兼官以弭衆論帝然之壬午詔淵免進呈書押本院文字以尚書右僕射吕頤浩為江南東路安撫制置使知江寧府扈從統制苖傅自負世將以王淵驟得君遷顯職心忿不平劉正彥以招降劇盜功大賞薄懷怨二人因相結時內侍康履藍圭恃恩用事履尤妄作威福陵忽諸將諸將疾之會內侍臨浙觀潮供帳遮道傅等怒曰汝輩使天子顛沛至此猶敢爾邪中大夫王世修亦疾內侍恣橫言於正彥正彥曰會當共除之王淵入樞府傅等疑其由內侍以進愈不平遂與世修謀先斬淵然後殺宦者癸未值劉光世進殿前都指揮使百官入聽宣制傅正彥令世修伏兵城北橋下俟淵退朝即捽下馬誣以結宦者謀反正彥手斬淵即與傅擁兵至行宫門外梟淵首於行闕分捕內侍百餘人皆殺之履馳入宫白帝帝大驚朱勝非急趨樓上詰傅等擅殺之故中軍統制吳湛排門引傅黨入奏曰傅等不負國家為天下除害耳知杭州康允之見事急請帝御樓撫諭之日將午帝登樓百官皆從苗傅等望見黃蓋猶山呼而拜帝憑欄呼傅等問故傅厲聲對曰陛下信任中官賞罰不公軍士有功者不賞私內侍者即得美官黃潛善汪伯彥誤國至此猶未逺竄王淵遇賊不戰首先渡江因交康履得除樞密臣自陛下即位以來功多賞薄臣已將王淵斬首中官在外者皆誅訖更乞康履曽擇殺之以謝三軍帝曰潛善伯彥已降黜履擇當流海島卿等可歸營傅曰天下生靈無辜肝腦塗地止緣中官擅權若不斬履擇臣不回營帝猶未許逾時傅兵不退浙西安撫司主管機宜文字時希孟軍器監葉宗諤勸帝並誅康履帝不得已命湛執履與之傅即樓下腰斬履臠其肉梟首與淵首相望帝遂以傅為慶遠軍承宣使御營司都統制正彥為渭州觀察使副都統制諭傅等歸營傅等進曰陛下不當居大位將來淵聖皇帝來歸未知何以處之帝命朱勝非縋樓下委曲諭之傅請隆祐太后同聽政及遣人使金議和帝許之即下詔請隆祐太后垂簾傅等聞詔不拜曰自有皇太子可立况道君皇帝已有故事勝非還白帝帝曰朕當退位但須太后手詔乃遣顏岐請太后御樓太后至帝立楹側從官請帝坐帝曰不當坐此矣太后因乘肩輿下樓出門見傅等諭之曰自道君皇帝任蔡京王黼更祖宗法度童貫起邊事所以致金人之禍豈關今上皇帝事况皇帝初無失德止為黃潛善汪伯彥所誤今已竄逐統制豈不知之傅等對曰臣等必欲太后為天下主奉皇子為帝太后曰今强敵在前吾以一婦人抱三歲兒決事何以令天下敵國聞之豈不轉加輕侮傅等固請太后曉譬百端傅等不從太后顧勝非曰今日政須大臣果決相公可無一言乎勝非還白帝曰傅等腹心有王鈞甫者適語臣云二將忠有餘而學不足此語可為後圗之緒帝乃即坐上作詔禪位於皇太子請太后同聽政宣詔畢傅等麾其軍退於是皇子魏國公敷即皇帝位太后垂簾决事是夕帝移御顯寧寺甲申尊帝為睿聖仁孝皇帝以顯寧寺為睿聖宫大赦以張澄兼中書侍郎韓世忠為御營司提舉一行事務張俊為秦鳯副總管分其衆𨽻諸軍丁亥分竄內侍藍圭曽擇等於嶺南諸州擇已行傅追還殺之戊子以端明殿學士王孝迪為中書侍郎資政殿學士盧益為尚書左丞己丑改元明受時苗傅等乞改年號及移蹕建康勝非以二事奏太后曰二事中惟年號稍輕若全然不從恐别生事乃下詔改元勝非又曰反正事已就緒惟二凶謂元請本為和戎須待遣使然敵兵近在江北若遣使敵知朝廷有變必挾此而來以持其事即害反正當召應使者來使之力辭先所遣使亦密留於勤王所矣必破其謀可無憂也張浚奏乞睿聖皇帝親總要務庚寅百官始朝睿聖宫以苗傅為武當軍節度使劉正彥為武成軍節度使詔劉光世范瓊楊惟忠張浚及吕頥浩並赴行在傅等以御營中軍統制吳湛主管步軍事黃潛善汪伯彥並分司衡永州居住以王孝迪盧益為大金國信使進士黃大本吳時敏為先期告請使朱勝非奏母后垂簾須二人同對此承平故事今日事機須密奏者乞許臣寮獨對而日引傅黨二人上殿以弭其疑太后語帝曰賴相此人若黃汪在位事已狼籍矣傅等欲挾帝幸徽越勝非諭之以禍福乃止赦書至平江張浚度事不可宣而已章灼卒徒急於望賜懼有變乃屏僞詔而隂取故府所藏登極赦書置輿中迎登譙門讀而張之即去其階禁無敢輒登者而散給金帛如郊賚時人情略定既而得苗傅等所傳檄浚痛哭召守臣湯東野及提刑趙哲謀起兵討之時傅令張俊以三百人赴秦鳯而以餘兵屬他將俊知其僞拒不受軍士洶洶俊諭之曰當詣張侍郎決之即引所部八千人至平江浚語之故相持而泣且諭俊以決策起兵問罪俊泣拜曰此須侍郎濟以機術無驚動乘輿也赦書至江寧吕頥浩曰是必有兵變其子抗曰主上春秋鼎盛二帝蒙塵沙漠其肯遜位於幼沖乎灼知兵變無疑也即遣人寓書於浚會御史中丞鄭㲄遣所親謝嚮微服如平江見浚等具言城中事以為嚴設兵備大張聲勢持重緩進使賊自遁無驚動三宫此上策也又作杜鵑詩諭百官當迎乘輿反正之意浚以頥浩有威望能斷大事乃答書約共起兵且告劉光世於鎮江令以兵來會頥浩得浚書因上疏請睿聖復辟幸金陵以圗舊疆金人陷鄜州癸巳張浚命節制司參議官辛道宗措置海舶又念傅等居中欲得辨士往說之遣布衣馮轓持書說傅正彥轓至杭見傅等折以大義令早反正正彥遣轓約浚至杭浚命張俊分兵扼吳江上疏請睿聖復辟傅等謀除浚禮部尚書命將所部詣行在浚以大兵未集未敢誦言討賊托云張俊驟回人情震讋少留以撫其軍甲午吕頥浩率勤王兵萬人發江寧乙未劉光世部兵會頥浩於丹陽貶黃潛善英州安置韓世忠自鹽城收散卒由海道將赴行在至常熟張俊聞之曰世忠來事濟矣因白浚以書招之世忠得書以酒酹地曰誓不與此賊共戴天丙申至平江見浚慟哭曰今日之事世忠願與張俊任之公無憂也浚因大犒俊及世忠將士衆皆感憤於是令世忠率兵赴闕戒之曰投鼠忌器事不可急急則恐有他變宜趨秀州據糧道以俟大軍之集世忠發平江至秀州稱病不行而大修戰具傅等聞之始懼欲拘世忠妻子以為質朱勝非紿傅曰不若使迓世忠而慰撫之則平江諸人益安矣傅從之乃白太后封世忠妻梁氏為安國夫人俾迓世忠梁氏疾驅出城一日夜會世忠於秀州勝非喜曰二凶真無能為也先是二凶與浚書言伊周之事非侍郎孰當之朝廷見以右丞相待浚報書曰自古言涉不順謂之指斥乘輿事涉不遜謂之震驚宫闕廢立之事謂之大逆不道大逆不道者族今建炎皇帝不聞失德一旦遜位豈所宜聞二凶得書與其屬俱詣都堂言浚見詆為逆賊所不能堪如吕樞密則曉事勝非曰罷張而以兵權付吕無事矣辛巳責浚散官彬州安置制詞有輕脫寡謀之語時有小黃門密趨睿聖宫傳太后之命曰張浚不得已貶彬州帝方啜羮不覺羮覆於手辛丑二凶以韓世忠為定國軍節度使張俊為武寧軍節度使知鳯翔府皆不受時明受詔至世忠曰吾知有建炎不知有明受斬其使取詔焚之二凶大懼乃遣苗瑀馬柔吉將重兵扼臨平拒勤王兵壬寅日中黑子沒吕頥浩將至平江張浚乘輕舟迓之於郵中得堂帖乃貶彬州之命浚恐將士觀望即袖之語書吏云有旨趨赴行在令申巳發之日是夜共宿城外咨以大計頥浩曰曩諫開邊幾死宦官之手承乏漕挽幾陷沙漠之域今事不諧不過赤族為社稷死豈不快乎遂呼其屬删定官李承造草檄文浚為潤色之既而劉光世兵亦至金詔軍興以來良人被略為奴者聽其父母夫妻子贖之癸卯吕頥浩張浚傳檄中外聲苗傅劉正彥之罪以韓世忠為前軍張俊翼之劉光世為遊擊頥浩浚總中軍光世分兵殿後討之執黃大本下獄乙巳太后降旨睿聖皇帝處分兵馬重事丙午以禮部侍郎張浚同知樞密院事翰林學士李邴御史中丞鄭瑴並同簽書樞密院事是日浚及吕頥浩發平江丁未次吳江上疏乞建炎皇帝還即尊位二凶聞之憂懼不知所為朱勝非召二凶至都堂議復辟曰勤王之師未進者使此間自反正耳不然下詔率百官六軍請上還宫公等置身何地於是召李邴張守作百官章及太后手詔賜傅正彥鐵劵傅等遂率百官朝於睿聖宫帝慰勞之二凶以手加額曰聖天子度量如是傅黨張逵曰趙氏安苗氏危矣是月盜邵青掠泗州青本五丈河舟人去為盜聚兵剽掠楚泗間金人掠京東諸郡劉道洪棄青州去達蘭以劉豫知東平府金界舊河以南俾豫統之又以豫子麟知濟南府鄂爾多還屯濵州尼瑪哈歸至東平命達蘭屯兵衝要以鎮撫之賊王善曹成孔彥舟等合衆五十萬薄南薰門嶽飛所部僅八百衆懼不敵飛曰吾為諸君破之左挾弓右運矛橫衝其陳賊亂大敗之初金人破徐州王復死之都虞候趙立死而復蘇求復尸瘞之隂結鄉民為收復計及金師北去乃帥殘兵邀擊大敗之遂復徐州事聞詔以立權知州事時山東諸郡莽為盜區立介居其間威名流聞資治通鑑後編卷一百六
