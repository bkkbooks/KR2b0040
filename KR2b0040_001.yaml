body:
  text: 資治通鑑後編卷一刑部尚書徐乾學撰宋紀一起上章涒灘正月盡十二月凡一年太祖啓運立極英武睿文神德聖功至明大孝皇帝諱匡胤姓趙氏涿郡人四世祖朓唐幽都令生珽唐御史中丞誔生敬涿州刺史敬生𢎞殷周檢校司徒馬軍都指揮使𢎞殷娶杜氏生匡胤於洛陽夾馬營赤光滿室營中異香經宿不散人謂之香孩兒營及長容貌雄偉器度豁如識者知非常人初應募居周祖帳下世宗嘗閲文書得韋囊中有木三尺餘題云點檢作天子時張永德為殿前都點檢世宗疑之乃命匡胤代焉及恭帝立加檢校太尉領歸德軍節度使建隆元年春正月辛丑朔鎮定二州言北漢引契丹入冦周帝命歸德軍節度使檢校太尉殿前都點檢趙匡胤領宿衛諸將禦之匡胤掌軍政六年士卒服其恩威數從世宗征伐洊立大功人望歸之至是王少國疑將士隂謀推戴壬寅殿前副都點檢鎮寧軍節度使太原慕容延釗將前軍先發癸卯大軍繼之軍中知星者河中苖訓見日下復有一日黑光摩蕩者久之指謂匡胤親吏楚昭輔曰此天命也是夕次陳橋驛將士相與聚謀曰主上幼弱我輩出死力破賊誰則知之不如先立點檢為天子然後北征都押衙李處耘具以其事白匡胤弟內殿祗候供奉官都知匡義考異案王稱東都事略陳桱通鑑續編作匡義薛氏王氏皆同惟李燾續通鑑長編楊仲良皇朝通鑑紀事本末作匡乂宋史太宗本紀亦云初名匡乂今姑從匡義及歸德節度掌書記薊人趙普普初見顯德三年二月語未竟諸將露刃突入大言曰軍中定議欲册太尉為天子匡義普同聲叱之曰䇿立大事也固宜審圖且外冦壓境盍先攘之諸將不可曰事變未可知但當亟入京城䇿立太尉破賊不難也匡義因語諸將曰興王易姓雖云天命實繫人心汝等各能嚴飭軍士勿令剽劫都城人心安則四方自定汝等亦可共保富貴矣衆許諾乃共部分夜遣衙隊軍使郭延贇馳告殿前都指揮使石守信殿前都虞候王審琦審琦初見顯德三年守信審琦皆素歸心匡胤者將士環列待旦匡胤醉卧初不省甲辰遲明諸將擐甲執兵直叩寢門曰諸軍無主願䇿太尉為天子匡胤驚起未及應即被以黃袍羅拜呼萬嵗掖乘馬南行匡胤度不得免乃攬轡誓諸將曰汝等自貪冨貴立我為天子能從吾命則可不然不能為若主也衆下馬曰唯命匡胤曰太后主上吾皆北面事之不得驚犯大臣皆我比肩不得侵凌朝廷府庫及士庶家不得攘掠用命有厚賞違不汝貰也皆應曰諾乃整軍自仁和門入秋毫無犯市不易肆乙巳入汴先遣客省使大名潘美見執政諭意又遣楚昭輔慰安家人時宰相方就食閣中聞變范質質宗城人初見開運元年執王溥溥榆次人初見乾祐二年手曰倉卒遣將吾輩之罪也爪入溥手幾出血溥噤不能對侍衛馬步軍副都指揮使太原韓通通初見顯德元年自內庭惶遽奔歸將率衆備禦散員都指揮使王彥升彥升初見顯德三年遇通於路躍馬逐之馳入其第殺通及其妻子考異蘇轍龍川别志言韓通以親衛戰闕下敗死按通倉卒被殺未嘗交鋒今從續通鑑長編諸將翼匡胤登明德門匡胤令甲士還營退歸公署釋黃袍有頃諸將擁范質等至匡胤嗚咽流涕曰吾受世宗厚恩為六軍所迫一旦至此慙負天地將若之何質等未及對列校羅彥瓌按劔厲聲曰我輩無主今日須得天子質等相顧不知所為王溥降階先拜質不得已亦拜考異司馬光記聞云質頗誚讓太祖王稱東都事略范質傳既見太祖質曰先帝養太尉如子今身未冷奈何陳桱通鑑續編云范質以義讓匡胤薛應旗宋元通鑑亦載質讓匡胤曰先帝養大尉如子今骨肉未寒而太尉若此奈先帝何按王溥降階拜質亦從之拜安肯侃侃以大義責宋祖乎長編及宋史並無此語今不取質曰古有禪讓之禮今可行也因具陳之遂請匡胤詣崇元殿行禪代禮召文武百僚至晡班定翰林學士承旨新平陶穀穀初見乾祐元年袖中出周帝禪詔詔曰天生蒸民樹之司牧二帝惟公而禪位三王乘時而革命其揆一也豫末小子遭家不造人心已去天命有歸咨爾歸德軍節度使殿前都點檢趙匡胤稟上聖之姿有神武之略佐我高祖格于皇天逮事世宗功存納麓東征西怨厥績懋焉天地鬼神享於有德謳歌獄訟歸於至仁應天順人法堯禪舜如釋重負子其作賔嗚呼欽哉祗畏天命宣徽使引匡胤就龍墀北面拜受宋史及實録並無宣徽使姓名疑即咱居潤也宰相掖并崇元殿服衮冕即皇帝位羣臣拜賀奉周帝為鄭王符太后為周太后遷居西宫考異龍川别志言太祖脫甲詣政事堂范質見大祖首陳禪代議又東都事略范質傳質曰大尉既以禮受嬗則事太后如母養少主如子與飛龍記司馬光記聞朔記等所載都不同按太祖實歸府第將士即擁范質等至質等見太祖必不在政事堂其約束將士不得加無禮於太后少帝固先定于未入城時非緣質請也惟執王溥手出血及光所記質不肯先拜當得其實乙巳詔定有天下之號曰宋因所領節度州名也改元大赦內外馬步軍士等第優給命官分告天地社稷遣中使齎詔諭天下其諸道節度使别以詔賜焉華山隱士陳摶聞帝代周曰天下自此定矣蘇轍曰子觀漢高祖光武唐太宗及我太祖皇帝能一天下者四君皆以不嗜殺人致之其餘殺人愈多而天下愈亂秦晉及隋力能合之而好殺不已故或合而復分或遂以亡國焉戊申贈周韓通為中書令以禮葬之初通與帝同掌宿衛軍政多決於通通性剛愎衆情不附謂之韓瞪眼其子頗有智略見帝得人望勸通早為之所通不聽卒及於難帝怒王彥升專殺將斬以徇已而釋之然終身不授節鉞考異記聞云上初欲斬王彥升以初受命故不忍然終身廢之不用蓋誤也但不授節鉞耳賜唐主李景詔書辛亥論翊戴功以殿前都指揮使石守信為歸德節度使侍衛親軍馬步軍副都指揮使侍衛親軍馬軍都指揮使高懷德為義成節度使殿前副都點檢侍衛親軍步軍都指揮使張令鐸為鎮安節度使侍衛親軍馬步軍都虞候殿前都虞候王審琦為泰寧節度使殿前都指揮使虎捷左廂都指揮使張光翰為寧江節度使侍衛親軍馬軍都指揮使虎捷右廂都指揮使趙彥徽為武信節度使步軍都指揮使餘領軍者並進爵考異虎捷宋史作龍捷誤案玉海云國初張光翰虎捷左廂趙彥徽右廂都指揮使今從之癸丑放周顯德中江南降將周成等三十四人歸於唐乙卯遣使分賑諸州丁巳命宗正少卿郭玘祀周廟及嵩慶二陵因著令以時朝拜先是周侍衛馬步軍都虞候韓令坤令坤初見顯德二年領兵巡北邉慕容延釗復帥前軍至真定帝既受禪遣使諭延釗令坤各以便宜從事兩人皆聽命己未加延釗殿前都點檢昭化節度使同中書門下二品令坤侍衛馬步軍都指揮使天平節度使同平章事宰相表請以二月十六日為長春節帝生日也壬戌以趙普為右諫議大夫樞密直學士初上領宋鎮普為書記與節度判官劉熙古觀察判官吕餘慶攝推官沈義倫皆在幕府至是普以佐命功遷乃召熙古為左諫議大夫餘慶端明殿學士義倫戶部郎中癸亥以符彥卿守太師雄武節度使王景守太保封太原郡王定難節度使西平王李彛殷守太尉荆南節度使高保融守太傳餘領節鎮者並進爵甲子皇弟匡義加睦州防禦使賜名光義幸國子監立宗廟詔百官集議己巳兵部尚書張昭昭初見乾祐二年等上奏曰謹按堯舜禹皆立五廟蓋二昭二穆與其始祖也有商改國始立六廟蓋昭穆之外祀契與湯也周立七廟蓋親廟之外祀太祖及文王武王也漢初立廟悉不如禮魏晉始復七廟之制江左相承不改然七廟之中猶虛太祖之室隋文但立高曾祖禰四廟而已唐因隋制立四親廟梁氏而下不易其法稽古之道斯為折衷伏請追尊高曽祖禰四代號諡崇建廟室制可於是定宗廟之制嵗以四孟月及季冬凡五享朔望薦食薦新三年一祫以孟冬五年一禘以孟夏皆竇儀所定也朱熹曰太祖受命之初未遑他事首尊四祖之廟後或言太祖受命立極當為始祖而僖祖初無功德親盡當祧者臣深考其説而以人心之所安者揆之則僖祖者太祖之高祖考雖歷世久逺功德無傳然四世之後篤生神孫應天順人以寧兆庶蓋不必親為之然後為盛也鎮州郭崇報契丹北漢軍皆遁唐主景遣使誅鍾謨於饒州詰之曰卿與孫晟同使北晟死而卿還何也謨頓首服罪縊殺之并誅張巒於宣州謨流饒州巒貶宣州副使去年十月事二月乙亥尊母南陽郡夫人杜氏為皇太后后安喜人治家嚴毅有法生五子匡濟匡胤光義光美匡贊匡濟匡贊早卒陳橋之變后聞之曰吾貌素有大志今果然及尊為皇太后帝拜於殿上羣臣稱賀太后愀然不樂左右進曰臣聞母以子貴今子為天子胡為不樂太后曰吾聞為君難天子置身兆庶之上若治得其道則此位誠尊茍或失馭求為匹夫不可得是吾所以憂也帝再拜曰謹受教加范質王溥魏仁浦等官上待周三相並以優禮質自司徒平章事昭文館大學士參知樞密院事加侍中溥自右僕射平章事監修國史參知樞密院事加司空仁浦自樞密使中書侍郎平章事集賢殿大學士加右僕射自唐以來三大館職皆宰臣兼之首相昭文次監修次集賢宋因焉質溥尋皆罷參知樞密又加樞密使吳延祚同二品以廷祚父名璋避平章故特加同二品舊制凡大政事必命宰臣坐議從容賜茶乃退唐迄五代猶遵此制及質等為相自以周朝舊臣內存形迹又憚帝英睿乃請每事具劄子進呈取旨帝從之由是坐論之禮遂廢己卯以天下兵馬都元帥吳越國王錢俶為天下兵馬大元帥丙戌長春節賜羣臣衣各一襲宰相率百官上壽賜宴相國寺中書舍人扈蒙權知貢舉庚寅奏進士合格者楊礪等十九人自是嵗以為常辛卯大宴於廣德殿凡誕節後擇日大宴自此始前鄉貢三傳孫蘭治左氏春秋聚徒教授其門人有被黜退者蘭乘醉突入貢院喧譁下吏案之壬辰蘭決杖配商州三月乙巳改天下郡縣之犯御名廟諱者丙辰唐主景遣使來賀登極南漢宦者陳延壽言於南漢主曰陛下所以得立由先帝盡殺羣弟故也南漢主以為然丁巳殺其弟桂王璇興日據司馬光朔記吳越王俶遣使來賀登極唐主景復遣使來賀長春節宿州火燔民廬舍萬餘區遣中使安撫之壬戌追尊祖考為皇帝妣為皇后諡高祖朓曰文獻廟號僖祖陵曰欽陵妣崔曰文懿曽祖珽曰惠元廟號順祖陵曰康陵妣桑曰惠明皇祖敬曰簡恭廟號翼祖陵曰定陵妣劉曰簡穆皇考𢎞殷曰昭武廟號宣祖陵曰安陵壬戌定國運受周木德因以火德王色尚赤臘用戌先是北漢誘代北諸部侵掠河西詔諸鎮會兵以禦之是月定難節度使李彛興言遣都將李彛玉進援麟州北漢引衆去彛興即彛殷也避宣祖諱改焉夏四月癸酉兼判太常寺竇儼請改周樂文舞崇德之舞為文德之舞武舞象成之舞為武功之舞改樂章十二順為十二安蓋取治世之音安以樂之義詔行之遼人入冦棣州刺史何繼筠追破其衆於固安獲馬四百匹帝加周昭義軍節度使太原李筠中書令筠初見天福十二年七月使者至潞州筠即欲拒命左右切諫乃延使者置酒張樂遽索周祖畫象懸廳壁涕泣不已賔佐惶懼告使者曰令公被酒失常幸毋怪北漢主鈞聞之乃以蠟書結筠同舉兵筠長子守節泣諫筠不聽帝手詔慰撫且召守節為皇城使筠遂遣守節入朝伺動靜帝迎謂曰太子汝何故來守節矍然頭擊地曰陛下何言此必有讒人間臣父也帝曰吾聞汝數諫汝父不聽故遣汝來欲吾殺汝耳歸語汝父我未為天子時任自為之既為天子獨不能小讓我耶守節馳歸告筠筠遂令幕府為檄數帝罪癸未執監軍周光遜等送北漢納欵求援又遣兵襲澤州殺刺史張福據其城從事閭邱仲卿説筠曰公孤軍舉事其勢甚危雖倚河東之援恐亦不得其力大梁兵甲精鋭難與爭鋒不如西下太行直抵懷孟塞虎牢據洛邑東向而聲大義於天下計之上也筠不能用丙戌昭義變聞樞密使吳延祚言於帝曰潞州巖險賊若固守未可以嵗月破然李筠素驕易無謀宜速引兵擊之戊子遣石守信高懷德率前軍進討帝敕守信等曰勿縱筠下太行急引兵扼其隘破之必矣考異石守信出軍續通鑑長編及宋史在戊子實録在癸巳戊子四月十九日癸巳二十四日今從其近者帝召三司使張美調兵食美初見顯德二年美言懷州刺史馬令琮度李筠必反日夜儲偫以待王師帝亟令授令琮團練使宰相范質曰大軍北伐藉令琮供億不可移他郡遂并懷州為團練以令琮充使焉富弼曰太祖賞功任人深得其術以令琮儲蓄待王師故有團練之命用賞其勞又以移别郡則他官未練其事遂升本州使名以授之恩寵如是之異其人得不盡力乎五月己亥朔日有食之帝降服出次百官各守其司庚子命宣徽南院使咱居潤居潤初見顯德元年赴澶州巡檢殿前都點檢鎮寧節度使慕容延釗彰德軍留後太原王全斌全斌初見天成元年官考異案宋史新編王全斌傳全斌未討筠之先至相州留後非節度使也宋史太祖本紀作彰德軍節度使非是今從長編率兵由東路與石守信高懷德會辛酉以洺州團練使博野郭進為本州防禦使兼西山巡檢備北漢也李筠請北漢主鈞舉軍南下已為前導鈞即日大閲傾國自將將出左僕射趙華諫曰李筠舉事輕易事必無成陛下掃境內赴之臣未見其可也鈞不聼行至太平驛筠身率官屬迎謁鈞封筠西平王贊拜不名坐宰相上筠見鈞儀衛寡弱內甚悔之又自言受周氏恩不忍負而北漢與周世仇鈞聞筠言亦不悅筠將還鈞遣宣徽使盧贊監其軍筠心益不平乃留其長子守節守上黨而自率衆三萬南出石守信等破之于長平又攻拔其大會寨甲辰詔奪筠官爵丙午幸宰相魏仁浦第視疾己酉西京作周六廟成遣光祿卿郭玘泰遷神主乙卯忠正節度使楊承信來設宴于廣政殿自是即以為例承信初見天福三年丁巳詔親征以樞密使吳延祚為東京留守知開封府吕餘慶副之皇弟光義為大內都點檢遣韓令坤率兵屯河陽己未帝發大梁壬戌次滎陽西京留守向拱拱初見廣順二年嘗改名訓勸帝濟河踰太行乘其未集而擊之稽留浹旬則其鋒益熾矣樞密直學士趙普亦言賊意國家新造未能出征若倍道兼行掩其不備可一戰而克帝納其言丁卯石守信高懷德破筠軍三萬餘衆於澤州南獲北漢河陽節度使范守圖殺盧贊筠遁入澤州嬰城自固是月永安節度使折德扆破北漢沙谷寨斬首五百級德扆從阮之子也考異實録在六月甲午據奏至日也宋史因之今從長編扆初見乾祐三年從阮初見開運二年六月己巳朔帝至澤州督軍攻城逾旬不下帝召控鶴左廂都指揮使馬全乂全乂初見廣順三年問計全乂請併力急攻遂率敢死士先登飛矢貫臂全乂拔鏃進戰帝親帥衛兵繼之辛巳克其城李筠赴火死獲北漢宰相衛融宋史作魏融誤甲申免澤州今年田租乙酉進次潞州丁亥筠子守節以城降赦之升單州為團練用守節為使是日帝入潞州宴從官於行宫辛卯大赦免附潞三十里今年田租録陳殁將校子孫丁夫給復三年筠性雖暴事母甚孝每怒將殺人母屏風後呼筠筠即趨至母曰聞將殺人可免乎為吾曹增福爾筠遽釋之北漢主鈞聞筠敗遁還晉陽謂趙華曰李筠無狀卒如卿言吾幸全師以歸但恨失衛融盧贊耳癸巳安國節度使李繼勳來朝乙未命為昭義節度使繼勳初見顯德三年丁酉帝發潞州秋七月戊申至京師初衛融被執帝詰融曰汝教劉鈞助李筠反何也融對曰犬吠非其主臣誠不忍負劉氏且云陛下縱不殺臣臣亦不為陛下用終當間道走河東爾帝怒命左右以鐡撾擊其首流血被面曳出將戮之融呼曰臣得死所矣帝曰忠臣也釋之以良藥敷其瘡因使致書北漢主求周光遜等約亦歸融太原北漢主不報辛亥以融為太府卿七月壬子幸宰相范質第視疾前司空趙國公李穀初歸洛陽李筠以穀周朝名相遺錢五十萬他物稱是穀受之及筠叛穀憂恚發病乙卯卒帝為廢朝一日贈侍中穀為人厚重剛毅雅善議論辭氣明暢尤能知人汲引寒士多至顯位戊午宴韓令坤等於禮賢講武殿賞平澤潞功也初成德節度使金城郭崇崇初見天福二年聞帝受禪追感周室恩遇時或涕泣監軍陳思誨陳思讓汾州人初見天福六年思誨其弟也密奏其狀且言常山近邊宜謹備之帝曰我素知崇篤於恩義此蓋有所激發耳遣使覘之崇憂悶失據觀察判官辛仲甫曰公首效誠節且軍民處置率循常度朝廷雖欲加罪何以為辭使者至但率官吏郊迎盡禮致恭淹留伺察當自辨明矣崇如其言使者歸奏崇無他考異東都事略宋史新編郭崇傳言崇方對賔屬坐池亭飲博城中晏然不言仲甫為崇籌畫事辛仲甫傳亦不言此事今從長編帝喜曰我固知崇不反也以咱居潤權知鎮州初以知州易方鎮也考異本傳及皇朝大事紀九朝備要皆載居潤權知鎮州而長編有郭崇入朝帝命為宣徽南院使權知鎮州疑有先後不應亦載是年七月內及考崇本傳並無此事則為居潤無疑也乙丑唐主景進白金賀平澤潞詔殿前侍衛二司各閲所掌兵簡其驍勇者升為上軍而命諸州長吏選所部兵送都下以補禁旅之闕又選強壯卒定為兵樣分送諸道召募教習俟其精練即送闕下由是獷悍之士皆𨽻禁籍矣又懲唐以來藩鎮之弊立更戌法分遣禁旅戌守邊城使往來道路以習勤苦均勞逸自是將不得專其兵而士卒不至於驕惰皆趙普之謀也八月戊辰朔御崇元殿設仗衛行入閣儀置待制候對官賜廊下食入閣唐制起于天寶明皇以無為守成詔晏朝喚仗百官從容至閣門入蓋唐前含元殿非至正大朝會不御次宣政殿謂之正衙每坐朝必立仗於正衙或御紫宸殿即喚正衙仗自宣政殿兩門入是謂東西上閣門故謂之入閣其後遂為常朝之儀五代以來既廢正衙立仗而入閣亦希濶不講至是復行之然御前殿非唐舊矣崇元殿即大慶殿前殿也待制候對者亦唐制也每正衙待制官兩員正衙退後又令六品以下於延英候對皆所以備顧問其後每入閣即有待制次對官後唐天成中廢至是亦復行之廊下食起唐貞觀其後常參官每日朝退賜食謂之廊飱唐末寖廢但於入閣起居日賜食今循其制庚午宴近臣於廣德殿江南吳越朝貢使皆預焉保義節度使袁彥聞禪代日夜繕甲治兵帝慮其為變命潘美往監其軍美單騎入城諭令朝覲彥即治裝上道帝喜謂左右曰潘美不殺袁彥成吾志矣丙子徙彥為彰信軍節度使以忠正節度使楊承信為護國軍節度使承信至河中或言其謀反帝遣作坊副使魏丕賜承信生辰禮物因察之還言承信無反狀承信因是獲沒於鎮忠武節度使張永德永德初見乾祐三年徙武勝節度使入覲從遊玉津園時帝將有事於北漢密訪䇿略永德曰太原兵少而悍加以契丹為援未可倉卒取也臣愚以為每嵗多設遊兵擾其田事仍發間使諜之先絶其援然後可圖帝曰善甲申立琅琊郡夫人王氏為皇后后華池人彰德節度使饒之女也饒初見天福十三年八月丙戌作新權衡頒天下禁私造者考異李燾日十九日本紀即云頒新量衡於天下按此但新造未頒也今從本志戊子以趙普為兵部侍郎充樞密副使帝之征澤潞也普請行帝笑曰普豈勝甲胄乎至是師還論功帝曰普宜在優等遂遷是職荆南節度使守太傅兼中書令南平貞懿王高保融寢疾以其子繼元弱未堪承嗣命其弟行軍司馬保朂總判內外軍馬事甲午日據曾顔渤海行年記保融卒保融性迂緩御軍治民皆無法高氏始衰乙未唐主景遣使來賀帝還京壬寅昭義節度使李繼勳焚北漢平遙縣丙午御崇元殿備禮册於四親廟己酉中書舍人趙行逢坐從征避難貶房州司戶參軍帝之親征澤潞也山程狹隘多石帝自取數石於馬上抱之羣臣六軍皆爭負石開道行逢憚涉險偽傷足留懷州不行及師還行逢當入直又稱疾請於私第草制帝怒下御史府劾其罪而黜之周檢校太尉淮南節度使滄人李重進重進初見廣順二年七月周太祖甥也始與帝俱事世宗分掌兵柄以帝英武心憚之恭帝嗣位重進出鎮揚州及帝受禪命韓令坤代重進重進請入朝帝賜詔止之重進愈不自安李筠舉兵澤潞重進遣其親吏翟守珣間行與筠相結守珣潛求見帝言重進隂懷異志帝厚賜守珣使説重進稍緩其謀無令二凶並作守珣歸勸重進未可輕發重進信之帝既平澤潞隨欲經略淮南徙重進為平盧節度使又遣六宅使陳思誨齎鐡劵往賜以慰安之考異陳思誨持鐵劵往賜舊録在庚戍新録在壬子今從舊録重進自以周室懿親恐不得全遂拘思誨治城繕兵遣人求援於唐唐主不敢納帝聞重進舉兵命石守信為揚州行營都部署兼知揚州行府事王審琦為副李處耘為都監宋延渥為都排陳使帥禁兵討之寧國軍節度使吳延福吳越王俶之舅也或告延福有異圖庚申俶遣內牙指揮使薛溫以兵圍其第收延福兄弟五人睦州刺史延遇恐懼自殺左右勸俶殺延福兄弟俶流涕曰先夫人之同氣也吾安忍置法但除名徙諸州卒全母氏之族延福初見廣順二年癸亥詔削奪李重進官爵詔文武常參官請病告過三日有司以名聞遣太醫診視是月吳越始𣙜酒酤考異吳越備史𣙜酤在建隆二年九月今從長編初李筠之叛遣使邀建雄節度使楊庭璋庭璋姊故周祖妃也帝疑其有異志命鄭州防禦使信都荆罕儒罕儒冀州人初見顯德六年十二月為晉州兵馬鈐轄使伺察之罕儒每入府中從者悉持刀劍欲圖庭璋庭璋開懷接納殊不設備罕儒亦不敢發會有詔召庭璋赴闕庭璋即日單車就道冬十月己巳徙庭璋為靜難節度使壬申河決棣州厭次縣又決滑州靈河縣乙酉晉州言兵馬鈐轄荆罕儒領千餘騎抵北漢汾州城下焚其草市而還夕次京土原北漢主遣大將郝貴超領萬衆來襲黎明及之罕儒遣都監閻彥進分兵以禦罕儒錦袍裹甲據胡牀饗士方割羊臂臑以食聞彥進小卻即上馬麾兵徑犯其鋒北漢人攢戈舂之罕儒墜馬被獲猶格鬬手殺十餘人乃遇害北漢主素畏其勇欲生致罕儒及聞其死求殺罕儒者戮之帝聞罕儒戰殁痛悼不已擢其子守勳為西京武德副使責將士不用命者黜二人斬二十九人罕儒輕財好施在泰州有煮鹽之利嵗入巨萬詔聽十收其八用猶不足家財入有籍出不問其數勇而善戰常欲削平太原志未果而及於敗人皆惜之富弼曰太祖朝邊將戰沒降黜别將誅戮翊兵威令如此將帥自然盡力今西邊用兵大將如劉平任福輩戰沒朝廷不罪親兵但加存恤軍法不振所以久而無功帝問趙普以揚州事宜普曰李重進守薛公之下䇿昧武侯之逺圖憑恃長淮繕修孤壘外絶救援內乏資糧宜速取之帝是其言丁亥下詔親征以光義為大內都部署吳延祚權東京留守吕餘慶副之庚寅帝發京師百司六軍並乘舟東下甲辰次泗州捨舟登陸命諸將鼓行而前丁未次揚州城下即日拔之初城將陷重進左右勸殺陳思誨重進曰吾今舉族將赴火死殺此何益即縱火自焚思誨亦為其黨所害帝入城戮同謀者數百人重進兄重興初聞其叛即自殺弟重贊及其子延福並戮於市己酉賑揚州城中民人米一斛十嵗以下半之脅𨽻為軍者賜衣屨遣還庚戍詔重進家屬部曲並釋罪翰林學士王著以酒失貶官帝謂宰相曰北門深嚴之地當使宿儒處之范質對曰竇儀清介重厚然已自翰林遷端明矣帝曰非斯人不可處禁中卿當諭以朕意勉令就職即日復入翰林帝嘗召儀草制至苑門儀見帝岸幘跣足坐卻立不進帝遽索冠帶而後召入儀曰陛下創業垂統宜以禮示天下帝斂容謝之自是對近臣未嘗不冠帶乙卯唐主景遣左僕射嚴續來犒師續初見開運三年庚申復遣其子蔣國公從鑑戶部尚書馮延魯延魯延巳弟初見天福八年來買宴考異續通鑑作置宴誤今從陸遊南唐書帝厲色謂延魯曰汝國主何故與吾叛臣交通延魯曰陛下徒知其交通不知預其反謀帝詰其故延魯曰重進使者館於臣家國主令人語之曰男子不得志固當反但時有可有不可陛下初立人心未安交兵上黨當是時不反今人心已定乃欲以揚州數千敝卒抗萬乘之師借使韓白復生必無成理雖有兵食不敢相資重進卒以失援而敗帝曰雖然諸將皆勸吾乘勝濟江何如延魯曰陛下神武御六師以臨小國蕞爾江南敢抗天威然國主侍衛數萬皆先主親兵誓同生死陛下能棄數萬之衆與之血戰則可矣且大江風濤不測茍進未克城退乏糧道亦大國之憂也帝笑曰聊戲卿耳豈聽卿遊説耶考異龍衮江南野録載延魯對帝語乃真以為如此拒重進不知乃飾説也又陳彭年江南别録云太祖笑曰吾與江南大義已明何至于此今從十國紀年帝使諸軍習戰於迎鑾唐主懼甚其小臣杜著薛良來奔且獻平南䇿帝惡其不忠命斬著良配𨽻廬州牙校唐主乃少安十二月己巳帝發揚州丁亥至京師辛卯唐清源節度使留從效稱藩從效初見開運三年帝初即位欲隂察羣情鄉背頗微行或以為諫帝笑曰帝王之興自有天命周世宗見諸將方面大耳者皆殺之我終日侍側不能害我既而微行愈數曰有天命者任自為之不汝禁也帝一日罷朝坐便殿不樂者久之左右請其故考異三聖寶録載內侍行首王繼恩請其故案繼恩開實中始賜姓名纍遷內侍行首建隆初未也今止稱左右帝曰爾謂天子容易耶屬乘快指揮一事而誤故不樂耳嘗彈雀於後苑或稱有急事請見帝亟見之其所奏乃常事耳帝怒詰之對曰臣以為尚急於彈雀帝愈怒舉斧柄撞其口墮兩齒其人徐拾齒置懷中帝罵曰汝懷齒欲訟我乎對曰臣不能訟陛下自當有史官書之帝悅賜金帛慰勞之遼宋王舍音謀反事覺辭連其父李胡遼主璟殺之於獄李胡太祖第三子也後追諡章肅皇帝初作受命寶鑄宋通元寶錢資治通鑑後編卷一
