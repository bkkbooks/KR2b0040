body:
  text: 資治通鑑後編卷三十四刑部尚書徐乾學撰宋紀起上章涒灘正月盡閏十二月凡一年真宗膺符稽古神功讓德文明武定章聖元孝皇帝天禧四年春正月乙丑以華州觀察使曹瑋為宣徽北院使鎮國軍留後僉署樞密院事僉署兼領藩鎮自瑋始也以使兼領自彬始丙寅開揚州運河丙子改諸路提點刑獄為勸農使副使兼提點刑獄公事詔所至視民籍差等有不如式者懲革之勸恤農民以時耕墾招集逃散檢括稻稅凡農田事悉領之仍各賜農田敕一部二月帝有疾不視朝癸未遣使安撫淮南江浙和州飢民丁亥户部員外郎兼太子右諭德魯宗道奏請自今羣臣除故枉法受贓外其因事計贓情可憫者並奏裁從之又請選人有罪合銓曹于刑部大理寺兩司中止問一處詔銓曹自今刑部大理寺定選人罪名不一即送審刑院速詳定以聞滑州言河塞詔奬之己亥翰林學士承旨朝迥致祭庚子羣臣詣崇德殿稱賀賜修河官吏使臣將士有差是役凡賦諸州薪石楗橛茭竹之數千六百萬用兵夫九萬人帝親製文刻碑以紀其功辛丑發唐鄧八州常平倉賑貧民戊辰改禎州為惠州癸酉詔川廣舉人勿拘定額乙亥以益梓州路物價翔踴命知制誥吕夷簡引進副使曹儀乘傳賑恤之夷簡等請所至勞問官吏將校仍取繫囚與長吏等原情從輕決遣民願出榖救飢民元詔第加酬奬望給空名告敕付臣往從之己卯左僕射兼中書侍郎平章事向敏中卒帝即時臨哭贈太尉中書令諡文簡五子洎諸壻並遷官敏中端厚愷悌歷踐中外曉民政善處繁劇纍在衡軸門無私謁諸子不令釐務謹於采拔不妄推薦居大位幾三十年時以重德目之夏四月兩月並見於西南翰林學士承旨朝迥纍表求解近職庚寅授工部尚書集賢院學士判西京留司御史臺許一子官河南以就養命工部侍郎楊億為翰林學士大中祥符末億自汝州代還久之不遷或問王旦曰楊大年何不且與舊職旦曰大年頃以輕去上左右人言可畏賴上終始保全之今此職欲出自清衷以全君臣之契也踰六年乃復入禁署分江南轉運使為東西兩路從户部判官滕涉之請以便按巡也丁亥大風晝晦丙申杖殺前定陶縣尉麻士瑶於青州黥配其親屬家僮有差籍其家初士瑶祖希夢事劉銖為府掾專以掊克聚斂為己任兼并恣橫用致巨富至士瑶益豪縱郡境畏之過於官府士瑶素帷簿不修又私蓄天文禁書兵器殺人為姦雖鎮將縣官多被毆刺先是侍御史薑遵風聞士瑶幽殺其姪溫裕奏遣監察御史章頻往鞫之於是併得他罪故悉加誅罰焉考異國史載麻希夢事蓋因王皥百一編也司馬光記聞景德初契丹冦澶淵遊兵至臨淄麻氏率莊人千餘據堡自守鄉里賴之全濟者甚衆至今基迹尚存謂之麻氏寨冦退麻氏斂器械盡輸官留什二三以衛其家鄉里賴麻氏以全濟此事當考或可增修然光載薑遵為轉運使欲因此以立威名則誤矣遵在仁宗時乃將漕京東今不取時青州幕僚胡順之實首發其事云順之嘗為浮梁縣令杖豪富臧氏之不輸租者自是其租常為一縣先又械杖本州職員教練官由是吏莫敢擾及在青州髙麗嘗入貢道出州境中貴人挾以為重使州官旅拜於郊順之獨不拜因上書論辨朝廷是之考異正史順之傳豪橫者乃休寧汪氏休寧屬歙州浮梁屬饒州今從司馬光記聞先是度支員外郎直集賢院膠水祁暐出知濰州母亡殯於州城之南暐既解官就殯所築小室號泣守護蔬食讀佛經者三載徒跣經冬足墮二指有白烏白兔馴擾墳側州人異之以狀聞己亥降詔旌美及其歸葬又賜粟帛令州長吏每月就所居存問初感德軍節度使知陜州王嗣宗以老病再表願入朝優詔召還以足疾不任朝謁復上表求再知許州宰相冦凖素惡其為人庚申特命以左屯衛上將軍致仕嗣宗歷事三朝最為宿舊所至以嚴明御下性傲狠務以醜言凌挫羣類家有恩讐簿已報者則勾之晚年交遊皆入讐簿為中丞日嘗忿宋白郭贄邢昺七十不請老屢言於帝請敕其休致又遣親屬諷激之及嗣宗晚嵗疾甚猶眷厚祿徘徊不去嘗謂人曰僕惟此一事未能免物議耳衆皆嗤焉然敦睦宗族待諸姪如己子臨終著遺戒以訓子孫毋得析居又令以孝經弓劍筆硯置壙中云六月丙申以右僕射兼中書侍郎平章事冦凖為太子太傅萊國公先是凖為樞密使曹利用副之凖素輕利用議事有不合者凖輒曰君一武夫耳豈解此國家大體耶利用由是銜之而丁謂以拂鬚故亦恨凖及同為樞密使遂合謀欲排凖翰林學士錢惟演見謂權盛附離之與講姻好而惟演女弟實為馬軍都虞候劉美妻時帝不豫艱於語言政事多中宫所決謂等交通詭祕其黨日固劉氏宗人橫於蜀奪民鹽井帝以皇后故欲舍其罪凖必請行法重失皇后意謂等因媒蘖之凖嘗獨請間曰皇太子人望所屬願陛下思宗廟之重傳以神器以固萬世基本丁謂佞人也不可以輔少主請擇方正大臣為羽翼帝然之考異正傳云丁謂錢惟演佞人也不可輔少主按此時惟演但為翰林學士不當便與丁謂同日而語附傳亦不載惟演恐正傳誤增也今不取張唐英仁宗政要又載凖言丁謂恃才挾姦曹利用恃權使氣恐唐英所載亦不得實利用恃權使氣當在太后垂簾時今猶未也陳繹拜罷録亦止稱丁謂凖密令翰林學士楊億草表請太子監國且欲援億以代謂億畏事泄夜屏左右為之辭至自起剪燭跋中外無知者既而凖被酒漏言考異億自起剪燭此據附傳今正傳削去龍川别志乃云億私語其妻弟張演曰數日之後事當一新語稍泄丁謂夜乘婦人車與曹利用謀之不知别志何所據然别志所稱立太子廢劉后則是凖罷相後周懷政之謀而億所草乃太子監國表耳雖附傳亦以謂微服過利用正在此時蓋誤也拜罷録與附傳同今正傳已改之附傳及拜罷録並云草制正傳但云草表今從正傳謂等益懼力譖凖請罷政事上不記與凖初有成言諾其請會日暮召知制誥晏殊入禁中示以除目殊曰臣掌外制此非臣職也乃召惟演須臾惟演至極論凖專恣請深責帝曰當與何官惟演請用王欽若例授凖太子太保帝曰與太傳又曰更與加優禮惟演請封國公出袖中具員册以進帝於小國中指萊字惟演曰如此則中書但有李迪恐須别命相帝曰姑徐之殊既誤召因言恐泄機事臣不敢復出遂宿於學士院及宣制則非殊疇昔所見者不知殊所見除目又何等也殊不以告人故亦莫得其詳云考異李燾曰仁宗實録冦凖附傳陳繹拜罷録司馬光記聞張唐英政要曽氏隆平集蘇氏龍川别志並誤以凖初罷相時事即周懷政所謀蓋不考其月日故也國史正傳已略正之但不詳耳今取錢惟演日記及江休復雜志附益之請太子監國凖奏也傳位太子廢皇后周懷政謀也凖以監國奏泄罷相以懷政謀泄逺貶二事初不同諸書見凖坐懷政絀即謂凖本謀如此其實謀出懷政凖未必知耳仁宗景祐元年四月以王曙言追諡楊億亦但云草奏請太子親政不云草制也龍川别志又云使億草詔書遣曙出使誅異己者曙藏去之億實不然今止從實録壬寅御試禮部奏名舉人九十三人秋七月丁巳太白晝見癸亥參知政事李迪兵部尚書馮拯翰林學士錢惟演對於滋福殿初冦凖罷帝欲相迪迪固辭於是又以屬迪有頃皇太子出拜帝前曰陛下用賔客為相敢以謝帝顧謂迪曰尚可辭耶是日惟演又力排冦凖曰凖自罷相轉更交結中外以求再用曉天文卜筮者皆遍召以至管軍臣僚陛下親信內侍無不著意恐小人朋黨誑惑聖聽不如早令出外帝曰有何名目惟演曰聞凖已具表乞河中府見中書未除宰相兼亦聞有人許以再用遂不進此表帝曰與河中府如何惟演乞召李迪諭旨因言中書宜早命宰相帝難其人惟演對若宰相未有人可且用三兩員參知政事帝曰參政亦難得人問今誰在李迪上惟演以曹利用丁謂任中正對帝默然惟演又言馮拯舊人性純和與冦凖不同帝亦默然既而曰張知白何如惟演言知白清介使參政則可恐未可為宰相帝頷之惟演又言冦凖朋黨盛王曙又其女壻作東宫賔客誰不畏懼今朝廷人三分二分皆附凖矣臣言出禍從然不敢不言惟陛下幸察帝曰卿勿憂惟演再拜而退後三日拯遂拜樞密使蓋用惟演之言也迪既除宰相而凖為太子太傅萊國公如故甲子大雨流潦泛溢公私廬舍大半有壓死者是月連雨而此夕為甚丙寅以參知政事李迪為吏部侍郎兼太子少傅平章事兵部尚書馮拯為樞密使吏部尚書同平章事是日告謝即賜襲衣金帶鞍勒馬正謝日亦如之非常比也先是馮拯以兵部尚書判都省帝欲加拯吏部尚書參知政事召學士楊億使草制億曰此舍人職也帝曰學士所職何官億曰若除樞密使同平章事則制書乃學士所當草也帝曰即以此命拯拯既受命樞密領使者凡三人前此未有人皆疑怪曹利用丁謂因各求罷帝徐覺其誤召知制誥晏殊語之將有所易置殊曰此非臣職也遂召錢惟演入對曰馮拯故參知政事今拜樞密使當矣但中書不應止用李迪一人盍任曹利用丁謂帝曰誰可惟演曰丁謂文臣任中書為便又言曹利用忠赤有功國家亦宜與平章事帝曰諾庚午以樞密使吏部尚書丁謂平章事樞密檢校太尉曹利用加同平章事皆用惟演所言考異此段參取錢氏及司馬氏日記修入晏殊誤召恐不至再當考馮拯自兵書加吏書必參政日記偶脫今追填之楊億所云此舍人職蓋參政制乃舍人所當草也然所以待冦凖者猶如故謂等懼甚謀益深是曰凖入對具奏謂及利用等交通蹤迹又言臣若有罪當與李迪同坐不應獨被斥帝即召迪至前質之兩人論辨良久帝意不樂迪再三目凖令退及俱退帝復召迪入對作色曰冦凖逺貶卿與丁謂曹利用並出外迪言謂及利用須學士降麻臣但乞一知州帝沉吟良久色漸解迪退復作文字呈進帝意遽釋乃更詔謂入對謂請除凖節鉞令出外帝不許甲戌昭宣使英州團練使入內副都知周懷政伏誅宋史真宗本紀作癸酉今從長編大中祥符末帝始得疾是嵗仲春初苦浸劇自疑不起嘗卧枕懷政股與之謀欲令太子監國懷政實典左右春坊事出告冦凖凖遂請間建議已而事泄凖罷相丁謂等因踈斥懷政使不得親近然以帝及太子故未即顯加黜責懷政憂懼不自安隂謀殺謂等復相凖奉帝為太上皇傳位太子廢皇后與其弟禮賔副使懷信謀潛召客省使楊崇勳內殿承制楊懷吉閣門祗候楊懷玊議其事期以二十五日竊發前一夕崇勳懷吉詣謂第告變謂中夜微服乘婦人車過曹利用計之及明利用入奏于崇政殿懷政時在殿東廡即令衛士執之考異李燾曰懷政本傳云上姑務含容不忍斥其過然漸踈逺懷政憂懼時使小黃門自禁中出詐稱宣召入內東門坐别室久之而還以欺同輩實録亦云然取懷政時實在崇政殿東廡則其出入禁中固自如也但丁謂等多為之防使懷政罕得見上耳帝未有踈逺懷政意也本傳又云上怒甚而實録無此疑本傳飾説今不取詔宣徽北院使曹瑋與崇勳就御藥院鞫訊不數刻具引伏帝坐承明殿臨問懷政但祈哀而已命載以車赴城西普安佛寺斬之謂等并發朱能所獻天書妖妄事亟遣入內供奉官盧守明鄧文慶馳驛詣永興軍捕能考異記聞載懷政以二月二日懷小刀對上自割上因是疾復作皇后命收懷政下獄并於宫中得萊公奏言傳位事乃命楊崇勳告變誅懷政貶萊公按懷政誅在七月萊公罷在六月若懷政於仲春為此則萊公必不待夏末始罷懷政至秋初乃誅也然真宗實以仲春疾益甚不知緣何事耳記聞必誤今不取懷政既誅有欲并責太子者帝意惑之李迪從容奏曰陛下有幾子乃欲為此計帝大悟由是東宫得不動搖丁丑太子太傅冦凖降授太常卿知相州翰林學士盛度樞密直學士王曙並罷職度知光州曙知汝州皆坐與周懷政交通而曙又凖壻也朝士與凖親厚者丁謂必斥之楊億尤善凖而請太子監國奏又億所草及凖敗丁謂召億至中書億懼便液俱下面無人色謂素重億無意害之徐曰謂當改官煩公為一好詞耳億乃稍安八月太子太保判杭州王欽若自以備位東宫請入朝甲申召之令乘傳赴京師徙知相州太常卿冦凖知安州初李迪與凖同在中書事之甚謹及凖罷丁謂意頗輕迪於是謂等不欲凖居內郡白帝欲逺徙之帝命與小州謂退而署紙尾曰奉聖旨除逺小處知州迪曰向者聖旨無逺字謂曰君面奉德音欲擅改聖旨以庇凖耶二人忿爭蓋自此始朱能聞使者至自度不免衷甲以出殺盧守明帥部兵挈家屬叛逸既而能衆潰入桑林自縊死乙酉以樞密副使任中正禮部侍郎王曽並參知政事翰林學士錢惟演為樞密副使辛卯以太常丞直龍圖閣馮元為左正言兼太子左諭德初太子為夀春郡王王旦薦元宜講經資善堂帝以元少更用崔遵度於是遵度卒乃命元代之壬寅太常卿知安州冦凖坐朱能叛再貶道州司馬詔辭云不務敦修密朋凶慝辱余輔弼玷乃搢紳仍以其事傳告諸州御史臺揭榜朝堂凖過零陵踰大坡護兵先後不屬溪洞蠻夷乘間抄掠其酋長聞而責之曰奈何奪賢宰相行李耶趣遣人還所掠其在道州晨具朝服如常時起樓置經史道釋書暇則誦讀賔至笑語若初無廊廟之貴者自凖罷相繼以三絀帝初不之知嵗餘帝忽問左右曰吾目中久不見冦凖何也左右亦莫敢對考異李燾曰此據司馬光記聞丁謂傳云周懷政敗議貶凖帝意欲謫凖江淮間謂退而除道州司馬獨王曽以帝語質之謂顧曰居停主人勿復言蓋指曽以第舍假凖也按居停之語在仁宗初再貶雷州時曽緣此遂謀去謂龍川别志當得之以聖旨質謂乃李迪其事見記聞今從之若此時曽已詰謂則當迪謂忿爭時曽亦必不助謂矣國史恐誤也徐度國紀天禧四年十二月癸丑對輔臣及王欽若于宣和門北閣子中上曰朕覺四體不康丁謂等奏近日聖躬稍安況中外無事乞寬聖心欽若奏今來中書密院公事甚好又出冦凖朝廷更無事矣上云除却冦凖後甚靜又問冦凖何在宰臣曰在道州上曰輕典馮拯曰如凖包藏禍心漢唐之法皆當族誅陛下蓋是寬貸上曰朕曲全之于是上色稍怡命坐賜茶而罷不知徐度何從得此恐必不然今附見當考吕中曰至是李文靖之言驗矣當君子用事之時則常有不盡絶小人之心至小人得志之時則其去君子必盡其力而後止此凖之所以重得貶也然凖雖可貶而凖之心則不為之少貶以右司諫判户部勾院劉燁為工部員外郎兼侍御史知雜事初河決滑州大興力役道殍相望燁請䇿免宰相以答天變時冦凖丁謂實在中書及王曙坐凖貶官在朝無敢往見者燁歎曰朋友之義獨不行於今日與往餞之經夕而還謂亦不罪也九月己酉以兵部員外郎知制誥吕夷簡為刑部郎中權知開封府夷簡為治嚴辨有聲帝識其姓名於屏風意將大用之也丙辰復御崇德殿視事帝自中春不豫止視事於長春殿至是體平始御前殿罷樞密副使周起為户部侍郎知青州僉署樞密院事曹瑋為宣徽南院使環慶路都部署兼管勾秦州兵馬起素善冦凖而瑋亦不附丁謂謂惡之并指為凖黨故俱罷出起性謹密凡奏事及答禁中所問隨輒焚草故其言外無知者丁卯赦天下繫囚除十惡己殺人官典犯贓盜官物持仗放火偽造符印外咸除之其周懷政朱能黨類除已行勘斷外餘咸許自新一切不問壬申賜京城酺太子太保王欽若自杭州來朝令入赴內殿起居甲戌給事中知河陽孫奭言父户部郎中致仕翌年九十按禮文九十者其家不從政令父母八十者許解官侍養望許退歸田里優詔不許冬十月戊寅朔中書門下言機務清簡請依唐制隻日視事雙日不坐從之壬午御正陽門觀酺皇太子侍坐凡五日帝自不豫罕復臨幸至是人情大悅己丑以前起居郎直史館陳堯佐知滑州時滑州方庀徒築隄堯佐創木龍以殺水怒隄乃可築既又作長隄以護之人號為陳公隄壬辰以太子太保王欽若為資政殿大學士仍令日赴資善堂侍皇太子講讀十一月乙卯令勸農使兼提點刑獄官自今以提點刑獄勸農使副為稱修尚書省命龍圖閣學士陳堯咨總其事庚申內出聖製七百二十二卷示輔臣壬戌宰臣丁謂等請鏤板宣布仍命禁中别創殿閣緘藏詔可尋於龍圖閣後修築是為天章閣又請令中書樞密院取時政記中盛美之事别為聖政録從之仍命錢惟演王曽編次乙丑對輔臣於承明殿帝曰朕邇來寢膳頗漸康復然軍國之事未免勞心今太子年德漸成皇后賢明臨事平允深可付託欲令太子蒞政於外皇后居中詳處卿等可議之輔臣請令中書樞密院大臣各兼東宫職任帝許之自冦凖貶斥丁謂浸擅權至除吏不以聞李迪憤悶嘗慨然語同列曰迪起布衣十餘年至宰相有以報國死且不恨安能附權臣為自安計乎及議兼職時迪已帶少傅宜得中書侍郎尚書謂執不可第兼左丞迪不能堪變色而起丙寅晨朝待漏謂又欲以林特為樞密副使仍領賔客迪曰特去嵗遷右丞今年改尚書入東宫皆非公選物議未息況已奏除詹事何可改也因詬謂引手版欲擊之謂走得免同列極意和解不聽遂入對於長春殿內臣奉制書置榻前帝曰此卿等兼東宫官制書也迪進曰東宫官屬不當增置臣不敢受此命因斥謂姦邪弄權私林特錢惟演而嫉冦凖特子殺人寢而不治凖無罪逺斥惟演以姻家使預政曹利用馮拯相為朋黨臣願與謂同下憲司置對頃之謂迪等先退獨留樞密使副議之帝怒甚初欲付御史臺利用拯曰大臣下獄不惟深駭物聽況丁謂本無紛競之意而李迪置對亦未合時宜帝曰曲直未分安得不辨既而意稍解乃曰朕當即有處分惟演進曰臣與謂姻親忽加排斥願退就班列帝慰諭久之乃命學士劉筠草制各降秩一級罷相謂知河南府迪知鄆州制書猶未出丁卯迪請對於承明殿又請見太子於內東門其所言不傳而謂隂圖復入惟演亦恐謂出則已失援白帝欲留之并請留迪因言契丹使將至宰相絶班馮拯舊臣可任中書帝可之戊辰命謂以户部尚書迪以户部侍郎歸班事頗迫遽其制詞舍人院所草也筠所草制訖不行是日惟演及中正曽等並如初議遷秩領東宫官而太子議政詔書及拯利用等制皆格己巳謂入對於承明殿帝詰所爭狀謂曰非臣敢爭乃李迪忿詈臣耳臣願復留遂賜坐左右欲設墩謂顧曰有旨復平章事乃更以杌進於是入內都知張景宗副都知鄧守恩傳詔送謂赴中書令依舊視事仍詔迪出知鄆州謂始傳詔令筠草復相制筠不奉詔乃更召晏殊筠自院出遇殊樞密院南門殊側面而過不敢揖蓋內有所愧也先是帝久不豫語言或錯亂嘗盛怒語輔臣曰昨夜皇后以下皆之劉氏獨留朕於宫中衆皆不敢應迪進曰果如是何不以法治之良久帝寤曰無是事也后適在屏間聞之由是惡迪迪所以不得留非但謂等媒糵亦中宫意爾考異拜罷録云迪欲兼左丞王曽等以為不可又云迪語極喧戾上連叱之又云上稱迪無禮又云時契丹使將至宰相絶班且欲復相謂錢惟演請并留迪王曽等謂無過曲在迪請令出三兩月復召之此皆陳繹私意曲筆與正史實録及諸家書並不合今不取獨所云惟演請并留迪或不妄蓋迪與謂初並出守尋復留不知何故當是從惟演議耳然惟演實為謂計當時不得已且并留迪故謂卒留而迪竟出也龍川别志載二相忿爭事又與實録正史不同且云劉筠辭不草制乃命錢惟演按此時惟演已副樞密别志誤矣記聞亦以為草制者惟演也今皆不取然留丁謂出李迪其謀實自惟演但不當草制而草制者少實晏殊也御史臺記劉筠傳云十一月丙辰除丁謂兼傅馮拯與曹利用並兼少保筠當制麻入未宣迪謂忿爭於帝前戊辰筠復直謂罷為户書知河南迪罷為户侍知鄆州拯為昭文曽為集賢制既入謂復留要筠改制筠不從卒命他學士為之拯遂為集賢曽依舊為副樞此記載王曽事與他書不同當考宋綬作筠墓銘亦云上在東宫始議邦政以樞輔備三孤筠當上麻入而事遽易丞相要筠改詔筠拒不往卒命他學士為之然則迪謂等初領東宫職及罷相兩制皆筠所草也庚午詔自今除軍國大事仍舊親決餘皆委皇太子與宰臣樞密使已下就資善堂參議行之皇太子上表陳讓優詔不允初議欲令太子總軍國事丁謂以為不可曰即日上體平何以處此李迪曰太子監國非古制耶力爭不已迪既罷出故有是詔考異迪傳以為此詔在迪未罷相時蓋誤也考十八日上對輔臣語則可知此詔與昨詔異矣以馮拯為右僕射中書侍郎兼少傅平章事辛未詔自今羣臣五日于長春殿起居餘隻日視朝於承明殿壬申皇太子見宰相樞密使於資善堂諸司職掌以次參謁十二月丁丑朔翰林學士楊億卒諡曰文録其子紘為奉禮郎億天性穎悟於書無所不覽自唐大中後詞氣衰濫國朝稍革其浮至億乃振起風采與古之作者並駕學者翕然宗尚文思敏速不加點竄對客談笑揮毫無廢而精密有規裁尤長典章制度之事時多取正喜誨誘後進賴以成名者甚衆性耿介敦尚名節多周給親友所得廪賜隨盡然剛徑寡合時有挾邪説以進者戲億曰君子知微知彰知柔知剛億應聲答曰小人不恥不仁不畏不義范仲淹嘗稱之曰公以命世之才其位不充故天下知公之文而未知公之道也其見重如此乙酉皇太子親政詔內臣傳稟須覆奏自是輔臣每會議皇太子秉笏南面而立中書樞密院以本司事遞進承令旨時政之外京朝幕職州縣官使臣禁卒咸引對焉事畢接見輔臣如常禮丁酉以資政殿大學士司空王欽若為山南東道節度使同平章事判河南府初欽若與丁謂善援引至兩府及謂得志稍叛欽若欽若恨之時帝不豫久事多遺忘欽若先以太子太保在東宫位三少上謂不悅因改授司空欽若宴見帝問曰卿何故不之中書對曰臣不為宰相安敢之中書帝顧都知送欽若詣中書視事謂令設饌以待之曰上命中書設饌耳欽若既出使都知入奏以無白麻不敢奉詔因歸私第有詔學士院降麻謂乃除欽若使相為西京留守帝但聞宣制亦不知寤也考異記聞載欽若入資善堂見太子位三少上丁謂方用事尋有詔欽若以太子太保歸班欽若袖詔書白上臣已歸班不識詔旨上留其詔改除司空按欽若以太子太保歸班乃天禧三年六月甲午初罷相時事謂猶未入中書也若已為太子太保又令歸班則詔旨果不可曉恐謂亦不至此繆或記聞誤也改除司空今從實録及本傳押赴中書視事及為使相則參取記聞及江休復雜志稍刪潤之閏月丁卯以嘉勒斯賚為邊患詔陳堯叟等巡撫帝久不豫前二日因藥餌泄瀉前後殿罷奏事乙亥力疾御承明殿召輔臣諭以盡心輔導儲二之意出手書一幅付之自是體中漸平凡旬浹乃復常焉時太子雖聽事資善堂然事皆決於后中外以為憂錢惟演后戚也王曾説惟演曰太子幼非中宫不能立中宫非倚太子則人心亦不附加恩太子則太子安太子安乃所以安劉氏也惟演以為然因以白后兩宫由是益親人遂無間吕中曰當時變危疑之衝錢惟演用事于中丁謂擅權於外而馮拯曹利用亦相與為黨所幸君子之朋黨植猶多也冦凖李迪之徒雖爭之不勝而所恃以砥柱其中者又有曽在卒之竄丁謂而相仁祖太平之治者王曽也是嵗天下户九百七十一萬有竒口二千二百七十一萬有竒趙德明始城懷逺鎮而居之號興州髙麗王詢請稱藩納貢於契丹且歸所拘人珠埒哩契丹遣使報許之資治通鑑後編卷三十四
