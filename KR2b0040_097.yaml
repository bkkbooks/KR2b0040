body:
  text: 資治通鑑後編卷九十七刑部尚書徐乾學撰宋紀九十七起強圉大淵獻正月盡上章攝提格十二月凡四年徽宗體神合道駿烈遜功聖文仁德憲慈顯孝皇帝大觀元年春正月戊子朔赦天下甲子中太一宮使魏國公蔡京復為尚書左僕射兼門下侍郎戊戌幸興德禪院庚子置禮儀局於尚書省甘露降於帝鼐中羣臣稱賀壬寅尚書右丞吳居厚以老避位罷為東太一宮使壬子以何執中為中書侍郎鄧洵武為尚書左丞户部尚書梁子美為尚書右丞子美初為河北都轉運使傾漕計以奉上至捐緡錢三百萬市北珠以進由是諸路漕臣效尤爭進羡餘矣北珠出於女真子美市於遼遼嗜其利虐女真捕海東青以求珠女真深怨之而子美用是顯二月己未詔令道士序位在僧上女冠在尼上壬戌向宗回徙封安康郡王甲子詔淮南兩浙應私鑄錢限一季首納限滿不首並依私錢法其納到私錢並許發赴京畿錢監改鑄御書當十錢以黎洞納土曲赦廣西乙亥復醫學己卯復行方田丙戌以平昌郡君韋氏為才人鳯翔府于仙姑授清真沖妙先生尋遣李瓌齎御封香往鳯翔太平宮等處道場因就宣于仙姑赴闕此據長編所載初草又有虞仙姑者年八十餘狀貌如少艾行大洞法一日帝誦大洞經舉首見有仙官侍立者蔡京嘗具飯招仙姑見大貓指而問京曰識之否此章惇也意以諷京京大不樂帝嘗問仙姑致太平之期對曰當用賢人帝曰賢人謂誰曰范純粹也帝以語京京曰此元祐臣僚所使遂逐之於是士大夫爭言虞仙姑亦入元祐黨矣此據長編所載孫覿供到蔡京事迹三月己丑幸金明池賜宰相蔡京等宴丁酉尚書右僕射趙挺之罷為佑神觀使以何執中為門下侍郎鄧洵武為中書侍郎梁子美為尚書左丞吏部尚書朱諤為尚書右丞諤出蔡京門善附會故有是命以蔡攸為龍圖閣學士兼侍讀甲辰詔以八行取士善父母為孝善兄弟為悌善內親為睦善外親為姻信於朋友為任仁於州里為恤知君臣之義為忠達義利之分為和孝弟忠和為上睦姻為中任恤為下又制為不忠不孝不悌不和不睦不姻不任不恤之刑諸犯八刑者縣令佐州知通以其事自書於籍報學應有入學不睦十年不姻八年不任五年不恤三年能改過自新不犯罪而有二行之實耆鄰保伍申縣縣令佐審聽入學在學一年又不犯第三等罪聽齒於諸生之列癸丑觀文殿大學士佑神觀使趙挺之卒贈司徒諡清憲以葉夢得為起居郎夢得附蔡京得為祠部員外郎京罷相趙挺之更其所行及京再相復反前政夢得入對因曰陛下前日所建立者出於陛下乎出於太臣乎豈可以大臣進退而有所更張也帝悅故有是命夏四月乙丑以淑妃王氏為貴妃五月己丑朝散郎吳儲承議郎吳侔坐與妖人張懷素謀反伏誅懷素獄起蔡京欲因以傅致吕惠卿之罪下其子淵于獄搒笞數千下欲令招伏與懷素謀反淵卒不服得免是日惠卿責授祁州團練副使宣州安置坐上表自劾黨庇其子無責已之詞也庚寅中書侍郎鄧洵武罷張懷素獄朝士多株連者而洵武妻吳氏侔之兄女也坐出知隨州提舉明道宮甲午詔班新樂于天下癸卯詔自今凡總一路及監司之任勿以元祐學術及異議人充選以安化蠻犯邊益兵赴廣西討之乙巳皇子構生才人韋氏所産也六月己未以梁子美為中書侍郎壬戌詔景靈宮建僖祖殿室甲子以黎人地為庭孚二州庚午令諸州學以御製八行八刑刻石從江東轉運副使家彬奏請也癸酉賜上舍生二十九人及第乙亥尚書右丞朱諤卒贈光祿大夫諡忠靖蔡京為志其墓甲申以才人韋氏為媫妤是月以蔡薿為給事中薿以學録試䇿揣蔡京且復用即對曰熙豐之德業足以配天不幸繼之以元祐紹聖之纘述足以永賴不幸繼之以靖國陛下兩下求賢之詔冀以聞至言收實用也而見於元符之末者方且幸時變而肆姦言乘間隙而投異意詆誣先烈不以為疑動搖國是不以為憚願逆處於未至而絶其原於是擢為第一以所對頒天下甫解褐即除祕書正字不踰年至侍從前此未有也秋七月乙酉朔伊洛溢戊子詔括天下漏丁壬寅班祭服于州郡乙巳賢妃武氏薨丙午臣僚上言蘇州錢法之壞始於蔡渭成於蹇序辰二人之罪惟均而小平錢之害又出序辰渭已除名勒停送蔡州羈管而序辰止降三官安居善郡罪同罰異士論咸疑詔蹇序辰責授單州團練副使江州安置崇寧更錢法以一當十民嗜利犯法者紛紛或捕得私錢數大缶誣為樞密章楶子綖所鑄綖劉逵之婦兄也蔡京怨逵因而興獄初遣監察御史張茂直就平江鞫之案上綖不伏再遣侍御史沈畸畸既至繫者數百人盡釋之歎曰為天子耳目司而可傳會權要殺人以茍富貴乎遂閲實平反以聞京大怒别遣官煆鍊綖竟竄海島籍沒其家此據方勺泊宅編增修於是臣僚上言畸為耳目之官不能盡公究實奏牘語言自為同異無以副朝廷任使之意又言畸去春嘗上封事訾毁朝廷法度意在迎合大臣懷姦異議詔貶畸監信州酒稅未幾卒八月乙卯太中大夫提舉崇福宮曾布卒于潤州丁巳封皇子構為蜀國公庚申以户部尚書徐處仁為尚書右丞兵部尚書林攄同知樞密院事張懷素妖事覺攄以開封尹與中丞余深雜治得士民交關書疏數百攄請悉焚蕩以安反側衆稱為長者不知蔡京與懷素遊最密攄實為京地也京深德之用鞫獄明允連擢數官至是遂登樞府己巳降德音于淮海吳楚二十六州減囚罪一等流以下釋之九月庚寅建顯烈觀于陳橋己酉加上僖祖諡曰立道肇基積德起功懿文憲武睿和至孝皇帝朝獻景靈宮庚戌饗太廟辛亥饗明堂赦天下升永興軍為大都督府李景直等四人以上書觀望罪並編管嶺南宣義郎致仕程頥卒年七十五頥於書無所不讀其學本於誠以大學論語孟子中庸為標指而達於六經動止語默一以聖人為師嘗言今農夫祁寒暑雨深耕易耨播種五榖吾得而食之百工技藝作為器物吾得而用之介胄之士被堅執鋭以守土宇吾得而安之無功澤及人而浪度歲月晏然為天地間一蠧唯綴緝聖人遺書庶幾有補耳於是著易春秋傳平生誨人不倦故學者出其門最多淵源所漸皆為名士而劉絢李籲謝良佐遊酢張繹蘇昞吕大臨吕大鈞尹焞楊時德望尤著世稱頥為伊川先生冬十月己未詔士有才武絶倫者歲貢凖文士上舍上等法庚申和賜蔡京君臣慶會閣落成詩辛酉蘇州地震乙丑提舉崇福宮張商英責授安化軍節度副使歸州安置以臣僚言其罪大責輕也己巳大雨雹閏月丙戌以林攄為尚書左丞資政殿學士鄭居中同知樞密院事初居中自言為鄭貴妃從兄弟妃家世微亦倚居中為重由是連擢至翰林學士除同知樞密院事時妃寵冠後宮於居中無所賴乃用宦官黃經臣䇿以外戚秉政辭改資政殿學士中太一宮使兼侍讀蔡京再得政居中之助為多厚責報於京京為言樞密本兵之地與三省殊無嫌於用親經臣方持權力抗前説京言不效居中疑不已援始怨之乃與張康國間京都水使者趙霆得龜兩首於黃河獻以為瑞京曰此齊小白所謂象罔見之而霸者也居中曰首豈宜有二人皆駭異而京獨主之殆不可測帝命棄龜金明池謂居中愛我遂申前命乙未詔守令以户口為殿最升桂州為大都督府建鎮州於黎母山心賜軍額曰靖海用知桂州王祖道䇿也壬申禁用翡翠乙巳升太原府鄧州並為大都督府十一月壬子朔日有食之蔡京以不及所當食分率羣臣稱賀癸亥詔以議禮當追述三代之意適今之宜開元禮不足為法今親製冠禮沿革十一卷付議禮局餘五禮令視此編次乙丑置內外符寶郎國初創業艱難諸寶多階石為之元豐中詔依古作天子皇帝六璽有玉而未成元符初始得玉工之善者琢之但疉篆而已玉亦不甚良至是得漢傳國璽實秦璽乃藍田玉李斯之魚蟲篆也文曰受命於天既壽永昌帝獨取其文而黜其璽不用因自作受命寶其方四寸有奇時又得古小玉印文曰承天福延萬億永無極者帝又以其文倣李斯魚蟲作寶大將五寸皆為螭紐其篆則蔡京命其子翛以意斆之名為鎮國受命二寶合先帝六璽是為八寶此據蔡滕國史後補修入命置官以掌之尚書省言今禁中已有常用之寶所用至多不可改移欲鎮國受命寶皆寶而不用惟封禪則用之皇帝之寶答鄰國書則用之皇帝行寶降御劄則用之皇帝信寶賜鄰國書及物則用之天子之寶答夷國書則用之天子行寶封册則用之天子信寶舉大兵則用之餘皆用常用之寶從之己巳升瀛州為河間府瀛海軍節度戊寅尚書右丞徐處仁以母憂去位南丹州地與宜州及西南夷接壤世為莫氏所居自署刺史王祖道欲取之乃誣其酋莫公佞阻東蘭州不令納土發兵討之擒公佞以南丹州為觀州公佞弟公晟結溪洞報復侵掠城邑殺刺史蔡京匿不以聞特置黔南路領庭孚平允從宜柳融觀九州十二月庚寅京以功加太尉進何執中以下官二等而召祖道為刑部尚書祖道在桂四年厚以官爵金帛挑諸夷建城邑調兵鎮戌輦輸內地錢布鹽粟無復齊限地瘴癘戌者十亡五六實無尺土一民益於縣官時廣西轉運副使張莊與祖道表裏遂以代其任祖道莊既鑿空超取顯美由是龎恭孫趙遹程鄰相與效之邊壤益多故矣癸巳以江寧荆南杭越洪福潭廣桂並為帥府丁酉置開封府府學己亥以婉容喬氏為賢妃是歲秦鳯旱京東水河溢遣官賑濟貸被水户租廬州雨豆乾寧軍言黃河清踰八百里凡七晝夜詔以乾寧軍為清州涪州夷駱世葉等內附以其地為珍承二州知州龎恭孫誘之以來也太廟齋郎方軫上書言蔡京睥睨社稷內懷不道專以紹述之説為自媒之計內而執政侍從外而帥臣監司無非其門人親戚京每有奏請盡作御筆行出語入曰此上意也明日不行又語人曰京實啓之也善則稱已過則稱君必欲陛下斂天下之怨而後已自元符末陛下嗣服忠義之士投匭者無日無之京分為邪等黥配編置不齒仕籍則誰肯為陛下言哉京又使子攸日以花石禽鳥為獻使陛下不知天下治亂臣以為京必反也請誅京以安天下詔宣示京京請下軫獄竟流嶺南二年正月壬子朔受八寶於大慶殿大赦天下文武進位一等蔡京表賀符瑞乙卯以婉儀劉氏為德妃己未太尉蔡京進太師加童貫節度使仍宣撫庚申進封京兆郡王桓為定王蜀國公構為廣平郡王甲子以神宗德妃宋氏劉氏為淑妃賢妃喬氏為德妃戊寅徙封向宗回為漢東郡王向宗良為開府儀同三司改封趙懷德為順義郡王昭化軍節度使河南蕃部總領以河南蕃將綿實羅蒙為節度觀察留後賜名趙懷忠河東河北盜起二月甲申置諸路曹掾官丙戌歸州安置張商英移陜州居住甲午詔建徽猷閣藏哲宗御集置學士直學士待制官庚戌以媫妤韋氏為修容三月庚申班金籙靈寶道場儀範于天下戊寅賜上舍生十三人及第門下中書後省左右司言檢會今年正月一日赦書元祐黨人懷姦睥睨報怨不已公肆詆誣罪在宗廟者朕不敢貸其或情輕法重例被放棄或非身自犯因人得罪或志匪誣謗言有近似或本緣辨理語涉譏訕或止因職事偶涉更改凡此之類不據元貶謫罪犯審量其情分輕重等第取情理輕者與落罪籍甄敘差遣今將元編類册內依詳赦文看詳到孫固等四十五人孫固陸佃王存蔣之竒趙瞻安燾顧臨張問朱師服錢協王欽臣楊畏李之純王汾馬默周鼎向級李昭玘歐陽棐陳察梁士能楊彥璋李賁鍾正甫許端卿趙彥若賈易姚勔吕希績歐陽中立葉伸陳郛朱光裔蘇嘉吳儔常立季茂直司馬康都貺鄧忠臣廖正一吕希哲秦希甫張耒杜純詔除孫固安燾賈易外餘並出籍又看詳到葉祖洽等六人葉祖洽郭知章上官均朱紱种師極錢景祥詔並出籍考異李燾曰初草王圭孫固出籍在四月千三日今不取實録並不載黨人出籍事甚無謂也詔監司歲舉所部郡守二人縣令四人赴三省審察夏四月辛巳手詔以追述先王寓馬於農之意募人給地免租牧馬行之期年熙河頗見就緒凡縣鎮塞關堡官銜內並帶管勾給地牧馬事佐官同管勾庶使人人各知任責甲辰童貫遣統制官辛叔獻馮瓘等復洮州五月庚戌朔日有食之辛亥以復洮州功賜蔡京玉帶初神宗用唐故事以玉帶賜王安石止繫三日及京受賜遂為常服庚戌提舉京西南路學事路瑗言臣所領八州三十餘縣比諸路最為褊小學舍乃至三千餘區教養生徒三千三百餘人贍學田業等歲收錢斛六萬三千餘貫石竊計諸路學舍生徒田業錢斛之數何翅數百萬此曠古所未嘗有也乞詔有司總會諸路州軍縣文武大小學生并學費所入所用實數具圖册上之御府副在辟雍仍宣付史館從之壬子錫爾格城王子藏珍布格降復積石軍藏珍布格以咒詛扇蕃族居錫爾格空城邊吏謂既能動衆必為邊患童貫欲實其事遂會諸路進兵仍遣知西寧州劉仲武出奇趨錫爾格城藏珍布格迎降并女弱才二十八人初未嘗有兵也洎就擒邊吏張大其功過為緣飾以金紙糊桶為頭冠木椅為胡牀淺紅絹為繖種種皆非羌物捷聞蔡京率百官稱賀詔俘藏珍布格至京師授正任團練使鄧州鈐轄尋死于鄧州此據長編所載青唐録修入甲寅復諸路歲貢供奉物丁巳以童貫為檢校司空奉寧軍節度使賞收洮州積石功也初童貫議欲收積石軍積石與西寧接境劉仲武詣貫計事曰大兵入境賊窮必走夏國路由西寧當即掩捕欲降則招納之或深入巢穴可乘其便但河橋功力未易辦若稟命待報慮失事機貫許以便宜藏珍布格果欲降丐一子為質仲武即遣子錫往而河橋已成仲武以兵渡河挈與歸獻捷宣撫司貫掩其功止録河橋之勞仲武終不自言後帝遣使持金盞賜先得積石軍招納降王者使者訪其實以盞授仲武且召對帝慰勞久之曰高永年失律以不用卿言今招納降王撫定河南皆卿力也仲武謝問幾子曰九子乃以錫為右班殿直閣門祇候餘悉補三班借職命仲武復知西寧州此據長編所載劉仲武傳修入壬戌詔臨洮城依舊為洮州帝賜蔡京詔曰昔我神考肇開武勝疆理西陲惟時臨洮雖未克復分置一道以總其名丕顯聖謨蓋示必取朕克篤前烈告厥成功遠徹河源奄有積石名王係頸版築一新壺漿載塗民罔告病眷茲碩畫實賴相臣差次疇庸宜居第一蔡京可特許奏補一子一孫官餘依轉官恩數戊辰詔張康國以下各進官一等己卯以收復功命户部侍郎洪中孚奏告天地宗廟社稷葆真觀妙沖和先生劉混康卒特贈太中大夫六月乙酉以涪夷地為珍州甲午以平夏城為懷德軍乙未以殿中六尚算學太官局翰林儀鸞司皆隸六察戊戌門下中書後省左右司復依赦看詳到韓維等九十五人詔並出籍韓維楊康國趙卨鮮于侁龔原董敦逸吕希純岑象求孔武仲葉濤唐義問余卞宋保國李深陳祐商倚李之儀范正平李祉韓治曽紆黃隱馬諗王履任濬趙希德郭子旗劉延肇錢盛吳休復崔昌符李遇李玩吉師雄趙希夷王庭臣高士權李永王獻可李嘉亮姚雄潘滋高茂華滕友張溥梅君俞楊瓌寶林膚彭醁吕彥祖陳唐曹盥王守曹興宗高公應黃才江公望黃安期梁俊民王貫張集鹿敏求季賁高士育逄純熙趙令畤倪直孺沈千宋壽嶽侯顧道趙越周鍔蕭刓高遵裕劉渭楊琳鄧允中董祥王交楊朏于肇劉勃許堯輔謝潛張夙何大正張裕洪芻鮮于綽李積中馮百藥衮公邇李新許安修按此據長編所列止九十四人蓋脫去一姓名戊申三省檢會正月一日赦書應元祐黨人不以存亡及在籍可特與敘官勘會前任宰臣執政官見存人韓忠彥蘇轍安燾身亡人文彥博吕公著吕大防劉摯曾布章惇梁燾王巖叟李清臣范純禮黃履詔見存人與復一官文彥博等亦各追復有差秋七月庚戌罷建僖祖殿室乙卯以婉容王氏為賢妃八月辛巳邢州河水溢壞民廬舍復被水者家丙申中書侍郎梁子美罷知鄆州己亥置保州敦宗院九月辛亥以林攄為中書侍郎吏部尚書余深為尚書左丞壬戌貶向宗回為太子少保致仕乙丑詔諸路州學有閣藏書皆以經史為名方今崇八行以迪多士尊六經以黜百家史何足言應置閣處賜名曰稽古考異宋史徽宗紀大觀三年九月己未賜天下州學藏書閣名稽古今從長編癸酉皇后王氏崩削向宗回官爵丙子曲赦熙河蘭湟秦鳯永興軍路冬十一月丁未朔太白晝見乙丑上大行皇后諡曰靖和丙寅吕惠卿復宣奉大夫提舉明道宮任便居住戊辰詔受命寶增鎮國二字十二月己卯峽州居住張商英許任便居住商英有别業在宜都縣懇蔡京乞歸其地京從都省批狀依所申商英深德之壬寅陪葬靖和皇后于永裕陵是歲同州黃河清夏人入貢涪州夷任應舉湖南徭楊再光內附知桂州張莊奏安化上三州一鎮諸蠻納土共五萬餘户二十六萬餘人幅員九千餘里又奏寬樂州安沙州譜州四州七原等州納土計二萬人一十六州三十三縣五十餘洞幅員萬里蔡京率百官表賀謂混中原風氣乏殊當天下輿地之半進莊兼黔南經略安撫使渝州蠻趙秦等內附以其地為溱州詔孔伋從祀孔子廟庭秦州觀察使知府州折克行卒贈武安軍節度使以其子可大為榮州團練使知府州克行沉勇有力善撫士卒在邊三十年戰功最多虜畏其威名號折家父三年春正月乙卯祔靖和皇后神主於别廟丁卯以涪夷地為承州甲戌升湟州為饗德軍節度二月丙子朔播州楊文貴納土以其地置遵義軍丁丑提舉崇福宮儀國公韓忠彥以宣奉大夫致仕庚子臣僚上言知和州胡師文昨為發運使獨銜建議將當二銅錢改鑄當十自古積山之利以銅鑄錢不聞以錢鑄錢當二錢法與小平錢輕重相等故私鑄不禁而自止民間便之此神宗之良法也師文諂奉大臣妄亂變更將已行當二錢毁而改鑄識者痛心詔師文提舉萬壽觀三月丙午立海商越界法辛酉詔四川郡守並選內地人任之壬戌併黔南入廣西路乙丑賜禮部奏名進士及第出身六百八十五人壬申知樞密院事張康國卒康國始因附蔡京而進及在樞府寖為崖異時帝惡京專愎陰令康國沮其姦且許以相京忌康國遂引吳執中為中丞執中即劾京客劉昺宋喬年帝嘉執中之不阿康國曰是乃為逐臣地耳已而執中將論康國康國先知之旦奏事留白帝曰執中今日入對必為京論臣臣願避位既而執中對果陳其事帝怒黜執中知滁州至是康國因退朝趨殿廬暴得疾仰天吐舌舁至待漏院死或疑中毒云時童貫權益張與黃經臣胥用事中丞盧航表裹為姦搢紳側目右正言陳禾曰此國家安危之本也吾任言責此而不言可乎遂上疏劾貫經臣怙寵弄權之罪願亟竄之遠方論奏未終帝拂衣起禾引帝衣請畢其説衣裾落帝曰正言碎朕衣矣禾言陛下不惜碎衣臣豈惜碎首以報陛下此曹今日受富貴之利陛下他日受危亡之禍言愈切帝變色曰卿能如此朕復何憂內侍請帝易衣帝却之曰留以旌直臣翌日貫等相率前訴謂國家極治安得此不祥語盧航奏禾狂妄謫監信州酒稅夏四月戊寅中書侍郎林攄罷集英臚唱貢士攄當傳姓名不識甄盎字帝笑曰卿誤耶攄不謝而語詆同列御史論其寡學倨傲不恭失人臣禮黜知滁州猶為帝言頃使遼見其國中攜二若兼而有之勢無不可蓋欲報其辱也帝由是始有北伐之意戊子以淑妃劉氏為貴妃癸巳以鄭居中知樞密院事吏部尚書管師仁同知樞密院事癸卯以余深為中書侍郎兵部尚書薛昂為尚書左丞工部尚書劉正夫為尚書右丞昂與余深林攄附蔡京為至久至舉家為京避私諱或誤及之輒加笞責昂嘗誤及即自批其口五月乙巳朔孟翊獻所畫卦象謂宋將中微宜更年號改官名變庶事以厭之帝不樂詔竄之遠方丙辰令辟雍宴用雅樂丁巳慮囚戊辰大雨雹辛未以德妃喬氏為貴妃六月甲戌朔詔修樂書同知樞密院事管師仁以疾罷為佑神觀使尋卒丁丑尚書左僕射蔡京罷中丞石公弼侍御史張克公劾京罪惡章數十上乃以京為中太一宮使請給恩數並依見任宰相例制略曰明哲保身雖弗居於寵利忠嘉告后當無廢於燕間尚懋遠圖以膺多福公弼始與京有連故得進用及居言路遇事利害輒言不憚京始忌之既免京政復上章言吏員猥冗戾元豐舊制於是詔堂選歸吏部者數千員罷宮廟者千員都水知掃六十員縣非大郡悉省丞在京茶事歸之户部諸道市舶歸之轉運司仕途頓清辛巳以何執中為特進尚書左僕射兼門下侍郎瀘州夷王募弱內附以其地置純滋二州庚寅冀州河水溢何執中一意謹事蔡京遂代為首相太學生陳朝老詣闕上書曰陛下知蔡京之姦解其相印天下之人鼓舞有若更生及相執中中外黯然失望執中雖不敢肆為非法若蔡京之蠧國害民然碌碌常質初無過人天下敗壞至此如人一身臟腑受沴已深豈庸庸之醫所能起乎執中夤緣攀附致位二府亦已大幸遽俾之經體贊元是猶以蚊負山多見其不勝任也疏奏不省秋七月丁未詔謫籍人除元祐姦黨及得罪宗廟外餘並録用甲寅復張商英為通議大夫提舉玉局觀八月己丑嗣濮王宗漢卒兄子仲增嗣丙申升融州為清遠軍節度己亥宣奉大夫致仕儀國公韓忠彥卒冬十月癸丑減六尚局供奉物十一月丁未詔算學以黃帝為先師風后等八人配饗巫咸等七十人從祀己巳蔡京進封楚國公致仕仍提舉編修哲宗實録朝朔望長子提舉醴泉觀攸除樞密直學士次子宣義郎鯈除直祕閣十二月辛卯吕惠卿復資政殿學士戊子以張商英為龍圖閣學士知杭州己亥罷東南鑄夾錫錢中丞石公弼言蔡京盤旋京師餘威震於羣臣願持必斷之決以消後悔侍御史洪彥升言京朋姦誤國公私困弊既已上印而偃蹇都城上憑眷顧之恩中懷跋扈之志願早賜英斷遣之出京侍御史毛注言孟翊妖姦以天文惑衆嘗獻蔡京詩言涉不順京輒喜而受之因以獻易書而賜官卒致詆誣以冒重辟而京不復愧恥張懷素惡逆以地理惑衆京熟與之遊從京妻葬地十日懷素主之嘗同遊淮左題字刻石後雖陰令人追毁以掩其迹而衆所共知以至尚書省事多不取旨直行批下以作陛下之威重祿厚賞下結人心以作陛下之福林攄跋扈之黨而置之政本之地宋喬年姦雄之親而置之尹京之任考之以心揆之以事其志有不可量者今並盤旋輦轂久而不去其情狀已可見矣太學生陳朝老復疏京惡十四事乞投畀遠方以禦魑魅皆不報是歲江淮荆浙福建旱秦鳯階成飢發粟賑之蠲其賦陜州同州黃河清四年春正月庚子朔中丞吳執中言竊聞邇來諸路以八行貢者如親病割股或對佛燃頂或刺臂出血寫青詞以禱或不茹葷常誦佛書以此謂之孝或嘗救其兄之溺或與其弟同居十餘年以此謂之悌其女適人貧不能自給取而養之於家為善內親又以壻窮窶收而教之為善外親此則人之常情仍以一事分為睦姻二行嘗一遇歉歲率豪民以粥食飢者而謂之恤夫粥食飢者乃豪民自為之而已獨謂之恤可乎又有嘗收養一遺棄小兒嘗救一跛者之溺而以為恤如此之類不可遽數伏願下之太學俾長二博士考以道藝别白是非澄去冒濫勿使妄進申飭郡縣長吏及學事司察驗行實有其人則舉無其人勿以妄貢務在奉承詔旨不失法意從之癸卯詔新置河東河北陜西諸監罷改鑄當十錢辛酉詔士庶拜僧者論以大不恭丁卯夏人入貢吕惠卿降授正奉大夫侍御史毛注劾惠卿上表謝復官用詩風雨及青蠅節南山章句以古君子自處而以亂世方盛時罪不可赦故有是命二月庚午朔禁然頂煉臂刺血斷指辛未以張商英為資政殿學士中太一宮使初商英起知杭州過闕入對言神宗修建法度務以去害興利而已今誠一一舉行則盡紹述之美法若有弊不可不變但不失其意足矣戊寅議禮局奏修成大觀禮書二百三十一卷祭服制度十六卷祭服圖一册據經稽古酌今之宜以正沿襲之誤又别為看詳十二卷祭服看詳二册詔行之庚辰罷京西錢監甲申詔自今以賞進秩者毋過中奉大夫己丑以余深為門下侍郎資政殿學士張商英為中書侍郎户部尚書侯蒙同知樞密院事帝嘗從容問蒙曰蔡京何如人也蒙對曰使京正其心術雖古賢相何以加京聞而銜之壬辰罷河東河北京東鑄夾錫鐵錢癸巳詔方田之法均賦惠民訪聞近歲以來有司推行怠惰監司督察不嚴賄賂公行高下失實可嚴飭所部仍仰監司覺察三月庚子募飢民補禁卒詔醫學生併入太醫局算入太史局書入翰林書藝局畫入翰林畫圖局其學官等並罷甲寅敕所在賑恤流民癸亥詔罪廢人稍加甄敘能安分守者不俟滿歲各與敘進以責來效丙寅賜上舍生十五人及第戊辰詔上書邪下等人可依無過人例今後改官升任並免檢舉夏四月己卯班樂尺於天下癸未蔡京上所修哲宗實録丙申立感生帝壇丁酉詔修哲宗正史五月壬寅停僧牒三年丁未彗出奎婁甲寅立詞學兼茂科帝以宏詞科不足以致文學之士改立此科歲附貢士院試去檄書而增制誥中格則授館職歲不過五人丙辰詔以彗見避殿減膳令侍從官直言指陳闕失戊午赦天下壬戌改廣西黔南路為廣南西路癸亥治廣西妄言拓地罪追貶帥臣王祖道為昭信軍節度副使放張莊于永州先是御史張克公論奏蔡京頃居相位擅作威福權震中外輕錫豫以蠧國用託爵祿以市私恩謂財利為有餘積皆出誕謾務誇大以興事功肆為騷擾援引小人以為朋黨假借姻婭布滿要途以至交通豪民興置産業役天子之將作營葺居第用縣官之人夫漕運花石曾無尊主庇民之心惟事豐已營私之計若是之類其事非一至若名為祝聖壽而修塔以壯臨平之山勢託言灌民田而決水以符興化之讖辭致姪俁之告變而謬為心疾受孟翊之誣言而與之官爵趙真欲輔之以妖術張大成竊伺其姦意駭動遠邇聞者寒心皆足以鼓惑天下為害之大者也甲子詔蔡京特降授太子少保依舊致仕在外任便居住制略曰輕爵祿以市私恩濫錫豫以蠧邦用借助姻婭密布要途聚引克邪合成死黨以至假利民而決興化之水託祝聖而節臨平之山豈曰懷忠殆將邀福屢有告陳之迹每連狂悖之嫌雖僅止於印章猶久留於里第偃蹇弗避傲睨罔悛致帝意之未孚昭星文而申譴言章繼上公議靡容固欲用恩難以屈法宜禠師臣之秩俾參宮保之官聊慰羣情尚為寬典丙寅門下侍郎余深罷深與蔡京結為死黨京既去國深不自安上疏乞罷乃出知青州六月庚午御殿復膳乙亥以張商英為尚書右僕射兼中書侍郎蔡京久盜國柄中外怨疾見商英能立異同更稱為賢帝因人望而相之時久旱彗星中天商英受命是夕彗不見明日雨帝喜因大書商霖二字以賜之壬辰復向宗回為漢東郡王乙未慮囚丙申門下侍郎薛昂罷為佑神觀使秋七月辛丑詔權罷方田己未張商英言當十錢自唐以來為害甚明行之於今尤見窒礙蓋小平錢出門有限有禁故四方商旅物貨交易得錢者必入中求鹽鈔收買官告度牒而餘錢又流布在街市故官私內外交相利養自當十錢行一夫負八十千小車載四百千錢既為輕齎之物則告牒難售鹽鈔非操虛錢而得實價則難行重輕之勢然也今欲權於內庫并密院諸司借支應干封椿金銀物帛并鹽鐵等下令以當十錢盜鑄偽濫害法半年更不行用令民間盡所有於所在州軍送納每十貫官支金銀物帛四貫文擇其偽鑄者送近便改鑄小平錢存其如樣者俟納錢足十貫作三貫文各撥還元借處然後京城作舊錢禁施行乃可議𣙜貨通商鈔法八月庚午張商英又言陛下奮發英斷慨然欲救錢輕物重之弊一旦發德音下明詔捐棄帑藏數千萬緡錢寶改當十為當三令下之日中外歡呼萬口一舌然而姦邪之在內者密倡其説曰不久必復可畜以待也姦邪之在外者曉民以掠美曰當三則虧汝當七則折中矣是以小民聽而和之令出五十日而猶未大孚也伏望陛下固志不移使正議卒行姦邪愧服而漸消其凶悍不平之氣乙亥以劉正夫為中書侍郎侯蒙為尚書左丞翰林學士承旨鄧洵仁為尚書右丞戊寅省內外冗官庚辰以資政殿學士吳居厚為門下侍郎丁亥行內外學官選試法閏月辛丑詔諸路事有不便於民者監司條奏之辛酉詔戒朋黨以張閣知杭州閣思所以固寵乃因辭日乞領花石綱事自此應奉益繁矣九月丙寅朔日有食之冬十月丁酉立貴妃鄭氏為皇后后開封人本欽聖殿押班初帝為端王常朝欽聖太后太后命后供侍及帝即位遂以賜帝后性端謹善順承帝意好觀書章奏能自製帝愛其才竟立為后蔡京之免知樞密院事鄭居中自許必得相帝覺之不果用至是復以外戚罷戊戌以吳居厚知樞密院事太白晝見十一月丁卯祀圜丘大赦改明年元曰政和丙戌罷拱州為襄邑縣戊寅詔通州安置人陳瓘與自便初瓘自合浦放還居四明而其子正彚幹至餘杭適聞蔡崇盛詫蔡京有動搖東宮之語正彚即日自陳於杭帥蔡嶷嶷時方結京為死黨遂執正彚送京師而飛書告京俾預為計事下開封制獄知開封李孝稱酷吏也乃并下明州捕瓘士民哭送之瓘不為動既就獄顧其子笑曰不肖子煩吾一行孝稱脅瓘使證正彚之妄瓘曰正彚聞京將不利於社稷傳於道路遽自陳告瓘以所不知忘父子之恩而指其為妄則情所不忍挾私情以符合其説又義所不為况不欺不二平昔所以事君教子豈於利害之際有所貪畏自違其言乎蔡京姦邪必為國禍瓘固嘗論於諫省亦不待今日語言間也時內侍黃經臣監勘聞所對失聲歎息謂瓘曰主上正欲知實狀右司第依此置對獄具竟坐正彚以所言過實流竄海島而瓘亦有通州安置之命是年三月事也至是方許其自便十二月庚戌改諡靖和皇后為惠恭以吕惠卿為觀文殿學士知大名府是歲夔州江水溢海水清出宮女四百八十六人南丹州首領莫公晟內附資治通鑑後編卷九十七
