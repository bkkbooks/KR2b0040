body:
  text: 資治通鑑後編卷一百七十八刑部尚書徐乾學撰元紀二十六起強圉作噩七月盡著雍閹茂十二月凡一年有竒順帝至正十七年秋七月丙子徐逹率兵攻常熟張士德出挑戰先鋒趙德勝麾兵而進擒士德送建康遂徇望亭甘露無錫諸寨皆下之考異明太祖實録既書擒張九六於丙申之七月故於丁酉七月常熟之役但云獲馬及舟降其兵而不復有擒士德之文及考實録辨證曰一望虞山一悵然楚公曽此將樓船間關百戰捐軀地慷慨孤忠罵冦年填海欲銜精衛石驅狼願假祖龍鞭至今父老猶垂淚花落春城泣杜鵑右陳基夷白集詩也所稱楚公謂張士德元逮封士德為楚國公故有是稱也實録云士德以丙申七月被擒而太祖御製武寧神道碑亦首載其事今基舟中望虞山之詩則以為楚公身將樓船百戰捐軀之地此所謂傳聞異辭矣基身在士德幕中是詩作於癸卯二月渡淮之日不當為無稽之言而豐碑國史簡册昭然又豈宜有錯誤哉今年輯開國功臣事略於宋文憲鑾坡後集得梁國趙武桓公神道碑云丁酉六月戊辰取江隂秋七月丙子攻常熟張士德出挑戰公麾兵而進士德就縳士德士誠之弟也遂征望亭甘露無錫諸寨以武桓之碑觀之則基之詩為有徴矣又曰實録七月擒張九六十月士誠遣孫君夀請和劉辰國初事迹以為士德母痛其子故也然士誠既以失弟而聳懼其母又以痛子而請和士誠之遺書何以了不置喙髙皇帝之復書則曰攻圍常州生擒張湯二將使其時士德既擒又何以匿而不言但及張湯二將耶實録之誤明矣又曰元史丙申七月士誠兵陷杭州楊旺扎勒擊敗之陶九成輟耕録紀杭州之役士德與王與敬偕往以諸書互考之則士德陷杭在七月其敗歸平江當在八月安得有常州被擒之事又曰元史順帝紀及達實特穆爾傳張士誠為書請降達實特穆爾承制令周伯琦撫諭之詔以士誠為太尉士德為淮南行省平章政事時士德已為大明兵所擒此丁酉八月事也若士德丙申七月就擒則去士誠納欵已一嵗餘矣安得有平章政事之授耶又曰元史記丁酉嵗士誠屢為楊旺扎勒所敗然後乞降士德之被擒在七月而元之招諭在八月則士德被擒時歸欵之事已定矣實録謂我欲留士德以誘士誠士德間遺書士誠俾降元以謀我故誅之國史既誤記士德被擒於前而不欲泯其主謀降元之事故曲為之辭非事實也士德被擒之事斷以趙武桓碑為正豫又考天潢玉牒云丁酉六月取江隂州攻常熟獲張士誠弟士德以歸皇明本紀云明年復破其兵于宜興湖橋擒其弟張九六并獲其戰船馬匹皆與武桓碑相合湖橋在虞山西北通福山港為舟師入江要地故士德被擒於此基由琴川次福山港舟中望虞山至今可想見其處本紀曰宜興傳寫之訛也又曰實録於取常熟下脫士德就縛之事則以丙申誤記於前故也然此事所以傳訛者蓋亦有故丙申七月既擒張湯二將軍十一月又擒其梟將張德用兵之際羽書交馳奏報錯互流傳既久即聖祖製碑之日亦止據一時功狀書之未及是正耳按諸説剖析精詳實録之誤無疑今削去丙申七月張九六之事而特書於此其文則據趙武桓碑修入士德驍鷙有謀士誠陷諸郡士德力居多及是被擒士誠為之喪氣己卯御史大夫特哩特穆爾奏續集風憲宏綱庚辰江南兵取徽州路元帥胡大海等既克績溪遂進兵攻徽州守將元帥帕克斯巴哈及建德路萬户吳訥等拒戰大海擊敗之拔其城訥與守臣阿嚕輝李克膺等退守遂安縣大海引兵追及于白際嶺復擊敗之訥自殺屬縣次第皆下戊子以李稷為御史中丞己丑義兵黃軍萬户田豐叛入紅軍陷濟寧路分省右丞特勒們遁義兵萬户孟本周攻之豐敗走本周還守濟寧甲午監察御史特爾默色劉傑言疆域日蹙兵律不嚴陜西汴梁淮潁山東之冦有窺伺燕趙之志宜俯詢大臣共圖克復之宜預定守備之䇿不報丙申江南元帥胡大海進攻婺源江浙參政楊旺扎勒率兵十萬欲復徽州大海還師與戰于城下大敗之殺其鎮撫吕才旺扎勒遁去是月立四方獻言詳定使司歸德府知府林茂萬户時公權叛以城降於賊歸德及曹州俱陷八月癸丑劉福通兵陷大名路遂自曹濮陷衛輝路博囉特穆爾與萬户方托克托出兵擊之是月帝至自上都張士德至建康江南平章以禮待之士德不食不語據俞本記事録其母痛之誡令士誠嵗餽建康糧十萬石布一萬匹永為盟信平章不許士德以身縶事無所成間遺士誠書俾降元以圖建康據劉辰國初事迹遂不食而死考異辨證曰實録載士德被誅而劉辰國初事迹云不食而死今考陳基祭文云能厲聲罵賊而不能食不義之食則以為不食而死者是也今從之張士誠使前江南行臺中丞曼濟哈雅為書請降於江浙丞相達實特穆爾辭多不遜楊旺扎勒欲納之丞相不可曰我昔在淮南嘗招安士誠知其反覆其降不可信士誠使者往返訖無就乃遣其偽隆平太守周仁親詣江浙省堂具陳自願休兵息民之意旺扎勒固勸納降乃許之士誠始要王爵丞相不許又請爵為三公丞相曰三公非有司所定今我雖便宜行事然不敢專也旺扎勒又力以為請丞相雖外為正辭然實幸其降又恐拂旺扎勒意遂授士誠太尉士德淮南行省平章政事士信同知行樞密院事改隆平府復為平江路士誠遷居府治雖奉正朔而甲兵錢穀皆自據如故朝廷顧以招安士誠為達實特穆爾功詔加太尉後聞士德之死追封楚國公而以士信為江淮平章政事初達實特穆爾假周伯琦行省參政招諭張士誠及是已降除伯琦同知太常禮儀院事士誠留之未行拜左丞士誠為造第宅於乘魚橋厚其廩給伯琦日與諸文士以文墨流連因亦忘歸採元史及平吳録九月癸酉朔婺源州元帥汪同與守將特穆爾巴哈不協以總管王起宗黟縣萬户葉茂祁門元帥馬國寶降於江南丙戌江浙平章夏章等亦降於江南丙子以御史大夫婁達實為中書平章政事丙戌江南廣翼元帥費子賢率兵攻武康與守將潘萬户戰斬首百餘級遂下之甲午澤州陵川縣陷縣尹張輔死之戊戌台哈巴哈復大名路并所屬州縣辛丑詔中書右丞額森巴哈御史中丞成遵奉使宣撫彰德大名廣平東昌東平曹濮等處奬厲將帥是月命知樞密院事努都爾噶加太尉總諸軍守禦東昌時田豐據濟濮率衆來冦擊走之倪文俊謀殺其主徐夀輝不果自漢陽奔黃州夀輝將陳友諒襲殺之友諒沔陽玉沙縣人本姓謝祖千一贅于陳遂從其姓世業漁友諒姿貌豐偉嘗為縣吏不樂會夀輝與文俊等起兵友諒慨然往從之文俊用為簿書掾佐文俊攻陷諸州郡有功遂用領兵為元帥及文俊迎夀輝居漢陽而專其政柄友諒心不平至是友諒襲殺文俊併其衆自稱宣慰使尋為平章政事閏月癸卯有飛星如盂青色光燭地尾約長尺餘起自王良沒於句陳監察御史多爾濟等劾奏知樞密院事哈喇巴圖魯失陷所守郡縣詔正其罪乙丑潞州陷丙寅賊攻冀寧察罕特穆爾遣兵擊走之趙普勝同青軍兩道攻安慶淮南行省右丞余闕拒戰月餘賊竟敗走安慶倚小孤山為藩蔽命義兵元帥胡巴延統水軍戍焉冬十月壬戌陳友諒自上遊直搗小孤山巴延與戰四日夜不勝趣安慶賊追至山口鎮癸亥遂薄城下闕遣兵扼于觀音橋俄饒州祝冦攻西門闕擊斬之其兵乃退壬申江南中翼大元帥常遇春率廖永安等自銅陵進攻池州永安去城十里而軍遇春及吳國寶率舟師抵城下合攻之自辰至已破其北門遂入其城執元帥洪某斬之擒别將魏夀徐天麟等官軍敗走薄暮復以戰船數百艘來逆戰復大敗之遂克池州甲申江南行省平章閲軍于大通江遂命元帥繆大亨率兵攻揚州路克之青軍元帥張眀鑑以其衆降先是至正十五年眀鑑聚衆淮西以青布為號名青軍人呼為一片瓦其黨張監驍勇善用槍又號長槍軍暴悍專事剽掠由含山全椒轉掠六合天長至揚州人皆苦之時鎮南王博囉布哈鎮揚州招降眀鑑等以為濠泗義兵元帥俾駐揚州分屯守禦久之眀鑑等以食盡復謀作亂説鎮南王曰朝廷逺隔事勢未可知今城中糧乏衆無所託命殿下世祖孫當正大位為我輩主出兵南攻以通糧道救飢窘不然人心必變禍將不測鎮南王仰天哭曰汝不知大義若如汝言我何面目見世祖於宗廟耶麾其衆使退明鑑等不從呼譟而起因逐鎮南王而據其城鎮南王走淮安為趙君用所殺眀鑑等凶暴益甚屠城中居民以為食至是兵大敗不支乃出降得其衆數萬戰馬二千餘匹置淮海翼元帥府命元帥張德麟耿再成守之改揚州路為淮海府以李德林知府事按籍城中居民僅存十八家德林以舊城虛曠難守乃截城西南隅築而守之戊戌曹州賊入太行山達實巴圖魯與知樞密院事達里瑪實哩以兵討曹州賊官軍敗潰達里瑪實哩死之是月靜江路山崩地陷大水關中賊散走南山者出自興元陷秦隴據鞏昌有窺鳯翔之志察罕特穆爾即分兵入守鳯翔而遣諜者誘賊圍其城賊果來圍之厚數十重察罕特穆爾自將鐵騎晝夜馳二百里往赴比去城里所分軍張左右翼掩擊之城中軍亦開門鼓譟而出內外合擊呼聲動天地賊大潰自相踐蹂斬首數萬級伏尸百餘里餘黨皆遁還關中悉定十一月辛丑山東道宣慰使董摶霄復請令江淮等處各枝官軍分布連珠營寨於隘口屯駐守禦且廣屯田以足軍食從之汾州桃杏花壬寅賊侵壺關察罕特穆爾兵大破之十二月丙戌徐夀輝將明玉珍陷重慶路據之玉珍隨州人世農家身長八尺目重瞳以信義為鄉黨所服初聞夀輝兵起集鄉兵屯於青山結柵自固未幾降於夀輝授元帥隸倪文俊麾下鎮沔陽與官軍戰湖中飛矢中右目微眇既而以兵千人槳斗船五十泝夔而上時青巾盜李喜喜聚兵苦蜀義兵元帥楊漢以兵五千禦之屯平西左丞相旺扎勒圖鎮重慶置酒飲漢欲殺之漢覺脫身走順流下巫峽遇玉珍訟之且言重慶可取狀玉珍未決萬户戴夀曰攻重慶事濟據蜀不濟歸無損也從之遂進克其城旺扎勒圖遁父老迎入城玉珍禁侵掠市肆晏然降者相繼己丑江南下令釋輕重罪囚以干戈未寧人心初附故也丁酉慶元路象山縣鵝鼻山崩戊戌翰林學士承旨歐陽玄卒初汝潁盜起蔓延南北州縣幾無完城玄獻招捕之䇿千餘言鑿鑿可行君相不能用玄遂乞致仕帝不允會大赦宣赴內府玄久病不能步履丞相傳旨肩輿至延春閣下實異數也及卒賜賻甚厚贈大司徒追封楚國公諡曰文玄性度雍容含𢎞縝密處已儉約為政亷平厯官四十餘年三任成均而兩為祭酒六入翰林而三拜承旨凡宗廟朝廷雄文大册播告萬方制誥多出玄手卓然名世為儒者宗己亥流星如金星大尾約長三尺餘起自太隂近東而沒化為青白氣庚子太尉四川行省左丞相達實巴圖爾卒于軍中時詔遣知院達里瑪實哩來援分兵雷澤濮州而達里瑪實哩為劉福通所殺達勒達諸軍皆潰達實巴圖爾力不能支退駐石村朝廷頗疑其玩冦失機使者促戰相踵賊覘知之詐為達實巴圖爾通和書遺諸道路使者果得之以進達實巴圖爾覺知一夕憂憤死初毛貴陷益都般陽等路帝命董摶霄從知樞密院事布朗吉達討之而濟南又告急摶霄提兵援濟南賊衆自南山來攻濟南望之兩山皆赤摶霄按兵城中先以數十騎挑之賊衆悉來鬬騎兵少郤至澗上伏兵起遂合戰城中兵又大出大破之而般陽賊復約泰安之黨踰南山來襲濟南摶霄列兵城上弗為動賊夜攻南門獨以矢石禦之黎明乃默開東門放兵出賊後既旦城中兵皆下大開南門合擊之賊敗走復追殺之賊衆悉無遺者於是濟南始寧詔就升淮南行樞密院副使兼山東宣慰使都元帥仍賜上尊金帶楮幣名馬以勞之有疾其功者譛於總兵太尉努都爾噶令摶霄依前詔從布朗吉達同征益都摶霄即出濟南城屬老且病請以其弟昂霄代領其衆朝廷從之授昂霄淮南行樞密院判官未幾有旨命搏霄守河間之長蘆是冬張士誠築城虎丘山因髙據險役月餘而畢據虎丘山志是嵗詔諭濟寧李秉彛田豐等令其出降敘復元任嘯亂士卒仍給資糧欲還鄉者聽義兵千户余寶殺其知樞密院事寶通以叛降於毛貴余寶遂據棣州集賢大學士兼太子左諭德許有壬前朝舊德皇太子頗敬禮之一日入見方臂鷹以為樂遽呼左右屏去至是以老病力乞致仕許之給俸賜以終其身盜據齊魯中書參知政事崔敬與平章海蘭參政諳達分省陵州陵州乃南北要衝無城郭而居民散處敬供給諸軍事無不集丞相以其能上聞賜之上尊仍命其便宜行事敬以軍馬供給浩繁而民力已疲乃請行納粟補官之令詔從之河北燕南士民接踵而至積粟百萬石綺段萬匹用以給軍費民獲少蘇中書左丞烏古遜良楨論罷陷賊延坐之令有惡少年誣知宜興州張復通賊之罪中書將籍其孥吏抱案請署良楨曰手可斷案不可署同列變色卒不署良楨自左曹登政府多所建白罷福建山東食鹽浙東西長生牛租瀕海被災圍田稅民皆德之十八年春正月丙午趙普勝陳友諒等陷安慶淮南行省右丞余闕死之賊之來攻也初自東門登城闕簡死士擊却之已而併軍攻東西二門又擊却之賊恚甚乃樹柵起飛樓復來攻我闕分命諸將各以兵扞賊晝夜不得息賊益生兵來攻是日普勝軍東門友諒軍西門饒州祝冦軍南門羣盜四面蟻集外無一甲之援西門勢尤急闕身當之徒步提戈為士卒先士卒號哭止之揮戈愈力仍分麾下將督三門之兵自以孤軍血戰斬首無算而闕亦被十餘創日中城陷火起闕知不可為引刀自剄墮清水塘中妻伊伯氏子德生女福童皆赴井死同時死者守臣韓建一家被害建方卧疾罵賊不屈賊執之以去不知所終城中民相率登城樓自捐其梯曰寧俱死此誓不從賊焚死者以千計其知名者萬户李宗可紀守仁陳彬金承宗元帥府都事特穆爾巴哈萬户府經厯段桂芳千户和碩巴哈新李盧廷玉葛延齡丘卺許元琰奏差烏德美百户黃寅孫安慶推官黃圖嚕岱經厯楊恆知事余中懷寧尹陳巨濟凡十八人闕號令嚴信與下同甘苦然稍有違令即斬以徇嘗病不視事將士皆籲天求以身代闕強衣冠而出當出戰矢石亂下如雨士以盾蔽闕闕却之曰汝輩亦有命何蔽我為故人爭用命稍暇即注周易帥諸生謁郡學會講立軍士門外以聽使知尊君親上之義有古良將風烈或欲挽之入翰林闕以國步危蹙辭不往遂死于安慶贈淮南江北行省平章追封豳國公諡忠宣議者謂自兵興以來死節之臣闕與褚巴哈為第一庚戌張士誠兵攻常州江南守將湯和擊敗之獲卒數百人江南行樞密院判鄧愈遣部將王弼等攻婺源州兵至城西與守將特穆爾巴哈戰自旦至日昃殺傷五百餘人不下乙卯考異元史順帝紀作庚戌今從明太祖實録分兵為三道並進遂拔其城特穆爾巴哈死之士卒皆降凡三千餘人復遣萬户朱國寶攻髙河壘克之乙丑大風起自西北益都土門萬嵗碑仆而碎丙寅田豐陷東平路丁卯知樞密院事布朗吉達與毛貴戰于好石橋官軍敗績走濟南是月詔達實巴圖爾子博囉特穆爾為河南行省平章政事總領其父元管軍馬詔察罕特穆爾屯陜西李思齊屯鳯翔二月己巳朔議團結西山寨大小十一處以為保障命中書右丞達實特穆爾左丞烏古遜良楨等總行提調設萬夫長千夫長百夫長編立牌甲分守要害互相䇿應毛貴陷清滄二州遂據長蘆鎮中書省臣奏以陜西軍旅事劇去京師道逺供費艱難請就陜西印造寶鈔為便從之遂分户部寶鈔府等官置局印造仍命諸路撥降鈔本畀平準行用庫倒易昏幣布於民間癸酉毛貴陷濟南路守將阿達戰死毛貴立賔興院選用故官以姬宗周等分守諸路又於萊州立三百六十屯田每屯相去三十里造大車百輛以挽運糧儲官民田十止收三分冬則陸運夏則水運董摶霄將赴長蘆謂人曰我去濟南必不可保至是濟南果陷摶霄方駐兵南皮縣之魏家莊適有使者奉詔拜摶霄河南行省右丞甫拜命毛貴兵已至而營壘猶未完諸將謂摶霄曰賊至當如何摶霄曰我受命至此當以死報國耳因拔劍督兵以戰而賊衆突至摶霄前捽而問曰汝為誰摶霄曰我董老爺也衆刺殺之無血惟見有白氣衝天是日昂霄亦死之事聞贈摶霄河南行省平章政事追封魏國公諡忠定昂霄禮部尚書追封隴西郡侯諡忠毅摶霄早以儒生起家輒為能吏會天下大亂乃復以武功自奮其才略有大過人者而當時用之不能盡其才君子惜之乙亥江南以吳禎為天興翼副元帥使與其兄良守江隂時江隂兵不滿五千而其地與張士誠接境良兄弟訓練士卒嚴為警備屯田以給軍餉敵不敢犯民甚賴之江南行省平章命元帥康茂才為營田使諭之曰比因兵亂隄防頽圮民廢耕耨故設營田司以修築隄防專掌水利今軍務殷繁用度為急理財之道莫先於農春作方興慮旱潦不時有妨農事故命爾此職分巡各處俾髙無患乾卑不病潦務在蓄泄得宜大抵設官為民非以病民若但使有司增飾館舍迎送奔走所至紛擾無益於民而反害之即非委任之意山東賊漸逼京畿辛巳詔以台哈巴哈為中書右丞相總兵討之壬午田豐復陷濟寧路甲戌輝州陷丙戍努都爾噶聞田豐逼近東昌棄城走城遂陷丁亥察罕特穆爾調兵復涇州平涼保鞏昌庚寅王士誠自益都犯懷慶路守將周全擊敗之丁酉興元路陷三月己亥朔日色如血加右丞相綽斯戬太保庚子毛貴陷般陽路辛丑大同路夜黑氣蔽西方有聲如雷少頃東北方有雲如火交射中天遍地俱見火空中有兵戈之聲癸卯王士誠陷晉寧路總管杜賽音巴哈死之己酉劉福通遣兵犯衛輝河南行省平章博囉特穆爾擊走之進克濮州庚戌毛貴陷薊州徵四方兵入衛詔察罕特穆爾以兵屯涿州察罕特穆爾即留兵戍清湫義谷屯潼關塞南山口以備他盜而自將精鋭往赴召毛貴率衆由河間趣直沽乙卯遂犯漷州至棗林已而略栁林蹂畿甸樞密副使達國珍戰死人心大駭在廷之臣或勸乘輿北巡以避之或勸遷都關陜衆議紛然獨左丞相太平執不可帝乃命同知樞密院事劉哈喇巴哈以兵拒之戰于栁林官軍大捷賊退走京師乃安江南行省平章命提刑按察司簽事分巡郡縣録囚凡笞罪者釋之杖者減半重囚杖七十其有贓者免徵武將征討有過者皆宥之左右或言去年釋罪囚今年又從末減用法太寬則人不畏法無以為治平章曰自喪亂以來民初離創殘以歸於我正當撫綏之况其間有一時誤犯者寧可盡法乎大抵治獄以寬厚為本而刑新國則宜用輕典若執而不變非時措之道也丙辰江南兵取建德路先是鄧愈朱文忠胡大海率兵由昱嶺關進攻建德道出遂安長槍元帥余子貞以兵來拒愈等擊敗之追至淳安降其衆三千餘人遂安守將洪某率兵五千援淳安大海與之戰擒將士四百餘人由是直抵建德參政巴哈院判慶壽等皆遁父老何良輔等以城降改建德路為嚴州府以周全為湖廣行省參知政事統鄂囉等軍移鎮嵩州白龍寨丁巳田豐陷益都路察罕特穆爾之赴召涿州而曹濮賊方分道踰太行焚上黨掠晉冀陷雲中鴈門上郡烽火數千里復大掠而南察罕特穆爾留禦之先遣兵伏南山阻隘而自勒重兵屯聞喜絳州賊果出南山縱伏兵橫擊之賊皆棄輜重走山谷遂分兵屯澤州塞碗子城屯上黨塞吾兒谷屯并州塞井陘口以杜太行諸道賊屢至守將數血戰擊却之河東悉定進陜西行省右丞兼行臺侍御史同知河南行樞密院事於是朝廷乃詔察罕特穆爾守禦關陜晉冀鎮撫漢沔荆襄便宜行事察罕特穆爾益務練兵訓農以平定四方為已責夏四月己巳朔趙普勝自樅陽冦池州陷之執江南守將趙忠庚午江浙行省左丞楊旺扎勒以舟師攻徽州江南將胡大海等擊敗之丁丑旺扎勒又攻建德江南將朱文忠擊敗之旺扎勒遁去甲申陳友諒陷龍興路省臣道通和尼齊棄城遁壬午田豐陷廣平路大掠退保東昌詔令元帥方托克托以兵復廣平癸未以諸處捷音屢至詔頒軍民事宜十一條甲午陳友諒遣部將王奉國陷瑞州路是月帝如上都察罕特穆爾李思齊會宣慰使張良弼郎中郭擇善宣慰同知拜特穆爾平章政事鼎珠總帥汪長生努各以所部兵討李喜喜于鞏昌李喜喜敗入蜀察罕特穆爾駐清湫李思齊駐斜坡張良弼駐秦州郭擇善駐崇信拜特穆爾駐通渭鼎珠駐臨洮各自除路府州縣官徵納軍需李思齊張良弼同謀襲殺拜特穆爾分總其兵思齊尋又殺郭擇善五月戊戌朔以方國珍為江浙行省左丞兼海道運糧萬户察罕特穆爾遣其將以兵復冀寧劉福通攻汴梁壬寅守將竹貞棄城遁福通遂入城立宫闕自安豐迎其主小明王居之以為都陳友諒遣部將康泰邵琮鄧克明等以兵冦邵武路庚戌陳友諒陷吉安路癸丑監察御史敏珠爾海七十等糾劾太保中書右丞相台哈巴哈乙卯詔削台哈巴哈官爵安置蓋州初台哈巴哈奉命討賊既渡河即上疏以謂賊勢張甚軍行宜以糧餉為先昔漢韓信行軍蕭何餽糧方今措置無如丞相太平者如令太平至軍中供給事乃可濟不然兵不能進矣其意實銜太平欲其至軍中即害之也時參知政事布延特穆爾張晉等分省山東二人者嘗劾壽通不進兵台哈台哈至則以其餽運不前斷遣之又以知樞密院事旺扎勒特穆爾為右丞之日嘗劾其非亦加以失誤專制之罪擅改其官徵至軍欲害之事聞廷議喧然而左丞相太平與台哈巴哈久有隙會其疏來上以其欲害已也遂諷御史劾其緩師拒命之罪而於帝前力排之於是下削奪之詔以知樞密院事烏蘭哈達代總其兵仍命烏蘭哈達節制河北諸軍河南行省平章政事周全節制河南諸軍辛酉陳友諒兵陷撫州路是月山東地震天雨白毛六月戊辰朔台哈巴哈伏誅台哈巴哈聞有詔夜馳詣劉哈喇巴哈求救解劉哈喇巴哈者台哈巴哈故部將也以破賊纍有功拜淮南行省平章政事時駐兵保定見台哈巴哈來因張樂大宴舉酒慷慨言曰丞相國家柱石有大勳勞如此天子終不害丞相是必為讒言所間我當往見上白之丞相毋憂也即走至京見太平太平問其來何故哈喇巴哈具以告太平曰台哈巴哈大逆不道今詔已下爾乃敢妄言耶不審處禍將及爾矣哈喇巴哈聞太平言噤不能發太平度台哈巴哈必在哈喇巴哈所即語之曰爾能致台哈巴哈以來吾以爾見上爾功不細矣哈喇巴哈因許之太平乃引入見帝賜賚良渥初哈喇巴哈之事台哈巴哈也與倪晦者同在幕下台哈巴哈每委倪晦而哈喇巴哈計多阻不行哈喇巴哈心常以為怨及是知事已不可解還縛台哈巴哈父子送京師未至皆殺之於路察罕特穆爾調呼喇齊關保同守潞州拜察罕特穆爾陜西行省平章政事便宜行事癸酉江南左副都指揮使朱文忠率兵攻浦江縣下之縣之感德鄉有鄭氏者自宋聚族同居至元中旌表為義門復其家至是家衆避兵山谷間文忠訪得之悉送還家禁兵士無侵犯江南中翼左副元帥謝再興等率兵略石埭縣與陳友諒兵遇擊敗之擒其將錢清等三人庚辰關先生破頭潘等陷遼州呼喇齊以兵擊走之關先生等遂陷晉寧路城中死者十二三郡人喬彛性髙介有守一時名稱籍甚至是整冠衣聚妻子家有大井彛坐其上令妻子婢輩循次投井中而已隨赴之賊首王士誠使人即彛家邀致之至則彛死矣賊平贈彛臨汾縣尹賜諡純潔有張嵓起者汾州人也嘗用薦者徵為國子助教居一嵗免歸賊去晉寧復陷汾州嵓起與妻亦赴井死晉寧人王佐為賊所獲欲降之佐詬詈不輟亦遇害乙酉命左丞相太平督諸軍守禦京城便宜行事甲午張士誠兵冦常熟縣江南守將廖永安與戰于福山港大破之穆爾固實者寧夏人也登進士第除紹興路録事司達嚕噶齊會江南行臺移治紹興檄穆爾固實為行臺鎮撫乃大募民兵為守禦計與舒穆嚕宜孫夾攻處州山賊遂平之擢江東亷訪司經厯仍留紹興以兵衛臺治時浙東西郡縣多殘破獨穆爾固實保障紹興境內晏然民愛之如父母江浙省臣乃承制授行樞密院判官分院治紹興及是方國珍遣兵侵據紹興屬縣穆爾固實曰國珍本海賊今既降為大官而復來害吾民可乎欲率兵往問罪先遣部將黃中取上虞中還將益兵時朝廷方倚重國珍資其舟以運糧而御史大夫拜珠格爾與國珍素通賄賂情好甚厚憤穆爾固實擅舉兵且恐生事即使人召至私第計事至則命左右以鐵鎚撾殺之斷其頭擲厠溷中民聞之無不慟哭黃中乃率其衆復讐盡殺拜珠格爾家人及臺府官員掾史獨留拜珠格爾不殺以告於張士誠乃遣其將以兵守紹興拜珠格爾尋遷行宣政院使監察御史珍通糾言拜珠格爾隂害帥臣幾致激變宜置諸嚴刑詔削其官爵安置湖州而已秋七月丁酉朔河南行省平章政事周全據懷慶路以叛附於劉福通時察罕特穆爾駐軍洛陽遣拜特穆爾以兵守碗子城周全來戰拜特穆爾為其所殺全遂盡驅懷慶民渡河入汴梁庚子廖永安敗張士誠于狼山獲其戰艦而還丁未布朗吉達以兵復般陽路已而復陷癸丑有賊兵犯京城刑部郎中巴哈守西門夜開門擊退之丙辰江南總管胡通海等襲破九華山寨時寨首鮑萬户有衆二千據險自固四面設礌石機弩兵不能進通海乃引兵潛由磴道攀援魚貫而上因風縱火燔其寨遂克之己未劉福通遣周全引兵攻洛陽守將登城以大義責全全愧謝退兵福通殺之全之攻洛陽也察罕特穆爾以竒兵出宜陽而自將精騎發新安來援會賊已退因追至虎牢塞諸險而還是月京師大水蝗民大飢是月江南行省右丞郭天爵謀害平章事覺平章殺之天爵天敘之弟也採俞本記事録八月丁卯朔江浙行省平章薩木坦巴勒討饒州貪財玩冦久而無功遂妄稱遷職福建行省至福建為亷訪簽事般若特穆爾所劾拘之興化路庚辰陳友諒兵陷建昌路辛巳義兵萬户王信以滕州叛降于毛貴己丑張士誠兵寇江隂江南守將吳良擊走之俘獲其士馬輜重江浙行省丞相達實特穆爾隂約張士誠以兵攻楊旺扎勒旺扎勒倉卒不及備遂自殺其衆皆潰旺扎勒築營德勝堰周圍三四里子女玉帛皆在焉用法深刻任意立威而鄧子文金希伊王彥良之徒又悉邪佞輕佻左右交煽丞相深惡之張士誠素欲圖旺扎勒遣其部將史文炳往杭州謁旺扎勒相見甚歡文炳大設宴盛陳烏銀器皿嵌金鐵鞍之類盡以遺旺扎勒自是約為兄弟及士誠與丞相合謀文炳率衆圍旺扎勒營旺扎勒遣吏致牲酒為可憐之意曰願少須臾無死得以底裏上露文炳報不可旺扎勒乘城拒戰十日而力盡遂悉殺所有婦女自經以死其弟巴延亦自殺唯平章慶通女以先往富陽得免文炳解衣裹旺扎勒尸瘞祭之其後追封旺扎勒潭國公諡忠愍巴延衡國公諡忠烈旺扎勒部將員成等欲為報讐遣苖軍元帥台哈巴哈奉書納欵于江南且言其部將李福等三萬餘人在桐廬皆願效順江南行省平章乃命朱文忠往撫之參用輟耕録及葉玘挽楊左丞詩序陶宗儀曰旺扎勒寵榮過望豈有二志忠君愛國之道頗亦見諸行事獨矜已犯分貪財好色生性固然君子可以略之兼以所部吏卒視旺扎勒起身等一寒微威令不信壞法敗度遂卒至於如此亦可哀已庚寅以婁達實為御史大夫詔作新風紀九月丁酉朔詔授實巴爾特穆爾同知河東宣慰司事其妻喇巴哈敦雲中郡夫人子觀音努贈同知大同路事仍旌表其門閭先是實巴爾特穆爾為趙王位下同知齊哩克口總管府事其妻嘗保育趙王及是部落摩哩叛欲殺王實巴爾特穆爾與妻謀以其子觀音努服王平日衣冠居王宫夜半夫妻衛趙王微服遁去比賊至遂殺觀音努趙王得免事聞故旌其忠焉褒封唐贈諫議大夫劉蕡為昌平文節侯關先生攻保定路不克遂陷定州掠大同興和塞外諸郡中書左丞張沖請立團練安撫勸農使司二道一奉元延安等處一鞏昌等處從之壬寅詔中書參知政事布延巴哈治書侍御史李國鳳經略江南癸卯詔以福建行省平章政事慶通為江南行臺御史大夫時行臺治紹興所轄諸道多為江南所有而明台則制於方國珍杭蘇則制於張士誠憲臺綱紀不復可振徒存空名而已丙午賊兵攻大同路壬戌平定州陷乙丑陳友諒陷贛州路江西行省參政全布延薩里及總管噶海齊死之時江西下流諸郡皆為友諒所據布延薩里乃與噶海齊戮力同守友諒遣其將圍城因使人脅之降布延薩里斬其使日擐甲登城拒之力戰凡四月兵少食盡遂自剄噶海齊守贛尤有功城陷之日賊將脅之使降噶海齊謂之曰與汝戰者我也爾毋殺吾民當速殺我遂遇害冬十月辛未考異元史順帝紀作壬申今從明太祖實録江南將胡大海取蘭溪州先是大海至婺之鄉頭擒萬户趙巴延巴哈等平其五壘是日進攻蘭溪官軍千人出戰敗之克其城亷訪使趙秉仁等被執獲馬牛羊萬頭立寧越翼元帥府分兵守其要害遂進攻婺州路甲戌江南將徐達邵榮克宜興先是逹等攻宜興久不下平章遣使謂達等曰宜興城小而堅猝未易拔聞其城西通太湖口張士誠餉道所由出若以兵斷其餉道彼軍食內乏城必破矣達等乃分兵絶太湖口而併力急攻遂拔其城同知樞密院事廖永安復率舟師擊士誠于太湖乘勝深入遇吕珍戰敗遂為所獲士誠欲降之不屈壬午監察御史揚齊巴哈劾中書右丞相綽斯戬任用私人圖烈及妾弟崔旺扎勒特穆爾印造偽鈔事將敗令圖烈自殺以滅口綽斯戬乃請解機務詔止收其印綬乙酉監察御史達實瑪實哩王彛等復劾之請正其罪帝終不聽也壬辰大同路陷達嚕噶齊旺扎勒特穆爾棄城遁是月博囉特穆爾統領諸軍克復曹州十一月卒丑江南行省立管領民兵萬户府平章謂同省諸臣曰古者寓兵於農有事則戰無事則耕暇則講武今兵爭之際當因時制宜所定郡縣民間武勇之材宜精加簡拔編緝為伍立民兵萬户府領之俾農時則耕間則練習有事則用之事平有功者一體升擢無功者還為民如此則民無坐食之弊國無不練之兵以戰則勝以守則固庶幾寓兵於農之意也癸卯陳友諒陷汀州路丁卯田豐陷順德路先是樞密院判官劉起祖守順德糧絶劫民財掠牛馬民強壯者令充軍弱者殺而食之至是城陷起祖遂盡驅其民走入廣平甲子江南行省平章以胡大海兵攻婺州不克乃自將親軍副都指揮使楊璟等師十萬往取之十二月乙丑朔日有食之癸酉關先生破頭潘沙劉二等由大同直犯上都焚毁宫闕留七月乃轉略遼陽甲申江南兵取婺州路達嚕噶齊僧珠浙東亷訪使楊惠死之先是江南平章出師至徽州召儒士唐仲實問漢髙帝光武唐太宗宋太祖元世祖平一天下其道何由對曰此數君者皆以不嗜殺人故能定天下於一公英明神武驅除禍亂未嘗妄殺然以今日觀之民雖得所歸而未遂生息平章曰此言是也我積少而費多取給於民甚非得已然皆為軍需所用未嘗以一毫奉已民之勞苦恆思所以休息之曷嘗忘也又聞前學士朱升名召問之對曰髙築牆廣積糧緩稱王平章恱命參帷幄師進至德興聞張士誠兵據紹興諸暨乃取道蘭溪以至婺州遣使入城招諭不下遂圍之初江浙丞相達實特穆爾承制授浙東宣慰副使舒穆嚕宜孫以行樞密院判官分治處州又以前江浙儒學副提舉劉基為其院經厯蕭山縣尹蘇友龍為照磨而宜孫又自辟郡人胡深葉琛章溢參謀其軍事處為郡山谷聫絡盜賊憑險竊發不易平治宜孫用基等謀或搗以兵或誘以計皆殱殄無遺類尋升同簽行樞密院事至是聞江南兵抵蘭溪且逼婺而宜孫弟厚孫方守婺其母亦在城中宜孫泣曰義莫重於君親食祿而不事其事是無君也母在難而不赴是無親也無君無親尚可立天地間哉即遣胡深等將民兵數萬往赴援而親率精鋭為之殿深等至松溪觀望不敢進江南平章謂諸將曰婺倚舒穆嚕宜孫故未肯即下聞彼以獅子戰車載兵來援此豈知變者松溪山多路險車不可行今以精兵遏之其勢必破援兵既破則城中絶望可不勞而下矣翌日簽院胡大海養子德濟誘其兵于梅花門外縱擊大敗之深等遁去城中勢益孤臺憲將臣畫界分守意復不相能於是同簽樞密院寧安慶與都事李相開門納敵楊惠僧珠皆戰死南臺御史特穆爾色埒院判舒穆嚕厚孫等皆被執平章入城下令禁戢軍士剽掠民皆安堵改婺州為寧越府置中書分省召儒士許元葉瓚胡翰汪仲山等十餘人皆會食省中日令二人進講敷陳治道以王宗顯知寧越府宗顯和州人少攻儒業博涉經史於是命宗顯開郡學延宿儒葉儀宋濓為五經師戴良為學正吳沉徐厚為訓導時喪亂之餘學校久廢至是始聞絃誦聲無不欣恱是月太白經天者再江南平章發倉賑寧越貧民有女子曾氏自言能通天文誑説災異惑衆平章以為亂民命戮于市是嵗河南賊蔓延河北前江西亷訪簽事巴延家居濮陽言於省臣將結其鄉民為什伍以自保而賊已大至巴延乃渡漳北行鄉人從之者數十萬家至磁州與賊遇賊知巴延名士生劫之以見其帥帥誘以富貴巴延罵不屈引頸受刃與妻子俱死之有司上其事贈簽太常禮儀院事太常上諡議曰以城守論之巴延無城守之責而死可與江州守李黼一律以風紀論之巴延無在官之責而死可與西臺御史張桓並駕以平生有用之學成臨義不奪之節乃古之所謂君子人者請諡曰文節從之江西諸郡皆陷撫州路總管吳當乃戴黃冠著道士服杜門不出日以著書為事陳友諒遣人辟之當卧牀不食以死自誓乃舁牀載之舟送江州拘留一年終不為屈遂隱居吉水縣之谷坪踰年以疾卒京師大飢疫而河南北山東郡縣皆被兵各挈其老幼男女避居京師以故死者相枕藉資正院使保布哈請於帝市地收瘞之帝及皇后皇太子省院諸臣施捨無算而保布哈亦自出財賄珍寶以佐其費擇地自南北兩城抵盧溝橋掘深及泉男女異壙人以一尸至者隨給以鈔舁負相踵至二十年四月前後瘞者二十萬用鈔二萬七千九十餘錠凡居民病者豫之藥不能喪者給之棺翰林學士承旨張翥為文頌其事曰善惠之碑保布哈髙麗人亦曰王巴哈皇后竒氏微時與巴哈同鄉里相為依倚及貴巴哈以閹人入事后纍遷為資正院使后益愛幸之至是欲要譽干權故有斯舉帝嘗為近幸臣建宅親畫屋樣又自削木構宫髙尺餘棟梁楹檻宛轉皆具付匠者按此式為之京師遂稱魯般天子內侍利其金珠之飾告帝曰此屋比某家殊陋劣帝輒命易之內侍因刮金珠而去竒后見帝造作不已嘗挽上衣諫曰使長年已大子年已長宜稍息造作且諸夫人事上足矣無惑於天魔舞女輩自愛惜聖躬也帝艴然怒曰古今只我一人耶由此兩月不到后宫后亦多畜髙麗美人大臣有權者輒以此遺之京師達官貴人必得髙麗女然後為名家髙麗女婉媚善事人至則多奪寵自至正以來宫中給事使令大半為髙麗女以故四方衣服鞾帽器物皆依髙麗樣子一時風氣舉世若狂據庚申外史修入資治通鑑後編卷一百七十八
