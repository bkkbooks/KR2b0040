body:
  text: 資治通鑑後編編年類提要臣等謹按資治通鑑後編一百八十四卷國朝徐乾學撰乾學有讀禮通考已著録是編以元明人續通鑑者陳桱王宗沐諸本大都年月参差事跡脱落薛應旂所輯雖稍見詳偹而如改宋史周義成軍為周義以胡瑗為朱子門人疎謬殊甚皆不足繼司馬光之後乃與鄞縣萬斯同太原閻若璩徳清胡渭等排比正史叅考諸書作為是編草創甫畢欲進於朝未果而没今原稿僅存惟闕第十一卷書中多塗乙刪改之處相𫝊猶若璩手蹟也其書起宋太祖建隆元年迄順帝至正二十七年凡事蹟之詳畧先後有應叅訂者皆依司馬光例作考異以折衷之其諸家議論足資闡發者並採系各條之下間附已意亦依光書之例標臣乾學曰以别之其時永樂大典尚庋蔵秘府故熊克李心𫝊諸書皆未得窺所輯北宋事迹大都以李燾殘帙為稿本援㨿不能賅博其宋自嘉定以後元自至順以前尤為簡畧至宋末昰昺二王皆誤沿舊史系年紀號尤于斷限有乖又意求博贍頗少翦裁如西夏姻戚之盛備叙世系慶元偽學之禁詳載謝表元末事蹟多採輟耕録鐵崖樂府叙書藝則稱其日寫三萬字紀隠居則述其懐抱幾時開無闗勸懲徒傷煩冗又載元順帝初生之事過信庚申外史尤渉鑿空然其裒輯審勘用力頗深故訂誤補遺時有前人所未及如宋史富弼𫝊以樞宻使出判揚州今㨿宰輔編年録改作河陽余介𫝊淳祐十三年及元人戰于嘉定今據家傳改作十二年元末㓂䧟淮安本紀首尾不具今從王逢梧溪集定作趙國用至正十六年張士誠䧟湖州本紀作二月今從明實録作四月皆按文覈實信而有徴又是時乾學方領一統志局多見宋元以来郡縣舊志而若璩諸人復長于地理之學故所載輿地尤為精核如宋王堅之守合州則采四川總志牟子才之諫張燈則采西湖遊覧志而明人紀事之書若劉辰國初事跡呉寛平吴録之類亦並從附載以資考證年經月緯犂然可觀雖不能遽稱定本而以視陳王薛三書則過之逺矣乾隆四十六年十月恭校上總纂官臣紀昀臣陸錫熊臣孫士毅總校官臣陸費墀總校官臣陸費墀
